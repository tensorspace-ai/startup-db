<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">TensorSpace Startup DB</title>
  <desc id="desc">A simple navy banner with TensorSpace's single T_ mark, the Startup DB title, and a short description.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#050a1c"/><stop offset="1" stop-color="#0d193e"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#467cff" stop-opacity=".22"/><stop offset="1" stop-color="#467cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="headline"><stop stop-color="#fff"/><stop offset="1" stop-color="#a7c6ff"/></linearGradient>
    <linearGradient id="mark" x2="1" y2="1"><stop stop-color="#1746d1"/><stop offset="1" stop-color="#0d2b83"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#background)"/>
  <ellipse cx="1020" cy="170" rx="420" ry="300" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#9cc6ff" stroke-opacity=".18"/>
  <rect x="56" y="40" width="48" height="44" rx="10" fill="url(#mark)"/>
  <text x="80" y="69" text-anchor="middle" font-family="monospace" font-size="26" fill="#fff">T_</text>
  <text x="120" y="69" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#dbeaff">TensorSpace</text>
  <text x="56" y="193" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#headline)">Startup DB</text>
  <text x="58" y="244" font-family="Inter, Arial, sans-serif" font-size="24" fill="#b8d0ee">Evidence-linked startup data and research agents.</text>
</svg>
