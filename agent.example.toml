# Copy to ignored agent.toml for private customization. No credentials go here.
[agent]
provider = "codex"
directory = "data/startups"
state_dir = ".agent-runs"
focus = "Israeli or Israeli-founded technology startups with public evidence"
min_sources = 4
min_words = 900
limit = 1
timeout = 900
max_attempts = 3
max_rate_limit_retries = 3
jobs = 1
