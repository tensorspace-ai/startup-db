  "funding: no company-announced lifetime raised total found. Finder's USD 6.94 million total and older assistance entries are not primary-verified and are excluded from reported totals.",
  "dual_use: no defense, military, security or government use or customer disclosed; civilian IVF diagnostics is the documented scope.",
  "regulatory: no current CE certificate, declaration of conformity, intended-use statement or device registration was located; CORDIS describes regulatory approval as project work."
