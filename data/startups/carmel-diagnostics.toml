name = "Carmel Diagnostics"

description = "Carmel Diagnostics Ltd. is an Israeli private medical-device company developing Fertissimo, a thermochemiluminescence analyzer intended to assess IVF embryos from spent culture medium as an adjunct to established selection methods."

detailed_description = """Carmel Diagnostics Ltd. is a Kiryat Tivon, Israel-based private medical-device company founded in 2009 around thermochemiluminescence (TCL), a method for measuring light emitted as a heated biological sample oxidizes. The Israel Innovation Authority's 2018 company catalogue says founder Tzali Cnaani formed Carmel following a management buyout of Lumitest intellectual and tangible assets. The lead application is Fertissimo, a benchtop analyzer intended to help IVF embryologists rank embryos using a biochemical signal from spent culture medium. The company remains listed as active in a registry aggregator that reports a 2026 annual filing, but that legal status does not establish ongoing product sales or clinical deployment.

The proposed workflow is specific: Carmel says staff remove 15 microliters of medium from an embryo culture well, spread and vacuum-dry it on a cuvette, heat it, and measure emitted photons over 300 seconds. Its product page describes roughly eight minutes per embryo and positions the test as non-invasive because the embryo itself is not sampled. The device therefore measures an indirect property of the embryo's environment, rather than embryo morphology, chromosomes, or a direct viability endpoint. Calibration across culture media, incubator conditions, sample timing, handling and clinics is central to whether a TCL score can be compared meaningfully. Public sources reviewed do not disclose an independently validated algorithm, locked clinical cut-off, inter-laboratory reproducibility, or a current intended-use statement.

Evidence is mixed and must be separated by study design and sample compartment. Carmel's data page reproduces the abstract of a 2010 prospective laboratory study in which 10 microliters of culture medium were tested for 284 transferred embryos across 133 IVF treatment cycles. The abstract reports an association between a cohort's highest TCL H1 value and pregnancy for a subgroup of transfers after 72 hours; the reported positive predictive value applied to a particular combination of thresholds, not to all embryos or all IVF cycles. The European Commission's Fertissimo project record says a later IVI Valencia pilot also found an association between oxidative status and implantation chances, while the project objective was further retrospective and prospective validation. Carmel's website separately claims a 2016 pilot of 76 embryos, a retrospective cohort of 732 embryos, and a 15 percent or greater outcome improvement. Those latter figures remain company assertions: the full protocols, denominator choices, confidence intervals, outcomes beyond pregnancy, and independent replication were not located.

A July 2026 Human Reproduction abstract adds a significant external validation warning. In a prospective, blinded, single-center cohort of 185 IVF cycles, the authors measured TCL parameters in cumulus-oocyte-complex fertilization medium before sperm addition; they found no independent association with fertilization or clinical pregnancy and reported pregnancy-prediction AUCs of 0.53 to 0.56. That study did not evaluate Fertissimo's exact post-culture spent-medium workflow, so it does not directly disprove the product's proposed signal. It does show that TCL-derived oxidative measures are not automatically predictive across IVF sample types and endpoints. Carmel would need to show a well-powered, preregistered, multicenter validation using the exact intended sample, workflow and patient population, with blinded selection and live-birth follow-up, before its advertised improvement should inform underwriting.

The development timeline is long relative to the publicly evidenced commercial stage. Carmel's 2018 Innovation Authority profile classified it as in clinical validation, reported three employees at that time, described a business model based on device and test-cycle sales, and said regulatory submission and strategic commercialization partners were still being pursued. The EU Horizon 2020 Fertissimo project ran from May 2017 through April 2020. CORDIS records preparation for serial manufacturing and regulatory approval as project work, not proof that either was completed. The company website remains accessible and describes the analyzer, but it carries a 2018 copyright footer. No dated clinic installation, paid assay volume, distributor, contract, current certificate, current device registration, or commercial revenue disclosure was found. Accordingly, the product is best assessed as historically clinically investigated with present commercial and regulatory status unverified.

The business model could combine a capital sale or placement of analyzers with per-cycle consumables or tests, an approach described in the 2018 Israeli company catalogue. This may support repeat revenue if the analyzer is adopted, but creates a two-sided adoption burden: a clinic must validate the test and alter lab workflow, while Carmel must sustain instrument service, quality systems, supply and training. IVF physicians and embryologists already use morphology and, in some clinics, time-lapse imaging or genetic testing. Vitrolife's EmbryoScope and iDAScore provide a visible example of an established imaging and decision-support pathway; PGT-A providers supply a different, invasive genomic signal. Fertissimo's potential distinction is biochemical measurement without embryo biopsy, but no head-to-head study establishes incremental decision value, reduced time-to-pregnancy, higher cumulative live birth, or economic savings versus those alternatives. Its test also adds sample transfer and handling, so non-invasive to the embryo does not mean frictionless for the lab.

Financing evidence is incomplete. CORDIS reports a €1,446,486 net EU contribution to Carmel for the 2017-2020 project; the full €2,711,973.50 EU contribution applied to the consortium, including a separate ARAN R&D allocation, and must not be attributed to Carmel alone. IVC records a June 2014 Merck Serono Grant for Fertility Innovation award with IVI Valencia, but no amount is displayed there. Startup Nation Finder lists a September 2023 $3 million Seed round and $6.94 million lifetime total; IVC also lists a September 2023 Seed entry but masks its financial fields and investor identity. No primary company or investor financing announcement was found, and the nearby FemTech Lab cohort announcement documents accelerator participation rather than a cash investment. The $3 million figure and lifetime total should therefore remain secondary-database reports, not company-confirmed proceeds. No public valuation, current cap table, or verified named equity investor was identified.

The people record is similarly historical rather than a current operating-team roster. Cnaani is identified by the Innovation Authority and the 2020 CORDIS result as founder and project coordinator/CEO; a 2019 profile reports earlier leadership at Lumitest and Afimilk and a physics degree from the Technion. Sergei Shnizer is described in a 2019 profile and IVC as co-founder and technical lead, and is a co-author on the 2026 TCL IVF study. IVC separately labels Bezalel Cnaani CEO and co-founder, while the 2018 catalogue and 2019 profile identify Tzali Cnaani as founder/CEO; CheckID lists Bezalel Cnaani as director and shareholder in a snapshot dated 2020. These records may refer to different historical roles, but the discrepancy and the blank management section on Carmel's current website leave present executive responsibility unclear. Current headcount, clinical leadership, manufacturing capacity and ownership percentages are undisclosed.

The IP story has both legacy and newer components. The 2018 Israeli catalogue claimed issued method/device patents in multiple jurisdictions but gave no publication numbers or remaining term. A published 2019 PCT application assigned to Carmel, WO2019186547A1, concerns isolating and storing follicular content and associating follicular fluid with an oocyte; it is adjacent IVF workflow IP, not by itself proof of enforceable protection for the Fertissimo TCL assay. The accessible index reproduces the filing and names Carmel as assignee, but its listed legal-status fields are not an official legal opinion and national-phase status was not verified in patent-office registers. Patent numbers, active claims, ownership chain, prosecution outcomes, expiry dates and freedom to operate should be confirmed directly.

Commercial diligence should prioritize the exact intended-use clinical protocol, complete raw and analyzed study datasets, prospective multicenter performance, live-birth and cumulative-cycle outcomes, and independent statistical review. The company should also provide current regulatory certificates and device registrations, manufacturing and quality-system records, installed-base and paid-test evidence, pricing and unit economics, founder and executive roles, audited financials, the current cap table, and a patent schedule with official register extracts. The defensible strategic case is a potentially useful civilian IVF adjunct if it produces reproducible incremental information at acceptable workflow cost. No public defense, military, security or government customer application was identified, and generic health-system resilience does not establish a defense dual-use case."""

