  "Carmel claims a 15 percent or greater IVF outcome improvement from company-reported cohorts. The July 2026 prospective study measured TCL in a different IVF medium and found no independent association and poor discrimination; because the sample compartment and timing differ, this is a material validation warning rather than a direct test of Fertissimo's exact workflow.",
