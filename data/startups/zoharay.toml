name = "Zoharay"
description = "Zoharay is an Israeli photonics startup developing LightBridge, a contactless expanded-beam optical-fiber connector for network infrastructure, edge computing, and harsh environments. Its wafer-level optical insert is designed to reduce cleaning and alignment sensitivity while preserving high-density multimode and single-mode fiber connectivity across demanding temperature and wavelength ranges."
detailed_description = """
**Product and the concrete problem it solves.** Zoharay is addressing a deceptively practical bottleneck in optical networking: conventional physical-contact fiber connectors require the polished end faces of mating fibers to remain clean, precisely aligned, and mechanically stable. Dust, repeated mating cycles, vibration, thermal expansion, and small lateral or angular errors can increase insertion loss or cause intermittent links. That problem matters in ordinary data and telecom installations, but it becomes more severe in edge-computing cabinets, industrial equipment, transport systems, outdoor communications, and other places where technicians cannot easily clean or realign every connection. Zoharay's LightBridge proposition is a contactless expanded-beam connector. Rather than bringing fiber cores into direct contact, it expands, collimates, and refocuses the optical beam across the mating interface. The objective is to relax contamination and alignment requirements without giving up the density and familiar mechanical ecosystem that customers already use. The company presents a Harsh series for multimode fiber and 850 nm to 1550 nm operation, with products available as optical chips for MPO/MT ferrules or as assemblies mounted on those ferrules. This is a component-level intervention with system-level consequences: a more tolerant connector can lower maintenance burden, reduce link failures, and make optical connectivity more deployable in places where service access is expensive or operationally risky.

**Core technology and how it actually works.** The technical foundation is a patent-pending, integrated, wafer-level photonics approach to expanded-beam coupling. CSEM's technical description identifies a connector architecture built around a standard MT/MPO multifiber ferrule, an optical insert containing microlens arrays, and a mating interface that maintains repeatable alignment. In the insert, paired polymer microlenses expand and collimate the beam from one fiber array and refocus it into the mating array. The larger beam is less sensitive to a small dust particle or lateral displacement than a direct fiber-to-fiber interface. The important engineering challenge is that polymer optics can be inexpensive and scalable but may exhibit temperature-dependent refractive and mechanical behavior. Zoharay's approach uses microlens doublets with matched thermo-optic and thermo-mechanical properties, intended to compensate those effects. CSEM reports optical simulations with a numerical aperture of approximately 0.22 and coupling-loss sensitivity below 0.3 dB for lateral misalignment of plus or minus 5 micrometers in the described design. Zoharay's own site lists preliminary, simulation-based targets including insertion loss below 0.7 dB, return loss above 55 dB for APC, athermal operation from -40 to +150 degrees Celsius, and parallel connectivity from 12 to as many as 96 fibers. Those figures are useful indicators of the design target, not independent production qualification. The use of standard ferrule geometry and wafer-level fabrication is strategically important because it could let the product fit established datacom assembly processes instead of requiring customers to rebuild their complete optical infrastructure.

**Market, customers, and go-to-market.** Zoharay is pursuing a B2B component and subsystem market spanning network infrastructure, edge computing, and harsh-environment optical links. Its likely economic buyers are optical-module manufacturers, connector and cable assemblers, datacom equipment vendors, industrial-system integrators, and operators that need dense links with less cleaning and lower service exposure. The company identifies Germany, Switzerland, Finland, and Israel as target geographies in its Startup Nation Finder profile, which is consistent with an initial European and Israeli business-development path rather than a mass-market consumer strategy. The go-to-market appears to combine standard-compatible components with joint development: the official site invites collaboration, joint projects, beta sites, and custom applications, while the CSEM record names collaboration with CSEM, Finland's VTT, and TH-Wildau. That model can help a small photonics company validate packaging, materials, and environmental performance with technically sophisticated partners before selling through established connector channels. It also creates a demanding sales process. A connector is rarely selected on a single laboratory metric; customers will evaluate mating-cycle life, cleaning tolerance, vibration, shock, humidity, contamination, thermal cycling, optical budget, connectorization yield, field-replacement procedures, and compatibility with their existing MPO/MT tooling. The first samples were announced for around the second quarter of 2026, and the website describes beta-site and custom-application opportunities, suggesting that the immediate commercial objective is qualification and design-in rather than broad catalog revenue.

**Traction, funding, and third-party validation.** The public evidence places Zoharay at an early but unusually concrete stage for a small photonics company. The Startup Nation Finder profile identifies Zoharay as founded in January 2023 by Bruno Sfez, with one to ten employees, a beta product stage, and a March 2026 seed round led by Jumpspeed Ventures; the amount is undisclosed. Jumpspeed's public investor portfolio also lists Zoharay as a 2026 seed investment. The Israeli Companies Registrar mirror identifies Zoharay Ltd. as an active Israeli private company incorporated on 3 January 2023 at an address in Jerusalem and names Bruno Sfez as director and shareholder. The independent CSEM technical record is the strongest technical validation signal: it does not merely repeat marketing language, but describes the connector's optical architecture, material-compensation rationale, standard ferrule interface, and simulated tolerance. It also establishes that Zoharay's work has involved recognized applied-photonics organizations including CSEM, VTT, and TH-Wildau. At the same time, the record should not overstate maturity. Public sources do not disclose seed amount, revenue, production volume, named paying customers, completed qualification reports, issued patents, or a production manufacturing agreement. The official site itself labels key specifications as preliminary and simulation-based. The positive interpretation is that Zoharay has progressed from an idea to a named architecture, a partner-supported development program, a product family, and samples or beta engagement. The diligence interpretation is that the commercial proof points still need to be converted into measured, customer-accepted performance.

**Founders and team background.** Zoharay's publicly identified founder is Bruno Sfez, who is also listed as the company's director and shareholder in the Israeli company record. A public research profile for Bruno Sfez associates him with photonic-device research at Soreq Nuclear Research Center and describes work on planar photonic devices for high-power applications and fiber-optic resonator structures. That background is directionally relevant to the company's optical-engineering problem, although the public record does not provide a complete employment chronology, a full executive roster, or enough information to attribute every technical contribution to the startup team. The small team size reported by Startup Nation Finder is consistent with an IP-led deep-tech venture that relies on external fabrication, research, and validation partners. The CSEM collaboration is particularly important in this context because the value proposition spans several disciplines: optical design, polymer and microlens materials, wafer-level microfabrication, precision bonding, ferrule mechanics, environmental characterization, and datacom assembly. A diligence review should therefore map which capabilities are owned internally and which are supplied by partners, and should test whether the company can retain process knowledge and quality control as it moves from a demonstrator to repeatable production. The founder's photonics research connection is a useful credibility signal, but it is not a substitute for evidence of manufacturing leadership, connector-industry channel access, certification ownership, and customer-support capacity. The current public evidence supports a technically serious founder-led startup, while leaving team depth as a material open question.

**Competitive dynamics and edge.** Zoharay competes against several classes of solution rather than one direct rival. TE Connectivity, Amphenol, US Conec, and Senko supply large portfolios of conventional MPO/MT and expanded-beam connectivity, giving them manufacturing scale, qualification history, distribution, and customer relationships. Glenair and Radiall compete in ruggedized aerospace and defense connectors where environmental robustness and program certification can outweigh unit cost. Optical transceiver and interconnect vendors can also address the same reliability problem through sealed modules, protective shutters, redundant links, or more frequent maintenance. Zoharay's proposed edge is the combination of expanded-beam tolerance with a compact, wafer-level optical insert that uses standard multifiber ferrule geometry. In the company's framing, this could address several historic weaknesses of expanded-beam connectors at once: bulkier optics, thermal sensitivity, cost, limited scalability, and poor fit with high-density datacom assembly. CSEM's description gives the edge technical substance by identifying thermo-compensated polymer microlens doublets, not just an assertion of contactless operation. The key numbered competitive questions are: (1) whether the optical-loss and misalignment performance survives contamination, vibration, repeated mating, and temperature cycling; (2) whether wafer-level fabrication produces consistent yields and low enough cost; (3) whether the design can be qualified through existing MPO/MT customer processes; and (4) whether Zoharay's patent-pending claims create durable protection against larger connector manufacturers. If those tests pass, the company could offer a differentiated enabling component. If they do not, incumbents can bundle ruggedization, service, and certification more easily than a small startup.

**Defense, security, and resilience dual-use relevance.** Zoharay is not publicly presented as a defense contractor, and the sources reviewed do not establish military procurement or fielded defense deployments. Its dual-use relevance is nevertheless credible because the core connector addresses physical-layer reliability in both commercial and strategic environments. Defense vehicles, deployable command posts, sensor systems, secure communications nodes, naval and airborne equipment, and protected facilities often need dense optical links that tolerate vibration, dust, thermal excursions, and limited maintenance access. Contactless expanded-beam coupling can also reduce the operational consequence of particulate contamination during rapid installation or repair. The same logic applies to resilience use cases such as emergency communications, utility control rooms, railway and tunnel infrastructure, remote industrial sites, subsea or near-shore equipment, and edge-compute nodes supporting public-safety operations. Optical fiber itself offers low electromagnetic susceptibility and high bandwidth, but the connector remains a mechanical and maintenance failure point; improving that interface can strengthen overall link availability without changing the network protocol. The appropriate strategic assessment is therefore enabling rather than mission-specific. Zoharay could become a component supplier into defense and critical-infrastructure programs if it can meet the relevant shock, vibration, environmental, security-of-supply, and qualification requirements. There is no public evidence yet of those certifications or contracts. The most important strategic diligence items are domestic and allied manufacturing control, export-control posture, environmental qualification data, mean time between failures, mating-cycle life, repair procedures, and whether the company can support low-volume customized programs alongside commercial scale.

**Growth stage, trajectory, and key diligence risks.** Zoharay should be classified as early stage: it was incorporated in 2023, remains a one-to-ten-person company, has a beta-stage product profile, and announced an undisclosed seed investment in 2026. Its trajectory depends on converting a technically differentiated connector concept into a qualified and manufacturable component. The opportunity is attractive because optical connectivity is a recurring constraint in AI infrastructure, edge computing, industrial networking, and rugged systems, and because the value of lower cleaning and alignment sensitivity compounds when a customer operates thousands of links or cannot easily dispatch technicians. The principal diligence risks are (1) **qualification risk**, because simulated specifications may not predict contamination, vibration, thermal-cycle, and aging behavior; (2) **manufacturing risk**, because wafer-level microlens processing, bonding, ferrule assembly, and inspection must achieve both optical yield and field reliability; (3) **market-adoption risk**, because connector standards and incumbent supply relationships are sticky; (4) **capital risk**, because the disclosed seed amount is unknown and hardware qualification can require more working capital than a software startup; (5) **team-concentration risk**, because the public record identifies one founder and a very small company; and (6) **IP and channel risk**, because patent-pending status and partner-dependent development leave freedom-to-operate, ownership, and distribution questions open. The bull case is a standards-compatible photonic interface that removes a maintenance problem from harsh, dense networks. The bear case is a promising laboratory design that cannot beat established ruggedized connectors on total cost, qualification time, or customer confidence.
"""
