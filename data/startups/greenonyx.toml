name = "GreenOnyx"
description = "GreenOnyx is an Israeli food and agricultural-technology company developing QFarming, a modular, autonomous, sterile indoor-growing system for freshwater lentils (Wolffia), marketed as Wanna Greens. Its strategic relevance is food-system resilience: the company aims to produce nutrient-dense fresh greens locally with limited land, water, transport, and contamination exposure."
detailed_description = """
**Product and the concrete problem it solves.** GreenOnyx is addressing a food-supply problem that becomes acute when climate, water scarcity, contamination, conflict, or transport disruption makes conventional fresh-produce logistics unreliable. Its lead crop is Wolffia, a floating freshwater plant commonly described as the world's smallest flowering plant, which GreenOnyx markets as Wanna Greens. The company says the product is highly nutritious, easy to use, and can move from seed to packaged food through a controlled growing system. Its product is not simply a packaged leafy green: the company is building QFarming, a modular farm architecture intended to bring production close to urban consumers, food-service kitchens, and other points of demand. The rationale is specific. A fresh product grown near the buyer can reduce harvest-to-consumption time, shorten a refrigerated supply chain, reduce dependence on arable land, and improve traceability. GreenOnyx's public materials also emphasize that the plant is fully edible and can be consumed without the cutting and washing steps associated with many leafy vegetables. Those benefits are company-positioned rather than a substitute for independent nutritional, shelf-life, or food-safety testing, but they give the company a coherent wedge: a differentiated crop paired with infrastructure designed for local, reliable production.

**Core technology and how it actually works.** QFarming is described by GreenOnyx as a patented, sterile, closed growing process built from small modular units. The official product page describes units of roughly 4.5 square meters that can operate independently, be combined into larger installations, and run automated growth cycles without direct human intervention. Within the system, sensors continuously observe growing conditions and a cloud-connected control layer uses AI, large data sets, and proprietary algorithms for monitoring, traceability, and feedback control. GreenOnyx says the system can detect contamination, adjust the growing environment, recycle water, and produce plants from seed through packaging in a sealed workflow. It also describes a bio-mimetic approach that attempts to reproduce the environmental conditions under which the crop grows best rather than modifying the plant genetically. These are important architecture claims, but public sources do not disclose the sensor bill of materials, control-loop frequency, energy consumption per kilogram, lighting configuration, microbial test protocol, software deployment model, or independent yield data. GreenOnyx also advertises very high productivity per square meter, minimal waste, and renewable-energy compatibility; those claims should be treated as company-reported targets until validated across multiple operating sites. The technical thesis is nevertheless concrete: controlled biology, sterile handling, modular hardware, and data-driven environmental control are combined to turn an unusual aquatic crop into a repeatable food-production process.

**Market, customers, and go-to-market.** GreenOnyx is pursuing several connected markets rather than relying on a single retail product. The Israel Innovation Authority identifies food-service and chilled consumer-packaged-goods companies as target customers, while the company presents QFarming as infrastructure for local food production and its Wanna Greens crop as the first commercial application. Earlier public reporting said the greens were sold to Michelin-starred restaurants in Europe, that GreenOnyx had signed agreements with Israeli food companies, and that Tnuva was involved in distribution of the product with special milk products. A 2022 financing report also described a planned growing farm and collaboration with Kibbutz Magal, which would provide a route from pilot production to a larger agricultural operation. The most plausible commercial sequence is to win premium food-service users who value freshness and novelty, establish repeat demand for the packaged crop, and then sell or operate modular units for larger chilled-CPG and local-production channels. QFarming's compact footprint also creates a possible real-estate strategy: the company says units can be installed in existing buildings rather than requiring new farmland. Public sources do not establish current revenue, customer retention, active unit count, signed current purchase orders, or the economics of selling hardware versus operating farms. Those unknowns matter because the company must prove that a novel crop can earn repeat purchases and that the farm system produces acceptable margins after energy, labor, maintenance, packaging, distribution, and quality-control costs.

**Traction, funding, and third-party validation.** GreenOnyx has a longer operating history than a typical stealth food-tech entrant. The Israel Innovation Authority records the company as established in 2013, lists Tsipi Shoham as CEO and co-founder, reports 50 employees, and classifies it in agritech, foodtech, hydroponics, vertical farming, nutrition, space technology, and related categories. Startup Nation Finder records earlier financing including a reported $18 million Series A in July 2022 led by Granot Ventures, plus additional earlier rounds; contemporaneous Calcalist coverage described the same $18 million strategic raise and a valuation reported in the $70 million to $80 million range, while noting that the company had not yet generated revenue at that point. The historical commercial evidence includes restaurant sales, food-company agreements, and planned farm development, but the public record does not provide audited sales or a current revenue figure. More recent validation is ecosystem and product based: GreenOnyx says QFarming was selected as Vertical Farming Company of the Year in the 2025 AgTech Breakthrough Awards, and its current site continues to present QFarming as an active platform rather than a discontinued concept. The award is recognition, not proof of unit economics or food-safety performance. The diligence conclusion is therefore balanced: GreenOnyx is an established, financed, still-active Israeli venture with a real product and ecosystem footprint, but current scale, profitability, repeat deployments, and commercial throughput remain unverified.

**Founders and team background.** The public record identifies Dr. Tsipi Shoham as GreenOnyx's co-founder and CEO and Benny Shoham as a co-founder; the Innovation Authority also lists Dvir Gerstein as VP of Finance and provides the 50-person company-size signal. Current company material presents GreenOnyx as a team that has spent roughly a decade developing its crop and controlled-production approach. The company appears to combine plant biology, food product development, indoor agriculture, automation, and commercial operations, which is the right cross-functional shape for a business whose risks sit at the boundary between a biological product and a capital-intensive production system. The visible founder narrative is not as fully documented as the product narrative: public sources do not provide complete biographies for every executive, detailed scientific credentials for the whole R&D group, or a current engineering and operations breakdown. That is important because a QFarming deployment requires more than a crop discovery. The company needs people who can maintain sterile production, calibrate sensors, control pests and microbial risk without conventional pesticides, manage food-grade packaging, design reliable hardware, and sell into food-service and chilled-CPG procurement. A 50-person team is meaningful for an agricultural startup, but it may still be small relative to the need to operate farms, support customers, handle regulatory work, and expand internationally. The strongest team signal is sustained execution over more than a decade; the key gap is limited public evidence about the current depth of manufacturing, quality, and commercial leadership.

**Competitive dynamics.** GreenOnyx competes in both controlled-environment agriculture and the broader market for fresh greens and functional food ingredients. Plenty, AeroFarms, Bowery Farming, and Infarm represent indoor-farming approaches built around other crops, automation, and proximity to consumers; they compete for the same real estate, food-service relationships, and infrastructure capital. Local and regional hydroponic growers can offer familiar lettuces and herbs with simpler consumer education, while traditional field agriculture remains a powerful substitute wherever land, water, labor, and logistics are affordable. On the crop side, duckweed and plant-protein companies such as Plantible Foods compete for attention around aquatic biomass, nutrition, and alternative ingredients, although their products and processing models are not identical to GreenOnyx's fresh-greens proposition. GreenOnyx's possible edge is the combination of an unusual, fast-growing crop, sterile end-to-end handling, a modular unit that can fit into existing buildings, and a control system intended to make small farms repeatable rather than artisanal. That edge is not yet a proven moat. Competitors can grow different crops in similar environments, food brands can choose cheaper conventional greens, and vertical-farm economics have repeatedly been pressured by electricity, labor, maintenance, and distribution costs. GreenOnyx must show that QFarming produces a materially better combination of shelf life, nutrition, contamination control, water use, energy intensity, and gross margin than both indoor-farm alternatives and ordinary fresh-produce supply chains.

**Defense, security, and resilience relevance.** GreenOnyx should be treated as a food-security and resilience company, not as a defense contractor. Its dual-use case comes from the underlying production architecture: compact, sealed, automated farms could provide fresh food near hospitals, emergency shelters, remote communities, military bases, or other sites where long supply chains are exposed to disruption. The relevance is especially credible for Israel because local food availability depends on imported inputs and vulnerable transport routes, while water and arable land are constrained. A modular system that can operate in an existing building, use recycled water, avoid pesticides and antibiotics, and reduce time between production and consumption could diversify national food capacity and make a portion of fresh nutrition less dependent on uninterrupted cross-border logistics. GreenOnyx also markets future applications in space cultivation and molecular farming, which indicate a broader controlled-biology ambition, but they are not evidence of space or defense deployment. No public source reviewed here establishes an IDF customer, government food-reserve program, military ration contract, classified work, or field installation in a crisis zone. The security value is therefore prospective and civilian-facing: it is the ability to maintain a local, traceable source of fresh greens during disruption, not a fielded military capability. Diligence should test whether units can run with intermittent connectivity, local operators, constrained power, and degraded supply of seeds, nutrients, filters, packaging, and replacement parts. Without that operational validation, the resilience thesis remains promising but not proven.

**Growth stage, trajectory, and key diligence risks.** GreenOnyx is best classified as mid-stage: it was established in 2013, has reported meaningful strategic financing, has a 50-employee signal from the Innovation Authority, has generated historical restaurant and distribution activity, and continues to publicize a modular farm platform. It is not mature because current revenue, farm count, profitability, repeat customer behavior, and international production scale are not publicly established. The attractive trajectory is to move from a differentiated Wolffia product into a repeatable local-production platform: prove a unit in one urban market, standardize deployment and quality, then place modular farms near food-service, retail, institutional, and resilience-oriented buyers. The key risks are concrete. (1) Energy and capex: indoor farms can lose their economic advantage when electricity, lighting, cooling, and maintenance are priced realistically. (2) Biological and contamination risk: a sterile system must prevent loss without making cleaning, monitoring, and replacement too expensive. (3) Market adoption: consumers, chefs, and regulators may not treat Wolffia as a familiar everyday green. (4) Scale-up risk: a unit that works in a demonstration may not maintain yield and quality when replicated across sites. (5) Commercial disclosure: the public record does not establish current revenue, retention, margins, or a large active customer base. (6) Supply-chain risk: seeds, nutrients, filters, packaging, sensors, and spare parts can still be imported even if the crop is local. (7) Competitive pressure: other indoor-farm operators and conventional growers can underprice the product or bundle distribution. The next diligence milestones are independent multi-site yield and energy data, current customer references, audited unit economics, food-safety and shelf-life results, and evidence that a QFarming installation can remain useful during a realistic Israeli or allied supply disruption.
"""
