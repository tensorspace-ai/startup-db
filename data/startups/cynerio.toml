name = 'Cynerio'
description = "Cynerio is an Israeli-founded healthcare cybersecurity company whose medical-device security business was acquired by Axonius in 2025 and is now offered as Axonius for Healthcare."
detailed_description = """Cynerio was an Israeli-founded healthcare cybersecurity company incorporated in 2017 and based in Ramat Gan, with a New York office announced as its North American headquarters in 2021. Its core problem was specific: hospitals connect infusion pumps, imaging equipment, patient monitors, lab systems and building devices to clinical networks, while many of those assets cannot accept endpoint agents, routine scans, firmware upgrades or downtime without vendor and clinical approval. Traditional IT inventories can therefore miss devices and their communication patterns. A compromised device can expose patient information or disrupt care even when the hospital's managed laptops and servers are well protected.

Cynerio built network-based visibility and controls for that gap. Its early product description combined device behavior learning with medical workflow analysis, then used device discovery, classification, risk context and anomaly detection to identify suspicious activity. Later company and investor materials described threat detection and response, clinical risk prioritization and segmentation. The patent record reviewed here concerns one specific method: comparing features of a medical device's network connections with clusters built from sample device traffic and flagging connections that diverge from expected patterns. That supports the existence of targeted R&D, but a patent claim is not proof of current product performance, a complete patent estate or a broad defensible moat. The patent page records later assignment to Axonius Solutions Ltd.

Cynerio's commercial model was oriented to hospitals and health systems. Elron's 2023 report describes direct sales and channel sales in the United States and Europe and an annual payment model linked to the number of beds. A company announcement in 2018 said Rambam Hospital was piloting the product; the release describes a pilot and should not be read as evidence of a paid contract. In 2024, Cheshire and Merseyside selected Cynerio under an 18-month contract. Independent reporting said the phased rollout covered 14 NHS organizations, while Cynerio's release said all 17 NHS Trusts. The announcements establish selection and a customer contract, but not the contract value, completion at each site or an independently measured security outcome. In a 2025 post, co-founder Leon Lerman said Cynerio grew 150% year over year in 2024 and more than doubled ARR and customer count; no absolute ARR, customer count or audited basis was given. KLAS later listed the product under Axonius Cynerio with a 94.0 overall score from 15 organizations, a useful customer-experience signal whose small sample does not measure technical efficacy.

The financing record is mixed and should not be reconstructed by arithmetic. Cynerio announced a $7 million seed in January 2019, with Accelmed, RDC and MTIP named as investors. In May 2021 it announced a $30 million Series B led by ALIVE and reported $40 million raised to date. Elron's 2023 report describes the April 2021 investment round as approximately $26 million, records a $3 million SAFE agreement from November 2019, and says two SAFE agreements completed in February and November 2023 totaled $15 million. Elron's August 2024 investor slide rounded the company's cumulative total to $51 million; its November 2021 presentation showed $35.4 million. These disclosures do not reconcile perfectly, so the Series B amount stays conflicted and lifetime totals remain reported observations with their sources and dates. Elron also reported about NIS 3 million in grants from the Israel Innovation Authority and a Ministry of Economy support program; these are kept separate from equity funding.

In July 2025 Axonius announced that it had acquired Cynerio for more than $100 million in cash and stock. Elron said the binding share-sale agreement covered all of Cynerio and reported that RDC held about 15% on a fully diluted basis before the transaction; RDC's consideration was Axonius equity. Elron's August 5 notice confirms that consideration was transferred and the transaction completed. A registry-data aggregator records Cynerio Israel Ltd. as liquidated due to merger on September 30, 2025. The exact company-wide consideration was not disclosed by Axonius. Calcalist reported $180 million with possible milestone-linked value up to $250 million, but those figures are not entered as verified price. The Israeli registry profile and patent records use Cynerio Israel Ltd.; Elron's translated sale report calls the target Cynerio Ltd., a naming difference retained in the record rather than silently treating the entity names as identical without qualification.

Cynerio is now represented on its former web domain by Axonius for Healthcare. The current offering describes unified clinical asset visibility, more than 150 attributes per medical asset, fleet-level risk scores, clinical protocol support, response playbooks and connections to network access controls, firewalls, ticketing and clinical maintenance systems. This product positioning brings Cynerio's clinical context into Axonius's broader asset-intelligence platform. The practical integration question is whether hospitals can use that combined context to remediate more safely and with less manual effort, while preserving existing contracts, device records, integrations and support. Public materials do not disclose which Cynerio modules remain standalone, how customers were migrated, or how much of the current platform is newly built versus inherited.

The competitive set is specialized and crowded. Claroty xDome combines healthcare medical-device context with a broader cyber-physical systems platform; Armis Centrix emphasizes visibility, patient-centered risk and segmentation; Ordr focuses on agentless, behavior-based device intelligence and safe enforcement; Asimily emphasizes whether vulnerabilities are exploitable in a particular clinical context and offers procurement-stage risk analysis. Forescout/CyberMDX and broad platforms such as Palo Alto Networks also compete for hospital security budgets. Cynerio's plausible distinction is its healthcare-only history and workflow context, now paired with Axonius's enterprise asset inventory, rather than a proven claim of superior detection. Hospital buyers still need evidence of inventory accuracy, safe policy actions, clinical workflow fit, response-time improvement, customer renewal and total cost. Integration, false positives, complex procurement, confidential economics, incomplete public IP coverage and uncertain post-acquisition roadmap are material diligence risks."""
