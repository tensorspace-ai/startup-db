key_technologies = ["Agentless IoT/OT asset discovery and fingerprinting", "Device behavior baselining and anomaly detection", "Network-level micro-segmentation and traffic enforcement", "Vulnerability and exposure prioritization for unmanaged devices", "Medical device-specific threat intelligence and protocols", "Incident response and lateral-movement containment"]
