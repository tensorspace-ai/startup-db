name = "Evinced"
description = "Evinced builds enterprise accessibility automation for web and mobile software, combining visual UI analysis, CI integrations, issue tracking, and agentic tools that test and help fix accessibility defects during development."
detailed_description = """Evinced, Inc. is a California-headquartered, Delaware-registered software startup founded in 2018. Its origin is unusually specific: co-founders Navin Thadani and Gal Moav had worked together on infrastructure software at Ravello Systems, and the company was created to address accessibility failures that enterprise engineering teams could not keep up with through manual audits and syntax-only scanners. The legal entity record lists Ican, Inc. as a previous legal name. Evinced now operates across the United States, Europe, and Israel, with an Israeli team led by co-founder Gal Moav. This is a US legal entity with a confirmed Israeli founding and engineering connection, not an Israeli-incorporated company on the evidence reviewed.

The product is an enterprise B2B software layer for accessibility teams, designers, developers, and QA engineers. Its platform analyzes rendered interfaces as well as code: Evinced describes using computer vision, rule sets, AI, and algorithmic models to infer the purpose of interface elements, compare that inferred intent with implementation, and detect problems that a static markup checker may miss. It is designed to handle changing DOM states in interactive flows, group repeated findings around a shared component, assign stable issue identifiers, and track findings across scans. That workflow is aimed at large portfolios of frequently changed sites and apps, where a small number of flawed components can generate many repeated defects and where the cost of manually triaging every scan is material. The company says its engine detects an average of 19 times more critical accessibility issues than legacy tools; the public technology page does not give an independent benchmark design, dataset, false-positive rate, or sensitivity analysis, so that performance claim needs third-party validation.

Evinced connects its testing engine to existing engineering workflows rather than requiring a separate audit-only process. Company materials describe browser debugging and site scanning, design and component testing, web and native-mobile automation SDKs, production monitoring, and integrations for tools such as Selenium, Cypress, WebdriverIO, XCUITest, Espresso, and Appium. Its Web and Mobile MCP servers expose analysis and remediation guidance to AI coding environments. In July 2026, Evinced announced Autopilot, Harness, and Resolve: company-described agentic features that work with a customer's existing coding model, identify issues in CI or during interactive development, generate fixes, test those fixes, and leave a developer able to review proposed changes. The architecture can make Evinced a specialist verification layer around general coding agents. It also introduces a new trust boundary: buyers need to understand where source code and test data flow, how generated patches are constrained, and whether deterministic checks catch regressions that the same agent introduces.

There is public evidence of enterprise use, but it is stronger on workflow fit than on financial quality. Capital One's engineering team described Evinced as part of its software delivery lifecycle, using browser plugins, automation SDKs, and monitoring of customer-facing assets. Evinced's own testimonial page quotes Capital One staff saying monthly testing fell from three or four weeks to a few hours, and quotes BECU on expanded coverage; these are customer statements curated by the vendor, not audited performance data. The company reported in its December 2024 financing announcement that it served large financial, media, SaaS, healthcare, and retail companies, but did not publish customer names for most of those categories, contract values, renewal rates, revenue, or concentration. A May 2025 CTech interview listed 130 employees and 15–20 open roles, which is a dated company-reported scale indicator rather than a current headcount. The announced funding record comprises a previously undisclosed $2.5 million seed raised in early 2019, a $17 million Series A in February 2021, a $38 million Series B in June 2022, and a $55 million Series C in December 2024. Evinced reported $112 million in total funding after the Series C; the rounded headline amounts sum to $112.5 million, and no reconciliation or round valuation was published in the primary announcements reviewed.

The buyer case is supported by recurring accessibility work, legal and procurement obligations, and the difficulty of maintaining consistent usability across large digital estates. US federal agencies must make covered information and communication technology accessible under Section 508, giving Evinced's web and mobile testing capability a plausible public-sector use case. The company lists a director of US Federal Government sales, but that is a go-to-market signal, not evidence of a federal contract, agency deployment, security authorization, or defense customer. A bounded defense-adjacent use would be accessibility assurance for non-mission-critical personnel, training, benefits, logistics, or administrative applications used by a defense organization. The underlying tool does not provide combat, cyber-defense, or intelligence capability. Evinced's product is therefore a commercial accessibility platform with plausible public-sector and defense-support applicability; defense demand remains unverified.

Competition is direct and active. Deque's axe DevTools pairs a widely adopted open-source engine with paid web, mobile, IDE, CI, guided-test, and AI features. Level Access sells a broad accessibility platform spanning automated testing, remediation, reporting, and expert services. Siteimprove combines automated accessibility findings with governance, monitoring, and manual testing. Customers can also assemble open-source checks, manual audits, internal accessibility specialists, and general QA platforms. Evinced's clearest differentiation is its emphasis on visual and flow-aware inference, mobile support, component-level clustering, persistent issue tracking, and recent agentic remediation within development workflows. These are workflow and coverage advantages rather than an exclusive category: competitors are adding AI, MCP integrations, and CI features, and a higher issue count has little commercial value if it increases false positives or misses usability problems that require human testing. Automated scanning should augment expert screen-reader, keyboard, and contextual evaluation, not be sold as proof of full conformance.

The founders bring relevant enterprise infrastructure experience: Calcalist reports that Thadani was part of Ravello's founding team and later led product development at Oracle after Oracle acquired Ravello in 2016; Moav worked with him at Ravello and is now listed by Evinced as co-founder and GM Israel, while the company lists Ben Bracha as CTO. The founding team's technical and enterprise background fits a workflow-heavy product, but public evidence does not establish current executive depth, customer concentration, retention, or operating efficiency. A US patent application published as US20250028777A1 covers accessibility analysis of web content undergoing mutations and is listed as pending by Google Patents; one pending application is evidence of active IP work, not proof of an issued, broad, or defensible patent portfolio.

The opportunity is credible but diligence-sensitive. The company has raised meaningful institutional capital, names global enterprise customers, and has expanded from scanning into continuous developer workflows and agentic repair. Its commercial value depends on improving release-cycle economics while maintaining trustworthy issue precision; financial evidence is incomplete because revenue, ARR, gross margin, burn, runway, renewals, and pricing are not publicly disclosed. Before treating the product claims as durable advantage, diligence should benchmark precision and recall against expert audits across dynamic web flows and native mobile assistive technology; reconcile paid-customer, renewal, expansion, and concentration data; compare repair acceptance and regression rates for Autopilot, Harness, and Resolve; review data retention and private-cloud controls for agent workflows; and establish whether federal procurement can proceed with the security controls and authorization evidence required by target agencies. The internal watch case rests on specialized workflow technology and enterprise adjacency, while the score is moderated by undisclosed economics, strong incumbents, automation limits, and no verified defense deployments."""
