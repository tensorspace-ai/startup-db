name = "Newlight Marine Technologies"
description = "Newlight Marine Technologies develops a retrofit hydrogen-diesel integration system for existing marine engines, using controlled hydrogen injection and machine-learning-assisted engine management to reduce fuel consumption and emissions without replacing the vessel's propulsion plant. The Israeli-founded company targets commercial shipping first, with resilience and defense-adjacent value in keeping maritime and emergency fleets operational with less fuel and infrastructure disruption."
detailed_description = """
**Product and the concrete problem it solves.** Newlight Marine Technologies is addressing a stubborn brownfield problem in maritime energy: most of the world's ships will continue to operate with diesel engines for years, while fuel is often the largest operating expense and emissions rules are tightening. Replacing a ship's main engine or buying a new alternative-fuel vessel is capital-intensive, slow, and operationally disruptive; a shipowner may need to dry-dock the vessel, redesign fuel systems, and wait for bunkering infrastructure that does not yet exist in every port. Newlight's proposed answer is a retrofit package that lets an existing diesel engine consume a controlled blend of hydrogen and conventional fuel. The company describes the system as a plug-in solution intended to reduce diesel use and emissions while preserving the vessel's existing engine, power, and operating pattern. That is a practical decarbonization proposition rather than a promise that the fleet can immediately run on pure hydrogen. It also creates a resilience proposition: an operator can improve fuel efficiency and reduce dependence on a single fossil-fuel input without discarding productive assets.

**Core technology and how it actually works.** Public technical descriptions identify two linked mechanisms. First, Newlight introduces relatively small quantities of hydrogen through the engine's air-intake path, allowing hydrogen's high flame-propagation characteristics to support more complete combustion of the diesel charge. Hydrogen is therefore used as a combustion-enhancing co-fuel, not as the sole energy source. Second, an electronic control unit and machine-learning model regulate the amount of hydrogen introduced as engine conditions and load change. Newlight says the control layer monitors operating conditions in real time and adjusts the mixture so that efficiency gains do not come at the expense of engine performance or safety. The package is intended for medium-speed diesel engines, low-speed two-stroke engines, four-stroke auxiliary engines, main propulsion systems, and generator applications. Its modular architecture is important because marine propulsion is a highly variable environment: the control system must accommodate changes in load, speed, weather, voyage profile, and fuel quality. The technical claim is promising but should remain calibrated to the evidence. Public sources establish the injection concept, control logic, and factory testing, but not an independently published long-duration sea-trial dataset covering every engine family.

**Market, customers, and go-to-market.** Newlight is pursuing the large installed base of container ships, bulk carriers, tankers, ferries, general-cargo vessels, and other diesel-powered fleets that cannot economically be replaced at once. Its buyer is likely to be a shipowner, fleet manager, shipyard, engine integrator, or maritime energy-service provider that can justify a retrofit through fuel savings, emissions compliance, and reduced downtime. The company's go-to-market is partnership-led: it can work with ship operators and marine engineering organizations to select an engine, install the package during a maintenance window, and measure performance against a baseline voyage or harbor operation. Public ecosystem sources identify collaboration with Lomar Labs and Lomar, while the BIRD Energy program identifies a joint Israel-US project involving Newlight Marine Technologies and Lucy Borchard Shipping to develop and test hydrogen as a dual fuel for marine engines. Newlight's materials emphasize installation without a major engine overhaul, which is commercially meaningful because every day a vessel is unavailable has a direct cost. The company will still need class approval, shipyard relationships, hydrogen-supply partners, service technicians, and a repeatable retrofit process before a single successful installation becomes a scalable fleet business.

**Traction, funding, and third-party validation.** The public record shows meaningful de-risking milestones, but it does not establish mature recurring revenue. PLANETech identifies Newlight as a 2023-founded Israeli startup at the seed and pilot-to-first-paying-customer stage. In December 2024, the US Department of Energy and Israel Innovation Authority announced a BIRD Energy program with $7.5 million in support across five cooperative projects, including the Newlight and Lucy Borchard Shipping hydrogen dual-fuel project; that program support should not be misreported as Newlight's equity financing. In November 2025, Newlight announced completion of Factory Acceptance Testing for a hydrogen retrofit package applicable to two- and four-stroke main engines. The announcement says RINA supervised validation of safety layers, control and monitoring logic, electrical integration, engine behavior under representative duty profiles, emergency stops, and fire and leak detection, and that the next step was Harbor Acceptance Testing on a commercial vessel with Lomar, Lomarlabs, and AURELIA. Those are strong engineering and institutional signals. They do not yet prove long-term onboard reliability, fuel savings in varied sea states, or a completed commercial rollout, so the company belongs in an early commercialization category.

**Founders and team background.** Newlight's founding story is unusually aligned with the marine problem. The Israeli National Center of Blue Economy identifies co-founders Haran Cohen Hillel and Evyatar Cohen as experienced naval officers who recognized the shipping industry's fuel and emissions challenge. Newlight's own biography describes Haran as a former Chief Engineer in the Israeli Navy with mechanical and electrical engineering expertise, a physics degree, and experience managing teams of up to 130 people. The same public material describes both founders as having spent years together in the navy, working around ship engines, technical issues, and integration of new technologies. That background matters because a retrofit product lives or dies at the boundary between thermodynamics, controls, ship operations, safety procedures, and maintenance reality. The team appears to combine vessel engineering and operational familiarity with a machine-learning control approach, rather than treating hydrogen as a purely theoretical fuel. Public sources do not provide a complete headcount, full executive roster, or detailed patent portfolio, so those remain Unknown. Diligence should determine how much of the control software, injector design, safety architecture, and installation know-how is proprietary and how dependent the business is on the two founders.

**Competitive dynamics.** Newlight competes with several different approaches rather than one identical product. CMB.TECH develops hydrogen dual-fuel and hydrogen-powered solutions for marine and heavy-mobility applications, making it a direct alternative for operators considering hydrogen conversion. e1 Marine develops hydrogen generation systems based on onboard reforming of methanol, competing for customers that want hydrogen at the point of use without carrying large quantities of compressed hydrogen. Amogy develops ammonia-to-power systems that target long-duration maritime energy storage and zero-carbon fuel pathways. Wärtsilä and MAN Energy Solutions offer the incumbent engine platforms, fuel-conversion engineering, and service networks that can either compete with a retrofit or become integration partners. Ceres Power and other fuel-cell suppliers represent a different route toward lower-emission marine power, while conventional efficiency upgrades, slow steaming, route optimization, and newer methanol or ammonia engines compete for the same decarbonization budget. Newlight's potential advantage is immediacy: a lower-complexity modification to an installed diesel fleet, with no claim that operators must wait for a wholly new vessel or fuel ecosystem. The weakness is that hydrogen availability, safety, storage volume, injector durability, class certification, and measured economics may erase that advantage at scale.

**Defense, security, and resilience dual-use relevance.** Newlight's core technology has credible dual-use relevance, but public evidence supports an adjacency thesis rather than a claim of fielded naval deployment. Commercial shipping and defense logistics share a dependence on diesel engines, constrained maintenance windows, long operating hours, and fuel supply chains that can be disrupted by conflict, disaster, blockade, price shocks, or port damage. A retrofit that reduces diesel consumption could extend the endurance of patrol, auxiliary, sealift, coast-guard, search-and-rescue, and emergency-response vessels, assuming hydrogen can be supplied safely and the installation remains supportable in the operating theater. The same control and monitoring architecture could be relevant to backup generators at ports, shipyards, hospitals, and critical infrastructure, although Newlight publicly emphasizes marine engines rather than stationary power. Reduced fuel burn also lowers the volume of fuel that must be transported and stored, potentially reducing logistics exposure and the thermal or acoustic signature associated with sustained engine operation, but those security implications require testing rather than inference from marketing claims. No public source reviewed here confirms a Ministry of Defense contract, IDF deployment, or named military customer. The strategic case is therefore strongest as maritime and emergency-fleet resilience with a plausible defense pathway.

**Growth stage, trajectory, and key diligence risks.** Newlight is early, moving from controlled testing toward its first commercial-vessel installation. The trajectory is attractive if the company can convert RINA-supervised factory acceptance into harbor and sea acceptance, demonstrate repeatable savings on multiple engine architectures, and sell a standardized retrofit through maritime partners. The addressable installed fleet is large, and regulation plus fuel cost create a persistent reason to buy, but hydrogen retrofits face a difficult adoption sequence: bunkering, storage, hazardous-area classification, crew training, insurance, local permitting, and shipowner return-on-investment approval all have to line up. The highest-priority diligence points are: (1) independent fuel-consumption and emissions results over long duty cycles; (2) engine wear, knock, misfire, injector life, and failure behavior under hydrogen blending; (3) RINA and other class-society scope beyond factory acceptance; (4) the source, purity, pressure, and onboard storage economics of hydrogen; (5) completed vessel installations and repeat orders; (6) gross margin after engineering and service costs; and (7) ownership of the control and safety IP. If Newlight solves those execution constraints, it could become a pragmatic bridge technology for maritime decarbonization and resilience. If not, its current evidence may amount to a well-tested prototype in a market where alternative fuels and incumbent engine makers capture most of the value.
"""
