name = "Sufresca"
description = "Sufresca is an Israeli agri-food technology startup developing natural, edible and biodegradable coatings for fresh produce. Its COATECH and Algraen product family is designed to slow softening, moisture loss and fungal decay, extending usable shelf life while reducing food loss and reliance on plastic packaging."
detailed_description = """
Sufresca develops edible post-harvest coatings for fruit and vegetables. The company says its formulations use plant-based additives and naturally occurring organic compounds to create a thin, breathable layer after harvest. The intended mechanism is operationally important: the coating should slow softening, shrivelling and decay without stopping the produce's normal metabolism or requiring a consumer-visible package. The company presents three related product lines: COATECH for natural shelf-life extension, Algraen as a natural edible antifungal that can be used alone or added to common coatings, and COATECH Plus as a combined shelf-life and antifungal treatment. This is a formulation and deployment platform rather than a single crop product, although performance still has to be demonstrated crop by crop.

The initial problem selection is sensible because the hardest produce categories are not always the crops already served by conventional waxes. Sufresca describes work on peppers, garlic bulbs and pomegranate arils, and its current site also highlights citrus, tomatoes, cucumbers, avocados and mangoes. The company is targeting growers, pack houses, exporters, marketers, retailers and other produce operators that lose value between harvest and sale. A liquid treatment that can be applied soon after harvest under ambient, refrigerated or changing conditions could fit existing packing workflows more easily than a new package format, but that advantage depends on validated application equipment, dosage, drying time, worker handling and compatibility with each customer's process.

The technology originates in roughly 15 years of research at the Robert H. Smith Faculty of Agriculture, Food and Environment at the Hebrew University of Jerusalem. Sufresca's official account says its intellectual-property portfolio includes one granted patent and two provisional patents. The public team page combines food-processing and edible-film expertise with commercial, chemistry, biology and materials capabilities, including CEO Doron Safrai, co-founder Efrat Boker Ferri, founder Prof. Amos Nussinovitch and R&D leadership. This is a credible technical base, but the public record does not establish the breadth of enforceable protection, the exact composition of each formulation, or whether the company has achieved repeatable commercial-scale economics.

Public evidence supports an early commercialization thesis, not mature scale. The company raised a reported $500,000 seed round from Rimonim Agro in 2019, and contemporary coverage said that brought cumulative funding to $1.3 million. An OurCrowd investor newsletter in 2022 described Sufresca as having industrial trials with produce distributors in Belgium, France, Israel and the United Kingdom and projected initial revenue by 2023; those statements are historical signals rather than proof of current revenue or customer retention. More recent official pages continue to present an active product portfolio, news program and commercial contact channel, but do not disclose revenue, named customers, volumes, repeat orders or current financing. The key diligence task is therefore to separate promising trials and regulatory work from durable market pull.

Sufresca competes with produce-coating and post-harvest-treatment incumbents, newer edible-film companies, and non-coating substitutes such as improved cold-chain management, modified-atmosphere packaging and better grading or logistics. Apeel is the closest high-profile platform comparison; AgroFresh represents an established post-harvest treatment and quality-management competitor; and Cambridge Crops, Mori and other bio-based coating companies demonstrate adjacent alternatives. Sufresca's claimed edge is the ability to address difficult-to-coat produce with edible, biodegradable formulations and a relatively simple liquid application model. That edge is only durable if independent trials show meaningful shelf-life improvement, low sensory impact, regulatory acceptance, attractive cost per treated kilogram and reliable performance across varieties and climates.

The national-security case is indirect but credible at the resilience layer. Fresh-produce spoilage affects food availability, logistics efficiency and dependence on fragile cold chains; shelf-life extension can provide more flexibility during transport disruption, heat events or border delays. It could be relevant to emergency food distribution or military provisioning as a generic supply-chain capability, but there is no public evidence of defense customers, classified work or a defense-specific product. Sufresca should therefore be treated as an Israeli food-security and climate-resilience startup with limited dual-use adjacency, not as a defense technology company. Its strategic importance depends on proving that a food-grade coating can move from promising laboratory and trial results into repeatable, affordable, regulated deployment at scale.
"""
