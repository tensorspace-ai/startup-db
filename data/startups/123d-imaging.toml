name = "123D Imaging"
description = "123D Imaging is a Haifa computational-imaging startup commercializing Technion-originated optics and reconstruction software that adds passive 3D, depth, volumetric-flow, and inspection capabilities to existing imaging systems. Its core proposition is to recover more spatial information from fewer cameras and simpler optical hardware, creating a potentially important sensing layer for microscopy, industrial inspection, robotics, and defense-adjacent perception."
detailed_description = """
**Product and the concrete problem it solves.** 123D Imaging is building a computational-imaging and optical-design business around a practical problem in sensing: many systems need depth, three-dimensional structure, or volumetric motion data, but the conventional answer is to add cameras, active illumination, radar, LiDAR, or a more complex optical train. Those additions increase bill of materials, alignment effort, calibration burden, power consumption, and failure points. The company’s public profile describes a compact optical add-on paired with proprietary decoding and reconstruction software that can upgrade an existing imaging system rather than requiring a complete redesign. The target capabilities include passive monocular depth, full volumetric flow measurements, extended depth of field, microscopy, surface measurement, and 3D defect detection. That makes 123D Imaging an enabling-sensing company rather than a finished vertical application vendor. The immediate customer problem is not that cameras cannot produce pictures; it is that a two-dimensional image often leaves the operator without reliable distance, shape, motion, or internal spatial information needed to make a measurement or an autonomous decision.

**Core technology and how it actually works.**  The technical approach comes from point-spread-function engineering, diffractive optical elements, phase masks, and algorithmic reconstruction. Instead of obtaining depth by triangulating between two separated cameras or actively transmitting a ranging signal, a shaped optical element deliberately changes how different depths appear on the image sensor. The resulting depth-dependent blur or point-spread pattern contains a code that software can decode into distance or three-dimensional structure. 123D’s public description says it combines PSF engineering, DOE or phase-mask optical elements, and proprietary decoding software; the Technion technology record explains the same general architecture as passive wavefront shaping followed by algorithmic distance decoding. The company also describes a 3D particle-image-velocimetry path in which a thin phase mask is inserted into an otherwise conventional setup and a neural network reconstructs volumetric flow from a single camera. This is technically meaningful because it moves complexity from multiple synchronized cameras and calibration-heavy geometry into a co-designed optic-plus-algorithm package. It does not make physics disappear: performance still depends on optical design, calibration, signal quality, reconstruction robustness, and the scene class.

**Market, customers, and go-to-market.**  The clearest initial markets are organizations that already own cameras or microscopes but need a new measurement mode. In microscopy and biomedical research, the product could add depth or volumetric information to instruments used for cells, particles, and microfluidics. In industrial and semiconductor inspection, the same stack could support extended-depth imaging, surface metrology, autofocus, and three-dimensional defect detection. In fluid mechanics, a single-camera 3D PIV workflow could reduce the cost and physical footprint of experiments in constrained optical environments. The company’s public materials do not disclose paying customers, revenue, pricing, distribution agreements, or a repeatable sales funnel. The likely route to market is technical co-development with instrument makers, imaging OEMs, research-equipment suppliers, and industrial inspection integrators, followed by licensing or sale of an optical module and reconstruction software. A component-level strategy would be more scalable than selling bespoke imaging services, but it would also expose 123D to long qualification cycles and to the integration requirements of customers whose products must remain stable across temperature, vibration, manufacturing tolerances, and changing scenes.

**Traction, funding, and third-party validation.**  The public record places 123D Imaging in the earliest commercialization phase. LinkedIn identifies the company as founded in 2026, headquartered in Haifa, privately held, and employing 2-10 people; it names Yotam Zohar as a company employee and lists the company website as 123dimaging.com. Technion’s T3 commercialization program presents 123D Imaging as an early-stage venture with Zohar as co-founder and CEO, and the 10D Israeli Physical AI map includes 123D in the sensors-and-perception infrastructure category. No reviewed source discloses an equity round, grant amount, valuation, named customer, production shipment, regulatory approval, or company-level patent portfolio. There is nevertheless a meaningful research-validation layer behind the venture. Technion records describe a macroscopic single-camera 3D optic for far-object distance measurement, and peer-reviewed work by Yoav Shechtman and collaborators established the information-theoretic design of depth-encoding point-spread functions. A 2026 preprint on high-density monocular 3D PIV reports correlation coefficients above 0.97 against ground-truth references and an order-of-magnitude computational-speed improvement in its experimental setting. Those results validate the underlying research direction, not a finished 123D product or commercial performance claim.

**Founders and team background.**  The most publicly confirmable operating leader is Yotam Zohar, identified by Technion’s T3 program as 123D Imaging’s co-founder and CEO. The company profile also attributes its technology to Professor Yoav Shechtman’s laboratory at the Technion, making the venture’s academic provenance unusually legible for such a young company. Shechtman is an associate professor in biomedical engineering whose research spans optical super-resolution microscopy, three-dimensional and multicolor tracking, optical design, machine learning for imaging, inverse problems, and wavefront shaping. His published work and Technion technology portfolio cover both microscopic 3D imaging and macroscopic distance measurement, which provides a credible technical bridge from laboratory methods to sensing products. The team appears very small, and the public sources do not establish a larger executive bench, manufacturing organization, sales team, or advisory board. That is both an advantage and a diligence constraint: a compact founding group can iterate quickly around a difficult optical core, but commercializing optics requires expertise beyond the original research, including packaging, calibration, manufacturing yield, embedded inference, application engineering, and customer support. The company’s ability to recruit or partner across those disciplines will determine whether the lab-originated capability becomes a reliable product.

**Competitive dynamics and potential edge.**  123D Imaging competes against several different approaches rather than one direct substitute. Intel RealSense and Stereolabs represent stereo and depth-camera systems that use multiple viewpoints; Ouster and Hesai represent LiDAR architectures that actively measure range; structured-light and time-of-flight systems add illumination and specialized sensors; and Teledyne FLIR, Cognex, and instrument vendors combine mature cameras with application-specific processing for industrial and defense markets. In microscopy and flow measurement, established multi-camera tomographic PIV systems are the incumbent approach. 123D’s plausible edge is a compact, passive, co-designed optical and computational layer that can preserve existing cameras while adding depth or volumetric information. A single-camera design can be valuable where camera placement is difficult, where synchronization is undesirable, or where active emissions are operationally undesirable. The edge remains unproven as a business moat. Competitors can improve stereo algorithms, integrate smaller active sensors, or copy the application-level workflow; customers may prefer a complete instrument from an incumbent even if the underlying physics is less elegant. Defensibility therefore depends on optical IP, reconstruction quality, calibration simplicity, manufacturing repeatability, and demonstrated performance in difficult scenes rather than on the existence of a phase mask alone.

**Defense, security, and resilience dual-use relevance.**  123D Imaging qualifies as dual-use at the enabling-technology level, with no public evidence of fielded defense capability. The Technion’s macroscopic technology record describes passive distance measurement for far objects, including light sources such as headlights, landing-strip lights, and rockets, and notes operation in low-visibility conditions such as dust that can overwhelm active systems like LiDAR. Those properties create credible pathways into electro-optical sensing for unmanned systems, perimeter and border observation, search and rescue, range estimation, and industrial or energy infrastructure inspection. A smaller optical payload that delivers depth without an active emitter could also help constrained UAVs, ground robots, or maritime platforms where power, size, signature, and sensor alignment matter. The same technology can support civilian resilience through inspection of semiconductor production equipment, utilities, hazardous industrial spaces, and fluid systems. Calibration is important: no source reviewed here confirms an IDF, Ministry of Defense, intelligence, aerospace-prime, or security customer; no ruggedization, export-control classification, cyber accreditation, or contested-environment test is public; and the company’s stated commercialization evidence is research and early ecosystem validation. Strategic value is therefore potential sensing leverage, not a claimed defense contract.

**Growth stage, trajectory, and key diligence risks.**  123D Imaging should be classified as early: a 2026 company with a 2-10-person public profile, an academic technology base, and no disclosed financing or commercial metrics. Its attractive trajectory would be a staged productization path: first demonstrate repeatable depth and volumetric-measurement performance with a compact module; then convert one or more research or industrial pilots into paid design-ins; then prove that calibration, manufacturing, and inference costs remain acceptable when deployed outside a controlled laboratory. The main risks are substantial. (1) Optical-to-software co-design may work in experiments but degrade with temperature, vibration, lens variation, contamination, or production tolerances. (2) Customers may demand application-specific accuracy, latency, certification, and support that a tiny team cannot yet provide. (3) The company’s patent ownership, freedom to operate, licensing arrangements with Technion, and protection of reconstruction software are not publicly established. (4) Stereo, LiDAR, time-of-flight, and incumbent instrument vendors already have installed bases and mature channels. (5) The 2026 preprint evidence is promising but does not establish commercial reliability, recurring revenue, or defense readiness. (6) If defense or space markets become the primary path, export controls and long qualification cycles could delay revenue. The opportunity is technically distinctive; the next proof points must be product, customer, and manufacturing evidence.
"""
