name = "GreenVibe"
description = "GreenVibe is an Israeli deep-tech construction-sensing startup developing embedded sensors and analytics that measure concrete strength, humidity, temperature, and conductance inside a pour in real time. The system gives contractors earlier evidence for construction decisions, reduces dependence on delayed sampling, and can support lower material use and more resilient infrastructure delivery."
detailed_description = """
**Product and the concrete problem it solves.** GreenVibe targets a surprisingly consequential information gap inside one of the world's most ubiquitous materials. Once concrete is mixed and poured, project teams usually infer readiness from samples, temperature histories, prescribed maturity curves, and laboratory testing. Those methods are useful but can be slow, spatially sparse, and disconnected from the exact structural element being advanced. A contractor deciding when to remove formwork, post-tension a floor, load a new level, open pavement, or alter a mix is therefore balancing safety, schedule, cost, and incomplete information. GreenVibe's product is a field-deployed sensing system that remains inside the concrete element and reports its changing condition while the structure cures. The practical promise is not simply a prettier dashboard. It is earlier operational certainty: proceed when the element is ready, wait when it is not, avoid unnecessary over-strength concrete, and identify a bad pour before it becomes a hidden structural or scheduling problem. That makes the platform relevant to high-rise construction, data centers, bridges, industrial facilities, and other projects where a small delay or an incorrect decision can create large downstream costs.

**Core technology and how it actually works.** GreenVibe attaches its sensing units to reinforcing steel before concrete placement, embeds them in the structural element, and transmits measurements through a communications device to a cloud platform. The Israel Innovation Authority describes measurements of concrete strength, humidity, temperature, and conductance; Engineering News-Record provides a more detailed account of a multi-sensor architecture that combines ultrasound, flexoelectric measurements, electrical resistivity, and temperature. Machine-learning algorithms process the time-series signals and deliver results through a mobile or desktop interface. The company's technical proposition is that combining different physical signals can infer strength from how the material itself changes, rather than relying only on a mix-specific temperature-strength calibration curve. This is important because concrete recipes and curing conditions vary across projects. The system also attempts to distinguish material behavior from connectivity failures and sensor faults. Its limitations are equally important: each sensor observes a local neighborhood, with the CEO estimating an effective radius of roughly eight inches depending on wave behavior, so coverage depends on sensor placement and density. In the United States the product is currently an additional quality-assurance layer, not an approved replacement for required 28-day acceptance testing.

**Market, customers, and go-to-market.** GreenVibe sells into a conservative, fragmented construction value chain that includes general contractors, developers, concrete suppliers, structural engineers, precasters, and owners of large projects. The initial buyer is likely the contractor or project engineer who can monetize schedule certainty directly, while materials producers may use the data to optimize formulations and reduce cement overuse. The company's early distribution has been relationship-led rather than mass-market. The Times of Israel reported work with Israeli tier-one builders Tidhar, Shikun & Binui, Ashtrom Group, and Shapir Engineering, with Tidhar also making an undisclosed investment and using the technology across six sites in 2022. Engineering News-Record reported in 2026 that GreenVibe had 11 paying projects, additional pipelines with Solel Boneh, BST, and Tidhar, and a pilot with a large U.S. contractor. The business can land through a single project, prove faster or safer decisions, and expand through a contractor's portfolio or through specifications from an owner or engineer. The constraint is that every project has different mixes, structural geometries, regulations, and liability chains, so repeatability of installation, interpretation, and procurement matters as much as sensor performance.

**Traction, funding, and third-party validation.** Public evidence now places GreenVibe beyond a laboratory prototype, while leaving material scale questions open. An Axios Pro report dated July 20, 2026 says the company closed a $12 million seed round. ENR likewise reports $12 million raised to date and says GreenVibe has produced approximately 10,000 sensors, with roughly 70% to 80% deployed on active projects and the remainder used for training and validation. ENR also records 11 paying projects and an Ashtrom deployment using 200 sensors across 80 concrete placements beginning in June 2025. On that project, GreenVibe says C40 concrete reached about 70% of target compressive strength in an average of 72 hours and estimates that continuous monitoring saved roughly 40 working days. At Tidhar's Ybox TLV project and the Beyond and Minrav Data Center projects, the company says its data supported approved reductions in concrete grade or cement content while maintaining specified structural requirements. The Beyond tower offers a particularly concrete reference: after an earlier disagreement that the project manager says led to more than $500,000 in repairs, a later decision to wait on GreenVibe's warning was followed by core-test support and an estimated 98 working days saved. These are credible field signals, but most performance figures remain company- or customer-reported and require independent validation.

**Founders and team background.** GreenVibe was founded in Israel in 2019 by Roee Reshef and Oran Weisz. Reshef is the co-founder and CEO; public profiles describe his prior work across technology companies and 3D printing, followed by first-hand exposure to construction inefficiency while building two houses. Weisz is the co-founder and chief product officer and is identified as an electrical engineer. PLANETech reports that Weisz recognized a sensing technology originally developed for security purposes at Elbit and helped adapt it to concrete, providing a notable Israeli defense-to-civilian technology-transfer path. The team combines electronics, applied physics, materials engineering, algorithms, software, and construction-product expertise, which is the right multidisciplinary mix for a product that must survive a chemically and mechanically difficult environment while producing interpretable data. The Israel Innovation Authority lists 17 employees and classifies the company in Hardware & Industrial at the R&D stage. That is a meaningful technical team for an early hardware startup, but not evidence of a fully built international sales, support, regulatory, or manufacturing organization. The founders' strongest asset is domain translation: they connected security sensing, material science, and contractor workflow. Their main organizational test is converting project-level expertise into standardized deployments that do not require bespoke engineering on every pour.

**Competitive dynamics.** GreenVibe competes against several layers of alternative rather than one direct rival. The incumbent baseline is conventional sampling, laboratory compression testing, and maturity-method estimation under standards such as ASTM C1074. Sensor alternatives include temperature-only maturity loggers, embedded wireless monitoring products, and specialist nondestructive-testing instruments. Broader industrial and construction technology vendors can also approach the account through building-information modeling, project controls, digital twins, or asset-monitoring suites. GreenVibe's claimed edge is the combination of embedded, multisensor measurement with a model that estimates material strength across different mixes and curing conditions, potentially avoiding a new calibration relationship for every recipe. Its customer evidence adds another practical advantage: it has been tested inside actual Israeli construction workflows rather than only in a controlled materials laboratory. The differentiator will be durable only if the system produces decision-grade accuracy, installs reliably at low labor cost, and creates an auditable chain of evidence acceptable to engineers, insurers, regulators, and owners. The company remains vulnerable to incumbent methods that are familiar and cheap, to better-capitalized sensor vendors, and to large contractors deciding that data should remain inside their existing project-control stack.

**Defense, security, and resilience dual-use relevance.** GreenVibe's dual-use case is credible but should be framed as infrastructure resilience and defense-industrial readiness, not as a weapon or a fielded military system. The same embedded sensing and analytics can support construction and maintenance of military bases, hardened facilities, bridges, tunnels, ports, energy sites, and defense-factory buildings where hidden material defects or poorly timed work can reduce operational availability. Real-time knowledge of concrete condition could help prioritize post-earthquake, blast, flood, or other incident inspections, triage which structures can safely carry load, and shorten recovery decisions when laboratory capacity or access is constrained. The company's own public material also connects long-term monitoring to material fatigue, natural-disaster damage, and security incidents. Its origin in technology developed for security purposes at Elbit strengthens the dual-use interpretation, because the platform is not merely a generic construction SaaS product. However, there is no public evidence of a defense contract, classified deployment, military certification, or operational use on a base or battlefield. Public evidence instead centers on commercial Israeli construction projects and civilian infrastructure. The strategic thesis therefore rests on a short and technically plausible transfer path that still requires secure deployment, calibrated models, ruggedized hardware, data-residency controls, and acceptance by defense engineering authorities.

**Growth stage, trajectory, and diligence risks.** GreenVibe is best classified as mid-stage: it has a 2019 founding, a 17-person team reported by the Israel Innovation Authority, a $12 million 2026 seed financing, thousands of sensors produced, paying projects, named construction partners, and a product moving toward general commercial availability. It is not mature because revenue, gross margins, retention, customer concentration, manufacturing capacity, and regulatory acceptance are not publicly disclosed. The trajectory is attractive if the company can turn a project-by-project sensor sale into a repeatable platform and recurring analytics workflow. The principal diligence questions are: (1) whether its strength estimates remain accurate across mixes, geometries, temperatures, and reinforcement conditions; (2) whether sensor density and installation labor produce attractive project economics; (3) how it manages local coverage gaps, sensor faults, connectivity loss, and data ownership; (4) whether contractors can rely on the data without shifting unacceptable structural liability to GreenVibe; (5) whether ASTM participation leads to formal acceptance or remains supplemental; (6) whether the $12 million round funds manufacturing and international support rather than only extended R&D; and (7) whether the defense-origin IP is cleanly owned and licensed for commercial and government use. Milestones that would raise confidence include independent validation against core tests, explicit standards acceptance, repeat deployments across multiple geographies, disclosed recurring software revenue, and a named defense or critical-infrastructure reference. Until then, GreenVibe is a strong strategic-monitoring candidate with real field traction and a meaningful resilience angle, but not a proven national-security supplier.
"""
