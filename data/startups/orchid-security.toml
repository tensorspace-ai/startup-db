name = "Orchid Security"
description = "Orchid Security provides identity-first security orchestration that discovers applications, analyzes authentication and authorization behavior, and brings unmanaged identity controls into existing IAM, IGA, PAM, and audit workflows."
detailed_description = """
Orchid Security addresses the part of enterprise identity infrastructure that conventional IAM systems often cannot see: authentication and authorization behavior implemented inside SaaS, legacy, self-hosted, and custom applications. Its platform continuously discovers applications and identity paths, analyzes how access actually works, identifies control gaps such as hidden login routes, local accounts, hardcoded credentials, and privilege drift, and creates an identity baseline that can be monitored over time. Orchid says its analysis uses large language models and application telemetry to interpret identity-related logic without requiring application recoding; the practical value is the combination of visibility, explanation, remediation guidance, and evidence rather than an LLM in isolation.

The buying problem is credible and operationally expensive. Large enterprises accumulate hundreds or thousands of applications through organic growth, SaaS adoption, and acquisitions, while IAM, IGA, and PAM teams remain dependent on manual questionnaires, bespoke connectors, and application-owner knowledge. Orchid is designed to augment those existing systems rather than replace them: its stated workflow is to discover the application estate, assess authentication and authorization controls against security or regulatory requirements, route changes through the identity stack, and preserve an auditable record. The company has disclosed work with enterprise customers including Costco and Repsol, and its website carries customer commentary from ISS and other organizations. Those are useful traction signals, but the company's percentage improvements remain vendor-reported and should be validated by reference calls and deployment data.

Competition is substantial. SailPoint, Saviynt, Okta, Microsoft, CyberArk, and Omada already own important identity budgets, while identity threat detection, CIEM, application security, and software supply-chain products can address parts of the same exposure. Orchid's most defensible wedge is application-centric identity intelligence: it attempts to reveal why access exists and how controls are enforced in applications that directory-centric products cannot model cleanly. That wedge could reduce onboarding and professional-services work, especially during mergers or in estates with many bespoke applications, but it must translate analysis into safe, repeatable integrations and measurable risk reduction. The AWS Marketplace listing is a modest commercialization signal because it shows a SaaS delivery path and an enterprise procurement route, not proof of broad market adoption.

The company has unusually strong disclosed early-stage cybersecurity credentials for this category. Co-founders Roy Katmor and Ido Kelson previously founded enSilo, later acquired by Fortinet, while Robert Wiseman came from Team8 and identity/security operating roles; the current company page also lists experienced product and revenue leadership. Orchid announced a $36 million seed round co-led by Team8 and Intel Capital in January 2025, alongside statements that it was already working with large enterprises. LinkedIn currently places the company in the 11–50 employee band, which is consistent with a well-funded but still early commercial organization. These signals support meaningful diligence priority, but they do not establish renewal rates, recurring revenue, gross margins, or deployment scalability.

The national-security relevance is real but indirect. Identity compromise, unmanaged service accounts, excessive privilege, and opaque application access paths are common contributors to intrusion and lateral movement in critical infrastructure, defense contractors, and government-adjacent environments. A platform that makes those paths observable and governable could improve cyber resilience without requiring every legacy application to be rewritten. There is no basis here to claim defense or government contracts, so the dual-use case should be framed as transferable cyber infrastructure capability. The central diligence questions are whether passive discovery is complete, whether model-derived findings are explainable and low-noise, how sensitive telemetry is handled, and whether remediation can be safely enforced in high-assurance environments.
"""
