name = "Oribi"
description = "Oribi Systems Ltd. was a Tel Aviv marketing-analytics startup founded in 2015 by Iris Shoor. Its Magic Events product automatically turned website interactions into named events, customer journeys, and marketing attribution data without conventional manual event tagging. LinkedIn agreed to acquire Oribi in February 2022, and later disclosures say the technology was integrated into LinkedIn Marketing Solutions; Oribi is an acquired asset, not an independent startup today."
detailed_description = """
Oribi Systems Ltd. built a B2B website analytics product for marketing and growth teams that wanted answers about conversions and campaign performance without maintaining a developer-owned event taxonomy. Contemporary Israeli reporting dates its founding to October 2015 and places it in Tel Aviv. LinkedIn’s company profile later labels the company as founded in 2016, so the earlier 2015 date is used here with the profile discrepancy preserved. The historical legal name appears as Oribi Systems Ltd. in founder-authored and company-database material; CTech also used the shorter Oribi Ltd. name.

The product’s distinctive layer was Magic Events. Oribi described a lightweight web installation that collected interactions and used algorithms or models to infer meaningful events from otherwise unstructured behavior. The user-facing output was a customer-data layer: event labels, conversion goals, funnels, journey views, audience groupings, and channel attribution that a marketer could work with in a visual interface. The company profile claimed that Magic Events could expand the amount of customer data tenfold and create a customer data layer within hours; those are company claims, not independent performance measurements. The commercial promise was implementation speed and accessibility, not a new analytics category: turn browser events into a usable marketing vocabulary and make channel and visitor behavior legible to non-specialists.

That workflow addressed a real operating cost. Hand-built tracking plans require engineering time, documentation, quality checks, and ongoing repair when sites change. Oribi’s approach aimed to shorten that setup and make questions possible after installation, when a marketer noticed a new behavior or funnel. Founder Iris Shoor described an early product evolution from Facebook-ad analytics toward broader website and marketing analysis. In 2016 reporting, Oribi was in open beta and said to have reached about 2,500 small companies; this is beta-use evidence, not 2,500 paying customers. In 2019, CTech named Audi and Crowne Plaza among customers and also mentioned government agencies without naming them or describing contracts. By February 2021, CTech reported 1,000 subscribed customers and a Facebook collaboration selection. The same article described the Facebook relationship only at a high level, so it should not be read as a paid contract or production deployment. Globes quoted Shoor as saying thousands of customers had replaced Google Analytics, a broader company assertion that is not directly comparable to CTech’s subscribed-customer count.

The funding record shows a reported $5.4 million first round in 2016, a $7 million Series A in February 2019, and a $15.5 million Series B in February 2021. Oribi’s February 2021 press release gave its cumulative funding as $27 million; the disclosed priced-round amounts sum to $27.9 million, a discrepancy that the sources do not reconcile. IVC’s public profile also lists a 2019 non-equity accelerator-assistance entry and a July 2021 Series C SAFE. Dealroom assigns $4.5 million to the latter and displays a $77.5 million valuation, but no company announcement or underlying terms were found; the amount is retained as a secondary-database report, while valuation fields remain blank because the basis and pre/post-money meaning are not stated. Acquisition-era media continued to describe Oribi’s raised capital as roughly $27 million to just under $28 million, so there is no reliable company-announced lifetime total after February 2021.

Oribi’s competitive claim was the combination of automatically discovered events, low-friction installation, and marketing-oriented interpretation. Google Analytics was a direct substitute for web and channel measurement; current Google documentation describes event-based analytics and data-driven attribution. Heap is the closest technical analogue in automatic behavioral capture and retroactive event definition, while Mixpanel overlaps in event analysis, funnels, campaign reports, and paid multi-touch attribution. Adobe Customer Journey Analytics addresses larger enterprise teams with cross-channel data integration and attribution. Dreamdata works further down the B2B revenue stack by joining web behavior with CRM and account data. Oribi’s intended distinction was a friendlier, more automatic marketing workflow for SMB and mid-market users. Its narrowness could aid adoption, but the features were reproducible and the larger suites could bundle them into products with broader identity, data-governance, and advertising integrations.

The technical risk follows directly from the product design. Inferred events save instrumentation effort, but customers still need to know which page element or behavior produced an event, whether a site redesign broke its meaning, and whether a model’s inferred category matches the business definition of a conversion. More captured behavior can increase the data available for analysis while also increasing noise, review burden, and exposure to consent or retention limits. Browser privacy settings, ad blocking, consent choices, and changes in identifier availability can make the event stream incomplete. LinkedIn’s acquisition announcement emphasized privacy-first attribution and existing data controls, but public sources do not document Oribi’s internal consent architecture, audit controls, or independent security certifications. No Oribi-assigned patent family was identified in the targeted public searches; that does not establish that no trade secrets or other protectable know-how existed.

LinkedIn announced an agreement to acquire Oribi on February 28, 2022, saying it intended to integrate the technology into Marketing Solutions to improve campaign attribution. A Microsoft SEC proxy later listed Oribi Systems Ltd. among businesses acquired in fiscal 2022. Shoor’s 2024 LinkedIn post says the product and technology became part of LinkedIn’s advertising platform and that integration exceeded its goals. These are meaningful commercialization and integration signals, but they do not prove which Oribi features remain live as a distinct product or how much incremental value they generate today. LinkedIn never disclosed the price. Contemporary reports estimated about $80–90 million, while a Globes interview rounded the transaction to about $100 million; the amount therefore remains unreported in the structured deal record. Calcalist reported that customer-facing teams were largely laid off after the deal and that roughly 50 people remained in the LinkedIn-Israel operation. In August 2026, Calcalist reported that LinkedIn was ending most of that R&D operation; this describes a later organizational change, not a documented sunset of Oribi-derived features.

Shoor was the public founder and CEO. She had founded Takipi/OverOps and Visual Tao before Oribi; Visual Tao was acquired by Autodesk. LinkedIn expected her and several Oribi colleagues to join its Tel Aviv office, and her later account describes leading the product through acquisition and integration before leaving LinkedIn in 2024. Public records disagree about other co-founders: IVC lists Avishai Bitton, while the legacy Startup Nation Finder profile lists Oren Shuster. The record therefore names only Shoor until a primary company or registry source resolves the discrepancy. Contemporary headcount reports also vary: 12 employees in February 2019, 30 in one February 2021 story, 40 in another the next day, and approximately 50 around acquisition. These figures are dated media reports, not audited staffing data.

For investors, Oribi’s 2016 round named Sequoia Capital, TLV Partners, and angel Zohar Gilon; the 2019 round was led by S Capital with Sequoia and TLV Partners participating; Ibex Investors led the 2021 Series B with MoreTech and returning investors. Investor portfolio pages corroborate Oribi’s historical relationship with TLV Partners and Ibex. Private ownership percentages, the detailed cap table, post-acquisition asset title, financial performance, and revenue or retention metrics are not public in the sources reviewed.

The dual-use case is weak and indirect. Event classification and journey analysis are general data-processing methods that might be adapted to authorized digital-service analytics, but Oribi’s documented product was designed for commercial website behavior and marketing attribution. No public evidence was found of a defense, intelligence, or cybersecurity product, contract, deployment, certification, or customer. The 2019 report’s unnamed government-agency customer category is not enough to establish a security or defense use. Adapting the technology for such work would require a distinct collection model, privacy and legal controls, adversarial-data validation, and operational security features. Oribi should therefore be treated as a commercially validated analytics acquisition and an example of low-code event inference, not as a defense technology company or a current investment opportunity.
"""
