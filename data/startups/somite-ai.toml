name = "Cellular Intelligence"
description = "Cellular Intelligence, formerly Somite AI and operating under the legal entity Somite Therapeutics, is an AI-native TechBio company building foundation models for cell signaling and cell-state control. It combines proprietary high-throughput perturbation data with a clinical-stage cell-therapy program to move regenerative medicine from empirical protocol search toward predictive engineering."
detailed_description = """Cellular Intelligence is building a full-stack platform for understanding, predicting, and controlling how human cells respond to sequences of biological signals. Its technical thesis is that cell fate is a dynamic control problem: the effect of a growth factor, small molecule, dose, or timing sequence depends on the cell's developmental state and prior treatment history. The company generates proprietary data with a capsule-based multiplexing platform that exposes differentiating pluripotent stem cells to very large numbers of time-resolved perturbation conditions, then uses those measurements to train a universal cell-signaling foundation model. The company reports that its capsule approach can generate data at more than 1,000 times the efficiency of conventional methods; that is a company claim and still needs independent replication and prospective validation.

The platform is intended to support rational design of differentiation protocols, prediction of context-specific drug effects, systematic disease modeling, and optimization of cell-therapy manufacturing. The commercial problem is substantial: regenerative-medicine programs must control identity, purity, potency, scale, and reproducibility, while many workflows still rely on costly wet-lab iteration by specialized teams. Cellular Intelligence's model is potentially valuable if it can recommend interventions that generalize across cell lines, donors, batches, and manufacturing settings, rather than merely interpolating within its own assay distribution. The relevant customers and partners include cell-therapy developers, biopharma companies, translational research groups, and potentially manufacturers that need better process control. The business model remains incompletely disclosed, so the record should not assume recurring software revenue or named commercial customers.

The company's public trajectory changed materially in 2026. After rebranding from Somite in January, it announced in May that it had secured global rights to Novo Nordisk's STEM-PD allogeneic, pluripotent-stem-cell-derived dopaminergic progenitor program for Parkinson's disease. The program is described by the company as Phase 2-ready, with FDA Fast Track Designation and IND clearance for further development; the underlying clinical program has already undergone first-in-human Phase 1/2 dosing. Cellular Intelligence says it will use the asset as a proving ground for model-guided process development, manufacturing scale-up, and a data loop linking process decisions to clinical outcomes. This is a stronger commercialization and validation signal than the earlier platform-only profile, but STEM-PD remains investigational and its safety and efficacy are not established. The acquisition also increases clinical, regulatory, manufacturing, and financing obligations.

Competitive pressure comes from several directions: virtual-cell and perturbation-model companies, AI-native drug-discovery platforms, cell-therapy developers with internal process expertise, and academic or nonprofit infrastructure that makes biological datasets widely available. Cellular Intelligence's prospective edge is the combination of proprietary sequential perturbation data, a model trained on cell-signaling context, and ownership of a clinical-stage program that can generate linked manufacturing and outcome data. That advantage will only become durable if the company demonstrates prospective model lift over strong baselines, calibrated predictions, reproducible assays, and measurable improvements in potency, yield, cost, or clinical development speed. Its own July 2026 white paper explicitly distinguishes demonstrated capabilities from work in execution and open questions, which is a useful sign of calibrated disclosure rather than proof of product-market fit.

The defense and national-security relevance is real but indirect. Better control of cell states can strengthen allied regenerative medicine, biomanufacturing, therapeutic preparedness, and resilience against high-consequence disease without requiring an offensive application. The same platform could eventually help prioritize countermeasure or repair-oriented research, but there is no verified defense customer, government contract, security certification, or military deployment in the available public record. The appropriate assessment is therefore dual-use potential at the enabling-biotechnology layer, not established defense traction. The main diligence questions are whether the model produces causal, transferable recommendations; whether manufacturing and clinical data can be integrated without bias; whether STEM-PD advances through its next regulatory and clinical gates; and whether the company can fund a platform-plus-therapeutics strategy while preserving focus."""
