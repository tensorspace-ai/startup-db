name = "NeuraLight"
description = "NeuraLight is an Israeli healthtech startup building an AI and computer-vision platform that turns short visual tasks and eye-movement measurements into quantitative biomarkers of brain function. Its software is being used and evaluated in neurological clinical-trial programs to make disease progression and treatment response more objective, scalable, and sensitive than conventional clinical scales alone."
detailed_description = """
**Product and the concrete problem it solves.** NeuraLight addresses a persistent bottleneck in neurology: clinicians and drug developers need sensitive, repeatable measurements of brain function, but the standard assessments used in Parkinson's disease and related disorders are often subjective, coarse, time-consuming, and difficult to standardize across sites. A patient may show meaningful changes in eye movement, reaction, or neural-pathway function before a conventional questionnaire or clinician-rated scale captures them, yet those signals are difficult to collect and interpret consistently in ordinary care and multinational trials. NeuraLight's software-based platform presents standardized visual tasks and analyzes how a person performs them, extracting quantitative biomarkers from eye movements and other observable responses. The goal is not simply to digitize a paper form; it is to create a measurement layer that can reveal subtle changes in targeted brain circuits, reduce noise in clinical endpoints, and make remote or distributed assessments more comparable. The immediate commercial problem is trial measurement and patient monitoring. The broader resilience value is a scalable way to measure neurological function when specialist capacity, travel, and repeated in-person assessment are constrained.

**Core technology and how it actually works.** The platform combines task design, computer vision, signal processing, and machine learning. A short assessment engages specific brain functions through visual stimuli; cameras capture the patient's performance and eye movements; proprietary algorithms detect oculometric features and translate them into biomarkers associated with neural pathways. NeuraLight describes the process as three layers: a standardized assessment, AI analysis of task performance, and extraction of multiple biomarkers that quantify aspects of brain function. The approach is intentionally low-friction because it can use ordinary cameras or smartphones rather than requiring a laboratory eye tracker for every measurement, although the exact hardware, calibration, and clinical workflow vary by study. The company says its biomarkers are grounded in established relationships between oculomotor patterns and underlying neural circuitry, and its public clinical materials describe work across Parkinson's, Alzheimer's, ALS, Huntington's disease, and other CNS indications. This is not a general-purpose foundation model claim: the defensible technical asset is the combination of carefully designed tasks, proprietary longitudinal data, disease-specific signal processing, and clinical interpretation. Public sources do not disclose model architectures, dataset size, patent numbers, or the complete validation protocol.

**Market, customers, and go-to-market.** NeuraLight's primary market is B2B clinical research and precision neurology. Pharmaceutical and biotechnology companies developing neurodegeneration therapies need endpoints that can detect small changes, support smaller or shorter trials, and work consistently across countries and clinical sites. Research foundations and academic neurology centers are a second buyer or channel, while providers may eventually use the same measurement layer for remote monitoring and decision support if regulatory and reimbursement requirements are met. The commercial motion is partnership-led: embed the platform into a sponsor's clinical program, collect standardized assessments, and demonstrate that the biomarkers improve trial sensitivity or biological interpretation. Publicly announced collaborations include Mission Therapeutics' multinational Parkinson's trial, Kariya Pharmaceuticals' Phase II brain-penetrant GLP-1 program, Teitur Trophics' Parkinson's trial, and CHDI Foundation work in Huntington's disease. The company also reported earlier work with NeuroSense Therapeutics and undisclosed pharmaceutical companies. These are meaningful ecosystem and validation relationships, but public sources do not disclose contract values, recurring revenue, per-patient pricing, or a broad commercial customer count. Adoption depends on clinical evidence, sponsor workflow integration, and regulatory acceptance as much as on model accuracy.

**Traction, funding, and third-party validation.** NeuraLight launched from stealth in October 2021 with $5.5 million in seed funding, according to TechCrunch, with MS&AD Ventures, Kli Capital, Tuesday, Operator Partners, and VSC Ventures participating. Startup Nation Central's last public profile records a further $25 million round in May 2022 led by Koch Disruptive Technologies, with Samsung Next TLV and other participants, for $30.5 million in total publicly reported funding. The company has since built a substantial clinical-validation narrative: it announced completion of an international multicenter Parkinson's trial in January 2026, published 2026 results claiming that its biomarkers predicted functional decline, and reported a peer-reviewed publication showing that its measures captured information missed by a Parkinson's gold-standard scale. Its 2026 collaboration announcements place the platform in additional clinical programs rather than only pilot demonstrations. NeuraLight also won Fast Company's 2026 World Changing Ideas Award in the Future of Health category. These signals are encouraging but should be separated from approval or revenue: the reviewed sources do not establish FDA clearance, CE marking, a reimbursed diagnostic product, or audited commercial traction. The company's patent estate is not publicly itemized in the reviewed material.

**Founders and team background.** NeuraLight is led by co-founder and CEO Edmund Ben-Ami, whom the company describes as an award-winning mathematician and repeat entrepreneur with more than two decades of experience in AI algorithms, computer vision, signal processing, and technical team building. Scientific co-founder Gil Shklarski, PhD, previously served as CTO of Thirty Madison and Flatiron Health and is credited by the company with scaling Flatiron's technology organization before its acquisition by Roche. Nobel laureate Thomas C. Südhof is listed as a scientific co-founder, bringing deep expertise in synaptic transmission and Alzheimer's disease, while Olivier Rascol, a Parkinson's specialist and co-developer of a gold-standard disease measurement scale, leads the scientific advisory board. The operating team includes Eitan Raveh, PhD, in clinical partnerships; Ido Tzang in engineering; Ran Rise in product; and research leadership with prior Google and Intel experience. Public company profiles place the headquarters in Tel Aviv and describe an 11–50 person organization, with LinkedIn showing 29 employees at the time of its current profile. The combination of algorithmic, clinical, and pharmaceutical expertise is unusually well matched to translational neurotechnology, though scale and retention of the wider research team remain diligence questions.

**Competitive dynamics.** NeuraLight competes against several different substitutes rather than one direct rival. Traditional neurologist-rated scales and hospital assessments remain the incumbent because they are familiar, clinically interpretable, and embedded in trial protocols even when they are noisy. Laboratory eye trackers and specialized neurophysiology systems compete on measurement precision, while companies such as Rune Labs, Alto Neuroscience, Kneu Health, and Empatica address adjacent digital biomarkers, remote monitoring, or neurological decision support. Pharmaceutical sponsors can also build internal biomarker programs with academic centers, and large clinical-research organizations can bundle endpoint development into broader trial services. NeuraLight's stated edge is a relatively low-friction measurement modality that combines standardized tasks with computer-vision analysis and is designed for repeated use across sites, languages, and workflows. Its longitudinal, disease-specific datasets and scientific advisory network may compound that advantage as more trials generate labeled outcomes. The counter-risk is that eye-movement biomarkers must prove incremental clinical and economic value against established scales, competitors can adopt similar camera-based methods, and trial sponsors may resist adding a novel endpoint unless regulators and principal investigators treat it as decision-grade evidence.

**Defense, security, and resilience dual-use relevance.** NeuraLight's core product is a clinical and pharmaceutical measurement platform, so its defense relevance should not be overstated and the record is marked dual_use=false. The credible strategic adjacency is public-health and human-performance resilience: a camera-based, repeatable neurological assessment could help distributed care networks triage specialist referrals, monitor recovery, and maintain continuity when patients cannot repeatedly travel to major hospitals. In a future, separately validated program, similar measurement could support occupational health or neurocognitive readiness for safety-critical workers, first responders, or service members; that is a potential application, not a disclosed NeuraLight market. The same caution applies to disaster medicine and humanitarian settings: low-hardware assessment is attractive where clinical resources are scarce, but deployment would require robust performance under lighting variation, connectivity constraints, language and demographic differences, and clinical governance. Public evidence reviewed here shows no Ministry of Defense contract, military customer, classified deployment, or defense certification. The strongest present strategic case is therefore resilience in neurological care and clinical-research infrastructure, with only a plausible future path into broader human-performance monitoring.

**Growth stage, trajectory, and key diligence risks.** NeuraLight is classified as mid-stage: it has moved beyond seed-stage concept work, raised a reported $30.5 million, assembled a multidisciplinary team, completed an international multicenter Parkinson's trial, and secured multiple 2025–2026 collaborations with drug developers and the CHDI Foundation. It is not mature because commercial scale, regulatory positioning, reimbursement, and durable revenue are not publicly established. The upside case is that an objective biomarker layer becomes infrastructure for CNS drug development, shortening trials and improving the probability that disease-modifying effects are detected; the partnership sequence suggests sponsors are willing to test that thesis. Key diligence points are (1) independent replication of the claimed sensitivity and prediction results; (2) whether biomarkers improve regulator-accepted endpoints rather than merely correlate with existing scales; (3) data rights, consent, demographic representativeness, and model drift across devices; (4) clinical workflow friction and per-patient economics; (5) regulatory classification and quality-system maturity; (6) conversion of announced collaborations into paid, repeatable contracts; and (7) competition from academic labs, CROs, and better-capitalized digital-biomarker platforms. The next decisive evidence would be a peer-reviewed prospective outcome, a named commercial sponsor with repeat use, regulatory clarity, and disclosed revenue or deployment scale."""
