name = "Epsagon"
description = "Epsagon was an Israel-founded cloud observability startup whose SaaS traced requests through serverless functions, containers, Kubernetes and microservices. Cisco completed its acquisition on 2021-10-08; the asset is now part of Cisco's observability history, with no verified standalone roadmap or current independent economics."
detailed_description = """Epsagon was founded in 2017 by Nitzan Shapira and Ran Ribenzaft, Israeli technology and cyber-intelligence veterans, to monitor applications built from serverless functions and other distributed cloud services. Its early base was in Holon/Tel Aviv; by 2020 it had a New York headquarters and teams in New York, San Francisco and Tel Aviv. Cisco described Epsagon as headquartered in New York when it completed the acquisition in October 2021. These are compatible stages of an Israel-founded company's expansion, rather than evidence that the Israeli connection ended when the US office opened.

The product attacked an operational blind spot in cloud-native software. A customer request could invoke an API, several microservices, managed queues, databases, third-party services and short-lived serverless functions, often without an operator-controlled host on which to install a traditional monitoring agent. Epsagon's SaaS platform automatically instrumented and correlated those paths, displayed application topology and traces, and helped engineers move from an error or latency symptom to the service and transaction responsible. Company materials described support across serverless, containers and Kubernetes and highlighted payload visibility; Cisco later described capabilities spanning metrics, events, logs and traces, with support for open standards. A granted US patent assigned originally to Epsagon Ltd. describes correlating events across distributed resources using shared event fingerprints to produce traces. That patent is evidence of a technical implementation, not evidence by itself of exclusive rights, broad claim coverage, current Cisco ownership in every jurisdiction, or a durable commercial moat.

The reported business model was B2B SaaS, tiered according to the number of traces ingested. This connects usage to application activity and gives the vendor an expansion path as customers add services, but it also makes data volume, sampling, retention and bill predictability important buying questions. The platform competed for budgets held by application performance monitoring and observability teams. Epsagon's CEO named AppDynamics, Dynatrace, New Relic and Datadog as incumbent competitors in 2020. Current products from those vendors combine trace analysis with logs, metrics, service maps and broader operational workflows. OpenTelemetry and cloud-provider monitoring also reduce the cost of assembling a substitute stack. Epsagon's strongest historical distinction was lower setup friction for serverless and microservice systems, including visibility where customers could not access the host, plus payload-level context. Those advantages could shorten time to a useful trace, but the public record does not quantify setup-time savings against competitors, retention, win rates, or pricing power.

Public commercial evidence shows adoption signals but not audited scale. Epsagon's January 2020 financing announcement said its customer base had grown 300 percent over the prior year and named Via Transportation, Volta, Healthline, Freenet Group and Farmer's Fridge; it included a Via engineering manager's account of daily use. The release also described an AWS Advanced Technology Partner relationship and a Retail Competency. In July 2020 CTech reported 40 employees across New York, San Francisco and Tel Aviv. Calcalist reported about 60 employees, about 35 in Israel, and hundreds of clients including Deloitte and Toyota shortly before the acquisition. These are dated company or media reports, not audited employee records, paid-customer counts, contract values or proof of continued deployment after the acquisition. Revenue, ARR, gross margin, retention, customer concentration and post-close product continuity remain undisclosed in the sources reviewed.

Cisco announced its intention to acquire Epsagon in August 2021 and completed the transaction on October 8, 2021. Cisco's completion notice said the team and technology would complement its full-stack observability work across application, infrastructure, network and security telemetry. Israeli and international media reported a price near $500 million; Cisco's official completion page does not give consideration, and TechCrunch reported that Cisco would not confirm that figure. The reported $500 million should therefore remain a press-reported transaction price, not a company-confirmed purchase price. CTech also reported that Epsagon had been close to a Series B described as tens of millions of dollars at a $200 million valuation, but chose Cisco's offer; neither the target amount nor whether the valuation was pre- or post-money was reported, and the proposed financing did not close. It is not raised capital and is excluded from funding totals.

The company is an acquired asset, not an independent investment target. Cisco's acquisition demonstrates strategic interest in its tracing team and product, while the public evidence does not show which Epsagon modules remain separately sold, how its customers migrated, what proportion of the engineering team transferred, or whether the original SaaS can still be deployed. Cisco maintains an Epsagon support page, but that alone does not establish current standalone availability or a roadmap. The patent record lists Cisco Technology Inc. as a current assignee alongside Epsagon LLC; Google Patents itself warns that assignee data may be inaccurate, so assignment should be verified in official patent records before relying on it.

Commercial use is straightforward: engineering and site-reliability teams use request traces to diagnose slow or failing services and protect application availability. There is also a credible, indirect defense and security application where military, intelligence, public-sector or critical-infrastructure organizations operate distributed logistics, identity, communications or administrative software. Correlating failures across service dependencies can help operators restore these systems during incidents. This is operational resilience, not endpoint protection, threat detection or a mission system. No public evidence located in the targeted searches establishes Epsagon defense customers, government contracts, classified deployments or security certifications. Payload visibility also creates a diligence issue: trace data may contain sensitive fields, so deployment architecture, redaction, access control, retention, tenant boundaries and data residency matter. Suitability for disconnected, sovereign or classified environments cannot be assumed from the historical commercial SaaS product."""
