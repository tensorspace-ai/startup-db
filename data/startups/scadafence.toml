name = "SCADAfence"
description = "SCADAfence developed OT and IoT cybersecurity software for asset discovery, network visibility, anomaly detection, and threat monitoring in industrial environments. Honeywell acquired the company in 2023 and now presents the relevant capability through Honeywell Cyber Insights, so this record represents an acquired Israeli technology asset rather than an independent startup."
detailed_description = """
SCADAfence built software for operational technology (OT), industrial control system (ICS), and industrial IoT environments in which ordinary IT security assumptions are inadequate. Its core proposition was passive, protocol-aware visibility: discover devices and their communication relationships, establish a baseline for normal industrial behavior, and identify suspicious activity without installing agents or making disruptive changes to production equipment. The resulting capability is intended to give site operators and security teams a near-real-time view of assets, vulnerabilities, communication patterns, indicators of compromise, and anomalous behavior. That matters because many plants contain long-lived PLCs, controllers, engineering workstations, and proprietary systems that cannot be patched or rebooted on an IT timetable.

The product category serves industrial companies that need security evidence without compromising safety or availability. Relevant environments include manufacturing lines, power and energy facilities, water and wastewater systems, oil and gas operations, chemical plants, pharmaceuticals, and building-management systems. Honeywell's current Cyber Insights materials describe automated asset discovery, broad protocol coverage, passive threat and anomaly identification, and a security engine using an adaptive baseline intended to reduce false positives. These are useful commercial capabilities, but they should be read as product positioning rather than proof of a specific detection rate, customer count, certification, or incident-prevention outcome. Public evidence supports the conclusion that SCADAfence had a real product and market traction before acquisition; it does not establish current standalone revenue or an independently reported customer base.

SCADAfence operated in a technically crowded and demanding market alongside Claroty, Nozomi Networks, Dragos, Radiflow, and other OT-security vendors, while also competing with industrial automation suppliers and broader security platforms that add OT visibility. Differentiation depends less on a single machine-learning claim than on protocol depth, asset-inventory accuracy, deployment safety, integration with existing SOC workflows, useful prioritization, and the ability to operate across heterogeneous sites. Honeywell announced in July 2023 that it would acquire SCADAfence and integrate its portfolio into Honeywell Forge Cybersecurity+. Honeywell's 2024 annual-report materials state that 100% of SCADAfence's outstanding equity interests were acquired on August 25, 2023. The current official destination is Honeywell Cyber Insights, an on-premises, site-specific OT solution, with Cyber Watch providing a broader multi-site governance and monitoring context. This provides distribution, industrial domain access, and support infrastructure, but removes the company as an independent venture-scale investment opportunity.

The national-security case is credible but should be framed as critical-infrastructure resilience rather than direct military capability. Electric grids, water systems, fuel production, transport, manufacturing, and defense supply chains all depend on industrial processes whose compromise can create safety, economic, and continuity consequences. Passive monitoring and early warning can help operators detect unauthorized remote access, unusual control traffic, lateral movement, or changes in device behavior before an incident becomes an outage. The same capability can support government-owned utilities, defense industrial-base suppliers, and other strategically important operators, but the record contains no verified claim that SCADAfence itself supplied a military customer or a classified system. Its strategic significance is therefore indirect and infrastructure-focused: Israeli OT-security engineering was absorbed into a major industrial vendor with global deployment reach.

The principal diligence question is not whether the technology is relevant; it is whether Honeywell continues to invest in, update, and successfully deploy the acquired capability as industrial networks, protocols, regulations, and attacker tradecraft evolve. Independent assessments should examine current product lifecycle, supported protocols, detection validation, deployment architecture, vulnerability-management practices, data residency, integration boundaries, and customer references. The acquisition is positive evidence of strategic validation, but it also means product decisions, financial performance, staffing, and roadmap visibility are now controlled by Honeywell rather than disclosed by SCADAfence as a standalone company.
"""
