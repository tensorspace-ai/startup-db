name = "GreenTidio"
description = "GreenTidio is a Jerusalem-based Hebrew University spin-off developing a low-temperature, low-carbon process for manufacturing titanium dioxide (TiO2), a critical white pigment and functional material used across paints, plastics, coatings, cosmetics, optics, and industrial products. Its superoxide-radical chemical oxidation process is designed to produce high-purity TiO2 at room temperature and atmospheric pressure while reducing energy use, carbon emissions, waste, and plant complexity."
detailed_description = """
**Product and the concrete problem it solves.** GreenTidio is targeting an unglamorous but strategically important industrial bottleneck: titanium dioxide is one of the most widely used white pigments and functional materials in the world, yet conventional production is energy-intensive, capital-intensive, and environmentally burdensome. The established sulfate and chloride routes depend on high-temperature processing, large plants, significant infrastructure, and waste streams that are difficult to manage. This matters well beyond paint. TiO2 is used in plastics, coatings, cosmetics, paper, optical products, and other manufactured goods, so the economics and environmental profile of its production flow through a large number of downstream supply chains. GreenTidio's proposition is a modular process that can either be integrated into existing sulfate or chloride plants or operated as a standalone manufacturing unit. The company says the process can produce high-purity rutile and anatase grades from common industrial feedstocks, including ilmenite and titanium-containing intermediates, in minutes rather than through the longer and hotter conventional pathways. The concrete customer problem is therefore not simply emissions reduction: it is how to make a globally important material with less energy, less waste, lower capital intensity, and more geographically distributed production capacity.

**Core technology and how it actually works.** The company's technical approach is a proprietary chemical oxidation process based on superoxide radicals. GreenTidio describes a reaction that converts raw materials such as ilmenite, TiCl4, and TiOSO4 into titanium dioxide under room-temperature and normal-pressure conditions. The key process claim is that reactive oxygen chemistry supplies the oxidation pathway without requiring the extreme heat associated with conventional TiO2 manufacturing. The official technology page presents the process as rapid, modular, and suitable for retrofit alongside legacy sulfate and chloride plants, rather than requiring every customer to replace an entire production complex. GreenTidio reports up to 90% lower energy consumption, 75% lower carbon footprint, and 70% lower production cost versus conventional production; these are company-stated targets and should be treated as hypotheses requiring independent pilot and lifecycle validation. The technical platform also aims to avoid hazardous waste and preserve product purity and grade, which is essential because a lower-carbon pigment that fails optical, particle-size, or formulation requirements would not displace incumbents. The chemistry originates in research associated with Professor Yoel Sasson's Hebrew University group, while GreenTidio presents Dr. Uri Stoin, Professor Sasson, and Dr. Avraham Keningsberg as the core scientific team. The public record supports an academic and scientific foundation, but does not disclose a complete patent-family list, pilot mass balance, reactor dimensions, or independently audited process data.

**Market, customers, and go-to-market.** GreenTidio sells into a B2B industrial market rather than directly to consumers. The immediate customer set includes established TiO2 producers, specialty-chemical manufacturers, paint and coatings companies, plastics processors, cosmetics and optical-material suppliers, and industrial users that want lower-carbon or locally produced pigment. The go-to-market has two plausible routes: license or retrofit the process into an existing producer's plant, or deploy a GreenTidio-designed modular unit as a standalone production asset. The retrofit route could reduce adoption friction because it allows a customer to preserve existing feedstock procurement, downstream formulation relationships, and distribution while adding a lower-energy process module. The standalone route could matter for regional manufacturing and supply-chain resilience, particularly where customers want to reduce dependence on a small number of large global TiO2 plants. GreenTidio's public orders page indicates that it is prepared to discuss supply or orders for rutile and anatase material in different particle-size ranges, and lists its Jerusalem location and company contact details. That is a commercialization signal, not proof of recurring revenue: no named paying customer, contract value, annual production volume, qualification timeline, or repeat-order rate is publicly disclosed. Industrial qualification will likely require customers to validate whiteness, opacity, particle morphology, surface treatment, consistency, impurity control, and compatibility with their formulations before switching meaningful volume.

**Traction, funding, and third-party validation.** GreenTidio was established in 2025 and is publicly listed by Startup Nation Finder as having raised $1.5 million across two rounds, including a pre-seed round associated with NetZero Tech Ventures and non-dilutive support from the Israel Innovation Authority. The Innovation Authority's own company page identifies GREEN-TIDIO LTD, registration number 517168126, as an Israeli cleantech company established in 2025 with five employees and a low-energy, lower-carbon TiO2 production process. The company says it is backed by the Innovation Authority and NetZero Ventures, and NetZero's portfolio communications identify GreenTidio as a portfolio company transforming the TiO2 market through low-cost, green manufacturing. GreenTidio also reports being a finalist in ClimateLaunchpad 2025 and selected as a Deep Tech Pioneer by Hello Tomorrow from more than 4,800 applications across 108 countries. Its CEO was listed as a speaker at the 2026 TiO2 World Summit, alongside executives and scientists from incumbent pigment producers, which is a useful ecosystem signal even though it is not independent product validation. The most important calibration is that public evidence currently demonstrates a credible company, scientific narrative, ecosystem backing, and product availability discussion, but not a scaled plant, audited emissions reduction, commercial production run, or disclosed revenue. GreenTidio's performance claims should therefore be recorded as promising but unverified until customers or independent laboratories publish results.

**Founders and team background.** The team has a credible fit to the chemistry and industrial scale-up problem. Dr. Uri Stoin is listed as co-founder and CEO; GreenTidio describes him as a co-inventor of more than 30 patents and a co-founder of several startups in Israel and Europe, with experience in environmental chemistry, catalysis, and industrial innovation. Professor Yoel Sasson is listed as co-founder and chief scientific officer, a professor of environmental catalysis at the Hebrew University and a co-founder of several Israeli startups. Dr. Avraham Keningsberg is identified as senior scientist with materials-engineering and chemistry experience. GreenTidio describes itself as a high-tech spin-off from the Hebrew University of Jerusalem, which gives the company an academic technology-transfer anchor and helps explain why its early differentiation is centered on reaction chemistry rather than on a conventional software layer. The team composition is appropriate for proving the core process, but public biographies do not establish a large manufacturing, regulatory, commercial-qualification, or project-finance organization. This distinction matters: the company may have a strong scientific nucleus while still needing to recruit the people who can design safe industrial reactors, qualify product at customer scale, secure permits, manage hazardous feedstocks, and deliver plants with predictable uptime. The public record also does not independently verify the full patent portfolio or clarify which inventions are assigned to GreenTidio, the university, or earlier affiliated entities.

**Competitive dynamics.** GreenTidio competes against both large TiO2 producers and the incumbent production methods those companies operate. **Chemours** is a major producer using the chloride process and has extensive customer qualification, manufacturing, and distribution infrastructure. **Tronox** operates integrated sulfate and chloride production across multiple geographies and competes through scale, product consistency, and downstream relationships. **Venator Materials** is a global pigment supplier with established grades and customer applications. **LB Group** is a large Chinese producer with significant manufacturing capacity and cost advantages in several markets. **Kronos Worldwide** competes as an established TiO2 producer with long operating history and qualified product lines. The incumbent approach is not only these companies but the conventional sulfate and chloride process itself: it is well understood, financeable, and embedded in customer specifications even when it is energy-intensive. GreenTidio's claimed edge is architectural: superoxide chemistry at room temperature and normal pressure, modular deployment, potential retrofit compatibility, and lower energy and carbon intensity. That could create a wedge where a customer values distributed capacity or lifecycle savings more than the absolute lowest near-term pigment price. It is not yet a durable moat. Large producers can improve their own processes, acquire alternative chemistry, or use their plant scale and customer relationships to blunt a new entrant. GreenTidio must prove that product quality, safety, throughput, maintenance, and total cost survive industrial scale-up.

**Defense, security, and resilience dual-use relevance.** GreenTidio's dual-use case is real but should be framed as strategic-materials and industrial-resilience adjacency rather than a fielded defense capability. The Israel Innovation Authority identifies aerospace, defense, and energy-storage supply chains among the targeted customer contexts for the company's TiO2 process. TiO2 and TiO2-derived materials appear in coatings, polymers, optical applications, and other engineered products that can be relevant to aerospace and defense manufacturing, while the company's lower-energy process could help reduce exposure to concentrated global pigment supply chains. A modular and potentially retrofit-compatible plant also has resilience value: regional producers could add capacity closer to customers, reduce dependence on large centralized facilities, and continue manufacturing essential goods under energy-price shocks, shipping disruption, or geopolitical trade restrictions. Lower process temperatures and reduced waste, if independently demonstrated, could also simplify the energy and environmental burden of producing materials used by critical industries. The limits are important. No public source identifies a defense customer, military contract, government procurement program, defense certification, or fielded military application. GreenTidio is not a weapons company, and its current commercial thesis is clean industrial manufacturing. The correct assessment is that its core materials-production technology can serve civilian and defense-adjacent supply chains, and that local, lower-energy production of a widely used industrial material has resilience value; it is not evidence of operational defense traction.

**Growth stage, trajectory, and key diligence risks.** GreenTidio is early-stage: it was founded in 2025, has a five-person public profile, is described as pre-seed or initial-revenues/R&D in ecosystem records, and has disclosed modest early funding relative to the capital required for a chemical-production scale-up. The attractive trajectory is clear if the process works as claimed: demonstrate continuous operation, qualify rutile and anatase grades with an industrial customer, validate lifecycle and emissions performance, then license or deploy modular units into existing producers and strategic-materials supply chains. The key diligence risks are equally specific. (1) **Process scale-up:** reaction kinetics, heat and mass transfer, impurity control, corrosion, solids handling, and reactor uptime may change materially between laboratory chemistry and a continuous plant. (2) **Product qualification:** customers may require long qualification cycles and consistent performance across pigment grades, surface treatments, and formulation environments. (3) **Environmental verification:** the company must independently substantiate energy, carbon, hazardous-waste, and residue claims, including the full lifecycle rather than only the reactor step. (4) **Capital intensity:** even a low-temperature process may require expensive feedstock handling, separation, finishing, safety systems, and plant commissioning. (5) **Incumbent response:** global producers have scale, patents, customer trust, and the resources to defend their installed processes. (6) **IP posture:** the public record describes proprietary and IP-protected technology but does not provide enough detail to assess freedom to operate, patent term, or university rights. (7) **Commercial proof:** orders-page availability and ecosystem recognition are not substitutes for named customers, paid production, repeat orders, or audited unit economics. GreenTidio merits active monitoring because its scientific basis, industrial problem, strategic-materials relevance, and ecosystem support are unusually well aligned; priority should rise only after independent process data and commercial qualification are visible.
"""
