priority_rationale = "MayMaan deserves watch-list inclusion because its Israeli-origin engine technology addresses a strategic bottleneck shared by civilian infrastructure and defense-support operations: reliable power when the grid, fuel logistics, or fixed infrastructure is constrained. Positive signals include a long patent history, named generator products, reported FEV evaluation, a Vattenfall/Feenstra European route, and the September 2026 Motul partnership. Priority is capped by high technical, regulatory, manufacturing, and commercialization risk; the public record still lacks independent full-duty-cycle data, disclosed revenue, production scale, and verified defense adoption. The next evidence that should change priority is third-party emissions and durability testing, repeat customer shipments, a transparent OEM licensing pipeline, and a documented deployment at a critical or defense-support site."

