investment_rationale = "MayMaan merits strategic diligence because it combines a long-lived patent and prototype history with a current productization push, a European demonstration channel, and an announced Motul supply partnership. The main evidence gap is commercial and technical reproducibility: public sources do not establish current revenue, production volume, full-load lifecycle data, independent emissions certification across the portfolio, or the economics of the water-bioalcohol supply chain. The company is therefore a monitoring and partnership-mapping candidate, not an investment recommendation or a conclusion that the technology has achieved market fit."
strategic_value = "MayMaan's strategic value comes from dispatchable power that could be deployed without waiting for a new grid connection or a large battery installation. If the claimed performance is independently verified, a liquid-fuel system with lower local emissions and familiar engine manufacturing could strengthen resilience for telecom, water, medical, data-center, and remote industrial infrastructure. The value is bounded by fuel availability, regulatory acceptance, maintenance behavior, manufacturing scale, and the absence of publicly confirmed defense deployments. Its strongest strategic role today is as an Israeli-origin alternative-power technology to diligence alongside batteries, hydrogen, diesel, and microgrid solutions."

