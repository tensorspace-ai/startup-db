name = "MayMaan"
description = "MayMaan is an Israeli-origin clean-energy startup developing AquaStroke, a proprietary internal-combustion platform that runs on a 70% water and 30% bio-alcohol blend. Its generators and engine-conversion technology target reliable lower-emission power for backup, off-grid, data-center, EV-charging, and other infrastructure applications."

detailed_description = """MayMaan is commercializing AquaStroke, a water-bearing fuel and engine platform intended to address a stubborn infrastructure problem: organizations still need dispatchable power when grids fail, renewable generation is intermittent, or a site cannot wait for a permanent connection, but diesel generators bring fuel dependence, local air pollution, noise, maintenance burden, and increasingly difficult emissions constraints. MayMaan's public product materials describe generators and power systems using a blend of approximately 70% water and 30% ethanol or other bio-alcohol. The company is positioning the system as a practical alternative for backup and distributed generation rather than as a replacement for every source of electricity. Its current public product direction includes compact standby generation, larger generator platforms, EV charging, and licensing to manufacturers or integrators.

The technical proposition is more specific than simply adding water to a conventional engine. MayMaan says AquaStroke combines a proprietary fuel formulation with a redesigned internal-combustion cycle, custom pistons and camshaft geometry, a tailored compression ratio, specialized coatings, and an electronic control unit called MM Intelligence. The company describes the water-bearing fuel as producing steam within a controlled combustion process, with software managing injection, combustion behavior, diagnostics, and performance logic. Its product pages also identify a proprietary lubricant designed for water management, corrosion protection, emulsion resistance, and stability in this operating environment. Independent technical detail remains limited, so the appropriate reading is that MayMaan has built a specialized engine-fuel-control system around wet-alcohol combustion, not that water itself is an energy source. The long-standing patent record includes claims covering water-based fuel mixtures, engine operation, piston rings, and wet-alcohol combustion systems.

MayMaan's market strategy is an infrastructure and channel strategy. The company identifies data centers, EV-charging infrastructure, generators, transportation, industrial sites, and off-grid facilities as target markets, where dispatchability and deployment speed can matter more than the absolute lowest theoretical energy cost. Its own materials describe a modular path from roughly 35 kW units to 3 MW and beyond, using shared core components and a drop-in integration model intended to reduce the need for entirely new infrastructure. The European AquaStroke initiative, operated by Feenstra in collaboration with Vattenfall and MayMaan Research, gives the company a concrete route into the European backup-power market. That program presents the AquaStroke 35 kW as an emergency or standby generator for critical loads such as IT, telecom, and pumps, while the MayMaan site emphasizes licensing and integration support for engine manufacturers, equipment makers, distributors, and strategic partners.

The traction picture contains meaningful validation signals but not enough evidence to call the business de-risked. A 2023 Israeli government export-delegation profile described MayMaan as a technology-development company with globally registered patents, generator products moving toward manufacturing, and third-party evaluation by FEV Group. The same profile listed generator and EV-charging products and said the technology had attracted interest from strategic customers, although it did not name contracts, revenue, volumes, or independent test results. The European partner site now presents a demonstrable 35 kW standby product and says a Rotterdam test location offers technical demonstrations, performance data, and emissions-measurement discussions. In September 2026, MayMaan announced an exclusive approved-lubricant partnership with Motul, a useful supply-chain and warranty-readiness signal. These milestones show sustained productization and partner development; they do not establish broad commercial deployment, validated lifecycle economics, or repeatable emissions compliance across all engine sizes.

The company has a distinctive family-led technical and entrepreneurial history. Public biographies identify founder and CEO Doron Shmueli, President Eitan Shmueli, and engineer Yehuda Shmueli, with MayMaan's water-based engine research emerging from the family's long-running development effort. Doron has described an Israeli Defense Force background working on F-16 and Phantom aircraft, while Eitan's public professional profile connects him to MayMaan's leadership and earlier engineering and business activity. Patent records list Yehuda, Eitan, and Doron as inventors on multiple engine and combustion applications, giving the company an unusually clear link between founder identity and its core intellectual property. Earlier reporting also identified former Rafael president and CEO Yedidya Yaari among the company's advisers. The team story is therefore credible as hands-on mechanical engineering and defense-adjacent aviation experience, but the public record does not provide a complete current employee count, manufacturing organization, or independent technical leadership map.

Competitive dynamics are unusually broad because MayMaan is contesting several incumbent approaches at once. Its direct substitutes include diesel and natural-gas generator sets from Caterpillar, Cummins, and Rolls-Royce Power Systems; battery energy-storage systems from Tesla and Fluence; hydrogen fuel-cell systems from Plug Power and Bloom Energy; and microturbines or other distributed-generation products from Capstone Green Energy. Customers can also use solar-plus-storage, grid upgrades, demand response, or conventional rental generators depending on the duty cycle. MayMaan's potential edge is a combination of high energy density, dispatchability, compatibility with familiar engine and generator manufacturing, a fuel blend that is reported as non-flammable outside the engine, and a control system designed around the unusual combustion environment. That edge is only durable if independent tests verify emissions, fuel consumption, maintenance intervals, noise, component life, and total cost of ownership under realistic load profiles.

The dual-use and resilience case is credible at the infrastructure layer, but it should be expressed carefully. Reliable mobile or fixed generation can support telecom shelters, water and wastewater pumps, data centers, hospitals, emergency-response staging areas, remote industrial facilities, border and field-support sites, and temporary EV-charging or logistics nodes. A lower-emission generator using a storable liquid blend could reduce some local pollution and fuel-logistics pressure relative to diesel, while retaining the fast dispatch behavior that batteries may not provide for long outages. Earlier coverage explicitly discussed applications in heavy machinery and military vehicles, and the company has Israeli defense and aviation lineage, but no reviewed source establishes an IDF contract, a fielded military platform, or a defense certification. The correct assessment is therefore substantive dual-use potential through resilient power and engine technology, with defense relevance still prospective rather than proven procurement traction.

MayMaan is best treated as a mid-stage commercialization effort with high technical and execution risk. It has been developing the platform for more than a decade, has a visible patent history, public generator products, a European demonstration and commercialization channel, and a fresh Motul supply agreement. At the same time, the public evidence does not disclose current revenue, production volume, customer names beyond ecosystem partners, independent full-duty-cycle testing, financing totals, or a complete roadmap from pilot units to scaled manufacturing. The principal diligence questions are: (1) whether third-party testing reproduces the claimed emissions and efficiency performance; (2) how ethanol or methanol sourcing, purity, storage, and lifecycle emissions affect the economics; (3) whether water management and corrosion shorten service life; (4) which patents remain enforceable and where freedom to operate is clear; (5) how the system performs at 120 kW, 3 MW, and larger scale; (6) what regulatory approvals apply in each target market; and (7) whether OEM licensing creates repeatable distribution or dependence on a few partners. The opportunity is strategically interesting because dependable lower-emission power is increasingly valuable, but the record should remain calibrated until independent operating data and commercial shipment evidence appear."""

