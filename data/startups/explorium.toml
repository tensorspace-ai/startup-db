name = 'Explorium'
description = "Explorium is a Tel Aviv-based enterprise data infrastructure company providing comprehensive B2B data APIs, intelligence signals, and enrichment capabilities for AI agents, predictive analytics, and sales/risk modeling workflows."
detailed_description = """Explorium operates as a multi-sourced enterprise data API platform and infrastructure layer for predictive intelligence. The company aggregates data from 100+ sources across 146 million business entities, 767 million professional profiles, 90 million geospatial datapoints, and 4,000+ custom data signals. The core offering provides structured, API-first access to business firmographics, technology intelligence, hiring signals, event data, intent signals, and contact information tailored for machine learning operations, sales operations, and intelligence workflows.

The platform has evolved into a specialized infrastructure layer for AI agent deployments, particularly sales development and account intelligence workflows. Explorium positions its APIs (including Model Context Protocol and Server-Sent Events capabilities) as building blocks for AI SDR agents, enabling autonomous or agent-assisted prospecting, lead enrichment, account targeting, and signal synthesis. Customers include enterprise SaaS platforms (Outreach, Clay, Common Room), marketing technology firms (Bombora, Taboola), and large enterprise data consumers (PepsiCo, Deloitte, Pepsico).

Commercially, Explorium charges on a per-data-access or subscription model, licensing data access and API compute. The company achieved Series C funding with institutional backing and operates a global customer base spanning GTM automation, business intelligence, predictive analytics, and risk modeling. The platform's data aggregation and enrichment capabilities provide competitive advantage through breadth, freshness, and API-native architecture that scales across commercial verticals.

From a dual-use perspective, Explorium's data synthesis and enrichment infrastructure has substantive applications in intelligence analysis, risk scoring, target identification, and situational awareness workflows relevant to national security, defense research, and cybersecurity contexts. External data synthesis, lead intelligence, intent detection, and entity graph capabilities support both commercial and defense-adjacent decision-support and forecasting requirements. However, the company operates as a commercial data provider with civilian customer concentration; there are no publicly visible defense contracts or government agency relationships signaled in its positioning."""
