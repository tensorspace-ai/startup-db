dual_use_description = "Software supply chain integrity is critical infrastructure for both commercial and government/defense software development. JFrog's core technology directly serves dual-use requirements: artifact governance, cryptographic provenance controls, and policy enforcement at the artifact supply chain level support government DevSecOps mandates (EO 14028, NIST SP 800-53), defense contractor compliance (CMMC, DFARS supply chain security), and federal acquisition regulation requirements for SBOM and vulnerability tracking. The company's support for on-premises, air-gapped, and restricted-network deployments is particularly relevant for classified and sensitive mission software development where cloud-based artifact registries are not acceptable. JFrog Xray's vulnerability and license policy scanning directly addresses federal software composition analysis mandates. Deployment use cases include defense primes (Lockheed, Raytheon, Northrop), national laboratories, federal agencies, and critical infrastructure operators in ally nations who require trusted artifact custody."
