investment_rationale = "LiGenerate is a high-upside, evidence-constrained deep-tech priority signal, not an investment recommendation. (1) The problem is strategically durable: battery and industrial supply chains need more resilient access to critical metals, and black mass often loses value when exported for centralized treatment. (2) The technical thesis is specific: a low-temperature, single-step, closed-loop reduction platform could reduce energy, reagent, wastewater, and equipment complexity compared with incumbent pyro- and hydrometallurgy. (3) The team is unusually aligned to the problem for its size, combining physical chemistry, battery expertise, process engineering, materials fabrication, and deep-tech scale-up. (4) Validation is early but real: the Israel Innovation Authority records the company and its R&D activity, Earth & Beyond Ventures backs it, public profiles report a Pre-Seed round, and company demonstrations include high-purity cobalt and nickel products. The counterweights are decisive: laboratory results are not a continuous pilot; there is no disclosed paying customer, offtake, audited mass balance, environmental permit, or commercial throughput; the public financing record is ecosystem-reported; and the team must scale from a four-person research group into industrial operations. The appropriate diligence focus is pilot data, feedstock breadth, reagent economics, product qualification, permitting, and financing runway."
