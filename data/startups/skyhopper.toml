name = "SkyHopper"
description = "SkyHopper is Mobilicom's family of cybersecure software-defined-radio datalinks and related communications products for drones, loitering munitions, robotics, and other autonomous platforms. It is a product line rather than an independently verifiable startup, so this record should be read as a strategic technology reference to Mobilicom."
detailed_description = """SkyHopper is a communications product family developed and commercialized by Mobilicom, an Israeli provider of wireless, networking, and cybersecurity solutions for drones, robotics, and autonomous platforms. The family includes products such as SkyHopper PRO, SkyHopper Micro, SkyHopper MultiBand, and the newer SkyHopper Tactical. Across the range, the core proposition is a bidirectional software-defined-radio datalink that carries command, control, telemetry, video, and payload data between an unmanned platform and its operators. Product pages describe point-to-point, point-to-multipoint, mesh, and relay modes, with compact embedded and OEM variants intended for size, weight, power, and cost constrained platforms. The technology is therefore a mission communications subsystem, not an autonomous aircraft, sensor, or complete drone operating system.

The engineering problem is important because unmanned systems lose much of their operational value when the communications link is unreliable, observable, or difficult to integrate. SkyHopper products are positioned for non-line-of-sight operation, real-time high-definition video, low-latency control, and operation in congested or contested radio-frequency environments. Mobilicom markets an ICE security layer covering immunity, cybersecurity, and encryption, while the 2026 MultiBand announcement emphasizes a broad 1.275-2.65 GHz operating range for adaptive frequency selection. The Tactical product page also describes cognitive frequency management, self-healing relay configurations, ruggedization to MIL-STD-810, and IP67 protection. These claims establish a credible dual-use technical adjacency, although independent test data, link-budget details, spectrum approvals, and performance under deliberate electronic attack remain important diligence items.

The addressable customer set is primarily original-equipment manufacturers, system integrators, government users, and operators of small unmanned aircraft and compact robotic systems. Commercial and civil applications include infrastructure inspection, industrial monitoring, emergency response, public safety, and operations in urban or remote areas where cellular coverage is unreliable. Defense and security applications include persistent command-and-control for small UAS, ISR video and telemetry, loitering-munition control, dismounted operator links, and communications for robotic platforms. Public Mobilicom materials report product selection or orders involving major drone manufacturers, the Israeli Ministry of Defense, and U.S. defense-related integration; those statements are company-reported and should be verified through contracts, customer references, delivery volumes, and repeat-order economics rather than treated as independently audited traction.

Competition comes from specialized resilient-datalink vendors such as Doodle Labs and Silvus Technologies, vertically integrated drone and robotics manufacturers, and established defense communications suppliers that can bundle radios into larger programs. Mobilicom's apparent advantages are a focused UAS communications portfolio, compact form factors, multiple transmission modes, cybersecurity positioning, and the ability to sell across commercial and defense OEM channels. The main commercial question is not whether resilient UAS communications matter, but whether Mobilicom can convert design wins and product demonstrations into repeatable production volumes while protecting margins against larger suppliers and customer insourcing. SkyHopper should consequently be analyzed as a strategically relevant product family inside a public company, not as a standalone Series A venture with separately attributable employees, financing, or valuation."""
