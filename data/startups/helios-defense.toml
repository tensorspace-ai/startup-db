name = "Helios"
description = "Helios Project is an Israeli deep-tech startup developing metallurgical processes for low-carbon iron and metal production, alongside lunar-resource systems intended to extract oxygen and useful metals from regolith. Its terrestrial opportunity is green iron from difficult feedstocks; its space opportunity is in-situ resource utilization (ISRU) for future lunar infrastructure."
detailed_description = """
Helios began as a space-resource company attempting to produce oxygen from lunar soil, where every kilogram launched from Earth has a severe logistics penalty. The company’s public materials describe two related process concepts: a sodium-based Helios Cycle for reducing metal oxides and recovering sodium in a closed loop, and a molten-regolith-electrolysis reactor for separating oxygen and metals from lunar material. The best-supported terrestrial work concerns the sodium metallothermic route for iron. It is intended to produce iron with oxygen rather than a carbon-bearing process product, while reducing reagent consumption through recovery and recycling. The company also presents the broader platform as relevant to other metals, but public evidence is less mature for those applications than for iron and lunar oxygen.

The immediate commercial market is steel decarbonization. Helios targets iron ores that are lower grade or otherwise difficult for conventional routes, as well as tailings, slags, red mud, and other iron-bearing residues. This feedstock flexibility could matter as high-grade ore becomes more constrained and steelmakers seek lower-emission inputs. However, claims about lower energy use and zero direct carbon emissions are process-level claims, not proof of lower full-system emissions or competitive cost. A steel customer would need repeatable metallisation, acceptable impurity levels, predictable product quality, reagent recovery, safe handling, and integration with existing furnaces or downstream operations. Those requirements make continuous operation and independently measured mass and energy balances more important than a successful laboratory batch.

Commercialization evidence is meaningful but remains pre-scale. Helios has publicly disclosed seed-stage development, support from Israeli space and innovation institutions, participation in DARPA’s LunA-10 capability study, and an HILT CRC project that tests its sodium-based process on Australian iron-bearing materials. The HILT project summary describes laboratory trials, solid-liquid separation and sodium recovery, with a stated objective of moving the work from TRL 3 toward TRL 4. Helios and BlueScopeX have also announced a memorandum of understanding for a planned green-iron demonstration beginning in 2026. These signals show external technical and industrial engagement, but they do not establish a binding offtake agreement, recurring revenue, a commercial plant, or bankable economics. The key diligence question is whether pilot data converts partner interest into a repeatable qualification and scale-up program.

Helios competes with hydrogen direct-reduced iron, molten-oxide electrolysis, plasma and other electrochemical reduction methods, scrap-based electric-arc-furnace routes, and incumbent blast-furnace systems with efficiency or carbon-capture improvements. The sodium route may offer an advantage where hydrogen availability, ore quality, or electrical-load requirements constrain alternatives, but sodium inventory, corrosion, separation, contamination, and process safety could erase that advantage. The space program creates strategic relevance because oxygen and metal production from lunar regolith are enabling capabilities for cislunar logistics, yet it also depends on uncertain launch economics, lunar power and mobility infrastructure, and government or commercial demand. Public evidence supports a substantive dual-use adjacency through space infrastructure and strategic-material resilience, not a claim that Helios is already a defense contractor or military supplier.
"""
