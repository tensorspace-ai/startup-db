investment_rationale = "Helios is a credible strategic-priority signal for a dual-use deep-tech database because its process platform links industrial decarbonization, critical-material resilience, and lunar ISRU. The opportunity is technically differentiated and has external research and steel-industry engagement, but it remains an early validation-stage company rather than a commercially proven platform. Diligence should concentrate on independent mass and energy balances, sodium recovery and safety, product quality, continuous-operation data, capital required for scale-up, permitting, and conversion of pilot relationships into paid qualification or offtake."
strategic_value = "Helios could improve industrial resilience if it can produce consistent iron from lower-grade or waste feedstocks with materially lower emissions and acceptable cost. Its lunar capability is strategically relevant as an enabling node for cislunar logistics: locally produced oxygen and metals could reduce dependence on Earth-launched mass. The DARPA LunA-10 study places the company in a serious government-led lunar architecture discussion, but the public record does not justify treating that participation as a defense contract. Strategic value therefore depends on technical validation, allied industrial adoption, and the emergence of a funded lunar market."
