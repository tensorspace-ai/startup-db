name = 'Deep Optics'
description = "Deep Optics (legal entity: Optica Amuka (A.A.) Ltd.) is an Israeli eyewear and optics company developing electronically adjustable liquid-crystal lenses. Its best documented product is 32°N, adaptive-focus sunglasses that switch between sun and reading modes. The public record shows a $4 million Series A in 2016 and an undisclosed Series C led by Fielmann Ventures in 2022; current operating activity is uncertain."
detailed_description = """Deep Optics, also known as DeepOptics and incorporated in public company references as Optica Amuka (A.A.) Ltd., is an Israeli optics business headquartered in Petah Tikva. Techtime reported that it was founded in 2011; some older directory and profile records use later dates, so 2011 is the best sourced founding year rather than a verified registry date. The company developed pixelated liquid-crystal lenses whose optical power can be electrically adjusted, with the goal of changing near-focus correction without conventional mechanical lens movement. Company and investor materials describe a protected technology platform, but public sources reviewed here do not establish the breadth, ownership chain, remaining term, or current enforceable status of its patent estate.

Its clearest product evidence concerns 32°N, consumer adaptive-focus sunglasses for people who want reading magnification outdoors. The 2021 Kickstarter campaign raised $314,852 from 1,204 backers against a $25,000 goal. Deep Optics later delivered at least an initial batch to backers, according to a company post, and its CEO told Entrepreneur in 2024 that more than 1,200 pairs had been sold. These are meaningful productization signals, although crowdfunding pledges, company-reported sales, retail sell-through, returns, gross margin, and repeat demand are different measures. Vision Expo coverage in 2024 documents a public US launch and demonstrations. The company described US optical-store distribution as a goal; the sources reviewed do not establish that this plan reached broad distribution or generated material revenue.

The operating evidence has since weakened. Fielmann Group's 2025 annual report identifies an 11.3% stake in Deep Optics / Optica Amuka and states that the carrying value was fully written down in the previous year because of the company's business situation. This is direct evidence of investor concern and a material impairment, but it is not a formal notice of closure, insolvency, or acquisition. No reliable post-2025 operational update, recent product availability, hiring disclosure, or new financing was located in this review. The official domain deepoptics.com is linked by the company's 2022 announcement and 2024 trade coverage, but its homepage did not return readable content during this research. Operating status is therefore left unknown, and employee count is not verified.

Commercially, the technically coherent initial use case is presbyopia-related near vision: a user can switch an electrically active lens between distance sunglasses and a reading setting. That is a more focused proposition than a generalized claim that the platform serves many unrelated optical markets. It offers convenience and could avoid carrying a second pair, while requiring customers to accept electronics, charging, a higher purchase price, product support, and an unfamiliar optical experience. A 2024 interview quoted a price of $849 and described a plan to add prescription-distance correction and automatic switching; these should be treated as dated statements and roadmap intentions, not proof of current availability or completion. The company's initial Kickstarter demand establishes consumer interest among early adopters, not durable mass-market product-market fit.

The liquid-crystal approach competes with static progressive and bifocal lenses, multiple-pair use, and other electronically tunable lens designs. Relevant specialist peers and substitutes include Optotune's electrically tunable liquid lenses, liquid-crystal lens developers such as e-Vision Smart Optics and Liqxtal, and established spectacle-lens companies including EssilorLuxottica and Fielmann. Their products are not necessarily direct equivalents: aperture, optical quality, prescription range, switching method, power needs, form factor, manufacturing yield, and channel access matter. Deep Optics' potential edge is its pixelated lens and consumer eyewear integration; available evidence does not support claims of uniquely superior speed, lower power, military qualification, or broad scalability. Incumbent lens suppliers have strong manufacturing, clinical, distribution, and customer relationships, making partnerships and defensible IP important.

The team has relevant optics and startup experience in the historical record. Yariv Haddad was publicly identified as co-founder and CEO in 2016 and again interviewed as founder and CEO in 2024. Techtime's 2016 report named co-founders Yoav Yadin, Alex Alon, and Saar Wilf; it described Wilf as chairman and first investor at that time. Publicly accessible evidence is insufficient to verify the current leadership roster, team size, or whether these executives remain in those positions in 2026. Fielmann Ventures brought an industry-aligned lead investor and strategic route into eyewear; the current 11.3% shareholding confirms continued reported ownership at 2025 year-end, while the impairment signals serious downside to the investment case.

No disclosed financial statements, revenue, ARR, profitability, cash, burn, or runway were found. Nor did the reviewed sources establish government customers, defense contracts, security deployments, or military product qualification. Liquid-crystal optical components could in principle be relevant to imaging or near-eye displays, but that is only a potential adjacency; it should not be presented as demonstrated dual-use traction. Accordingly, this record classifies dual-use as false pending evidence of a real security or defense application. Key diligence should establish whether the business remains active, whether 32°N is still sold and supported, independently reconcile units shipped versus paid sales, inspect the cap table and Series C terms, and review current patent ownership and prosecution. The key strategic question is whether Deep Optics can turn a technically differentiated optical component into a reliable, manufacturable eyewear product with sustainable distribution economics."""
