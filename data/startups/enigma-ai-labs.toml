dual_use_description = "Enigma's dual-use relevance is structural adjacency with a short technical transfer path, but it is entirely unrealized in the public record and should be scored accordingly. (1) Cross-embodiment transferability: a hardware-agnostic intelligence layer is by construction platform-neutral, so the same models and abstraction that drive a commercial manipulator are architecturally applicable to unmanned ground vehicles, explosive-ordnance-disposal arms, CBRN and hazardous-material handling, and remote maintenance in contaminated or contested environments — settings where rebuilding software per platform is a chronic and expensive constraint. (2) Operator burden as the actual bottleneck: fielded military and first-responder robots typically demand a dedicated, extensively trained operator per system, and mission tempo is limited by that manpower ratio rather than by mechanical capability. Enigma's core thesis — that instruction time, not dexterity, gates real-world usefulness — targets exactly this constraint, which is a more precise fit to defense robotics than to most of the commercial markets the company names. (3) Ecosystem proximity: both founders served as officers in Unit 8200, and the cap table includes senior Israeli security-ecosystem operators, giving natural access to defense channels should the company choose to pursue them. Calibration, which should dominate: Enigma discloses no defense or security customer, trial, evaluation, or program of any kind; its stated early partner categories are healthcare, logistics, entertainment, and retail; there is no evidence of ruggedization, safety or assured-autonomy certification, operation under degraded or denied communications, or export-control posture; and a deliberately public, internet-facing robot-control platform is architecturally opposed to the security model defense deployment requires. This is credible dual-use potential in the technology, not a dual-use capability in the company."
