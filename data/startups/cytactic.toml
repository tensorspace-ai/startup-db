name = "Cytactic"
description = "Tel Aviv-founded cyber crisis readiness and incident response software that coordinates enterprise security, legal, communications, and executive teams before, during, and after a cyber incident."
detailed_description = """
Cytactic Cyber Management Ltd. markets Cytactic as a B2B cyber incident response management (CIRM) platform. Its product addresses the organizational work around a breach: preparing and tailoring playbooks, rehearsing scenarios with tabletop exercises, assigning tasks and decision rights, coordinating security teams with legal, communications, operations and executives, and documenting response and regulatory reporting. The company’s current product pages describe dynamic plans, an out-of-band communications channel for use when normal corporate systems are disrupted, AI-assisted crisis communications and legal disclosure workflows, decision-support agents, and agentic orchestration. Cytactic also offers a mobile companion app, and the product is listed in the CrowdStrike marketplace. These are product and distribution claims; public sources reviewed do not provide independent efficacy benchmarks or a detailed technical architecture.

The product is intentionally positioned above endpoint, detection, and security information tools. Cytactic aims to help an organization govern the business crisis after a technical incident escalates, when decisions, communications, insurance, customers, regulators and recovery work have to be coordinated. That positioning makes the product complementary to detection and incident-forensics vendors as well as potentially competitive with specialist cyber response command centers, crisis-management software, and incident-response service firms. Its commercial model is described as SaaS, while pricing, deployment options, contract terms, and the relative contribution of software versus professional services are not public.

The operating company is identified in its privacy policy and mobile-app listing as Cytactic Cyber Management Ltd.; its public materials give a Tel Aviv address and also list a New York office. Tel Aviv is the confirmed Israel connection. A 2024 Israeli technology press interview reported that the company had customers in Europe, Asia, and the United States and named Howden and Cognyte as collaborations; the company’s 2024 funding release included testimonials from representatives of those organizations. Neither source disclosed contracts, spend, deployment scale, or outcomes, so those references are treated as customer and partner signals rather than proof of recurring revenue or production-wide adoption. In 2025 Cytactic announced a strategic collaboration with Redpoint Cybersecurity. The public record establishes commercial activity and product availability, but not customer counts, retention, or unit economics.

Cytactic was founded in 2022 by cyber-law and crisis-management expert Dr. Nimrod Kozlovski and cybersecurity operator Menny Barzilay. Kozlovski’s academic and professional background spans cyber law, security, venture investing, and startup work. Barzilay’s public biography describes his work leading the Blavatnik Interdisciplinary Cyber Research Center at Tel Aviv University and prior cybersecurity leadership roles. The founders bring adjacent legal, operational, and technical perspectives that map to a product whose buyer and users cross organizational boundaries. Public sources do not disclose the founders’ ownership, the company’s complete capitalization, or how much of the product is built as proprietary software versus codified expert services.

The company disclosed a $16 million Seed round in July 2024 led by Evolution Equity Partners. In July 2026 it announced that Shawn J. Chen joined its advisory board and made a strategic investment, without giving the amount or instrument. No separate company-announced lifetime funding total was found, and no valuation or operating financial metrics were disclosed in the reviewed sources. Cytactic is active and privately held in the available current company materials. The dossier treats the company as an early-stage startup with promising product and customer signals but substantial commercial, security, and ownership diligence still open.
"""
