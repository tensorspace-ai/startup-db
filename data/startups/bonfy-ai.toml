name = "Bonfy.AI"
description = "Bonfy.AI develops Bonfy Adaptive Content Security (ACS), an AI-native data security platform that applies business context, entity awareness, and policy enforcement to unstructured content across email, SaaS applications, collaboration tools, copilots, custom AI workflows, and AI agents. Its current product thesis is to control sensitive data before it enters an AI workflow, while it is being used, and before an output or communication leaves the organization."
detailed_description = """Bonfy.AI is building a security control plane for the content flows created and consumed by modern AI systems. Its Bonfy Adaptive Content Security (ACS) platform combines content classification, business-context and entity-aware analysis, behavioral signals, policy logic, risk scoring, and automated remediation. The company describes coverage across data in motion, data at rest, and data in use: email and attachments, file stores, SaaS and collaboration applications, browser and shadow-AI activity, copilots, custom GenAI applications, and agent workflows. A notable newer capability is Contextual Data Enforcement, in which an MCP server can inspect content during an agent's reasoning or tool-use path, rather than relying only on static permissions or a final-output filter. This is a more specific proposition than generic LLM moderation: the protected object is enterprise content and its surrounding business context, whether the author is a person, service account, or AI agent.

The commercial buyer problem is the gap between rapid AI adoption and legacy data-loss-prevention controls designed around files, channels, and keyword or pattern matching. Bonfy targets security, privacy, compliance, data, and AI leaders that need to enable Microsoft 365 Copilot, Claude, ChatGPT, other assistants, and internal agents without allowing confidential information, personal data, intellectual property, or regulated content to be exposed or misrouted. The platform lists integrations including Microsoft 365, Entra, Purview, Google Workspace, Salesforce, HubSpot, Slack, mail flows, on-premises stores, and S3. The value proposition is therefore a unified enforcement and visibility layer that can reduce investigation noise and support auditability, rather than a point solution limited to one model provider.

Bonfy emerged from stealth with a June 2025 launch and a reported $9.5 million seed round led by TLV Partners, with participation from Saban Ventures and other investors. The founders identified publicly are Gidi Cohen, CEO and co-founder, and Danny Kibel, CTO and co-founder; both are described as security-industry veterans. The company lists 11-50 employees and Mountain View as its LinkedIn headquarters, while its public materials also reflect Israeli roots. Public evidence supports product development, integrations, launch activity, and security/compliance positioning, but does not establish revenue, customer concentration, retention, deployment scale, or a later financing round. Those missing metrics are central diligence items for a seed-stage enterprise-security company.

Competition is broad and strategically difficult. Bonfy overlaps with AI security and data-security vendors such as Lakera, Prompt Security, Nightfall, Cyberhaven, Netskope, and Protect AI, as well as incumbent DLP, DSPM, CASB, identity, SIEM, and cloud-platform capabilities. Its possible edge is the combination of content-level policy enforcement, business/entity context, multi-channel coverage, and an agent-facing inspection path, especially where conventional DLP sees a file or a destination but not the intent and data lineage around an AI action. That edge must be demonstrated through measurable precision, latency, policy coverage, deployment effort, and outcomes against incumbent tools; product breadth alone can also create integration and implementation burden.

The defense and national-security relevance is credible but indirect. Defense organizations, intelligence teams, and public-sector operators face the same risks around sensitive data entering assistants, agents, collaboration systems, and external communications, and they require stronger policy enforcement, audit trails, identity context, and deployment controls. Bonfy's security architecture and optional BYOC positioning could be relevant to those environments, but public sources reviewed do not demonstrate defense customers, classified deployment, government contracts, or certification for those use cases. The strongest present thesis is dual-use security infrastructure that could support high-assurance AI adoption; the record should not imply that military validation has already occurred."""
