name = "AquaMaof Aquaculture Technologies"
description = "AquaMaof is an Israeli aquaculture engineering company that designs and integrates recirculating aquaculture systems (RAS) for land-based fish and seafood production. Its commercial proposition is to help operators raise multiple species close to end markets while recirculating most process water and controlling production conditions indoors."
detailed_description = """
**Product and the problem it solves.** AquaMaof sells the engineering, equipment integration, and implementation expertise required to build land-based fish farms using recirculating aquaculture systems (RAS). A conventional open-net farm depends on a coastal site and exposes production to local water conditions, pathogens and parasites, escapes, seasonal variability, and transport distances from farms to consumers. Land-based RAS moves fish production into a controlled facility, where water is treated and reused and where a customer can plan production closer to a city or importing market. AquaMaof's offering covers facility concept and design, the RAS process and equipment package, installation and commissioning support, and ongoing operational support. The intended buyer is therefore a fish-farming operator, seafood group, or project consortium willing to finance and operate a large industrial facility, rather than an individual farmer buying a standalone appliance. This is an infrastructure business: the economic case depends on successful construction, reliable biological production, fish sale prices, energy and feed costs, financing, permits, and years of facility utilization. AquaMaof's food-security contribution is real but indirect. It supplies production technology to operators; it does not itself control all farms, own all output, or guarantee that a proposed facility will become profitable or deliver its design capacity.

**Core technology and how it works.** RAS is a coordinated water-treatment and animal-production process. Water from fish tanks is circulated through treatment stages that remove suspended solids and dissolved waste, convert toxic ammonia through biological filtration, manage carbon dioxide and oxygen, and return conditioned water to the culture tanks. Depending on the design, operators also manage temperature, salinity, disinfection, feed, stocking density, and system alarms. AquaMaof describes its systems as integrated, configurable for different species and facility scales, and designed around its customer's site and production plan. Its partner Proximar describes the Oyama, Japan installation as two main buildings: a hatchery and nursery growing salmon from egg to approximately 100 grams, and a post-smolt grow-out site taking fish to harvest size. Proximar reports that its plant incorporates AquaMaof RAS equipment, oxygen dissolving equipment, modularity, redundancy, and water recirculation. Those descriptions are useful evidence of how the integrated system is deployed, but they are partner statements about one facility and should not be generalized into verified comparative performance across every AquaMaof project. The company has also described minimal-liquid-discharge water-treatment methods and its Polish salmon R&D facility as a training and testing environment. Its public patent trail includes a pending European application titled “Novel methods of aquaculture,” naming Gary Myers and Neder Snir as inventors and addressing management of dissolved carbon dioxide; the public record establishes an application, not a granted patent or broad freedom-to-operate position.

**Market, customers, and go-to-market.** AquaMaof targets producers and investors seeking to grow salmon, trout, catfish, grouper, shrimp, or other seafood in controlled land-based facilities. The commercial driver is especially clear for regions importing fish or seeking local supply: a farm sited within trucking distance of consumers can reduce the time between harvest and retail, while operators can locate production where coastal conditions are unsuitable or where existing supply chains are vulnerable. Sales are project-led and long-cycle. AquaMaof works with customers from feasibility and facility planning through process design, equipment integration, construction coordination, commissioning, and support. Projects require permits, site preparation, utilities, construction capital, biological operating expertise, and customer-side execution; AquaMaof cannot remove those dependencies. Its named project relationships include Proximar Seafood in Japan, Smart Salmon in Norway, and Grieg NL in Canada through the company's AMG Norway subsidiary. These are different commercial situations rather than a single repeatable equipment order: Proximar's Oyama farm reached operating production and began first harvest and sales in 2024; Smart Salmon describes AquaMaof as its technology partner while it raises financing for a planned Norwegian farm; and the Newfoundland project has had a changing ownership and regulatory history. The contrast illustrates both the addressable market and the need to check each project’s current status rather than treating a design or construction announcement as delivered capacity.

**Traction, funding, and third-party validation.** AquaMaof's strongest public validation is a portfolio of named, large-scale projects and a working production reference, not a transparent company revenue series. Its official project page lists operational facilities for trout in Russia and catfish in Slovakia, a Polish salmon R&D and training facility, a grouper facility in start-up, and the Japanese Proximar farm. Proximar's corporate reporting identifies AquaMaof as the RAS technology provider for Oyama and records the 2024 first harvest and sales; the company also publishes ongoing production updates. Historical reporting in 2019 said more than $230 million was associated with plans to build a dozen-plus aquaculture facilities across several countries. That amount should be understood as project investment described in the article, not treated as a verified equity round into AquaMaof. Startup Nation Finder lists a 2019 A round with undisclosed terms and one investor, while current company-level revenue, valuation, cash runway, backlog, and customer concentration are not public in the sources reviewed. The official site claims more than 50 sites, 16 species, and potential annual yield exceeding 450,000 tonnes across its global footprint; these are company-reported aggregate metrics and combine projects at differing stages, so they are not equivalent to current operating capacity. Independent academic review of salmon RAS supports the technical importance of water recirculation but also emphasizes unresolved system-level challenges around water quality, energy, wastewater, animal welfare, and lifecycle sustainability. That context is essential: RAS is a demanding engineering and farming category, not an automatic sustainability advantage.

**Founders and team background.** AquaMaof's history is tied to Israeli aquaculture and engineering rather than a recently formed venture-backed founding team. The official company history says MAOF Developments and Technology was incorporated in 1989 by Yoav Dagan and Nitay Goldman in Kibbutz Tirat Zvi, initially developing machinery and systems for sectors including aquaculture, food processing, recycling, and agriculture. AquaMaof Aquaculture Technologies was formed in 2010 to focus on RAS. Public sources differ on the number of AquaMaof co-founders and do not provide a complete, consistent founding roster; the current site names Eli Amar as CEO, Yoav Dagan as VP of Business Development, Neder Snir as CTO, Gary Myers as Senior Technology Officer, and Dr. John F. Taylor as salmon R&D specialist. Yoav Dagan's profile describes decades as a fish-farm owner and aquaculture operator, while the company identifies its wider team as aquaculture and technology specialists. Patent records name Myers and Snir on the published carbon-dioxide-management application. The mix of fish-farm operating knowledge, process engineering, and species-specific R&D fits the company's system-integration model. A diligence limitation is that public biographies do not establish how much of the original technical team remains, how engineering is staffed across current geographies, or what succession and key-person arrangements exist in a business where project delivery depends on specialized field expertise.

**Competitive dynamics.** AquaMaof competes in a global market where an operator can choose a different RAS designer, assemble a facility from multiple equipment vendors, or continue using sea cages and conventional hatcheries. **AKVA group** and **Billund Aquaculture** are established suppliers and integrators of land-based aquaculture equipment and facility systems. **Innovasea** supplies aquaculture technology and monitoring systems, including recirculating and land-based solutions, competing for parts of the same customer engineering budget. **Pure Salmon** is a vertically organized land-based salmon developer and operator that can select competing technology providers or internalize parts of the production stack. **Atlantic Sapphire** is a large land-based salmon operator whose operating experience provides an alternative reference point for prospective projects and illustrates the execution demands of full-cycle RAS. AquaMaof's claimed edge is accumulated installation and operating experience across species, ability to adapt facility design to a specific site and market, customer support from design through operation, and access to R&D and training facilities. Its installed references can lower perceived technology risk for a prospective customer. Those advantages are not automatically a moat: project economics can turn on power prices, biological performance, construction discipline, financing, and operator capability, and buyers can combine suppliers or switch to other designs. Public comparisons of lifecycle cost, energy consumption, uptime, yield, maintenance cost, and warranty performance across vendors are insufficient to establish a durable technical lead.

**Defense, security, and resilience relevance.** AquaMaof's dual-use case is a civilian resilience application in strategic food and water systems, not a defense product. Domestic or regional seafood production can diversify food supply, reduce dependence on imported chilled or frozen products, and improve continuity when shipping routes, cold chains, or coastal farming are disrupted. RAS can also enable production in inland or water-constrained settings where open-water aquaculture is unavailable, subject to reliable electricity, suitable source water, feed supply, skilled operators, permits, and waste handling. The technology's industrial process-control and water-treatment elements are relevant to critical food infrastructure and emergency planning, but there is no public evidence that AquaMaof has supplied a military customer, supported a defense program, or developed a ruggedized expeditionary system. In a prolonged outage, a high-density recirculating farm may be more vulnerable than a dispersed conventional farm because pumps, oxygenation, filtration, backup power, and biosecurity must operate continuously. Strategic value therefore comes from diversified and locally sited commercial food capacity when the economics and infrastructure work, not from assuming the farms can function independently of grids or logistics. Israel's own experience with limited water and challenging fish-farming conditions provides historical context for the company's origin, but the principal commercial deployment footprint is international.

**Growth stage, trajectory, and diligence risks.** AquaMaof is best classified as mature: the focused RAS company dates to 2010, it has long-running project references, a global systems-delivery model, and at least one prominent customer facility that has harvested and sold salmon. It is not a typical early-stage startup, and the public sources do not establish a current funding stage or the corporate financial profile needed to assess its growth rate. The forward opportunity is to convert demonstrated project experience into repeatable, financeable facility deployments, extend species and customer coverage, and build recurring service, training, or operational-support revenue alongside one-time engineering work. Key diligence questions are substantial. (1) Project exposure: establish which announced projects are operating, being built, paused, or cancelled, and how much backlog is contracted and collectible. (2) Facility economics: independently measure capex, energy and water intensity, output, mortality, feed conversion, labor, maintenance, and yield against sea-based and competing RAS benchmarks. (3) Biological and operational risk: verify performance across species and sites, and review contingency procedures for disease, water-quality excursions, equipment failure, and power loss. (4) Customer concentration and counterparty risk: large farms depend on financing and permits, so delays or sponsor distress can defer revenue for years. (5) Intellectual property: confirm patent prosecution, ownership, licensing, and freedom to operate; a pending application is not equivalent to a granted defensible portfolio. (6) Environmental case: quantify energy emissions, water sourcing, sludge disposal, feed inputs, and actual discharge levels rather than relying on broad sustainability positioning. (7) Corporate disclosure: obtain current audited financials, employee count, order book, ownership, and customer references. The record is strategically relevant and supported by real industrial references, while the high capital intensity and opaque company-level economics warrant a high risk rating.
"""
