name = "Iron Drone"
description = "Iron Drone is an Israeli counter-UAS technology asset whose Raider system uses autonomous interceptor drones to physically capture unauthorized small aircraft. The assets were acquired by Airobotics in 2023 and are now marketed through Ondas Autonomous Systems for defense, homeland-security, airport, and critical-infrastructure missions."
detailed_description = """Iron Drone developed the Raider autonomous counter-UAS system to close the gap between detecting a drone and safely stopping it. The current Airobotics presentation describes an ecosystem consisting of an autonomous interceptor, launch station, interception payload, command-and-control, recovery system, and radar. A typical engagement begins with a detection and cue from the system's sensing layer, followed by autonomous launch, navigation, target tracking, and physical capture. The interceptor uses a net and recovery mechanism rather than a warhead or projectile; earlier Ondas filings describe a docking station that can house multiple small UAVs and a parachute that lowers the captured aircraft for collection. This architecture makes Iron Drone a defeat-layer product that can be integrated into a broader counter-UAS stack, not merely a drone detector or a software dashboard.

The principal technical proposition is controlled kinetic interception without dependence on GPS or RF jamming. That matters at airports, industrial sites, public venues, borders, and military facilities where jamming can disrupt legitimate communications or navigation and where guns, missiles, or explosive interceptors create unacceptable collateral risk. Airobotics currently claims autonomous operation from launch through interception, real-time adaptation to target movement, 24/7 readiness, and applicability to micro-drones, multirotors, and fixed-wing UAS. Those are product-positioning claims, not independently audited performance data. Publicly available material does not establish a universal engagement range, probability of capture, weather envelope, false-positive rate, response latency, or performance against coordinated swarms, fiber-optic control, low-observable aircraft, or adversarial deception. Any serious buyer therefore needs site-specific trials and safety evidence rather than relying on headline specifications.

Iron Drone is no longer an independent startup. Ondas reported that it acquired the Iron Drone assets effective March 6, 2023, after Airobotics had agreed to acquire them, and that Raider was already being marketed to government and enterprise customers. The parent company subsequently reported defense and homeland-security orders, including a $9 million set of 2024 Raider purchase orders, a $3.4 million European governmental deployment announced in April 2025, a $1.7 million Asian governmental order disclosed in 2025, and a $2.7 million defense order announced in August 2025. Ondas also announced an approximately $8.2 million European airport order in November 2025 and a further multi-million-dollar European order in February 2026 after an airport deployment. These are meaningful commercialization signals, but they are disclosures by the parent and do not provide standalone Iron Drone revenue, gross margin, backlog, production rate, customer-retention, or unit-economics data.

Competition is best understood as a layered-system decision rather than a simple feature comparison. D-Fend Solutions and Sentrycs address non-kinetic or cyber-over-RF mitigation; Dedrone and DroneShield provide detection, command-and-control, and electronic or layered counter-UAS capabilities; Rafael, IAI, Elbit Systems, Anduril, and other defense suppliers offer broader integrated systems or alternative hard-kill effects. Iron Drone's differentiated role is an autonomous airborne interceptor that can engage a target independently of its control link and recover the captured vehicle. That can complement external radar and sensors, but it also creates integration, airspace-management, replenishment, maintenance, and safety burdens. Customers may prefer a cheaper electronic effect for many incursions, while a net-based interceptor may be most valuable only where communications interference or collateral damage is especially costly.

Strategically, the asset has strong relevance to the growing counter-UAS requirement created by inexpensive reconnaissance, smuggling, and attack drones. Its dual-use case is credible but security-led: commercial applications include airport perimeter protection, energy and industrial facilities, ports, stadiums, prisons, and other sensitive sites; defense applications include bases, borders, and force-protection locations. The priority diligence questions are autonomy boundaries and human authorization, aviation and use-of-force approvals, performance against dense civilian air traffic, recoverability and safe-fall behavior, cyber hardening, supply-chain resilience, interceptor reload economics, and whether Airobotics can convert parent-reported orders into repeatable supported deployments. The correct investment interpretation is therefore strategic technology relevance inside Ondas, not a current standalone financing opportunity."""
