name = 'AA-I Technologies'
description = "AA-I Technologies Ltd, operating as doubleAI, is an Israeli artificial intelligence research company developing Artificial Expert Intelligence (AEI) systems. Its public work currently demonstrates WarpSpeed, an AI system for GPU performance engineering, and doubleGraph, an optimized drop-in cuGraph replacement."
detailed_description = """
AA-I Technologies Ltd operates publicly as doubleAI. It is an Israeli private AI research company founded in 2023 and headquartered in the Ramat Gan area. The company describes its goal as Artificial Expert Intelligence (AEI): systems concentrated on specific scientific or engineering domains, intended to carry out extended expert work rather than provide only fluent general answers. This is the company's framing and ambition; it should not be interpreted as independently established expert-level general capability. Bessemer Venture Partners independently lists doubleAI as active, founded in 2023, and focused initially on low-level code optimization. Globes reported that AA-I began in Jerusalem before moving to Ramat Gan.

The most concrete public product evidence is WarpSpeed, an AI system for GPU performance engineering. In March 2026, doubleAI reported applying it to NVIDIA's cuGraph graph analytics library and releasing doubleGraph, a drop-in optimized version. The company reports an average 3.6x speedup across algorithms, with 55% above 2x and 18% above 10x, on NVIDIA A100, L4, and A10G GPUs. The release includes a public research description and an accessible code repository. These results are useful technical evidence, but remain company-reported benchmark outcomes. Independent reproduction on customer workloads, end-to-end costs, correctness under varied inputs, and sustained maintenance are not established by the cited release. Later company reports describe work on CUDA kernel benchmarks and hardware design, expanding the demonstrated scope while remaining research claims that merit independent evaluation.

AA-I's founding group combines prominent researchers and entrepreneurs. The company identifies Prof. Amnon Shashua as CEO and Prof. Shai Shalev-Shwartz as CTO. Globes' 2025 reporting names co-founders Yoav Levine, Or Sharir, Noam Weiss, and Gal Beniamini, and describes prior research and engineering experience across AI21 Labs, Mentee Robotics, OrCam, Stanford, Caltech, and Weizmann Institute contexts. This concentration of research talent is a meaningful execution asset. It also creates key-person risk, and public materials do not provide a complete operating leadership roster, hiring history, or organization-level accountability for product, sales, security, and support.

The financing history publicly visible by October 2026 comprises an early seed round and a Series A. Globes reported in May 2025 that the seed had raised $20–30 million and named Dell Technologies Capital, BRM Capital, and Pitango First. Later, Globes described the previous seed as $21 million; Startup Nation Finder lists $21 million, while Dealroom lists $25 million. These are not reconciled, so the seed amount is treated as conflicting rather than silently choosing a figure. Globes reported a $200 million Series A completed by November 2025, led by Lightspeed Venture Partners, with Michael Dell, Bessemer Venture Partners, Pitango First, and Greenfield Partners; its report also noted NVIDIA's participation and an approximately $1 billion company valuation. It reported $221 million raised to date. These are media-reported transaction terms, not company-issued financial statements. Private ownership percentages, preferred share terms, and the cap table are unavailable in the reviewed sources.

Commercial evidence remains thin relative to the financing. doubleAI makes its doubleGraph release available as a free drop-in replacement, which can lower adoption friction and create a test surface, but no paid customer, production contract, recurring revenue, usage scale, renewal, or gross margin was found in reviewed public material. Its plausible buyers include cloud and AI infrastructure operators, GPU software teams, data-intensive enterprises, and research organizations with expensive specialized workloads. The path from benchmark success to repeatable procurement requires integration support, compatibility across software versions and accelerator types, transparent reliability guarantees, and clear economic attribution. The free artifact is a product milestone, not proof of revenue or commercial deployment.

Competitive boundaries are broad. NVIDIA supplies CUDA, cuGraph, compilers, and optimized libraries, and can internalize improvements or change underlying interfaces. Frontier model labs and coding agents can improve at code generation; cloud compute providers and AI infrastructure companies such as Anyscale, Together AI, and Modal address adjacent workload performance, orchestration, and GPU utilization needs. Specialist compiler and kernel teams are also substitutes. doubleAI's potential edge is an optimization loop that searches deeply, specializes implementations to hardware and workload, and verifies candidates rather than stopping at plausible code. Defensibility would depend on measurable performance across diverse real-world tasks, robust verification, a proprietary learning or evaluation advantage, and customer integration. Published benchmark wins alone do not establish a durable moat.

The opportunity is technically and commercially attractive if software optimization can reliably unlock more useful compute from existing hardware. The same capability could support scientific workloads, AI inference, graph analytics, and eventually hardware design. However, the initial market is a technical niche requiring expert buyers and rigorous validation. A large financing round improves capacity to hire and run compute-intensive research, but it does not establish product-market fit, revenue, or runway. Specific diligence priorities are independent reproduction of benchmark results; customer references and paid deployment evidence; accuracy and regression rates across supported architectures; product packaging and pricing; patent, code, data, and university/employer IP provenance; compute costs and capital efficiency; and investor and founder governance. No public evidence reviewed supports the prior defense-intelligence positioning, military customer claims, or security product descriptions, so the profile treats dual-use applicability as unproven and does not assign a defense thesis.
"""
