name = "Kondukto"
description = "Kondukto developed an Application Security Posture Management (ASPM) and application-security orchestration platform that normalized findings from diverse security tools, correlated signals, and routed prioritized remediation work. Invicti acquired Kondukto in August 2025; the former Kondukto capability is now presented as Invicti ASPM within a broader runtime-validated application-security platform."
detailed_description = """
Kondukto's core product was an application-security orchestration and posture-management layer for organizations whose software programs generated findings from many separate scanners and development systems. The platform brought together outputs from SAST, DAST, SCA, secrets, container, IaC, penetration-testing, and related tools; normalized them into a common vulnerability view; and supported deduplication, triage, ownership, status, and remediation workflows. Its value proposition was operational rather than the discovery of a novel vulnerability-detection primitive: security teams could retain a heterogeneous toolchain while creating a more consistent inventory, risk view, and evidence trail. Current Invicti material describes this lineage as Invicti ASPM, formerly Kondukto, rather than as a separately marketed Kondukto company.

The primary customer problem is the cost of fragmented AppSec operations. Large engineering organizations have many repositories, applications, teams, and scanners, so severity alone is an insufficient prioritization mechanism. Kondukto's documented capabilities included integrations, project and asset context, configurable risk scoring, automation rules, issue-manager connections, source-control context, audit logs, reporting, remediation knowledge capture, and developer-facing CI/CD or pull-request workflows. Its documentation also describes Docker-hosted scanners, validation scans, vulnerability retention policies, and bi-directional Jira actions. Those are concrete signs of an operational enterprise product, but they do not establish the security posture of every deployment model or the commercial scale of the installed base.

The competitive field includes dedicated ASPM and vulnerability-orchestration vendors such as ArmorCode, Nucleus Security, Apiiro, and Cycode; application-security platforms such as Snyk and Checkmarx; open-source or workflow-centered alternatives such as DefectDojo; and broader cloud-security suites. Kondukto's practical advantages were connector breadth, the accumulated data model and workflow configuration around heterogeneous findings, and the ability to turn security results into assigned engineering work. Invicti's current positioning adds a meaningful differentiator: runtime-validated DAST can be correlated with imported SAST, SCA, API, container, and other signals so that posture views distinguish proven exploitability from unverified scanner output. That advantage remains difficult to quantify without retention, remediation-time, false-positive, renewal, and integration-usage data.

The acquisition changes the investment and strategic interpretation. Kondukto is no longer an independent growth-stage company in this database; its relevant asset value is now tied to Invicti's roadmap, packaging, distribution, customer retention, and ability to integrate broad posture data with runtime proof. Invicti says the combined platform serves regulated sectors and supports policy enforcement, role-based access, audit-ready reporting, and multiple deployment models, but those claims describe the parent platform and are not proof of classified or military use. The technology has credible dual-use potential because defense contractors, government software teams, and other regulated organizations also need software-supply-chain visibility, traceable remediation, and application-risk reporting. Defense relevance should therefore be treated as conditional on customer-controlled deployment, identity and access controls, logging, data residency, offline or restricted-network operation, and program-specific compliance evidence. Public sources do not confirm those requirements are met in classified environments.
"""
