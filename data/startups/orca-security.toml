name = "Orca Security"
description = "Orca Security is a privately held cloud-native application protection platform (CNAPP) that combines agentless cloud discovery, contextual risk prioritization, vulnerability and posture management, runtime protection, and guided remediation across multi-cloud and hybrid environments. Its main strategic relevance is defensive cyber resilience for enterprises, regulated operators, and government workloads rather than defense-native mission systems."
detailed_description = """Orca Security provides a cloud security platform for AWS, Microsoft Azure, Google Cloud, Kubernetes, and other cloud and hybrid environments. Its foundational SideScanning approach collects cloud configuration and workload data out of band, reducing the need to deploy and maintain a conventional security agent on every asset. The platform has expanded beyond its original posture-management proposition into a CNAPP spanning cloud security posture management, cloud workload protection, entitlement and identity risk, data security posture, vulnerability management, API security, container and Kubernetes security, application and infrastructure-as-code security, compliance, and AI-related cloud controls. Orca Sensor adds runtime visibility and protection for Linux, Windows, Kubernetes, and other critical workloads through an eBPF-based sensor, so the company now combines agentless-first coverage with targeted runtime telemetry rather than relying on a single collection method.

The customer problem is the fragmentation and low actionability of cloud-security findings. Security teams need to understand not only whether a workload is vulnerable or misconfigured, but whether it is reachable, connected to sensitive data, exposed through an identity or API path, and important to the business. Orca's Unified Data Model and attack-path analysis are intended to join those signals and rank risk by severity, accessibility, exploitability, and business impact. This creates a credible workflow advantage when it works: fewer disconnected consoles, less alert fatigue, and more direct routing of fixes into Git, ticketing, and developer workflows. The tradeoff is that the platform's value depends on broad cloud-provider permissions, accurate asset and identity modeling, and customer confidence that contextual prioritization does not hide a low-frequency but consequential risk.

Commercially, Orca is a late-stage private vendor with substantial enterprise scale. The company announced a $550 million extended Series C in 2021 at a reported $1.8 billion valuation, and its current materials describe nearly $630 million in combined funding. Those figures are historical company disclosures rather than a current valuation or proof of present growth. Current public positioning shows continued product expansion into runtime security, AI security, application and API security, and code-to-cloud remediation, alongside a partner-led route to market. LinkedIn lists 201–500 employees and Portland as the primary headquarters, while Orca's own contact page lists additional offices including Tel Aviv, London, Austin, and Bengaluru. This supports a mature private-company classification, but diligence should still request current ARR or growth, retention, gross margin, deployment mix, renewal performance, and the extent to which platform breadth converts into durable adoption rather than module sprawl.

The dual-use case is substantive and unusually concrete for a commercial cybersecurity company. Orca markets a FedRAMP Moderate and GovRAMP-authorized platform, describes deployment in customer-controlled or government-cloud boundaries, and documents government use cases around cloud migration, continuous risk assessment, compliance, and remediation. Its 2021 financing announcement also described a strategic relationship with SAIC for federal cloud-security work. These signals establish public-sector relevance, but they do not make Orca a defense contractor or demonstrate classified, tactical, or weapons-system deployment. The strongest strategic thesis is protection of government, critical-infrastructure, defense-industrial, and other sensitive cloud estates: inventorying rapidly changing assets, finding exploitable paths, detecting runtime behavior, and compressing remediation cycles. The main diligence question is whether authorizations and partner references translate into repeatable government revenue and operational performance in constrained, segmented, or disconnected environments."""
