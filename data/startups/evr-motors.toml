name = "EVR Motors"
description = "EVR Motors is a Petah Tikva-based deep-tech company that designs compact, high-power-density electric motors built on its patented Trapezoidal Stator Radial Flux (TSRF) topology, including rare-earth-free ferrite configurations, with volume manufacturing established in India and a 2026 strategic partnership with Larsen & Toubro."
detailed_description = """
**Product and the concrete problem it solves.** EVR Motors builds electric traction and drive motors that are dramatically smaller, lighter, and cheaper than conventional machines of equivalent output. The concrete problem it attacks is the size, weight, cost, and material dependency of the electric motor — the component at the heart of every electrified platform. Conventional radial-flux permanent-magnet motors are bulky, lean heavily on imported rare-earth magnets (neodymium, dysprosium), and are expensive to manufacture at the power densities that modern vehicles and machines demand. EVR's answer is a re-architected motor: the company states its **Trapezoidal Stator Radial Flux (TSRF)** motors are roughly 30-50% smaller and lighter than conventional electric motors at comparable performance, span a wide envelope from 48V to 800V and roughly 6 kW to 150 kW, and — critically — can be built in **rare-earth-free configurations using ferrite magnets** that approach the power density normally associated with neodymium designs. For an OEM, that translates into more usable vehicle volume, lower bill-of-materials cost, and reduced exposure to a rare-earth supply chain dominated by China.

**Core technology and how it actually works.** The differentiator is geometric and manufacturing-led rather than exotic materials science. In a conventional radial-flux permanent-magnet motor, stator geometry and winding packing limit how much torque can be produced per unit of volume. EVR's TSRF topology reshapes the stator into a trapezoidal, distributed structure that increases the interaction area between stator and rotor and improves the packing of the magnetic circuit, so more torque and power are produced in a smaller, lighter package. Because the design raises torque density through geometry, EVR can substitute lower-grade ferrite magnets for rare-earth magnets in some configurations while preserving competitive output — the "one you haven't heard of" path to rare-earth reduction rather than a switched-reluctance or wound-rotor approach. The topology is patented, the motors are software-configurable so a single platform can be tuned to two-wheelers, passenger cars, or commercial vehicles, and EVR pairs the design with an automated coil and stator production process intended to make the motors cheap to build at scale. A recent compact unit is cited at roughly 36 kg producing more than 150 kW, illustrating the density claim in a single data point.

**Market, customers, and go-to-market.** EVR's addressable market is the entire electrified-mobility and industrial-drive economy: two- and three-wheelers, passenger EVs, light and commercial vehicles, buses and trucks, forklifts and off-highway equipment, marine, and generators. Its go-to-market is a licensing-plus-manufacturing model concentrated, so far, on India — a deliberate bet on the world's largest two- and three-wheeler market and its "Make in India / Aatmanirbhar Bharat" localization push. EVR operates a greenfield production plant in **Manesar, Haryana** through its EVR India subsidiary, designed for roughly 20,000 motors per month and expandable toward 100,000. It has signed commercial and manufacturing agreements with a roster of Indian players — reportedly including Napino, Belrise Group, EKA Mobility, RSB Transmissions and the Badve Group — plus a Japanese distributor, Tsukasa Electric. The headline validation is a **May 2026 strategic partnership with L&T Electronic Products & Systems (LTEPS)**, part of the Larsen & Toubro conglomerate, to co-develop and manufacture next-generation traction motors — alongside indigenously designed Motor Control Units for a complete drivetrain — at L&T's Coimbatore plant.

**Traction, funding, and third-party validation.** EVR has moved from prototype to production and design-win engagements, which is meaningful validation in a field where many motor startups never reach a factory floor. The strongest external signal is the L&T tie-up: a large, credible industrial partner committing to co-develop and build EVR's motors is a substantive endorsement of the technology and of its manufacturability. On the capital side, EVR is comparatively lightly funded for a hardware-manufacturing company: early rounds were led by **Marius Nacht** (co-founder of Check Point), with participation from Teramips Technologies, Varana Capital, the Southern Israel Bridging Fund (SIBF), and grants from the Israel Innovation Authority. Total disclosed venture funding is modest and not fully public, and the company reports a lean team of roughly 45 people including about five PhDs — calibration points that matter: EVR's momentum rests more on partnerships and production capacity than on a large war chest.

**Founders and team background.** EVR was founded in 2012, with co-founders including **Victor Kislev**, **Ruslan Shabinski**, and **Eli Rozinsky** (President/COO), the technical core behind the TSRF topology. What sets the leadership apart for a strategic reader is its defense and aerospace pedigree. The chairman is **Ophir Shoham**, former head of the Israeli Ministry of Defense's Directorate of Defense Research and Development (DDR&D / MAFAT); the CEO is **Opher Doron**, former general manager of Israel Aerospace Industries' (IAI) Space Division, who led high-profile national programs. That bench signals deep systems-engineering discipline and access to Israel's defense-industrial and space networks, even though the company's commercial focus today is squarely automotive and industrial.

**Competitive dynamics.** EVR competes in one of the most crowded and cost-brutal segments in hard tech. (1) It faces global Tier-1 e-drive incumbents — **Nidec, Bosch, ZF, BorgWarner** — with vast scale and entrenched OEM relationships. (2) It faces captive motor programs at automakers (Tesla, BYD and others) that design drives in-house. (3) In the specific rare-earth-free lane it competes with challengers such as **Advanced Electric Machines, Turntide, and Mahle**, and with axial-flux density specialists like **Yasa and Magnax**. (4) Domestically it sits alongside Israeli e-mobility peer **IRP Systems**, which builds electric powertrains and motor controllers. EVR's plausible edges are threefold: a genuinely differentiated, patented topology; a rare-earth-free option that resonates with supply-chain-anxious OEMs and governments; and a low-cost, localized manufacturing footprint. The countervailing risk is that motors trend toward commodity economics, where scale and OEM lock-in beat topology cleverness.

**Defense, security, and resilience dual-use relevance.** EVR's dual-use case is real but is honestly an adjacency, not a fielded defense capability. Two threads make it strategically legible. First, **platform electrification**: compact, high-torque-density, SWaP-efficient motors are exactly what electric and hybrid-electric defense platforms need — UAV and drone propulsion, unmanned ground and robotic vehicles, marine drones, turret and actuator drives, and range-extended tactical vehicles — a domain where the size/weight/power tradeoff EVR optimizes is decisive. Second, **supply-chain sovereignty**: rare-earth-free ferrite motors reduce Western and allied dependence on Chinese rare-earth magnets, a resilience concern for both civilian industry and the defense-industrial base, sharpened by the founders' MAFAT and IAI backgrounds. The appropriate calibration is that EVR markets to commercial mobility and has disclosed no defense contracts or fielded military use; its defense relevance is potential and inferential, resting on the inherent portability of electric-propulsion IP and on strategically significant leadership.

**Growth stage, trajectory, and key diligence risks.** EVR is best read as an **early-to-mid-stage deep-tech company that has crossed into commercialization** — patented core IP, a running Indian factory, multiple OEM agreements, and a marquee L&T partnership — but that has not yet demonstrated scale revenue or margin durability. The bull case: a differentiated, rare-earth-free motor platform arriving as electrification and supply-chain de-risking converge, with a disciplined manufacturing beachhead in the world's largest two/three-wheeler market. The bear case should dominate diligence: (1) the motor market is scale-and-cost-driven and dominated by giants and captive programs; (2) disclosed funding is modest for capital-intensive manufacturing; (3) commercialization is concentrated in India and dependent on partners' execution and ramp; (4) the rare-earth-free advantage must keep proving parity as magnet supply and pricing shift; and (5) the dual-use thesis is adjacency, not a booked defense capability. Progression to clear "mature" status would require sustained multi-OEM production volumes, durable design wins outside India, evidence of defensible unit economics, and — for the strategic thesis specifically — any concrete electrified-platform or defense-adjacent deployment.
"""
