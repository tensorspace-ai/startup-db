name = "Infinipoint"
description = "Infinipoint developed a zero-trust workforce-access platform that combined phishing-resistant user authentication with device identity, continuous posture checks, and self-service remediation. Outpost24 acquired the company in December 2025 and integrated its product capabilities into the Specops identity-security portfolio as Specops Device Trust."
detailed_description = """Infinipoint was an Israeli identity-security startup founded in 2019 around a specific weakness in conventional zero-trust deployments: strong user authentication does not establish that the device presenting the credential is trustworthy. Its platform combined passwordless or MFA authentication with device identity, user-device binding, granular posture checks, and policy-based access decisions. Public product material described checks across operating-system configuration, active threats, security controls, and software state, with posture evaluated at login and repeatedly during an active session. The platform also offered one-click user remediation for conditions such as disabled encryption, an outdated operating system, or a disabled firewall, allowing security policy enforcement without turning every exception into an IT ticket.

The commercial problem was well defined. Enterprises increasingly support hybrid workforces, contractors, BYOD, and applications spread across cloud and on-premise environments, while identity providers typically answer who is signing in more reliably than whether the endpoint is safe to use. Infinipoint targeted IT and security teams that needed device-aware conditional access without deploying a full mobile-device-management stack to every user or unmanaged endpoint. Its documented integrations included Okta, Microsoft Entra ID/Azure AD, and Ping Identity, and its supported endpoint scope included Windows, macOS, Linux, iOS, and Android. That breadth made the product relevant to organizations with heterogeneous fleets, although it also increased the burden of endpoint-agent quality, policy configuration, and integration support.

The principal competitive advantage was product focus at the intersection of identity and endpoint trust rather than ownership of either category. Infinipoint differentiated its pitch through continuous checks, device-bound authentication, visibility into unmanaged devices, and remediation at the point of access. These capabilities addressed risks such as phishing, stolen credentials, session hijacking, and lateral movement. The competitive field remained difficult: Microsoft, Okta, Cisco Duo, CrowdStrike, Zscaler, Kolide, Beyond Identity, and endpoint-management platforms all covered parts of the same decision. Large identity and security vendors could bundle adjacent controls into broader contracts, while specialist vendors could compete on deployment simplicity or endpoint telemetry. Sustainable differentiation therefore depended on detection quality, low user friction, broad platform coverage, and measurable reduction in access-related incidents.

The strongest current traction signal is strategic rather than standalone operating data. Outpost24 announced the acquisition of Infinipoint on December 9, 2025, stating that the transaction would add device identity, posture validation, secure workforce access, and one-click remediation to its Specops identity-security division. Outpost24 later described completion of the Infinipoint product-suite integration in 2026, and Specops now markets the resulting capability as Specops Device Trust. The acquisition validates that the technology was valuable to an established cybersecurity platform, but it also means the former startup should not be analyzed as an independent Series A company. Public sources do not establish current standalone revenue, customer retention, valuation, or the extent to which the original product remains separately operated.

The dual-use case is credible but bounded. Device-bound authentication and continuous posture enforcement can protect enterprise, government, defense, and intelligence workforces from compromised endpoints and stolen credentials. In sensitive environments, the technology could help enforce access to mission-support applications, contractor portals, and segmented administrative systems. However, the public evidence supports a workforce-access and identity-security product, not a military-specific system, classified deployment, or operational defense contract. Its strategic relevance is therefore strongest as cyber-infrastructure enabling secure access, with integration into Outpost24 and Specops improving distribution potential while reducing the relevance of independent startup financing as a diligence question."""
