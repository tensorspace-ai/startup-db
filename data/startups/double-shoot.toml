name = "Double Shoot"
description = "Double Shoot Ltd. is an Israeli defense-technology startup whose image-processing mobile application helps users calibrate firearm sights and manage shooting practice from target images. Its commercial proposition is to reduce range time, ammunition consumption, and instructor workload while giving military, law-enforcement, and civilian users a searchable record of performance."
detailed_description = """
**Product and the concrete problem it solves.** Double Shoot addresses a narrow but expensive piece of the small-arms training cycle: bringing a rifle or pistol's point of aim into alignment with its actual point of impact, then maintaining a record of whether the shooter is practicing to the required standard. The traditional process is manual, range-intensive, and dependent on an instructor visually interpreting paper targets. The company describes its product as a mobile app for zeroing and scoring, while the Israeli Ministry of Defense describes the broader platform as a smartphone-deployed image-processing and data-analysis system. The practical customer problem is not simply convenience. Range time is scarce, ammunition is costly, and a poorly calibrated weapon can turn later training results into misleading data. Double Shoot's stated value proposition is to make the calibration loop faster and more repeatable, then extend the same workflow into ongoing practice records, statistics, trends, and alerts for personnel who have not trained recently.

**Core technology and how it works.** The core system uses a phone or tablet camera to process an image of a designated shooting target and identify the locations of a group of impacts. Startup Nation Central's public profile describes an image-processing flow that calculates the average impact relative to the intended point and generates sight-adjustment guidance; its machine-readable description says the application can compare a first target image with a later image and use the shot-group relationship to produce instructions on the client device. The important technical asset is therefore a constrained computer-vision pipeline tied to firearm and sight parameters, not a general-purpose AI claim. The app also keeps structured session data rather than treating each target as a one-off image. Double Shoot's App Store listing confirms a personal shooting log, achievements, trends, comparative graphs, and a leaderboard, while the company's defense brochure describes a restricted web interface that can report upward from individual shooters and instructors to units, headquarters, and staff levels. That combination turns a paper target into both a calibration input and a training-management record.

**Market, customers, and go-to-market.** Double Shoot has a credible beachhead in defense, law enforcement, and professional firearms instruction because the buyer already budgets for qualification, maintenance, and ammunition, and because a modest improvement in each training session can compound across a unit. Startup Nation Central classifies the company across defense and homeland security, combat equipment, and simulations and training, with Israel and the United States listed as target markets. The product also has a direct-to-user civilian route: the iOS App Store lists the application as free to download with paid access and an annual subscription, and tells users to print the company's targets from the app or website. This gives the company a low-friction way to test onboarding and gather product feedback, but it does not prove a large consumer business. The more strategically valuable route is enterprise or government deployment, where a command can standardize target formats, sight support, reporting permissions, and instructor workflows. A March 2020 partnership with Meprolight to upgrade the Foresight App supplied a channel and integration signal: an established Israeli sight manufacturer could use Double Shoot's zeroing capability inside a broader optic ecosystem. Public sources do not establish the current number of military customers, recurring revenue, or procurement contracts.

**Traction, funding, and third-party validation.** The public record is unusually concrete for a small defense startup, although it is not evidence of scale. Startup Nation Central reports that Double Shoot was founded in March 2017, operates with 1-10 employees, and raised $475,000 across two rounds, including a disclosed $140,000 round and a $335,000 seed round. The same profile records the Meprolight partnership and an app product stage of released. The Ministry of Defense's SIBAT material identifies Double Shoot as a rapidly growing Israeli startup, states that the company reported 30%-50% reductions in time and ammunition required for zeroing, and records that it had a granted Israeli patent plus an international patent application. Those savings remain company-reported and should be tested against controlled range data. There is independent product evidence: National Defense Magazine described the smartphone application at the 2019 NDIA Small Arms Outlook and reported that it was compatible with rifles used by the IDF, while the App Store shows continuing version history through January 2025, including algorithm improvements, bug fixes, comparison graphs, and leaderboard features. The patent posture is stronger than a marketing-only claim: public USPTO-indexed records list at least two granted US patents assigned to Double Shoot for firearm or firearm-sight calibration by processing target images, with Oren Avman, Tal Tinichigiu, and Itzhak Wilf named as inventors. No audited performance study or current contract list is public.

**Founders and team background.** The founding team is tightly matched to the problem. Oren Avman is a retired IDF Brigadier General who served in command and training roles, including division command, the company and battalion commanders' course, and leadership of the IDF Training and Doctrine Division. The International Institute for Counter-Terrorism at Reichman University identifies him as Double Shoot's co-founder and CEO and describes his background in combat leadership, national security, and project management. Tal Tinichigiu-Abergil is identified in the SIBAT brochure as an IDF Reserve Captain who spent more than five years leading the Weaponry Instruction Branch of the IDF Counter-Terror School. That gives the company unusually direct understanding of range procedures, instructor pain, unit reporting, and the difference between a technically interesting image algorithm and something that can be used during training. It also reveals the main team limitation: the public record names a small founding group but does not establish a larger engineering, sales, or regulatory organization. Itzhak Wilf appears in the US patent records as a co-inventor, but his current role and wider background are not confirmable from the sources reviewed. Headcount is best treated as a range rather than a precise current number.

**Competitive dynamics.** Double Shoot competes against several different substitutes, not one perfectly comparable startup. **ShotMarker** (electronic target hardware and range-management measurement) can provide richer automated scoring but requires dedicated range equipment rather than a phone-and-paper workflow. **Mantis** and its MantisX line (sensor-assisted shooting-performance feedback) emphasize weapon-mounted training data and coaching, creating an alternative way to quantify practice. **Applied Ballistics** (ballistic calculation and firearm software) competes for the shooter's digital workflow, although its center of gravity is exterior ballistics rather than target-image calibration. **Meprolight** (Israeli optic manufacturer and Foresight ecosystem) is both an integration partner and a potential channel owner that could internalize adjacent software over time. The largest incumbent is the **manual paper-target and instructor procedure** used by ranges and military units worldwide: it has almost no software cost, is familiar, and remains available when phones or networks are not. Double Shoot's edge is therefore a low-hardware, low-friction path from a target photograph to a repeatable record, plus a deployment story that can start with one shooter and expand to unit reporting. Its moat is less certain because image classification, mobile interfaces, and range analytics can be reproduced by better-capitalized optics, training, or defense companies.

**Defense, security, and resilience dual-use relevance.** Double Shoot qualifies as dual-use because the same core application is designed for civilian sport and training while its stated target buyers and validation channels include military and law-enforcement users. In defense, reducing calibration time and ammunition consumption can increase the number of personnel trained with a fixed range budget; consistent digital records can help instructors identify overdue practice and commanders see readiness trends; and a phone-based workflow can be easier to distribute than specialized electronic targets. National resilience relevance is similarly concrete but bounded: police, reserve formations, security contractors, and critical-site protection teams all need repeatable firearms qualification without assuming access to a sophisticated instrumented range. The company has stronger defense adjacency than many commercial apps because the Israeli Ministry of Defense included it in an official industry exhibition brochure, Startup Nation Central placed it in Aerospace, Defense and HLS, and its founding team includes senior IDF training and command experience. The limits matter. There is no public evidence reviewed here of a named current IDF procurement contract, classified deployment, NATO qualification, secure military-network integration, or operational use in combat. The product improves training and calibration; it is not an autonomous targeting, weapons-control, or battlefield decision system. The dual-use score should reflect credible cross-market applicability while preserving that distinction.

**Growth stage, trajectory, and key diligence risks.** Double Shoot is classified as **early** even though the company was founded in 2017, because its public footprint remains that of a small startup with a released product rather than a scaled defense supplier. The active iOS release history and paid subscription provide evidence of continued maintenance and a route to recurring revenue, while the Meprolight relationship, official SIBAT exposure, patent grants, and defense-media coverage show that the concept has reached beyond a prototype. The next trajectory question is whether the company can convert a useful app into a standardized training system sold to organizations. The principal diligence risks are: (1) current commercial scale is unverified, including revenue, paid subscribers, unit deployments, retention, and the status of the Meprolight integration; (2) phone-camera variation, lighting, target printing, occlusion, and image-quality failures could reduce trust at the exact moment a shooter needs reliable guidance; (3) military and law-enforcement procurement cycles can be slow, while civilian subscriptions may not support the cost of enterprise certification and support; (4) sensitive training records create privacy, access-control, retention, and cyber-security requirements, especially if unit-level reporting is enabled; (5) competitors can bundle similar features into optics, electronic targets, range-management platforms, or existing weapons-training contracts; (6) export controls and local firearms regulations can complicate expansion even when the software itself is non-weaponized; and (7) the small disclosed funding base may constrain product support, testing, and international distribution. The most useful next checks are a current customer reference, measured accuracy and savings against a manual baseline, present patent status, enterprise security documentation, and evidence that the 2025 app updates translated into paid and organizational adoption.
"""
