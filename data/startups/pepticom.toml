name = "Pepticom"
description = "Jerusalem biotech applying AI and reinforcement learning to discover therapeutic peptides, with an oral IL-17 program for autoimmune disease."
detailed_description = """Pepticom Ltd. is a privately held biotechnology company based at the Hebrew University of Jerusalem's Edmond J. Safra campus. Founded in 2011 as a Yissum-associated university spinout, it applies computational chemistry and artificial intelligence to the design of peptides and peptidomimetics for pharmaceutical and agricultural discovery. Its business has combined partner research programs with an internal therapeutic pipeline. Historical reporting described revenue from agricultural research and a collaboration with ADAMA; Pepticom separately announced a third crop-protection collaboration with ADAMA in 2018. These are dated collaborations, not proof of a current commercial contract or production deployment.

The platform is designed around target-protein structures and peptide docking. Pepticom describes reinforcement learning, molecular modeling, first-principles methods, generative approaches, synthetic data and wet-lab feedback. Its current company materials say it can work with about 600 natural and non-natural amino-acid building blocks, different peptide lengths and cyclic chemistries. The company's 10-to-the-80 chemical-space figure is a company claim about theoretical possibilities, not a measure of the number of compounds physically tested or a validated comparative performance result. This specialist focus is commercially plausible where flat protein-protein interfaces and oral availability make conventional small molecules or injectable biologics less attractive, but each designed sequence still has to survive synthesis, potency, selectivity, exposure, stability, toxicity and manufacturing tests.

The strongest public technical record is a 2022 peer-reviewed study by Pepticom researchers. It used reinforcement-learning-guided virtual screening to propose SARS-CoV-2 spike/ACE2 macrocycles, then synthesized and tested selected candidates. The paper reports that only competitive spike inhibitors reached hit-level activity; two clusters had single-digit micromolar assay results, and the authors characterized the work as a starting point for lead-stage molecules. That is useful evidence of a computational-to-experimental workflow, while also showing the gap between a modeling result and a therapeutic asset. It was not a clinical study and does not validate the company's later IL-17 program.

Pepticom's 2025 financing announcement says its internal program is developing oral cyclic peptidomimetic inhibitors of IL-17A and IL-17F for psoriasis and related autoimmune diseases. The company reported nanomolar activity and improved stability and half-life in vitro and in vivo, but did not publish a named development candidate, underlying data package or human-trial result in that announcement. Its current website still describes the program as being in lead optimization and refers to a candidate announcement planned for 2025, a milestone that has passed. A patent application published in 2026 covers IL-17 peptidomimetic inhibitors and is shown as pending in the patent record. Pepticom also announced virtual membership in JLABS in July 2025; that is incubator-network participation, not evidence of a Johnson & Johnson customer, license or investment.

The leadership combines academic peptide-design and biology backgrounds with commercial experience. CEO and co-founder Immanuel Lerner has a Hebrew University biochemistry PhD and postdoctoral background; CTO and co-founder Amit Michaeli developed the core design technology during doctoral work in peptide and protein design; CBO/COO Maayan Elias Robicsek has pharmacy, computational-chemistry and business training. Co-founder Anwar Rayan brings bioinformatics and chemoinformatics experience. The company profile and IVC list a small organization, but exact current staffing is not independently audited: LinkedIn gives an 11–50 band while IVC lists 12.

Publicly announced financing includes a $5 million Series A in 2019 and a $6.6 million Series A1 in 2025, led respectively by The Chartered Group and Japan Israel High Tech Ventures 2 LP. A 2021 announcement says Pepticom raised $2.6 million to establish the separate COVID-focused PeptiCov spinout; IVC lists this as a Pepticom Series A extension. IVC also lists earlier seed rounds, R&D grants and non-equity assistance but masks amounts and most investor names. Pepticom has not announced a lifetime funding total, so none is calculated here. The 2018 government company catalogue described historical co-ownership by Hebrew University, seed investors and the scientific team; current percentages and the present PeptiCov relationship are not public."""
