name = 'Hoop'
description = "Hoop is an Israeli security infrastructure startup enabling AI agents to safely access production data systems with automated PII masking, guardrails enforcement, and full session audit compliance."
detailed_description = """Hoop solves a critical blocker for AI-driven enterprise operations: most organizations prohibit AI agents from accessing production databases and sensitive systems due to regulatory, privacy, and security risk. Hoop deploys a transparent data access gateway that sits in front of heterogeneous data sources (PostgreSQL, MySQL, Kubernetes, SSH servers, gRPC services, and 5,000+ protocol types) and enforces three-layer protection: real-time sensitive-data masking (PII, SSN, PCI, PHI) at the wire, policy-based command guardrails that block destructive operations, and automated session logging for compliance evidence.

The product directly targets the operational velocity crisis in enterprise AI adoption. According to Hoop's messaging, manual access-request workflows cost enterprises 47 minutes per agent action; Hoop reduces that to 34 seconds, recovering approximately 920 engineering hours per month in representative deployments. The gateway adds <5ms latency per query and integrates transparently without requiring schema changes or application rewrites, making it deployable across heterogeneous infrastructure without engineering overhead.

Hoop is gaining traction with regulated enterprises (fintech, healthcare, payments, financial services) where SOC 2, GDPR, and PCI compliance are mandatory. Early customer deployments cite recovery of 93.7% of DBA toil (PicPay), reduction of access-provisioning time from 10 days to 1 day (Unico), and zero engineering hours for audit preparation. The company reports 5,000+ data sources unlocked for AI agents and $2.4M in new use-case pipeline value unlocked per quarter across customer base. The business model targets infrastructure-heavy, regulated enterprises willing to pay for provable risk reduction and compliance evidence generation.

Hoop was founded in 2022 in Tel Aviv, operates a lean team (11–50 employees), and has completed seed funding. The Israeli origin provides geographic and regulatory diversification for customers concerned about supply-chain security. Dual-use relevance is substantial: secure data access with mandatory audit trails and policy enforcement applies directly to mission-critical systems, classified-environment data-handling requirements, and defense-contractor operational security postures where human and AI agents must operate with full accountability and zero-trust access control. The product's masking and guardrails capabilities are directly applicable to defense-adjacent and government-sector AI deployments where sensitive data must be accessible to operational systems without exposure to unauthorized use or human operators."""

