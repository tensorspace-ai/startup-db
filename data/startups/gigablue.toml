priority_rationale = "Priority rank remains 0 because no explicit company-ranking scheme is established here. Gigablue deserves monitoring as a unique Israeli deep-tech entry at the intersection of climate resilience, marine science, carbon markets, and strategic environmental infrastructure. Reasons to track it include permitted field experience, Puro.earth methodology participation, a substantial announced offtake commitment, and a potentially low-land pathway to durable removal. Priority is capped by high scientific and ecological uncertainty, limited public financial disclosure, disputed or unreplicated performance claims, complex international permitting, and the absence of a demonstrated defense or security application. The next evidence that would justify a stronger priority signal is independently published field data tied to delivered credits, repeatable deployments, transparent lifecycle accounting, and verified customer payments."
