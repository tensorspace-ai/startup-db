investment_rationale = "UBQ is a private industrial scale-up with a differentiated route to process residual waste, an operating full-scale plant, named commercial adopters, and a confirmed €5 million EU Just Transition Fund grant. That supports strategic diligence interest in circular-material supply and regional resilience, but the public record does not confirm a Series B label, total capital raised, plant utilization, revenue, or profitability, and this is not an investment recommendation. The central diligence questions are qualified capacity utilization, unit economics versus virgin and recycled resin, feedstock and offtake contracts, product qualification by application, working-capital needs, financing for expansion, and the boundaries and verification of lifecycle and carbon-credit claims."

strategic_value = "UBQ could improve material and waste-flow resilience for manufacturers, municipalities, and selected defense-adjacent logistics networks by turning regional residual waste into a standardized polymer input. Its strategic value is conditional: the fixed industrial footprint, need for aggregated feedstock, undisclosed operating economics, and absence of public defense qualification limit near-term operational utility. The Bergen op Zoom plant, product portfolio, distributor access, and reported adoption by global brands provide a credible platform for regional industrial uptake, but not evidence of strategic autonomy or military readiness."

