name = "Gloat"
description = "Gloat is a privately held enterprise HR software company whose Loomra workforce context engine maps people, skills, roles, work, and organizational rules to power agentic HR workflows. Its platform helps large employers identify capability, redeploy talent, plan workforce changes, and deliver career or HR actions through tools such as Microsoft Teams, Microsoft 365 Copilot, Slack, and Google Chat."
detailed_description = """
Gloat was founded in 2015 and is presented publicly as a New York-headquartered private company with locations including Tel Aviv and London. Its current positioning centers on Loomra, a workforce context engine purpose-built for enterprise workforce data. Gloat describes a system that connects people, skills, roles, work, career interests, and organizational context so an enterprise can reason about who can do what, what capabilities are missing, and which governed workforce action should follow. This is more specific than a generic HR chatbot: the potential defensible asset is the organization-specific context layer and accumulated mappings of transferable skills, although the quality and portability of those mappings remain diligence questions.

The product has evolved from an internal talent marketplace into a broader agentic HR platform. Official materials describe talent redeployment, internal mobility, skills intelligence, workforce redesign, career guidance, candidate discovery, succession planning, workforce planning, HR operations, and learning or reskilling. Gloat says its agents can operate through Microsoft Teams, Microsoft 365 Copilot, Slack, Google Chat, email, and other work surfaces, while integrations connect to HCM, ATS, LMS, and project systems. Its April 2026 newsroom announcement says the Copilot Agent and Teams app are available through Microsoft Agent Store and Microsoft Marketplace. This distribution strategy addresses a real HR-software problem: recommendations have limited value if employees and managers must visit another portal, but in-flow actions raise the bar for permissions, explainability, auditability, reversibility, and change management.

The buying case is strongest for large employers managing restructurings, scarce skills, reskilling, AI adoption, and fragmented workforce data. Gloat currently reports more than 1.5 million employees served and more than 4.8 million strategic work hours unlocked; its technical pages additionally claim 100-plus enterprise customers, 200-plus deployments, 5 million-plus employee career patterns, and 112 countries. These are company-reported scale and model-performance signals, not independently audited operating metrics. The 2022 Series D announcement reported $90 million led by Generation Investment Management, $192 million raised in total, and a team of more than 250 at that time. LinkedIn currently lists 51–200 employees and 131 visible employees, so present headcount, revenue quality, retention, and deployment scale should be diligenced rather than inferred from historical fundraising.

Competition is substantial. Workday, SAP SuccessFactors, Oracle, Eightfold AI, Beamery, Phenom, Microsoft, and specialist internal-mobility vendors all address overlapping skills, recruiting, talent, or workforce-planning budgets. Gloat's plausible edge is the combination of internal-mobility heritage, semantic skill inference, a workforce graph, policy-aware business logic, and workflow delivery; it is not established that its models are uniquely accurate or that its orchestration layer will resist suite bundling. Defense and national-security relevance is limited and indirect. A military, civil-service, or critical-infrastructure employer could theoretically use the same capabilities for skills visibility, personnel redeployment, readiness planning, and reskilling, but the public record reviewed here does not establish defense customers, government contracts, security accreditation, or a defense-specific product. The company should therefore be treated as a commercial HR platform with transferable workforce-planning technology, not as a defense startup.
"""
