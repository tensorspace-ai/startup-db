name = "Loora"
description = "Israeli AI education company offering an English conversation tutor through consumer subscriptions and a business learning platform."
detailed_description = "Loora builds an AI English tutor for learners who need spoken practice rather than another vocabulary-only course. Its mobile app turns a learner's interests and practical goals into open-ended lessons, role-plays, reading-and-speaking exercises, and practice conversations. The product listens to speech, then returns feedback on pronunciation, grammar, word choice, and fluency; it also summarizes lessons and adapts later practice to prior interaction. The company describes the service as a bespoke system of large language models optimized for English learning. Current product materials emphasize adult professionals, job interviews, meetings, negotiations, and everyday conversation. The app is available through a freemium-to-subscription model: a learner can try a free lesson, while paid plans offer continued or unlimited practice, with local pricing varying by market. Loora also markets an organizational service with learner seats, progress analytics, administration, and business-specific role-plays. That creates a consumer subscription channel and a potential employer, school, and training-provider channel. Loora was founded in 2020 by Roy Mor and Yonatan Levin, is headquartered in Tel Aviv, and announced a $22 million Series B in September 2026. Its own release reported more than 15 million users and over 200 million AI conversations; these are cumulative reach and usage claims, not disclosed active or paid subscriber counts. Globes reported revenue had doubled year over year and ARR had reached tens of millions of dollars, without publishing an audited figure. The product is active in the App Store and the company is expanding international distribution, while the scale and economics of repeat paid use remain diligence items."
