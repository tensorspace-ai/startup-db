name = "Cyberbit"
description = "Cyberbit is a cyber readiness software company combining high-fidelity cyber range exercises with cloud-based individual and team training. It operates as a US-based organization with Israeli roots and has expanded its platform through the 2025 acquisition of RangeForce."
detailed_description = "Cyberbit develops software for hands-on cybersecurity workforce training and operational readiness. Its platform combines immersive cyber range scenarios, team exercises, individual labs, skills pathways, and readiness mapping. The product lets defenders rehearse detection, investigation, containment, and recovery in simulated environments rather than in production networks. Following its September 2025 acquisition of RangeForce, Cyberbit says the combined offer joins high-fidelity attack simulation with scalable individual and team exercises. The company now presents its business as US-based and lists a Wilmington, Delaware address. IVC reported that Cyberbit closed its Israeli operations in June 2026, while identifying the company as founded in Israel in 2015 as a cybersecurity spin-off from Elbit Systems. This history establishes an Israeli connection, but current Israeli operating presence should not be assumed.\n\nCyberbit's product is aimed at organizations that need to assess whether SOC and incident response personnel can apply skills under realistic pressure. Buyers can include corporate security teams, managed security providers, public agencies, educational institutions, and critical infrastructure operators. NIST's NICE success story describes the platform's use by industry, government, and education and its mapping of labs and exercises to NICE work-role knowledge and skill statements. Cyberbit's own government material describes exercises for public sector IT, cloud, and operational technology environments and says several RangeForce certificate programs received ANAB accreditation. These are evidence of product positioning and framework alignment, not proof of government-wide adoption, a specific defense contract, or measured effectiveness across customers.\n\nThe 2025 RangeForce acquisition is the clearest recent strategic change. It broadens the combined catalog from full cyber ranges to repeatable team and solo exercises, cloud delivery, and learning pathways. Cyberbit describes Charlesbank as its financial sponsor. The acquisition price and integration economics were not disclosed, so claims about synergies, scale, or market leadership remain company aspirations until supported by customer retention, cross-sell, and financial results. The product architecture must balance realistic, configurable range environments with lower-cost repeatable labs and reliable measurement; operating both approaches can create content and infrastructure complexity.\n\nPublic financing evidence is dated. Cyberbit announced a $30 million investment from Claridge Israel in June 2018. In May 2020 it announced a $70 million transaction involving a Charlesbank primary investment and a secondary purchase from Elbit Systems, with Claridge also participating. The announcement did not split primary and secondary proceeds, and Cyberbit has not been found to publish a lifetime funding total. In 2020 the company said its customer base doubled and ARR increased 100 percent over the prior year, but disclosed no absolute ARR. These historical company-reported figures establish earlier growth, not current revenue, profitability, customer count, retention, or financial health. Present cap-table percentages and any Elbit residual interest remain private.\n\nCompetition spans cyber ranges and broader hands-on security readiness products. SimSpace markets configurable cloud and on-premise range environments; Immersive Labs emphasizes workforce cyber skills and organizational resilience; Hack The Box offers technical labs and team learning; and CybExer serves cyber exercise and range requirements. RangeForce is now part of Cyberbit and should not be described as an independent competitor. Cyberbit's plausible differentiation is the combination of high-fidelity team simulation, hands-on tool practice, individual exercises, and readiness evidence in one workflow. Customer switching costs may arise from customized scenarios and integration with security tooling, but these advantages need evidence from renewal behavior and independently comparable buyer outcomes.\n\nThe business has meaningful dual-use applicability because the underlying capability trains defensive cyber personnel in both private organizations and public-sector environments. Publicly described use cases include SOC and incident response readiness, workforce education, and government training. Defensive training can support resilience across civilian infrastructure and government networks, but public evidence reviewed here does not establish particular military units, classified deployments, or operational defense contracts. The same distinction applies to customer claims: a named customer or case study confirms use only to the extent the source says, while a partnership, demonstration, or training pilot does not establish recurring paid production revenue.\n\nKey diligence priorities are current ARR and growth, gross and net retention, customer concentration, contract renewal cycles, acquisition integration costs, and the contribution of RangeForce to bookings. Buyers should also test whether readiness scores correlate with better incident outcomes, how often scenario content is refreshed, how securely customer-specific environments and data are isolated, and whether delivery economics remain attractive for both cloud labs and complex bespoke ranges. Current headcount, geographic distribution, patent ownership and status, and private ownership percentages were not disclosed in the reviewed public material."
