name = "Nym"
description = "Autonomous medical coding software that turns clinical documentation into explainable billing codes and sends eligible encounters directly into provider billing workflows."
detailed_description = """Nym, legally identified on its current website as Nym Health Ltd., sells autonomous medical coding software to U.S. hospitals, health systems, physician groups and revenue-cycle operators. Founded in 2018 by Amihai Neiderman and Adam Rimon, the company grew from a Tel Aviv-originated clinical-language project into a New York-headquartered healthcare software business with research and development operations in Tel Aviv. It remained privately held and active in 2026, when it appointed Lori Jones as CEO and continued publishing product material.

The product reads clinical notes in electronic health records, reconstructs the meaning and context of an encounter, maps the encounter to supported code sets, and routes successfully coded encounters to billing. Nym calls its approach Clinical Language Understanding (CLU). Its current product description says CLU combines machine-learning models with rules-based clinical ontologies; the company emphasizes traceable code-level rationales and customer-configurable coding guidelines. This differs from tools that only suggest codes for a coder to validate. Nym says encounters with missing information or insufficient confidence are sent to human coders, so it automates a defined portion of a workflow rather than removing the need for coding, compliance, audit and revenue-integrity staff.

The public product scope spans emergency medicine, radiology, outpatient surgery, outpatient visits, inpatient professional coding and urgent care. Nym reports that the engine supports Epic integration and received Epic Showroom Toolbox designation in the Fully Autonomous Coding category in August 2024. KLAS’s 2023 Nym profile describes per-chart pricing for successfully coded charts, with pricing varying by specialty, facility versus professional coding and customer volume. That makes deployment success, eligible-encounter coverage and chart volume central to customer economics.

The commercial record has advanced beyond pilots: Nym’s 2021 funding release said the product was deployed in more than 40 hospitals; a 2024 announcement reported more than six million charts processed annually; and a 2025 NYC Health + Hospitals board record authorized a three-year contract with two renewal options after a competitive RFP. Nym also publishes customer case studies for Inova and Genesis HealthCare System. These are useful implementation evidence, but company-reported performance figures should be validated against customer-side denominators, case mix and audit outcomes. In 2026 Nym described processing millions of charts annually for hundreds of healthcare facilities, a different scale measure from a count of distinct contracting customers.

One U.S. patent application published in 2020 describes generating standardized codes from electronic records using computational-linguistic analysis, narrative context, insight extraction and an audit trail. The available record establishes an application, not a granted patent or the status of a complete international portfolio. Nym’s product page states that the service is SOC 2 Type II and ISO/IEC 27001:2022 certified and HIPAA compliant; these are company disclosures and should be checked against current audit reports during diligence."""
