name = "Cymulate"
description = "Cymulate provides continuous breach and attack simulation (BAS) and security control validation, enabling organizations to measure and prove the effectiveness of their defensive security controls across the full attack surface."
detailed_description = """Cymulate Ltd is a privately held cybersecurity software company founded in Israel in 2016. It sells a subscription platform that uses controlled attack simulations to measure how an organization's deployed security controls prevent, detect, or miss real-world tactics. Its offering has broadened from breach and attack simulation (BAS) into threat exposure validation and exposure management: it combines threat and attack scenario libraries, testing across enterprise environments, exposure prioritization, detection engineering workflows, and vendor-specific remediation. Company product materials describe integrations into customers' existing security stacks and daily updates to threat scenarios. In February 2025 Cymulate announced AI-assisted assessment creation and automated control optimization; its August 2025 product announcement describes correlation of exposure data with proof of exploitability. These are vendor-described capabilities and product announcements, not independent efficacy evaluations.

The commercial proposition is to turn security testing into a repeatable feedback loop for security operations, red and purple teams, vulnerability management, and CISOs. The customer value hypothesis is practical: teams can test defenses more often than periodic manual penetration tests, identify which controls fail against selected techniques, prioritize issues with contextual evidence, and retest after changes. That can complement vulnerability scanners and red-team exercises, but does not replace them: simulation coverage depends on scenario fidelity, safe execution constraints, telemetry access, supported products, and the customer's ability to interpret and act on findings. A favorable control score is not proof that an organization is secure against unmodeled attacks.

Cymulate reports more than 1,000 customers in 50 countries on its current About page and repeated the 1,000-customer figure in a February 2025 release. Earlier releases reported hundreds of customers and hundreds of Fortune 500 customers; these are dated company claims and should not be added together or treated as audited customer counts. The company also attributes significant reductions in customer risk and improvements in prevention/detection to its platform. Such performance claims are company-reported averages or marketing metrics; public materials reviewed here do not expose methodology, sample sizes, control groups, retention, net revenue retention, ARR, gross margin, or audited revenue. An Israeli business-news report quoted approximately $15 million 2020 revenue and a doubling over 2019, an older reported figure that cannot establish current revenue or profitability.

The 2025 product direction adds AI and workflow automation to a competitive exposure-management market. Cymulate says an AI agent can generate environment-specific assessments, that its scenario workbench contains over one million attack actions, and that the product can push tailored optimization rules to supported controls. The strategic opportunity is to connect discovery, adversary evidence, validation, prioritization, and remediation in a continuous workflow. The strategic challenge is that an increasingly broad platform can be difficult to implement and explain, while vulnerability-management, CTEM, BAS, automated red teaming, attack-path management, and endpoint/cloud vendors increasingly overlap. Buyers will compare Cymulate with AttackIQ, SafeBreach, Picus Security, Pentera, and validation modules embedded in larger security suites. Its practical differentiation must be demonstrated through breadth and quality of integrations, safe and reproducible assessments, coverage of relevant threats, explainable prioritization, and low-friction proof that a remediation improved outcomes.

The founders identified in company materials are Eyal Wachsman, Avihai Ben-Yossef, and Eyal Gruner. Wachsman is identified as co-founder and CEO, and Ben-Yossef as co-founder and CTO. The company biography describes Wachsman's prior security consulting and sales/business-development work at Avnet Cyber & Information Security; the origin story describes Ben-Yossef's penetration-testing work there. Sales leadership appointments announced in May 2025 indicate investment in channel and regional go-to-market capacity, but do not establish hiring totals or realized growth. Company sources place its Israeli office in Holon; the company is Israeli-founded and maintains Israeli operations alongside international offices.

Financing disclosures correct the stale site narrative. Cymulate announced $3 million led by Susquehanna Growth Equity in March 2017, in addition to an earlier seed investment led by Eyal Gruner. In March 2019 it announced a $7.5 million Series A led by Vertex Ventures and Dell Technologies Capital; in November 2019 it announced a $15 million Series B led by Vertex Growth Fund. The May 2021 Series C was $45 million led by One Peak, with existing investors Susquehanna Growth Equity, Vertex Ventures Israel, Vertex Growth, and Dell Technologies Capital. The September 2022 Series D was $70 million led by One Peak with participation by those existing institutional investors. Cymulate reported $141 million raised to date with the Series D. A 2017 media report gives the founder-led seed amount as $500,000, while the 2017 company release does not disclose it; this is a reported historical amount, not a new institutional round. No later financing announcement, transaction, parent, public listing, or disclosed cap table was verified in the reviewed sources. Private ownership percentages and current valuation remain unavailable; third-party valuation databases are not treated as primary evidence.

The platform has material commercial cybersecurity and potential public-sector/defense relevance because defensive readiness testing can serve enterprises and government cyber teams. Public evidence reviewed supports product applicability to defensive control validation, not a specific military deployment, classified use, government contract, or certification. The appropriate dual-use thesis is therefore capability-based and bounded. A single active US patent family assigned to Cymulate Ltd, concerning security threats from lateral movement and mitigation, illustrates some proprietary technical work; the record alone does not establish broad patent protection or freedom to operate. Diligence should establish current revenue and growth, customer retention and concentration, deployment and renewal economics, validated outcome methodology, product safety and liability controls, integration maintenance costs, AI data handling and model governance, patent portfolio scope, and whether government/defense exposure is actual commercial traction or only a plausible adjacent market."""
