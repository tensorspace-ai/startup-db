name = 'Seraphic Security'
description = "Seraphic Security is an Israeli-founded browser security company delivering in-browser threat detection and session protection for enterprise workforces, with strong dual-use relevance for commercial and government-adjacent defenders."
detailed_description = """Seraphic Security develops browser-layer threat detection and session-hardening technology for enterprise defenders facing a high-frequency web-borne threat landscape. The platform operates at the browser level—not as a remote browser isolation (RBI) overlay—to detect malicious web content, prevent credential theft, enforce policy-based access controls, and respond to phishing and script injection in real time. This browser-native approach is designed to deliver protection without the latency tax or user friction of full terminal-server or container-based browser isolation, making it suitable for distributed workforces requiring responsive interactive use of SaaS and web-app ecosystems.

The company was founded in Israel by experienced cybersecurity operators and emerged from stealth in 2024. It secured a $29 million Series A funding round and has built an early commercial traction base in enterprise security buyers across North America. The founding team brings credible backgrounds in Israeli military and commercial cyber defense, positioning the company with domain expertise in both threat modeling and product-market understanding. The company operates dual headquarters in Tel Aviv and San Jose, reflecting its Israeli roots and U.S. market focus.

The core technology addresses a real and expanding attack surface: the browser is the primary vector through which phishing, credential harvesting, malware delivery, and account compromise occur for distributed enterprises. Traditional endpoint protection, network-layer defenses, and even identity systems cannot fully mitigate browser-mediated threats because malicious payloads execute within the user's trusted context. Seraphic's approach complements zero-trust identity, endpoint protection, and SSE/SASE frameworks by operating where attacks often initiate. The company's positioning as a browser-native, low-friction alternative to remote browser isolation appeals to buyers seeking advanced web protection without wholesale architecture redesign.

From a commercialization perspective, Seraphic targets enterprise security operations, insider-threat mitigation, and workforce protection buyers—segments with strong budgets and clear ROI thresholds for phishing and credential-theft prevention. The Series A funding and stated early traction suggest credible customer validation; Israeli defense-adjacent founders and a browser security focus also signal potential alignment with government-facing security buyers and U.S. federal contractors requiring hardened web-access controls.

Dual-use relevance is substantial: browser-layer threat detection and session control are critical for both commercial enterprises and government/defense systems that rely on web-delivered workflows, classified research access, or sensitive mission infrastructure accessed through standard browsers. Threat actors and state-sponsored teams actively target browser sessions and web-based supply chains; the ability to harden browser-mediated access is as relevant to .mil and .gov environments as to Fortune 500 firms. The technology does not inherently require export controls, but its strategic value to U.S. national security is clear."""
