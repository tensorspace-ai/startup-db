name = "Perion Network"
description = "Perion Network Ltd. is a public Israeli advertising-technology company providing AI-native infrastructure for real-time media execution across CTV, digital out-of-home, commerce and retail media, social, and digital channels. Its Perion One platform centers on the Outmax AI agent, which allocates spend, manages pacing, and optimizes measurable outcomes within advertiser-defined guardrails."
detailed_description = """
Perion Network Ltd. is an established advertising-technology operator headquartered in Tel Aviv and listed on Nasdaq and the Tel Aviv Stock Exchange under PERI. Its current strategy, Perion One, consolidates the company around an execution-layer thesis: marketers define objectives, budgets, and creative direction, while Perion's software and AI agents act on live media-buying decisions. Outmax is described by Perion as a production-grade AI agent that can allocate spend, manage pacing, and optimize outcomes across Perion and external environments including YouTube, The Trade Desk, and Meta. This is more specific than generic "AI-powered marketing" language because the claimed product role is automated execution under operational constraints.

The product surface spans connected television, digital out-of-home, commerce and retail media, social, open-web, and walled-garden environments. The commercial problem is structural: brands, agencies, and retailers must coordinate fragmented inventory, measurement conventions, creative formats, and performance objectives while media conditions change continuously. Perion's value proposition is to make that complexity executable through cross-channel decisioning, unified reporting, optimization, and automation. The company also retains privacy-oriented capabilities such as SORT, which uses cookieless signals including context, time, weather, and device characteristics to classify likely intent without using personally identifiable information. WAVE applies generative AI and dynamic triggers to audio creative, adapting messages to contextual conditions such as location, weather, and time.

Perion has meaningful commercialization signals because it is a listed company with a long operating history, disclosed revenue and profitability metrics, enterprise-facing products, and a global workforce. Its current website describes 630+ people across 40+ markets and 11 offices; the March 2026 investor presentation gave the more precise snapshot of 619 employees worldwide as of March 31, 2026. Perion's Q1 2026 release reported $90.4 million of revenue, $39.7 million of contribution excluding traffic acquisition costs, and 316% year-over-year growth in Outmax AI-agent spend on a pro-forma basis. The company also reported $439.9 million of fiscal-2025 revenue and $45.2 million of adjusted EBITDA in its FY2025 investor materials. These figures indicate operating scale and early adoption signals, but they do not by themselves prove that Outmax, SORT, or WAVE will create durable incremental returns. Diligence should separate reported company-wide economics from the contribution of newer AI products and test retention, take rates, gross-margin quality, customer concentration, and the quality of non-GAAP adjustments.

The competitive field includes scaled demand-side platforms such as The Trade Desk, retail-media and commerce platforms such as Criteo and Amazon, supply-side and omnichannel specialists such as Magnite and PubMatic, and platform-native buying systems from Google and Meta. Perion's potential edge is breadth combined with an execution-layer narrative: it can apply optimization across several channels while remaining connected to external platforms. That advantage is vulnerable to distribution, data access, and scale economics. Larger platforms can bundle buying, measurement, identity, and inventory, while AI optimization features can diffuse quickly across the category.

Defense and national-security relevance is limited. Privacy-safe inference, real-time optimization, and adaptive content generation are technically adjacent to broader decision-support and resource-allocation problems, but Perion's core product is commercial advertising and there is no verified evidence here of defense customers, mission-system integration, intelligence use, or security-specific product design. It is therefore better treated as a commercial AI and ad-tech benchmark than as a dual-use startup or defense supplier. The strategic questions are commercial durability, regulatory compliance, quality of media outcomes, dependence on channel partners, and whether Perion One can turn an integrated product story into repeatable, higher-quality economics.
"""
