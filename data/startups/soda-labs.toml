name = "Soda Labs"
description = "Israeli cryptography startup building garbled-circuit multi-party computation infrastructure for confidential on-chain applications."
detailed_description = """Soda Labs is an Israeli cryptography company developing Bubble, a privacy layer for blockchain applications based on garbled-circuit multi-party computation (GC-MPC). The company positions its system as an alternative to execution models that expose application inputs or rely on fully homomorphic encryption. Its October 2026 seed announcement describes a stack built from garbled circuits and standard AES/SHA-256 primitives that can run on ordinary cloud CPUs. This is a company description of its implementation; independent evaluation of its comparative security and cost claims remains limited.

The company is legally registered in Israel as SODA BUBBLE LABS LTD (Israeli company number 516892551), with a registration date of November 20, 2023. Its website and LinkedIn profile identify Tel Aviv as its headquarters; a registry-derived profile lists a registered address in Oranit. Bubble is presented as a programmable confidentiality layer for financial and other smart-contract use cases. Soda Labs says it has deployed on COTI and supports Ethereum, Polygon, Arbitrum and Base, and its site reports a July 2026 benchmark of 500 confidential transactions per second end to end on Arbitrum across more than 15,000 transfers. These are vendor-reported product claims, not audited commercial results.

The team is led by co-founders Avishay Yanai, CEO, and Meital Levy, CTO. Their academic and engineering backgrounds are relevant to the product: Yanai has a PhD in cryptography and secure MPC from Bar-Ilan University and prior enterprise MPC work at VMware; Levy has a PhD in algorithm optimization from Tel Aviv University and experience in distributed systems and cryptographic protocols. Their 2026 gcVM paper with collaborators describes publicly auditable MPC for private EVM-compatible computation. The paper is a research preprint, and the operational security, decentralization assumptions and production performance of the commercial service require separate diligence.

Soda Labs announced a $3 million seed round on October 8, 2026, fully funded by Luxembourg-based NextBlock. It also received recognition as the first recipient of a COTI Foundation ecosystem growth grant in January 2024, but the grant amount to Soda was not disclosed; the $25 million figure in that announcement was the size of the overall COTI fund. No company-announced lifetime total, revenue, ARR, profitability or customer contract value was found. Soda reports COTI integration and pilots with Chainlink Labs and the European Central Bank Pioneer programme, while the latter pilot claims are currently supported by company material. Pilots and ecosystem usage do not establish paid customer adoption. The company also says products built with its tools are used by applications such as Zoniqx and PriveX; reported trading volume for PriveX is not Soda Labs revenue or a Soda-specific transaction count."""
