investment_rationale = """Soda Labs addresses a real engineering constraint in blockchain applications: public execution makes many financial and identity workflows difficult to operate without exposing sensitive inputs. Its GC-MPC approach is a technically differentiated option in a category where FHE, trusted execution environments, zero-knowledge proofs and conventional access-controlled services all compete. A potentially attractive product wedge is allowing existing EVM-compatible applications to use confidential state without requiring a new application-specific privacy primitive. The company says Bubble is live with COTI and supports several EVM networks, but broad chain compatibility should be verified at the contract, tooling and production-operations levels rather than inferred from a product list.

The seed round supplies disclosed early financing and a named lead investor, while the 2024 COTI Foundation grant provides evidence of earlier ecosystem support. The grant's amount and terms remain undisclosed, so it cannot be combined with the seed into a precise total raised. The financing evidence is too thin to assess capital efficiency, dilution, runway or follow-on financing needs. No public revenue, recurring revenue, gross margin, customer concentration or independently verified paid deployments were found. The company's stated plan to use seed proceeds for the next 12–18 months is a forward-looking plan, not a verified cash runway.

The strongest potential commercial evidence is a product deployment connected to COTI and named downstream applications, plus pilots that could validate demand. The public record does not yet establish which deployments pay Soda Labs, how much private workload is Soda-specific, whether integrations are production workloads, or what users will pay for confidential execution. The reported 125 million figure appears on the company site as a confidential-transaction count, while COTI separately describes more than 125 million total network transactions since launch. Those quantities should not be treated as equivalent without a transparent metric definition and third-party attribution. The 500 transactions-per-second figure is a company benchmark on Arbitrum over a specified test, not evidence of sustained production throughput under adversarial load.

Accordingly, the investment case rests on technical promise and the possibility that privacy becomes a required feature in tokenization, decentralized finance and institutional on-chain workflows. It does not yet rest on demonstrated recurring software revenue or a proven sales motion. Diligence should establish paying customer count, deployment scope, fees and renewal behavior; separate a partner's network-wide activity from workloads attributable to Soda; and quantify the performance/security tradeoffs of its GC-MPC design relative to alternatives. The undisclosed grant and seed instrument, latest cap table, actual runway, and third patent status also need primary documentation."""
strategic_value = """If it works as described, confidential computation can expand the set of financial workflows that can use public or shared blockchain infrastructure. Token issuance, collateral management, settlement instructions, identity-linked eligibility and institutional trading may need selective disclosure: parties need to compute against data without publishing every input to the network. Soda Labs' strategy is to provide that capability as infrastructure for existing smart-contract environments, rather than market a standalone consumer application. That strategy can create leverage through integrations, developer tools and shared protocols, but it also exposes the company to the adoption and architecture decisions of host chains and ecosystem partners.

COTI is both an early ecosystem relationship and a concentration risk. The COTI Foundation's grant and Soda's reported deployment establish a historical connection, but public evidence does not reveal the grant amount, exclusivity, commercial terms or the share of Soda's activity attributable to COTI. The company's claim that Bubble also supports Ethereum, Polygon, Arbitrum and Base could reduce single-network dependence if customers can use those deployments in production. Product documentation, independent workload measurements and customer references are needed to determine whether the deployment list translates into diversified demand.

The January 2024 COTI grant, subsequent academic publication, patent grants and 2026 seed announcement form a plausible development chronology from research to product. The European Central Bank Pioneer programme claim could provide useful validation of a problem and prototype, but it should be treated as a pilot until the programme or a customer independently confirms scope, procurement and production status. Likewise, a completed Chainlink Labs pilot may signal technical fit without representing a commercial contract. These distinctions matter because pilots can consume engineering resources without creating recurring revenue.

The company's strategic value will depend on whether it can make privacy composable, auditable and operationally dependable. Institutional users will require an explicit data-access model, key and participant governance, recovery behavior, auditability, monitoring, predictable latency, and clear responsibility when a computation fails. A cryptographic primitive alone is not sufficient. The company needs to show how its system handles collusion assumptions, sequencer or executor availability, upgrades, incident response, and independent audits in the exact current product configuration."""
competitive_edge = """Soda Labs differentiates around garbled-circuit MPC for private EVM-compatible computation. Its gcVM work emphasizes public auditability of MPC execution, and the commercial product claims to use common cryptographic primitives and standard cloud CPUs. If the company can demonstrate a strong threat model with practical throughput and low integration burden, GC-MPC could be attractive for developers who need protected computation but do not want to move business logic into specialized hardware or a closed execution environment. Its founders' cryptography and distributed-systems backgrounds are a relevant capability advantage, and two U.S. patents identify formal work in MPC and blockchain mechanisms.

The comparison is not simply a contest of raw throughput. Zama's fhEVM and Fhenix's confidential EVM approach use fully homomorphic encryption, allowing computation over encrypted data with a different performance, trust and programmability profile. Arcium offers MPC-based encrypted computation in the Solana ecosystem. Trusted execution environments, private database services, zero-knowledge proof systems and application-specific permissioned networks are also substitutes, especially when customers value simpler operations or selective disclosure more than general-purpose private computation. Soda must show where GC-MPC wins on end-to-end cost, privacy guarantees, composability and deployability, not only on an isolated benchmark.

Independent audits provide useful but time-bounded evidence. Hacken's 2025 review of Soda/COTI components recorded numerous findings; the published summaries indicate most were resolved, with some accepted or mitigated. A separate go-ethereum scope describes a centralized operating model at that time and availability risks around its sequencer/executor arrangement. These are not proof of current defects, but they make the current architecture, remediation evidence, decentralization roadmap and re-audit status essential diligence. The company's own current security page says the service is independently audited, but the specific scope and date of the current production release should be reconciled against public reports.

Intellectual property is an additional differentiator only if it protects commercially important implementation and is owned, maintained and enforceable. USPTO material corroborates two Soda Bubble Labs grants in April 2026; another blockchain virtual-machine application was pending in the reviewed patent data. The company website says three granted U.S. patents. This discrepancy needs a patent number and prosecution-status reconciliation. Patent counts alone do not demonstrate freedom to operate or technical defensibility."""
stage_rationale = """Soda Labs fits an early-stage profile: a 2023 Israeli entity, a disclosed 2026 seed round, research output, product claims and ecosystem pilots, with no public recurring revenue or audited financial statements located. A dated LinkedIn profile places the company in the 2–10 employee band, but that is a platform range rather than verified headcount. The evidence supports a company progressing from cryptographic research to early deployment, not a mature commercial vendor. The stage label should move only with verifiable customer contracts, production usage attributable to Soda, repeatable sales and financial disclosure."""
priority_rationale = """The legacy internal priority flag is left off. The company merits further tracking because it combines a technically specific privacy approach, experienced founders, a named seed investor, patents and an apparent live ecosystem deployment. The priority case is constrained by sparse financing history, no public unit economics, unverified customer conversion, reliance on partner ecosystems, a difficult-to-compare performance claim, unresolved patent-count discrepancy and audit questions about the earlier operating model. Priority should be revisited if independent customer evidence, current security attestations and a clear revenue model become public. This is a catalog signal, not an investment recommendation."""
