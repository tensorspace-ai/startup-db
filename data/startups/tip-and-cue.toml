name = "Tip and Cue"
description = "Tip and Cue, now operating publicly as Tenna Systems, develops software-driven RF spectrum intelligence for detecting, classifying, and geolocating interference and improving resilience of connected systems in contested electromagnetic environments. Its primary market is defense and aerospace, with credible extensions into aviation, maritime, telecommunications, autonomous mobility, and critical infrastructure."
detailed_description = """
Tip and Cue is the former name of Tenna Systems, an Israeli-founded, U.S.-operating defense software company focused on the electromagnetic spectrum rather than conventional imagery or kinetic targeting. The company says its platform ingests RF observations from existing airborne, space-based, terrestrial, commercial, and tactical sensors and turns them into a real-time view of coverage gaps, interference, and emitter activity. Its named products are Arena for spectrum visibility and interference monitoring, Tracer for emitter geolocation, and Halo for embedded electronic-warfare resilience. The technical value proposition is software-defined and hardware-agnostic: improve awareness and response speed without requiring a new bespoke sensor deployment for every mission.

The customer problem is concrete. Jamming, spoofing, and unplanned interference can degrade GPS/GNSS, communications, unmanned systems, aircraft operations, and maritime navigation while leaving operators with incomplete or delayed explanations. Tenna's target users therefore include defense and government organizations, aerospace and aviation operators, maritime stakeholders, tele-operations and autonomous-vehicle teams, telecommunications providers, and critical-infrastructure owners. Commercial adoption is plausible where an operator needs a shared picture of connectivity risk or early warning of degraded service, but the economics and proof burden are likely strongest in government and mission-critical markets where avoided disruption has unusually high value.

The public traction record is materially stronger than the prior entry suggested, although much of it remains company- or investor-reported. Tenna's official site identifies the company as formerly Tip & Cue and announces a $13.5M seed round led by Costanoa Ventures with Viola Ventures and other participants. The company and Costanoa describe early defense traction, and public company posts reference a U.S. Army Phase II award, a U.S. Department of Transportation ARPA-I Stage 1 win, and work with U.S. and allied defense organizations. These are useful diligence signals, not substitutes for contract documents, deployment metrics, revenue, or customer references. The official careers page also describes production-oriented RF signal-processing, TDOA, crowdsourced sensing, geospatial, and cloud-data engineering needs, which is consistent with a technically substantive platform rather than a generic dashboard.

Competition includes specialist RF and geolocation vendors, sensor-network companies, counter-UAS and electronic-warfare providers, defense primes, and government-developed C4ISR systems. Tenna's potential edge is the combination of vendor-neutral data ingestion, distributed sensing, real-time interference analytics, and products that connect visibility to mitigation and resilience. That edge will only become durable if the company can demonstrate accuracy in noisy environments, low latency at operational scale, interoperability with classified and legacy systems, and repeatable deployment across allied jurisdictions. For national-security purposes, the company is strategically relevant because spectrum awareness is an enabling layer for communications, navigation, autonomy, and precision operations; for commercial purposes, the key question is whether non-defense use cases can become repeatable revenue rather than bespoke pilots.
"""
