name = "AIR"
description = "AIR (legal entity AIR VEV Ltd.) is an Israeli aerospace OEM developing electric vertical-takeoff-and-landing aircraft for piloted personal aviation and uncrewed cargo operations. In March 2026 the company reported two AIR Cargo aircraft delivered, more than $35 million in book revenue, and over $1 billion in orders, while AIR ONE passenger aircraft remain contingent on FAA certification and production."
detailed_description = """
AIR develops a compact electric vertical-takeoff-and-landing aircraft family built around a common airframe and systems architecture. The piloted AIR ONE is a two-seat personal aircraft intended for the general-aviation and light-sport-aircraft market, while the cargo and defense configurations use the same design logic for autonomous or remotely supervised transport. AIR highlights folding wings and engine arms, a roughly one-hour endurance target, a 115-knot cruise figure for the private aircraft, and a cargo configuration advertised at 550 pounds of useful load and 70 cubic feet of cargo space. Its Fly-By-Intent flight-control system is described as translating operator intent into stable commands inside a safe flight envelope; that is strategically relevant, but the company’s marketing description should not be treated as independent evidence of autonomy or safety certification.

The company has meaningful commercialization signals for an eVTOL startup. AIR says a first logistics customer received initial aircraft deliveries in 2023, that it has completed full-scale flight phases including nighttime BVLOS uncrewed cargo operations, and that it announced a $23 million Series A led by Entrée Capital in July 2025. It also reports more than 2,500 AIR ONE pre-orders and plans for 15 uncrewed cargo deliveries, although these are company-reported orders or plans rather than independently verified backlog, revenue, or recurring flight operations. The U.S. expansion includes a Florida operations center and an FAA Experimental Airworthiness Certificate for a prototype. That certificate is an important test and regulatory milestone, but it is not equivalent to full type certification or unrestricted commercial passenger operation; AIR’s own site still describes the LSA certification as pending.

AIR is pursuing an industrialization strategy rather than presenting only a vehicle concept. In June 2025, EDAG announced a letter of intent covering development and manufacturing of mass-production-ready AIR ONE variants and said it was responsible for the main structure and related assemblies. AIR also describes a 32,000-square-foot production facility in Israel and a supplier network spanning propulsion motors, sensors, avionics, battery cells, motor controllers, and other aircraft systems. These relationships may reduce some manufacturing and integration risk, but they do not eliminate the difficult work of qualification, supplier assurance, configuration control, quality systems, field maintenance, and sustainable unit economics. The diligence focus should be delivered aircraft, flight hours, repeatability, certification artifacts, and cash runway rather than headline partner count.

The market position is differentiated but exposed. AIR is not competing only for urban air-taxi routes: it is targeting personal flight, time-sensitive cargo, remote-site access, disaster response, and defense logistics. A runway-independent aircraft with a useful cargo bay could serve island, offshore, infrastructure, or emergency routes where road access is slow and helicopter economics are unattractive. At the same time, the platform must compete with conventional helicopters, fixed-wing utility aircraft, large unmanned systems, and better-capitalized eVTOL companies. Battery energy density, reserve requirements, weather, noise, charging, pilot or remote-operator workload, maintenance intervals, and airspace permissions will determine whether the aircraft is operationally superior rather than merely novel.

The dual-use case is substantive because the core product is an aircraft and cargo system, not a civilian technology being stretched into a defense narrative. Cargo variants could support distributed resupply, medical or disaster logistics, remote sensing support, and movement of small payloads where roads or runways are unavailable. The company also publicly presents a defense platform and references collaboration with the U.S. Air Force’s Agility Prime ecosystem, but the public record reviewed here does not establish a fielded defense contract, military adoption, or a validated contested-environment capability. Strategic value therefore rests on adaptable mobility infrastructure and manufacturing know-how, with substantial execution and certification risk still outstanding.
"""
