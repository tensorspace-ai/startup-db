key_technologies = ["Heavy- and medium-lift unmanned aerial vehicles", "Micro-surveillance drone airframes and electro-optical payloads", "Tethered aerial platforms for persistent observation or firefighting", "Drone-based inspection, mapping, and agricultural data collection", "Custom airframe, payload, and mission-system engineering", "Drone-as-a-service operations and operator training", "AI-assisted aerial data collection and analysis"]
