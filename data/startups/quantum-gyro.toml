name = "Quantum Gyro Ltd"
description = "Israeli deep-tech startup developing compact nuclear-magnetic-resonance (NMR) gyroscopes and quantum-enhanced inertial sensing for navigation when GNSS is unavailable, jammed, or unreliable."

detailed_description = """
Quantum Gyro develops NMR-based inertial sensing for measuring rotation without depending on satellite signals. Its stated architecture detects shifts in the Larmor precession frequency of nuclear magnetic moments in an applied magnetic field, using an optically pumped magnetometer to read the weak signal. The company presents a chip-scale, lower-power design rather than a finished catalog product: its public development targets include 0.005 degrees per square-root hour angular random walk, 6 ppm scale-factor stability, and a bias-drift objective below 0.01 degrees per hour. These figures are targets or public company claims, not independently verified field results.

The technical program combines atomic-cell engineering, optical readout, magnetic-field control, and packaging. Quantum Gyro describes a single-laser dual-frequency/polarization readout, hydrogen-assisted wall passivation intended to extend transverse coherence time, and monolithic vapor cells with integrated coils and micro-heaters. The company website also describes a cell containing helium, xenon, and rubidium as part of its development proposal. If these elements can be made repeatable across temperature, vibration, magnetic interference, and manufacturing variation, the approach could occupy a useful middle ground between inexpensive MEMS gyroscopes and larger, more expensive high-grade inertial systems. The principal technical question is not whether NMR rotation sensing is physically plausible, but whether the complete sensor maintains calibration, startup behavior, reliability, and cost at vehicle level.

The initial market is B2B and systems-led. Likely applications include unmanned aerial vehicles, ground and maritime autonomy, aerospace navigation, industrial robotics, and other platforms that need continuity through GNSS outages or interference. In November 2025, Maris-Tech disclosed a collaboration to develop ME-Nav, combining its edge-AI computing with Quantum Gyro sensing for GNSS-denied navigation. The announcement described a planned jointly owned commercialization entity, a milestone-based development plan, and intended exclusive manufacturing, marketing, and distribution rights for Maris-Tech; it did not establish product revenue, production deliveries, or customer qualification. In March 2026, Maris-Tech disclosed that Quantum Gyro had licensed relevant navigation technology from parent Quantum X Labs and that a U.S. provisional patent application had been filed by Quantum X Labs. These are meaningful commercialization and IP signals, but remain early-stage evidence.

Competition comes from mature MEMS, fiber-optic, ring-laser, and hemispherical-resonator inertial systems, as well as other atomic and cold-atom navigation programs. Quantum Gyro’s potential edge is a compact NMR sensor with lower drift and lower SWaP than conventional tactical-grade alternatives, coupled with a partner that can provide edge processing and access to defense and autonomous-platform integrators. That edge is conditional: published information does not yet show independent test data, a qualified production design, recurring customers, or a completed ME-Nav product. Defense relevance is credible because GNSS-denied navigation supports autonomy, mission continuity, and resilience in contested environments, but procurement, export-control, cybersecurity, and environmental qualification requirements may be substantial.
"""

