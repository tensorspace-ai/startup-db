name = "ApolloShield"
description = "ApolloShield is an Israeli counter-UAS startup developing radio-frequency sensing, direction-finding, command-and-control, and electronic-mitigation products for detecting and responding to unauthorized drones. Its stated customer set spans security, critical infrastructure, public-safety, and defense environments, but current scale, customer concentration, and repeat revenue require direct diligence."
detailed_description = """ApolloShield's public product portfolio is centered on RF-based counter-drone operations. The company describes an Omni RF Sensor for presence detection at up to 1.5 km and a Directional RF Sensor with a stated 2–5 km range and multi-sensor triangulation. Its broader catalog includes an RF Sense&Block unit, handheld and fixed/mobile RF jammers, a vehicle-mounted C-UAS configuration, and a Command Center with alerts, APIs, on-premise or cloud operation, and manual or automatic blocking modes. The official site also describes an AI-assisted threat library and RF fingerprinting intended to classify drone and controller communications. These are company claims; public materials do not provide enough test protocol, false-positive rates, coverage conditions, or independent validation to treat the headline ranges as general performance guarantees.

The underlying problem is concrete: inexpensive commercial and improvised drones can create surveillance, contraband-delivery, safety, and attack risks around sites where conventional air-defense systems are too expensive or too coarse. RF detection can be valuable because a controller, telemetry link, or video link may reveal a drone before visual confirmation, and direction-finding can help security teams prioritize a response or investigate the operator. The approach is not universal, however. Autonomous, pre-programmed, frequency-hopping, low-emission, or fiber-optic-controlled aircraft can reduce RF observability, while RF interference can affect lawful communications and nearby systems. Effective deployments therefore often need layered sensing, clear rules of engagement, and human authorization rather than a single sensor or jammer.

ApolloShield appears to sell an integrated hardware-and-software system rather than a pure analytics product. That can simplify procurement and installation for a buyer seeking one interface, but it also creates certification, spectrum, export-control, maintenance, and systems-integration burdens. The website says the products are field-proven and customizable, and presents a three-minute setup for the Omni sensor; those statements are useful commercial signals but are not the same as independently documented deployments, revenue, contract awards, or sustained service-level performance. Historical ecosystem sources identify ApolloShield with YC's Summer 2016 batch and report a small early team and seed financing, while the available current public record does not establish present headcount, capitalization, backlog, or geographic sales footprint.

Strategically, the company is relevant to the counter-UAS layer of defense and homeland security because RF sensing and electronic mitigation can protect bases, borders, airports, prisons, utilities, and large events from low-cost aerial threats. The dual-use case is substantive: the same detection and command software can support civilian perimeter security and defense operations, subject to local authority and spectrum law. ApolloShield is nevertheless a small participant in a crowded market that includes dedicated counter-UAS vendors, electronic-warfare providers, sensor-fusion companies, and large defense integrators. Its investment case therefore depends less on market narrative than on evidence of detection performance against modern and autonomous drones, lawful mitigation approvals, repeatable deployments, gross margins, channel access, and the ability to keep its threat library current."""
