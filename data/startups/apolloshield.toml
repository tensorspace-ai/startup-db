investible = true
investment_rationale = "ApolloShield fits a strategic dual-use thesis because it addresses a real low-cost aerial-threat problem with RF sensing and electronic mitigation, and its official catalog spans portable, fixed, mobile, and command-center products. The positive case requires verification of current operations rather than relying on category momentum: investors should request recent deployments, recurring versus project revenue, detection and false-alarm data, performance against autonomous and frequency-agile drones, regulatory approvals, production economics, and customer references. Historical public sources indicate YC participation and seed financing, but do not establish current capitalization or traction. The company merits priority diligence as an early-stage strategic technology candidate, not an investment recommendation."
strategic_value = "ApolloShield could contribute to layered site defense by providing an accessible RF-centric sensing and response layer between visual observation and higher-cost air-defense assets. Its potential strategic value is highest where rapid setup, operator investigation, portable coverage, or integration with existing security systems matter. Israeli origin and counter-UAS specialization may be relevant to allied security ecosystems, but those are not substitutes for evidence of procurement eligibility, exportability, interoperability, cyber hardening, and performance in contested RF environments."
