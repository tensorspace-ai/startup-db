key_technologies = ["RF fingerprinting and passive drone/controller signal detection", "AI-assisted RF threat-library classification", "Directional RF sensing and multi-sensor triangulation", "Command-and-control software with alerts, APIs, and on-premise or cloud deployment", "Electronic countermeasure and command-link disruption systems", "Portable, fixed, vehicle-mounted, and integrated C-UAS configurations"]
