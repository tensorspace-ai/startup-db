name = "Stigg"
description = "Stigg provides a developer-focused usage runtime and monetization control plane for AI and SaaS products. Its APIs and SDKs model products, plans, entitlements, subscriptions, credits, and usage events so teams can enforce access and pricing rules in real time while connecting to existing billing and CRM systems."
detailed_description = """
Stigg is positioning itself as the usage runtime and monetization control plane for AI products and modern SaaS. Its core abstraction is not merely an invoice: teams define features, meters, products, plans, add-ons, prices, subscriptions, and entitlements, then expose those decisions to applications through APIs and SDKs. The system can compute effective access from plan, add-on, trial, and customer-specific promotional entitlements. That architecture addresses a real engineering problem in AI software, where access decisions, quotas, prepaid credits, and usage-based charges must be evaluated close to the API request rather than reconciled in a nightly billing process.

The product surface is consequently broader than a billing connector. Public documentation describes raw-event and calculated-usage metering, aggregation functions, credit pools, consumption mappings, expiring grants, and an append-only credit ledger. The current pricing material also advertises native invoicing alongside Stripe and Airwallex integrations, webhooks, data destinations, SDKs, a CLI, and an MCP server. The enterprise proposition includes BYOC, optional BYODB or air-gapped deployment, customer-controlled infrastructure, and stated throughput targets above one million events per second. These are meaningful capabilities if they are borne out in production, but the database should treat throughput, SLA, and compliance language as vendor-reported product claims rather than independently verified performance results.

The market case is strongest in software companies adopting consumption, credit, hybrid, or feature-based pricing. Traditional billing systems remain important for payment collection and invoicing, but often do not provide the application-facing entitlement model or low-latency usage enforcement that AI features require. Stigg therefore sells to engineering, product, and revenue teams that want pricing and packaging changes to become configuration and controlled API changes instead of cross-system rewrites. The main competitive challenge is that the buyer can combine Stripe, a billing platform, an internal entitlement service, and data pipelines, while adjacent vendors such as Metronome, Orb, Lago, and Chargebee are expanding across overlapping surfaces.

Commercial traction evidence is positive but incomplete. A December 2024 company announcement reported a $17.5M Series A led by Red Dot Capital Partners, $24M in total investment, and customers including Miro, Webflow, AI21 Labs, and PagerDuty; those claims were distributed by the company through PR Newswire and should not be read as audited financial or retention data. LinkedIn describes the company as privately held with 11–50 employees. The company has a plausible enterprise wedge, but diligence should still test recurring revenue quality, customer concentration, implementation effort, retention, gross margins, and whether AI-native demand is translating into durable production usage rather than experimentation.

The national-security case is indirect. Real-time policy enforcement, auditable access changes, usage accounting, customer-controlled deployment, and data-sovereignty options can support secure enterprise software, regulated platforms, or mission applications that need deterministic access and spending controls. However, there is no public evidence here of defense customers, government contracts, security accreditation, or deployment in operational military systems. Stigg is best classified as a commercial developer-infrastructure startup with credible but bounded dual-use potential; a strategic assessment should focus on whether its control-plane primitives can meet higher assurance, offline, identity, and integration requirements before assigning defense significance.
"""
