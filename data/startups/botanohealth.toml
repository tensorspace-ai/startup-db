name = "BotanoHealth"
description = "BotanoHealth is a Jerusalem-based crop-protection startup developing botanical fungicides and produce treatments using its patented NANOTECH™ nanoemulsion formulation platform. Its flagship BH-B product uses thyme oil as a contact, preventive fungicide, with commercial relevance to residue-sensitive growers and food supply-chain resilience."
detailed_description = """
**Product and the concrete problem it solves.** BotanoHealth is focused on biological crop protection and post-harvest handling, where fungal disease can reduce marketable yields and conventional fungicides face resistance, residue, worker-safety, and regulatory constraints. Its flagship product, BH-B, is a soluble liquid fungicide formulated with thyme oil at 10 g/L and marketed for preventive control of Botrytis, powdery mildew, downy mildew, and other foliar fungal disease. The company says it is suitable for foliar spraying and drip application, and positions it both for organic production and as a rotation option in conventional crop programs. The product proposition is not that botanical ingredients are inherently more effective than established chemistry; it is that formulation engineering may make a volatile plant-derived active ingredient persist and spread sufficiently to become a usable crop-protection input. BotanoHealth also sells Botano One SL for high-value berries and vineyards, and Botano Wash for rinsing fresh produce. Those products extend the commercial thesis from growing crops to protecting food quality after harvest, although each product's performance and regulatory status need to be assessed separately by market and crop.

**Core technology and how it works.** The company's NANOTECH™ platform is described as a patented process that turns thyme oil into a stable nanoemulsion. The practical formulation challenge is that unformulated essential oil may evaporate, disperse unevenly, or wash off leaves, reducing the time an active compound remains in contact with a pathogen. BotanoHealth says its process creates smaller dispersed oil droplets to improve surface coverage, and incorporates polysaccharides that help the emulsion adhere to leaf surfaces and resist evaporation and rain wash-off. The stated biological mode of action is contact and preventive: thyme-oil constituents act on fungal cell membranes and are said to interfere with ergosterol production, which fungi use to maintain cell structure. These mechanisms are plausible for essential-oil fungicides, but the company has not published a complete, independently audited formulation specification or comparative, peer-reviewed efficacy dataset for every marketed crop and pathogen. A published U.S. patent application assigned to BotanoHealth Ltd. separately describes a mucilage-based plant-protection composition containing a biofungicide and detergent, and names Yaniv and Amir Kitron as inventors. It corroborates the company’s formulation R&D and a filed IP claim; the application is listed as pending and does not itself establish that every commercial recipe is covered, prove field efficacy, or demonstrate freedom to operate in every jurisdiction.

**Products, users, and deployment requirements.** BotanoHealth's product materials identify three offerings on a shared formulation platform. BH-B is the general flagship fungicide; Botano One SL is presented for blueberries and vineyards, where bloom sensitivity and export residue requirements can constrain treatment options; and Botano Wash is a plant-based wash for fresh fruit and vegetables. The label-level specifications published for BH-B include a 1% thyme-oil concentration, soluble-liquid formulation, contact/preventive use, and an OMRI listing for organic use. Those are specific product facts, while broad safety claims and efficacy claims remain the company's own unless supported by a regulator or independent trial. Agricultural crop-protection sales depend on more than ingredient novelty: products must satisfy local registration requirements, fit grower application schedules, demonstrate crop safety and efficacy under local conditions, and show cost per hectare that competes with conventional programs. Israel's Ministry of Agriculture describes the country's prior-authorization and field-trial process for plant-protection products, illustrating the regulatory burden that BotanoHealth and its distributors must navigate in each market.

**Market and go-to-market.** The target buyers include growers and agricultural distributors serving fruits, vegetables, berries, grapes, ornamentals, and other crops exposed to fungal disease. BotanoHealth's public website lists distributor relationships or commercial contacts in Latin America, the Philippines, Brazil, the United States, South Africa, and Israel, and says its products have been used in market or trial activity in more than nine countries. It identifies HanseAndina as a regional partner across Mexico, Central America, Colombia, Ecuador, and Peru; IVA in the Philippines; AgroCultivo in Brazil; and ChemPac in South Africa. It also reports initial revenue and registration activity in the Philippines and Israel, with registration underway in South Africa. The go-to-market model appears distributor-led rather than direct-to-grower: regional partners can supply local agronomic support, manage registrations, and aggregate demand across crops and growing regions. This model can reduce the cost of building a global sales force, but it also makes the startup dependent on partner execution, product registration, local formulation supply, and the partners' willingness to prioritize a relatively small supplier. No disclosed revenue, repeat-purchase rate, hectares treated, or distributor sales volumes are available to establish the scale of commercial adoption.

**Traction, funding, and external validation.** BotanoHealth's official materials and Israeli company-registration record place its founding/incorporation in Jerusalem in 2017, while the Startup Nation Finder profile labels its founding as November 2018; the public sources do not explain the one-year discrepancy. Startup Nation Finder reports approximately $414,000 raised across two funding rounds and records participation in MassChallenge Israel's early-stage accelerator in 2023. A company announcement says BotanoHealth sold a minority participation to German agriproduct company HanseAndina, describing the deal as a channel-expansion step that provided access to Latin American distribution. These are meaningful existence, financing, and route-to-market signals for a small agricultural-input company, but they are modest in scale and do not indicate venture-scale operating maturity. The company publishes selected trial results, including a 33% lettuce yield gain over an untreated control in Spain and lower powdery-mildew severity in an Israeli cannabis trial, as well as results and application recommendations for additional crop-pathogen pairs. The public pages do not consistently provide full protocols, sample sizes, independent statistical review, or replicated results, so the figures should be treated as company-reported trial evidence rather than independently verified performance guarantees. OMRI's inclusion of a BH-B product page is a useful third-party organic-input signal; organic listing is not equivalent to general pesticide registration or proof of efficacy.

**Founders and team.** Current company materials identify Yaniv Kitron as CEO and describe him as a chemical engineer with 25 years of international business-development experience in advanced agricultural markets. The site identifies Amir Kitron as CTO, with a PhD in chemical engineering and three decades of experience in botanical products, research and development, and commercialization. Itamar Highkin is listed as CFO, with financing and product-management experience across public companies and startups, and Shay Jean as a business-development executive. This mix is relevant to moving a formulation from laboratory work into regulated agricultural markets: chemistry and botanical-product expertise support product development, while commercial and finance experience can help navigate distributor and registration pathways. The disclosed leadership information is primarily company-authored, and publicly available sources do not establish current employee count, depth of the formulation-science team, ownership of all relevant patent families, or how technical responsibilities are divided among the Israeli and overseas operations. Those gaps matter because a small team can be stretched across formulation, field-trial execution, regulatory submissions, production quality, and international channel support.

**Competitive dynamics and potential edge.** BotanoHealth competes with biological crop-protection companies and incumbent agrochemical portfolios rather than with a single direct substitute. IBI Ag develops nanobody-based bioinsecticides; Eden Research commercializes terpene-based botanical crop-protection products; Certis Biologicals and Koppert offer broader biological control and biopesticide portfolios; Biotalys develops protein-based biocontrol agents; and Syngenta and other major crop-science suppliers sell established synthetic and biological fungicides through strong distribution networks. BotanoHealth's proposed edge is its combination of a thyme-oil active ingredient, a formulation platform intended to improve spreading and adhesion, and products aimed at both pre-harvest disease management and post-harvest produce treatment. Its distributor network and product-specific market registrations may be more commercially meaningful than the general claim of using natural ingredients. The edge remains conditional: botanical actives are not automatically safer or more effective at field dose, formulation can be copied or designed around, and large incumbents can bundle competing treatments with agronomic services and established labels. Defensibility will depend on patent scope, reproducible performance, registration coverage, formulation stability, manufacturing quality, and evidence that growers reorder at attractive economics.

**Strategic relevance, trajectory, and diligence risks.** The company's core technology is commercial agriculture, not a defense product, and no military, intelligence, or government-security deployment is publicly documented. Its dual-use relevance is therefore through resilience: reducing crop loss, providing additional disease-control options under residue and resistance pressure, and supporting food production across regions with different climates and supply constraints. That is a credible strategic adjacency for food security, but the record should not imply that BotanoHealth provides sovereign food security or that its products are already essential to national supply. The company appears to be an early commercial-stage startup: it has a decade-old founding date, products, distributor relationships, trial activity, and some reported revenue or registration signals, yet it has modest disclosed financing and no public scale metrics. The key diligence questions are independent replicated field efficacy; product registration and residue rules by country; crop safety and application compatibility; actual sales, repeat orders, gross margins, and distributor concentration; manufacturing consistency and supply of botanical inputs; patent ownership and freedom to operate; and whether the company can finance regulatory expansion without stretching a small team. If those tests are met, BotanoHealth could become a specialized supplier in biological crop protection. Until then, the strategic case is credible but narrow, commercially promising but not yet evidenced at scale, and primarily relevant to food-system resilience rather than defense procurement.
"""
