name = "Vidisco"
description = "Vidisco is an Israeli private company that develops portable digital X-ray and radiography systems for security, explosive-ordnance response, customs, and industrial non-destructive testing. Its product line combines rugged field hardware, wireless image acquisition, image-processing software, and newer AI-assisted analysis."
detailed_description = """Vidisco develops and manufactures portable digital radiography systems rather than general-purpose airport scanners or medical imaging equipment. Its security portfolio is built around portable panels, X-ray generators, rugged displays, communications equipment, batteries, and transport cases that can be configured for tactical or turnkey operation. The company describes products such as the Paladin and Guardian families, VEO software for Android, and lightweight/tactical packages intended to produce high-resolution images in difficult field conditions. Its public product material also describes an augmented-reality capability that aligns an optical scene with an X-ray image, potentially helping an operator relate hidden contents to the object being inspected. These are meaningful workflow features, but the public record does not establish independent comparative performance against every competing detector or AI product.

The same core capability serves two customer groups. Security users can inspect suspicious packages, vehicles, cargo, baggage, prisons, and concealed items, while military and bomb-disposal teams can image suspect objects or unexploded ordnance without immediately opening or handling them. On the industrial side, Vidisco markets VIDI systems and turnkey configurations for non-destructive testing of welds, castings, composites, ammunition, infrastructure, and components used in automotive, aerospace, energy, oil and gas, mining, rail, and shipbuilding. The attraction of digital radiography is operational: images are available at the inspection site, systems can be battery-powered and wireless, and portable equipment can reduce the disruption associated with moving large assets to a fixed inspection room. Radiation safety, operator training, source selection, and local regulation remain central to the real-world value proposition.

Vidisco’s current website says the company was founded in 1985, has more than 50 seasoned military and professional experts, and has systems deployed by military, security, and industrial organizations in 75 countries. Older public references commonly describe the company as founded in 1988, so the founding metadata should be treated as a public-record discrepancy rather than a precisely verified corporate-history fact. The company is privately held and does not publicly disclose revenue, margins, valuation, financing history, customer concentration, or the proportion of sales from security versus NDT. Its public site reports customer and program traction, including deployments and selections by government or military organizations, but these are company-reported signals and should not be treated as independently audited backlog or market share.

The competitive position is credible but specialized. Vidisco benefits from a long operating history, a focused portable form factor, field-oriented integration, and a product family that can be adapted to both security and industrial inspection workflows. It competes with larger security-screening and imaging groups, specialist portable-X-ray vendors, and fixed or semi-portable NDT substitutes. VEO AI is described by Vidisco as identifying components in known and unknown munitions, elements in UAS/UAVs or improvised payloads, and munition classes; this could reduce cognitive load for trained operators, but public materials do not provide benchmark datasets, false-alarm rates, validation methodology, or evidence that AI revenue is material. The defense relevance is therefore genuine at the sensing and response-workflow level, while the strongest diligence questions concern verified adoption, service economics, regulatory approvals, and repeatable software differentiation."""
