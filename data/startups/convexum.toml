name = "Convexum"
entity_type = "acquired_asset"

description = "Convexum is the former name of Sentrycs, an Israeli counter-UAS company now owned by Ondas Holdings. Its software-defined Cyber-over-RF and protocol-manipulation platform detects, identifies, tracks, geolocates, and can non-jammingly take control of selected commercial drones for defense, public-safety, and critical-infrastructure customers."

detailed_description = """
Convexum’s current operating identity is Sentrycs. The company’s core product is a protocol-level counter-UAS system that analyzes communications between a drone and its controller rather than relying only on radar, electro-optical cameras, or broad RF scanning. Sentrycs describes this as Cyber-over-RF or protocol manipulation. Its DTI module passively detects, tracks, and identifies nearby drones, can report flight parameters and the operator’s last known location, and can whitelist approved aircraft by serial number. An optional mitigation module can disconnect a controller or take over selected drone functions and direct the aircraft to a predefined landing location. The platform is offered in fixed, portable, and vehicle-mounted configurations with a command-and-control layer.

The customer problem is operationally specific: airports, borders, prisons, military bases, critical infrastructure, public events, and mobile protection teams need to distinguish authorized flights from unauthorized ones and respond without unnecessarily jamming surrounding communications. A protocol-aware system can be valuable where low collateral interference, attribution, and continuity of operations matter. The commercial proposition is not that RF analytics replaces every other sensor; it is that a modular, relatively portable layer can complement radar and electro-optics, provide actionable operator-location data, and add a soft-kill option within a customer’s legal and technical rules. Sentrycs’ public materials also describe HORIZON, an AI-assisted approach intended to recognize unfamiliar or DIY drone signals, which is relevant as adversaries move beyond common commercial platforms.

Public evidence indicates meaningful commercialization rather than an untested prototype. Sentrycs announced a multi-million-dollar Latin American national-defense project in February 2025 after trials involving more than a dozen competitors, with fixed, portable, and vehicle-mounted deployments. Its public case studies and customer-facing material describe work around military bases, critical infrastructure, and live events, while the company’s November 2025 acquisition announcement stated that the technology had operational deployments in more than 25 countries. These are company or acquirer claims and should be validated through contract references, delivery records, renewal rates, and independent performance testing. The acquisition by Ondas Holdings was completed in November 2025 for a reported transaction value of approximately $224.6 million in Ondas’ later financial reporting, changing the diligence question from startup financing and standalone exit probability to integration, revenue contribution, product retention, and channel leverage inside Ondas Autonomous Systems.

The competitive field includes dedicated counter-UAS vendors, RF and spectrum specialists, radar-and-camera integrators, and large defense primes. Sentrycs’ potential edge is a communications-protocol view of the threat combined with non-jamming mitigation, rapid deployment, and integration into layered defenses. That edge is conditional: protocol manipulation may be highly effective against supported drone families while being less reliable against autonomous aircraft, custom firmware, frequency-hopping links, encrypted or absent control channels, and swarms. Defense relevance is direct in base, border, convoy, and critical-site protection; commercial relevance is strong in airports, prisons, utilities, and events. The asset is strategically important, but the record should not treat vendor-reported combat performance, certifications, or customer breadth as independently proven without primary evidence.
"""

