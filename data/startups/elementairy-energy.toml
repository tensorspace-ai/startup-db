name = "ElementAiry Energy"
description = "ElementAiry Energy, formerly Ultracell Technologies, is an Israeli early-stage energy-storage company developing zinc-air battery technology for long-duration and grid-scale storage. Its strategic proposition is to use abundant zinc, air, and water-based electrochemistry to deliver safer, lower-cost, more durable energy storage for grids and power-constrained infrastructure."
detailed_description = """
**Product and the concrete problem it solves.** ElementAiry Energy is the current public identity of Ultracell Technologies, an Israeli private company incorporated in July 2025. The company is addressing the storage problem created by a grid that increasingly depends on intermittent solar and wind while demanding firm power after the sun sets, during peak demand, and through outages. Its public materials are deliberately early-stage: the Israel Innovation Authority describes it as a developer of battery technology, and the company’s LinkedIn profile describes the mission as building larger and better batteries. The most specific public positioning is zinc-air technology for grid-scale storage. Zinc-air systems use metallic zinc as the energy-bearing material and draw oxygen from ambient air at the electrochemical cell, avoiding the need to carry an equivalent cathode reactant inside the cell. That design direction could make long-duration storage more economical and less dependent on scarce or strategically sensitive battery minerals, but ElementAiry has not publicly disclosed a commercial product, pilot size, achieved cycle life, round-trip efficiency, or contracted customer.

**Core technology and how it actually works.** ElementAiry’s public evidence points to a zinc-air architecture rather than a conventional lithium-ion pack. On discharge, zinc is oxidized while oxygen from the surrounding air participates at the air electrode; the resulting electrochemical process produces electricity and converts zinc toward zinc oxide. A rechargeable or electrically regenerated system must then reverse that chemistry and return the active material to a usable zinc form. The company’s own public posts describe the broader mission as combining metal, air, and water, and identify zinc as the basis for a grid-scale battery. Its engineering job listing adds unusually concrete implementation evidence for such an early company: workers were asked to fabricate airtight cell enclosures from metals and polypropylene, assemble prototypes, handle chemicals, operate 3D printers, and run repeatable tests. Those details verify a physical laboratory program, not merely a slide-deck concept. The public record does not disclose the air-cathode catalyst, electrolyte formulation, stack geometry, charge-management electronics, regeneration process, power density, or test results. Those unknowns are decisive because zinc-air commercialization has historically been constrained by recharge reversibility, air-electrode degradation, corrosion, carbonate formation, water management, and hydrogen evolution.

**Market, customers, and go-to-market.** The immediate target is the energy market, with the Innovation Authority classifying ElementAiry under energy technology and battery technology and identifying a five-person team. The most plausible first buyers are stationary-storage developers, utilities, renewable-energy asset owners, microgrid operators, and industrial sites that value many hours of storage, non-flammable chemistry, and a lower-cost material base more than the high power density of lithium-ion. Potential applications include solar shifting, wind firming, peak shaving, backup power, and flexible interconnection for sites whose grid connection cannot yet support planned load. A small company will usually reach these buyers through a pilot with a storage developer, utility, industrial host, or government-backed demonstration program rather than through direct mass-market battery sales. ElementAiry’s current public record does not identify a customer, strategic manufacturing partner, site, purchase order, pilot, or revenue. Its job posting suggests a build-and-test phase in Sde Avraham, Israel, while the current web presence is a rebrand announcement rather than a full commercial product catalogue. The go-to-market thesis is therefore credible at the application level but unproven at the buyer and deployment level.

**Traction, funding, and third-party validation.** The strongest external validation is institutional rather than commercial. The Israel Innovation Authority’s company record identifies the legal entity as ULTRACELL TECHNOLOGIES LTD, established in 2025, operating in energy technology and battery technology, with Joel Rotem as CEO and co-founder, five employees, and Seed-stage status. The Authority’s investment data reports an $800,000 pre-seed investment in January 2026 through its Startup Fund. The same ecosystem record describes the technology as long-duration battery energy storage and lists a B2B energy-market target. The former Ultracell website now redirects visitors to ElementAiry Energy, and the company’s LinkedIn page confirms the brand transition, a 2-10 employee range, Sde Avraham headquarters, and named personnel including Joel Rotem and Ido Shental. A current battery-prototype fabrication vacancy provides additional evidence that the company is recruiting for lab execution rather than only business development. None of these sources establishes a fielded demonstration or independent performance test. No public funding announcement beyond the Authority-backed amount, valuation, revenue, patents, customer reference, certification, or manufacturing agreement was found. The correct reading is funded technical formation with observable hands-on activity, not validated storage commercialization.

**Founders and team background.** Publicly confirmable team information is limited but not empty. Joel Rotem is identified by both the Israel Innovation Authority and the company’s LinkedIn presence as CEO and co-founder. LinkedIn also identifies Ido Shental as an employee and displays additional team activity from the company. The public hiring language emphasizes practical fabrication, chemical handling, enclosure construction, 3D printing, test documentation, and the ability to move battery concepts from computer designs to laboratory prototypes. That is a useful signal about the operating culture and near-term bottleneck: ElementAiry needs repeatable cells and test data before it needs a broad sales organization. The team’s location in Sde Avraham, in Israel’s southern region, is also relevant to resilience and industrial-development considerations, although there is no evidence that the location itself reflects a government program or special manufacturing advantage. No detailed biographies, academic credentials, prior exits, patent inventors, scientific advisory board, or complete employee list are public. Team score is consequently restrained. The leadership question for diligence is whether the small group has the electrochemistry, stack-engineering, controls, manufacturing, and utility-commercialization depth required to cross the gap from prototype cells to bankable megawatt-scale systems.

**Competitive dynamics.** ElementAiry competes against several different layers rather than one identical product. Form Energy pursues iron-air batteries for multi-day stationary storage and has greater disclosed industrial scale; Eos Energy Enterprises develops zinc-based aqueous batteries for long-duration applications; Phinergy, an Israeli company already represented in this database, develops zinc-air storage and aluminum-air generation; and NantG Power has pursued zinc-air stationary storage. Flow-battery providers such as Invinity Energy Systems compete through decoupled power and energy capacity, while lithium-ion systems from CATL, BYD, Tesla, and LG Energy Solution benefit from mature manufacturing, financing familiarity, and a large service ecosystem. ElementAiry’s potential edge would be a favorable combination of abundant zinc, aqueous or water-based handling, long-duration economics, safety, and a design that can scale energy capacity without proportionally scaling expensive power electronics. That edge is only a hypothesis until the company publishes comparable data. The closest local semantic overlap is Phinergy, but the records are not the same company: Phinergy is a public, established metal-air developer with disclosed aluminum-air and zinc-air systems, whereas ElementAiry is a separate 2025 private company formerly called Ultracell with an $800,000 Authority-backed pre-seed and no disclosed deployment. The key competitive test is delivered cost per useful kilowatt-hour over life, not theoretical energy density.

**Defense, security, and resilience dual-use relevance.** ElementAiry’s core technology has credible dual-use relevance through energy resilience, although no defense adoption is publicly established. Stationary storage that is safer, less dependent on lithium supply chains, and capable of covering long outages could support hospitals, communications sites, water utilities, emergency shelters, microgrids, data centers, and defense facilities. Remote or expeditionary systems could potentially use a metal-air architecture to reduce diesel deliveries or buffer intermittent renewable generation, but the company’s current public materials do not claim a portable military product. Zinc’s abundance and global availability may be strategically useful if proven, especially for allied infrastructure seeking to reduce dependence on concentrated battery-material supply chains. The resilience argument is stronger than the direct weapons argument: ElementAiry could become enabling infrastructure for continuity of power, not a defense prime. A responsible defense assessment must therefore avoid calling the chemistry combat-proven. Diligence should test operation in heat, dust, salt, vibration, shock, and low-maintenance environments; fire and chemical safety; water consumption; cybersecure battery controls; islanding and black-start behavior; acoustic and thermal signatures; repairability; and zinc sourcing or regeneration under disrupted logistics. Until those tests exist, dual-use is strategic optionality rather than a fielded capability.

**Growth stage, trajectory, and key diligence risks.** ElementAiry is classified as early because it was incorporated in 2025, has a small team, has raised only the publicly reported $800,000 pre-seed, and remains in laboratory development. The rebrand from Ultracell may help the company establish a more distinctive identity, but it also creates diligence obligations: customers, grants, patents, contracts, and any liabilities must be followed across the old and new names. Its trajectory could be attractive if prototype work produces a zinc-air stack that can cycle reliably, uses inexpensive and non-toxic materials, and scales into a modular long-duration system with credible manufacturing economics. The main risks are (1) electrochemical durability and recharge losses; (2) air-electrode and electrolyte degradation; (3) prototype-to-stack scale-up, yield, sealing, and balance-of-plant complexity; (4) competition from lithium-ion, iron-air, flow, sodium-ion, and other long-duration chemistries; (5) capital intensity and the long sales cycles of utilities and infrastructure buyers; (6) limited disclosed team, IP, customer, and performance data; and (7) rebrand and corporate-continuity risk. The next milestones should be independently measured cell and stack data, a defined architecture, a repeatable pilot, grant or strategic-partner disclosure, patent posture, safety testing, and evidence of an anchor energy-market customer. Those milestones would determine whether ElementAiry is a promising Israeli energy-resilience experiment or a scalable storage company.
"""
