name = "10D Ventures"

description = "10D is a Tel Aviv venture capital fund investing in early-stage Israeli technology companies, with a portfolio spanning deep tech, cyber, defense, space, robotics, quantum computing, digital health, and enterprise software. Its national-security relevance is thesis- and portfolio-level: 10D supplies capital and company-building support rather than operating a defense product itself."


detailed_description = """
10D is an Israeli venture capital partnership headquartered in Tel Aviv. Its official positioning is early-stage investment in Israeli founders using deep technology to build category-leading companies, with a hands-on model that includes mentoring, network access, hiring support, and follow-on fundraising. The firm announced $245 million across a $185 million second early-stage fund and a $60 million opportunity fund in December 2022. That announcement supports institutional scale and reserve capacity, but it is not evidence of current assets under management or fund performance. 10D is not a manufacturer, software vendor, defense prime, or government contractor; its product is investment capital plus partner-level company building.

The current portfolio provides a more useful description of the technology exposure than a narrow defense label. The official portfolio page groups holdings under cyber, defense, space, robotics, deep tech, and Industry 4.0, among other categories. Examples include SENAI's multimodal analysis of online video for threat and event intelligence, Remondo's low-cost high-revisit imagery from LEO satellites, Mentee Robotics' humanoid robots, Quantum Source's photonic quantum-computing architecture, Exodigo's sensor- and AI-enabled subsurface mapping, and industrial or enterprise platforms such as bananaz and WEKA. The firm's July 2026 physical-AI research also indicates active attention to robotics and embodied systems. These are heterogeneous companies; 10D is better assessed as a diversified technology investor with meaningful physical-AI and national-security adjacency than as a single-technology specialist.

The commercial opportunity is the conversion of difficult engineering into repeatable products: sensing and imaging must become dependable workflows, robotics must operate safely outside controlled demonstrations, quantum systems must achieve useful performance, and AI systems must prove accuracy, latency, security, and governance in customer environments. 10D's stated value-add is hands-on support, network access, and follow-on fundraising. Its news feed records recent activity around SENAI, Safebooks AI, Blast Security, Cassidy Bio, and C8 Health, while the official site highlights founder support around talent, design partners, business development, strategy, and subsequent financing. These are useful activity and commercialization signals, but they do not establish uniform revenue, deployment, retention, or government-contract metrics across the portfolio.

The team is a material strength. Co-founders and managing partners Rotem Eldar and Yahal Zilka bring long venture and operating histories, while General Partner Itay Rand adds investment, consulting, technology, and finance experience. Partner Alon Kantor adds direct cyber and defense-startup experience from Toka and prior business-development leadership at Check Point. The official team and news pages also show platform, finance, investor-relations, deal-flow, and partner-development capacity, including Emmanuelle Lipski's promotion to Partner in February 2026. This can improve sourcing and diligence, especially for Israeli founders, but it does not eliminate seed-investing risks such as uncertain technical milestones, long hardware cycles, follow-on financing needs, export controls, and uneven access to defense procurement.

For defense and national security, the strongest case is portfolio optionality. Video intelligence, satellite imagery, cyber defense, robotics, advanced sensing, and subsurface mapping can support ISR, infrastructure protection, emergency response, logistics, and military planning when adapted to required security, resilience, and procurement standards. 10D's official site labels multiple holdings as Defense, Cyber, or Space, and its recent SENAI announcement demonstrates current activity around threat intelligence; that supports adjacency, not proof of operational defense deployment. The evidence does not justify claiming that 10D itself delivers classified capabilities or that every portfolio company has defense customers. Diligence should separate announced portfolio membership from validated deployment, distinguish commercial pilots from government procurement, and examine ownership, follow-on reserves, export-control posture, and the percentage of exposure actually reaching defense-relevant readiness levels.
"""

