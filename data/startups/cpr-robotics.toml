investment_rationale = "CPR Robotics is a high-uncertainty but strategically coherent early medical-robotics entry, and the legacy investible flag should be read only as an internal priority signal. (1) The technical thesis is specific: sensed, closed-loop mechanical compressions address the degradation and staffing burden of manual CPR rather than adding generic robotics. (2) The evidence is tangible but pre-commercial: an active Israeli company, a published adaptive-resuscitation patent, an official product site, embedded-software hiring, and independent documentation of physical prototype iterations. (3) Strategic adjacency is stronger than for a generic healthcare robot because the platform maps directly to casualty care, disaster response, and emergency-system resilience. Counterweights are decisive: no public funding, revenue, clinical outcome, regulatory clearance, customer, or defense deployment; strong incumbents already own the category; and safety-critical medical-device development can consume substantial capital before commercialization. The appropriate diligence question is whether the team can produce validated patient-specific compression performance and a procurement-ready workflow, not whether the prototype photograph itself proves efficacy. This is not an investment recommendation."
