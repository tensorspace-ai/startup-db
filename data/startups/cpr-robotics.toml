name = "CPR Robotics"
description = "CPR Robotics is an Israeli deep-tech medical-robotics startup developing an autonomous CPR system for field and hospital use. Its device combines mechanical chest compression, closed-loop motor control, and pressure, motion, and contact sensing to provide consistent resuscitation when human fatigue, staffing, or access delays threaten CPR quality."
detailed_description = """
**Product and the concrete problem it solves.** CPR Robotics is developing a robotic system intended to perform cardiopulmonary resuscitation when a patient needs immediate chest compressions and trained rescuers cannot maintain consistent quality for the duration of an event. The company's stated deployment frame is deliberately broad: the field and the hospital. In a pre-hospital emergency, responders may be carrying equipment, moving a patient, managing an airway, operating an AED, or evacuating through a constrained environment while also needing uninterrupted compressions. In a hospital, clinicians may face prolonged resuscitation, transfers, staffing pressure, or a requirement to keep compressions going while other interventions are performed. CPR Robotics positions its system as an always-available mechanical operator rather than as a diagnostic replacement for clinicians. The official site describes an automated CPR robot that delivers consistent, precise, and safe chest compressions, with a user interface designed for clinical teams and an emphasis on reducing human variability. This matters because CPR quality is not a single start-stop action: rate, depth, recoil, placement, and continuity must be maintained while the patient's anatomy, surface, transport context, and responder workload change. The company is therefore attacking an operational reliability problem in emergency medicine, not merely selling a conventional robot arm.

**Core technology and how it actually works.** Public product information describes a mechatronic system combining advanced mechanics, algorithms, and motor control. The control loop is the key disclosed technical feature. CPR Robotics says its system maintains 100-120 chest compressions per minute and uses pressure, motion, and contact sensing to adapt to the patient's anatomy in real time. That implies a closed-loop controller that measures the interaction between the compression mechanism and the patient or training surrogate, compares the measured behavior with the target compression trajectory, and adjusts motor actuation rather than replaying an open-loop motion. The company also emphasizes hardware/software redundancy, which is appropriate for a life-critical device, although the public record does not disclose the exact redundant architecture, sensor tolerances, failure modes, or safety case. The patent record adds technical substance without warranting overstatement: Israeli publication IL296056A, titled “Portable automatic resuscitation system with dynamic adaptation,” lists CPR Robotics Ltd as the original assignee, carries a 2020-03-02 priority date, and is classified around cardiovascular measurement, heart-rate sensing, closed-loop treatment systems, and user notification. The site says the system is designed for fast operation and rigorous standards, but it does not publicly identify a regulatory clearance, clinical-trial result, final enclosure specification, battery endurance, or production certification. The most defensible description is an actively controlled, sensor-rich mechanical CPR platform whose distinctive claim is dynamic adaptation; the engineering maturity of that claim remains a diligence question.

**Market, customers, and go-to-market.** The natural initial buyers are emergency medical services, hospitals, military and disaster-response medical units, ambulance operators, and clinical simulation or training organizations. CPR Robotics does not publicly name a commercial customer, distributor, hospital deployment, government contract, or reimbursement pathway, so the commercial model must be treated as an inferred route rather than a confirmed one. A plausible go-to-market sequence would begin with controlled prototypes and clinician-led validation, then proceed through medical-device regulatory work and channel partnerships with EMS equipment distributors or hospital procurement groups. The field-use proposition is strongest where the device can preserve compressions during transport, free a responder to perform airway and medication tasks, or support care in austere locations. The hospital proposition is strongest in resuscitation bays, intensive-care transfers, catheterization or imaging workflows, and settings where a mechanical system can standardize the physical portion of a team response. The company can also use manikin-based simulation to refine operator workflow before human deployment, but the independent manufacturing case study confirms only that prototype parts and low-volume iterations were being produced, not that the device has entered clinical use. Pricing, consumables, service requirements, sterilization workflow, disposable patient-contact components, and the intended regulatory classification are not public. Those unknowns are central to whether CPR Robotics becomes a high-value clinical platform or a technically impressive but difficult-to-procure device.

**Traction, funding, and third-party validation.** The public evidence is early but unusually concrete for a small medical-robotics company. CPR Robotics has an official, currently accessible product site describing the autonomous CPR system and its sensing and control claims. HLH Rapid published a customer case study identifying CPR Robotics as a research-driven Israeli startup and documenting physical prototype work: enclosures, frames, spur gears, assemblies, and other parts were made in stainless steel, aluminum, engineering plastics, and additive-manufactured materials, often in one-off or four-to-six-unit iterations. The case study quotes Barak Harrison as Design and Product Manager and explicitly says the company was in prototyping and testing, which is useful negative evidence against treating the product as fielded. A public Israeli company-information page lists CPR Robotics Ltd as an active private Israeli company, founded on 2022-08-14, at HaKedma 7 in Yokne'am Illit. An archived LinkedIn job listing sought an embedded C/C++ software engineer for a medical-device startup and described integration with a hardware design team, corroborating that the work includes embedded control rather than only a rendered concept. The patent publication is a further validation of an identifiable technical program and intellectual-property posture. No reliable public source discloses venture funding, grants, revenue, clinical outcomes, regulatory approval, production volume, or named end users; these absences should materially cap the score.

**Founders and team background.** The public record does not provide a clean official founder biography or complete organizational chart. The patent publication names Chanoch Levin and Danny Knafou among the inventors associated with the portable adaptive resuscitation system, but an inventor listing is not by itself proof of current executive or founder status. The company has publicly been represented by Barak Harrison, whose title is Design and Product Manager in the manufacturing case study; LinkedIn material also associates Nissim Fintz with CPR Robotics and identifies engineering experience in machine design, robotics, and simulation, while Yarden Guetta's public profile associates her with CPR Robotics and a Technion education. These are useful signals of a multidisciplinary engineering group, not a basis for guessing roles, seniority, or ownership. The available evidence points to a team spanning mechanical design, embedded software, control, robotics, and medical-device prototyping, which is the right capability mix for a closed-loop resuscitation machine. It does not yet establish experience with human factors, clinical medicine, quality systems, regulatory submissions, manufacturing scale-up, or hospital procurement. The likely strength is hands-on iteration across mechanism, electronics, and software; the likely organizational risk is that a very small team may have to cover a safety-critical product lifecycle with limited redundancy. Confirming the founders, clinical advisers, quality lead, regulatory pathway, and current headcount would be a first diligence step.

**Competitive dynamics.** CPR Robotics faces established mechanical-CPR devices and a powerful low-cost incumbent: trained people performing manual compressions. **Stryker LUCAS** is a widely recognized piston-based mechanical CPR platform with EMS and hospital channel reach. **ZOLL AutoPulse** uses a load-distributing band approach and competes on automated compressions and transport workflow. **corpuls cpr** provides a mechanical chest-compression system integrated with the broader corpuls emergency-care ecosystem. **Defibtech Lifeline ARM** represents another automated CPR device approach, while **Physio-Control/Stryker and ZOLL AED ecosystems** can bundle resuscitation equipment, service, and procurement relationships around the buyer. Manual CPR remains the substitute when cost, training, device availability, or speed of deployment outweigh the benefits of mechanization. CPR Robotics' potential edge is not yet a proven clinical outcome; it is the proposed combination of adaptive sensing, closed-loop control, hardware/software redundancy, and a compact field-to-hospital design. If those claims survive validation, the company could differentiate on patient-specific adjustment, ease of setup, and performance consistency in changing conditions. The counterargument is formidable: incumbents have regulatory approvals, installed bases, clinical evidence, training programs, service networks, and procurement familiarity. A new system must demonstrate not just that it compresses at the correct rate, but that it improves workflow or outcomes enough to justify switching, while avoiding injury, interruption, cleaning complexity, and false confidence in the operator.

**Defense, security, and resilience dual-use relevance.** CPR Robotics qualifies as dual-use because the core technology addresses civilian emergency care and credible defense, disaster, and continuity-of-operations scenarios without changing its fundamental function. The most direct military application is prolonged field care and casualty evacuation: a mechanical CPR system could maintain compressions while medics manage airway, hemorrhage, monitoring, communications, or movement, subject to the device proving rugged, portable, safe, and clinically effective. The same logic applies to mass-casualty incidents, collapsed infrastructure, remote industrial sites, maritime rescue, and emergency shelters where responder numbers are limited and patient access is difficult. A resilient national emergency system also benefits from equipment that can standardize a time-critical intervention across ambulance crews, hospitals, and surge facilities. The dual-use case is strategically relevant but not fielded. CPR Robotics publicly names no military customer, defense trial, government program, disaster deployment, ruggedization standard, or operational test. The official site says “field and hospitals,” which supports a field-care target but does not establish use in contested environments. The patent's dynamic-adaptation and sensing themes are technically adjacent to autonomy and human-machine teaming, but the product should not be described as an autonomous medical decision-maker: public material supports automated mechanical compressions under an operator's clinical workflow, not diagnosis, triage, medication selection, or independent patient care. Strategic value therefore comes from potential casualty-care resilience and workforce multiplication, with a substantial evidence discount until regulatory and operational milestones are visible.

**Growth stage, trajectory, and key diligence risks.** CPR Robotics is best classified as early: the company is active and legally established, has a public product identity, a published patent, and physical prototypes, but the independent evidence still places it in prototyping and testing rather than commercial deployment. The trajectory is attractive if the team can convert a credible control concept into a validated medical device. Near-term milestones should include a disclosed regulatory strategy, bench and animal or clinical evidence where applicable, human-factors testing, measurable compression-quality performance against manual CPR and incumbent devices, and a production design that can be cleaned, transported, powered, and serviced in real emergencies. The key risks are substantial. (1) **Clinical and regulatory risk:** a life-critical device requires evidence and quality controls that a prototype alone cannot supply. (2) **Mechanical safety risk:** excessive force, poor placement, incomplete recoil, movement during transport, or sensor failure could cause harm. (3) **Workflow risk:** setup time, patient fit, operator training, and interaction with defibrillation or airway care may erase the theoretical benefit. (4) **Commercial risk:** Stryker, ZOLL, and other incumbents already own trust and procurement channels. (5) **Capital risk:** no public funding or runway information is available, while medical-device development is expensive and slow. (6) **Manufacturing risk:** the documented low-volume parts program must become a repeatable, quality-controlled supply chain. (7) **Evidence risk:** no public customer, clinical outcome, clearance, or revenue is disclosed. The upside is a differentiated Israeli medical-robotics capability aligned with emergency resilience; the present record supports monitoring and diligence, not claims of deployment or clinical efficacy.
"""
