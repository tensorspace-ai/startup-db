name = "Dagan-Optics"
description = "Dagan-Optics Ltd. is an Israeli privately held electro-optics manufacturer and integrator, established in 2016 and continuing the Senso-Optics thermal-imaging business lineage dating to 2004. It develops thermal and visible-spectrum imaging, image-fusion, and target-acquisition systems for defense, homeland security, law enforcement, public safety, and search-and-rescue markets."
detailed_description = """
**Product and the concrete problem it solves.** Dagan-Optics addresses a basic operational problem that remains difficult despite decades of progress in cameras: people and machines need to detect, recognize, identify, and act on objects when visible-light imaging is degraded by darkness, smoke, fog, dust, humidity, glare, or weather. The company develops complete electro-optical systems rather than selling only a sensor die. Its current portfolio includes the MISGAV multi-sensor handheld or tripod-mounted target-acquisition system, the AGSS direct-aiming and fire-control system for heavy artillery, and the X-SEE fusion thermal monoscope. MISGAV combines day and thermal cameras, optical and digital zoom, an eye-safe laser rangefinder, GNSS, battery operation, and storage or communications outputs. AGSS connects visible and thermal sights, rangefinding, ballistic data, a user interface, and fire-control-system connectivity. X-SEE packages thermal and visible imagery in a compact, mountable scope. Across these products, the value proposition is usable perception in conditions where an ordinary camera or unaided human observer becomes unreliable.

**Core technology and how it works.** Dagan-Optics describes its central capability as proprietary Fusion technology, combining thermal imaging with visual or visible-spectrum imagery and real-time intelligent machine-vision analytics. Thermal sensors measure emitted infrared energy rather than reflected visible light, allowing heat signatures to remain informative in darkness and partial obscuration. The visible channel contributes contours, color, and contextual detail when illumination permits; the fusion layer presents the operator with a combined view intended to improve detection and identification. The company also describes uncooled thermal systems, image-processing chips, high-sensitivity cameras, and embedded analytics that can detect figures or objects, track them, and estimate motion. Its earlier Senso-Optics materials identified a Camera On Chip thermal ASIC designed to put processing and machine-vision functions close to a miniature camera, supporting low size, weight, and power. Current product evidence adds the system-engineering layer: GNSS and laser ranging on MISGAV, ballistic-data integration on AGSS, and ruggedized packaging, IP67 sealing, and MIL-STD-810 environmental compliance claims for the artillery product. These are concrete subsystems, although independent test reports and detailed sensor specifications are not publicly available.

**Market, customers, and go-to-market.** The company sells into a specialized B2B and government-procurement market in which an electro-optical supplier must meet platform constraints, environmental requirements, export rules, and integration needs. Dagan-Optics' official site names defense, homeland security, law enforcement, public safety, and search-and-rescue buyers, while earlier ecosystem records also identify commercial aviation and automotive applications. The defense motion includes handheld observation, weapon sights, artillery fire control, combat-vehicle situational awareness, and long-range target acquisition. Civilian applications include border control, firefighting, police operations, emergency response, aircraft operations in difficult weather, and vessel navigation or docking. Haaretz reporting says approximately 95% of the company's products are intended for export and describes it as a subcontractor to major Israeli defense industries. That suggests a component and integrated-subsystem route to market, where the company wins through customization and qualification with primes, integrators, and agencies rather than through a mass-market branded-camera channel. Public sources do not disclose contract values, recurring revenue, or a complete customer list; the current website shows customer logos without identifying every organization in accessible text.

**Traction, funding, and third-party validation.** Dagan-Optics is not a newly founded venture emerging from a laboratory. Public ecosystem records identify the business lineage as Senso-Optics, founded in 2004, while the current company site says Dagan-Optics was established in 2016 and also describes more than two decades of development. The discrepancy is consistent with a reorganization or current-brand date, but the legal history and capitalization should be confirmed directly. The available evidence nevertheless shows sustained operating activity: the company has a live product catalog, a named leadership and production team, a current website carrying a 2026 copyright notice, and a LinkedIn profile listing a small Israeli workforce. Israel's Ministry of Defense SIBAT included Dagan Optics in its official AUSA 2023 Israeli defense-company brochure, and Startup Nation Finder classifies the Senso-Optics business as a private Israeli aerospace, defense, and homeland-security company with 11–50 employees and released products. The company states that its technology has battlefield and commercial achievements, while Haaretz identifies support from the Israel Innovation Authority and reports that products were donated to IDF units during the Iron Swords war in exchange for user feedback. Those are meaningful validation signals, but they are not a substitute for audited revenue, named program-of-record awards, independent range data, or disclosed external financing; no funding round is publicly established in the sources reviewed.

**Founders and team background.** Yaakov, or Jacob, Dagan is identified as founder, president, and CEO. Public biographies describe him as a Technion-trained mechanical engineer with electro-optics experience, a former Rafael research engineer and head of a guidance and optics systems division, and a former representative of Rafael involved in international industrial collaboration. The current site lists Dagan alongside COO Dorith Dagan, CTO Eyal Greenglass, production manager Dmitry Morozov, and marketing and business-development manager Noam Biran. Earlier ecosystem records identify Victor Boskovitz as CTO and other technical personnel, indicating that the public roster has changed over time. Gigi Simovich, identified in older company materials as a co-founder and aeronautical engineer with armor and materials expertise, is not listed on the current leadership page, so the present management transition deserves diligence. This is a domain-native team profile: electro-optical design, thermal imaging, target acquisition, production, and defense integration are closer to the company's core problem than generic software skills. The open questions are organizational depth, succession, current ownership, and how much of the original Senso-Optics technical IP remains controlled by the operating company.

**Competitive dynamics.** Dagan-Optics competes in a market with powerful incumbents and a long qualification cycle. Teledyne FLIR offers broad thermal-camera, sensor-core, and defense-imaging portfolios with substantial scale. Hensoldt and Leonardo DRS provide military electro-optics, sights, and fire-control systems integrated into larger defense architectures. Elbit Systems and Rafael compete as Israeli prime contractors and can develop or source similar subsystems internally, even when they also act as potential customers or integrators. Safran Electronics & Defense competes in optronics, navigation, and targeting across international aerospace and military programs. The company's defensible position is therefore unlikely to be a single secret algorithm. It is more plausibly the combination of long-lived Israeli defense relationships, application-specific integration, low-power thermal and visible fusion, compact rugged packaging, and willingness to customize at the subsystem level. Its small size can shorten engineering feedback loops and support bespoke requirements, but it also limits purchasing power, certification bandwidth, and the ability to absorb a price war or a customer that decides to vertically integrate.

**Defense, security, and resilience dual-use relevance.** Dagan-Optics qualifies as genuinely dual-use because the same perception primitives operate across military and civilian safety missions. In defense, thermal and visible fusion can support night observation, target acquisition, artillery aiming, vehicle awareness, perimeter surveillance, and operator effectiveness when weather or camouflage reduces ordinary visual contrast. In homeland security and public safety, those capabilities support border monitoring, law-enforcement observation, firefighting through smoke, search and rescue, and protection of critical infrastructure. In aviation and maritime operations, thermal perception and ranging can improve navigation, docking, and all-weather awareness. The strategic value is not that every commercial product is a weapon; it is that allied access to compact, low-power, domestically supported sensing and targeting subsystems reduces dependence on a narrow set of foreign suppliers. The Ministry of Defense exhibition record and the company's reported work with Israeli defense industries establish real defense relevance. Calibration remains important: the public record does not identify classified deployments, specific current military customers, or performance against a defined threat set, and civilian export growth does not by itself prove a unique battlefield advantage.

**Growth stage, trajectory, and key diligence risks.** Dagan-Optics is best classified as mature within the startup database's private-company taxonomy: it has operated for roughly two decades, manufactures and integrates products, exports internationally, and has a multi-generation product family. It is not mature in the public-company or large-prime sense; its employee range remains small, financing is undisclosed, and the public evidence does not show the scale of revenue, installed base, production capacity, or backlog. The upside is a durable niche supplier that can compound value through proprietary fusion and image-processing IP, new lightweight target-acquisition products, and cross-domain sales into security and rescue markets. The principal diligence risks are: (1) competition from scaled thermal and defense-electronics vendors; (2) dependence on defense procurement and long qualification cycles; (3) export-control, end-user, and geopolitical restrictions on thermal imaging and targeting products; (4) component availability and obsolescence in a small production operation; (5) unclear current ownership and the relationship between Dagan-Optics, Senso-Optics, and the separate AdaSky venture; (6) unverified public claims around performance, certifications, and recurring customers; and (7) succession risk if too much customer access or technical knowledge remains concentrated around the founding team. The key milestones to track are independently documented certifications, named international deployments, transparent production or revenue growth, and evidence that the current brand has preserved the earlier company's technical and customer base.
"""
