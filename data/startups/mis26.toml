name = "MIS26"
description = "MIS26 is an Israeli systems company combining onboard computer vision, GPS, video, and operational software for heavy fleets, waste collection, construction sites, and security operations. Its edge-processing approach is designed to document field activity and keep core monitoring functions running when a vehicle or site temporarily loses connectivity."
detailed_description = """
**Product and the operational problem.** MIS26 targets a persistent blind spot in municipal and industrial field work: managers often pay for a task, route, load, or security watch without having reliable evidence that the work happened as planned. In waste collection, an authority and its contractor may disagree about missed bins, route completion, contamination, vehicle weight, or service complaints, while paper tickets and later video review make verification slow. On a heavy truck, MIS26 describes a package of four cameras, recording, GPS and cellular connectivity, and an onboard AI computer. The same company presents systems for weighbridges, construction and hauling operations, freight, and security sites. It sells a working operational system rather than a model API: sensors and cameras, edge compute, software, installation, communications, dashboards, integrations, and ongoing support. The product goal is to turn field work into time- and location-linked records that can support control, investigation, billing, safety, and service response.

**Technology and how it works.** The clearest technical description is the collection-truck system. Video is processed locally by an onboard AI computer, while GPS, event images, timestamps, and operating data are presented through a web dashboard and mobile app. MIS26 says its computer-vision functions can count bin lifts, recognize bin color and size, detect damaged containers, identify possible recycling contamination, and flag skipped streets or uncollected bins. For asset-level tracking it describes using ArUco barcode stickers on containers, tying observed activity to an individual bin and location. At transfer stations, a separate automated weighbridge flow combines license-plate recognition, barrier control, scale readings, a driver display, and photographed records; the company says the station can pass data to ERP and environmental reporting systems. Local recording and processing are designed to continue during network outages, with synchronization when connectivity returns. The public material does not disclose model architecture, training-set size, accuracy under controlled testing, hardware vendor, patent numbers, or independent field evaluation, so the differentiated claim is systems integration and task-specific deployment rather than a proven novel AI method.

**Market, users, and route to market.** MIS26 sells into organizations that operate distributed vehicles and facilities: municipalities, waste and hauling contractors, construction firms, freight operators, and security organizations. The purchasing motion is likely a combination of direct enterprise sales, public procurement, and channel relationships with municipal service providers or systems integrators; the company lists One Dev (Taldor) and mGroup Supervision as strategic partners. Product pages describe integrations with existing weighbridges, ERP software including Priority, municipal 106 call centers, and Ministry of Environmental Protection reporting. These integrations matter because a camera feed alone is a weak municipal purchase case: the economic value depends on linking observed work to routes, service tickets, weighing, contractor settlement, and compliance. MIS26's website names municipalities including Haifa, Ashdod, Ramat Gan, Ra'anana, Holon, Jerusalem, and regional councils, and separately marks a longer list as service recipients through collection contractors. That distinction is material: the public site does not establish that each service-recipient authority is a direct contracting customer, and it discloses no contract values, customer concentration, renewal rates, or international revenue.

**Traction and third-party validation.** MIS26's own current company page says its systems operate daily across dozens of deployments and generate tens of millions of monitoring events per year. It reports 20 million-plus monitored actions, 27% operational cost savings, 70% faster SLA response, and savings of up to roughly NIS 100,000 per truck annually. Those figures are useful hypotheses for diligence, but they are vendor-reported and no independent methodology, sample size, named case study, or audited financial result was located to substantiate them. The official site displays municipal, contractor, and corporate logos and a customer quotation about reducing complaint handling time; its product pages also show shipped functions rather than only a concept description. IVC Data & Insights lists the company at the initial-revenue stage, five employees, and establishment in 2021, while an Israeli corporate-information record lists MIS 26 Ltd as incorporated in January 2019. No publicly disclosed venture round or amount was found. The site lists ISO 9001, 27001, 27701, 27017, 27018, and 27032 credentials and says it is an Israel Ministry of Defense authorized supplier; these remain company-stated claims pending inspection of certificates or supplier status.

**Founders and team.** IVC identifies Snir Nisim as CEO and co-founder and Avi Troub as co-founder, with Troub's listed role connected to international sales and channel work. The available public profiles provide little detailed biography, prior-company history, education, or engineering publication record for either founder. MIS26 says the engineering group has operational-systems experience at the Ministry of Defense and describes a locally built team covering hardware, software, communications, analytics, integrations, installation, and maintenance. These claims suggest that the company competes through end-to-end delivery and field support, a sensible model for municipal and industrial customers that do not want to coordinate multiple vendors. They do not establish the size or seniority of the current team; the five-person count on IVC may be dated, and the company's current headcount is not disclosed. The mix of a founder associated with executive and channel functions and a technically broad delivery proposition should be verified through references, team interviews, and evidence of who owns the core software and model development.

**Competitive dynamics and edge.** MIS26 sits across several established categories rather than creating a clean new market. Fleet telematics providers such as Samsara and Geotab provide vehicle location, diagnostics, cameras, and fleet workflows; waste-management platforms such as Evreka and Sensoneo focus on route, container, and collection optimization; video-security suppliers such as Motorola Solutions and Milestone Systems provide video management and control-room infrastructure; and Israeli operations-technology firms such as Ception apply perception and localization to heavy equipment. Customers can also combine commodity cameras, GPS devices, scale software, municipal call-center tools, and integrator services. MIS26's strongest potential advantage is its vertical-specific workflow coverage: one installed system can connect truck video, route execution, container identity, scale data, evidence retrieval, and contractor settlement, with offline-capable edge processing and local support. That may create switching costs through accumulated data, installed hardware, integration, and service routines. The counterargument is that the architecture relies on broadly available components and could be replicated by fleet, municipal-software, or security incumbents; publicly available evidence does not show proprietary benchmark leadership or a durable software margin.

**Security, resilience, and dual-use relevance.** The company's security relevance is more concrete than a generic claim that computer vision can be repurposed for defense: MIS26 publicly markets control-room analytics, retrospective investigation, smart observation posts, and site monitoring alongside its commercial fleet products. The common building blocks—cameras, local compute, event detection, GPS or site context, alarms, recording, and operator workflows—can support both municipal or industrial monitoring and protection of sensitive facilities, logistics nodes, or distributed infrastructure. Local processing and later synchronization are operationally useful where connectivity is intermittent, and evidence records can aid continuity and after-action review. Its waste and freight capabilities also touch essential municipal services and supply-chain operations, so reducing unobserved service gaps has a resilience dimension. However, no named armed-forces deployment, classified program, defense contract, military certification, anti-jam positioning, hardened communications, or operation under contested conditions was found. The Ministry of Defense supplier status and ISO standards are reported by the company, not independently confirmed here. Dual-use is therefore credible at the commercial security and infrastructure-protection layer, with military applicability remaining unproven.

**Stage, trajectory, and diligence risks.** MIS26 appears to be an operating but small Israeli systems vendor with early revenue and a meaningful set of field deployments, not a venture-scale company whose commercial trajectory can be inferred from public information. The official product catalog, app listings, municipal references, partner references, and IVC's initial-revenue classification indicate more than prototype status. Yet no revenue, margins, contract size, funding, churn, expansion rate, customer concentration, export sales, or current employee count is public. The main diligence questions are whether measured savings persist across a representative customer base; whether each city logo denotes a paying customer, service recipient, or pilot; how much deployment still requires bespoke hardware and field labor; how the company maintains uptime and cybersecurity across cameras and connected operational systems; whether it has rights to video and derived data for model improvement; and what the reported certifications and Ministry supplier authorization actually cover. Additional risks include long municipal procurement cycles, contractor dependence, integration burdens, privacy concerns around public-space and employee video, and competition from bundled fleet and VMS vendors. Evidence of repeatable gross margins, independently referenced deployments, renewal behavior, and a distinct security-site customer base would materially strengthen the scale case.
"""
