name = "Quack"
description = "Quack built trainable AI agents for customer support, combining company-specific context, topic-level automation, and quality controls for human and AI interactions. AUI acquired Quack on February 23, 2026; AUI said the team joined it and existing customers would continue receiving service."
detailed_description = """Quack developed a business-to-business customer support platform that connected a company’s CRM, ticketing tools, knowledge sources, and interaction history to configurable AI agents. The product was designed for support teams handling product-specific and exception-heavy questions, not just short FAQ exchanges. Quack promoted topic-by-topic training, multi-channel response and escalation, help-center content generation, voice-of-customer analysis, and quality assurance for both human and AI conversations. Its public SupportOS page describes scorecards tailored by product, team, or customer segment, an improvement tracker, and feedback from QA scores into agent behavior. Quack also marketed its platform as CRM-agnostic; a company announcement about Yotpo described an integration with Salesforce Service Cloud and Documents360.

AUI’s acquisition announcement gives the strongest technical account of Quack’s approach: it says the company encoded a symbolic representation of the context agents needed for complex customer-service topics. This may have helped capture procedural details and edge cases that generic retrieval over help articles misses. Public evidence does not specify the representation’s implementation, architecture, model dependencies, or performance under independent evaluation, so this description should not be read as proof of a patented or uniquely difficult-to-copy method. Quack’s product pages demonstrate an operational workflow and QA surface, while AUI’s stated reason for the transaction was to bring that context-oriented approach together with Apollo-1’s neural and symbolic computation.

Commercial evidence is meaningful but should be treated as reported claims. AUI said at acquisition that Quack had dozens of global paying customers and agents running in production, naming Artlist, Yotpo, WalkMe, and Hologram. In November 2025, Quack announced that Yotpo had renewed its contract, reported 70% of Yotpo support tickets automated and more than 50% growth in knowledge-base coverage, and identified Salesforce Service Cloud and Documents360 as integrations. Quack’s customer page carries an Artlist executive testimonial reporting more than 65% of inquiries fully resolved. The Yotpo and Artlist percentages have different scopes and definitions, and neither page specifies a comparable measurement window or denominator. Yotpo’s own June 2026 subprocessor list names Quack AI, Inc. for support and knowledge automation, which independently supports an operational vendor relationship but does not validate the reported automation rate. Fusion VC’s July 2025 profile of Quack’s CEO said the company had more than 40 paying customers and was on track to double revenue by year end; that is an investor-published forecast, not proof that the target was met.

Quack operated across Tel Aviv, San Francisco, and New York according to its 2025 company announcement. AUI said the acquisition doubled its Tel Aviv research and development operation and that the full Quack team joined AUI. The February announcement is the latest direct record found for the acquisition and service-continuity plan; the still-visible Quack product and customer pages do not establish how many staff, customer contracts, or product lines remain in active use after integration. Quack’s public footprint supports a production-stage product before the acquisition, but independent revenue, retention, implementation-cost, gross-margin, and customer-concentration data remain unavailable.

The product competed with support suites and agent vendors such as Intercom Fin, Zendesk AI agents, Forethought, Decagon, and Sierra. Incumbents can bundle AI into helpdesks and customer-data systems, while newer agent platforms offer workflow authoring, multichannel deployment, testing, and observability. Quack’s plausible distinction was the combination of topic-specific customer training, CRM-agnostic deployment, and QA across human and AI work. Those features are commercially relevant, yet the market’s rapid convergence makes measurable resolution quality, implementation effort, retention, and renewal economics more important than feature checklists. The acquisition shifts the key question from whether Quack can scale alone to whether AUI preserves its customer context, team knowledge, and delivery relationships inside a broader agent platform."""
