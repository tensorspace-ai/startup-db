priority_rationale = "Cognata remains a high-relevance Israeli dual-use autonomy record because its current product scope directly links simulation, synthetic data, and retrofit off-road autonomy, including defense-oriented applications. The strong strategic-alignment and dual-use scores are offset by incomplete public evidence on current traction, financing after the 2018 Series B, production deployments, and independent performance validation. It merits structured diligence and monitoring as a strategic-fit startup, without treating the record as an investment recommendation."
