competitive_edge = "Runlayer's defensible hypothesis is the integration of adoption and control in one neutral layer: approved capability discovery, MCP brokering, identity-aware policy, runtime threat scanning, shadow-AI discovery, auditability, and hosted agents, across many existing AI clients. This can be more operationally useful than a narrowly scoped proxy or a model-specific feature. The edge is not yet proven as a durable moat; large cloud, identity, and security vendors can bundle adjacent functions, while open standards and internal platform teams can reduce switching costs. Evidence of differentiated detection, customer retention, ecosystem distribution, and deployment economics is still needed."

