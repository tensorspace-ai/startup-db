name = "Runlayer"
description = "Runlayer is an enterprise AI control plane that gives organizations a governed path to deploy agents, connect MCP servers and other tools, enforce identity-aware policy, detect runtime threats, and audit AI activity. Its current product spans MCP gateway, shadow-AI discovery, runtime security, reusable skills, and hosted agent execution."
detailed_description = """Runlayer is building a control plane for enterprise adoption of agentic AI. The platform sits between AI clients and the tools, MCP servers, APIs, and internal systems that agents use. Its MCP Gateway can register existing servers, deploy custom MCP servers, and route requests through OAuth or session checks, identity-aware policy, security scanning, analytics, and audit logging. Runlayer also presents a catalog for approved capabilities, supports reusable skills and plugins, and offers Runlayer Agents for hosted or background work. This is a more expansive proposition than a simple MCP reverse proxy: the company is trying to make approved agent access discoverable and usable for employees while retaining centralized control for platform, IT, and security teams.

The customer problem is the gap between rapid AI experimentation and enterprise-grade control. Employees can accumulate unsanctioned MCP servers, client configurations, plugins, and agent workflows faster than security teams can review them. Runlayer's Watch product is positioned for shadow-AI discovery and response; its policy layer scopes access by identities, groups, roles, agent accounts, clients, connectors, tools, resources, network conditions, and runtime context; and its activity records are intended to show who or what invoked a tool, what policy and security checks occurred, and the outcome. Those controls address practical governance needs in engineering, IT, operations, security, and business teams, including least privilege, approval workflows, migration of unmanaged usage, and evidence for incident or compliance review.

Public company materials indicate early commercial validation but do not establish revenue, retention, deployment scale, or the effectiveness of security detections. The official platform page displays customer logos including Gusto, Instacart, Lemonade, Opendoor, PagerDuty, dbt Labs, and Jane, while the company describes support for more than 300 AI clients. Runlayer also says it collaborated with Anthropic on MCP Tunnels, a connection pattern for reaching systems behind a firewall. In June 2026, Runlayer announced a $30 million Series A from Felicis and Khosla Ventures, bringing stated total funding to $42 million. These are meaningful signals of financing and customer interest, but diligence should distinguish logo-based or self-reported adoption from contracted recurring revenue and independently referenceable production usage.

The competitive field is broad and increasingly well funded. Runlayer competes with purpose-built MCP gateways and agent-security vendors, but also with cloud platforms, identity and privileged-access products, AI gateways, observability tools, and internal platform teams. Its potential edge is the combination of enablement and control: a catalog, gateway, identity-aware policy, runtime threat checks, shadow-AI discovery, auditability, and hosted agents in one workflow, while allowing employees to keep using clients such as Claude Code, Cursor, ChatGPT, Codex, and GitHub Copilot. That breadth may improve adoption, but it also creates product-scope, integration, and positioning risk. The company must show that a unified control plane is materially easier and safer than assembling native cloud controls, an identity provider, an AI gateway, and security monitoring.

Runlayer has credible dual-use adjacency because the core control problem is not industry-specific: autonomous software that can read data or take actions needs scoped identity, policy enforcement, runtime monitoring, and forensic records. Those capabilities could support defense contractors, government technology teams, and critical-infrastructure operators that adopt commercial agents. The public evidence reviewed here does not establish defense contracts, classified deployments, or operational military use, so the defense case remains a strategic applicability assessment rather than a traction claim. The most important diligence questions are detection precision and latency, handling of sensitive prompts and tool outputs, tenant isolation, private or controlled deployment options, coverage beyond MCP, resilience under adversarial activity, and the durability of the company's position as agent protocols and platform-native controls evolve."""

