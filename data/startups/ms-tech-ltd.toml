priority_rationale = "MS Tech merits monitoring as a strategically aligned Israeli sensing company with a rare combination of patented detection physics, released products, current airport deployments, and direct dual-use relevance. The strongest positive signals are HF-QCM sensor differentiation, 2025-2026 AAI and Adani airport activity, Israel Innovation Authority and BIRD participation, and the ability to address explosives, narcotics, liquid threats, food, water, and environmental hazards from one platform. Priority remains below the highest-conviction early-stage opportunities because the company is mature, financing and economics are opaque, major incumbents control certification and distribution, and independent evidence for claimed performance is limited. The next diligence gates are verified reference customers, audited revenue or order data, patent schedules, legal-entity and IP clarity, and independent testing across threat classes and adverse field conditions."
