name = "MS Tech Ltd."
description = "MS Tech Ltd. is an Israeli-founded sensor company developing patented high-frequency quartz-crystal-microbalance and related detection technologies for identifying trace materials in gas, vapor, and liquid phases. Its EXPLOSCAN, DUOSCAN, THREATSCAN, MULTISCAN, and LIQUISCAN products serve aviation security, border and cargo screening, critical infrastructure, food and water monitoring, and other safety-sensitive markets."
detailed_description = """**Product and the problem it solves.** MS Tech addresses a practical security and resilience problem: operators need to identify explosives, narcotics, chemical threats, contaminants, and other trace substances quickly without relying on radioactive sources, large laboratory instruments, or slow laboratory turnaround. Its product family includes EXPLOSCAN, DUOSCAN, MULTISCAN, and THREATSCAN for explosive and narcotics trace or vapor detection, plus LIQUISCAN for liquid explosives. The systems are positioned for passenger and baggage screening, mail and cargo inspection, customs and border control, high-threat facilities, military and police operations, and critical infrastructure. The company also applies the same sensing base to food safety, product inspection, water and air monitoring, fire and smoke detection, biomedical diagnostics, and aerospace. That breadth matters strategically: MS Tech is not a single-purpose airport equipment vendor, but a sensor platform company whose flagship products have a direct homeland-security and defense use while adjacent applications create routes to non-defense revenue.

**Core technology and how it works.** The differentiating technical primitive is High-Frequency Quartz Crystal Microbalance, or HF-QCM, combined with a patented Sensor Matrix, selective chemical coatings, electronics, and pattern-recognition software. According to the company’s technical description, target molecules adsorb onto chemically coated quartz resonators; the added mass changes the resonator’s frequency, and the magnitude and time profile of that change create a digital signature. Multiple coatings provide different molecular affinities, while algorithms compare the measured response against a library containing targets and likely interferents. The architecture integrates QCM physics with plasma etching, chemical deposition, micro-mechanics, electronics, digital signal processing, and software. MS Tech states that its sensors operate across gas, vapor, and liquid phases, with a published operating envelope of approximately -10°C to +60°C and 5% to 95% relative humidity without condensation. Its products also emphasize self-calibration and self-cleaning, non-radioactive operation, and ruggedization for dusty or humid environments. Those claims are technically coherent and more specific than generic “AI sensing,” but the most demanding diligence question remains independent validation of sensitivity, false-alarm rates, selectivity, and lifecycle performance across real-world samples.

**Market, customers, and go-to-market.** The primary market is security screening, where the buyer is an airport authority, aviation-security integrator, border or customs agency, military organization, police unit, high-threat facility, or critical-infrastructure operator. MS Tech sells physical detection systems with installation, training, service, software, consumables, and technical support rather than a pure recurring SaaS product. Public company material identifies a case study at Mexico City International Airport and describes recurring procurement and maintenance activity with Adani Airports. In September 2025, MS Tech announced a multi-million contract from the Airports Authority of India for multiple THREATSCAN desktop explosive-trace detectors at 93 airports, following earlier deployments at Chennai, Goa, Kolkata, and other airports. In January 2026, the company announced a contract for multiple DUOSCAN systems at Adani Navi Mumbai International Airport and additional installations at Guwahati Airport. The combination of direct airport deployments, local integration, and service renewals is meaningful commercial evidence, although most contract values, unit counts, gross margins, and independent customer references remain undisclosed. A second go-to-market path is supplying customized sensors and integrated solutions to affiliated companies, OEMs, and resellers, which could broaden distribution but also makes end-customer visibility and channel economics harder to assess.

**Traction, funding, and third-party validation.** The public record supports a company with long operating history and released products, not a newly formed venture. The Israel Innovation Authority’s company page identifies MS Tech Ltd., registration number 512582693, as established in 1998, with 50 employees, an initial-revenues stage, and 2024 and 2025 Applied Research Consortia activity. Startup Nation Finder lists the company as founded in January 1998, with 51–200 employees, released products, one disclosed but undisclosed funding round from DS Ventures in January 2015, and additional patents granted by the United States Patent and Trademark Office and Israel Patent Office in December 2020. The BIRD Foundation’s 2018 project announcement records a Herzliya Pituach MS Tech and Georgia-based Tekwave Solutions collaboration to develop rapid field analysis of chlorates, perchlorates, fentanyl, and synthetic opioids using HF-QCM sensors. Israel’s Ministry of Defense SIBAT included MS Tech in its 2023 AUSA company brochure as an advanced sensor developer. These are useful ecosystem and technical-validation signals, while the record is appropriately incomplete on total capital raised, patent numbers, audited revenue, backlog, certification scope, and the precise commercial relationship among MS Tech Ltd., MS Technologies Inc., and the MS Detection brand.

**Founders and team background.** Startup Nation Finder identifies Moshe Shalom as the founder and co-founder/Chairman, while Israel Innovation Authority material identifies Doron Shalom as CEO. The company’s public leadership footprint also names Dudi Siboni as CFO and identifies a U.S. Tysons Corner, Virginia contact address for MS Technologies Inc.; the Israeli ecosystem sources place the company’s operating and registered presence in Herzliya/Herzliya Pituach. The team thesis is therefore founder-led, technically specialized, and internationally commercial rather than a newly assembled software startup. Moshe Shalom’s early work is linked by public reporting to an explosives-detection system developed in Ness Ziona with support from U.S. and Israeli defense programs, while later company material shows sustained analytical-chemistry, sensor-engineering, productization, and airport-deployment activity. The public evidence does not justify guessing at the size or composition of the current engineering organization, the identity of named inventors behind each patent family, or the depth of field-service and regulatory personnel. Diligence should map the Israeli legal entity, the U.S. operating entity, ownership, IP assignment, senior technical bench, and succession plan, because a company with more than two decades of accumulated sensor know-how can still carry substantial key-person risk.

**Competitive dynamics.** MS Tech competes against entrenched explosive-trace and chemical-detection suppliers including Smiths Detection, Bruker, Thermo Fisher Scientific, and OSI Systems/Rapiscan, all of which bring installed bases, procurement relationships, certification experience, and large service organizations. It also faces specialized optical and spectrometric approaches such as Teledyne FLIR handheld detection and other ion-mobility, Raman, mass-spectrometry, and colorimetric systems. MS Tech’s plausible edge is not that it eliminates all sample handling or proves superior on every target; it is the combination of a non-radioactive, chemically selective QCM sensor matrix, compact field instruments, real-time pattern recognition, self-calibration, and a common technology base spanning vapor and liquid threats. The platform can be tailored across airport, military, industrial, and environmental applications, and the company’s public airport deployments demonstrate that it can pass at least some procurement and operational gates. Countervailing risks are serious: incumbent instruments may have stronger formal certifications and reference density; chemical coatings and pattern libraries require continual maintenance; target/interferent variation can drive false alarms; and a technically elegant sensor does not automatically win a regulated procurement. The edge is therefore best treated as a differentiated and commercially demonstrated architecture, not as a proven monopoly or a claim that QCM replaces every incumbent modality.

**Defense, security, and resilience relevance.** MS Tech merits dual-use classification because the same core detection products are marketed and deployed for civilian aviation, cargo, border, and infrastructure screening while also being explicitly positioned for military, police, high-threat, EOD, and homeland-security missions. Rapid detection of explosives and narcotics can protect checkpoints, ports, bases, mail facilities, and transport nodes; detection of chemical hazards and contaminants can support force protection, industrial safety, and emergency response. The technology’s non-radioactive operation can simplify safety and logistics compared with radioactive-source instruments, while self-calibration and operation across dust, humidity, and temperature variation are relevant to field use. The BIRD project extends the resilience case into portable analysis of chlorates, perchlorates, fentanyl, and synthetic opioids, and the Israel Innovation Authority records newer work in biosensors for soil and groundwater contamination. The dual-use assessment should remain calibrated: open sources prove product deployment and defense-market positioning, but they do not prove a particular classified military customer, combat deployment, or superiority under battlefield conditions. Strategic value lies in sovereign Israeli sensing know-how, scalable detection at aviation and critical-infrastructure chokepoints, and a platform that can be adapted to emerging threats without depending on one narrow end market.

**Growth stage, trajectory, and key diligence risks.** MS Tech is best categorized as mature rather than early or mid-stage: it was founded in 1998, reports initial revenues and released products, and has public installations across multiple regions. Its recent India contracts and recurring service language suggest continued commercial momentum, while Israel Innovation Authority-backed research indicates that the company is still extending the sensor platform into food, agriculture, water, and biomedical applications. The growth opportunity is to convert an established airport-security base into a broader sensor platform with OEM partnerships, new threat libraries, liquid and chemical detection, and resilience applications. The key risks are (1) procurement concentration and long sales cycles in airports and government security; (2) undisclosed revenue, backlog, contract economics, and customer concentration; (3) verification risk around company-reported installation counts, performance, and “high sensitivity” claims; (4) certification, export-control, and country-specific regulatory friction; (5) manufacturing quality, coating consistency, calibration, and false-alarm performance at scale; (6) competition from larger suppliers with deeper service and certification budgets; and (7) corporate-structure and key-person ambiguity across the Israeli, U.S., and MS Detection identities. The record is strategically attractive because it combines a real Israeli deep-tech base with current deployments, but further priority should depend on independent test data, patent schedules, audited financial or order evidence, named reference customers, and clarity on ownership and commercialization rights."""
