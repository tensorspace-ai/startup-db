name = 'Classiq'
description = "Classiq Technologies Ltd. is an Israeli quantum software company whose platform lets developers model quantum algorithms at a high level and synthesize, optimize, analyze, and deploy circuits across quantum hardware and simulators."
detailed_description = """Classiq Technologies Ltd. is an active Tel Aviv quantum software company founded in 2020 by Nir Minerbi, Amir Naveh, and Yehuda Naveh. Its commercial proposition is to reduce the engineering effort between a problem or functional model and an executable quantum circuit. Classiq Dev combines the Qmod high-level language, a compiler-optimizer, analysis and debugging tools, and workflow support. The company's materials describe a synthesis engine that explores circuit implementations under resource and hardware constraints; this is a software productivity and portability proposition, not evidence that customer workloads already achieve quantum advantage. Its official product description supports deployment across multiple quantum backends and simulators, while AWS Marketplace availability and hardware partnerships provide distribution and integration routes.

The available evidence shows an increasingly well-financed private company, not a publicly traded or acquired entity. Classiq announced a $110 million Series C led by Entrée Capital in May 2025 and said that event brought total funding to $173 million. In July 2025 it announced a SoftBank Vision Fund 2 strategic investment with CDP Venture Capital, expressly described as an expansion of the Series C, without disclosing its amount. In November 2025 it announced a separate strategic up-round involving AMD Ventures, Qualcomm Ventures, IonQ, Mirae Asset Capital, LeumiTech77 and Quantum Eretz. The company called the financing “tens of millions” and said cumulative funding exceeded $200 million. Calcalist estimated the last round at about $30 million, but the company did not disclose an exact figure. The defensible public funding picture is therefore $110 million in the announced Series C plus at least two later extensions/up-rounds of undisclosed precise size; the company-reported cumulative total is over $200 million as of November 2025. Private valuation, cap table, revenue, profitability, burn and runway remain undisclosed in reliable primary material located for this review.

The founders and current leadership listed by the company are CEO Nir Minerbi, Chief Product Officer Amir Naveh, CTO Dr. Yehuda Naveh, CRO Regev (Reggie) Yativ, CFO David Aber, and product, people, applications, engineering and security leaders. The official leadership page identifies roles but offers limited independently checkable career histories. Funding milestones show participation from a broad institutional syndicate: Entrée Capital led the 2025 Series C; the company also names Norwest, NightDragon, Hamilton Lane, Clal, Neva SGR, Phoenix, Team8, IN Venture, Wing, HSBC, Samsung Next and QBeat. SoftBank Vision Fund 2 and CDP Venture Capital joined in July; AMD Ventures, Qualcomm Ventures, IonQ, Mirae Asset Capital, LeumiTech77 and Quantum Eretz joined the November up-round. No public cap table or disclosed ownership percentages were located. These investments do not make the corporate investors owners of the platform or establish control absent filed terms.

Commercial evidence should be read at the right level. BMW's own account says it joined Classiq and NVIDIA to explore quantum methods for vehicle architecture and describes the field's industrial use as still at an early research/trial stage. Classiq's own case study describes an exploratory EV cooling-system use case. Classiq's website includes testimonials and references to HSBC, NTT DATA, AWS, Rolls-Royce, Mitsubishi Chemical, and others; these show engagement, partnership, or stated interest, but do not establish that every logo is a paying customer or that the platform is deployed in production. Its collaboration with customers and technology vendors can validate engineering relevance and help distribution while leaving willingness to pay, renewal, usage, and measurable ROI unresolved. The November strategic round and 2025 product/marketplace activity provide evidence of continuing ecosystem development, not audited operating traction.

Technically, synthesis from functional models into hardware-aware gate-level circuits can reduce manual circuit construction and help developers compare resource/performance tradeoffs. Classiq's public patent record includes granted US patents assigned to Classiq Technologies Ltd. covering quantum program compilation, circuit synthesis, resource optimization, debugging, and execution. This substantiates a meaningful patent portfolio, but patent counts or filings alone do not establish enforceable breadth, freedom to operate, or commercial moat. The core diligence question is whether the engine produces reliably better circuits, development speed, or cross-backend portability on representative workloads than native SDKs and open tools, under reproducible benchmarks and realistic hardware noise/resource constraints. The Qmod language, integrated analysis tools, algorithm library, training, and services may improve adoption, but services intensity and platform switching costs are not publicly quantified.

The competitive landscape includes hardware-provider stacks such as IBM Qiskit, Google Cirq, and AWS Braket tooling, as well as independent infrastructure firms including Q-CTRL and QC Ware. These are not exact substitutes across all functions: Q-CTRL emphasizes quantum control and performance, QC Ware offers quantum algorithms/software and cloud access, while Classiq emphasizes high-level modeling and circuit synthesis. Native vendor tools benefit from direct hardware integration and distribution; independent tools may offer greater hardware flexibility. That flexibility has value only if abstractions preserve performance and the platform supports target-specific constraints as hardware evolves. Open-source libraries and internal enterprise research teams are additional substitutes. Classiq's durable position depends on synthesis quality, breadth and depth of integrations, usable developer workflows, customer retention, and intellectual property that withstands competition from hardware vendors and open-source projects.

Commercial potential is linked to the pace of useful quantum hardware and organizations' budgets for experimentation. Near-term opportunities are quantum R&D, workforce enablement, prototyping, and hybrid classical-quantum workflows in optimization, chemistry, materials, finance, and engineering. The company is exposed to long and uncertain adoption cycles: many industrial demonstrations remain proofs of concept, and quantum advantage over classical methods is problem-specific and not established by platform availability. A software vendor can still monetize development tooling before fault-tolerant machines arrive, but the size and recurrence of that spend need direct customer validation. The large 2025 capital raises increase runway potential, though no runway or burn disclosure allows an estimate.

Classiq has substantiated dual-use relevance at the general capability level because quantum algorithm design and circuit synthesis can support commercial scientific and optimization work as well as government research in cryptography, materials, logistics, and other sensitive areas. The sources reviewed do not establish a defense contract, classified deployment, weapons use, or a particular national-security customer. The Israeli headquarters and global investor/customer ecosystem make export-control classification, customer screening, data handling, and cross-border access appropriate diligence topics, but no specific restriction or violation is evidenced here. A defense thesis should therefore remain conditional on disclosed government work and applicable controls rather than inferred from generic quantum capability or customer logos.

Investment assessment remains exploratory rather than a recommendation. The company has notable capital access, a technical product with a clear abstraction-layer problem to address, public patent activity, and a broad partner/customer-engagement footprint. Key risks are the uncertain timing of quantum utility, low transparency into revenue and retention, potentially pilot-heavy demand, dependence on third-party hardware roadmaps, competition from integrated SDKs and open-source tools, and lack of public cap-table or valuation information. Diligence should establish paid customer count and recurring revenue by cohort; renewal, deployment and usage status for named accounts; comparative circuit-quality and productivity benchmarks; what portion of revenue is software versus services; and ownership, option pool, and financing terms. Scores reflect strategic and technical promise alongside substantial commercialization uncertainty, not a forecast of quantum advantage or investment return."""
