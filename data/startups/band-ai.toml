name = "BAND AI"
description = "BAND (operated by Israeli company Thenvoi AI Ltd.) builds interaction infrastructure for distributed AI agents: an agent collaboration mesh for discovery, delegation, and context exchange, plus a control plane for authority boundaries and auditability. Its public product spans framework adapters, APIs, agent rooms, and coding-agent collaboration."
detailed_description = """
**Product and problem.** BAND is the current operating brand of Thenvoi AI Ltd., an Israeli-founded software startup focused on agent interaction infrastructure. Its thesis is that enterprise agents will increasingly run across different teams, clouds, and frameworks, while their owners need ways to discover collaborators, route work, carry context, and enforce authority boundaries. Instead of asking customers to adopt a single agent framework, BAND describes a two-layer architecture: a collaboration mesh that supports discovery, delegation, and context exchange, and an organizational control plane for governing interactions and maintaining auditability. These are company-described capabilities; independent operational security or efficacy evaluations were not located in this review.

The live product makes the initial thesis more concrete than the April 2026 stealth announcement. BAND publishes documentation for an Agent API, real-time WebSocket events, identity and room membership, messaging and handoffs, and SDK or adapter paths for a wide range of frameworks and coding agents. Its integrations directory lists Google A2A, ACP, LangGraph, CrewAI, Anthropic SDK, Claude Code, Codex, GitHub Copilot, Salesforce Agentforce, Microsoft Copilot Studio, AWS AgentCore, Azure AI Foundry, and others. Listing an integration establishes advertised compatibility, not proof that each integration is production-certified or adopted by a paying customer. The public Hacker Guide describes a free tier with up to ten agents and paid Pro and Enterprise capabilities; the Enterprise tier includes memory and human-facing management APIs according to that guide. A separate Jam product is presented for coordinating coding-agent work, initially supporting macOS and Linux with Claude Code. These pages indicate productization and self-serve developer access, but do not establish usage, retention, or revenue scale.

**Commercial model and market.** The likely model is software subscription with free entry and paid Pro and Enterprise tiers, based on BAND's public product guide and pricing references. The natural buyers are developer-platform, AI-infrastructure, and enterprise engineering teams that need agents from distinct stacks to collaborate under shared identity and policies. Potential use cases include coordinated coding agents, internal research and operations agents, and cross-team or cross-organization agent workflows. The launch-era Calcalist report said BAND had initial revenue and roughly ten partners in April 2026, but it did not name those partners or disclose contract values; that snapshot should not be extrapolated into current revenue or customer counts. No named production customer, contract size, ARR, renewal, or usage metric was found in the reviewed company material through October 4, 2026.

**Funding and ownership.** BAND announced a $17 million seed in April 2026. Calcalist described Sierra Ventures, Hetz Ventures, and Team8 as leading the round; BAND's own launch post names all three as backers. The company's official about page continues to list those investors. The round is the only publicly verifiable BAND financing located in this review. The previously published expectation that a Series A might follow within one or two quarters is now stale: targeted searches through October 4 did not find a subsequent round announcement. This absence is not evidence that no financing or private secondary activity occurred. The company's public materials identify the legal operating name as Thenvoi AI Ltd. and the brand as BAND; no parent company, ownership percentages, or complete cap table were disclosed. Company-registration aggregators surfaced an Israeli registration number, but no registry primary-source record was verified here, so no registry identifier is asserted.

**Team.** The official company page identifies Arick Goomanovsky as co-founder and CEO and Vlad Luzin as co-founder and CTO. Team8's profile describes Goomanovsky as a serial entrepreneur who co-founded Sygnia and Ermetic, both acquired, and records his Israel Intelligence Community service and Talpiot education. Calcalist reports Sygnia's sale to Temasek and Ermetic's sale to Tenable, and describes Luzin's Ministry of Defense DDR&D/MAFAT background and work at Verint, CME Group, and Samsung, including leading a multi-agent systems team. These are strong founder credentials relevant to enterprise infrastructure, security, and distributed systems, though founder pedigree does not substitute for evidence of product-market fit. Beyond the two founders, current leadership, team size, hiring pace, and engineering capacity remain insufficiently documented in reviewed primary sources.

**Competition and technical position.** BAND's cross-framework proposition competes with both products and standards. Google introduced A2A as an open protocol for agents built by different vendors and frameworks to collaborate. Anthropic's MCP standardizes connections between AI applications and tools or data, and therefore overlaps with parts of the broader interoperability stack while addressing a different interaction boundary. LangGraph offers framework-native multi-agent supervisor and swarm patterns. BAND lists support for A2A and multiple framework ecosystems, suggesting a strategy of complementing protocols and runtimes with a managed interaction and governance layer. Its potential differentiation is persistent identity, discovery, cross-stack routing, interaction policy, and auditability in one operating service. This is a strategic claim that still requires product comparisons under realistic workloads: standards may add identity, authorization, and observability; cloud or SaaS platforms may bundle cross-agent coordination; and open-source orchestration may be good enough for many buyers.

**Traction and maturity.** Evidence has improved from a launch announcement to a functioning public developer surface, continuously updated documentation, integration listings, self-serve access, and a specialized coding-agent product. The public SDK changelog includes entries dated September 27, 2026, and the platform changelog shows a September 16, 2026 update, indicating active product maintenance at those dates. These are evidence of shipping and ongoing development, not of enterprise adoption or commercial scale. The April 2026 claim of early revenue and roughly ten partners is reported by media and remains company-attributed launch traction without named counterparties. No public evidence reviewed establishes employee count, deployment count, revenue, gross retention, or security certification.

**Strategic and dual-use assessment.** Governance of autonomous software can matter to enterprises, public services, and security-sensitive operators because identity, least privilege, review, and traceability become more consequential as software agents take actions. The same generic capabilities could be relevant to defense or critical infrastructure, but the public product and funding materials reviewed are commercially oriented. No defense contract, government deployment, classified capability, or defense certification was found. Accordingly, dual-use is an adjacency based on the general-purpose technology and founder background, not validated defense demand. The core diligence issue is whether BAND can prove that its managed control plane solves a costly operational problem beyond what protocols and platform-native features supply. Further questions include actual paid usage and renewals, policy enforcement boundaries and failure handling, security architecture and independent assurance, gross margins at scale, and the degree to which customers can migrate off the service.
"""
