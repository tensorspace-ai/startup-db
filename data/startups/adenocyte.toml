dual_use_description = """No defense or security application was identified. LINFU is a clinical sampling and cytology workflow for pancreatic cancer and possible future diagnostic uses in breast and prostate care. The technology may have general medical value in civilian and military health systems, but no defense customer, military contract, security use, or defense-specific capability is disclosed. A dual-use label is therefore not supported by the public evidence reviewed."""
