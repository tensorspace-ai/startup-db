name = "GRAIL, Inc. (Galleri)"
website = "https://grail.com/"
rationale = "Indirect competitor for early-detection budget and clinical attention; Galleri is a broad blood-based multi-cancer test that includes pancreatic cancer."
differentiation = "Galleri uses methylation-based blood testing across many cancers, while LINFU is a specialist pancreatic sampling workflow for high-risk people. GRAIL reported an NHS randomized trial of 142,250 participants; it found no significant reduction in the combined stage III/IV primary endpoint over the stated follow-up, while reporting fewer stage IV diagnoses in later screening rounds. This is a broad screening comparator, not a head-to-head substitute."
source_ids = ["grail_nhs_galleri"]

