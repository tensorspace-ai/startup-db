stage_rationale = """Adenocyte has moved beyond a laboratory-only concept: its investor reported clinical deployment at several U.S. endoscopy centers and more than 150 procedures by May 2026, and Quest Diagnostics describes the associated cytology workflow. The company also has observational clinical registries and an Israel patent grant. However, the disclosed clinical evidence remains early. ClinicalTrials.gov lists an invitation-only registry with a planned 500 participants, no posted results and an estimated completion in 2034; the NCI-listed study is also enrolling by invitation. The 2026 90-patient performance summary is investor-reported from a conference presentation and has not been located as a peer-reviewed dataset. There is no public evidence of scaled recurring volume, validated performance across centers, or recent revenue. I classify the operating stage as early commercial rather than mid-stage or mature."""
competitors = ["Endoscopic ultrasound (EUS) with fine-needle aspiration or biopsy", "MRI/MRCP surveillance", "CT and other pancreatic imaging", "ERCP-based pancreatic-fluid cytology", "Immunovia PancreaSure blood test", "GRAIL Galleri multi-cancer early-detection test"]
competitive_edge = """LINFU targets a sampling bottleneck. It uses an external ultrasound application and microbubbles to increase natural shedding of ductal epithelial cells into pancreatic fluid, then relies on endoscopic collection and standard cytological interpretation. The potential advantage is richer cellular material that could reveal dysplasia or very small lesions that imaging does not yet characterize. This differs from Immunovia's blood-based five-biomarker PancreaSure assay and GRAIL's broad circulating-DNA methylation approach. It also differs from conventional EUS/MRI surveillance: LINFU is intended to add a cellular specimen to the specialist workflow, not to provide a stand-alone image or blood result. Quest Diagnostics' service page and May 2026 investor announcement suggest a route into existing laboratory and endoscopy-center operations. The moat, if any, must come from reproducible sampling, protocol know-how, device integration and enforceable patent claims. The patent record includes issued and pending applications covering cell exfoliation, ultrasound probes and cavitation control. Public evidence does not yet establish that LINFU outperforms current surveillance, improves surgical decisions or reduces mortality. ASGE guidance continues to recommend EUS and/or MRI for genetically susceptible people, and the evidence quality is low; NCI warns that screening can produce false positives, overdiagnosis and false negatives. A credible competitive position therefore requires a prospective, multi-site, blinded comparison with clinical follow-up, not only a higher cell count or conference case series."""
risk_factors = [
  "Clinical validity is the central risk. The 100% specimen-adequacy and specificity figures and four occult-neoplasia findings among the first 90 high-risk patients were summarized by the investor from a conference presentation. The public poster listing does not provide the underlying methods, confidence intervals, denominator definitions or blinded adjudication. The registries have no posted results.",
  "The screening indication and regulatory pathway need precise documentation. Adenocyte, iGan and Quest use FDA-cleared language around LINFU, while the FDA record checked names GE's Venue Fit ultrasound imaging system. That record does not identify an Adenocyte cancer-screening indication. The specific clearance, labeling, device/software combination and jurisdictional approvals should be confirmed.",
  "The workflow still requires a specialist endoscopy to collect pancreatic fluid, along with ultrasound, microbubbles and secretin. Capacity, patient acceptance, procedure risk, operator learning curves and repeat-sample rates may limit adoption. Sarasota Memorial reported one insufficient sample among the first five sisters in its study.",
  "The addressable population is narrower than the general cancer-screening market. NCI says average-risk people should not be screened for pancreatic cancer, and professional guidance for high-risk people centers on MRI/MRCP and EUS. Referral criteria, guidelines and evidence-based reimbursement determine the practical market.",
  "Commercial traction is not transparent. An investor release reported more than 150 procedures and several centers, and Quest lists a service, but no paid procedure count, repeat usage, customer contract value, price, payer mix, reimbursement denial rate or audited revenue was found.",
  "Financing and runway are unclear. iGan reported a $10 million financing target and led its first close, but did not disclose first-close proceeds; final close was anticipated in June 2026 and no completion notice was found. Grant amounts, cash, burn and runway are not public.",
  "Ownership and IP structure are not fully mapped. Adenocyte Ltd appears as Israeli registrant and patent assignee; Adenocyte LLC appears as clinical-trial sponsor and in an older patent record. The public sources reviewed do not establish the entities' corporate relationship, cap table, licenses, patent prosecution status in each territory or freedom to operate.",
  "The team has relevant device, ultrasound, pathology and clinical experience, but the public company page is not a full org chart. It is unclear who owns regulatory quality systems, biostatistics, manufacturing, reimbursement and multicenter trial execution at scale."
]
