name = "Adenocyte"
crawled_at = "2026-10-21T21:31:03Z"
updated_at = "2026-10-21T21:31:03Z"
description = "Israeli medical-technology startup developing LINFU®, a microbubble-enhanced, low-intensity ultrasound and cytology workflow intended to improve pancreatic-cell sampling for early detection in high-risk patients."
detailed_description = """Adenocyte Ltd is a privately held Israeli medical-technology company developing LINFU® (Low Intensity Non-Focused Ultrasound), which applies external low-intensity ultrasound with microbubbles to increase epithelial-cell shedding into pancreatic fluid. An endoscopist then collects the fluid for cytological review. The company is focused first on people at elevated pancreatic-cancer risk, including those with pancreatic cysts, family history or genetic risk. The workflow is designed to enrich a specimen rather than replace imaging, endoscopy or pathology. Company materials describe earlier animal and human testing, and iGan Partners reported U.S. clinical deployment at several endoscopy centers and more than 150 procedures by May 2026. ClinicalTrials.gov lists observational studies, including an IPMN registry with a planned 500 participants and a 2034 estimated completion; no registry results were posted on the record reviewed. Quest Diagnostics provides an associated pancreatic cytology service page. LINFU’s performance claims remain preliminary: the 2026 investor release summarized a conference presentation, while the registered studies are still collecting longitudinal data. The company has an Israeli patent grant and a public set of pending U.S. and international applications around ultrasound-enhanced cytopathology."""
