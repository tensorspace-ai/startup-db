priority_rationale = """Keep Adenocyte as a monitored early-commercial medtech candidate, not a current internal priority. The company has unusually tangible translational signals for a small Israeli diagnostic startup: an identified Israeli legal entity, IIA R&D support, a named specialist investor, a public laboratory workflow, U.S. center procedures and a growing patent family. The scientific question is also specific and testable: does microbubble-enhanced low-intensity ultrasound yield useful, reproducible pancreatic cytology beyond existing imaging and endoscopic sampling? That is a better reason to track it than broad claims about solving pancreatic cancer. The priority remains low until public clinical data can be assessed independently, the first-close and final financing amounts are clarified, the exact device clearance and intended use are mapped, and paid procedure economics are visible. Any committee review should treat the investor-reported 90-patient findings as a lead for diligence, not an efficacy conclusion. A move to a higher internal priority would require full cohort methods, sensitivity and specificity with confidence intervals, pathology adjudication, safety and repeat-sampling data, multicenter reproducibility, reference-site adoption and evidence that reimbursement translates into collected revenue. This is a portfolio-screening signal, not investment advice."""

