name = "TrekAce Technologies"
description = "TrekAce Technologies is an Israeli defense and dual-use human-machine-interface startup building tactile command-and-control wearables and GNSS-independent positioning software. Its CORE sleeve and related applications are designed to preserve navigation, team coordination, and situational awareness when visual and audio channels are overloaded or satellite navigation is denied, jammed, or spoofed."
detailed_description = """
**Product and the concrete problem it solves.** TrekAce is addressing a specific operational failure in dismounted operations: a person cannot reliably look at a map, listen to a radio, move, communicate, and act on a threat at the same time, especially in darkness, urban terrain, underground spaces, high noise, or combat stress. The company’s CORE product is a wearable robotic sleeve that converts commands and alerts into tactile signals on the arm, creating a second information channel that does not require the operator to look down or stop moving. The company's product family also includes software rather than only a wearable: its Non-GNSS PNT application provides navigation and positioning without satellite signals, LEADER is an Android tactical command-and-control application for squad and team leaders, and LightSaber combines positioning, bearing, range, and haptic commands to share a common tactical objective. This is a coherent product boundary: TrekAce is trying to make the individual operator, the team, and existing C4I systems interoperable under degraded conditions, not merely sell a consumer vibration accessory.

**Core technology and how it actually works.** TrekAce’s non-GNSS navigation method is described as a software-only Android APK or algorithm library that consumes raw measurements from an Android device or inertial measurement unit. The system first creates a personalized profile of the user’s movement, including stride, posture, tilt, and other motion characteristics, then uses a proprietary machine-learning algorithm to compensate for the inaccuracy of commodity sensors and estimate movement without depending on GPS. The company says the profile can be created once in roughly three minutes and then used to provide location, navigation, or a feed into a C4I or battle-management system. The public patent record for IL265158A and the related PCT filing identifies a TrekAce entity and describes navigation in GPS-denied environments; it supports the existence of an IP claim, but does not independently establish accuracy, patent enforceability, or field performance. The CORE sleeve adds IP67 protection, USB-C charging, and a stated one-week operating period after three hours of charging. These are useful product specifications, while the company’s claims of more than 75% response-time improvement versus visual signals remain company-presented performance claims without a public test protocol.

**Market, customers, and go-to-market.** TrekAce began with civilian navigation and outdoor-sport concepts, but its public market emphasis shifted toward defense after security organizations saw the relevance of hands-free navigation and communication. The company now describes defense as its focus and says it has strategic commercial cooperation, sales, and ongoing projects with Tier 1 defense forces worldwide; it does not name those forces, contract values, deployment quantities, or recurring revenue. The likely buyer set includes defense ministries, prime contractors integrating future-soldier systems, special-operations and infantry units, public-safety teams, and resellers of tactical electronics. The commercial route is visible in the product architecture: a customer can use an Android application, integrate an algorithm library into an existing navigation or C4I/BMS application, or add the CORE sleeve and tactical controllers for richer interaction. That reduces the need for a complete platform replacement, but it also creates integration and support obligations. The civilian side includes outdoor navigation, sports, medical or rehabilitation interfaces, autonomous-vehicle interaction, and industrial or emergency operations; these are credible transfer markets, although current public evidence is much stronger for defense positioning than for civilian sales.

**Traction, funding, and third-party validation.** TrekAce has more public validation than a concept-stage company, but less disclosure than a scaled defense supplier. The company’s official site labels its Non-GNSS PNT capability TRL 9 and describes it as tested, field-ready, and operational; those labels are self-reported. The official CTTSC3 organizer, a joint U.S. Department of Defense CTTSO, Israel Ministry of Defense MAFAT, and MIT Enterprise Forum initiative, records TrekAce as the $10,000 runner-up in the Urban Navigation Technologies track after live trials in a simulated urban environment. TrekAce’s own site calls the same 2018 event a winner, so the responsible conclusion is that it received meaningful challenge recognition rather than repeating an unqualified first-place claim. In 2023 the Israeli Ministry of Defense listed TrekAce Technologies among the Israeli defense industries in the country’s first national pavilion at DSEI Japan. Globes reported in 2018 that the company had sold an advanced version to armies, raised a seven-figure dollar amount from private investors, and employed six people. Startup Nation Finder later listed the company as founded in 2015, with 1–10 employees and an undisclosed funding history. Together these signals support a real, operating, product-oriented startup; they do not prove current scale or procurement volume.

**Founders and team background.** The official team page identifies Ronen Gabbay as founder and CEO, Itay Cohen as VP of R&D, an algorithms chief identified only as Dr. E.K. with a physics PhD, and Adi Dickler as operations manager. Startup Nation Finder identifies Eliaz Hashdi as a co-founder and places the company in Kfar Saba, while the Israeli corporate-information profile gives TrekAce Technologies Ltd. company number 515287613 and an active private-company status. This is a compact team for a product that spans machine learning, inertial navigation, Android software, wearable electronics, haptic human factors, tactical networking, and defense integration. The founder’s public biography is not a deep technical CV, and the public record does not disclose engineering headcount, manufacturing partners, regulatory certifications, or the identity of the algorithm team. That makes team diligence especially important: a small group can move quickly and preserve a focused architecture, but it may be exposed to key-person risk, limited production capacity, and the difficulty of supporting multiple defense customers simultaneously. The available evidence shows named leadership and a persistent operating footprint, not a fully documented scale-up organization.

**Competitive dynamics.** TrekAce competes across two adjacent layers. In dismounted command and control, it faces Elbit Systems’ soldier systems and C4I offerings, the Android-based Team Awareness Kit ecosystem, and larger integrators that can bundle navigation, radios, displays, and battle management into an existing procurement program. In GNSS-denied positioning, it competes with TRX Systems’ inertial and networked navigation products, SBG Systems’ inertial-navigation systems, and internal algorithms from defense primes and handset or sensor vendors. In human-machine interfaces, INVISIO and other tactical communications suppliers compete for the operator’s limited equipment, attention, power budget, and procurement line. TrekAce’s potential edge is not that it owns every sensor; it is the combination of an unused tactile channel, a personalized software-only positioning method, open integration through Android and SDKs, and a product family that connects navigation, team visibility, target bearing, and covert commands. That combination may reduce cognitive load and installation friction. It is not yet a proven moat. Established rivals have larger validation budgets, procurement relationships, manufacturing capacity, cybersecurity teams, and the ability to offer a single accountable system integrator.

**Defense, security, and resilience dual-use relevance.** TrekAce is a strong dual-use case because the same core mechanisms serve commercial and defense contexts without requiring a speculative change in the underlying technology. For defense, tactile alerts can preserve attention for movement and observation; GNSS-independent positioning can support operations in jamming, spoofing, urban, dense-vegetation, underground, or indoor environments; and LightSaber can let a team share a bearing, waypoint, or target coordinate through a mesh and haptic interface rather than ambiguous voice or gesture. For homeland security and public safety, the same stack could support firefighters, search-and-rescue teams, police, disaster responders, and infrastructure inspectors who need hands-free navigation or alerts in smoke, noise, darkness, or communications-constrained sites. For civilian markets, it can support outdoor navigation, sports, accessible interfaces, medical training, and robotics interaction. The dual-use assessment remains calibrated: public sources show defense-market focus and challenge recognition, but do not identify a fielded military program, current named customer, security accreditation, or independent survivability test. The technology’s strategic value is therefore credible and direct at the operator-interface and resilient-PNT layer, while the scale of its realized national-security contribution remains unconfirmed.

**Growth stage, trajectory, and key diligence risks.** TrekAce is best classified as early despite being founded in 2015, because it remains a small private company with an undisclosed financing history, a limited public team, and no disclosed recurring revenue or production volume. It is further along than a laboratory project: its products are publicly described, the company reports sales and ongoing projects, the navigation technology has been entered in government-linked testing, and the Ministry of Defense has presented TrekAce in an international defense-industry pavilion. The trajectory depends on converting a distinctive interface into repeatable procurement and integration. Key diligence points are: (1) independently measured positioning drift and accuracy over time, indoors, underground, and under deliberate jamming or spoofing; (2) haptic-language learning time, false alerts, user fatigue, and performance while running, aiming, or treating casualties; (3) secure Android, SDK, mesh, and data-handling architecture; (4) battery, ruggedization, maintenance, and manufacturing economics at platoon scale; (5) customer references, export approvals, and the status of the claimed Tier 1 defense projects; (6) patent ownership, freedom to operate, and the difference between granted and pending claims; and (7) whether the company can support primes and allies without becoming a bespoke engineering consultancy. The upside is a focused resilient-PNT and human-machine interface layer; the central risk is that procurement buyers choose bundled incumbent systems before TrekAce proves measurable operational advantage.
"""
