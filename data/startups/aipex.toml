name = "AIPEX"
description = "AIPEX Defense Ltd. (also styled AIPHEX) is an active Israeli defense technology company founded in 2024. Public records associate it with radar and missile-interception research and identify founder and CEO Moshik Cohen. A July 2024 seed round is listed with angel investor Raviv Sapir; the amount is undisclosed. Its proposed 2025 VisionWave joint venture was not formed or funded according to a later VisionWave SEC filing, leaving that commercialization path uncertain."
detailed_description = """AIPEX Defense Ltd., also styled AIPHEX, is an Israeli private defense technology company registered in June 2024 and associated with Or Yehuda and Bnei Brak addresses in public records. Startup Nation Finder says it was founded in April 2024 by Moshik Cohen, classifies it in Aerospace, Defense & HLS, and describes its product stage as R&D. A government-data aggregator lists company number 517000220, active status, and a June 19, 2024 founding date. These records support the identity and Israeli connection, but not a detailed public operating footprint; the company has no verified public product website in the materials reviewed.

Public descriptions associate the company with missile interception, advanced radar, and defense technologies. In a July 2025 Globes interview Cohen was described as the company’s CEO and as working on drone and hypersonic-missile interception; the article also described him as a former senior developer on David’s Sling, Barak 8, and Iron Dome. The September 2025 VisionWave announcement attributed Israeli-developed Neuromorphic 4D Radar and Multi-Physics AI, plus confidential defense projects, to AIPHEX. Those are reported descriptions, not independently validated performance claims. No public technical paper, product demonstration, named deployment, certification, or independent test result located in this review substantiates combat validation or comparative performance.

The financing record is narrow but no longer simply an unspecified seed-stage label. Startup Nation Finder reports one seed round in July 2024, amount undisclosed, and names Raviv Sapir as the investor. Finder is a directory rather than a primary financing announcement, and the amount, instrument, closing terms, and any additional participants were not independently confirmed. The amount therefore remains undisclosed; there is no substantiated company-announced lifetime capital total. The record should distinguish that seed financing from any government grant, debt, strategic contribution, or transaction unless separately documented.

The 2025 VisionWave relationship needs a careful status update. A September 3, 2025 joint announcement promoted a Nevada JV between VisionWave, AIPHEX, GBT Tokenize, and GBT Technologies and described a planned 46.76% interest for each of VisionWave and AIPHEX. The announcement called its $5 billion figure an internal equity-allocation framework, not a market valuation, AIPHEX valuation, or contract value. The filed agreement made formation and operation contingent on further steps and provided a twelve-month revenue condition. VisionWave’s later SEC filing says that at December 31, 2025 the JV LLC had not been formed or funded and that VisionWave did not intend to pursue the agreement, although cancellation had not been formalized as of the filing. Accordingly, the announced JV is evidence of a signed strategic agreement and contemplated ownership, but not an operating subsidiary, completed ownership transfer, customer contract, or revenue source. The announced percentages should not be treated as AIPHEX holdings or current cap-table facts.

Commercial traction remains unverified. The reviewed record names no end customer, paid contract, recognized AIPHEX revenue, production deployment, or independently verified pilot. The original JV announcement referred to 11 designated projects in advanced negotiation and 13 background projects under discussion, but did not name the counterparties or contract values; the later filing that reports the JV was not formed weakens any inference that this pipeline converted. Marketing language describing systems as combat-validated should be attributed to the company or its partner, not generalized into an independently confirmed deployment. Headcount is also uncertain: Finder lists a 1–10 range and separately shows an exact count of one, while these are undated directory metrics rather than a current filing. No current staffing or financial statements for the private company were found.

The company’s relevant market includes missile-warning and interception systems, radar and sensor fusion, and autonomy for defense programs. Likely substitutes range from Israeli primes such as Israel Aerospace Industries and Rafael to multinational radar and missile-defense vendors, and specialist autonomy firms. Established contractors possess installed systems, test infrastructure, certification experience, export channels, and procurement relationships. A small venture could differentiate through a specific radar modality, sensing performance in clutter or contested electromagnetic conditions, lower cost, low-latency edge processing, or rapid integration, but public evidence does not currently demonstrate any such advantage. The team’s most concrete public credential is Cohen’s reported senior engineering history; broader leadership, engineering depth, hiring, and manufacturing capability are not established.

Technical diligence should request system architecture, measurable detection and tracking results, false-alarm rates, robustness under jamming and spoofing, latency and power consumption, safety controls, and independent test protocols. For any autonomous interceptor application, reviewers should also establish human authorization boundaries, target discrimination, failure modes, auditability, and compliance with applicable weapons and export-control requirements. The public record does not establish what level of autonomy is implemented, so no stronger claim is warranted.

IP remains a material unknown. The JV agreement contemplated nonexclusive licenses of each party’s background IP for the designated projects and JV ownership of newly developed IP, but the agreement does not identify AIPHEX patents or demonstrate that those licenses were completed. Public patent searches performed by company name and founder name did not yield an attributable portfolio that could be confidently assigned to AIPEX. Confidential projects may limit disclosure, but diligence still needs chain-of-title, inventor assignments, patent schedules, trade-secret controls, and confirmation of rights after the JV’s non-formation and intended abandonment.

The investment and strategic case should therefore be treated as high-risk early-stage optionality. Israel-based defense engineering, Cohen’s reported experience, and hard technical problem areas make the company relevant for further diligence. The counterweight is substantial: seed financing is small-record and undisclosed, the company’s current cash runway is unknown, no direct customer proof is public, and the most visible international commercialization arrangement failed to reach formation by the reporting date. Its defense applicability is explicit; civilian radar and sensing applications are technically conceivable but no civilian product or sales channel has been demonstrated. Priority should depend on new primary evidence of a functioning product, funded programs, customer validation, legal status of the VisionWave agreement, and control of core IP rather than on promotional pipeline or the JV’s internal allocation figure."""
