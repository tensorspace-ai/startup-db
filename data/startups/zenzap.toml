name = "Zenzap"
description = "Israeli-founded enterprise communications and AI workflow startup building a mobile-first work chat platform with shared team agents."
detailed_description = """Zenzap is a privately held Israeli enterprise software company whose product combines mobile-first workplace messaging with shared, no-code AI agents. The current product is branded Zenzap; older legal and app materials identify Loop Connect Ltd. and the app name Loops. The company says it was founded in 2022. Current privacy terms identify Zenzap Ltd., and an Israeli Ministry of Health procurement notice lists Zenzap Ltd. as supplier under Israeli company number 516592680. Reporting places its team across Tel Aviv, the United States and Europe.

The product bundles direct and group chat, voice notes, files, tasks and subtasks, calendars, shift coordination, workspace search and transcription. Its newer product thesis is that agents should sit inside shared conversation threads, where they can use team context and connected business software to carry out recurring work. Company examples include onboarding, shift handovers, schedule swaps, maintenance requests, invoice follow-up and lead routing. Administrators can set access and approval controls. These are product capabilities and company descriptions; they do not establish that each workflow is used in production or that an agent can safely execute every action without human review.

Zenzap targets small and midsize businesses and frontline teams that coordinate through personal messaging apps but may not have adopted Slack or Microsoft Teams. The company publishes figures of 10,500-plus teams, 15,000-plus active agents and 40,000-plus workflows. Those are company-reported usage measures without a disclosed definition, cohort, period or independent audit. TechCrunch reports that Zenzap lists recognizable retail and restaurant brands as customers, but the article does not establish deployment breadth, contract value or renewal status. The Israeli procurement portal separately lists a NIS 1 million Sheba Medical Center engagement for a cloud solution intended to improve care quality and safety, with a stated October 2025 to October 2027 term; that procurement notice is not proof of recognized revenue, payment or clinical outcomes.

The business model is freemium-to-paid SaaS, with paid collaboration and AI capabilities and a separately metered agent/AI usage layer described in October 2026 reporting. Exact current pricing and packaging should be checked at diligence because product tiers change. Zenzap has raised venture financing, with a company-reported cumulative total of $44 million. Its disclosed Seed and Series A record is incomplete: the Seed is reported as $11 million in 2022, while the Series A is reported as either $30 million or $33 million. The difference matters because it changes the implied remainder of the announced cumulative total. No valuation, revenue, ARR, margin, cash, burn or runway figure was found in the reviewed public sources."""
logo = "Unknown"
website = "https://www.zenzap.co"
sector = "Enterprise software; AI; workplace communication"
founded = "2022"
headquarters = "Tel Aviv-Yafo, Israel"
employees = "45 reported by CTech and 50 by TechCrunch in October 2026; no reconciled count"
funding_stage = "Series A reported; amount is conflicting"
entity_type = "startup"
dual_use = false
dual_use_description = """Zenzap's commercial use case is clear: business chat, administrative coordination and AI-assisted workflows for healthcare, retail, hospitality, construction and other distributed teams. These tools could also be used by security-conscious or government organizations, and Lightspeed's investor article says Zenzap has customers in the defense sector. However, that article names no defense customer, contract, deployment, requirement or defense-specific product. General access controls and isolated agent execution are enterprise security features, not evidence of a defense capability. The Sheba Medical Center procurement notice is a civilian healthcare engagement. On the public evidence reviewed, a substantive defense or national-security deployment is not confirmed, so the record does not assign a dual-use designation."""
key_technologies = ["Mobile-first enterprise messaging", "Shared-context AI agents", "No-code workflow automation", "Voice transcription and workspace search", "Role-based administration and agent access controls", "Business software integrations"]
use_cases = ["Frontline and distributed-team communication", "Shift handover and schedule coordination", "Employee onboarding", "Maintenance and task routing", "Invoice follow-up and lead qualification", "Shared AI assistance within team conversations"]
investible = false
investment_rationale = """Zenzap has a coherent wedge: replace informal personal group chats with a work-controlled mobile messenger, then attach shared agents to conversations that already contain operational context. This can reduce adoption friction among workers who will not routinely open a desktop collaboration suite. The founding team combines security, messaging and operating backgrounds; the company has raised institutional venture capital and publicly claims meaningful usage. Its reported customer set spans recognizable multi-location businesses, and the Sheba procurement notice provides a concrete public-sector healthcare signal.

Those positive indicators are not enough to rate the opportunity as investment-ready from public information. The $30 million versus $33 million Series A discrepancy, the older 2024 Seed directory entries, absent pricing/retention cohorts, and undisclosed revenue and unit economics prevent a clean financing and commercial model. Large incumbents can bundle communications, task management and AI, while Connecteam has a broader frontline operations suite. Agent quality, permission boundaries, data handling, and customer willingness to pay for automated actions remain key proof points. The internal investible flag is therefore set to false pending primary diligence; it is a prioritization field, not an investment recommendation."""
strategic_value = """Zenzap's strategic value lies in an enterprise-controlled communication layer for organizations whose work is organized around shifts, sites, patients, customers or jobs rather than software engineering projects. If the product becomes the shared record of operational conversation, it could become a distribution channel for AI agents and integrations, and help organizations move work away from unmanaged personal messaging. A successful mobile experience could also give smaller organizations a lower-friction alternative to deploying a conventional collaboration suite.

The product's long-term value depends on durable permissioning and context management. Shared conversation context is useful to agents, but it also increases the consequences of oversharing, mistaken actions, retention failures and integration compromise. Public claims about isolated execution and approval controls are relevant design signals, but need technical and contractual verification. The company has not disclosed enough about model providers, data processing, customer-controlled retention, audit logs, or the economics of integrations and inference to establish a moat. Strategic importance is plausible; strategic defensibility remains unproven."""
