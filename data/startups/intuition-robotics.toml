name = "Intuition Robotics"
description = "Israeli AI and robotics company behind ElliQ, a proactive digital companion robot that supports older adults with conversation, wellness routines, and social connection at home."
detailed_description = """Intuition Robotics Ltd. develops ElliQ, a tabletop robot and companion tablet for older adults. The company describes its software as a relationship orchestrator that chooses when and how to engage, retains conversational context, and personalizes suggestions around user and care-team goals. Its published interaction modes combine speech, text, imagery, body language, lights, and sounds; prompts include check-ins, health and wellness routines, cognitive and physical activities, and contact with family or caregivers. The company says its engine can work with multiple language models and uses guardrails around LLM-generated content. These are company-described capabilities, not an independently audited technical benchmark.

The product became commercially available in the United States in March 2022. Intuition Robotics has described both household subscriptions and distribution through aging agencies, healthcare organizations, and managed-care relationships. Early direct-to-consumer launch pricing was published as a monthly service, while current terms describe monthly or annual subscriptions and third-party purchase for a user. Public programs complicate the unit economics: a New York State Office for the Aging program has deployed ElliQ to screened older adults with state budget support, and the state comptroller records two $2.1 million grant contracts for ElliQ access and affordable internet. Those award ceilings show funded distribution, not recognized company revenue or a price per device.

The company traces its founding to 2016, although an Israel Innovation Authority profile lists 2015. Its headquarters are in Ramat Gan, with a U.S. base in Palo Alto. The company began with a broader cognitive-agent platform and a Toyota Research Institute in-car collaboration, while its current public-facing business centers on elder care. Kanematsu invested in new shares in 2025 and partnered on a Japanese version of ElliQ targeted for a 2026 launch. No public evidence reviewed indicates a parent company, acquisition, or transfer of the ElliQ product to another owner. ElliQ is a product name, not a company alias."""
logo = "https://woven.vc/wp-content/uploads/2025/10/intuition.svg"
website = "https://www.intuitionrobotics.com/"
sector = "Artificial intelligence, robotics, AgeTech, and digital health"
founded = "2016 (company-announced; Israel Innovation Authority profile lists 2015)"
headquarters = "Ramat Gan, Israel; U.S. base in Palo Alto, California"
employees = "85 reported in February 2020; current headcount not verified"
funding_stage = "Series C (2023); later strategic equity investment (2025)"
entity_type = "startup"
dual_use = false
dual_use_description = """The reviewed product, customer, and government evidence is civilian: conversational companionship, wellness routines, family connection, and support for older adults living at home. The company uses AI, memory, speech, and a moving robot embodiment, but a broad technical capability is not by itself a defense or security use case. Targeted searches found no defense customer, security contract, military adaptation, or operational public-safety role. ElliQ's terms explicitly say it is not an emergency communications service and not a medical device or provider of medical advice. While conversational AI or robotics could be repurposed in other settings, no substantive commercial defense or security applicability is demonstrated here, so dual_use remains false."""
key_technologies = ["Proactive conversational AI agents", "Human-robot interaction", "Multimodal voice, text, gesture, light, and screen interaction", "Personalized context and memory", "Social robot hardware", "LLM integration with company-described guardrails", "Cloud robotics and natural-language processing"]
use_cases = ["Companionship for older adults living independently", "Daily wellness check-ins and activity prompts", "Cognitive and physical activities at home", "Medication and appointment reminders", "Family and caregiver connection", "Agency-funded access to supportive technology", "Historical third-party and automotive companion-agent platform work"]
investible = false
investment_rationale = """The company merits continued diligence because it has crossed from a research prototype into a commercial product, secured repeat public-sector programs, and attracted strategic capital from robotics, automotive, and Japanese trading-company investors. The product's combination of physical presence, proactive interaction, and a recurring subscription or institution-funded deployment model gives it a specific route to market that generic voice assistants do not offer. New York State reported 834 enrolled older adults by May 2025, while a 2026 Washington announcement described eligibility through Medicaid long-term-services programs; these are useful adoption signals, but they do not disclose broad paid conversion or per-user economics.

The public record does not disclose revenue, ARR, gross margin, cash, burn, churn, hardware cost, contract concentration, or the Kanematsu ownership percentage. The most visible outcome statistics are self-reported program results and company claims; they do not establish causality or replacement of human care. The $85 million figure is the company's 2025 cumulative equity-funding statement, not a valuation or an independently reconstructed cap table. The legacy investible flag therefore remains false until operating metrics, privacy controls, financing terms, and independent outcomes are available. This is a diligence status, not an investment recommendation."""
strategic_value = """Intuition Robotics represents an Israeli-developed combination of social robotics, human-robot interaction, AI personalization, and age-focused product design. Its clearest strategic value lies in an increasingly practical care-delivery layer: a device can sustain daily engagement, reinforce routines, connect families, and give aging agencies another channel for reaching people who are difficult to serve frequently in person. The New York contracts and Washington Medicaid access announcement show public systems testing or funding deployment, while Kanematsu provides a route to Japanese localization and distribution.

This value depends on trust, accessibility, safe escalation, and long-lived support rather than on raw model capability alone. The company also has a potentially reusable cognitive-agent platform and a history of automotive work, but no current high-volume non-elder-care business was verified. Its Israeli base and active product engineering offer a relevant civilian technology capability; the evidence does not support attaching a defense thesis."""
potential_score = 70
technology_score = 73
market_score = 74
team_score = 70
dual_use_score = 8
strategic_alignment_score = 66
stage = "mid"
stage_rationale = """Mid-stage is the best fit: ElliQ has been commercially available since 2022, is in repeat state and local aging programs, and the company announced a Series C equity and debt package in 2023 followed by a strategic share investment in 2025. The 2026 Washington Medicaid announcement and 2025 Japanese partnership show distribution expansion, although the Japan launch was a target rather than a completed launch at the latest sourced date. The business is beyond prototype and early beta, but private-company financials, shipment counts, recurring revenue, renewals, and customer concentration remain undisclosed. The current headcount cannot be established from public evidence: the company reported 85 employees in 2020 and an Israel Innovation Authority profile lists 90 without an as-of date. Those old snapshots do not support a present-day size estimate."""
competitors = ["Catalia Health (Mabu)", "Labrador Systems (Retriever)"]
competitive_edge = """ElliQ is differentiated by prioritizing ongoing social interaction and proactive engagement rather than only responding to spoken commands or transporting objects. The company says the device uses goals and context to select a suitable time to initiate conversation and combines speech, text, images, sounds, lights, and physical gestures. Its state-program deployments also connect the robot to aging-agency workflows and, in some settings, caregiver applications. A New York state report describes repeated daily use among screened participants, which is more relevant than a one-time demonstration, although it is not an independent controlled efficacy study.

The adjacent Catalia Health Mabu model has focused on chronic-disease conversations, treatment adherence, and care-team insights, including a Pfizer pilot; Labrador's Retriever is designed to move and retrieve objects for people with mobility limitations. Intuition's advantage is thus relationship-centered engagement, while the competitors address clinical routine support or physical assistance. That edge is not yet a proven moat: user trust and conversational quality must persist after novelty fades, hardware and support costs must fit recurring or grant-funded economics, and privacy-sensitive personalization must remain understandable and controllable."""
risk_factors = [
  "Outcome evidence is mostly company or program-reported and self-reported; without independent comparison, observed loneliness and wellness changes do not prove that ElliQ caused the change or reduces clinical costs.",
  "The company terms state ElliQ is not a medical device, provider, or emergency service. Health prompts and medication reminders still create safety, expectation-management, and escalation risks if a user mistakes the system for clinical care.",
  "The product processes conversation and interaction data, can retain context, and can connect caregivers. Consent, retention, deletion, access control, incident response, and data-use terms across household and publicly funded deployments require diligence.",
  "New York's $2.1 million grant contracts and Washington program access show distribution, but public funding, appropriations, eligibility, procurement, and renewal cycles may make deployments lumpy. Contract ceilings are not evidence of recognized revenue or per-device margin.",
  "A physical subscription product carries manufacturing, delivery, installation, returns, repairs, connectivity, and customer-support costs. No unit economics, renewal rate, hardware life, or support burden were publicly disclosed.",
  "The company depends on an emotionally credible interaction style and older-adult usability. Poor speech recognition, confusing prompts, over-personification, or model errors could erode trust faster in a home-care context than in a low-stakes consumer gadget.",
  "The reported $85 million cumulative equity total does not reveal valuation, dilution, remaining debt, cap-table concentration, or the terms and percentage of Kanematsu's stake. The 2023 announcement grouped venture debt and venture capital in one financing package.",
  "A company patent announcement and public patent records show IP activity, but they do not establish portfolio breadth, freedom to operate, enforceability, or ownership of all software and model components. One patent record includes a lender security-interest history that merits assignment-chain review."
]
risk_level = "high"
signals = ["Commercial availability announced in March 2022", "New York State comptroller records two $2.1 million ElliQ access grant contracts", "Kanematsu invested through new shares and announced a Japan launch target for 2026", "Washington announced ElliQ availability to eligible Medicaid long-term-services recipients in 2026", "Company announced its tenth U.S. patent in October 2024"]
priority_rank = 0
priority_rationale = """No priority rank is assigned at this time. The company has unusually concrete deployment evidence for a companion-robot startup, but missing revenue, renewal, margin, cap-table, and independent-outcome data prevents a sound comparison with other private Israeli companies. Revisit after disclosure of paid versus subsidized placements, the Kanematsu ownership terms, user retention, and evidence that the device improves outcomes beyond short-term self-report."""
