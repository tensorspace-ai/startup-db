name = "Reco"
description = "Reco is a privately held cybersecurity company that discovers, maps, and governs SaaS applications, identities, integrations, and AI agents across enterprise environments. Its platform combines dynamic SaaS security, posture management, identity and permission analysis, data-exposure context, and threat detection for the growing AI-enabled SaaS attack surface."
detailed_description = """
Reco is building a control plane for the security problems created when enterprise work moves through hundreds or thousands of SaaS applications. Its platform continuously discovers sanctioned and shadow applications, third-party connections, human and machine identities, permissions, and AI-driven activity. Reco describes an agentless, read-only monitoring architecture for SaaS applications, with automated enforcement and remediation workflows available to security teams. The important technical asset is not simply an application inventory: the company models relationships among applications, identities, permissions, data access, and actions in a SaaS ecosystem graph. That context can help distinguish an unused low-risk integration from an overprivileged connection that can move sensitive data across multiple systems.

The product scope has expanded from SaaS Security Posture Management into dynamic SaaS security and AI agent security. Current company materials describe AI agents that monitor SaaS environments, investigate or summarize alerts, and support response, alongside an App Factory for adding integrations and a Knowledge Graph for representing application and agent relationships. Reco reports more than 215 supported applications in its February 2026 funding announcement, while its current LinkedIn profile advertises 235+ integrations and 1,000+ detection controls; these are company-reported coverage figures rather than independently audited measurements. The March 2026 AI Agent Security launch specifically targets agents embedded in or connected to tools such as Copilot, ChatGPT, Salesforce Agentforce, Make, and n8n, where non-human identities can inherit broad access and trigger actions without a conventional interactive user.

The primary customer is an enterprise security, identity, IT, or governance team that needs continuous visibility into SaaS sprawl without deploying software into every application. Reco's commercial case is strongest in regulated or complex organizations where security teams must reconcile business enablement with least privilege, auditability, and rapid investigation. Its 2025 funding announcement reported fivefold ARR growth, a threefold increase in customers, and adoption across financial services, insurance, healthcare, pharma, and technology; its 2026 Series B announcement said it works with multiple Fortune 500 companies and global enterprises. Those are company-reported traction signals, not a substitute for diligence on retention, expansion, gross margin, deployment counts, or customer concentration. The 2026 round, led by Zeev Ventures with participation from existing and new investors, brings reported total funding to $85 million and gives Reco resources to expand engineering, product, and go-to-market operations.

Competition is broad and comes from specialist SSPM and SaaS security vendors such as Adaptive Shield and Wing Security, identity and SaaS governance products such as Valence Security and BetterCloud, and bundled platforms from Microsoft and larger security vendors. Reco's claimed differentiation is the combination of dynamic discovery, contextual risk prioritization, threat detection, and AI-agent governance rather than a static configuration checklist. That advantage depends on connector breadth, rapid support for new SaaS and AI services, high-quality relationship modeling, and remediation that customers trust. The company states that its App Factory can add integrations in days, but the durability and economics of that process need verification.

The national-security and defense relevance is credible but indirect. Defense organizations, intelligence programs, critical-infrastructure operators, and contractors increasingly depend on cloud identity, collaboration, workflow automation, and AI tools, so unmanaged integrations and overprivileged agents can create data-exfiltration, supply-chain, and insider-risk pathways. Reco could provide visibility and policy control in those environments, especially where a read-only deployment is operationally attractive. Nothing in the reviewed public materials establishes defense contracts, classified-environment deployment, or government accreditation. Strategic diligence should therefore test tenant isolation, data residency, deployment models, privileged-access controls, integration failure behavior, detection quality, and whether the product can operate under restricted connectivity or procurement requirements.
"""
