name = "CarbonBlue"
description = "Israeli industrial-climate startup developing EcoLime, a patented, fully electrified lime-production process that can use low-quality calcium-bearing waste feedstocks, alongside water-integrated carbon-removal applications. Its commercial thesis is to decarbonize lime-intensive value chains while creating circular-material and water-infrastructure benefits."
detailed_description = """
CarbonBlue is an Israeli industrial-climate company founded in 2022. Its current public positioning centers on EcoLime, a patented chemical process for producing high-quality lime at ambient temperatures with electricity rather than the combustion-heavy kilns used in conventional lime production. The process is designed to accept diverse calcium-bearing inputs, including steel slag, quarry fines, construction and demolition waste, and other low-quality feedstocks. That combination matters because lime is a basic input for steel purification, pulp and paper, water treatment, construction materials, and other industrial chains, but conventional production is energy intensive and exposes operators to fuel costs, process emissions, and concentrated supply chains.

The company also retains a water-based carbon-removal platform, described in public materials as AquaFix or direct water capture. The approach removes dissolved inorganic carbon from water and mineralizes it as calcium carbonate; in desalination applications, the company says this can improve recovery, reduce membrane-maintenance pressure, and leave water able to reabsorb atmospheric CO2. CarbonBlue’s Project Midway page reports a continuously operating integration at the Ma'agan Michael desalination facility, deployed in May 2025, with a first phase processing 15 cubic metres per hour and a stated 40-tonnes-per-year CO2-removal capacity. Those are company-reported operating figures and should be validated independently through engineering data, mass balances, monitoring methodology, and third-party verification before being treated as bankable carbon-removal performance.

The customer and market opportunity is therefore broader than voluntary carbon credits. EcoLime can be sold into industrial processes that already purchase lime or manage calcium-rich waste, including steel, pulp and paper, precipitated calcium carbonate, and construction-material operations. The economic proposition may combine lower-emission lime, avoided waste handling, shorter material supply chains, and reduced dependence on fossil-fuel kilns. The water-integrated route targets desalination and other water-utilizing facilities where carbon removal could be bundled with operational co-benefits. Israel's Innovation Authority identifies CO2-consuming industries such as e-fuels and food and beverage as target customers for the water-based process. The company has also publicly discussed agreements and expansion beyond Israel, but the scale, revenue quality, and status of those commercial relationships remain diligence questions.

CarbonBlue has stronger commercialization evidence than an idea-stage climate venture: public records identify a 2024 seed financing round, the Innovation Authority classifies the company at initial revenues, and the company reports a continuous industrial desalination deployment. Its public team and company profiles indicate a small organization of roughly 15 to 20 people, which is consistent with an early industrial scale-up rather than a mature operator. The main competitive challenge is not only proving chemistry; it is delivering reliable uptime, predictable product quality, permitting, feedstock logistics, power economics, and integration with conservative industrial sites. Competing approaches include conventional lime suppliers, electrified cement and lime processes, mineralization and ocean/water carbon-removal companies, and customer-side recycling or process-efficiency projects.

For national-security analysis, CarbonBlue should not be treated as a defense technology or as having demonstrated military customers. Its relevance is indirect but credible: electrifying a basic industrial process can reduce exposure to imported fuels, while using local waste streams can improve material resilience; integrating with desalination can improve the efficiency and environmental performance of critical water assets. Those properties may matter to infrastructure continuity and strategic autonomy in energy- or water-constrained environments. They do not by themselves establish a substantive defense application. The important diligence questions are whether the process remains efficient at commercial throughput, whether claimed carbon removal is durable and measurable, whether waste-derived lime meets customer specifications, whether patents provide defensible freedom to operate, and whether the company can finance and execute repeatable industrial deployments.
"""
