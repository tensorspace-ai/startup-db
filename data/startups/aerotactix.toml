name = "AeroTactiX"
description = "AeroTactiX was an Israeli developer and manufacturer of compact mini-UAV systems, including the Skyzer450, autopilots, communications, ground stations, and payload-integration services. Public startup and industry records indicate that it ceased operations in April 2025, so this record describes a historically relevant but currently wound-down company."
detailed_description = """
AeroTactiX developed and manufactured compact mini-UAS rather than selling only an isolated software component. Public Israeli Ministry of Defense material describes the company's air vehicles, autopilots, communications equipment, ground control stations, and customized integration for payloads and other components. The same material identifies the Skyzer450 as a fixed-wing mini-UAS with runway or launcher takeoff, a 21.5 kg maximum takeoff weight, up to 5 kg of payload, and endurance figures of up to five hours with an electric engine or twelve hours with a fuel engine. Those figures are historical product claims, not current performance that can be independently retested.

The historical customer problem was credible: tactical and homeland-security operators need portable aerial sensing, command links, and payloads that work as one field system. The platform could also address perimeter and critical-infrastructure monitoring, energy-site security, search and rescue, and disaster-area mapping, where endurance and broad-area observation can matter more than the convenience of a consumer quadcopter. However, the public record does not establish named customers, recurring revenue, export approvals, production volume, or recent deployments. References to military, homeland-security, and civilian missions should therefore be treated as intended markets and product positioning rather than verified contracts.

The most important current fact is operational status. Startup Nation Central reports that AeroTactiX ceased operations in April 2025, and IVC separately lists it as having ceased to operate in Q2 2025. A company-registry aggregator still showed the Israeli legal entity as active in records updated through 2024, but that is not evidence of ongoing commercial activity and may reflect filing lag or a distinction between legal status and operations. The former aerotactix.com domain is not a usable canonical company website in the current check, and no replacement official site was identified. This record should consequently not imply that products, support, inventory, or intellectual property are currently available.

When it operated, AeroTactiX competed in a difficult segment against larger defense primes, established Israeli UAS suppliers, autonomy-focused startups, and lower-cost commercial drone ecosystems. A small supplier could win through compact fixed-wing endurance, low operator burden, tailored payload integration, or a complete air vehicle-to-ground-station package, but the public evidence does not demonstrate a durable moat, proprietary autonomy, manufacturing scale, or a defensible installed base. The cessation of operations is itself evidence that the historical product thesis did not translate into a currently operating standalone business, even though the underlying technology category remains attractive.

The defense and national-security relevance is substantive but historical. A mini-UAS stack combining airframe, datalink, flight control, ground control, and payload integration is inherently useful for reconnaissance, border observation, security, and emergency response. It can reduce integration friction for small teams and provide distributed sensing without a large aircraft or permanent infrastructure. That makes the technology dual-use and strategically aligned with unmanned-systems analysis; it does not establish that AeroTactiX delivered operational capability to a particular military or government customer. Any diligence effort would need to determine whether assets, designs, personnel, certifications, or customer relationships survived the wind-down and whether another entity acquired or commercialized them.
"""
