name = "SeaCrop"
description = "SeaCrop is an Israeli food and marine-biotechnology startup developing charged-fiber systems to harvest naturally occurring phytoplankton from seawater for aquafeed and, potentially, other nutrition markets. Its commercial thesis is to turn an abundant but difficult-to-collect marine biomass into a lower-energy protein input; field validation has been reported, while feed trials, industrial output, and customer contracts remain ahead."
detailed_description = """
**Product and the concrete problem it solves.** SeaCrop is trying to make an existing ocean resource usable as a predictable ingredient. Phytoplankton are microscopic, widely dispersed in large water volumes, and potentially rich in protein, amino acids, omega-3 fatty acids, and micronutrients. Their abundance has not translated into commodity supply because conventional fine filtration pushes large volumes of water through restrictive media, consuming energy and fouling or damaging the collected material. SeaCrop’s first target is aquafeed, where fishmeal and fish oil supply important nutrients but are tied to wild-fish harvest and exposed to ecological limits and commodity-price swings. It describes a process that captures the biomass in seawater, washes and centrifuges the particulate matter, and dries it to an algal powder. That is a production pathway, not yet a commercial product: public reporting says the company was still raising capital and preparing feed trials in late 2025. Human nutrition and livestock feed appear on the company’s current website as longer-horizon applications; the disclosed near-term wedge is aquafeed, particularly salmon and shrimp diets.

**Core technology and how it actually works.** SeaCrop’s central mechanism is a curtain of functionalized, positively charged fibers. The company’s explanation is that naturally negatively charged phytoplankton adhere to the fiber surfaces as seawater passes through, allowing capture through surface interaction rather than a fine physical barrier. The company says this can reduce the pumping and pressure demands of conventional filtration and allow water to keep flowing. After collection, the material is washed, centrifuged, and dried; the company has also described impurity removal as part of its processing route. The technological questions are consequential and measurable: capture rate across changing species and seasons, fiber lifetime and fouling, throughput per unit of deployed surface, biomass composition, cleaning and drying energy, and the cost and yield of removing contaminants. The Fish Site reported that SeaCrop had run laboratory work and marine field trials, and that a GMP-certified external laboratory found lead below regulatory thresholds after its impurity-removal process. Those are encouraging but company-attributed milestones rather than a peer-reviewed performance dataset. Hatch Blue calls the technology patented, but the public portfolio page gives no patent number, jurisdiction, claims, or remaining term.

**Market, customers, and go-to-market.** The clearest initial buyer is an aquafeed producer seeking traceable protein and nutrient inputs that can supplement or displace some fishmeal. SeaCrop’s sequencing is commercially sensible: establish consistent biomass, run formulation and feeding trials with prospective feed makers, demonstrate animal performance and palatability, and only then pursue volume supply agreements. In November 2025, The Fish Site reported that an aquaculture nutritionist had modeled a potential 6–6.5% inclusion level in certain feed formulations and that salmon or shrimp were the likely first trial segments. That estimate is not a completed feeding trial, a customer commitment, or proof of price competitiveness. The article also said SeaCrop needed to produce roughly 50–60 kilograms of algae for test diets and was seeking to raise $10 million after initially seeking $2 million. No named aquafeed customer, paid order, production plant, recurring revenue, or current round close has been disclosed in the sources reviewed. The company’s website cites a Hatch Blue market assessment for a large salmon-and-shrimp feed opportunity; its market-size figures are company-presented and should be checked against actual inclusion, price, and obtainable-volume assumptions.

**Traction, financing, and third-party validation.** The public evidence describes a technically active but pre-commercial company. The Israeli National Center of Blue Economy reports that SeaCrop conducted harvesting and processing experiments in Greece’s Gulf of Elefsina in late 2023, with support from Professor Dionysios Raitsos of the University of Athens, and sent collected material back to Israel for further work. The Fish Site’s 2025 interview adds that later sea trials showed phytoplankton removal and that independent laboratory analysis assessed amino-acid composition and lead reduction. These checks address collection and ingredient quality, but do not establish safe, effective performance in full aquafeed diets over a production cycle. In July 2025 SeaCrop joined Hatch Blue’s CREST accelerator cohort. Hatch Blue lists the company in its portfolio and describes its technology as patented; separate reporting states the program invested a combined $575,000 across seven participating ocean startups, without publishing SeaCrop’s individual allocation. Startup Nation Finder records a small Hatch Blue-linked financing entry, but public funding totals and round descriptions are not fully consistent across profiles. The defensible account is accelerator participation and fundraising, with amount raised by SeaCrop not confidently established from the available sources. No revenue, patent particulars, commercial plant capacity, or customer contract value is public.

**Founders and team.** Public profiles consistently identify Arik Pinto as SeaCrop’s CEO and a co-founder. The company’s LinkedIn page lists Pinto and Itai Katz among its two displayed employees and presents Katz as CTO; the Israel Innovation Authority’s blue-economy center describes Pinto as the founder, while Startup Nation Finder lists three co-founders: Pinto, Shahar Noked, and Itai Katz. IVC identifies Pinto as CEO and co-founder and Katzir as CTO, using a spelling variant for the technical leader. The sources therefore support naming Pinto and the technical leadership, but leave the full founding roster and current team size somewhat inconsistent. IVC lists Pinto’s prior role as EMEA sales director at empow, which is relevant to customer development but is not evidence of aquafeed manufacturing experience. The small public team footprint makes partnerships with marine scientists, aquaculture nutritionists, process engineers, and feed manufacturers particularly important. The University of Athens fieldwork support and Hatch Blue’s specialist accelerator provide outside expertise and ecosystem access, but do not replace an experienced operating team capable of equipment engineering, food safety, regulatory approvals, and industrial scale-up.

**Competitive dynamics.** SeaCrop competes for feed formulation share against established ingredients and several alternative-protein pathways. (1) **Conventional fishmeal and fish oil** are the familiar performance benchmarks, with incumbent supply chains and buyer qualification but exposure to wild-fish availability and price volatility. (2) **Veramaris** produces algal omega-3 oils through fermentation, addressing fish-oil replacement with a controlled production route. (3) **Corbion** supplies algae-derived omega-3 ingredients and other aquaculture nutrition inputs. (4) **Calysta** develops FeedKind microbial protein through fermentation, competing for sustainable protein inclusion in animal and aquaculture feed. (5) **KnipBio** develops microbial protein ingredients for aquaculture and animal feed. (6) Soy protein concentrate and other plant-based feed ingredients remain low-cost, scaled substitutes, even where their amino-acid profile or marine-feed fit differs. SeaCrop’s potential edge is access to wild biomass without building photobioreactor capacity or feeding a fermentation process, paired with a capture mechanism intended to use low pressure. That edge only matters if capture remains selective and reliable, the biomass can be safely standardized, and delivered cost competes with scaled ingredients. Competitors’ mature plants, validated feed performance, and purchasing relationships currently outweigh SeaCrop’s unproven scale advantage.

**Security and resilience relevance.** SeaCrop’s dual-use case is food-system resilience, not a demonstrated defense capability. If its process can reliably turn local marine biomass into a safe, nutritionally useful feed ingredient, it could diversify aquaculture supply away from imported soy and some wild-caught fish inputs, supporting continuity for food production during commodity shocks or transport disruption. Harvesting in or near regions with aquaculture capacity could also reduce reliance on freshwater and arable land, although the company’s zero-freshwater and current-powered descriptions are company claims that require engineering and life-cycle verification. These features give the technology a credible civil-resilience pathway: more diverse feed ingredients can help maintain farmed seafood production when conventional inputs become expensive or constrained. Harvesting wild phytoplankton also creates ecological and licensing obligations. Collection must avoid disrupting food webs, harming protected species, or concentrating pollutants; the company’s proposed work in eutrophic areas needs site-specific ecological monitoring and regulator approval. No military, government-procurement, emergency-ration, or defense customer is disclosed. Any security relevance should therefore be scored through potential food and supply-chain resilience, not counted as a fielded national-security deployment.

**Stage, trajectory, and diligence risks.** SeaCrop is early-stage: it has a defined capture mechanism, laboratory work, reported sea trials, external ingredient analyses, and accelerator participation, but the sources still describe funding needs and forthcoming feed trials rather than scaled commercial deliveries. Its next value inflection points are reproducible capture and energy data across seasons, successful salmon or shrimp feeding trials, an independently verified contaminant and nutritional specification, a pilot system with disclosed throughput and operating costs, and a named commercial partner or offtake agreement. Key diligence risks include (1) ecological effects and permits for harvesting wild plankton; (2) inconsistent species mix and nutrient content by location and season; (3) capture efficiency, fouling, cleaning, and fiber replacement under continuous marine operation; (4) downstream dewatering, drying, transport, and total delivered-cost economics; (5) heavy-metal, toxin, pathogen, and other contaminant monitoring at commercial scale; (6) long aquafeed qualification cycles and the gap between modeled inclusion rates and validated feeding outcomes; and (7) capital needs, funding close uncertainty, and limited public evidence about the team’s manufacturing capacity. The company’s prospect is strategically interesting because a credible feed ingredient could diversify a food supply chain, but the investment case depends on process economics and ecological performance that remain to be demonstrated at scale.
"""
