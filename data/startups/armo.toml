name = "ARMO"
description = "ARMO builds cloud runtime security software for Kubernetes and cloud-native applications. Its ARMO Platform combines runtime behavior, Kubernetes and cloud context, vulnerability reachability, posture management, and response; Kubescape is its open-source project and the foundation of its product-led adoption."
detailed_description = """ARMO is the product company operated by Cyber Armor Ltd., an Israeli private company incorporated in 2017 and based in Tel Aviv. It sells cloud-native security software to organizations running Kubernetes and related workloads. The operating company has an identifiable product, leadership team, public customer references, a CNCF project, and a recently announced strategic partnership with Rapid7. The latest public equity financing located in this review is its April 2022 Series A; later capital activity, commercial scale, and ownership terms are not publicly reconciled.

The product thesis is to connect static cloud and Kubernetes findings to observed application behavior. ARMO Platform uses eBPF runtime sensing to record application activity and enriches that profile with Kubernetes events, cloud configuration, container, and CI/CD context. It applies the context to behavioral detection and response, runtime vulnerability prioritization, posture management, policy hardening, and remediation workflows. The technical proposition is useful where security teams need to know whether a vulnerable package is loaded, whether a risky identity or configuration is exposed, and what a running workload actually did. The important proof question is whether this correlation makes incidents and remediation measurably better at acceptable sensor overhead, coverage, and false-positive rates.

Kubescape is ARMO's open-source Kubernetes security project. The CNCF identifies its coverage across clusters, manifests, repositories, registries, and images, and records that it moved to Incubating in January 2025. That neutral foundation supports developer discovery and community contribution, while the commercial ARMO Platform adds a managed interface, broader runtime and cloud context, workflows, and deployment choices. The division creates a plausible adoption funnel, but open-source use is not evidence of paid conversion, retention, or expansion. ARMO's current homepage advertises more than 40,000 companies, 100,000 deployments, and 15 million monthly scans; these are company-published usage figures with no independent methodology or paid-user split located here.

The commercial evidence is more concrete than usage counts but remains qualitative. ARMO announced that Orange Business selected its platform for an on-premises Managed Kubernetes Service and its own managed clusters. ARMO's case study says Orange offers it as the default security option to service customers, a potentially useful channel route whose downstream deployment count and contract terms are undisclosed. A 2026 ARMO case study for Alter Domus reports fewer daily alerts and a large reduction in vulnerability backlog, but those performance figures are vendor-published and should be validated with the customer and deployment data. In January 2026, Rapid7 announced a strategic partnership to place ARMO-derived cloud runtime security in the Rapid7 Command Platform; Rapid7 described the offering as beta at announcement. This creates a credible enterprise distribution path, but the release does not disclose revenue share, production availability, customer adoption, or contract economics.

ARMO now positions runtime behavioral detection as Cloud Application Detection and Response and has begun applying the same workload telemetry thesis to AI and agent workloads. The extension is technically coherent: Kubernetes-hosted agents inherit identities, permissions, network access, and software dependencies, and runtime observation can help distinguish expected behavior from suspicious sequences. The claims remain product positioning rather than independently verified AI-specific efficacy. Buyers should test coverage across supported kernels and distributions, the stability of baselines during deployment changes, response safety, and the quality of evidence preserved for investigation.

Competition is direct and substantial. Palo Alto Networks Prisma Cloud, Wiz, Aqua Security, and Sysdig sell overlapping combinations of Kubernetes posture, workload vulnerability, runtime detection, and cloud risk context. Falco and cloud-provider controls are lower-cost substitutes for parts of the feature set. ARMO's strongest differentiation is focus: a Kubernetes-native workflow, an open-source entry point through Kubescape, runtime reachability and behavioral context, and self-hosted or air-gapped deployment options. Its narrower footprint can help a buyer that needs Kubernetes depth or sovereign deployment; it can also be a disadvantage against vendors that bundle security across code, cloud, identity, data, and incident response. ARMO's own materials and customer stories do not establish independent competitive win rates or detection benchmarks.

The founding group combines commercial and security experience. Current company materials identify Shauli Rozen as CEO and Ben Hirschberg as CTO; the original company financing release also names Leonid Sandler as a co-founder, and the current company page lists him on the board. Rozen's documented background spans engineering, a Wharton MBA, consulting, product strategy at Amdocs, and senior roles at Optimove. Hirschberg and Sandler previously worked on security and video technology at NDS, while the company credits Hirschberg with technical leadership of Kubescape. The company's current public team page names its operating leaders and board, but no reliable current headcount or detailed track record for every executive was found.

Two US patent grants assigned to Cyber Armor Ltd. were identified: one for verifying runtime integrity and one for generating disposable software modules to protect cryptographic material. These filings show prior technical work in software and runtime protection, but the available evidence does not map either patent to the present Kubescape-based platform or establish a broad proprietary moat. The more visible current defensibility is the combination of product execution, integrations, deployment experience, and community trust.

The investment case therefore rests on proof of conversion and distribution, not on an assumed category winner. ARMO announced a Seed and a Series A; SecurityWeek reported $34.5 million raised to date after the Series A, but the company announcements reviewed do not state a lifetime total. No later round, dated revenue or ARR, profitability, burn, runway, paid-customer count, or customer concentration was located. A commercial directory lists share-allotment filings in late 2025 and 2026 but does not establish whether they brought in capital. This leaves a meaningful gap between a Series A-era funding snapshot and the current business. The product category has real demand, yet the company must show that Kubescape adoption converts into recurring enterprise revenue and that Rapid7 and service-provider routes produce scalable deployments.

ARMO has substantive defensive dual-use applicability because containerized government, critical-infrastructure, and mission-support applications face the same runtime, configuration, vulnerability, and identity risks as commercial workloads. On-premises and air-gapped deployment support is relevant to isolated or sovereignty-constrained environments. Public evidence reviewed here does not identify a defense or government contract, authorization, accreditation, or operational military deployment, so the dual-use case is a technical fit hypothesis rather than proof of procurement."""
