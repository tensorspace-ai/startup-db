name = "Aorato"
description = "Aorato was an Israeli cybersecurity startup that used machine learning and an Organizational Security Graph to detect anomalous behavior around Windows Server Active Directory. Microsoft acquired the company in 2014, and its technology became part of Microsoft's identity-threat-detection product lineage rather than an independent business."
detailed_description = "Aorato developed identity-centric threat detection for enterprise Windows environments. Its best-documented product concept, the Directory Services Application Firewall, monitored activity around Active Directory and built a continuously updated Organizational Security Graph of users, machines, and access relationships. Microsoft described the approach as learning normal behavior and identifying suspicious activity, giving security teams visibility into attacks that use valid credentials or move inside the network after bypassing perimeter controls. This was a meaningful technical choice: Active Directory is a control plane for enterprise access, so behavioral signals around it can expose compromised accounts, privilege abuse, reconnaissance, and lateral movement that signature-oriented controls may miss.\n\nThe target market was enterprise security teams operating on-premises or hybrid Windows estates. Aorato's value proposition was strongest where directory infrastructure was large, interconnected, and difficult to model manually. It addressed a concrete operational gap between identity and security operations by correlating identity, device, network, and event context rather than treating authentication as an isolated log event. Public evidence supports a released product and venture backing, but does not establish a durable independent customer base, recurring revenue scale, retention, or post-launch market share. Those unknowns matter because anomaly detection products depend heavily on telemetry access, deployment quality, analyst workflow, and the ability to demonstrate fewer missed attacks without overwhelming teams with false positives.\n\nMicrosoft announced the acquisition on November 13, 2014 and said Aorato's technology and team would strengthen identity and access protection across on-premises and cloud environments. Microsoft subsequently used the acquired methodology in Advanced Threat Analytics, later part of the broader Microsoft identity-security portfolio. The acquisition is credible commercialization and strategic-validation evidence, but it also ends the case for evaluating Aorato as a live standalone venture. Current diligence should therefore distinguish the historical Aorato asset from Microsoft's later product engineering, distribution, telemetry, and roadmap decisions. The former aorato.com domain no longer resolves, and no current independent company operation is evidenced.\n\nThe national-security relevance is substantive but technology-based rather than contract-based. Government, defense, and critical-infrastructure networks commonly depend on directory services and privileged identities, making detection of credential theft and internal movement strategically important. The same capability can support cyber defense in those environments without requiring a defense-specific product thesis. However, this record contains no verified evidence of classified deployments, government contracts, or military customers. Aorato is therefore best treated as a historical Israeli cyber acquisition and a reference point for identity-threat-detection architecture, not as evidence of current defense traction or an investable company."
