name = "STATE16"
description = "STATE16 is an Israeli Physical AI company building a deterministic runtime-integrity and authorization layer that evaluates black-box world-model and vision-language-action outputs before they become physical actions. Its platform is intended to help robotics, drone, autonomous-vehicle, and industrial-automation teams detect unsafe states, enforce operational constraints, and produce auditable evidence for deployment and safety review."
detailed_description = """
**Product and the concrete problem it solves.** STATE16 is aimed at the gap between an autonomous system that can produce an impressive action in a demo and one that can be trusted to act repeatedly in a physical environment. New world models and vision-language-action policies can map camera observations and instructions to continuous behavior, but they are probabilistic systems that may be confidently wrong when a sensor is blinded, a scene shifts outside the training distribution, latency changes, or a proposed motion violates the robot's actual kinematics. STATE16's product is a software assurance and enforcement layer placed around that black-box policy. The company says it evaluates and constrains proposed actions before they become physical commitments, rather than allowing the same model that proposes an action to be the sole authority deciding whether the action is admissible. The practical buyer problem is consequential: robotics and autonomy teams need to move from curated demonstrations to repeatable deployment without rebuilding a separate safety stack for every model, embodiment, and site. A deterministic supervisor that can reject, modify, or safely degrade an action could reduce the engineering burden of certifying AI-driven machines and make heterogeneous fleets easier to operate. STATE16 currently names industrial manipulators, unmanned aerial vehicles, autonomous fleets and robotaxis as supported platform categories, while Israel Robotics Hub also lists logistics, aerial, mobile, underwater, and space robotics domains.

**Core technology and how it actually works.** The public technical description is specific enough to distinguish STATE16 from a generic robotics simulator, although implementation details and independent benchmarks remain undisclosed. The official site describes a mathematical, physics-aware envelope around a world model, with unsafe commands intercepted before actuation and graceful degradation to verified physics-based dead reckoning. It identifies multi-horizon spectral consistency as a predictive-monitoring method intended to detect instability before it becomes physical error, and vision-inertial cross-consistency as a way to identify unsafe trust conditions such as camera blinding or sensor drift. The platform also exposes an API-driven configuration layer for spatial geofences, regulatory limits, and business logic, so the same constraints can be carried from simulation into edge deployment. A LinkedIn update describes STATE16 Simulator v1 as generating controlled scenarios, injecting disturbances, and observing how VLA systems and world models respond under operational constraints. In architecture terms, the policy proposes an action, the assurance layer checks it against sensor agreement, dynamics, kinematics, spatial rules, and mission constraints, and the system either permits the action or transitions to a bounded fallback. That is materially different from relying only on offline model scores or fixed threshold alarms. The central technical diligence issue is whether the company's spectral and cross-consistency methods work across real sensors, platforms, and failure modes without adding unacceptable latency or producing so many false positives that operators bypass the layer.

**Market, customers, and go-to-market.** STATE16 is selling into the infrastructure layer required as physical AI moves from research and demonstration into regulated or safety-sensitive operations. The natural users are autonomy engineering teams, robot OEMs, system integrators, validation groups, and safety or compliance organizations that must evaluate a policy before deployment and monitor it after deployment. The software is positioned as vendor- and embodiment-agnostic, which could let a customer compare several models on the same hardware and preserve an assurance layer while the underlying policy changes. The first target environments named publicly include industrial logistics, autonomous vehicles, UAVs, industrial manipulators, and other robotics fleets. This gives the company a broad market, but it also creates a focus risk: an early team may need to build separate adapters, constraint libraries, simulation assets, and validation evidence for each domain. STATE16's current commercial signal is a private-beta motion. Its official website says it is onboarding select design partners, and the company's own article says it is engaging robotics, autonomous-vehicle, and industrial-logistics partners on early-access deployments and proofs of concept. No named customer, paid deployment, contract value, recurring revenue, channel partner, or production integration was identified in the reviewed public sources. The likely go-to-market is founder-led technical selling through a design partner, followed by an SDK or edge-runtime license with enterprise support and validation services. A credible wedge would be a customer that already has an autonomy stack but cannot produce the deterministic evidence, runtime controls, and failure logs needed for a safety review.

**Traction, funding, and third-party validation.** STATE16 is verifiable as an active company, but public traction remains at the research, recruiting, and early-access stage. Israel Robotics Hub lists STATE16 as an active Tel Aviv company founded in 2026 with a 2-10-person team and a Physical AI infrastructure focus. Its official website presents a product video, a defined feature set, supported platforms, and a request for early access rather than a vague concept page. The company has also published two substantial technical essays, one describing the runtime guardrail thesis and another framing Physical AI as a systems-integration problem involving perception, world representation, planning, control, safety supervision, telemetry, and retraining. Its LinkedIn company page identifies the business as privately held, repeats the runtime-safety and authorization positioning, and reports a simulator release that generates scenarios, injects disturbances, and observes autonomous responses. The founder's public profile links STATE16 to a Hugging Face organization with two papers or technical artifacts on predicted dynamics and runtime action authorization, which provides a visible research trail but is not the same as peer-reviewed product validation. No closed financing round, institutional investor, grant amount, valuation, customer reference, certification, benchmark result, or patent assigned to STATE16 was confirmed. A prior Israel Innovation Authority grant visible on the founder's profile concerns a Physical AI guardrails project, but the public evidence does not establish the grant's legal recipient, amount, or whether it maps directly to the current company. The appropriate conclusion is an unusually clear early product and research signal, not commercial proof.

**Founders and team background.** The public record identifies Dr. Barak Or as STATE16's founder and CEO. His background is unusually relevant to the technical problem: his public professional profile describes Technion training in aerospace engineering, economics and management, and graduate research in integrated guidance and estimation, linear-quadratic differential games, and navigation systems. His listed publications include work on missile-guidance disturbance attenuation, Kalman filtering, inertial and Doppler-velocity-log fusion for autonomous underwater vehicles, and machine-learning-based localization. His biography also describes him as an AI researcher and lecturer specializing in Physical AI, autonomous systems, runtime integrity, and AI navigation. That combination supports a credible founder-problem fit because runtime assurance requires more than machine-learning familiarity: it needs reasoning about dynamics, uncertainty, state estimation, constraints, and the consequences of an incorrect action. It also explains why STATE16 emphasizes physics-aware envelopes, sensor consistency, and dead-reckoning fallbacks rather than an AI-only safety classifier. The team remains a material unknown. Israel Robotics Hub and LinkedIn support a 2-10-person range, but the company does not publicly identify a broader executive bench, senior safety-certification specialist, commercial lead, or field-deployment organization. The founder's prior ventures and research can provide technical leverage, but they do not establish that STATE16 has enough engineering capacity to support multiple robotics domains. Diligence should verify the current team, ownership of the core methods, operational experience with production robot stacks, and the ability to translate research into low-latency, testable edge software.

**Competitive dynamics.** STATE16 competes across several adjacent layers because runtime integrity is not yet a settled product category. Applied Intuition offers simulation, validation, and operational tooling for autonomous vehicles and other physical systems, giving it substantial customer access and capital. Foretellix, an Israeli autonomy-verification company, focuses on measurable safety and scenario-based validation for automated driving, which overlaps with pre-deployment evidence even if STATE16 aims more directly at runtime action authorization. Cognata provides Israeli simulation and synthetic-data infrastructure for autonomous systems, while Parallel Domain competes in high-fidelity simulation and scenario generation. NVIDIA's Isaac, Cosmos, and newer robotics-safety tooling can bundle simulation, model evaluation, edge compute, and OEM relationships into a platform-level alternative. Apex.AI competes from the safety-oriented autonomous-mobility middleware layer, and Karamba Security is an Israeli adjacent competitor in runtime protection and integrity for cyber-physical software. The incumbent substitute is still internal engineering: a robotics OEM can combine collision checking, geofencing, sensor-health rules, emergency stops, and test infrastructure in a bespoke stack that is costly but familiar. STATE16's possible edge is the combination of model-agnostic authorization, predictive spectral monitoring, explicit physics and sensor cross-checks, API-configured operational policies, and a path from controlled simulation to edge runtime. None of those claims is yet a durable moat. Competitors have more data, installed systems, certification relationships, and distribution, and a large autonomy platform could reproduce a useful subset of runtime guards once customers demand them. The key proof is not a compelling taxonomy; it is independent evidence of lower incident risk, fewer false alarms, faster validation, and reliable behavior across heterogeneous hardware.

**Defense, security, and resilience dual-use relevance.** STATE16 has credible dual-use relevance because its core function is to keep autonomous physical systems inside a verifiable operating envelope, and the same failure modes appear in commercial robotics, defense autonomy, and critical-infrastructure systems. A drone, unmanned ground vehicle, maritime robot, industrial manipulator, or logistics vehicle may need to reject a model-generated action when perception is degraded, navigation is uncertain, a geofence is violated, a payload limit is exceeded, or the requested trajectory is physically infeasible. Runtime authorization and deterministic fallback are therefore relevant to mission continuity, operator trust, and prevention of unintended kinetic effects. The resilience case extends to warehouse and port automation, inspection of hazardous facilities, emergency-response robots, and remote infrastructure where a human cannot intervene before every movement. The founder's navigation and guidance background, the company's emphasis on denied or degraded sensing conditions such as camera blinding and sensor drift, and its stated interest in UAVs and other autonomous platforms make the defense translation more substantive than a generic enterprise-AI safety claim. The limits must be explicit. No reviewed source proves an Israeli Ministry of Defense contract, military deployment, classified evaluation, defense-prime integration, export authorization, or compliance with DO-178C, ISO 26262, MIL-STD-810, or another complete assurance regime. The public product is private-beta software, not fielded military equipment. Its strategic value should therefore be understood as enabling infrastructure for trustworthy autonomy and national resilience, with a potentially short path into defense testing and critical infrastructure, rather than as an established defense capability. Diligence should focus on cyber hardening, tamper-resistant policy configuration, secure updates, audit-log integrity, data residency, adversarial sensor inputs, and safe behavior during communications loss.

**Growth stage, trajectory, and key diligence risks.** STATE16 is classified as early: the company is listed as founded in 2026, the team is publicly described as 2-10 people, the website is recruiting select design partners for a private beta, and the public commercial record contains no named customer, financing round, recurring revenue, production deployment, or independent benchmark. Its trajectory is strategically attractive if the company can turn a clear systems problem into a repeatable product. The next milestones should be a quantified simulator release, a real-world design-partner deployment, independent testing of latency and false-positive behavior, a documented handoff from model evaluation to edge enforcement, and evidence that customers will pay to retain the layer across multiple models and robot embodiments. The main risks are: (1) **technical validity** — multi-horizon spectral consistency and physics-aware envelopes may be difficult to generalize across platforms, and a fallback that is safe but too conservative can make the robot commercially useless; (2) **integration burden** — an allegedly hardware-agnostic runtime still needs deep access to sensors, planners, controls, and actuators; (3) **category competition** — Applied Intuition, NVIDIA, Foretellix, OEM safety teams, and open research can absorb adjacent functionality; (4) **evidence risk** — the public record is company-authored and lacks independent performance studies; (5) **certification risk** — safety-critical buyers require traceability, process evidence, and liability allocation, not only a strong algorithm; (6) **team and capital risk** — a small founder-led group may struggle to support several domains while building a safety case; and (7) **security risk** — a layer that can authorize or block physical actions becomes a high-value target for cyber compromise. The upside is a standards-like assurance layer for allied physical AI. The bear case is a technically interesting research platform that cannot achieve the reliability, integration economics, or certification evidence required for production autonomy.
"""
