name = "Unframe"
description = "Unframe is a managed enterprise AI delivery platform that turns business use cases into tailored, production-ready solutions in days. Its modular platform connects enterprise data, workflows, models, and governance controls across SaaS, API, database, file, cloud, and on-premise environments."
detailed_description = """Unframe is an enterprise AI delivery company founded in 2024 by Shay Levi, Larissa Schneider, and Adi Azarya. Its product thesis is that the bottleneck in enterprise AI is usually not access to a language model, but the work required to translate a business process into a reliable production system: finding and normalizing data, connecting existing applications, defining human oversight, measuring outcomes, and operating the result. Unframe describes its platform as a modular set of reusable components, branded in part as The Framery, that can assemble tailored solutions without requiring customers to train a model or replace their existing AI stack. The platform supports agents and automation, document extraction and abstraction, enterprise search, data intelligence, and observability/reporting.

The customer proposition is a delivery model as much as a software feature set. Unframe says it works with a customer's data, workflows, and governance framework, and can deploy into the customer's cloud, on-premises environment, or as managed SaaS. Its public customer material covers financial services, manufacturing, real estate, retail, software, recruiting, and logistics-related workflows. Examples include legacy archive digitization, financial reconciliation, requirements engineering, trade-promotion planning, quote handling, investor reporting, and a Slack sales copilot. The company reports that solutions can move from an identified use case to production in days or weeks; public case studies describe results such as faster reporting, reduced manual work, and improved traceability, but these are vendor-presented claims that merit customer-reference and deployment-data validation.

Unframe's May 2026 Series B, led by Highland Europe, followed its April 2025 emergence from stealth and brought publicly announced total funding to $100 million. The company also reported more than $100 million in total contract value and 400% net revenue retention in the twelve months preceding the announcement. Those figures are important traction signals, but they are self-reported and should not be treated as audited revenue, ARR, or independent evidence of gross-margin quality. The company is expanding from a founder-led product-market fit phase toward broader go-to-market execution, including reseller and systems-integration distribution. Its headquarters are now listed in Cupertino, California, with offices in Tel Aviv and Berlin, while LinkedIn reports a 51-200 employee range.

The competitive field includes hyperscaler agent and automation products, horizontal workflow platforms, AI application builders, systems integrators, and internal enterprise engineering teams. Unframe's plausible edge is the combination of managed implementation, reusable building blocks, model portability, integration breadth, and a governance-oriented operating layer. That edge is executional and workflow-specific rather than a clearly demonstrated foundation-model or research breakthrough. Defense and national-security relevance is credible but bounded: the same controlled document processing, search, case management, reporting, and approval workflows can support government or mission-support organizations. The record contains no verified defense contract or defense-specific product, so dual-use value should be understood as conditional commercial infrastructure adjacency rather than evidence of defense-market traction."""
