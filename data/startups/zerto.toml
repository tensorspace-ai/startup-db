dual_use_description = "Zerto's core resilience functions have substantive commercial and security applicability: continuous replication, journal-based rollback, immutable or isolated copies, clean-room recovery, and orchestrated failover can support continuity of operations after ransomware, destructive intrusion, hardware failure, or regional outage. That is relevant to defense, intelligence, emergency-management, and critical-infrastructure environments where availability and controlled recovery matter. The public record reviewed does not prove classified deployments, defense contracts, or government authorizations, so the assessment is capability-based rather than evidence of defense revenue. Government diligence would need to cover supported hosting environments, segmentation, cryptography, privileged access, supply-chain controls, recovery testing, and applicable authorization requirements."
