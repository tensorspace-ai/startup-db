investment_rationale = "Legit merits a positive legacy priority signal because it addresses a real enterprise control-plane problem at the intersection of AppSec, software supply-chain security, and AI-assisted development. The investment case depends on whether its graph, prioritization, and remediation capabilities produce measurable reductions in exploitable risk and analyst or developer workload, rather than becoming another aggregation dashboard. Diligence should verify recurring revenue quality, retention, expansion, competitive win rates, integration reliability, gross-margin effects of data collection, and whether the company has a repeatable route into regulated and defense-adjacent accounts. This is a strategic diligence assessment, not an investment recommendation."
strategic_value = "Legit could provide strategic value as a software-assurance layer for organizations whose mission, products, or critical infrastructure depend on complex developer toolchains. Its visibility into code, dependencies, pipelines, secrets, artifacts, AI-generated code, and policy compliance aligns with national-security concerns about software supply-chain integrity and uncontrolled automation. The value is highest if the product can run with strong tenant isolation or in restricted environments, preserve useful evidence, integrate with existing scanners and identity systems, and support secure release decisions without blocking engineering unnecessarily. Public information does not yet prove those defense-specific capabilities, so strategic value should be treated as credible potential rather than demonstrated government adoption."
