name = "Jit"
description = "Jit was a product security and agentic security-operations company that connected code, cloud, runtime, identity, data, policy, and scanner signals through a company-specific context graph. Torq announced its acquisition of Jit in May 2026 to incorporate that context technology and team into Torq's AI SOC platform."
detailed_description = """
Jit built a product-security execution layer for organizations that had accumulated scanners but still lacked context, prioritization, and follow-through. Its platform connected source-code and cloud systems with runtime, identity, data, compliance, internal-policy, and operational-workflow information. Jit described the resulting company-specific context graph as a continuously updated model that lets agents ground decisions in architecture, ownership, business importance, and policy rather than treating every scanner finding as equally urgent. Its agent layer covered investigation, triage, remediation validation, threat modeling, compliance operations, and custom workflow execution, with human approvals available for consequential actions.

The technical value proposition was therefore broader than another SAST, SCA, secrets, IaC, DAST, or CSPM product. Jit could ingest findings from an existing security stack, correlate them with code-to-cloud relationships and business context, and help determine whether a vulnerability was exploitable, important, and assigned to the right owner. Its public security documentation says static analysis can run in customer CI/CD environments while Jit receives vulnerability metadata, and that DAST and CSPM workflows use cloud trust relationships. That architecture can reduce the amount of sensitive source code copied into a vendor service, although customers still need to assess token scope, telemetry exposure, retention, and agent permissions.

The commercial market was crowded. Jit faced platform-native security from GitHub, GitLab, and cloud providers, as well as AppSec and product-security platforms such as Snyk, Semgrep, Apiiro, Legit Security, OX Security, Aikido, and ArmorCode. Its defensibility depended on the quality of its context graph, breadth and reliability of integrations, measurable reduction in false positives and triage time, and the safety of autonomous actions. The company’s public site reported thousands of AI security agents in production across nearly 100 enterprise customers; this is a company-reported traction signal, not independently audited revenue or retention evidence. The acquisition itself is stronger evidence that Torq valued Jit’s context technology and engineering capability, but it also means standalone ARR, product roadmap, and customer continuity should be diligenced through Torq rather than assumed from Jit’s historical marketing.

Jit’s May 2026 combination with Torq changes the record’s classification. It is no longer an independent startup seeking a new financing round: Torq says it acquired Jit to add an enterprise context graph to its agentic security-operations platform, and Jit’s announcement says the team and technology are joining Torq. Public reporting describes an approximately 30-person team transfer, while historical third-party company data reported a larger range and a 2022 seed round. Those figures should be treated as historical and not as current standalone headcount or capitalization. The official Jit site currently presents a Boston address, while the company originated in Israel, so the headquarters field is marked with the current public address and the historical Israeli footprint is retained in the rationale.

For defense and national-security users, the relevant adjacency is secure software-factory and SOC workflow infrastructure: correlating software supply-chain findings, validating cloud exposure, enforcing development policies, collecting audit evidence, and accelerating remediation across large engineering organizations. That is credible dual-use utility, but not evidence of defense customers or classified deployment. Additional diligence would need to establish whether Torq preserves Jit’s deployment model and supports sovereign, disconnected, or highly restricted environments, and whether agent actions remain bounded, explainable, reversible, and fully auditable when operating on mission-critical systems.
"""
