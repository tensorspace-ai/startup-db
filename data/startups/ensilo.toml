name = "enSilo"
description = "Founded in 2014, enSilo built endpoint protection around a specific premise: an attacker may already be inside, so defenders also need to stop the damage and data theft that follow. Its lightweight, multi-platform agent combined next-generation antivirus, OS-level communication controls, code-tracing, endpoint detection and response, and automated containment. Fortinet acquired all outstanding shares in October 2019; Fortinet later mapped the acquired capability to FortiEDR, so this is an acquired-asset record rather than an independent startup profile."
detailed_description = "enSilo emerged from Tel Aviv in 2015 with a point of view that was different from perimeter-first security: organizations would continue to be compromised, so endpoint controls should also prevent the consequences of compromise. Its early platform analyzed operating-system-level connection requests and applied policies at connection establishment to block malicious outbound communications before data could leave. A later enSilo patent describes analyzing stack-trace records associated with connection establishment to detect and block malicious communications. The technical bet was to use process context and where a program was in its execution path, rather than relying only on file signatures or alerting after an endpoint had already been breached. This is a concrete historical design choice, not proof that every later endpoint threat was covered or that the product outperformed the field in independent testing.\n\nThe commercial platform broadened that idea into a single agent. enSilo described the agent as combining next-generation antivirus, application communication control, real-time blocking EDR, threat hunting, incident response, and virtual patching, with cloud or on-premises management and multi-tenancy. Version 4.0 added policies that could block communications from vulnerable applications based on published CVEs, IoT discovery and assessment, USB control, and response playbooks connected to third-party security gateways. The intended buyer was an enterprise security team that wanted prevention and post-infection containment in the same deployment, including organizations with legacy operating systems, point-of-sale devices, or manufacturing and other IoT endpoints. The operating value proposition was to keep a compromised device from becoming an exfiltration or ransomware event while reducing the need for analysts to manually coordinate several separate tools.\n\nEvidence of use is real but uneven in quality and scope. In 2016, enSilo said that it had tens of deployments in the United States and that its platform was in use by a number of Fortune 100 companies, leading defense contractors, and payment solutions; it did not name those organizations or disclose contract values. In 2017, enSilo announced that Matrix42 would integrate the platform into its digital-workspace security suite and could sell it in Central Europe. A Matrix42 case study later described ZAE Bayern selecting Matrix42 EDR, powered by enSilo, after evaluating eight products and deploying it across its endpoints by mid-2018. This is useful customer and product evidence, but the case study is published by the channel partner and does not disclose subscription value, renewal, or later retention. The partnership itself should not be counted as a paying deployment.\n\nThe July 2019 company announcement reported more than 250% year-over-year revenue growth, a $23 million Series B led by Rembrandt Ventures, and more than $57 million in company-reported lifetime capital raised. Calcalist reported 86 employees at that time, including 53 in Israel. These figures indicate a meaningful commercial operation immediately before acquisition, but revenue growth is not an absolute revenue or ARR figure, the growth rate is company-reported, and neither Fortinet's filings nor public disclosures provide enSilo standalone revenue, margins, burn, customer retention, or post-acquisition headcount. The founder group brought relevant security and product experience: Lightspeed lists Roy Katmor as CEO, Udi Yavo as CTO, Tomer Bitton as VP Research, and Ido Kelson as VP Engineering; enSilo and local reporting connect the team to Akamai, Imperva, EMC, and Rafael. Those credentials support a plausible ability to build enterprise security software, while the public record does not permit a current standalone-team assessment after the acquisition.\n\nFortinet completed the acquisition of enSilo Ltd. on October 28, 2019. Its announcement highlighted patented code-tracing, a lightweight Linux/Windows/macOS agent, IoT coordination, cloud and on-premises deployment, and planned integration with FortiSIEM, FortiInsight, and FortiNAC. A later Fortinet acquisition timeline explicitly associates enSilo with FortiEDR, and the present FortiEDR product page describes prevention, detection, response playbooks, legacy operating-system support, and cloud, hybrid, and on-premises deployment. That establishes a product-family lineage and a strategic fit with Fortinet's broader security portfolio; it does not establish which enSilo code, staff, patents, or customers remain in the current FortiEDR product. Patent records show at least one enSilo-originated U.S. patent assigned to Fortinet after the acquisition.\n\nThe competitive context is a crowded EPP/EDR/XDR market in which CrowdStrike Falcon, SentinelOne Singularity, Microsoft Defender for Endpoint, Palo Alto Cortex XDR, Sophos, and other platforms combine endpoint telemetry with threat intelligence, automated investigation, and managed services. enSilo's historical distinction was its emphasis on preventing post-infection consequences through process-aware connection blocking, and packaging that with NGAV, EDR, virtual patching, and multi-tenant management in a single agent. Current rivals compete through broader ecosystem data, mature global distribution, and extensive integration and service offerings. Fortinet's distribution and Security Fabric connections could make the acquired capability more valuable inside a network-security suite, but that is an acquirer-level advantage. There is no public standalone enSilo retention, win/loss, pricing, or efficacy data with which to claim durable differentiation against today's competitors."
