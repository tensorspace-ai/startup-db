investible = false
investment_rationale = "enSilo is not independently investible: Fortinet acquired all outstanding shares in 2019, and the product, IP, commercial relationships, and roadmap are now part of the acquirer’s perimeter. The archived company is still relevant as a case study in Israeli endpoint-security formation, venture funding, channel commercialization, and technology acquisition. Public evidence supports a substantial pre-acquisition product and a reported growth period, but does not support a standalone revenue multiple, customer retention model, ownership-return calculation, or current operating-team assessment."
strategic_value = "The asset addressed a gap between detecting endpoint compromise and limiting what an attacker could do next. OS-level connection analysis and code-tracing could complement network controls by stopping malicious egress on an already compromised host; virtual patching, lightweight-agent claims, and legacy-OS coverage also fit environments where patching or downtime is difficult. Fortinet's acquisition created an opportunity to join those controls with firewall, network-access, SIEM, and endpoint products. Fortinet stated its integration intent and later associated enSilo with FortiEDR, but the exact retained technology and economics are not public."
