name = "WINT Water Intelligence"

description = "WINT provides an AI- and IoT-enabled water-management platform for commercial, construction, and industrial facilities. It learns site-specific flow patterns, detects leaks and abnormal consumption in real time, and can trigger remote or automatic shutoff to reduce water damage, waste, and operational disruption."

detailed_description = """
WINT combines flow meters, valves, sensors, edge control units, and cloud software into a water-intelligence platform for facilities with many systems and substantial loss exposure. Its models learn normal flow behavior for assets such as domestic water, cooling towers, HVAC loops, irrigation, sprinklers, hydrants, and construction water. The product analyzes flow-level anomalies rather than relying only on threshold alarms, then provides mobile and desktop alerts, event context, reporting, and remote or automatic valve control. WINT states that its edge devices can continue detection and shutoff decisions locally when communications are temporarily unavailable, an important operational property for buildings where a cloud round trip is not sufficient.

The commercial target is enterprise and project-level water risk: commercial real estate, construction sites, industrial and manufacturing facilities, insurers, and property or facilities managers. The value proposition is unusually measurable for a sustainability product: preventing a burst or slow leak can avoid direct damage, downtime, remediation, and insurance claims, while usage analytics can reduce consumption and support LEED or BREEAM reporting. WINT's official materials cite average customer water savings of 20-25% and a water-damage warranty backed by Hartford Steam Boiler; those are company or partner claims that require customer-level diligence rather than being treated as independently verified performance. The 2022 Series B announcement and reported 2023 Series C indicate meaningful private-company financing and expansion beyond an early pilot stage, but do not by themselves establish durable margins or retention.

Competition comes from several directions. Specialized leak-prevention vendors such as Shayp and APANA compete for commercial water analytics; consumer and light-commercial systems such as Phyn, Flo by Moen, and StreamLabs address simpler premises; and building-management-system vendors, plumbing distributors, insurers, and systems integrators can bundle monitoring into broader workflows. WINT's differentiation is the combination of water-domain models, broad third-party meter/valve/sensor support, local control, multi-system facility coverage, and insurance-oriented loss mitigation. The same integration breadth is also a constraint: retrofit engineering, commissioning, device compatibility, and site-specific policy tuning can make deployments expensive and slow, and larger channels may capture the customer relationship.

The defense and national-security case is credible but bounded. Water availability is a resilience issue at military bases, hospitals, ports, data centers, and other critical sites; flow anomalies and automatic isolation could help identify unauthorized diversion, pipe failure, tampering, or loss of supply before an outage becomes mission-relevant. Local decision-making could be useful at disconnected or degraded facilities. There is no public evidence here of defense deployments, classified accreditation, or contamination sensing. WINT should therefore be evaluated as a physical-infrastructure resilience and water-loss-control component, not as a complete water-security or chemical/biological detection system. Defense relevance depends on cybersecurity, secure device supply, offline operation, integration with site controls, and evidence that automated shutoff policies fail safely.
"""

