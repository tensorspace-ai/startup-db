name = 'CaPow'
description = "CaPow Technologies Ltd. develops Genesis, a capacitive Power-in-Motion platform that transfers energy to mobile robots while they travel, with floor transmitters, onboard receivers, and energy management software intended to reduce charging interruptions in industrial automation."
detailed_description = """CaPow Technologies Ltd. (CaPow) is an active Israeli startup headquartered in Be’er Sheva. It develops Genesis, a Power-in-Motion energy delivery platform for autonomous mobile robots (AMRs) and automated guided vehicles (AGVs). The system places transmitters along robot routes and pairs them with an onboard receiver, with software tools for planning transmitter placement and managing fleet energy. CaPow describes its transfer method as capacitive power transfer. It markets the system to industrial automation operators, robot makers, and integrators. The product’s proposed value is keeping robots on their normal routes while supplying power, reducing time spent diverting to charging stations and potentially reducing spare fleet capacity.

The customer problem is credible and operationally specific: charging constrains the time a battery-powered robot can perform productive work, and charging infrastructure takes floor space and requires workflow planning. Yet the economic value depends on each facility’s duty cycle, robot power draw, route topology, shift schedule, installed transmitter density, energy-transfer efficiency, and integration cost. A robot that spends little time charging, or a site with low utilization, may not justify a retrofit. CaPow’s strongest sales case should therefore be based on measured before-and-after results for a comparable fleet, including installation cost and payback period, not a generic claim of continuous uptime.

Genesis is presented as a system rather than a standalone charger: floor transmitters, robot-side receivers, layout planning, and energy management are all part of the solution. CaPow’s official materials describe integration across robot makes and battery types, while its white paper explains capacitive transfer and adaptive matching networks. These are company descriptions and do not substitute for validation of power levels, transfer efficiency, electromagnetic compatibility, worker safety, reliability, and performance under metal or debris exposure. The company has a US patent grant assigned to CAPOW TECHNOLOGIES LTD concerning regulation of a wireless power receiving unit. That is useful evidence of protectable technical work, but one grant does not establish the breadth of the portfolio, freedom to operate, or the difficulty competitors would face in designing around it.

Commercial alternatives include conventional docking chargers, static inductive charging pads, battery exchange, faster battery charging, and solutions integrated by robot manufacturers. Those alternatives can be simpler to install and may work well where robots can pause, charging zones are available, or the fleet is not heavily utilized. CaPow’s point of differentiation is power transfer while moving without precise parking alignment. The relevant comparison is total cost and operating performance at the customer site: integration labor, transmitter and receiver cost, power consumption, maintenance, usable floor area, robot availability, and service requirements. The company’s broad “hardware agnostic” positioning is commercially attractive if supported across major robot platforms, but each new platform may still require engineering work, testing, and coordination with the OEM or systems integrator.

Public traction evidence is encouraging but uneven. CaPow published a Hyundai Glovis proof-of-concept case study describing side-by-side robot clusters, and reported 15% higher operational efficiency and a fully active CaPow-enabled cluster during the test. This is company-authored pilot evidence, not independently audited performance or proof that a recurring paid contract followed. In October 2026, CEO Mor Peretz stated that the technology was operating on several hundred robots across manufacturing customers. This is a meaningful company-reported deployment signal, but the post does not identify customers, specify the production-versus-pilot split, or provide independently verifiable unit counts. The official site also presents a JLC Robotics case study. Commercial diligence should separate signed paid deployments from trials, demonstrations, partner activity, and robots that are technically equipped but not yet routinely used.

CaPow announced a $7.5 million Seed round in February 2023 led by IL Ventures, followed by a $15 million Series A in March 2025 led by Toyota Ventures. CTech reported company lifetime funding of $22.5 million after the Series A. Startup Nation Finder now lists $23.5 million over five rounds, but the extra amount and events are not explained by primary financing announcements located in this review. The structured record therefore preserves the company-reported $22.5 million and records the conflicting directory figure separately. No subsequent public financing, valuation, revenue, ARR, profitability, burn, or runway disclosure was found. The prior Series B label is unsupported by located round announcements. The company is private and no public cap table or ownership percentages were identified.

The team combines power-electronics research and product commercialization experience. The founders named in funding coverage are Professor Mor Peretz, Eli Abramov, and Alon Cervera. Peretz is identified as CEO and a Ben-Gurion University professor; Abramov and Cervera are identified by investor materials as VP R&D and Chief Scientist, respectively. Amir Fishelov, a SolarEdge co-founder, was announced as chairman. Investor Elements lists Noam Geffen as Chief Business Officer. The company’s news page also reports appointments to an expanded advisory board from Ocado Intelligent Automation, Zebra Technologies, and Infios, but this review did not verify the appointees’ names from a rendered primary announcement. A complete current executive roster, hiring trend, and key-person succession plan remain open diligence areas.

The strongest opportunity is in high-throughput facilities where charging is already a bottleneck and equipment utilization can be measured. The company can potentially sell to robot OEMs, automation integrators, or facility operators, but each route creates different dependency and margin dynamics. OEM distribution may broaden platform access but requires integration and commercial alignment. Direct facility sales allow a clear ROI case but may involve long enterprise sales cycles, operational disruption concerns, and installation services. Channel partnerships and distributor announcements are useful for market access, though a partnership alone does not establish revenue or customer conversion. Repeatable deployments across unrelated customers and robot platforms would be stronger evidence of product-market fit than a single showcase pilot.

The market contains several well-capitalized robotics and charging suppliers, while robot makers can bundle charging into broader fleet offerings. CaPow’s defensibility may rest on patents, field performance, installation know-how, transmitter layout software, integration breadth, and accumulated operational data. The available record does not establish a durable moat or a comparative performance advantage against named alternatives. Technical diligence should quantify output and efficiency across speed, route geometry, transmitter spacing, load, receiver alignment, interference, temperature, and operating hours. Commercial diligence should request site references, paid deployment cohorts, total installed costs, warranty claims, and customer retention.

CaPow has a confirmed Israeli connection through its Be’er Sheva headquarters and reported Israeli incorporation. Its current documented customer story is industrial, not defense-related. Persistent power for mobile autonomous systems could be relevant to security or defense logistics, but no defense customer, procurement contract, or deployment was located. Defense applicability should remain an unproven adjacency unless supported by customer evidence and a clear assessment of deployment conditions, safety, cybersecurity, export controls, and military operating requirements. On current evidence, the case should be evaluated primarily as industrial robotics infrastructure. Key open questions include the paid production deployment count; customer-verified utilization gains and ROI; revenue, margins, and recurring service mix; exact financing after March 2025; why some databases report $23.5 million instead of $22.5 million; IP family ownership and freedom to operate; and whether receiver and transmitter economics remain attractive across different robot platforms and facilities."""
