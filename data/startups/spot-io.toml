[[intelligence.comparables]]
name = "Microsoft Azure Spot Virtual Machines"
website = "https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms"
rationale = "Azure offers its own discounted interruptible VMs and eviction controls, which can meet simple batch or development workloads without a third-party optimizer."
differentiation = "Spot's historical value was to manage replacement and workload policy across clouds and capacity types; the comparative value depends on automation, application recovery, and total cloud footprint."
source_ids = ["azure-spot-vms", "flexera-vmo"]

[[intelligence.comparables]]
name = "Google Cloud native cost recommendations"
