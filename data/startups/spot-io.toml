name = "Spot (formerly Spotinst)"
description = "Spot, founded in Tel Aviv as Spotinst in 2015, built cloud compute and FinOps automation for allocating workloads across discounted, reserved, and on-demand capacity. NetApp acquired the company in 2020; Flexera completed its purchase of the Spot by NetApp FinOps business on March 3, 2025. The technology continues within Flexera, including Virtual Machine Optimization (formerly Spot Elastigroup) and Cloud Commitment Management (Spot Eco transitioned in September 2025). Globes reported that Flexera closed Spot's Israeli operation in November 2025; current global product-team size and standalone financials are not disclosed."
detailed_description = """
Spot began in Tel Aviv in 2015 as Spotinst, building software to make discounted, interruptible cloud compute usable for production operations. Cloud providers sell spare capacity at lower prices, but they can reclaim it as demand changes. Spot's original Elastigroup product automated instance selection and provisioning, watched for interruption risk, and shifted workloads to replacement or on-demand capacity. The commercial proposition was to convert a difficult infrastructure trade-off into a policy-driven operating workflow: lower compute cost while preserving the availability targets that the application team sets. This is infrastructure software, not a cloud provider or a general-purpose finance dashboard.

The product family expanded into adjacent operating problems. Ocean managed Kubernetes and container infrastructure, aiming to balance cost, performance, and availability. Eco analyzed reserved instances, savings plans, and committed-use discounts, and automated commitment selection and lifecycle management. CloudCheckr supplied cloud cost visibility, governance, billing, and optimization capabilities that NetApp had assembled into the Spot portfolio. Flexera's March 2025 release listed Eco, Ocean, Elastigroup, and CloudCheckr as acquired product lines. By September 2025, Flexera documentation said Spot Eco had transitioned into Flexera One Cloud Commitment Management; Flexera currently markets the Elastigroup lineage as Flexera One Virtual Machine Optimization. These are concrete continuity signals: the products and functions survived the ownership change, but the former startup no longer has a standalone product roadmap or corporate boundary.

Spot solved a persistent operational problem for companies with variable compute demand. Teams must choose among cheaper but reclaimable capacity, reserved commitments that can be underused, and more expensive on-demand instances that are easier to procure quickly. Spot connected cost policy to provisioning and workload operations across major public clouds. That pairing of compute orchestration, Kubernetes optimization, and commitment management gave the former company a broader workflow than a tool that only reports cloud bills. The product was most relevant to platform engineering, SRE, DevOps, cloud-finance teams, and managed-service providers handling large or fluctuating estates. It could also help batch processing, data engineering, development environments, and some AI workloads when jobs tolerate interruption or can fall back safely.

Historical commercial evidence is credible but should be read at the precision the sources support. Highland Europe, Spot's Series B lead, said in August 2018 that the company had more than a thousand customers, including Sony, Samsung, Unilever, Qualcomm, and Ticketmaster, and employed 100 people. Intel Capital's 2021 founder interview said more than 1,500 organizations were using the service. These are investor-published or company-attributed adoption statements, not audited counts of active paying customers. NetApp's June 2020 acquisition announcement described more than 180 staff across five offices. A 2020 Globes interview described turnover as tens of millions of dollars without specifying a period or publishing accounts. No standalone Spot revenue, ARR, retention, gross margin, or customer concentration has been identified after acquisition.

The corporate history changes how this record should be evaluated. NetApp announced an agreement to acquire Spot in June 2020 and later reported in its SEC filing that it acquired all outstanding Spot, Inc. shares for $340 million cash on July 9, 2020. Globes reported a figure near $450 million, including in an interview with Spot's CEO; because those sources do not reconcile their consideration or valuation bases with NetApp's filing, the acquisition amount is recorded as conflicting rather than silently choosing one. In January 2025 NetApp agreed to sell the Spot FinOps business to Flexera, and Flexera announced completion on March 3. NetApp's SEC disclosure says the consideration was $70 million upfront plus up to $49 million contingent on 2025 performance, and that $20 million of contingent consideration was recognized at closing. That recognition is not proof of the final payout. The two acquisitions are separate from the company's venture rounds and are not funding.

Spot's competitive advantage was strongest where automation had to bridge cost analysis and live workload operations. Flexera's current Virtual Machine Optimization page describes proactive replacement and selection across Spot, on-demand, and reserved capacity, while its product documentation continues Eco commitment workflows. Competition is stronger than it was in the startup's early years. AWS offers native Spot capacity signals and fleet controls; Azure sells its own interruptible VMs; Google provides native cost recommendations; and CAST AI automates Kubernetes right-sizing and spot placement across clouds. These first-party and specialist alternatives narrow the value of a separate control plane for simpler estates. Spot's historical portfolio breadth remains useful for customers seeking a common policy layer across compute, containers, and commitments, but no recent independent benchmark establishes superior savings, reliability, or total cost of ownership.

Technical fit depends on workload behavior and guardrails. Spot can reduce cost only when replacement capacity is available, applications can tolerate or recover from interruption, and policies do not violate latency, data locality, licensing, or availability requirements. Predictive signals reduce response time but cannot eliminate cloud-provider capacity shortages or guarantee uninterrupted operation. Stateful workloads need testing of checkpointing, storage reattachment, network identity, and rollback paths. Commitment management also trades unit prices against duration and utilization risk. Those are engineering and governance questions, not just a forecast-quality problem. Product claims such as savings percentages and availability guarantees should be validated against each customer's own baseline, workload mix, failure history, and cloud bill.

The original founding team had relevant infrastructure experience, and the business achieved institutional funding and an acquisition by a large cloud and storage vendor. Amiram Shachar described operating military data centers before building cloud optimization software; Liran Polak and Aharon Twizer were also named as founders in later company and investor-era reporting. A 2016 contemporaneous article instead named Yakir Daniel in the founding group, so the early public record is not fully consistent. The Israeli operation was a meaningful part of Spot's history: NetApp described it as based in Israel, and its founding and headquarters were reported in Tel Aviv. Globes reported in November 2025 that Flexera closed the local Spot operation and laid off the local team, including around 100 Spot-origin employees who had joined Flexera. The remaining product business operates inside Flexera, but its current global engineering capacity, leadership, and roadmap ownership are not public.

The strategic case today is therefore asset-level. Flexera gained proven cloud compute automation, Kubernetes capabilities, commitment management, customer workflows, and a FinOps partner ecosystem that complements its broader IT-spend platform. For a buyer or strategic reviewer, the decisive questions are product investment after integration, customer retention through migration, the degree of multi-cloud portability, and whether the acquired automation continues to deliver measurable outcomes. The past funding and exit validate product relevance but do not make Spot an independent venture opportunity. With product continuity visible but local-team closure and standalone economics unresolved, Spot is best treated as a mature acquired software portfolio with real technical utility and elevated execution uncertainty.
"""
