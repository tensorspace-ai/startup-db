rationale = "Google Cloud Active Assist provides provider-native recommendations for idle resources, over-provisioning, and pricing choices."
differentiation = "Spot's portfolio historically combined cross-cloud infrastructure actions with container and commitment workflows; provider-native recommendations are limited to the applicable cloud environment."
source_ids = ["gcp-cost-recs", "flexera-eco-sep25", "flexera-vmo"]

[[intelligence.comparables]]
name = "CAST AI"
website = "https://docs.cast.ai/docs/getting-started"
rationale = "CAST AI documents cross-cloud Kubernetes cost management with autoscaling, spot automation, and bin packing, overlapping directly with Spot Ocean and the container optimization portfolio."
differentiation = "Spot's inherited portfolio also includes VM interruption handling and cloud commitments; CAST AI's current Kubernetes breadth means differentiation should be tested on a workload-by-workload basis."
source_ids = ["castai-docs", "flexera-vmo", "flexera-eco-sep25"]

