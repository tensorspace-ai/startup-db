name = "REEMAG"
description = "REEMAG is an early-stage rare-earth materials company developing a claimed dry, carbon-free route to recover NdFeB permanent magnets from end-of-life products and manufacturing scrap. Its strategic thesis is to turn magnet waste into reusable rare-earth powder, reducing dependence on concentrated primary supply for commercial, energy, and security-relevant applications."
detailed_description = """**Product and problem.** REEMAG is developing a recycling process for neodymium-iron-boron (NdFeB) permanent magnets, the high-performance magnets used in electric motors, wind-turbine generators, hard disk drives, electronics, industrial actuators, and many defense-adjacent systems. The practical problem is not simply that these magnets are valuable; it is that end-of-life magnets are difficult to recover without destroying the alloy value, contaminating the feedstock, or sending the rare-earth content into a costly separation chain. REEMAG's public materials describe a route from magnet scrap, off-cuts, swarf, and end-of-life magnets back to a reusable powder or magnet-making feedstock. The company frames this as an alternative supply stream for a market whose mining, separation, and refining capacity is geographically concentrated. Its website says the process can reuse more than 80% of the raw material, but that figure is a company claim rather than an independently audited production metric.

**Core technology.** The company describes two proprietary process technologies and presents the central value proposition as magnet-to-powder recovery without conventional grinding or shredding. A U.S. Department of Energy materials-recycling program describes REEMAG's approach as "atomic electrolytic decrepitation," in which electrical reactions break down the material at an atomic scale. REEMAG's own public description characterizes the route as dry and chemical-free and says it can return recovered material to a state suitable for reuse. If technically demonstrated at scale, avoiding a mechanically intensive size-reduction step and preserving useful alloy chemistry could reduce energy, reagent, and waste burdens relative to conventional recycling routes. The public record does not yet establish the process's exact cell design, operating window, rare-earth recovery yield, powder purity, oxygen control, energy intensity, throughput, or the magnetic performance of magnets remanufactured from its output. Those are the technical gates that should determine whether the attractive process narrative translates into an industrial advantage.

**Market and go-to-market.** REEMAG's addressable market sits at the intersection of critical-minerals security, magnet manufacturing, clean-energy equipment, and electronic-waste recovery. Potential feedstock partners include wind-turbine and motor service companies, hard-drive and electronics recyclers, magnet manufacturers with production scrap, and industrial operators holding obsolete equipment. Potential customers include magnet makers seeking a secondary rare-earth input, original-equipment manufacturers seeking lower-risk material sourcing, and public-sector programs seeking domestic or allied recycling capacity. The company website explicitly presents manufacturers, corporations, recyclers, and governments as relevant stakeholders. That language suggests a business model built around licensing, process equipment, recovered powder sales, strategic recycling partnerships, or some combination of those approaches, but no public source confirms the commercial model, a paid customer, recurring revenue, a binding offtake agreement, or a production facility. A credible go-to-market path will require both a dependable stream of correctly sorted magnets and customer qualification of the recovered powder.

**Traction and third-party validation.** REEMAG Technologies Ltd. is listed as an active private Israeli company incorporated on 21 June 2022, with a Zichron Yaakov address in an Israeli company-record mirror. REEMAG also appears in a Weizmann Institute sustainability ecosystem listing, which is consistent with the company's public association with Weizmann and Yeda, although the ecosystem page does not by itself disclose a licensing agreement, investment, or laboratory milestone. The U.S. Department of Energy's Wind Turbine Materials Recycling Prize page lists REEMAG Breakthrough Magnet Recycling and identifies the atomic-electrolytic-decrepitation concept. The Global Rare Earth Industry Association separately announced REEMAG's membership and described its carbon-free conversion of end-of-life NdFeB magnets into rare-earth powders. LinkedIn reports a 2022 founding date and a 2-10 employee range. These are meaningful ecosystem and program signals, but they are not equivalent to independent pilot data, a customer acceptance test, a disclosed financing round, regulatory certification, or commercial deployment. Public funding amount, valuation, revenue, pilot capacity, patent numbers, and independently verified performance remain undisclosed.

**Founders and team.** REEMAG's official site identifies Pini Althaus as CEO and co-founder, Yehuda Borenstein as co-founder and director, and Uri Shlomo as a co-founder. It also names George Hadjipanayis and Paul McGuiness in the scientific team section. This mix indicates an attempt to pair company formation and commercialization responsibilities with permanent-magnet and materials expertise. The Weizmann ecosystem association is strategically relevant because the venture appears to be connected to an Israeli research-commercialization environment rather than being only a directory listing. At the same time, the public materials do not provide a complete organizational chart, detailed employment histories for every team member, the specific inventor-to-patent mapping, or evidence that the listed scientific contributors are full-time operators. The company should therefore receive credit for identifiable leadership and research affiliations, while team and execution scores remain below the level appropriate for a company with a disclosed industrial operating history.

**Competitive dynamics.** REEMAG competes with several different categories rather than one direct substitute. Urban Mining Company and Cyclic Materials pursue rare-earth magnet recovery and separation from end-of-life products; HyProMag uses hydrogen-processing approaches to liberate magnet material; REEcycle represents hydrometallurgical rare-earth recovery; established magnet and specialty-material manufacturers such as VACUUMSCHMELZE can incorporate recycled inputs or defend customer relationships through existing qualification infrastructure; and primary mining, separation, and refining supply chains remain the incumbent alternative whenever recycled feedstock is unavailable. REEMAG's claimed differentiation is a dry, low-chemical, electrically assisted route that aims to preserve the value of the NdFeB alloy and return it to reusable powder rather than merely recovering separated rare-earth salts. That could matter economically if it delivers high yield, consistent powder specifications, and lower total processing cost. The competitive edge is not yet proven: rivals have their own pilot plants, feedstock relationships, patents, or industrial qualification programs, and REEMAG's public record does not establish scale, freedom to operate, or customer preference.

**Defense, security, and resilience relevance.** NdFeB magnets are not exclusively defense materials, but they are enabling components in high-torque motors, actuators, generators, guidance and sensing subsystems, robotics, unmanned platforms, and aerospace and naval equipment. The same material is also embedded in EV traction systems, wind generation, factory automation, and other infrastructure whose availability affects energy and industrial resilience. REEMAG therefore has credible dual-use relevance through the supply chain: a domestic or allied recycling route could recover strategic material from industrial scrap, obsolete equipment, and potentially controlled stockpiles, reducing exposure to concentrated overseas mining and refining. This is especially relevant to an Israeli and allied-technology thesis because supply assurance can be strategically valuable even when the recycler is not itself a defense contractor. There is no public evidence in the reviewed sources of a defense contract, a qualified military part, a government procurement award, or fielded defense deployment. The appropriate assessment is consequently resilience and strategic-material adjacency with plausible defense utility, not a claim of demonstrated defense capability.

**Stage, trajectory, and diligence risks.** REEMAG is best classified as early stage: the legal entity dates from 2022, public headcount is only 2-10, and the available evidence describes a technology and ecosystem position rather than a disclosed production business. Its trajectory could be attractive if it converts laboratory or prize-stage validation into a repeatable pilot, secures long-term scrap supply, qualifies recovered powder with magnet manufacturers, and demonstrates a cost and carbon advantage against both primary material and competing recycling processes. The highest-priority diligence questions are: 1) independent mass-balance, purity, yield, energy, and emissions data; 2) powder performance after remanufacturing, including coercivity and consistency; 3) patent scope, ownership, and freedom to operate; 4) safety, environmental, and waste-handling approvals; 5) capex and throughput economics at commercial scale; and 6) customer contracts, financing runway, and the relationship between the Israeli legal entity and the U.S. REEMAG LLC presence reported in public sources. Rare-earth price cycles, collection logistics, contamination, competitor scale-up, and dependence on qualified magnet customers are material risks. The company merits a high-priority strategic watch, but its current public evidence supports diligence and ecosystem tracking rather than confidence in commercial maturity."""
