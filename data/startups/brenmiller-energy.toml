strategic_value = "Strategic value operates on three axes. (1) Energy resilience and critical-infrastructure hardening: dispatchable, fuel-independent heat and power storage reduces reliance on gas/oil logistics and grid stability, directly relevant to hospitals, water, and food processing and adjacent to installation resilience. (2) Supply-chain security: using abundant crushed rock instead of lithium sidesteps contested battery-materials supply chains that allied planners increasingly treat as a strategic vulnerability, aligning with 'friend-shoring' of energy-storage capacity. (3) Industrial decarbonization at scale: process heat is one of the largest and least-solved slices of emissions, and a proven Israeli manufacturer with a gigafactory contributes to allied industrial-base electrification. The value is real but indirect — Brenmiller is an energy-transition and resilience asset, not a defense supplier, and should be weighed as strategic infrastructure rather than a dual-use weapons capability."
