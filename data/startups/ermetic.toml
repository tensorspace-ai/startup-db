name = "Ermetic"
description = "Ermetic was an Israeli cloud-security company specializing in identity-aware cloud infrastructure security, CNAPP, and CIEM. Tenable completed its acquisition in October 2023, and the technology is now represented in Tenable Cloud Security and Tenable One Cloud Exposure rather than as an independent startup."
detailed_description = """
Ermetic built an identity-first cloud infrastructure security platform for AWS, Azure, and Google Cloud. Its central proposition was to inventory cloud resources and identities, analyze permissions and configurations together, and expose combinations that could create a realistic route to sensitive data or workloads. That approach addresses a weakness in simple compliance scanning: a single low-severity misconfiguration may matter little, while a public workload combined with a vulnerable service account and broad database permissions can create a material attack path. The product category therefore sits across cloud security posture management (CSPM), cloud infrastructure entitlement management (CIEM), and the broader cloud-native application protection platform (CNAPP) market.

The commercial problem was persistent and concrete. Enterprise cloud estates accumulate short-lived workloads, infrastructure-as-code changes, service identities, third-party integrations, and permissions that are difficult to review manually. Security teams need a continuously updated asset graph, policy and compliance checks, identity least-privilege analysis, vulnerability context, and remediation workflows that can be used by both security and platform engineering teams. Ermetic's identity emphasis was a credible wedge because entitlement sprawl and toxic combinations of access, exposure, and vulnerability are difficult to prioritize with siloed tools. Tenable's current cloud-security materials describe the resulting platform in terms of multi-cloud discovery, exposure-path analysis, CSPM, CIEM, workload protection, data protection, and guided remediation.

The market is strategically important but crowded. Wiz, Palo Alto Networks Prisma Cloud, Orca Security, Microsoft Defender for Cloud, Check Point CloudGuard, and cloud-provider-native controls all compete for overlapping budgets. Buyers increasingly prefer consolidated exposure-management or CNAPP platforms, which favors vendors able to correlate code, configuration, identity, workload, data, and runtime signals while limiting false positives. It also raises the bar: identity graphing alone is no longer a durable moat, and the practical differentiators are coverage of fast-changing cloud services, quality of risk prioritization, integrations, remediation safety, deployment friction, and evidence that findings lead to measurable reduction in exposure.

The strongest commercialization signal is the acquisition itself. Tenable announced and completed the transaction in 2023, explicitly identifying Ermetic as a CNAPP and CIEM provider and stating that its capabilities would be added to Tenable One and Tenable Cloud Security. That validates strategic product fit and gives the technology access to a larger vulnerability- and exposure-management platform, but it also ends the standalone-company investment case. Public employee information is inconsistent after the transaction: LinkedIn preserves a historical 51-200 range while also showing the acquired profile and a much smaller visible employee listing. A current independent headcount therefore cannot be treated as confirmed.

For defense and national-security users, the relevance is real but bounded. Government, defense, and critical-infrastructure operators increasingly use commercial cloud and hybrid environments, where excessive permissions, exposed management interfaces, vulnerable containers, and misconfigured storage can affect mission systems and sensitive information. Identity-aware exposure management can support defensive cyber hygiene, zero-trust implementation, cloud authorization reviews, and incident triage. It does not itself provide offensive cyber capability, battlefield sensing, or a specialized defense platform, so the dual-use thesis is cybersecurity resilience rather than direct military technology. The acquired-asset status makes Ermetic more useful for capability mapping and market-consolidation analysis than for identifying an active startup investment opportunity.
"""
