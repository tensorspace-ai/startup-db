name = "Solvo"

description = "Solvo developed an application-aware cloud security platform combining cloud security posture management, entitlement analysis, data-aware access modeling, and remediation guidance. CYE acquired the technology in January 2025 and continues to list Solvo through its AWS Marketplace channel, so this record describes an acquired asset rather than an independent startup."

detailed_description = """
Solvo's core product addressed the relationship between cloud resources, applications, identities, permissions, and sensitive data. Its platform discovered cloud infrastructure and misconfigurations, mapped access paths, highlighted excessive or administrator-level permissions, and helped security and engineering teams create narrower least-privilege policies. Public technical descriptions identify a combination of CSPM and CIEM capabilities, with data posture and compliance features layered around that core. A notable technical theme was contextual analysis: instead of treating an IAM permission as risky in isolation, Solvo aimed to understand which application or machine identity used which resource and to recommend a policy matched to observed behavior. The company also described adaptive remediation and generated infrastructure-as-code or policy fixes, while research coverage cautioned that customers still retained review and deployment responsibility rather than receiving unrestricted automatic changes.

The target market was cloud-dependent organizations with security, DevOps, platform-engineering, and governance teams that needed a practical way to reduce misconfiguration and over-privilege across AWS, Azure, and Google Cloud. The product was relevant to regulated sectors such as financial services, healthcare, software, and retail because it connected technical findings to audit evidence, compliance rules, and remediation workflows. A 2023 S&P Global Market Intelligence profile reported roughly 30 employees, more than 65 customers, and approximately $11 million in venture funding at that time. Those figures are historical and should not be treated as current standalone operating metrics. The acquisition means later revenue, retention, headcount, customer concentration, and product adoption cannot be cleanly separated from CYE. Current AWS Marketplace material identifies CYE as the seller and documents a continuing commercial distribution path, but it does not disclose revenue or customer-level proof.

Solvo operated in a difficult and consolidating category. Its combination of CIEM, CSPM, data posture, runtime context, and remediation offered a sharper identity-and-configuration proposition than a single-purpose permissions tool, but the same functionality increasingly appears inside broader CNAPP and exposure-management suites. Wiz, Orca Security, Palo Alto Networks Prisma Cloud, Microsoft Defender for Cloud and Entra Permissions Management, Tenable Cloud Security, Sonrai Security, CyberArk, and native cloud-provider controls compete for overlapping budgets. Solvo's differentiation therefore depended on the quality of its application context, policy generation, integrations, cloud coverage, and ability to turn findings into safe fixes. The acquisition by CYE is consistent with this market structure: CYE gained native cloud considerations for its exposure-management platform and channel, while Solvo's technology gained access to a broader risk-prioritization environment. The key diligence question is whether CYE has preserved differentiated engineering and converted it into durable attach, retention, and expansion within Hyver.

For national-security and defense use, the capability is substantively relevant but not itself a defense-specific system. Military, intelligence, critical-infrastructure, and government organizations increasingly operate sensitive workloads in public, hybrid, or sovereign cloud environments where excessive permissions, exposed storage, and opaque machine identities can create paths to mission data. Solvo's asset inventory, attack-path context, least-privilege policying, compliance evidence, and remediation blueprints could support hardening and continuous control validation. AWS Marketplace materials reference NIST, FedRAMP, and GC Guardrails, but a marketplace listing is not evidence of authorization or deployment in those environments. The evidence does not establish classified deployment, government contracts, security authorizations, or operational defense customers. Any defense thesis should therefore be framed as security-infrastructure adjacency and integration potential, not proven defense traction."""

