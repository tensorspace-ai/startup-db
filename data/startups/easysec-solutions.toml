name = "EasySec Solutions"
description = "EasySec Solutions is a privately held Jerusalem cybersecurity startup developing ThinGUARD 2.0, an OT-native zero-trust platform for controlling access to and protecting connected industrial devices, legacy control systems, and critical-infrastructure networks."
detailed_description = """EasySec Solutions develops ThinGUARD 2.0 for industrial organizations and critical-infrastructure operators that must connect legacy and new-generation devices without making availability-sensitive operations dependent on an IT-style perimeter model. The company's public product materials describe device-level preventive access control, endpoint-to-endpoint protected communications, supply-chain protection, real-time alerts, centralized monitoring, and secured device discovery. ThinGUARD is positioned as a software-defined security layer that can be deployed around existing industrial equipment and software, which is strategically relevant where replacing controllers or changing operational processes is impractical. The company also describes business-based policies that use device attributes such as location, type, model, and manufacturer to group and govern access.

"The commercial problem is credible and specific: industrial operators, utilities, ports, smart-city deployments, and manufacturers are adding connectivity to systems that were not designed for continuous hostile-network exposure. A device-centric enforcement point can complement network segmentation and monitoring by constraining which devices or services may communicate, including within an otherwise trusted operational network. The value proposition is therefore reduced attack surface, more controlled remote or third-party access, and better visibility into unauthorized traffic while preserving operational continuity. Public materials identify critical infrastructure, smart factories, smart water, power distribution, and maritime or port environments as target contexts, but they do not provide enough current evidence to quantify recurring revenue, deployment scale, or customer concentration."

"Competitive dynamics are difficult. ThinGUARD competes with OT visibility and detection platforms such as Nozomi Networks, Claroty, Dragos, and Microsoft Defender for IoT, as well as broader network-security and secure-access offerings from Fortinet, Cisco, and Zscaler. Those alternatives benefit from larger sales forces, established channel relationships, security-operations integrations, and customer trust. EasySec's potential differentiation is the combination of device-level policy enforcement, cryptographic protection between endpoints, and a transparent architecture aimed at legacy systems rather than a monitoring-only product. That distinction is meaningful only if the enforcement layer can be deployed safely across heterogeneous protocols, demonstrate low operational overhead, and integrate with existing SOC and engineering workflows."

"There are useful but dated commercialization signals. EasySec's own site reports a first commercial ThinGUARD version in 2019, European integrator interest, and a pilot involving an Airbus mechanical-parts supplier; its 2021 press material describes a successful pilot at Ashdod Port followed by business discussions. These are evidence of product validation and access to relevant test environments, not proof of a completed long-term contract or scaled revenue. LinkedIn describes the company as privately held, founded in 2018, and employing 2-10 people. No reliable public source found for this record establishes disclosed venture funding, a current customer roster, certifications, or recent growth."

The defense and national-security case is credible but indirect. Securing industrial control systems, port operations, water infrastructure, energy distribution, and defense-supply-chain facilities has clear resilience value, and the same access-control and protected-communications mechanisms could be relevant to military logistics or government OT. However, the public record does not document military deployments, defense contracts, or security accreditation. EasySec should therefore be treated as a dual-use OT-security candidate whose strategic relevance depends on proving safe deployment, measurable reduction in unauthorized activity, product assurance, and repeatable procurement—not as a verified defense supplier."""
