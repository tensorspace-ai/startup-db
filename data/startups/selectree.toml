name = "SelectREE"
description = "SelectREE is an Israeli critical-minerals startup developing an all-solid electrochemical platform to separate strategically valuable rare-earth elements from mixed mineral and recycled-material streams. Its early laboratory results show repeatable element-specific electrochemical responses across four elements, an initial proof point for a process intended to reduce reliance on large, chemical-intensive solvent-extraction plants."
detailed_description = """
**Product and the concrete problem it solves.** SelectREE is addressing the processing bottleneck between finding rare-earth ore or collecting magnet-bearing scrap and producing separated elements that advanced manufacturers can actually use. Neodymium, praseodymium, dysprosium, and terbium are often present together and have closely similar chemical behavior, so separating them into individual streams is substantially harder than mining or collecting a mixed concentrate. The incumbent solvent-extraction approach handles this challenge with long sequences of liquid-liquid extraction stages, large chemical inventories, substantial process infrastructure, and complicated waste management. The resulting plants are expensive, slow to permit and build, and geographically concentrated. SelectREE's thesis is that a more selective and modular separation step could allow a mine, magnet producer, or recycler to process valuable elements closer to the feedstock instead of depending on a small number of centralized facilities. The intended product is process technology and equipment for mineral processors and recyclers, not a mine, a magnet maker, or a consumer product. That distinction matters: the commercial case depends on proving a better separation process and integrating it into upstream leaching and downstream refining operations already owned by others.

**Core technology and how it actually works.** The public technical description is an all-solid, electrode-based electrochemical system. SelectREE applies controlled electrical conditions to specialized electrode surfaces intended to produce different, repeatable electrochemical responses for individual metal ions. If those responses remain sufficiently distinct in a real mixed feed, the process could selectively capture a target ion and then release it into a separate stream, avoiding many successive solvent-extraction stages. Company material describes a capture-and-release concept inspired by battery technology and the use of precision ligands with electrical control; the precise electrode chemistry, ligand identities, cell design, current density, recovery rates, selectivity coefficients, throughput, and operating windows have not been publicly disclosed. A crucial boundary is that the company does not claim to replace the upstream leaching step: mixed ore, scrap, or other feedstock still needs to be prepared as a solution suitable for processing. Its recent laboratory report described distinct and repeatable electrochemical signatures across four elements over dozens of runs. That establishes an early signal-detection milestone, not separated product, high-purity output, full mass balance, continuous operation, or an industrially validated process. The next scientific test is whether selectivity survives realistic feed chemistry, concentration variation, competing ions, electrode fouling, and many repeated cycles.

**Market, customers, and go-to-market.** The potential buyers are rare-earth miners and refiners, magnet manufacturers, end-of-life magnet recyclers, processors of mine tailings, and other advanced-materials or industrial firms handling mixed-metal streams. The Israel Innovation Authority profile also lists electric-vehicle and wind-energy supply-chain participants and defense-industrial supply-chain participants as target customer categories. SelectREE's proposed modularity could suit facilities that cannot justify a conventional separation complex, including a smaller operation recovering material from manufacturing swarf or recycled magnets. A plausible commercial model is equipment or process deployment at a customer site, perhaps accompanied by licensing, process engineering, or a strategic processing partnership; no public source confirms the final pricing or business model. Likewise, no paid customer, pilot contract, purchase order, offtake agreement, revenue, or named industrial design partner has been disclosed. The commercial adoption burden is high even if the lab chemistry works: a processor will need consistent feedstock acceptance, acceptable recovery and purity, stable uptime, manageable reagents and consumables, integration with leaching and finishing stages, and qualified product specifications. SelectREE must show that customers can use the separated output in magnets or other products without adding costly downstream purification.

**Traction, financing, and third-party validation.** SelectREE Technologies Ltd. was established in 2025 and is listed by the Israel Innovation Authority as an early-stage R&D company with five employees. In 2026 it entered the Authority's Pre-Seed Startup Fund pathway, and company and investor communications report a pre-seed investment from Cove Capital; the amount has not been disclosed in the sources reviewed. Cove Capital is led by Pini Althaus, a mining executive who previously founded USA Rare Earth, which gives the company domain-specific investor support but should not be confused with independent technical certification. The clearest technical milestone was announced on August 18, 2026: the company reported repeatable electrochemical responses across four elements over dozens of laboratory runs conducted over several weeks. Mining Weekly and Metal Tech News covered the milestone and described the intended process, while both make clear that real-feedstock validation and a customer-site pilot are future steps. The Israel Innovation Authority listing independently corroborates the company, R&D status, team count, location data, customer categories, and the broad technology description. No peer-reviewed paper, patent grant, third-party assay, measured recovery or purity result, environmental lifecycle analysis, or commercial-scale demonstration was located. The strongest evidence today is a credible laboratory-stage result plus ecosystem and investor validation, not product-market fit.

**Founders and team background.** The public sources identify Dr. David Malka as SelectREE's co-founder and CEO/CTO, and list him as the company's lead executive in the Israel Innovation Authority profile. Company and professional-profile material also names Yehuda Borenstein in a leadership and company-building role, while recent public communications identify a wider working group including Yossef Gofer, Daniel Hirshberg, Yuval Rapaport, and Ori Holtzman. The headcount evidence is small: the Authority lists five people, while LinkedIn gives a 2–10 employee range. The visible team therefore appears compact, which can support rapid laboratory iteration but leaves uncertainty about whether the company has enough electrochemistry, process engineering, mineralogy, controls, industrial commissioning, and commercial deployment expertise to scale. Public biographies and role histories for several team members are limited, so the record should not infer prior technical achievements or military experience. Cove Capital's sector experience may help with feedstock, industry access, and project development, but an investor relationship does not establish that the startup already has a customer or a qualified process. Diligence should establish who owns the core inventions, how responsibilities are divided across the team, and what laboratory and pilot infrastructure is available.

**Competitive dynamics.** SelectREE enters a strategic market with experienced incumbents and several distinct technology paths. (1) Solvay and other established chemical processors use solvent extraction and benefit from operating knowledge, customer qualification, and established industrial relationships; their scale and process maturity are difficult to displace. (2) Lynas Rare Earths operates a major non-Chinese supply chain and is expanding separation capacity, giving customers a proven allied source even where its chemistry differs. (3) MP Materials is building an integrated U.S. mine-to-magnet chain and represents both a potential customer and an alternative domestic supply strategy. (4) Ucore Rare Metals is advancing its RapidSX solvent-extraction process, which targets faster and more compact deployment while retaining a solvent-based architecture. (5) Carester is developing rare-earth separation and recycling capacity in Europe, competing for the same diversified supply-chain demand. (6) REEMAG, another Israel-linked venture in the local startup database, works on direct magnet-to-magnet recycling and is complementary at the feedstock-loop level rather than a duplicate separation platform. SelectREE's claimed distinction is a selective electrochemical mechanism that might reduce plant footprint, chemicals, and process stages. Those are hypotheses to test; no public comparative cost, energy, throughput, recovery, or purity data yet establishes an advantage over these alternatives.

**Defense, security, and resilience relevance.** SelectREE's dual-use relevance is credible through strategic supply resilience, rather than through a fielded military product. Rare-earth magnets and separated elements are inputs to motors, actuators, sensors, power systems, and other components used in commercial energy and mobility equipment as well as aerospace and defense systems. A cost-effective separation capability that can process primary or recycled feedstocks in Israel or allied jurisdictions could help reduce dependence on concentrated foreign processing capacity and strengthen the availability of materials for defense-industrial supply chains. The company explicitly lists defense-industrial participants among target customer categories, and its investor has publicly discussed possible applications to tungsten processing, but neither fact proves a defense contract, military trial, qualified output, or operational deployment. The same technology could also improve resilience in civilian infrastructure supply chains for wind energy, electric vehicles, industrial robotics, and electronics. For security-sensitive adoption, buyers would need supply-chain traceability, controlled access to process know-how, reliable output specifications, environmental permits, and assurance that critical feedstock and finished material remain available through disruptions. Export-control treatment and the strategic value of any process IP should be assessed as the platform matures.

**Stage, trajectory, and diligence risks.** SelectREE is appropriately classified as early: it is a 2025-founded R&D venture with a small team, a reported pre-seed backer, and encouraging but preliminary lab observations. Its next value-inflecting milestones are repeatability on representative mixed feeds, quantified element recovery and purity, electrode life and fouling data, a mass-balance and techno-economic model, a continuous pilot campaign, and a named customer-site test. The central scientific risk is that the promising curves will not translate into sufficient selectivity when many competing ions and variable feed chemistries are present. The process may require complex upstream leaching or downstream polishing that erases any savings. Industrial risks include scaling electrode area, maintaining throughput and reliability, handling contaminated process streams, and meeting customer and permitting requirements. Commercial risks include long qualification cycles, volatile rare-earth prices, incumbent capacity expansion, dependence on strategic partners for feedstock, and the capital required to move from bench experiments to a demonstration plant. Public information also differs on the company's listed location: the operating laboratory and media coverage point to Petah Tikva, while the Innovation Authority company record lists Shoham. Exact funding amount, patents, revenue, customer commitments, and performance economics remain undisclosed. A further financing round should be tied to independent process metrics and customer evidence rather than only additional laboratory milestones.
"""
