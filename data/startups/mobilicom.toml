dual_use_description = "Mobilicom's core technologies demonstrate substantive dual-use merit. Encrypted SkyHopper datalinks, mesh networking, and OS3 cybersecurity are purpose-built for military unmanned systems but have clear commercial applications: autonomous logistics drones, critical infrastructure inspection (power grids, pipelines), maritime robotics, and last-mile delivery systems in contested spectrum environments. The company explicitly markets commercial drone fleet management and industrial robotics cybersecurity alongside defense solutions. Unlike many dual-use claims, this reflects genuine product reuse rather than theoretical spillover—the same certifications (NDAA, Blue UAS) that enable military sales also serve as credibility signals for enterprise customers managing sensitive operations. Risk vectors include export controls on encryption technology and potential constraints on datalink frequency bands for commercial aviation applications."
