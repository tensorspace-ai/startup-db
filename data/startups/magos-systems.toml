name = "Magos Systems"
description = "Israeli security-technology company developing ground-based and drone-detection radars, AI analytics, and integrated command-and-control software for outdoor perimeter protection. Its primary market is commercial and critical-infrastructure security, with credible adjacency to military-installation, homeland-security, and counter-UAS missions."
detailed_description = """Magos Systems develops a perimeter-security stack built around high-resolution ground-based radar sensors and the MASS AI software platform. The company describes its current SR-series as C-band, high-resolution MIMO digital beam-forming radars with no moving parts, low power consumption, and detection ranges from approximately 150 meters to 1 kilometer depending on model and target. Its software combines radar tracks with PTZ-camera video, AI-based target classification, and integrations into video-management, access-control, PSIM, C4I, and other command systems. The product is intended to detect, track, and classify people, vehicles, boats, drones, and animals in outdoor environments where lighting and weather can degrade cameras.

The commercial problem is persistent perimeter monitoring without overwhelming operators with nuisance alarms. Magos targets substations, solar farms, power plants, refineries, data centers, airports, seaports, correctional facilities, water-treatment sites, farms, and other large or remote sites. Radar gives a wide-area movement-detection layer and can cue a camera for visual verification; the MASS AI workflow is designed to classify the event and pass a smaller set of actionable alerts to existing security operations. This is an integration-led sale rather than a standalone sensor sale: installation geometry, camera compatibility, network and power availability, site-specific clutter, and the customer's existing VMS or PSIM materially affect deployment economics.

Magos presents evidence of an established commercial footprint rather than a laboratory-stage product. Its current website claims more than 15 years of perimeter-security experience, deployments in more than 50 countries, more than 50 third-party integrations, and support for more than 250 PTZ cameras. Those are company-reported traction signals, not independently audited revenue or retention data. A 2018 Security Industry Association profile also described deployments in more than 20 countries and explained that the underlying radar technology had been adapted from government and military development for commercial use. The record therefore supports released products and international channel activity, but not a confirmed funding round, customer concentration, contract value, gross margin, or repeat-purchase rate.

Competition comes from established perimeter-radar and intrusion-detection vendors, camera-centric security platforms, fence and fiber sensors, and larger defense-electronics companies that can bundle sensing with broader site-protection contracts. Magos can differentiate where buyers value compact low-power sensors, wide-area tracking, integration with installed cameras, and all-weather operation without replacing the entire security stack. Its claimed technical advantages are meaningful but require site-level validation: false-alarm rates, probability of detection, performance in vegetation and clutter, drone classification, cybersecurity, electromagnetic coexistence, and maintenance burden are more decision-useful than marketing claims such as zero false alarms.

The defense and national-security case is credible but should remain bounded. The same radar tracking, classification, sensor fusion, and camera-cueing capabilities can support military-base and border-area perimeter awareness, critical-infrastructure protection, and counter-UAS warning. They are not evidence of a weapons system, battlefield-proven capability, or government procurement. Magos is best understood as a private dual-use security-sensing startup with a commercial core and potential defense-channel expansion; diligence should seek verified deployments, certifications, export-control posture, cyber-hardening evidence, and proof that performance transfers from commercial sites to contested or adversarial environments."""
