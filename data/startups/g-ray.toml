name = "G-ray"
description = "G-ray is a Modi'in, Israel defense-tech startup founded in June 2026 to develop high-power electromagnetic interception systems for countering unmanned aerial systems. Its core proposition is a non-kinetic C-UAS effect that uses proprietary electromagnetic sources to disable drone threats, with potential applications in military, homeland-security, and civilian critical-infrastructure protection."
detailed_description = """
**Product and the concrete problem it addresses.** G-ray is developing a directed-energy counter-UAS capability for a threat environment in which inexpensive drones can be fielded in large numbers, fly autonomously or with limited radio emissions, and impose an unfavorable cost exchange on conventional air defense. A defender that answers every small drone with a missile, gun round, or expensive interceptor can exhaust magazines and budgets before the attacker exhausts its inventory. Radio-frequency jamming is also not a universal answer when a drone is autonomous, uses an unusual link, follows a preplanned route, or relies on a communication method that is difficult to detect or disrupt. The public Startup Nation Finder profile describes G-ray as an Israeli startup focused on High-Power Electromagnetic systems that counter unmanned aerial systems without kinetic projectiles. The intended product is therefore not a drone airframe or a general electronic-warfare consultancy; it is an electromagnetic defeat layer aimed at disabling the electronics of a hostile UAS. The profile does not disclose a product name, vehicle configuration, range, target class, engagement doctrine, or whether G-ray is building a complete sensor-to-effect chain or an effector for integration into a broader C-UAS architecture.

**Core technology and how it is expected to work.** G-ray's only public technical description says that it is developing proprietary high-power electromagnetic sources in-house. That wording supports a careful description of the technical direction, but not claims about a completed weapon. In a high-power-microwave or related HPM system, stored electrical energy is converted into a short, intense electromagnetic pulse or waveform, shaped and directed through an antenna, and coupled into vulnerable circuits, wiring, sensors, or control electronics on a drone. The desired outcome may be a temporary upset, loss of control, forced landing, or permanent disablement, depending on waveform, field strength, target design, distance, aspect, and the susceptibility of the target electronics. A deployable system also needs high-voltage power conditioning, pulse generation, thermal management, antenna and beam-control hardware, electromagnetic compatibility engineering, safety interlocks, and a control interface that can accept a track from radar, electro-optical, RF, or other sensors. None of those implementation details is publicly attributed to G-ray, so they are engineering requirements for the category rather than confirmed company features. The relevant technical validation bar is demanding: repeatable effects against representative drone electronics, precise target discrimination, controlled collateral emissions, operation under weather and clutter, and safe integration with friendly communications and civilian spectrum.

**Market, customers, and go-to-market.** The addressable market is shaped by urgent demand for affordable, layered counter-UAS defense at military bases, maneuver units, border sites, airports, ports, energy facilities, water infrastructure, and other locations where drone incursions can create safety or security consequences. The Finder profile classifies G-ray as B2B, lists defense, safety and security, and government or city customers as target markets, and places the company in aerospace, defense, and homeland security. Those fields imply a government and prime-integrator route to market rather than direct consumer sales. A plausible first wedge is to supply an HPM effector or subsystem to an established C-UAS integrator that already owns detection, command-and-control, safety certification, and procurement relationships. Another path would be fixed-site protection for critical infrastructure, where a reusable non-kinetic effect could complement conventional interceptors and electronic warfare. The company may ultimately need to prove that its system can be transported, powered, maintained, and safely operated by ordinary personnel rather than only by laboratory specialists. Public sources do not identify a customer, design partner, pilot, contract, or government evaluation, so the commercial model remains an architecture and procurement hypothesis.

**Traction, financing, and third-party validation.** G-ray is exceptionally early. Startup Nation Finder's full profile identifies a June 2026 founding date, an Israeli corporate identifier, a Modi'in-Maccabim-Re'ut address, four employees, an R&D product stage, and a pre-funding status with no disclosed rounds. The same profile names Ilan Guttmann as a visible team member, but does not provide a complete founder roster, executive biographies, financing history, patents, awards, or customer evidence. This is meaningful ecosystem verification that a currently active Israeli entity exists, but it is not evidence that an operational HPM system has been built or tested. The external public record validates the category rather than the company: the U.S. Department of Defense has described high-power microwaves as a promising counter-UAS approach; U.S. Army materials document live-fire testing of an HPM system against UAS; and the Government Accountability Office describes directed energy as an active defense-development area. Those sources establish serious buyer demand and technical relevance, not G-ray performance. The correct diligence posture is to treat G-ray as an identified pre-funding R&D company with strong strategic fit and very limited company-specific proof.

**Founders and team.** The public record is too thin to make a reliable team-quality claim. Finder identifies Ilan Guttmann as a visible team member and supplies the company's exact employee count in its machine-readable profile, but it does not disclose his role, prior employers, military background, academic specialization, or whether he is a founder. A high-power electromagnetic defense system requires a multi-disciplinary team spanning pulsed-power engineering, RF and microwave design, antennas, electromagnetic effects, embedded control, target vulnerability, safety engineering, and defense-program execution. It also requires people who can translate a laboratory source into a ruggedized system with predictable maintenance and a customer-acceptable integration boundary. G-ray may possess that capability, but no public source reviewed here establishes it. This missing information is itself a diligence risk, not a reason to invent biographies. The immediate questions are who owns the HPM source IP, whether the team has previously taken RF or directed-energy hardware through field tests, how many engineers are active beyond the Finder count, and whether the company has access to a safe test range, pulsed-power facilities, and qualified defense partners.

**Competitive dynamics and potential edge.** G-ray faces powerful incumbents and substitute approaches. Epirus's Leonidas and Raytheon's PHASER represent established HPM directions; the U.S. Air Force Research Laboratory's THOR demonstrates government investment in counter-swarm microwave effects; and Lockheed Martin's MORFIUS X-Rotor represents an airborne one-to-many HPM approach. Israeli primes Rafael, Israel Aerospace Industries, and Elbit Systems can combine radar, electro-optical sensing, electronic warfare, hard-kill interceptors, and command-and-control under existing procurement relationships. Non-HPM alternatives include RF takeover or protocol manipulation, broadband jamming, lasers, guns, interceptor drones, and conventional missiles. G-ray's plausible edge is not currently a published specification; it is the possibility of a compact, affordable, Israeli-designed source or subsystem that can be integrated into a layered defense architecture and deliver a favorable cost-per-engagement against multiple small targets. That edge would be meaningful only if the company demonstrates effects at useful distance, manageable power and cooling requirements, compatibility with existing C2, and a reliable safety envelope. In the absence of test data, patents, or an announced partner, the differentiation remains a thesis rather than a moat.

**Defense, security, and resilience dual-use relevance.** G-ray meets the database's dual-use threshold because its core electromagnetic-effect technology has both military and civilian protection applications, even though its present product direction is defense-first. Militaries could use it to protect bases, logistics nodes, ships, maneuver forces, and airfields against drone incursions or swarm attacks. Homeland-security and civilian infrastructure operators could use a non-kinetic layer around airports, ports, energy plants, water facilities, government campuses, and large public venues, subject to spectrum, aviation, safety, and legal approvals. A reusable electromagnetic effect could reduce dependence on finite interceptor magazines and may be especially valuable when the defended site faces repeated low-cost attacks. The strategic case is also tied to resilience: a locally developed C-UAS subsystem can strengthen allied supply chains and reduce dependence on a single foreign provider. The calibration is decisive. There is no public evidence of an IDF contract, military deployment, government trial, export authorization, or fielded G-ray capability. HPM itself has limitations around range, line of sight, target vulnerability, collateral electromagnetic effects, and power infrastructure. G-ray's dual-use status is therefore credible at the technology and mission level, not demonstrated at the deployment level.

**Growth stage, trajectory, and key diligence risks.** G-ray is classified as early stage because it was founded only in June 2026, remains in R&D, has four publicly listed employees, and is pre-funding according to Finder. Its upside depends on converting an important but technically difficult category into a compact, safe, testable, and procurable product. The next milestones should be concrete: identify the source architecture and IP position; complete controlled tests against representative commercial and military-relevant drone electronics; publish or privately provide range, probability-of-effect, false-engagement, and collateral-emissions data; demonstrate integration with a sensor and C2 stack; secure a funded pilot or design partner; and establish a manufacturing and sustainment plan. The principal risks are (1) pulsed-power and thermal complexity preventing a small system from achieving useful effect; (2) target hardening, shielding, autonomy, and waveform diversity reducing effectiveness; (3) line-of-sight, weather, clutter, and safety constraints narrowing the engagement envelope; (4) long government qualification and export-control cycles; (5) competition from substantially better-funded HPM, laser, RF, and prime-contractor programs; (6) unknown team depth and test infrastructure; and (7) the possibility that G-ray is an entity at the registration and concept stage rather than a funded operating startup. G-ray merits close strategic monitoring, but the current evidence supports a high-risk early R&D signal, not a conclusion about fielded capability or commercial readiness.
"""
