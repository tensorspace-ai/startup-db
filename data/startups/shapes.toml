name = "Shapes"
description = "Israeli B2B HR software company, formerly DreamTeam, building an AI-enabled modular PeopleOS for workforce data and people operations."
detailed_description = """Shapes is the current brand of DreamTeam HR Apps Ltd., the Israeli private company behind a cloud HR platform. The company traces its operating start to 2022, when Arnon Nir and Shirley Baumer began with a recruiting product under the DreamTeam name; the legal entity was registered earlier, in 2021. After the recruiting product encountered a weaker market, the founders say they pivoted in late 2022, rebuilt around a broader people-operations platform during 2023, and launched that product in 2024. The company rebranded as Shapes in December 2025. Nir and Baumer were early members of monday.com’s founding team, and the company says its product experience at monday influenced its platform approach. This is a founder-reported account, not a verified product history or audited record.

The product combines employee profiles, reporting lines, documents, time off, attendance, approvals, onboarding, performance reviews, surveys, compensation workflows, people analytics, and employee self-service. Shapes positions the underlying employee data as a shared system of record: a manager or employee can use a prompt or agent to access a company policy, request leave, create a workflow, or build a tailored view. Current product and contract materials describe modular applications, AI agents, a proprietary SDK for customer-built analyses and pages, and integrations. Its terms say customers can select third-party AI models through MCP; Shapes also states that neither it nor its AI providers train base models on customer data. Those are company descriptions and contractual representations. They do not establish model quality, safe behavior, the security of each integration, or independent certification scope.

The commercial model is B2B cloud software sold by employee seat. The current public pricing page lists Core at $8 and Plus at $12 per seat per month when billed annually, with add-on applications priced separately and a minimum subscription. Plus includes additional identity, legal-entity, backup, webhook, and implementation features. Public pricing provides a useful packaging signal but does not reveal average contract value, negotiated rates, services revenue, or gross margin.

In December 2025 Shapes and Israeli technology media reported hundreds of customers across 14 industries and 79 countries; Geektime attributed to the CEO that these were paying customers. Named customers in CTech coverage include Quantum Machines, NextSilicon, Healthee, Arena Entertainment, and Imagen. Shapes’ current site carries a Quantum Machines testimonial claiming that HR operations saved an hour a day. These are meaningful customer signals, but the customer count and testimonial are company-supplied or reported from management, and no contract values, retention cohort, independent deployment count, or reference interview was found. CTech reported 21 employees in Israel in December 2025 and quoted a plan to reach about 45 by the end of 2026; that future hiring target is not a verified current count. The company’s app listing shows continued product updates in 2026.

Shapes handles highly sensitive workforce records, including job history, compensation, attendance, performance, and employee documents. The privacy policy describes its processor role for customer employee data, subprocessors and data transfers, and security controls; its marketing page says it is SOC 2 Type II certified. Publicly accessible audit scope and a third-party assurance report were not found. The terms disclaim guarantees of AI output accuracy and place responsibility for decisions on customers, so enterprise adoption will depend on review controls, audit logs, access separation, retention/deletion, model-provider controls, and clear boundaries between assistance and employment decisions. The current product claims potential applications such as attrition and burnout analysis, which increases the need to test fairness and prevent inappropriate employment decisions.

The legal entity and product remain active based on the current company site, customer terms, help materials, and 2026 app updates. Israeli legal and operating evidence includes company number 516324100 and a Tel Aviv address. A company LinkedIn profile also lists New York as its headquarters, while media and legal materials identify Tel Aviv; the location discrepancy is retained for diligence rather than collapsed into a false certainty."""
