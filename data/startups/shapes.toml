investible = false
investment_rationale = """Shapes has a credible enterprise software proposition: it joins employee records with configurable workflows, offers a per-seat subscription, and has reported hundreds of customers across multiple countries. Its founders bring directly relevant experience building a configurable work-management platform at monday.com, and its 2025 announcement named a $15 million Series A within $24 million of Seed and Series A funding. Those are stronger early signals than a product concept alone. The ability to combine data, workflow and AI customization could reduce tool fragmentation for growing organizations if the product proves reliable and easy to govern.

The available record does not support an investment conclusion. Customer counts and time-savings are company-supplied or management-reported; the CEO’s description of sales growing to “a few million dollars” does not identify a period or accounting basis and is not an ARR disclosure. No exact revenue, retention, churn, gross margin, customer acquisition cost, payback, customer concentration, cash runway, or valuation was found. The round’s investor list is public, but valuation, dilution, governance and current ownership percentages are not. Competing platforms are already adding AI and automation. Sensitive employee-data handling and employment-decision exposure make security, fairness, audit and human-review diligence central. The internal investible flag is therefore false pending customer references, clean cohort economics, valuation and independent security evidence; it is not a recommendation."""
strategic_value = """Shapes is an Israeli enterprise-software company building a horizontal layer around employee records and work processes. If the platform becomes a dependable system of record, it could be valuable to HR teams that need to adapt workflows across offices without commissioning a large custom implementation. Its modular product and agent interfaces may also make it useful to HR-software, payroll, identity, document and business-workflow partners that want a configurable people-data layer. Those are strategic possibilities, not announced integrations or acquisition interest.

For Israel, Shapes represents a locally registered SaaS business with a Tel Aviv operating base, a product team and a global commercial ambition. Its reported customer footprint reaches beyond Israel, and its public pricing places the offer within the broad market for growing companies. The company’s strategic leverage will depend on maintaining a high-quality employee-data model, secure integrations, localized workflows and dependable customer support as its geographic footprint widens. No public evidence indicates defense procurement, critical infrastructure deployment, government ownership, or national-security use. Its strategic relevance is commercial enterprise software, not a defense thesis."""
