competitors = ["HiBob", "Workday", "Rippling"]
competitive_edge = """Shapes’ proposed edge is configurability: it markets modular HR components, prompt-built views and apps, and agents that can act across a company’s people data. The public Core and Plus plans start at $8 and $12 per employee per month, with implementation and controls tiered, and the company claims a quick SaaS rollout. If the product allows customers to alter policies and workflows without custom development, that could appeal to fast-changing mid-market organizations. Its founder experience at monday.com is relevant to making configurable enterprise software usable, though it does not prove product-market fit or a durable technical moat.

HiBob already combines core HR, time and attendance, talent, surveys, compensation, payroll connections and workforce planning. Workday offers a much broader global HCM suite, enterprise reach, analytics and an active AI-agent roadmap. Rippling competes on a unified employee record spanning HR, payroll, IT and workflow automation. These incumbents have larger ecosystems, implementation histories, local compliance capabilities and customer references. Shapes’ distinction is its claimed flexibility and prompt-driven customization; the competitive gap narrows as incumbents add agents. No public benchmark establishes lower implementation cost, superior accuracy, better retention, or stronger outcomes. Diligence should compare live workflow-build time, integration depth, permission controls, payroll scope, data portability, error rates, support load and renewal behavior against the systems customers would otherwise buy."""
