name = "Neli Microturbines"
description = "Neli Microturbines is an Israeli deep-tech startup developing metal-additively-manufactured micro-gas turbines for compact propulsion and distributed power, with public positioning toward drones, robots, and energy applications. Its low-lubrication, high-specific-power design thesis could serve both autonomous platforms and resilient off-grid systems, but product performance and customer deployments remain unverified publicly."
detailed_description = """
**Product and the concrete problem it solves.** Neli Microturbines is working on compact gas-turbine hardware for applications where conventional electric batteries, piston engines, or larger turbine systems can be constrained by energy density, refueling time, size, or manufacturing complexity. The company’s newest public website summarizes its proposition as a complete jet engine printed as a single part, with no castings, assembly line, or conventional supply chain. Its IVC profile separately describes printed micro-gas turbines intended to power next-generation drones and robots, emphasizing high energy density, rapid refueling, and rugged simplicity. Startup Nation Finder describes a parallel distributed-power thesis: small oil-free turbines for decentralized electricity generation, industrial energy recovery, microgrids, remote facilities, and combined heat and power. These descriptions may represent multiple product directions or a changing go-to-market narrative; public information does not yet establish whether the propulsion engine and generator are one platform, distinct configurations, or separate development tracks. The underlying customer problem is nevertheless clear: unmanned aircraft and mobile robots need compact power with useful endurance and fast turnaround, while remote sites and critical loads need dispatchable electricity without depending entirely on a long grid connection or heavy battery inventory.

**Core technology and how it works.** A gas turbine generally compresses incoming air, mixes it with fuel, burns the mixture, and expands the hot gas through a turbine stage to produce shaft power; the shaft can drive a propulsor or generator depending on system configuration. Neli’s stated engineering thesis is to redesign this machinery for metal additive manufacturing rather than simply print a conventional turbine component. Its official site claims a complete engine can be produced as a single printed part, while IVC characterizes the designs as purpose-built for additive manufacturing. A company job posting provides more concrete evidence of the manufacturing work: it sought an engineer to operate metal powder-bed-fusion processes such as SLM, DMLS, or laser powder-bed fusion, work with alloys including Inconel, titanium, aluminum, and steel, and own heat treatment, hot-isostatic pressing, surface finishing, machining coordination, dimensional validation, and repeatability. This is important because printing alone does not make a turbine production-ready; high rotational speeds, thermal gradients, combustion, and tight clearances demand validated materials, post-processing, balancing, inspection, and endurance testing. Finder also describes air-bearing technology and high-speed permanent-magnet generators for an energy-conversion product, but those specifications are ecosystem-profile claims rather than public test data or a disclosed engineering datasheet. No reviewed source reports thrust, power output, specific fuel consumption, efficiency, turbine speed, operating life, or environmental qualification.

**Market, customers, and go-to-market.** Neli’s most differentiated stated market is the propulsion and power subsystem layer for drones and robotic platforms. IVC identifies drones, robotics, defense, energy, and autonomous mobility as target markets, and public hiring material sought a mechatronics engineer to integrate a turbine-based generator with UAV platforms, flight controllers, sensors, and power electronics, then move prototypes toward field testing. Those roles indicate an effort to make the core turbine usable inside a complete platform, not merely to sell a printed engine as a standalone component. Potential customers include drone and robotics OEMs that need more endurance or faster refueling than batteries provide, as well as integrators building systems for remote or contested operations. For the distinct stationary-power direction described by Finder, likely buyers would instead include remote industrial operators, microgrid developers, and sites recovering waste heat. These are target-market interpretations, not confirmed accounts: the company has not publicly named a customer, signed production agreement, order, or commercial pilot. A component or OEM route could lower the burden of building full vehicles and generation sites, but it makes adoption dependent on integration testing, qualification, supply assurance, and a customer's willingness to redesign around an early supplier.

**Traction, financing, and third-party validation.** Public records place Neli in an unusually early stage. The Israeli company registry aggregator CheckID identifies NELI MICROTURBINES LTD as an active private Israeli company incorporated on August 25, 2025, at an address in Pardes Hanna-Karkur. Startup Nation Finder records an August 2025 founding, 1–10 employees, a pre-funding status, and no announced financing rounds; IVC lists five employees, R&D stage, and a May 2026 non-equity assistance entry. The IVC profile also identifies the company in the Spring 2026 Ignite DeepTech cohort, whose organizer publicly named Neli and its founders among ten early-stage Israeli deep-tech teams. Public job listings are another modest but useful signal: they describe open engineering needs in metal additive manufacturing and UAV power integration, while also showing that validation and pre-production work are still active priorities. These sources support the existence of a staffed, technically focused venture and real engineering activity, but do not establish a completed engine, independent test result, production yield, customer deployment, revenue, or priced venture round. The distinction matters: accelerator selection and hiring help validate ecosystem participation, not turbine performance or commercial readiness.

**Founders and team background.** IVC identifies Ariel Dor as CEO and co-founder, with a previous co-CEO role at Foresight Autonomous, and Avy Lousky as COO and co-founder, previously VP of R&D and Engineering at Reshef Tech. Ignite DeepTech’s public cohort announcement independently names Ariel and Avy as the Neli founders, and Avy’s response describes the company’s ambition across microturbines and aerospace. Those backgrounds suggest a mix of company-building, engineering leadership, and autonomous-systems context, though the accessible evidence does not provide detailed biographies, turbine-specific prior work, university credentials, or the rest of the technical team. A company at this stage needs a multidisciplinary group spanning turbomachinery, combustion, additive manufacturing, materials science, instrumentation, control electronics, flight or generator integration, and quality systems. Hiring for metal AM, post-processing, test design, and UAV integration indicates that at least some of these needs are recognized. Diligence should establish who owns compressor and turbine aerodynamics, hot-section design, combustion stability, control laws, safety analysis, and independent test sign-off, rather than assuming that broad engineering experience alone covers a highly specialized field.

**Competitive dynamics.** Neli competes against both alternative turbine architectures and substitute powertrains. PBS Aerospace develops compact turbojet and turboprop engines used in unmanned aircraft, while JetCat supplies small turbines in the model and unmanned-aircraft ecosystem; both represent established miniature propulsion approaches. Turbotech develops lightweight turbine engines and hybrid-electric aviation systems, and Honeywell and other aerospace suppliers have deep experience with auxiliary power units and compact gas turbines. For stationary generation, Capstone Green Energy is a relevant microturbine incumbent with commercial products and service experience. Battery-electric propulsion remains a strong substitute for smaller drones because it is mechanically simpler, quieter, and easier to operate, while piston engines and hybrid systems can offer lower acquisition costs in longer-endurance aircraft. Neli’s potential differentiation is the combination of additive-first geometry, compact turbine power density, reduced assembly complexity, rapid refueling, and manufacturing localization. Those are design objectives rather than measured competitive advantages. A meaningful comparison requires same-mission data on installed mass, endurance, fuel use, thermal and acoustic signatures, operating altitude, start time, maintenance intervals, cost per flight hour, and reliability under dust, vibration, salt, and temperature extremes.

**Defense, security, and resilience relevance.** The dual-use case is credible because the core technology is a compact turbine and power-generation capability, rather than a narrowly civilian software product. Small turbine engines can support longer-range or longer-endurance unmanned aircraft, rapid battery-free turnaround, and mobile robotic systems when payload, route, or field logistics make batteries unattractive. The same integration work can apply to inspection drones for power lines and pipelines, search-and-rescue aircraft, wildfire monitoring, maritime surveillance, emergency communications relays, and other remote sensing missions. A turbine generator could also provide dispatchable power to isolated infrastructure or mobile command, medical, and logistics sites, if the generator configuration described by Finder is developed and validated. The company itself has described its work in a defense deep-tech hiring notice, and its IVC profile includes defense among target markets; these are explicit market signals, not evidence of a military contract, classified program, or operational fielding. Military utility would depend on signature management, fuel availability, secure controls, maintenance demands, export eligibility, and the ability to operate reliably in harsh environments. Civilian resilience is similarly conditional on emissions, noise, safety, and service economics. The strategic fit is therefore meaningful but prospective: compact, refuelable energy conversion can improve autonomy and local power, yet no defense-specific capability should be attributed to Neli as proven today.

**Stage, trajectory, and diligence risks.** Neli is best classified as early-stage R&D, with public evidence of company formation, a small team, accelerator participation, and active hiring but no publicly verified commercial product or financing round. Near-term progress depends on demonstrating a repeatable turbine build, publishing independent bench-test results, and showing that post-processed printed parts meet fatigue, thermal, dimensional, and safety requirements. The most important diligence questions are: (1) whether its one-piece printed-engine claim refers to an integrated rotating assembly or a printed engine structure that still requires conventional components; (2) which specific product is being prioritized, propulsion, power generation, or both; (3) what performance, fuel, operating-life, and maintenance targets have been achieved rather than planned; (4) how much qualification and rework are needed after printing; (5) whether UAV or stationary customers will pay for the advantages after integration costs; and (6) how the company will protect design IP, secure specialist suppliers, and finance testing and certification. Metal additive manufacturing can enable complex passages and part consolidation, but turbine economics still depend on expensive materials, quality assurance, test infrastructure, and production consistency. Until Neli discloses measured performance, customer evidence, and its financing runway, it should be viewed as a strategically relevant Israeli hardware venture with high technical and commercialization risk, not as a validated propulsion or energy supplier."""

