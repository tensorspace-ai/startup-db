name = "NightDragon"
description = "NightDragon is a U.S.-controlled investment and advisory firm focused on growth and late-stage SecureTech companies across cybersecurity, defense, artificial intelligence, quantum, safety, security, and privacy. Its NightScale platform adds operating support, industry relationships, and government-market guidance to capital deployment."
detailed_description = """NightDragon is a specialized venture-capital and advisory platform rather than a software or hardware startup. Founded by Dave DeWalt, the firm deploys growth and late-stage capital into SecureTech companies and works with management teams on scaling. Its stated scope includes cybersecurity, defense, artificial intelligence, quantum, autonomous and dual-use systems, physical security, public safety, and privacy. The company’s own materials describe a platform built around capital, connections, influence, and operating experience; the relevant product is therefore the firm’s investment judgment and value-creation infrastructure, not a proprietary technical system sold to end users.

The main operating mechanism is NightScale. The platform combines a network of more than 100 advisors and senior industry contacts with playbooks and programs for talent, go-to-market execution, marketing, government services, and strategic partnerships. This is commercially relevant because SecureTech companies often need help translating technically credible products into enterprise, channel, and public-sector sales. NightDragon’s website lists 18 current portfolio companies, including examples in quantum software, satellite synthetic-aperture radar, RF geospatial intelligence, directed energy, autonomous defense systems, edge AI infrastructure, cloud security, supply-chain resilience, and emergency-response data. Those examples show a broad but coherent security-and-mission focus, not a single technology stack.

The firm’s market position is that of a specialist growth investor competing with sector-focused venture funds, strategic investors, growth-equity firms, and generalist funds with dedicated defense or cybersecurity practices. Its differentiation is the combination of late-stage capital, operating executives with cybersecurity and technology-company experience, public-sector and national-security relationships, and a formal platform for portfolio support. NightDragon announced the close of its $750 million Growth I fund in 2021, and its later public materials continue to describe active investment and advisory work. Those are meaningful traction signals for institutional scale, but they do not by themselves establish current assets under management, realized fund returns, portfolio-company revenue, or the performance of any individual investment.

NightDragon is strategically relevant to defense and national security because it can help move commercially developed SecureTech into government and mission markets, and because several current portfolio companies have direct defense or intelligence applications. Its Tel Aviv office, opened in 2023, gives the firm a stated bridge into Israel’s cyber and defense ecosystem, while its San Francisco headquarters anchors access to U.S. technology and capital networks. The strategic case is consequently indirect: NightDragon is an ecosystem intermediary and capital allocator whose importance depends on the quality of its portfolio, follow-on support, government-market access, and ability to manage cross-border compliance. It should not be mistaken for a defense contractor, a government supplier, or evidence that every portfolio company has military adoption."""
