name = "Electreon"
description = "Electreon Wireless Ltd. develops and deploys dynamic and stationary wireless EV-charging systems that transfer power from road- or ground-embedded coils to vehicle receivers while vehicles drive, stop, or park. Its primary commercial focus is fleet and transport infrastructure where charging uptime, battery size, and route utilization matter more than consumer convenience alone."
detailed_description = """
Electreon builds a full wireless charging stack rather than selling a single charging pad. Its system uses magnetic induction between grid-connected management units, copper coils embedded below asphalt or concrete, and an underbody receiver that delivers energy to the vehicle battery or drivetrain. The company currently presents three operating configurations: LINE for dynamic wireless power transfer at road speed, DASH for short top-ups at frequent stops, and DOT for parked or depot charging. Its Flow software provides monitoring, control, alerts, and operational visibility across the vehicle and road infrastructure. This combination makes the product an infrastructure-and-fleet integration program with electrical, civil, vehicle-integration, software, and maintenance requirements.

The strongest customer case is a high-utilization fleet with predictable routes and expensive downtime: buses and BRT, delivery vans, port and airport vehicles, industrial autonomous vehicles, and heavy trucks on selected corridors. Wireless charging can add energy without a plug-in stop, reduce the battery capacity needed for a duty cycle, keep depots and passenger platforms free of cables, and spread demand across time and locations. Those benefits are economically meaningful only when route utilization, civil works, electricity pricing, vehicle compatibility, and asset ownership align. Conventional depot chargers and increasingly capable fast-charging networks remain simpler substitutes for many fleets, so Electreon must sell a lower whole-system cost or a level of uptime that alternatives cannot match.

Public evidence indicates commercialization beyond laboratory validation but not yet frictionless scale. Electreon lists projects and demonstrations across Israel, the United States, France, Germany, Italy, Norway, Portugal, and other markets, including a 24/7 Israeli bus depot, the Detroit wireless road and UPS/Xos delivery-van work, Trondheim BRT, an autonomous industrial-vehicle route in Portugal, and France’s A10 wireless-road program. Its 2025 interim report also records project agreements with Electra Afikim, ATLoS, and Strabag. In March 2026 the company reported completing its acquisition of InductEV, bringing ultra-fast stationary wireless charging assets and commercial deployment experience into the group. These are useful traction signals, but project announcements are not the same as recurring revenue, positive cash flow, or proven national-scale deployment; those points require current filings and customer-level diligence.

Electreon became a public company in 2018 and trades on the Tel Aviv Stock Exchange under ELWS. That status changes the diligence frame: governance, liquidity, dilution, reporting quality, acquisition integration, and the path to sustainable margins matter alongside technology. The company’s 2025 interim reporting disclosed a business-focusing plan involving workforce reduction and lower operating and management expenses, which is a material signal of financing and execution pressure even if it may improve discipline. Strategically, its technology is relevant to resilient fleet electrification and potentially to defense logistics or autonomous ground systems operating on fixed routes or controlled sites. The dual-use case is credible at the architecture level, but military adoption would require ruggedization, electromagnetic-compatibility and safety validation in the relevant environment, secure control interfaces, deployable infrastructure options, and a procurement path; no public evidence here establishes a defense contract or operational military deployment.
"""
