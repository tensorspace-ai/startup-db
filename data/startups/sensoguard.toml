name = "SensoGuard"
description = "SensoGuard is an Israeli physical-security company that develops buried seismic and unattended ground-sensor systems for detecting people, vehicles, digging, and other perimeter intrusions before they reach protected assets. Its commercial and military product line combines hidden sensing, adaptive signal processing, wireless deployment, and AI-assisted camera verification for borders, critical infrastructure, energy sites, and private properties."
detailed_description = """
**Product and the problem it solves.** SensoGuard addresses the blind spots of conventional perimeter security: a camera may lose visibility in darkness, weather, foliage, smoke, or a line-of-sight obstruction, while a fence sensor only reports contact with the fence and can be bypassed by tunneling, climbing, or approaching from open ground. The company's core proposition is early warning from sensors buried around an asset, where footsteps, vehicle movement, digging, drilling, cutting, and related ground vibrations can be detected before an intruder reaches a fence, building, or restricted zone. The public product family covers different deployment contexts. Seismic Shield is positioned for private and commercial properties; Seismic Shield Pro adds larger-site and critical-infrastructure capabilities; MOSS is a portable or temporary unmanned-ground-sensor kit for tactical and military use; and OutWatch uses AI-based alarm verification with existing IP cameras. This is a coherent product architecture rather than a single sensor SKU: the seismic layer detects and classifies a possible event, the camera layer can verify it, and the operator receives a more actionable alert. SensoGuard reports 65,000-plus sensors deployed across more than 25 countries and more than 12 million square meters protected, although these headline figures are company-reported and should be independently diligence-checked.

**Core technology and how it works.** SensoGuard's technical claim is a distributed sensing system that converts small ground vibrations into classified security events. Its public materials describe buried sensors with embedded digital signal processing, adaptive algorithms that account for environmental vibration, adjustable detection parameters, and object or activity recognition for people, vehicles, digging, drilling, cutting, and explosions. Sensor nodes can be installed underground and connected through wired or wireless receivers; the wireless unattended-ground-sensor material emphasizes concealed placement, long transmission range, open-platform connectivity, and the ability to trigger thermal or optical cameras. The Seismic Shield technical specification describes a sequence of seismic sensing, threat classification, AI camera verification, and verified alert delivery. The company says its equipment is designed for harsh conditions, including IP68 protection and MIL-STD-810G compliance, while the technical specification identifies a patent-protected two-layer system. The About page identifies US Patent No. 10,878,674 B2, covering energy-efficient seismic intrusion detection, and US Patent No. 11,250,691 B2, covering seismic intrusion detection with object recognition. These patents and specifications are meaningful evidence of an engineered platform, but they do not by themselves establish field accuracy across every soil type, climate, installation geometry, or adversarial tactic.

**Market, customers, and go-to-market.** The addressable market spans defense and homeland security, physical protection of critical infrastructure, remote energy, industrial facilities, transport sites, and high-value private property. SensoGuard's public product pages specifically name solar farms, data centers, prisons, utilities, airports, oil and gas sites, borders, military facilities, and residential perimeters as use contexts. The likely buying motion is project-led and channel-heavy: a site owner or government agency specifies a detection requirement, a security integrator designs the perimeter, and SensoGuard supplies sensors, receivers, software, and integration support. The company lists interoperability with video-management and security ecosystems including Axis, FLIR, Digifort, Milestone, mPrest, IDIS, NX Witness, and other platforms, which can reduce the cost of replacing an existing camera estate. This positioning gives SensoGuard several routes to market: direct defense and government procurement, specialist perimeter-security integrators, and commercial security installers. The tradeoff is that physical-security deployments require surveying, trenching or concealment, radio planning, calibration, maintenance, and acceptance testing. Long government cycles, site-specific engineering, and the need to prove low false-alarm rates can make revenue lumpy even when the underlying technology is differentiated.

**Traction, funding, and third-party validation.** SensoGuard's strongest public traction signal is not a venture-financing announcement but sustained deployment history. The official company account says SensoGuard was founded in 2012, began supplying more than 3,500 unattended ground-sensor systems to the Israeli Ministry of Defense from 2013, and has since supplied systems to more than 25 countries. Startup Nation Finder corroborates the 2012 founding, the aerospace-defense-homeland-security classification, the leadership team, and public references from 2019 and 2020 concerning border-security technology. SensoGuard's About page also reports Frost & Sullivan Product Leadership Awards in 2021 and 2022, while current official brochures and a March 2025 technical specification indicate that the product suite remains actively maintained. These are useful validation signals, but the record should distinguish them from independent performance trials: the deployment counts, protected-area figure, accuracy claims, and customer outcomes are primarily company or directory reported, and public sources do not disclose revenue, renewal rates, contract values, or a complete named-customer list. The reviewed public profiles describe SensoGuard as private and do not identify an institutional equity round. That absence is not evidence that no financing occurred; it means financing, capitalization, and shareholder structure remain diligence questions rather than facts to infer.

**Founders and team background.** The founding story is unusually relevant to the problem domain. SensoGuard identifies Tomer Levy as CEO and Ronen Amitai as COO and co-founder; the company says both founders spent more than 20 years developing seismic-sensor technology at Rafael Advanced Defense Systems before establishing SensoGuard. Startup Nation Finder lists Levy as CEO and CTO and Amitai as co-founder and COO, while its profile also identifies Moran Ben Yair in sales and marketing. This suggests a founding team combining deep sensing engineering, defense-system familiarity, and a commercial route into security markets. The company further states that its sensors are designed, assembled, and manufactured in Israel, which may support supply-chain control, configuration discipline, and exportable local production for sensitive customers. Public headcount data is thin: Crunchbase displays a 1-10 employee estimate, but that should not be treated as a current audited count because a hardware company may rely on contractors, manufacturing partners, regional integrators, or an incompletely maintained profile. The central team diligence questions are therefore the depth of the current firmware, algorithms, RF, field-service, and program-management bench; the extent to which the Rafael-derived know-how is documented and transferable; and whether the founders can scale international sales and support without weakening installation quality.

**Competitive dynamics.** SensoGuard competes with both direct sensing vendors and the incumbent combination of fence protection, CCTV, guards, and patrol response. Senstar and Fiber SenSys offer established perimeter-intrusion products based on fence vibration, buried sensing, and fiber-optic detection; Magal Security Systems sells broader integrated perimeter security with video, radar, fiber, and command-and-control; Southwest Microwave represents mature microwave and perimeter-intrusion approaches; and camera-analytics vendors can substitute for part of the verification workflow. SensoGuard's most credible edge is the combination of concealed ground sensing and threat classification before physical contact, especially where a customer needs detection beyond a fence line or in a remote, hard-to-light environment. Its second edge is integration: the company presents the seismic network as a trigger and verification layer that can work with existing IP cameras and video-management systems rather than requiring a fully proprietary command center. Its patents, adaptive signal processing, harsh-environment packaging, and founders' long experience may raise the replication cost. Still, this is not an absolute moat. Larger incumbents have deeper procurement channels, broader portfolios, and more installation capacity; video AI continues to improve; and every seismic deployment is exposed to local geology, traffic, animals, weather, construction noise, and calibration quality.

**Defense, security, and resilience relevance.** Dual-use relevance is direct because the same core sensor physics supports military unattended-ground sensing, border monitoring, and civilian protection of infrastructure and property. MOSS is explicitly positioned for tactical or temporary military deployments, while the company's stated Israeli Ministry of Defense supply history provides a concrete defense reference rather than a speculative adjacency. In civilian settings, Seismic Shield Pro can protect remote solar installations, utilities, data centers, prisons, and other sites where an intrusion, theft, sabotage attempt, or long response distance creates disproportionate consequences. The architecture can improve resilience in two ways: it extends awareness beyond a camera's field of view, and it can reduce operator overload by using classification and camera verification to prioritize a probable human or vehicle event over environmental noise. That matters for border and base security, but also for distributed energy and communications infrastructure that cannot be continuously staffed. The public record does not establish a specific currently fielded combat mission, classified deployment, or guaranteed defense performance, so the strategic assessment should remain bounded: SensoGuard is a credible enabling layer for perimeter awareness and early warning across defense and critical-infrastructure contexts, not a complete security solution or a substitute for response forces.

**Growth stage and diligence risks.** SensoGuard is classified as mature on product and operating history, not as a mature public company: it has an active website, a multi-product platform, more than a decade of stated operations, Israeli defense supply history, international deployments, and current technical documentation, but it remains private with limited public financial disclosure. The most attractive trajectory would be expansion from project-based perimeter deployments into repeatable integrator channels, recurring monitoring or analytics services such as OutWatch, and larger resilient-infrastructure programs where early warning has measurable avoided-loss value. Before assigning a higher confidence level, diligence should test eight points: (1) independent false-positive and detection-recall data across soil, weather, traffic, and animal conditions; (2) installation and maintenance cost per protected meter; (3) battery life, radio resilience, and performance under jamming or sensor tampering; (4) cybersecurity of receivers, camera integrations, and management software; (5) evidence for the claimed deployment and protected-area totals; (6) customer concentration, contract duration, and repeat orders; (7) export-control, procurement, and local-certification exposure; and (8) patent ownership, freedom to operate, current headcount, revenue, and financing. If those questions are answered favorably, SensoGuard could scale as a specialized sovereign-security and infrastructure-resilience platform. If not, it may remain a technically strong but installation-intensive niche supplier.
"""
