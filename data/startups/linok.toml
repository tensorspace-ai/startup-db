name = "Linok"
description = "Linok is an Israeli dairy-technology startup developing the MIKA-V1 plug-in sensor and analytics platform for real-time milk-quality monitoring and earlier detection of bovine mastitis indicators. Its strategic relevance is food-system resilience: continuous, farm-level information may help producers intervene sooner, protect herd health, and reduce avoidable milk losses, although independently verified detection performance and scaled deployments are not public."
detailed_description = """
**Product and the concrete problem it solves.** Linok develops a dairy-farm sensor and analytics system intended to make milk quality and animal-health signals visible during ordinary milking, rather than only after periodic lab tests or clinical symptoms. The immediate problem is mastitis, an inflammation of the udder that can reduce milk yield and quality, raise veterinary and labor costs, spread through herds, and lead to treatment or culling. Linok's current site markets its MIKA-V1 plug-and-play IoT sensor for real-time milk monitoring, subclinical-condition alerts, and farm-level recommendations. The company describes the system as capable of lowering antibiotic use through earlier identification; that is a company claim and should not be treated as a validated clinical outcome. A 2023 Yeshiva University profile described an earlier Linok concept for analyzing human breast milk and supporting nursing parents. Public information since then centers on bovine dairy operations. The record treats that as an evolution in the same venture, while noting that public sources do not explain the timing or commercial status of the earlier concept.

**Core technology and how it works.** The technical premise is to measure milk characteristics continuously and interpret their patterns as health and quality signals. Startup Nation Finder describes a small sensor for milk tanks that measures wavelengths in milk, with remote sensing, IoT, machine learning, and AI as the technology stack. A published 2026 international patent application assigned to Milksense Ltd, with Boaz Grof and Yaniv Oiknine named as inventors, adds detail: embodiments describe optical transmission or reflectance, spectral analysis, other possible modalities such as electrical or thermal measurements, processing through statistical, machine-learning, classifier, or rule-based models, and detection or prediction of mastitis indicators. A patent application documents claimed architecture and intended scope, not proof of performance or granted exclusivity. Linok's website identifies MIKA-V1 and says it meets 3-A Sanitary Standard 46-04, a relevant hygienic-design requirement for equipment used around milk; the public material reviewed does not provide a third-party certification listing, model-accuracy report, or field protocol. Calibration, cleaning, sensor drift, milk variability, and robust labeling of outcomes remain central engineering challenges.

**Market, customers, and go-to-market.** The initial customer is a commercial dairy farm, with possible channel partners including milking-equipment dealers, dairy service firms, herd veterinarians, and cooperatives. Linok's website presents a plug-in design, a demo request, and U.S. partner listings for Thomson Services, W.G. Dairy Supply, and IAS. These listings demonstrate channel-building activity, not confirmed customer deployments or sales. The product's practical value depends on integrating into existing milking and bulk-tank workflows with minimal downtime, supporting farm staff who may have little appetite for separate diagnostics, and producing alerts that improve decisions without overwhelming operators. Per-cow data are more actionable than a pooled-tank result, but the publicly described sensor is positioned around milk-tank analysis; buyers will need to understand how well it attributes a signal to a specific animal or herd event. Potential pricing could combine hardware and recurring analytics, but the company has not disclosed prices, margins, service terms, installation costs, or customer acquisition costs. The addressable opportunity spans Israel and export dairy markets, yet market sizing and adoption will depend on herd size, parlor configuration, milk regulations, dealer networks, and incumbent equipment compatibility.

**Traction, financing, and third-party validation.** Linok's official July 2025 blog announced a seed round led by Watchfire Ventures with participation from Barrel Ventures and said capital would support product development, deployment, and commercial expansion. The company's public site lists U.S. partners, a demo funnel, the MIKA-V1 product, and the 3-A standard claim. Startup Nation Finder, updated historically and with an inconsistent internal chronology, lists October 2024 pre-seed support from Eretz Angels, a 1–10 employee range, and $3.7 million across three rounds; StartupIM's July 2026 page reports a $3.5 million February 2026 Series A and seven employees, with the prior seed and pre-seed also shown. These aggregators differ on total capital and round labels, and no matching company announcement or independent funding report for the purported 2026 round was found, so the amount and latest stage need confirmation. The WIPO-published PCT application is a concrete IP signal. No public reference customer, trial cohort, recurring revenue, audited performance, or independently published validation specific to Linok was located. Accordingly, public evidence supports an active venture, product development, early fundraising, and channel outreach, but not scaled commercial traction.

**Founders and team background.** The company is led by founder and CEO Boaz Grof, whom Yeshiva University described in 2023 as an Israeli dairy farmer and entrepreneur with experience in artificial insemination and genetics. That domain familiarity is strategically useful: designing a sensor around real milking routines and the economics of herd health requires knowledge that a generic IoT team may lack. The company and StartupIM identify Omer Arad in a technology leadership role, Dor Sofer as a data scientist / machine-learning specialist, Yaniv Oiknine as chief scientific officer, and Reuven Harrison as founding chairman. Linok's hiring materials describe work across embedded devices, sensor integration, Linux, cloud data pipelines, APIs, and farm support, suggesting the product spans optics/electronics, firmware, data science, and deployment. A venture-capital community profile says Grof spent more than a decade in dairy and served in an IDF special-forces unit; this is contextual biography, not a technical credential. Public biographies do not yet establish prior sensor-product exits, large-scale hardware manufacturing experience, veterinary clinical leadership, or the size of the current full-time team beyond aggregator estimates.

**Competitive dynamics.** Linok is entering an established category where dairy-equipment suppliers already sell health monitoring and milk analytics. Afimilk's AfiLab measures components such as fat, protein, and lactose per cow at milking points and combines results with farm software; DeLaval's Herd Navigator measures milk biomarkers including lactate dehydrogenase for early mastitis detection; smaXtec analyzes temperature data from internal monitoring boluses; and manual veterinary checks, somatic-cell-count testing, and laboratory milk analysis remain substitutes. Linok's proposed distinction is a compact, plug-in, milk-tank sensing point paired with real-time analytics, aimed at a lower-friction retrofit rather than replacing the milking system. That positioning could be attractive to farms that need actionable information without extensive per-cow hardware, but pooled sampling can constrain attribution and incumbents have broader installed bases, technical support, and distribution. The defensible advantage, if any, will depend on accuracy under field variation, earlier warning than incumbent tools, reliable sanitation, ease of installation, integration partnerships, and a dataset that improves decisions across farms. Patent-pending claims alone do not establish a moat.

**Food-security and dual-use relevance.** Linok's dual-use case is resilience-oriented rather than military. Dairy is a component of food supply, and mastitis-related yield loss, animal treatment, and disease spread can reduce productive capacity while increasing labor and medicine needs. A dependable sensor that helps farms detect health changes earlier could strengthen continuity for food producers, cooperatives, and processors during veterinary-labor shortages, supply disruptions, or disease pressure. Its edge hardware and analytics architecture might also inform distributed animal-health surveillance, but there is no evidence of a defense customer, government security program, biosecurity contract, or fielded national-security use. This is therefore a credible food-system resilience application with only indirect security adjacency. The relevance should rise only if the company demonstrates measurable reductions in loss or antibiotic use and proves that its system can work across diverse herd sizes and milk-production environments. This classification does not imply that Linok is a defense technology company.

**Stage, trajectory, and diligence risks.** Linok is early stage: its sensor is being commercialized through demo and partner channels, while independent product results, named customer deployments, revenues, and manufacturing scale remain undisclosed. The sequence from an earlier human-milk concept to bovine-health monitoring may reflect focused market learning, but the company has not publicly explained the pivot, and diligence should establish which product is currently supported. The most material questions are whether the sensor's readings predict mastitis with useful lead time; whether performance generalizes across breeds, rations, seasons, farm equipment, and cleaning regimes; whether results map to individual animals or only pooled milk; whether the 3-A compliance statement corresponds to an independently verifiable certificate; and whether the subscription economics justify hardware installation and maintenance. Additional risks include competition from incumbent milking vendors, long farm procurement cycles, false alerts that erode operator trust, uncertain patent scope and freedom to operate, unconfirmed 2026 financing details, and a small team facing hardware, data, regulatory, and international-sales demands. Milestones that would change the assessment include independent field-study results, named repeat customers, clear per-cow attribution, documented sanitation compliance, verified recurring revenue, and stable deployment economics."""
