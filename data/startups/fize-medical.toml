name = "FIZE Medical"
description = "FIZE Medical is an Israeli medical-device startup building continuous kidney-function and fluid-management intelligence for intensive-care units. Its FIZE kUO system automates real-time urine-output measurement, while the FIZE Optima platform is intended to add AI-guided prediction and treatment support for fluid-related risks."
detailed_description = """
**Product and the concrete problem it solves.** FIZE Medical is focused on a narrow but consequential failure point in critical care: urine output is an important signal of kidney function, perfusion, and fluid balance, yet hospitals commonly obtain it by visually reading a collection bag at intervals and manually entering the result. That workflow creates latency, transcription risk, and poor resolution precisely when a patient’s fluid status can change quickly. The company’s commercial product, FIZE kUO, continuously measures urine output for catheterized patients and presents the result digitally. The clinical objective is earlier recognition of oliguria, acute kidney injury (AKI), fluid overload, hypovolemia, or deteriorating hemodynamics so clinicians can intervene before a delayed measurement becomes a larger clinical event. FIZE is not claiming that monitoring alone treats AKI; the more defensible proposition is that timely, reliable data can improve the information available to ICU teams and reduce a blind spot in fluid-management decisions. The company is also developing FIZE Optima, a broader software platform intended to combine continuous kidney intelligence with therapeutic guidance and predictive risk assessment.

**Core technology and how it actually works.** FIZE kUO is a physical measurement system rather than a generic hospital dashboard. Asahi Kasei Medical’s product description says the device uses an embedded pressure sensor to detect urine at the end of a Foley catheter and a pump to discharge it, allowing automatic and continuous measurement rather than periodic visual estimation. The system can measure very small pediatric volumes at approximately 0.1 mL resolution and can identify obstruction in the Foley catheter or tubing and alert staff. That design places the measurement close to the catheter, where the signal is generated, and connects the result to a digital display and electronic medical-record workflows. The product therefore combines fluidics, pressure sensing, pump control, device software, alarm logic, and clinical data transmission. FIZE Optima is the more ambitious AI layer, but its public description remains a roadmap: the company says it will use continuous physiological data to predict fluid-related risk and provide decision support. The record should distinguish the deployed measurement product from future algorithmic claims until peer-reviewed validation, model performance, calibration, and clinical-outcome evidence are disclosed.

**Market, customers, and go-to-market.** The initial buyer is the intensive-care hospital or health system, with clinicians and nursing staff as daily users and biomedical, IT, procurement, and quality teams as implementation stakeholders. The company’s official site quotes clinical leaders from Shaare Zedek, Hadassah Ein Kerem, and Soroka University Medical Center describing the value of accurate, timely urine-output measurement; these are expert endorsements, not necessarily paid customer references. CTech reported in September 2026 that Soroka and Beilinson were already using FIZE’s system, that 60 Israeli ICU beds were equipped, and that Sheba was expected to implement it. The commercial model is international medtech distribution rather than a purely direct software sale. Asahi Kasei Medical is FIZE’s exclusive distributor in Japan and, according to CTech, is expanding distribution into Europe; FIZE has also announced European distributor partnerships and localized interfaces. The company says the system is commercially available in North America, Japan, Europe, and the United States, but public sources do not disclose unit shipments, hospital count beyond the cited Israeli footprint, average selling price, recurring software revenue, renewal behavior, or procurement-cycle length.

**Traction, funding, and third-party validation.** FIZE has moved beyond laboratory concept into regulated commercialization. The company’s official announcement states that it received CE Mark and UKCA certification for FIZE kUO in July 2026, clearing the way for commercial activity in Europe and the United Kingdom; Asahi Kasei’s Japanese announcement identifies the product as a Class I general medical device and describes the automatic measurement, obstruction alerts, and electronic data transmission. Funding signals are also substantial for a 40-person medtech company. FIZE announced a $6 million warrant exercise in March 2026 that brought its total Series A financing to $36 million. CTech then reported a first close of a $20 million Series B led by Asahi Kasei Medical and Rapha Capital Management, two years after a $14 million prior round; the article says total funding would reach $50 million if the full Series B target is completed. The strategic-investor relationship is meaningful because Asahi Kasei specializes in blood-treatment and purification systems, including dialysis, and can provide distribution as well as clinical-market knowledge. FIZE has also appointed critical-care nephrologist John A. Kellum to its scientific advisory board. These milestones validate regulatory and commercialization progress, but they do not establish clinical superiority or a proven reduction in mortality, length of stay, or hospital cost.

**Founders and team background.** Public reporting provides a useful but incomplete view of the team. CTech says initial development began in 2011 under Noam Levine and that FIZE began operating as a company in 2019. The Japanese distributor identifies Dror Zerem as CEO, while CTech describes Zerem as a former CEO of Ophir Optronics and VisionMap, the latter acquired by Rafael. That background combines medical-device leadership with Israeli photonics and aerospace-adjacent technology commercialization, although it is not a substitute for a disclosed clinical-trial or regulatory-affairs track record. FIZE reports an Israeli company at Modiin, while its corporate site also lists FIZE Medical Inc. in Jericho, New York, which is consistent with a cross-border commercial structure. CTech reported approximately 40 employees in September 2026. The company’s public materials also show clinical, quality, regulatory, manufacturing, operations, and commercial functions, and its scientific advisory activity includes expertise in AKI, sepsis, organ failure, shock, and resuscitation. Full founder biographies, R&D allocation between Israel and the United States, retention, organizational depth, and ownership structure remain diligence items rather than facts to infer.

**Competitive dynamics.** FIZE competes against the status quo as much as against named device vendors. Manual urine-bag observation is inexpensive, familiar, and embedded in nursing practice, even though its granularity and reliability are limited. **Baxter** and **BD** compete through established infusion, urology, catheter, and hospital-device relationships; **Fresenius Medical Care** and **Asahi Kasei Medical** bring dialysis, renal-care, and fluid-management expertise; **Dräger** and **Philips** compete for ICU monitoring and clinical-workflow budgets; and hospital-developed protocols or general bedside-monitoring systems can remain substitutes. FIZE’s potential edge is the combination of a measurement point near the catheter, continuous digital output, pediatric sensitivity, obstruction alerts, and a future layer that could turn the signal into predictive fluid-management guidance. That is a practical workflow advantage if it reduces manual burden and produces trusted alerts, but it is not yet a durable moat. Larger vendors have channels, integration teams, regulatory resources, and installed bases, while specialist competitors could copy software features or partner with catheter and monitor manufacturers. The pivotal competitive evidence will be accuracy against laboratory or adjudicated measurements, alarm burden, nurse adoption, interoperability, reimbursement, and outcomes in prospective multi-site studies.

**Defense, security, and resilience dual-use relevance.** FIZE’s dual-use case is healthcare resilience rather than a demonstrated defense program. The same device could support military hospitals, field hospitals, disaster-response ICUs, evacuation centers, or civilian surge facilities where staff are scarce, patient acuity is high, and manual observation is difficult to sustain across many beds. Continuous, digitally transmitted urine-output data could help clinicians prioritize intervention during mass-casualty or infectious-disease surges, and reducing bedside documentation burden could improve workforce resilience when experienced critical-care nurses are in short supply. The technology also has a plausible humanitarian and civil-defense role because renal injury, shock, burns, sepsis, and fluid-management problems occur across trauma and emergency-care settings. This should be scored carefully: public sources establish Israeli hospitals, international commercial distribution, and regulatory certification, but they do not disclose military customers, defense procurement, battlefield trials, ruggedized field variants, cybersecurity accreditation, offline operation, or deployment in a contested environment. FIZE is therefore a strategically relevant medical-resilience company with a credible transfer path, not a fielded defense-technology supplier.

**Growth stage, trajectory, and key diligence risks.** FIZE is best classified as mid-stage: it was founded in 2014, has operated since 2019, employs about 40 people, has a CE- and UKCA-certified product, has commercial distribution relationships in Japan and Europe, and is raising or closing a Series B after a $36 million Series A. Its trajectory depends on converting regulatory access and distributor relationships into repeatable hospital adoption, then proving that FIZE Optima’s AI guidance adds clinical value without creating alert fatigue or liability. The central diligence questions are: (1) whether the reported $20 million Series B first close reaches the full target; (2) how many hospitals, beds, and countries are live and paying; (3) whether device accuracy, calibration, and catheter compatibility hold across adults, pediatrics, and neonates; (4) whether the pressure-sensor and pump design adds infection, maintenance, consumables, or failure modes; (5) whether CE, UKCA, U.S., and Japanese regulatory claims map to the same configuration and intended use; (6) whether Optima is clinically validated prospectively rather than only retrospectively; and (7) whether distributors can shorten procurement cycles without eroding gross margin or customer ownership. The opportunity is meaningful because a simple, measurable ICU signal can become infrastructure for proactive care, but adoption is constrained by clinical evidence, workflow change, reimbursement, integration, and the high consequence of false alarms or missed deterioration.
"""
