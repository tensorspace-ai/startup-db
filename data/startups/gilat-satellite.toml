name = "Gilat Satellite Networks"
description = "Gilat Satellite Networks (NASDAQ: GILT; TASE: GILT) is an Israeli public company that develops satellite networking equipment, ground systems, terminals, amplifiers, software, and managed connectivity for defense, government, commercial, mobility, cellular-backhaul, and digital-inclusion markets. Founded in 1987, it is an established supplier whose dual-use relevance comes from adapting resilient commercial SATCOM and specialized military systems to communications in remote, mobile, or infrastructure-constrained environments."
detailed_description = """Gilat designs and supplies the ground segment that makes satellite connectivity usable: satellite modems and platforms, high-performance terminals, electronically steerable antennas, satellite-on-the-move systems, solid-state power amplifiers and block upconverters, network-management software, and integrated services. Its portfolio spans GEO, MEO, and LEO-oriented architectures and includes the SkyEdge platform, military-grade MLT-1000 modem, transportable terminals, manpacks, and airborne systems. The important technical problem is not simply putting data on a satellite; it is maintaining usable throughput, link availability, security, and operational control despite latency, weather, movement, constrained size/weight/power, and changing satellite resources.

The company serves several customer groups rather than a single defense niche. Gilat reports three operating divisions: Gilat Commercial, Gilat Defense, and Gilat Peru. Commercial activities include broadband access, cellular backhaul, enterprise networks, in-flight and maritime connectivity, and satellite-operator ground equipment. Gilat Peru provides connectivity and network services in Latin America, including rural and government-supported infrastructure projects. In its 2025 Form 20-F, Gilat reported $451.7 million of revenue, with Gilat Commercial contributing 62%, Gilat Peru 16%, and Gilat Defense 22%. Those figures indicate meaningful commercial scale and a diversified revenue base, while also showing that defense is material but not the whole business.

Commercial traction is best read through the company’s reported revenue, product breadth, and recurring deployment relationships rather than through unverified customer-count claims. The 2025 results release reported record adjusted EBITDA and guided to double-digit revenue and adjusted-EBITDA growth for 2026; these are company-reported indicators, not independent validation of future performance. Gilat’s public materials also describe a unified Gilat Defense organization combining Gilat, Gilat DataPath, and Gilat Wavestream capabilities. This can improve its ability to sell an end-to-end defense ground segment, but it also increases integration and execution demands. The company’s June 2026 announcement of a proposed acquisition of most of Comtech’s Satellite and Space Communications segment would further expand scale if completed; the transaction should be treated as announced rather than assumed closed until filings confirm completion.

Gilat’s competitive field includes larger defense primes and specialized SATCOM vendors, satellite operators that increasingly develop or specify their own ground segments, and newer LEO connectivity providers. Its defensible position is a combination of installed know-how, RF and modem engineering, multi-orbit ground-segment migration, ruggedized mobility products, and relationships across operators, integrators, governments, and service providers. It is not an uncontested technology leader: Starlink and other LEO systems can reset price and latency expectations, while L3Harris, Viasat, Hughes, ST Engineering iDirect, Comtech, and European and Israeli defense suppliers compete for overlapping programs.

The defense relevance is substantive. Gilat’s official defense materials describe secure SATCOM for military and homeland-security organizations, transportable terminals, tactical on-the-move connectivity, airborne/UAS links, and command-and-control communications. These capabilities support military communications, situational awareness, logistics, and beyond-line-of-sight operations, while the same underlying technologies support first responders, disaster recovery, rural connectivity, aviation, maritime users, and cellular restoration. The evidence supports genuine dual use, but public materials do not establish that every product is combat-proven in a particular current conflict or that every stated customer is a defense customer. Strategic diligence should therefore focus on contract quality, backlog conversion, cybersecurity and export-control posture, multi-orbit interoperability, acquisition integration, and the durability of margins as satellite connectivity becomes more software-defined and price competitive."""
