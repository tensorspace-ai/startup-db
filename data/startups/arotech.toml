name = "Arotech Corporation"
description = "Arotech Corporation is a privately held defense and security technology group headquartered in Ann Arbor that develops training and simulation systems, portable power systems, and advanced electronics for military, law-enforcement, and selected commercial customers. It was acquired by Albion River in February 2025 and operates through businesses including FAAC, MILO, and Inter-Coastal Electronics."
detailed_description = """Arotech combines several mature engineering businesses rather than a single software product. Its training and simulation portfolio covers live, multimedia, and extended-reality systems for use-of-force, operator, collective, gunnery, vehicle, and air-warfare training. The company describes analytical models and real-time weapons simulations for tactical air and land systems, including fighter decision-support software, aerial-refueling boom simulators, convoy trainers, and high-fidelity vehicle simulators. Its MILO Range products provide interactive scenario-based training for firearms, judgment, de-escalation, and other use-of-force decisions. These products sit at the intersection of specialized content, instructor workflow, hardware integration, and simulation software, which can make replacement more involved than purchasing generic visualization software.

The military-facing business has a particularly concrete instrumentation and interoperability angle. Inter-Coastal Electronics provides the Tactical Engagement Simulation System (TESS) for U.S. Army aviation and describes telemetry, GPS tracking, geometric pairing, area weapon effects, performance feedback, and after-action review across aviation, unmanned aircraft, artillery, air defense, missile, and dismounted training contexts. Arotech also reports more than five decades of air-warfare systems engineering through its simulation businesses and says its technology has been used in operational and training contexts. Those statements are company claims and should be diligence-checked against current contract scope, renewal status, fielded configurations, and customer references; nevertheless, they indicate a real installed-program and integration position rather than an early prototype.

The market is split between defense readiness budgets, federal and state or local public-safety procurement, international security customers, and selected commercial simulation work. Arotech says MILO has served law-enforcement, military, security, and public-safety agencies in twenty countries, while its broader site describes customers across the U.S. Department of Defense, federal agencies, prime contractors, foreign militaries, and local customers. In February 2025, FAAC also announced the acquisition of Battlespace Simulations, a multidomain combat-simulation specialist, suggesting an effort to broaden the training and modeling platform. The acquisition is a traction signal, but public materials do not establish revenue growth, backlog, margins, customer concentration, or the financial contribution of any division.

The second major pillar is portable power and advanced electronics manufacturing for defense and security applications. These capabilities can be strategically important when batteries, power conditioning, rugged electronics, and manufacturing know-how are embedded in platforms, but they are less visibly differentiated from the simulation portfolio and have a narrower commercial adjacency. Albion River’s acquisition announcement says Arotech products are embedded in hundreds of defense platforms and protected by intellectual property and proprietary manufacturing know-how; that is a useful signal of embeddedness, not proof of exclusivity or durable pricing power. Competitive pressure comes from large training and systems integrators, specialized simulation firms, battery suppliers, and customer-owned engineering organizations.

Arotech is strategically relevant to readiness and the defense industrial base because its systems help customers rehearse decisions, instrument live exercises, measure performance, and sustain platform power without exposing personnel or equipment to the cost of every real-world event. The dual-use case is credible but bounded: MILO, vehicle simulation, and some instructor and research tools serve law enforcement, transportation, research, and other non-defense users, while TESS, tactical weapons modeling, and portable military power are principally defense-oriented. Since Albion River acquired the company from Greenbriar, the central diligence question is whether new ownership can invest behind the installed base, integrate acquisitions, and preserve program continuity while expanding internationally."""
