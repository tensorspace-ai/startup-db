competitive_edge = "Arotech's edge is the combination of long-lived defense simulation know-how, live-exercise instrumentation, scenario-based public-safety training, and portable power or electronics manufacturing within one acquired platform. The official site cites TESS interoperability with Army training ranges and Combat Training Centers, MILO's long operating history, and air-warfare modeling experience. This can support program continuity and customer familiarity, but it is not automatically a moat: large primes can bundle simulation, specialized software firms can compete on realism and modeling, and battery specialists can outscale Arotech in power. The edge should be validated through current program status, renewal rates, integration depth, IP ownership, and measurable performance outcomes."
