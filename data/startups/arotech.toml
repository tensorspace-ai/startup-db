dual_use_description = "Arotech has substantive dual-use applicability, but it is not uniform across the portfolio. MILO use-of-force simulation, vehicle/operator training, and some immersive or analytical tools serve military, law-enforcement, public-safety, transportation, research, and commercial users. Those products transfer across sectors because the underlying capabilities are scenario authoring, realistic physical or virtual interaction, instructor control, measurement, and after-action review. TESS, tactical weapons modeling, and portable military power are more defense-specific. The evidence supports a credible operational dual-use thesis grounded in deployed training workflows, not a claim that every product is a general-purpose commercial technology."
