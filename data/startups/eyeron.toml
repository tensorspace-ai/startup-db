name = "Eyeron"
description = "Eyeron was an Israeli micro-UAS startup that developed small autonomous indoor drones for first-responder and tactical reconnaissance in dangerous buildings. Public records indicate that the company ceased operations in January 2019."
detailed_description = """Eyeron's product thesis was a compact indoor micro-UAS that could enter a building, navigate without GPS, and transmit live video to operators who remained outside the danger area. Public descriptions emphasized tiny drones, roughly hand-sized, intended to operate as a single unit or as a small flock and to give police, firefighters, search-and-rescue teams, and military users a fast visual feed from interiors where people would otherwise be entering blind. The core technical challenge was not generic drone flight; it was reliable indoor ISR under constraints of low light, walls, multipath communications, short endurance, clutter, smoke, and stressed non-expert operators.

The clearest public traction signals are historical rather than current. Forbes reported in July 2018 that founder Nimrod Ron had created Eyeron in 2016 after search-and-rescue experience, that the company was testing with Israeli police and firefighters, and that it was targeting U.S. first-responder agencies with a kit of three drones. The same report described a battery-management approach in which drones could be refreshed on roughly seven-to-ten-minute cycles, illustrating both the intended persistence model and the endurance constraint. MassChallenge listed Eyeron in its 2018 Israel cohort as a Netanya startup building a platform for first-responder teams to operate in dangerous indoor environments from a safe distance. IVC described Eyeron Autonomous Systems as an R&D-stage company developing micro-sized drone systems that send live video from dangerous indoor environments, with law enforcement and military users among its target markets.

Current status is the main diligence issue. Startup Nation Finder records Eyeron as non-active and ceased in January 2019; IVC states that Eyeron ceased to operate in Q1 2019; and Crunchbase marks Eyeron Systems as closed. These records are historical databases rather than a current company statement, but they converge on the same conclusion. The historical official domain, www.eyeron-sys.com, is cited by IVC and other directories but failed DNS resolution during the local URL check. No current official web presence or stable official logo asset could be identified. The company therefore fits the database better as a defunct or wound-down dual-use startup record than as an active pipeline candidate.

The market problem remains strategically relevant even though this specific company appears inactive. Indoor micro-drones, throwable reconnaissance systems, and compact tactical robots all seek to solve the same problem: getting visual or thermal awareness inside a structure before police, firefighters, soldiers, or security teams cross a threshold. For defense and homeland-security users, the value is force protection and time-sensitive situational awareness in urban combat, hostage rescue, active-shooter response, disaster response, and critical-infrastructure incidents. For commercial or civic users, adjacent applications include facility security, emergency response, hazardous-material inspection, and post-disaster assessment.

Competitive dynamics would have been difficult for a small hardware startup. The category now includes better-capitalized public-safety drone companies, indoor inspection drone specialists, tactical loitering and launched-UAS vendors, and ground robots that can carry sensors through buildings with longer endurance. Eyeron's proposed edge was portability and autonomous indoor flight, but a durable business would have required proof of rugged hardware, repeatable navigation in hostile interiors, radio links that work through walls, procurement access, training workflows, liability management, and enough capital to iterate hardware through field failures."""
