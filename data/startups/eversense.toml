name = "EVERSENSE"
description = "EVERSENSE is an Israeli wildfire-resilience startup developing a battery-free, heat-activated sensor system intended to detect fires while they are still surface fires and send an alert with the fire's precise location. The technology is designed for distributed deployment across forests and other remote or security-sensitive areas where power, maintenance, connectivity, and early warning are difficult to provide."
detailed_description = """
**Product and the concrete problem it solves.** EVERSENSE is addressing the first minutes of a wildfire, when a small surface fire may still be containable but conventional detection may not yet have produced a useful alert. Its proposed product is a network of small, heat-activated field sensors that can be installed in large numbers across forested or otherwise exposed terrain. The company says the system detects a fire in its most initial phase, identifies the precise location, and immediately alerts the user. That is a focused problem with direct resilience value: a wildfire can spread from ground vegetation into the canopy, and then become much harder and more expensive to control. The approach also targets a practical deployment constraint. Outdoor sensors need power, but batteries require replacement and solar panels can be vulnerable to theft, vandalism, shade, dust, and weather. EVERSENSE's answer is to use the fire's own heat as the energy source, reducing dependence on stored or harvested power. The public record supports this product framing, but it does not establish a production-scale deployment or a statistically validated detection rate.

**Core technology and how it works.** The central technical claim is a patent-pending sensor that reacts to the heat generated by an approaching or developing fire and produces its own electricity without a battery, solar panel, or external power source. In the founder's description, the device can operate independently, be placed near the base of a tree, and communicate enough information to report an exact fire location. The mechanism appears to be a thermal trigger coupled to an energy-harvesting and communications circuit, although the company has not publicly disclosed the sensing material, temperature threshold, energy budget, radio protocol, network topology, or whether location is derived from individually addressed nodes, gateway triangulation, or another method. That disclosure boundary matters: “battery-free” does not by itself prove multi-year reliability, because a device still has to survive humidity, insects, physical impact, vegetation growth, and non-fire heat sources while retaining a usable communications path. The meaningful engineering test is the whole system: early thermal sensitivity, reliable signaling, geographic coverage, and a false-alarm rate low enough that responders continue to trust it.

**Market, customers, and go-to-market.** EVERSENSE is positioned for public-safety and government buyers, with Startup Nation Finder classifying its target customers under defense, safety and security, and public security and identifying B2B and B2G models. The first obvious market is forest and land management: national parks, forestry agencies, municipalities, conservation bodies, and organizations responsible for fire-prone open space could distribute inexpensive nodes over large areas. Other plausible buyers include utilities, railways, pipeline operators, communications sites, industrial campuses, insurers, and owners of remote facilities where an early fire can interrupt essential services. The company has also stated that the concept could apply in regions such as California, where large seasonal wildfires create demand for earlier and more localized detection. The route to market is likely a systems sale or monitored service rather than a single consumer device, because customers need installation planning, alert routing, mapping, maintenance policy, and integration with dispatch or incident-management workflows. Public sources do not identify paying customers, recurring revenue, channel partners, contract values, or a current geographic deployment footprint.

**Traction, funding, and third-party validation.** The strongest public validation is ecosystem-based and pilot-oriented. EVERSENSE won the 2022 KKL-JNF Extreme Weather Events Competition, received a reported cash award of 75,000 Israeli shekels, and was selected for a pilot in which sensors were to be installed across selected forests and tested, including with a controlled fire. PLANETech continues to list EVERSENSE among the companies chosen for pilot projects under its extreme-weather initiative. Startupim's profile, updated in June 2026, marks the company active, lists three employees, and records one EPO patent in its radar data; Startup Nation Finder separately describes the IP as patent-pending and reports no disclosed funding rounds. These signals show that the company is a real Israeli ecosystem entry with a live official domain and a technology that has been tested or prepared for testing, not merely an undifferentiated climate concept. They do not prove that the 2022 pilot reached commercial scale, that the patent has been granted, or that the system has operated through multiple fire seasons. No venture round, named commercial deployment, independent field benchmark, certification, or revenue disclosure was found in the reviewed sources.

**Founders and team background.** EVERSENSE is publicly associated with founder and CEO Doron Honigsberg. The Jerusalem Post's coverage of the KKL-JNF award records Honigsberg explaining the motivation for a fire-powered sensor: connecting outdoor sensors to electricity is difficult, batteries need maintenance, and solar panels can be stolen or vandalized. That problem-origin story is technically relevant because it connects the hardware choice to field conditions instead of treating energy harvesting as a decorative feature. Startup Nation Finder identifies the company as founded in January 2021 in Tel Aviv-Yafo and reports a 1-10 employee range; Startupim's more recent record gives an exact headcount of three and again names Honigsberg as founder. The public team footprint is therefore very small, and no additional executives, engineering leaders, advisers, manufacturing partners, or fire-science specialists are identified in the sources reviewed. A compact team can move quickly on a focused sensor product, but it also creates concentration risk across hardware design, embedded software, radio reliability, field installation, safety validation, procurement, and sales. The next diligence step should be a current organization chart and evidence of who owns certification, manufacturing, and operational support.

**Competitive dynamics.** EVERSENSE competes with several different approaches rather than a single direct rival. Pano AI and similar providers use camera networks and computer vision to watch wide areas; satellite and aerial systems such as OroraTech provide large-area thermal or imagery-based monitoring; Dryad Networks and other sensor companies use distributed environmental nodes; and public agencies operate lookout towers, patrols, weather stations, smoke detectors, and manual reporting channels. EVERSENSE's proposed edge is a very low-maintenance node that can be placed close to the ignition zone and does not depend on a solar panel or routine battery replacement. That could be valuable in dense forests, remote terrain, or sites where visual line of sight and reliable grid power are weak. It is not yet a demonstrated moat. Camera and satellite networks benefit from established operations and broad situational context, while distributed sensor competitors may have stronger communications, manufacturing, and deployment experience. EVERSENSE must show that its sensor density, alert latency, installation cost, radio coverage, and lifecycle reliability produce a better total outcome than combining existing imagery, weather, and human observation. Its intellectual-property position may help, but the public evidence only supports one EPO patent record and a patent-pending claim, not scope, validity, ownership, or freedom to operate.

**Defense, security, and resilience dual-use relevance.** EVERSENSE's dual-use relevance is credible through critical-infrastructure and civil-defense protection, although the product is not publicly demonstrated as a defense system. Early fire detection can protect military bases, border installations, ammunition or fuel areas, power and water facilities, rail corridors, communications sites, and evacuation routes. In those environments, a battery-free node could reduce maintenance sorties, avoid dependence on vulnerable external power, and provide an independent warning layer when smoke cameras, patrols, or centralized systems are delayed or unavailable. The same architecture could support wildfire response near communities, protected forests, and remote industrial assets, making the resilience benefit broader than a military customer. The security connection should remain calibrated: the company has not disclosed a defense contract, military trial, classified deployment, or integration with command-and-control systems. It also has not published evidence on cybersecurity, secure firmware, radio encryption, spoofing resistance, tamper detection, or operation during communications outages. EVERSENSE belongs in a strategic dual-use database because distributed early warning for fire and infrastructure disruption is a meaningful civil-security capability; it should not be described as fielded defense technology until those controls and deployments are verified.

**Growth stage, trajectory, and diligence risks.** EVERSENSE is classified as early because the public record shows an active company founded in 2021, a very small team, pre-funding status, a live product website, a prior environmental-prize pilot pathway, and continuing ecosystem visibility, but no disclosed commercial scale. The trajectory depends on converting a compelling hardware insight into a reliable network that fire authorities and infrastructure operators can trust. The key diligence risks are: (1) thermal and environmental performance, including detection distance, response time, wind, rain, shade, insects, agricultural burns, and non-fire heat; (2) communications and location, because an independent sensor that cannot reliably transmit an alert is not operationally useful; (3) manufacturing and installation economics at the thousands-of-nodes scale; (4) false alarms and missed fires, both of which can create life-safety and liability consequences; (5) limited capital and founder concentration; (6) slow municipal, utility, and government procurement; and (7) competition from better-funded camera, satellite, and sensor networks. The most important milestones are an independently measured multi-season field trial, a named paying deployment, clear patent and certification status, proof of secure alert delivery, and evidence that the battery-free architecture lowers total cost without sacrificing coverage or response quality.
"""
