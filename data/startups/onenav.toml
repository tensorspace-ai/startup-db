dual_use_description = "oneNav's core L5-direct receiver and IP can serve commercial devices, industrial trackers, timing equipment, and autonomy platforms while also addressing a concrete defense problem: preserving usable PNT when L1 GNSS is jammed or manipulated. The defense case is supported by company-reported UAV interference testing and a U.S. Air Force Direct-to-Phase II SBIR announcement, but public material does not establish broad operational deployment. L5 jamming, spoofing, satellite geometry, and the need for complementary sensors limit the claim to credible receiver-level dual use rather than complete denied-navigation immunity."

