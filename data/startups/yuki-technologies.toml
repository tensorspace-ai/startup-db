name = "Yuki Technologies"
description = "Yuki Technologies is an Israeli data-infrastructure startup building a real-time control layer for Snowflake, Google BigQuery, and Iceberg-based data lakes. Its Yuki Fabric platform uses workload metadata, learned cost-performance behavior, and automated query routing and resource sizing to make AI-era data spend more predictable without reading customers' underlying business data."
detailed_description = """
**Product and the concrete problem it solves.** Yuki Technologies addresses the operational gap between the modern data stack's ability to generate workloads and an organization's ability to govern them. Snowflake warehouses, BigQuery projects, and Iceberg-based lakes now support BI, ETL, embeddings, retrieval, model evaluation, and agent-driven analytics at the same time. Those workloads have different urgency, service-level expectations, and resource profiles, but many teams still respond by buying more capacity or manually tuning queries and clusters. Yuki Fabric is positioned as a control plane above those systems: it observes workload behavior, understands cost and performance tradeoffs, and makes execution decisions in real time. The goal is not another dashboard that tells a data team where money was wasted after the fact. The product is intended to route work, right-size compute, consolidate capacity, and enforce priorities automatically, while preserving the customer's existing data platform and application workflow.

**Core technology and how it actually works.** Public technical reporting gives Yuki's architecture more specificity than the usual cost-optimization pitch. The platform is designed to be metadata-only, so it can inspect execution statistics and environment signals without accessing the business records carried by the queries. Geektime reports that Yuki combines historical run data with a live view of active load, resource availability, and contention. Offline machine-learning models estimate the resource weight and likely performance effect of each execution; a real-time linear-programming engine then schedules or places work under cost, performance, and SLA constraints. A small language model is used to analyze execution characteristics and detect patterns among queries, rather than reading sensitive business content. In the company's formulation, this creates an operational optimization loop: learn workload behavior, choose the most suitable compute, and apply the decision without requiring users to rewrite application code. The approach is materially different from a FinOps report or a static rulebook, although the public record does not provide independent benchmark methodology, failure-rate data, or details of the control-plane implementation.

**Market, customers, and go-to-market.** Yuki sells to data-intensive organizations whose cloud warehouses have become both mission-critical and financially difficult to predict. The buyer can be a data-platform, analytics, infrastructure, FinOps, or AI-operations team, with the economic case tied to lower compute waste, fewer manual interventions, and more reliable performance for important workloads. The company publicly names cybersecurity vendor Tenable and media company Angel Studios as early customers. That pairing is strategically useful: Tenable represents a security organization with large data and analytics demands, while Angel Studios illustrates a media business with high-volume, variable workloads. Yuki's integration-first motion is designed to minimize adoption friction because the platform operates across existing Snowflake and BigQuery environments rather than requiring a warehouse migration. Its expansion path is also visible: the company announced availability through AWS Marketplace and participation in the AWS ISV Accelerate co-sell program, while stating that Databricks support was planned. That route can shorten procurement for AWS customers, but it also makes platform compatibility, cloud-partner economics, and technical support quality central to the go-to-market case.

**Traction, funding, and third-party validation.** Yuki announced a $6 million Seed round in January 2026 led by Hyperwise Ventures, with VelocitX, Tal Ventures, Fresh.fund, and Spot.io founder Yakir Daniel participating. The funding announcement describes a fifteen-person company, mostly in Israel, with additional staff in the United States and United Kingdom; Geektime reported fourteen employees, so the precise current headcount is best treated as a narrow public range rather than a confirmed count. CTech reported that customers using the platform in 2025 reduced data costs by an average of 42.6 percent, while Yuki's later company release rounded the claim to 42 percent and said onboarding could take under an hour. These are company-reported outcomes, not an independent study, but they are more decision-useful than an unquantified efficiency claim. AWS ISV Accelerate participation, AWS Marketplace availability, named customer references, and the backing of a specialist Israeli seed investor plus the founder of Spot.io provide ecosystem validation. Important omissions remain: no public ARR, retention, customer count, contract values, audited savings study, or independent performance benchmark is disclosed.

**Founders and team background.** Yuki was founded by CEO Ido Arieli Noga and CTO Amir Peres, childhood acquaintances who later reunited after working separately in data-related roles and on earlier joint ventures. The founders' own account is that they repeatedly encountered organizations drowning in query volume and compute cost but lacking a system to manage data as a governed resource. That problem origin is coherent with the product's emphasis on control rather than reporting. Yuki's About material describes the platform as founded in 2023, and Dealroom lists a 2023 launch date, while CTech's January 2026 funding coverage described it as founded in 2025; the discrepancy may reflect incorporation, product formation, or a reporting simplification and should be resolved in diligence. The team is small but includes a VP R&D with more than fifteen years of experience in coding, systems, and people leadership, according to the company site. The public record does not establish a large prior exit, deep warehouse-vendor operating history, or the team's ability to support global enterprise deployments, so the team score should reward founder-market fit and early execution without assuming scale maturity.

**Competitive dynamics and edge.** Yuki operates in a crowded and converging market. Vantage and similar FinOps platforms provide cloud-cost visibility and allocation; IBM Turbonomic optimizes application-resource relationships; Unravel Data combines data observability with performance and cost analysis; Chaos Genius focuses on Snowflake cost intelligence; and Snowflake and Google Cloud each provide native resource monitors, autoscaling, reservations, and workload-management controls. Yuki's proposed edge is the placement and automation of its control layer: rather than advising a team to tune a warehouse, it attempts to make the execution decision continuously across platforms. Its metadata-only design may reduce the security and integration objections associated with sending business data to an external optimizer, while support for multiple warehouse and lakehouse environments addresses the fragmentation that native controls do not solve. The edge is not yet a proven moat. Cloud vendors can deepen their native controls, FinOps products can add remediation, and a linear-programming scheduler plus workload metadata may be reproducible by well-funded competitors. Durability therefore depends on accumulated workload models, integration reliability, measurable savings, safe fallback behavior, and the trust earned when the optimizer sits in the path of production data operations.

**Defense, security, and resilience dual-use relevance.** Yuki's dual-use case is credible at the data-infrastructure and resilience layer, not as a defense product. Security companies are already among its disclosed customers, and the same requirement for predictable, governed, high-volume data processing exists in security operations, logistics, industrial monitoring, public-sector analytics, and mission-support systems. A metadata-only optimizer could be attractive where operators need to control cloud or private data-platform costs without exposing the contents of sensitive records to a third-party service. In an allied or critical-infrastructure setting, workload prioritization could help preserve high-value analytics, telemetry processing, incident response, or decision-support pipelines during resource contention. The connection remains conditional: Yuki has not publicly disclosed a defense customer, government contract, classified deployment, security accreditation, sovereign-cloud support, offline operation, or degraded-connectivity mode. Its strategic relevance is therefore the possibility of making data and AI infrastructure more efficient and governable for security-sensitive organizations, with a relatively short technical adjacency path, rather than evidence of an already fielded national-security capability.

**Growth stage, trajectory, and key diligence risks.** Yuki is best classified as early: it has a Seed round, a small team, named early customers, product integrations, and an AWS co-sell path, but no public evidence of scaled revenue or a mature enterprise operating base. The trajectory is attractive if the company can turn its savings claim into repeatable, auditable outcomes as AI workloads make warehouse usage more volatile. The key diligence points are: (1) verify that the reported 42.6 percent average savings survives across customers, workload mixes, and baseline definitions; (2) test optimizer safety, rollback, latency, and behavior when metadata is incomplete or workload patterns shift; (3) clarify the 2023-versus-2025 founding-date discrepancy and the exact legal entity behind Yuki Technologies; (4) measure retention, expansion, deployment count, and gross margins rather than relying on customer logos; (5) assess dependence on Snowflake, BigQuery, and AWS APIs and partner economics; (6) determine whether Databricks and additional lakehouse support are delivered on schedule; and (7) establish whether enterprise security reviews accept metadata-only access in regulated and public-sector environments. If Yuki compounds a cross-platform workload dataset and becomes the safe automation layer for data spend, it can occupy an important control point beneath AI applications. If savings are customer-specific, native platform controls catch up, or production teams resist autonomous scheduling, the company may remain a useful optimization feature in a market with limited pricing power.
"""
