name = "Veloryx Ltd"
description = "Veloryx Ltd, formerly Aquarius Engines, is an Israeli TASE-listed technology company combining homeland-security solutions with distributed power generation. Its activities span border-protection and HLS systems, as well as compact linear-engine and generator systems for grid-constrained EV charging, telecommunications, and backup-power applications."
detailed_description = """Veloryx is the February 2025 corporate successor to Aquarius Engines and is now pursuing two related but operationally distinct activities. The company’s 2025 annual report says its board adopted a new strategy in December 2025 to focus on homeland security and border protection for military and civilian customers, while continuing a second activity in the development, production, and distribution of electricity-generation systems. This makes the record more than an energy-hardware startup profile: Veloryx is a small public-company platform attempting to build a broader HLS technology group around a legacy engine and generator capability.

The energy business is built around a two-sided free-piston linear engine (FPLE). A single piston produces work on both sides and is coupled to two linear generators, reducing the number of conventional rotating components. The company presents the design as compact, lightweight, low-friction, low-frequency, and modular, with single-generator or clustered configurations. Its AQ150 positioning is a roughly 150 kW grid-independent power system for EV fast charging, data-center backup, and telecommunications. The official technology material lists gasoline or natural-gas-derived fuels including LPG and CNG; hydrogen capability appears in company materials as a development or adaptation pathway, so it should not be treated as equivalent to proven commercial hydrogen deployment. The architecture could matter where a battery-only system is too expensive or space-limited and a conventional diesel genset is too heavy, noisy, emissions-constrained, or difficult to site.

Commercially, the company is addressing buyers with high costs of grid upgrades and high penalties for outages: charging-point operators and fleet owners, telecom operators, data-center owners, and other critical-load operators. The website claims that its systems can support more charging throughput and operate independently of the grid, but those are company claims rather than independently verified installed-base metrics. The February 2025 BTD assessment publicized by Aquarius reported advantages in size, weight, and efficiency and said first AQ dr units had entered production; the same release described several projections, including hydrogen and CNG operation and modeled six-cylinder performance. The 2025 annual report provides a more conservative commercialization signal: it reports two engines and one generator produced, additional units in advanced production, and an AQ150 genset undergoing testing in Poland, while also stating that the engine business had not yet generated significant revenue. The key diligence question is therefore field reliability and repeatable delivery, not merely prototype performance.

The HLS strategy changes the competitive and execution profile. The annual report describes an intended ecosystem of unmanned systems and human-factor capabilities spanning drones, radar, command and control, robotics, identification, detection, interception, and monitoring. These are crowded markets with established defense primes, specialist Israeli vendors, and demanding procurement, integration, export-control, and support requirements. The report describes the HLS activity as a strategic build-out and identifies a mix of military and civilian customers in the broader target market; it should not be read as proof that every planned capability or customer relationship is already commercialized. Veloryx’s advantage may be its public-company access to capital and the option to combine power autonomy with security-system integration, but it lacks the scale, installed base, and program history of major incumbents.

The dual-use case is credible but should be framed narrowly. Compact fuel-flexible generation can support communications, remote sites, emergency services, border infrastructure, and defense logistics, while HLS sensing and unmanned systems have direct security applications. The strongest strategic thesis is not that the engine is itself a defense product; it is that local power resilience can improve the availability of security and critical-infrastructure systems, while the HLS pivot creates direct defense exposure. Veloryx remains a high-risk small public company: the 2025 report records 63 group employees, significant operating losses and negative operating cash flow, limited disclosed engine revenue, ongoing manufacturing and integration work, and a strategy transition. Diligence should prioritize audited liquidity, the status and economics of HLS subsidiaries or acquisitions, customer contracts and renewal evidence, production acceptance testing, emissions and safety approvals, warranty provisions, and whether management can execute two technically demanding businesses without diluting focus."""
