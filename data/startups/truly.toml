priority_rationale = "Truly merits close monitoring as a seed-stage Israeli identity-assurance startup in a strategically important category with genuine dual-use relevance and potential U.S.-Israel partnership value. However, conversion to investable opportunity requires near-term evidence of product differentiation, early customer validation, and team capability. The market is crowded, regulatory barriers are high, and competition from well-funded rivals is intense. Initial diligence should focus on technical differentiation claims, named customer references, and feasibility of defense-sector procurement roadmap. If these validate positively, Truly could merit Series A consideration; if not evident within 18-24 months, the startup remains early-stage speculative."
