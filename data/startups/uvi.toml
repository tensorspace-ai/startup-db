name = "Uvi"
description = "Uvi (the current operating brand of Naboo Research) is a Tel Aviv enterprise AI infrastructure startup that builds an organization-specific context and reasoning layer for AI agents. Its Topic Graph links records across tools and permissions, while its Decision Graph models owners, triggers, blockers, dependencies, and evidence so agents can retrieve an auditable chain of decisions rather than a loosely related set of documents; the company cites production use at Global-e and Melio."
detailed_description = """
**Product and the concrete problem it solves.** Uvi is trying to solve a failure mode that appears when organizations move AI agents from demos into work: a model can reason over supplied context, but an enterprise's actual operating context is fragmented across code repositories, tickets, pull requests, chat threads, documents, and internal services. A feature's current state may be split between a Jira ticket, a GitHub pull request, a Slack conversation, and a feature flag; ownership or the reason for a rollback may never have been recorded in one canonical document. A conventional search or retrieval-augmented generation layer retrieves text that resembles the query, then asks a model to infer missing links. That may work for questions such as “find the policy,” but it is less dependable for “what is blocking this release, who owns it, and why was the rollout paused?” Uvi positions its product as a context and reasoning substrate under agents and developer tools. It aims to give them the connected, permissioned, current evidence needed to act inside an organization, rather than adding another general-purpose chat interface or training a foundation model.

**Core technology and how it actually works.** Uvi describes two coupled graph layers. The Topic Graph is the integration and identity-resolution substrate: it indexes records from connected systems, follows explicit and implicit references between them, resolves the same issue, person, repository, or feature when it appears under different identifiers, and retains source-level permissions. The Decision Graph sits above that substrate and represents decisions as typed nodes with fields such as owner, trigger, blockers, dependencies, state, and supporting evidence. This distinction is meaningful: a vector store represents similarity between text chunks, while Uvi's product claims to preserve the structured links that let an agent trace why a decision is open or what must happen next. The company exposes these links to agents through GraphQL and an MCP server and says it can translate natural-language intent into a structured query. Its published deployment guide describes a forward-deployed specialist working with a customer to elicit local definitions, map entities and joins, configure ingestion, and verify a queryable graph over an initial engagement measured in weeks. That service-assisted setup can encode tacit process knowledge, but also creates a scaling and repeatability question.

**Deployment, security, and integration model.** Uvi targets organizations that need the context layer to inherit existing access boundaries. Its current materials describe deployment on-premises or inside a customer's cloud VPC, with an air-gapped mode available for environments that cannot permit internet egress. The stated security model keeps source data in the customer's environment, mirrors existing source-system permissions at retrieval time, and avoids using customer data to train models. The security page discusses document-level role-based access controls, auditability, deployment architecture, subprocessors, and compliance posture; certifications should be confirmed directly in diligence because public material describes security controls and audit status rather than establishing every certification as completed. Its product and technical materials name common engineering systems including GitHub, GitLab, Jira, Confluence, Slack, and CI/CD tools, and its examples also describe interfaces for Claude Code, Cursor, Claude Cowork, GraphQL, and MCP-compatible runtimes. This breadth is strategically relevant: a context layer must fit existing identity, developer, and agent infrastructure, and each connector adds both customer utility and integration-maintenance burden.

**Market, customers, and go-to-market.** Uvi sells into the enterprise AI infrastructure layer, initially emphasizing engineering organizations and teams that need agents to answer cross-system operational questions. The likely buying group includes platform engineering, developer productivity, data infrastructure, and security leaders who are accountable for agent quality, access control, and the cost of maintaining custom retrieval pipelines. The company's public site names Global-e and Melio as customers. Its Global-e case study says the deployment ran on-premises, integrated identity permissions, and supported more than 500 active users across the engineering organization; it reports a 97-out-of-100 head-to-head result against MCP-enabled GPT-4.1 on a set of user questions and a 20% decrease in support-ticket resolution time. Those are company-published customer metrics, not an independent controlled study, and the public case study does not disclose contract value, renewal, revenue, or the benchmark protocol. Go-to-market appears to combine a forward-deployed technical engagement with an ongoing platform license. The customer implementation can make a complex graph useful quickly, but it means sales economics depend on how much of the ontology and integration work becomes repeatable software rather than founder- or specialist-led consulting.

**Traction, funding, and third-party validation.** Startup Nation Finder and IVC list the Israeli company under its earlier Naboo Research / Naboo.ai identity, matching the current Uvi site on the 2023 founding date, Tel Aviv location, and founders. Startup Nation Finder reports a $2.5 million Seed financing in 2023 associated with 91 Ventures, while IVC independently lists 91 Ventures and Cardumen Capital in the company's investor and board context; the public records do not provide a fully reconciled round-by-round funding total. Current official materials identify production use by Global-e and Melio, and Uvi publishes a specific Global-e deployment narrative rather than only a logo wall. The company also has a live product site, technical guides, a security page, a hiring page with Tel Aviv and US roles, and an Apache 2.0 open specification plus reference MCP server for Decision Graphs. Those materials are useful proof of product activity and ecosystem intent, but not a substitute for audited usage, retention, revenue, or independent accuracy measurements. Publicly available sources do not establish current valuation, ARR, customer count beyond named references, patent filings, or a later priced round, so these remain diligence items rather than assumed traction.

**Founders and team background.** Uvi's official team page names CEO and co-founder Gilad Salinger and CTO and co-founder Dror Wolmer and says the company was founded in 2023 in Tel Aviv. The founders describe their prior work in Israeli high-growth technology companies; IVC lists Salinger as previously associated with Fetchy and Wolmer with NetApp's Tel Aviv Cloud Innovation Center and Cognigo. Their stated division of labor is relevant to the product: Salinger leads the enterprise context and decision-model thesis, while Wolmer built the Decision Graph and live ETL plumbing that connects an organization's systems. The official site calls the team small and lists roles in product and engineering in Tel Aviv alongside US enterprise sales and customer success positions. A public company profile under the earlier brand reported eight employees, but that count is a historical third-party snapshot rather than a verified current headcount. This is a technically coherent founding configuration for an integration-heavy data product, while the available evidence is thinner on the team's depth in large-scale commercial sales, formal security assurance, and deployment operations across many simultaneous enterprise customers.

**Competitive dynamics and edge.** Uvi competes with several approaches rather than one direct substitute. Glean offers enterprise search and AI answers over connected company data; Atlassian Rovo ties search and agents into the Atlassian product estate; Microsoft Copilot and Graph connectors bring enterprise context into Microsoft's collaboration and productivity stack; and in-house RAG or knowledge-graph projects let large engineering teams build tailored retrieval with their own data platforms. Some buyers can also reduce the problem by limiting agents to a narrow system or workflow. Uvi's claim is that those approaches typically search documents or inherit one vendor's data model, whereas its Topic Graph joins records across systems and its Decision Graph represents state, ownership, and the logic that links actions. The potential edge is strongest where the organization has complicated cross-system processes, strict access boundaries, and an existing agent strategy; in those settings, one permission-aware graph may replace duplicated connector and retrieval work. It is weaker for small teams, static knowledge bases, or organizations whose agents already operate within a single source of truth. The product's defensibility therefore depends on implementation quality, reliable permission mirroring, graph freshness, and measurable advantage over rapidly improving platform-native agents—not only on naming a new graph abstraction.

**Strategic relevance, stage, and diligence risks.** The core product is commercial enterprise infrastructure, and no public source reviewed here establishes a government, defense, intelligence, or critical-infrastructure deployment. Its on-premises, customer-VPC, air-gapped, and permission-aware architecture is nevertheless a credible adjacency for public-sector and security-sensitive organizations that want agents to work over internal systems without exporting sensitive context. That supports a calibrated dual-use assessment: the underlying technology can support security and resilience workflows, but defense adoption is a prospective use case rather than demonstrated traction. Uvi is best categorized as early stage: the product is released and used in named enterprise environments, but the public record does not establish broad market penetration, repeatable software-led deployment economics, or mature financial disclosure. Diligence should test whether the 97/100 benchmark generalizes beyond a company-selected query set; whether access-control inheritance remains correct after source permissions change; how graph staleness, deleted records, conflicting evidence, and mistaken entity resolution are handled; what independent security audits or certifications are complete; and how much implementation labor each deployment consumes. Additional risks include strong platform incumbents, an evolving category definition, dependence on third-party AI-agent protocols, limited public evidence on retention and revenue, and possible mismatch between a services-assisted initial rollout and a scalable software gross margin. These questions do not erase the strategic value of trusted enterprise context, but they keep product promise distinct from verified scale.
"""
