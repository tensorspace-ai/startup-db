name = "VigilAir"
description = "VigilAir is Vorpal Ltd.'s drone situational-awareness and counter-UAS product family, using passive RF sensing to detect, geolocate, and track drones and their operators. Public evidence supports an operational product, but does not establish VigilAir as an independent 2023 seed company."
detailed_description = """
VigilAir is presented on Vorpal's official website as a ground-based, distributed network of passive sensors for drone detection, geolocation, and tracking. The product page also describes VigilAir Drone, which adds an airborne sensor on a commercial off-the-shelf drone, and VigilAir Extract & Control, which can decode command-and-control transmissions, extract telemetry and embedded data, and facilitate drone takeover or mitigation. The public product description therefore points to an RF-led counter-UAS and drone-monitoring stack rather than a general air-defense command platform. Claims about exact sensor bands, machine-learning architecture, range, target classes, or neutralization performance are not sufficiently documented in the available public material.

The commercial proposition is strongest where customers need persistent awareness of low-altitude drone activity in dense or sensitive environments. Vorpal's site emphasizes passive, non-transmitting operation, high-accuracy geolocation, mass-target tracking, fixed or mobile deployment, and compatibility with dense urban environments. Plausible customer segments include airports, ports, critical infrastructure, public-safety organizations, military bases, and UAS traffic-management programs. The product can create value without immediately controlling a drone: a reliable air picture, operator-location data, identification-friend-or-foe workflows, and alerts can improve security response while reducing dependence on a single radar or camera modality.

Competitive dynamics are demanding. VigilAir competes with dedicated counter-UAS vendors such as Sentrycs, D-Fend Solutions, Dedrone, and DroneShield, as well as radar, electro-optical, acoustic, and RF detection suppliers that can be integrated by larger defense contractors. Vorpal's potential differentiation is passive RF sensing with operator geolocation and a relatively small, deployable footprint; the official site also claims zero false alarms and mass-target tracking. Those claims are meaningful only if supported by independent test data, representative urban trials, and documented performance against autonomous, frequency-hopping, non-emitting, and modified drones. The extraction and control module may broaden the product from awareness into mitigation, but its legal authority and operational limits depend heavily on jurisdiction and rules for use of force or spectrum interference.

Public evidence indicates meaningful commercialization signals but not the startup facts currently stored in this record. Vorpal's LinkedIn company page describes VigilAir as having reached Technology Readiness Level 9, having been sold to security-focused customers, and having operated at selected sites in the United States, United Kingdom, Europe, and Israel. The same source identifies the parent as a privately held Tel Aviv company established in 2016 with 11-50 employees. These statements support a mature product within an early-stage private-company context, but they do not verify a separate VigilAir legal entity, a 2023 founding date, seed financing, revenue, customer names, contract values, certifications, or deployment scale. Those items should remain diligence questions rather than database facts.

The defense and national-security relevance is credible because the core capability addresses detection and localization of small unmanned aircraft, a persistent force-protection and homeland-security problem. The same sensing and tracking functions can serve civilian airports, industrial sites, ports, and event security, making this substantive dual use rather than a defense label attached to a purely military product. Strategic assessment should nevertheless account for the parent-company structure, export controls, spectrum and privacy regulation, integration with authorized response systems, and the possibility that well-funded competitors or government programs commoditize detection. The strongest next diligence step is to verify the legal entity, ownership, customer references, independent performance evidence, and whether the product's mitigation features are actually deployed or remain an optional capability.
"""
