name = "Cybereason"
description = "Cybereason is a U.S.-incorporated cybersecurity platform with Israeli roots, known for endpoint detection and response, XDR, and its MalOp attack-investigation workflow. LevelBlue completed its acquisition in November 2025; Cybereason protections remain available to existing customers as LevelBlue consolidates its endpoint platforms."
detailed_description = """Cybereason, Inc. was founded in 2012 by Lior Div, Yonatan Striem-Amit, and Yossi Naar. Its commercial product is an endpoint-centered security platform that collects endpoint behavior and correlates related events into a MalOp, or malicious operation: a contextual attack narrative linking root cause, spread, techniques, affected users, and devices. The approach is designed to help an analyst investigate an incident as one operation instead of manually joining a large stream of alerts. The product family has included endpoint prevention and controls, EDR, XDR, threat hunting, vulnerability management, managed detection and response, and digital forensics and incident response. Company materials also describe on-premises and offline deployment options. LevelBlue's current endpoint page says Cybereason protection remains in place while acquired endpoint platforms are brought onto a common foundation; this makes product continuity and migration a live integration issue, not merely a historical acquisition detail.

The buyer problem is operational. Large enterprises and service providers need to find a breach quickly, identify its scope, contain affected systems, and preserve useful forensic context. Cybereason has sold software alongside consulting and response services, and historically used channel partners and strategic customer relationships to reach buyers. Its MalOp framing is most valuable when it reduces alert triage and incident scoping work, but public vendor claims do not establish detection superiority or customer savings. Diligence should compare actual endpoint coverage, false-positive burden, analyst hours, response outcomes, deployment friction, data-residency choices, and renewal behavior against the customer's installed security stack.

Public scale disclosures show a real but dated commercial footprint. A 2015 company retrospective said Lockheed Martin was both a customer and strategic investor and had begun a 120,000-endpoint deployment; the same retrospective reported 1,200% revenue growth over 2014 and headcount growth from 20 to 80. In August 2019, Cybereason said its customer base had grown more than 300% over two years, it protected over six million endpoints, and it had 500 employees. A February 2025 verified Delaware complaint filed by then-CEO Eric Gan and MCW HK described more than 2,000 global enterprise customers and more than five million endpoints. Those are dated company or litigant statements, not an audited customer census. LevelBlue's October 2025 acquisition announcement said Cybereason had customers in more than 40 countries. No current named-customer list, recurring-revenue figure, retention cohort, or post-acquisition usage measure was located. In particular, the historical Lockheed relationship supports defense-contractor applicability, but does not establish a U.S. government contract or classified deployment.

The technical thesis is a combination of endpoint telemetry, behavioral detection, correlation, guided investigation, containment, and human incident-response expertise. Public patent records identify Cybereason, Inc. as assignee on granted U.S. patents covering cyberattack prediction and response, pass-the-hash detection, and identity management. These records show product-relevant intellectual property, but they are not an exhaustive global portfolio review and do not settle post-acquisition title or any remaining encumbrances. A 2025 product-evaluation result promoted by LevelBlue is a vendor statement; buyers should test equivalent attack scenarios independently and examine underlying telemetry and response behavior.

Competition is broad and bundled. CrowdStrike Falcon competes with an integrated endpoint and security-operations platform; Microsoft Defender can combine endpoint signals with identity, email, cloud, and productivity-suite controls and can be purchased inside larger Microsoft security bundles; SentinelOne competes on autonomous endpoint response; and Palo Alto Networks Cortex XDR combines telemetry correlation with Unit 42 services. These vendors have scale, platform breadth, channel reach, and, in some cases, suite economics that can pressure standalone endpoint pricing. Cybereason's credible differentiation is the MalOp incident narrative, its historical deployment flexibility, and the combination of software with DFIR and threat research. Its durable edge depends on how well that workflow integrates into customers' SIEM, identity, cloud, and service-provider environments, and whether LevelBlue maintains the product investment needed to keep pace.

The team has relevant cybersecurity and operating experience, but leadership has changed repeatedly. The three founders built the original endpoint and attack-correlation product; company releases later described Lior Div moving to an advisor role and Eric Gan taking over as CEO in 2023, followed by Manish Narula's appointment in 2025. LevelBlue named Narula as Cybereason CEO when it announced the acquisition. The present Cybereason leadership and engineering roster inside LevelBlue is not publicly established. The 2025 Chancery complaint by Gan alleged a board deadlock, serious liquidity needs, debt maturities, and delays in issuing audited 2023 financials. These were allegations in litigation, not adjudicated findings; they are material historical evidence of financing and governance stress, and should not be presented as the company's current financial condition. LevelBlue completed the acquisition later in 2025, but deal value and post-close cap table remain undisclosed.

The strategic case is therefore as an acquired capability, not an independent venture investment. LevelBlue says the combination brings together Cybereason XDR, DFIR, threat intelligence, and AI work with its MDR, incident-response, and SpiderLabs operations. Its endpoint page says current customers remain protected while the products move toward a shared platform. That creates a route to cross-sell and broader response coverage, but also risks customer disruption, product rationalization, engineering attrition, and loss of the distinct MalOp workflow. The key evidence to seek is a funded roadmap, customer migration plan, retention and service-level data, and clear responsibility for source code, patents, and security updates.

The technology has substantive dual-use applicability because endpoint detection, attack correlation, containment, and forensics can protect commercial enterprises as well as government, defense-contractor, and critical-infrastructure networks. The 2015 Lockheed Martin customer deployment is historical, disclosed evidence of defense-industry use. Current LevelBlue materials discuss offline and private deployments for data-residency and critical-infrastructure needs. These facts support capability-level relevance; they do not prove classified use, a government award, accreditation, or deployment in a military operational system. Public-sector diligence should verify hosting and telemetry boundaries, supply-chain controls, product support commitments, and buyer-specific certifications rather than infer them from the product category."""
