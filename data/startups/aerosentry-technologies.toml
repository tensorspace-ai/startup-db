name = "AeroSentry Technologies"
description = "Aerosentry Technologies Ltd. is a Ra'anana-based Israeli startup developing AI, computer-vision, and autonomous UAV technologies for protecting critical assets. Public program and company-database records place it in R&D and identify a small team; an Israel Innovation Authority startup-fund award is disclosed, but no amount or customer revenue is public."
detailed_description = """Aerosentry Technologies Ltd. is an active private Israeli company registered as 517154902 and incorporated on 28 April 2025 at 62 Ha-Chayal Street in Ra'anana. The Israel Innovation Authority (IIA) entry associates the registration number with the Aerosentry name, lists five employees, R&D stage, AI and computer vision, and drone/UAV markets. Startup Nation Finder's last displayed profile update was 29 October 2025 and its operation ended on 31 August 2026; it independently described the company as an early-stage hardware and industrial venture, reported a 1–10 employee range and an undisclosed IIA grant, and named Eliav Levinson as co-founder. IVC's profile similarly reports the company's R&D stage and B2B orientation. These are useful identity and stage indicators, not audited operating metrics.

The product evidence has changed and needs careful attribution. The IIA listing describes AI and computer vision for protecting critical assets and the drone/UAV market. IVC's company profile describes an X1_pilot stack for agile maneuvering, integrated into an Aero-OS Ground Control stack, and real-time monitoring solutions. Those descriptions point toward autonomous aerial platforms and their control software, not a passive RF counter-drone detector. AeroSentry's official site is listed by the IIA and Finder as aerosentry.tech, but it was not retrievable in this research session, so no current company-authored technical specification or product page could be verified. A separate UK supplier, Drone Defence Services Ltd., markets its own AeroSentry-branded RF detection products and AeroTracker software. Its materials describe a different commercial offering and do not establish a relationship with the Israeli company. Accordingly, earlier RF bands, detection ranges, Remote ID/ADS-B functions, and AeroTracker integration are excluded from this company's verified capabilities.

The defensible product thesis is an early-stage AI/autonomy stack for UAVs, with public references to X1_pilot and Aero-OS and a stated goal of protecting critical assets. Potential value could come from the reliability of flight control and perception in constrained, high-tempo or hazardous environments, and from integration between autonomy, ground control, and real-time monitoring. Those are diligence hypotheses, not confirmed performance results. There is no public test report identifying supported airframes, autonomy level, GPS-denied capability, flight duration, payload capacity, obstacle-avoidance accuracy, safety case, cyber controls, or ability to operate amid electronic warfare. There is also no independently verified information on manufacturing readiness, system price, recurring software revenue, or product certification.

The business model is likely business-to-business or business-to-government rather than consumer-facing: Finder lists B2B, while the IIA identifies drone/UAV markets and classifies the technology in defense. That market can include commercial drone OEMs, infrastructure operators, integrators, and public security or defense buyers, but no named customer or contract is public. At a May 2026 counter-drone technology gathering reported by The Jerusalem Post, Aerosentry Technologies was among the attending companies. Attendance establishes ecosystem participation only; the article does not say that Aerosentry demonstrated a product, won an order, or supplied a military unit. No production deployment, revenue, paid pilot, repeat order, partnership, or customer reference could be confirmed in the reviewed public sources.

Funding evidence is mixed and should not be collapsed into a single equity history. Startup Nation Finder lists an undisclosed, non-equity Israel Innovation Authority grant in May 2025 and calls the company pre-funding. The IIA's company-specific record confirms a Startup Fund award entry, including the Startup Fund program in 2025, but gives no grant amount; it also displays “Additional Funding 0,” whose precise scope is not explained. IVC's commercial database separately displays one Seed round dated 1 March 2025 and one investor, but its round amount, valuation, investor names and even a clear instrument are obscured in the accessible page. That date precedes the company's April 2025 incorporation and the entry has not been corroborated by a company or investor announcement. The Seed entry is retained as an unresolved database-reported event, not converted into a priced round or an amount. No lifetime raised total or valuation is supportable. Equity cap table, grant terms, founder contributions, and any subsequent financing remain unknown.

The named founder is Eliav Levinson. IIA and IVC identify him as company contact/founder, and Finder labels him co-founder. His public LinkedIn profile describes more than 15 years of multidisciplinary systems-engineering experience and lists Technion education; those are self-reported profile details, not independently audited employment records. An Israeli company-information aggregator also identifies Tuval Ram Roth as a director, but its names and roles are incomplete and it is not an official registry extract. No dependable public evidence establishes a complete leadership roster, full-time commitment, engineering headcount, board composition, or senior commercial leadership. IIA's five-person count conflicts with Finder's exact-one field and 1–10 range, so five should be treated as a program-directory snapshot rather than a reconciled current payroll count.

Ownership data are also incomplete. Third-party company records report Aerosentry Technologies Inc. in a shareholder or option-holder relationship with the Israeli entity, but the English and Hebrew renderings use different labels and do not disclose percentages or instrument details. The record does not establish whether the US-named entity is a parent, option holder, or ordinary shareholder, and no public filing reviewed here resolves the discrepancy. The Israeli entity remains listed as active. No acquisition, merger, IPO, secondary sale, or other ownership transaction was found. A paid current Israeli registry extract and clarification from the company would be necessary to establish the cap table and any corporate group structure.

Commercial potential exists in both civilian and security markets, but it is conditional. Civil applications may include industrial inspection, infrastructure monitoring, site security and other UAV operations where controlled autonomous flight can reduce operator workload or exposure. Defense and public-safety applications could include reconnaissance, perimeter monitoring, and other asset-protection missions, consistent with IIA's defense classification and company positioning. These are plausible use cases rather than deployments. Dual-use relevance follows from the same aerial autonomy and sensing/control technologies being applicable across customer classes; no public source reviewed confirms a defense contract, operational military use, export authorization, or field-tested combat capability.

The market is crowded with established UAV OEMs, autonomy software providers, and defense integrators. XTEND publicly describes an AI-enabled operating system and autonomous platforms across defense, homeland security, and commercial security, making it an adjacent Israeli comparator with a broader published deployment record. Axon Vision describes edge-AI perception and decision-support systems for manned and unmanned military platforms, an adjacent perception competitor or integration alternative. These companies are not proven head-to-head competitors in every use case, but they demonstrate the breadth and maturity of substitute capabilities. Larger providers can bundle airframes, sensors, command software, training, and support, while a small startup must prove a measurable performance or cost advantage and secure integration partners.

The possible edge suggested by IVC is a vertically integrated pilot and ground-control stack, which could let Aerosentry tune flight behavior and mission software together. Public evidence does not demonstrate that this architecture is proprietary, better performing, or commercially deployed. Durable differentiation would require a repeatable advantage in autonomy, perception, safety, ruggedization, low-latency control, interoperability, or lifecycle economics, supported by independent test data and customer references. Patent and ownership searches did not identify a publicly attributable filing; this is not evidence that no patent applications, trade secrets, or other protected IP exist.

Key risks are early technical and commercial validation, little independently verifiable team information, uncertain current headcount, no disclosed equity round amount, unresolved IVC financing data, no confirmed named customers, and unclear ownership. UAV autonomy also raises safety, cybersecurity, airworthiness, privacy, export-control, and procurement questions. Defense applications may create strategic demand but can lengthen sales cycles and require qualification, secure supply chains, support capacity, and legal authorization. Civilian applications broaden the opportunity but entail competition from mature drone OEMs and systems integrators. The company merits continued strategic monitoring because its Israeli defense-tech classification and stated UAV/autonomy direction address a real technology need, while its investment case remains unproven until it supplies current product documentation, test results, ownership records, financing terms, and customer evidence."""
