name = "WiSP"
description = "WiSP is an Israeli sensing startup developing a reusable handheld device and companion app that use Raman spectroscopy and machine learning to detect drink-spiking agents and other chemical risks in seconds. The platform is aimed first at personal, campus, venue, and law-enforcement safety, with a broader roadmap for portable substance and contaminant screening."
detailed_description = """
**Product and the concrete problem it solves.** WiSP is building a small, reusable detector intended to move drink-spiking screening from a laboratory or a disposable strip into the moment when a person, venue operator, campus-safety team, or responder needs an answer. The immediate problem is practical: GHB and GBL can be colorless, odorless, and difficult to identify visually, while conventional laboratory analysis is too slow and centralized for a crowded event. WiSP’s public product description combines a sampling device, a reader or console, and a mobile application. A user takes a small sample from a drink, receives an indication in seconds, and can connect that result to alerts or an SOS workflow. The company says the current platform measures alcohol and common adulterants, while the wider vision includes other hidden risks in consumables. That is a focused wedge, but it is not yet the same as a broadly validated field chemical analyzer.

**Core technology and how it actually works.** WiSP’s technical stack is built around Raman spectroscopy, a non-destructive optical technique in which laser illumination produces a material-specific spectral fingerprint. The fingerprint is then interpreted by software and machine-learning models rather than by a human reading a laboratory chart. This matters because the same physical measurement can support a reusable instrument and a software-updatable detection library, instead of requiring a new disposable chemistry kit for every target. WiSP’s public materials describe electro-optics, chemical engineering, and machine learning as the combined capabilities behind the system. Its earlier development path included a tabletop prototype, followed by miniaturization into a portable device and app. The company says the device can identify GHB and GBL, quantify alcohol, and later add capabilities such as sugar or other contaminants. Public claims of forensic-level accuracy and more than 95% prototype accuracy should be treated as company or media-reported until independent datasets, sensitivity, specificity, matrix testing, and calibration procedures are disclosed.

**Market, customers, and go-to-market.** WiSP is pursuing a two-sided route into a safety market. The initial user can be an individual carrying the device, but the more credible early distribution channels are organized environments where safety is already budgeted: university campuses, sororities and fraternities, bars, clubs, festivals, event organizers, private-security providers, and public agencies. The company’s public site specifically presents law enforcement and campus safety as relevant audiences, while its 2025 public pilot involved Greek-life organizations at the University of Southern California, Washington University, and the University of Maryland. The Pollack Group, WiSP’s communications partner, described a target of approximately 1,500 app users and 500 device users in that pilot and said the company was pursuing city and government partnerships for nightlife-safety initiatives. WiSP’s 2025 press release said the device was planned for global availability in 2026, while the current site describes the product as under development and available only to selected partners. That combination suggests a pilot-led B2B2C motion rather than a proven retail launch.

**Traction, funding, and third-party validation.** The public record shows meaningful progress for a young hardware startup, but the evidence is still early. Startup Nation Finder records WiSP as founded in December 2022 by Liat Kaplan, Aviv Kaplan, and David Avraham, and reports a $100,000 Tel Aviv University investment in August 2023 after a startup competition. A 2025 PR Newswire release identifies the company as formerly My Bouncer, calls the technology patent-pending, and says its approach was validated by forensic and biotech laboratories. WiSP’s own drink-safety page names Integrated Pharma Services and The Institute for Forensic Science as validation partners, says the device has been piloted on five campuses, and describes an anonymized, geographic database intended to support law-enforcement access. A February 2026 N12 report adds that a prototype was tested at a forensic institute with accuracy above 95%, that pilots included US fraternities and Nottingham in the United Kingdom, and that the company reported more than $3 million raised while preparing production. Those claims are not reconciled into an audited financing history, and no regulatory clearance, recurring revenue, unit shipments, or independent peer-reviewed performance study is public.

**Founders and team background.** WiSP’s founding story is unusually close to the user problem. CEO and founder Liat Kaplan has publicly described the company as a response to the death of a relative in a drunk-driving incident and to the broader fear that a person may not know what is in a drink. The official team page lists Aviv Kaplan as co-founder and VP of Chemistry, which fits the company’s need to translate analytical chemistry into a product usable outside a lab. The same page identifies Dr. David Avraham as an advisor and co-founder, while Startup Nation Finder lists him as the founding CTO. The public team also includes Yokhai Dan in R&D and product, LeRoy Pingho as chair, and advisors with technology, product, and consumer expertise. The company’s interdisciplinary mix is strategically appropriate: optics, sampling, spectral interpretation, industrial design, mobile software, and user behavior all need to work together for a safety instrument. The gaps are equally important. Public sources do not establish the team’s current full-time size, manufacturing leadership, regulatory specialists, or the exact ownership and prosecution status of the patent-pending portfolio.

**Competitive dynamics.** WiSP competes against several different substitutes rather than one identical product. **Thermo Fisher Scientific** and other laboratory-instrument vendors offer Raman, FTIR, and mass-spectrometry systems with much deeper analytical validation, but they are expensive and generally unsuitable for casual, distributed screening. **Dräger** sells established breath-alcohol and drug-screening instruments, giving it regulatory, channel, and law-enforcement credibility even though its measurement modalities differ. **BACtrack** and **Hound Labs** represent consumer or professional breath-based alcohol and drug measurement, competing for the safety budget and the user’s trust. **Fentanyl test strips and other lateral-flow tests** are cheap, familiar, and easy to distribute, although they are generally single-analyte and disposable rather than reusable, multi-target optical systems. Venue procedures, trained staff, and centralized forensic testing remain the strongest incumbent approach. WiSP’s proposed edge is a discreet reusable form factor, non-destructive optical measurement, rapid feedback, an app-connected alert layer, and the ability to add targets through software and model updates. None of those advantages is durable until the company proves performance in mixed drinks, low concentrations, changing formulations, dirty samples, and real event conditions.

**Defense, security, and resilience dual-use relevance.** WiSP’s dual-use case is credible but bounded. The same combination of portable spectroscopy, machine-learning classification, rapid sampling, and connected alerts can support more than nightlife safety: first responders could use a compact screening tool for suspicious liquids, law-enforcement teams could perform presumptive checks at events or incident scenes, and public-health or emergency organizations could triage unknown contamination before sending samples to a laboratory. A future detection library that includes additional drugs, toxicants, or industrial contaminants could also be relevant to hazardous-material response and infrastructure protection. This is an enabling adjacency, not evidence that WiSP has a military product, classified customer, or fielded defense deployment. The current commercial proposition remains drink safety and wellness, and the company’s public claims concern GHB, GBL, alcohol, and prospective targets such as fentanyl, allergens, or infections. The strategic value therefore depends on whether the hardware can maintain selectivity and chain-of-custody quality outside controlled environments, whether law-enforcement access to its geographic data is governed responsibly, and whether the company can meet the evidentiary, privacy, procurement, and certification requirements of security users.

**Growth stage, trajectory, and key diligence risks.** WiSP is early-stage and should be treated as an R&D-to-pilot company, not a mature device manufacturer. The 2022 founding date, university-backed early investment, public pilots, production preparation, and selected-partner availability show movement beyond a laboratory idea, but the company has not publicly demonstrated scaled manufacturing, regulatory approval, broad distribution, or independently replicated accuracy. The trajectory is attractive if WiSP can turn a socially urgent use case into a reliable platform: first validate drink-spiking detection, then expand to additional substances without sacrificing false-alarm performance or user simplicity. The main diligence risks are: (1) **analytical performance**, especially concentration limits, false positives, false negatives, and interference from cocktails, ice, food coloring, and containers; (2) **hardware execution**, including optical calibration, battery life, ruggedness, sampling hygiene, and cost of production; (3) **regulatory and evidentiary acceptance**, because a consumer alert is different from a legally defensible forensic result; (4) **commercial adoption**, since venues and individuals may resist another device despite strong perceived need; (5) **privacy and liability**, including location, incident, and substance data; (6) **capital intensity**, as manufacturing and certification can consume a small company’s runway; and (7) **strategic scope risk**, because expansion into fentanyl, allergens, infections, or defense screening could distract from proving the first product. Milestones worth tracking are independent validation datasets, a named production partner, regulatory pathway, paid deployments, repeat orders, and disclosed unit economics.
"""
