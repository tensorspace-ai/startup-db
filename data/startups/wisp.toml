priority_rationale = "WiSP merits a monitored priority position because it is a rare Israeli startup combining deep-tech sensing with a clear personal-safety problem and a plausible path toward public-sector resilience use. (1) The underlying measurement approach is substantive: Raman spectroscopy and machine-learning classification can turn difficult chemical identification into a portable workflow. (2) The company has public evidence of a prototype-to-portable transition, campus pilots, forensic-lab validation claims, a Tel Aviv University investment, and partner-oriented law-enforcement positioning. (3) Its strongest strategic option is not simply consumer wellness; it is a distributed screening layer for event safety, first response, and presumptive chemical-risk triage. Priority remains capped by high execution risk, conflicting public funding and headcount information, the absence of regulatory clearance, no disclosed scaled manufacturing, and the lack of independently published performance data. The next evidence that would justify raising priority is a named production or regulatory partner, reproducible third-party validation, paid agency deployments, and clear privacy and evidentiary controls."
