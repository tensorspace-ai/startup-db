name = "CardioScale"
description = "CardioScale Ltd. was an Israeli medical-device startup developing the DTR8 portable monitor and CVRI hemodynamic-reserve index for trauma and deterioration triage. Israeli company-register data now lists the legal entity as voluntarily liquidated, with accelerated voluntary dissolution dated 2025-11-25; its legacy website remains online."
detailed_description = """
**Product and the concrete problem it solves.** CardioScale attacks one of the oldest and deadliest blind spots in emergency and battlefield medicine: a bleeding or deteriorating patient can look stable right up until they crash. Standard vital signs — heart rate, blood pressure, oxygen saturation — are lagging indicators; a young, fit casualty compensates for significant blood loss and holds "normal" numbers until compensation fails, at which point the window for intervention has often closed. In a mass-casualty or terror-attack scene with many wounded and few responders, the practical question is brutally concrete, as CEO Maoz Ben-Ari frames it: "Who do you treat first? Who will die without intervention?" Getting that prioritization wrong costs lives. CardioScale's answer is the CVRI (Cardio Vascular Reserve Index), a patented, non-invasive index derived from a simple arm-cuff measurement that produces an objective picture of a patient's hemodynamic *reserve* and its trend — surfacing occult shock and impending collapse earlier than the numbers a medic would otherwise read off a monitor. The measurement takes seconds, requires no special training, and can be performed in the field, which is exactly what a triage tool needs to be.

**Core technology and how it actually works.** CVRI is fundamentally a signal-processing and control-systems story dressed in a medical-device form factor. Rather than reporting a single physiological parameter, it treats the cardiovascular system as a dynamic control loop and fuses multiple vital-sign signals captured during a non-invasive arm-cuff cycle into one integrated index that reflects how much hemodynamic "reserve" the body still has before decompensation. The intellectual lineage matters here: the algorithmic core reflects the collaboration between clinical medicine and hard engineering — a physician-researcher who identified the diagnostic gap working alongside a Tel Aviv University control-systems expert to model the system mathematically. The company reports the index has been exercised across more than 1,000 cases, and its most rigorous public validation is a controlled hemorrhage study conducted with the Israel Defense Forces Medical Corps (a swine hemorrhage model, later published in *Annals of Medicine and Surgery* in 2017), in which CVRI reportedly predicted hemorrhage-related hemodynamic deterioration in every animal tested. The company also states it received CE Mark approval for its CVRI calculator. These are meaningful validation points, though the swine-study sample was small and broad multi-center human clinical evidence is not established in the public record.

**Market, customers, and go-to-market.** CardioScale sits at the intersection of two large markets — patient monitoring and emergency/trauma care — while deliberately entering through the narrower, higher-urgency door of triage and military medicine. The addressable clinical settings the company names span emergency trauma and hemorrhage management, sepsis and shock detection, ICU surveillance, pre- and post-operative deterioration monitoring, and chronic heart-failure management; the beachhead, per the CEO, is the military field, where the value of early occult-shock detection is most acute and the buyer (a defense medical corps) is concentrated. That go-to-market choice is coherent: rather than fight incumbents head-on in crowded hospital monitoring, CardioScale leads with combat-casualty-care and mass-casualty triage, where its differentiator — predicting decline before vitals change — is most decisive and where an Israeli company can leverage direct collaboration with the IDF Medical Corps as both development partner and reference customer. The counterweight is that a device-plus-algorithm sold into defense medicine faces long procurement cycles and must eventually cross into regulated civilian hospital channels to reach real scale.

**Traction, funding, and third-party validation.** CardioScale's strongest external validation is a defense-and-counterterror one: it won first place and a US$100,000 prize at the Combating Terrorism Technology Startup Challenge (reported as the CTTSC3 cycle, 2018), a competition jointly run by the U.S. Department of Defense's Combating Terrorism Technical Support Office (CTTSO), Israel's Ministry of Defense Directorate of Defense Research & Development (MAFAT/DDR&D), and the MIT Enterprise Forum of Israel. Winning a challenge explicitly co-judged by both the U.S. and Israeli defense establishments is a credible signal that serious counter-terror medical evaluators saw operational merit in the technology. Alongside that, the company points to CE marking of the CVRI calculator and the IDF Medical Corps hemorrhage study as third-party validation. What is conspicuously *absent* from the public record is disclosed venture funding, revenue, headcount, fielded-deployment numbers, or recent milestone news — the visible footprint clusters around 2017–2018. That opacity, and the possibility of low recent activity, is the single most important thing to verify in diligence; the technology's validation is real but dated, and current operational status should be confirmed directly.

**Founders and team background.** CardioScale was established in 2012 and is based in Ganei Tikva, Israel. Its origin is a classic clinician-plus-engineer pairing: Dr. Uri Gabbay, a family physician and disease researcher, identified the clinical diagnostic gap and recruited Prof. Ben-Zion Bobrovsky, a Tel Aviv University professor emeritus specializing in control systems, to build the mathematical model behind CVRI; Maoz Ben-Ari serves as CEO and co-founder and is the company's public voice. That combination — a physician who understands the bedside failure mode and a control-theory academic who can formalize it — is precisely the right DNA for a signal-derived physiological index, and it lends the core IP genuine technical credibility. The evident gap is commercial and regulatory scale: there is little public evidence of a deep executive bench in regulatory affairs, defense-medical sales, or manufacturing scale-up, and current headcount is not publicly confirmable. The team's strength is the invention; the open question is the organization's capacity (and current resourcing) to field and scale it.

**Competitive dynamics.** CardioScale competes less against a single rival than against the entire status quo of triage and monitoring. (1) Against **manual triage protocols** (START, shock index, clinician gestalt), CVRI's pitch is objectivity and earlier warning — removing guesswork from prioritization when responders are overwhelmed. (2) Against **advanced hemodynamic-monitoring incumbents** such as Edwards Lifesciences (whose predictive-hypotension analytics target a similar "detect decline early" thesis) and Masimo (noninvasive multi-parameter monitoring), CardioScale trades depth and installed base for a lightweight, training-free, field-deployable form factor. (3) Against **Israeli battlefield-medicine peers** — Biobeat's wearable cuffless vitals, the IDF's own BladeShield digital casualty-care system, and various continuous-monitoring wearables — CVRI differentiates on the specific claim of predicting occult deterioration before vitals move, rather than simply streaming more numbers. Its plausible edges are: (i) a genuinely predictive, reserve-oriented index rather than a lagging vital sign; (ii) a seconds-long, non-invasive, non-expert-usable measurement suited to austere environments; and (iii) dual US–Israeli counter-terror validation. Its vulnerabilities are equally clear: far better-capitalized incumbents, a small and possibly under-resourced organization, and the enormous regulatory and evidence burden required to displace entrenched clinical workflows.

**Defense, security, and resilience dual-use relevance.** This is where CardioScale's strategic profile is strongest and where dual-use is not a stretch but the core of the story. The same CVRI capability that helps a civilian ED prioritize a deteriorating trauma patient maps directly onto combat-casualty care and homeland-security mass-casualty response: detecting hemorrhage-driven occult shock at the point of injury, guiding evacuation priority, and extending the survivable window for the wounded. The validation pathway itself is defense-native — a hemorrhage study run with the IDF Medical Corps and a top prize in a US DoD / Israeli MoD counter-terror challenge — and the CEO has stated the initial product focus is the military field. In resilience terms, a rugged, cheap, training-free triage aid is exactly the kind of capability that scales in disasters, terror attacks, and battlefield conditions where trained clinicians are scarce and time is decisive. The honest calibration: the dual-use *relevance* is unusually direct, but the dual-use *deployment* — fielded, at scale, with a defense customer of record — is not documented publicly, so this should be read as a strategically well-aligned, defense-validated technology rather than a proven fielded system.

**Growth stage, trajectory, and key diligence risks.** CardioScale reads as an **early-stage**, invention-rich but commercially under-proven company: a 2012 founding, a patented and CE-marked core, credible academic-clinical validation, and a marquee defense/counter-terror award — but no disclosed venture rounds, revenue, headcount, or recent traction, with the visible public record concentrated around 2017–2018. The trajectory question is therefore existential rather than incremental: the technology cleared meaningful validation hurdles years ago, and the decisive unknown is whether the organization has continued to advance toward fielded deployment and regulatory scale or has gone largely dormant. The key diligence risks are: (1) **activity/continuity risk** — confirm the company is operationally active, funded, and staffed today; (2) **evidence-depth risk** — the strongest validation (a 17-animal swine study) needs large-scale human clinical confirmation to drive adoption; (3) **regulatory-and-reimbursement risk** — CE marking is a start, but broad clinical and (for U.S. markets) FDA pathways and reimbursement are unproven; (4) **commercial-scale risk** — a small team faces well-capitalized monitoring incumbents and long defense-procurement cycles; and (5) **disclosure opacity** — funding, customers, and deployments are not publicly verifiable. Progress from here would be evidenced by fresh funding, a defense customer of record, expanded human clinical data, and regulatory clearances beyond CE.
"""
