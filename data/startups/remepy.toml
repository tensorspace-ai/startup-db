name = "Remepy"
description = "Remepy is an Israeli-founded biotechnology and digital-therapeutics company developing Hybrid Drugs: prescription medicines paired with personalized, adaptive digital protocols intended to improve outcomes that pharmacology alone cannot address. Its lead Hybridopa program combines levodopa with a software-based intervention for Parkinson's disease and is being prepared for global Phase III development."
detailed_description = """
**Product and the concrete problem it solves.** Remepy is building a new drug-software category around a practical limitation of conventional medicine: a prescription can change a biochemical pathway, but it does not automatically deliver the physical, cognitive, behavioral, and rehabilitative interventions that determine how a patient functions day to day. The company calls its answer a Hybrid Drug, a single treatment architecture in which a conventional pharmaceutical is paired with a prescribed digital intervention. Its lead program, Hybridopa, combines immediate-release levodopa/carbidopa with DopApp, a mobile application that delivers adaptive daily protocols for motor, speech, cognitive, emotional, and autonomic functions. The target problem is especially clear in Parkinson's disease. Levodopa remains the standard dopamine-replacement therapy, yet disease progression can bring wearing-off, freezing of gait, speech impairment, mood symptoms, and executive-function problems that medication alone does not fully resolve. Remepy is therefore trying to make multidisciplinary care more consistent and scalable, not merely to add a wellness app to a pill. The commercial promise is that a pharmaceutical company could improve the real-world performance and lifecycle of an existing or new medicine through a clinically evaluated digital component that is prescribed and reimbursed within the ordinary drug model.

**Core technology and how it actually works.** Remepy's platform is an adaptive software layer designed to modify treatment protocols based on patient performance, behavior, and clinical status. The company describes its digital interventions as evidence-based combinations of motor, cognitive, psychological, speech, and rehabilitation exercises rather than a generic chatbot or passive monitoring application. In Hybridopa, DopApp is intended to synchronize the pharmacological pathway, which supplies dopamine through levodopa, with a behavioral-digital pathway that repeatedly trains relevant neural and functional circuits. Public materials describe outcome measurement through standardized clinical scales such as the Movement Disorder Society Unified Parkinson's Disease Rating Scale, functional MRI, and blood and saliva biomarkers including cortisol and cytokines. That combination matters because Remepy is claiming more than user engagement: it is trying to show that a digital protocol produces measurable biological and clinical effects that complement the medicine. Its regulatory framing is also concrete. Remepy says its products are being developed through FDA Software as a Medical Device or Prescription Drug Use-Related Software pathways and held to pharmaceutical and healthcare quality, security, and privacy standards. The technical caveat is equally important: the public evidence establishes the architecture and an early clinical signal, but it does not yet establish that the adaptive algorithms generalize across larger populations, indications, devices, or adherence patterns.

**Market, customers, and go-to-market.** The natural buyers and channel partners are pharmaceutical companies, biotechnology companies, clinicians, and healthcare systems that want better outcomes from existing medicines or differentiated combination products. Remepy has described several routes to market: co-development with pharmaceutical partners, prescription digital therapeutics integrated into a drug program, and a pipeline in which its platform is applied to neurological, oncology, autoimmune, eye, and women's-health indications. The Merck KGaA relationship is the clearest public example. In April 2026, the companies announced a collaboration to develop Hybrid Drugs across multiple indications, beginning with rare tumors; the partnership gives Remepy an enterprise route into a major pharmaceutical ecosystem while giving Merck an option on a drug-plus-digital modality. For Parkinson's disease, the company is preparing Hybridopa for a global Phase III program expected to begin in the second half of 2026, with the drug-software combination designed to fit physician prescription and payer reimbursement workflows. This is a strategically attractive go-to-market model because pharmaceutical sales forces, regulatory teams, and reimbursement relationships can be reused rather than rebuilt as a consumer wellness brand. It is also a demanding one: adoption depends on clinical evidence, patient adherence, physician workflow, data governance, reimbursement, and the ability to persuade a regulated industry that an app is part of a medicine rather than an optional support service. Public sources do not disclose recurring revenue, paying customer count, or signed commercial economics.

**Traction, funding, and third-party validation.** Remepy announced a $36 million Series A on August 12, 2026, led by O.G. Venture Partners and M Ventures, the strategic venture arm of Merck KGaA, with participation from NFX, Vine Ventures, Qumra Capital, TechAviv, 97212 Ventures, Fresh Fund, PsyMed Ventures, Tadmor Group, Key1 Capital, IT-Farm, and others. The company said the financing brought total capital raised to $62 million and would fund the Hybridopa Phase III program, pharmaceutical co-development partnerships, and broader platform expansion. That financing is meaningful validation of the category and of the company's ability to fund a costly clinical and regulatory path, but it is not proof of approval or commercial scale. The strongest operating evidence is the company's May 2026 report of a randomized, double-blind, placebo-controlled Phase IIa study conducted with Reichman University. The company reported that 41 participants were evaluated, with a mean 9.7-point improvement on MDS-UPDRS Parts I, II, and III versus 1.95 points in the control group, a reported p-value of 0.0005, and a 90% responder rate under its stated threshold. The associated Brain Communications paper, published by Oxford University Press, describes a randomized study of 42 levodopa-treated patients and reports functional MRI analysis of motor and limbic network changes. The distinction between these facts matters: the peer-reviewed paper supports the existence and design of the study and its mechanistic analysis, while the company's broader product and regulatory claims still require replication in larger trials. Remepy's 2024 Geek Awards Summit startup-of-the-year recognition and its 2026 Merck collaboration add ecosystem validation, not clinical approval.

**Founders and team background.** Remepy is led by co-CEOs Dr. Michal Tsur and Or Shoval and was founded in 2021 with Shahar Shelly also identified as a co-founder by Startup Nation Finder. Tsur brings unusually relevant founder experience across Israeli cyber and internet infrastructure: she co-founded Cyota, which was acquired by RSA Security, and later co-founded Kaltura, where she served as president. Her background combines a PhD in law, technology-company building, cybersecurity, and a demonstrated ability to work with complex enterprise and regulated markets. Shoval brings a different but complementary profile. TechAviv describes his more than six years as a captain in an elite Israel Defense Forces unit, where he oversaw special field operations and technology-development initiatives, followed by a liberal-arts and philosophy degree at Shalem College. The operating leadership listed by Remepy includes Prof. Amir Amedi as Chief Scientific Officer, Eran Etam as Chief Technology Officer, Dr. Nira Saporta as Chief Therapeutics Officer, Shai Erlich, MD, PhD, as Chief Clinical Development Officer, Renan Gutman as Chief Product Officer, and Nora Siperman as CFO. The advisory and board bench includes Nobel Laureate Aaron Ciechanover, Moderna co-founder Robert Langer, former Pfizer CEO Henry McKinnell, former Biogen CEO Michel Vounatsos, and M Ventures scientific and biotechnology leaders. This mix is valuable because the company must bridge neuroscience, software, clinical development, pharmaceutical partnering, and regulatory execution. The diligence limitation is that prominent advisers cannot substitute for evidence that the operating team can run a global Phase III program and establish quality systems at scale. Startup Nation Finder lists 51–200 employees and 59 exact employees, but Remepy does not publish an audited current headcount.

**Competitive dynamics.** Remepy competes in a fragmented market rather than against one identical product. Click Therapeutics is the closest strategic analogue, developing prescription digital therapeutics and drug-plus-digital collaborations with pharmaceutical partners. Akili Interactive represents the regulated digital-therapeutics approach, including software intended to deliver clinically meaningful cognitive interventions through a prescription model. MedRhythms competes in neurological digital therapeutics with music-based, sensor-informed interventions for gait and mobility. Biofourmis and Kaia Health represent adjacent digital-care approaches that use personalized software, remote monitoring, and condition-specific programs, even where their commercial models are not drug-paired products. Large pharmaceutical companies also remain an incumbent approach because they can bundle patient-support programs, companion diagnostics, adherence services, and lifecycle-management teams internally. Remepy's stated advantage is integration: it is attempting to design the pharmacological and behavioral mechanisms as one clinically measured product, rather than selling a stand-alone wellness application or a generic remote-care layer. The most important competitive question is whether its proprietary protocols and clinical data produce a reproducible treatment effect that is difficult for a pharma partner or digital-health incumbent to recreate. If the answer is yes, the company may own a valuable category and a dataset linked to outcomes; if not, the digital layer could become a service feature negotiated away by drug developers.

**Defense, security, and resilience relevance.** Remepy's core technology does not currently qualify as a demonstrated defense or security capability, so dual-use is set to false. Its strategic relevance is instead a bounded health-resilience adjacency. A clinically validated system that makes multidisciplinary treatment more scalable could help maintain quality of care when specialist capacity is constrained, including during public-health emergencies, workforce shortages, disrupted access to rehabilitation, or long-duration care demands. A prescription digital layer that adapts at home could also reduce dependence on frequent in-person sessions and make some chronic-care protocols more distributable across geography. The company's Israeli origin, Shoval's military technology background, and its combination of AI, neuroscience, clinical evidence, and regulated software make it relevant to a resilience-oriented ecosystem review. Those facts do not establish medical-countermeasure, military medicine, battlefield rehabilitation, or government procurement capability. There is no public defense customer, military contract, classified program, emergency-response deployment, or evidence that Hybridopa has been evaluated for operational readiness. Any future strategic-health use would require indication-specific safety and efficacy data, cybersecurity and privacy controls, accessibility under degraded connectivity, clinical governance, and a procurement pathway. The defensible assessment is therefore that Remepy may contribute to allied health-system resilience if the platform becomes an approved and deployable therapeutic, while its present value is primarily commercial and clinical.

**Growth stage, trajectory, and key diligence risks.** Remepy is classified as mid-stage because it has moved beyond concept and early feasibility: it was founded in 2021, has raised $62 million according to its latest announcement, reported Phase IIa evidence, published a peer-reviewed mechanistic study, signed a multi-indication collaboration with Merck KGaA, and is preparing a global Phase III trial. It is not mature. Hybridopa is investigational and not FDA-approved, the Phase III program has been announced rather than completed, and the public record does not provide recurring revenue, reimbursement wins, regulatory clearance, customer concentration, or long-term adherence data. The most important diligence points are: (1) **clinical replication:** whether the Phase IIa effect survives a larger, more diverse and longer trial; (2) **regulatory classification:** whether regulators treat the drug-software combination as a coherent therapeutic with a manageable review path; (3) **adherence and usability:** whether patients consistently complete multimodal protocols outside a trial setting; (4) **commercial dependence:** whether pharmaceutical partners pay for and protect the digital component rather than treating it as a low-margin support feature; (5) **data and cybersecurity:** whether patient data, algorithm updates, and clinical audit trails meet global healthcare requirements; (6) **pipeline concentration:** whether the category can expand beyond Parkinson's and the initial rare-tumor collaboration; and (7) **capital and execution risk:** whether $62 million is sufficient for Phase III, regulatory submissions, manufacturing or distribution partnerships, and enterprise expansion. A successful Phase III and a reproducible pharma-partnering model would materially raise Remepy's strategic importance; a failed trial or weak adherence would reduce the thesis to an interesting but difficult-to-scale digital-health experiment.
"""
