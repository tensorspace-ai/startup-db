name = "Placer.ai"
description = "Private location-intelligence company that turns privacy-preserving mobile-location and place data into market intelligence for organizations making decisions about the physical world. Its platform serves retail, commercial real estate, consumer brands, finance, advertising, entertainment, healthcare, and civic users."
detailed_description = """
Placer.ai operates a data and software platform for measuring activity at physical locations. It receives location information from mobile-application partners after identifiers such as mobile advertising IDs are removed, then applies place-of-interest matching, aggregation, statistical extrapolation, and machine-learning models to estimate visits, dwell, trade areas, audience attributes, journeys, and market trends. The customer-facing product is an analytics workflow rather than a raw device-feed marketplace: dashboards, reports, APIs, exports, and newer AI-assisted analysis help users compare properties, chains, regions, and demographic or behavioral segments. Placer says its outputs are aggregated, do not display user-level data, and use a minimum threshold of 50 devices for presented location information.

The commercial buyer is any organization with exposure to offline demand. Retailers and restaurants use visitation, loyalty, competitive-catchment, and site-selection analysis; commercial real-estate owners, brokers, lenders, and investors use property benchmarking and tenant or market research; CPG, advertising, finance, entertainment, healthcare, higher education, and municipal teams use the same underlying measurements for planning and performance decisions. This breadth is a meaningful commercialization asset because one data foundation supports multiple products, but it also makes data quality, sampling bias, geographic coverage, and reproducibility central diligence questions. The company reports more than 4,000 customers and $100 million in annual recurring revenue in 2024, which are company-reported traction signals rather than independently audited financial results.

Competition comes from specialist location-analytics providers, mobility-data vendors, geospatial and mapping platforms, foot-traffic measurement products, and customers' own first-party transaction or loyalty data. Placer's defensibility is therefore more likely to come from accumulated place normalization, historical time series, model calibration, workflow integration, brand coverage, and customer trust than from an exclusive algorithm. Its API and data marketplace can make the platform useful as an enrichment layer, while pre-built reports reduce the technical burden for commercial teams. The tradeoff is dependence on third-party supply, mobile operating-system permissions, privacy law, partner compliance, and the continuing cost of validating estimates against ground truth.

Placer.ai is an independent private company with substantial late-stage scale signals. Its official history describes a platform launch in 2018 and $100 million in ARR in 2024; public reporting also describes a $75 million 2024 financing at an approximately $1.45 billion valuation, after the earlier Series C. Current public materials describe thousands of customers, daily data freshness, a panel of tens of millions of devices, and an ISO/IEC 27001:2022-certified information-security management system. These claims warrant normal diligence on definitions, cohort retention, gross margins, source concentration, and certification scope. The company is not a defense contractor and does not present its core product as a targeting or intelligence system. Its security relevance is limited but real: aggregated visitation and infrastructure-usage trends could support lawful open-source situational awareness, emergency planning, logistics analysis, or resilience assessments. K-anonymity, obfuscation, licensing restrictions, and the lack of individual-level identity make it unsuitable to characterize as turnkey operational intelligence or a direct targeting capability.
"""
