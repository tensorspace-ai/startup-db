name = 'Bagira Systems'
description = "Bagira Systems is an Israeli developer, integrator and operator of military simulation and training systems for armed forces and security customers. Its Digital Dust live, virtual and constructive training concept combines products such as B-One, force-on-force, joint fires, UAV mission simulation, infantry skills, digital sandbox and CBRN training with site operations and lifecycle services. The operating business is held by publicly traded Bagira M. Holdings Ltd. (TASE: BGRA), listed in June 2026."
detailed_description = """
Bagira Systems is the operating defense training business within Bagira M. Holdings Ltd., an Israeli public company listed on the Tel Aviv Stock Exchange in June 2026 under ticker BGRA. The listed parent was incorporated in Israel in 2004 as Armaz Holdings and changed its name in 2020. Its prospectus describes one consolidated activity: developing, manufacturing, installing, operating and marketing simulation and training systems for security forces. The group says it began its activity in the 2000s through Israeli Ministry of Defense support and maintenance work, then developed its own simulation engine, field training software, exercise control and review tools, and equipment that simulates weapon systems. This substantiated history supersedes the old profile's unsupported 2009 founding date and Series A label.

The product architecture is presented as Digital Dust, a live, virtual and constructive training environment. The official product range includes B-One simulation components, force-on-force, JTAC and joint fires, UAV mission simulation, infantry skills training, digital sandbox, howitzer crew training, CBRN simulation and other simulation components. Products may be integrated with customers' command-and-control systems and equipment. The public record describes tailored scenarios and integration work rather than a single standard software subscription. Deliveries can include system design, hardware, simulator facilities, commissioning, instructors, operations, maintenance and support over many years. Revenue therefore mixes system and project deliveries with recurring support and operations; timing is affected by procurement awards, customer acceptance milestones, installation schedules and foreign exchange.

Bagira reports operating simulators at more than 80 sites and training more than 200,000 soldiers annually. Its 2025 prospectus says it supplies the Israeli Ministry of Defense and reports activity as a direct prime in six countries and as an OEM subcontractor in 16 countries. Older company and sector reporting documents its Israeli Defense Forces deployments, Dutch joint fires training, Thai Army howitzer crew and battlespace integration, and work in U.S. Army training services through prime contractor PULAU. These records are evidence of deployed systems and customer programs; they do not mean Bagira receives the full face value of prime contracts awarded to another contractor. The company discloses contracts through anonymized customer labels in some filings, so several country and customer identities cannot be mapped with confidence.

Commercial traction has strengthened materially. The IPO filing provides audited consolidated revenue of ₪269.679 million in 2025, compared with ₪173.577 million in 2024 and ₪106.030 million in 2023. The company-reported first-half 2026 presentation shows revenue of ₪163.0 million, net income of ₪54.1 million, adjusted EBITDA of ₪95.1 million and cash and cash equivalents of ₪381.7 million at June 30, 2026. The presentation compares first-half 2026 revenue to ₪107.9 million for the same period of 2025. It reports a backlog of ₪519 million at June 30, 2026, down from ₪538 million at June 30, 2025, and explains that defense procurement orders are seasonal and concentrated in the second half. It also reports that 63% of 2025 revenue came from Israel and 37% from Europe; customer concentration, particularly Israeli Ministry of Defense exposure, remains a material diligence issue. These are issuer-reported results and management presentation data, not independent forecasts. The same presentation states a 2026 revenue target of ₪340–380 million and growth objectives for 2027–2030; those targets are forward-looking and are not treated here as achieved results.

Bagira's June 2026 IPO comprised 70 million shares at ₪12.22 each, for gross offer proceeds of approximately ₪855.4 million. The issuer's results notice separates approximately ₪200.408 million of primary capital to the company from approximately ₪654.992 million received by selling shareholders. The latter is secondary liquidity, not company financing. The issuer thus became public and received meaningful growth capital; the IPO was not a venture Series A. The post-offer filing disclosed founder and chairman Arie Mizrahi with 37.4%, CEO Yaron Mizrahi with 18.7%, and vice-chairman and business development executive Sagi Mizrahi with 18.7%, alongside public holders, employees and service providers. Private pre-IPO cap table details beyond the prospectus disclosure are not assumed. No VC round or institutional investor allocation names were established from reviewed public material; the institutional book contained 42 accepted orders, but the filing did not identify those investors.

The strongest technical proposition is the integration of simulation software, domain scenarios, physical trainers, exercise control and after-action review with customer doctrine and operational equipment. This can produce high switching costs once systems and instructors become embedded in a training program, and lifecycle services can create revenue after delivery. A 2018 report on the Thai Army integration describes B-One supporting a full joint fires workflow across forward observers, fire direction and gun crews; Bagira's systems were integrated with Van Halteren howitzer crew trainers and Thai command-and-control. A separate Dutch program used Bagira's JOBSS for joint fires training and site operations. These are specific implementation examples, not proof that every product is interoperable with every customer system. Bagira also discloses NATO certification for joint-fires training in its prospectus. The reviewed materials do not provide independent comparative training outcome studies, software architecture audits, cyber assessments or product-level IP schedules.

Competition includes large defense and training suppliers such as Elbit Systems, Thales, Rheinmetall and CAE, as well as specialist simulation providers and customer-built training environments. Bagira competes on tailored integration, operational know-how, installed facilities and support availability; larger rivals can bundle training with broader platform and defense programs, while local firms may win through national procurement relationships. The company itself identifies market competition as a principal risk. The existing record supports specialist differentiation in land-force and joint-fires training, but does not substantiate the old profile's broad claims of global leadership, measured training effectiveness, a 6–8% market growth rate, or superior cost position. Those should not be used in investment decisions without independent market and customer evidence.

Leadership and control remain closely tied to the Mizrahi family. Arie Mizrahi is a founder and chairman; Yaron Mizrahi is president and CEO; Sagi Mizrahi is vice-chairman and business development executive. The IPO prospectus also discloses Major General (res.) Yoel Strick as CEO of Bagira Israel and a small post-offer holding. The group's operating growth, hiring, ability to execute multiple installations, and expansion in Europe are important drivers. Public reporting in 2025 described about 410 employees, while a currently accessible careers page lists a large set of vacancies across Israel, Czechia, the Netherlands and Germany; job listings show hiring activity but are not a verified current headcount. Current operations, customers and audited filings make the public-company parent and active operating subsidiary the appropriate classification.

Dual-use applicability is real but secondary. Simulation, exercise coordination, scenario control and after-action review can support emergency response, CBRN preparedness and security-force training; Bagira explicitly markets CBRN simulation and security training. However, the disclosed revenue base, products and contracts are overwhelmingly defense and government oriented. No evidence was found that civilian emergency-management activity is material revenue. Strategic value comes from maintaining training readiness while limiting expenditure and hazards associated with some live exercises, plus supporting allied interoperability. Risks include dependence on government procurement, a high Israeli revenue share, contract timing and concentration, export controls and political access, currency movements, cyber and integration obligations, field-service execution, and competition from primes able to bundle simulation into wider defense contracts. Due diligence should obtain current audited filings, customer concentration and renewal schedules, backlog conversion, product-level margins and recurring revenue definitions, details on the 15-year NATO-country contract and its options, export licenses, independent system security reviews, and evidence behind claimed readiness outcomes."""
