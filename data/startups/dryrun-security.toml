name = "DryRun Security"
description = "DryRun Security is an AI-native application-security platform that builds codebase context, reviews pull requests and repositories, validates exploitability, and gives developers remediation guidance and policy feedback where they work. Its stated differentiation is contextual security analysis for logic flaws and other risks that pattern-oriented SAST can miss."
detailed_description = """
DryRun Security sells a code-security intelligence layer for development and AppSec teams. Its product combines PR code review, repository-wide DeepScan analysis, custom code policies expressed in natural language, triage and trend reporting, secrets detection, and infrastructure-as-code checks. The company says its analysis first maps architecture, code relationships, Git behavior, frameworks, routes, authorization boundaries, and data flow into a continuously updated knowledge graph. Specialized agents then analyze code intent and behavior, prioritize likely hotspots, validate exploitability and impact, and guide a fix. This is a materially more ambitious proposition than a lint rule or a thin LLM wrapper, although the technical and economic value still depends on reproducible accuracy, latency, privacy controls, and the cost of model inference.

The target customer is an organization whose software change rate has outgrown its AppSec capacity. DryRun integrates with GitHub and GitLab and advertises notifications through Slack, with API and MCP capabilities for agent-native workflows. The current website lists support for Python, JavaScript, TypeScript, Java, C#, Ruby, and Go, while its documentation describes PR scanning, full-repository baselining, risk-register workflows, administration, and integrations. GitHub Enterprise Server support announced in the company blog is relevant to larger or regulated deployments. The value proposition is strongest when security engineers need to focus on a small number of consequential changes and developers need actionable explanations without leaving code review; the product is less obviously differentiated for teams that only need commodity secrets, IaC, or conventional SAST coverage.

Commercial signals are credible but should be separated from verified operating metrics. DryRun emerged from stealth in 2023, publicly identifies James Wickett and Ken Johnson as co-founders, and announced an $8.7 million seed round in January 2025 from LiveOak Venture Partners, Work-Bench, and Cannage Capital. Its own site displays customer testimonials or references associated with Tines, Commerce, Invisible Technologies, BrightHR, PlanetArt, SimpleRose, Denim Group, Cloud Security Partners, and Defect Dojo, and it publishes product and research updates. Those are useful evidence of market engagement, not proof of recurring revenue, retention, deployment breadth, or superior detection performance. Diligence should request cohort retention, paid conversion, expansion, scan volume by customer, gross margin after inference costs, independent benchmark methodology, and the proportion of findings that receive human confirmation.

Competitive pressure is high. DryRun competes with Snyk Code, Semgrep, GitHub Advanced Security and CodeQL, SonarQube, Checkmarx, Veracode, and newer AI-assisted code-review products. Incumbents already own repository permissions, CI/CD integrations, developer trust, and security data, while cloud and platform vendors can bundle code analysis into broader application-security suites. DryRun’s contextual knowledge graph, exploitability-oriented triage, natural-language policies, and agent-native remediation could create a useful wedge if the system consistently detects authorization, IDOR, authentication, injection, and business-logic weaknesses with fewer false positives. The key question is whether that advantage survives across languages, frameworks, monorepos, legacy systems, and adversarial or AI-generated code, rather than appearing only in curated demonstrations.

The strategic and national-security relevance is defensive and credible. Software assurance, secure code review, supply-chain visibility, and protection of developer pipelines matter to cloud providers, regulated enterprises, critical-infrastructure vendors, and public-sector software programs. The same product can help screen human-written and AI-generated changes before deployment and can produce security evidence for governance or customer assurance. That creates dual-use adjacency without implying government adoption, classified work, offensive capability, or a defense contract. The record therefore merits continued strategic tracking as an early-stage defensive cyber company, with medium risk because the market is crowded, the product handles sensitive source code, and the strongest performance claims remain company-reported rather than independently established.
"""
