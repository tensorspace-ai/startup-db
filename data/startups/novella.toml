name = "Novella"
description = "New York-headquartered Israeli-linked insurtech startup that combines licensed wholesale E&S insurance brokerage with AI-enabled workflows for complex commercial property and liability placements."
detailed_description = """Novella is a wholesale excess and surplus (E&S) property and casualty insurance brokerage serving U.S. retail insurance agencies. It helps place commercial risks that standard admitted-market products may not fit, including commercial real estate, habitational properties, hospitality, construction, and general or excess liability. The company is a broker and distribution business with software and AI agents embedded in its brokerage workflow; the reviewed evidence does not describe it as a carrier underwriting the insurance risk or as a stand-alone software vendor.

Its public website describes a live marketing report, shared and layered program assembly, real-time submission tracking, and quotes within 24 hours. The product page lists commercial real estate schedules of up to 20 locations and $100 million total insured value, with coastal, flood, and earthquake coverage options. The company also markets hospitality and contractor placements. These are company statements about offered products and service speed, not independently measured service levels.

In its May 2026 financing announcement, Novella said AI agents assist with placement, binding, form comparison, policy review, subjectivity collection, inspections, billing, endorsements, and renewals. That workflow spans intake and market matching through policy servicing. The practical value proposition is to let wholesale brokers spend less time on repetitive paperwork while preserving the human broker relationship with retail agents and carriers. Technical details about models, integrations, deployment controls, evaluation results, and how decisions are approved were not disclosed in the reviewed sources.

The company was founded in 2024. It is headquartered in New York and reports a Tel Aviv research and development center. CTech reported that roughly half of Novella's 20-person team was in Israel in May 2026. The company has also announced Miami and Houston offices, while its team page shows six regional U.S. hubs and says it is licensed in all 50 states. That page lists 14 brokers, which is a broker count rather than a separate company-wide headcount.

The operating brand is associated in public records with Novella Insurance Agency LLC in the United States and Novella Israel Tech Ltd in Israel. IVC maps the Israeli entity to bynovella.com and the insurance business; an Israeli registry aggregator identifies Novella Israel Tech Ltd as an active private company, number 516958923. The reviewed sources establish an Israeli-incorporated technology entity and Tel Aviv R&D activity, but do not disclose the complete corporate ownership chain or intercompany agreements. A similarly named Israeli plant-cell biotechnology company, Novella Innovative Technology Ltd, is a separate business with different products, website, and registration number; its patent is not attributed to this insurance company.

The company reports more than 3,500 appointed retail agencies sending business and appointments with close to 100 specialty carriers and managing general agents. Those figures indicate distribution access, but do not show how many submissions are quoted, policies are bound, premium is placed, or agencies are active and retained. CTech reported a seven-figure revenue run rate five months after public launch, attributing the statement to the company; no precise amount, currency, accounting basis, or period was disclosed. These limits matter because operational scale and brokerage economics cannot yet be evaluated from public data."""
