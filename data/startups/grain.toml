name = "Grain"
description = "Grain Financial Technology Ltd. is a Tel Aviv fintech company that embeds foreign-exchange exposure management and hedging into platforms handling international transactions. Its public materials describe API and file-based workflows for quoting and executing currency hedges, collecting local currency, and settling cross-border payments."
detailed_description = "Grain Financial Technology Ltd. builds embedded foreign-exchange infrastructure for businesses whose customers, suppliers, or inventory are spread across currencies. Its stated core is a B2B2B platform: a marketplace, travel platform, payment provider, or supply-chain software company can surface FX workflows to its own business users. Grain describes integrations through an API or file uploader, transaction and exposure tracking, currency pricing, spot conversion, forwards, local-currency collection, virtual FX accounts, and settlement coordination. The company says its pricing and hedge recommendations use transaction and cancellation histories with machine-learning methods. Those are product descriptions from Grain and its lead investor, not independently audited performance claims.\n\nThe product addresses a specific operational gap. A cross-border platform may collect revenue in one currency while paying hotels, suppliers, or service providers in another, and the final exposure can change as bookings are cancelled or invoices shift. Grain says it can tie FX treatment to underlying transactions, let the platform decide how much risk to assume or pass through, and combine exposures before arranging hedges. In a November 2022 interview, co-founder Aharon Navon described a liquidity-provider and spread-based model without a flat subscription charge; current pricing and allocation of risk need to be confirmed because the present product pages and terms describe a broader service set. Grain's terms state that forwards require approval and may require variation margin or cash collateral. The terms also describe Grain Finance B.V. and payment service provider TransferMate Ltd. as relevant service entities.\n\nThe Israeli legal entity is listed as active, incorporated in 2022, and headquartered in Tel Aviv. A Dutch entity, Grain Finance B.V., is reported as owned by the Israeli company. Publicly identified founders and executives include Dor Golan, Michal Beinisch, Aharon Navon, and product executive Nir Galon. In March 2025, Grain emerged from stealth with a reported $33 million Series A and said it had processed more than $1 billion in annual transaction volume. Earlier seed reporting conflicts between $18 million and $19 million. Grain has not published audited financial statements, named customer references, verified revenue, or a complete ownership table in the sources reviewed."
logo = "Unknown"
website = "https://www.grainfinance.com/"
sector = "Fintech; embedded foreign exchange and cross-border payments"
founded = "2021 (third-party profile date; Israeli legal entity incorporated 2022-02-13)"
headquarters = "Tel Aviv, Israel"
employees = "LinkedIn company-size band: 51–200 (checked 2026-10; not a verified payroll count). Earlier reporting: 15–20 in November 2022 and 25 in March 2025."
