name = "Medida"
description = "Medida is an AI and computer-vision company that turns smartphone scans into remote measurements, visualizations, and 3D models for home-remodeling professionals. Its B2B workflow is aimed at reducing site visits and measurement errors in categories such as windows, doors, kitchens, bathrooms, closets, and blinds."
detailed_description = """Medida's product is a mobile-first spatial capture and measurement workflow for home-improvement businesses. A user captures a room or installation area with an iPhone or other supported device; Medida processes the imagery and environmental scan data into dimensional outputs, visualizations, and 3D representations. The company presents the system as a way to visualize, measure, and install, while its terms describe the outputs more cautiously as AI-generated estimates that still require qualified on-site verification before materials are ordered or installed. That distinction matters: the product is a decision-support and workflow-automation layer, not a replacement for professional accountability.

The initial customer problem is operational rather than purely technical. Window, door, kitchen, bathroom, closet, and window-treatment companies typically need accurate dimensions before they can quote, manufacture, or schedule an installation. Manual surveys add travel, scheduling delay, inconsistent data capture, and costly rework when an opening or room is measured incorrectly. Medida's value proposition is to standardize the capture process, let sales or service teams collect data remotely, create a shared visual record, and move a prospect toward a quote or design decision more quickly. The official site says the product is trusted by more than 50 home-remodeling companies and displays logos including Pella, Feldco, Homefix, PJ Fitzpatrick, C&L Ward, Champion, and others; those are useful traction signals, but the public evidence does not establish the scope, contract value, or exclusivity of each relationship.

The commercial opportunity is a focused B2B SaaS and services market inside the large, fragmented home-remodeling ecosystem. The product can be sold to manufacturers, dealer networks, installers, and multi-location contractors that benefit from repeatable measurement and centralized workflow data. Its expansion path is credible because the same capture-and-modeling capability can support multiple categories, but category breadth also creates implementation complexity: each use case has different tolerances, geometry, product catalogs, installation rules, and liability expectations. Competitors and substitutes include measurement specialists such as Hover and Canvas, mobile floor-plan and room-capture tools such as magicplan and Polycam, construction documentation platforms such as OpenSpace and StructionSite, and incumbent contractor or manufacturer software that could add computer-vision measurement through partnerships or acquisitions.

Public reporting in December 2025 said Medida was founded in July 2024, raised a $4 million seed round led by Angular Ventures with participation from 97212 Ventures and Firsthand, had deployed across 35 U.S. states, and reported a $3 million annualized revenue run rate. Those figures are company-reported through reputable media rather than audited filings, so they should be treated as diligence leads rather than verified financial statements. The same reporting described a 12-person team and offices in Tel Aviv and New York; current third-party snapshots continue to place the company in the 11-50 employee range. The principal diligence questions are retention and expansion by account, measurement accuracy by category and device, percentage of jobs that still need a physical revisit, gross margin after human review or support, and whether distribution through large remodeling networks can scale without excessive custom integration.

Medida has a technically plausible but indirect national-security adjacency. Image-based 3D reconstruction, geometric inference, and structured spatial data could eventually support facility documentation, infrastructure inspection, emergency planning, or logistics-site preparation. However, the core product is designed and marketed for residential remodeling, and public sources disclose no defense, government, security, or critical-infrastructure customer. Residential interiors are also a very different operating environment from contested, degraded, outdoor, or security-sensitive settings. The appropriate assessment is therefore limited commercial dual-use potential, not an established defense capability. Strategic relevance is strongest as a case study in applied spatial intelligence and field-workflow automation; it is not currently a strong fit for a defense-focused priority list."""
