name = "RADA Electronic Industries"
description = "DRS RADA Technologies is the Leonardo DRS business built around RADA's compact, software-defined AESA tactical radars and related avionics. Its radar portfolio targets active protection, counter-UAS, very-short-range air defense, C-RAM, hemispheric surveillance, maritime missions, and critical-site protection."
detailed_description = """
RADA developed a family of compact, software-defined, pulse-Doppler AESA radars rather than a single fixed sensor. The current DRS RADA portfolio includes the aCHR, exMHR, EMSS, ieMHR, MHR, and nMHR product families, with configurations presented for active protection and vehicle protection, counter-UAS, very-short-range air defense, C-RAM, hemispheric surveillance, and maritime missions. This architecture is valuable because a common radar technology base can be adapted to different platforms and mission software while preserving a relatively small size, weight, power, and cost footprint. The underlying capability is detection and tracking of low-altitude, low-signature, or fast-moving threats in cluttered environments; the public material does not by itself establish the performance of every current variant or the outcome of any particular program.

The primary market is defense procurement, where radar is a mission-critical subsystem in layered air defense, force protection, vehicle survivability, and counter-drone architectures. The official DRS RADA site says the systems support armed forces in more than 30 countries and identifies customer environments including the IDF, IAF, U.S. Army, U.S. Marine Corps, U.S. Air Force, U.S. Special Operations Forces, and allied organizations. Those statements are useful traction and credibility signals, but they are not a substitute for program-level diligence: the public site does not disclose a complete installed-base breakdown, backlog by product, unit economics, or current revenue attributable to the RADA portfolio. The site also reports AS9100D, ISO 9001:2015, and ISO 14001:2015 certification, which supports manufacturing-process credibility without proving operational superiority.

RADA's competitive position comes from combining active electronically scanned arrays, digital signal processing, multi-mission software, and integration into mobile or fixed defense systems. Relevant substitutes include larger defense primes' integrated radar families, specialist tactical-radar vendors, and emerging counter-UAS architectures that combine radar with electro-optical, radio-frequency, or passive sensors. Integration is therefore central: the radar must provide useful tracks to a battle-management or fire-control system, operate under electronic and physical constraints, and receive software and hardware updates as drone tactics evolve. A customer may value a compact sensor and an existing integration path, but those advantages can be weakened by procurement standardization, platform redesigns, or a prime contractor's decision to use an internally controlled sensor.

The business is no longer an independent startup or a standalone public-company investment. Leonardo DRS completed its all-stock merger with RADA on November 28, 2022; RADA shareholders received approximately 19% of the combined company and RADA's shares were converted into Leonardo DRS shares. The transaction moved the technology into a larger defense-electronics portfolio and gave it access to a broader integrator and customer base, while reducing the relevance of startup-style funding and exit analysis. For strategic diligence, the important questions are whether Leonardo DRS is expanding the product family, how much manufacturing capacity is available, how much of the value resides in software and algorithms versus hardware, and whether export approvals and integration partnerships support growth beyond existing programs.

The national-security relevance is strong because compact radars are an enabling layer for defeating drones, rockets, artillery, mortars, and other low-altitude threats. Dual-use potential is credible but bounded: similar sensing and tracking can support border surveillance, maritime monitoring, airport or critical-infrastructure security, and site protection, yet the company's core demand and product positioning remain defense-led. The record should therefore be treated as a mature acquired defense technology asset and market benchmark, not as an independent venture opportunity or evidence that every adjacent commercial use case is already commercialized.
"""
