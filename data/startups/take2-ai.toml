name = "Take2 AI"
description = "Take2 AI (MyTake2 Inc.) sells voice-based AI recruiting agents to healthcare employers, automating candidate sourcing, screening, credential checks and scheduling. It is a New York-based, Israeli-founded private startup with a reported $14 million Series A in 2026."
detailed_description = """Take2 AI, operating as MyTake2 Inc., is a privately held healthcare recruiting software company headquartered in New York. Its current product is a collection of AI agents for high-volume healthcare hiring: AI Sourcer reactivates candidates in an employer's applicant-tracking system and searches external talent sources; AI Interviewer conducts phone screens, records and evaluates calls, then writes structured results to the employer's ATS; Scheduler coordinates interviews; and Verifier checks credentials against state licensing boards and federal exclusion lists. The company describes integrations with ATS and HR systems and presents the agents as a connected workflow rather than a stand-alone chatbot. Its public site says interview calls are conducted without a human interviewer. The company has an Israeli connection through cofounder Yaniv Shimoni and reported Israeli R&D, while its public headquarters and legal address are in New York. The founders' earlier product was skills-based job simulation for sales hiring and training; Take2 has since repositioned around healthcare recruiting. The 2023 GSV profile captured an earlier talent-marketplace concept, and 2024 investor and media materials still described sales simulations, so the transition appears material rather than a simple product rename. Company-hosted customer material for Temple Health reports deployment across multiple roles and large changes in monthly screening volume, after-hours coverage and recruiter funnel metrics. Those figures are attributed to Take2's case study and quoted customer leadership; they are not audited financial data or independently tested product outcomes. Public evidence establishes a seed round and a Series A, but does not establish current revenue, retention, paid customer count, margins or a complete customer roster."""
