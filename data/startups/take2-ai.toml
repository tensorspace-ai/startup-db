priority_rationale = """Keep the company visible in the catalog because the 2026 Series A, healthcare workflow breadth, Israeli founding connection and named Temple deployment make it a relevant independent startup. Do not treat a financing announcement or a polished case study as evidence of attractive investment returns. The core unknowns are whether the current healthcare product has repeatable paid adoption, whether the Temple metrics are representative, and whether model quality and compliance controls are strong enough for employment decisions. The prior sales-simulation product and later healthcare pivot make it especially important to distinguish historical pilot activity from current recurring business. Public ownership and financial data are too limited to assess dilution, valuation, revenue quality or runway. The zero legacy priority rank reflects a research record that warrants follow-up but does not yet have the verified economics, customer references and governance evidence needed to rank it as a priority opportunity."""
