name = "Deep33 Ventures"
description = "Deep33 Ventures is a U.S.–Israel deep-tech venture fund founded in 2026 by Lior Prosor and Michael Broukhim, investing across AI infrastructure, advanced energy, quantum computing, communications, robotics, and other physical technologies. It closed its inaugural fund at $200 million, above its $150 million target, and pairs capital with grant support and go-to-market access for companies selling into industrial, government, and hyperscale markets."
detailed_description = """
**Mandate and the problem it targets.** Deep33 Ventures is an investment firm and company-building platform, not an operating technology vendor. Its premise is that the next wave of artificial intelligence and industrial growth is limited by physical bottlenecks: the availability and cost of compute, reliable energy, and automation or labor capacity. The firm argues that Israel has a concentrated base of engineering, military research, and scientific talent that can contribute technologies to these bottlenecks, while many Israeli deep-tech founders face long technical development cycles, capital requirements, and difficulty reaching large U.S. customers. Deep33 positions itself across a U.S.–Israel corridor, with operations listed in Tel Aviv, New York, and Los Angeles, to connect Israeli-origin companies with capital, partners, and markets abroad. This is a thesis about backing companies and lowering commercialization friction; the fund itself does not own a disclosed proprietary engineering product or perform the underlying technology development.

**Investment approach and how the platform works.** The fund describes an expert-led, thesis-based model in which specialist partners source and assess companies in AI infrastructure, quantum, and advanced energy, while its broader strategy also includes communications, automation, robotics, and advanced physical technologies. Its stated investment window spans Seed through Series B, with entry timed to technical or commercial inflection points after some initial scientific risk has been addressed. That wording implies a preference for ventures with a credible technical foundation and a visible route to translation, rather than undifferentiated research or broad software exposure. Deep33 advertises two portfolio-support programs: “Double Deep” aims to help companies identify and secure non-dilutive grants, and “Deep-to-Market” is intended to open routes to government, prime contractors, hyperscale industry, and other major customers. These are firm-described services; the public record does not yet quantify grant dollars secured, conversion rates, or customer introductions that became contracts.

**Market, portfolio, and go-to-market.** Deep33 is addressing a venture-capital market segment where company formation is capital intensive and the path from laboratory result to qualification, production, and revenue can be much longer than in software. The fund's disclosed themes—compute and data-center infrastructure, energy, quantum technologies, communications, robotics, and industrial systems—span markets shaped by rising AI workloads, electrification, and allied demand for secure supply chains. The official site describes a portfolio across post-quantum optical-noise encryption, compact high-energy particle accelerators, superconducting approaches to scaling quantum computers, bio-based fuels and strategic chemicals, and data/AI infrastructure acceleration; some names and operating metrics are not disclosed there. Deep33 also co-led Aitan's $41 million financing with Dell Technologies Capital in September 2026, an independently reported example of its willingness to back a defense-technology company. The fund's own market-making proposition is to help technical founders move from a domestic R&D base toward U.S. industry and government buyers, but the public sources do not yet establish a repeatable procurement channel or the share of portfolio revenue derived from those routes.

**Fund formation, capital, and external validation.** Deep33 publicly launched in January 2026 with a stated $150 million target and a reported $100 million first close. In June 2026, Globes reported that the fund closed at $200 million, one third above that target; the report said more than half of investors were overseas, mainly from the United States and United Kingdom, and that Israeli institutional investors also participated. The close is a meaningful third-party signal that LPs were willing to allocate institutional capital to an Israel-linked deep-tech vehicle during a period when hardware and long-horizon development are often treated as difficult venture categories. The official website now says it is investing from the $200 million inaugural fund. These disclosed commitments describe fund size, not investment returns, deployment pace, or the amount available for follow-on reserves. Public materials do not identify the full limited-partner base, the fund's legal domicile and structure, management fees, carry, realized performance, or detailed portfolio ownership. Those are normal private-fund diligence items and cannot be inferred from the successful close.

**Founders and investment team.** Co-founder and partner Lior Prosor is described by Deep33 as a venture investor with more than twelve years of experience and a record of consistent greater-than-three-times returns; that performance statement is self-reported and should be verified against fund-level audited data and attribution. Globes identifies Prosor as a venture investor with prior investments including Via, Lemonade, and Carbyne. Co-founder Michael Broukhim is the co-founder and CEO of FabFitFun, which the fund describes as a multi-hundred-million-dollar-revenue, profitable technology platform; his track record combines company building with angel investing. The firm has added partners with specific sector backgrounds: Joab Rosenberg is a former commander of the IDF Talpiot program with a master's degree in quantum optics; Yael Barsheshet previously worked across AI and infrastructure investing and served as an officer in Unit 8200; and Ori Amsalem brings investment and M&A experience spanning Israel and the United States. Its chair, Lior Susan, founded Eclipse Ventures, while the site lists additional government-relations and platform leadership. This mix is relevant to scientific diligence and market access, though bios alone do not prove that the team can consistently select technical winners or generate attractive net returns.

**Competitive dynamics and differentiation.** Deep33 competes for founders and limited-partner commitments with Israeli and cross-border early-stage funds, specialist deep-tech investors, corporate venture groups, government grant programs, and U.S. funds that increasingly seek defense and industrial technology. Relevant peers include Protego Ventures, whose stated focus is Israeli defense technology; Grove Ventures, an Israeli early-stage deep-tech investor; NFX and Aleph, broad Israeli technology firms with early-stage capital and founder networks; and U.S. industrial investors such as Eclipse Ventures. Deep33's strongest public differentiation is its explicit concentration on the physical infrastructure behind AI and its combination of U.S.–Israel sourcing with grants and government or prime-client access. Its expert vertical leads and disclosed $200 million fund provide more than a thematic label, but the strategy is not exclusive: several peers have technical partners, deep founder access, and cross-border reach. The central competitive question is whether Deep33's assistance measurably shortens certification, grant, integration, and sales cycles, rather than simply adding introductions to an already crowded investor network.

**Strategic and dual-use relevance.** The fund has credible strategic relevance because its investment mandate overlaps technologies that can support civilian infrastructure and national security: resilient compute, advanced energy, quantum systems, communications, and autonomous or robotic platforms. Its stated “Deep-to-Market” program explicitly targets government, prime-client, and national-infrastructure markets, and the Aitan financing is concrete evidence that defense technology is within scope. That does not make Deep33 itself a dual-use technology company, and a portfolio-level mandate should not be confused with fielded capability. The public record does not establish that all or most investments have defense applications, that the fund has classified access, or that it can secure government contracts for portfolio companies. The strongest assessment is therefore strategic ecosystem capacity: Deep33 can channel private capital and commercial support toward Israeli and allied suppliers of critical technologies, while actual security value depends on the technical success, export eligibility, qualification, and adoption of each investee. Its U.S. investor and customer relationships may help companies scale into allied markets, but this remains a platform thesis to measure through outcomes.

**Stage, trajectory, and diligence risks.** Deep33 is an early-vintage fund that has completed fundraising and begun investing, so “mid” here describes the organization's development rather than the maturity of any individual portfolio company. Its trajectory will be judged over years by deployment discipline, follow-on financing, technical milestone delivery, exits, and net performance, none of which can be established from a first-fund close alone. The main risks are the long duration and high failure rate of hard-tech commercialization; concentration in correlated AI, energy, quantum, and industrial themes; competition for scarce founders and top co-investors; dependence on external grant programs and government or prime procurement; cross-border export-control, national-security, and intellectual-property constraints; and the lack of a public record of realized fund returns. The team also has to balance ambitious platform promises with finite partner time across a geographically distributed portfolio. The near-term evidence to track is the pace and terms of announced investments, portfolio milestones and follow-on rounds, named customer or government programs, measurable grant and go-to-market support, and eventual audited fund performance. Until those signals accumulate, the $200 million close validates fundraising demand and thesis credibility, not investment success."""
