key_technologies = ["Low-power DSP and AI-DSP processor architectures", "NeuPro scalable edge-AI NPU IP", "Sensor-fusion and vision-processing engines", "Bluetooth, Wi-Fi, UWB, 5G and cellular-IoT connectivity IP", "Audio, voice and hearing-device processing", "Embedded software, SDKs and developer toolchains", "Satellite-oriented 5G-Advanced modem IP"]
