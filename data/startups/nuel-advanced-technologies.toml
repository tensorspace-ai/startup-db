name = "Nuel Advanced Technologies"
description = "Nuel Advanced Technologies is an Israeli cleantech startup developing fuel additives and a carbon-accounting process intended to improve combustion, reduce fuel use and greenhouse-gas emissions, and convert verified reductions into auditable environmental value. Its core technology is relevant to commercial transport and industrial engines, with a secondary resilience and defense-logistics use case where fuel efficiency and supply security matter."
detailed_description = """**Product and the concrete problem it solves.** Nuel Advanced Technologies is addressing a practical part of the decarbonization problem that is often overlooked by electrification-first narratives: a very large installed base of diesel and other liquid-fuel engines will continue operating in trucks, buses, generators, agricultural equipment, marine machinery, construction fleets, and industrial sites for years. Replacing those assets is slow, capital intensive, and sometimes impossible in locations where charging or grid capacity is limited. Nuel’s public product description centers on Nuel Add1, a fuel additive intended to improve combustion and lower emissions, combined with a process for measuring the customer’s baseline and post-treatment carbon footprint. The company says the value proposition is threefold: reduced pollution, lower fuel consumption, and lower engine-maintenance costs. The operational problem is therefore not simply climate reporting; it is how a fleet or industrial operator can obtain a measurable efficiency improvement without replacing every engine, while also producing evidence that an emissions claim is tied to an identifiable intervention.

**Core technology and how it actually works.** Public materials describe Nuel as using a proprietary family of molecules and a composite metal-oxide fuel-additive formulation to influence combustion. The official site says the additive is introduced at the fuel stage, with testing organized around fuel and engine standards including CEC F 98-08, CEC F 23-01, EN-590, and SI-107. An EPO publication identifies Nuel Advanced Technologies as the applicant for a patent application titled Composite Metal Oxide Fuel Additives, names Shoham Gabizon and Stela Gengrinovitch among the inventors, and records a June 2025 European filing. The public record does not disclose the formulation ratio, catalyst mechanism, engine-test dataset, additive concentration, compatibility envelope, or independently audited reduction rate, so those details should not be inferred. Nuel’s second layer is measurement and verification: it proposes calculating the customer’s carbon footprint before and after adoption and submitting the collected data to an international standardization body so that reductions can potentially be certified, offset, or traded. The technical diligence question is whether laboratory and fleet results remain stable across fuel quality, engine age, maintenance state, duty cycle, temperature, and after-treatment systems.

**Market, customers, and go-to-market.** Nuel’s most plausible customers are vehicle manufacturers, transport fleets, logistics operators, ports, industrial users, generators, and other owners of large liquid-fuel consumption volumes. The Israel Innovation Authority profile lists vehicle manufacturers as the targeted customer group, while the EnergyCom ecosystem profile classifies the company in alternative and clean fuels at seed stage. The route to market is likely a validation-led business-to-business sale: establish controlled engine or fleet tests, quantify fuel and emissions outcomes, obtain recognized certification, and then sell the additive and measurement workflow through fleet operators, fuel distributors, engine-service channels, or original-equipment relationships. A manufacturer or large fleet can provide repeat consumption and a credible reference, but it can also demand long testing cycles, warranty evidence, fuel-system compatibility documentation, and procurement economics that are much more demanding than a small pilot. The company’s public material references applications to vehicles and engines rather than a consumer retail product. That focus is strategically useful because measurable savings can be tied to operating expenditure, but it means adoption depends on proof, regulatory acceptance, and channel partnerships rather than on a simple software-style growth loop.

**Traction, funding, and third-party validation.** Nuel is a real active Israeli private company rather than an unverified concept: the Innovation Authority’s 2026 company profile records Nuel Advanced Technologies, company number 516826856, as established in 2023, with ten employees, initial revenues, and Startup Fund support. The Authority’s invested-companies directory also lists Nuel under energy-tech and records supplementary funding. Startup Nation Central’s public company snapshot reports approximately $8 million across three rounds, including a 2026 non-equity grant, but the specific round announcements and investor terms are not independently confirmed in the sources reviewed; this record therefore treats the amount as a reported ecosystem figure, not as a fully verified financing history. The company’s LinkedIn profile places its headquarters in Nesher and describes its fuel-efficiency and carbon-reduction mission. The published EPO record supplies a stronger form of technical validation than marketing language alone because it identifies a named applicant, inventors, filing date, and concrete fuel-additive subject matter. An Israeli government export-promotion presentation also lists Nuel among Israeli green-tech companies presented to prospective overseas partners. None of these sources proves commercial scale, recurring revenue, certified carbon credits, or broad fleet deployment, so the strongest current conclusion is early commercialization with meaningful public support and patent activity.

**Founders and team background.** Shoham Yaniv Gabizon is identified by the company, the Innovation Authority, LinkedIn, and the public founder profile as CEO and co-founder. The available public record presents him as a business and product-development leader who assembled a team around vehicle-emissions reduction and committed personal resources to the project. Stela Gengrinovitch is named as a co-inventor on the composite-metal-oxide fuel-additive filing and appears in the company’s public team information. LinkedIn describes a small climate-technology product-manufacturing organization, while the Innovation Authority reports ten employees; the difference is best understood as a normal snapshot discrepancy rather than a basis for an exact headcount. The team’s relevant asset is the combination of formulation work, engine and fuel testing, environmental measurement, and commercial development. However, public sources do not provide a complete executive roster, detailed laboratory credentials, manufacturing partner, or independent technical advisory board. Diligence should therefore verify who owns formulation science, who controls quality and regulatory documentation, whether the inventors remain operationally involved, and whether the company can scale from founder-led validation to repeatable industrial deployment.

**Competitive dynamics and potential edge.** Nuel competes with conventional fuel additives from suppliers such as Lubrizol and BASF, specialty additive companies such as Innospec, fuel-efficiency and engine-treatment products sold through fleet-maintenance channels, and the longer-term substitution threat from battery-electric, hybrid, hydrogen, and renewable-fuel powertrains. It also competes indirectly with carbon-accounting platforms that can measure emissions without changing combustion. Nuel’s plausible edge is the combination of a physical intervention and a measurement layer: if its formulation delivers repeatable efficiency gains while preserving engine and after-treatment compatibility, the customer can see a direct operating benefit and obtain better evidence for an emissions claim. The patent application may support defensibility around the formulation, but a patent filing does not establish freedom to operate, granted claims, or a commercially meaningful moat. The company must win on independently reproducible performance, dosage economics, supply consistency, safety, and certification. Its market position will remain fragile if savings are small relative to additive cost, if outcomes vary by engine, or if fleet buyers conclude that electrification or alternative fuels deliver a clearer long-term compliance path.

**Defense, security, and resilience dual-use relevance.** Nuel’s technology has credible dual-use relevance because the same fuel-efficiency and combustion-improvement capability can serve civilian fleets and defense-support systems without changing its core design. Military logistics depend on fuel convoys, generators, heavy vehicles, marine assets, and remote power systems; reducing consumption can extend operating range, reduce resupply frequency, lower exposure during transport, and improve endurance where charging infrastructure is unavailable. The resilience case also covers hospitals, emergency responders, municipal services, ports, agriculture, and critical facilities that need backup generation during grid disruption. This is an adjacency, not evidence of a fielded defense product: no public source reviewed confirms an Israeli Ministry of Defense contract, military customer, qualification on a named platform, NATO or DoD approval, or deployment in a contested environment. Strategic value therefore depends on verification. A serious defense pathway would require platform-specific testing, storage and handling documentation, emissions and thermal-safety evidence, supply-chain assurance for the additive, compatibility with military fuels and maintenance procedures, and procurement-compliant production. If those gates are cleared, Nuel could contribute to fuel resilience and sustainment efficiency; until then, the defensible classification is commercial energy technology with a plausible logistics and continuity-of-operations use case.

**Growth stage, trajectory, and key diligence risks.** Nuel should be classified as early: it was established in 2023, remains a small team, is described by the Innovation Authority as having initial revenues, and is still relying on public support, product validation, and channel development to establish scale. The next milestones should be transparent engine-bench data, independent fleet trials, recognized certification, repeat orders, a manufacturing and distribution plan, and evidence that the product performs across multiple fuel and engine classes. The principal risks are technical reproducibility, because public performance claims are not accompanied by a full independent dataset; formulation and safety risk, because additive chemistry must not damage injectors, seals, lubricants, filters, or emissions-control systems; regulatory and claims risk, because carbon-credit or offset eligibility depends on accepted measurement and verification; commercial risk, because OEMs and large fleets have slow procurement cycles and can prefer established suppliers; supply-chain risk, because consistent production of the formulation and quality control are essential; and substitution risk from electrification, hybrids, renewable diesel, hydrogen, or other efficiency solutions. Additional diligence should reconcile the public funding totals, confirm the status and claim scope of the patent family, identify disclosed customers and revenues, and determine whether Nuel’s technology is best positioned as an additive product, an engine-service program, a carbon-measurement platform, or a combination of all three."""
