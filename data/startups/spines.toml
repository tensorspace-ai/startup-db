name = "Spines"

description = "Spines is an author-paid publishing workflow company that combines AI-assisted manuscript preparation with human editorial support, book design, print and ebook production, optional audiobook and translation services, and distribution and royalty administration. It was formerly branded BooxAI and has Israeli founders and staff, with a Florida operating base."

detailed_description = """Spines is a full-service self-publishing platform for authors who want help taking a finished manuscript to market. The current product covers manuscript intake, AI-assisted proofreading and editing, formatting, cover and interior design, metadata suggestions, print-on-demand and ebook files, optional translation and audiobook production, marketing tools, distribution to retail and library channels, and royalty reporting. Its public pages describe both a self-directed dashboard and paid production plans with account-manager support. Audiobooks and some specialist services are add-ons rather than guaranteed parts of every standard package. The business is therefore a hybrid of software-enabled workflow, outsourced editorial and production operations, and author services, rather than a pure SaaS product or model developer.

The customer pays for production and distribution services, and the contract describes production plans, membership subscriptions, optional paid upgrades, auto-renewal unless cancelled under the cancellation policy, and author payouts of 70% of net sales royalties after fees. A 2024 TechCrunch report quoted production packages of roughly $1,200-$5,000 and monthly distribution membership of $19-$49; Publishers Weekly described packages ranging from a few thousand dollars to over $15,000 in December 2025, likely reflecting different mixes of add-on services. Those are dated reported ranges, not a current price quote. The model monetizes author intent directly and does not require a traditional publisher to acquire a manuscript, but high upfront fees and renewal terms make sales transparency, refunds, completed deliverables, and repeat-book economics central to customer trust.

Spines emerged from Yehuda Niv's Israeli publishing experience. The company launched in 2021, initially as BooxAI, and announced its rebrand to Spines in March 2024. The contracting party named in the current author terms is BOOX PUBLISHING TECHNOLOGIES US INC., doing business as Spines. The official contact page lists Boynton Beach, Florida. Israeli reporting describes an employee base across Miami, Israel, Europe, and Argentina, and calls Spines an Israeli-founded startup. This is an Israeli-founded and Israeli-staffed company with a U.S. commercial focus; public sources do not establish a parent company, incorporation chain, or private cap table.

Public traction is meaningful but mostly company-reported. Calcalist reported 400 titles published in 2023 and more than 2,000 expected in 2024, alongside more than 80 employees in November 2024. Publishers Weekly reported more than 6,000 users by December 2025 and said the 8,000-title 2025 figure was a target. Yehuda Niv's current company biography says more than 6,000 authors had published by the end of 2025. Current Spines service pages market 8,000-plus authors, while co-founder Lev David's later LinkedIn post says more than 10,000 authors; those counts have different dates and possibly different definitions and are not audited. The same executive post described 380% revenue growth in 2025 and a $100 million 2026 revenue goal, while 2024 press coverage reported 1,000% year-over-year revenue growth. Neither absolute revenue nor the measurement base was disclosed. These growth assertions should not be treated as proven revenue scale or book sell-through.

The strongest differentiator is the managed bundle: authors can coordinate editing, design, format conversion, language expansion, audio, metadata, retailer delivery, and support through one workflow. Niv and product co-founder Niv Ovdat bring publishing-operations experience; CTO Nir Kenner brings product and applied-technology leadership; Lev David's current remit is strategy after several years as CMO. These are complementary backgrounds, though public biographies are company-authored and do not establish independent product quality. Spines' technical advantage appears to be task-specific orchestration, internal workflow design, and human review rather than proprietary foundation models. TechCrunch reported that Spines did not disclose all third-party AI providers and does not build every model from scratch. That makes service execution, quality assurance, retailer integrations, customer acquisition efficiency, and accumulated process knowledge more important to defensibility than an assumed exclusive AI moat.

The competitive set spans distinct alternatives. Amazon KDP provides free direct publishing for Kindle and print-on-demand books, while the author does more of the production work. Draft2Digital automates manuscript conversion and opt-in distribution across retailers and libraries, including print through Ingram's channels. IngramSpark is a strong substitute where print quality and wholesale reach matter. Reedsy connects authors with human editors, designers, marketers, translators, and other specialists. These providers make distribution access and basic formatting replicable. Spines can win when an author values managed hand-holding and breadth over a DIY toolchain or individually selected freelancers, but must demonstrate that customers receive better outcomes, not just more steps in one package. Its global-channel claim also depends on third-party distributors, who independently decide which titles to list.

The principal diligence risks are unit economics, service consistency, consumer-contract clarity, rights governance, and reputation. No audited revenue, gross margin, acquisition cost, repeat-author rate, refund rate, or retailer sell-through is public. The broad author-terms license allows royalty-free use of submitted books in connection with Spines' business, including for large-language-model training and AI book trailers; authors' retention of copyright does not by itself answer model-training consent, retention, deletion, or vendor-use questions. The AI vendors and detailed data controls are not fully public. BBB lists 31 complaints in three years and 18 in the preceding year as checked in October 2026, including complaints about billing, editing delays, and delivery; these are user-submitted allegations without a transaction denominator and are not findings of misconduct. BBB and Trustpilot also contain positive reviews, so the signal calls for cohort-level quality and refund data rather than a one-sided conclusion. No patent portfolio or defensible proprietary model was located in the searches conducted; a pending SPINES trademark application is not a technical moat."""

