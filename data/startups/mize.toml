name = "Mize"
description = "Mize is an Israeli travel-technology company that provides AI-driven revenue infrastructure for hotels, flights, and travel distributors. Its products use booking, rate, room, and market data to optimize pricing and profit across the reservation lifecycle."
detailed_description = "Mize, formerly Hotelmize, builds applied machine-learning and financial-optimization software for travel companies. Its technology pages describe a data pipeline that collects booking patterns, hotel-room and rate information, and related market signals; models then support price prediction, room mapping, matching, and risk management. The commercial product surface is organized around room mapping before booking, SmartRate at booking, and Hotelfare Optimization after booking, with a partner network and fintech-oriented products intended to recover or create margin. This is operational decision software rather than a general-purpose AI platform: its value depends on making frequent, defensible decisions inside travel-distribution workflows.\n\nThe customer set appears to include online travel agencies, wholesalers, travel agencies, travel-management companies, and other hotel or flight distributors. Mize's own website reports more than $4.5 billion in booking value optimized, 7.1 million bookings optimized, and $596.2 million in extra profit generated; those are company-reported figures and should be validated through customer references, cohort data, and definitions of incremental profit. Its press kit and recent company material report more than 350 partners, while an earlier company job listing described more than 130 international clients. Together, these signals indicate a deployed B2B platform with international distribution, but they do not establish recurring revenue, retention, gross margin, or independently audited outcome quality.\n\nThe competitive environment is established and fragmented. Hotel revenue-management specialists such as IDeaS, Duetto, Atomize, Beonprice, and RoomPriceGenie compete for pricing and forecasting budgets, while RateGain, Lighthouse, and broader travel-distribution platforms address adjacent data, rate-shopping, and optimization needs. Mize's plausible edge is workflow breadth: it connects rate and room normalization with pre-booking optimization, real-time rate decisions, and post-booking re-shopping or protection products. That may create useful integration and data advantages, but it is not automatically a durable moat. Diligence should test uplift against a controlled baseline, implementation time, data coverage, model drift, and whether partners continue using several modules after the initial deployment.\n\nCommercially, Mize has credible progress signals. The company says it was founded in 2016, raised a $12 million Series B led by Flashpoint in 2023 under the Hotelmize name, rebranded to Mize as it expanded beyond hotel optimization, acquired RightRez in 2025, and launched or promoted products including SmartRate. These claims are supported by the company's press materials and external reporting, but the public record does not support the existing Series C label. Current secondary reporting says Yanolja acquired Mize in July 2026 and that Mize continues as an operating unit; the acquisition changes its ownership and investment classification even though the mize.tech operating site remains live.\n\nFor national security and dual-use purposes, the case is limited. Forecasting, matching, optimization, and risk scoring are transferable capabilities that could inform commercial transport or scarce-resource planning, but the public product, customers, and positioning are centered on travel profitability. There is no reliable public evidence here of defense contracts, intelligence workflows, security operations, military logistics, or resilience infrastructure. Mize is therefore strategically relevant as an example of applied AI embedded in a high-volume commercial decision loop, not as a direct defense or security technology. Its acquired status may make it relevant to Yanolja's travel-technology stack, but that is different from strategic fit for a dual-use investment thesis."
