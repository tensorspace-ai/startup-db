name = "Capitolis"

description = "Capitolis is a capital-markets technology company whose Portfolio Optimization products compress, novate and reallocate derivatives exposures, while its Capital Marketplace connects financial institutions with institutional capital."

detailed_description = """
Capitolis is a financial-technology company building infrastructure for safer and more efficient capital markets. Its current offering has two connected areas: Capital Marketplace solutions that connect financial institutions with institutional sources of capital, and Portfolio Optimization solutions that help banks and other market participants reduce costly positions and manage capital constraints. The portfolio product covers uncleared and cleared derivatives workflows, including FX, credit and rates, and supports bilateral or multilateral exercises, novations, tear-ups and desk transfers. Its technology is therefore less a generic analytics dashboard than a transaction-orchestration layer that combines optimization algorithms, portfolio data, eligibility rules, workflow approvals and auditable execution records.

The customer problem is specific and economically significant: large financial institutions hold offsetting or redundant exposures across many counterparties, while capital, leverage, margin, liquidity and funding rules make those positions expensive to carry. Capitolis says its platform has been used by more than 100 of the world's largest institutions, and its public product materials report more than 138,000 FX-option novations and over $15 trillion of total-notional reduction. Those are company-reported operating indicators rather than independently audited financial metrics, but they are credible evidence of production scale. The business also announced a later strategic financing involving global banks, suggesting that major market participants view the company as strategically useful infrastructure, while not disclosing the economics or concentration of that financing.

Competition spans specialist post-trade providers such as TriOptima and Quantile, market-infrastructure businesses such as OSTTRA and clearing venues, bank-built portfolio and counterparty-risk tooling, and manual or bilateral processes. Capitolis benefits when it can bring a sufficiently broad participant network to an optimization event, because a wider set of counterparties creates more opportunities to collapse or reallocate offsetting exposures. Its other defensibility claims are domain-specific algorithms, integrations, regulatory workflow knowledge and evidence that execution can be completed in days rather than through long manual coordination. Those advantages are meaningful but not absolute: the same customer relationships can make banks demanding buyers, and infrastructure incumbents can bundle adjacent functionality.

Strategically, Capitolis can support financial-system resilience by lowering dealer balance-sheet friction, reducing operational complexity and helping institutions manage exposures during periods of market stress. That is an indirect national-security benefit, not evidence of a defense product. The core platform does not provide intelligence, secure communications, cyber defense, autonomy, sensing or military logistics, and the public record does not establish government or defense customers. A future regulator-facing systemic-risk, sanctions, or critical-financial-infrastructure workflow could increase strategic relevance, but that would require deliberate product development and evidence of adoption. The present record is best treated as a mature, strategically interesting capital-markets infrastructure company with limited direct dual-use applicability.
"""

