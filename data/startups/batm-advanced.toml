name = "BATM Advanced Communications"
description = "BATM Advanced Communications is a publicly listed Israeli technology group focused on advanced networking, cybersecurity and encryption. Following multiple non-core disposals and a pending 2026 transaction, BATM is concentrating on secure managed networking and cybersecurity; the proposed sale of its remaining diagnostic and other non-core activities was approved by shareholders in September 2026, with completion not yet confirmed in reviewed disclosures."
detailed_description = """BATM Advanced Communications Limited (LSE: BVC; TASE: BVC) is an established Israeli technology group founded in 1992 and headquartered in Hod Hasharon. The company now presents its activities through three core divisions: BATM Networks, BATM Cyber and BATM Diagnostics. Networks supplies carrier-grade connectivity and edge-network products, including switching, routing and software for managing applications and compute at the network edge. Cyber develops integrated hardware and software solutions for network encryption and related security functions. Diagnostics supplies laboratory and molecular-diagnostic products. This is a diversified operating company rather than a single-product startup, and the record should not treat every BATM business line as defense technology.

The most relevant technology for security and national-security diligence is BATM Cyber's encryption platform. Company disclosures describe the platform as quantum-key-distribution-ready or quantum-resilient, with hardware and software designed to protect data in transit and to support a transition toward post-quantum security. That positioning matters because long-lived government, telecom and critical-infrastructure data may need protection against future cryptanalytic advances. It does not, by itself, establish that BATM operates a QKD network, has achieved a particular certification, or has solved post-quantum migration for all environments. The practical diligence question is how the platform combines standards-based post-quantum cryptography, key-management or hardware-security functions, and any QKD integration with deployable customer networks.

BATM's market position is supported by an installed networking business and by routes to market beyond direct venture sales. The 2024 annual-report materials described more than $2.3 million of new Cyber orders from a long-standing government defense customer, including development work for a next-generation encryption solution, and a strategic distribution relationship for a QKD-ready encryption product. In the first half of 2025 BATM reported delivery of the first units of its encryption platform for a commercial market. In January 2026 it announced selection by FPT Israel as a cybersecurity partner, potentially expanding reach through FPT's international technology and delivery network. These are useful commercialization signals, but they do not disclose customer identities, recurring revenue, deployment scale, certification status or the economics of the partnerships.

The 2025 results indicate a company undergoing portfolio refocusing rather than a pure high-growth cyber scale-up. Continuing-operations revenue was reported at $123.2 million, with growth in Networks and Diagnostics and improved adjusted operating performance; management said it expected stronger underlying growth in 2026 from Networks and Cyber orders and pipeline. BATM also continued disposing of non-core businesses and investing in closer integration between Networks and Cyber. Its competitive set therefore spans specialist secure-network and post-quantum vendors as well as much larger networking and defense suppliers. BATM can differentiate through the combination of carrier-grade networking knowledge, encryption engineering and an existing government/telecom go-to-market path, but its smaller scale, mixed portfolio and reliance on a still-maturing security market limit the strength of that moat.

For defense and national-security purposes, BATM is a credible dual-use reference company, not evidence of a dedicated defense prime or a validated sovereign-QKD program. Secure network encryption, key-management integration and resilient edge connectivity have clear applications in government communications, critical infrastructure, telecom backbones and military network modernization. The Diagnostics division adds healthcare and public-health relevance but also dilutes the defense thesis. Strategic diligence should focus on independently verifiable product architecture, cryptographic validation, export-control exposure, defense-customer concentration, conversion of pipeline into repeat orders, and whether BATM can turn project-led engineering into repeatable commercial software or systems revenue."""
