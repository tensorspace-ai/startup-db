  {id="about", url="https://cybord.ai/about-us/", title="About Cybord | Deep Visual AI Platform", publisher="Cybord", kind="company", accessed_at="2026-10-05T04:40:00+03:00", claims=["Cybord describes its visual AI platform and component inspection workflow.","The current company leadership page lists Oshri Cohen, Eyal Weiss, Tyler York, Yuval Nahon, Yoel Knoll and Yaniv Nissim with roles.","The board section identifies representatives associated with Capri Ventures and IL Ventures.","Cybord identifies Dr. Eyal Weiss as founder and CTO."]},
  {id="iia", url="https://innovationisrael.org.il/importWinner/515973493/", title="Cybord Ltd. Israel Innovation Authority profile", publisher="Israel Innovation Authority", kind="government", accessed_at="2026-10-05T04:40:00+03:00", claims=["The Authority profile identifies Cybord Ltd. with company number 515973493 and a Tel Aviv address.","The profile lists Oshri Cohen as CEO, Eyal Weiss as CTO and co-founder, and Moti Wilner as CFO.","The profile lists Seed Fund awards in 2022 and R&D support awards in 2023."]},
  {id="patent", url="https://patents.google.com/patent/EP4165592B1/en", title="EP4165592B1 - System and method for tracing components of electronic assembly", publisher="Google Patents / European Patent Office bibliographic data", kind="other", accessed_at="2026-10-05T04:40:00+03:00", published_on="2026-02-11", claims=["Cybord Ltd. is listed as assignee for component tracing patent EP4165592B1.","Patent family listing shows related active US patent US12406355B2 and Cybord applications concerning counterfeit/cyber component detection and component quality."]},
  {id="calce", url="https://calce.umd.edu/eyal-weiss-2022", title="AI Visual Detection of Defects and Corrosion on Leads in Electronic Components", publisher="University of Maryland CALCE", kind="other", accessed_at="2026-10-05T04:40:00+03:00", claims=["CALCE describes Cybord's use of big data, AI and inline image processing to inspect components during production.","CALCE describes Eyal Weiss as having founded Cybord and led research at Soreq Research Center."]},
  {id="vcdnp", url="https://vcdnp.org/wp-content/uploads/2025/04/VCDNP-Counterfeiting-AI-and-Supply-Chains-in-the-Nuclear-Sector_web.pdf", title="Counterfeiting, AI and Supply Chains in the Nuclear Sector", publisher="Vienna Center for Disarmament and Non-Proliferation", kind="other", accessed_at="2026-10-05T04:40:00+03:00", published_on="2025-04", claims=["The report describes Cybord as an Israeli startup using visual and spectroscopic electronic-component data and AI to assess authenticity and quality.","The report discusses Exiger as a broader supply-chain risk assessment platform, illustrating an adjacent competitive category."]},
  {id="interview", url="https://cybord.ai/resources/articles/epp-europe-interview-with-oshri-cohen-ceo-of-cybord/", title="EPP Europe – Interview with Oshri Cohen, CEO of Cybord", publisher="Cybord / EPP Europe interview", kind="company", accessed_at="2026-10-05T04:40:00+03:00", published_on="2024-02-19", claims=["Cybord's interview describes Cohen's prior 15 years at Mellanox and Nvidia and his joining Cybord in 2022.","The interview states founder Dr. Eyal Weiss founded the company in 2019; the Israel Innovation Authority profile records seed-related support in 2022 and the company profile gives its founding story, but company founding year is not reconciled across sources."]},
  {id="labtest", url="https://cybord.ai/resources/articles/lab-verified-results-of-real-time-verification-of-component-defect-detection-by-cybord-ai-system/", title="Lab-Verified Results of Real-Time Verification of Component Defect Detection by Cybord AI System", publisher="Cybord", kind="company", accessed_at="2026-10-05T04:40:00+03:00", published_on="2025-02-03", claims=["Cybord describes tests of its Aquila body-defect detection system on ASMPT pick-and-place machines with MES alerting."]},
  {id="airgap", url="https://cybord.ai/news_events/press-releases/cybord-announces-air-gapped-visual-ai-platform-for-electronics-integrity-and-hardware-cybersecurity/", title="Cybord Announces Air-Gapped Visual AI Platform for Electronics Integrity and Hardware Cybersecurity", publisher="Cybord", kind="company", accessed_at="2026-10-05T04:40:00+03:00", published_on="2025-09-16", claims=["Cybord announced an on-premises air-gapped platform and said beta testing with select customers was underway, with general availability targeted for Q4 2025.","The announcement describes integration with Siemens Opcenter Execution Electronics as a beta integration; it does not establish a paid Siemens deployment."]},
