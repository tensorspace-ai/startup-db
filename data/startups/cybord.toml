dual_use_description = "Cybord's supply-chain risk detection is quintessentially dual-use. Counterfeit and malicious components are critical vulnerabilities for both high-reliability commercial systems (automotive, industrial, renewable energy) and defense/aerospace systems. The company's AI-driven anomaly detection and risk scoring directly apply to detecting state-sponsored supply-chain attacks, insider threats, and sophisticated counterfeiting operations that target military procurement and allied defense-industrial bases. The technology is equally valuable for civilian critical infrastructure protection and for defense ecosystems ensuring hardware trustworthiness in systems with no post-deployment patch windows. Core customers span commercial and defense sectors; no artificial segmentation is needed because the threat model and detection approach are identical."
