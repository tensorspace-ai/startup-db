name = 'Cybord'
description = "Cybord Ltd. is an Israeli visual-AI software company that inspects electronic components on electronics assembly lines for quality, authenticity, traceability and supply-chain risk. It raised a $7 million Series A extension in April 2026 led by Capri Ventures."
detailed_description = """Cybord Ltd. develops visual-AI software for electronics manufacturers and electronics manufacturing services providers. The platform uses component imagery captured by existing surface-mount technology (SMT) equipment, together with production data, to inspect components during assembly. The company describes its goal as checking every component and providing quality, authenticity and traceability information. Public product materials name Aquila, a component body-defect detection system, and ShieldScan, a software-only Visual AI product that checks whether a printed circuit board assembly matches approved bill-of-materials and traceability data. A 2025 company-authored validation article describes testing Aquila alongside ASMPT pick-and-place machinery and sending detected issues to a manufacturing execution system. These are company-reported capabilities and testing; they do not establish an independently audited detection rate or customer-wide outcome.

The commercial problem is real: electronic manufacturers must manage counterfeit, substituted, damaged, aged, poorly stored and incorrectly sourced components, while functional inspection and supplier documentation may not expose every component-level issue. Cybord's approach adds image-based component inspection and traceability to an existing production workflow. The apparent value proposition is earlier identification and investigation of suspicious parts, less manual inspection, and component-level production evidence. Integrations with machinery, manufacturing execution systems and customer data environments create an implementation burden as well as potential workflow stickiness. Performance depends on image quality, representative training and reference data, line configuration, customer response processes and the ability to distinguish meaningful anomalies from benign variation.

Cybord announced a $4 million Seed investment in March 2022, an $8.7 million Series A in September 2024, and an additional $7 million extended Series A on April 28, 2026. Capri Ventures led both disclosed Series A announcements; Ocean Azul Partners, IL Ventures and NextLeap Ventures were named in the 2024 announcement, while the 2026 release describes new and existing participants without naming all of them. The seed announcement named IL Ventures and NextLeap Ventures and described Israel Innovation Authority co-investment. The announcements do not disclose valuation or terms. The 2026 release does not state lifetime funding, and no cumulative total is inferred here. The latest extension is evidence of continuing investor support and an announced effort to deepen North American sales, not proof of revenue scale, profitability or a completed market expansion.

The 2024 financing release said Cybord was partnered with Flex and Siemens and integrated into more than 60 manufacturing lines worldwide, inspecting millions of components daily. Those are dated company claims. This record does not treat that wording as proof that either named manufacturer is a paying customer, that every integration remains active, or that the system is deployed across all their facilities. A company case study describes a leading data-center equipment manufacturer without naming it. Public evidence reviewed here does not establish current revenue, ARR, margins, customer concentration, retention, contract values, or independently verified production outcomes. Older retained references to Cisco, Intel, Nvidia, SolarEdge and SpaceX were not substantiated by the sources reviewed and should not be used as confirmed customer evidence.

The company is led by CEO Oshri Cohen and founder and CTO Dr. Eyal Weiss. Its current site also identifies Tyler York as Chief Business Officer, Yuval Nahon as VP R&D, Yoel Knoll as VP Marketing and Yaniv Nissim as VP Customer Success. The Israel Innovation Authority's company profile independently identifies Cohen, Weiss and CFO Moti Wilner, but the current company leadership page omits Wilner; his current status is therefore unclear. The same Authority profile lists a Tel Aviv address, and the company describes operations from Tel Aviv. Patent records assign patent families to Cybord Ltd. and show granted US and European patents concerning component tracing, counterfeit/cyber-component detection and component quality. Patent grants support a claim of protected technical work, not freedom to operate, enforceability, commercial exclusivity or model superiority.

Competition spans component intelligence and lifecycle-data providers, automated optical inspection and factory-quality systems, counterfeit-part authentication services, and broader supply-chain risk platforms. These alternatives may solve adjacent rather than identical problems. Cybord's potential differentiation is the combination of in-line component imagery, component identity/traceability and security-oriented anomaly review within manufacturing workflows. The differentiation should be tested against actual customer systems and benchmarks: visual inspection is not equivalent to detecting every malicious implant, firmware compromise or electrical defect, and the platform's detection limits and false-positive rates are not publicly quantified. Siemens Opcenter integration has been described in company materials as beta-stage in 2025; this is a product integration statement, not proof of a Siemens procurement relationship or a paid production deployment.

Commercially, the company has raised meaningful institutional capital and reported a multi-line manufacturing footprint, but private-company financials and customer economics remain undisclosed in reviewed public sources. The $7 million 2026 extension and US sales leadership plan may fund expansion, yet no post-extension hiring totals, bookings or revenue milestones were disclosed. Enterprise adoption depends on reliable integration, measurable reduction in inspection or quality costs, clear data governance, and procurement confidence. Manufacturing customers may be reluctant to share sensitive product imagery or production data, while long qualification cycles can delay recurring revenue. Model drift across components, package types, camera systems and line conditions may require ongoing validation and support.

Strategically, component authenticity and traceability are relevant to commercial electronics, data centers, telecom, automotive, healthcare, aerospace and defense supply chains. The same inspection functions could help a defense manufacturer or integrator screen components before assembly, where failures or counterfeit parts can have serious consequences. This is a plausible dual-use application based on the technology and the company's stated target sectors, not evidence of a disclosed government contract, military deployment, security certification or defense-prime customer. The 2022 funding release said the company intended to expand into defense, while the 2026 release lists aerospace and defense among intended expansion industries. Actual defense traction remains unverified.

Investment and strategic diligence should focus on independently validated defect and counterfeit detection rates; false positives and missed detections across component classes; the size, provenance and rights associated with image datasets; measured customer savings and paid deployments; the conversion of reported line integrations into recurring contracts; dependence on equipment and MES vendors; current cash runway and revenue; patent ownership and geographic coverage; and the specific identity and status of customers cited in sales materials. Board representation by Capri Ventures and IL Ventures is disclosed in a company-hosted SOC 2 report, but the private cap table and investor ownership percentages are not public. No company-wide valuation or ownership percentage is inferred."""
