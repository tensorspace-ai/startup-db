name = "VisIC Technologies"

description = "Israeli semiconductor company developing automotive-grade gallium-nitride power devices and modules for EV traction inverters, onboard chargers, and other high-power conversion systems. Its D³GaN platform targets lower losses, higher power density, and manufacturable alternatives to silicon and selected SiC designs."

detailed_description = """
VisIC Technologies is an Israel-based power-semiconductor startup founded in 2010 and headquartered in Ness Ziona. Its core product is D³GaN, a direct-drive, depletion-mode gallium-nitride power-transistor architecture intended to combine fast switching with a comparatively straightforward 15 V gate-drive approach. The company offers 650 V discrete devices, bare dice, evaluation boards, and half-bridge modules; its public catalog lists released Gen 1 products and Gen 2 devices with resistance as low as 4 mΩ. The engineering proposition is system-level: lower conduction and switching losses can reduce cooling requirements, shrink passive components, and increase power density in high-current converters.

The primary market is electric mobility. VisIC positions its devices for EV and hybrid traction inverters, onboard chargers, and high-voltage DC-DC conversion, where efficiency, thermal margin, package inductance, and long-term reliability all affect vehicle range, cost, and packaging. The company also identifies industrial power and data-center infrastructure as expansion markets, including emerging 800 V data-center power requirements. These markets are attractive but demanding: component suppliers must satisfy qualification, reliability, functional-safety, application-engineering, and supply-continuity requirements, and a technically superior transistor can still lose to a qualified incumbent or a complete reference design with lower integration risk.

There is public evidence of progression beyond laboratory research. VisIC says its products are made through collaborations with 6-inch and 8-inch GaN-on-silicon foundries, its online catalog marks several devices as released, and its 2023 company announcement described a 650 V multi-device module tested in a three-phase automotive inverter at a major OEM test facility. In 2025 the company announced Gen 2 650 V devices and a $26 million Round B investment, while also describing supply-chain ramp-up and development for higher-power and data-center applications. Those are meaningful commercialization signals, but they do not by themselves prove design wins, series-production volume, field reliability, or durable margins; those points remain important diligence questions.

VisIC competes with dedicated GaN vendors such as Navitas Semiconductor, Transphorm, Efficient Power Conversion, and Cambridge GaN Devices, while Infineon, ROHM, Wolfspeed, and other broad power-semiconductor suppliers provide powerful silicon and SiC substitutes. VisIC’s differentiation is the combination of high-voltage D-mode/direct-drive architecture, automotive focus, and a path from die to module and inverter-level demonstrations. The moat is not established solely by the device concept: it depends on process control, packaging, qualification data, driver ecosystem, customer support, and the ability to reach cost parity at useful production volumes.

The dual-use case is credible but indirect. High-efficiency, high-voltage GaN power conversion can benefit communications equipment, radar and electronic-support subsystems, autonomous or robotic platforms, ruggedized power supplies, and other size-, weight-, and thermal-constrained systems. VisIC’s commercial automotive focus and public materials do not establish defense customers, military qualification, or government contracts, so the strategic relevance should be understood as enabling-technology potential rather than demonstrated defense traction. The strongest strategic thesis is supply-chain access to advanced, non-Chinese power devices for allied electrification and critical infrastructure, subject to manufacturing resilience, export-control review, and system-level qualification.
"""

