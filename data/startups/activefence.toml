name = "ActiveFence"
description = "ActiveFence, now operating as Alice, provides AI security, safety, and trust infrastructure for testing, protecting, and monitoring generative-AI applications, agents, and models across their lifecycle. Its heritage in large-scale trust and safety gives the company a differentiated threat-intelligence base for enterprise and platform customers."
detailed_description = """ActiveFence is now branded as Alice, but the underlying private company and its ActiveFence operating history remain the relevant identity for this record. Founded in 2018, the company started with proactive trust-and-safety and threat-intelligence services for user-generated-content platforms. Its current positioning extends that foundation into enterprise AI security: WonderBuild stress-tests models, applications, and agents before launch; WonderFence provides runtime guardrails; and WonderCheck evaluates production systems for drift and newly emerging failure modes. The product family is presented as WonderSuite, with Rabbit Hole described by the company as the adversarial-intelligence foundation behind the products.

The technical proposition is a feedback loop rather than a single content classifier. Threat researchers and detection systems identify abuse patterns, jailbreaks, prompt-injection attempts, unsafe outputs, policy violations, and sensitive-data risks; those patterns can then inform pre-deployment evaluations, runtime inspection and enforcement, and recurring production tests. Alice says its research base contains billions of real-world adversarial examples across more than 120 languages, while its documentation describes input/output inspection, policy enforcement, and detection or redaction workflows. These scale claims are primarily company-reported and should be validated through independent benchmark results, customer references, latency measurements, and precision/recall by risk category.

The commercial opportunity is the growing requirement for organizations to make AI systems safe enough to deploy and govern after launch. Likely buyers include frontier-model developers, enterprise product and responsible-AI teams, UGC platforms, and organizations operating customer-facing assistants or agents. Alice publicly identifies a broad set of technology and platform customers, but the database should not treat those references as proof of contract size, renewal, or revenue concentration. The company’s last widely reported financing was a 2021 Series B within a $100 million two-round announcement, and current public materials emphasize product expansion and rebranding rather than a newer disclosed financing. That supports a Series B classification, but leaves important diligence questions about current growth, cash runway, profitability, and the economics of serving large accounts.

Competitive pressure comes from both AI-native guardrail and evaluation vendors and established trust-and-safety, fraud, and security platforms. Buyers can assemble separate red-teaming, model-evaluation, content-moderation, data-loss-prevention, and observability tools, so the claimed advantage is workflow integration and threat coverage across the lifecycle. Alice’s legacy exposure to multilingual abuse, coordinated manipulation, and difficult edge cases may be a useful data and domain-knowledge asset; it is not automatically a durable moat because adversarial examples age quickly, competitors can buy or generate similar test corpora, and model providers increasingly build safety controls internally.

The national-security adjacency is credible but bounded. The same capabilities can help defend public communication channels, government information services, critical-infrastructure assistants, and mission-facing AI systems against manipulation, jailbreaks, prompt injection, unsafe generation, and data leakage. The strongest dual-use case is defensive resilience for externally exposed AI and information environments, not offensive cyber operations. Government adoption would still require deployment controls, auditability, procurement readiness, data-segregation assurances, privacy compliance, and possibly classified or otherwise restricted operating boundaries that are not established by the public materials reviewed here."""
