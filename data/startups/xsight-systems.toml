name = "Xsight Systems"
description = "Xsight Systems develops AI-enabled, multi-sensor runway safety systems that use millimeter-wave radar, electro-optical imaging, and analytics to detect and classify foreign object debris, wildlife, surface contaminants, and other airfield hazards. Its RunWize platform is sold to airport operators and has a credible, operationally focused military-airbase application."
detailed_description = """
Xsight Systems is an Israeli aviation-technology company focused on continuous runway sensing rather than general airport IT. Its RunWize platform combines proprietary radar and camera hardware with machine-learning and deep-learning software to detect, classify, locate, and document hazards on or around active runways. The product family includes FODetect for foreign object debris, BirdWize for bird and wildlife hazards, ArcWize for runway-surface contaminants and condition reporting, and ViewWize for runway surveillance, inspection, movement recording, and incident review. The company says its hybrid radar-optical architecture is designed for day, night, low-visibility, and adverse-weather operation; the important diligence question is how those claims perform across different runway geometries and customer environments.

The customer problem is concrete and safety-critical. Airport operations teams must keep runways available while detecting debris, wildlife, standing water, snow, ice, and other conditions that can damage aircraft or cause delays. Xsight's system is intended to reduce dependence on periodic manual FOD walks, shorten the time needed to locate and remove an object, and provide a persistent operational record for investigation and planning. ArcWize also targets the increasingly digitized runway-condition workflow, including contaminant depth and coverage measurements and recommended reporting outputs aligned with the Global Reporting Format. This is a specialized infrastructure purchase: value comes from avoiding runway closures and improving safety, but buyers must justify capital expenditure, integration, maintenance, and operational acceptance.

Commercial evidence is visible but incomplete. Xsight's own case material identifies an operational RunWize installation on runway 16C/34C at Seattle-Tacoma International Airport, and its site describes use at Ben Gurion and other international airports. A Janes-reproduced report states that the Israeli Ministry of Defense selected RunWize and names additional FODetect sites, while the company describes airport and military-airbase customers worldwide. These are meaningful signs of productization and field exposure, not proof of current revenue scale, retention, or broad market share. Public disclosures do not establish funding totals, backlog, unit economics, customer concentration, or the proportion of recurring software and service revenue.

Competition comes from dedicated runway FOD and surface-monitoring vendors, airport-equipment integrators, and substitutes such as manual inspections, patrol vehicles, weather sensors, and camera-only systems. Xsight's strongest apparent edge is the integration of radar, electro-optical imaging, location and visualization, and runway-specific classification in one operational workflow. That combination can improve all-weather coverage and reduce false alarms, but it also creates a larger deployment and validation burden than a software-only product. The company must continue to demonstrate detection performance, maintainability, cybersecurity, and compatibility with airport operations systems while navigating long procurement cycles and site-specific engineering.

The national-security relevance is substantive but bounded. The same runway-monitoring stack can protect aircraft, preserve sortie availability, and support incident response at military airbases, without implying that Xsight is a weapons or intelligence company. Its strategic value therefore sits in resilient airfield operations and aviation safety. The dual-use thesis is strongest where a defense customer needs persistent runway awareness in degraded visibility or high-tempo operations; it is weaker if military demand is limited to occasional infrastructure projects or if civil-airport deployments do not translate across security and procurement requirements.
"""
