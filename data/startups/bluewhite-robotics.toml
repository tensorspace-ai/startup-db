dual_use_description = "Bluewhite has substantive dual-use applicability because the same hardware-agnostic autonomy stack is described as operating across agricultural and defense platforms. Sensor fusion using RGB, infrared, LiDAR, and IMU data; edge path planning; GPS-denied navigation; loss-of-communications logic; remote supervision; leader-follower operation; and vehicle or payload control are relevant to both farm automation and military or homeland-security ground vehicles. The acquisition by Elbit and the company's current public defense positioning strengthen the strategic case. Evidence of specific defense contracts, certification, or scaled military deployment remains limited in the public record, so the dual-use assessment should not be read as proof of procurement traction."
key_technologies = ["Hardware-agnostic retrofit autonomy kits with drive-by-wire actuation", "RGB, infrared, LiDAR, and IMU sensor fusion", "Edge AI perception, terrain traversability, and obstacle detection", "GPS-denied navigation and communications-loss behavior", "Real-time path planning, waypoint navigation, and leader-follower control", "Cloud and on-premises fleet and mission management", "Vehicle, implement, and payload control over CAN and Ethernet interfaces"]
