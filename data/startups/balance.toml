name = "Balance"
description = "Israeli-founded fintech company providing embedded payments, trade credit and order-to-cash infrastructure for B2B commerce."
detailed_description = """Balance (legal entity Balance Payments, Inc.) sells financial infrastructure to B2B merchants, marketplaces and commerce platforms. Its platform is intended to replace the disconnected checkout, credit approval, invoicing, collections and reconciliation steps that make a business purchase slower than a consumer checkout. A merchant can embed Balance in a storefront or buyer portal, present payment choices such as card, bank transfer or pay-by-invoice/net terms, and use Balance's onboarding, fraud and credit-risk workflow to support the transaction. For marketplaces, the product also addresses seller payments and platform-specific transaction flows. Current product pages group capabilities across B2B payments, pay-by-invoice, B2B buy-now-pay-later, marketplace infrastructure and order-to-cash tools such as invoicing, collections and cash application. These are company-described capabilities; public sources do not disclose the product-level split of software fees, transaction fees, credit income or loss-sharing arrangements."""
logo = "https://www.getbalance.com/wp-content/uploads/2026/07/Frame-17.svg"
website = "https://www.getbalance.com/"
sector = "Fintech"
founded = "2020"
headquarters = "New York, United States; Tel Aviv, Israel operations"
employees = "Around 60 reported in July 2022; current total not disclosed"
funding_stage = "Series B (last publicly disclosed equity round: July 2022)"
entity_type = "startup"
dual_use = false
dual_use_description = "Balance's disclosed product is commercial B2B payments and credit infrastructure. The reviewed product, partner and funding sources describe merchant onboarding, trade credit, payment processing, invoicing and receivables workflows. No defense, intelligence, government-security or military customer/use was identified. The risk, fraud and underwriting functions have general financial-crime and fraud-prevention relevance, but that alone does not establish a defense or security deployment; the company is therefore not assigned a dual-use thesis here."
key_technologies = ["Embedded B2B payments APIs", "Digital trade credit and pay-by-invoice", "Credit underwriting and fraud controls", "Marketplace financial infrastructure", "Accounts receivable automation", "Bank-payment rails and reconciliation"]
use_cases = ["B2B online checkout", "Net terms and business buyer financing", "Marketplace seller and buyer payment flows", "Invoice issuance and collection", "Cash application and reconciliation", "Buyer onboarding and credit risk management"]
investible = false
investment_rationale = """Balance addresses a structural commerce problem: business purchases often require negotiated terms, credit checks, invoices, approvals and bank transfers, while many digital commerce stacks were designed around immediate consumer card payment. Its product thesis is coherent because it attaches financing and payment choices to the same checkout and receivables workflow. If Balance can make a seller's checkout convert better while taking operational work away from the seller, it can earn both software and transaction-related revenue and become difficult to remove after integration. The company has also expanded its product framing from an early B2B checkout layer toward the broader invoice-to-cash lifecycle, which can increase its share of a merchant's workflow and generate more data for underwriting.

The evidence of market access is meaningful but should be read precisely. In 2022 the company described hundreds of merchants, marketplaces and customers in aggregate and named a set of commerce relationships; that combined figure is not a count of paying, unique merchants. Subsequent company announcements document an RTP-enabled bank-payment feature, a B-Stock partnership and a Shopware integration announced for North American merchants. These announcements show continued product and channel activity through 2026. They do not disclose transaction volume, attach rate, credit utilization, repayment performance, renewal rates or customer economics. The public record therefore supports continued commercial execution and distribution work, but not a conclusion that the business has reached a particular revenue scale or has proven attractive unit economics.

The financing record gives Balance room to build and a notable specialist investor group. Public reporting identifies a $5.5 million seed in 2021, a $25 million Series A later that year and a $56 million Series B in 2022. A contemporaneous reported cumulative figure was $87 million, which is rounded relative to the disclosed round amounts totaling $86.5 million. A separate $350 million credit-facility commitment was reported in November 2022. That facility is a financing capacity for extending credit, not equity raised and not proof that the entire commitment was drawn. For an underwriting-led fintech, access to committed lending capacity can support seller payout and buyer terms, but it introduces lender, covenant, funding-cost and asset-performance dependencies. The company has not publicly supplied current credit losses, delinquencies, receivable duration, facility utilization or the share of risk retained versus transferred.

The core diligence case is consequently conditional. A growth investor would need current gross payment volume, net revenue retention, take rate by product, contribution margin after funding and servicing costs, cohort repayment curves, loss rates by segment, exposure limits and concentration by platform and lender. It would also be important to establish which modules are live products versus marketing categories, how much underwriting is automated versus manually reviewed, and whether Balance is principal, agent, servicer or technology provider in each transaction and jurisdiction. Because the last publicly identified equity round was in 2022, present cash runway, later financing, and strategic ownership changes also need verification. Those missing facts matter more than a broad estimate of B2B commerce market size."""
strategic_value = """For a commerce platform or financial institution, Balance could provide an embedded layer that links buyer identity and credit decisions to order acceptance, seller payout, receivables and reconciliation. The strategic value is strongest where a marketplace or vertical software platform has many business buyers and suppliers but does not want to build credit operations, payment orchestration or collections infrastructure itself. A successful integration can shorten implementation work for a platform and give merchants a choice of payment terms without each merchant separately assembling lenders, payment processors and receivables software. The public Shopware announcement is evidence of a distribution integration being offered; it is not evidence of deployed volume across the Shopware base.

The company has potential data advantages only if transaction and repayment data are sufficiently broad, permissioned and predictive. Order, invoice, payment and repayment events can improve risk decisions and let Balance reconcile balances with less manual work. That advantage is not automatic: marketplace data may be siloed, adverse selection may concentrate risk, and credit models can fail when economic conditions or customer mix shift. The moat therefore depends on underwriting results, funding reliability, integration quality, compliance operations and repeatable economics rather than on the mere presence of an AI label or API. As an Israeli-founded company with Tel Aviv roles and US commercial operations, it also sits between Israel's fintech engineering base and a large North American B2B market, while navigating a cross-border operating footprint."""
