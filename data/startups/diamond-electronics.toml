name = "Diamond Electronics"
description = "Diamond Electronics is an Israeli semiconductor startup developing diamond-based transistor devices for high-power and high-frequency electronics. Its deep-tech work sits at the intersection of advanced materials, RF hardware, power electronics, and strategic semiconductor resilience."
detailed_description = """
**Product and the concrete problem it solves.** Diamond Electronics is developing diamond-based field-effect transistor devices, including power MOSFETs, intended to operate where conventional silicon, gallium nitride, and silicon-carbide components face difficult trade-offs between voltage, frequency, heat dissipation, switching losses, and reliability. The official website is more specific than a generic materials pitch: it describes a wafer-to-device-to-discrete-to-power-module stack and claims that individual diamond devices can deliver higher voltage density with far less peripheral cooling than incumbent SiC and GaN parts. It has not published a finished catalog part, named customer, or fielded system, so the company should still be understood as a semiconductor component venture in R&D rather than as a conventional electronics manufacturer with proven production revenue. The problem is strategically important nevertheless. Power-conversion equipment, radar transmitters, electronic-warfare payloads, satellite communications, high-voltage infrastructure, and increasingly dense AI data centers all need devices that can handle more electrical stress in smaller, cooler, and more reliable packages. Diamond is attractive because its physical properties suggest an unusually strong combination of thermal conductivity, breakdown-field strength, and high-frequency potential. Diamond Electronics is therefore trying to turn a difficult materials-science proposition into an industrial transistor platform.

**Core technology and how it actually works.** The available engineering evidence points to a device-development program spanning diamond material, transistor architecture, fabrication, measurement, and packaging. A Diamond Electronics job posting describes work on novel high-power and high-frequency transistors and asks engineers to handle device ideation, architecture, simulation, layout delivery to a fab, microfabrication-process development, microelectronics measurements, data analysis, and packaging. The same posting names FET and CMOS experience, clean-room fabrication, lithography, metallization, etching, and wide-bandgap materials such as GaN and silicon as relevant backgrounds. That is a meaningful description of the development chain: the company is not merely coating an existing device with diamond, but appears to be working across device physics and manufacturability. A Japanese Science and Technology Agency record also identifies a 2022 Nature Electronics item on diamond electronics with high carrier mobilities authored by Moshe Tordjman, linking the company’s technical leadership to prior research in diamond transistor structures. The official website also publishes company-authored performance claims: diamond MOSFETs with up to 4x high-power performance versus incumbent devices, an intrinsic breakdown-field advantage described as 10x, an RF-frequency envelope up to 120 GHz, 4x power density on a single FET, 5x lower volume and weight versus typical SiC devices, and 3x higher operating temperature. Those figures are marketing claims from the company, not independently measured device results. Public sources still do not disclose the exact device geometry, diamond growth method, dopant strategy, wafer size, measured breakdown voltage, efficiency, yield, or a third-party benchmark. The central technical diligence gap is therefore the distance between published claims and verified devices.

**Market, customers, and go-to-market.** Diamond Electronics has not publicly named commercial customers, design wins, paid pilots, revenue, or a production partner. The Israel Innovation Authority classifies its target market as the diamond sector, while the technical problem and hiring profile imply a broader eventual buyer set: power-device manufacturers, RF and microwave equipment makers, defense primes, aerospace suppliers, communications companies, grid and energy-equipment vendors, and data-center power-system integrators. The likely go-to-market path is a design-in model rather than a direct-to-consumer product: demonstrate repeatable device performance, qualify a process with a fabrication and packaging partner, and license or sell components into higher-level systems. Early customers in this category are likely to evaluate the technology through test structures, engineering samples, and joint development rather than purchase a commodity transistor immediately. Diamond Electronics can also potentially create value through device IP, process recipes, and application-specific modules before it operates a large manufacturing line. That path is capital-intensive and slow, and it exposes the company to qualification requirements that are especially demanding in aerospace, defense, telecom, and grid applications. No public source establishes an active customer pipeline, so the commercial case remains a technically informed market thesis rather than demonstrated product-market fit.

**Traction, funding, and third-party validation.** The company was established in 2023, has an official Israel Innovation Authority profile listing ten employees and R&D stage, and received support through the Authority’s Seed Investment Program in 2023. Startup Nation Finder reports an undisclosed May 2023 seed round involving Entrée Capital and Tal Ventures; because the amount and full terms are not public, the funding should not be converted into an estimated total raised. The strongest recent validation is institutional rather than commercial. In November 2025, the Israel Innovation Authority announced DiamondSEMI IL, a national applied-research consortium co-funded with Israel’s Directorate of Defense Research and Development and focused on diamond-based optical and semiconductor components. The Authority lists Diamond Electronics among the participating companies alongside Rafael, Elbit Space, Israel Aerospace Industries, Nvidia, the Technion, Weizmann Institute, and other industrial and academic partners. Consortium participation demonstrates that the company is connected to a serious national research and industrialization effort; it does not prove that Diamond Electronics has delivered a qualified device to any of those organizations. The public record contains no disclosed patents, revenue, customer acceptance tests, production volume, or independently verified device-performance results, so the evidence supports active deep-tech development and ecosystem validation, not commercialization maturity.

**Founders and team background.** The public record identifies Dr. Moshe Tordjman as Diamond Electronics’ CEO and associates him with the company’s transistor-development recruiting. His research profile links him to the Technion’s Solid State Institute and to MIT’s Microsystems Technology Laboratories, and the J-GLOBAL record for the Nature Electronics article places his work in diamond electronics, carrier mobility, heterojunctions, and field-effect transistors. A LinkedIn job page also identifies Tordjman as co-founder and CTO of the separate Israeli company Quantum Transistors, where the public product thesis is a diamond-based quantum processor rather than a high-power/high-frequency transistor business. That cross-company relationship is strategically interesting because it suggests access to rare diamond-device expertise, but it requires direct diligence on intellectual-property boundaries, time allocation, corporate governance, and whether any process or patent assets are shared. Other publicly visible Diamond Electronics employees include Ran Achituv, Miriam Shtilman Lavsovski, Itay Gabriel, and Sivan Tzadka, while the Israel Innovation Authority reports ten employees overall. The team is small and technically concentrated, which can accelerate research but leaves open questions about production engineering, reliability qualification, semiconductor operations, international sales, and the depth of the bench beneath the founder.

**Competitive dynamics.** Diamond Electronics enters a market where the incumbent approaches are much more mature. Wolfspeed and Infineon have established silicon-carbide power ecosystems; Qorvo, Wolfspeed, and NXP are credible references in GaN and high-frequency RF; and large defense suppliers such as Rafael, Elbit Systems, and L3Harris can design around component shortages or develop application-specific modules internally. Element Six and other synthetic-diamond specialists compete at the materials and substrate layer, while Israeli Diamic is an adjacent diamond-semiconductor materials company focused on diamond growth and wafer manufacturing. Diamond Electronics’ possible edge is not simply that diamond has attractive physical properties: it is the ability to turn those properties into a repeatable, packaged transistor process that performs predictably at system-relevant voltage and frequency. A successful device could create advantages in thermal management, power density, RF linearity, radiation tolerance, and operation in harsh environments, but those are hypotheses until measured. The company also faces a classic platform risk: if diamond substrates remain expensive, inconsistent, or difficult to integrate with existing manufacturing lines, customers may prefer incremental improvements in GaN, SiC, advanced packaging, or cooling. Its competitive moat must therefore come from process know-how, device IP, yield, reliability data, and customer qualification rather than material novelty alone.

**Defense, security, and resilience dual-use relevance.** Diamond Electronics has a credible dual-use profile because high-power and high-frequency semiconductor devices are enabling components for both civilian infrastructure and defense systems. In defense, the potential applications include radar and active electronically scanned arrays, electronic-warfare transmitters and receivers, secure high-frequency communications, missile-warning sensors, phased-array apertures, and power conditioning for unmanned or space systems. In civilian markets, related devices could support telecom infrastructure, satellite links, grid conversion, industrial motors, renewable-energy inverters, high-voltage switching, and power delivery for dense computing. The connection is reinforced by DiamondSEMI IL’s co-funding with DDR&D and its participation by Israeli defense primes and advanced-research institutions; the Authority specifically describes diamond components as relevant to communications, energy, advanced sensing, and extreme-condition durability. That is strategic ecosystem evidence, not evidence of a defense contract or deployed military component. No public source identifies an end-user program, classified evaluation, qualification standard, or production order for Diamond Electronics. The correct assessment is that the company is developing a foundational component technology with a real defense and critical-infrastructure transfer path, while the operational defense value remains contingent on device performance, manufacturing repeatability, reliability testing, and integration into certified systems.

**Growth stage, trajectory, and key diligence risks.** Diamond Electronics is early-stage: it was founded in 2023, is listed at R&D stage, has roughly ten employees, and has public seed-stage support but no disclosed production revenue. Its trajectory is the difficult sequence from diamond-device research to repeatable transistor, from transistor to packaged engineering sample, and from sample to qualified component in markets where customers may require years of reliability evidence. The most important diligence questions are: (1) whether the company has working devices with independently measured electrical and thermal performance; (2) whether diamond material quality, dopant control, contacts, and packaging can support acceptable yield; (3) whether fabrication is performed in-house, through a university or consortium, or through a commercial foundry; (4) whether the company owns defensible patents and process know-how distinct from the founder’s other ventures; (5) whether the seed financing is sufficient for the next tape-out and qualification cycle; (6) whether the team can add manufacturing, reliability, and customer-engineering depth without losing research velocity; and (7) whether a market will pay a premium over rapidly improving GaN, SiC, and advanced-cooling alternatives. The upside is strategic: a successful Israeli diamond-semiconductor capability could strengthen allied supply chains for high-power, RF, sensing, and extreme-environment electronics. The downside is equally clear: the company may remain a promising research vehicle if material cost, device yield, or system qualification prevents commercialization.
"""
