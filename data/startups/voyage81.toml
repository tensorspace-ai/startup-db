name = "Voyage81"
description = "Voyage81 was an Israeli computational-imaging company that developed physics-based software for recovering hyperspectral information from ordinary RGB smartphone images, alongside a modified-colour-filter low-light imaging solution. It was acquired by IL MAKIAGE in 2021 and is now best treated as an acquired imaging asset rather than an independent investible startup."

detailed_description = """
Voyage81 developed computational imaging software intended to make hyperspectral sensing available through commodity cameras. Its official product material says the software maps the RGB values in each pixel to an inferred spectral signature using physics-based machine-learning models and a pre-collected hyperspectral database. The company marketed recovery of 31 spectral channels from an ordinary smartphone image, while acknowledging that the result is an inferred reconstruction rather than a direct measurement from a conventional imaging spectrometer. It also described a separate low-light product combining a modified colour-filter array with a spectral-recovery engine to improve photon efficiency and colour accuracy. This is a technically ambitious inverse problem: three broad camera channels do not uniquely determine dozens of wavelengths, so performance depends on camera-specific calibration, representative training data, scene assumptions, and careful validation against ground-truth instruments.

The initial commercial wedge was consumer beauty and health. Voyage81 described smartphone analysis of skin and hair features, facial blood-flow signals, and melanin and hemoglobin maps, as well as product-personalisation and shade-matching possibilities. The proposition was attractive because a software-first approach could avoid the cost, size, and operational friction of a dedicated hyperspectral camera, while using the spatial resolution and deployment footprint of a phone. Public acquisition materials describe IL MAKIAGE's intent to combine Voyage81's computer-vision capability with its existing machine-learning platform and to use the technology in beauty and wellness. Public sources support the product direction and acquisition, but do not establish broad independent production deployment, recurring revenue, or validated clinical performance.

Competitive differentiation rested on the combination of physics-aware reconstruction, proprietary spectral data, camera calibration, and potential on-device or near-device inference. The addressable market is therefore broader than beauty, but the company faced strong substitutes: purpose-built multispectral and hyperspectral cameras, smartphone manufacturers' native computational-photography teams, and application-specific computer-vision models that may need only a few well-chosen bands. Generalisation is the central commercial question. A model calibrated for a particular phone, illumination regime, skin population, or material class may not transfer cleanly to another device or to outdoor, moving, or standoff scenes. The company was reported to have raised venture funding and reached approximately 20 employees around the acquisition, but public evidence is insufficient to claim a scaled independent business.

The July 2021 share-purchase agreement and ODDITY filings establish the important current status: Voyage81 was acquired by IL MAKIAGE, and ODDITY later listed VOYAGE81 LTD among its Israeli subsidiaries. This validates strategic interest in the technology and gives the record a clear exit signal, but it also limits present-day diligence on independent ownership, product availability, team continuity, licensing, and access to models or datasets. The acquisition price reported by contemporaneous media should be treated as a media report rather than a currently verified operating metric. There is no reliable public basis here to assert that Voyage81 itself sells a standalone product today.

The underlying capability has credible but bounded dual-use relevance. Spectral inference can support material classification, agricultural and environmental monitoring, industrial inspection, and mobile or drone-based triage when the sensor, optics, calibration, and operating conditions are appropriate. Those pathways could be relevant to infrastructure resilience, search and rescue, or security screening. However, the public record reviewed is commercial and beauty-focused; it does not demonstrate defense contracts, military deployment, standoff camouflage detection, or field performance in contested environments. Strategic diligence should therefore focus on whether the acquired IP can operate outside the original phone-and-beauty domain, what calibration and uncertainty estimates it exposes, what rights remain available, and whether the technology offers a measurable advantage over dedicated multispectral hardware.
"""

