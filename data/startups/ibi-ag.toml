name = "IBI Ag"
description = "IBI Ag is an Israeli agricultural-biotechnology startup developing selective bioinsecticides from single-domain antibody (nanobody) technology. Its platform is intended to create new modes of action for controlling sucking and chewing pests while reducing effects on beneficial organisms and the broader environment."
detailed_description = """IBI Ag develops biological crop-protection products based on engineered single-domain antibodies, also called nanobodies. The company describes a workflow that selects sensitive proteins and biological functions inside target insects, develops high-affinity binders, and tests candidates for insect-control performance. The small, stable format is adapted from pharmaceutical antibody research but is being developed for agricultural use, where the commercial bar is different: a product must survive field conditions, work at a cost per hectare farmers will accept, fit existing application practices, and satisfy pesticide regulators. The company's stated value proposition is selective control of insect pests, including both sucking and chewing insects, with reduced impact on non-target species. Its website also emphasizes fermentation suitability, which could be important if production can be scaled economically with microbial or other industrial bioprocesses.

The customer problem is concrete. Farmers and crop-protection distributors need additional modes of action as resistance, residue limits, environmental scrutiny, and restrictions on some conventional actives make the product portfolio harder to maintain. IBI Ag has indicated an initial focus on high-value crops, where pest damage is expensive and residue requirements can make differentiated biologicals more valuable, with possible expansion into row crops. Public evidence establishes a platform and development program, not a commercial product launch, approved active ingredient, or recurring revenue base. The Israel Innovation Authority profile identifies agricultural crop producers and farmers as target customers and lists the company at R&D stage. Accordingly, the main near-term milestones are candidate selection, replicated field efficacy, formulation and shelf-life work, regulatory dossiers, manufacturing economics, and distribution or co-development arrangements.

The competitive field includes established biological-control suppliers, microbial and RNA-based biopesticide developers, incumbent crop-protection companies, and non-chemical substitutes such as integrated pest management and beneficial insects. IBI Ag's potential edge is not simply that its molecules are biological: it is the combination of target selectivity, a potentially broad design space for new modes of action, and a claimed path toward fermentation-based production. That edge remains conditional. The company must show that laboratory binding and controlled-environment results translate into consistent performance across pest life stages, crops, climates, application methods, and mixed-field conditions. It must also demonstrate that production, formulation, storage, and application costs can compete with synthetic products and other biologicals after regulatory and channel costs are included. Corteva's leadership of the completed Series A is a meaningful strategic validation signal and could provide domain access, but it is not evidence that a product has been approved, adopted, or commercially launched.

IBI Ag has substantive but bounded dual-use relevance. Crop protection is part of food-system resilience: a country or alliance that can develop and manufacture alternatives to vulnerable pesticide supply chains has more options during trade disruption, resistance events, or sudden pest pressure. A selective product that preserves beneficial insects could also support resilient agricultural production. However, no public source reviewed here documents military customers, defense contracts, classified work, or a direct security application. The strategic case should therefore be framed around agricultural continuity, biological manufacturing capacity, and supply-chain optionality, not battlefield use. The company is an early-stage technology and regulatory diligence opportunity whose value depends on converting a credible platform into registered, field-proven products."""
