name = "Hour One"
description = "Hour One AI Ltd. developed a cloud platform for text-driven, presenter-led videos using synthetic versions of real people. Wix acquired 100% of the Israeli company in May 2025; its last clearly announced venture financing was a $20 million Series A in April 2022."
detailed_description = """Hour One AI Ltd. was an Israeli generative-media company founded in 2019. Its product converted a script or other text into a presenter-led video using a synthetic character modeled on a real person. The workflow combined short likeness capture, synthetic speech, facial and body animation, scene composition, templates, and cloud rendering. Hour One's 2022 Reals release emphasized self-service generation from text, while its enterprise API allowed users to populate video templates with variable details such as names, roles, and company information. Company and investor materials described multilingual video, custom virtual twins, and interactive experiences; Wix later described the acquired stack as cloud infrastructure integrating generative-AI inference with advanced 3D rendering.

The product addressed recurring business communication where the same message must be updated, localized, or personalized often enough to make repeated filming expensive. Relevant workflows included language instruction, onboarding, compliance and product education, sales enablement, customer success, and marketing explainers. Hour One's API and branded templates could reduce production time and make consistent video output available to non-specialist teams. Product documentation described enterprise-only API access, custom avatars and SSO, as well as moderation rules and AWS hosting. These are company product statements rather than an independent security audit. The same documentation said completed videos hosted on Hour One servers were publicly available by default, a setting that would require careful review before sensitive material was used.

Commercial evidence is real but dated and thin on economics. In its April 2022 Series A announcement, Hour One and its investor Insight Partners identified Berlitz as using virtual instructors across thousands of videos, and described partnerships with NBCUniversal, DreamWorks, and Cameo. These statements establish historical use and named relationships, not contract value, payment status for each partner, retention, or continued use after the acquisition. The round announcement also said the company planned to expand hiring in Tel Aviv and New York. Public materials reviewed here do not establish current standalone headcount, revenue, margins, customer concentration, or product-level retention. Company-reported cumulative financing was $25 million in April 2022, while other records differ on early financing and totals.

Wix acquired all outstanding shares of Hour One AI Ltd. on May 13, 2025, for $6.667 million in cash, according to Wix's SEC filing; $1.4 million was held in escrow. The filing separately describes $3 million in conditional retention bonuses and approximately $10 million in restricted stock units for founders and certain employees, which it accounts for as compensation for post-combination services rather than as acquisition consideration. It values acquired technology at $2.5 million with an estimated eight-year useful life. Israeli registry data later listed the legal entity as liquidated due to merger. The purchase price is not a disclosed financing valuation and should not be treated as one. This transaction and the transfer of founders and staff to Wix make Hour One a strategic technology asset rather than an independently investible startup.

The strategic question is whether Wix can turn a specialized presenter-video pipeline into a differentiated, dependable content feature within a much broader web creation platform. That creates potential advantages in distribution, product integration, and infrastructure economics, while making Hour One's standalone product roadmap and operating results less visible. Its historical edge was the combination of approved human likenesses, reusable templates, multilingual narration, and API-based personalization. Each capability is now available from well-funded competitors, so durable value depends on workflow integration, rendering quality, rights management, enterprise governance, and cost per useful minute of video rather than on avatar realism alone."""
