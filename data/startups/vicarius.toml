name = "Vicarius"
description = "Vicarius develops vRx, an enterprise vulnerability-remediation platform that discovers and prioritizes software exposures, then coordinates patch deployment, custom scripts, or patchless protections and verifies remediation across mixed IT environments."
entity_type = "startup"
detailed_description = """Vicarius sells a vulnerability-remediation workflow for organizations that already have scanners, endpoint tools, and patch processes but struggle to turn findings into safe changes on production systems. The company was founded in 2016 and now operates under the Vicarius brand through Vicarius Ltd. and Vicarius Inc., as named together in its current terms. It identifies New York as its headquarters and maintains an office in Tel Aviv-Yafo. The Israeli connection is confirmed by its Israeli founders, Tel Aviv operations, and Israeli company address; the public material reviewed does not establish the incorporation jurisdiction of each named entity.

The product problem is concrete: security teams identify a vulnerable version or configuration, while IT and application owners control maintenance windows and bear the consequences of failed changes. Vicarius positions vRx as the operating layer between those groups. Its current product descriptions combine asset and software discovery, vulnerability validation and prioritization, patch selection, rollout policy, scripts for fixes outside normal patch catalogs, and a follow-up check that the vulnerable version or exposure is gone. This closed-loop emphasis is the most specific part of its commercial proposition: success is supposed to mean a verified reduction in exposure, not just a scan report or a patch job marked complete.

The company describes vRadar as agent-based and agentless discovery, vScore as risk ranking using data such as CVSS, EPSS, and known-exploited-vulnerability signals, and vPatch as policy-driven patch deployment across Windows, macOS, Linux, and a catalog of more than 20,000 third-party applications. vScript and ScriptAI address remediation that does not fit a vendor patch, while vShield provides patchless protection for cases where an upgrade cannot be applied immediately. Vicarius says vShield uses in-memory protection and dynamic binary instrumentation; that mechanism and its coverage should be independently tested on the buyer's software and operating systems. vIntelligence is described as an intelligence and validation layer. These are company product claims, not independent tests of efficacy or breadth.

The buyer value is strongest in estates where third-party applications, remote endpoints, Linux servers, multiple business units, and strict change windows make a single patching routine insufficient. The software is aimed at security and IT teams, with the operational buyer likely to be a vulnerability-management leader, infrastructure team, or managed service provider. Vicarius terms describe customer subscriptions and reseller or MSP delivery, while the company has promoted self-service evaluation. This mix could shorten evaluation time and widen channel reach, but published sources do not disclose list pricing, average contract value, channel contribution, implementation effort, or renewal terms. Diligence should separate trial accounts from paid production deployments and establish whether the product replaces existing tooling or is added alongside it.

Public traction is meaningful but not fully reconciled. TechCrunch reported 150-plus customers, including the UK National Health Service and Ingram Micro, in February 2022. In January 2024, CTech and TechCrunch reported more than 400 customers and named PepsiCo, HPE, Bupa, and Equinix; the coverage also reported more than two dozen Fortune 500 customers. Vicarius' current About page says over 500 customers across 50 countries, while its historical timeline labels 2024 as 500-plus customers in 60-plus countries and more than two million assets protected. Its current LinkedIn profile states 800-plus customers in over 65 countries, but the profile gives no measurement date. These numbers suggest continued reach, yet the changing and internally inconsistent snapshots are not a substitute for customer cohorts, contracted recurring revenue, active usage, retention, or concentration data.

One useful deployment example is Vicarius' company-hosted EL AL case study. It describes a production rollout across 500 Windows and 250 Linux servers and reports 98 percent monthly server coverage, a 95 percent reduction in manual patching effort, and patch planning reduced from a full-time task to one day. The case study quotes EL AL's infrastructure deputy director and explains that agents were distributed through SCCM for Windows and scripts for Linux, with an on-premises proxy. This is evidence of a real commercial use case in an availability-sensitive airline environment, but its outcome figures remain vendor-published customer claims. It does not demonstrate military procurement or a government contract.

The competitive field is wider than vulnerability scanners. Tenable One, Qualys VMDR with Patch Management, and Rapid7 InsightVM all offer asset discovery, risk prioritization, remediation guidance, and integrations; Qualys also describes automated patch jobs across operating systems and third-party applications. Buyers can also combine Microsoft or endpoint-management products with vulnerability scanners, ITSM workflows, or patch specialists such as Automox. Vicarius' clearest distinction is the bundled remediation loop, including custom scripts and patchless protection, rather than exclusive access to vulnerability data. That distinction is not a durable moat by itself: the larger vendors already cover parts of the workflow, and product overlap is increasing. Competitive diligence should compare patch and script coverage by software version, actual successful closures, operational guardrails, and total cost against the customer's existing licenses.

The founding group includes Michael Assraf, Roi Cohen, and Yossi Ze'evi. Current Vicarius materials list Roi Cohen as CEO and co-founder and Yossi Ze'evi as CTO and co-founder; they also list COO Ohad Rubin, board chair Orna Mintz-Dov, SVP R&D Yaniv Bigger, VP Finance Moran Shushan, and regional sales leaders. TechCrunch still described Michael Assraf as CEO in January 2024, so the CEO transition date and Michael's current role are not established by the public leadership page. Roi Cohen's Forbes Technology Council profile describes prior malware-research leadership at CyberArk and CYBERTINEL and vulnerability-research work; the other named executives' backgrounds are not detailed in the sources reviewed. LinkedIn lists Vicarius as privately held with 51–200 employees.

Funding confirms a company beyond prototype stage, but both the history and the cumulative total require care. JVP announced a $1 million investment award to Vicarius in its 2018 NYC Play competition. Vicarius and Globes announced a $5 million seed on January 22, 2020; IVC's JVP portfolio data separately records a $2.6 million first round on that same date. The conflicting 2020 amount is left unresolved. Vicarius announced a $24 million Series A on February 9, 2022, which IVC classifies as a first-round extension. In January 2024 the company announced a $30 million Series B led by Bright Pixel Capital. TechCrunch reported an approximate $56.7 million cumulative total while CTech said over $56 million; the exact company-announced lifetime total and treatment of earlier investment awards are not public. No later Series C or new financing announcement was found in searches through October 2026. Revenue, ARR, profitability, burn, runway, cap table, investor ownership, and valuation terms remain undisclosed.

The dual-use case is a consequence of the product's defensive function: reducing software exposure and coordinating controlled remediation supports ordinary enterprise IT as well as public-sector, critical-infrastructure, and defense networks that must preserve availability. Patchless mitigation and staged fixes could be valuable where downtime is costly, and the EL AL deployment provides a commercial example of operating under demanding uptime constraints. There is no verified defense contract, classified deployment, government procurement, or security certification specific to Vicarius in the sources reviewed. It should therefore be assessed as a commercial cyber-resilience supplier with plausible government applicability, not as a defense-native company.

The main execution risks follow directly from the product's authority to change systems. A bad patch, generated script, or in-memory control can cause outages, leave an exposure open, or create a new failure mode. Buyers need evidence about permissions, approvals, staged rollout, rollback, logging, script provenance, false-positive handling, agentless visibility limits, and the behavior of patchless controls under endpoint protection and application updates. The commercial case also depends on proving that a broad patch catalog stays current, that customers use remediation after installation, and that automation reduces labor without creating hidden support costs. Priority diligence questions are the discrepancy in funding and customer reports, retention and revenue quality, production success and rollback rates by environment, patchless coverage and safety, and competitive win rates against installed vulnerability and endpoint-management suites."""
