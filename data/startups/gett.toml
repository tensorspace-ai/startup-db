dual_use_description = "Gett does not possess meaningful dual-use defense characteristics. Its core product—B2B ground transportation orchestration and expense management—is a commercial procurement and logistics tool with no inherent defense technology, cryptography, autonomous systems, sensing, or security architecture. While duty-of-care monitoring can track traveler location and incident response in real time, this is a commercial risk-management feature, not a defense capability. There is tangential relevance to government travel management, continuity-of-operations (COOP) transport coordination, and personnel movement tracking for civilian government agencies, but these represent process and procurement optimization—not dual-use or strategic defense technology. The platform could theoretically support logistics for non-conflict government operations, but such deployment would be administrative application of commercial software, not development or transfer of defense-critical capability. No credible evidence supports defense sector use or strategic alignment with U.S.-Israel defense innovation priorities."
