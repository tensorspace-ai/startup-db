stage_rationale = "Gett is mature: Series H funding, 500+ employees, multinational customer base, established product, and years of market operation. However, 'mature' in this context denotes organizational scale and market presence, not profitability or growth trajectory. The company has not achieved unicorn status despite substantial capital deployment, suggesting constrained growth or profitability challenges. Recent strategic retreats (North America exit) and competitive pressures indicate plateau dynamics typical of late-stage ventures facing consolidation or alternative exit scenarios. The business is stable and operationally complex, but lacks growth drivers or differentiation moats that would characterize a high-growth or scaled-exit company."
