competitive_edge = "Gett's claimed edge rests on three factors: (1) dedicated B2B design with corporate policy, compliance, and invoicing as core rather than afterthought; (2) API-first architecture enabling deep T&E, ERP, and identity-system integration; (3) years of accumulated customer data on supply reliability, pricing, and traveler preferences enabling analytics and optimization. These advantages are real but not durable. Uber and Lyft can replicate B2B features with far greater network resources. APIs and integrations are table-stakes in SaaS and quickly commoditized. Data advantages are only defensible if Gett's switching costs exceed the value of alternatives—a thesis increasingly challenged by TMC bundling. Sustainable competitive advantage is not evident; the business is better characterized as a well-executed but non-unique B2B SaaS player in a consolidating market."
