dual_use_description = "Razor Labs meets a substantive dual-use threshold because its core capabilities—sensor fusion, anomaly detection, machine-health prediction, and automated visual defect classification—can serve both civilian industrial assets and defense production or sustainment. The defense case is supported by the company's public 2022 announcement of a memorandum with a global defense company for an Inspection AI system intended to identify ammunition-production defects, and by the general transferability of fleet and fixed-asset reliability methods. The evidence supports credible adjacency, not a conclusion that defense revenue, classified deployments, or military fleet adoption is material today. Mining remains the company's clearest publicly evidenced market."
