name = "DailyRobotics"
description = "DailyRobotics is an Israeli agricultural-robotics startup developing Q2, a battery-powered field robot that uses two robotic arms, soft grippers, computer vision, and on-board grading to harvest and pack strawberries. Its stated objective is to reduce growers' dependence on scarce seasonal labor while making open-field fruit production more predictable and productive."
detailed_description = """
**Product and the concrete problem it solves.** DailyRobotics is building Q2 around a specific food-production bottleneck: open-field strawberries are valuable but fragile, difficult to locate under foliage, expensive to pick, and dependent on seasonal workers who are increasingly difficult to recruit and retain. The company describes Q2 as a field-ready harvesting robot that can move through existing beds, find fruit, remove it gently, evaluate it, and place it directly into the appropriate clamshell or container. That closed loop matters because picking alone does not solve the farm's labor problem if a second manual crew must inspect, grade, and repack the crop. AgFunder News reported that California growers can spend about $43,000 per acre each year on picking and that some fruit is left on the ground; those figures are reported market context rather than a DailyRobotics financial result, but they illustrate why a robot can have value even before it reaches full human-equivalent throughput. The company is consequently addressing labor availability, crop loss, pack-house handling, and harvest consistency together rather than selling a generic autonomous vehicle.

**Core technology and how it works.** Q2 combines a battery-powered mobile platform with two robotic arms, soft end-effectors, machine vision, and a perception pipeline that evaluates each berry for size, surface defects, color maturity, and over-ripeness. The arms enter the plant canopy, where fruit is partly hidden and illumination changes with foliage, and the system must distinguish ripe strawberries from leaves, stems, shadows, damaged fruit, and fruit that should remain on the plant. DailyRobotics says its soft gripper is designed to hug the berry without squeezing it, and that the machine's camera sees the fruit before the manipulator performs the harvest and pack action. The company has also described dynamic perception that searches through the canopy rather than assuming a fixed fruit location. AgFunder reported approximately 30 kilograms per hour in current field performance, with hardware intended to reach 50 kilograms per hour as software and cycle time improve, plus a design in which one operator can supervise up to eight robots. Those are company-reported operating figures, not independently certified benchmarks. The engineering challenge is the interaction of perception, reach planning, compliant grasping, battery endurance, navigation, and crop handling under wind, dust, rain, variable bed geometry, and inconsistent fruit presentation.

**Market, customers, and go-to-market.** The initial market is commercial strawberry production, especially open-field farms in California and other regions where labor is costly and harvest windows move across geography. The official site presents Q2 as a robotic harvesting service that includes setup and maintenance without upfront customer purchase, while also inviting sales conversations; this points to a robotics-as-a-service model intended to lower adoption friction for growers who do not want to own and maintain a specialized fleet. AgFunder reported that DailyRobotics planned to deploy its first robots with a California customer from April 2026 and that the company was keeping open the option of selling machines. The field design is meant to fit existing operations rather than requiring farms to rebuild their production system: the robot harvests directly into retail packaging, performs quality grading at the point of picking, and can be moved between regions as harvest seasons shift. The route to market is therefore likely reference farms, seasonal deployments, and service economics, followed by fleet expansion and possibly hardware sales. The key commercial proof will be cost per marketable kilogram, uptime, bruising rate, labor saved per acre, and whether growers renew the service after a complete season.

**Traction, funding, and third-party validation.** DailyRobotics has moved beyond a laboratory concept but remains early in commercialization. The official website shows an identified product, Q2, and a direct commercial contact path. The Israel Innovation Authority lists DailyRobotics as an Israeli agritech company established in 2022, with an R&D stage, five employees, two R&D-fund awards, and a technology description covering artificial intelligence, robotics, machine vision, and autonomous systems. Startupim reports a 2023 founding date, a six-person team, non-dilutive Innovation Authority grants in 2023 and 2024, and a pre-funding status; this date variation likely reflects legal incorporation versus operating-company history and should be resolved with the company. AgFunder's November 2025 report provides the most useful independent product and market detail: it identifies the founders, describes field performance, names the planned California deployment, and says the company had not taken venture capital, relying instead on founders, a non-dilutive grant, and angel investors. LinkedIn posts from the company reinforce that Q2 has been tested in real fields and that its closed-loop workflow includes both picking and quality grading. No public revenue, paid-customer contract, patent list, independent benchmark, or financing amount was identified, so these signals establish credible development and customer discovery rather than scale.

**Founders and team background.** Public sources identify Adham Ghazali as co-founder and CEO, with Majed Jubeh and Farah Jubran also named as co-founders in AgFunder's company reporting. Ghazali previously co-founded and led Imagry, a vision-based autonomous-driving company, giving DailyRobotics relevant experience in computer vision, machine learning, robotics deployment, and the gap between controlled demonstrations and messy real-world operation. Public professional profiles associate Jubeh with operations and engineering work and identify technical experience among the broader founding group, while the Innovation Authority independently lists Ghazali as CEO and co-founder. The team is small, which can be an advantage for rapid iteration but creates concentration risk: the public record does not show a large agricultural-sales organization, manufacturing group, field-service network, or specialist crop-science department. Harvesting robots require all of those capabilities eventually, because a working prototype is only one part of the product. Diligence should map who owns manipulation, perception, agronomy, fleet operations, safety, manufacturing, and customer success; confirm the status of each named founder; and determine whether the company's self-reported field data is collected under repeatable protocols across varieties, farms, weather conditions, and harvest stages.

**Competitive dynamics.** DailyRobotics competes with a mixture of direct strawberry-robotics startups, greenhouse automation providers, manual labor, and broader agricultural equipment. Harvest CROO Robotics is a close open-field comparator pursuing automated strawberry harvesting at commercial scale. Agrobot and Fieldwork Robotics develop robotic fruit-picking systems using different combinations of machine vision, manipulators, and crop-specific tooling. Organifarms and Oishii's acquired Tortuga AgTech represent greenhouse or controlled-environment approaches that may achieve easier perception and more predictable plant geometry, even when they are not direct substitutes for open-field growers. Dogtooth Technologies and L5 also compete for the budget allocated to automated fruit harvesting. The incumbent alternative remains human pickers supported by conventional carts, supervisors, and packing workflows. DailyRobotics' potential edge is the integration of two-arm harvesting, soft handling, per-berry quality classification, and direct field packing in a mobile service model designed for existing beds. That edge is conditional: a slower robot, a high bruising rate, frequent charging, or expensive field support can erase the value of automation. The decisive metrics are marketable yield per hour, total cost per acre, uptime, and repeatability, not the presence of AI in the product description.

**Defense, security, and resilience dual-use relevance.** DailyRobotics is not a defense contractor, and no public source reviewed here establishes a military customer, security contract, or defense deployment. Its strategic relevance comes through food security, agricultural continuity, and transferable autonomy capabilities. A system that can perceive irregular objects under foliage, plan manipulation in clutter, handle fragile biological material, and operate for long periods in a field is a useful civilian resilience capability in its own right. The same technology family can inform autonomous logistics, remote inspection, disaster-response handling, or supply-chain operations where labor is scarce and human supervision must cover multiple machines. Food production is also a resilience concern: farms exposed to labor shocks, border restrictions, disease events, conflict, or climate volatility benefit from harvesting capacity that is less dependent on a large seasonal workforce. This is a bounded dual-use assessment. The core product credibly serves commercial agriculture and resilience, but it should not be described as tactical autonomy or defense robotics without new evidence. Strategic value would increase if DailyRobotics proves secure fleet management, degraded-connectivity operation, reliable remote supervision, and transferable manipulation across crops or emergency logistics tasks.

**Growth stage, trajectory, and key diligence risks.** DailyRobotics is best classified as early. It has an identifiable product, a real field-robotics problem, public demonstrations, government R&D support, independent sector coverage, and a stated path to a California customer deployment, but it has not publicly demonstrated scaled production, repeat orders, material revenue, or a completed venture round. The upside is a serviceable wedge in a high-value crop: if Q2 can pick quickly without bruising, grade accurately, run a full shift, and be supervised efficiently, the company could expand to additional strawberry regions and eventually other delicate crops. The risks are substantial: perception and grasping may degrade across varieties and farms; weather and dust can reduce uptime; labor economics may change; battery and maintenance logistics may make a fleet expensive; California field access and food-handling requirements add operational complexity; and larger agricultural or robotics companies can copy successful workflows or outspend a small team. Diligence should request season-long field data, customer references, crop-loss and bruising measurements, robot utilization, maintenance hours, per-unit gross margin, battery replacement economics, safety procedures, software update controls, ownership of patents and training data, and evidence that the April 2026 deployment became a paid, repeatable operation. The record merits strategic attention because food-security relevance and hard robotics execution are both meaningful, but the evidence supports a promising early company rather than a proven scaled platform.
"""
