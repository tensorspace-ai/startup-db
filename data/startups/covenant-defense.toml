use_cases = ["Long-range precision strike against fixed military targets", "Distributed or salvo launch concepts intended to stress air defenses", "Maritime or coastal strike missions if an appropriate launch integration is demonstrated", "Deterrence and sovereign deep-strike capability for national armed forces", "Replenishable stand-off munitions for defense stockpile resilience", "Potential industrial cooperation with allied defense manufacturers, subject to export approvals"]
