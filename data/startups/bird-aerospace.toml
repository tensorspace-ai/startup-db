name = "BIRD Aerosystems"
description = "BIRD Aerosystems is an Israeli airborne-defense technology company whose AMPS family protects aircraft from missile threats and whose ASIO family provides integrated airborne ISR and mission management. Ondas Inc. acquired 100% of the company in March 2026, making BIRD an acquired strategic defense asset rather than an independent startup."
detailed_description = """
BIRD Aerosystems develops two complementary product families. Its Airborne Missile Protection Systems (AMPS) combine threat detection, missile-approach confirmation and tracking, and countermeasure functions for aircraft exposed to surface-to-air missiles. The portfolio includes missile-warning and confirmation sensors, directional infrared countermeasures (DIRCM), and related aircraft-protection products such as MACS, SPREOS, and AEROSHIELD. Its Airborne Surveillance, Information and Observation (ASIO) line is an end-to-end special-mission solution that integrates electro-optical and other mission sensors with BIRD's Multi Sensor Integration System and mission-management software. The value proposition is therefore a delivered airborne capability, not a standalone sensor or generic analytics application.

The company sells into programs where platform integration, certification, and lifecycle support are as important as component performance. BIRD describes a turnkey workflow spanning operational analysis, system design, installation, project management, ground and flight testing, certification, logistics, maintenance, repair, and overhaul. That model can reduce the burden on operators that need to retrofit helicopters, fixed-wing aircraft, or special-mission platforms with a qualified system, while creating service and sustainment touchpoints after the initial hardware delivery. It also makes the business engineering-intensive and dependent on platform-specific execution, airworthiness work, and experienced technical personnel.

Public evidence supports a fielded, international customer base but not a fully transparent financial picture. BIRD's own company profile identifies operational use by NATO forces, UN Air Operations, the U.S. Government, Airbus, and other large organizations; those claims should be treated as company disclosures rather than independently audited customer-revenue evidence. Ondas's acquisition announcement provides a newer scale signal, stating that the platform is installed on more than 700 aircraft across more than 40 aircraft types and serves U.S. Army, NATO, Asia-Pacific armed forces, and UN aviation fleets. The company has also publicized ASIO deployments and follow-on orders, but program sizes, margins, backlog quality, and customer concentration remain diligence questions.

BIRD operates in a defensible but crowded aerospace and defense niche. Large primes such as Elbit Systems, Rafael, Collins Aerospace, Saab, Thales, and L3Harris can bundle self-protection, electronic warfare, avionics, sensors, and platform access. BIRD's potential advantage is narrower specialization combined with an ability to integrate and sustain systems across diverse aircraft types. Its confirmation-and-tracking emphasis, claimed low false-alarm performance, installed base, and turnkey certification capability may create switching costs once a system is qualified. Those advantages are difficult to assess fully without contract data, independent test results, and evidence on system availability and lifecycle economics.

The strategic relevance is substantial. Aircraft survivability, border and maritime surveillance, and mission command-and-control directly support defense, homeland-security, and government aviation requirements. The same underlying capabilities can serve civilian or governmental aircraft operating in elevated-threat environments, search-and-rescue, police and border monitoring, and commercial operators requiring specialized surveillance. Nevertheless, defense and security applications are the economic center of gravity, and the March 2026 acquisition by Ondas places BIRD inside a broader public-company strategy involving autonomous systems, counter-UAS, ISR, and airspace defense. The acquisition expands strategic reach but introduces integration, reporting, and portfolio-prioritization risks that did not exist in the same form when BIRD was privately owned.
"""
