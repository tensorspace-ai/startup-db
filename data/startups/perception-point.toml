name = "Perception Point"
description = "Perception Point developed AI-assisted threat prevention for email, browsers, and SaaS collaboration channels. Fortinet completed its acquisition of the company in 2024 and now delivers the capability as part of FortiMail Workspace Security."
detailed_description = """Perception Point built a cloud-native security platform for content-borne threats moving through the modern workspace. Its public product materials describe protection for email, web browsers, cloud storage, and collaboration applications, with coverage for phishing, business email compromise, malware, account takeover, data loss, and other malicious content. The technology combines multiple detection layers with isolation, dynamic analysis, file and URL inspection, image recognition, anti-evasion techniques, and a managed incident-response service. The company also described a hardware-assisted platform that uses CPU tracing and sandbox-style detonation to analyze suspicious content near the point of delivery; those technical claims are best understood as vendor-reported capabilities rather than independently verified performance results.

The customer problem is persistent and economically important: users now exchange sensitive material through Microsoft 365, Google Workspace, browsers, Slack, Teams, and file-sharing services, while attackers use the same channels for impersonation, credential theft, malicious links, weaponized attachments, and data exfiltration. Perception Point’s value proposition was to add API-level or cloud-delivered inspection without forcing a major infrastructure change, then combine automated detection with human review and remediation. Its 2023 company announcement reported protection for more than 2,000 organizations, doubled annual recurring revenue during 2022, and a larger channel partner base. These are company-reported traction signals, not audited financial or customer-retention evidence.

The competitive field includes Proofpoint, Mimecast, Microsoft Defender for Office 365, Abnormal Security, Barracuda, IRONSCALES, Material Security, and native controls from Google. Perception Point’s strongest differentiation was breadth across email, browsers, and collaboration applications plus a managed response layer, rather than ownership of a single dominant security category. Its 2021 Series B announcement reported a $28 million round and $48 million in cumulative funding; no later independent financing should be inferred from the available public record. Detection efficacy, latency, false-positive handling, API permissions, privacy architecture, and the ability to operate alongside incumbent suites remain the practical diligence tests for this category.

Fortinet announced that it completed the acquisition of Perception Point in December 2024, and Fortinet documentation now describes FortiMail Workspace Security as formerly Perception Point. The asset therefore has strategic relevance as technology and product capability inside a large security platform, but it should not be analyzed as an independently investible Series B startup. Its defensive dual-use potential is credible: protecting military suppliers, public-sector offices, critical-infrastructure operators, and other sensitive organizations from phishing, malware delivery, account takeover, and collaboration-channel compromise is technically adjacent to the commercial mission. Public sources reviewed here do not establish classified deployments, government contracts, or defense-specific certifications, so those possibilities remain diligence questions rather than claimed traction."""
