name = "Noma Security"
description = "Noma Security provides an enterprise AI-security and governance platform that discovers AI assets, assesses supply-chain and application risk, tests models and agents, and enforces security, privacy, and compliance policies at runtime. Its focus is the security control plane for LLM applications, RAG systems, autonomous agents, and the tools and data they can reach."
detailed_description = """Noma Security is building a unified control plane for the security of enterprise AI systems. Its public product architecture is organized around discovery, secure, and protect functions: continuous inventory of models, agents, MCP servers, data sources, and dependencies; posture management and contextual risk prioritization; pre-deployment validation and red teaming; and runtime visibility and policy enforcement across prompts, responses, and tool calls. The technical problem is consequential because AI systems combine software supply-chain dependencies, sensitive data access, probabilistic behavior, and increasingly autonomous actions. Traditional application, cloud, and identity controls remain relevant, but they do not by themselves explain an AI system's model, prompt, tool, data, and agent relationships or detect prompt injection, jailbreaks, model poisoning, and unsafe agent behavior in context.

The initial customer problem is enterprise adoption under security and compliance constraints. Security teams need to find shadow AI and understand blast radius; AI and application teams need guardrails that do not stop experimentation; and risk or compliance teams need evidence that controls operate across a changing AI estate. Noma's site describes AI security posture management, AI application security, agentic access control, red teaming, runtime protection, governance and compliance, and MCP-server security. The company also states that it supports more than 80 integrations across data, AI, MLOps, cloud, SaaS-agent, and source-control environments, and reports dozens of enterprise customers and more than one million AI and agent risks identified. Those are company-reported traction and scale signals, not independently audited financial or customer metrics.

The financing and commercialization signals are strong but should be interpreted with discipline. Noma announced a $100 million Series B in July 2025 led by Evolution Equity Partners, with continued participation from Ballistic Ventures and Glilot Capital. Its public newsroom also describes enterprise expansion, channel hiring, industry recognition, and customer references from organizations including UiPath; these references establish market engagement but do not disclose contract value, retention, deployment breadth, or product contribution to security outcomes. The market is competitive and unsettled: specialist vendors address AI application security, model security, prompt and runtime controls, or AI governance, while large security platforms can bundle adjacent capabilities into existing enterprise contracts. Noma's breadth may reduce tooling fragmentation, but it also creates a demanding product surface and requires high-quality integrations, low false-positive rates, and measurable risk reduction to defend platform pricing.

The national-security relevance is credible at the capability level, not yet proven by public defense-sector evidence. Military, intelligence, critical-infrastructure, and public-sector organizations will face the same classes of risk when they deploy models, retrieval systems, agents, and tool-connected workflows: unauthorized data access, untrusted model or tool dependencies, prompt manipulation, excessive autonomy, and weak auditability. Discovery, identity and action controls, adversarial testing, and runtime monitoring are therefore potentially useful in high-assurance environments. However, the public materials reviewed do not establish defense contracts, classified deployments, government certifications, or mission-specific performance. Strategic diligence should consequently focus on deployment isolation, data handling, identity integration, audit evidence, resilience under adversarial load, and the company's ability to meet public-sector procurement and assurance requirements."""
