dual_use_description = "Noma's core capabilities have substantive commercial and security-sector applicability because the underlying control problem is shared: organizations must inventory AI systems, constrain identities and tool access, test adversarial behavior, monitor data flows, and enforce policy while models and agents operate. Commercial buyers can use the platform for shadow-AI discovery, application and supply-chain risk, privacy controls, and agent governance. Defense, intelligence, critical-infrastructure, and public-sector users could apply the same mechanisms to high-assurance AI workflows. The evidence supports technical dual-use adjacency, but not a claim of defense revenue, government contracts, classified deployment, or certification. The strongest diligence questions are whether the product can run in isolated environments, preserve sensitive data boundaries, integrate with government identity and logging systems, and produce assurance evidence under adversarial conditions."
