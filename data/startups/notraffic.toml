name = "NoTraffic"
description = "NoTraffic is an Israeli-founded mobility-infrastructure startup that turns signalized intersections into connected, software-defined systems. Its AI, edge devices, cloud management software, and managed operations help transportation agencies detect road users, adapt signal policies, and improve safety, delay, and network utilization."
detailed_description = """NoTraffic develops an AI-powered mobility platform for traffic agencies and departments of transportation. Its architecture combines intersection edge devices and smart sensors, AI-based detection and classification, a cloud Mobility OS for configuring policies and monitoring networks, a Mobility Store for adding applications, and a 24/7 Operations Center for remote diagnostics and updates. The product is aimed at the difficult last mile between traffic-engineering policy and physical signal controllers: it can use existing intersection infrastructure while adding real-time awareness of vehicles, pedestrians, bicycles, transit, and emergency vehicles. That makes the platform more than a traffic-data dashboard; it is a control and operations layer for signalized networks, subject to agency rules and safety constraints.

The primary customers are public-sector traffic agencies, municipalities, and transportation departments that need measurable improvements without replacing an entire signal network. NoTraffic says its platform is approved and operating in more than 40 U.S. states and Canada, and its March 2026 Series C announcement describes adoption by hundreds of traffic agencies. Public company materials identify deployments or case studies in places including Phoenix, Houston, Oklahoma City, Tucson, Huntsville, Arlington, and British Columbia. These are company-reported traction signals rather than independently audited performance data, but they indicate a product that has moved beyond isolated pilots. The commercial model is likely shaped by public procurement, installation and integration work, recurring software and managed-service revenue, and expansion from core signal optimization into safety, detection, analytics, and other mobility applications.

The market is attractive but operationally demanding. Cities face congestion, safety, emissions, aging controllers, staff shortages, and more variable travel patterns, while traffic programs are purchased through long public-sector cycles and must interoperate with heterogeneous controller, communications, and sensor environments. NoTraffic's stated differentiation is rapid retrofit deployment, sensor and controller compatibility, real-time edge decisions, and a software platform that lets agencies introduce policies or applications without a major civil-works project. Relevant competitors and substitutes include Miovision, Econolite, Iteris, Yunex Traffic, Kapsch TrafficCom, and incumbent adaptive-signal or in-house systems. The durable advantage, if validated, would come less from a single optimization model than from reliable field integration, safety performance, installation repeatability, agency workflow adoption, and a growing deployment and data-feedback base.

NoTraffic's current financing and footprint materially improve the commercialization picture. The company announced a $90 million Series C led by PSG Equity in March 2026, with participation from M&G Investments, Grove Ventures, LifeX Ventures, Meitav Investment House, and Next Gear Ventures. It also opened a U.S. headquarters in Overland Park, Kansas, while maintaining its Tel Aviv location; official materials identify Tal Kreisler, Uriel Katz, and Or Sela as co-founders. The 51-200 employee range remains a reasonable public estimate, although exact headcount and revenue are not independently confirmed here. The central diligence questions are deployment economics, renewal and expansion rates, independently measured safety and delay outcomes, gross margin after hardware and support, controller compatibility at scale, and whether the Mobility Store creates meaningful recurring expansion rather than additional implementation burden.

The defense and national-security case is credible but bounded. Transportation networks are critical infrastructure, and the same capabilities used to prioritize transit or pedestrians can support emergency-response corridors, evacuation management, incident recovery, continuity of logistics, and network monitoring during disasters. Real-time perception and policy-driven control can improve resilience when normal traffic patterns break down. However, public evidence reviewed for this record does not establish military customers, defense contracts, classified workloads, or a dedicated defense product. NoTraffic should therefore be classified as defense-adjacent dual-use infrastructure technology, with strategic relevance arising from allied civil resilience and emergency mobility rather than a claimed defense procurement track."""
