name = "FirstPoint"
description = "FirstPoint Mobile Guard is an Israeli startup developing network-native cellular cybersecurity and IoT connectivity-management software for LTE and 5G environments. Its agentless approach is intended to protect smartphones, SIM/eSIM-connected IoT, vehicles, and mission-critical devices against cellular-layer threats while giving operators policy and visibility at the mobile-core level."
detailed_description = """FirstPoint Mobile Guard develops software that places security and connectivity controls in the cellular network rather than relying on an application installed on each endpoint. Its public product material describes a mobile-core overlay or secured virtual home network that can be connected through standard mobile-network interfaces, with management through a dashboard or SIEM integration. The claimed protection surface includes RF-originated threats and rogue base stations, cellular man-in-the-middle activity, SS7 and Diameter signaling weaknesses, malicious or binary SMS, identity and location exposure, data leakage, and other attacks that can bypass conventional endpoint controls. The company also describes a dedicated SIM/UICC applet and support for ordinary SIMs or eSIMs, although implementation, coverage, and performance should be verified technically with the company.

The commercial proposition has two related motions. For mobile network operators, FirstPoint has marketed cybersecurity-as-a-service and white-label or premium-value-added offerings that can protect selected subscribers without requiring device software or hardware. For enterprises, government bodies, critical infrastructure, and IoT or mobility providers, the same network-level control can support per-device or per-group security policy, managed private cellular connectivity, and more direct ownership of SIMs and connectivity. A 2023 announcement described a pilot private 5G network and IoT connectivity-management deployment at Barzilai Hospital, with the stated goals of protecting medical equipment, segmenting networks, and improving operational efficiency. That is a useful commercialization signal, but it is a pilot announcement rather than evidence of scaled recurring revenue.

The company therefore sits between mobile threat defense, telecom signaling security, private 5G, and IoT connectivity management. Endpoint vendors such as Lookout and Zimperium are relevant substitutes for device-side protection, while telecom-security specialists such as Mobileum and Enea AdaptiveMobile address portions of signaling, messaging, and fraud risk. Private-5G and cellular-core platforms can also compete when a customer prefers to consolidate connectivity and security. FirstPoint's potential edge is the combination of agentless device coverage, SIM/eSIM and secure-element capabilities, network-layer policy, and an ability to serve both public-network and private-network use cases. The tradeoff is integration complexity: the product must interoperate with carrier cores, roaming arrangements, SIM lifecycle systems, lawful-interception boundaries, and enterprise security operations.

Public evidence supports a small but active private company rather than the prior Series A characterization. LinkedIn lists 11–50 employees, a Petah Tikva headquarters, and a 2016 founding date; the Israel Innovation Authority lists 25 employees, initial revenues, and FirstPoint Mobile Guard Ltd. as an enterprise-software and infrastructure company. Public materials identify Dror Fixler as founder and CEO and Adam Weinberg as a technical leader, but they do not establish a current cap table, recurring-revenue scale, customer count, certification profile, or a completed financing round beyond third-party reporting of a 2019 seed round. Current company communications continue to discuss LTE/5G network security, SIM-applet engineering, signaling, private networks, and cellular risks to drones and critical infrastructure. Those signals show domain continuity and product activity, not independently audited traction.

The defense and national-security relevance is credible because military, emergency-response, critical-infrastructure, and drone operations increasingly use commercial or private cellular connectivity that can expose identity, location, command traffic, and availability. FirstPoint's network-level controls could be useful where an organization cannot standardize endpoint agents or needs centralized policy across heterogeneous devices. The capability should not be treated as a replacement for encrypted applications, secure radio, anti-jam systems, or carrier security controls: public sources do not demonstrate fielded defense deployments, measured detection rates, resilience under jamming, or clearance and certification status. Strategic diligence should focus on technical efficacy, deployability with real operators, and whether the company can convert a technically differentiated niche into repeatable revenue."""
