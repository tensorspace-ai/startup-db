name = "Quinix Power"
description = "Quinix Power is an Israeli energy-storage startup developing regenerative fuel-cell systems that use a liquid organic hydrogen carrier to store and release energy without relying on high-pressure hydrogen tanks. Its stated initial applications are long-duration solar storage and backup power for data centers, with a technology thesis rooted in Bar-Ilan University fuel-cell research."
detailed_description = """
**Product and the concrete problem it solves.** Quinix Power is addressing the storage gap between intermittent renewable generation and the long periods when electricity is needed but solar or wind output is unavailable. Conventional lithium-ion batteries are effective for short-duration shifting, but long-duration storage can require large quantities of cells, extensive thermal management, and substantial capital tied to power electronics. Conventional hydrogen systems solve duration through a different set of burdens: hydrogen is commonly compressed to high pressures, liquefied at very low temperatures, or stored through other infrastructure-intensive methods. Quinix’s public thesis is to use a reversible fuel-cell system with a liquid organic hydrogen carrier (LHC), so chemical energy can be stored in a liquid medium and converted back to electricity on demand. A Bar-Ilan University commercialization post says the company is targeting storage durations of more than 20 hours and is developing systems for solar-energy storage and data-center backup. The practical customer problem is therefore not simply producing green hydrogen; it is making long-duration energy storage easier to handle, safer to locate, and more compatible with distributed or stationary infrastructure. The record should remain calibrated: the public evidence demonstrates a company, patent applications, and a university-origin technology narrative, but does not establish a commercial system, field deployment, customer contract, or independently validated round-trip economics.

**Core technology and how it actually works.** Quinix’s published patent applications describe a unified regenerative fuel cell that combines fuel-cell discharge and electrolyzer charging in one hybrid device. In charge mode, electricity drives water splitting at an oxygen electrode, producing oxygen and protons; the protons reduce the oxidized form of a liquid carrier into its hydrogenated form. In discharge mode, the reduced carrier is fed to the fuel side, while oxygen or air is supplied to the other electrode, and the carrier is oxidized as the cell generates electricity and returns the carrier to its oxidized state. The patent names a quinone/hydroquinone redox couple, including anthraquinone derivatives, as a preferred carrier family. This is materially different from a system that stores gaseous hydrogen in a pressurized tank: the hydrogen equivalents are held in a liquid redox medium, and the patent states that the disclosed quinone system produces water as the byproduct during power generation. The oxygen side uses a bifunctional electrocatalyst intended to support both oxygen reduction during discharge and oxygen evolution during charging; the applications identify platinum-, iridium-, and transition-metal-containing aerogel formulations and a proton-exchange membrane architecture. The system also includes separate tanks for oxidized and reduced carrier solutions, pumps, air handling, water management, cooling options, and power electronics. These details are patent disclosures, not proof that every claimed material or configuration is the company’s production design. Diligence must test carrier stability, catalyst cost and durability, membrane life, crossover, pumps, heat rejection, water balance, charge efficiency, and the ability to control a stack reliably over thousands of cycles.

**Market, customers, and go-to-market.** Quinix’s public commercialization signal is focused and plausible: long-duration renewable storage and backup power for data centers. A solar-plus-storage operator could use the system to move renewable energy across night-time periods or multi-day weather events, while a data-center operator could use a non-lithium backup architecture to supplement or replace diesel generation where runtime, emissions, safety, and fuel logistics matter. The same system could be relevant to microgrids, telecom sites, hospitals, water utilities, industrial facilities, and remote infrastructure, but those are analytical extensions rather than disclosed customers. Quinix’s route to market will likely require a development partner able to host a pilot, an engineering organization able to integrate balance-of-plant equipment, and a financing or infrastructure partner able to underwrite long-duration assets. The company is not publicly presenting a mass-market appliance; it is pursuing a capital-intensive energy system whose buyers will demand performance warranties, safety evidence, service plans, fuel-carrier logistics, and bankable degradation data. The public record does not identify a named customer, paid pilot, revenue figure, purchase order, utility interconnection, or manufacturing partner. It does, however, identify data centers and solar storage as target applications through a Bar-Ilan University source and places Quinix in Israeli business directories under fuel cells and renewable energy. The most credible initial go-to-market hypothesis is a controlled demonstration with a data-center, renewable-energy, or research-infrastructure partner, followed by modular installations where long duration and safe liquid handling outweigh the simplicity of lithium-ion.

**Traction, funding, and third-party validation.** The company has stronger technical and institutional evidence than commercial disclosure. Quinix Power Ltd is listed as an active Israeli private company incorporated on February 28, 2024, with an address in Nahalal. Dun’sGuide classifies it under electricity and electronics, energy, water, fuel cells, startups, and renewable energy. A Bar-Ilan Institute for Nanotechnology and Advanced Materials post identifies Quinix as a venture emerging from fuel-cell and hydrogen-technology research and says the startup has completed two successful funding rounds, with a third underway; the amounts and investor names are not disclosed in that source. The most concrete intellectual-property signal is a pair of PCT applications published on March 5, 2026. WO2026047670A1 and WO2026047671A1 list Quinix Power as assignee and identify Lior Elbaz, Yan Presman, and additional technical contributors among the inventors. The applications have a priority date of August 30, 2024 and are shown as pending; a pending application is evidence of an IP filing, not an issued patent or a proven freedom-to-operate position. Bar-Ilan’s BINA post additionally says the underlying work demonstrated performance, stability, and cost advantages relative to methanol fuel cells, but that is a university/company account rather than an independent field benchmark. No public source reviewed establishes stack power, energy capacity, round-trip efficiency, lifetime, safety certification, pilot scale, revenue, valuation, or customer adoption. The correct stage reading is funded technical commercialization, not validated energy-infrastructure scale.

**Founders and team background.** Quinix’s founders appear to be closely connected to the underlying academic work. The Bar-Ilan BINA source identifies Dr. Yan Presman as head of the development team and says he co-founded the venture with his PhD supervisor, Prof. Lior Elbaz, who is identified as the company’s CTO. The public patent record names both as inventors, alongside Bar Gavriel, Daniel Gryko, Damian Kusy, and Yair Haim Wijsboom on one or both applications. Lior Elbaz’s public professional profile connects him to Quinix Power, Bar-Ilan University, hydrogen technologies, electrocatalysis, and prior work with the Israeli Ministry of Energy and the International Energy Agency; the record does not establish his exact current executive scope beyond the BINA description. Yan Presman’s public profile connects him to Quinix and to electrochemistry, fuel-cell, and hydrogen-related research. Yair Wijsboom’s profile identifies Quinix work and a background in electrocatalysis, conductive polymers, and materials research. This is a credible founder and inventor profile for a chemistry-led energy startup because the technical problem spans redox chemistry, electrode catalysis, membranes, and system integration rather than only software. The team’s weakness is equally clear: there is no public headcount, complete organization chart, detailed manufacturing leadership, commercial energy-development bench, or disclosed safety and regulatory team. The company must convert academic depth into repeatable cells, stacks, controls, service procedures, and commercial partnerships. The key diligence question is not whether the founders understand the chemistry; public evidence supports that proposition. It is whether they can build a dependable energy product with bankable lifecycle data and an operating model acceptable to infrastructure buyers.

**Competitive dynamics.** Quinix competes with several technical architectures and with incumbent energy-conversion vendors. **Electriq Global** and other liquid-organic-hydrogen-carrier companies compete for customers seeking hydrogen logistics without compressed-gas dependence, although many use separate hydrogen-release and fuel-cell steps rather than Quinix’s unified cell concept. **GenCell** sells alkaline fuel-cell systems for backup and off-grid power, including critical infrastructure and telecom applications, giving it a relevant Israeli comparison with more visible product and deployment history. **Elcogen** develops solid-oxide fuel cells and electrolyzers, competing for efficient stationary power and hydrogen-system budgets through a different high-temperature architecture. **H2Pro** competes for clean-hydrogen and long-duration energy infrastructure through decoupled water electrolysis, although it is not a direct substitute for Quinix’s discharge system. **Invinity Energy Systems** represents the vanadium-flow approach, where liquid electrolytes and separately sized power and energy components target long-duration stationary storage. **Form Energy** represents iron-air multi-day storage, while lithium-ion systems from **CATL, Tesla, and Fluence** remain the commercial default for many storage projects because of manufacturing scale, financing familiarity, and operating history. Quinix’s potential edge is the combination of a liquid, non-high-pressure carrier, a single regenerative fuel-cell/electrolyzer device, and a chemistry that can potentially support long duration with modular tanks. Its moat is not yet established. Buyers will compare delivered cost per useful kilowatt-hour, round-trip efficiency, carrier replacement or regeneration, response time, footprint, water needs, safety case, degradation, and service burden rather than patent novelty alone. The central competitive risk is that a technically elegant cell remains too expensive, too slow to scale, or too difficult to maintain compared with established batteries and separate hydrogen systems.

**Defense, security, and resilience dual-use relevance.** Quinix qualifies as dual-use through energy resilience and strategic infrastructure, not because public evidence shows a fielded military product. A liquid-carrier regenerative fuel cell could provide long-duration backup to data centers, communications facilities, hospitals, water-treatment plants, emergency shelters, microgrids, and defense installations where diesel deliveries are vulnerable or lithium-ion fire considerations are material. A carrier that can be transported and stored in ordinary liquid containers, as described by the university source and patent context, could reduce the handling burden associated with high-pressure hydrogen, although chemical compatibility, spill response, transport classification, and total logistics have not been independently established. The technology could also support remote surveillance, border infrastructure, naval or expeditionary support equipment, and resilient charging or power hubs if future systems meet weight, vibration, temperature, acoustic, and maintainability requirements. The strategic case is strongest at fixed or semi-fixed sites that need many hours of autonomy and can accommodate tanks, pumps, air handling, and power electronics. The company’s founders’ connection to Bar-Ilan hydrogen research and Israeli energy institutions improves ecosystem relevance, but it is not evidence of defense procurement. No public source reviewed confirms an IDF contract, allied-government trial, military qualification, export authorization, hardened enclosure, cybersecure controller, or operation in contested conditions. The record should therefore treat Quinix as a promising energy-resilience enabler with a credible defense-adjacent transfer path. A defense diligence program would need to validate safe storage, low-maintenance operation, black-start behavior, islanding, electromagnetic compatibility, thermal and acoustic signatures, fuel-carrier replenishment, and operation through heat, dust, vibration, shock, and disrupted supply chains.

**Growth stage, trajectory, and key diligence risks.** Quinix is best classified as early-stage. Its legal entity was incorporated in 2024, its public identity is closely tied to university-origin research, its public patent applications were only published in 2026, and the company’s disclosed team and financing remain limited. The reported completion of two funding rounds and the pursuit of a third are meaningful formation signals, but undisclosed amounts and investors make runway and capitalization impossible to assess. The upside trajectory is clear enough to monitor: prove a stable carrier and bifunctional catalyst, build a repeatable stack, demonstrate more-than-20-hour storage at useful power, and win a pilot with a data-center or renewable-energy operator. The most important risks are (1) **technology scale-up**, because laboratory electrochemistry may not translate into a durable, manufacturable stack; (2) **efficiency and lifetime**, since catalyst loading, membrane degradation, carrier crossover, pumps, and balance-of-plant losses can erase the long-duration economic thesis; (3) **materials and safety**, including corrosion, chemical handling, water management, oxygen evolution, and transport rules for the chosen carrier; (4) **capital intensity**, because pilots and certification require much more money than an academic prototype; (5) **market adoption**, because utilities and data centers demand warranties, service capacity, and bankability; (6) **competitive substitution**, since batteries, flow systems, separate hydrogen systems, and diesel hybrids continue to improve; and (7) **IP and execution disclosure**, because pending applications do not establish granted protection, exclusivity, or freedom to operate. Quinix merits strategic tracking, but the next decision-quality evidence is a third-party measured stack, a named pilot, a disclosed power-and-duration specification, a safety case, a lifecycle cost model, and proof that the company can move from Bar-Ilan research into repeatable infrastructure deployment.
"""
