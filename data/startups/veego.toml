name = "Veego"
description = "Veego was an Israeli software startup that built AI-driven connected-home quality-of-experience, device visibility, and autonomous support tools for internet service providers. Public company databases report that Veego ceased operating in Q4 2025, so this record is a historical technology and strategic reference rather than an active investment candidate."
detailed_description = """Veego developed software for internet service providers and other connected-home operators. Its platform observed devices and services behind a home gateway, classified activity, measured contextual quality of experience (QoE), and surfaced the likely cause of a degraded session. The product family described in public materials included an agent deployed in or around the home router, cloud analytics, operator dashboards, APIs, and customer-care workflows. The important technical proposition was not generic IoT monitoring: Veego attempted to understand whether a particular user session, device, or application was actually working well and to connect that experience to network and device conditions.

The commercial buyer was primarily a broadband or communications service provider. Veego positioned the resulting visibility for several operational outcomes: fewer avoidable support calls, shorter calls when they occurred, fewer truck rolls, fewer unnecessary hardware replacements, subscriber self-care, and better onboarding of devices and services. Its disclosed target markets also included smart-hub operators, IoT device manufacturers, and support organizations. This is a B2B infrastructure and operations product with a difficult sales motion: value depends on access to large device fleets, integration with routers and OSS/BSS or care systems, privacy-compliant telemetry, and enough deployment volume for the operator to see measurable service and cost improvements.

Veego's technical differentiation was the combination of device and application identification, session-level or contextual QoE scoring, anomaly and malfunction detection, root-cause assessment, and automated or recommended remediation. That combination is more specific than a conventional AIOps dashboard, but it does not eliminate substantial competitive pressure. Broadband analytics, network-performance monitoring, customer-care automation, connected-home platforms, and large observability vendors can each cover part of the workflow. Relevant substitutes include Sandvine, NETSCOUT, Infovista, Cisco, Juniper, and operator-built telemetry and care tooling; specialist connected-home and IoT reliability vendors such as SecuriThings are closer conceptual comparators. Veego's potential moat would have depended on proprietary telemetry, device and service fingerprints, integrations, and measurable operator outcomes rather than on machine learning alone.

Public records support a 2018 founding date, Ramat Gan headquarters, a private-company profile, and a Series A round reported in 2021. LinkedIn and IVC describe a team in the tens rather than the previously recorded 51-200 range; IVC lists 45 employees and LinkedIn lists 11-50. These are historical operating indicators, not evidence of a current workforce. Startup Nation Central and IVC both report that the company ceased operating in Q4 2025, despite the official domain remaining reachable and retaining older product material. The appropriate current interpretation is therefore a wound-down startup with a technically credible historical product, not an active Series A company with current traction.

The defense and national-security case is conditional. The underlying capabilities—distributed telemetry, anomaly detection, service-health scoring, and bounded remediation—could support resilient communications, remote sensor networks, edge gateways, or other networked systems where operators need early fault detection. However, public evidence identifies commercial connected-home and ISP use, not defense customers, classified deployments, military contracts, or security-specific product requirements. Dual-use should therefore be retained as a measured technology adjacency, while strategic and investment scores are reduced because the company is reported wound down and no current operating platform or team has been verified."""
