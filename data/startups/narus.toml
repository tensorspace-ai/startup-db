name = "Narus"
description = "Narus was a U.S.-based, Israeli-founded network-intelligence and cybersecurity software company that analyzed high-volume IP traffic in real time for telecommunications, enterprise security, and government customers. Boeing acquired it in 2010; in 2015 Boeing licensed Narus technology to Symantec and transferred roughly 65 staff, so Narus is best treated as an acquired asset rather than an independent current startup."
detailed_description = """Narus developed carrier-scale network intelligence software, including the NarusInsight Semantic Traffic Analyzer and later nSystem products. The core capability was high-throughput inspection and classification of IP traffic: collecting packet and flow metadata, recognizing protocols and applications, correlating events across a network, and presenting operational or security findings to an analyst. That combination mattered because ordinary firewalls and router counters could not provide the same application-level visibility across a large backbone. Public descriptions support a real-time analytics and cyber-defense product thesis; they do not justify assuming that every advertised capability remained effective against modern encryption or that Narus itself still operates as a standalone product company.

The customer problem was unusually demanding. Carriers needed to understand congestion, service quality, abuse, and traffic composition at very large network junctions, while government and law-enforcement users sought lawful-intercept and communications-analysis capabilities. Public reporting and court-related material linked Narus equipment to AT&T's Room 641A controversy and described the STA 6400 as capable of inspecting backbone traffic. Those reports establish the technology's surveillance sensitivity and public visibility, but they are not proof of an independently verified Narus contract with every agency sometimes named in secondary summaries. The responsible diligence posture is therefore to distinguish documented product capability and reported deployments from unverified claims about specific customers or intelligence programs.

Narus's commercial trajectory is clearer than its later product fate. Boeing announced completion of the acquisition on July 29, 2010, describing Narus as a provider of real-time network-traffic and analytics software used against cyber attacks and persistent threats on large IP networks. By January 2015, Boeing was withdrawing from the commercial cybersecurity effort: Symantec agreed to hire approximately 65 Narus engineers and technical staff and to license related intellectual property, while Boeing retained Narus IP and continued defense and government cybersecurity activities. This is evidence of meaningful technical talent and strategic interest, but also evidence that the hoped-for commercial market did not develop as expected. Subsequent independent Narus revenue, headcount, product support, and ownership are not sufficiently clear in current public sources.

Strategically, Narus is a useful historical dual-use case study rather than a live venture opportunity. Its technology sat at the intersection of telecom infrastructure, cyber defense, lawful intercept, and signals intelligence, giving it genuine national-security relevance and a credible commercial adjacency. The same position creates profound privacy, civil-liberties, export-control, and reputational exposure. Modern substitutes now include network-detection-and-response platforms, carrier probes, lawful-intercept vendors, cloud telemetry systems, and large-scale intelligence-fusion platforms. The key lesson for strategic readers is not that legacy DPI automatically retains an edge; it is that trusted access to high-volume network telemetry, performant analytics, and defensible governance can create acquisition value, while encryption, platform consolidation, and public controversy can erode it."""
