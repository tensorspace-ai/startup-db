name = "TrapX Security"
description = "TrapX Security developed DeceptionGrid, a cyber-deception platform that used realistic decoys, threat sensors, and lures to expose reconnaissance, credential abuse, lateral movement, and malware activity. Commvault acquired TrapX in 2022 and incorporated the technology into its ThreatWise cyber-resilience offering, so this record represents an acquired security asset rather than an independent current startup."
detailed_description = """TrapX built a commercial cyber-deception system around the idea that an interaction with a carefully placed false asset is a much stronger detection signal than a generic anomaly. Its DeceptionGrid product used decoys, emulated services, credentials, and other deceptive resources to make production environments appear larger and more realistic to an intruder. A touch, login attempt, scan, or lateral-movement action against one of those assets could generate a high-confidence alert and provide evidence about the attacker’s path and techniques. This is complementary to endpoint, network, identity, SIEM, and recovery controls; it is not a replacement for them.

The target market was security-conscious enterprise and public-sector organizations that needed earlier warning of stealthy intrusions, insider activity, advanced persistent threats, or ransomware staging. The practical value proposition was operational: deception can reduce alert fatigue because legitimate users should not normally access the decoys, while centralized orchestration reduces the labor required to deploy and maintain a distributed deceptive environment. The public record supports capabilities such as lightweight threat sensors, adaptive or preconfigured asset emulation, lures or honeytokens, and integrations with security workflows. It does not, by itself, establish a particular customer list, revenue level, deployment scale, or government contract.

Commvault’s acquisition provides the clearest commercialization signal and the most important current-status fact. Commvault disclosed that it completed the acquisition of 100% of TrapX on January 31, 2022, and its public product material says the acquired technology became part of ThreatWise. Current ThreatWise pages describe decoys that mimic IT, OT, network, and backup assets, with early-warning detection for reconnaissance, lateral movement, ransomware, exfiltration, and unwanted privileged access. This demonstrates continuing productization inside a larger cyber-resilience platform, but it should not be read as evidence that TrapX remains a separately investible company or that every current ThreatWise feature was developed by the former TrapX team.

The competitive field includes deception specialists such as Attivo Networks, Illusive Networks, Acalvio, CounterCraft, and Thinkst, as well as broader security platforms that can provide honeypots, canary files, identity deception, or behavioral detection. TrapX’s historical edge was the combination of high-fidelity decoys, automated deployment, and threat intelligence in a single deception-oriented system. Its later strategic value came from pairing early detection and attacker diversion with Commvault’s data-protection and recovery workflows. The limitation is that deception is a specialist control: buyers must maintain believable assets, place them where attackers will encounter them, and connect alerts to a response process.

For defense and national-security users, the dual-use case is credible but defensive. Deceptive hosts, credentials, services, and network paths can help protect mission systems, sensitive enterprise networks, critical infrastructure, and operational technology while revealing attacker tradecraft. They can also support threat hunting and purple-team validation. However, public sources do not establish classified deployments or military contracts, and government adoption would require careful authorization, segmentation, data handling, and rules-of-engagement review. The record therefore treats TrapX as strategically relevant acquired cyber-defense IP, with evidence of ongoing commercial integration but limited public evidence about the former standalone company’s present workforce or independent economics."""
