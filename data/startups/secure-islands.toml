name = "Secure Islands"
description = "Secure Islands Technologies was an Israeli information-protection company whose IQProtector platform classified and protected unstructured data at creation or first access. Microsoft acquired the company in 2015 and integrated its technology into Azure Information Protection, the lineage that later became Microsoft Purview Information Protection."
detailed_description = """Secure Islands developed IQProtector around a persistent data-protection model: inspect files and email as they are created or enter an organization, classify them using content and context, and attach policy-driven labels, metadata, encryption, and usage rights. The product was aimed at unstructured information rather than only network traffic or a fixed repository. Historical product material describes support for many file types, content and pattern rules, identity and location context, SharePoint interception, mobile access, auditing, and integration with Microsoft Rights Management. The important architectural idea was to make protection travel with the information instead of relying solely on perimeter controls or a later DLP decision at an egress point.

The commercial problem was significant but difficult: enterprises need to share documents and messages with employees, partners, and customers while retaining control after data leaves a primary network. Classification quality, policy administration, identity assurance, application support, and user experience all determine whether persistent protection works in practice. Secure Islands sold into regulated and information-intensive sectors, and Microsoft stated at the acquisition announcement that customers including UBS, OSRAM, Vodafone, and Credit Suisse used the technology. Those customer references are evidence of commercial traction at the time, but they do not establish current standalone revenue, retention, or independent operations.

Microsoft announced an agreement to acquire Secure Islands in November 2015 and reported completion in December 2015. Microsoft said the technology would be integrated with Azure Rights Management and used to extend protection across on-premises systems, Microsoft cloud services, third-party services, and devices. Current Microsoft documentation describes the successor information-protection capability as a framework for discovering, classifying, labeling, encrypting, and governing sensitive data across Microsoft 365, Azure, on-premises file shares, endpoints, and non-Microsoft cloud applications. This is strong evidence that the product concepts were commercially validated and absorbed into a large platform, but it is not evidence that Secure Islands remains a separate investible company.

The dual-use case is credible at the capability level. Persistent classification, encryption, access control, and auditability are relevant to defense contractors handling controlled unclassified information, government agencies protecting sensitive records, and organizations compartmentalizing operational or intelligence data. The technology does not itself provide a military sensor, cyber-operations capability, or classified accreditation; defense suitability would depend on deployment architecture, approved cryptography, identity controls, disconnected or sovereign environments, classification taxonomies, and authorization by the relevant customer. Its strategic significance for this database is therefore as an acquired Israeli data-security capability and an example of information-centric protection, not as a current defense supplier."""
