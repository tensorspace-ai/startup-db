  "2014 Credit Suisse NEXT investment: Calcalist and Globes report USD 12 million, while the historical LinkedIn funding feed displays USD 10 million. Secure Islands' own release says terms were not disclosed. The amount is omitted and both published amount observations are preserved. Sources: calcalist_2014, globes_2015, linkedin_profile, secureislands_release_2014.",
  "Lifetime funding: TechCrunch reported USD 11.1 million to date; Globes cited an IVC total of USD 20 million; Calcalist said prior funding was no more than USD 5 million before its reported USD 12 million 2014 round. Scope and source data do not reconcile, so no lifetime total is entered. Sources: techcrunch_2015, globes_2015, calcalist_2014.",
  "Microsoft purchase price: Microsoft did not disclose consideration. Pre-close media estimates varied, including a USD 100-150 million range in Globes and USD 77-150 million in TechCrunch. The ownership deal is recorded as undisclosed and none of the estimates is treated as a verified amount. Sources: microsoft_acquisition, globes_2015, techcrunch_2015.",
  "Founding date: Globes and Walla describe the brothers as co-founders in 2005; registry-derived data gives legal incorporation on 2006-11-08, and company profiles use 2006. The record distinguishes founding activity from legal incorporation and retains 2006 as the founded year. Sources: globes_seed, walla_seed, obudget_registry, linkedin_profile."
]
diligence_questions = [
  "Can Microsoft or a public filing establish whether the 2014 Credit Suisse NEXT investment was USD 10 million or USD 12 million and reconcile the conflicting lifetime funding totals?",
  "Which IQProtector patents, source code, and policy-management components were transferred to Microsoft, and what is the current assignment and licensing status of the relevant patent families?",
  "What deployment scope, contract duration, renewal rate, and revenue contribution sat behind the UBS, OSRAM, Vodafone, and Credit Suisse references, and which capabilities were carried into Azure Information Protection?",
  "Could the historical product operate with customer-controlled keys, disconnected networks, and non-Microsoft identity systems at the assurance levels required by a government or defense contractor?",
  "What was the exact transaction consideration and structure for Microsoft's completed acquisition, given the wide unverified media estimates?"
]
