name = "Secure Islands"
description = "Secure Islands Technologies Ltd. was an Israeli enterprise information-protection company founded by brothers Aki and Yuval Eldar. Its IQProtector software classified unstructured data and embedded Microsoft RMS-based encryption and usage controls. Microsoft completed its acquisition in December 2015; the Israeli legal entity was later dissolved through a merger."
detailed_description = """Secure Islands built IQProtector for enterprises that needed to keep control of documents after those documents moved beyond a network boundary. Its workflow intercepted files as they were created or entered an organization, classified them using policy and signals such as content, source, data type, and usage, and applied encryption and rights rules to the file. Historical product material describes agents and interceptors across endpoints, Exchange, SharePoint, cloud applications, and repositories, with a central policy and audit layer. The design goal was to make controls travel with the information instead of relying only on a firewall, storage boundary, or DLP decision made when a file was sent out.

This was a concrete enterprise security problem. Financial, manufacturing, telecom, and other regulated companies exchange sensitive information with customers, suppliers, and business partners. Persistent rights management can reduce exposure when a protected file is copied or forwarded to an unauthorized recipient, and it can give security teams a record of access. It does not make the content invulnerable: authorized users may copy or photograph information, compromised identities can exercise valid rights, unprotected exports can escape controls, and application coverage, key custody, policy design, and user friction determine whether the protection works. Contemporary analyst material also noted the product's strong reliance on Microsoft Rights Management and the value of wider directory support. Product claims about broad file coverage and low integration effort should be treated as vendor claims, not independently measured performance.

The commercial evidence is meaningful but bounded. In a 2015 interview, CEO and co-founder Aki Eldar said Credit Suisse was the company's first international customer in 2010. At the acquisition announcement, Microsoft named Credit Suisse, UBS, OSRAM, and Vodafone as customers that used Secure Islands to protect information through its lifecycle. Those named references support that the product reached large enterprises, but neither source reports contract values, number of installations, renewal rates, or how much of each customer's environment was covered. Calcalist reported that the company had funded much of its pre-2014 operation through product sales, but did not disclose revenue or profitability. The investment and customer evidence therefore validates a real product and a recognized enterprise need without establishing standalone financial scale.

Secure Islands was founded by brothers Aki Eldar and Yuval Eldar. Aki was CEO and had prior information-security and international sales experience, including a sales leadership role at Bynet. Yuval led technology and had managed R&D at Check Point and Britannica Knowledge Systems. The company started through the Van Leer / Chief Scientist incubator channel, later attracted Shlomo Kramer and other private investors, and received a Credit Suisse NEXT investment after Credit Suisse had become a customer. This founder-market fit, early customer access, and strategic investor/customer overlap are positive historical signals. Public sources do not provide a complete management roster, hiring timeline, or reliable headcount at the time of sale.

Microsoft announced an agreement on November 9, 2015 and stated that it completed the acquisition on December 11, 2015. It said Secure Islands' technology would be integrated into Azure Rights Management Service and described a product direction spanning on-premises systems, Microsoft cloud services, third-party services, and Windows, iOS, and Android devices. Later Microsoft migration material discusses converting files carrying Secure Islands IQProtector labels to Azure Information Protection. Current Microsoft Purview documentation covers discovery, classification, sensitivity labels, encryption, rights management, and data-loss prevention. This supports a Microsoft product-line transition and overlap in capability; current Microsoft documentation does not itemize which Secure Islands components remain in each present-day feature. The Israeli company record identifies Secure Islands Technologies Ltd. and says it was dissolved through a merger. There is no evidence of a separate operating company or equity security today.

Funding history is incomplete. A 2006 report gives a $1.1 million first financing round involving Van Leer Ventures Jerusalem and the Chief Scientist's incubator program. The later Credit Suisse NEXT investment is reported as $12 million by Calcalist and in a 2015 Globes article, while a historical LinkedIn company profile displays $10 million and Secure Islands' own announcement did not disclose its terms. I therefore retain both reported observations and leave that round's numeric amount unset. Public reports also disagree about lifetime capital raised, and no company-announced lifetime total was found. Microsoft's purchase price was not disclosed by Microsoft; media reports published a wide range of estimates. The acquisition price is not treated as funding or as a verified transaction amount.

For present-day comparison, the closest documented product category is enterprise data classification coupled with protection. Fortra now groups the former Titus and Boldon James product lines under Data Classification. Microsoft Purview is the current Microsoft-branded adjacent platform and the successor context for historical Azure Information Protection. Secure Islands' historical differentiator was the combination of interception at creation or ingress, policy-driven classification, and persistent RMS usage rights in supported files. Its strategic tradeoff was deep dependence on Microsoft RMS and enterprise identity and application integrations. Because Secure Islands no longer sells independently, there is no fair current pricing, performance, or roadmap comparison to make against these products.

The record is strategically relevant as an Israeli data-security acquisition and as an example of information-centric controls complementing network and endpoint defenses. Its capabilities could be applied by commercial organizations, government agencies, or defense contractors to sensitive unclassified information. Public evidence reviewed here does not establish a military customer, defense contract, classified deployment, security accreditation, or suitability for disconnected sovereign environments. Those uses would require verification of cryptography, key custody, offline behavior, approved identity systems, data taxonomies, application coverage, and relevant customer authorizations. The company is therefore an acquired technology lineage, not a current defense supplier or investment target."""
