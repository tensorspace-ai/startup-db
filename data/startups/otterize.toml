name = "Otterize"
description = "Otterize is a cloud-native security company that automated workload identity, service-to-service authorization, and least-privilege policy enforcement for Kubernetes environments. Cyera announced its acquisition of Otterize in June 2025, so this record now describes an acquired product and technology asset rather than an independent investment target."
detailed_description = """Otterize built an intent-based access-control platform for the non-human identities that connect microservices, databases, Kafka clusters, cloud APIs, and other infrastructure. Its open-source Kubernetes components included a network mapper, an intents operator, and a credentials operator. The mapper observes service communication and produces an access graph; developers or security teams express intended access in ClientIntents; and the operators translate those declarations into existing controls such as Kubernetes NetworkPolicy, Istio authorization policy, Kafka ACLs, PostgreSQL grants, AWS IAM roles, and mTLS credentials. This is materially different from a static IP allowlist: policy is tied to workload and service identity in an environment where pods, addresses, and deployments change frequently.

The commercial problem is operational as much as technical. Kubernetes teams often know that broad permissions and undocumented east-west traffic create lateral-movement risk, but manually discovering dependencies and maintaining narrowly scoped policies can break production systems or consume scarce platform-engineering time. Otterize’s combination of runtime visibility, declarative policy, just-in-time credential provisioning, and GitHub/GitOps workflows was designed to shorten that feedback loop. Its optional Otterize Cloud added visibility and operational insight on top of the OSS deployment, while the documentation states that the core components could run without the cloud service. Public documentation also describes visibility into pod traffic, Internet egress, Kafka topics, PostgreSQL tables, AWS resources, and Istio HTTP context, giving the product a broader workload-IAM surface than a single Kubernetes network-policy generator.

The market is crowded and increasingly consolidated. Relevant substitutes include Cilium and Isovalent for eBPF networking and policy, cloud-provider IAM and Kubernetes RBAC, service-mesh authorization, SPIFFE/SPIRE deployments, and larger CNAPP platforms such as Palo Alto Networks Prisma Cloud, Wiz, Aqua Security, and Sysdig. Otterize’s defensible angle was workflow and abstraction: it connected observed behavior to a developer-readable intent model and then configured controls already present in the customer environment. That can reduce adoption friction, but it also leaves the company dependent on integrations, Kubernetes and cloud API compatibility, and the customer’s willingness to treat observed traffic as a reliable starting point for least privilege. Public evidence confirms open-source repositories, a cloud beta, an $11.5 million seed financing, and an acquisition, but does not establish revenue, deployment scale, retention, or independent production traction.

Cyera announced the acquisition on June 26, 2025, describing Otterize as a platform for securing cloud-native non-human identities and data flows and specifically citing eBPF agents, data lineage, DSPM, and AI-security relevance. The announcement gives a credible commercialization and strategic signal, but its reported transaction value was only an estimate and should not be treated as a verified valuation. The acquisition also changes the diligence question: the technology remains relevant, yet product roadmap, support, licensing, community governance, and customer access are now controlled by Cyera. For defense and national-security applications, the core capability is substantively dual-use because military, intelligence, and critical-infrastructure software increasingly uses containers and cloud-native service architectures. The evidence supports architectural applicability, not proof of classified deployments, government contracts, accreditation, or defense-specific productization."""
