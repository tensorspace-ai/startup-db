dual_use_description = "SCD's infrared detector technology has substantive dual-use applicability. On the defense side, IR detectors are foundational for missile guidance, targeting, surveillance, and electronic warfare systems across surface-to-air, air-to-surface, and anti-ship platforms; they are integral to force-protection and long-range precision-strike capabilities. On the commercial side, infrared focal plane arrays enable thermal imaging products for industrial process control, building diagnostics, perimeter security, medical thermal imaging, and emerging autonomous-vehicle sensing. However, SCD itself is primarily a defense-integrated component supplier; the company does not dominate commercial thermal imaging (where low-cost uncooled cameras from Asian competitors hold significant share) but rather occupies a specialized niche serving high-reliability, high-performance, and defense-adjacent applications. The dual-use score of 70 reflects significant dual-use potential in the underlying technology (infrared detection) tempered by SCD's actual market position as a defense-focused specialist. The company's contribution to dual-use value is strongest through technology development and export of know-how; any direct commercial product lines have not been disclosed to significantly move corporate revenue or identity. The restricted-export posture also limits SCD's ability to serve emerging markets, reducing the practical dual-use upside to authorized allied nations and Israel."
