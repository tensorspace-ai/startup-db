name = "Commtact"
description = "Israeli tactical communications company designing and manufacturing software-defined radio and secure data-link systems for aerial, maritime, land and munition platforms."
detailed_description = """
Commtact Ltd. is an Israeli developer and manufacturer of tactical wireless communications equipment. Its official site presents the business as an end-to-end supplier of software-defined radio (SDR) data links and related base-station modules for aerial, maritime, land and munition platforms. The company is based at Nahal Snir 10 in Yavne. A current Israeli company-information profile identifies the legal name as COMMTACT LTD, company number 513510875, Israeli private-company status, active status, and incorporation on 12 February 2004. That date supersedes the older 2006 founding value in the record; incorporation does not necessarily equal the start of predecessor operations.

The product range includes LOS and BLOS links, point-to-point and relay topologies, handheld and vehicle/base modules, antennas, and named Phoenix and MDLS families. The 2026 Maxi Phoenix launch is the clearest recent product milestone: Commtact says it supports secure broadband links beyond 200 km and announced its first multi-million-dollar contract for that product with an unnamed Tier-1 defense customer. The exact contract value, delivery schedule, contract duration, customer identity, backlog conversion and revenue recognition have not been disclosed. This is meaningful evidence of a commercial order, but it is not a basis for estimating annual revenue or total addressable market.

The company describes its technology as including in-house RF, FPGA, algorithm and system engineering; GMSK and OFDM modes; AES-256 encryption; cryptographic authentication; direct-sequence spread spectrum; frequency hopping; and automatic channel sensing/evasion. Those details are company claims rather than independently tested performance evidence. Public material also describes system integration with unmanned aircraft, surface vessels, ground vehicles, guided weapons and loitering munitions. Such product scope creates a technical proposition around system integration, platform qualification, ruggedization and lifecycle support in addition to radio hardware. Customer substitution can be difficult after qualification, although the public evidence does not establish switching costs or deployed fleet quantities.

The official leadership page lists Guy Eshel as CEO, Alik Shimelmits as VP R&D, Nitsan Shachor as CFO, Guy Avrahami as VP Sales & Marketing, Niv Tamir as COO, Noa Fromovich as VP HR, and Assaf Jakoby as CTO. The company describes hires in 2022–2025 and relevant backgrounds at Elbit Systems, Aeronautics, Gilat Satellite Networks, Allot, IAI and other technology/defense organizations. IVC lists Shahar Kravitz as founder; older material lists Ariel Kandel as CEO, while the current company page describes Guy Eshel in that role. Public biographies support a technically and commercially experienced management roster, but do not establish staff retention, board composition, founder involvement or key-person succession arrangements. A July 2026 company-profile feature reports more than 80 employees and approximately half in R&D; this is a dated company-reported figure and not an audited headcount.

Commtact's public footprint is now active at commtact-systems.com, contrary to the prior parked-domain note. Aeronautics' own corporate history states that it acquired Commtact in 2002. IVC also identifies Commtact as a subsidiary of Aeronautics Defense Systems Ltd. Aeronautics' history says Rafael and entrepreneur Avichai Stolero acquired Aeronautics in 2019. This supports group affiliation, but available public pages do not give Commtact's current shareholder register, ownership percentages, or a definitive statement of ultimate control as of this review. Treat the subsidiary chain as a reported group relationship and request current corporate registry extracts and group structure documents.

Funding visibility remains poor. Dealroom reports no known external funding. IVC shows a June 2019 R&D grant entry but exposes no amount or instrument details; it should not be confused with equity investment or included in a lifetime equity total. No public equity round amount, named outside investor, debt facility, valuation, or company-announced lifetime raised total was located. The lack of a public round announcement is not evidence that the company never received capital, and group ownership makes standalone financing data especially difficult to interpret. No public financial statements, revenue, profitability, cash, burn, backlog, or export/customer concentration data were found.

Commercial evidence is stronger than the previous record implied, but still incomplete. The 2026 Maxi Phoenix order is company-announced and corroborated in a contemporaneous sponsored Haaretz feature. A 2024 Haaretz Labels profile attributes to the CEO relationships with Israeli defense forces and companies including Elbit, Rafael, IAI and Aeronautics, and reports that products are integrated in key IDF systems. Those statements establish reported relationships and claimed operational use, not direct customer contracts, revenue amounts or independent verification. Company marketing claims Tier-1 integrator relationships worldwide and capacity for thousands of units annually; those are self-reported capability assertions. A partnership, customer logo or claimed integration should not be treated as a separately verified production deployment absent customer-side evidence.

The competitive set includes defense prime radio/link offerings such as Elbit and L3Harris, and specialist tactical mesh/data-link vendors such as Silvus Technologies and Persistent Systems. Their product architectures and target missions differ, so broad company-level comparisons can mislead. Commtact may differentiate through customized integration across air, sea, land and munition platforms, local manufacturing, and established Israeli defense-industry relationships. That edge is plausible but not independently demonstrated through comparative test results, design wins, installed-base data or patent evidence. The company provides detailed feature descriptions, but no patent portfolio or published freedom-to-operate evidence was identified in this review.

Commercial dual-use potential exists in long-range unmanned operations, remote industrial links, emergency communications and maritime systems. Yet the accessible evidence centers on military and homeland-security demand; no distinct civilian customer, recurring software revenue or civil aviation approval was verified. Defense relevance is direct because command links, telemetry and video links are enabling subsystems for remote platforms and guided systems. This carries export licensing, end-user screening, procurement-cycle and geopolitical concentration risks. It also means performance claims, encryption design, cyber assurance, spectrum authorization, environmental qualification and supply-chain controls require diligence before deployment decisions.

The present investment picture is therefore that of an operating, privately held Israeli defense-technology subsidiary with a current product portfolio, recent contract announcement, and experienced listed leadership—not a transparent venture-backed startup with publicly documented rounds. The strongest diligence priorities are confirming legal ownership and group reporting, inspecting the Maxi Phoenix contract's value and delivery status, obtaining audited standalone financials and customer concentration, independently validating field performance and qualification, reviewing export-control compliance, and establishing the scope and ownership of proprietary waveforms, firmware and patents. No investment recommendation follows from strategic relevance alone.
"""
