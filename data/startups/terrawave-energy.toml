name = "TerraWave Energy"
description = "TerraWave Energy is an Israeli deep-tech energy startup developing millimeter-wave drilling that can melt and penetrate hard rock at extreme depths, with the aim of making deep, high-temperature geothermal power more accessible. Its architecture is still in stealth and R&D, so the headline depth, speed, temperature, and cost figures remain company-reported targets rather than independently validated commercial performance."
detailed_description = """
**Product and the concrete problem it solves.** TerraWave Energy is trying to remove the drilling bottleneck that keeps geothermal energy geographically constrained. Conventional geothermal projects need permeable hot reservoirs close enough to the surface for drilling economics to work. Reaching hotter rock at depths of several kilometers is technically possible, but hard crystalline formations slow mechanical drilling, wear bits, require heavy rigs and large quantities of drilling fluid, and make each additional meter expensive. That limits geothermal development to favorable geological locations even though heat is available much more broadly underground. TerraWave's proposed product is a high-power, millimeter-wave drilling system that uses electromagnetic energy to melt or otherwise thermally fracture rock at extreme depth. The company presents the approach as an enabling tool for global geothermal infrastructure, not as a power-plant operator. Its website claims a path to depths above 10 kilometers, rock temperatures above 450 degrees Celsius, horizontal drilling at up to 1 kilometer per day, and levelized energy costs around $20 per megawatt-hour. Those figures describe the company's ambition and model assumptions; the public record does not establish a commercial well, a completed deep field demonstration, or independently audited economics.

**Core technology and how it actually works.** The technical thesis is a directed-energy drilling head at the end of a waveguide. TerraWave's patent application describes a system and method using millimeter-wave energy for drilling, including a waveguide and optical element that transmits the energy toward the bottom of a fluid-filled borehole. The company says its design combines high-power energy drilling with drilling mud, allowing the borehole to be cooled, cleared, and stabilized while the electromagnetic system works on the rock. In practical terms, this is an attempt to replace some of the mechanical cutting and bit wear in hard formations with controlled energy deposition. The website also describes compatibility with both closed-loop heat exchangers and fractured-reservoir approaches, which matters because the drilling system could serve more than one geothermal plant architecture. The physics and engineering burden is substantial: energy must travel through a long, narrow, harsh environment; the waveguide and downhole optics must survive pressure, vibration, temperature, and fluid exposure; the process must manage molten or vaporized rock and borehole integrity; and the surface power system must deliver reliable high-power pulses. TerraWave's public materials do not disclose wavelength, downhole power, thermal efficiency, borehole diameter, drilling-fluid chemistry, or a complete energy balance. Patent publication demonstrates an IP position and technical direction, not proof that the system achieves the advertised rate or depth.

**Market, customers, and go-to-market.** TerraWave is addressing geothermal developers, drilling contractors, energy utilities, and industrial partners that need a lower-cost route to hot subsurface resources. The immediate buyer is more likely to be a project developer or drilling partner than a consumer of electricity, because geothermal projects require site characterization, permitting, reservoir engineering, well construction, and plant financing before a drilling technology can generate revenue. The company can pursue a technology-supplier or co-development model: demonstrate the drilling head in a controlled test, run a pilot well with an energy or drilling partner, then license or sell systems into geothermal projects. TerraWave's inclusion in the Israeli EnergyCom ecosystem places it in a national energy-technology network, while the company website signals a multidisciplinary team rather than a mature sales organization. Ormat Technologies' disclosed investment in TerraWave is especially relevant to go-to-market because Ormat is an established geothermal developer and operator with a reason to evaluate drilling technologies that expand the resource base. No named commercial geothermal customer, paid deployment, power-purchase agreement, production well, or binding project pipeline is publicly confirmed, so commercialization should be treated as partner-led and pre-revenue.

**Traction, funding, and third-party validation.** Public Israeli ecosystem records identify TerraWave as an active private company established in 2024, headquartered in Tel Aviv, and led by co-founders Hagay Carmi and Michael Pechatnikov. The Israel Innovation Authority lists seven employees, Seed-stage support, and participation in several public funding programs. Startup Nation Finder reports approximately $21.9 million across four funding events, including an August 2024 pre-seed round reported at $3.9 million, a January 2026 Seed round reported at $11.5 million, and additional Innovation Authority support. Because those figures come from ecosystem databases rather than a company financing announcement, the exact round structure and whether grants are included in total capital should be confirmed directly. Ormat's 2024 sustainability report independently discloses TerraWave as one of two innovative companies in which Ormat invested, providing strategic validation from a geothermal incumbent. TerraWave also has a published international patent application, WO2025224725A1, assigned to Terrawave Energy Ltd and listing Michael Pechatnikov among the inventors. These are meaningful signals for a very young deep-tech company, but they stop short of field validation. There is no public evidence of a drilled commercial well, independently measured drilling speed, confirmed cost per meter, revenue, energy output, or a utility-scale customer.

**Founders and team background.** The public record identifies Hagay Carmi as CEO and co-founder and Michael Pechatnikov as CTO and co-founder. TerraWave's own team page lists specialists in drilling, lens design and RF engineering, computational mechanics, mechanical engineering, process and quality engineering, high-temperature engineering, geology, materials engineering, and thermodynamics. That mix is directly relevant to the system problem because the company must integrate electromagnetic power, downhole optics, rock mechanics, fluid handling, high-temperature materials, and geothermal reservoir design. The patent record adds Pechatnikov and Vadim Zlotnik as inventors on the published millimeter-wave drilling application, connecting at least part of the technical team to the core IP. The public sources do not provide complete biographies, prior exits, university affiliations, headcount by function, or a verified organizational chart. That information gap matters less for a seven-person R&D company than it would for a production supplier, but the leadership must eventually prove it can move from multidisciplinary prototype work to field operations, industrial safety, procurement, and long-duration service.

**Competitive dynamics.** TerraWave competes with both alternative drilling technologies and established geothermal project economics. Quaise Energy is the closest conceptual comparison, using millimeter-wave energy to vaporize rock and pursue deep geothermal wells. GA Drilling is developing high-energy plasma drilling for hard rock, while conventional oilfield service companies such as Halliburton and Baker Hughes offer mature rotary drilling, directional drilling, measurement-while-drilling, and well-completion capabilities. In geothermal power, Fervo Energy is advancing enhanced geothermal systems through conventional horizontal drilling and reservoir stimulation, Sage Geosystems is pursuing closed-loop and pressure-based geothermal architectures, and Ormat Technologies is an integrated developer, operator, and equipment provider. TerraWave's proposed edge is not simply geothermal expertise; it is the claim that a compact electromagnetic drilling architecture can reach hotter formations faster, with less mechanical wear and lower project cost, while remaining compatible with more than one heat-extraction method. That edge is potentially valuable but easy to overstate. Competitors have field data, drilling crews, reservoir knowledge, and bankable project references. TerraWave must show that energy delivered to the rock produces a lower total cost per productive well after power conversion, drilling-fluid handling, casing, completion, failures, and plant integration are counted.

**Defense, security, and resilience dual-use relevance.** TerraWave's primary product is a civilian energy technology, but the resilience connection is credible at the infrastructure level. Deep geothermal power can provide dispatchable, weather-independent generation with a small surface footprint, potentially strengthening local grids, industrial sites, and critical facilities that cannot rely entirely on imported fuel, exposed transmission lines, or intermittent renewable output. If TerraWave's drilling system works in hard rock and can be deployed without the geological conditions required by conventional geothermal, it could widen the geography of resilient baseload power. The same characteristics could be relevant to remote logistics hubs, isolated islands, emergency power sites, or defense facilities seeking lower fuel-convoy dependence, though no military customer, defense contract, classified deployment, or ruggedized field system is publicly disclosed. Energy security is therefore an enabling dual-use thesis rather than a demonstrated defense capability. The strategic case is strongest for allied critical infrastructure and distributed power resilience, where a domestic or allied drilling technology could reduce dependence on imported fuels and concentrated energy suppliers. Any defense-specific use would still require environmental, safety, cyber, export-control, and operational qualification well beyond the current public evidence.

**Growth stage, trajectory, and key diligence risks.** TerraWave is best classified as early: the company was established in 2024, remains in stealth, has a small reported team, and is still converting a patent-backed concept into a deployable drilling system. Its trajectory could be significant if millimeter-wave drilling changes the economics of enhanced or closed-loop geothermal, especially as data centers and industrial loads increase demand for firm low-carbon electricity. The next milestones should be a transparent laboratory test with a published energy balance, a rock-penetration demonstration under representative pressure and temperature, an integrated downhole tool test, an independently reviewed pilot well, and a named project partner that accepts responsibility for reservoir and completion risk. Key diligence risks are: (1) energy efficiency, because melting rock may consume too much power to leave a useful net energy gain; (2) downhole reliability, since waveguides, optics, seals, and electronics must survive extreme conditions; (3) borehole and waste management, including removal and stabilization of molten material; (4) scale-up, because a laboratory tool is not a field service fleet; (5) geothermal resource risk, since drilling deeper does not guarantee a productive reservoir or an economic heat exchanger; (6) capital intensity and long project cycles, which can outlast a startup's financing runway; (7) competition from better-funded drilling and geothermal developers; and (8) disclosure uncertainty around funding, performance, patents, and customer commitments. The strategic upside is real, but it is conditional on measured field physics and project economics rather than the website's headline targets.
