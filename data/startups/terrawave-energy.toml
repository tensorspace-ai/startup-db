investment_rationale = "TerraWave is a high-upside, high-uncertainty deep-tech priority signal, not an investment recommendation. (1) The technology targets a genuine bottleneck: geothermal is attractive as firm low-carbon power, but drilling hard rock to high-temperature resources constrains where projects work economically. (2) The technical thesis is unusually specific, supported by a published international patent application, a named RF and drilling team, Israel Innovation Authority support, and an investment disclosed by geothermal incumbent Ormat Technologies. (3) Public ecosystem records report approximately $21.9M across four funding events, giving the company more runway than a purely academic spinout. (4) The market timing is favorable because data centers and industrial electrification increase demand for firm power and energy security. Counterweights are decisive: public evidence does not establish a commercial well, independent drilling-performance data, net energy balance, revenue, or a named customer; deep drilling and geothermal projects are capital intensive and slow; and Quaise, GA Drilling, conventional oilfield-service incumbents, and geothermal developers possess relevant technical and field advantages. The diligence question is whether TerraWave's energy-per-meter and total well economics remain attractive after downhole losses, casing, fluid handling, completion, and reservoir risk are included."
