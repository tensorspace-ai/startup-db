name = "Torii"
description = "Torii is a SaaS Management Platform that gives IT, finance, and security teams visibility and control over enterprise software, including discovery, shadow-IT detection, spend and renewal governance, access reviews, and employee lifecycle automation."
detailed_description = """Torii provides a discovery-first SaaS Management Platform for organizations whose software stack has outgrown manual spreadsheets, procurement records, and identity-provider reports. Its product connects to business systems, finance data, single sign-on sources, browser signals, and other integrations to build an inventory of applications and their usage. The platform then turns that inventory into operational workflows: teams can identify shadow IT, review access, reclaim unused licenses, automate joiner-mover-leaver tasks, manage renewals, and coordinate application ownership. Torii's current product direction also includes visibility and governance for AI tools, non-human identities, and agentic software, extending the same control problem beyond conventional SaaS.

The primary buyers are enterprise IT, SaaS operations, security, procurement, finance, and business-system owners. The commercial problem is concrete: employees adopt applications faster than central teams can approve, secure, budget, and retire them; duplicate subscriptions and unused seats create avoidable spend; and incomplete ownership information makes offboarding and access reviews unreliable. Torii positions one shared system of record as a way to reduce those costs while improving accountability. Its public product materials describe more than 180 integrations, a no-code workflow canvas, renewal alerts, license and usage data, access-review support, and AI-assisted research. The company also publishes customer examples and an ROI claim of average SaaS-spend reductions above 25%; those are company-reported marketing signals rather than independently audited operating metrics.

Torii competes in a crowded SaaS-management category against BetterCloud, Zylo, Zluri, Productiv, Vendr, Flexera, Spendflo, and newer security-oriented tools such as Nudge Security. Adjacent substitutes include identity-governance suites, IT service-management platforms, software-asset-management products, procurement systems, and internally assembled integrations. The differentiation thesis is breadth plus actionability: Torii combines discovery, usage and spend context, access governance, renewal management, and lifecycle automation instead of treating SaaS inventory as a static report. That approach can improve time-to-value and reduce tool switching, but it also creates a demanding integration-maintenance burden and puts the company in direct competition with larger platforms that can bundle related capabilities.

Public evidence supports an established private growth company rather than an early prototype. Torii was founded in 2017, reported a $10 million Series A in 2021, and was reported by Calcalist in 2022 to have raised a $50 million Series B and approximately $65 million in total funding at that time. Its official site currently presents an enterprise product, a global customer and partner motion, a leadership team spanning product, engineering, sales, marketing, and finance, and security claims including SOC 2 Type II, GDPR compliance, encryption, SSO/MFA support, and annual penetration testing. Current employee-count data is inconsistent across public directories, so a 51–200 range is more defensible than the previous 201–500 estimate.

The national-security relevance is real but indirect. Torii does not appear to sell weapons, sensors, classified-data systems, or mission software. Its potential value to defense contractors, government technology suppliers, and critical-infrastructure operators comes from controlling the commercial software dependencies that support their work: shadow-IT detection, vendor and application inventory, least-privilege reviews, offboarding, audit trails, renewal control, and oversight of unapproved AI tools. Those controls can reduce attack surface and supply-chain uncertainty, but deployment in sensitive environments would require diligence on data residency, tenant isolation, government authorization requirements, classified-work separation, integration permissions, and the evidentiary quality of its audit outputs. The dual-use case should therefore be treated as cybersecurity and operational-resilience adjacency, not as evidence of existing defense contracts."""
