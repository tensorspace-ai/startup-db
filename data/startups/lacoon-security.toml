name = "Lacoon Mobile Security"
description = "Lacoon Mobile Security was an Israeli mobile-threat-defense company that developed detection and risk-analysis technology for iOS and Android devices, applications, and network activity. Check Point completed its acquisition on 2 April 2015, so this record describes Lacoon as an acquired security asset rather than an independent startup operating today."
detailed_description = """Lacoon built mobile threat prevention for organizations whose phones had become part of the enterprise attack surface. Check Point's acquisition announcement described coverage across the device, application, and in-network layers, with support for both iOS and Android. The product direction combined mobile application threat emulation, behavioral risk analysis, real-time anomaly detection, and intelligence that could feed existing security and mobility infrastructure. Lacoon's own 2013 launch account also described sandboxing, static code analysis, and behavioral detection as core research areas. This is more specific than conventional mobile-device management: MDM can enforce configuration and access policy, while a mobile threat-defense layer attempts to identify malicious applications, compromised devices, suspicious behavior, or hostile network conditions.

The original customer problem was commercially credible. BYOD and mobile-first workforces created a security gap between endpoint policy and what actually happened on a handset, particularly when users accessed corporate data from outside the traditional perimeter. Lacoon positioned MobileFortress around protection from cybercrime and espionage, and Check Point said the technology was deployment-proven and intended to extend its enterprise mobile-security portfolio. Public reporting at the time identified enterprise customers including Samsung, Intel, and Dell, but the available evidence does not establish current customer relationships, retention, revenue, or the scale of those deployments. Historical company-size sources range from 11-50 employees to a report of approximately 40 people at acquisition; that should be treated as period-specific staffing evidence, not a current headcount.

Check Point announced and completed the acquisition in April 2015, integrating the founders and team into its operations and incorporating the acquired capabilities into its mobile-security products. Check Point's later public filings identify Lacoon Security Ltd. as a subsidiary, while the current official product destination is Check Point's Harmony Mobile Security page rather than a Lacoon-operated site. The transaction is therefore the strongest commercialization signal: a major security platform judged the technology strategically useful and capable of complementing its existing mobility offering. It is not evidence that Lacoon remains a separately managed vendor, that its original product is still sold under the Lacoon name, or that every historical technical component remains in the current product.

The dual-use case is real but bounded. Detection of malicious mobile applications, device compromise, anomalous behavior, and unsafe network activity can protect commercial enterprises, public-sector workers, and defense organizations using mobile communications. These capabilities are relevant to secure access to sensitive systems and to reducing the risk that a compromised handset becomes a path into a mission-support environment. However, the public record documents enterprise mobile security, not a verified military deployment, intelligence contract, or classified capability. Strategic relevance therefore comes from mobile endpoint resilience and the acquisition's validation of the category, while direct investment relevance is low because the asset is owned and integrated by a public company."""
