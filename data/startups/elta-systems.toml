stage_rationale = "Elta Systems is a mature, established division of a large multinational defense contractor. The company has been in continuous operation since 1967 and its products have been deployed for decades across Israeli forces and allied militaries. Financial sustainability is provided through IAI's backing, government procurement, and foreign military sales revenue. The company faces no existential technology risks and operates in stable, well-defined markets. However, Elta does not fit the growth-stage venture model; it operates as a traditional defense-industry business unit subject to government budgeting cycles, export controls, and strategic policy decisions rather than venture capital dynamics. Elta should be classified as 'established' or 'mature' rather than 'early' or 'mid-stage' given its operational scale, customer base, and organizational structure."
