name = "Nando Drones"
description = "Nando Drones is an Israeli startup offering an autonomous drone-in-a-box platform for perimeter security, site monitoring, and inspection. Its disclosed system combines an autonomous aircraft, docking and charging station, day/thermal imaging, onboard analytics, and control software."
detailed_description = """Nando Drones was founded in 2017 and is based in Bnei Atarot, Israel. Its public product description is a complete autonomous drone-in-a-box system rather than a general-purpose drone marketplace: a drone launches from a weather-protected docking station, conducts programmed or triggered patrols, detects people and vehicles with visible and thermal cameras, transmits alerts and video, returns to land autonomously, and recharges. The company describes a 70-minute flight time, a five-kilometre operating radius, and onboard image processing; these are company-published specifications and should be treated as claims requiring technical validation rather than independently verified performance.

The initial customer problem is persistent perimeter awareness at sites where guards, fixed cameras, or occasional manual drone flights leave coverage gaps. Nando's stated target environments include industrial sites, solar farms, agriculture, mining, borders, coastal areas, and other security-sensitive facilities. Its control software is designed to show mission, weather, and detection information and to send an event to a control centre or response team. The commercial proposition is therefore a managed security and monitoring workflow, with the drone, station, sensors, autonomy layer, and operator interface functioning as one system.

The category is competitive and operationally demanding. Nando faces drone-in-a-box providers such as Percepto, Airobotics, Easy Aerial, and American Robotics, as well as larger UAS and security vendors, fixed-camera systems, and traditional guard services. Its possible differentiation is an integrated site-security package, autonomous docking and charging, dual day/thermal sensing, and a security-services relationship through Moked Matara. The public record does not establish a durable technology moat, recurring revenue scale, current customer count, regulatory approvals, or production volume. The website remains active, but much of the available product and news material dates from 2019-2021, so present commercial momentum is unclear.

Public sources report a $1.5 million seed round in February 2019, pilots at a cannabis farm and a solar farm, and an operation in Oranit described in 2020. Those reports support product development and early field validation, not current scale or sustained revenue. Startup Nation Finder lists a 1-10 employee range and identifies Dvir Simhi as co-founder and CEO; it also records Nir Shaharabani as a former co-founder. No newer financing, headcount, customer, or deployment disclosures were found in the reviewed sources.

The national-security relevance is credible but bounded. Autonomous persistent surveillance, thermal detection, alerting, and rapid dispatch can support border, base, critical-infrastructure, and homeland-security missions, while remaining useful for civilian inspection and emergency response. However, the public materials describe surveillance and protection, not weapons, contested-environment autonomy, or military procurement. Strategic assessment should therefore focus on evidence of reliable operations, false-alarm rates, cybersecurity, airspace compliance, unit economics, maintenance burden, and repeatable customer deployments."""
