name = "Lightspin"
description = "Acquired Tel Aviv cloud-security company whose graph-based CNAPP and CSPM technology contextualized cloud misconfigurations, identities, vulnerabilities, and attack paths for prioritization and remediation; Cisco completed the acquisition in May 2023 and now presents the capability through Panoptica."
detailed_description = """Lightspin was founded in 2020 in Tel Aviv to address a practical weakness in cloud security: conventional scanners produce large volumes of findings, but they do not reliably show which combination of permissions, assets, vulnerabilities, and network relationships creates a dangerous path to sensitive data or workloads. Its product was an agentless cloud-native application protection platform covering Amazon Web Services, Google Cloud, Microsoft Azure, and Kubernetes. The company described an attack-path engine built on graph algorithms, continuous cloud and Kubernetes visibility, risk scoring, and remediation recommendations. Cisco's acquisition announcement independently confirms the central product thesis: contextualized cloud-security coverage using graph technology to provide context, prioritization, and remediation guidance.

The commercial customer problem was alert overload across infrastructure-as-a-service, platform-as-a-service, containers, identities, infrastructure-as-code, and application delivery pipelines. Lightspin positioned itself for security and DevOps teams that needed to discover cloud resources quickly, connect findings to reachable attack paths, and reduce the remediation queue to risks with meaningful business impact. Historical company materials and its LinkedIn profile describe a self-serve offering, build-to-runtime coverage, and customers including ZoomInfo, ITV, Riskified, and Next Insurance; those claims indicate market traction, but the public record does not establish current customer retention, revenue, deployment scale, or post-acquisition product continuity. A 2021 Series A announcement reported $16 million raised, which is useful historical context but not a measure of present standalone value.

Lightspin competed in a crowded and rapidly consolidating CNAPP/CSPM market against Wiz, Orca Security, Palo Alto Networks Prisma Cloud, Sysdig, Aqua Security, and native controls from the major cloud providers. Its defensible idea was not simply collecting more telemetry; it was representing relationships in a graph and using those relationships to prioritize exploitable or high-impact paths. That can improve analyst efficiency and remediation sequencing, especially where cloud identity, configuration, workload, and vulnerability data are fragmented. The limitation is that graph quality depends on connector coverage, permissions, asset attribution, cloud-provider API changes, and the accuracy of reachability and impact assumptions. Larger competitors could offer similar prioritization while bundling CNAPP, runtime, vulnerability, identity, and security operations functions into broader platforms.

Cisco announced its intent to acquire Lightspin on March 29, 2023, and updated the announcement on May 24 to state that the acquisition had completed. Cisco's FY2023 results also list Lightspin Technologies Ltd. among acquisitions closed in the fourth quarter. The acquired_asset classification therefore matters more than the historical startup label: there is no current independent financing or exit path to assess, and the former Lightspin website redirects to Cisco Outshift's Panoptica page. Cisco said the team would join its Emerging Technologies & Incubation organization and linked the technology to end-to-end security and observability from build to runtime. This is a credible strategic validation of the product and team, but public sources do not show how much of the original brand, staff, or code remains separately identifiable.

For national-security and defense readers, the relevance is substantive but indirect. Government, defense, and critical-infrastructure operators increasingly use multi-cloud, containers, Kubernetes, and identity-driven access controls, so graph-based asset context and attack-path reduction can help harden those environments. The technology supports defensive cyber hygiene, exposure management, and incident-prevention workflows; it does not by itself provide offensive capability, intelligence collection, or mission-specific assurance. Public evidence found for this record does not document a defense customer, government contract, security accreditation, or deployment in a classified environment. The strongest conclusion is therefore dual-use cybersecurity infrastructure with plausible government applicability, subject to deployment, data-residency, integration, and assurance diligence."""
