name = "Avnon Group"
description = "Israeli privately held homeland-security and defense group founded around TAR Ideal Concepts in 1989 and presented as an HLS group from 1990. It develops and integrates counter-UAS, surveillance, unmanned-aircraft, tactical-equipment and composite-manufacturing capabilities through specialist companies and partner products. Two core subsidiaries, Skylock and BeeSense, transferred to the TASE-listed successor Autonomous Guard in June 2025 as part of Avnon's court-approved creditor arrangement."
detailed_description = """Avnon Group is a privately held Israeli homeland-security and defense business associated with Avnon Enterprise Ltd. and the TAR Ideal Concepts operation started by Tomer Avnon in 1989. Avnon Holdings describes the HLS group as established in 1990. The group sells and integrates technologies for government, police, special-unit, defense and infrastructure-security users. Its current public material describes four capability families: counter-UAS, UAS platforms, multi-sensor systems and composite materials. The wider group model also includes tactical equipment, systems integration and representation of outside suppliers. Its portfolio and corporate perimeter have changed materially, so old claims of ten companies, 80 countries, 500 partners and about 150 employees should not be treated as current consolidated facts.

The most important portfolio change was the June 10, 2025 completion of the transfer of Skylock Systems and BeeSense Sensors Systems into the former Technoplus Ventures, renamed Autonomous Guard. The listed vehicle issued shares and paid cash to the sellers; reporting around the court-approved arrangement described NIS 60 million in cash plus a controlling equity position, with proceeds intended for creditors. That transaction shifted two highly visible counter-drone and sensor businesses out of the private group and into a listed company. A June 2026 report said the court found Tomer Avnon had completed the creditor arrangement, reporting repayment of NIS 350 million including tax debt. This resolves the prior insolvency process as reported, but does not establish the present balance sheet or operating perimeter of every remaining Avnon entity.

Avnon's current company materials still present a specialist group developing and integrating defense and homeland-security technologies. Named capabilities include Skylock's multi-layered counter-UAS systems, iSTAR unmanned aircraft, BeeSense multi-sensor surveillance, and Comparts composite engineering. However, Skylock and BeeSense now belong to Autonomous Guard, rather than being counted as Avnon's current subsidiaries. Avnon Holdings identifies an HLS division and other unrelated divisions, making it important to distinguish the defense group from the broader holding-company brand. The official Avnon Group site is active, and a 2025 Israeli government trade delegation catalogue still described the group as an Israeli HLS supplier, though its description does not provide audited financial or staffing data.

The customer problem remains real: small drones complicate perimeter security, force protection and airspace monitoring, while border and infrastructure operators need to combine radar, radio-frequency detection, electro-optical sensors and response options. Avnon's potential role is systems integration and delivery of multiple technologies matched to local operating needs. Its range can be useful where buyers prefer one integrator for sensors, platforms, tactical equipment and installation. Public source material documents historical and current offerings, but does not establish that all legacy products remain under Avnon ownership, that commercial airport deployments are paying recurring contracts, or that marketed system specifications have been independently verified.

Commercial diligence must start with the post-restructuring perimeter. Calcalist reported 2023 workforce reductions from roughly 240 to 139 and severe payment stress before court protection. Later public reporting describes creditor repayment and the listed transfer, while the group's own contemporary pages make broad global-reach statements without publishing consolidated accounts. A historical 2022 article reported approximately NIS 1 billion sales for 2021 as an estimate and forecast 50% growth for 2022; that is stale press reporting, not a current audited baseline. No current consolidated revenue, profit, cash, debt, workforce, backlog or customer-concentration disclosure for the residual private group was located. Financial evidence for the listed successor or its subsidiaries must not be presented as Avnon Group financials.

The competitive position is therefore better framed as a focused integrator and portfolio owner than as a venture-backed product startup with a transparent cap table. Direct counter-UAS peers include D-Fend Solutions, DroneShield, MyDefence, Sentrycs and larger defense suppliers such as Elbit Systems, IAI and Thales. The group may differentiate through local sourcing relationships, integration across several security domains, deployment services and access to specialist Israeli manufacturers. Scale, export permissions, product ownership after restructuring, delivery capacity and working capital are material constraints. Counter-UAS systems also face rapid technical change: RF jamming can be ineffective against autonomous or fiber-optic-controlled aircraft, and detection performance varies with clutter, terrain and threat profile. Buyers may choose layered solutions from larger primes with established procurement and support capacity.

The group has substantial defense and public-safety applicability. Border monitoring, police operations, infrastructure protection and airport security can serve civilian authorities as well as military users, but actual deployments and revenue mix are not publicly quantified. Do not infer military contracts from product suitability or general supplier language. Similarly, no standalone Avnon patent portfolio was verified; a patent associated with DST Control was reported in a proposed related-party transaction, but DST was not established as part of the Skylock/BeeSense merger and its later ownership status requires confirmation.

Avnon's team evidence is strongest for founder Tomer Avnon, whom company sources identify as founder and president and describe as a former Israeli Navy commando and entrepreneur. Its website lists managers in group and portfolio roles, but some displayed names and roles differ across revisions, and no independent current leadership roster or successor-management map was established. Governance diligence should determine who controls the residual operating entities after restructuring, what assets remain, which obligations were discharged, and whether the founder retains direct or indirect control of the listed spinout. The listed transaction, creditor recovery, historic financial distress and reduced workforce make a current legal-entity chart and audited post-settlement accounts essential before drawing investment conclusions."""
