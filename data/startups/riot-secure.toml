name = "RIoT Secure"
description = "RIoT Secure AB is a Stockholm-based embedded-IoT security company building hardware-rooted lifecycle management for resource-constrained devices. Its platform separates security-critical firmware and communications from application, AI, and WebAssembly workloads so long-lived devices can be updated and governed without treating every software change as a firmware replacement."
detailed_description = """RIoT Secure provides a modular security and lifecycle stack for microcontroller-class IoT devices, rather than a conventional cloud monitoring product. The company describes µTLS as a patented, efficient communication layer for constrained devices; FUSION as hardware-level separation of security and application concerns using dedicated microcontrollers; BRAWL as a portable WebAssembly execution environment; SHIELD as runtime firmware encryption for physically accessible devices; and OASIS as the fleet, update, integration, and policy control plane. The architectural proposition is to keep hardware-critical firmware comparatively stable while allowing application logic, AI models, and portable modules to evolve independently. That can reduce the blast radius of application changes and make secure operation feasible where memory, power, bandwidth, and intermittent connectivity rule out Linux-centric tooling.

The commercial problem is real but difficult. Device manufacturers and operators must support long-lived products across heterogeneous microcontrollers, connectivity options, and field conditions, while meeting rising expectations for secure onboarding, signed updates, rollback, identity, and supply-chain accountability. RIoT Secure’s stated target is the under-served segment of 32–256 KB-class devices and other embedded systems that mainstream device-management platforms often abstract away. Its official materials describe API-oriented integration with existing IoT, analytics, and cloud environments, plus a production-oriented deployment involving edge AI and GNSS signal intelligence on baggage-handling vehicles at Stockholm Arlanda Airport. The company also identifies Comau and Neuton.ai-related work on its AI-at-the-edge page; these are useful diligence leads, but the database should not treat them as independently verified customer contracts.

Competitive differentiation rests on system architecture and embedded implementation depth, not on a broad security operations dashboard. Memfault, AWS IoT Device Management, Azure Device Update, and Foundries.io are important lifecycle-management substitutes; Sternum, Finite State, Armis, and Nozomi Networks represent adjacent embedded, device, or OT-security alternatives. RIoT Secure may win where a device maker needs isolation between native firmware and rapidly changing edge logic, but it must prove that the added hardware or integration complexity produces lower total cost and safer updates than an incumbent RTOS, secure-boot chain, or cloud fleet platform. Public evidence shows recurring product development, awards, partner positioning, and claimed commercial deployment, but not enough independently verifiable information about ARR, customer concentration, renewal rates, certification coverage, channel scale, or financing.

The company is strategically relevant to cyber resilience because the same primitives can protect industrial controls, transportation equipment, robotics, remote sensors, and other operational technology used in security-sensitive environments. That is credible dual-use adjacency, not evidence of defense procurement: no public defense contract or military deployment is established here. The main diligence question is whether RIoT Secure can turn a technically differentiated embedded stack into repeatable design wins and long-term software revenue while maintaining rigorous cryptographic, update, and safety guarantees across many hardware families."""
