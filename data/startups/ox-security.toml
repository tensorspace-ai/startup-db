name = "Ox Security"
description = "Ox Security provides a code-to-runtime application and software supply-chain security platform that connects code, dependencies, CI/CD, cloud, APIs, and runtime context to prioritize exploitable risk and secure AI-assisted development."
detailed_description = """
Ox Security is an Israeli-founded application security company established in 2021 by Neatsun Ziv and Lior Arzi. Its core proposition is to reduce the operational gap between the volume of findings produced by modern AppSec tooling and the much smaller set of issues that are reachable, exploitable, and consequential to a particular business. The platform correlates signals across source code, open-source dependencies, build pipelines, infrastructure-as-code, cloud resources, APIs, containers, and runtime behavior. That code-to-cloud lineage is intended to give security teams a more useful answer than a severity score alone: where a risk originated, whether it can actually be reached, what is exposed, and which remediation action is likely to reduce real attack surface.

The current product direction extends beyond conventional post-generation scanning. OX Code covers application security workflows including SAST, software composition analysis, secrets detection, and related lifecycle checks. OX Cloud adds cloud posture, infrastructure-as-code, runtime, API exposure, and source-to-runtime mapping capabilities. The company also markets OX VibeSec for AI-assisted coding workflows, using organizational context and policy signals to identify or prevent risky generated code, dependencies, and agent interactions closer to the point of creation. Its software supply-chain materials describe SBOM and provenance-oriented outputs, while the company positions its autonomous agentic pentesting capability as a way to test whether identified weaknesses can be exploited and connect findings back to source.

The customer problem is credible and commercially important. Enterprises have accumulated overlapping scanners and security controls while development teams increasingly ship code through cloud-native pipelines and AI coding assistants. The resulting backlog creates a prioritization and remediation bottleneck for AppSec, product security, and cloud security teams. OX says it serves more than 200 customers and supports more than 120 native integrations; these are company-reported traction indicators rather than independently audited operating metrics. Gartner Peer Insights lists the company in the application security posture management category and reports a 51-200 employee range. In May 2025, Ox announced a $60 million Series B led by DTCP, bringing the company-reported total raised to $94 million, with participation from IBM Ventures, Microsoft, Swisscom Ventures, Evolution Equity Partners, and Team8. These signals indicate a venture-backed growth company with meaningful commercialization, although retention, recurring revenue quality, deployment depth, and customer concentration remain diligence questions.

Competitive pressure is substantial. Ox competes with integrated AppSec and cloud-security platforms as well as specialist SAST, SCA, ASPM, CNAPP, and automated testing vendors. Its differentiator is not simply another scanner; it is the attempted synthesis of context, lineage, prioritization, and prevention across the software lifecycle. That advantage will depend on the quality of its integrations, asset and dependency graph, exploitability models, remediation accuracy, and ability to prove fewer material incidents or less engineering time. Larger vendors can bundle adjacent controls, while focused competitors may offer deeper analysis in one workflow. OX VibeSec is strategically timely because AI-generated code and agent-driven development create new supply-chain and governance questions, but the category is still developing and claims about preventing vulnerabilities at generation time require technical and customer validation.

The defense and national-security case is credible but indirect. Military, intelligence, and critical-infrastructure organizations increasingly depend on complex software supply chains, cloud services, APIs, and developer tooling; reducing exploitable exposure in those pipelines can improve resilience. OX could be relevant to secure development environments, defense contractors, mission software, and regulated operators, including settings where scarce security personnel need high-confidence triage. However, there is no evidence in the reviewed sources of a defense contract, classified deployment, or specialized air-gapped product. The dual-use thesis should therefore be treated as an adjacency based on the technology and customer problem, not as demonstrated defense traction.
"""
