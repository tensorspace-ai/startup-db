name = "TierraSpec"
description = "TierraSpec is an Israeli soil-intelligence startup that combines satellite observations, environmental data, machine learning, and targeted soil-sample calibration to map soil properties for agriculture and carbon monitoring. Its platform aims to make spatially detailed soil information more timely and affordable, supporting input decisions and soil-carbon measurement relevant to food-system resilience."
detailed_description = """**Product and the problem it solves.** TierraSpec is building a remote soil-intelligence platform for a persistent agricultural information gap: conventional soil testing relies on field sampling and laboratory analysis, which can be costly, slow, labor-intensive, and too sparse to capture within-field variation. The company presents its service as a way for farmers, agronomists, and land managers to request mapped estimates of soil characteristics across a defined field, then use the resulting information to guide sampling, fertility and irrigation planning, and longer-term soil management. Its published property list includes soil organic carbon, pH, texture, nutrient measures such as nitrogen, phosphorus, and potassium, soil stratification, and sampling-plan optimization. These are model outputs tied to an agricultural decision workflow, not direct readings from a new sensor embedded in every field. That distinction matters commercially: TierraSpec is attempting to turn remote observations and selected ground measurements into actionable soil layers, allowing a user to inspect spatial differences and prioritize where to test or intervene. The core problem is not a lack of satellite images; it is translating those images into measurements that are specific enough to support field-level decisions and credible carbon accounting.

**Core technology and how it works.** TierraSpec describes a pipeline that joins satellite imagery with environmental layers, soil reference data, and machine-learning algorithms. Its stated scientific foundation is more than three decades of soil spectroscopy research led by Prof. Eyal Ben-Dor at Tel Aviv University. In practice, the platform asks the user to define or upload a field boundary, select a soil analysis or mapping layer, and request an analysis or a sampling strategy. The company says it can use existing soil-sample data to calibrate its models before producing remote analyses; that calibration requirement is an important qualification to the promise of sensor-free, remote coverage. The outputs are presented as mapped estimates, including nutrient and carbon-related attributes, that users can inspect through a web interface. TierraSpec’s agronomist materials claim 30-by-30-meter spatial resolution, while its tutorials demonstrate field-boundary setup, sampling-plan requests, soil-analysis requests, and viewing additional map layers such as vegetation indices, elevation, slope, and land-surface temperature. Public materials do not disclose model architectures, training-set composition, error distributions by soil type, calibration transfer across regions, or independent validation against accredited laboratory results. The key technical diligence test is therefore not whether remote sensing can correlate with soil properties in principle, but whether TierraSpec can maintain useful accuracy across crops, seasons, moisture conditions, geologies, sensor generations, and geographies at a field-economical sampling burden.

**Market, customers, and route to market.** The initial buyer set is agricultural and land-management organizations that need better soil information but cannot justify dense conventional sampling everywhere. Potential users include growers and farm groups, agronomists, agricultural-input providers, food-supply-chain companies, carbon-project developers, and public agencies responsible for land or climate programs. The platform could be sold as a software service, as an analysis product delivered through agronomic or input-provider channels, or as a measurement layer for carbon projects. Its own product pages organize use around growers, agronomists, and carbon measurement, while public program records identify agricultural and climate applications. The service may be attractive where the cost of soil sampling and lab turnaround limits how frequently fields are assessed, and where better spatial data can improve fertilizer allocation, irrigation planning, or the selection of representative ground samples. However, those benefits remain conditional on local calibration and the farmer’s ability to convert a map into an economically useful action. Agricultural purchasing is fragmented, seasonal, and sensitive to demonstrated yield or input savings; the sales path may be easier through agronomists, cooperatives, input suppliers, or large food and carbon programs than through individual small farms. No named paying farm customer, enterprise contract value, recurring-revenue metric, or quantified savings result was identified in the reviewed public sources. TierraSpec has shown accelerator and ecosystem activity, but public evidence of repeatable commercial distribution is still limited.

**Traction, financing, and external validation.** Trendlines and the Bayer Trendlines Ag Innovation Fund announced TierraSpec’s establishment and co-investment in June 2022, describing a remote platform for measuring and validating agricultural soil carbon and noting that its technology builds on research at Tel Aviv University, commercialization collaboration with Ramot, and Israel Innovation Authority involvement. The announcement did not disclose a company-specific round amount. A later Trendlines securities disclosure listed TierraSpec as a portfolio company and reported a 42.07% fully diluted interest for the group at that time; that is evidence of an incubator-created, investor-backed company, not a current cap-table statement. Startup Nation Finder’s legacy profile reports two funding rounds totaling about $2.34 million and a small team, but those figures are not confirmed in the primary materials reviewed here and should be treated as secondary database reporting. More current signals include TierraSpec’s participation in the RegenUp field-pilot initiative led by MIGAL Galilee Research Institute and GrowingIL, where the program reports that satellite-based soil heat maps were implemented for precision fertilization, and the company’s own update about that participation. The company also reports participation in climate and agritech programs and a 2026 U.S. trade-show visit. Those signals support ongoing activity and an effort to move beyond laboratory work, but neither a pilot nor a program selection establishes a paid deployment, validated yield uplift, carbon-credit issuance, or regulatory acceptance. Its current round stage is best recorded as Seed, with financing amount and runway unknown.

**Founders and team.** Public profiles identify Avital Levy-Lior, PhD, as co-founder and CEO, and Prof. Eyal Ben-Dor as scientific co-founder; the company’s technology page says Ben-Dor serves on its board and remains active in strategic decisions. Ben-Dor’s long-running Tel Aviv University work in soil spectroscopy provides relevant research provenance, and Trendlines describes the commercial technology as based on more than 30 years of research in his laboratory. Company and ecosystem materials also identify a small operating team, with LinkedIn showing a 2–10 employee range and public references to remote-sensing and software recruitment. This is a meaningful combination of domain science and startup leadership for a technical agritech product, while it leaves open how much capacity the company has in geospatial engineering, agronomy, field validation, commercial sales, and international support. The exact current headcount and complete leadership roster are not consistently disclosed. Diligence should establish which academic methods and data rights were licensed or assigned to the company, how research collaborators participate in product development, and whether the team has enough field and customer-success expertise to translate estimates into agronomic outcomes.

**Competitive dynamics.** TierraSpec competes with several approaches to the same buyer problem. CropX combines in-field sensors, weather, and farm-management analytics to support irrigation and crop decisions; SoilOptix uses mobile soil-sensing equipment and georeferenced sampling to create high-resolution nutrient maps; Pattern Ag analyzes soil biology to guide crop and input decisions; EOS Data Analytics and Planet supply satellite imagery and crop-monitoring products that can become inputs or substitutes for remote soil intelligence; and Regrow Ag and Agreena provide measurement, reporting, and verification products for agricultural carbon programs. Traditional laboratory testing and agronomist-designed sampling remain the trusted incumbent approach, while public soil surveys and low-cost soil probes can satisfy some basic needs. TierraSpec’s potential advantage is a software-led, remote mapping workflow grounded in established spectroscopy research, with the prospect of applying one calibrated model across a much larger area than routine physical sampling can cover. A single platform that links carbon, texture, pH, and nutrient layers could also reduce the fragmentation of separate tests. That advantage is not yet demonstrated against independent benchmarks or customer economics. Competitors with installed sensors, large agronomy channels, established lab relationships, or carbon-program distribution can bundle soil data with products customers already buy. TierraSpec will need repeatable regional accuracy, clear calibration economics, credible carbon-MRV acceptance, and evidence that its maps change decisions enough to pay for the service.

**Strategic and resilience relevance.** TierraSpec’s strongest strategic contribution is to agricultural and environmental resilience rather than direct defense technology. Better soil-property coverage can help growers use water and fertilizer more selectively, identify within-field constraints, and monitor soil organic carbon, supporting the reliability and efficiency of food production under drought, soil degradation, and climate variability. A scalable, locally calibrated soil-information layer could be useful to public agricultural agencies, food processors, insurers, and land-restoration programs that need to compare conditions across many parcels. The carbon-measurement thesis could connect soil-health improvement to climate-finance mechanisms, but public sources do not show that TierraSpec has yet obtained carbon-registry acceptance or generated issued credits. The same mapping capabilities may support continuity planning for agricultural regions and more informed allocation of scarce water and agricultural inputs during disruptions. No public source reviewed here documents military customers, security-force deployments, classified use, or defense-specific product development, so dual-use relevance should be read as commercial agriculture plus civil food-system and environmental resilience adjacency. This is strategically relevant to Israel and allied food and water security, but the company should not be described as a fielded defense supplier.

**Stage, trajectory, and key diligence risks.** TierraSpec is an early-stage company: it was formed in 2022, has an investor and university-research origin, publishes a working analysis interface and tutorials, and has entered an on-farm pilot program, but it has not disclosed financial scale or referenceable paid deployments. Its near-term path is to convert pilots into repeated analyses across multiple soil regimes, demonstrate agreement with ground-truth laboratory data, and prove that agronomic or carbon-program customers will pay for updates rather than one-off maps. Important diligence questions include: (1) how prediction error varies by geography, season, crop cover, moisture, and soil class; (2) what sample density and calibration cost are required before remote estimates are dependable; (3) whether outputs are accepted by carbon registries, lenders, insurers, or government programs; (4) whether customers can connect maps to measurable input savings, yield stability, or validated carbon changes; (5) how much of the model, data, and intellectual property is owned or exclusively licensed by TierraSpec; (6) how the company competes against sensor-rich platforms and established agronomic channels; and (7) whether its small team and undisclosed financing can support international validation and customer service. The official website calls the technology patented, but a patent number, jurisdiction, claims, and ownership were not independently confirmed in the sources used for this record. The strongest next signals would be a named repeat customer, independently measured accuracy and economic outcomes in multiple regions, documented carbon-methodology approval, and disclosed financing sufficient to commercialize the product."""
