name = "Luminate Security"
description = "Luminate Security was an Israeli cybersecurity startup that built Secure Access Cloud, a software-defined-perimeter platform for granting users point-to-point access to specific applications across on-premises and hybrid-cloud environments. Symantec acquired the company in 2019, and its former domain now redirects to Broadcom's cybersecurity business."
detailed_description = """Luminate Security emerged from stealth in 2018 with a software-as-a-service implementation of the BeyondCorp and software-defined-perimeter ideas. Secure Access Cloud was designed to connect an authenticated user to a requested application without exposing the wider corporate network or granting broad network-level access. Public product material described an agentless, application-layer architecture that could span on-premises data centers and public-cloud infrastructure, integrate with existing identity systems, and apply access policy based on the user, device, location, and requested resource. The important technical proposition was not simply replacing a VPN client; it was reducing the reachable attack surface and limiting opportunities for reconnaissance and lateral movement.

The initial commercial problem was credible and well-defined. Enterprises were accumulating hybrid-cloud applications while still depending on VPNs, firewalls, and manually maintained network segmentation. Luminate's 2018 launch announcement said the platform had production paying customers in international financial, technology, and consumer-services organizations, and described integrations with existing IT tools rather than requiring wholesale application or permission redesign. Those are historical company claims, but they provide stronger evidence of early commercialization than the current record's generic growth language. Public reporting also records $14 million in combined seed and Series A funding before the exit. Current employee count, customer retention, product availability, and post-acquisition revenue are not reasonably confirmable from the available public record and should not be inferred from the old 11-50 estimate.

Symantec announced the acquisition in February 2019 and said Luminate's technology would strengthen its cloud-security and Integrated Cyber Defense offering. Broadcom subsequently completed its acquisition of Symantec's enterprise-security business in November 2019. Luminate.io now redirects to Broadcom's cybersecurity product area, which is evidence of ownership and a continuing corporate web destination but not proof that Luminate remains a separately marketed product or legal entity. The exit validates strategic interest in application-centric access control, while also making standalone company-level diligence impossible: there is no reliable current cap table, independent management profile, product roadmap, or evidence that the original brand remains active.

The category remains strategically important, but Luminate's historical differentiation has narrowed as zero-trust network access, security-service-edge, identity-aware proxying, and secure private application access became standard features of larger platforms. Zscaler, Palo Alto Networks, Cisco, Fortinet, Cloudflare, and specialist vendors such as Tailscale compete through broader ecosystems, identity integrations, endpoint controls, and distribution. Luminate is relevant to defense and national-security analysis because the same least-privilege, application-specific access model can protect sensitive administrative systems, distributed mission teams, and operational technology support channels. However, no public source reviewed here establishes defense or classified-network deployments; the defense case is a technology adjacency, not a claimed customer reference."""
