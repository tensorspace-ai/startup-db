investment_rationale = "Luminate is not an independent investible startup in the database's present-tense sense: Symantec acquired it in 2019, and Broadcom later acquired Symantec's enterprise-security business. The historical record does show credible venture backing, production enterprise customers at launch, and strategic value in zero-trust access. For diligence readers, the relevant lesson is an acquisition case study and a technology lineage, not a current financing or ownership opportunity. Current product continuity, standalone economics, personnel, and customer concentration require confirmation from Broadcom and cannot be scored as if Luminate were still operating independently."
strategic_value = "Luminate is strategically useful as a historical Israeli cybersecurity exit and as an example of application-centric access becoming part of a larger enterprise-security platform. Its technology addresses a persistent security problem: giving a specific user access to a specific resource while reducing exposure of the surrounding network. That pattern is relevant to enterprise, critical-infrastructure, and defense architectures, but the record contains no verified defense deployment. The principal current value is analytical—understanding zero-trust adoption, platform consolidation, and acquisition integration—not direct access to an independent supplier."
