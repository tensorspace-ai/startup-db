name = "Caligo Systems"
description = "Caligo Systems develops an OT/IIoT endpoint-protection platform for industrial control environments. Its public product thesis combines physical-process awareness, application and protocol integrity, secured gateways, and autonomous protection to detect or contain manipulation that could cause operational or physical harm."
detailed_description = """
Caligo Systems is developing a cyber-physical security layer for industrial control systems and Industrial Internet of Things deployments. The company says its platform uses dynamic integrity algorithms and source physical data for real-time detection, protection, and intrusion recovery. Its stated capabilities include authentication and application-data integrity for IIoT protocols, physical-data awareness, secured gateways, and autonomous protection when communications are interrupted. This addresses a real limitation of conventional enterprise security: an OT endpoint can remain reachable and technically functional while issuing commands that are inconsistent with the process it controls. A process-aware control or enforcement layer could therefore identify manipulation that looks legitimate at the network or application level, although the public record does not provide independent test data showing detection rates, latency, or safety behavior.

The target market is the connection of legacy SCADA, controllers, safety-related systems, edge devices, and remote or cloud services. Caligo's website names factories, smart cities, smart buildings, smart traffic, alternative energy, and critical infrastructure as potential verticals. These are commercially important but demanding markets: operators must modernize without disrupting production, compromising safety, or creating an additional operational dependency. The company's claimed multi-vendor, application-agnostic, plug-and-play approach would be commercially useful if it can work across heterogeneous controllers and proprietary protocols with limited tuning. The missing diligence evidence is substantial, including supported equipment, deployment topology, fail-safe and rollback behavior, installation effort, performance overhead, and the extent to which the platform can coexist with existing segmentation, monitoring, remote-access, and safety systems.

Public traction is stronger than a purely conceptual claim but remains early and incomplete. The official site identifies a proof of concept, AlphaC accelerator participation, a partnership with Mekorot, and a U.S.-approved patent. Startup Nation Finder lists Caligo in AlphaC's 2018-2019 cohort at pre-funding stage, while Calcalist reported in 2018 that Caligo was among AlphaC participants launching a pilot with an international company. These sources support development and pilot activity, not recurring revenue, production-scale deployment, customer renewal, or a current financing event. A third-party company profile reports seed funding and a total raised figure, but those figures are not corroborated here by a primary filing or company announcement and should not be treated as confirmed. The company remains a small, privately held Israeli startup with limited current public disclosure; diligence should request current headcount, financing history, patent number and ownership chain, paid versus unpaid pilots, customer references, and evidence of product maintenance and support.

The defense and national-security case is credible as an infrastructure-security adjacency rather than a demonstrated defense program. Water, energy, transport, manufacturing, and emergency systems can be mission-critical, and the same process-integrity and degraded-connectivity mechanisms could apply to military bases, logistics facilities, or other mission-support infrastructure. There is no reliable public evidence in the reviewed material of defense contracts, military customers, classified deployment, or defense certification. Caligo is strategically relevant because cyber-physical disruption can affect safety and continuity, but strategic value depends on proving that its endpoint enforcement catches attacks or unsafe manipulation that established OT visibility, segmentation, secure remote access, and industrial detection platforms do not already address. The strongest outcome would be a validated complementary control with low deployment friction; the weakest would be a narrowly differentiated feature set that cannot overcome incumbent distribution and procurement trust.

Competition is substantial. Claroty, Nozomi Networks, Dragos, Armis, Forescout, and Waterfall Security cover overlapping OT visibility, threat detection, segmentation, secure transfer, and resilience needs, while incumbent automation and control vendors can also bundle security into existing relationships. Caligo's possible edge is its endpoint-centric combination of physical-process checks, integrity enforcement, protected connectivity, and autonomous behavior during loss of communications. That could matter in high-consequence environments where monitoring alone is insufficient, but it remains a hypothesis until validated across multiple vendors and operating conditions. The investment and strategic assessment is therefore evidence-calibrated: attractive technology adjacency and meaningful dual-use relevance, offset by limited disclosure, uncertain commercialization, small-team execution risk, lengthy industrial sales cycles, and the absence of independently verified production traction.
"""
