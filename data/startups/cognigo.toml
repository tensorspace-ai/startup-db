name = "Cognigo"
description = "Cognigo was an Israeli data-security company that used machine learning and natural-language processing to discover, classify, and govern sensitive information across enterprise repositories. NetApp acquired Cognigo Research Ltd. in 2019, so this record describes an acquired technology asset rather than an active independent startup."
detailed_description = """
Cognigo developed DataSense, an AI-assisted data protection and governance platform aimed at the problem of unknown or poorly labeled enterprise information. Public descriptions position the product as a discovery and classification layer for structured, unstructured, and cloud-held data. It was intended to identify personal information, regulated records, intellectual property, and other critical data, then connect those classifications to security or privacy policies. The technical proposition was more ambitious than scanning for a fixed list of strings: contextual language processing and machine-learning models were intended to interpret documents and records, reduce manual tagging, and surface data that conventional inventories missed.

The commercial buyer was likely a combination of security, privacy, compliance, and infrastructure stakeholders. In the 2018 funding announcement, Cognigo framed the product around GDPR and related privacy obligations; contemporary company material also emphasized data governance, breach prevention, and policy enforcement. That makes the product relevant to banks, insurers, healthcare organizations, retailers, manufacturers, and other enterprises with large, distributed data estates, but it does not by itself prove customer scale or recurring revenue. The available public evidence supports a credible enterprise problem and a financed product effort, while leaving deployment breadth, retention, and revenue concentration as diligence questions.

Cognigo competed in a category where discovery, data-loss prevention, privacy management, file analytics, and broader data-governance platforms overlap. Its potential edge was the attempt to classify the meaning and context of content across repositories instead of relying only on repository-specific metadata or manually maintained regular expressions. That edge would have been valuable only if precision, explainability, integration coverage, and remediation workflows were good enough for production use. Larger vendors such as Microsoft, Varonis, BigID, OneTrust, and Informatica could offer wider suites, distribution, or adjacent controls, creating substantial pressure on a small independent vendor.

NetApp's SEC filings state that it acquired all outstanding shares of Cognigo Research Ltd. on May 23, 2019 for $53 million in cash and describe the acquired business as a provider of data-discovery classification software designed to manage and protect critical data. The acquisition is a strong commercialization and strategic-validation signal, but it also changes the interpretation of every current field: Cognigo should not be treated as an investible standalone company, and its historical employee count, product availability, and roadmap should not be presented as current operating facts. The company website now times out in the local check and no active canonical company site could be verified.

The dual-use case is substantive but bounded. Data discovery, classification, and policy orchestration can help public-sector or defense organizations locate sensitive material, reduce accidental exposure, and improve handling controls across mixed environments. However, public sources do not establish a defense deployment, military contract, classified-environment accreditation, or mission-specific capability. Cognigo is therefore strategically relevant as an enabling data-security and governance technology, not as evidence of a defense product or a validated national-security program.
"""
