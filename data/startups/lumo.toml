name = "Freightos"
description = "Freightos is a public digital-freight infrastructure company whose vendor-neutral network connects carriers, freight forwarders, shippers, and importers for freight pricing, procurement, booking, payment, and market intelligence. The available evidence does not establish Lumo as a distinct Freightos product or legal entity, so this record is normalized to the canonical company represented by the website."
detailed_description = """
Freightos operates a vendor-neutral digital network for international freight rather than a narrow shipment-tracking application. Its public materials describe software and marketplace workflows spanning rate discovery, quoting, procurement, booking, payment, and market intelligence across air, ocean, and ground freight. The company connects carriers, freight forwarders, and shippers, while products such as WebCargo, Freightos Marketplace, and Freightos Data address different parts of the freight commercial workflow. There is no reliable public evidence in the reviewed sources that “Lumo” is a separate company or branded core product; the practical subject of this record is therefore Freightos Limited.

The commercial problem is a fragmented, often manually operated freight market in which rates, capacity, schedules, surcharges, and shipment events sit across carriers, forwarders, spreadsheets, portals, and email. Freightos attempts to make that information machine-readable and actionable inside a transaction workflow. Its official site reported 425,000 transactions, 79 carrier partners, 20,600 unique buyer users, and $343 million in gross booking value for the first quarter of 2026. Those figures are company-reported operating indicators, not proof of durable profitability, but they do support the conclusion that this is a scaled operating platform rather than an early experiment.

The potential moat is network and workflow density more than a singular breakthrough algorithm. Carrier and forwarder integrations, normalized rate and schedule data, transaction history, and market benchmarks can improve quoting, procurement comparisons, and operational decisions as participation grows. The same structure creates execution risk: data quality, carrier coverage, schedule reliability, and the willingness of customers to transact digitally determine whether network effects are real. Competitors including project44, FourKites, Descartes, Xeneta, Flexport, and incumbent transportation-management systems can attack individual layers, so Freightos must keep its integrations, data products, and embedded workflows valuable enough to resist substitution.

The defense and national-security case is credible but indirect. Commercial freight visibility, rate intelligence, port-congestion monitoring, and disruption analysis could support sustainment planning, sealift or air-cargo coordination, humanitarian logistics, and critical-infrastructure resilience. Nothing in the reviewed public sources establishes defense contracts, classified workloads, or military deployment. Any government use would therefore require diligence on data provenance, access control, auditability, segregation of customer data, availability during disruption, export and procurement constraints, and the distinction between public market intelligence and sensitive operational information.

Commercial diligence should test whether growth converts into recurring software economics or remains sensitive to freight volumes, rates, and transaction take rates. Important questions include customer retention, gross-margin progression, carrier concentration, the economics of marketplace versus SaaS products, the defensibility of Freightos Data benchmarks, and the cost of maintaining global integrations. As a Nasdaq-listed company, Freightos is a public-market strategic reference rather than a conventional venture-stage startup. Its strongest relevance to this database is as an example of digital infrastructure for global logistics, with a potentially useful but unproven adjacency to defense supply-chain resilience.
"""
