name = "Hirundo"

description = "Hirundo develops a machine-unlearning platform that evaluates trained AI models and selectively removes unwanted data traces or behaviors without requiring full retraining. Its product targets model builders and enterprises that need measurable remediation for privacy, safety, security, and data-quality failures."

detailed_description = """
Hirundo is building infrastructure for machine unlearning: the post-training modification of a model so that specified data, concepts, or behaviors have materially less influence, while retained capabilities are tested for regression. Its public product positioning spans two related workflows. LLM unlearning addresses behaviors such as jailbreak susceptibility, bias, hallucination tendencies, and memorized personally identifiable information; data-quality tooling addresses mislabels, outliers, and other defects in vision, radar, LiDAR, time-series, speech-to-text, and NLP datasets and models. The company describes a workflow that detects or evaluates a risk, targets the relevant model parameters or representations, applies a modular edit, and measures both forget performance and retained utility.

The customer problem is credible but technically demanding. Model teams currently choose among guardrails, filtering, fine-tuning, or full retraining when a deployed model contains a privacy problem, an unsafe behavior, poisoned data, or a quality defect. Hirundo’s proposed advantage is shortening that remediation loop from a large retraining project to an evaluated edit that can run on standard GPU infrastructure. The company advertises up to 85% fewer successful prompt injections, up to 70% lower bias on stated benchmarks, and complete removal of fine-tuned PII in particular evaluations; these are company-reported results and should be independently reproduced across architectures, datasets, attack suites, and operating conditions before being treated as general performance guarantees. Its public materials also describe SaaS, VPC, Kubernetes, S3-compatible, and air-gapped deployment options, which are relevant to regulated and security-sensitive buyers.

Commercially, Hirundo sits at the intersection of AI security, model governance, data quality, and post-training infrastructure. Its stated buyers include AI and product teams, security and privacy teams, and frontier-model or AI research labs. Public evidence includes a reported $8 million seed round in June 2025 led by Maverick Ventures Israel, public testimonials from Intel Ignite and Taranis, model and dataset artifacts on Hugging Face, and references to work on open-weight models including Liquid AI and Gemma. LinkedIn lists the company as a privately held Tel Aviv software company founded in 2023 with an 11–50 employee range. These signals indicate meaningful technical and ecosystem activity, but they do not establish recurring revenue, production scale, customer concentration, or the durability of the claimed benchmark improvements.

The competitive field includes model-monitoring and AI-security vendors that detect risks, guardrail and firewall products that block problematic outputs, internal MLOps and evaluation teams, and the continuing substitute of fine-tuning or retraining. Hirundo’s differentiation depends on turning detection into a model-level remediation artifact that is auditable, reversible, and cheap enough to repeat. The defensibility question is whether its influence analysis and weight-editing methods retain precision on larger and changing model families, including cases where knowledge is distributed or behavior is entangled with useful capabilities. A strong enterprise position would require reproducible evaluations, provenance and rollback controls, secure deployment, and evidence that an edited checkpoint remains safe under adaptive red-teaming rather than only on a fixed benchmark.

The defense and national-security relevance is substantive but should be framed as an enabling control, not as evidence of defense contracts. Model unlearning could help sanitize sensitive or export-controlled artifacts before a model is transferred, reduce exploitable behaviors in mission-support systems, remediate data contamination, and support lifecycle governance in disconnected or air-gapped environments. The same capability could also be misused to conceal provenance, remove audit-relevant evidence, or create a false sense that a model is safe because one measured behavior improved. Strategic diligence should therefore focus on cryptographic provenance, change logs, independent validation, authorization boundaries, and the difference between reducing model behavior and proving that information is mathematically or operationally unrecoverable.
"""

