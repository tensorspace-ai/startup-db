name = "Singular Photonics"
description = "Singular Photonics is an Edinburgh-based fabless image-sensor company commercializing single-photon avalanche diode (SPAD) imagers with computation performed at or beneath the pixel array. Its Sirona, Andarta, and Litavis products combine photon detection with timing, histogramming, and signal processing for spectroscopy, scientific imaging, machine vision, and related low-light applications."
detailed_description = """
**Product and the problem it addresses.** Conventional image sensors are designed to produce an intensity image, then leave a host processor to infer depth, timing, motion, or material properties from the captured pixels. That pipeline can discard useful information about when individual photons arrived, creates a large data stream, and becomes less effective when light is scarce, fast events must be resolved, or fluorescence obscures a sample. Singular Photonics sells SPAD-based image sensors intended to retain and process more of that information close to where photons are detected. It has brought three product families to market: Sirona, a 512-pixel line sensor for time-resolved multispectral imaging and microscopy; Andarta, a compact two-dimensional sensor with in-pixel and cross-pixel processing modes; and Litavis, a newer back-side-illuminated, 3D-stacked sensor whose software-configurable modes combine intensity imaging, timing, photon counting, and histograms. These are sensor components and modules for equipment makers and researchers, not complete cameras or turnkey defense systems. The practical promise is more useful measurement in demanding optical conditions, with less raw data to move and reconstruct downstream.

**Core technology and how it works.** A single-photon avalanche diode is a reverse-biased semiconductor junction operated above breakdown. An arriving photon can trigger an avalanche that creates a detectable digital pulse, making it possible to register individual photon events and their arrival times. Standard commercial imagers mostly sum or digitize analogue light signals and typically do not expose all this temporal information. Singular’s differentiating proposition is to combine SPAD arrays with CMOS readout and digital computation close to the detector: photon events can be counted, grouped into histograms, time-gated, correlated, or otherwise summarized on-chip instead of exporting every event to an external processor. The company describes modes including time-correlated single-photon counting, high-throughput time-to-digital conversion, selectable-resolution photon counting, coincidence and windowed detection, and timestamped imaging. Sirona is a line sensor suited to beam-scanned spectroscopy; Andarta supports autocorrelation, gated operation, and burst imaging; Litavis is presented as a programmable platform that can switch sensing behaviour in software. These capabilities can lower bandwidth, latency, and host-processing requirements, but application-level performance depends on photon-detection efficiency, dark-count rate, timing jitter, fill factor, pixel count, optical integration, and the buyer’s measurement task. Product datasheets and customer qualification, rather than broad “4D imaging” language, are the right basis for technical diligence.

**Market, buyers, and route to market.** Singular sells into markets where acquiring more information from weak or time-varying light can improve a measurement: scientific instrumentation, Raman spectroscopy, fluorescence lifetime imaging, diffuse correlation spectroscopy, time-of-flight and depth sensing, machine vision, microscopy, biomedical measurement, quantum sensing, and potentially industrial inspection. The immediate buyer is usually an instrument OEM, systems integrator, research laboratory, or specialist imaging company that can embed a sensor in a calibrated optical and software stack. That component model gives the company access to multiple end markets without manufacturing complete instruments, while making design-in cycles, applications engineering, and long customer qualification central to revenue growth. It has announced a European distribution and support arrangement with AMS Technologies, which supplies photonics components to OEMs, laboratories, and integrators. More concrete product validation came through a collaboration with Renishaw: Singular’s SPAD sensor was integrated into a Raman spectroscopy module to enable time-resolved measurements of highly fluorescent samples. The partnership shows a relevant customer pathway and an application that conventional systems struggle to serve; it does not establish broad recurring volume or a long-term exclusive commercial contract.

**Traction, funding, and third-party validation.** The company reported in August 2026 that it had closed an oversubscribed $2.15 million round led by ACF Investors, with Wren Capital, Cambridge Angels, Scottish Enterprise, Quantum Exponential, and Old College Capital participating. The stated use is to expand engineering capacity and accelerate a new generation of sensors. Singular said its sales in the first part of 2026 had already reached twice its full-year 2025 sales and that it was approaching break-even; those are company-reported indicators, with no absolute revenue, customer count, margin, or order-book figure disclosed. The round also brought former Arm CTO Dipesh Patel onto the board, adding semiconductor product and industry experience. Independent and institutional validation includes the company’s University of Edinburgh spinout origins, a 2023 Converge competition finalist position, a distribution relationship with AMS Technologies, and the Renishaw instrumentation collaboration. The company announced CE marking for Sirona and Andarta and ISO 9001 certification following an audit by BSI. The CE claim is the company’s disclosure, while the ISO announcement describes the certifying auditor; neither certification by itself proves performance in every application or military qualification. Companies House records confirm a continuing Scottish company and recent capital allotments, but do not supply a public valuation or enough detail to independently reconstruct the announced financing terms.

**Founders and technical base.** Singular grew out of the University of Edinburgh’s CMOS Sensors and Systems group, whose work on SPAD imaging extends over roughly two decades. The university identifies co-founders Robert Henderson, an electronic-engineering professor and pioneer in nanometer-CMOS SPAD sensors; Dr. Aravind Venugopalan, a School of Engineering PhD graduate and former Royal Academy of Engineering Enterprise Fellow who became CTO; Dr. Neil Finlayson, a former research fellow who became an applications scientist; and Shahida Imani, the company’s CEO. Henderson’s earlier sensor research contributed to time-of-flight sensing methods now used in smartphone autofocus, giving the business a research lineage with a demonstrated history of transfer into commercial imaging. Imani brings company leadership, financing, and commercialization experience rather than an academic optics profile; the combination of lab-origin IP and a dedicated commercial CEO is relevant in a component business where customer engineering matters as much as detector physics. In 2026 the company added Dipesh Patel, after a 25-year career at Arm culminating in CTO, to its board. Public sources do not establish current headcount, the size of its engineering team, or the exact allocation of licensed university IP and subsequent company-owned inventions. Those are important diligence topics for evaluating execution capacity and defensibility.

**Competitive dynamics and differentiation.** Singular competes in a specialized but active sensor market rather than against one direct, like-for-like product. Sony, STMicroelectronics, and Canon develop SPAD or direct time-of-flight image sensors at much larger semiconductor scale; Hamamatsu Photonics and Excelitas sell sensitive photodetectors and scientific imaging components; Pi Imaging Technology and other specialist suppliers target SPAD cameras and research systems. CMOS image-sensor vendors, silicon photonics approaches, intensified cameras, avalanche photodiodes, conventional CMOS cameras, and software-based reconstruction can all substitute for some applications. Singular’s strongest defensible claim is not simply “SPAD sensitivity,” because other firms make SPAD devices. It is that programmable timing, histogramming, correlation, and related compute are integrated close to the pixel array, paired with a product and firmware layer that an instrumentation buyer can adopt. Its lineage in Edinburgh’s sensor research, its product-specific designs, and collaborations with Renishaw and AMS provide routes to credibility and access. The risks are meaningful: large semiconductor incumbents can draw on fabrication scale and existing OEM relationships, while small specialist customers may require extensive bespoke engineering. The moat will depend on reproducible sensor performance, ease of integration, patents and licensing rights, yield, support, and whether customer designs remain with Singular as volumes rise. Public sources do not establish granted patent coverage or a cost advantage.

**Security and resilience relevance.** The case for inclusion in a strategic-technology database is allied sensing infrastructure and enabling dual-use potential, not a claim that Singular is an Israeli firm or a defense supplier. Low-light photon counting, precise time-of-arrival measurement, time-of-flight depth, and on-chip reduction of sensor data are relevant to commercial inspection and scientific instruments; similar underlying functions can support secure perimeter sensing, laser ranging, optical communications testing, night-time machine vision, autonomous navigation, and detection of short-lived optical events. Sensors that reduce dependence on high-power illumination or host-side processing may also help build compact, low-latency systems where power and communications are constrained. This is an adjacency only: the company’s disclosed customers and partnerships are commercial and research oriented, no defense contract or military deployment is public, and its products are not described as ruggedized, radiation tolerant, jam resistant, or qualified for operational systems. For Israel-focused screening, its value is as a UK allied photonics and semiconductor reference whose technology and supplier relationships intersect with global sensing supply chains. Any defense use would require application-specific testing, security controls, export review, and evidence of sustained operation in the intended environment.

**Stage, trajectory, and diligence risks.** Singular is best classified as early-stage: it has shipped market-facing sensor products, achieved regulatory and quality milestones, secured distribution and a named instrumentation collaboration, raised a modest growth round, and reports early commercial momentum, but has not disclosed scale revenue, production volumes, or repeatable multi-customer deployments. The near-term trajectory is to turn research-derived architectures into dependable components with sufficient yield, customer support, and manufacturing capacity, while extending the product portfolio and converting prototype evaluations into OEM design wins. The reported approach to break-even is encouraging but needs absolute sales and cash-flow data to judge runway and capital needs. Principal risks are semiconductor development and fabrication execution; long design-in and qualification cycles; concentration in a few early customers or applications; competing SPAD and alternative sensor products from larger suppliers; uncertain IP ownership and licensing terms; limited transparency around headcount, revenue, production yield, and order backlog; and the gap between commercial sensor claims and defense-relevant qualification. The strongest next signals would be named follow-on OEM integrations, repeat orders, measured benchmarks against alternative SPAD sensors, production and yield data, expansion of the distributor network, and evidence that the company can maintain attractive economics as it scales.
