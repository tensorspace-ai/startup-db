name = "OpenLegacy"
description = "OpenLegacy is a privately held enterprise-software company that helps organizations expose, integrate, and incrementally modernize mainframe, IBM i, and other legacy application assets. Its OpenLegacy Hub combines metadata-driven API and service generation with dependency-aware planning so customers can modernize without a single disruptive rewrite."
detailed_description = """
OpenLegacy sells OpenLegacy Hub, a legacy-modernization platform organized around discovery, planning, integration, and phased migration. Its current product material describes Modernization Planner for visualizing dependencies and sequencing modernization waves, and Integration Studio for modeling programs, screens, jobs, and data as versioned metadata. The platform can generate deployable REST, SOAP, Kafka, MQ, gRPC, and other service artifacts from CICS/IMS transactions, COBOL and RPG programs, 3270/5250 screens, databases, files, and packaged applications. It supports no-code, low-code, and full-code workflows, with outputs such as OpenAPI/AsyncAPI definitions, containers, Helm/YAML, serverless bundles, and gateway configurations.

The commercial problem is concrete: banks, insurers, retailers, manufacturers, and public-sector operators still depend on systems whose business logic is valuable but difficult to connect to digital channels. OpenLegacy’s proposed alternative to a big-bang rewrite is to create a governed coexistence layer. Direct connectivity, reusable mappings, contract-first APIs, CI/CD integration, testing and mocks, and resilience controls can let modern teams work against legacy capabilities while the underlying estate is rehosted, refactored, or replaced over time. The security and governance feature set described by the company includes OAuth2/OIDC, mutual TLS, RBAC, audit logs, PII masking, field-level protection, policy enforcement, and versioned metadata; these are relevant requirements for regulated production environments, although buyers should validate the exact controls, deployment model, and certifications during diligence.

OpenLegacy operates in an attractive but crowded category. Alternatives include IBM z/OS Connect and other incumbent mainframe tools, API-management and iPaaS suites from Salesforce/MuleSoft, Boomi, and Software AG, specialist products from Rocket Software and GT Software, and large system integrators that can build bespoke modernization programs. OpenLegacy’s differentiation is therefore not simply “APIs for old systems”; it is the combination of legacy-specific connectors, dependency and decoupling patterns, generated artifacts, and a stated avoidance of proprietary runtime lock-in. That specialization can reduce implementation friction for complex estates, but the company must prove that automation produces reliable results across heterogeneous codebases and that customers expand beyond one-off services projects.

Public commercialization signals are meaningful but incomplete. The company’s official site says it has worked with enterprises since 2013 and displays customer references across financial services, insurance, and other industries. Its newsroom records a July 2025 OpenLegacy Hub launch supported by AWS, marketplace availability in an AI Agents and Tools category, and a March 2026 OpenLegacy Japan/Deloitte Tohmatsu alliance. These announcements support an active go-to-market motion and ecosystem relevance, but they do not establish revenue, retention, deployment scale, funding totals, or independent product-performance results. The company remains privately held, so those items are important diligence gaps.

The dual-use case is credible but indirect. Defense ministries, civil agencies, utilities, transportation operators, and other security-sensitive organizations often need to connect old logistics, personnel, identity, maintenance, or mission-support systems to modern applications while preserving continuity. OpenLegacy’s ability to expose legacy transactions, stream data into analytics or AI systems, and support hybrid or on-prem deployment could help in those settings. However, the public evidence reviewed is overwhelmingly commercial and enterprise-IT oriented; there is no basis here to claim defense contracts, classified deployments, or defense-specific certifications. Strategic relevance should therefore be treated as enabling infrastructure adjacency, with procurement, isolation, supply-chain assurance, and operational-resilience requirements verified case by case.
"""
