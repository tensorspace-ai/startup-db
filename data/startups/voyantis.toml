investment_rationale = "Voyantis shows credible commercial traction signals: a named enterprise customer base, a product integrated into major advertising workflows, and a reported $41M 2025 financing that brought total funding to $60M. Its technical problem is valuable where downstream customer economics matter, and the business may have an execution-based moat in signal design and deployment. However, this database's priority signal is intended for companies with strong dual-use or deep-tech strategic fit. Voyantis has no substantiated defense or national-security application in the available evidence, and its commercial moat remains exposed to native ad-platform features, privacy changes, and in-house replacement. The flag is therefore false despite meaningful commercial diligence interest."
