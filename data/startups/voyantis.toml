name = "Voyantis"
description = "AI decisioning platform that predicts customer value from first-party data and turns those predictions into calibrated signals for acquisition, activation, retention, and re-engagement campaigns."
detailed_description = """
Voyantis is an Israeli applied-AI software company founded in 2020 by Ido Wiesenberg and Eran Friendinger. Its product addresses a practical weakness in performance marketing: ad networks can optimize rapidly for an observable conversion, but the conversion may be a poor proxy for the revenue, retention, repeat orders, deposits, upgrades, or other downstream value that a business actually wants. Voyantis ingests first-party behavioral and business data, predicts a user's future value early in the journey, and converts that prediction into an action that a growth team or advertising platform can use.

The product has evolved from a predictive lifetime-value tool into an AI decisioning and signal-engineering layer. The official site describes three linked steps: prediction, signal engineering, and activation. Models are deployed for a customer's business and retrained as new behavior arrives; the resulting signals are encoded, calibrated, timed, and de-biased for the learning behavior of Google, Meta, and TikTok. Voyantis also describes separate model variants by ad network, API-based deployment into existing data infrastructure, mobile-measurement-partner connectivity, and a broader Engage product for activation, upsell, churn prevention, retargeting, and win-back. The differentiation is therefore not simply an LTV score. It is the operational loop between a forecast, platform-specific signal design, campaign feedback, and a next-best action.

The commercial buyer is a growth, user-acquisition, lifecycle-marketing, or data team with meaningful acquisition spend and a monetization window longer than the ad platform's native optimization window. Published verticals include fintech, consumer apps, food delivery, ride-sharing, streaming, real estate, SaaS and product-led growth, and retail. Voyantis's website names or displays brands such as Miro, Uniswap, Semrush, Rappi, Opendoor, MoneyLion, Current, Klar, and Lennar, and publishes case studies reporting outcomes such as lower CAC, higher ROAS, more repeat purchasers, or improved renewal. These are vendor-controlled claims rather than audited financial evidence, but they are useful traction signals. In a January 2025 founder update, Voyantis said ARR had tripled in each of the prior two years; that claim warrants diligence on revenue quality, cohort retention, gross margin, and the share of results attributable to media spend or customer mix.

The competitive field includes in-house data-science and marketing-engineering teams, native value-optimization products from Google, Meta, and TikTok, predictive marketing platforms such as Pecan AI, customer-data activation tools such as Hightouch and Segment, and adjacent experimentation, personalization, and lifecycle vendors. Voyantis's potential edge is accumulated implementation knowledge: translating predictions into the precise values, timing, event schemas, guardrails, and feedback loops that each ad network can learn from. That edge can create workflow and performance lock-in, but it is not necessarily a durable model moat. Large customers may build similar systems, platforms may add more native downstream-value optimization, and privacy or attribution changes can reduce the data available for reliable modeling.

For defense and national security, the case is weak. The underlying methods—behavioral prediction, value scoring, experimentation, and automated decisioning—are general-purpose, but the company's product and go-to-market are directed at commercial growth marketing. There is no reliable public evidence here of defense customers, government contracts, mission-specific security workflows, or a core capability in cyber, intelligence, autonomy, sensing, or operational logistics. Voyantis is consequently best classified as a commercial AI / marketing-technology startup with an indirect technology adjacency, not as a substantive dual-use company. Its strategic relevance is stronger for understanding applied ML commercialization and Israeli B2B software than for a defense-focused portfolio.
"""
