name = "Descope"
description = "Descope is a customer and agentic identity platform that gives product and security teams visual workflows, SDKs, and APIs for authentication, authorization, identity lifecycle management, and access control across applications, AI agents, and MCP servers."
detailed_description = """Descope provides external identity and access management (IAM) for customer, partner, and machine identities. Its product combines a visual workflow builder with SDKs and REST APIs, allowing developers to assemble and change signup, login, passwordless, MFA, step-up, SSO, and recovery journeys without owning every identity service in-house. The platform also includes user and tenant administration, identity federation, provisioning, audit-oriented controls, and fine-grained authorization. This is a meaningful product boundary: external IAM has to support branded, conversion-sensitive user journeys while still satisfying security and enterprise integration requirements.

The current product direction extends that control plane to agentic systems. Descope markets an Agentic Identity Hub for AI agents and MCP servers, including authentication, consent, credential and token management, scope-based authorization, dynamic client registration protections, and audit visibility. Its June 2026 announcement describes identities for autonomous, non-interactive agents that receive scoped, policy-backed access and produce activity trails. The underlying security problem is credible: an agent operating for one tenant or user must be distinguishable from another agent, restricted to the right resources, and revocable without relying on shared API keys. This creates a plausible adjacency to machine identity and workload authorization, although the product's real defensibility will depend on policy depth, integrations, and operational evidence rather than terminology alone.

Descope sells into a crowded but durable market. B2C applications need low-friction onboarding, passkeys, social login, and account-takeover defenses; B2B SaaS products need tenant-aware SSO, SCIM, delegated administration, and granular permissions; platform companies increasingly need one identity model across web, mobile, partner, and automated workflows. Descope's stated wedge is speed and adaptability: teams can start with low-code flows, retain code-level control through SDKs and APIs, and modify journeys without redeploying the application. That can be valuable where identity requirements change frequently or where an incumbent suite is too heavy, but it competes against strong distribution from Okta/Auth0, Microsoft, AWS, and cloud-native developer tools.

Public company materials report a 2022 founding, $53M of seed funding announced in 2023, and an expanded seed round bringing total funding to $88M in 2025. The official site also publishes customer stories and identifies organizations including GoFundMe, Databricks, GoodRx, Navan, and You.com as users or referenced customers; these are useful traction signals but do not substitute for diligence on revenue, retention, deployment size, or customer concentration. The company remains privately held and early relative to established IAM vendors. Important commercial questions include whether workflow flexibility converts into durable enterprise expansion, how much advanced authorization and agentic functionality contributes to revenue, and whether support, compliance, and fraud-prevention costs preserve attractive gross margins.

The defense and national-security case is an adjacency, not evidence of government adoption. Strong authentication, phishing-resistant access, federation, least-privilege authorization, and auditable machine identities are relevant to zero-trust architectures and defense-adjacent software ecosystems. Descope could be strategically useful in government-facing digital services, contractor portals, or multi-tenant platforms if it can meet the necessary data residency, assurance, deployment, logging, incident-response, and procurement requirements. No public evidence in the reviewed sources establishes defense contracts or certified deployment, so the dual-use score reflects credible technical transfer potential with substantial diligence still required."""
