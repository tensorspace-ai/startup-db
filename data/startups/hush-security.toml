dual_use_description = "Secretless machine identity architecture is substantively dual-use. Commercial cloud operators and enterprises require non-human identity security to secure microservices, APIs, and containerized workloads against credential compromise and sprawl. Government and defense systems have identical requirements plus additional constraints: zero-trust compliance (NIST SP 800-207), auditability for high-assurance systems, and the ability to operate in air-gapped or restricted environments. The policy-driven, runtime-asserted approach is particularly valuable in national-security contexts because it enables cryptographic verification of identity without relying on external secret stores or network-dependent vault systems. AI and autonomous system governance is an emerging use case where runtime identity assertion and policy enforcement are critical for safe deployment in both commercial and defense-critical applications."
