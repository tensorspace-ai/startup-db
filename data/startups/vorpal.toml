name = "Vorpal"
description = "Vorpal Ltd. develops VigilAir, a passive RF-based system that detects, geolocates, tracks, and helps mitigate drones and their operators. Its customers and target markets span aviation, public safety, critical infrastructure, UAS traffic management, and defense and homeland-security operations."
detailed_description = """Vorpal is an Israeli signal-analysis company whose flagship product, VigilAir, builds a drone airspace picture from a distributed network of passive radio-frequency sensors and a command-and-control center. The system listens to drone command-and-control and data links rather than transmitting, then applies proprietary signal processing and TDOA-style geolocation to detect, identify, locate, and track drones and, where supported, their operators. The company also describes product extensions for telemetry extraction, identification friend-or-foe, and drone takeover or neutralization. Its architecture is notable for combining specialized RF algorithms with commercial off-the-shelf computing, fixed installations, and ruggedized mobile deployments.

"The clearest customer problem is low-altitude airspace awareness in places where radar, cameras, or acoustic sensors are constrained by terrain, buildings, weather, clutter, or cost. Vorpal positions VigilAir for airports and aviation operators, police and public-safety agencies, prisons, critical infrastructure, military and homeland-security users, and UAS traffic-management environments. The official product material describes a distributed sensor layout, wide-area coverage, dense-urban operation, and passive monitoring; an older company datasheet gives illustrative ranges and performance figures, but those should be revalidated before being treated as current product specifications. Commercial use can include airport safety, protection of sensitive sites, drone-traffic management, and incident investigation."

"Public evidence indicates a more mature operating history than the prior 2023/seed record implied. Vorpal’s LinkedIn company profile says it was established in 2016, lists Tel Aviv headquarters and 11–50 employees, and describes VigilAir as TRL 9 and operated at selected sites in the United States, United Kingdom, Europe, and Israel. The company’s own site remains live and presents VigilAir as an active product. Microsoft also documented a 2019 AT&T/Microsoft edge-cloud test involving Vorpal’s drone-tracking sensors. These are meaningful commercialization and deployment signals, but the public record does not establish current recurring revenue, present customer count, recent financing, or the status of every earlier deployment. Older public collateral gives inconsistent founding dates, so the 2016 value should be treated as the strongest current company-profile signal rather than an audited incorporation date."

"Competition is broader than autonomous-mission software. Vorpal competes with dedicated counter-UAS and RF-detection vendors such as D-Fend Solutions, Sentrycs, WhiteFox Defense Technologies, Dedrone, and DroneShield, as well as radar-, electro-optical-, acoustic-, and integrated-defense substitutes from larger suppliers. Its potential differentiation is passive operation, RF geolocation in dense urban environments, operator tracking, and the ability to combine fixed and mobile deployments. Those advantages depend on signal coverage, drone-library freshness, performance against autonomous or non-emitting drones, integration with response systems, and the ability to prove low false-alarm rates in each operating environment."

The defense and national-security relevance is substantive but should be scoped accurately. VigilAir can support military base and perimeter protection, airport and critical-site security, law-enforcement airspace monitoring, and situational awareness around public events. It is a sensing and response-enablement layer, not evidence of a complete autonomous weapons or mission-control platform. The commercial and defense architectures are closely related, which supports a genuine dual-use classification. Diligence should focus on current product status, validated performance against modern low-cost and autonomous drones, procurement references, export-control obligations, recurring support economics, and whether the company has sufficient engineering and field-service capacity to compete against well-funded C-UAS vendors."""
