name = "ViAqua Therapeutics"
description = "ViAqua Therapeutics is an Israeli aquaculture-biotechnology company that has built an orally delivered RNA-interference (RNAi) platform — administered through ordinary shrimp feed — to protect farmed shrimp against devastating viral disease, beginning with White Spot Syndrome Virus, positioning it as a food-security and protein-supply-chain resilience play rather than a defense company."
detailed_description = """
**Product and the concrete problem it solves.** ViAqua Therapeutics attacks one of the most expensive and least-solved problems in global aquaculture: viral disease in farmed shrimp. Shrimp are among the world's fastest-growing sources of animal protein, but the industry loses an estimated 10–20% of production to disease every year, and White Spot Syndrome Virus (WSSV) alone is repeatedly cited as causing on the order of $3 billion in annual losses and roughly a 15% reduction in global shrimp output. The deeper problem is biological and logistical at once: shrimp and other invertebrates lack the adaptive immune system that makes conventional vaccines work, and even where a treatment exists, there is no practical way to inoculate billions of individual animals in a pond. ViAqua's answer is a prophylactic, feed-borne biologic — a treatment that farmers do not inject or bathe but simply feed. Its lead product incorporates a disease-targeting RNA payload into standard shrimp feed, so protection is delivered through the animals' normal feeding behavior at commercial scale. CEO and co-founder Shai Ufaz has framed oral delivery as "the holy grail of aquaculture health development," precisely because it sidesteps the impossibility of individual vaccination while lowering the operational cost of disease management.

**Core technology and how it actually works.** The scientific core is RNA interference — a sequence-specific gene-silencing mechanism — repurposed as an anti-viral tool for shrimp. ViAqua designs RNA that targets and silences genes essential to the pathogen (its first product is oriented against WSSV), so that when the animal is challenged, viral replication is suppressed and resistance improves. The hard, defensible part is not the RNAi biology in the abstract but *oral delivery*: naked double-stranded RNA is fragile and would normally be degraded in the gut before it could act. ViAqua's contribution is a proprietary particle/encapsulation approach that protects the RNA through digestion and enables uptake when the payload is mixed into feed and eaten. This is what converts an elegant laboratory mechanism into a field-deployable product that can ride existing feed-manufacturing infrastructure. The platform is explicitly described as extensible: the same oral-RNAi chassis is intended to address additional shrimp pathogens and, over time, other shellfish (crab, lobster) and small fish species — meaning the WSSV product is a beachhead for a broader animal-health platform rather than a single-shot therapeutic. The precise formulation chemistry, dosing, and efficacy data are proprietary and only partially disclosed publicly and should be a central diligence focus.

**Market, customers, and go-to-market.** ViAqua sells into the global shrimp-farming complex — concentrated in Asia and Latin America, with India, Ecuador, Thailand, Vietnam, China and Indonesia as anchor producing geographies — where disease is the single largest uncontrolled cost. Rather than build its own feed distribution, ViAqua chose a channel-partner go-to-market that is unusually strong for a company its size: it entered a joint development and marketing agreement with **Skretting**, the aquafeed division of **Nutreco**, one of the largest animal-nutrition companies in the world. Under that arrangement Skretting incorporates and delivers ViAqua's solution through feed, leveraging Nutreco/Skretting's feed technology, regulatory footprint and global reach into shrimp regions. Public reporting has indicated a commercialization path that moved production from pilot scale in Israel to a larger facility in Slovenia and then a technology transfer to a manufacturing partner in India, with early market introduction targeted for producing countries such as Thailand and Ecuador. If those milestones hold, ViAqua's addressable channel is effectively the installed base of a global feed major — a meaningful de-risking of an otherwise slow, fragmented aquaculture sales motion.

**Traction, funding, and third-party validation.** ViAqua's strongest external validations are its strategic backer and its lead round. In September 2023 the company announced an **$8.25 million round led by S2G Ventures**, with participation from **Rabo Ventures, The Trendlines Group, Agriline, Nutreco, I-Lab Angels and Circle Investments** — following an earlier, smaller round (reported at roughly $4.3 million). The Nutreco relationship is the most telling signal: Nutreco took a meaningful minority stake described as able to grow conditionally over time, an unusually deep commitment from a strategic feed incumbent that also serves as ViAqua's commercialization partner. Institutional roots run through **The Trendlines Group** and the **Technion – Israel Institute of Technology**, and the company's scientific advisory bench includes Technion's Prof. Avi Schroeder, a recognized figure in RNA and nanoparticle drug-delivery research. The honest calibration is that ViAqua is thinly capitalized relative to a global commercialization ambition, disclosed funding is now a few years old, and independent, quantified field-efficacy and revenue data are not established in the public record; the validation is qualitative (a top-tier feed partner) more than financial-scale.

**Founders and team background.** ViAqua was **founded in 2014** and is led by **CEO and co-founder Shai Ufaz, Ph.D.**, a molecular biologist, alongside co-founder **Shai Einbinder, Ph.D.**, whose expertise is in marine biology — a founder pairing that maps neatly onto the company's two hard problems (RNA/particle science and aquaculture biology). The company is small — third-party databases place headcount in the mid-teens (roughly 14–16 people, within an 11–50 band) — and is based in Israel, with public listings pointing to a **Technion City / Gutwirth Park, Haifa** address consistent with its Technion origins. The broader team and advisory structure (VP Business Development, Operations, an R&D director, active directors and the Schroeder advisory link) suggests a lean, science-heavy organization built to license and partner rather than to vertically integrate manufacturing and distribution — appropriate given the Skretting alliance, but it also means execution depends heavily on partners.

**Competitive dynamics.** ViAqua sits in an aquaculture-health field where the incumbent playbook is genetics, functional feeds, probiotics and biosecurity rather than a targeted anti-viral biologic. (1) Against shrimp-**genetics and specific-pathogen-free broodstock** approaches (Benchmark Genetics/Benchmark Holdings, Hendrix Genetics/Shrimp Improvement Systems) it competes as a complementary in-pond protection layer rather than a breeding solution. (2) Against **diagnostics and health** players (Genics and its shrimp multi-pathogen testing) it is downstream — treatment versus detection. (3) Against **functional-feed and additive incumbents** (including Nutreco/Skretting's own nutrition portfolio, ADM, and probiotic suppliers) it offers mechanism specificity that generic gut-health additives cannot claim — while partnering with one of those very incumbents for distribution. (4) Against **animal-health primes** (Zoetis, Merck Animal Health, Elanco) that could extend aquaculture vaccine/therapeutic franchises, ViAqua's edge is a working oral-delivery route for invertebrates that vaccines cannot serve. (5) Against agricultural **RNAi peers** (e.g., GreenLight-style RNA-for-agriculture efforts) it is differentiated by the aquatic oral-delivery particle and species focus. The core defensibility question is whether the oral-delivery IP and regulatory head-start hold as larger players notice the category.

**Defense, security, and resilience relevance (calibrated).** ViAqua is **not** a defense or dual-use company in the kinetic or cyber sense, and it would be a mistake to force that framing — its dual_use flag is set to false deliberately. Its strategic relevance is instead through the **food-security and supply-chain-resilience** lens that Claw & Talon's thesis explicitly includes. Shrimp and farmed seafood are a globally traded, protein-security-relevant commodity, and epizootic viral disease is a systemic shock that can wipe out national production seasons, spike prices and disrupt export economies. A feed-delivered biologic that raises herd-level resistance to a catastrophic pathogen is, in effect, biosecurity infrastructure for a strategic protein supply chain — adjacent to, but not the same as, defense. The most credible resilience claims (biosecurity for hatcheries and broodstock, antibiotic-free disease control that protects export-residue compliance, and extensibility to other pathogens and species) are real platform directions; the weakest framing to avoid is any suggestion of a defense or national-security application, which the evidence does not support.

**Growth stage, trajectory, and key diligence risks.** ViAqua reads as a **mid-stage** company by product and commercialization maturity but **early** by capitalization — a genuine tension. On one hand it is a decade old, has a differentiated and patent-relevant oral-RNAi platform, a marquee strategic partner in Nutreco/Skretting, and a concrete manufacturing-and-launch pathway through Slovenia and India into Thailand and Ecuador. On the other, disclosed funding is modest and a few years stale, headcount is small, and there is no public, independently verified field-efficacy or revenue evidence at commercial scale. The key diligence risks are: (1) **regulatory** — a novel RNAi feed additive faces jurisdiction-by-jurisdiction approval across major producing countries, a slow and uncertain gate; (2) **efficacy-at-scale** — pond-level, real-world protection can diverge from controlled-trial results; (3) **single-product / single-pathogen concentration** until platform extension is proven; (4) **partner dependence** — commercialization, and much of the value, is tied to Skretting/Nutreco's prioritization; (5) **capital adequacy** — thin funding for a global regulatory and scale-up campaign; and (6) **staleness of public information** — the most recent disclosed milestones predate 2026, so current traction must be re-verified directly. Progression would be evidenced by regulatory clearances in anchor markets, disclosed commercial volumes or revenue through Skretting, independent efficacy data, and platform extension to a second pathogen or species.
"""
