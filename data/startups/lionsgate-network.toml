description = "Lionsgate Network is an Israeli blockchain forensics and crypto intelligence startup that investigates cryptocurrency crime, traces stolen digital assets, and supports law enforcement agencies and terrorism financing investigations using proprietary AI-driven forensics and intelligence methodologies."
detailed_description = """Lionsgate Network is an Israeli startup founded in 2022 by Bezalel Eithan Raviv, a former intelligence officer from Israel's elite Unit 8200. The company operates from Tel Aviv and Delaware, positioning itself at the intersection of blockchain forensics, financial intelligence, and law enforcement. Raviv's background in military intelligence and cybersecurity informed the company's core mission: to investigate and expose cryptocurrency-related financial crime, tracing stolen digital assets, disrupting terrorist financing networks, and supporting law enforcement agencies globally through advanced intelligence methodologies adapted from the intelligence community.

The company's technology and operational approach reflect its intelligence-driven heritage. Lionsgate Network operates using principles similar to covert intelligence operations, combining real-time blockchain monitoring, behavioral pattern analysis, open-source intelligence (OSINT), and advanced forensic analysis. The company's flagship technology platform, "NemesisAI," integrates on-chain blockchain analytics with off-chain intelligence gathering to attribute blockchain activities to real-world entities, reconstruct attack paths, and identify asset flows. Unlike traditional cryptocurrency forensics platforms focused narrowly on transaction tracing, Lionsgate combines behavioral analysis (identifying scammer operational patterns), intelligence-grade reporting suitable for law enforcement and courts, and rapid attribution—enabling decisions on asset recovery feasibility within seconds rather than weeks.

Strategic leadership reflects the company's dual-use significance. In June 2025, Lionsgate Network appointed Dr. Udi Levi, former chief of financial warfare for Israel's Mossad, as a special advisor. This appointment signaled strengthened integration with Israel's intelligence apparatus and underscored the company's focus on counter-terrorism financing, financial sanctions compliance, and high-consequence financial crime investigation. The company's operational network includes partnerships with major law enforcement agencies including the FBI, Department of Homeland Security, Interpol, and Europol. Lionsgate is a registered NATO contractor and is eligible for U.S. federal procurement, reflecting validation of its technical credibility and security posture.

Commercial and operational impact are substantial. The company has demonstrated concrete capabilities in high-profile cases: after the October 7, 2023 attack on Israel, Lionsgate Network's forensic analysis and law enforcement coordination led to the identification and seizure of over $100 million in cryptocurrency linked to Hamas, serving as a proof point for both technological capability and real-world impact on terrorism financing. The company serves a diverse client base including individuals (often non-technical victims of crypto scams), corporations, cryptocurrency exchanges, and governmental agencies worldwide. Beyond crypto recovery services, Lionsgate offers forensic-grade evidence for legal proceedings, serves as an expert witness capability, and provides strategic advisory services on blockchain threat assessment to institutional clients.

Recent expansion activities signal maturation and geographic diversification. In 2025, Lionsgate Network entered a partnership with Algoritha Security Pvt. Ltd in India, formalizing expansion into the Indian cybercrime and digital asset recovery market. This partnership targets emerging hotspots of crypto-based financial fraud including pig-butchering scams, romance fraud, and investment fraud rings operating across borders. The partnership model enables Lionsgate to extend its forensic and recovery capabilities into regions with high incidence of crypto crime and growing law enforcement demand for specialized intelligence and asset recovery services.

The dual-use thesis is credible and well-supported. The core technology—blockchain forensics, behavioral analysis, and financial attribution—serves both commercial cryptocurrency victims and government anti-terrorism financing, sanctions enforcement, and law enforcement missions. The combination of proprietary AI, intelligence methodologies, and direct law enforcement integration positions Lionsgate as relevant to defense and national security stakeholders evaluating platforms for financial crime investigation, terrorism financing disruption, and critical infrastructure protection (where financial systems are a key attack vector). The company's intelligence heritage, high-profile advisory appointments, and NATO contractor status reflect confidence in its relevance to national security and intelligence communities."""
