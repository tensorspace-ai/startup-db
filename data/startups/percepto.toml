dual_use_description = '''
Percepto has credible dual-use potential because its core stack is an autonomous sensing and remote-operations platform. Drone-in-a-box systems, computer vision, geospatial analytics, and low-touch site monitoring are directly useful for industrial security, border-adjacent surveillance, critical-infrastructure protection, disaster assessment, and other safety missions where persistent observation matters more than weapons integration.

That said, the company does not read as a defense-native business. Its public positioning, reference customers, and product language are centered on industrial inspection and operational efficiency, so defense and security use should be treated as adjacency rather than the primary market thesis. The dual-use score is therefore meaningful but not maximal: the technology is relevant, yet the commercial center of gravity remains in civilian infrastructure.

For diligence purposes, the main question is whether the autonomy stack is generic enough to be repurposed without major redesign. If the answer is yes, then Percepto becomes relevant for critical-infrastructure protection, secured industrial campuses, and contingency monitoring in environments where people should be kept out of harm's way. If the answer is no, then the defense value is more about thematic overlap than transferable capability. Based on the public materials, the former appears more likely, but the company still needs a careful use-case-by-use-case review before anyone should assume a defense pipeline.
'''
