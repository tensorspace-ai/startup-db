name = "Centraleyes"
description = "Centraleyes is a privately held cybersecurity software company selling a SaaS governance, risk and compliance platform for cyber risk, control compliance, vendor assessments and executive reporting."
detailed_description = """Centraleyes, formerly CyGov, is an active cybersecurity software company. The official website identifies the operating business as Centraleyes Tech Ltd and describes an AI-powered GRC platform. The current product story centers on first-party risk and compliance workflows, third-party/vendor assessment, an executive-facing Boardview, an AI risk register, regulatory monitoring, and Centraleyes+, a workflow that connects readiness work with participating auditors. The company says its library includes more than 180 frameworks and that automated questionnaires, workflows, evidence organization, and control mapping reduce manual work. Those are vendor statements about product scope and expected value, not independently measured outcomes.

The official site currently lists offices in Hoboken, New Jersey and New York City. Israeli ecosystem records identify Centraleyes as a Tel Aviv-Yafo startup with Israeli company number 515486215. The public evidence therefore supports an Israeli-founded/operating connection alongside a substantial US commercial presence; it does not establish that Israel is the present corporate headquarters. The company’s current site does not publish a founding year, while Startup Nation Finder says it was founded in July 2016 by Yair Solow. The older record’s 2019 date is not supported by the strongest located evidence and should not be carried forward as fact.

Commercially, the product competes in a crowded GRC and cyber risk market. Its value proposition is to bring internal controls, supplier risk, evidence, remediation and board reporting into one platform and make cross-framework work reusable. The site’s partner directory and customer logo/testimonial area show a route to market through security service providers, resellers and audit-oriented partners, including Neurosoft, Cybriant, Wipro and others. A listed testimonial from Neurosoft supports that a partner uses or endorses the platform; it does not establish a named end-customer deployment, recurring revenue, contract size or production scale. The firm publishes no audited revenue, ARR, profitability, burn, runway, contract backlog or current employee count. Historical third-party headcount ranges are too old to use as current traction.

The clearest recent commercial signals are product releases and channel development. Centraleyes+ describes integrated auditor collaboration for SOC 2, ISO 27001 and related programs; the company’s 2025 announcement on LinkedIn introduced this layer. In 2026 company posts describe a strategic investment and ecosystem partnership with Plug and Play and an AI auto-answering agent that proposes assessment responses from stored evidence for user review. These are meaningful product and distribution milestones, but investment amount, instrument, closing date, customer conversion and usage metrics were not disclosed in the located announcement. They do not justify calling the business a Series A company today. The 2026 website’s current marketing also emphasizes agentic AI and regulatory tracking, making older static descriptions stale.

Funding evidence needs cautious treatment. Startup Nation Finder’s legacy profile reports three events: a January 2017 $2.8 million Seed associated with SixThirty, a March 2019 undisclosed Seed associated with CyLon, and a June 2020 undisclosed round associated with MS&AD Ventures. A secondary investor database describes the MS&AD transaction as a convertible note in 2020. Another database places a SixThirty seed in November 2018, illustrating that event dates and classifications are not fully consistent in public datasets. The $2.8 million amount may represent the reported seed or a profile-level total; there is no located company or lead-investor announcement that reconciles it. This dossier therefore records that amount only as an attributed observation, does not add it to a lifetime total, and labels total funding as conflicting. The 2026 Plug and Play announcement is a strategic investment with no public amount or instrument, so it is recorded as an undisclosed event without assuming equity terms.

Competitive alternatives include ServiceNow, Archer, OneTrust, AuditBoard, LogicGate, MetricStream and Vanta, plus specialist cyber risk and compliance vendors and consulting-led programs. Centraleyes may differentiate through combined cyber risk and compliance workflows, reusable control mapping, vendor assessment, partner-enabled audit preparation and a product that targets both security practitioners and executives. Its own competitor pages claim faster deployment and greater usability, but those comparisons are marketing assertions and need customer references and implementation data. Incumbents can bundle GRC into broader platforms and benefit from procurement relationships, integrations, brand trust and large implementation ecosystems. The company must demonstrate that its AI reduces labor without introducing unsupported answers, weak evidence lineage or control-mapping errors.

Technical diligence should examine the provenance and update cadence of framework mappings; integrations and data coverage; risk scoring methodology and calibration; evidence permissions, retention and tenant isolation; model vendors, customer-data use and human review; audit logs; and the security posture for sensitive supplier and government-adjacent data. The AI auto-answering agent should be evaluated for source citations, abstention behavior, hallucination rates and approval gates. No patents or other proprietary IP registrations were verified in this research, so defensibility currently appears to depend primarily on software, mapped content, workflow design, integrations, implementation know-how and distribution. No independent certification or government authorization was verified. Product support for CMMC or FedRAMP frameworks is not itself evidence that Centraleyes holds a certification, authorization to operate, or defense contract.

The company has genuine dual-use relevance at the software capability level: cyber risk measurement, supplier assurance, control compliance and executive reporting can support commercial organizations as well as defense contractors and public-sector entities. However, the available sources substantiate framework support and general customer segments, not military deployments, classified use, defense procurement, export-control handling or operational security outcomes. Its Israeli origin and cyber domain create strategic relevance, while US operations and broad commercial applicability may support international sales. Any defense thesis should therefore remain conditional on proof of procurement, data handling controls, customer references and relevant authorizations.

Investment assessment remains exploratory. Product breadth, a live platform, a visible partner channel and recent AI/product investment are positive signals. Material uncertainties include financing terms and runway, actual revenue and retention, customer concentration, implementation economics, competitive win/loss rates, independent product efficacy, team composition and current ownership. Private cap-table information was not found; no acquisition, public listing or parent company was identified. Before assigning a higher priority, diligence should obtain current customer and revenue cohorts, round documents and cap table, Plug and Play transaction details, model safety evidence, security certifications, and references for any public-sector or defense usage. Scores below reflect an early evidence base rather than a recommendation."""
