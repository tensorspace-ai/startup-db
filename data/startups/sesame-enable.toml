competitive_edge = """Sesame’s historical distinction was that it aimed to control ordinary mobile applications with a built-in camera rather than requiring a dedicated eye tracker or custom switch hardware. That made the approach potentially cheaper, less conspicuous, and easier to distribute through standard phones. It did not remove the practical limits of camera placement, lighting, involuntary movement, calibration, fatigue, or operating-system permissions. Apple’s built-in head and eye tracking and voice controls now offer native alternatives; Android’s Voice Access and Switch Access cover voice and external-switch workflows; Tobii Dynavox sells purpose-built eye-gaze communication devices with AAC software and support. Sesame’s differentiation was therefore affordability and broad-app access, while competitors could offer platform integration, clinical workflows, purpose-built hardware, and longer-term support. No comparative reliability or usability benchmark was found."""
