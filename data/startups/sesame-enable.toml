investment_rationale = """This is not a current equity opportunity: Sesame Enable’s own site says the company closed in late 2019 and that its remaining solutions were made free. Historical reports document a Verizon $1 million prize, an award from the Genesis Generation Challenge, government support, crowdfunding, and an unnamed angel match, but amounts for early support and crowdfunding conflict and no company-announced lifetime total or financing terms were found. The Google.org $1 million project grant was awarded to Beit Issie Shapiro for a joint distribution and development initiative; it is not counted as capital raised by Sesame Enable. A buyer or researcher would need to confirm current ownership, software rights, patent status, source-code access, and user-support obligations before assigning asset value."""
strategic_value = """Sesame Enable is strategically useful as a documented case of accessibility-first computer vision moving from a modified handset to a software layer and public distribution channels. Its user-led design, commodity-camera approach, and combination of free distribution with subsidies offer practical lessons for assistive-technology product and procurement design. The record also exposes a hard commercial question: meaningful individual impact, awards, and customer adoption did not prove a repeatable revenue base. Any residual value is conditional on verifiable rights, technical recoverability, and a support plan; the single located patent’s recorded fee status makes current IP diligence especially important."""
