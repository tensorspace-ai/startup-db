name = "Sesame Enable"
description = "Sesame Enable built camera-based, head-controlled access products for people with severe motor impairments. The company says it shut down in late 2019 after failing to find a sustainable business model; its Android, Windows, and communication products remain listed as free downloads. Historical support included grants, prizes, and crowdfunding, while no verified current operating team or equity financing terms were found."
detailed_description = """Sesame Enable was an Israeli assistive-technology company founded by computer-vision developer Oded Ben-Dov and Giora Livne, an electrical engineer who became quadriplegic after an accident. Livne was the first intended user and helped define the product around a concrete access problem: controlling a normal smartphone privately and independently when hands cannot reach a touchscreen. The official site now describes the company as closed in late 2019 because it could not establish a sustainable business model, while continuing to offer its remaining software free.

The core interaction used a device camera and computer-vision tracking to turn small head movements into cursor movement, selection, and touch-like commands. The original Sesame Phone was a modified Google Nexus 5; later products included Open Sesame for Android phones and tablets, a Windows PC version, and the Sesame Talking Keyboard for head-controlled message composition. The listed download pages claim operation without extra tracking hardware. Historical reporting describes voice commands alongside head input. The product therefore sat between a smartphone app and an accessibility input layer: the promise was control across ordinary apps without buying a dedicated eye-tracking system or attaching a special sensor.

The beneficiary was a person with ALS, spinal-cord injury, multiple sclerosis, cerebral palsy, Parkinson’s disease, or another condition that limited hand use but left enough head movement for tracking. Caregivers, rehabilitation staff, disability organizations, device vendors, and public subsidy programs were important routes to adoption. That route produced real but heterogeneous evidence: CBS reported the first 50 phones shipped in 2015; Forbes reported 100 units sold worldwide by February 2016; The Times of Israel later reported more than 1,200 customers globally. Those figures come from interviews and reporting, not audited active-user, revenue, or repeat-purchase data. Distribution through Beit Issie Shapiro and Google’s Go Ahead project and availability through Maryland’s public assistive-telecommunications program show that institutional channels existed, but do not establish that every user was a paying customer or that a recurring contract funded the company.

Commercially, Sesame tried several delivery paths. Early devices were sold at a reported several-hundred-dollar price, while a later Android app broadened reach and the company discussed subscription software. Public subsidies and nonprofit distribution helped users afford a product whose value is high for an individual but whose market is served through fragmented clinical, family, charitable, and government purchasing. The company’s own closure statement is direct evidence that social need and adoption did not translate into a durable operating model. Public information does not settle the device-level economics, reimbursement coverage, support burden, manufacturing costs, or the degree to which paid sales subsidized free distribution.

The technical advantage was a low-hardware path to broad device control. A front-facing camera is cheaper and more discreet than a dedicated tracker, and the patent record describes tracking a controlling object from sequential image data and translating its trajectory into commands. The tradeoff is dependence on a clear camera view, lighting, stable positioning, calibration, head range, and operating-system access. A camera used for tracking may also be unavailable for ordinary photo or video capture. Specialist eye-gaze systems can cost more but provide purpose-built mounts, AAC software, clinical workflows, and support. Native mobile accessibility features have also expanded: Apple documents head and eye tracking, voice control, and switch control, while Android offers voice and switch access. These alternatives narrow Sesame’s historical product distinction and raise compatibility and maintenance questions for downloads that remain posted after the company closed.

The available public patent record identifies one U.S. grant, US9761009B2, naming Sesame Enable Ltd as assignee and Oded Ben-Dov and Giora Livne as inventors. Google Patents labels it expired for a fee-related reason, while cautioning that its legal-status field is not a legal conclusion. That record is a useful technical and asset-diligence lead, not proof that Sesame still owns enforceable rights or that no other patents, source code, trademarks, or third-party licenses exist. The current legal owner, assignment history after shutdown, and availability of maintainable code are unresolved.

There is limited adjacent use for hands-free interaction in vehicles, industrial workstations, or emergency communication, but the evidence reviewed concerns disability access. Proximity to Walter Reed, veteran-focused hiring language, or a founder’s military service does not establish defense adoption. No public military contract, security deployment, ruggedized product, secure integration, or mission-condition validation was found. The record should therefore be treated as a closed accessibility company and a historical HMI or asset-diligence reference, not as a live startup or defense supplier."""
