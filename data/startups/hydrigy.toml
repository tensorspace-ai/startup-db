name = "HydriGy"
description = "HydriGy is an Israeli deep-tech energy startup developing direct borohydride fuel-cell systems for portable, remote, and mission-critical power. Its stated proposition is to offer a longer-runtime, logistics-resilient alternative to heavy batteries and liquid-fuel generators in defense, emergency-response, and off-grid settings."
detailed_description = """
**Product and problem.** HydriGy is developing a portable-power platform based on Direct Borohydride Fuel Cells (DBFC), aimed at situations where lithium batteries are too heavy, run out too quickly, or cannot be recharged conveniently, and where conventional generators bring fuel, noise, emissions, maintenance, and transport burdens. The company's public materials describe two related directions: portable DBFC power and off-grid or microgrid systems for small-to-medium power requirements. That positioning is relevant to field electronics, remote sensors, emergency communications, industrial monitoring, and other loads that need dependable electricity away from a reliable grid. Startup Nation Central describes the initial defense and dual-use thesis as replacing bulky methanol fuel cells and heavy batteries with a lighter, longer-duration system. HydriGy has not publicly disclosed a complete product family, rated output, system weight, runtime curve, or production specification, so the record should treat the platform as an alpha-stage technology rather than a fielded generator.

**How the technology works.** A DBFC converts the chemical energy of a borohydride fuel directly into electricity through electrochemical oxidation, rather than first reforming the fuel into hydrogen for a conventional hydrogen fuel cell. The technical literature generally describes alkaline sodium borohydride at the anode, an alkaline electrolyte and separator or membrane, and oxygen from air or another oxidant at the cathode. The anode reaction can release multiple electrons, creating an attractive theoretical voltage and energy-density profile for portable applications. HydriGy publicly emphasizes solid, stable fuel tablets, rapid startup, long shelf life, and safer handling than toxic liquid fuels, but it does not disclose the tablet formulation, hydration method, stack architecture, catalyst composition, membrane design, power electronics, or balance-of-plant requirements. This distinction matters: the scientific literature identifies borohydride hydrolysis, hydrogen crossover, anode selectivity, catalyst durability, membrane behavior, water management, and fuel cost as central DBFC commercialization challenges. HydriGy's claimed advantage must therefore be tested against real-world energy delivered per kilogram, not against theoretical chemistry alone.

**Market and go-to-market.** The most natural initial customers are organizations that pay for operational independence and predictable energy logistics: defense units needing portable power for radios, electronic warfare support, sensors, or small unmanned-system ground equipment; emergency responders restoring communications; telecom operators protecting remote sites; and industrial or environmental operators running unattended equipment. The same architecture could be packaged for remote construction, mining, agriculture, maritime equipment, and small off-grid microgrids. Finder classifies HydriGy as a B2G/B2B company in aerospace, defense, and homeland security, while the company's own pages speak more broadly about portable, remote, mission-critical, off-grid, and microgrid applications. No named customer, signed procurement program, distributor, or paid deployment was identified in the reviewed public sources. A plausible route to market is prototype evaluation with system integrators and potential government or industrial users, followed by an OEM or channel partnership; that is an analytical commercialization pathway, not a disclosed HydriGy contract. Early customer discovery will need to establish whether users value lighter fuel logistics enough to accept new consumables, training, safety procedures, and a less mature service ecosystem.

**Traction, funding, and validation.** HydriGy Ltd appears in Israeli registry data as an active private company incorporated on 16 July 2025, with a Tel Aviv-Yafo address. Startup Nation Finder reports July 2025 founding, a 1-10 employee range, pre-funding status, and an alpha product stage. A public post from co-founder Gennadi Finkelshtain says the company completed three months of successful testing of DBFC-based portable-power demonstration units with tier-one potential customers and was moving toward funding; the post does not name those potential customers, identify whether testing was paid, or publish independent performance data. There is no publicly disclosed financing round, amount, revenue figure, purchase order, defense contract, certification, or third-party field trial in the sources reviewed. The incorporation record, alpha classification, company-hosted product material, and founder-reported demo testing are meaningful formation signals, but they are not equivalent to commercial validation. The next evidence that would materially change the assessment would be independently measured stack performance, repeatable units, named pilot partners, customer acceptance criteria, and a disclosed financing or manufacturing plan.

**Founders and team.** Public ecosystem data identifies David Furstenberg as HydriGy's co-founder and CEO. Finkelshtain's public professional profile identifies him as a HydriGy co-founder and CEO and describes more than 35 years in deep-tech energy; it also links his history to co-founding MEDIS Technologies, an early direct-borohydride-fuel-cell company in the United States, and serving as CTO and co-founder of GenCell Energy, where his work included alkaline fuel cells, ammonia cracking, and green-ammonia technologies. This is unusually relevant technical lineage for the chosen chemistry and may shorten the path from laboratory knowledge to an engineered system. However, the conflicting public CEO descriptions mean the current executive division of responsibility should be confirmed directly. The public record does not establish the size of the full engineering team, the ownership of prior intellectual property, patent assignments, employment of the entire MEDIS or GenCell group, or the company's access to manufacturing and regulatory specialists. Team quality is therefore a positive but still concentrated signal: the founding experience is highly germane, while organizational depth and governance remain diligence questions.

**Competitive dynamics and edge.** HydriGy competes against several different energy architectures rather than one direct category. Lithium-ion and LiFePO4 packs have mature manufacturing, simple electrical integration, and strong incumbent availability, even though their mass, recharge time, cold-weather behavior, and storage degradation can be limiting. Direct-methanol fuel-cell suppliers such as SFC Energy already serve portable and remote markets with established fuel logistics. PEM hydrogen systems from Intelligent Energy, Ballard, and other vendors offer a familiar fuel-cell route but require hydrogen storage or generation. Diesel and propane generators remain powerful alternatives where weight, noise, and emissions are acceptable. HydriGy's proposed edge is the combination of a solid, stable borohydride consumable, direct electrochemical conversion, long shelf life, rapid start, and the possibility of high energy density without compressed hydrogen. Those attributes could be valuable in a narrow mission profile, but they are not yet a moat. The company must demonstrate that tablets can be manufactured consistently, transported legally, stored safely, converted efficiently, and replaced at a total cost that beats batteries or established fuel cells. Patents, stack life, field-service design, and integration partnerships will determine whether the chemistry becomes a defensible product or remains an attractive research approach.

**Defense, security, and resilience relevance.** HydriGy qualifies as genuinely dual-use at the core-technology level because the same portable and off-grid power capability can support both commercial remote operations and defense or civil-resilience missions. Potential defense scenarios include powering unattended border or ISR sensor nodes, extending the endurance of a remote communications relay, supporting a small UAS or UGV ground station, and supplying quiet energy to a dismounted or vehicle-mounted electronics load. Civilian scenarios include emergency communications after grid damage, telecom backup, remote industrial IoT, disaster relief, and microgrids for sites that cannot depend on utility service. The strategic value is mainly energy logistics: a stable, transportable fuel could reduce battery resupply and generator dependence, while a quiet and low-local-emission power source could improve concealment and reduce maintenance burden. There is no public evidence that HydriGy has a fielded military system, defense procurement, security certification, ruggedized enclosure, electromagnetic-compatibility qualification, or approved operational fuel-safety process. The defense case is therefore credible as an intended application and resilience thesis, not as proof of adoption. Government testing, environmental qualification, export-control treatment, and supply assurance would be decisive.

**Stage, trajectory, and diligence risks.** HydriGy is best classified as early: it was incorporated in 2025, is listed as pre-funding and alpha-stage, and has publicly discussed demonstration testing rather than production deployment. A credible trajectory would proceed through independently benchmarked portable units, repeatable fuel-tablet production, customer pilots, safety and environmental qualification, a funded manufacturing plan, and then integration with defense, telecom, or emergency-power channels. The main technical risk is that borohydride's theoretical energy advantage will be eroded by hydrolysis, catalyst and membrane replacement, water and thermal management, parasitic losses, and balance-of-plant mass. The main commercial risk is a capital-intensive hardware business entering a market where batteries, methanol cells, hydrogen fuel cells, and generators already have service networks. Other risks include consumable supply and recycling, operator exposure and transport rules, cold and hot weather performance, uncertain intellectual-property protection, limited public team depth, no disclosed revenue or funding, and the unresolved public leadership-title discrepancy. HydriGy merits strategic monitoring because the chemistry and Israeli technical lineage align strongly with resilient power needs, but its score should remain moderated until the company publishes independent operating data, named customer evidence, and a financing and scale-up plan.
"""
