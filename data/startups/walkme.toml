name = "WalkMe"
description = "WalkMe Ltd. is an active digital adoption platform business owned by SAP. Its software places contextual guidance, workflow automation, and usage analytics over enterprise applications; SAP completed its acquisition on September 12, 2024, integrating WalkMe’s cross-application interaction layer with its enterprise and Joule product strategy."
detailed_description = """WalkMe is an enterprise digital adoption platform (DAP): software that runs alongside business applications and adds in-context guidance, communications, analytics, and selected automation without requiring customers to rewrite each underlying application. The platform's core job is to help employees and customers complete complex tasks in systems such as HR, ERP, CRM, service, finance, and custom web applications. WalkMe's pre-acquisition filings describe a subscription cloud business with associated professional services and typical one-to-three-year contracts, usually billed annually in advance. That business model ties adoption tooling to multi-year transformation programs, but also exposes renewals to customer budgets and the measurable value of each deployment.

The commercial case is supported by substantial enterprise reach, with an important qualification about customer quality and timing. WalkMe's audited 2023 Form 20-F reported 1,638 customers at year-end, including 410 Global 2000 organizations; the customer count had declined from 1,806 in 2022. The same filing reported 548 customers above $100,000 ARR and 41 above $1 million ARR, with no customer exceeding 3.1% of ARR. Revenue rose 9% to $267 million in 2023, while GAAP net loss was $56.8 million and cash from operations was positive $15.3 million. In Q1 2024, the last standalone quarterly release before SAP's takeover, revenue was $68.6 million and cash, deposits, and marketable securities were $339.6 million. These figures describe a scaled but slower-growing public software company before the acquisition; they do not establish WalkMe's post-acquisition segment revenue or current standalone profitability. WalkMe's current About page still advertises 900-plus employees, approximately 1,600 customers, and 35 million users, but does not date those counts, so the audited 2023 data is the better dated baseline.

The product's technical value comes from operating at the visual interaction layer across applications. WalkMe's filings describe DeepUI as proprietary UI-intelligence technology intended to recognize interface elements and adapt guidance when third-party applications change. The company has also built walkthrough authoring, contextual prompts, task execution, application-use analytics, and desktop, web, and mobile experiences. Patent records show concrete work on automated operation sequences and privacy-preserving collection; the 2023 filing counted 18 issued U.S. patents, eight issued foreign patents, and pending applications in both jurisdictions. These rights support a real technical asset, though the filing itself cautioned that its portfolio was not broad relative to larger technology companies. More than the patent count, the engineering challenge is maintaining reliable element recognition, permissions, and automation across changing third-party interfaces without creating a brittle overlay or collecting more employee behavior than customers and their workforces expect.

WalkMe's history shows deliberate product assembly as well as internal development. It acquired Abbi in 2017 for mobile engagement, Jaco for visual session analytics, DeepUI in 2018 for machine-learning-based GUI understanding, and certain Zest enterprise-search assets in 2021 for Workstation. Those purchases broadened the product from a simple guidance layer into a mix of app understanding, analytics, search, desktop entry points, and workflow execution. The acquisitions also create integration and intellectual-property diligence questions: how much code and expertise remains in the products, how the acquired patents and teams are retained, and whether the acquired capabilities now follow SAP's product boundaries.

The competitive set includes direct DAP vendors Whatfix, Userlane, and Apty; product analytics and in-app engagement provider Pendo; and application-vendor alternatives such as Oracle Guided Learning. Whatfix overlaps directly on cross-application guidance and analytics, with a broad desktop, mobile, and VDI pitch. Userlane combines application intelligence with contextual assistance. Pendo is especially strong in product analytics and in-app guides, while Oracle Guided Learning is embedded in Oracle applications and can also cover non-Oracle web apps. Large software vendors can bundle native onboarding, help, copilots, and workflow automation into products customers already buy. WalkMe's strongest differentiation is the combination of long-lived enterprise deployments, UI-level context, guidance plus automation, and telemetry across a heterogeneous software estate. Its historical cross-vendor neutrality was a selling point; SAP ownership now creates a strategic trade-off between access to SAP's distribution and the risk that buyers see the product as less neutral.

SAP completed the acquisition for $14 per share in cash, an announced equity value of about $1.5 billion, and the SEC merger filing states that WalkMe would survive as SAP's wholly owned subsidiary. WalkMe remains operational: its current leadership page, support documentation, and 2026 product material describe active products and implementation steps. The clearest current strategic expression is the Joule Action Bar. WalkMe's February 2026 documentation says SAP customers with AI units can activate it across SAP and non-SAP web applications, while SAP learning material describes screen-context-based assistance, recommendations, and actions routed through SAP-managed services. That is evidence of a shipping integration path, but it does not yet disclose adoption, paid conversion, retention impact, or how much of the value remains available to customers that do not standardize on SAP.

The leadership roster currently lists co-founder and CEO Dan Adika alongside finance, sales, customer, operations, legal, and product executives. The company also identifies Rafael Sweary, Eyal Cohen, and Yuval Shalom Ozanna as co-founders; Sweary stepped down as president in January 2023 and remained a board member at that time. The public roster provides titles more consistently than biographies, and pre-acquisition leadership status should not be read as proof of current SAP reporting lines. That matters because sustaining the product requires specialized knowledge of UI recognition, enterprise change programs, security, and partner delivery, while the acquisition can change both incentives and decision rights.

The defense and security case remains limited. WalkMe has a real public-sector use case in a company-hosted City of Chandler story: municipal employees use the product for multi-system tasks, and the city reports estimated time savings and user-enrollment results. The federal marketplace currently lists WalkMe DAP at Initial Implementation and Agency Authorization in Process, with zero ATOs shown; that is not a FedRAMP authorization. Procurement aggregators also report a 2026 DCSA order titled WalkMe Software Licenses awarded to reseller Swish Data, but the named awardee is the reseller and the authoritative notice could not be read through the available source reader. The reported order is therefore a lead to verify, not evidence of direct WalkMe revenue, a confirmed deployment, or mission use. General administrative guidance could help a defense organization use enterprise software, but no reviewed source establishes classified operation, operational command use, or a security-specific capability. The strongest present assessment is a mature commercial workflow product with plausible public-sector utility and a defense lead requiring primary-source verification."""
