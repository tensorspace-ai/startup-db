name = "Plasan"
description = "Plasan Sasa Ltd. is an active Israeli defense manufacturer that engineers and produces vehicle armor, survivability systems, protected tactical vehicles, and integrated mobility solutions for military, security, and selected civilian customers."
detailed_description = """
Plasan Sasa Ltd. is a mature, privately held protection and vehicle-systems manufacturer based at Kibbutz Sasa in northern Israel. The company began in 1985 and evolved from plastics production into ballistic protection and vehicle survivability. It serves as a subsystem supplier to vehicle and ship builders, a designer and manufacturer of protection packages, and an original producer of selected armored vehicles. Its capabilities span materials and structural design, modeling and simulation, prototyping, ballistic and blast testing, production, and through-life support. The Israeli Innovation Authority identifies the legal entity as Plasan Sasa Ltd., company number 513768341, and lists its Sasa address.

The product portfolio is broader than armor plate. Plasan describes modular armor for armored fighting vehicles, light and medium tactical vehicles, naval vessels, and aircraft; blast and mine protection, spall liners, protected seating, passive RPG defeat and add-on turret protection; and systems designed for top-attack and drone threats. Its ATHENA composite architecture and TAPS top-attack protection are company-described solutions, and Plasan says TAPS is in serial production for several military programs. These are material product claims, but public sources do not disclose independent qualification reports, the named programs, or performance limits. The SandCat family is built around commercially sourced chassis with protection packages and mission variants. Company material cites deployment at a scale of at least 1,700 vehicles, while another passage on the same page says more than 2,000; that inconsistency means neither figure should be treated as a verified fleet count. Plasan Re’em also markets civilian and security vehicles. ATeMM, its All-Terrain Electric Mission Module, adds electric mobility, auxiliary power, payload carriage, and a route toward remotely operated ground support, though public evidence supports product development and evaluation more strongly than recurring sales.

Plasan’s strongest technical proposition is the integration of protection into a platform under strict limits on mass, payload, mobility, crew space, and maintainability. A supplier that can model a threat, design a material stack or structure, test it, produce a repeatable kit, and support fleet installation can reduce the engineering burden on an OEM or government buyer. The value is particularly relevant for upgrade programs where replacing the whole vehicle fleet is unaffordable or too slow. The company says it operates extensive in-house testing facilities and has accumulated tens of thousands of tests; such company-reported experience is a credibility signal, not a substitute for customer qualification data, independent test results, reliability records, or disclosed production yield.

Public commercial evidence points to real program participation but does not reveal Plasan’s revenue recognition or margins by contract. Plasan North America announced selection as an AM General JLTV A2 subcontractor for armored cab components and reported an approximately $300 million, five-year award. A 2025 Calcalist report describes a $250 million, 10,000-vehicle JLTV armor program through 2030; the public descriptions may refer to overlapping or differently scoped work and should be reconciled before using either as a contract value. Plasan says it provided armor packages for the Spanish Army’s 348-vehicle Dragon program, with deliveries running from 2022 to 2026, but the subcontract value is not public. It also announced a contract with BAE Systems Australia to armor the first three Hunter-class frigates, without disclosing value. After the October 2023 attack, the company said it transferred available SandCat Tigris vehicles needed by the IDF and that a significant share was supplied free as emergency support; this is evidence of responsiveness, not paid sales. Breaking Defense reported that the IDF tested ATeMM during the Lebanon war, which indicates field evaluation rather than a confirmed procurement. A 2025 agreement with Belrise for ATeMM opportunities in India and the 2026 IBEX reveal with Brazilian partner ACTATEC extend the channel map, but neither announcement establishes an order or production deployment.

Financial disclosure remains narrow because Plasan is private. Calcalist reported approximately $220 million of group revenue, $26 million group EBITDA, and $20 million group net income for 2024, alongside separate estimates for the Sasa factory. A later report described current annual revenue near $200 million and about 700 employees. Those media-reported figures are not audited filings, the scopes differ, and the revenue figures are not directly comparable. A March 2025 report said the company explored a $150 million capital raise through an IPO or private institutional round at stated pre- and post-money values, but no completed financing was found. The planned listing was later frozen while Plasan pursued a partial business combination with Charmochrom. Legal counsel reported in May 2026 that Charmochrom would become Plasan’s third operating arm; the current company site lists Carmochrome among group companies. The merger’s exact perimeter, consideration, financing, and resulting ownership percentages are not public. The parent is reported to be Kibbutz Sasa, but no current cap table or ownership percentages for Plasan itself are disclosed.

Plasan competes with specialist survivability suppliers such as NP Aerospace and Rheinmetall Protection Systems, and encounters larger platform primes including BAE Systems and General Dynamics. Oshkosh is a particularly relevant adjacent OEM and program partner in the JLTV ecosystem. Plasan’s position is differentiated by its combination of composite and metal protection, vehicle integration, testing, and the ability to supply both kits and selected completed vehicles. The counterweight is scale: larger defense groups can bundle armor with vehicles, sensors, active protection, sustainment, and financing, while specialist suppliers compete on price, weight, material science, and local manufacturing. Plasan’s customer references and platform qualifications can create switching costs, but the company has not published contract concentration, backlog, renewal rates, or a current patent-family inventory that would quantify the durability of its edge.

Dual-use activity is concrete in protected police, emergency, diplomatic, and high-threat transport vehicles, and in civilian commercial-chassis conversions. The materials and structural engineering also have potential outside defense, including automotive composite components, but public evidence does not quantify those sales. ATeMM’s electric power and robotic-mobility characteristics could support logistics, remote sensing, emergency response, and hazardous-site work; these are potential use cases, not established civilian markets. The dominant near-term demand driver remains defense and government procurement, so dual-use adjacency should not be mistaken for diversification already achieved.

Plasan is best treated as a strategically important industrial supplier rather than an early-stage venture candidate. Its enduring relevance comes from fleet protection, vehicle modernization, and demand for survivability against mines, RPGs, kinetic threats, and top-attack drones. Investment or partnership diligence should focus on audited financials, backlog quality, customer and prime concentration, the true economics and scope of JLTV work, export permissions, test and qualification evidence, ownership and merger terms, and the ability to maintain production in a conflict-exposed northern site. The company’s history also shows cyclicality: Calcalist reports that sales fell after U.S. operations in Afghanistan and Iraq wound down and again during the pandemic. Strong engineering and strategic demand coexist with slow procurement cycles, political exposure, capital needs, and limited visibility into cash generation.
"""
