name = "Spera Security"
description = "Israeli identity-security company that developed Identity Security Posture Management (ISPM) for discovering, prioritizing, and reducing identity risk across identity providers, SaaS, cloud, and infrastructure applications. Spera was acquired by Okta in February 2024 and its technology is now associated with Okta Identity Security Posture Management."
detailed_description = """
Spera Security built an identity-security posture management platform for organizations whose users, contractors, service accounts, permissions, and authentication controls span multiple identity providers, SaaS applications, and cloud environments. The product was designed to create a consolidated view of the identity attack surface rather than treating each IAM, IGA, PAM, or SaaS security tool as a separate silo. Its value proposition was to identify risky identities and configurations, add context about permissions and activity, prioritize issues by likely impact, and help security teams remediate gaps such as dormant accounts, excessive access, incomplete offboarding, or administrators without appropriate multifactor authentication.

The technology matters because identity has become a control plane for cloud and enterprise operations. Spera's approach sat between conventional identity administration and security operations: it used integrations and analytics across Okta and third-party identity providers, SaaS systems, and infrastructure applications to measure posture and expose attack paths that are difficult to see from a single directory. That is distinct from simply issuing credentials or logging authentication events. The relevant capability set includes identity inventory, permission and entitlement analysis, identity attack-surface management, posture scoring, risk prioritization, and remediation workflow. Public product material also positioned the platform as complementary to existing IAM and IGA investments rather than a replacement for every underlying control.

Commercially, Spera entered a crowded but expanding identity-security market. The company announced a $10 million seed round led by YL Ventures in 2023 and described early customer results, including a claim that partners resolved a large share of critical identity issues within weeks; that outcome is company-reported and should not be treated as independently verified traction. The acquisition is the strongest public commercialization signal: Okta announced the transaction in December 2023, completed it on February 1, 2024, and disclosed $58 million in acquisition-date cash consideration in its SEC filing. Okta subsequently described the service as Identity Security Posture Management, formerly Spera, indicating that the product survived as a defined capability inside a larger enterprise platform.

Competitive pressure comes from established identity platforms expanding into posture, threat detection, and entitlement analytics, as well as specialist vendors such as Veza, Silverfort, Saviynt, SailPoint, and Zscaler. Spera's defensible advantage was therefore less likely to be a unique security primitive than a focused cross-platform identity graph, fast time to useful risk findings, and a product narrative that connected visibility to remediation. Okta ownership supplied distribution, integrations, and enterprise trust, but also reduced Spera's independence and makes current product scope, roadmap, customer retention, and engineering continuity questions for diligence.

The dual-use case is credible but bounded. The same identity inventory, least-privilege analysis, MFA and offboarding checks, and cross-cloud posture visibility can protect defense contractors, government suppliers, and mission-support systems from account takeover and privilege abuse. Identity compromise is relevant to national-security environments, but the public record does not establish classified deployments, government contracts, or defense-specific certifications. The appropriate strategic conclusion is that Spera represents a useful identity-security capability with defense adjacency, not a proven defense platform. Its primary current relevance is as an acquired component of Okta's identity-security portfolio and as a case study in Israeli cybersecurity commercialization.
"""
