name = "DoControl"
description = "DoControl is an Israeli-founded SaaS security and data-protection company whose platform maps sensitive data, identities, sharing relationships, connected applications, and configuration risk across enterprise collaboration platforms. Spin.AI announced its acquisition of DoControl on August 31, 2026; the product and team are being integrated into Spin.AI's SaaS and AI security offering."
detailed_description = """
DoControl was a privately held SaaS security and data-protection company founded in 2020, with New York headquarters and Israeli founding/R&D roots. Its platform connected to collaboration and business applications to inventory data, users, external collaborators, OAuth applications, and permissions. It evaluated exposure in relation to identity, recipient, application, activity, and business context, then supported approval, notification, permission changes, and other workflow remediation. The approach sits between SaaS application APIs and security operations rather than relying on endpoint agents.

The product thesis addressed a persistent operational problem: access and sharing policies differ across SaaS services, and stale sharing can survive the original project, vendor relationship, or employee account. DoControl combined data access governance, contextual data loss prevention, anomaly and identity threat detection, SaaS posture/misconfiguration monitoring, shadow-app discovery, and automation. Its 2024 company-published product update described an ITDR module, misconfiguration capabilities, Google Cloud Marketplace availability, and reseller partnerships. These are product and go-to-market milestones, not independently measured efficacy.

The company’s strategic position changed materially in 2026. DoControl announced that it had been acquired by Spin.AI on August 31, 2026. The buyer described combining DoControl’s DLP and AI-governance capabilities with Spin.AI’s SaaS posture, browser security, and cyber-resilience products. DoControl’s own subsequent integration announcement described a combined offer, making acquired_asset the appropriate present entity classification. Public sources located for this review did not disclose consideration, transaction structure, or whether DoControl remains a separately incorporated subsidiary. Historical DoControl product and customer evidence should therefore be read in the context of an acquired product/team, rather than as proof of an independent standalone company.

Financing before the acquisition consisted of a $3.35 million seed round reported in April 2021 as having been raised in 2020, a $10 million Series A reported in April 2021, and a $30 million Series B announced April 14, 2022. The Series B was led by Insight Partners with StageOne Ventures, Cardumen Capital, RTP Global, and CrowdStrike Falcon Fund participating. DoControl’s company-authored Series B post stated total capital raised of $45 million. That company total does not arithmetically match the frequently reported seed and Series A amounts plus the Series B; third-party publications report totals from roughly $43 million to $45 million. The company-announced total is retained as reported, with the mismatch disclosed rather than resolved by inventing an additional round. No post-Series B financing was found.

Commercial signals include the company’s 2022 reports of more than 30 customers and named users including CrowdStrike, Devo, and Armis, and later company-published claims mentioning Snap, Colgate, Zscaler, Carta, and Grammarly. An Unqork case study distributed through DoControl’s LinkedIn reported 1,300 hours saved in remediation, a 100% decrease in public assets, a 40% decrease in external assets, and more than 9,500 permissions removed in bulk. These are vendor/customer-case-study claims; they do not establish broader representative outcomes, revenue, renewal, or current customer status after acquisition. DoControl’s 2024 company blog also described strategic channel relationships with SADA, Wursta, and Pythian and Google Cloud Marketplace listing. There is no dated, independently filed revenue, ARR, profitability, burn, or runway data in the reviewed sources.

The technical proposition is useful when accurate application-specific permission graphs and reliable remediation are hard for general identity or endpoint products to supply. It also carries implementation dependencies: SaaS APIs vary in coverage, rate limits, event fidelity, and permission semantics; broad scopes can create deployment friction; and automated revocation can disrupt legitimate work if context or policy is wrong. A 2024 US patent, US11936692B1, assigned to DoControl describes SaaS access remediation and policy enforcement. Patent publication demonstrates claimed IP, not freedom to operate or commercial advantage. The company’s 2026 acquisition integration may strengthen distribution and product breadth, but independent post-combination adoption, migration, roadmap, support, and product-continuity evidence remains limited.

Competition historically included Microsoft Purview and Defender, Netskope, CrowdStrike, BetterCloud, Cyera, Nightfall, and SaaS posture or access-governance vendors such as Obsidian Security. Spin.AI’s combination changes the comparison set by placing the product within a broader SaaS security and recovery portfolio. DoControl’s claimed differentiation was cross-application inventory plus contextual detections and workflow remediation; that edge depends on connector depth, safe actions, time-to-remediation, and measurable customer outcomes, not category language. Platform vendors can bundle adjacent controls, and integration economics may favor consolidated suites.

There is a substantive but indirect defensive dual-use application. Government, defense, and critical-infrastructure organizations depend on collaboration SaaS and face risks from stale access, external sharing, compromised identities, excessive OAuth grants, and automation identities. SaaS access governance and auditable remediation could support defensive data protection and insider-risk programs. Reviewed sources do not establish DoControl or Spin.AI deployment in defense, a government contract, classified environment, certification, or offensive capability. Public-sector fit depends on supported hosting, data residency, tenant isolation, least-privilege scopes, durable audit logs, rollback safeguards, independent assurance, and procurement readiness. The acquisition makes it especially important to confirm product boundaries and support commitments with Spin.AI.

The former standalone venture thesis was based on a clear enterprise security need, substantial multi-round institutional backing, product breadth, and customer references. Current diligence should instead address the acquisition’s terms and legal structure, retention of DoControl’s product and technical team, integration and migration plans, customer renewal/continuity, realized cross-sell, patent ownership after closing, and whether the acquired capabilities remain separately available. The acquisition price and private cap table are undisclosed. No funding round should be inferred from the acquisition, and no acquisition valuation should be inferred from historical venture financing or third-party database estimates.
"""
