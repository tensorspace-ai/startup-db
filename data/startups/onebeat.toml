name = "Onebeat"
description = "Onebeat provides an AI-enabled retail inventory optimization and execution platform that sets demand-sensitive targets for products across stores and channels. Its software connects merchandise planning, allocation, replenishment, transfers, promotions, purchasing, and liquidation to reduce stockouts, excess inventory, and avoidable markdowns."
detailed_description = """
Onebeat is an independent Israeli retail-technology startup built around dynamic inventory optimization and execution. Its platform sets a daily target for each SKU and location, then converts demand, availability, supply, and operating constraints into recommended or automated actions. The product spans merchandise planning, assortment and buy planning, initial allocation, smart replenishment, store-to-store transfers, promotions and special events, in-season purchasing, and liquidation. Company materials describe bottom-up forecasting, clustering locations by demand behavior, product-attribute and image-similarity matching when history is thin, and optimization against lead times, minimum order quantities, warehouse capacity, routes, shipping limits, and store rules. This is best understood as a retail decision and workflow system that combines forecasting with constrained optimization; public evidence does not establish a proprietary foundation model or a general-purpose AI platform.

The commercial problem is concrete in apparel, footwear, luxury, jewelry, sporting goods, hardware, and other multi-location or omnichannel categories where demand shifts quickly and stockouts, excess inventory, and markdowns have asymmetric costs. Onebeat’s stated value proposition is to connect pre-season planning with in-season execution, using actual sell-through and availability signals rather than relying only on static forecasts. The official site claims deployment in 30-60 days, while the company’s LinkedIn profile describes daily SKU-level adjustments within 90 days; these are marketing claims that should be reconciled in diligence by customer size and integration scope. The company reports more than 220 global retailers and names brands such as Calvin Klein, Panasonic, and Aramis in its 2025 financing announcement. Those references support commercial reach, but customer count, recurring revenue, net retention, implementation margin, and the percentage of recommendations accepted remain unverified public questions.

The competitive set includes enterprise suites such as Blue Yonder, SAP, Oracle Retail, and Manhattan Associates, specialist planning platforms such as RELEX Solutions and o9 Solutions, and newer retail-inventory vendors such as Toolio and Autone. Onebeat’s defensible position could come from retail-specific execution depth: allocation, replenishment, transfers, promotions, purchasing, and lifecycle decisions are coordinated at SKU-store level, with explicit handling of broken assortments and scarce supply. Its Theory of Constraints heritage and the promise of rapid time to value may help in retailers that find large suites slow or over-scoped. However, the same specialization creates dependence on high-quality retail data and domain implementation, while incumbents can bundle adjacent functions into existing ERP, merchandising, or supply-chain contracts. Independent evidence comparing model lift, deployment cost, retention, and decision automation against those alternatives is limited.

Onebeat is not defense-native, and the reviewed public sources provide no verified defense customer, government contract, export-control posture, or mission-specific security deployment. The dual-use case is consequently indirect but technically credible: constrained allocation, prioritization, replenishment, and network rebalancing are relevant to emergency stockpiles, critical-infrastructure spares, humanitarian logistics, and readiness inventories under uncertain demand. Retail data, service-level objectives, and commercial workflows do not automatically transfer to defense or civil-security settings; such a move would require different threat models, auditability, cybersecurity controls, procurement channels, and evidence under disruption. Strategic relevance should therefore be scored as supply-resilience adjacency rather than defense traction.

Public evidence is stronger on product and financing than on financial performance. Onebeat announced a $10 million Series B in June 2023 and an additional $15 million round led by Schooner Capital on May 6, 2025, stating that total funding reached $30 million. The 2025 announcement also says the company was founded in 2018 and had served more than 220 global retailers. LinkedIn lists 51-200 employees, Tel Aviv headquarters, and a 2019 founding date, while the company’s contact page gives a Ramat Gan address; the database retains 2018 from the company’s own financing announcement and uses Tel Aviv as the broader headquarters label. The resulting profile is a private, growth-stage startup with meaningful commercial signals, but diligence should still seek audited scale, cohort retention, security documentation, reference calls, and proof that the optimization advantage persists across seasons and shocks.
"""
