name = "AeroSight"
description = "AeroSight Systems Ltd. is an Israeli private security-systems startup, incorporated in 2024 and registered in Sderot. Startup Nation Finder and IVC describe an OEM and systems-development business spanning electro-optical observation, power and monitoring integration, robotics, and security or defense applications. Named products and broad technology claims appear in third-party profiles, while the company's official domain is listed as under construction and no public customer, contract, funding round, or identifiable company patent has been verified."
detailed_description = """Identity and source quality. The target is AeroSight Systems Ltd. (Israeli company number 516946522), a privately held Israeli company whose registered address is in Sderot. A company-information mirror reports it active and incorporated on 2024-02-26; Startup Nation Finder describes a January 2024 founding. These dates are compatible if January refers to the venture's start and February to legal incorporation. Finder and IVC link aerosight.org as the company's website, but IVC labels it under construction and the live site could not be read. The strongest public description therefore comes from dated ecosystem profiles and registry mirrors rather than a current product catalogue or company announcement. A Yavne AeroSight listing, a 2018 Tel Aviv/$1 million aerial-imagery profile using the same .org domain, and the unrelated Bulgarian AeroSight flight-data-monitoring provider cannot be safely merged with this registered Sderot entity without a company-number link.

Product and delivery model. Finder calls AeroSight an OEM manufacturer and lists AEROB, VIPERA, and AEROSAT. Its profile describes electro-optical solutions integrating power and monitoring, plus robotics, surveillance and observation equipment, intelligent monitoring, marine and underwater equipment, mobile or portable aircraft, and active-defense systems. IVC describes optical, energy, and robotic systems for security and defense, with B2B business and project support in integrated technology and research. Dun's Guide categorizes the registered company in alarm/security systems and smart-case production. Taken together, these descriptions suggest a small systems house that could design, assemble, or integrate electromechanical observation and security equipment, potentially alongside bespoke project engineering. The evidence does not establish which listed categories are live products, which are design services, whether AeroSight manufactures core sensors itself, or whether the product names are prototypes, released units, or catalogue entries. AI-assisted observation and learning is a profile claim with no public algorithm, sensor specification, validation data, or autonomy boundary disclosed. No detailed datasheet, demonstration, regulatory filing, or customer acceptance evidence was found.

Commercial model and proof of demand. The natural buyer set suggested by these descriptions includes security-system integrators, industrial operators, and defense or public-sector procurement organizations. A compact OEM could win where local engineering, installation constraints, ruggedization, power integration, or a non-standard payload matter more than a broad catalogue. It could also supply project services while products mature. That split is central to underwriting: systems revenue can be lumpy and engineering-intensive, while repeat orders depend on field reliability, maintainability, qualification, spare parts, and the ability to support deployments. Public evidence located here does not name a paying customer, signed contract, production deployment, independently corroborated pilot, recurring software sale, or government award. Finder's “released” product-stage field and its three product labels are directory assertions, not evidence of commercial acceptance. A LinkedIn mechanical-engineer posting from roughly 2025 indicates at least one attempt to recruit for design, product documentation, testing, and implementation work in Ashkelon; it is a dated hiring signal and says nothing about current headcount, completed hiring, production capacity, or customer demand.

Technology and differentiation. The plausible technical problem is systems integration: coordinating optics, mechanics, actuation, power, monitoring, and an operator interface in a constrained security platform. A focused engineering team may move faster than a prime on narrowly specified customer work and may offer local customization. Those are hypotheses, not demonstrated advantages. There are no public figures for detection range, image quality, stabilization, environmental qualification, mean time between failures, power draw, communications resilience, integration time, cost, or service intervals. No evidence establishes a proprietary AI model, unique optical design, or defensible manufacturing process. Finder asserts that AeroSight holds a patent but gives no title or number. Searches for the company name and product labels did not identify a matching application or assignee. A public patent record for inventor Assaf Shafir concerns an electronic-card assembly assigned to Sirin Advanced Technologies, not AeroSight; it cannot substantiate AeroSight ownership. The patent claim should remain an unresolved diligence item, not an IP asset in this record.

Competition and market position. Product-level comparators include Elbit Systems' airborne electro-optical payloads, which it describes as serving multiple platforms and having more than 500 worldwide installations; Rafael's Toplite multi-sensor EO/ISR family, which Rafael says is fielded in more than 20 countries; and Percepto's drone-in-a-box inspection and monitoring offer, for which Percepto reports FAA-authorized remote operations at a Texas solar site. They occupy different scales and product layers, so these are reference competitors and substitutes rather than proof of head-to-head bids against AeroSight. Established Israeli defense firms have much deeper qualification, export, program-management, and support capacity. Percepto is a useful commercial comparator for industrial monitoring, but its integrated autonomous inspection workflow is not directly equivalent to an EO component supplier. Other likely alternatives include customer-built assemblies, specialist optics vendors, and established integrators; the public record is too thin to identify AeroSight's actual tender set or win/loss history. A credible edge would require a measurable system-level advantage or repeatable niche product, not just a broad list of adjacent technologies.

Team, ownership, and operating risk. Finder names Assaf Shafir as co-founder and VP R&D and Lidor Madmoni as CEO; IVC lists the same two, while CheckID identifies Madmoni as a director. The accessible sources do not provide reliable biographies, a full engineering roster, or a current organization chart. A company-branded mechanical-engineer posting names Shafir as poster; public profile context also associates that name with private-technology secondary sales, so role, identity continuity, and time commitment should be confirmed rather than assumed. CheckID's Hebrew listing identifies Madmoni as a shareholder, while its English rendering labels the relationship differently; no ownership percentage is shown. CheckID also records a share-transfer event dated 2025-08-19 with no parties, stake, consideration, or control outcome. The same mirror indexes two 2025 civil matters, one marked deleted and another marked accepted/partly accepted. The underlying court files were not reviewed, so these entries should prompt document review rather than a conclusion about liability or operating condition.

Capital, readiness, and dual use. Finder's profile, last updated 2024-08-25, shows undisclosed total funding and zero rounds, and labels AeroSight pre-funding. Searches of company and investor announcements, Israeli and international business media, public-company filings, and Hebrew sources did not identify a financing attributable to company number 516946522 through 2026-10-22. A private round, founder capital, grant, or debt could remain undisclosed. StartupHub.ai reports a 2018/$1 million seed for a Tel Aviv aerial-imagery business under the same domain, but that profile conflicts with the registered entity's 2024 founding and different product description; its amount is excluded. IVC's profile also contains stale or inconsistent details (2020 establishment, seven employees, Nitzan address, and a placeholder registration number), so those are not used for current metadata. The defense/security applicability is directly described in the profiles; commercial adjacency is plausible in site monitoring, industrial observation, research support, and security installations. This supports a cautious dual-use classification, not a claim of civilian or military deployment. No export-control process, end-user screening, cybersecurity standard, safety case, defense certification, or government relationship is documented. The investment case depends on proving a shippable product, product-versus-services economics, customer references, IP ownership, founder availability, and the ability to support qualified deployments at a scale a small early company can sustain."""
