name = "Offroad"
description = "Offroad is a New York- and Tel Aviv-based cybersecurity startup building an 'agentic' identity security platform that uses autonomous AI agents to discover, investigate, and remediate identity risks across human users, non-human identities, and AI agents. It emerged from stealth in June 2026 with a $7 million seed round led by Ibex Investors and Skywell Capital."
detailed_description = """
**Product and the concrete problem it solves.** Offroad attacks a problem that has quietly become one of the hardest in enterprise security: identity has stopped being a human-scale problem. A modern organization no longer manages a bounded set of employee logins governed by an identity provider; it manages a sprawling, fast-changing mesh of human users, machine identities (service accounts, API keys, tokens, workload identities), and — increasingly — autonomous AI agents that authenticate, hold permissions, and act on their own. Offroad's framing, in co-founder and CEO Dan Bendler's words, is that "enterprises now operate across a constantly changing mix of human users, machine identities, and AI agents," and that the volume of identity-security work this creates has outrun what human teams can triage manually. The company positions its platform as an "agentic identity security team" — software that does the investigative and remediation labor a human identity/security team would do, but continuously and at machine scale. Concretely, it aims to move an organization "from identity visibility to full risk resolution": not just surfacing that a dormant service account has excessive privileges or that an AI agent's permissions drifted, but investigating the context, deciding whether it is a real risk, and either fixing it automatically where policy allows or escalating it to the right owner.

**Core technology and how it actually works.** Offroad's platform is organized around three functions — discovery, investigation, and remediation — executed by AI agents rather than static rules. On discovery, it "ingests data from 250+ sources across your cloud, SaaS and on-prem," pulling from major identity providers (Okta, Microsoft Entra ID, Ping Identity), the three hyperscalers (AWS, Google Cloud, Azure), and a long tail of SaaS systems (Salesforce, Slack, ServiceNow, Workday, GitHub, Datadog, Snowflake, and others) to assemble a unified picture of who and what can access what. For the AI-agent and non-human-identity (NHI) case specifically, the product claims to analyze "the intent, permissions, and ownership of AI agents and non-human identities to proactively identify and prevent access abuse" — i.e., not merely enumerating credentials but reasoning about what a given machine or agent identity is *for*, who controls it, and whether its observed permission usage matches its purpose. Investigation is where the "agentic" claim is most load-bearing: rather than dumping alerts on an analyst, Offroad's agents are meant to gather context across those fragmented systems, correlate posture issues with runtime signals, and produce a reasoned judgment. Remediation is then automated where policies permit — dynamically auditing permission usage, revoking or right-sizing access — or routed to the appropriate human owner. The technical bet is that large-model-driven agents can absorb the context-gathering and correlation toil that makes identity governance so labor-intensive, thereby collapsing alert fatigue and shrinking the window between detection and fix.

**Market, customers, and go-to-market.** Offroad sells into the enterprise identity-security market, one of the largest and most contested categories in cybersecurity, and it is riding two powerful sub-trends: the explosion of non-human identities (which now vastly outnumber human ones in most cloud estates) and the arrival of autonomous AI agents as first-class actors that need to be identified, permissioned, and policed. Its go-to-market is classic enterprise B2B SaaS — a platform sold to CISOs, identity/IAM teams, and security operations groups — and its integration-heavy architecture (250+ connectors, deep hooks into Okta/Entra/Ping and the hyperscalers) is designed to slot into existing identity stacks rather than replace them. The dual New York and Tel Aviv footprint reflects a common Israeli-cyber pattern: Israeli engineering and threat-research depth paired with a U.S. commercial and sales presence aimed at the American enterprise buyer where the largest security budgets sit. Named production customers, design partners, pricing, and pipeline are not disclosed in the public record and should be treated as unverified; at this stage the company is best understood as a funded, product-defined entrant rather than one with proven enterprise traction.

**Traction, funding, and third-party validation.** The verifiable facts are the funding event and the investors behind it. Offroad emerged from stealth on June 4, 2026 with a **$7 million seed round led by Ibex Investors and Skywell Capital (Skywell Capital Partners)**, announced via BusinessWire and covered by Calcalist, SecurityWeek, SiliconANGLE, Ynet, and multiple trade outlets. That is a modest seed by 2026 Israeli-cyber standards — peers in the adjacent AI-agent/identity space raised far larger rounds in the same window (for example Oak at ~$60M, NewCore at ~$66M total, and Onyx Security at ~$40M) — which is a useful calibration point: Offroad is early and lightly capitalized relative to the cohort competing for the same problem. The strongest third-party validation is therefore not scale but the founders' pedigree and the investors' willingness to back them pre-revenue; the round's stated use of proceeds is to build out the platform and the "agentic identity security team." Revenue, headcount, valuation, and customer counts are not publicly disclosed.

**Founders and team background.** Offroad was founded in 2025 by **Dan Bendler** (co-founder and CEO) and **Philip Shteyn** (co-founder and CTO). Bendler is a repeat founder who, per multiple reports, previously founded two AI startups that collectively raised more than $45 million — relevant because Offroad's thesis is fundamentally an applied-AI bet, and prior experience shipping AI products and raising capital is directly on-point. Shteyn is described as a former **Unit 8200 captain** who "helped build Palo Alto Networks' Cortex platform" — a combination that matters: Unit 8200 is Israel's signals-intelligence unit and the single most prolific incubator of Israeli cyber founders, and Cortex is a widely deployed enterprise/government SecOps and XDR platform, so Shteyn brings both offensive/defensive security depth and hands-on experience building a large-scale security product used in real SOCs. The principal open questions are ordinary for a 2025-vintage seed company: total headcount, the depth of the engineering and go-to-market bench beyond the two founders, and whether the team can convert a strong pedigree into enterprise-grade reliability in a category where false remediation actions carry real operational risk.

**Competitive dynamics.** Offroad competes in an unusually crowded lane where three markets are colliding — identity governance (IGA), non-human-identity security, and the brand-new category of AI-agent security. (1) Against **incumbent identity platforms** — Okta, Microsoft Entra, CyberArk, SailPoint — Offroad is a specialist layer betting that agentic investigation/remediation is a capability the incumbents are slower to build; but those incumbents own the data and the buyer relationship. (2) Against the **NHI-security wave** — Oak (AI 'Identity Operating System'), NewCore (identity/permission infrastructure for employees, systems, and AI agents), and others — it competes directly on the machine-identity problem, often with less capital. (3) Against the **AI-agent-security cohort** — Onyx Security, Melian Security (runtime security for enterprise AI agents), and a fast-growing field of 2025–2026 entrants — it overlaps on securing autonomous agents. Offroad's plausible differentiators are: (i) an end-to-end discover→investigate→remediate loop rather than visibility-only tooling; (ii) breadth of ingestion (250+ sources) for unified context; and (iii) a founder-market fit combining repeat AI-building experience with 8200/Cortex security depth. The countervailing reality is that nearly every competitor makes similar "agentic," "context," and "autonomous remediation" claims, so the moat will be proven only in deployed reliability and enterprise references, neither of which is yet public.

**Defense, security, and resilience dual-use relevance.** Offroad's dual-use relevance should be read as a defensive-cyber and resilience adjacency, not a fielded defense capability. Its core technology — governing the identities, permissions, and behavior of machine and AI-agent actors — sits squarely in the defensive-security domain that is core to Claw & Talon's cyber thesis, and it addresses a resilience problem that governments and critical-infrastructure operators face as directly as commercial enterprises: as agentic AI is adopted inside defense, intelligence, and national-infrastructure environments, controlling what autonomous agents and non-human identities can do — and catching compromise or drift at runtime — becomes a hard security requirement. The founder signal reinforces the adjacency: a Unit 8200 background and hands-on work on Palo Alto's Cortex (a platform deployed in government and defense SOCs) indicate the team understands the operational-security context that public-sector and defense buyers require. The honest calibration is that Offroad has disclosed no government, defense, or critical-infrastructure customers, no clearances, and no sovereign/air-gapped deployment posture; its dual-use weight is therefore category-level and pedigree-based, and would only become concrete if it wins public-sector references or hardens the product for classified/on-prem environments.

**Growth stage, trajectory, and key diligence risks.** Offroad reads as an **early-stage** company: founded 2025, out of stealth in mid-2026 on a $7M seed, product-defined but pre-scale, with a strong founder duo and a hot but savagely competitive market. The trajectory to watch is whether it can convert pedigree into paying enterprise deployments before better-capitalized peers (Oak, NewCore, Onyx, and identity incumbents) crowd the category. The key diligence risks are, first, **capitalization and competitive intensity** — a $7M seed is small against rivals raising 6–10x more for the same problem, compressing runway to prove differentiation; second, **product-reliability risk** — autonomous remediation of identity/permissions is high-stakes, where an over-eager agent revoking legitimate access can cause outages, so trust and precision are existential; third, **category commoditization** — "agentic identity security" is a crowded, buzzword-dense space where the technical claims are hard to distinguish from the outside; fourth, **traction opacity** — no disclosed customers, revenue, headcount, or valuation, so all commercial claims are unverified; and fifth, **dual-use thinness** — its strategic weight on the defense/resilience axis is adjacency and founder-pedigree, not fielded capability. Progression from here would be evidenced by named enterprise (and ideally public-sector) customers, demonstrated safe autonomous remediation at scale, a larger Series A, and clarity on how it defends its niche against both incumbents and the well-funded NHI/AI-agent cohort.
"""
