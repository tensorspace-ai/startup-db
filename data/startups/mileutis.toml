priority_rationale = "Mileutis merits a monitoring priority because its core product thesis sits at the intersection of Israeli deep-tech life sciences, food-security resilience, and antimicrobial-resistance reduction. Positive signals include a specific bovine-mastitis problem, natural-peptide and immunomodulatory technology, a company-reported 54 granted patents, a disclosed $20 million NovaQuest financing, randomized multi-center clinical claims, and an EMA safety opinion. Its Israeli facility and long development history make it more substantial than a concept-stage agrifood record. Priority is capped by the absence of current approval evidence, independent trial datasets, named customers, revenue, distributor commitments, and follow-on financing. The dual-use score reflects resilience and biosecurity adjacency, not fielded defense capability. The next diligence milestones are country-level approvals, independent efficacy evidence, launch and distribution announcements, on-farm outcomes, manufacturing scale-up, and proof that the company has sufficient capital to commercialize after the 2020 financing."
