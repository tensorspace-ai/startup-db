name = "Build.Security"
description = "Build.Security was a Tel Aviv authorization-policy-management startup that used Open Policy Agent (OPA) and policy-as-code to deliver fine-grained RBAC and ABAC for cloud-native applications. Elastic completed its acquisition in September 2021, so this record now describes an acquired security technology rather than an independent startup."
detailed_description = """Build.Security developed an authorization-as-a-service platform for application teams that needed consistent, fine-grained access decisions across APIs, services, and application portfolios. Its core approach used Open Policy Agent (OPA) and policy-as-code to separate authorization logic from application business logic. That separation can make policies easier to review, test, change, and audit than bespoke authorization code embedded throughout a distributed system. The product addressed both role-based access control (RBAC) and attribute-based access control (ABAC), with API-based data sources intended to provide context to policy decisions.

The target problem was commercially important but technically difficult: modern applications distribute identity, data, and business logic across microservices, containers, Kubernetes clusters, and cloud control planes. Teams must enforce least privilege without creating inconsistent rules in every service, while also proving that access controls match internal and regulatory requirements. Build.Security's developer-oriented positioning, reusable policies, and OPA foundation were intended to reduce integration effort and let security teams apply controls earlier in the software lifecycle. The company emerged from stealth in 2020 with seed backing from YL Ventures, but public sources do not establish a durable independent customer base, recurring revenue scale, or post-acquisition standalone product trajectory.

Elastic announced an agreement to acquire Build.Security in August 2021 and announced completion on September 2, 2021. Elastic described the technology as a policy-definition and enforcement platform for cloud-native security, with intended integration into Kibana, Elastic Agent, Elasticsearch, and Kubernetes admission controls. Elastic's later financial reporting classified Build Security Ltd. as an acquired business and stated that it was consolidated from the acquisition date. These facts provide credible evidence of strategic and technology validation, but they should not be read as proof of independent product-market fit or of current Build.Security availability. The original company website is not currently confirmable as a live canonical destination, and public evidence does not support a current employee count.

The competitive field included authorization platforms such as AuthZed, Aserto, Oso, and Permit.io, as well as direct substitutes including self-managed OPA, cloud IAM and policy services, and authorization features built into application platforms. Build.Security's historical edge was the combination of a developer workflow, open policy standards, and a managed control-plane concept around a difficult cross-application problem. That edge was also exposed to commoditization: OPA is open source, cloud vendors control adjacent enforcement points, and enterprise buyers may prefer identity suites or platform-native controls. Acquisition by Elastic improved distribution and integration potential, while ending the company's status as an independent vendor whose roadmap, pricing, and customer support can be diligenced separately.

The technology has credible dual-use relevance because authorization policy enforcement is a foundational control for commercial cloud systems, government networks, and defense mission-support software. It can support least privilege, separation of duties, policy compliance, and auditable access decisions in sensitive environments. The dual-use case remains architectural rather than evidence of defense deployment: no reliable public source reviewed here establishes a Build.Security defense customer, classified deployment, government contract, or security certification. For Claw & Talon, the record is therefore most useful as an acquired cyber capability and market signal around policy-driven cloud security, not as an investible independent defense startup."""
