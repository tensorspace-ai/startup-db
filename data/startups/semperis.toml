dual_use_description = 'Identity systems (Active Directory, Entra ID) are the attack surface in virtually all government, military, and critical-infrastructure cyberattacks. Semperis builds purpose-built tools for identity-layer attack prevention, detection, and forensic recovery. Dual-use potential is clear and high: the same ransomware-recovery and identity-forensics capabilities that protect hospitals and Fortune 500 companies are directly applicable to post-compromise defense of military networks, intelligence systems, critical infrastructure, and other national-security assets. The company explicitly markets to government agencies (visible customer: Michigan state), and identity resilience is a national-security imperative in cyber-warfare and critical-infrastructure defense. Unlike generic security tools, Semperis specializes in the exact layer where nation-state and advanced actors operate (identity compromise, Tier-0 asset control, privilege escalation). This is not adjacent dual-use; it is central to defense cybersecurity.'
