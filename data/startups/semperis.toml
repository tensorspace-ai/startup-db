priority_rationale = 'High priority for a dual-use/deep-tech portfolio. Semperis is an Israeli-founded company with direct national-security cyber relevance, strong execution, credible dual-use potential, and material growth runway. The combination of exceptional market fundamentals (identity attacks are the dominant breach vector), specialized technology (purpose-built identity resilience), strong team (deep expertise in AD/Entra ID, 175+ MVP years), and dual-use applicability (identity resilience is foundational to government/defense cyber defense) makes this a high-conviction opportunity. The company is also not yet a global household name, suggesting valuation may be more accessible than fully mature competitors. The identity-resilience category is likely to become a national-security priority in government cyber procurement, and Semperis is well-positioned to capture significant share.'
