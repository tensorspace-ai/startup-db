name = "GrayMatters Health"
description = "GrayMatters Health is an Israeli neurotechnology company developing Prism, an FDA-cleared digital self-neuromodulation system that uses fMRI-informed EEG biomarkers and an interactive audiovisual interface to help patients regulate brain activity associated with PTSD and depression. Its strategic relevance is strongest in trauma-care and human-resilience infrastructure, including potential care pathways for veterans and other populations exposed to combat or traumatic events."
detailed_description = """
**Product and the concrete problem it solves.** GrayMatters Health addresses a stubborn gap in mental-health care: many people with chronic post-traumatic stress disorder do not obtain adequate relief from medication or psychotherapy, while some avoid treatment because it requires repeatedly discussing or re-experiencing trauma. The company’s flagship product, Prism for PTSD, is a prescription adjunctive therapy that combines a soft EEG cap with a computer simulation. During a course of 15 sessions, normally delivered over approximately eight weeks, patients practice mental strategies that cause animated characters in the simulation to sit down and lower their voices as the target brain signal changes. The experience is deliberately non-trauma-based. The clinical goal is not to diagnose PTSD or replace a psychiatrist, but to teach a patient a repeatable self-regulation skill that can augment standard care. GrayMatters has also expanded the Prism suite toward depression, where its public materials describe a reward-system biomarker and an anhedonia-oriented protocol. This is a specific clinical workflow rather than a generic wellness app: a trained operator runs sessions in a quiet room, the software captures EEG data, the clinician oversees the treatment plan, and the company provides installation, training, and account support to participating interventional-psychiatry practices.

**Core technology and how it actually works.** The technical foundation is the company’s EEG-fMRI-Pattern, or EFP, biomarker approach. Researchers first use functional MRI to identify activity in a deep brain region associated with a disorder, such as amygdala activity linked to fear and emotion regulation in PTSD. They then use statistical and machine-learning models to register that deep-brain signal against scalp EEG patterns. The resulting model makes an otherwise inaccessible target available through an EEG headset during routine treatment. FDA documentation describes Prism as a biofeedback device using eight or more EEG channels and an audio-visual interface; the device does not require a patient to remain inside an MRI scanner during therapy. In the PTSD protocol, the patient sees a responsive simulation and learns which personal memories, emotions, or thoughts help downregulate the amygdala-derived EFP signal. The mechanism is therefore a closed-loop neurofeedback system: acquire EEG, estimate the brain-mechanism-specific biomarker in real time, translate the signal into immediate audiovisual feedback, and let the patient iteratively learn a control strategy. GrayMatters licenses core patented technology developed by Professor Talma Hendler and her Tel Aviv University and Tel Aviv Sourasky Medical Center research team. The company’s public materials do not disclose the model architecture, training-set size, electrode-level signal-processing details, or patent numbers, so the scientific concept is well described while the defensibility of the implementation remains a diligence question.

**Market, customers, and go-to-market.** GrayMatters sells into a clinically mediated B2B2C market rather than directly prescribing treatment to consumers. The immediate buyer is an interventional psychiatry practice, behavioral-health clinic, or hospital program that can provide a room, a trained Prism operator, and a qualified clinician. The company’s stated operating proposition is intentionally lightweight: installation and training can be completed by the provider team, sessions can be administered by a non-physician operator, and an account manager helps the practice build a Prism service. This model can broaden access where psychiatrists are scarce, but it also makes adoption dependent on reimbursement, clinical workflow fit, patient screening, operator training, and evidence that clinics can fill enough sessions to justify equipment and support costs. Publicly named or documented clinical relationships include NYU Langone, McLean Hospital, and Israeli and U.S. study sites; Butler Hospital’s BRaIN program has separately described Prism as an available outpatient service. GrayMatters has also reported expansion across U.S. clinics and a community-clinic case study in Texas, but the company does not disclose a complete customer list, recurring revenue, installed-base count, per-site economics, or payer coverage in the sources reviewed. The international route has an important early signal through Otsuka Medical Devices, which led the 2022 Series A and obtained rights to Prism in Japan and other Asian countries. That gives GrayMatters a partner with market access, but does not by itself prove scaled sales in Asia.

**Traction, funding, and third-party validation.** The company has progressed further than a concept-stage neurotech venture. GrayMatters was founded in 2018, completed a $10 million Series A in January 2022 led by Otsuka Medical Devices, and received a European Innovation Council grant followed by an EIC Fund investment. The FDA’s public 510(k) database records Prism under K222101, identifies Graymatters Health, Ltd. in Haifa as the applicant, and records a March 17, 2023 decision. The clearance allows the device to be marketed as an adjunctive treatment for symptoms associated with PTSD under the direction of a healthcare professional; it is a 510(k) substantial-equivalence clearance, not proof that every clinical or commercial claim has been established. A prospective, multisite, multinational, single-arm, open-label study published in Psychiatry Research evaluated 79 adults with chronic PTSD, including veterans and civilians. The company and the publication report a 66.7% CAPS-5 clinically meaningful response rate at three months after treatment, a 13.5-point average reduction in CAPS-5, statistically significant changes in secondary measures, and mild adverse events. GrayMatters reports 32% remission and 90% compliance at the same follow-up. Those results are meaningful validation, but the absence of a randomized control group limits comparative conclusions. A 2026 Frontiers in Psychiatry case report describes two people with severe traumatic brain injury and PTSD who received Prism, while explicitly concluding that controlled trials are still warranted. The evidence stack is therefore unusually concrete for an early digital therapeutic, but it remains a mix of regulatory clearance, an uncontrolled clinical study, case reports, and company-linked research rather than definitive comparative efficacy.

**Founders and team background.** GrayMatters combines Israeli neuroscience research with a commercialization team drawn from technology, finance, water, and clinical operations. The company identifies Oded Kraft as CEO and co-founder, Rani Cohen as co-founder and executive chair, and Shai Attia as co-founder and VP of R&D. Professor Talma Hendler is the inventor of the licensed core technology, chair of the scientific advisory board, and chief medical scientist; her academic and hospital roles connect the company to Tel Aviv University, the Sagol Brain Institute, and Tel Aviv Sourasky Medical Center. The broader team listed by GrayMatters includes clinical, regulatory, quality, medical, sales, and engineering roles, including Aron Tendler as chief medical officer and Adar Shani in clinical, regulatory, and quality leadership. The company’s older team page describes Ilan Katz, a water-treatment and environmental-engineering entrepreneur, as a founder or CTO, while newer public materials emphasize Attia in the R&D role. That inconsistency should be resolved through corporate and employment diligence rather than silently normalized. The founders’ complementary profile is a strength: the business side has experience moving regulated technologies toward market, while the scientific platform originates in a research program with a clear brain-circuit hypothesis. The counterpoint is that digital therapeutics require a rare combination of clinical trial execution, reimbursement expertise, medical-device quality systems, and repeatable enterprise sales; a small company must demonstrate depth across all four, not only scientific credibility.

**Competitive dynamics.** GrayMatters competes against several different alternatives because a PTSD clinic can spend its limited budget on a therapy, a device, additional staff, or no new intervention at all. The incumbent approach is trauma-focused psychotherapy, pharmacotherapy, and hybrid standard-of-care programs, which have large evidence bases and established reimbursement even when patient response is incomplete. NeuroStar and BrainsWay compete through transcranial magnetic stimulation platforms, with different mechanisms, clinic economics, and indications. Freespira competes with a digital, non-drug intervention based on respiratory biofeedback for PTSD and panic symptoms. Flow Neuroscience and other transcranial direct-current-stimulation providers compete for depression-oriented neuromodulation budgets. GrayMatters’ most defensible distinction is not simply that Prism is digital or non-invasive. It is the attempt to target a disorder-linked, deep-brain-informed biomarker and train a patient to regulate that signal through an accessible EEG loop, without requiring MRI during every treatment. That may produce a more mechanistically specific intervention and a more engaging workflow than generic relaxation biofeedback. The threat is that clinical buyers ultimately optimize for durable outcomes, reimbursement, safety, and staff utilization rather than mechanistic elegance. Competitors with stronger distribution, larger regulatory teams, or bundled device portfolios can narrow the gap. The single-arm design, relatively small study, and company involvement in the evidence also leave room for placebo, selection, and expectancy effects to influence perceived differentiation.

**Defense, security, and resilience dual-use relevance.** GrayMatters’ dual-use case is a direct resilience application, not a weapons or intelligence application. PTSD, traumatic brain injury, sleep disturbance, anxiety, and depression affect veterans, active-duty personnel, first responders, disaster survivors, and civilians, and the ability to deliver a non-invasive adjunct without requiring a patient to describe the trauma at every session could be operationally relevant in military and emergency-response health systems. The published Prism study included combat or military trauma participants, and the 2026 case report addresses PTSD in people with severe TBI and psychiatric comorbidities. These are useful bridges to defense medicine and national resilience because recovery capacity can affect retention, readiness, return to work, family stability, and the load on scarce specialist services. A distributed clinic model could also matter for bases, veteran-care networks, humanitarian-response settings, or regions where specialist mental-health capacity is limited. The calibration is important: GrayMatters does not publicly disclose an Israeli Ministry of Defense contract, a U.S. Department of Defense procurement, military reimbursement, field deployment, or a defense-specific product variant. The company’s current commercial story is civilian and clinical. The strongest claim is therefore that the same FDA-cleared core technology is plausibly usable in defense-adjacent trauma care and public-health resilience, with scientific evidence involving combat trauma, rather than that GrayMatters is already a defense supplier. Any such expansion would require military clinical validation, privacy and data-segregation controls, procurement and reimbursement pathways, and evidence that treatment performance survives the operational constraints of those settings.

**Growth stage, trajectory, and key diligence risks.** GrayMatters is best classified as mid-stage: founded in 2018, backed by a meaningful Series A and EIC support, FDA-cleared for a defined PTSD indication, published in a peer-reviewed journal, and moving from selected clinics toward a broader U.S. service footprint. It is not mature because public sources do not establish durable revenue scale, payer coverage, a large installed base, randomized comparative evidence, or international commercialization at volume. Its likely trajectory is to deepen Prism’s PTSD clinic network, use the depression protocol and Prism Imagine to broaden the platform, and convert clinical evidence into reimbursement and provider economics. The main diligence questions are: (1) whether the 67% response and 32% remission outcomes replicate in controlled or larger real-world cohorts; (2) whether benefits persist beyond the reported follow-up and translate to functional outcomes; (3) what portion of the evidence and clinical operations is company-funded or company-authored; (4) whether clinics can fill sessions and earn attractive margins after operator, support, and reimbursement costs; (5) whether FDA clearance is complemented by the quality systems and country approvals needed for expansion; (6) whether the biomarker and software implementation are protected by enforceable patents, exclusive licenses, or difficult-to-recreate datasets; and (7) whether patient EEG variability, comorbidities, medication changes, and trauma type affect response. The upside is a differentiated, regulated platform for trauma and depression care. The risk is that strong early signals fail to become repeatable clinical economics, especially as better-capitalized neuromodulation and digital-therapeutic competitors pursue the same clinics.
"""
