competitive_edge = "GrayMatters’ edge is the combination of a deep-brain-informed biomarker, accessible EEG delivery, interactive patient feedback, and a regulated adjunctive-therapy workflow. The EFP approach attempts to connect activity identified with fMRI to a signal that can be estimated in real time from scalp EEG, allowing the treatment to target a defined brain mechanism without using MRI during each session. The company also has useful commercialization evidence through FDA clearance, peer-reviewed PTSD results, Otsuka’s strategic participation, and clinics that have made Prism available. The edge remains conditional. The main study was single-arm and open-label, the biomarker implementation and patent estate are not publicly detailed, and competing neuromodulation providers may have stronger distribution, reimbursement infrastructure, or clinical evidence. Durable advantage will depend on replication, long-term functional outcomes, exclusive rights to the underlying science, data and personalization assets, and clinic economics that outperform standard care or alternative devices."
