name = "CoreTigo"
description = "CoreTigo develops industrial wireless connectivity built around IO-Link Wireless, allowing machine builders and manufacturers to replace selected cables with deterministic, low-latency links for sensors, actuators, motion systems, and factory monitoring. Its products target flexible automation, retrofit projects, and moving or rotating machinery where cabling limits throughput, maintenance, or machine design."
detailed_description = """CoreTigo was an Israeli industrial-automation company founded in 2017 and headquartered in Netanya. Its product portfolio combined IO-Link Wireless masters, bridges, hubs, system-on-module components, antennas, starter kits, and engineering or monitoring software. The underlying approach extended the wired IO-Link ecosystem into wireless factory environments: devices communicated through a scheduled, deterministic protocol rather than relying on general-purpose Wi-Fi or Bluetooth. CoreTigo public technical material described 5 ms communication latency, synchronized operation, interference coexistence, and support for up to 40 end devices per wireless master in the relevant configuration. Those were engineering claims for defined system conditions, not blanket guarantees for every factory or radio environment.

The commercial problem was concrete. Cables and dress packs constrain robot end-effectors, rotating tooling, independent movers, crossbelt sorters, transport tracks, and machines that need frequent changeovers. Cable wear can also create maintenance and unplanned-downtime exposure. CoreTigo sold through machine builders, system integrators, automation-equipment manufacturers, and industrial end users, with applications across automotive, logistics, packaging, food and beverage, pharmaceuticals, metalworking, condition monitoring, and smart machine tooling. Its standards-based strategy could reduce integration friction, while embedded modules let third parties add wireless capability to sensors, actuators, and specialized equipment. Public case material and partner references indicated ecosystem activity with Rockwell Automation, VAHLE, Emerson, Eurofork, Rotzinger PharmaPack, and others; the accessible public record did not establish deployment scale or revenue concentration beyond the later trustee-report-based disclosures.

The financing record includes a $10 million Series A announced in 2019, a $13 million Series B announced by Verizon Ventures in 2021, and a 2023 CoreTigo release saying Amazon's participation brought Series B1 to a cumulative $18 million. Verizon reported total funding of $27 million at the time of its 2021 announcement. Subsequent database aggregates differ and are not reconciled here. None of these announcements discloses valuation or investor ownership percentages. Amazon Industrial Innovation Fund, Emerson Ventures, Qualcomm Ventures, Verizon Ventures, Sierra Ventures, Cardumen Capital, Lenovo Capital, Magma Venture Partners and Meron Capital appear in company or investor announcements.

The business did reach commercial operations. Geektime, citing the trustee's report in March 2026, reported approximate annual sales of $2.5 million during 2019–2022. It also reported 2025 order growth of 60%, cost reductions and a workforce reduction from 60 to 24. The same report describes a severe anchor-customer concentration: German sensor maker SICK represented about half of revenue or more including services, deferred orders, and told CoreTigo in December 2025 that it could not meet its commitments. These figures are secondary reporting rather than audited accounts. Geektime also reported low remaining cash, employee and supplier liabilities, bank debt and long lease obligations. The Israeli company registry aggregator lists CoreTigo Ltd. as dissolved by court and records court liquidation on 11 February 2026; Geektime reports that the court found no prospect of rehabilitation and appointed a trustee to realize assets. The operating business should therefore be treated as closed. No acquisition buyer or completed transfer of its product line was identified in reviewed sources.

Historically, differentiation was less about owning a general wireless network and more about solving a narrow OT control problem: predictable timing, device density, rugged hardware, and compatibility with PLC and IO-Link workflows. Substitutes included wired architectures, industrial Ethernet, private 5G, Wi-Fi, Bluetooth, proprietary motion links, and wireless offerings from large automation vendors such as Siemens, Phoenix Contact and HMS Networks. A focused protocol and embedded OEM path offered potential integration advantages, while incumbents could bundle connectivity with controllers, drives, safety systems and service contracts. Customer qualification, spectrum behavior, cybersecurity, functional safety, lifecycle support and long machine-design cycles remained material hurdles.

CoreTigo's historical technology had indirect dual-use relevance through resilient production of defense-relevant goods, maintenance facilities, logistics automation and industrial supply chains. That is an industrial-base continuity thesis, not evidence of defense customers, anti-jam certification or classified deployment. Its shutdown materially changes the present strategic assessment: any continuing value depends on the liquidation estate, enforceable patents, subsidiaries, and any verified sale or licensing of those assets. Due diligence should seek court and trustee filings, reconcile full financing and liabilities, test reported customer concentration against company records, and identify who now controls the patents and software. The former company's technical and ecosystem record remains relevant for Israeli industrial technology analysis, but the defunct legal entity is not an active supplier or investment candidate."""
