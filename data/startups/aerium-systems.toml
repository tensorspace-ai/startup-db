name = "Aerium Systems"
description = "Aerium Systems is an Israeli developer and seller of compact avionics, edge-compute, navigation, power, and connectivity hardware for unmanned and embedded platforms. Its public portfolio is aimed primarily at commercial robotics and system integrators, while the same low-size, weight, power, and rugged-integration requirements create credible defense and security adjacency."
detailed_description = """
Aerium Systems builds the electronics layer around autonomous platforms rather than selling a complete drone, ground vehicle, or autonomy software stack. Its current official catalog includes Lumen and Helios carrier boards for NVIDIA Jetson modules, Kelvin for Raspberry Pi Compute Module 5, Radian and Apex Pixhawk-compatible autopilots, Altius for CubePilot Cube integration, and a growing set of GNSS, power, motor-control, USB, Ethernet, M.2, and communication modules. The documentation gives unusually concrete engineering detail for a small company: Helios is specified for Jetson Orin Nano/NX, supports a 12–48 V input range, and includes an onboard TPM 2.0; Orbit combines a u-blox NEO-M9N GNSS receiver with a magnetometer in a 25 mm square board; and the power products target high-voltage LiPo systems with telemetry. This is a practical hardware platform strategy, not evidence that Aerium owns the autonomy algorithms running on those computers.

The customer proposition is reduced integration work for developers and OEMs working inside tight mechanical, electrical, and weight constraints. Carrier boards expose compute-module interfaces, autopilots provide sensor redundancy and Pixhawk ecosystem compatibility, and power and connectivity boards reduce wiring and custom-board effort. Aerium's site and documentation support both direct product sales and technical integration: the storefront lists prices and typical two-to-five-business-day processing, while the documentation provides manuals, pinouts, CAD resources, and setup guidance. Aerium also reports 150+ autonomous systems and 1,000+ operational hours on its about page; these are company-reported operating signals, not independently audited customer or revenue metrics. Public information does not establish customer concentration, annual sales, recurring software revenue, certifications, or venture financing.

The competitive position is strongest where a buyer needs a compact, off-the-shelf subsystem or a custom form factor that is faster to integrate than a ground-up PCB. Aerium competes with established Pixhawk and autopilot vendors such as Holybro, CubePilot, and CUAV; with Jetson and Raspberry Pi carrier-board suppliers; and with embedded-electronics design houses that can produce a bespoke board. Aerium's breadth across compute, flight control, navigation, power, and I/O can help a small integrator source a coherent stack, but the public record does not demonstrate a proprietary semiconductor, autonomy model, protected protocol, or certification moat. Dependence on third-party processors, GNSS chipsets, open autopilot ecosystems, and electronics manufacturing also limits differentiation and exposes the company to component availability and price competition.

The dual-use case is credible at the subsystem level. Compact flight-control, GNSS, edge-AI, power, and communications hardware can support inspection, mapping, agriculture, logistics, emergency response, and industrial robotics; the same functions are relevant to unmanned surveillance, reconnaissance, perimeter monitoring, and other defense systems. A 2025 company-sponsored Haaretz feature additionally describes ambitions around robotic swarms, GPS-free navigation, object tracking, and aerial interception, but that is promotional material and should not be treated as proof of deployment, government procurement, or weapons integration. Aerium's current product pages emphasize general-purpose hardware and do not publicly document military customers, export licenses, or defense contracts. Strategic diligence should therefore test qualification evidence, production quality, software support, supply-chain resilience, export-control posture, and whether the company can move from component sales into repeat OEM programs without assuming classified traction.
"""
