competitive_edge = "The defensible position is the integrated, mature system rather than a single novel airframe. Reported operational scale, rapid backpack deployment, autonomous flight, GNSS-denied capability, ruggedization, secure communications, payload flexibility, operator training, and lifecycle support together address procurement and sustainment friction for defense customers. Elbit ownership adds a global defense channel, systems-integration capacity, and a path into larger programs, while the THOR U.S. Army announcement is a concrete current relevance signal. The tradeoff is that Elbit’s broader portfolio creates powerful substitutes and may make the former company’s standalone differentiation, pricing power, and financial contribution difficult to assess."
