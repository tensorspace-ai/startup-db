strategic_value = "High strategic value as a mature tactical-autonomy capability embedded in a major defense-prime channel. THOR and Magni-X address the military demand for affordable, rapidly deployable organic aerial sensing, while Nevo, secure communications, payload integration, training, and sustainment create a fuller mission system than an airframe alone. The 2026 U.S. Army-related announcement indicates relevance to allied force modernization, but the database should distinguish publicly reported selection and delivery activity from independently verified contract economics. Civilian and homeland-security value is credible, though secondary to defense demand."
