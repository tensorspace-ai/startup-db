name = "EyeR Security"
description = "EyeR Security is an Israel-based cybersecurity startup combining an AI-native managed detection and response platform with human-led incident response for organizations that need broad coverage without building a large SOC. Its public materials describe autonomous investigation across cloud, SaaS, identity, endpoints, email, and dark-web exposure, with on-premise and customer-controlled deployment options for regulated or sovereignty-sensitive environments."
detailed_description = """
**Product and the concrete problem it solves.** EyeR Security addresses a familiar but strategically important failure mode in cyber defense: organizations collect more alerts and telemetry than their security teams can investigate, while attackers move across cloud services, SaaS, identities, endpoints, email, and exposed credentials. EyeR packages a managed-defense service around a proprietary AI platform that the company says handles tier-one and tier-two operations autonomously, leaving human practitioners to handle high-consequence judgment, incident response, and forensics. This is not simply a dashboard or an alert feed. The public service model combines continuous monitoring, threat detection, investigation, containment, reporting, and escalation, with additional offerings for penetration testing, architecture review, emergency response, and discreet VIP protection. The concrete buyer problem is therefore operating a credible 24/7 defensive function when an organization cannot recruit or afford a full internal SOC.

**Core technology and how it actually works.** EyeR's platform is presented as an agentic MDR and threat-detection-and-response layer that turns raw security telemetry into an evidence-backed decision. The official platform description organizes the capability into cloud security posture management, SaaS security posture management, identity threat detection, endpoint detection and response, email security, and dark-web intelligence. Its stated mechanisms include asset discovery, configuration-baseline analysis, identity and service-account behavior analytics, anomalous-authentication detection, ransomware and fileless-malware detection, phishing and business-email-compromise analysis, underground-source monitoring, MITRE ATT&CK mapping, attack timelines, IOC enrichment, and automated quarantine or remediation. The company says its agents were trained on hundreds of real incident datasets and that the system can analyze alerts in under 60 seconds. Those are company claims rather than independently published benchmarks, but they describe a coherent technical architecture: normalize signals from existing tools, apply context-specific reasoning, produce a traceable investigation, and recommend or execute bounded response actions.

**Market, customers, and go-to-market.** EyeR sells through a hybrid model that can reach both organizations and managed-service providers. Its managed-defense page says the service can sit on top of an approved customer telemetry stack such as Microsoft Defender for Endpoint, CrowdStrike, SentinelOne, or Cybereason, which reduces the need for a rip-and-replace endpoint decision. Service tiers range from a smaller-team package to unlimited-scale enterprise coverage, while the platform materials emphasize REST APIs, webhooks, executive dashboards, compliance reporting, and multi-tenant isolation. The company also presents EyeR as a provider for MSSPs and multi-entity security teams, where tenant boundaries and per-customer context are important operating constraints. Its public company page reports 50 customers and up to 80% cost savings, but no customer names, contract values, retention figures, revenue, or independently audited cost study were located. The go-to-market thesis is credible for resource-constrained enterprises, regulated businesses, and channel partners, but conversion from service engagement to scalable software revenue remains a central diligence question.

**Traction, funding, and third-party validation.** The public evidence shows a company that is beyond a slideware concept but still early in disclosure maturity. EyeR reports 50 trusted customers, 24/7 service, an under-60-second AI analysis window, and ISO 27001 certification on its public materials. Its managed-defense service describes production-oriented integrations with widely deployed EDR and XDR platforms, and the emergency-response page lays out a three-phase operating procedure covering immediate containment, forensic investigation, and recovery or hardening. The company profile on LinkedIn identifies EyeR Security as a privately held Tel Aviv cybersecurity company founded in 2024 with an 11-50 employee range. These are useful public signals, but most performance numbers and customer outcomes are company-reported. The reviewed sources did not establish a financing round, named enterprise reference, revenue scale, renewal rate, patent portfolio, or independent efficacy study. Funding stage is therefore recorded as Unknown rather than inferred from the product's apparent maturity.

**Founders and team background.** EyeR's public company page describes the founding insight as coming from veteran security analysts who saw analysts drowning in false positives and wanted AI to reason over context rather than merely detect anomalies. The public materials do not provide a complete named founding roster, but LinkedIn identifies Orel Asper as Co-Founder and CEO. EyeR says its security team includes practitioners with OSCP, OSWE, GCFA, and GCFR credentials and experience in threat hunting, incident response, digital forensics, security operations, machine learning, autonomous systems, distributed security telemetry, and workflow automation. The combination is relevant to the product because MDR quality depends on more than model output: analysts must understand evidence, containment safety, legal preservation, customer communications, and the operational consequences of a false positive. The team is still small by the standard of supporting a 24/7 global service, so diligence should verify on-call coverage, automation boundaries, responder depth, customer concentration, and whether the named certifications belong to employees or contractors.

**Competitive dynamics.** EyeR competes against both software platforms and outsourced security operations. **CrowdStrike Falcon Complete** and **SentinelOne Vigilance** combine endpoint telemetry, threat intelligence, and managed response at global scale; **Microsoft Defender XDR** can bundle identity, endpoint, email, cloud, and security-operations data into an incumbent ecosystem; **Arctic Wolf** and **Expel** compete directly for outsourced MDR budgets; **Torq** and other Israeli automation vendors compete on workflow orchestration and autonomous response; and internal SOCs or regional MSSPs remain the default substitute for many buyers. EyeR's plausible edge is the combination of AI-led investigation, vendor-flexible ingestion, human escalation, sovereignty-oriented deployment, and a service layer that also covers emergency response and VIP exposure. That edge will be durable only if the company proves lower analyst workload, faster containment, fewer false positives, explainable decisions, and materially simpler deployment than a buyer's existing stack. Large incumbents possess more telemetry, distribution, certifications, and response capacity, so a small provider must win on responsiveness, local trust, and measurable outcomes rather than broad feature count.

**Defense, security, and resilience dual-use relevance.** EyeR's core technology credibly serves both commercial and defense or resilience contexts, so dual_use is set to true, with the important caveat that public evidence verifies a commercial security offering rather than a fielded military program. Defense ministries, defense contractors, utilities, hospitals, ports, financial institutions, and government agencies all face the same structural problem: privileged identities, endpoints, cloud systems, email, and third-party services create a large attack surface, while a shortage of expert defenders increases time-to-detection and time-to-containment. An AI layer that correlates telemetry, reconstructs attack timelines, and supports bounded response can improve continuity during ransomware, credential theft, supply-chain compromise, and coordinated intrusion campaigns. EyeR's stated on-premise, air-gapped, customer-controlled, and tenant-isolated options are particularly relevant to sovereign or disconnected environments. The limits matter equally: no reviewed source verifies an IDF contract, classified accreditation, government deployment, critical-infrastructure program, operation in a disconnected enclave, or defense export authorization. The dual-use case is therefore a credible cyber-resilience transfer path, not evidence of defense adoption.

**Growth stage, trajectory, and key diligence risks.** EyeR is classified as early because the public profile gives a 2024 founding year, an 11-50 employee range, and customer and certification claims, but does not disclose financing, revenue, headcount detail, or independently validated scale. Its trajectory could be attractive if the company converts the labor scarcity behind MDR into an efficient, sovereign-friendly operating model that MSSPs and regulated organizations can deploy without surrendering sensitive telemetry to a third-party AI cloud. The principal diligence risks are: (1) customer-quality risk, because 50 customers may include pilots, small accounts, or service engagements rather than durable recurring contracts; (2) efficacy risk, because under-60-second analysis and up-to-80% savings require reproducible definitions and third-party measurement; (3) automation risk, because an incorrect containment action can interrupt a hospital, utility, or defense supplier while a missed threat can create catastrophic exposure; (4) platform-bundling risk from Microsoft, CrowdStrike, SentinelOne, and hyperscalers; (5) service-scaling risk as a small team supports 24/7 response; (6) data-governance and export-control risk for sovereign deployments; and (7) moat risk if the platform's advantage is mainly orchestration around third-party telemetry. The milestones to watch are named customer references, audited ISO scope, paid retention, independently tested response precision, disclosed funding, and demonstrated operation in high-consequence or disconnected environments.
"""
