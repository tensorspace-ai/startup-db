name = "Cyolo"
description = "Cyolo develops identity-centric secure remote and privileged access for cyber-physical and industrial environments, helping enterprises replace broad network VPN exposure with tightly scoped, auditable access for employees and third parties in high-consequence operations. In 2026 it extended its platform into OT microsegmentation and asset discovery."
detailed_description = "Cyolo Security Ltd is an Israeli privately held cybersecurity company building access governance for operational technology (OT), cyber-physical systems (CPS), and critical infrastructure. The company was founded in 2020 and is headquartered in Ramat Gan. Its business is enterprise software, sold directly and through systems integrators, resellers, and managed security partners. The core product, Cyolo PRO, governs remote privileged operations: verified users and third parties receive narrowly scoped access to applications or assets, with identity checks, policy enforcement, approvals, MFA, credential controls, session recording, and audit visibility. It is designed for on-premises, cloud, hybrid, isolated, and legacy-heavy settings where operators cannot simply replace equipment or tolerate downtime. The commercial promise is reduced broad VPN exposure and simpler, more accountable access for vendor maintenance and distributed plant operations; actual outcomes should be tested customer by customer. In July 2026 Cyolo announced CPS Segmentation, extending its offer from human-to-machine access to machine-to-machine communication discovery and policy enforcement. The platform now spans remote access, asset discovery, and microsegmentation, increasing addressable scope while placing the company in more direct competition with full-stack OT security vendors. Company-reported examples include Rapac Energy, a power plant operator, whose published case study describes daily use by employees, customers, and suppliers and a one-day implementation. This is credible deployment evidence, but one vendor-authored case study does not establish broad adoption, independent outcome validation, customer concentration, or revenue. The financial record remains private: the company announced a $4.2 million seed in April 2020, a $21 million Series A in July 2021, and a $60 million Series B in June 2022, reporting $85 million total raised after the Series B. No later public financing, valuation, revenue, ARR, profitability, burn, or runway disclosure was located in this review. Founders named on the company site are CEO Almog Apirion, CTO Dedi Yarkoni, and Chief Architect Eran Shmuely. The current company page also lists senior functional leaders, though public biographies and appointment dates are uneven. The team combines product and technical founders with commercial leadership, but execution capacity and retention require direct diligence. The company’s US patent US12627669B1, granted in May 2026 and assigned to Cyolo Security Ltd, covers a component architecture for managing secure access to internal resources; this is one documented patent family and does not establish the breadth or enforceability of the full IP portfolio. Cyolo’s business opportunity is supported by persistent operational needs: contractors and OEMs need access to remote plants, OT assets often cannot be patched or modernized quickly, and plant owners need auditable controls without interrupting production. The same capabilities can protect commercial utilities, manufacturing, energy, data centers, transport, and defense supply-chain operations, making the technology dual-use. Public materials establish general industrial and critical-infrastructure applicability but do not establish defense contracts, classified deployments, government customers, or certifications. Competitive alternatives include purpose-built OT providers such as Claroty and Xage, industrial remote-access specialists, traditional PAM vendors such as CyberArk and BeyondTrust, and broader network/security suites. Cyolo’s potential differentiation is a compact access-centered workflow for difficult OT environments and a path into segmentation, but its July 2026 expansion makes product breadth and implementation claims especially important to validate. Claroty already describes a broad CPS platform combining visibility, threat detection, network protection, and secure access; Xage promotes identity-based, asset-level access and segmentation. Large vendors can bundle features and exert price pressure. Cyolo must demonstrate reliable integrations, policy granularity, resilience during disconnected or degraded operation, deployment safety, and a repeatable channel-led sales model. Investment diligence should focus on post-2022 financing and any undisclosed ownership changes; revenue quality, renewal and expansion rates, gross margin, sales cycle, customer concentration, deployment and support burden; independent verification of claimed savings and security effects; segmentation product maturity and customer adoption; patent family scope and freedom to operate; and the depth of the current leadership bench. Until those items are supported with company and customer evidence, Series B status and named deployments support a mid-stage assessment, not a conclusion about scale or durable market leadership."
logo = "https://cyolo.io/img/logo-dark.svg"
website = "https://cyolo.io"
sector = "OT/ICS Cybersecurity"
