name = "Nerlos"
description = "Nerlos is an Israeli RF and microwave technology company developing compact multiplexers, PCB-based radio cavities, duplexers, and radio-over-fiber subsystems for tactical communications, homeland security, aerospace, telecom, and critical infrastructure. Its core proposition is to reduce antenna and RF-system complexity while preserving reliable multi-radio operation in mission-critical environments."
detailed_description = """
**Product and the concrete problem it solves.** Nerlos addresses a physical integration problem that becomes acute as a vehicle, aircraft, command post, or public-safety site carries more radios: every additional frequency, antenna, filter, cable run, and radio enclosure adds weight, installation complexity, co-site interference risk, and another failure point. The company presents a product family built around the Active Multiplexer Unit (AMU), Radio Cavity Made by PCB (RCMP) technology, radio-frequency-over-fiber (RFoF), RF filters, and integrated subsystems. Its AMU is described by the Israel Innovation Authority as a multiplexer that changes working frequencies during transmission and reception. Nerlos says the broader system goal is to let multiple radios share antenna infrastructure and to deliver every signal through a simpler, more integrated architecture. The target buyers are not generic electronics consumers: public materials identify defense and military communications, homeland security and public safety, aerospace and aviation, telecommunications infrastructure, and critical-infrastructure operators.

**Core technology and how it works.** The technical stack combines RF circuit design, microwave filtering, antenna-path integration, and optical signal transport. A conventional radio installation often uses separate cavities, duplexers, filters, amplifiers, and antenna paths for each band. Nerlos describes RCMP as a lightweight radio cavity and duplexer approach implemented on printed-circuit boards, while AMU is intended to manage multiple working frequencies through a shared path. The company also offers RFoF, which transports radio signals over optical fiber so that the RF source and the remote antenna or radio node can be separated over long distances without relying on a long, heavy coaxial run. Its official materials describe adaptive signal management, RFoF, filters, electromagnetic simulation, embedded-component design, and integrated RF subsystems as parts of the capability set. The public record does not disclose full insertion-loss, isolation, power-handling, environmental, or waveform performance data, so the engineering case is credible but still requires customer-level qualification evidence.

**Market, customers, and go-to-market.** Nerlos operates in a specialized B2G and systems-engineering market in which the buyer values interoperability, low size and weight, reliability, maintainability, and the ability to fit new radios into an existing platform. The Innovation Authority classifies the company as B2G and lists defense and military communications, homeland security and public safety networks, aerospace and aviation systems, telecommunications infrastructure, and critical-infrastructure operators as target customers. That is a coherent dual-use route: defense programs can pull through demanding RF qualification, while telecom, public-safety, and infrastructure deployments can provide non-defense applications for the same engineering base. Nerlos describes itself as working with partners and positions its products as components or integrated subsystems rather than as a mass-market standalone device. No named customer, purchase order, deployment quantity, distributor agreement, revenue figure, or recurring-contract metric is publicly confirmed. Diligence should therefore distinguish a technically capable supplier with initial revenues from a scaled platform vendor with repeatable production and channel leverage.

**Traction, funding, and third-party validation.** The company was established in 2010, according to the Israel Innovation Authority and the company's LinkedIn profile, and the Authority lists its current stage as initial revenues with supplementary funding. The same government record identifies a 2024 Applied Research in Industry in Collaboration with DDR&D (MAFAT) program entry, while Nerlos' own website states that it is supported by the Israel Innovation Authority. These are meaningful ecosystem and public-R&D signals, particularly because the technology sits in an area where defense-relevant RF innovation benefits from applied testing. The company also appeared in an Israeli government export-delegation catalog describing its RF and microwave specialization, compact communications solutions, and defense, homeland-security, and telecom orientation. LinkedIn describes a 2025 transition from an RF engineering and consulting company toward a product-focused defense-technology startup and identifies the AMU program as beginning in 2025. The public record does not disclose the amount or terms of supplementary funding, venture investors, valuation, backlog, profitability, certifications, or independently audited operating performance.

**Founders and team background.** Founder and CEO Nimrod Rospsha brings unusually deep RF-system continuity to the company. Nerlos' official biography describes more than two decades across medical technology, wireless infrastructure, defense systems, airborne radar and communications, wireless charging, wearables, and smart infrastructure. It identifies prior work at Topspin Medical, Mobile Access, Flamingo Electronics, CELLO, Insertech, Intaltech, UV Tech, Humavox, GMedical, and Telematics, and says he worked with leading defense companies including Elbit, Rafael, and Elta on SIGINT, antennas, chirp radar, and advanced RF components. The same biography gives him B.Sc. and M.Sc. degrees with honors in Physical Electronics Engineering from Tel Aviv University, current doctoral work on stimulated super-radiance in free-electron lasers, patents on the AMU and RCMP technologies, and a publication in the Journal of Computational Physics. The official team page also lists Zion Sarig, an IAI veteran with experience connected to the Shavit launcher, Arrow missile-defense system, Ehud training system, and telemetry programs, as a board member, and describes Rafael and Intel experience elsewhere on the engineering team. Government data reports 10 employees, while LinkedIn displays an 11-50 range; current headcount is therefore not precisely verifiable.

**Competitive dynamics.** Nerlos competes at the component and subsystem layer against both focused specialists and much larger suppliers. RFOptic offers RF-over-fiber links, optical delay lines, and RF test subsystems for telecom, satcom, aerospace, and defense; HUBER+SUHNER ViaLite and Optical Zonu compete in RF-over-fiber transport; Bird Technologies and Times Microwave Systems compete in RF test, interconnect, and microwave infrastructure; and larger defense-electronics companies can design proprietary filters, duplexers, and antenna subsystems into a prime contract. The company may differentiate through the combination of AMU frequency management, PCB-based cavity and duplexer design, RFoF, electromagnetic simulation, and end-to-end integration rather than through one isolated component. Its small, technically focused structure could support customization and faster iteration for a platform customer. The counterargument is just as important: defense primes and established RF vendors bring qualification histories, manufacturing scale, environmental-test infrastructure, procurement relationships, and the ability to bundle radios, antennas, and electronic-warfare systems. Nerlos' edge must be demonstrated in measured RF performance, size and weight, integration time, reliability, and lifecycle cost.

**Defense, security, and resilience dual-use relevance.** Nerlos qualifies as dual-use because the core products are explicitly aimed at both defense/security and civilian communications infrastructure, not because a generic RF skillset might someday be repurposed. In defense, compact multi-radio integration can support tactical vehicles, aircraft, command posts, unmanned systems, radar and communications platforms, and electronic-support or SIGINT architectures where antenna count, co-site interference, and spectrum congestion directly affect mission performance. In homeland security and public safety, RFoF and integrated RF systems can extend coverage through tunnels, airports, large facilities, emergency networks, and other locations where distributed antennas and reliable signal transport matter. In telecom and critical infrastructure, the same technologies can reduce cabling and improve maintainability for distributed radio nodes. The record supports strategic relevance and a credible defense market, but it does not prove a fielded military system, a classified program, anti-jam performance, cybersecurity certification, or operation in a contested electromagnetic environment. The appropriate assessment is direct dual-use potential with meaningful but unverified operational depth.

**Growth stage, trajectory, and key diligence risks.** Nerlos is best classified as mid-stage in the database's broad maturity taxonomy: it has a 2010 operating history, a named founder with substantial engineering experience, government-supported applied research, an initial-revenue designation, and a product transition toward proprietary AMU and RCMP systems. It is not mature in the sense of having publicly documented scale, global production, or transparent financial results. The most important diligence points are: (1) verify the AMU and RCMP performance under representative multi-radio, thermal, vibration, shock, and electromagnetic-compatibility conditions; (2) establish whether the 2025 product transition reflects repeatable product revenue or mainly engineering projects; (3) clarify intellectual-property ownership, patent scope, freedom to operate, and dependence on founder know-how; (4) verify production partners, component sourcing, export controls, and quality systems; (5) identify named customers, qualification milestones, and the share of revenue from defense versus telecom or public safety; and (6) test whether RFoF and integrated subsystems create a scalable platform or a custom-integration business. If those questions resolve positively, Nerlos could become a strategically useful Israeli supplier of compact RF infrastructure for allied communications and resilience. If not, it remains a technically interesting small engineering company with limited public evidence of scale.
"""
