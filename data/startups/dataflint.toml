name = "DataFlint"

description = "DataFlint provides production-aware observability and AI agents for diagnosing, optimizing, and operating Apache Spark workloads across cloud, Kubernetes, and on-premises environments. Its open-source Spark UI plugin is paired with paid copilot, cluster-agent, review-agent, and fleet-observability products."

