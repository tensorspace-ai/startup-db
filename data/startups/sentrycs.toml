name = "Sentrycs"
description = "Sentrycs is an Israeli counter-UAS technology company whose Protocol Analytics, also called Cyber-over-RF, detects, identifies, tracks, and can selectively take control of unauthorized drones. It is now an Ondas Holdings subsidiary following the completion of Ondas's acquisition in November 2025."
detailed_description = """Sentrycs develops counter-unmanned-aircraft systems around protocol-level analysis rather than broad RF jamming or kinetic interception. Its published architecture passively monitors drone communications, detects and tracks multiple aircraft, identifies aircraft and controller information where supported, and locates the drone operator. A controlled mitigation action can disconnect the controller, change a return-to-home setting, enforce a geofence, or guide a compatible aircraft to a designated safe landing area. The company markets fixed, portable, and vehicle-mounted configurations, a command interface, and integrations with complementary sensors and command-and-control systems. Its Horizon Engine is described by the company as an AI-driven layer for identifying new or modified drone protocols; the exact coverage, false-positive rate, and performance against autonomous or encrypted systems remain diligence questions rather than independently verified facts.

The commercial problem is concrete: airports, prisons, borders, refineries, utilities, public venues, and other sensitive sites need to detect low-altitude drones without disrupting legitimate communications or creating an unsafe uncontrolled fall. Sentrycs's passive-first design is particularly relevant in dense urban or RF-sensitive environments, where jamming can be restricted or operationally undesirable. The company states that its solutions have been used across defense, public safety, and critical-infrastructure contexts, and its site lists fixed, portable, and vehicle-mounted kits. Those claims show a coherent productization strategy, but public materials do not provide a complete customer list, recurring-revenue profile, unit economics, or independently audited deployment statistics.

Competition is multi-layered. Sentrycs faces protocol-aware takeover specialists such as D-Fend Solutions, integrated detection-and-mitigation providers such as DroneShield and Dedrone, and systems that combine radar, RF sensing, electro-optics, jamming, spoofing, interceptor drones, or other effectors. Large defense companies and system integrators can bundle C-UAS into broader air-defense architectures and may have greater procurement access. Sentrycs's potential edge is precision at the communications-protocol layer, the ability to mitigate without indiscriminate RF interference, modular deployment, and interoperability with other C-UAS layers. That edge is conditional: it depends on supported drone protocols, legal authority to intervene, reliable identification, and the ability to keep pace with rapidly changing firmware, autonomy, and frequency behavior.

The commercialization picture changed materially in November 2025. Ondas Holdings reported completion of its acquisition of 100% of Sentry CS Ltd. for an aggregate purchase price of $224.6 million, and Sentrycs now presents itself as an Ondas company. This is stronger evidence of strategic validation and integration value than the old Series B label, but it also means Sentrycs is no longer an independent venture-financing opportunity in the ordinary sense. The acquisition price is not evidence of Sentrycs's standalone revenue or profitability, and the public record does not establish how much future growth, integration, or customer overlap Ondas expects. Subsequent company materials describe a collaboration to integrate Sentrycs technology into Lockheed Martin's Sanctum C-UAS platform, which is strategically relevant but should not be treated as a disclosed order, revenue contract, or proof of operational deployment.

The dual-use case is substantive. The same capabilities can protect military bases, deployed forces, border and homeland-security operations, airports, prisons, utilities, refineries, and large public events. Passive detection and targeted takeover can preserve communications continuity and reduce collateral risk, while operator-location data can support incident response and investigation. Strategic relevance is therefore high for layered air defense and critical-infrastructure resilience. The principal diligence issues are protocol coverage and update velocity, performance against autonomous and non-cooperative aircraft, safe-failure behavior, authorization and spectrum rules in each market, export controls, integration effort, and whether the Ondas ownership structure accelerates or complicates product focus and customer support."""
