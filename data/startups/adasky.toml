name = "AdaSky"
description = "AdaSky Ltd. is an Israeli developer and manufacturer of shutterless long-wave infrared (LWIR) thermal cameras and perception software for automotive ADAS and intelligent transportation infrastructure. Its current public materials feature vehicle cameras and SharpVision V2X/ITS traffic sensing; public evidence of specific paying production deployments remains limited."
detailed_description = """"AdaSky Ltd. is a privately held Israeli sensing company headquartered in Yokneam Illit. The company says it was established in Israel in January 2016; current materials describe its business as designing and manufacturing thermal camera systems for vehicle safety and roadway infrastructure. Its core product proposition is to add long-wave infrared imagery to visible-light camera and other sensor stacks, improving the chance of detecting pedestrians, cyclists, animals, and obstacles at night or in poor visibility. The company's automotive material describes a shutterless camera, embedded image processing, object detection and classification, free-space detection, and time-to-collision calculations. These are vendor statements about capability; the public record reviewed here does not include an independent product benchmark or a disclosed named OEM production award.

The product line has changed over time. The 2020 company financing release described Viper for vehicle perception, Sharp Vision for fixed vehicle-to-infrastructure (V2I) and smart-city use, and Viper-R for elevated body-temperature screening, a COVID-era adaptation. Current web material focuses on an automotive thermal camera and a SharpVision V2X/ITS camera. This demonstrates continued product communication and repositioning toward broader road safety, but it does not prove manufacturing volume, recurring revenue, or deployment scale. The product page claims detection up to 300 metres and classification of living beings beyond 200 metres; those figures should be treated as company-reported specifications until tested under a disclosed protocol.

AdaSky has credible industrial and strategic backing. In October 2020 it announced a $15 million investment by existing shareholders Kyocera and Sungwoo Hitech as part of a Series B. In May 2023 Gentex announced that it had closed as lead investor in a further Series B financing and entered commercial, engineering, and manufacturing collaboration agreements. Calcalist reported the 2023 round at $30 million. Gentex's 2025 Form 10-K later disclosed a total 34% ownership stake as of December 31, 2025, including an additional $5 million investment in common shares during 2025. Gentex's 2023 Form 10-K had reported approximately $46.5 million invested during 2023, comprising preferred and common shares, and a 27% stake. These figures show a significant strategic minority shareholder and incremental investment, not a takeover or proof that Gentex controls AdaSky. The complete cap table and contractual governance rights remain private.

Commercial traction should be described carefully. The 2023 Gentex agreement is both a financing event and an announced commercial, engineering, and manufacturing collaboration; public disclosure does not quantify resulting sales, identify production vehicle programs, or establish a start-of-production date. In its current company news, AdaSky describes collaboration with Imagry to integrate thermal imaging into an autonomous-driving platform, and mentions SWARCO research related to road safety. These are meaningful integration and validation pathways, but the public announcements reviewed do not establish paid customer status, series production, or operational fleet outcomes. The current official site also displays a SharpVision V2X camera at CES, and describes its automotive product as compliant with FMVSS 127 and developed according to ASPICE and ISO 26262 processes. The scope, certification evidence, and customer uptake behind these statements require diligence.

The commercial opportunity is real but demanding. Thermal sensing can complement visible cameras, radar, and lidar where illumination or contrast is poor, and can support pedestrian safety and infrastructure monitoring. Automakers and Tier-1 suppliers require long qualification cycles, automotive-grade reliability, robust supply, functional safety evidence, and cost targets. For roadway infrastructure, procurement may involve municipalities, road operators, and integrators, with pilots and public demonstrations preceding budgeted rollouts. AdaSky's combination of sensor hardware and perception processing could improve system fit and capture more value than selling a bare thermal core; it also raises manufacturing, calibration, support, and warranty obligations. No public revenue, unit shipments, margin, production backlog, or runway figure was located in this review.

Competition includes established thermal-imaging vendors such as Teledyne FLIR, automotive night-vision and sensing suppliers, and newer semiconductor or imaging companies such as TriEye. These are not all direct equivalents: FLIR has broad thermal hardware and industrial/defense channels, while TriEye's short-wave infrared approach differs from AdaSky's LWIR cameras. Visible cameras, radar, lidar, and software-only perception remain substitutes within multi-sensor safety budgets. AdaSky's claimed differentiation is a compact, shutterless, automotive-oriented LWIR camera coupled with embedded perception algorithms and infrastructure products. Whether this translates into a durable edge depends on validated detection performance, field reliability, bill of materials, integration effort, patent scope, and OEM sourcing decisions. The strategic relationship with Gentex may help with manufacturing and customer access, but the agreements' exclusivity, economics, and milestones are not public.

The technical moat rests on optical and sensor packaging, thermal calibration, image correction, annotation data, perception software, and safety-oriented integration. Public patent records assigned to Adasky Ltd. include compact infrared camera architecture and later work on shutterless image correction and vehicle-to-infrastructure calibration. Patent counts alone do not show freedom to operate, enforceability, or product-level differentiation. Important engineering questions include performance across temperature and weather ranges, false-positive rates, lens contamination and cleaning, calibration drift, cybersecurity, and lifecycle availability of detector components. Vehicle programs also carry stringent change-control and traceability demands.

Team evidence is strongest for senior leadership and engineering experience. The company lists CEO Yakov Shaharabani, a former Israeli Air Force brigadier general with aviation thermal-sensing experience, alongside CFO Igal Bazov, VP R&D Ofer Livny, VP Hardware Amotz Kats, North America head Bill Grabowski, and VP Products Udi Levy. Their published biographies describe prior work in finance, embedded computer vision, semiconductor design, automotive engineering, and Mobileye/Traffilog product operations. These biographies support relevant experience but are company-published and do not establish current organization size or execution outcomes. Calcalist reported approximately 80 employees in 2023; no current verified headcount was found.

AdaSky has a substantive dual-use profile because thermal imaging is useful in both civilian road safety and security or defense sensing. The evidence reviewed directly supports automotive and roadway products, while military deployment, government procurement, and defense contracts were not disclosed. Defense use is therefore a plausible adjacency based on sensor capability, not verified customer traction. Israeli headquarters and leadership experience in the air force reinforce the contextual link, while export-control classification and destination-specific licensing may affect market access. The company should be evaluated primarily on commercial qualification, field data, unit economics, and its ability to convert collaborations into repeatable deployments. The central diligence priorities are current production status, revenue and customer concentration, Gentex's commercial rights and governance, exact ownership and dilution, validated technical benchmarks, patent-family coverage, and any export-control constraints."""
