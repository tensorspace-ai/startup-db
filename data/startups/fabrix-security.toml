name = "Fabrix Security"
description = "Fabrix Security developed AI-native identity-security software for reasoning about and governing access by human, machine, and AI-agent identities. Silverfort announced its acquisition of Fabrix on April 28, 2026, making Fabrix an acquired technology and team rather than an independent startup."
detailed_description = """Fabrix Security built an AI-native identity-security layer around the practical problem of deciding whether an identity should receive access, and what level of access is justified. Its public product materials describe AI agents for access reviews, access requests, identity lifecycle management, and least-privilege enforcement. The system is intended to assemble identity, permission, activity, organizational, and policy context into an identity knowledge graph, then produce explainable recommendations or actions. The target population includes human users as well as non-human identities such as service accounts, API keys, bots, and AI agents, whose volume and speed make periodic manual review increasingly inadequate.

The product thesis is complementary to existing IAM rather than a wholesale replacement for every directory or application. Fabrix describes read-only, agentless connectors for cloud, SaaS, on-premises, and disconnected environments, followed by policy-driven actions through existing IAM workflows. Its named agents cover distinct operational jobs: Auditor for access reviews, Keeper for access requests, Operator for joiner-mover-leaver lifecycle work, and Fixer for reducing privilege creep. The intended differentiation is context-aware, reasoning-based decisioning that can be configured in natural language and kept auditable, with a human-in-the-loop option for higher-consequence actions. In practice, the defensibility of this architecture depends on connector breadth, identity-data quality, latency, false-positive rates, and the quality of its controls around autonomous changes.

The commercial market is identity security, identity governance and administration, non-human identity management, and emerging governance for agentic software. Buyers are likely to be enterprise IAM, security, compliance, and infrastructure teams dealing with fragmented entitlement data and costly access-review processes. The category is attractive because identity misuse and privilege accumulation create risk across cloud, SaaS, legacy, and operational environments, but it is crowded. Microsoft Entra, Okta, CyberArk, SailPoint, Delinea, Saviynt, Silverfort, and specialist identity-security vendors can compete through installed data, enforcement points, workflow integration, or adjacent AI features. Fabrix publicly announced $8 million in seed funding in September 2025, but public evidence in the available materials does not establish revenue, customer count, production scale, or independently verified outcome metrics.

The most important commercialization signal is strategic rather than standalone traction: Silverfort announced on April 28, 2026 that it acquired Fabrix and plans to combine Fabrix's AI-driven authorization and identity knowledge graph with Silverfort's Runtime Access Protection. Silverfort stated that the joint capabilities were expected to become available in the second half of 2026 and that it intended to bring them to its 1,000-plus customers. This provides credible evidence that a larger identity-security platform valued Fabrix's team and technology, but it is not evidence that Fabrix remains an independent investible company or that the combined products have already achieved the stated deployment outcomes.

Fabrix has credible defensive and national-security adjacency because runtime identity decisioning can reduce privilege escalation, insider-threat exposure, lateral movement, and unauthorized actions by machines or AI agents in critical infrastructure and government environments. The relevance is strongest where hybrid legacy systems, sensitive workloads, and limited security staffing make continuous least-privilege enforcement difficult. It remains a defensive cybersecurity capability, not an offensive military technology, and the record should not imply government contracts or defense deployments that have not been publicly established. Following the acquisition, the strategic question is integration: whether Fabrix's context and AI decisioning can operate safely at Silverfort's enforcement points with explainability, deterministic guardrails, and acceptable latency."""
