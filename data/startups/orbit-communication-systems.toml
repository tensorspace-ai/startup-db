name = "Orbit Communication Systems"
description = "Orbit Communication Systems is an Israeli supplier of stabilized satellite-communications terminals, tracking and telemetry systems, ground stations, and airborne audio-management equipment for commercial and government platforms. It became an indirect wholly owned subsidiary of Kratos Defense & Security Solutions on March 2, 2026."
detailed_description = "Orbit designs and manufactures communication hardware for platforms that cannot rely on fixed terrestrial networks. Its portfolio includes the MPT family of stabilized airborne, maritime, and land SATCOM terminals; OceanTRx maritime VSAT systems; Gaia LEO/MEO tracking ground stations; electronically steerable OrBeam antennas; telemetry and tracking positioners; and airborne audio-management products such as ADAMS and Orion. The product pages describe Ku-, Ka-, X-, and wideband-Ka-band configurations, integration with multiple modems and satellite orbits, and platform-specific stabilization, RF, and environmental qualification. The newer MPT40 targets tactical vehicles, small vessels, unmanned vehicles, and deployed command posts, with stated operation in degraded or spoofed GNSS conditions and MIL-STD-810H, MIL-STD-461G, and MIL-STD-1275-related requirements. These are concrete product capabilities, although public pages do not establish the full extent of fielded deployments or classified performance.\n\nThe company serves two related markets. Government and defense customers need beyond-line-of-sight voice and data for ISR aircraft, UAS, helicopters, transport and mission aircraft, naval vessels, armored and logistics vehicles, and expeditionary forces. Commercial customers use related equipment for business aviation, passenger and cargo shipping, offshore energy, earth observation, and satellite-operator ground infrastructure. Orbit's value is in making a terminal track and maintain a link while the host platform moves, vibrates, experiences changing line-of-sight geometry, or operates near other transmitters. Product integration, qualification, sustainment, and compatibility with customer modems and constellations create switching costs, but they also make sales dependent on long platform programs and certification cycles.\n\nOrbit's competitive position is that of a specialized terminal and subsystem supplier rather than a satellite operator or end-to-end connectivity network. It competes with larger defense electronics and SATCOM providers such as L3Harris, Viasat, ST Engineering iDirect, Gilat Satellite Networks, and Safran's defense communications businesses, as well as with antenna specialists and prime contractors that integrate third-party terminals. Its differentiation is most credible where compact size, weight and power, stabilized tracking, multi-band or multi-orbit support, ruggedization, and integration responsiveness matter. Public materials show AS9100D and ISO 9001 certifications valid through 2027, but they do not provide enough financial or program data to infer market share, margins, backlog quality, or customer concentration.\n\nThe March 2026 Kratos acquisition changes the commercial and strategic interpretation. Kratos announced a $356.3 million agreement in November 2025, and its SEC filing records completion of the merger on March 2, 2026, with Orbit continuing as an indirect wholly owned subsidiary. Orbit therefore remains an operating technology business with relevant products and an Israeli engineering and manufacturing base, but it is no longer an investible independent startup or a Series A financing opportunity. The acquisition can provide access to Kratos's defense, space, and national-security channels and complementary microwave-electronics capabilities; it can also introduce integration, reporting, export-control, and portfolio-prioritization risks. Diligence should focus on post-acquisition autonomy, retention of engineering talent, recurring support revenue, production capacity, component provenance, export licenses, qualification evidence, and whether new MPT and electronically steerable antenna products convert into repeatable orders."
