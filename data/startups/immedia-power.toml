name = "Immedia Power"
description = "Immedia Power is an early-stage energy technology startup developing the DOR, a compact, modular behind-the-meter power-generation system intended to add dispatchable capacity at sites constrained by grid connections. Its proposed package combines variable-speed, multifuel engine-generators with a grid-forming inverter and Power OS controls; the company currently describes DOR as pre-pilot, with an integrated prototype not yet built."
detailed_description = """**Product and the problem it addresses.** Immedia Power is developing the DOR (Distributed On-demand Resource) for commercial and industrial sites that cannot obtain enough utility power on a useful schedule. New substations and grid upgrades can require years of planning, permitting, and construction, while data centers, electrified transport, ports, factories, and other expanding sites need capacity sooner. Existing options can force a customer to wait for a utility upgrade, curtail its load, or deploy large backup generators that consume valuable land and are poorly suited to routine, continuous operation. Immedia’s thesis is to supply additional behind-the-meter generation as a modular resource alongside the grid, sized to site needs and added in increments. Its official site describes ten 200-kilowatt units as one 2-megawatt package, with additional packages intended to scale further. These are development targets, not delivered specifications: the company states that the integrated prototype has not yet been built or tested and plans its first pilots for early 2028. The business case therefore rests on solving a real timing and capacity constraint, while product-market fit and system performance remain prospective.

**Core technology and operating model.** The current company description presents a package of small fuel-powered generating units, electrical conversion hardware, and supervisory software. In the planned design, each unit uses an aluminum direct-injection engine operating at variable speed, an alternator, an active rectifier, and a grid-forming inverter. The target package combines ten units in parallel and connects beside the customer’s electrical service. The variable-speed approach is intended to follow changing loads; modularity is intended to let operators add capacity without replacing a single large plant. Planned fuel options include natural gas, compressed natural gas, liquefied petroleum gas, biofuel, and hydrogen blends, although Immedia explicitly conditions fuel choice and switching on engineering validation, certification, and site configuration. The planned Power OS layer is meant to compare demand with available supply, coordinate grid imports and unit output, surface equipment faults, and help schedule service. The company describes grid-tied, standalone, and engineered microgrid modes as intended configurations. Its public target sheet gives 36.5% fuel-to-electric efficiency at variable load and a unit footprint of approximately 15 square feet and 700 kilograms; these are engineering targets for a pre-pilot design, not independently measured or demonstrated results.

**Market, customers, and go-to-market.** Potential buyers are operators whose plans are gated by electrical capacity or whose sites need dependable local power: data-center developers, EV fleet charging hubs, ports, commercial and industrial facilities, and selected remote or mission-oriented sites. The initial commercial offer is described as a complete installed package with site assessment, sizing, permitting support, installation, monitoring, and service. That delivery model could help customers who do not want to become power-plant operators, but it also makes project execution, fuel availability, interconnection studies, and service coverage part of the product. Immedia’s commercial materials frame the equipment as everyday supplemental capacity rather than a backup-only genset, a meaningful difference if customers can safely and legally run it for high utilization. A partner listing from PLANETech previously described a 230-kilowatt GX230 product, multiple fuels, optional battery storage, and energy-management software. The company’s current site instead describes the DOR as ten 200-kilowatt units per 2-megawatt package. The change may reflect product evolution, but the available sources do not reconcile the naming and architecture, so customer requirements and the actual first commercial configuration need confirmation. The route to market is likely project-based business-to-business sales through direct site development, engineering/procurement/construction partners, installers, and fuel or energy-service relationships rather than a simple software subscription.

**Traction and third-party validation.** Public validation is still early and should be separated from evidence of a functioning commercial system. PLANETech, the Israeli climate-technology ecosystem platform, lists Immedia as a 2026 Israeli energy-infrastructure startup at seed stage and previously reported a proof of concept, pilot letters of intent, and work with a European development partner. Those claims provide useful ecosystem context but are not customer-named, independently audited operating results. The company’s own August 2026 news page reported a first binding purchase order and selection for Plug and Play’s Sugar Land program, Rice Alliance’s energy venture forum, and Rice Alliance’s Venture Advantage Platform; these are company announcements and accelerator access, not proof of revenue scale or DOR deployment. LinkedIn identifies the company as privately held and lists a 2–10 employee range. No round amount, investor syndicate, revenue, installed capacity, independently verified savings, public patent family, or completed pilot was confirmed in the sources reviewed. The discrepancy between an earlier ecosystem profile that says proof of concept and signed pilot letters and the current company disclosure that the integrated prototype has not been built is material: it could mean earlier work validated subsystems or a predecessor configuration, but diligence should establish precisely what was tested and what the reported purchase order covers.

**Founders and team.** The company’s team page identifies Rony Baum as co-founder and CEO, with more than two decades in international sales and commercialization, including roles at 3M and ZOOZ Power, and an MBA from Leicester University. Co-founder and COO Matias Kopinsky is described as having energy-operations and commercialization experience at Chevron, where the company says he turned a loss-making product line into a profitable business; his listed degree is in petroleum engineering from the University of Texas at Austin. These profiles fit the commercialization and operating demands of distributed energy, although public biographies provide less evidence of hands-on engine design, inverter controls, power-electronics qualification, or utility interconnection engineering. The listed advisors add relevant industry experience: Greg Winslow spent more than four decades in energy research and development at Getty Oil, Texaco, and Chevron, while Marcelo Ranieri held industrial leadership positions at Tenaris and Exiros. This is a useful bridge to energy and manufacturing networks, but an advisory board is not a substitute for a full engineering and field-service organization. The small LinkedIn-reported team size and absence of named prototype leads or manufacturing partners leave execution capacity and recruitment needs as important open questions.

**Competition and potential edge.** DOR would enter an established market with several mature ways to add site power. Caterpillar and Generac offer gas and diesel generator sets with service networks; Wärtsilä supplies larger distributed and utility-scale engines; Bloom Energy sells solid-oxide fuel-cell systems; and Mainspring Energy offers a linear-generator alternative. Batteries, demand response, utility upgrades, microturbines, and grid interconnection services are additional substitutes, each with different duration, fuel, cost, emissions, and permitting profiles. Immedia’s intended distinction is a compact, indoor-or-outdoor, modular generation block with variable-speed dispatch, fuel flexibility, and software coordinating units and grid imports. If demonstrated, a high power-to-footprint ratio and repeatable 2-megawatt packages could help constrained urban or industrial sites add capacity without a conventional large generator yard. The company’s public comparisons are its own modeled estimates, and no independent trial currently establishes lower lifecycle cost, superior efficiency, reliability, emissions, noise, or faster installation than competitors. Its edge is therefore a design hypothesis that depends on the engine, inverter, thermal management, emissions compliance, controls, and service model working as one reliable product.

**Strategic resilience and dual-use relevance.** Reliable local generation is relevant to civilian resilience and to government or defense operators that need continuity at bases, logistics sites, communications facilities, or emergency-response locations. A modular system that can operate alongside the utility, supply defined standalone loads, or join an engineered microgrid could, if proven, reduce the consequences of grid delays and some outage scenarios. The same capability could support data centers and other critical infrastructure during constrained interconnection or recovery periods. This is a credible dual-use adjacency rooted in the power-generation function, not evidence that DOR has been deployed for military missions. Public sources do not name a defense customer, government contract, military certification, hardened configuration, cybersecurity assurance, islanding test, black-start capability, or operation under fuel-supply disruption. The present fuel plan still depends on logistics and site-specific infrastructure, and several proposed fuels require validation. For strategic buyers, resilience value would need to be assessed with independent load tests, failure-mode analysis, cyber and control-system review, fuel-contingency planning, acoustic and emissions measurements, and demonstrated operation in the intended environment.

**Stage, trajectory, and diligence risks.** Immedia belongs in the early stage: PLANETech identifies it as seed-stage and founded in 2026, while the company says DOR is pre-pilot, its integrated prototype has not been built, and first pilots are planned for Q1 2028. A plausible next sequence is prototype build, engine and electrical integration, third-party safety and emissions testing, site-specific permitting, pilot operation, and then production qualification and field service. Each is a meaningful gate rather than a formality. The primary risks are technical integration and reliability; whether small units can achieve the published target efficiency and noise levels under variable loads; the cost and maintenance burden relative to incumbent generators and utility upgrades; fuel and emissions regulation; certification and interconnection delays; and the capital needed for hardware development, inventory, installation, and after-sales coverage. Additional diligence should resolve the product-version discrepancy, the scope of the reported proof of concept and binding purchase order, the legal and financing status of the company, patent ownership, manufacturing plans, and whether prospective customers will accept natural-gas-based generation as a long-term decarbonization pathway. The opportunity is strategically relevant if it can deliver dependable, compact capacity, but it remains an early hardware commercialization thesis rather than a validated deployment platform."""
