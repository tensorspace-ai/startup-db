name = "Oosto"
description = "Oosto, formerly AnyVision, develops Vision AI for real-time person-of-interest alerting, face/body/action analytics, touchless access control, and security operations. The company was acquired by Metropolis in January 2025; its technology and team now operate within Metropolis's safety and security activities."
detailed_description = """Oosto is the security-vision business formerly known as AnyVision. Its official product positioning combines face, body, and action algorithms with person-of-interest alerting, video analytics, touchless access control, mobile surveillance, and edge-to-cloud deployment. The practical proposition is to turn existing camera networks into a real-time detection and response layer: identify a known person or relevant event, reduce operator attention spent on routine footage, and provide an alert or searchable evidence trail. Oosto's product pages emphasize cloud, on-premises, and SDK delivery, which is relevant for customers with different latency, data-residency, and infrastructure constraints.

The technology matters because security teams rarely need another camera; they need usable signals from cameras already installed. Face recognition can support authorized-entry and watchlist workflows, while body and behavior analytics can extend coverage to events such as falls, weapons, intrusion, or other abnormal activity. Oosto's stated edge-to-cloud direction is commercially important: it can reduce bandwidth and latency at the edge while retaining centralized policy, fleet, and model management. The hard engineering problems are not only benchmark accuracy but performance across low-quality streams, masks, occlusion, lighting changes, crowded scenes, camera variation, and integration with video-management, access-control, and incident-response systems.

Its customer context is enterprise and institutional physical security, including high-traffic venues, casinos, hospitals, schools, transit environments, and critical infrastructure. Oosto reported in its January 2025 acquisition announcement that its products were deployed in 42 countries and hundreds of enterprise organizations, with more than 95% retention; these are company-reported traction signals rather than independently audited financial results. The same announcement described Oosto Protect, launched in 2024, as an edge-to-cloud platform for remote management and complex behavior analysis. Those signals suggest real commercialization and product breadth, but post-acquisition reporting makes current standalone revenue, headcount, roadmap ownership, and customer concentration difficult to assess.

The competitive environment includes biometric specialists such as IDEMIA, NEC, Cognitec, and Corsight, video-security platforms such as Motorola Solutions and Genetec, and substitutes that combine cameras, access control, human monitoring, and narrower analytics. Oosto's defensibility therefore depends on deployment reliability, integration depth, false-alarm performance, privacy tooling, and the operational value of its combined face/body/action stack—not on facial recognition as a standalone feature. Metropolis's acquisition changes the strategic frame: Oosto is no longer an independent venture financing or exit candidate, and its technology may be prioritized where it strengthens Metropolis's real-world recognition, parking, hospitality, or security products.

The defense and national-security relevance is credible but should be described as adjacency, not verified defense adoption. Person-of-interest alerting, secure-facility access control, perimeter monitoring, and incident triage can map to military bases, transport hubs, border facilities, and critical infrastructure. However, biometric surveillance creates unusually high legal, civil-liberties, cybersecurity, and reputational exposure. A serious diligence process should request current ownership and product boundaries, deployment jurisdictions, demographic-performance testing, human-review controls, retention and deletion policies, customer authorization models, security assessments, and evidence that alerts improve outcomes without creating unacceptable false-positive burdens."""
