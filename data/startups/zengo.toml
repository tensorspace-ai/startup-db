name = "Zengo"
description = "Zengo is a self-custodial digital-asset wallet built around multi-party computation (MPC) and threshold signatures, replacing a single seed phrase with distributed signing shares, recovery controls, and transaction-risk protections. It now operates as an acquired asset within eToro following the acquisition that closed on 2026-04-30."
detailed_description = """
Zengo's core product is a consumer and business digital-asset wallet that uses a two-party MPC threshold-signature design rather than exposing a conventional private key or seed phrase. Zengo's security documentation says one secret share is held on the user's mobile device and a second is secured on Zengo's servers; both participate in transaction signing. Its recovery flow combines email, encrypted cloud-stored recovery data, and 3D FaceLock biometric authentication. The product also includes a Web3 firewall branded ClearSign, multiple wallets, transaction approvals, token swaps, staking, on- and off-ramps, and decentralized-application access. This architecture does not make compromise impossible: it moves the security problem into protocol design, mobile-device security, service availability, recovery integrity, and the protection of each share and authorization path.

The commercial proposition is to make self-custody usable for people and organizations that do not want to manage a 12- or 24-word recovery phrase. Zengo's current business materials position the product for treasury, payments, team approvals, compliance workflows, and multi-chain operations, while consumer materials emphasize buying, swapping, staking, and managing many assets. Zengo and eToro report more than two million users/customers and billions of dollars in transaction or asset activity, but these are company-reported marketing or transaction-scale indicators rather than disclosed assets under custody, revenue, retention, loss-rate, or enterprise-conversion metrics. The product is therefore a broad wallet and transaction-infrastructure platform, not simply a cryptography licensing business.

Zengo competes in two overlapping categories. Consumer substitutes include hardware wallets and software wallets such as Ledger, Trezor, MetaMask, and Coinbase Wallet; institutional and business substitutes include Fireblocks, BitGo, Coinbase's institutional custody products, and multisignature systems. Zengo's differentiator is the combination of a seedless MPC user experience, recovery-oriented product design, transaction-risk presentation, and a visible security-research program. Its public materials describe open-source cryptography, multiple external audits, a bug-bounty challenge, and patents; those statements are useful diligence leads but do not replace review of the underlying reports, scope, dates, exclusions, and current production architecture. Claims such as "never hacked" remain company claims, and the 2023 BitForge disclosure shows that MPC implementations can contain serious vulnerabilities even when the underlying approach is well established.

The April 2026 acquisition changes the diligence frame. eToro announced the deal as a way to add self-custody and on-chain infrastructure to its global investing platform, and its first-quarter results reported that the transaction closed on April 30. Zengo therefore has strategic value as product, cryptography, user base, and engineering capability inside a larger financial-services group, but it is no longer an independent venture-financing opportunity. For national-security and critical-infrastructure analysis, threshold signing and distributed authorization could help reduce single-operator compromise for software-signing keys, digital-asset treasury controls, or other high-value workflows. There is no reliable public evidence in the reviewed sources of defense contracts, classified deployments, or government customers. Any such extension would require a separately assessed deployment boundary, supply-chain provenance, incident-response commitments, certification or assurance evidence, export-control review, and proof that the consumer service architecture is not being presented as a hardened defense system.
"""
