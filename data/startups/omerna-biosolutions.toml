name = "Omerna Biosolutions"
description = "Omerna Biosolutions (formerly HarvestR Technologies) is an Israeli agricultural-biotechnology startup developing targeted, non-GMO dsRNA crop-protection treatments that silence essential fungal genes. Its first platform is aimed at reducing pre- and post-harvest fungal loss and extending the shelf life of fruit and vegetables without relying on broad-spectrum chemical fungicides."
detailed_description = """
**Product and the concrete problem it solves.** Omerna is addressing a specific failure in the food system: fungal pathogens destroy crops before harvest and continue degrading fruit and vegetables through packing, storage, and transport. The company describes its first product as a sprayable, targeted treatment for fungal pathogens, with a second value proposition in shelf-life extension. That focus matters because a grower or packer can lose the same crop twice: first through disease in the field, and then through gray mold or other decay after harvest. Israel21c reported that more than one third of fresh produce is lost globally and that farmers spend billions of dollars on fungicides, while Omerna's own site cites 30-40% supply-chain loss and post-harvest losses as high as 40-50%. Those figures are directional public estimates, not an Omerna measurement. The commercial problem is nevertheless concrete: chemical residues, pathogen resistance, tightening regulation, and the cost of cold-chain handling all create demand for a treatment that is selective, compatible with existing operations, and effective on produce that must remain saleable for longer.

**Core technology and how it works.** Omerna's approach uses double-stranded RNA (dsRNA) to trigger natural RNA interference in a target fungus. The dsRNA is designed to be complementary to transcripts from essential fungal genes; when the pathogen takes up the molecules, the targeted messenger RNA is degraded or suppressed, interrupting proteins needed for growth or survival. The company's patent application describes a formulation that combines dsRNA with layered double hydroxide (LDH) particles, acting as a protective carrier and controlled-release mechanism. It identifies combinations aimed at the ergosterol-biosynthesis pathway, including erg13, CYP51, and erg1, and contemplates spraying, dipping, repeated applications, and post-harvest use. This is technically more precise than a generic claim to “biological crop protection”: the disclosed composition, delivery matrix, gene targets, and application routes define an actual development program. Omerna says treatments can be used alone or alongside standard fungicides, potentially lowering chemical rates while retaining efficacy. The key unresolved engineering questions are formulation stability, uptake and persistence on plant tissue, dose and timing, manufacturing cost, and performance when weather, cultivar, humidity, and handling conditions depart from laboratory protocols.

**Market, customers, and go-to-market.** Omerna is selling into the global crop-protection market through a business-to-business model rather than a consumer product. The Israel Innovation Authority identifies agrichemical and global crop-protection companies as target customers, while the company positions its technology for growers, packing houses, distributors, and partners that need longer shelf life. That route creates several possible commercial structures: a registration and licensing deal with a large crop-input company, a co-development program around a named crop and pathogen, or direct supply of a formulated product to packers and growers after approvals. The company is based at Idan HaNegev Industrial Park in southern Israel, close to the Negev agrifood ecosystem and Volcani and Weizmann research partners. Israel21c reported in 2024 that the company expected commercial testing within eight months and a product around 2027; a June 2026 EIT Food announcement places Omerna in the 2026 accelerator cohort, which is designed to move early agrifood technologies toward validation and commercial growth. A recent company update on LinkedIn said its first commercial-scale field spray, against Botrytis cinerea and Penicillium in a pear orchard, was conducted with Rafkor Packing House and GrowingIL. That is a company-reported trial milestone, not evidence of a paid commercial rollout.

**Traction, funding, and third-party validation.** Omerna was incorporated in 2023 and has a modest but unusually concrete validation trail for a young agricultural-biotech company. The Israel Innovation Authority record lists Omerna Biosolutions Ltd., five employees, R&D stage, and support through its Periphery Entrepreneurship Incubators programs. FreshPlaza reported that the former HarvestR company raised $450,000 from the InNegev incubator with Israel Innovation Authority support and had laboratory-tested dsRNA treatments on fungal pathogens affecting grapes, while seeking additional capital for commercial testing. The Authority's current record confirms the company identity, sector, establishment year, employee count, target market, and Gal Admati as CEO and co-founder. Omerna's patent application, filed with Yeda Research and Development, Israel's Ministry of Agriculture and Rural Development, and the Agricultural Research Organization, is public and pending; it describes the dsRNA-LDH composition and specific gene targets rather than merely asserting an idea. EIT Food's June 2026 announcement confirms selection into its 2026 accelerator network. These signals support technical seriousness and ecosystem access, but they do not establish regulatory approval, revenue, repeat orders, independent efficacy replication, or a completed institutional financing round beyond the reported early funding.

**Founders and team background.** Gal Admati is Omerna's CEO and founder, with a B.Sc. and MBA and prior experience in multidisciplinary scientific management, venture creation at InNegev, and taking a medtech company from research toward commercial operations. Dr. Yael Bar-Lavan is listed as R&D manager and co-founder; the company identifies her Ph.D. in life sciences, an M.Sc. in plant pathology, and prior work on plant-based product development. Dr. Noam Alkan is a science advisor and co-founder, a principal investigator and head of the postharvest fruit-pathology laboratory at the Volcani Institute. Omerna says he has more than twelve years of experience and more than seventy peer-reviewed publications; those are company-site claims, but his Volcani role and research focus are independently visible in the public record. Prof. Robert Fluhr is a science advisor and co-founder at the Weizmann Institute, where he leads plant molecular-biology research and has published extensively on plant-pathogen and plant-environment interactions. The team therefore connects commercialization, plant pathology, post-harvest science, and molecular biology. The open diligence issue is depth: the public record supports a five-person early-stage company, not a large regulatory, formulation, manufacturing, or international-sales organization.

**Competitive dynamics.** Omerna competes against several layers of substitution. Bayer Crop Science and Syngenta have global registration, field-trial, distribution, and farmer-relationship advantages across conventional and biological crop inputs. GreenLight Biosciences and other RNAi specialists compete more directly on externally applied RNA molecules and delivery systems. Novonesis and BioWorks bring microbial and biological crop-protection expertise, while post-harvest coatings, packaging, cold-chain optimization, resistant varieties, and conventional fungicides can solve part of the same loss problem through different mechanisms. Omerna's proposed edge is the combination of sequence-specific fungal targeting, non-GMO positioning, a controlled-release carrier, and a formulation intended to work both before harvest and during storage. The pending patent gives the company a defined intellectual-property position around disclosed compositions and methods, though it does not prove freedom to operate or a granted monopoly. A credible moat would require repeatable field results on commercially important crops, a formulation that is cheap and stable at scale, registration data, and evidence that growers obtain better economics than from an incumbent fungicide or cold-chain intervention. Large crop-input companies could become partners, licensees, or formidable internal competitors; the company's own target-customer strategy leaves all three outcomes open.

**Defense, security, and resilience dual-use relevance.** Omerna's dual-use case is food-system resilience rather than a direct defense product. A crop-protection treatment that lowers fungal loss can increase usable food output from constrained land and water, while post-harvest shelf-life extension can reduce dependence on uninterrupted refrigeration, rapid transport, and frequent resupply. Those properties have credible applications in emergency food programs, remote communities, humanitarian logistics, and military provisioning chains, where spoilage and supply disruption are operational constraints. The company is also a Negev startup operating in an Israeli region exposed to security disruption, and its public support through the Israel Innovation Authority's periphery programs is a resilience signal. The patent's specificity and the current orchard trial make the technology more than a generic “food security” story. Calibration is essential: no reviewed source establishes defense procurement, classified work, military trials, a government food-reserve program, or deployment in a conflict zone. The correct assessment is commercial-to-resilience dual use with a plausible transfer path, not demonstrated defense capability. Any emergency or defense use would also require biosafety, environmental, food-residue, procurement, and shelf-life validation under mission conditions.

**Growth stage, trajectory, and key diligence risks.** Omerna is early stage: the company was incorporated in 2023, the Authority lists it as R&D stage with five employees, public funding evidence is limited to an early $450,000 report and government-incubator support, and no recurring revenue or regulatory clearance is disclosed. The trajectory is nevertheless visible. The name change from HarvestR Technologies to Omerna Biosolutions formalizes a current corporate identity; the pending patent protects a defined technical program; EIT Food provides external validation and access to agrifood corporates; and the 2026 pear-orchard spray indicates movement from lab work toward field application. The diligence risks are: (1) variable efficacy across crops, cultivars, climates, and pathogen pressure; (2) country-specific regulatory timelines for dsRNA crop inputs; (3) formulation, fermentation or synthesis, storage, and application economics; (4) the possibility that resistance, uptake, or environmental persistence differs from controlled trials; (5) small-team and financing risk before product registration; (6) competition from incumbent chemicals, biologicals, and non-chemical post-harvest systems; and (7) a gap between strategic food-resilience value and what growers will actually pay. Promotion from early monitoring would require independently measured field results, a registration path, manufacturing or distribution partners, a follow-on financing event, and repeat commercial sales.
"""
