name = "CoolVOC"
description = "CoolVOC is an Israeli industrial-climate startup developing modular equipment that captures volatile organic compounds (VOCs) from manufacturing exhaust and condenses them into recoverable solvent. Its zeolite adsorption and cooling process is designed to replace energy-intensive destruction with pollutant recovery, but its headline efficiency figures and pilot performance have not been independently documented in the public sources reviewed."
detailed_description = """
**Product and the concrete problem it solves.** CoolVOC targets volatile organic compounds released in manufacturing exhaust, especially solvent-bearing streams from sectors such as semiconductors, chemicals, coatings, adhesives, batteries, and other advanced manufacturing. VOCs have to be controlled before exhaust is released, but a factory can currently satisfy that need by destroying the compounds through thermal or catalytic oxidation, or by using conventional adsorption and concentration systems. Destruction is a well-established answer where a stream is mixed, dilute, variable, or too contaminated to recover economically; it converts organic contaminants into other products, commonly including carbon dioxide and water. CoolVOC's commercial proposition is different: where a suitable stream contains recoverable solvent, collect it, concentrate it, condense it back into liquid form, and return it to a useful process. That can turn emission control from a pure operating cost into a combined compliance, energy-efficiency, and material-recovery project. The distinction matters because the system's value depends on the chemistry and economics of each exhaust stream, not simply on the presence of VOCs. It must work with the customer's solvent mix, concentration, flow, humidity, particulates, and production schedule, and it must deliver air-quality performance that satisfies the site's permit and process requirements. The intended buyer is an industrial operator that pays for emissions control, energy, and replacement solvents, not a generic consumer market.

**Core technology and how it works.** The company's public technical description sets out a three-step cycle. First, industrial exhaust passes through a zeolite adsorption bed that captures VOC molecules while treated air exits. Second, when the bed approaches saturation, the system regenerates it and releases the accumulated compounds as a more concentrated stream. Third, a cooling and condensation step converts that stream into liquid solvent for extraction and possible reuse. The official site describes the equipment as modular and depicts multiple adsorption columns, a condenser, and a control panel; its LinkedIn materials additionally refer to process monitoring, control, and zeolite-bed management. The basic engineering logic is understandable: adsorption handles relatively dilute large-volume exhaust, regeneration reduces the volume that must be treated downstream, and condensation recovers a reusable liquid without oxidizing it. This is a meaningful integration challenge because capture capacity, regeneration conditions, condenser performance, solvent purity, energy balance, cycle time, and safe handling all interact. CoolVOC's Israeli patent application, IL302930A, names a method and system for VOC pollution control using zeolite and condensation; the listed inventors include Yariv Gober, Avihai Israel, and Shira Gober, and CoolVOC is among the original applicants. The patent family includes international and European filings, but the public records reviewed establish applications and publications rather than a granted patent portfolio or independently adjudicated scope. The company's advertised figures — around 99% VOC removal, solvent recovery, and roughly 90% lower energy cost than conventional abatement — are company claims; no public third-party test protocol or comparative operating dataset was located to verify them.

**Market, customers, and go-to-market.** CoolVOC sells into the industrial air-pollution-control and solvent-recovery market, where the customer is usually an environmental, process, or plant-engineering organization with a permitted exhaust stream. The Israel Innovation Authority names manufacturing emissions as the problem and classifies target customers broadly in the environment sector; its Hebrew company description specifically mentions semiconductor, chemical, paint, and adhesive manufacturing. CoolVOC's current public materials broaden the target list to semiconductor production, battery manufacturing and recycling, specialty chemicals, pharmaceuticals, and advanced manufacturing. These segments have a potentially useful overlap: they run controlled production operations, use process chemicals, and may face both stricter emissions controls and pressure to reduce energy and material waste. Likely sales routes include direct plant engineering, environmental-system integrators, and engineering, procurement, and construction firms that can incorporate an abatement unit into a production line or facility retrofit. The company says it works with engineering firms and industrial manufacturers, but does not publicly name them. It also describes successful industrial pilots and a path from pilot to deployment in company and recruiting materials, yet no named pilot site, exhaust composition, throughput, uptime, customer reference, contract value, or independently measured savings was found. This leaves the basic commercial question open: can CoolVOC identify enough exhaust streams where solvent value and operating savings justify a new recovery system, while avoiding the customization and service burden that can make project-based environmental equipment difficult to scale?

**Traction, funding, and validation.** CoolVOC was established in 2023 and the Israel Innovation Authority's public company profile lists five employees and an R&D stage. The Authority has recorded support through its Ideation/Startup Fund and technological-incubator programs, with entries in 2023, 2024, and 2026; this is evidence of public-sector selection and ongoing R&D activity, not evidence of a commercial order or a validated emissions guarantee. IVC's company card records a Seed round in March 2025, while secondary company databases identify Earth & Beyond Ventures and report approximately $2 million; the publicly visible primary company and government materials reviewed do not disclose the round size or full investor syndicate, so the amount should be treated as a reported database figure. The company's patent filings provide a concrete intellectual-property signal around the zeolite-and-condensation approach, although patent publication is not proof of novelty over all competing systems, enforceable claim breadth, or commercial freedom to operate. CoolVOC's recent LinkedIn company description refers to industrial pilots and global industrial partners but gives no identities or performance data. Its website publishes quantified efficiency and VOC-removal claims without a named third-party test report. Accordingly, external validation currently consists of government R&D support, a recorded financing event, a public patent application family, and company-described pilots; public evidence of recurring product revenue, repeat installations, certified performance, or a disclosed strategic customer remains absent.

**Founders and team background.** Public records identify Yariv Gober as a founder and show him as CEO in the Israel Innovation Authority and IVC profiles; CoolVOC's current website lists him as co-founder and Chief Business Development Officer. The Authority lists Avihai Israel as CTO, and the current company site also identifies him as CTO and co-founder. The patent filing names both as inventors alongside Shira Gober, which ties the founding team's technical work to the described adsorption-and-condensation invention. Current company materials identify Limor Ostrovsky as CEO and Amir Regev as Head of R&D. Other company and startup databases list Adam Aizenberg as a CEO or co-founder, while older government and investor records still use Yariv Gober as CEO. Public leadership titles are therefore inconsistent and likely reflect changes or stale directories; the current company website is the clearest source for today's published roles, but the legal and operational responsibility split should be confirmed directly in diligence. The public evidence reviewed does not establish detailed biographies, prior industrial-system commercialization outcomes, headcount beyond the Authority's five-person snapshot, or manufacturing and field-service depth. The team does show a combination of process chemistry, environmental engineering, business development, and R&D roles, but the difficult scaling work will require applications engineering, quality systems, safety, installation, commissioning, and long-term support in addition to patent development.

**Competitive dynamics and edge.** CoolVOC competes with incumbent VOC-control equipment and project approaches rather than only with venture-backed startups. Dürr's regenerative thermal and catalytic oxidizers destroy VOCs using oxidation with heat recovery; these systems are established, cover a broad range of exhaust compositions, and benefit from large installed bases and engineering experience. Munters offers zeolite rotor systems that adsorb and concentrate VOC-bearing exhaust for downstream treatment, a particularly relevant alternative where the buyer values high-volume air handling and concentration but may not require CoolVOC's specific solvent-condensation cycle. Other competitors include Anguil Environmental Systems and CECO Environmental, whose industrial air-pollution-control portfolios include thermal and catalytic abatement systems. Plant operators may also prefer a familiar retrofit, in-house exhaust dilution, process substitution to lower-VOC materials, or a conventional recovery unit where solvent composition and concentration make recovery practical. CoolVOC's claimed differentiation is recovery without burning: zeolite capture, controlled regeneration, and condensation are combined in a single modular loop intended to preserve the captured compounds and reduce thermal energy demand. That could be attractive when recoverable solvent has value and oxidizer fuel use is high. It is not yet a proven durable advantage. An actual comparison must control for inlet concentration, airflow, solvent mix, removal efficiency, energy use, uptime, solvent quality, service intervals, and total installed cost. Incumbents can also offer heat recovery, adsorption, concentration, and system integration, so the company will need repeatable field data and a clear cost-per-tonne or payback advantage rather than a technology description alone.

**Security, resilience, and dual-use relevance.** CoolVOC's core product is commercial pollution-control equipment, not a defense system, sensor network, or weapons technology. Its dual-use relevance is indirect but credible through industrial and infrastructure resilience. Facilities producing semiconductors, batteries, specialty chemicals, coatings, or pharmaceutical inputs can be important nodes in civilian and defense supply chains; limiting hazardous exhaust and recovering process solvent can support reliable domestic manufacturing, reduce dependence on replacement chemical inputs, and lower the energy burden of environmental compliance. A modular process system might be useful at a secure or geographically constrained manufacturing site that needs emissions treatment but cannot easily depend on distant solvent suppliers or energy-intensive abatement. Those are plausible strategic applications of the same technology, not evidence of a defense contract, military deployment, defense-prime customer, or qualification for a controlled facility. No such customer or certification is publicly identified. The system also introduces operational and safety considerations: solvent recovery must meet purity and handling requirements, process control must fail safely, and deployment must comply with site-specific fire, explosion, ventilation, hazardous-material, and emissions rules. The strategic signal is therefore strongest as a way to strengthen cleaner industrial production and chemical circularity in allied supply chains, with defense relevance treated as an adjacency until an actual program or customer is disclosed.

**Stage, trajectory, and diligence risks.** CoolVOC is an early-stage industrial deep-tech company: it has an identified process, patent applications, public R&D support, and reported industrial pilots, but the public record does not yet show repeatable commercial deployments or audited economics. The next meaningful evidence would be a named customer installation with measured inlet and outlet VOC composition, treatment flow, removal efficiency, energy consumption, solvent recovery rate and purity, system availability, maintenance intervals, and baseline comparison against the site's existing treatment equipment. Other diligence priorities are independent testing across several solvent classes; whether humidity, dust, corrosive constituents, or changing exhaust conditions shorten zeolite life; cycle switching and backup-treatment behavior during maintenance; compliance with local emissions permits; recovery and reuse economics for each solvent; and the size and cost of installation and plant downtime. The patent portfolio needs a current legal-status and freedom-to-operate review, since application filings alone do not establish a defensible monopoly. Commercial diligence should validate the company-reported pilots and unnamed partners, identify willingness to pay, and determine whether projects recur across plants or require extensive bespoke engineering. Public company claims about removal and energy savings are promising but not independent benchmarks. The small disclosed team and inconsistent public executive titles add execution and governance questions, while the amount and terms of the 2025 round are not fully disclosed in primary public records. If field evidence confirms robust operation and attractive payback on diverse exhaust streams, CoolVOC could become a differentiated emissions-control supplier with solvent circularity benefits; until then, the opportunity is an early industrial process thesis with material scale-up, customer qualification, and capital risks.
"""
