name = "Wiz"
description = "Cloud and AI security platform that connects code, cloud, identity, data, models, agents, and runtime context to identify exploitable risk and guide remediation across major cloud environments. Wiz maintains its brand as part of Google Cloud after Google's acquisition closed in March 2026."
detailed_description = """
Wiz provides a cloud-native application protection platform (CNAPP) built around a Security Graph. The graph models relationships among cloud resources, identities, vulnerabilities, data, repositories, pipelines, AI models, agents, and runtime activity, allowing the product to prioritize combinations of weaknesses that create a plausible path to material impact. Its current platform materials describe agentless visibility through cloud APIs, code-to-cloud correlation, attack-path analysis, cloud threat intelligence, compliance workflows, AI-assisted code analysis, and runtime protection through the Wiz Sensor. The AI Application Protection Platform extends this model to AI infrastructure, models, agents, data, and applications rather than treating AI security as a separate scanner.

The customer problem is both technical and organizational. Modern estates span AWS, Azure, Google Cloud, Oracle Cloud, Kubernetes, SaaS services, and fast-moving development pipelines; separate posture, vulnerability, identity, and detection tools can produce large finding volumes without showing which issue is exploitable or who owns the fix. Wiz’s value proposition is a common context layer and a single workflow for security and engineering teams. Its API-connected, agentless starting point can reduce deployment friction, while code-to-cloud and cloud-to-code relationships are intended to move remediation toward the developer or infrastructure change that created the exposure. Wiz says it does not retain customer content or copies of files, databases, or disks, but buyers still need to validate permissions, telemetry handling, regional hosting, and tenant isolation for their own environments.

Commercially, Wiz has credible category traction rather than an early product experiment. Its current About page reports that 65% of Fortune 100 companies trust Wiz, five million cloud workloads are protected, and 230 billion files are scanned daily; those are company-reported metrics and should not be treated as independently audited revenue or retention data. Google's acquisition announcement separately used a 50% Fortune 100 figure, illustrating why the database should record the provenance and date of adoption claims rather than flattening them into a supposedly precise market fact. The platform also publishes customer stories and supports more than 200 integrations, which are useful adoption signals but do not substitute for diligence on annual recurring revenue, renewal rates, gross margins, implementation effort, and displacement of incumbent tools. Competition is intense: Palo Alto Networks, CrowdStrike, Microsoft, Google Cloud's own security portfolio, Orca Security, Check Point, Sysdig, and other CNAPP vendors can bundle adjacent controls or compete for the same consolidation budget.

Google completed its acquisition of Wiz on March 11, 2026, and stated that Wiz would join Google Cloud, keep its brand, and continue supporting AWS, Azure, Google Cloud, and Oracle Cloud. That changes the analytical frame from venture financing and standalone exit probability to strategic-asset performance: product integration, retention of key technical talent, multicloud neutrality, channel execution, and the ability to combine Wiz context with Google threat intelligence, security operations, and AI capabilities. The acquisition also strengthens Wiz’s relevance to government agencies, defense suppliers, and critical-infrastructure operators because the same cloud exposure-management problems occur in regulated and mission environments. This is credible dual-use adjacency, not evidence that Wiz has a particular defense contract or deployment. Public information supports evaluating it as a security platform with national-security relevance, while any government authorization, classified workload suitability, procurement history, and operational performance would require separate verification.
"""
