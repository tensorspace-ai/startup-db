name = "Adaptive Shield"

description = "Adaptive Shield developed an agentless SaaS Security Posture Management (SSPM) and SaaS identity-security platform. CrowdStrike acquired the company in November 2024 and now markets the technology as Falcon Shield, protecting SaaS configurations, identities, connected applications, data exposure, and activity."

detailed_description = """
Adaptive Shield was an Israel-founded cybersecurity company focused on the security controls that live inside business SaaS applications rather than on the endpoint or network. Its technology connected to applications through APIs and OAuth, inventoried users, privileged roles, devices, connected applications, permissions, and exposed data, and evaluated native configuration controls against security checks and compliance-oriented policies. The product was designed to be agentless, which is important for SaaS environments where customers generally cannot install a traditional sensor in the provider's infrastructure. Current CrowdStrike materials describe the successor Falcon Shield offering as covering more than 200 SaaS applications, with more than 3,500 built-in hardening checks and support for custom checks.

The commercial problem is persistent and specific: SaaS providers expose security settings and identity relationships, but responsibility for configuring and monitoring those controls remains with the customer. Falcon Shield addresses weak MFA or SSO settings, excessive privileges, public or over-shared data, dormant and partially deprovisioned users, risky third-party applications, and suspicious activity across connected SaaS services. It combines posture scoring and historical reporting with remediation guidance, role-based access for application owners, configurable reports, and policy-based actions such as revoking or blocking risky connected applications. This places it alongside SSPM, SaaS identity threat detection and response, CASB, identity governance, and security operations products rather than making it a general-purpose endpoint tool.

Market evidence is stronger for the integrated product than for an independently operating startup. CrowdStrike publicly announced the acquisition on November 6, 2024, and its regulatory filing records the acquisition of 100% of A.S. Adaptive Shield Ltd. on November 20, 2024. CrowdStrike's current product pages, trial workflow, customer stories, and analyst-material references show continued commercialization under the Falcon brand. They also indicate an expanding scope around non-human identities, AI agents, SaaS-to-SaaS and device interactions, and automated response. Those claims establish active product investment and distribution, but they do not independently verify renewal rates, standalone Adaptive Shield revenue, customer concentration, or the effectiveness of every automated action.

The defense and national-security case is credible but enabling. Military, government, and defense-industrial organizations increasingly use collaboration, identity, development, and workflow SaaS for administrative and mission-support functions. Continuous checks can reduce accidental exposure, privilege sprawl, shadow applications, and lateral movement through compromised SaaS identities; activity monitoring can add context to investigations that endpoint telemetry cannot see. The technology is not a weapons system and does not itself provide offensive capability, classified-cloud authorization, or mission assurance. Its value depends on the customer's SaaS authorization boundary, data residency, identity architecture, connector permissions, incident-response process, and ability to operate the product in an environment meeting the relevant accreditation requirements.
"""

