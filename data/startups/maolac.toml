name = "Maolac"
description = "Maolac is an Israeli food-biotechnology startup developing AI- and proteomics-guided, colostrum-derived biofunctional proteins designed around human biology. Its low-dose ingredients target gut health, immune support, muscle recovery, mobility, and healthy aging, converting an underused dairy byproduct into clinically tested nutrition inputs for supplement and functional-food brands."
detailed_description = """
**Product and the concrete problem it solves.** Maolac is addressing a gap between generic bovine colostrum and the more precise, human-compatible nutrition products that supplement and functional-food companies want to formulate. Colostrum contains antibodies, growth factors, lactoferrin, cytokines, and other proteins, but conventional bovine products are biologically optimized for calves, can vary by source and batch, often require gram-scale dosing, and may have taste, solubility, heat-stability, and digestive-compatibility problems. Maolac’s product strategy is to identify the subset of natural proteins that most closely match human biological functions, concentrate them into standardized ingredients, and sell those ingredients to brands rather than compete only as a finished consumer supplement. Its current public product family includes Super Colostrum for broad immune and vitality support, MaolactinGI for gut and microbiome health, MaolactinFMR for muscle recovery and mobility, and SuperColoSKN for skin barrier and microbiome applications. The company says these formulations can work at roughly 140–620 mg per day, remain neutral in taste, and fit capsules, powders, gummies, beverages, and other formats. Those performance and dosage statements are company or partner claims; the product problem itself is concrete and commercially legible.

**Core technology and how it actually works.** Maolac’s underlying platform is a proteomics and computational-discovery workflow sometimes described as MAOreka or a proprietary AI-driven protein-discovery platform. The company starts with a target biological function or a human protein profile, uses sequence, structural, and functional similarity analysis to search natural sources, and selects combinations of dairy or plant proteins that can reproduce a desired pathway or tissue effect. In the colostrum program, the platform maps hundreds of bioactive proteins and concentrates components that the company says have high similarity to human milk biology, including its branded IgHM human-compatible immune-modulator fraction rather than treating bovine IgG as the only active. The output is not a genetically engineered drug molecule; it is a standardized mixture of naturally sourced proteins processed into a formulation-ready ingredient. Maolac also describes a Bio-Protector approach intended to preserve activity through heat and acidic conditions. The public record does not disclose the complete model architecture, training data, enrichment yields, batch-to-batch coefficient of variation, exact fractionation process, or patent claims. Diligence therefore needs to separate the credible computational-selection concept from the more ambitious “95% similarity” and “seven times more effective” marketing figures, which require independent replication and clear comparator definitions.

**Market, customers, and go-to-market.** Maolac sells into the business-to-business nutraceutical, functional-food, sports-nutrition, healthy-aging, and potentially dermo-cosmetic markets. The buyer is usually an ingredient purchaser, product-development team, or brand that wants a differentiated, evidence-backed active without building its own clinical and formulation program. The company’s low inclusion rate and neutral sensory profile are intended to reduce the friction of adding a new ingredient to existing products. Public materials identify customers and commercial partners in general terms, and the company’s website displays product lines and customer-facing formulation support, but the names of most customers, contract values, renewal rates, and revenue by product are not disclosed. Maolac’s route to market has combined Israeli food-tech incubation, ingredient trade shows, clinical validation, and joint development with supplement brands. The company has also been associated with a 2025 consumer launch partnership involving Lemme, according to public coverage, although the precise commercial and manufacturing terms are not public. This channel strategy can scale more quickly than building a direct-to-consumer brand, but it creates dependence on brand adoption, regulatory wording, distributor margins, and the ability to maintain consistent supply of qualified colostrum.

**Traction, funding, and third-party validation.** Maolac was publicly described by CTech as founded in 2018 and raised a $3.2 million seed round in 2022 led by OurCrowd, with participation from The Kitchen FoodTech Hub, The Food Tech Lab, VentureIsrael, NEOME, and Mediterranean Towers Ventures. The Israel Innovation Authority records the company under the legal name MAO LAC LTD, reports 25 employees, initial revenues, and support through its food and biotech programs, while a 2025 Authority article describes continued support from the incubator, MoFET, and Round A tracks. Globes reported in late 2025 that Maolac had raised an additional $11 million and was expanding production, but the article is in Hebrew and the company has not published a detailed financing table. Maolac’s public validation includes randomized, double-blind, placebo-controlled human trials described on its website, clinical work reported in Australia and Israel, and the 2024 NutraIngredients Start-up Award. SupplySide Journal’s 2026 technical feature describes the COLOSTRUM 2.0 program as using a 3D AI-driven process to select approximately 400 proteins with high similarity to human biology. These are meaningful signals, but they do not substitute for audited trial data, regulatory dossiers, repeat purchase data, or independently verified product efficacy.

**Founders and team background.** Maya Ashkenazi-Otmazgin is the founder and CEO most consistently identified in public sources. She has pharmaceutical-engineering and biomedical-engineering training, has described taking products from concept through production and scale-up, and was recognized by Forbes’ 30 Under 30. Her public account connects the company’s origin to the birth of her first child and to the observation that breast milk is a highly evolved biological system rather than merely a source of calories. The founding record also names immunology expert Dr. Ariel Orbach and Eli Lerner, although the current company website presents a smaller operating leadership group. The official site identifies Yuval Appelbaum as CTO, Shai Karlinski in business development and sales, Yossi Ohana as CFO, and Yael Averbuch as CMO, alongside scientific advisers including Michael Murray, Jacqueline Jacques, Sandra Einerhand, David Nieman, and Ilan Youngster. The Israel Innovation Authority names 25 employees, while earlier coverage reported 12 and Startup Nation Finder places the company in an 11–50 range. This is a credible cross-functional team for protein discovery and commercialization, but the public record does not establish the full manufacturing, regulatory, quality, and international sales bench needed for global ingredient scale.

**Competitive dynamics.** Maolac competes against several different categories rather than a single direct rival. Traditional bovine-colostrum suppliers offer cheaper, familiar ingredients with established distribution, even when their products are less targeted to human biology. Specialized dairy-protein companies such as Ingredia and FrieslandCampina Ingredients compete on formulation science, quality systems, and global customer relationships. Bioactive and precision-nutrition companies, including The Purest Vantage and AgriFiber, pursue targeted protein or peptide functionality from natural sources. Alternative-protein and precision-fermentation companies can also compete for brands’ innovation budgets by offering engineered or fermentation-derived proteins with more consistent composition. Maolac’s potential edge is a combination of natural sourcing, computational selection, low-dose formulation, and human clinical evidence, not a new production organism. If the company can repeatedly show a measurable benefit at a fraction of conventional colostrum dosage, it can create value for brands through smaller serving sizes, easier formulation, and differentiated claims. The counterargument is that AI-guided protein selection may be reproducible by larger ingredient houses, that clinical claims invite regulatory scrutiny, and that colostrum supply remains agricultural and geographically variable. Defensibility will depend on proprietary datasets, fractionation know-how, clinical dossiers, supplier contracts, and brand adoption rather than on the existence of an AI label alone.

**Defense, security, and resilience dual-use relevance.** Maolac’s dual-use relevance is a cautious nutrition-resilience adjacency, not a defense product. Commercially, the same platform develops compact, shelf-stable, low-dose protein ingredients for gut, immune, recovery, and healthy-aging applications. In resilience settings, those attributes could matter for emergency nutrition, deployed medical support, rehabilitation, and field-ration supplementation where storage, transport weight, sensory acceptance, and dose efficiency constrain what can be distributed. The use of bovine colostrum that would otherwise be discarded also offers a circular food-supply angle, although it does not remove dependence on dairy production, veterinary controls, cold-chain collection, or agricultural shocks. An Israeli company able to produce evidence-backed nutrition ingredients could contribute to allied food and health-security capacity, especially if it diversifies sourcing and qualifies more than one manufacturing region. The limits are material: Maolac discloses no military customer, defense contract, humanitarian deployment, field-trial program, or procurement qualification; its products are positioned as nutraceutical ingredients; and clinical nutrition is regulated differently from ration or medical-countermeasure procurement. The dual-use score therefore reflects credible resilience optionality while remaining well below a company with demonstrated security deployment.

**Growth stage, trajectory, and key diligence risks.** Maolac is best classified as mid-stage: it has a multi-year operating history, a named commercial product suite, human clinical work, initial revenues reported by the Innovation Authority, a team in the dozens, and disclosed expansion of manufacturing capacity, yet it is still a private ingredient company whose public evidence does not show large-scale recurring revenue or a fully transparent financing history. The trajectory depends on converting scientific credibility into repeat formulation wins and global regulatory acceptance. Key diligence points are: (1) verify the randomized-trial endpoints, sample sizes, preregistration, statistical significance, and whether results support the marketing claims; (2) inspect the provenance, seasonality, and quality controls of colostrum supply and the economics of concentrating proteins; (3) confirm food-safety, novel-food, labeling, and health-claim status in the EU, United States, Israel, and Asia; (4) separate signed customer contracts from samples, pilots, and brand announcements; (5) test gross margin, manufacturing yields, shelf life, and batch consistency at commercial scale; (6) map IP around protein-selection algorithms, fractionation, and branded IgHM claims; and (7) assess whether the company can serve global brands without becoming dependent on one contract manufacturer or one celebrity-led launch. The upside is a differentiated Israeli food-biotech platform linking computational biology to scalable nutrition. The principal risk is that attractive biology and strong storytelling may not translate into repeatable, regulated, high-margin ingredient volume.
"""
