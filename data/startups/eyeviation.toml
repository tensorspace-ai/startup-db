name = "Eyeviation"
description = "Eyeviation is an Israeli human-performance and defense-training startup using eye tracking, machine learning, and extended-reality simulation to measure cognitive behavior and personalize precision-skills training. Its VCAT product is an AI firearms instructor for military, law-enforcement, and commercial training environments, while the underlying platform also supports aviation assessment and other high-stakes skills."
detailed_description = """
**Product and the concrete problem it solves.** Eyeviation addresses a practical weakness in high-consequence training: instructors can observe whether a trainee hits a target or completes a procedure, but they often cannot measure the visual attention, cognitive load, situational awareness, and decision process that produced the result. The company’s flagship product, VCAT (Virtual Cognitive-Aware Trainer), is presented as an AI-based instructor for fundamental firearm training. It is intended to give a trainee immediate, individualized feedback and a repeatable solo routine instead of requiring a human coach for every practice session. The commercial problem is equally concrete. Military and law-enforcement organizations need to maintain marksmanship and judgment under pressure, yet live-fire training consumes ammunition, range time, staff, and safety capacity. Commercial shooting ranges face a different version of the same constraint: they need differentiated instruction and repeat visits without adding an instructor to every lane. Eyeviation’s wider platform began with cognitive assessment for combat aviation and is being adapted to firearms, making the business a human-performance measurement layer rather than only a virtual shooting game.

**Core technology and how it actually works.** The technology stack combines sensors already available in many commercial VR headsets with machine-learning models that interpret gaze and performance behavior. Eyeviation’s public materials describe eye tracking as a way to capture where a trainee looks, what attracts attention, and how visual behavior relates to decisions during a simulated task. VCAT then combines that cognitive signal with shooting-cycle information such as attention, precision, timing, stability, and trigger behavior to produce coaching and an individualized training plan. The system is designed to work with VR, screen-based simulation, and physical training devices, which matters because defense and commercial users rarely share the same hardware budget or training room. The earlier IPASS product applied similar ideas to pilot selection: Janes reported that eye-tracking data from flight simulation was processed by AI algorithms to forecast whether a pilot cadet would pass training, with the company describing 89.8% accuracy and use in the Israeli Air Force Flight Academy. The public record does not disclose model architecture, training-data size, demographic or language coverage, calibration procedures, false-positive rates, or whether the cognitive estimates generalize across headsets and environments.

**Market, customers, and go-to-market.** Eyeviation is pursuing a two-sided market with a direct defense and law-enforcement route alongside a commercial training route. The defense-side buyers are military training commands, special units, air forces, and security organizations that need readiness improvement without increasing live-fire or instructor burden. The commercial side includes shooting ranges, professional firearms instructors, training centers, and potentially aviation or other precision-skill programs. The company’s current VCAT materials say the system is available to selected professional organizations and describe a commercial-range model that can support individual sessions, group sessions, qualification preparation, and instructor-led courses. That suggests more than a research demo, but the public sources do not identify paying customers, contract values, renewal rates, or deployment counts. Eyeviation has used defense exhibitions and industry channels to reach buyers: Janes covered the product at EnforceTac 2025, while company posts promoted VCAT at SHOT Show and identified partners or ecosystem participants including Global Defense, Primary Arms, 1948 Ventures, and Protego Ventures. A plausible go-to-market sequence is to validate the product with military and police users, then sell or license a lower-friction version to ranges and training organizations that can create recurring usage data.

**Traction, funding, and third-party validation.** The strongest evidence is a combination of government-backed technology support, an operational aviation use case, and public product commercialization rather than a large venture round. The Israel Innovation Authority’s company record identifies Eyeviation as established in 2019, with five employees and an R&D-stage profile, and describes an Authority-supported, patent-pending cognitive-aware virtual AI instructor for both defense and commercial markets. Startup Nation Finder reports one non-equity funding round of $850,000 in January 2021, places the company in the Aerospace, Defense & HLS sector, and lists target markets across Israel, Europe, Singapore, and North America. Janes provides an independent defense-industry account of the company’s technology and reports that IPASS is in use at the Israeli Air Force Flight Academy; that is more meaningful than an unaudited product claim because it connects the approach to a named institutional training environment, although the scope and procurement status remain undisclosed. Eyeviation’s own VCAT site says the firearms system was tested by experts in the IDF and American defense establishment, and its VCAT team page lists a functioning multidisciplinary group. No public source reviewed here establishes a priced equity round, revenue, customer names, completed certification, or independent replication of the performance figures.

**Founders and team background.** Eyeviation’s public operating team is unusually aligned with the problem it is trying to solve. The VCAT team page identifies Or Landwer as CEO and co-founder, Sefi Gabay as CBO and co-founder, and Boaz Yariv as CTO and co-founder, alongside leaders for operations, sales, product, studio, development, data science, and data engineering. Startup Nation Finder identifies Or Landwer as the company’s CEO since December 2019 and describes his previous service as an Israeli Air Force air-base commander responsible for guidance and training. The same source lists Eilam Sagi as an earlier co-founder who is no longer with the company, so the historical team should not be conflated with the current leadership. The company’s LinkedIn profile describes a multidisciplinary group with experience associated with the Israeli Air Force, the Weizmann Institute, and Mobileye; the public team page adds direct evidence of data-science, software, simulation, and technical-art capabilities. This mix gives Eyeviation credible domain access and the ability to ship a training product, but the team is still small by defense-program standards. Diligence should verify the current legal and executive structure, the depth of eye-tracking and psychometrics expertise, and whether the company can support secure deployments, hardware integration, and customer success internationally.

**Competitive dynamics.** Eyeviation competes against several different substitutes rather than one direct peer. VirTra and InVeris Training Solutions sell established firearms and force-on-force simulation systems with deeper procurement channels and broader installed bases. MILO Range provides law-enforcement simulation and scenario training, while Bohemia Interactive Simulations and other defense simulation providers compete for military training budgets at the synthetic-environment level. Tobii and Smart Eye supply eye-tracking hardware and analytics that could become enabling substitutes or partners, and conventional live-fire ranges with human instructors remain the most important alternative because they are familiar and operationally trusted. Eyeviation’s claimed edge is the combination of gaze-derived cognitive measurement, adaptive AI coaching, compatibility with existing VR or screen-based systems, and a solo-training workflow that can scale practice without adding instructor hours or live ammunition. That is a useful product position, but not yet a proven moat. Larger training companies can add analytics, sensor vendors can move upward into applications, and customers can continue using manual instruction. Eyeviation must demonstrate that its measurements predict or improve real-world performance, that setup is fast enough for routine use, and that its data is more actionable than an instructor’s observation or existing range instrumentation.

**Defense, security, and resilience dual-use relevance.** Eyeviation qualifies as dual-use because the core technology is already framed for both military and commercial training, and its products address a capability that matters directly to operational readiness. In defense, VCAT can reduce the ammunition, range, and instructor burden associated with maintaining small-arms proficiency, while the underlying cognitive analytics can support selection and training of pilots, marksmen, and other personnel whose performance depends on attention and rapid decisions. In law enforcement and public safety, the same system can provide repeatable qualification preparation and measurable coaching without requiring every session to be live fire. Commercial shooting ranges and training centers provide a non-military route that can sustain product iteration and create broader data. The IDF and Israeli Air Force references make this more than a hypothetical category adjacency, although the public evidence does not prove a current VCAT procurement, classified deployment, NATO certification, or operational combat effect. Strategic value should therefore be assigned to readiness infrastructure and human-performance measurement, not to weapons autonomy. Government buyers will still require careful review of biometric and behavioral data, retention, export controls, cyber hardening, model bias, safety, and the consequences of an AI coach giving incorrect advice.

**Growth stage, trajectory, and key diligence risks.** Eyeviation is best classified as early despite having operated since 2019. It has a released product, a named team, government-backed R&D support, an institutional aviation reference, and an apparent commercial-range expansion path, but public evidence still describes a small company with limited financing disclosure and no transparent revenue or customer metrics. The trajectory depends on turning a technically interesting measurement system into a repeatable procurement and subscription product. The most important diligence points are: (1) validate the 89.8% IPASS prediction figure with cohort definition, baseline comparison, confidence intervals, and out-of-sample testing; (2) measure whether VCAT’s cognitive feedback improves live-fire or field performance rather than only simulator scores; (3) test gaze and behavioral models across different headsets, lighting conditions, users, prescriptions, fatigue levels, stress states, and accessibility needs; (4) establish whether the product can operate securely without exporting sensitive trainee data and whether customers own their performance records; (5) clarify patent status, freedom to operate, and dependence on third-party headset or simulation platforms; (6) separate paid defense deployments from evaluations, grants, exhibitions, and company-reported tests; and (7) assess the economics of hardware support, content updates, instructor adoption, and international defense sales. Eyeviation has credible strategic fit and unusually direct validation signals for its size, but the public record supports monitored early-stage diligence rather than a conclusion of scaled commercial maturity.
"""
