investment_rationale = "Eyeviation is a high-priority early-stage signal for a dual-use training and human-performance thesis, not an investment recommendation. (1) The product addresses a specific operational bottleneck: defense and law-enforcement organizations need more repeatable marksmanship and decision training while controlling ammunition, range, safety, and instructor costs. (2) The technical concept is coherent and specific, combining eye tracking, behavioral modeling, simulation, and adaptive coaching rather than applying a generic AI label to a simulator. (3) Validation is unusually relevant for a small company: the Israel Innovation Authority records technology support, Janes reports IPASS use at the Israeli Air Force Flight Academy, and the company has presented VCAT at defense and commercial training channels. (4) The commercial range route creates a credible second market. The counterweights are substantial: no disclosed priced equity financing, revenue, named paying customers, retention, independent VCAT efficacy study, or completed certification; small-team support and hardware-integration capacity; dependence on third-party XR devices; and strong competition from established simulation providers and live-fire training. The legacy investible flag means worth prioritizing for diligence within this database, not a recommendation to invest."
strategic_value = "Eyeviation’s strategic value is concentrated in readiness and measurable human performance. (1) Force multiplication: adaptive simulation can allow more personnel to practice and receive feedback without consuming equivalent live-fire resources or instructor hours. (2) Selection quality: gaze and cognitive analytics may add objective evidence to pilot or operator assessment, provided the predictive claims survive independent validation. (3) Allied interoperability: a hardware-flexible training layer that works across VR, screens, and physical devices could fit different military and commercial procurement environments. (4) Resilience: distributed or solo training can preserve skill maintenance when ranges, ammunition, travel, or instructors are constrained. (5) Israeli ecosystem depth: Israeli Air Force provenance and Innovation Authority support provide credible local technical context. The strategic ceiling is limited by evidence gaps: no publicly verified scale, procurement value, NATO authorization, classified operation, or proof that simulator improvements transfer to field performance. Eyeviation should be tracked as a potentially useful allied training-infrastructure supplier, not as a fielded weapons platform."
