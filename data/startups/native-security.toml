name = "Native Security"
description = "Native Security is an Israeli cloud security startup that turns built-in provider controls into enforceable, secure-by-design architecture across multi-cloud environments. The company focuses on preventing configuration drift and making policy enforcement proactive rather than detective."
detailed_description = """Native Security is a cloud-security control-plane startup focused on turning capabilities already built into AWS, Azure, Google Cloud, and Oracle Cloud Infrastructure into active, enforceable defenses. Its central thesis is that cloud customers do not primarily lack security primitives; they lack a practical way to express an outcome once and operationalize it consistently across provider-specific control models. The public product message is therefore architecture-first: define an outcome such as keeping regulated data off public paths, then translate it into identity, network, perimeter, segmentation, and baseline controls that are enforced at the cloud-provider layer. This places Native closer to policy execution and secure-by-design infrastructure than to a conventional alerting dashboard.

The platform's differentiating workflow is the translation layer between security intent and implementation. Native says customers can express intent in natural language, align one security architecture across four clouds, and establish guardrails for cloud-service adoption, data perimeters, compliance, and AI engineering. Its AI-related positioning is especially relevant: the company frames the model an application calls, the data it can reach, and the actions an agent can take as architectural decisions rather than permissions that should be handled only at the application layer. Public materials also describe perimeter, segmentation, baseline-protection, and blast-radius-containment concepts. These claims establish a credible technical direction, but diligence should still test the breadth of supported controls, generated-policy correctness, preview quality, rollback behavior, and the operational boundary between Native's API access and customer data.

The customer problem is credible and commercially important. Multi-cloud teams must repeatedly translate similar security requirements into different organization policies, service controls, network constructs, and identity conditions; provider releases add further complexity. A control plane that reduces manual translation and keeps approved architecture aligned as environments change could lower remediation toil and make secure cloud adoption less dependent on scarce specialists. Native's public site cites support for all four providers and a Fortune 500 media-and-entertainment customer testimonial; its July 2026 Cyera integration article gives a concrete example of turning sensitive-data classification into an enforced perimeter. Those are useful commercialization signals, but they do not by themselves establish recurring revenue, retention, deployment scale, or a broad reference base. The company emerged from stealth in March 2026 with reported total funding of $42 million, including a $31 million Series A, and a reported launch team of 41 across Tel Aviv and the United States.

Native was founded in 2024 by Amit Megiddo, Gal Ordo, and Eyal Faingold, according to the company's about page and launch coverage. Investor and company materials emphasize prior cloud-security experience, including AWS-related work, which is relevant to the product's provider-native thesis. The market remains difficult: Wiz, Palo Alto Networks Prisma Cloud, Orca Security, Lacework, Aqua Security, cloud-provider policy services, and infrastructure-as-code tooling all compete for parts of the same security and platform-engineering budget. Native's proposed wedge is that it operationalizes controls rather than merely finding issues, but that wedge must survive feature convergence and prove that customers will buy a new control layer instead of extending existing CNAPP, CSPM, or cloud-native tooling.

The defense and national-security relevance is substantive but should be stated as applicability, not as proof of defense adoption. Provider-native enforcement can help government, defense-industrial, and critical-infrastructure operators constrain public exposure, segment environments, limit AI-agent reach, preserve least privilege, and control high-impact changes in cloud estates. It can also support resilience when teams operate across multiple providers or need auditable, repeatable policy changes. The open strategic questions are whether Native can satisfy sovereignty, procurement, assurance, and disconnected-environment requirements; whether its controls remain useful in hybrid or on-premises architectures; and whether it can demonstrate measurable reduction in attack paths and drift. Its Israeli base, cloud-security specialization, early funding, and architecture-level thesis justify continued strategic tracking, while the absence of independently verified scale metrics warrants medium risk rather than a fully mature rating."""
