strategic_value = "The strategic value lies in the capability, not in a currently verified corporate vehicle. GPS-denied visual navigation and low-SWaP sensing can improve resilience for spacecraft, drones, and interceptors when satellite navigation is jammed or spoofed. Lulav's reported Beresheet, Sidus, and Rafael relationships show that the technology was connected to consequential space and defense ecosystems. The unresolved questions are ownership, survivability of the engineering team and IP, validation status, and whether any capability migrated to another company after the apparent wind-down. Those questions are more important than assigning strategic value to the inactive entity itself."
