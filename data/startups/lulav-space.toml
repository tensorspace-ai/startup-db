name = "Lulav Space"
description = "Israeli space-robotics startup developing vision-aided autonomous navigation, compact computer-vision sensors, and robotics software for spacecraft and other aerospace platforms. Public records now indicate that the company is presumed inactive, so its technology and historical partnerships should be treated as diligence leads rather than current operating traction."
detailed_description = """Lulav Space was founded in 2021 in Haifa by engineers associated with the Beresheet 1 lunar-landing project. Its documented product direction is vision-based guidance, navigation, and control for aerospace robotics, rather than electric propulsion. The company describes an off-the-shelf space-robotics navigation system, while the Israel Space Agency characterizes its work as software, computer-vision algorithms, and software-validation tools for aerospace markets. Public descriptions emphasize sensors and algorithms that can reduce size, weight, and power relative to conventional space-qualified navigation equipment. The technical thesis is to extract reliable relative pose, orientation, and landing or approach information from optical data, including in situations where GPS is unavailable or unreliable.

The commercial customer context spans spacecraft manufacturers, mission integrators, lunar-landing programs, and operators of small aerospace vehicles. Lulav was publicly associated with Ramon.Space and the Beresheet 2 lunar missions, and Sidus Space announced a 2023 collaboration to develop and demonstrate an event-based star tracker on a LizzieSat mission. Event-based sensing is relevant to high-angular-rate platforms because it can provide useful visual information with lower latency and potentially lower size, weight, and power than conventional frame-based cameras; the Sidus announcement was a planned research and demonstration effort, not proof of successful on-orbit commercialization. Lulav also developed CITROS, described publicly as a robotics DevOps and software-validation platform intended to shorten the robotics development cycle. The available evidence does not establish recurring revenue, production volume, a completed flight demonstration, or a durable customer base.

Competitive dynamics are difficult for a small supplier. Lulav's alternatives include conventional star trackers and inertial-navigation systems, radar and lidar for proximity operations, satellite-bus vendors that build navigation internally, and specialist autonomy companies such as Blue Origin's Advanced Development Programs, SBG Systems, Sodern, Jena-Optronik, and Terma in adjacent sensing or guidance categories. Its possible edge was a compact, software-led, vision-first stack that could lower payload burden and add autonomy without requiring a large sensor suite. That edge would need to be demonstrated through radiation tolerance, optical robustness, calibration stability, false-detection rates, closed-loop control performance, and integration evidence across mission environments. The public record supports technical relevance and ecosystem access, but not a verified moat.

The company has clear defense and national-security adjacency. GPS-denied navigation, autonomous guidance, and low-SWaP electro-optical sensing can support spacecraft proximity operations, resilient aerial systems, counter-UAS interceptors, and other platforms operating under jamming or spoofing. In August 2025, reputable Israeli business reporting described a Rafael collaboration to develop a drone-interception system using Lulav's image-analysis-based navigation capabilities. This is a meaningful strategic signal, but the public reporting does not disclose system performance, contract value, fielding, or a production award. Separately, a March 2025 non-binding acquisition proposal from ParaZero was terminated in May 2025, and Startup Nation Central later listed Lulav as presumed inactive and ceased to operate in May 2025. Those facts materially reduce current-company and investibility confidence. The record is therefore useful as a historical technology and team signal, but readers should not infer that Lulav currently operates, owns the reported IP, or continues the reported partnerships without fresh confirmation."""
