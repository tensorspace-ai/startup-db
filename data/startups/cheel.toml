name = "Cheel"
description = "Cheel is an Israeli battery-safety startup developing an internal, cell-specific temperature-sensing platform for real-time battery health monitoring. Its technology is intended to improve state-of-health visibility, prevent thermal runaway, and extend the safe operating envelope of batteries used in mobility, stationary storage, data centers, defense, and eVTOL systems."
detailed_description = """**Product and the concrete problem it solves.** Cheel is addressing a failure mode that becomes more consequential as batteries move into vehicles, grid storage, aircraft, robotics, and data-center backup systems: the outside of a cell can appear acceptable while a dangerous temperature gradient or localized hot spot is developing inside it. Conventional battery-management systems infer internal behavior from external measurements, pack-level voltage, current, and temperature, then apply models to estimate state of charge, state of health, and remaining useful life. That approach is useful but indirect. Cheel's public product thesis is to put the sensing capability inside the battery cell so that operators can obtain real-time, cell-specific temperature information rather than relying only on surface proxies. The intended customer outcome is earlier warning of thermal runaway, better protection against cascading cell failures, improved battery utilization, longer life, and more confidence when operating high-energy packs near their performance limits. This matters commercially because a battery incident can destroy the pack, shut down a vehicle or facility, create injury and fire exposure, and impose warranty and recall costs. The company is not publicly claiming a finished certified product, and it has not disclosed the exact sensor package, cell chemistry, production process, or measured improvement. The record should therefore treat the product as a credible deep-tech sensing thesis in R&D, not as a proven safety device.

**Core technology and how it actually works.** The differentiator is the measurement location. Instead of asking a pack controller to infer internal temperature from sensors attached to the casing, Cheel says its platform provides direct, cell-specific internal temperature data. That could give a battery-management system a more granular view of thermal behavior and allow it to identify abnormal heating before the condition propagates across neighboring cells. The practical engineering challenge is substantial: the sensing element must survive cell assembly, electrolyte exposure, charging and discharging cycles, vibration, pressure, and manufacturing variation without materially reducing energy density, increasing impedance, creating a new failure mechanism, or compromising the cell's safety envelope. The sensor also needs a reliable signal path to pack electronics, calibration across temperature ranges, and a data interface that existing BMS architectures can use without a complete redesign. Cheel's official materials do not disclose whether the platform uses fiber optics, printed electronics, electrochemical sensing, embedded microelectronics, or another architecture, so the mechanism should not be guessed. Publicly supported capabilities are narrower and more useful: internal temperature sensing, cell-level telemetry, state-of-health monitoring, thermal-runaway prevention, and integration into battery applications. Diligence should demand sensor survivability data, time-to-detection versus external thermistors, accuracy and drift measurements, impact on energy density, manufacturing yield, and independent abuse-test results.

**Market, customers, and go-to-market.** Cheel is pursuing a B2B component and technology-integration model rather than selling a consumer battery product. Startup Nation Finder describes applications across electric mobility, energy storage, defense, and eVTOL, while the company's own site highlights data centers and energy-system storage. These segments share a need for safety and reliable uptime but differ sharply in qualification and buying behavior. Electric-vehicle and e-mobility customers care about pack cost, range, warranty exposure, production throughput, and automotive validation. Stationary-storage operators care about fire prevention, insurance, thermal propagation, availability, and integration with the site controller. Data-center operators have unusually low tolerance for battery failure because a UPS event can interrupt critical computing loads. Defense and eVTOL customers may pay for higher assurance and lower risk, but they impose demanding constraints on mass, vibration, power, certification, secure supply, and qualification. The plausible go-to-market sequence is a design-in with a cell manufacturer, pack integrator, BMS vendor, or specialized battery developer, followed by qualification and volume licensing or component supply. Public sources do not name a customer, paid pilot, production partner, revenue stream, or commercial contract. That absence is material: a sensor can be technically valuable yet fail commercially if pack makers view it as too expensive, too invasive, or too difficult to integrate into established qualification flows.

**Traction, funding, and third-party validation.** Cheel is very early, but it is not an anonymous concept. The official website publicly identifies the company, its battery-sensing thesis, and a three-person leadership group that includes co-founder and CEO Gidon Leader, co-founder and COO Yonathan Lapidus, and co-founder and CTO Prof. Yehonadav Bekenstein. Startup Nation Finder lists Cheel as founded in January 2026, headquartered in Binyamina-Giv'at Ada, operating with one to ten employees, and at a pre-funding/R&D stage. EcoMotion, a joint venture of the Israel Innovation Institute, independently presents the company as developing a real-time temperature-monitoring solution integrated directly into battery cells for electric vehicles and energy storage. An Israeli company-information record identifies CHEEL ENERGY LTD as an active private Israeli company, incorporated in December 2025 under company number 517255121. EnergyCom's Israeli energy-innovation directory also lists Cheel among the ecosystem's companies. These are useful existence, ecosystem, and product-positioning signals, but they are not proof of technical validation or commercial traction. No public source reviewed here confirms a financing amount, institutional investor, patent publication, prototype performance, customer deployment, certification, or manufacturing agreement. The appropriate stage assessment is therefore based on company formation and R&D evidence, not on an assumption that public visibility implies readiness.

**Founders and team background.** The public record supports a technically oriented founding structure but offers limited biographical detail. Gidon Leader is identified as co-founder and CEO, Yonathan Lapidus as co-founder and COO, and Prof. Yehonadav Bekenstein as co-founder and CTO on the official company site. This division of responsibilities is sensible for a hard-tech battery venture: a CEO and COO can pursue company formation, partnerships, and commercialization while a technical founder leads the sensing architecture and its integration into electrochemical cells. The inclusion of a professor-level CTO suggests an academic or research connection, but the reviewed sources do not establish his institution, publication record, prior commercialization, or ownership of specific intellectual property. Similarly, public sources do not verify the other founders' earlier employers, battery-industry experience, military service, or previous exits. Those unknowns matter because Cheel must bridge several disciplines at once: electrochemistry, embedded sensing, materials compatibility, battery-pack design, signal processing, safety testing, automotive or aerospace qualification, and manufacturing quality. A small team can move quickly during feasibility work, but it will need additional cell engineers, reliability specialists, manufacturing partners, and regulatory expertise before a safety-critical component can enter production. The team's next credibility milestone is not another broad application claim; it is a reproducible demonstrator and a technical data package that an independent battery or pack partner can evaluate.

**Competitive dynamics.** Cheel competes against both direct battery-intelligence companies and the incumbent measurement stack. Eatron Technologies and Elysia provide software-defined battery-management and battery-intelligence systems that estimate state of health, lifetime, and risk from electrical and thermal data. Qnovo offers battery-management software and charging optimization, while TWAICE and Voltaiq provide analytics, testing, and lifecycle intelligence for batteries and fleets. Analog Devices, Texas Instruments, Infineon, and other semiconductor suppliers provide mature battery-monitoring ICs and pack-level sensing components that are already embedded in established BMS designs. The substitute is not only a rival startup; it is the combination of external thermistors, conservative operating limits, cell balancing, propagation barriers, pack-level thermal sensors, and software models. Cheel's potential edge is measurement observability: if internal data detects hazardous gradients materially earlier or improves usable capacity without reducing safety, it could create value that software-only inference cannot reproduce. The edge is not established. Internal sensing may increase bill of materials, reduce cell yield, complicate recycling, or create a qualification burden that makes customers prefer better models and more external sensors. A defensible position would require demonstrated accuracy, long-cycle durability, low manufacturing friction, a protected architecture, and a reference design that pack and cell makers can adopt without requalifying their entire product line.

**Defense, security, and resilience relevance.** Cheel's dual-use case is substantive because the same core sensing technology can protect civilian batteries and mission-critical power systems. Commercially, it can support electric vehicles, stationary energy storage, data-center UPS systems, and high-power mobility. In security and defense contexts, batteries power unmanned aerial vehicles, eVTOL platforms, ground robots, radios, sensors, portable power systems, and remote installations where a thermal failure can strand a platform or expose personnel. Cell-specific internal telemetry could improve predictive maintenance, reduce the need to operate with large safety margins, and identify developing faults in systems that cannot easily return to a depot. The resilience value is particularly clear for distributed storage and critical infrastructure: early warning can reduce fire risk, improve availability, and help operators isolate a failing module before it cascades through a larger pack or facility. The technology could also support safer operation in hot climates, rapid charging, high-altitude flight, and constrained logistics environments. Calibration is essential. No public evidence establishes a defense contract, military deployment, classified program, aerospace certification, or fielded eVTOL system. The defense score is therefore based on direct transferability of a safety-critical battery capability and the public ecosystem's stated target sectors, not on claimed procurement. Cheel should be treated as a resilience and enabling-technology startup with defense optionality, not as an established defense supplier.

**Growth stage, trajectory, and key diligence risks.** Cheel is best classified as early and high risk. The legal entity was incorporated in late 2025, public ecosystem records place the operating venture in 2026, and the company remains in R&D/pre-funding status with a very small disclosed organization. Its trajectory could be attractive if it proves that internal sensing creates a measurable safety or lifetime advantage that customers cannot obtain economically through models and external instrumentation. The most important diligence sequence is: 1. demonstrate a repeatable prototype across relevant lithium-ion cell formats and chemistries; 2. quantify accuracy, latency, drift, failure modes, and early-warning performance during controlled abuse and thermal-propagation tests; 3. show that embedding the sensor does not materially reduce energy density, cycle life, manufacturing yield, or recyclability; 4. secure a design partner and complete pack-level integration; 5. obtain the automotive, stationary-storage, aerospace, or defense qualification evidence demanded by the first target market; and 6. convert the work into a funded pilot, licensing agreement, or production design-in. Principal risks include technical integration, reliability and contamination, manufacturing scale-up, customer adoption friction, long qualification cycles, unclear patent ownership and freedom to operate, competition from improving BMS models, and capital needs associated with hardware validation. Public disclosure is also thin: there are no announced performance benchmarks, funding terms, named customers, or commercial revenue. Cheel merits monitoring because battery safety is strategically important and the measurement thesis is differentiated, but its priority should rise only after independent evidence demonstrates that the sensor changes operational outcomes."""

