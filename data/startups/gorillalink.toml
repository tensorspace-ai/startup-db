name = "GorillaLink"
description = "GorillaLink is an Israeli startup building edge hardware and a connectivity-management layer for remote IoT assets that cannot rely on cellular coverage. Its public materials have described software that selects among satellite networks and tactical remote-device control, while its current product site presents a compact satellite-ready dongle, fleet location and device management, and a pilot-led commercial model; the company reports initial revenues, but does not disclose named customers, contract values, or operating scale."
detailed_description = """**Product and the operational problem.** GorillaLink addresses the cost and complexity of keeping small, distributed devices connected when they sit outside reliable terrestrial networks. A sensor on a remote farm, an asset at sea, or equipment at a distant utility site may produce useful measurements yet remain operationally isolated if a customer must procure a separate satellite terminal, negotiate a connectivity arrangement, and build a device-to-cloud integration for every use case. The company's stated product direction combines an edge device with a software and service layer for device activation, location visibility, data use, and remote operations. Its 2026 website describes the GorillaLink Edge Dongle as a satellite-ready IoT board in a 90 by 30 by 10 millimeter enclosure, powered over Micro-USB and configurable over the air. It also shows a live-map workspace and a customer device portal. The commercial promise is operational continuity and a simpler deployment path, not a new satellite constellation or a replacement for the customer's sensor.

**Technology and system design.** Earlier public descriptions explain the more distinctive network layer: software that can connect IoT sensors through multiple low-Earth-orbit satellite networks and route data to cloud services, with the aim of avoiding dependence on one provider. A 2023 Israeli government delegation catalog called the software patented and described automatic selection of a nearby LEO network; a separate Startup Nation Central profile described edge APIs for sensor integration and cloud APIs for data transfer and remote control. These descriptions suggest a stack with three parts: a compact field-side interface, a network-agnostic connection and routing layer, and an online management surface. The company's current website makes the device and workflow visible but is more reserved about production-level network details: it says coverage fit, interfaces, security controls, certifications, availability, and service levels are established per deployment. Public materials do not identify the supported modem chipsets, satellite operators, specific protocol standards, cybersecurity design, battery operation, encryption methods, or patent numbers. Those remain diligence questions rather than assumed capabilities.

**Applications, buyers, and go-to-market.** The potential buyer is an operator that needs low-volume or periodic data from assets spread across areas where cellular connectivity is weak, unavailable, or uneconomic. Company and government materials identify agriculture and soil or rainfall monitoring, animal tracking, vehicle and truck tracking, remote industrial equipment, maritime assets, and government or tactical devices. The current site organizes its sales entry points around remote assets, maritime tracking, industrial IoT, and government deployments, and instructs prospects to define an asset, operating region, message cadence, power constraints, and acceptance metric before a pilot. That indicates a consultative B2B motion: scoped field evaluation, hardware and onboarding quote, then recurring connectivity, portal access, and support tied to device count and data profile. It is a sensible way to de-risk a fragmented market, but it means each pilot can require integration work and field support. No named commercial customer, public deployment count, annual recurring revenue, or export contract was located, so target verticals should not be mistaken for proven customer concentration.

**Traction and outside validation.** Several independent institutional signals show that GorillaLink is more than a name in a directory. Israel's Innovation Authority lists Gorilla Link Ltd. as an Israeli company established in 2019, with five employees, an initial-revenue status, and a 2023 award route under its selected-field space program; its company profile describes satellite-as-a-service, a satellite-managed power distribution unit, and emergency hotspot categories. The Israeli Space Agency lists the company as a PaaS provider of satellite-connectivity tools for IoT businesses. The Israel Export Institute's 2023 delegation material described the multi-network software, and listed products including G-Switch for low-power, beyond-line-of-sight switching of tactical equipment and SATcrop for satellite transmission of agricultural rainfall and soil-moisture data. XRC Ventures lists Gorilla Link in its portfolio and identifies CEO/founder Nadav Nachshon. The available evidence therefore supports public-sector and investor ecosystem participation and a government-reported initial-revenue classification, but not the amount or terms of financing, revenue quality, customer identity, or independent proof of scale. The government export catalog's product details date to 2023; GorillaLink's current website now describes a more narrowly specified dongle and pilot process, so product continuity and present-day market status should be confirmed directly.

**Founders and company footprint.** Public profiles name Nadav Nachshon (also rendered as Nadav Nahshon) as CEO and co-founder. Startup Nation Central's older profile additionally names Ron Nachshon as a co-founder and chief science officer, while XRC Ventures identifies Nadav as CEO/founder; the current company site does not publish a leadership roster or biographies. This leaves the founders' precise division of responsibility, prior operating record, engineering headcount, and current team size only partially documented. The Innovation Authority lists five employees, while ecosystem profiles use a 1–10 range, so a conservative record should treat five as a dated institutional estimate rather than an audited present count. Company registration information and Israeli government and space-agency listings establish an Israeli corporate and operating connection, but public sources give differing city-level addresses; the exact current headquarters is therefore not stated here. No public patent number or patent-family record was confirmed, despite the 2023 government catalog's description of patented software.

**Competitive dynamics and edge.** GorillaLink competes across multiple layers, which makes the competitive set broader than satellite operators alone. (1) Myriota and Sateliot offer satellite IoT connectivity or network services that can reach low-power remote devices. (2) Iridium provides an established global satellite network and IoT services, with a large installed base and mature coverage. (3) Skylo aggregates non-terrestrial network connectivity through partner satellite systems and standards-based device integrations. (4) hiSky sells compact satellite IoT terminals and network-management capabilities, and is a close Israeli comparator with a more integrated terminal-and-network proposition. (5) Always Connect AI, a local software startup, targets orchestration across satellite and terrestrial networks; its stated emphasis is AI traffic routing and resource allocation, while GorillaLink's current presentation centers on a compact field dongle, device management, location visibility, and a scoped remote-asset deployment workflow. GorillaLink's possible edge is reducing the number of provider-specific integrations and putting connectivity status, usage, and asset context into one operational view. To establish a durable advantage it must demonstrate reliable network handover, lower total cost, enough carrier coverage, and easier deployment than a direct network subscription or a vertically integrated terminal. The 2023 government materials' 20-80 percent cost comparison is not independently substantiated here and is not treated as a verified performance result.

**Security, resilience, and dual-use relevance.** Dual-use relevance is credible at the communications-resilience layer, with defense applicability supported as an intended use rather than confirmed military deployment. The underlying problem—reporting status from sensors and equipment beyond cellular coverage—is shared by agriculture, utilities, maritime fleets, emergency response, and security organizations. The government export catalog specifically described G-Switch as remotely switching tactical cameras, sensors, and other electronic equipment over a dedicated satellite IoT link, while the current company site includes government deployments as a pilot category and requires security and certification needs to be scoped before an evaluation. The technology could support remote monitoring of power, water, and energy assets; field logistics; environmental sensing; maritime tracking; and low-data-rate status reporting for isolated equipment. It should not be represented as a tactical broadband radio, encrypted command system, anti-jam link, or fielded defense product: public evidence does not establish those properties, nor does it identify a military customer or procurement award. Strategic value comes from potentially reducing single-network dependence and giving operators visibility over remote devices during terrestrial outages, not from a proven sovereign satellite capability.

**Stage, trajectory, and diligence risks.** GorillaLink is best classified as early-stage, with an institutional signal of initial revenues and a live commercial site that is currently inviting scoped pilots. Its trajectory depends on whether it can turn demonstrations and early sales into a repeatable device-plus-service offer across multiple satellite providers. The most material diligence items are: (1) verify the identity and concentration of initial customers and the conversion rate from pilots to recurring contracts; (2) reconcile the earlier 50-network and patented-software descriptions with today's product specification, supported satellite services, and deployment roadmap; (3) inspect the patent filings, ownership, and freedom to operate; (4) measure message-delivery reliability, latency, power draw, and costs across actual coverage areas; (5) review device security, key management, OTA update controls, data residency, and third-party network dependencies; and (6) establish production readiness, certification status, supply chain, and support obligations for harsh environments. A team of roughly five and undisclosed funding may limit the ability to sustain hardware inventory, integrations, and international support. Conversely, a compact product with recurring service economics could address a real connectivity gap if it delivers carrier choice without requiring customers to manage a complex multi-provider stack. No revenue amount, financing total, customer name, or verified defense deployment is public, so those are open diligence points rather than inferred traction."""
