name = "Eltics"
description = "Eltics is an Israeli defense-technology company associated with Black Fox, an active adaptive thermal and multispectral camouflage concept for land, airborne, and naval platforms. Public evidence supports a patented R&D program and historical field demonstrations, but does not establish current production, deployment, revenue, or operating scale."
detailed_description = """
Eltics' documented core technology is active thermal-signature management rather than conventional paint, netting, or radio-frequency electronic warfare. Public patent material describes a countermeasure screen built from thermoelectric modules and a thermally conductive plate, while defense-industry descriptions add panoramic infrared sensing, a controller, background analysis, thermodynamic calculations, and heated or cooled panels. In principle, those elements allow a vehicle or other platform to present a controlled infrared appearance that blends with the background or imitates another object. The engineering problem is difficult: the system must control a large, moving, irregular surface while handling engine and exhaust heat, weather, changing backgrounds, sensor angle, power draw, heat rejection, and failure-safe behavior.

The customer and mission context is military survivability. A successful system could support armored vehicles, protected ground systems, helicopters, maritime platforms, and special-operations assets exposed to thermal imagers, night-vision systems, infrared search-and-track sensors, or heat-seeking weapon seekers. The value proposition is not invisibility in a general sense; it is reducing the probability or quality of detection, classification, tracking, or engagement in a particular spectral band and observation geometry. Procurement would require platform integration, environmental qualification, maintainability analysis, electromagnetic and thermal compatibility work, and repeatable range testing against representative sensors. The public record does not identify a current customer, qualified platform, or operational deployment.

The company has a meaningful historical technology trail. An Indian patent publication names Eltics Ltd. as applicant for an Active Adaptive Thermal Stealth System, with a 2007 priority date and a thermoelectric implementation. IVC describes Black Fox as an R&D-stage, B2B defense technology demonstrated in field experiments and lists five employees, while Army Guide and defense trade coverage describe development since 2006 and a full-scale prototype ambition. These sources are useful for reconstructing the program's history, not for proving present traction. The latest accessible company-status references identify an active private Israeli company, but one reports a last annual report in 2022; the current website evidence is limited to a responding configured domain and historical references, and the related .co.il profile is marked as not yet built out.

Competitive pressure is substantial. Eltics would compete with passive multispectral camouflage, low-emissivity materials, thermal-management components, platform OEM integration, and established defense-prime survivability programs. BAE Systems' Adaptiv concept is a direct active-infrared camouflage reference, while Saab Barracuda and other suppliers represent mature passive or multispectral alternatives. Eltics' plausible edge is adaptive thermal presentation: a feedback-controlled surface could respond to background and platform conditions more flexibly than a fixed coating or net. That is a technical hypothesis, not a validated moat. The record contains no current comparative test data, unit economics, manufacturing evidence, installed base, procurement win, or independently verified customer reference.

Strategically, Eltics remains relevant because persistent electro-optical surveillance and infrared-guided threats increase the value of signature discipline across the kill chain. The concept could matter for selected high-value platforms if it delivers measurable survivability benefits within acceptable power, weight, cooling, reliability, and maintenance limits. Nevertheless, current diligence should prioritize confirming whether the company and product remain active, who controls the intellectual property, what testing has been completed, and whether any defense organization has funded or accepted a system. Until those questions are answered, Eltics is best treated as a high-uncertainty historical deep-tech record rather than a verified scaled defense supplier.
"""
