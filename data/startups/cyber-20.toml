name = "Cyber 2.0"

description = "Cyber 2.0 develops network-containment software and gateways intended to stop cyberattacks from spreading after an initial compromise. Its portfolio targets enterprise IT, industrial OT/IoT, and connected-vehicle environments through a combination of allow-listing, port scrambling, and isolation controls."

detailed_description = """
Cyber 2.0's product thesis is that an organization should be able to limit attack propagation even when the first endpoint has been compromised and the malicious process is unknown. The company describes Cyber2IT as an IT network product and Cyber2OT as an OT/IoT product; it also markets protection for connected cars. Public product material describes a Chaos Engine or Containment Engine that continually changes communication ports and a Dynamic List that allows approved software or communication behavior while restricting unknown activity. The Vortex Gateway extends the model to devices that cannot run an endpoint agent, including industrial controllers and other embedded or legacy equipment. These are vendor-described capabilities, so the database should treat claims such as “total” or “unbreakable” protection as positioning rather than independently established performance.

The commercial opportunity spans three difficult but related environments. In enterprise IT, the value proposition is reducing ransomware and worm blast radius after EDR, antivirus, identity, or firewall controls have missed an event. In OT and IoT, the proposed advantage is protecting controllers and legacy devices without changing the device software or interrupting deterministic operations. In connected vehicles, the relevant buyer problem is controlling communication among ECUs, telematics systems, and gateways. Each market has different deployment, safety, and evidence requirements; success in one should not be assumed to transfer automatically to the others. OT buyers will want deterministic failure behavior, maintenance procedures, segmentation evidence, and integration with existing monitoring, while automotive buyers will require extensive validation and supply-chain acceptance.

Cyber 2.0 competes across overlapping categories rather than against one identical product. Illumio and Akamai Guardicore represent policy-driven segmentation and workload isolation; Dragos, Claroty, and Nozomi Networks represent OT visibility and detection; firewalls, NAC, EDR/NDR, and unidirectional gateways are important substitutes. The company's differentiation is the attempt to make containment itself the primary control, using dynamic port scrambling and an allow-list model instead of relying only on threat signatures or behavioral detection. A 2024 Frost & Sullivan award document describes the Containment Engine and Vortex Gateway, references nine patents, and cites customer testimonials, but it is not a substitute for audited revenue, independently reproducible testing, or a full customer reference list. Current LinkedIn activity and hiring indicate an operating commercial team, while public sources do not establish scale, retention, or broad production adoption.

The dual-use case is substantive because the underlying problem is shared by civilian critical infrastructure and defense networks: an initial foothold must not become access to the rest of the environment. Potential defense and national-security applications include protecting logistics and maintenance networks, limiting propagation across defense-industry partner environments, and isolating compromised systems in utilities or other critical services. This is a technology adjacency, not evidence of classified deployment or government contracting. Sensitive customers would need to validate the cryptographic and operational properties of port scrambling, understand how authorized traffic is maintained, test loss-of-control and recovery scenarios, and confirm that the gateway cannot itself become a high-impact choke point. The most important diligence question is whether the system produces measurable containment and availability benefits under realistic, independently designed attack and safety tests.
"""

