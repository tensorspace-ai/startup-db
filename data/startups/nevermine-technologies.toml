investment_rationale = "NeverMine merits a strategic priority signal because it is developing a differentiated sensing system for a persistent humanitarian and defence problem, and the underlying neutron/gamma method could be useful where metal-based tools are weak. (1) The opportunity is unusually consequential: faster, remote hazard screening could improve operator safety and land-release economics. (2) The R&D thesis combines established nuclear measurement physics with custom sensors, algorithms, and an airborne deployment concept. (3) The company has a small team, government-backed R&D support, accelerator exposure, and a May 2026 presentation to a leading international mine-action technical group. The counterweight is severe technical and commercialization risk: public metrics are self-reported and inconsistent across sources, field validation and named customer orders are not public, and radiation safety, false alarms, payload constraints, and procurement could slow deployment. This legacy flag reflects monitoring priority, not an investment recommendation."
strategic_value = "The strongest strategic value is safer and more efficient explosive-hazard survey for humanitarian clearance, national authorities, and military engineering units. If independently validated, remote elemental sensing could reduce the number of personnel-hours spent searching contaminated ground and help restore land and infrastructure sooner after conflict. The platform could support security screening beyond mine action, but those applications remain a roadmap rather than demonstrated performance. Strategic diligence should focus on measured field accuracy, radiation controls, lawful operation, and whether mine-action operators accept its output as a useful complement to established clearance processes."
