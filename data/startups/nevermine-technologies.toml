priority_rationale = "NeverMine merits monitoring because it addresses a high-consequence mine-action and explosive-detection need with a technically differentiated remote-sensing approach and explicit civilian-resilience and security applications. Supporting signals include an active Israeli company record, R&D support, a small multidisciplinary team, accelerator participation, and a technical presentation to the GICHD community. Priority remains provisional: there is no named commercial deployment or independent field performance report, public technical claims vary materially between sources, and radiation safety and system scale-up are substantial barriers. The most decision-relevant next evidence would be a witnessed multi-site trial with disclosed target classes, depths, false-positive and false-negative rates, regulatory controls, and operator workflow results. This is a legacy portfolio-priority signal, not investment advice."
