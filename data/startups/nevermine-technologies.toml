name = "NeverMine Technologies"
description = "NeverMine Technologies is an Israeli deep-tech company developing a drone-mountable neutron and gamma sensing system intended to identify explosive signatures and map shallow subsurface hazards. Its stated goal is to improve mine action and explosive ordnance detection by sensing material composition rather than relying only on metal content or surface shape."
detailed_description = """**Product and the problem it addresses.** NeverMine Technologies is trying to make land release and explosive ordnance screening safer and faster in places where conventional survey methods are slow, expose people to danger, or miss low-metal and non-metallic devices. Humanitarian demining teams commonly combine manual procedures, metal detectors, trained dogs, and other instruments; each has a role, but metal-based approaches can struggle when a threat contains little metal or when the ground is cluttered with fragments. NeverMine describes a remote elemental-intelligence platform that would scan soil and other materials, detect chemical signatures associated with explosives, and locate suspected hazards without first putting an operator directly over them. The company presents mines and unexploded ordnance as its initial problem, while its current site also names border and cargo screening, security, and critical-mineral identification as possible application areas. The immediate operational value proposition is a better screening layer that helps clearance authorities prioritize where trained people and confirmatory methods should be used. It should not yet be treated as a certified clearance instrument or a replacement for formal mine-action procedures.

**Core technology and how it works.** Public materials describe a pulsed neutron source paired with gamma-ray detectors and software that interprets the resulting neutron/gamma response from shallow subsurface material. At a high level, fast-neutron activation analysis exposes a target to neutrons; interactions with elements in the target produce gamma emissions whose spectrum can carry information about elemental composition. NeverMine says its customized sensors and proprietary algorithms analyze that response in real time to distinguish explosive-related signatures and estimate their location. Its May 2026 presentation to the Geneva International Centre for Humanitarian Demining’s Innovation Technical Group calls the method a mature underlying technology used in laboratories and drills, and says the company is combining it with custom sensors and algorithms. The company materials therefore suggest that the proposed novelty is chiefly system integration, sensor configuration, signal analysis, and remote deployment, rather than the discovery of neutron activation itself. The published presentation labels the approach “patent pending,” but no specific application number or independently confirmed granted patent was located in the reviewed material.

**Performance evidence and technical limits.** The strongest public performance detail comes from a NeverMine presentation, not an independent trial report. The May 2026 deck reports that a laboratory system detected concealed gamma-radiation sources and that software for real-time source detection was tested; it states a 99.5% probability of detecting a buried bomb under interfering man-made background, at a stated height of 300 centimetres and depth of 10 centimetres. An October 2025 iHLS feature, published by the accelerator that supported the company, gives broader company-reported figures: up to 99% detection probability, targets to half a metre deep, a drone flying 20–30 metres above ground, and one square kilometre scanned per day. Those two accounts do not describe the same operating envelope, so the more ambitious range, altitude, and throughput figures require controlled field replication before they should guide a deployment decision. Neither source publishes sample counts, explosive types, blind-test protocols, false-alarm rates, soil and moisture conditions, calibration requirements, or independent lab accreditation. The figures are promising development claims, not established operational specifications.

**Market, users, and route to deployment.** The most credible first buyers are national mine-action authorities, humanitarian clearance operators, engineering and EOD contractors, and defence organizations that need to survey contaminated land or screen for explosive hazards. If the system can be mounted on a drone, a scan could create a prioritization map that directs ground teams to smaller investigation areas; a second scan after disposal could help verify that a site has been cleared. The GICHD presentation also refers to a strategic partner and investor and to traction with a leading Israeli demining and explosive-ordnance entity, but it does not name either organization. The iHLS article says the company expected to test a real-world prototype with Ben-Gurion University, which is a planned validation step rather than proof of a completed deployment. The official site’s references to border screening, cargo, and critical minerals broaden the potential market, but public sources do not establish paid contracts, delivered systems, regulatory approvals, repeat customers, or mineral-analysis performance. Sales would likely require trials with mine-action authorities and integration with existing survey, geospatial, and clearance workflows.

**Traction, funding, and external validation.** Israel Innovation Authority and IVC profiles identify the company as established in 2024, with seven employees and an R&D-stage profile. IVC records earlier accelerator or non-equity support and a June 2025 R&D grant entry, but the publicly accessible amount and full financing terms are not disclosed. A May 2026 company presentation says NeverMine was then raising financing. The company graduated from the INNOFENSE innovation program, operated by iHLS with Israel’s Ministry of Defense, according to iHLS coverage; IVC also lists accelerator support. It was included in the Geneva International Centre for Humanitarian Demining’s May 2026 Innovation Technical Group materials, giving it a relevant venue to present to the mine-action community, but inclusion is not certification or endorsement. IVC identifies the former name Green Diesel, and the Israeli company record shows the active legal entity; this provides useful identity continuity while also explaining why some older descriptions still refer to sustainable fuel and drone scanning. No public revenue, named commercial customer, production order, patent number, or audited test report was found.

**Founders and team.** Public profiles show a small but multidisciplinary team spanning engineering, company building, and nuclear or radiation-related expertise. The Israel Innovation Authority names Rafael Feitelberg as CEO and Arkadiy Fidelman as CTO and co-founder; IVC additionally lists Evgeni Grabov and Yuriy Zabulonov in senior roles. The 2025 iHLS profile describes Fidelman’s earlier work running mechanical laboratories and Green Diesel, Grabov’s mechanical-engineering background and advisory work for the Ukrainian government, and Professor Erez Gilad’s role leading a nuclear-engineering unit at Ben-Gurion University. It also identifies Zabulonov as a Ukrainian biochemistry institute leader and development-team head. The sources do not fully reconcile historical and current titles, and the founder biographies are not a substitute for reference checks. The company will need unusually broad execution capability: nuclear instrumentation and radiation safety, airborne payload design, algorithms, geophysics, mine-action operations, certification, and long-cycle public-sector sales. Seven reported employees is a lean base for taking a laboratory sensing system through rugged field qualification and manufacturing.

**Competitive dynamics and possible edge.** NeverMine would compete against both existing detection tools and alternative sensing principles. VALLON supplies established metal detectors and magnetometers used in humanitarian and military explosive-ordnance clearance; these have training, procurement, and service advantages, although metal detection does not directly identify explosive chemistry. Australia’s MRead is developing magnetic-resonance sensors intended to detect explosive molecules, another chemistry-oriented approach with a different physical mechanism. Sodern supplies neutron-based elemental analysis systems in adjacent industrial and security markets, illustrating that neutron interrogation is an established field with experienced vendors. Other substitutes include ground-penetrating radar, electromagnetic induction, trained dogs, manual survey, and multi-sensor workflows. NeverMine’s proposed edge is the combination of elemental discrimination, a custom detector and analysis stack, and a drone or remote platform that could survey larger areas while keeping people farther from suspected hazards. That advantage remains conditional: the company must demonstrate reliable discrimination in real soils, acceptable false alarms, safe and permitted operation, practical payload and power requirements, repeatable scan economics, and a workflow mine-action authorities will trust.

**Strategic relevance, stage, and diligence risks.** The dual-use case is direct at the sensor level: explosive detection can support civilian humanitarian demining, post-conflict land release, infrastructure recovery, border security, and military force protection. Faster, more reliable hazard mapping could reduce risk to clearance personnel and shorten the time before contaminated land is usable for housing, transport, agriculture, or reconstruction. The system’s elemental-analysis direction may also have future relevance to material screening, but the reviewed evidence does not validate its critical-mineral or cargo applications. NeverMine is best classified as early-stage R&D: it has a documented laboratory proof-of-concept narrative and a route into relevant mine-action forums, but public material still calls for financing and field validation. Key diligence questions are whether independent teams can reproduce the reported detection probability; whether false alarms remain manageable across soil types, moisture, depth, and clutter; how neutron-source safety, shielding, radiation licensing, aviation rules, and operator exposure are handled; whether the system can be reduced to a practical drone payload with sufficient endurance; who owns the underlying IP and what the patent-pending claims cover; and whether the unnamed strategic relationship becomes a referenceable pilot or purchase. These issues make the technology strategically important to monitor while keeping maturity and deployment claims firmly provisional."""
