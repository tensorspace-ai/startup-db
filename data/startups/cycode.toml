name = "Cycode"
description = "Cycode is a cybersecurity startup building an agentic application security platform that unifies application security testing, application security posture management, and software supply-chain security across the software development lifecycle. Its platform helps enterprises identify, prioritize, and remediate risks in human- and AI-generated code, CI/CD pipelines, secrets, open-source dependencies, infrastructure-as-code, containers, and developer-tool ecosystems."
detailed_description = """
Cycode started with a software supply-chain security thesis and has expanded into a broader application security platform for what it calls the Agentic Development Lifecycle. Its current public product site describes application security testing, application security posture management, software supply-chain security, and AI governance and orchestration. The platform combines scanning engines and third-party integrations with a Context Intelligence Graph intended to correlate risk across source code, dependencies, build pipelines, containers, infrastructure-as-code, cloud context, ownership data, and developer workflows. Its newer AI inventory, guardrails, and Maestro capabilities target enterprises adopting coding assistants and software-development agents.

The customer problem is practical and urgent: engineering organizations often run many AppSec, DevOps, cloud, and developer tools that produce overlapping findings without enough context to decide what matters. Cycode's value proposition is to centralize those signals, reduce duplicate or low-priority alerts, identify who owns a vulnerable component, and push remediation into developer-native workflows such as pull requests, CI/CD checks, IDEs, and ticketing systems. This can fit finance, software, retail, manufacturing, and other regulated or high-scale enterprises where release velocity, open-source dependency risk, exposed secrets, and compliance evidence matter. Those outcomes remain a vendor proposition until independently measured at customer scale.

The category is competitive and moving quickly. Cycode competes with developer-security and AppSec platforms such as Snyk, Checkmarx, GitHub Advanced Security, GitGuardian, Apiiro, Legit Security, and Endor Labs, while cloud security platforms are extending code-to-cloud context. Its differentiation depends less on any single scanner and more on whether its graph, integrations, prioritization, AI governance, and remediation workflows become a useful system of record for application risk. Buyers may consolidate around a larger incumbent or accept bundled tools from source-control, cloud, or AppSec vendors if Cycode cannot demonstrate better prioritization, coverage and developer adoption. Product claims of faster scans or AI remediation should be checked against matched customer workloads and false-positive rates.

Funding is publicly documented through a $4.6 million seed round in 2019, a $20 million Series A in May 2021, and a $56 million Series B in November 2021. Insight Partners led both later rounds, and YL Ventures participated across the seed and later rounds. Public cumulative totals do not reconcile cleanly: the Series A announcement says $25 million to date, the Series B announcement says $81 million, and the 2024 acquisition release says $80 million, while the three individually reported rounds sum to $80.6 million. Accordingly, the rounds are better evidence than any single lifetime-total headline; no later financing was located. Cycode acquired Bearer in March 2024, adding SAST, API discovery, data-leak analysis and AI-assisted remediation. The deal price was not disclosed. Cycode described 350%+ revenue growth and a record bookings quarter in the acquisition announcement, without giving a period or absolute revenue figure.

Commercial evidence is positive but incomplete. Cycode's 2021 Series A release named Grubhub, Databricks, Flexport, Rapyd, Copart and Cobalt as new customers; its Series B materials described dozens of customers including large enterprises and startups. These are dated company announcements, not proof that each remains a customer or that deployments are currently in production. In August 2026, Cycode announced that ARR had grown fourfold during Seth Robbins's roughly three-year tenure and appointed him President and CRO across sales, marketing and customer success. This is a company-reported growth multiple, not absolute ARR, and it does not establish retention, profitability, margins, or the acquired product's contribution. A reliable current employee count was not found; the current company About page's numeric widget contains implausible and contradictory values, so its headcount figure should not be treated as evidence.

Cycode has meaningful dual-use relevance because application security and software supply-chain integrity are foundational controls for defense software, intelligence systems, defense industrial base contractors, and critical-infrastructure operators. These organizations depend on commercial software development practices, open-source components, CI/CD automation, and increasingly AI-assisted coding, creating attack surfaces for credential leakage, build compromise, vulnerable dependencies, and unsafe generated code. Cycode is not a defense-specific product, and reviewed sources do not establish a government contract, military deployment, or authorization. Its relevance is therefore a technical applicability case, not evidence of defense-market traction. Procurement cycles, data-residency constraints and required approvals could make public-sector deployment materially different from commercial use.
"""
