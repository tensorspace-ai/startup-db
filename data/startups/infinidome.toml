name = "InfiniDome"
description = "InfiniDome is a privately held Israeli aerospace and defense company developing compact GNSS anti-jamming and resilient-navigation products for UAVs, vehicles, fleets, and critical infrastructure. Its current portfolio combines inline or OEM protection modules with a broader move toward layered navigation resilience for contested or degraded RF environments."
detailed_description = """InfiniDome develops hardware and integration technology intended to preserve positioning, navigation, and timing continuity when GNSS signals are disrupted. Its product family includes GPSdome-SunStone and its OEM form, the Aura/AuraCore line, OtoSphere-LightHouse, and a resilient-navigation system that combines GNSS protection with Honeywell inertial and radar-velocity components. The company’s technical proposition is a cost, size, weight, and power (C-SWaP) tradeoff: use antenna-side or inline null-steering and interference-protection modules that can be retrofitted to an existing active antenna and receiver, rather than requiring a large premium navigation architecture. The Aura datasheet describes multi-frequency configurations, approximately 100 ns latency, IP65 protection, and a 375 g enclosed unit; the exact configuration and performance envelope vary by product and should be checked against customer requirements.

The initial customer problem is clearest in defense and homeland security. Small UAVs, loitering systems, unmanned ground vehicles, and maritime platforms can lose control or mission continuity when exposed to intentional or incidental GNSS interference. InfiniDome’s own market materials also target enterprise drones, fleets, maritime assets, autonomous vehicles, and critical infrastructure. These commercial adjacencies are credible because the same receiver-side protection and monitoring layer can serve civilian systems that depend on GNSS, but commercial scaling depends on certification, installation economics, and evidence that protection works across the relevant interference conditions. Anti-jamming should not be treated as equivalent to full navigation in a GNSS-denied environment: the company is increasingly presenting layered navigation and IroNav as the path beyond protection alone.

The competitive field includes established anti-jam antenna and assured-PNT suppliers such as Hexagon’s NovAtel, Safran’s navigation businesses, Septentrio, and defense-electronics primes that can bundle GNSS protection with inertial navigation or a wider electronic-warfare system. There are also lower-cost receiver, antenna, and software substitutes, and platform integrators may build a solution internally. InfiniDome’s potential edge is packaging: a small, platform-agnostic retrofit or OEM module aimed at class-1-to-class-3 UAS and other constrained platforms, supported by products with published mechanical, environmental, and RF specifications. That edge is commercially useful only if field performance, supply reliability, exportability, and integration support are competitive against larger vendors with deeper qualification budgets.

There are meaningful commercialization signals, but public evidence remains more qualitative than financial. InfiniDome announced a $9 million Series A in April 2023 led by Hanwha Aerospace, with Honeywell Ventures and Next Gear Ventures also identified in the announcement. Honeywell separately announced a collaboration to develop GPS-protection systems for defense and commercial aircraft, urban-air-mobility, unmanned, and surface-vehicle applications. InfiniDome announced a U.S. subsidiary in 2024, and its current site lists Israeli and U.S. locations plus a distribution relationship in India. These are useful channel and strategic-partner signals, not proof of recurring revenue, production volume, named program wins, or successful deployment with the armed forces mentioned in financing coverage. Diligence should request shipment history, backlog, gross margin by product, qualification status, customer concentration, and independent test data.

Strategically, InfiniDome addresses an important enabling layer for allied autonomy and resilient PNT. The technology is dual-use because GNSS interference protection can support defense platforms, public-safety and border systems, unmanned logistics, maritime operations, and critical-infrastructure timing or inspection. Its defense relevance is high, while its venture profile remains exposed to long procurement cycles, platform-by-platform integration, export controls, and rapid adversary adaptation. The strongest thesis is therefore not that InfiniDome replaces inertial or alternative navigation, but that it can become a lightweight, scalable protection component within a layered navigation stack."""
