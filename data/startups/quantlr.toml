dual_use_description = "QKD provides information-theoretic security (ITS) for authenticated key exchange provably secure against quantum-era threats. Defense and intelligence agencies deploy QKD to protect classified communications, inter-government links, and nuclear command-and-control systems against current and future decryption. Critical infrastructure (power, water, telecom) increasingly adopts QKD to harden supervisory control channels. Commercial high-assurance sectors (finance, healthcare, regulated utilities) use QKD for regulatory compliance and operational resilience. QuantLR's integration with NIST-aligned PQC creates a layered defense strategy: QKD provides unconditional security while PQC hedges against QKD implementation weaknesses or deployment gaps. This layered approach is attractive to national security strategists managing quantum-era cryptographic transition. Dual-use risk exists: nation-states may restrict QKD exports, treat QKD vendors as strategic assets, or weaponize quantum capabilities. However, the underlying physics is not restricted and QKD remains a credible dual-use technology with legitimate civilian and defense applications."
