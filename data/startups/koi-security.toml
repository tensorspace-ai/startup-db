dual_use_description = "Koi has strong dual-use applicability because the same controls needed by commercial enterprises to govern AI agents, software packages, extensions, and MCP servers are needed by defense-adjacent organizations with stricter security and compliance requirements. The technology addresses a real operational risk: autonomous endpoint tools can inherit user privileges, access local files, call internal APIs, store credentials, and update through external marketplaces. In defense, intelligence, and critical-infrastructure environments, agentic endpoint visibility and policy enforcement can support secure software intake, classified development controls, CMMC/NIST-aligned software assurance, and prevention of credential leakage or lateral movement through compromised tools. The dual-use thesis is strongest as a governance and assurance layer, not as a defense-specific product by itself."
