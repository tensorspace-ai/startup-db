name = "Sensorz"
description = "Sensorz is an Israeli defense-technology startup developing SWORD, an open software platform that detects, classifies, tracks, and geolocates RF activity and can orchestrate responses across connected systems. Its newer WAVE100 sensor extends the platform into a wideband, edge-deployed RF sensing layer for defense, public safety, telecom, airports, and other critical infrastructure."
detailed_description = """Sensorz develops software and RF sensing products for turning raw electromagnetic activity into operational events. Its flagship SWORD platform is described by the company as an EW/SIGINT system for real-time detection and identification of emitters, including communications, autonomous platforms, guided munitions, and countermeasures. The product ingests lightweight spectrogram streams from a broad range of RF receivers, applies automated signal detection and classification, and supports direction finding, geolocation, tracking, and historical forensics. The company also presents WAVE100 as a wideband RF sensor that can provide persistent spectrum awareness from tactical deployments to fixed sites. The public material is product-focused; it does not independently establish performance against a particular threat library, probability of detection, or false-alarm rate, so those metrics remain important diligence questions.

The core commercial proposition is an open, hardware-agnostic software layer that can connect existing receivers and feed results into customer workflows. Sensorz says SWORD can operate over cellular or satellite communications and across vehicles, vessels, airborne systems, tactical teams, and fixed installations. Its orchestration engine is intended to close the loop from detection to action by triggering or informing third-party anti-drone, jamming, alerting, intelligence, frequency-management, and command-and-control systems. This integration orientation matters because spectrum users rarely control every sensor and effector in their environment. It can reduce replacement requirements, but it also creates demanding interoperability, cybersecurity, latency, and safety-validation obligations.

The customer set spans defense and homeland-security organizations as well as civilian operators with expensive or safety-critical RF environments. The official site emphasizes battlefield spectrum awareness, dominance, and response. Sensorz's public company profile additionally identifies airports and seaports, while a company post describes a real-time interference-detection pilot at a major international airport involving communications, navigation, and radar systems, followed by an intended permanent deployment. The airport is not named publicly in the source reviewed here, so the result should be treated as a company-reported traction signal rather than a verified reference customer. The same platform could address telecom spectrum assurance, unauthorized-transmitter localization, critical-site protection, and event or venue interference management, although the scale and repeatability of these civilian markets are not yet clear.

Competitive pressure comes from established EW and SIGINT primes, specialized spectrum-monitoring vendors, counter-UAS companies, receiver manufacturers, and internal government systems. Sensorz's potential edge is the combination of passive RF intelligence, edge AI classification, receiver flexibility, lightweight data handling, and response orchestration in a relatively deployable software layer. That positioning is attractive where customers need to combine heterogeneous sensors or adapt quickly to new emitters. It is not yet proof of a durable moat: incumbent vendors have deeper procurement access and integration resources, while focused competitors may have stronger hardware, algorithms, RF libraries, or installed bases. The company profile lists 11-50 employees and Kfar Saba headquarters, consistent with a small team capable of product iteration but still exposed to key-person and delivery-capacity risk.

Sensorz is strategically relevant because modern forces and critical infrastructure increasingly need visibility in congested, contested, and GPS-degraded electromagnetic environments. Passive sensing can support counter-UAS, force protection, electronic battlefield management, mission assurance, and interference response without depending on visual line of sight. The company has also publicly stated that it raised $6 million led by Alea Capital Partners and AnD Ventures; this is a self-reported financing signal, not an independently verified filing or proof of revenue. Overall, Sensorz has credible dual-use relevance and meaningful defense fit, but diligence should focus on deployed-system evidence, recurring revenue, customer concentration, classification performance in adversarial conditions, exportability, and the economics of integrating and supporting many receiver and effector configurations."""
