dual_use_description = "Sensorz's core capabilities have substantive defense and civilian applicability. In defense, SWORD and WAVE100 can support passive RF situational awareness, counter-UAS cueing, force protection, electronic battlefield management, and spectrum assurance. In civilian markets, the same detection, classification, direction-finding, and anomaly-localization functions can address airport and seaport interference, telecom and regulator spectrum monitoring, critical-site protection, and unauthorized-transmitter investigations. The dual-use case is credible because the underlying workflow is RF sensing and analysis rather than a weapon-specific payload. However, military-grade performance, export controls, and integration with jammers or other effectors can make particular deployments defense-sensitive."
