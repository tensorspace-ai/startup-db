stage_rationale = "Sensorz remains an early-stage startup by public scale and maturity signals: LinkedIn lists 11-50 employees, the company is privately held, and public materials describe active product development, hiring, demonstrations, and expansion rather than a mature revenue base. The reported $6M raise and references to an airport pilot, a telecom-regulator engagement, and defense demonstrations suggest progress beyond a laboratory concept, but the reviewed sources do not verify recurring revenue, named customers, fleet-wide deployments, or audited commercial scale. The appropriate classification is therefore early rather than mid-stage. A move to mid-stage would require evidence of repeatable deployments, multiple paying customers, sustained revenue, and a support organization able to deliver complex RF integrations across markets."
