name = "eyesAtop"
description = "eyesAtop is an Israeli defense-software startup building a hardware-agnostic command, control, and autonomy layer for operating multiple drones, sensors, and AI capabilities through one mission system. Public company materials describe field deployment with Israeli military units, but the scale and scope of those claims require customer and contract diligence."
detailed_description = """eyesAtop develops the operational software layer between heterogeneous unmanned aircraft and the people or systems directing them. Its public positioning centers on a universal controller, centralized multi-drone command, edge-AI integration, and an open architecture that can bring different drone types, sensors, payloads, and mission applications into one operator workflow. The practical problem is fragmentation: a force that buys many small UAVs can otherwise end up with separate ground-control stations, training paths, data views, and vendor-specific interfaces. eyesAtop's proposed value is therefore less about building another airframe and more about reducing the operational cost of making a mixed fleet behave like a coordinated system.

The principal market is defense and national security. LinkedIn describes use across ISR, targeting, surveillance, force coordination, and GNSS-denied operations, while the official site emphasizes autonomous warfare and an edge-AI compute unit. A July 2026 CTech report says eyesAtop and Kela were selected for an Israeli Ministry of Defense program intended to provide autonomous command and control for the IDF's future attack-drone fleet; CTech attributes the operational claims to the companies and reports more than 500,000 flight hours in complex combat environments. This is a meaningful commercialization and strategic signal if independently confirmed, but it is not equivalent to disclosed revenue, backlog, contract value, export approval, or a demonstrated product across every advertised platform.

The company appears to be an independent, privately held startup with an 11-50 employee range and a Rehovot, Israel presence. Public records conflict on its founding date: an older company page and startup-directory records point to 2015, whereas the database snapshot used 2019. I use 2015 as the better-supported original founding signal, while leaving financing undisclosed because no reliable public source reviewed here establishes a current round, amount, or investor list. The team is small relative to the integration, safety, cybersecurity, and field-support burden of a defense C2 product. The reported selection and hiring activity suggest growth, but investors should verify recurring revenue, gross margin, deployment ownership, and whether deployments are pilots, limited-unit fielding, or scaled programs.

eyesAtop has credible dual-use potential, but the evidence is currently defense-led rather than balanced across civilian verticals. The same abstractions could support emergency-response fleets, industrial inspection, public-safety search and rescue, or critical-infrastructure monitoring, yet the company's current public messaging and reported program are centered on military operations. Its strategic relevance is high because an interoperable control layer can reduce vendor lock-in, shorten the time required to insert new unmanned platforms, and help forces scale the number of aircraft per operator. That relevance also creates the main diligence burden: reliability, cyber resilience, human authorization, degraded-navigation behavior, data rights, export controls, and integration responsibility matter more than a generic AI narrative."""
