name = 'Cybint Solutions'
description = "Cybint Solutions is an Israeli-founded cybersecurity education business whose training products were acquired by HackerU (later ThriveDX) in 2021 and operated as ThriveDX SaaS. Its offering combined role-based cybersecurity training, cyber range simulations, and education programs for enterprises and academic partners."
detailed_description = """Cybint Solutions was founded in 2014 by Roy Zur and built cyber education products for higher education, enterprise, and workforce training. Its historical product set included a cloud or on-premise cyber range, the Cyber Security Analyst Simu-Lab Suite, role-based cyber awareness training, specialized security instruction, and a Cyber Talent Network intended to connect skilled candidates with employers. In a 2019 customer announcement, the company described simulated network traffic and defensive scenarios, practical training, and delivery through university programs. The same announcement documented a partnership with Yeshiva University's Katz School for its cybersecurity master's degree. This is evidence of an education partnership and product deployment in an academic program, not evidence of contract size, renewal, or later active use.

Cybint's acquisition by HackerU was announced in 2021 as part of HackerU's rebranding to ThriveDX. At the time, CTech reported that Cybint had previously raised $7.5 million and described the acquisition value as an estimate of $50 million. The amount is a reported press estimate, not a disclosed purchase price, so it is not treated here as new startup financing or as a verified transaction amount. A March 2022 ThriveDX SaaS announcement calls ThriveDX SaaS formerly Cybint Solutions, identifies it as ThriveDX's SaaS arm, and names Roy Zur as its CEO. This places the product line within a larger education group and changes the relevant underwriting question: Cybint should be assessed as an acquired product/business with group-level distribution and ownership, rather than as an independent venture-backed startup.

The live Cybint-branded website continues to describe role-based employee education, training for security teams, interactive learning, dashboards and reporting, SSO and LTI integrations, a phishing simulator, and threat-based content updates. These are current company-site product assertions. The site's continued presence and a current terms document referring to ThriveDX SaaS Ltd and affiliates support ongoing commercial-facing operations under the ThriveDX umbrella, but do not establish Cybint as a separately operating legal company, current customer counts, usage, or financial health. The historical marketing site also describes military-informed expertise and government agency partnerships. Those statements are not specific evidence of an IDF customer, a defense contract, or operational military deployment; no such assertion is made in this record.

Commercially, the product addresses two distinguishable needs: reducing risky employee behavior through role-specific security learning, and teaching technical staff through practical exercises and simulations. The former is adjacent to a crowded security-awareness market; the latter competes with cyber ranges, hands-on labs, professional certification and training providers, and in-house learning programs. The combination could help a buyer cover both broad employee awareness and more advanced skill development, though public materials do not establish a durable technical moat, efficacy advantage, customer retention, or superior learning outcomes. The 2019 Yeshiva partnership is a concrete historical customer-side signal. It should not be generalized into a current customer roster or proof of revenue.

The acquisition brought strategic distribution and product portfolio benefits to ThriveDX, and the subsequent addition of Kontra to the SaaS arm illustrates how the group expanded its corporate training portfolio. However, group acquisitions and investments are not Cybint financing rounds. Public reporting in 2025 described severe financial and creditor pressure at Thrive's broader group and a restructuring involving HackerUSA, debt relief, a 50% equity transfer to creditors, and transfer of group cybersecurity intellectual property to that US entity. This raises material questions about the present ownership, licensing and control of Cybint-originated assets. The reporting is about the group and its US entities; it does not by itself establish that Cybint's particular product was discontinued or identify the exact legal chain of title for each product.

The dual-use case is bounded. Cybersecurity awareness, incident response exercises, and technical range-based instruction can serve commercial organizations and public-sector security teams. Cybint's historical materials explicitly mention government agencies and military-derived methodologies, making public-sector applicability plausible. The available sources do not verify a defense customer, classified work, offensive cyber operations, or military procurement, and marketing language should not be elevated into those claims. The most credible strategic value is workforce preparation and simulated defensive practice, subject to evidence of customer outcomes and continued rights to the underlying range and course content.

Investment characteristics therefore differ from the legacy growth-stage profile. The company was acquired, its historic financing is incompletely documented, no current standalone financial disclosures were found, and the parent group has reported creditor and IP-transfer developments. No independent valuation, current revenue, employee count, cap table, or product-specific customer metrics are established. The score fields are conservative legacy-priority indicators rather than a recommendation. Diligence should identify the contracting entity and IP owner today, establish whether Cybint-branded products remain sold and supported, and obtain cohort-level customer retention and learning-outcome evidence. Until those questions are answered, this is better viewed as an acquired cyber-training asset with potentially useful dual-use capabilities than as a verified independent growth startup."""
