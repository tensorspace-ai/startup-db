name = "RemPi"
description = "RemPi is an Israeli startup developing a temporary vessel-mounted sensing kit and shore station that let licensed marine pilots guide ships without boarding from a pilot boat. Its stated product combines RTK positioning, camera views and bridge data in an encrypted, synchronized operating picture; public evidence currently supports a product concept and early outreach, not a fielded commercial deployment."
detailed_description = """
**Product and the problem it addresses.** RemPi is designing remote marine pilotage around a hazardous but routine step in port operations: transferring a licensed pilot from a small moving pilot boat onto a merchant vessel, often in darkness, swell, poor weather or tight scheduling windows. The company’s proposed alternative is to move the pilot’s working position ashore while leaving the pilot’s navigational judgment and licensing role with a human. A portable kit is temporarily installed on the ship; the pilot receives a remote operating picture from a dedicated shore station and directs the vessel through the close-quarters maneuver. This distinction matters. RemPi is not presenting itself as a fully autonomous ship or as software that replaces local pilot knowledge. Its product thesis is that ports can avoid some transfers, reduce exposure to ladder accidents, and let scarce pilots spend more time on pilotage rather than transport and waiting. The company cites a Lloyd’s List estimate of two to three pilot-transfer deaths per year worldwide, but that figure is presented on the company site and is not independent evidence of RemPi’s own safety performance. The underlying problem is real and institutionally recognized: the International Maritime Organization describes safe pilot transfer as a recurring issue and sets requirements for transfer arrangements. RemPi’s proposed solution would change where a pilot works, so it must address operational authorization and safety assurance as well as the technical feed.

**System design and technical approach.** RemPi describes three information streams combined at the shore station. First, separated RTK positioning modules establish the vessel’s position and derive heading; the company advertises a target of one to two centimeters of accuracy at ten updates per second. These are stated system targets, not independently measured product results. Second, forward and side camera viewpoints give the pilot visual references for relative movement and clearance in confined waters. Third, bridge or pilot-plug data contributes heading, speed and control status. The company says the feeds are synchronized and encrypted, and that multiple sources can be cross-checked to support low-speed prediction and operation in reduced visibility. Its deployment concept uses an industrial drone to carry the portable modules to a vessel, avoiding the need to move the pilot aboard. Public material does not disclose camera specifications, positioning hardware vendors, link architecture, latency, availability, cyber controls, or how degraded or contradictory sensor feeds are handled. Startup Nation Finder’s profile, last updated in November 2024, also described AI-based object recognition and low-visibility capability, but RemPi’s current public site does not provide model details or performance measurements. The company states that selected system and operating-method elements are covered by a pending patent application; it does not publish an application number, claims, jurisdiction or grant status. Those gaps are central diligence items for any safety-critical navigation system.

**Market, buyers and route to market.** The obvious first buyers are port authorities, pilotage organizations, and the service providers responsible for safe ship movement in constrained approaches, channels and harbors. A port would need to coordinate approval among the pilot organization, vessel operator, harbor master, traffic services, insurers and the relevant maritime regulator. RemPi’s commercial proposition is therefore a system sale or service relationship embedded in local operating rules, not a quick self-serve software subscription. The product is designed as a temporary retrofit rather than a new vessel class, which could reduce installation friction if the kit proves reliable and compatible with diverse bridges and ship configurations. The company’s illustrative major-port scenario compares 31 daily operations in a boat-transfer workflow with 47 operations under its remote workflow, assuming a fifteen-minute transfer and a thirty-minute docking cycle. That is a company-generated scenario, not a measured customer result; actual time savings would depend on port geography, traffic, weather, operating rules, vessel mix, communications coverage and whether remote pilotage is authorized. Wärtsilä has previously discussed remote pilotage with Finnish pilotage operator Finnpilot and separately sells pilot-management software, demonstrating that the workflow has an established industrial and regulatory context. It also underscores that RemPi enters a market where navigation-equipment suppliers and port systems vendors already have customer relationships. The startup’s current website says it is opening conversations with ports, pilots, technology partners and early-stage investors, but does not identify a customer, trial location, contract, purchase order or deployment schedule.

**Traction, financing and external validation.** Publicly verifiable company traction is limited to a live product-positioning website, a described system architecture, team disclosures and ecosystem listings. Startup Nation Finder records RemPi as founded in 2023, with one to ten employees, an Israel location, research-and-development product stage and no disclosed funding rounds; the profile was last updated on November 17, 2024, so its employee and financing fields should not be treated as current. The official site, crawled in 2026, gives a more current commercial signal by explicitly inviting early-stage investors and prospective port and technology partners to start discussions. I found no independently reported financing, named port customer, announced pilot, regulator approval, class-society certification, measured operating outcome, or public safety case. RemPi states that a patent application is pending, but does not provide enough public detail to evaluate its scope or status. Seanovation’s founders directory corroborates the identities and RemPi roles of Vadim Tzukerman and Roman Bar German, and Wärtsilä’s remote-pilotage material establishes prior industry exploration of the concept; neither source validates RemPi’s hardware or product readiness. The company website’s 52 percent throughput illustration and centimeter-level positioning figures should be treated as hypotheses or targets until a controlled port trial reports methods, operating constraints, incident data, availability, and comparison baselines. The absence of public validation is not proof that no private prototype or conversation exists, but it makes current execution maturity difficult to establish.

**Founders and team fit.** RemPi identifies Vadim Tzukerman as co-founder and CEO and Roman Bar German as co-founder and CTO. On the company’s own account, Tzukerman is a merchant navy officer with more than fifteen years across vessel operations, offshore projects and close-quarters marine work. That background aligns directly with pilot workflow, bridge context and the human factors of port maneuvering; it may help the team frame requirements in the language of practicing maritime operators. The company describes Bar German as a software and control engineer with more than five years in oil-and-gas systems development and a background in financial economics. That experience is relevant to integrating software with operational technology and to building a product for industrial buyers, though the public record does not document particular control-system deployments, certifications or maritime hardware programs. Seanovation independently lists Tzukerman as CEO and maritime navigation officer at RemPi and Bar German as CTO. No fuller management roster, engineering headcount, maritime pilot advisory group, safety officer, cybersecurity lead, regulatory specialist or board is publicly identified in the sources reviewed. The combination of operating-maritime and control-software experience is a sensible founding basis for the problem, but a remotely piloted ship system will require multidisciplinary assurance, field support and port-specific regulatory expertise beyond what the visible founder bios establish.

**Competition and positioning.** RemPi competes both with the incumbent human-transfer process and with technology suppliers serving pilotage and remote vessel operations. Traditional pilot boat transfers remain the baseline: they are operationally familiar and supported by established licensing and safety rules, even though they expose pilots to transfer hazards and consume time. Wärtsilä is a meaningful adjacent competitor and benchmark: it offers pilot-management products and has described shore-based remote-pilotage concepts with Finnpilot, including onboard sensor data, shore control, decision support and integration with vessel traffic systems. Kongsberg Maritime supplies navigation, automation and shore-based remote vessel-operation capabilities that could support adjacent workflows. ABB Marine sells vessel-control systems designed for remote and autonomous operations and has described harbor remote-control demonstrations. These players have mature engineering, channels and procurement credibility that a small startup lacks. RemPi’s potential distinction is a rapidly deployable, temporary sensing package delivered without bringing a pilot onboard, paired with an explicit shore-based licensed-pilot workflow. Whether that is a defensible advantage depends on installation time in practice, reliable integration across vessel classes, evidence acceptable to port authorities and insurers, and intellectual property that is broader than a particular kit configuration. The market has seen remote-pilotage concepts before, so novelty of the category itself is not a moat.

**Security, defense and resilience relevance.** RemPi has credible strategic value for maritime infrastructure resilience even without demonstrated defense sales or military specifications. Ports are logistics chokepoints; keeping pilotage capacity available while reducing dependence on repeated pilot-boat transfers could matter during severe weather, staffing shortages, fuel disruption or other operational constraints. The sensing and communications architecture also touches safety-critical operational technology: tamper resistance, authenticated data, protected remote access and predictable behavior during link loss would be important to civilian infrastructure operators and could become more demanding in sensitive or contested settings. A shore-based human expert supported by synchronized vessel data could also be relevant to emergency port operations or hazardous approaches where direct onboard access is difficult, but these are plausible future applications rather than disclosed deployments. I classify dual_use as false because current public evidence centers on commercial port pilotage and does not show that RemPi’s core product is being built, sold or qualified for a defense or security mission. The dual-use adjacency is meaningful but should not be promoted to a proven military capability. The same caution applies to autonomy: the public operating model retains a licensed human pilot in command of the pilotage judgment, and no autonomous navigation authority is claimed. Strategic diligence should focus on whether ports can preserve local human oversight while gaining operational resilience, and whether cyber and degraded-connectivity controls can meet infrastructure requirements.

**Stage, trajectory and diligence risks.** RemPi appears to be an early-stage venture at product-definition or R&D stage based on the limited public record. Its next meaningful milestones would be a disclosed shore-station and vessel-kit demonstration under controlled conditions; a port or pilotage-service partner willing to participate in a trial; regulator and insurer engagement; published latency, positioning, uptime and sensor-failure data; and a safety case covering handover, abort, degraded communications and return-to-conventional operation. The startup’s top risks are safety and liability in confined-water navigation; regulatory variation across ports and jurisdictions; reliance on robust ship-to-shore connectivity; cyber compromise or spoofing of position and bridge data; integration complexity across ship types; and commercialization delays in a conservative, multi-stakeholder market. The company’s advertised accuracy target does not itself establish end-to-end navigational accuracy, and visual feeds can be impaired by spray, darkness, glare, vibration, obstruction and weather. Drone delivery may simplify deployment but introduces its own permissions, weather and vessel-access constraints. The patent-pending statement is not a substitute for a verified patent position, and the company has not publicly identified funding runway or scale-up capital needs. A useful diligence sequence would test a non-operational prototype against independent instrumentation, rehearse loss-of-link and contradictory-sensor cases, and only then progress toward port-authorized trials with explicit human authority and fallback procedures. Until those milestones and named counterparties appear, RemPi is a strategically interesting maritime-safety concept with a relevant founding team, but execution and adoption remain unproven.
