name = "SkyFi"

description = "SkyFi is an Austin-based Earth intelligence platform that lets organizations search, purchase, task, and analyze commercial satellite and other geospatial data through one web, mobile, and API workflow. It targets the access and integration gap between a fragmented remote-sensing supply base and commercial, government, and defense users."

detailed_description = """
SkyFi is a software and data-access layer for Earth observation rather than a satellite operator with its own disclosed constellation. Its platform combines archive search, new-image tasking, ordering, built-in analytics, and delivery through a web application, mobile application, and developer API. Company materials describe access to optical, synthetic-aperture-radar (SAR), hyperspectral, aerial, maritime AIS, and related analytic products from a broad partner network. The practical product is a common procurement and workflow surface: a user can define an area of interest, compare available sources, order an archive scene or future collection, and receive an output without separately learning every provider's portal, pricing model, contract, and delivery format.

The customer problem is credible and specific. Commercial imagery supply is expanding, but finding the right sensor, checking archive coverage, securing tasking, handling licensing, and converting a scene into an operational answer still require specialist knowledge and multiple vendor relationships. SkyFi markets to agriculture, insurance, energy, mining, construction, infrastructure, finance, environmental monitoring, maritime, government, and defense users. Its official materials emphasize transparent or pay-as-you-need pricing, self-service access, API integration, and delivery in less than 24 hours for supported products. A January 2026 company announcement reported more than 50 geospatial imagery partners, custom platforms for Vantor, ICEYE US, and Planet, and a $12.7 million Series A; those are useful traction and distribution signals, but they do not disclose recurring revenue, gross margin, retention, customer concentration, or service-level performance.

The competitive set spans data owners, vertically integrated Earth-intelligence companies, marketplaces, and analytics vendors. Planet, Vantor, ICEYE, BlackSky, Airbus, and Umbra can control differentiated collection capacity or sell directly to strategic accounts, while UP42 and other integration platforms compete for the aggregation and developer workflow. SkyFi's possible advantage is breadth plus usability: one relationship can expose multiple sensors, archive and tasking options, analytics, and delivery destinations. That advantage is structurally fragile because the underlying collection rights, availability, resolution, revisit rates, and licensing authority remain with partners. The company must therefore retain preferred access, provide reliable fulfillment, and add search, analytics, workflow, or distribution value that prevents suppliers and large customers from bypassing it.

The defense and national-security case is substantive but should be evidence-calibrated. Multi-source search, rapid tasking, SAR and optical fusion, change detection, maritime awareness, and API delivery are relevant to unclassified ISR support, battle-damage assessment, border and maritime monitoring, disaster response, logistics planning, and operational planning. SkyFi publicly describes a Sovereign Intelligence Platform, in-country deployment and data-sovereignty goals, an ATAK-oriented tactical workflow, and selection for NATO DIANA's 2026 Challenge Programme. These signals establish strategic adjacency and a credible dual-use direction, not proof of a production defense contract, classified accreditation, mission assurance, or scaled government deployment. Diligence should test government revenue and contract vehicles, data rights and export controls, security architecture, uptime and delivery metrics, partner authorization, analytic accuracy, and whether sovereign or tactical offerings are repeatable products or bespoke implementations.
"""

