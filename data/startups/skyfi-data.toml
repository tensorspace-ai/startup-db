investment_rationale = "SkyFi is a strategically relevant early-stage company at the intersection of expanding commercial Earth-observation supply and demand for easier geospatial intelligence access. The reported Series A, broad partner network, API, custom partner platforms, and public government and defense direction indicate a real commercialization effort. The central diligence questions are repeat enterprise usage, supplier authorization and concentration, take rates after imagery costs, delivery reliability, analytic quality, security controls, and the ability to turn defense interest or NATO participation into repeatable revenue. This is a strategic diligence assessment, not an investment recommendation."

strategic_value = "SkyFi can act as a vendor-neutral gateway across commercial constellations and sensor types, shortening the path from a collection request to a usable geospatial answer. That is relevant to allied and government users seeking resilient access to unclassified Earth intelligence, particularly where sensor diversity, rapid tasking, API delivery, and tactical dissemination matter. Strategic value is moderated by dependence on data owners and by the need to prove sovereign deployment, access controls, export compliance, privacy safeguards, and reliable operations in sensitive workflows."

