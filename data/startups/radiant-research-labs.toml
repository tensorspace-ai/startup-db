investment_rationale = "Radiant merits a positive internal priority signal because it appears to sit close to a strategically consequential Israeli capability base, but the evidence is too opaque for a conventional commercial assessment. (1) Founder-market fit is unusually direct: public reporting identifies leaders with IDF intelligence, Unit 8200, Prime Minister's Office, and NSO backgrounds. (2) The official customer thesis is specific — military, intelligence, and law-enforcement agencies — and independent reporting attributes operationally relevant zero-click capabilities to the company. (3) Israeli incorporation, Tel Aviv presence, and an export-control posture provide a credible sovereign-capability frame. Counterweights are decisive: no public financing, revenue, employee count, named customer, contract value, certification, or independently reproducible technical evidence; heavy regulatory and reputational exposure; and a business model that may depend on a few classified programs. The investible flag is a legacy priority signal for strategic diligence, not an investment recommendation, endorsement of offensive cyber activity, or conclusion about financial returns."
strategic_value = "Radiant's strategic value is concentrated in sovereign access and allied intelligence resilience. (1) A domestic Israeli research organization can reduce dependence on foreign offensive-capability suppliers when geopolitical restrictions, vendor denials, or supply-chain disruptions affect urgent missions. (2) Zero-click and related vulnerability-research capabilities can address adversaries who have hardened user-facing attack surfaces and encrypted their communications, although public evidence does not establish a specific exploit inventory or current success rate. (3) The founders' reported experience links advanced research to operational intelligence requirements, a combination that is difficult to assemble and relevant to counterterrorism, counterintelligence, and battlefield collection. (4) Israeli and European offices could support trusted allied relationships, but export control, end-user verification, human-rights review, and classified-information handling determine whether that optionality becomes durable value. The strategic case is strong; the commercial evidence and governance proof are not."
