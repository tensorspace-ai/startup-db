investment_rationale = "FireDome fits a strategic climate-resilience and physical-security thesis because it addresses a high-consequence problem with an integrated sensing-and-response system and has reported early financing and a company-announced real-world demonstration. The priority signal is tempered by limited public evidence of repeatable commercial deployments, independently measured field outcomes, approvals, recurring revenue, and manufacturing scale. The key diligence question is whether the launcher, capsule supply chain, safety case, and service model can deliver reliable protection at a cost customers will accept; this is a strategic diligence assessment, not an investment recommendation."
