name = "DustPhotonics"
description = "DustPhotonics developed silicon-photonics photonic integrated circuits and optical engines for 400G, 800G, and 1.6T data-center and AI networking. Credo Technology completed its acquisition of DustPhotonics on 2026-05-28, so this record now describes an acquired photonics asset and technology platform rather than an independent startup."
detailed_description = """DustPhotonics built silicon-photonics photonic integrated circuits (PICs) and optical engines for high-bandwidth optical transceivers. Its product portfolio included Carmel 400G and 800G devices, Oz4 800G DR4 and Oz8 1.6T DR8 transmit photonics ICs, and Tamar/Tamar200 2xFR4 products. The central technical proposition was Low Loss Laser Coupling (L3C), an approach for attaching commercially available lasers to silicon while combining active devices such as modulators and detectors with passive waveguides, splitters, combiners, and wavelength-division-multiplexing structures. That architecture is intended to improve optical margin, reduce laser count and drive current, and use a supply chain compatible with volume silicon-photonics manufacturing; the company’s own product material supports the capabilities, but does not by itself establish production volumes or long-term yield performance.

The commercial market is optical connectivity for cloud, hyperscale, high-performance-computing, and AI infrastructure. As switch and accelerator bandwidth rises, copper and electrical board traces face reach, power, and thermal constraints, increasing the value of pluggable optics and newer near-package or co-packaged architectures. DustPhotonics positioned its PICs for retimed, linear pluggable optics (LPO), linear receive optics (LRO), air-cooled, liquid-cooled, and immersion-cooled transceivers. Public product pages and company announcements show a broad roadmap and sampling/qualification activity, including products spanning 400G to 1.6T; they do not provide enough independently verifiable information to quantify customer concentration, recurring revenue, production share, or the number of completed hyperscale deployments.

The competitive problem is difficult because performance depends on the complete optical path, not only on the PIC: laser coupling, modulators, detectors, packaging, fiber attach, DSP/SerDes interoperability, thermal management, testing, and manufacturing yield all matter. DustPhotonics competed with vertically integrated silicon-photonics and optical-component suppliers including Intel, Marvell/Inphi, Broadcom, Coherent, and Cisco/Luxtera, as well as newer optical-interconnect approaches such as Ayar Labs and Ranovus. Its potential edge was a productized, merchant PIC portfolio and a laser-integration method designed to balance performance, power, cost, and manufacturability. That edge still required proof through qualification, field reliability, supply continuity, and customer adoption. The acquisition by Credo is a strong strategic validation of the technology’s relevance: Credo’s official announcement said the transaction brought SiPho PIC technology in-house and expanded its stack across SerDes, DSP, silicon photonics, and system integration. It is not proof that every product or forecast will succeed.

Credo completed the acquisition for upfront consideration of $750 million in cash and approximately 0.92 million Credo shares, with additional contingent shares tied to milestones, according to Credo’s SEC filing and completion announcement. DustPhotonics is therefore best classified as an acquired asset. The strategic value is integration: Credo can combine optical engines with its connectivity silicon and sell a more complete platform into AI and cloud networks. The main diligence questions are whether the team and process technology remain intact, whether Credo converts the portfolio into meaningful revenue, how quickly products move through customer qualification, and whether the economics justify the acquisition.

The dual-use case is credible but indirect. Silicon-photonic links can support high-bandwidth, low-EMI communications inside compute, sensing, and communications systems, including aerospace or defense electronics where size, power, thermal load, and electromagnetic compatibility matter. However, public materials reviewed here describe commercial AI and data-center applications, not defense contracts, classified programs, or deployed military systems. The record should therefore treat defense relevance as a potential component and supply-chain adjacency rather than a demonstrated defense franchise."""
