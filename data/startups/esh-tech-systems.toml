name = "Esh-Tech Systems"
description = "Esh-Tech is an Israeli deep-tech company building DroneLight, a pulsed-laser 'hard-kill' counter-drone weapon that claims to neutralize UAVs in one to two seconds at roughly a quarter of the power and cost of conventional continuous-wave laser systems."
detailed_description = """**Product and the problem it solves.** Esh-Tech Systems develops DroneLight, a vehicle-mountable directed-energy weapon designed to defeat small unmanned aerial vehicles (UAVs), loitering munitions, and drone swarms at ranges up to one kilometer with 360-degree coverage. The company is attacking one of the defining operational problems of the post-2022 battlefield: cheap first-person-view (FPV) and commercial-derivative drones have inverted the cost curve of air defense, forcing defenders to expend interceptor missiles that cost thousands or millions of dollars against attackers that cost tens or hundreds. Kinetic interceptors run out of magazine depth quickly and are economically unsustainable against saturation attacks; existing high-energy laser systems, while offering a near-zero cost-per-shot, have historically been large, power-hungry (tens of kilowatts), and tethered to substantial platforms. DroneLight is positioned as a smaller, mobile, single-operator alternative that can ride on a tactical vehicle's electrical system and protect maneuvering forces and critical infrastructure alike. Esh-Tech frames the system around the idea that "when seconds matter" a defender needs a deep, low-marginal-cost magazine — the company advertises an engagement cadence of up to roughly 30 neutralizations per minute.

**Core technology and how it works.** DroneLight's central technical bet is pulsed rather than continuous-wave (CW) lasing. Instead of holding a sustained beam on a target until heat accumulates and burns through — the mechanism used by systems such as Rafael's Iron Beam / LiteBeam family — DroneLight fires short, high-energy pulses (the company and press cite roughly five pulses per second, a ~5 Hz cadence) that ablate material, effectively "drilling" multiple holes through the airframe the way bullets would, but with light. CEO Erez Riahi has described the effect as shooting holes in the target with light rather than melting it. A second differentiator is atmospheric-window optimization: the system reportedly samples atmospheric transmission conditions in ~0.01-second intervals and releases each pulse during the millisecond windows when propagation is cleanest, which Esh-Tech claims can improve effective range by 50-100% in degraded conditions. The company reports power draw of approximately 4 kilowatts — versus roughly 10-20+ kW cited for conventional CW systems — enabling vehicle-native power and mobility. DroneLight pairs the pulsed laser with an ultra-high-speed camera and eye-safe rangefinding for targeting, and Esh-Tech markets it as "urban-safe" owing to the millisecond firing duration. These are vendor and press figures; the underlying beam-director, wavelength, and beam-quality details are not publicly disclosed, and the performance claims have not been independently validated at operational scale.

**Market, customers, and go-to-market.** Counter-UAS (C-UAS) is one of the fastest-growing segments of the global defense market, pulled forward by Ukraine, the Red Sea / Houthi drone campaigns, Israel's multi-front war, and a broad NATO push toward "affordable mass" air defense. Esh-Tech is targeting U.S. and European defense customers plus critical-infrastructure operators, positioning DroneLight as a mobile layer that complements, rather than replaces, radar-cued gun systems, RF/electronic-warfare defeat, and higher-power strategic lasers. The company unveiled DroneLight publicly at Eurosatory 2026 in June 2026 after a deliberate stealth period, and reports orders already received from multiple customers worldwide, a first operational system expected around September-October 2026, and a production ambition of dozens of systems initially scaling toward "hundreds of systems a year" from 2027. Go-to-market leans on Israel's defense-export channels and the credibility that comes from domestic MAFAT (Directorate of Defense Research and Development) engagement.

**Traction, funding, and third-party validation.** In June 2026 Esh-Tech announced an $18 million funding round led by Kinetica Ventures, with participation from Mahari, Renaton Capital, Q-Fund, 2i Ventures, Hinkley, and FFG, alongside angel investors and the Israel Innovation Authority through its Seed Fund. Earlier in its development the company received three grants from the Israel Innovation Authority and was reported as selected under Israel's "MAFAT for Startups" breakthrough track (press cited support of up to NIS 10 million). Independent validation to date is limited but non-trivial: press reports describe successful destruction of roughly 20 drones in undisclosed Israeli testing, completed operational field trials, and ongoing evaluation in several countries. The named stated use of proceeds — building a manufacturing line in Israel, expanding the workforce, and scaling global sales and delivery — is consistent with a company transitioning from prototype to low-rate production rather than one with a fielded, at-scale track record.

**Founders and team.** Esh-Tech was founded and is led by CEO Erez Riahi, who brings nearly two decades in Israel's defense and electro-optics industries; press accounts cite prior senior roles including head of marketing at Israel Aerospace Industries' TAMAM division and positions at Elbit Systems, ITL, and ESC BAZ. Riahi has said he left an established defense-industry career because he believed no one was properly solving the mobile, affordable counter-drone problem. The company is headquartered in Omer, in Israel's Negev, with an additional office in Modiin, and employs on the order of twenty to several dozen people. Founding-date reporting is inconsistent: several outlets state 2023, while others describe roughly six years of prior low-profile development — a discrepancy that likely reflects a long stealth phase before the 2026 public unveiling.

**Competitive dynamics.** DroneLight enters a crowded and well-capitalized field. Key reference points include: (1) Rafael Advanced Defense Systems (Iron Beam and the vehicle-mounted LiteBeam, high-power CW lasers backed by a national prime); (2) Elbit Systems (directed-energy and layered C-UAS portfolios); (3) OptiDefense and Civan Advanced Technologies (Israeli laser and coherent-beam-combining players); (4) RF/electronic-attack defeat vendors such as D-Fend Solutions and Sentrycs (non-kinetic, complementary rather than hard-kill); and (5) major U.S./European directed-energy programs from primes like Lockheed Martin and Raytheon. Esh-Tech's claimed edge is architectural: pulsed lasing plus atmospheric-window timing to achieve hard-kill lethality at ~4 kW, yielding a smaller, cheaper, more mobile system — the company claims acquisition costs up to ~75% lower and total system cost three-to-four times below conventional laser or high-power-microwave options. Whether that architecture holds its advantage against primes with far deeper capital, integration, and sustainment ecosystems is the central competitive question.

**Defense, security, and resilience dual-use relevance.** DroneLight is primarily a defense product, but its relevance spans the civil-military boundary that defines strategic resilience. The same mobile hard-kill capability that protects a maneuvering brigade also defends fixed critical infrastructure — power substations, water and energy facilities, airports, border compounds, and public events — against the proliferating drone threat, and Esh-Tech explicitly markets to critical-infrastructure operators. As Western governments scramble for cost-effective ways to protect homeland infrastructure and forward-deployed forces from cheap aerial threats, an affordable, deep-magazine laser sits squarely on the resilience thesis. The dual-use character is genuine but asymmetric: the fielded use case is security/defense, with commercial infrastructure protection as an adjacent civilian channel rather than a separate business.

**Growth stage, trajectory, and key diligence risks.** Esh-Tech is an early-stage, single-product company that has just come out of stealth with meaningful institutional and government backing but limited independently verified operational performance. The diligence agenda is clear: (1) validate the pulsed-laser lethality and range claims under adversarial, all-weather conditions independent of vendor testing; (2) confirm the durability and beam-quality of a ~4 kW pulsed architecture against fast, evasive FPV swarms; (3) assess execution risk in standing up a manufacturing line and hitting 2027 volume ambitions with a small team; (4) weigh export-control and end-user constraints inherent to an Israeli directed-energy weapon; and (5) evaluate competitive durability against national primes. If the technology validates, Esh-Tech offers exposure to one of the highest-priority capability gaps in modern air defense; the record here is calibrated to reflect that the promise is strong and specific, but the fielded proof is still ahead of the company."""
