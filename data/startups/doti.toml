investment_rationale = "Doti operates at a high-leverage point in the enterprise security stack: browser-mediated compromise bypasses traditional endpoint and network defenses, yet organizations cannot practically eliminate cloud SaaS usage. The seed-stage timing allows early positioning in a consolidating market (browser-isolation vendors are raising large rounds; incumbent platforms are adding browser controls). Strategic fit is strong for dual-use thesis because the core technology (session-level policy and audit) is operationally essential for both commercial enterprises and defense-adjacent compliance requirements. Key investment contingencies are: (1) demonstration of enterprise customer traction beyond proof-of-concept, (2) credible product differentiation relative to browser isolation and endpoint detection, (3) clarification of go-to-market strategy (whether pursuing direct enterprise sales or channel partnerships), and (4) evidence that the team has prior experience shipping security products and scaling enterprise sales."
strategic_value = "Session-level browser controls directly improve resilience of web-native operations in defense and high-security commercial contexts. Unlike device-level or network-level controls, session-layer enforcement can prevent token theft and data exfiltration without requiring employees to abandon modern collaboration tools or sacrifice productivity. Strategic value for the broader dual-use ecosystem: if successful, Doti provides a technology bridge that allows defense contractors and government agencies to operate on cloud platforms (cost, agility, talent access) while maintaining security posture compliant with CMMC, NIST SP 800-171, and other regulatory frameworks. This unblocks cloud adoption in segments that currently default to on-premises or air-gapped solutions."
