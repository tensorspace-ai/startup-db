name = "Coppter Water Technologies"
description = "Coppter Water Technologies Ltd. is an Israeli water-treatment startup developing electrochemical monovalent-copper disinfection for pools, wastewater, mikvehs, and protected agriculture. Its public website reports 12 private-pool installations operating since 2024 and a year-long wastewater installation at Kibbutz Lahav in 2024; a listed-company filing confirms staged investment through 2025, while recurring commercial revenue and broad regulatory approvals remain undisclosed."
detailed_description = """
**Product and the concrete problem it solves.** Coppter is addressing a very specific weakness in water infrastructure: chlorine is effective and familiar, but its storage, handling, odor, irritation, disinfection by-products, and ongoing chemical logistics impose costs on pool operators and wastewater plants. The company's first product is a water-disinfection system based on monovalent copper ions, Cu+, which are generated and circulated in the treatment process rather than delivered as a conventional chlorine dose. Coppter's target applications are deliberately broader than swimming pools. Its public materials describe pool and jacuzzi treatment, tertiary wastewater disinfection, water reservoirs, hydroponic and aeroponic agriculture, and longer-term drinking-water and industrial-water use. That matters for the Israeli strategic thesis because water reuse and decentralized treatment are resilience problems, not only environmental ones: a remote community, farm, emergency facility, or industrial site benefits from a disinfection process that can reduce hazardous-chemical dependency and operating complexity. The company is not yet a replacement for a certified municipal treatment train. Its current evidence is a set of pilots and installations, so the credible near-term product is a modular treatment subsystem that must prove microbial performance, residual-copper control, maintenance economics, and regulatory acceptance in each application.

**Core technology and how it actually works.** The technical premise is not simply that copper is antimicrobial; copper-based pool products already exist. Coppter's claimed differentiation is the controlled generation of active monovalent copper at low concentration. The company describes an electrochemical cell that starts with divalent copper ions at a low concentration and converts them into Cu+ ions that have stronger antimicrobial activity, with the active ion continuously regenerated in the system. In practical terms, water passes through a treatment loop where electrical control and copper-containing electrodes create the antimicrobial species, after which the treated water returns to the pool, wastewater stream, or agricultural system. The public description says the system was tested against 15 types of bacteria and six types of fungi, and that 0.2 ppm Cu+ destroyed those microorganisms in laboratory testing. Those are company-reported results, not an independent certification or a substitute for application-specific pathogen validation. Coppter also reports that the system avoids chlorine gas clouds and chlorine-associated disinfection by-products, and that its low chemical consumption can reduce energy and maintenance costs relative to ultraviolet or ozone systems. The engineering diligence question is whether the desired Cu+ state remains controlled in real water chemistry, where pH, organic load, hardness, temperature, electrode wear, and flow rate vary. A buyer will also need measurement, dosing, alarm, and fail-safe functions that prevent over-treatment or copper accumulation. The company has disclosed a patent family covering a system and methods for generating and using monovalent copper, including PCT filings and a granted U.S. patent, but the enforceable scope and freedom to operate still require specialist review.

**Market, customers, and go-to-market.** Coppter has chosen an understandable beachhead. Residential and commercial pools are easier to pilot than municipal drinking water because the buyer can see and feel the chlorine-related pain, the water volume is bounded, and an equipment retrofit can be tested without rebuilding an entire utility. The official website says 12 private pools ranging from 20 to 250 cubic meters have operated with the technology since 2024. The company's second beachhead is more strategically important: tertiary wastewater treatment, where disinfection is required before high-quality effluent can be reused for agriculture or other approved purposes. A system installed at Kibbutz Lahav reportedly operated for about a year in 2024 with funding from Israel's Ministry of Energy and Infrastructure. Coppter's public market pages also identify hydroponic and aeroponic growers as potential users, with the company reporting a roughly 20% yield increase in controlled crop experiments involving lettuce, parsley, and celery. The commercial route appears to be equipment-plus-integration, with local beta sites and channel or strategic partners rather than a pure software subscription. InNegev lists Coppter as a Seed-stage company seeking strategic partners, funding, and beta sites. That model can work if installation is standardized, but water plants buy on reliability, service availability, validated total cost, and regulatory risk. The company therefore needs reference installations, repeatable commissioning, distributor capability, and clear separation between proven pool use and still prospective drinking-water or industrial deployments.

**Traction, funding, and third-party validation.** Coppter has more tangible external validation than its small size might suggest, but the evidence is still early. The Israel Innovation Authority lists Coppter Water Technologies Ltd as an Israeli cleantech company established in 2022, with eight employees, an R&D stage, and a copper-based device intended for pools, jacuzzies, and water and wastewater treatment. The Authority and its associated program records connect the company to the Periphery Entrepreneurship Incubators program. DeserTech's marketplace describes the product stage as MVP to pilot and identifies Rahat as the location. InNegev reports a $1.2 million funding figure and a team including Yuval Kupitz as CEO and Dr. Magal Saphier as founder and CTO. Earlier independent reporting in Israel21c described more than $500,000 raised and five employees, showing that capital and staffing figures have changed over time but are not perfectly synchronized across sources. In June 2024, Israeli financial reporting described a binding memorandum under which public company Pharmocann would invest up to NIS 7.4 million for up to 40% of Coppter in stages tied to development and sales milestones; the final status and full closing terms are not sufficiently clear in the public sources reviewed, so this record does not treat the amount as completed funding. Validation is strongest where a third party funded or hosted a test: the Ministry of Energy and Infrastructure-supported wastewater pilot and Innovation Authority-backed testing are meaningful signals. They are not equivalent to a broad commercial rollout, a published peer-reviewed trial, or a drinking-water approval.

**Founders and team background.** The technical nucleus is associated with Dr. Magal Saphier and Dr. Oshra Saphier, researchers at the Sami Shamoon College of Engineering whose work on copper chemistry is described as the basis for the company. Public sources identify Magal Saphier as founder and CTO, Oshra Saphier as a founder and consultant, and Yuval Kupitz as CEO in the company's earlier public materials and ecosystem profiles. Coppter's current website lists Dror Green as CEO and displays a broader small team including chemical and mechanical engineering roles, so the management record has changed or is reported inconsistently. That inconsistency is itself a diligence item, not a reason to guess. The founders' advantage is unusually relevant domain depth: a water-treatment product has to manage chemistry, equipment, biology, field maintenance, and regulation simultaneously, and the Saphier research background provides a credible foundation for the electrochemical mechanism. The company's association with SCE, InNegev, DeserTech, and Israeli government innovation programs also supplies a local commercialization network outside the traditional Tel Aviv software circuit. On the other hand, there is no public evidence of a large-scale water-utility sales team, international service organization, or executive who has taken a regulated treatment hardware platform through mass procurement. The company lists open engineering and business-development roles, which suggests a team still being assembled. The key team diligence questions are who currently owns technical, regulatory, and commercial decisions; whether the founders remain full-time; and whether the company can add utility-sales and quality-assurance expertise without losing control of the chemistry.

**Competitive dynamics and defensibility.** Coppter competes first with incumbent chlorine dosing, which remains cheap, well understood, widely regulated, and supported by a mature supply chain. In pools, it also faces salt-chlorination systems, ozone, ultraviolet treatment, copper-silver ionization, and vendors that combine multiple methods. In wastewater, ultraviolet, ozone, peracetic acid, chlorine dioxide, and conventional chlorination all have installed bases and engineering standards. The strongest competitive edge Coppter can claim today is not a proven cost or performance monopoly; it is a system-level proposition that combines continuous antimicrobial activity with reduced hazardous-chemical handling and potentially lower energy use. Its claimed Cu+ generation method, rather than passive copper release alone, could give it better control over activity and allow the same core equipment to serve several water segments. The patent family is a potential moat, and the ability to accumulate field data from pools, wastewater, and protected agriculture could create application know-how that is harder to copy than a generic copper electrode. The counterargument is serious. If competitors can achieve equivalent microbial control with familiar chlorine, UV, or ozone at a lower validated total cost, buyers will not switch because the chemistry is novel. If regulators require a residual disinfectant or a second barrier, Coppter may become an add-on rather than a replacement. The company also has to show that copper does not accumulate to unsafe or aesthetically unacceptable levels, damage equipment, or create a new environmental burden. Defensibility will be determined by independently reproduced results, approvals, service reliability, and a protected electrode-and-control architecture, not by the word patented alone.

**Defense, security, and resilience dual-use relevance.** Coppter's dual-use relevance is credible but belongs primarily in the water-resilience layer rather than in weapons or battlefield systems. Water treatment is a strategic dependency for military bases, hospitals, food production, industrial sites, and communities operating during emergencies. A modular disinfection unit that reduces reliance on chlorine cylinders, hazardous chemical transport, and centralized treatment infrastructure could support temporary facilities, remote bases, disaster-response camps, and agricultural sites where water reuse has to continue despite disrupted logistics. The company's stated ability to operate in pools, wastewater, and hydroponic systems gives it a plausible civilian-to-security transfer path: the commercial product can be sold into controlled water loops, while a ruggedized variant could be evaluated for mobile or semi-permanent installations. Israel's own water-reuse expertise and the company's Negev ecosystem location strengthen that strategic fit. The evidence must still be calibrated. Coppter does not publicly disclose a defense customer, military contract, emergency deployment, drinking-water approval, or operation under contested conditions. It also has not published data on generator integration, battery operation, cyber-secure remote monitoring, operation with contaminated source water, or long-duration storage of treated water. Dual-use should therefore mean resilience optionality, not fielded defense capability. The most relevant future proof points would be an independently evaluated remote-water pilot, a government or defense-utility trial, and verified performance under variable power, temperature, turbidity, and maintenance conditions.

**Growth stage, trajectory, and key diligence risks.** Coppter is early: an R&D-stage Israeli startup founded in 2022, with a small team, MVP-to-pilot status, reported seed capital, and a handful of operating or completed demonstrations. Its trajectory is promising because it has crossed several hard early gates: a patent position, a government-supported wastewater pilot, live private-pool installations, ecosystem backing, and a technical team with a long research history in the active chemistry. It is not yet mid-stage because the public record does not establish recurring revenue, repeat utility purchases, a standardized product line, regulatory approvals across target markets, or independent long-duration performance data. The main diligence risks are: (1) **regulatory risk**, because replacing chlorine in recreational, agricultural, and wastewater applications requires different approvals and operating limits; (2) **chemistry and safety risk**, especially residual copper, corrosion, aquatic toxicity, and pathogen coverage in real water; (3) **scale-up risk**, because a successful 20-to-250-cubic-meter pool system does not automatically prove economics at a municipal or industrial flow rate; (4) **commercial risk**, because incumbent treatment suppliers already own procurement relationships and maintenance contracts; (5) **capital risk**, because field hardware, testing, certification, and service consume more cash than a software pilot; (6) **management-disclosure risk**, because public sources disagree on the current CEO, founding year, headcount, and the completion status of the proposed Pharmocann transaction; and (7) **dual-use execution risk**, because the resilience case remains prospective. The next milestones to monitor are independently reported microbial and copper-residual results, regulatory clearance for a defined product category, multiple paid wastewater or agricultural deployments, repeatable installation economics, and a clearly documented current ownership and management structure.
"""
