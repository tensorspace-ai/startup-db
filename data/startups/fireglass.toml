name = "Fireglass"
description = "Fireglass was an Israeli-founded cybersecurity company that commercialized agentless remote browser and threat isolation, separating risky web content from users and corporate networks. Symantec acquired Fireglass Ltd. in July 2017, so this record is a historical strategic reference rather than an independent company currently available for direct diligence."
detailed_description = """Fireglass developed an agentless threat-isolation platform that treated web content as untrusted and executed browsing activity away from the endpoint or corporate network. Its architecture used remote rendering, isolated execution environments, and a controlled presentation layer so users could interact with sites without directly receiving the site's active code. The approach was intended to reduce exposure to ransomware, malware, phishing, exploit kits, malicious documents, and unknown browser-based attacks. Fireglass also described protection for web applications, indicating an ambition broader than a conventional secure web gateway: isolate both the user-facing browsing session and selected application attack surfaces.

The company's 2016 launch materials describe production deployments at Fortune 500 organizations and interest from financial-services and healthcare providers, alongside support for major browsers, operating systems, and device types. A contemporaneous Series A announcement reported $20 million led by Norwest Venture Partners and Lightspeed Venture Partners, with Singtel Innov8 and cybersecurity entrepreneurs participating. Public materials place the commercial headquarters in New York City and research and development in Israel. These are historical traction signals rather than evidence of current revenue, staffing, customers, or product availability; the company no longer publishes an independent operating profile.

Fireglass entered a market that included secure web gateways, malware sandboxes, virtual desktop infrastructure, and emerging browser-isolation specialists. Its differentiating thesis was architectural: assume that web content can be hostile and make successful endpoint compromise materially harder through separation, instead of relying only on signatures or classification to identify every bad object. That thesis remains commercially relevant, but the category is now contested by Menlo Security, Authentic8, Cloudflare, Zscaler, Palo Alto Networks, and enterprise-browser vendors such as Island and Talon. The original product's standalone differentiation, pricing, deployment footprint, and post-acquisition roadmap are not publicly transparent.

Symantec completed its acquisition of Israel-based Fireglass Ltd. in July 2017 and stated that Fireglass's agentless isolation capabilities would strengthen its integrated cyber-defense, secure web gateway, and email-protection strategy. The transaction is the clearest commercialization signal and makes Fireglass useful as a case study in strategic exit and category validation. It also limits present-day diligence: ownership, intellectual property disposition, customer retention, product lineage, and the extent to which capabilities survived later Symantec and Broadcom portfolio changes require primary-source confirmation.

The dual-use case is credible but defensive rather than offensive. The same isolation controls can protect commercial, public-sector, critical-infrastructure, and defense-contractor users from web-delivered compromise, phishing, and supply-chain exposure. They are particularly relevant where users must access untrusted internet content while maintaining separation from sensitive networks. That relevance should not be overstated into evidence of classified deployments, government contracts, or military-specific productization; the public record establishes security applicability and military-intelligence experience in the founding narrative, not a verified defense customer base."""
