name = "Materialspace"
description = "Israeli-founded vertical AI SaaS for cabinet and countertop suppliers that automates construction-plan takeoffs, catalog pricing, design layouts, and order preparation."
detailed_description = """Materialspace sells a vertical AI workflow platform to cabinet, countertop, and other interior-space suppliers bidding on multifamily, commercial, and production-builder projects. Its official site presents three connected functions: read plans to detect unit types, produce cabinet lists, and measure countertops; normalize supplier catalogs and create pricing scenarios in customer formats; and turn blueprints into layouts, design options, and shop drawings. The site also describes tracking pricing changes from takeoff through installation. The Solutions Engineer role says customer catalogs may contain 10,000 to 100,000 rows and describes mapping catalog data and customer rules into AI-assisted 3D design. This is a specific data-integration and workflow product, not a general-purpose chatbot. The company says it combines estimating, pricing, design, and ordering while fitting into existing processes through high-touch onboarding. SaaS terms set subscription plans and scope through an order form. The company site and LinkedIn list Tel Aviv and New York locations; its customer focus and current commercial references are largely North American. (src_site, src_company, src_job, src_terms, src_linkedin)"""
