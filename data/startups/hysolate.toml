name = "Hysolate"
description = "Hysolate developed endpoint-based web and workspace isolation that separated risky browsing, applications, and data from protected enterprise activity on the same device. Perception Point acquired the company in March 2022 and incorporated its technology into a broader content- and browser-security offering."
detailed_description = """Hysolate was an Israeli cybersecurity startup founded in 2016 by Team8, Dan Dinnar, and Tal Zamir. Its product created locally isolated workspaces on an endpoint, allowing a user to access untrusted websites, downloads, SaaS applications, or other higher-risk content without placing the primary enterprise environment and its data in the same trust boundary. The value proposition was practical rather than purely theoretical: preserve a familiar native-device workflow while reducing the blast radius of browser exploits, malicious files, credential theft, and accidental data movement. Public descriptions characterize the platform as an isolated virtual environment that could be deployed and managed from the cloud, rather than as a conventional remote desktop service.

The technical approach sat between browser isolation, endpoint virtualization, and workspace segmentation. Hysolate emphasized a local isolated environment and the ability to split a device into separate workspaces, which could reduce latency and user friction compared with routing all browsing through a remote browser or virtual desktop. That architecture was attractive for organizations that wanted stronger separation for risky activity while retaining access to existing endpoint tools and workflows. The important diligence question is the strength of the actual isolation boundary, including hypervisor and hardware dependencies, clipboard and file-transfer controls, administrative escape paths, update mechanisms, and behavior under a compromised host or guest. Public marketing supports the product concept, but does not by itself establish a particular assurance level or certification.

The initial market was enterprise security, with a notable orientation toward regulated and security-sensitive organizations. Hysolate raised venture financing, including an $18 million Series B reported in 2018, and later financing was reported before the company was acquired. Public profiles describe backing from Bessemer Venture Partners, Innovation Endeavors, Team8, and Planven Capital. These are commercialization and investor-validation signals, but they are not sufficient evidence of durable revenue scale, retention, or government deployment. Public reporting around the acquisition also indicates that roughly 25 technical employees joined Perception Point, while the independent company had reduced some sales and marketing activity before the deal; this makes the old 50+ employee metadata unsuitable as a current company measure.

Perception Point announced its acquisition of Hysolate on March 30, 2022, explaining that Hysolate would extend its prevention-as-a-service portfolio from email and cloud collaboration channels into web security. Perception Point subsequently described browser security powered by Hysolate technology. Hysolate therefore should not be treated as an independent Series B startup available for new direct diligence. The relevant strategic signal is an acquihire and technology-integration outcome: a content-security vendor considered endpoint isolation valuable enough to add to its platform, while the public record does not establish the purchase price or the long-term standalone product trajectory.

The defense and national-security relevance is credible at the capability level, but should be stated cautiously. Endpoint compartmentalization can help separate untrusted internet activity, contractor workflows, sensitive applications, and different organizational trust zones on a common device. That is relevant to defense contractors, government users, and other high-assurance environments. However, no source reviewed here verifies Hysolate deployment in a classified environment, a specific government contract, or compliance with a named classification regime. Its strategic importance is therefore best understood as enabling technology for endpoint and browser security, with potential government and defense applicability rather than proven defense adoption."""
