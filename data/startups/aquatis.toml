name = "Aquatis"
description = "Aquatis is an Israeli startup that combines wireless vibration and temperature sensing with machine-learning and expert diagnostics to provide predictive and prescriptive maintenance for pumps, blowers, and other rotating equipment in water and industrial operations."
detailed_description = """Aquatis sells an operations technology for detecting developing faults in rotating equipment before they become service interruptions. Its public materials describe compact wireless sensors attached to pumps, motors, blowers, mixers, decanters, and related machinery; the sensors capture vibration and temperature data, which is analyzed in cloud software and converted into prioritized alerts and recommended actions. The differentiation is therefore less about a novel sensor modality than about joining condition monitoring, fault diagnosis, and maintenance prescription in a workflow that field crews can use. Aquatis and its partners describe detection of issues such as imbalance, misalignment, bearing wear, looseness, cavitation, lubrication degradation, belt-drive problems, gear faults, and electrical or variable-frequency-drive anomalies. The company also claims a day-one operating model that does not require a long customer-specific historical baseline, although that claim and the reported false-positive performance require customer-level validation.

The initial market is unusually consequential and technically coherent. Water utilities, desalination plants, wastewater treatment facilities, and industrial water users operate large fleets of pumps and other energy-intensive assets, often with limited maintenance staff and high costs for emergency repair or downtime. Failure of one pump may affect treatment continuity, distribution capacity, environmental compliance, or a city’s water availability. A sensor-plus-software deployment can be easier to trial than a major control-system replacement, while the economic case can combine avoided emergency work, better maintenance scheduling, lower energy waste, and longer equipment life. Public ecosystem material places Aquatis across Israel’s national water infrastructure and reports deployments in water, pharmaceutical, and renewable-energy settings; these statements are useful traction signals but are not equivalent to audited revenue, referenceable customer contracts, or independently measured savings.

Commercially, the company appears to be moving from an Israeli anchor environment toward partner-led international distribution. Aquatis’s public channels identify a strategic relationship with Mekorot and describe work with water utilities and industrial operators. HydroPro Solutions markets Aquatis to U.S. water and wastewater utilities, explaining a deployment based on wireless sensors, secure cloud analytics, prioritized alerts, and fault-specific guidance. This channel may reduce the burden of building a direct field organization, but it also creates dependence on partner execution, installation quality, and the ability to convert pilots into repeatable utility sales. Public sources do not establish funding size, recurring revenue, gross margin, customer concentration, certification status, or the number of active paying sites.

The competitive set spans industrial machine-health platforms, vibration-analysis specialists, utility asset-management suites, and internal reliability teams. Aquatis’s plausible edge is its narrow domain focus, practical installation model, and prescriptive output for water-plant personnel rather than a generic industrial dashboard. Its strategic relevance is strongest in civil resilience: water production, treatment, and distribution are critical infrastructure, and early warning on mechanical degradation can improve continuity during emergencies or constrained staffing. That is a credible dual-use adjacency, not evidence of military deployment. Diligence should focus on sensor durability and cybersecurity, diagnostic accuracy across machine types, integration with CMMS and SCADA workflows, quantified customer ROI, referenceable deployments outside the anchor account, and whether a small team can support international implementation at utility-grade service levels."""
