name = "Ayyeka"
description = "Ayyeka provides rugged edge devices and field-data software for monitoring remote water, wastewater, energy, environmental, and other infrastructure assets. Its Wavelet devices connect heterogeneous sensors to the Field Asset Intelligence platform and downstream SCADA, GIS, analytics, or IoT systems."
detailed_description = """
Ayyeka is an Israeli industrial IoT company focused on the difficult last mile between physical infrastructure and the systems used to operate it. Its Wavelet devices are ruggedized, battery-powered data loggers that collect readings from existing sensors at remote or harsh sites, perform selected processing at the edge, and transmit the resulting data over cellular or other available connectivity. The company pairs that hardware with its Field Asset Intelligence (FAI) platform, which manages devices and data through cloud, on-premises, or direct MQTT configurations. The product is explicitly designed to be sensor-agnostic and interoperable, including REST and CSV interfaces and SCADA-oriented protocols such as OPC-UA and DNP3. That architecture is valuable where operators cannot replace legacy instrumentation or depend on reliable site connectivity.

The commercial problem is concrete: water and utility operators need visibility into dispersed pumps, reservoirs, pipelines, drainage channels, sewer networks, district-energy assets, and environmental monitoring points, but sending personnel to inspect every site is expensive and slow. Ayyeka’s official materials describe IP68 field hardware, long battery life, local analytics, remote device management, two-way authentication, and integrations into existing operational systems. Its current product family includes the general-purpose Wavelet V2, the lower-cost V4R for broader deployment, and the V2 EX model for hazardous environments with ATEX and IECEx positioning. FAI+ tools add capabilities such as data-quality assistance, visual field context through WaveCam, and fleet-management workflows. These are useful differentiators only if they reduce installation, maintenance, connectivity, and integration costs relative to incumbent telemetry or a customer-built stack.

The initial buyer context is infrastructure-heavy and procurement-intensive. Ayyeka markets solutions for water, stormwater, wastewater, district energy, mining, and environmental applications, where a missed alarm can create flooding, service disruption, regulatory exposure, equipment damage, or public-health consequences. Its public case material describes monitoring deployments involving water levels, flow, turbidity, and erosion, while reporting on Holon describes Wavelets being installed at strategic locations to monitor water levels and flow rates and alert engineers to emerging flooding problems. The company’s homepage also displays customer or partner logos, but those logos should not be treated as independently verified contracts or as evidence of current revenue. Public evidence indicates real product deployment and a broad solution surface; it does not establish deployment scale, retention, gross margins, or the share of revenue that is recurring software.

Competitive pressure comes from several directions. Metering and water-network specialists such as Badger Meter and Sensus can offer connected infrastructure solutions; Xylem and KETOS compete in water intelligence and monitoring; Trimble and Bentley Systems provide broader asset, geospatial, and infrastructure software; and utilities may use SCADA vendors, cellular RTUs, system integrators, or internal engineering teams as substitutes. Ayyeka’s most credible edge is not a unique sensor or a general-purpose dashboard. It is the combination of rugged, low-power, sensor-agnostic field hardware, multiple deployment models, and software intended to make heterogeneous remote assets usable without replacing the installed base. That can support a focused niche, but it also creates hardware, support, certification, and integration burdens that a pure software competitor avoids.

The dual-use case is credible but bounded. The same telemetry, edge-processing, cybersecurity, and remote-asset-management capabilities can improve resilience for municipal water, energy, environmental, and other critical infrastructure during severe weather, equipment failure, or disruption. An intrinsically safe device and operation in low-connectivity or remote environments may also be relevant to industrial security, emergency management, and defense-adjacent logistics. However, Ayyeka’s public positioning is commercial infrastructure monitoring, and its own documentation states that the solution is intended for passive monitoring rather than control of critical assets and processes. There is no verified public evidence here of defense procurement, military deployment, or a defense-specific product line. Strategic relevance should therefore be assessed as infrastructure resilience and situational-awareness adjacency, not as direct defense capability.

For diligence, the important questions are deployment repeatability, revenue quality, and security assurance. Review the number and size of active sites, the mix of hardware sales, connectivity, subscriptions, and services, the time required to integrate with each utility’s sensors and SCADA environment, and the extent to which FAI+ features produce measurable expansion. Verify current ownership, management continuity, funding history, certification scope, firmware-update practices, cloud and on-premises security controls, and customer concentration. Ayyeka merits inclusion because it addresses a high-consequence operational problem with a tangible product and a plausible resilience pathway, but its investment and strategic priority should remain conditional on evidence that the company scales beyond project-by-project deployments.
"""
