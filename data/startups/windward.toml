name = "Windward"
description = "Windward provides Maritime AI software that fuses AIS, vessel and ownership data, trade context, and remote-sensing signals into explainable intelligence for commercial risk, compliance, maritime operations, and government security missions."
detailed_description = """
Windward is a maritime-intelligence software company built around the difficult problem of turning incomplete, adversarial, and heterogeneous ocean data into decisions. Its platform combines vessel identity and ownership information, AIS and movement history, trade and port context, and remote-sensing inputs such as electro-optical, synthetic-aperture-radar, and radio-frequency data. Behavioral models and risk analytics are intended to distinguish ordinary activity from anomalies such as deceptive shipping, sanctions evasion, suspicious loitering, or changes in route and operating pattern. The product is therefore more than a vessel map: its value depends on entity resolution, temporal behavior modeling, multi-source correlation, investigation tooling, and an evidence trail that an analyst can inspect.

The commercial customer problem is broad but concrete. Banks, insurers, commodity traders, energy companies, shipowners, logistics providers, and compliance teams need to screen counterparties and voyages, understand beneficial ownership, monitor sanctions and trade exposure, and investigate exceptions without manually assembling dozens of data sources. Windward also markets container and voyage visibility, early detection, business intelligence, and protection of subsea and offshore infrastructure. Its current positioning emphasizes agentic workflows, remote-sensing intelligence, and a Maritime Intelligence Operations Center that combines software with Windward analysts; that can improve time-to-answer for customers, but also means services quality and analyst capacity remain part of the delivered product.

The competitive field contains both data-rich incumbents and focused substitutes. Basic vessel tracking is increasingly commoditized, while the harder layer is reliable identity resolution, coverage of dark or spoofed activity, behavioral interpretation, and workflow integration. Windward claims a differentiated multi-source and sensor-agnostic approach; FTV says the platform aggregates more than 10 billion raw data points across 20 sources, but that is an investor-reported scale claim rather than independently audited evidence. Windward reported reaching 200 customers in 2024, and its current website presents references spanning commercial, government, and law-enforcement users. Current ownership and product expansion should be assessed separately from historical LSE performance: Windward and FTV announced completion of the take-private in March 2025, after which the company became privately held and its shares ceased trading.

The defense and national-security case is substantive. Maritime domain awareness, border security, sanctions enforcement, counter-smuggling, protection of subsea cables and offshore infrastructure, and detection of anomalous activity all use the same underlying capabilities as commercial maritime risk. Windward's current defense materials describe multi-source intelligence, remote-sensing fusion, evidence-backed targeting, investigation workflows, and GPS-jamming resilience. These are credible mission adjacencies because they address observable maritime behavior and collection gaps, not because the company is a weapons developer. The April 2026 Prominent Edge acquisition adds stated U.S. government mission-software and geospatial delivery capacity, but integration outcomes are not yet established. Diligence should distinguish marketed capability from independently verified operational performance by testing detection precision and recall in contested environments, latency from collection to alert, explainability, analyst workload, secure deployment options, customer retention, unit economics, and post-acquisition delivery capacity.
"""
