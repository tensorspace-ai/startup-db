name = "CET Ventures"
description = "CET Ventures is a Tel Aviv-based venture capital firm launched in 2026 to back Israeli-led critical and emerging technology companies with validated pathways into U.S. defense, infrastructure, and industrial markets. Its differentiated proposition is an investment platform paired with a U.S.-Israel commercialization network through the related CET Sandbox; public evidence of fund size, completed investments, or realized returns remains limited."
detailed_description = """
**Mandate and the problem it addresses.** CET Ventures is an investment firm rather than an operating technology startup. It targets a specific gap between Israeli technical innovation and U.S. customer adoption: a company can demonstrate a useful capability and still fail to sell into defense or critical-infrastructure programs because procurement pathways, export controls, security requirements, integration partners, and budget timing are difficult to navigate. CET says it backs Israeli-led companies developing critical and emerging technologies aligned with validated U.S. demand, and its stated stage preference is selective Pre-Seed through Series A, around the point where technical risk has fallen but commercialization and scale still require capital and market access. The fund's framing centers on government and industrial demand rather than broad thematic exposure. That focus gives the record strategic relevance, but the existence of a focused thesis is not evidence that the fund itself has identified a repeatable sourcing or return advantage.

**Operating model and how the platform works.** CET presents a combination of venture underwriting, research, and commercialization support. Its website describes a research process that tracks policy, market, and technology shifts; an operator network intended to clarify procurement needs; and support for customer engagement and U.S. expansion. The related CET Sandbox is described as a separate sister organization and U.S.-Israel innovation hub. The Sandbox says it convenes Israeli founders, defense contractors, government innovators, investors, and industry leaders through showcases, collaborative research, and targeted engagement, and that its network includes more than 350 Israeli-founded companies and 1,200 community members. These are organization-reported network figures, not CET Ventures portfolio counts or independently audited measures. CET's proposed mechanism is to use the Sandbox's access and exposure to operating requirements as an input to investment diligence, then help selected companies prepare for U.S. adoption. The firm does not claim to own a technology stack, laboratory, patent portfolio, or defense product; its prospective assets are investment judgment, domain relationships, information flow, and portfolio support.

**Market, counterparties, and route to adoption.** CET's target market sits at the overlap of Israeli deep-tech supply and U.S. defense, national-security, infrastructure, and industrial demand. The firm names autonomous systems, dual-use AI, secure compute, and resilient supply chains as examples, with its public portfolio page also organizing opportunities under applied artificial intelligence, quantum and battlefield information dominance, biomanufacturing, contested logistics, scaled directed energy, and hypersonics. The likely counterparties for an investment platform of this kind include Israeli founders, U.S. defense primes, government innovation offices, federal challenge programs, mission users, and later-stage investors; that list describes its operating model, not a disclosed customer roster. The Sandbox's partner page lists organizations including Fluet, Wilson Sonsini, Greenberg Traurig, Gornitzky, Holland & Knight, and AWS, indicating an intended legal, cloud, and market-access network. The commercial path is inherently indirect: CET must first source and select companies, then support specific pilots, integrations, procurement access, follow-on financing, or strategic partnerships. Outcomes will be measurable at the portfolio-company level, not by the number of events or introductions alone.

**Traction, financing, and external validation.** CET's own About page states that it launched in 2026, while an Israeli corporate-information record lists CET Ventures VC Management Ltd. as an active private Israeli company incorporated on April 15, 2026, at an address in Ra'anana. The firm's site identifies Tel Aviv as its contact location, and LinkedIn lists Tel Aviv as its headquarters plus Washington, D.C. as another location. CET's portfolio page currently displays two anonymous stealth opportunities and one item marked as closing soon; it cautions that companies shown may include investments or transactions subject to completion. No company names, check sizes, ownership stakes, fund target, first close, total commitments, capital deployed, or performance figures are publicly stated in the material reviewed. CET has published two research pieces in 2026: one on U.S.-Israel defense integration and another on fiber-optic FPV drone threats and counter-UAS needs. These publications show an active effort to develop and explain its thesis, but they are self-published analysis, not third-party validation of investment performance. The Sandbox's Operation Northern Shield and its ecosystem pages provide evidence of convening activity; they do not verify a resulting purchase order for any specific participant.

**Team and relevant experience.** CET's official team page lists Israel Ganot as Managing Partner, Barry Mannis and Jillian Goldberg as General Partners, and Col. (Res.) David “Duddy” Rokach as General Partner, with Azi Jacobson as an analyst. The biographies indicate a deliberately cross-functional group. Ganot is described as a former co-founder and general partner at AGP Ventures, Executive Director of MassChallenge Israel, and CEO of Gazelle, alongside earlier roles at PayPal, eBay, Amazon, and Goldman Sachs. Mannis is described as a former Goldman Sachs partner and co-head of Global Investment Research who led a large multi-office team, later co-founded a municipal-bond fund, and has worked on U.S.-Israel geopolitical analysis. Goldberg previously served as CRO and board member at GuardKnox, where she worked on revenue growth and U.S. expansion. Rokach's biography describes more than 30 years in defense innovation and R&D, leadership of SOSA HLS & Defense, involvement in the INNOFENSE accelerator with Israel's Ministry of Defense, and prior responsibility for ground-force weapons-system R&D and procurement in the IDF. The team page also names U.S. venture partners and advisors with experience in CFIUS, the White House Office of Science and Technology Policy, the Department of Defense, and the Defense Innovation Unit. These credentials are company-published biographies and support a plausible access-and-commercialization thesis; they do not establish that each advisor is an investment decision-maker or that government relationships confer procurement preference.

**Competitive dynamics and potential differentiation.** CET competes for founders, opportunities, and investor capital with Israeli defense and dual-use investors such as Protego Ventures, Stratos Ventures, Aurelius Capital, Kinetica Ventures, and Caveret Ventures, as well as U.S. firms including Shield Capital, Lux Capital, and In-Q-Tel. These organizations have different fund stages and mandates, but they overlap in screening strategic technology companies, supplying risk capital, and connecting them to defense customers. CET's stated differentiator is the integration of research, a company-building and U.S.-market preparation platform, and investment decisions made after validation. Its site says it seeks active procurement pathways and durable U.S. revenue, and its Sandbox material presents structured engagement with users and contractors as part of that process. If the information loop produces earlier visibility into real requirements and reduces the time a portfolio company needs to reach a funded pilot, it could be valuable. The same design raises attribution and governance questions: the Sandbox is a sister organization, but the public materials reviewed do not explain the legal boundary, data-sharing rules, fees, conflicts policy, investment committee, or how access to founders is allocated between portfolio and non-portfolio companies. Differentiation therefore remains a proposition awaiting portfolio-level evidence.

**Defense, resilience, and dual-use assessment.** CET's investment thesis directly targets technologies that may serve civilian and national-security users, and its published focus includes secure computing, autonomy, AI, supply-chain resilience, and critical infrastructure. The adjacent CET Sandbox describes engagement with defense officials, frontline operators, and firms in the U.S. defense industrial base, including a reported 2026 counter-drone workshop. This creates a potentially meaningful ecosystem bridge for companies whose products need mission feedback, integration pathways, or U.S. market preparation. Nevertheless, CET Ventures is a fund, not a dual-use technology provider. It has no disclosed core product that is itself used in both commercial and defense settings, and a portfolio mandate cannot be substituted for demonstrated portfolio outcomes. Accordingly, dual_use is false for the fund entity even though its stated investment strategy is concentrated on dual-use and defense-relevant companies. The strategic value is best understood as capital allocation and market-access infrastructure: it may help Israeli-founded technology reach allied buyers, but claims about improved readiness, resilience, or operational capability require evidence from named portfolio deployments and subsequent customer adoption.

**Stage, trajectory, and diligence risks.** CET is early stage as a fund platform: it launched in 2026, has a recently incorporated Israeli management company, and has not publicly disclosed a final fund size, close, named portfolio, investment amounts, or exits. The visible trajectory is toward building a selected portfolio and the cross-border support system to commercialize it. Progress should be measured through disclosed and completed investments, follow-on rounds, named pilots or contracts, repeat U.S. customer conversion, and ultimately realized returns rather than research output alone. Important diligence risks include (1) fund formation and capitalization opacity, including the legal structure, committed capital, fees, and deployment runway; (2) lack of attributed portfolio track record and limited evidence that the displayed stealth items are closed investments; (3) execution complexity across two organizations and two jurisdictions; (4) conflicts, confidentiality, and fair-access controls where the Sandbox engages a broad company network while the fund selects a subset; (5) procurement-cycle and export-control delays that can extend holding periods; (6) dependence on U.S.-Israel policy, alliance, and budget conditions; and (7) key-person reliance on a small disclosed investment team. Current public information supports a real, strategically focused new Israeli fund manager with relevant experience and an unusually explicit commercialization concept. It does not yet support a conclusion about investment performance, portfolio quality, or successful U.S. procurement conversion.
"""
