name = 'Corsight AI'
description = "Corsight AI Ltd is an Israel-headquartered private company selling facial intelligence software for real-time identification and forensic investigation across enterprise and government security workflows. Its products integrate with camera systems; public materials describe operations across aviation, law enforcement, retail, entertainment and other sectors."
detailed_description = """Corsight AI Ltd is a privately held Israeli facial intelligence software company. Its official privacy notice names Corsight AI Ltd (Israel) as the group headquarters and research-and-development entity, alongside UK and US affiliates. The company describes its business as supplying face recognition technology to enterprise clients and government agencies; its privacy notice states that customers determine operational purposes, watchlists, thresholds and investigative actions. This distinction matters commercially and legally: licensing software to a customer does not itself establish how a deployment is used, whether a particular agency is a customer, or that a deployment is a paid production contract.

The current company site describes its platform as powered by Autonomous AI and markets it for challenging visual conditions. It lists aviation, law enforcement, retail and entertainment as served sectors and claims deployment in more than 50 countries with dozens of partners. These are company-reported scale indicators, without public customer-by-customer revenue, contract values, deployment counts, renewal data or independently audited country-level proof. Public product materials and the company's 2025 product account describe role-based access control, masking identity data for some user roles, and differentiated access to live feeds. Those governance features could help address operational separation and audit requirements, but they do not by themselves establish lawful basis, necessity, proportionality, accuracy in a particular deployment or effective redress for affected people.

The strongest independently described technical evidence located in this review is historical. In the 2020 DHS Biometric Technology Rally, anonymized matching-system results were released by the Maryland Test Facility; the company later publicized strong placements. Because the DHS report aliases vendors, the public results cannot independently map a performance row to Corsight. The company's result announcement states 99.65% accuracy without masks and 92.53% with masks. These figures are company-reported from a bounded 2020 test, not a current benchmark or proof of field performance. Testing conditions, acquisition hardware, thresholds, demographic subgroup results and contemporary competitor comparisons should be examined before treating them as procurement evidence. Claims about recognition at one lumen, extreme angles or occlusion, and the company's “more than 250 patents” language are also marketing statements unless tied to specific test protocols and patent-family records. Public patent-assignee indexes do show Corsight AI-named filings, but that does not validate the broader patent count or demonstrate enforceable moat, ownership of all cited research, or commercial freedom to operate.

Commercially, the product can address an existing security workflow: matching faces across live or recorded camera feeds against a customer-controlled gallery, routing alerts, and supporting post-event searches. It may fit airports, transport hubs, venues, retail loss-prevention operations and law-enforcement investigations where existing CCTV and access-control systems can be integrated. The business model appears to be enterprise and government software and related deployment/support delivered directly or through integrators; public sources reviewed do not disclose pricing, recurring revenue, gross margin, contract duration, customer concentration or renewal rates. Partnerships and broad deployment claims should therefore be treated as distribution or footprint evidence, not automatically as paid recurring production usage.

Its competitive set spans established biometric vendors such as NEC and IDEMIA, specialized face-recognition providers such as Paravision and Innovatrics, and broader video analytics vendors such as BriefCam. Buyers can also use camera-native analytics, access-control biometrics, human review, or non-biometric security processes as substitutes. Differentiation depends on independently reproducible accuracy under poor image quality, low latency at the required scale, integration effort, privacy controls, cost and vendor support. Corsight's claimed difficult-condition performance could matter, but public evidence reviewed does not establish a durable advantage over named rivals on a common dataset or real-world false-alert burden. A buyer should demand current third-party tests using its own cameras and representative populations, subgroup error rates, threshold calibration, failure handling and end-to-end operational measurements.

The company has substantive dual-use applicability because the same identity-matching capability can support civilian transport, venue, retail and law-enforcement use as well as border, public-safety and national-security workflows. The technical function is not inherently proof of a defense contract or military deployment. No defense customer contract, government award, classified use, export license or specific defense procurement was established in the reviewed primary evidence; those claims require separate diligence. The same broad utility creates material human-rights and regulatory exposure. Biometric surveillance can affect bystanders and people who are not suspected of wrongdoing, and errors can lead to denial of access, investigation or detention. Data minimization, watchlist provenance, notice, retention, access logging, independent oversight, appeal mechanisms, demographic testing and limits on secondary use are core product and procurement questions, not peripheral communications issues.

Funding evidence located is limited. Reuters reported in April 2020 that Corsight raised US$5 million from Canadian investor AWZ Ventures. CB Insights lists a US$3 million loan from Davidson Technology Growth Debt in August 2024, but the review found no originating announcement or filing to verify the instrument, closing, terms or whether funds were drawn. Accordingly, the 2020 equity financing is the only round with a reliably sourced amount in this dossier; no company-announced lifetime total was found, and private cap-table ownership is not publicly verified. An archived Calcalist report characterized Corsight as a Cortica subsidiary and a joint venture formed with AWZ in 2019, while today's board page includes representatives associated with both organizations. Those facts indicate historical strategic relationships, not a currently verified parent or ownership percentage. The company remains private and active on its current site, with named CEO Shai Toren and a listed leadership team. No current revenue, profitability, headcount, audited accounts or valuation was located.

For an investor or strategic buyer, attractive hypotheses are that the software can monetize installed camera infrastructure, has a focused security product, and has international channel reach. They remain hypotheses until diligence establishes recurring software revenue, implementation economics, customer retention, sales-cycle length, contract liabilities, working-capital needs and the real contribution of partners. Technical diligence should inspect patent schedules and assignments, model/version governance, training-data rights, security architecture, penetration tests, uptime, edge hardware dependencies and performance drift. Commercial diligence should sample signed customer contracts and references across civilian and public-sector verticals, confirm paid status and production scope, and distinguish deployments from pilots or channel availability. Strategic diligence should assess export-control obligations, customer screening, data protection roles, incident response and the company's ability to suspend misuse. A credible investment case therefore rests on independently validated performance and responsible, repeatable paid deployments; neither the public footprint claims nor historical financing alone establish scale or investment quality."""
