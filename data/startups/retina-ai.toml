name = "Retina AI"

description = "Retina AI is a predictive customer-intelligence platform for estimating customer lifetime value, lapse probability, and related behavioral signals early in the customer lifecycle. ONAR Holding Corporation acquired the software platform in 2025 and has described it as an ONAR Labs capability being integrated and relaunched within its marketing technology stack."

detailed_description = """
Retina AI built software around predictive customer lifetime value (CLV), especially early customer lifetime value (eCLV) for leads and customers that do not yet have enough repeat-purchase history for conventional cohort analysis. Its public product material describes ingestion of transaction, engagement, demographic, journey, and session data; machine-learning-based imputation and forecasting; and outputs such as predicted CLV, lapse probability, persona, likely next transaction, typical order value, and predicted lapse date. The product is intended to turn those signals into operational decisions rather than leave them in a data-science notebook.

The primary customers are consumer businesses with repeat-purchase economics, including e-commerce, retail, consumer packaged goods, financial services, healthcare, and paid apps. Retina's FAQ says the strongest fit generally involves customer identity resolution, substantial repeat-purchase history, and roughly 18 months or more of data; it also describes integrations or transfer paths involving Shopify, CDPs such as mParticle and Segment, and a customer's data warehouse. The commercial value proposition is to identify high-value acquisition cohorts earlier, allocate marketing spend more intelligently, prioritize retention work, and give finance and executive teams a more forward-looking view of customer profitability.

The technology is commercially credible but not obviously a defensible frontier-model platform. The differentiating package is a focused workflow combining customer-level forecasting, time-to-event or lapse modeling, feature and persona outputs, integrations, recurring scoring, and business-facing recommendations. Competitors and substitutes include customer-data and product-analytics suites, lifecycle-marketing platforms, specialist CLV vendors, and internal analytics teams. Public pages describe customer examples and performance outcomes, but those claims are company-provided and should be validated through customer references, retention data, calibration tests, incremental-lift experiments, and evidence that the models remain useful across sectors and changing acquisition channels.

The corporate status has changed the diligence frame. ONAR announced a definitive agreement in July 2025, later reported that it had acquired the software platform, and described a rebuild, closed testing, and planned relaunch under ONAR Labs. Retina should therefore no longer be treated as an independent Series A company or as a standalone Israeli startup. The important current questions are whether the relaunch achieved production adoption, whether ONAR preserved the original team and data-science capability, how recurring software revenue is measured, and whether integration with ONAR's agencies improves distribution without creating concentration or execution risk.

Defense and national-security relevance is limited and indirect. The underlying methods—forecasting behavior from sparse, permissioned event data and presenting uncertainty-aware scores to operators—could inform workforce retention, contractor planning, logistics demand, or other resource-allocation workflows. There is no public evidence in the reviewed sources of government, defense, classified, or security deployments, and marketing data is not a substitute for mission data. Any public-sector transfer would require a new use-case validation, lawful data access, privacy and civil-liberties controls, procurement fit, and testing for bias and distribution shift. The asset is consequently more relevant as a general predictive-analytics capability than as a defense-native technology.
"""

