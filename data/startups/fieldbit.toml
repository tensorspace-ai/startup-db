name = "Fieldbit"
description = "Fieldbit developed an augmented-reality and spatial-computing platform for industrial field service, combining remote expert collaboration, visual work instructions, knowledge capture, and asset information. Help Lightning acquired Fieldbit in 2021 and continues to present its capabilities within the Help Lightning Fieldbit offering."
detailed_description = """Fieldbit's product was an enterprise software layer for technicians working on complex, distributed equipment. Fieldbit Hero combined live two-way video, voice and messaging with real-time AR annotations and a merged-reality interaction model, allowing a remote expert to guide an on-site worker around a physical asset. The platform was designed to work across mobile devices and smart glasses rather than requiring a bespoke robotics or sensing stack. Its spatial-computing positioning also included locating assets and presenting relevant warnings, readings, status information, and labels from connected or back-office data sources.

The product's more durable proposition was knowledge operationalization, not the novelty of an AR overlay by itself. Fieldbit described a multi-source knowledge platform that brought together subject-matter experts, accumulated organizational know-how, step-by-step procedures, IIoT data, and enterprise service information. Remote sessions could produce reusable records for later troubleshooting, training, inspection, and work instructions. This addresses a concrete industrial problem: expensive assets may be spread across sites, while the people who know how to repair them are scarce, geographically distant, or nearing retirement. The commercial value therefore depends on reduced travel and downtime, faster resolution, safer procedures, and better first-time-fix performance.

The initial customer context was industrial equipment manufacturers, asset owners, utilities, energy companies, and other service organizations with high-cost maintenance events. Help Lightning's acquisition announcement cited Fieldbit customers or users including BP, Emerson, and Veolia, and described the combined offering as supporting remote technical support, 3D annotation, knowledge capture, work instructions, and IIoT augmentation. Those are meaningful commercialization signals, but they do not establish current revenue, retention, deployment scale, or whether each named organization used the full platform. The current product page is a Help Lightning marketing surface rather than evidence of Fieldbit remaining a separately operated company.

Competitive pressure is substantial. Remote visual assistance is available from vendors such as Help Lightning, SightCall, TeamViewer, and CareAR; AR authoring and work instructions overlap with PTC Vuforia, TeamViewer Frontline, and Microsoft Dynamics 365 Guides; and rugged wearable vendors such as RealWear can be part of the substitute stack. Fieldbit's historical edge was the combination of expert-led assistance, spatial context, guided self-help, and knowledge reuse in one industrial workflow. That integration can improve adoption and data continuity, but it is also vulnerable to larger suites bundling similar capabilities into service-management, collaboration, or wearable ecosystems.

The defense and national-security relevance is credible but bounded. The same workflow could support depot maintenance, base-level equipment sustainment, shipyard or aviation maintenance, critical-infrastructure repair, and training where a remote subject-matter expert can reduce travel or accelerate fault isolation. It is not evidence of a defense product, classified deployment, or contested-environment capability. Military usefulness would require secure hosting and communications, offline or degraded-network operation, device and identity controls, appropriate information handling, ruggedized hardware, and integration with maintenance records. Those requirements, plus acquisition into Help Lightning, make Fieldbit most useful in this database as a reference capability and strategic-technology benchmark rather than an active startup opportunity."""
