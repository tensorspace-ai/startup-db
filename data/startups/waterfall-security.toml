investment_rationale = "Waterfall is a credible strategic-priority signal for a dual-use technology database because its core product imposes a physical security constraint at the IT/OT boundary and addresses a persistent problem in critical infrastructure: operators need data access without creating an inbound path to control systems. The company has operated since 2007, is privately held, lists 51-200 employees, maintains an international footprint, and publicly describes a broad industrial connector and appliance portfolio. A Hyundai Steel deployment and current Common Criteria materials provide concrete commercialization and assurance signals. The case is not a conventional high-growth SaaS thesis: hardware procurement, long OT sales cycles, integration services, certification maintenance, and the need to prove reliability may constrain expansion. Financial performance, ownership, recurring-revenue mix, retention, customer concentration, and government or defense sales remain diligence gaps. Investible is retained as an internal strategic-fit flag, not an investment recommendation."
strategic_value = "Waterfall offers strategic value as an established supplier of high-assurance OT boundary technology in a market where cyber incidents can create physical, safety, environmental, and continuity consequences. Its gateway-plus-replica approach can complement rather than replace asset visibility, detection, identity, patching, and incident-response controls. For a defense or critical-infrastructure ecosystem, the relevant assets are the hardware-enforced design, protocol and application replication know-how, integration footprint, assurance evidence, and relationships with industrial operators and automation ecosystems. The technology could support secure monitoring between networks with different trust levels, but strategic assessment should not assume classified authorization, sovereign supply-chain status, or military adoption without customer-level evidence. Its value is strongest where preventing inbound reachability is more important than preserving unrestricted interactive connectivity."
