name = "Neosec"
description = "Neosec was a 2020-founded B2B API-security company with its corporate base in Palo Alto and R&D in Tel Aviv. It built cloud-hosted API discovery, behavioral analytics, and threat-hunting software. Akamai acquired all outstanding equity in May 2023; Neosec is now an acquired asset whose technology is represented within Akamai API Security, not an independent startup."
detailed_description = """Neosec, Inc. built a cloud-hosted API detection and response platform for enterprise security and development teams. Its historical product combined API inventory and risk review with behavioral analytics, investigation, and threat hunting. The company described its data-centric approach as learning normal API usage and using historical activity to detect misuse, fraud, data theft, and business-logic abuse that can look legitimate to a gateway or a signature-based rule. Its product could use activity data from a customer's API estate and integrations rather than requiring a separate sensor in every application. This made broad coverage of shadow, undocumented, partner, and changing APIs central to its product proposition.

The buyer problem was concrete. Large organizations often distribute API ownership across development groups, gateways, clouds, and partner systems. A gateway can enforce access and traffic policy where it is deployed, while an API security team also needs an inventory of exposed endpoints, context on who uses them and what data they move, and visibility into abnormal but valid-looking sequences. Neosec's intended workflow was to identify APIs and their risks, establish behavioral context, investigate suspicious activity, then connect findings to existing security response processes. Its cloud-native SaaS model and stated privacy design, including field tokenization, were relevant to enterprises wary of sending detailed request data to a security vendor. That advantage depended on reliable and sufficiently broad input data, effective normalization across environments, and acceptable privacy controls; the public material does not provide independent detection-rate or false-positive benchmarks.

The company was founded in 2020 by Giora Engel and Ziv Sivan. At launch in September 2021, Neosec said it already had paying enterprise customers and notable technology and channel partners; the contemporaneous report did not name customers, disclose contract values, or quantify the customer base. A later company announcement described completion of a SOC 2 Type II audit, and Neosec announced a Google Cloud Apigee integration in September 2022. These are useful evidence of productization and integration work, but neither a compliance audit nor an integration announcement establishes recurring revenue or a paid deployment. Akamai's August 2023 launch announcement quoted Earnin's CISO discussing API discovery and monitoring, and an Akamai customer story published the following month described an unnamed financial-services and insurance company that completed a four-week proof of concept and detected API posture and runtime issues. Those are stronger usage signals, although the customer story is vendor-published and anonymized and neither source gives commercial terms.

Akamai announced a definitive agreement to acquire Neosec on April 19, 2023. Akamai's second-quarter filing says it acquired all outstanding equity in May 2023 for cash and recognized identifiable intangible assets, primarily completed technologies, as part of purchase-price accounting. The filing did not report Neosec's revenue separately because the acquired results were not material to Akamai's consolidated results. The deal validates that a large security platform valued Neosec's technology and team as a strategic complement; it is not evidence by itself of product-market scale, standalone profitability, or an independent venture opportunity. The announced purchase price differs slightly between the filing and an older ecosystem record, so the dossier preserves that discrepancy instead of presenting false precision.

Neosec's product lineage is now difficult to separate from Akamai's broader offering. Akamai made a standalone API Security product available in August 2023 and explicitly tied it to the Neosec acquisition. A 2024 PCI compliance document later said the additional API Security solution formerly known as Neosec was no longer for sale. Akamai's current product page describes a wider product spanning discovery, governance, active testing, runtime analytics, response, and AI-related endpoints; a current Akamai license identifies Neosec and Noname components in the ecosystem. Akamai's 2024 acquisition of Noname further changed the combined portfolio. The public record therefore supports continued use of Neosec-originated capabilities within Akamai's product family, but it does not map every current feature or customer to Neosec code. For diligence, the current product page is a reliable description of Akamai's offer, not a feature-by-feature history of Neosec.

The competitive set includes Salt Security, Traceable AI, Wallarm, and Imperva. Salt is a close analogue in API discovery and behavioral threat detection. Traceable overlaps in inventory, posture, runtime detection, threat hunting, and testing, while emphasizing contextual links among API activity, users, data flows, and code. Wallarm stresses inline blocking, broad protocol support, and real-time protection. Imperva connects API discovery and OWASP risk management to its broader application-security and bot-protection platform. These vendors show how difficult it is to sustain a standalone differentiation based on discovery plus analytics alone: buyers can compare code-to-runtime coverage, deployment choices, response enforcement, integration depth, and bundle economics. Neosec's historical distinction was its XDR-like, data-lake and behavioral-analysis orientation with a managed threat-hunting workflow. Akamai supplied distribution, security infrastructure, and an existing application-security portfolio, while acquisition into a combined suite also made Neosec's individual feature advantage less attributable.

The technical thesis remains relevant where an organization has incomplete API inventories and needs to detect abuse that uses valid identities, normal endpoints, or ordinary-looking requests. However, behavior analytics depend on representative telemetry and context: missing gateways or logs, schema drift, changes in user behavior, and sensitive payload handling can all affect coverage and operations. A mature buyer would need evidence on ingestion cost, time to coverage, data minimization, analyst workload, precision and recall, response latency, and whether findings lead to practical remediation. The public record gives product descriptions and a few customer examples, but not those performance measures, post-acquisition retention, contract economics, or a current Neosec-specific roadmap.

The defense and security application is indirect but real. Government, defense, financial, and critical-infrastructure organizations use APIs for internal services, mobile applications, cloud systems, and partner workflows; discovery, behavioral anomaly detection, and data-exposure analysis can help secure those environments. Neosec's public evidence supports a general defensive cybersecurity capability, not a purpose-built military product, classified deployment, government contract, or defense customer. Its record should therefore be treated as a commercial API-security asset with public-sector applicability rather than as proof of defense adoption. Because Akamai owns the asset and the former Neosec standalone solution was later marked no longer for sale, the useful present-day questions concern product lineage, customer migration, surviving expertise, and how Akamai's combined API Security is sold and supported."""
