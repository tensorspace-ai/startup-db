investment_rationale = "Way Security is a strong internal priority signal for cyber-resilience diligence, but this flag is not an investment recommendation. (1) The problem is concrete and budgeted: enterprise IAM programs frequently stall at the integration boundary, where manual development and consulting can cost several times the software purchase. (2) The wedge is differentiated enough to test: Way complements existing identity platforms and seeks to productize the difficult work of reaching legacy and homegrown applications instead of asking buyers to rip and replace. (3) Early proof is stronger than a stealth thesis alone: the company raised $20 million from Insight Partners and Glilot Capital, employs about 30 people, and has reported paying customers and sales in the United States and Europe. (4) Founder-market fit is unusually direct because Yossi Barishev and Yonatan Rosenberg previously led IAM and incident-response work at Sygnia, with Barishev also having run security at Fireblocks and Rosenberg bringing Unit 8200 experience. Counterweights are equally important: no public revenue, retention, named customers, independent benchmark, or disclosed certification; a young platform is being trusted with privileged identity infrastructure; and the category is exposed to incumbents, system integrators, and services-heavy deployments. The diligence case turns on repeatability, gross-margin potential, integration safety, and whether Way becomes a scalable product rather than an AI-assisted consultancy."
strategic_value = "Way's strategic value is concentrated in the identity-control layer that determines who can access sensitive systems and how quickly that access can be changed. (1) Resilience leverage: bringing legacy and homegrown applications under the same MFA, SSO, lifecycle, access-review, and remediation policies can close gaps that attackers exploit after a credential compromise. (2) Deployment leverage: a vendor-neutral enablement layer may help organizations obtain value from existing IAM investments without waiting years to rewrite or replace every application. (3) Critical-sector relevance: financial services, healthcare, manufacturing, defense suppliers, utilities, and government agencies all operate heterogeneous estates where unsupported systems can remain outside governance. (4) Ecosystem leverage: partnering with established identity vendors could let Way reach large installed bases while preserving a complementary position. Strategic confidence remains conditional because no defense or government deployment is public, and a control-plane product must prove secure privileged access, rollback, audit quality, disconnected-operation support, and accreditation readiness before it can be treated as a national-security asset."
