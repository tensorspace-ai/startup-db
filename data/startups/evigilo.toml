investment_rationale = "Evigilo is not a current standalone investment priority because public records describe an acquisition by NGSoft in 2018 and mark the company inactive. The asset remains strategically interesting for diligence on public-warning software, especially if NGSoft is actively maintaining or commercializing eVigilo-Smart. Any assessment of ownership value, recurring revenue, customer retention, technical debt, intellectual property, or product continuity requires direct confirmation from NGSoft or current customer documentation; the available sources do not justify an investment case or a current financing assumption."
strategic_value = "The historical asset has strategic value as an example of sovereign and municipal public-warning infrastructure: it links threat or sensor inputs to geographically bounded instructions and multiple delivery paths, including channels that may remain available when one network fails. Its most credible relevance is civilian protection and resilience for governments, critical infrastructure operators, and emergency managers. The value is conditional rather than current or intrinsic. A strategic reader should determine whether NGSoft owns and supports the code, whether the platform meets modern cybersecurity and data-protection requirements, whether it supports cell broadcast and current smartphone alert standards, and whether historical deployments remain operational."
