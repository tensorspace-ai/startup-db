name = "Evigilo"
description = "Evigilo was an Israeli emergency mass-notification company whose SMART platform combined geo-targeted, multi-channel public warning with operator control and two-way citizen communication. Public ecosystem records identify it as acquired by NGSoft in December 2018 and inactive, so this entry should be read as an analysis of the acquired asset and its documented technology rather than as an active standalone startup."
detailed_description = """Evigilo developed SMART, a public-warning and emergency-notification platform for governments, municipalities, and enterprise operators. Public descriptions say the system accepted event inputs from people and sensors, applied geographic or group targeting, and distributed messages across mobile networks, SMS, push notifications, fixed telephony, television, radio, websites, social channels, sirens, billboards, and other public-address mechanisms. The platform also included command-and-control workflows, predefined messages and areas, and a two-way or panic-button path where the selected channel supported it. The important technical problem was orchestration across heterogeneous legacy and digital channels, not simply sending a text message.

The product addressed a public-sector market in which reliability, localization, auditability, and integration with existing communications infrastructure can matter more than consumer-style feature velocity. Its historical positioning covered national and regional alerting, municipal crisis communications, industrial incidents, severe weather, earthquakes, fires, mass-casualty events, and routine civic notices. Public material associated the platform with Israel's Home Front Command and described deployments or operational use in multiple countries, including Chile; those claims demonstrate a credible high-stakes operating context, but the available sources do not establish current contracts, current uptime, current revenue, or continued operation under the Evigilo name.

The strongest commercialization signal is the platform's reported selection for Israel's national internet emergency alert system in 2014, followed by its acquisition by NGSoft in 2018. The acquisition is also the central diligence fact: Startup Nation Finder labels the company acquired and inactive, while NGSoft/MIC pages continue to present eVigilo-Smart as a solution. It is therefore not appropriate to infer that Evigilo remains an independent venture, has an active financing round, or still has the historical employee count. The former evigilo.net domain did not resolve during this review, and no current standalone corporate site was found.

Evigilo's defense and national-security relevance is real but specific. A geo-targeted, multi-channel warning layer can support civilian protection during missile attacks, disasters, infrastructure failures, and other security events, and can reduce dependence on a single communications path. The same architecture is commercially useful for municipalities, utilities, campuses, hospitals, transport operators, and industrial sites. Its edge was likely accumulated integration knowledge and operational references in public warning, rather than a novel underlying AI or sensor technology. Current strategic value consequently depends on whether NGSoft retained, modernized, and deployed the product, how it interoperates with cell-broadcast and smartphone-native alert systems, and whether its historical government references remain transferable."""
