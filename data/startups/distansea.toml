name = "DistanSea"
description = "DistanSea is an Israeli aquaculture water-treatment startup commercializing reusable, ammonia-selective media for keeping live fish and shellfish healthy during long-distance transport and holding. Its Technion-derived ART platform targets the saline-water ammonia bottleneck that drives mortality, water changes, transfer stops, and expensive air freight in live seafood logistics."
detailed_description = """
**Product and the concrete problem.** DistanSea is building a water-treatment product family for live seafood logistics, starting with ART (Ammonia Removal Treatment), ART-pH, Regen-ART, and the planned ART-X integrated platform. Live fish and crustaceans continuously excrete ammonia in closed tanks; in seawater, sodium and other ions make selective ammonia removal difficult, and toxic accumulation forces operators to lower stocking density, replace water, add intermediate holding points, or use air freight. DistanSea's commercial thesis is that a passive treatment module can extend the safe operating window without requiring customers to redesign tanks or depend on a biological filter. The immediate customer problem is operational and measurable: keep animals alive and saleable over longer routes, reduce shipment handoffs and water replacement, and make refrigerated surface transport practical for species such as king crab, brown crab, seabream, fingerlings, and other live aquatic products. The company says its technology is intended for transport, temporary holding, seafood display systems, and other closed or semi-closed aquatic operations where technical supervision is limited.

**Core technology and how it works.** The technology combines water-treatment chemistry, ion exchange, polymer encapsulation, regeneration engineering, and application-specific calculations. DistanSea's active medium is a zinc-hexacyanoferrate (ZnHCF) composite encapsulated in durable reusable beads. When saline water contacts the porous beads, the material preferentially captures ammonium ions even though seawater contains high concentrations of competing sodium and potassium ions. The beads operate passively: they do not require a nitrifying biofilter to mature, continuous dosing into the tank, sensors, or an electrical control loop. After a defined operating cycle, a controlled regeneration process removes captured ammonium and restores adsorption capacity so the media can be used again. DistanSea configures bead quantity and treatment modules against species, biomass, water volume, temperature, route duration, and target ammonia level. ART-pH is intended to stabilize another source of transport stress, while ART-X is a future modular system that could combine ammonia, pH, oxygen, carbon dioxide, turbidity, circulation, and monitoring functions.

**Market, customers, and go-to-market.** The initial market is the global live seafood supply chain: hatcheries and fish farms moving juveniles, seafood exporters, well-boat and transport operators, wholesalers, holding facilities, and retailers maintaining live display tanks. DistanSea's example of Norwegian king crab illustrates the logistics wedge: ammonia accumulation can require water changes and intermediate stations roughly every few days, whereas a longer controlled journey could allow a direct refrigerated truck route to a destination such as Madrid. The commercial model appears to combine treatment modules or media with a regeneration service, with configuration support for each species and route. The company is developing design-partner and pilot relationships rather than claiming broad commercial availability; its site says ART-X remains under development and that DistanSea is seeking selected transport companies and seafood operators for evaluation. Longer term, the platform could extend from live seafood into aquaculture holding, fingerling transport, temporary farm infrastructure, and other saline or brackish-water systems where water quality constrains resilient food distribution.

**Traction, funding, and third-party validation.** DistanSea was founded in February 2025 according to Startup Nation Finder and has closed a pre-seed round, with the amount undisclosed in public company materials. Its official company page identifies support from the Fresh Start FoodTech Incubator and the Israel Innovation Authority, and describes approximately NIS 3 million in Innovation Authority funding alongside strategic and private backers including Tnuva, Tempo, Siddhi, and OurCrowd. The company reports field validations in Israel, the Netherlands, Norway, and Iceland with commercial partners, while avoiding disclosure of customer names. The strongest independent validation is academic rather than sales traction: a 2026 Aquacultural Engineering paper describes a semi-commercial system using PES-coated ZnHCF, four 96-hour high-density gilthead seabream trials at about 65 kg/m3, selective ammonium removal in saline water, full regeneration with sodium chloride, and survival above 98.8 percent. Earlier peer-reviewed work by the same Technion-linked researchers covered brown-crab transport and ZnHCF composite beads. Those results support the scientific foundation, but they do not yet establish repeatable revenue, regulatory approvals, or scaled deployments.

**Founders and team background.** The company combines operating aquaculture experience with technology commercialization. Co-founder and CTO Dr. Raz Ben-Asher has worked across fish ponds, recirculating aquaculture systems, outdoor ponds, fingerling production, water treatment, and commercial fish farming; the official biography says he also served as chairman of the Israeli Fish Farmers Association. Co-founder and CEO Asaf Lahav is described as a technology executive and entrepreneur with more than 25 years of experience taking software, enterprise, and deep-technology products toward market. Chief scientist Prof. Ori Lahav is a Technion environmental-engineering professor whose work covers water treatment, desalination, and environmental technologies. The research lineage is a meaningful asset because the product depends on chemistry that performs in seawater rather than generic freshwater adsorption. The small team is also a constraint: Startup Nation Finder lists three employees, and public materials do not provide a larger engineering, manufacturing, or sales headcount. Execution will require turning laboratory and pilot know-how into quality-controlled media production, field service, and international channel sales.

**Competitive dynamics.** DistanSea competes with several different approaches rather than one identical product. Conventional live-transport systems use water changes, oxygenation, chilling, carbon dioxide stripping, or temporary holding stations; these are proven but add labor, infrastructure, route complexity, and mortality exposure. Biological filters and recirculating aquaculture systems can manage ammonia in fixed installations, but they are difficult to mature and operate reliably for short, mobile journeys. Generic ion-exchange resins and disposable ammonia binders are alternatives, yet their performance can degrade in seawater or over extended high-biomass use. Electro-oxidation and chemical dosing can treat ammonia and disinfect water but add equipment, power, operator, and safety requirements. The defensible edge DistanSea claims is the combination of seawater selectivity, passive operation, bead handling, and regeneration, supported by Technion research and a product architecture that can fit existing transport workflows. The edge remains contestable: customers may prefer integrated equipment from established aquaculture suppliers, and DistanSea must prove cost per kilogram transported, animal welfare, repeatability, and service economics against simpler operational workarounds.

**Defense, security, and resilience relevance.** DistanSea's dual-use case is strategic food and water resilience, with a prospective austere-logistics adjacency rather than a public defense contract. A technology that reduces mortality and extends the range of live-food transport can strengthen continuity of protein supply during port disruption, road delays, climate events, or regional supply shocks. Passive treatment that works without grid power, continuous sensors, or skilled operators is also relevant to emergency aquaculture, remote coastal facilities, disaster-relief logistics, and military or civil-defense food operations that may need to hold or move live aquatic protein under constrained conditions. The saline-water chemistry and reusable media have additional relevance to water-quality management in closed systems. There is no public evidence that DistanSea has fielded a defense system, supplied a military customer, or completed ruggedized certification, so the defense interpretation should remain bounded. The credible claim is that its core water-treatment capability addresses a resilience bottleneck shared by commercial seafood logistics and selected security or emergency scenarios.

**Growth stage, trajectory, and diligence risks.** DistanSea is an early-stage startup: founded in 2025, supported by an incubator and Innovation Authority program, operating with a small disclosed team, and moving from validated research toward its first commercial product family. The 2026 paper and earlier studies reduce basic feasibility risk, while field trials in multiple countries and a closed pre-seed round indicate progress beyond a laboratory concept. The next trajectory milestones should be named design partners, paid pilots, repeatable manufacturing of ZnHCF beads, documented regeneration cycles, route-level economics, and a commercial product launch. Key risks are material. First, performance in carefully controlled trials may not translate to varied species, temperatures, biomass loads, and handling practices. Second, regeneration, disposal, quality control, and transport of the media must be reliable and economical. Third, aquaculture and seafood operators are conservative buyers with fragmented procurement and animal-welfare liability. Fourth, the company has not disclosed revenue, customer names, round size, valuation, or a complete patent portfolio. Fifth, competition from integrated recirculating systems, established water-treatment suppliers, and operational workarounds could slow adoption. DistanSea merits monitoring for its strategic food-security fit and unusually specific science, while treating commercialization and scale-up as unproven.
"""
