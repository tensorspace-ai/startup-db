name = "Aidoc"
description = "Aidoc is an Israeli clinical AI company whose aiOS platform orchestrates FDA-cleared medical-imaging and care-coordination software across hospital workflows, helping teams prioritize time-sensitive findings and act on them faster."
detailed_description = """Aidoc develops clinical AI for hospitals, with aiOS serving as an orchestration and governance layer for medical-image analysis and related workflow automation. The platform uses scan pixels, metadata, and textual patient information to route appropriate studies to algorithms, surface suspected and incidental findings in the patient record, prioritize worklists, and notify relevant care teams. Its portfolio has focused on acute conditions such as intracranial hemorrhage, pulmonary embolism, stroke, pneumothorax, and other findings where delayed recognition can affect treatment. Aidoc also describes CARE as a clinical foundation-model effort intended to extend beyond isolated algorithms, while its care-coordination tools connect imaging signals to multidisciplinary response workflows.

The customer is typically a hospital or health system seeking to scale clinical AI beyond disconnected pilots. Aidoc states that its technology is live in more than 1,600 hospitals and 150+ health systems, with 230+ enterprise deployments and 60 million patients supported annually on its current platform pages. It also reports 17 FDA-cleared clinical solutions, more than 220 clinical studies, and deployments in which partner or health-system algorithms run through aiOS. These are company-reported traction indicators rather than independently audited financial results, but they show a materially established commercialization position. The business remains exposed to long hospital procurement, integration, cybersecurity, clinical-governance, and evidence requirements; enterprise adoption is valuable precisely because it is difficult to replicate, but that same complexity can slow expansion.

Competition spans focused clinical-AI vendors such as Viz.ai and RapidAI, broad imaging-AI providers such as Qure.ai, and incumbent imaging and health-IT ecosystems from GE HealthCare, Philips, and Siemens Healthineers. Aidoc's differentiation is therefore less about claiming that one model is uniquely accurate and more about workflow breadth, deployment experience, governance, analytics, and the ability to run multiple algorithms through one enterprise integration. Its public materials cite alliances with NVIDIA and AWS and customer rollouts across large health systems, but diligence should distinguish product usage and clinical-study counts from durable contracted recurring revenue, realized health-economic savings, and retention.

The defense and national-security relevance is credible but adjacent rather than demonstrated. In military medicine, disaster response, and humanitarian field hospitals, limited specialist capacity, distributed imaging, and high casualty volume create a similar need for rapid triage and escalation. A platform that can prioritize scans and coordinate scarce clinical expertise could improve response speed in those settings, subject to connectivity, hardware, cybersecurity, validation, and deployment constraints. I found no public evidence in the reviewed sources of defense contracts or dedicated battlefield deployments, so the dual-use thesis should be treated as a transferability assessment, not proof of defense revenue. Aidoc's Israeli origin and founders' publicly described intelligence backgrounds may be relevant context, but they do not substitute for customer or program evidence."""
