name = "Datorama"
description = "Datorama was an Israeli-founded enterprise marketing analytics company acquired by Salesforce in 2018. Its former standalone platform continues as Salesforce Marketing Cloud Intelligence, with current Salesforce documentation for cross-channel ingestion, harmonization, analysis, and reporting."
detailed_description = """Datorama developed a cloud marketing analytics platform to solve a recurring enterprise problem: marketing performance was scattered across advertising networks, publishers, web analytics, CRM, commerce, offline media, and internal sales systems, each with different identifiers, metrics, currencies, and update cycles. The company built a data integration and modeling layer that collected those feeds, mapped source fields into a common marketing model, normalized values, retained relationships between dimensions and measures, and produced consolidated reports and dashboards. The product was designed for brands, advertising agencies, publishers, and marketing technology providers that needed to analyze activity across channels without building and maintaining a bespoke connector and transformation project for every client or campaign.

The specific value was the domain model and operations around ingestion, harmonization, and marketing analysis, rather than a general-purpose charting package. Datorama's historical materials describe a Marketing Integration Engine, API connectors, flat-file connections, automated mapping and cleansing, custom calculated fields, cross-channel reporting, attribution, campaign pacing, and media-plan transparency. Salesforce documentation for Marketing Cloud Intelligence still describes integration of advertising, web analytics, CRM, and e-commerce data; its help materials discuss parent-child dimensions, data fusion, workspace-level streams and reports, granular event and log data, KPIs, and analytics. Salesforce therefore continues to document and support a product carrying the legacy Datorama identity. Salesforce also offers a separately named Marketing Intelligence product in Marketing Cloud Next, built around Data 360 and Tableau Next. The overlap in product names and marketing workflows makes roadmap clarity and customer migration a material diligence issue; the available documentation does not establish that the two products share architecture or that the legacy product has been retired.

The historical company showed commercial adoption before its sale. A contemporaneous 2013 report said four of Advertising Age's top twenty national advertisers were working with the platform within four months of its product release. Salesforce later reported more than 3,000 agency and brand customers at acquisition and named PepsiCo, Ticketmaster, Trivago, Unilever, Pernod Ricard, and Foursquare. These are dated company and media reports, not current customer counts, contract values, renewal figures, or proof that each named customer remains a Marketing Cloud Intelligence subscriber. A Salesforce customer quotation at the 2018 product integration launch described improved operational efficiency, but that statement is not an independently audited product outcome.

Datorama was founded in 2012 by Ran Sarig, Efi Cohen, and Katrin Ribant. Their reported backgrounds complemented one another: Sarig and Cohen held engineering leadership roles at MediaMind, while Ribant led a global big-data analytics unit at Havas Digital. The company scaled to roughly 400 employees by the 2018 sale, with about 130 in Tel Aviv, and its historical headquarters were reported in New York. Cohen later became a Salesforce Israel R&D leader and continued as a Datorama product and engineering executive under Salesforce in 2020. Current product leadership and standalone staffing are not disclosed. Salesforce's annual report records the acquisition of all outstanding Datorama, Inc. stock and about $766 million in acquisition-date fair value consideration transferred. This accounting amount includes cash, Salesforce stock, and assumed awards; press estimates above $800 million used a different transaction-value basis. It is an acquisition accounting disclosure, not Datorama's revenue or a standalone valuation multiple.

The core technology has a documented U.S. patent record under Datorama Technologies Ltd. Patent grants describe normalizing campaign data from advertising platforms, cross-platform analytics, processing queries over dynamically changing data models, and linking user-level data across media platforms. These patents reinforce the technical specificity of its data model and integration problem, but a patent grant alone does not establish current enforceability, maintenance, ownership chain, freedom to operate, or commercial moat. The product's historical advantage came from combining connectors, a marketing-specific data model, automated harmonization, and operational reporting in one managed service. Customers with simpler needs could use spreadsheets or standard BI. Large engineering teams could build connectors and models on a warehouse. Adobe Customer Journey Analytics has deeper ties to Adobe Experience Platform and customer experience analysis; Adverity and Funnel focus on marketing data extraction, cleaning, and harmonization, with warehouse delivery and measurement options. These alternatives make data portability, connector coverage, implementation time, field-mapping accuracy, and total cost more useful comparison points than broad claims of technical uniqueness.

Commercial diligence should distinguish the acquired product from Salesforce's wider marketing business. Salesforce stated that Datorama's financial contribution was not material to consolidated results in the period after acquisition, but this does not disclose standalone revenue, ARR, profitability, retention, burn, or customer concentration. A current third-party company page lists historical 2020 revenue and staffing figures without an underlying source, so those figures are excluded from validated metrics. Salesforce's acquisition accounting assigned value to developed technology and customer relationships, but those purchase-accounting values are not recurring revenue. The record supports the conclusion that Salesforce acquired a commercially adopted product and engineering team; it does not support an independent financial profile or a current customer count.

Datorama is not a live venture-backed company or a direct equity opportunity. Its strategic relevance is as a reference for building governed, domain-specific data integration and analytics inside a large software suite. The architecture has general technical transferability to operations data, but the product was marketed for commercial marketing workflows. Salesforce states that Marketing Cloud Intelligence (Datorama) does not currently support connections to Government Cloud. No defense customer, government contract, classified deployment, or security certification was verified. For that reason, the record does not treat the asset as a validated dual-use defense product; any security use would require a separate product, deployment, and authorization case."""
