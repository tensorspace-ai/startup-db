name = "Datorama"
description = "Datorama was an Israeli-founded marketing intelligence company whose cloud platform connected, harmonized, analyzed, and visualized fragmented advertising, CRM, web, commerce, and campaign data. Salesforce completed its acquisition in 2018, and Datorama is now the legacy product identity behind Marketing Cloud Intelligence."
detailed_description = """Datorama built a domain-specific data integration and analytics layer for marketing organizations. Its platform ingested data from advertising platforms, web analytics, CRM, e-commerce, publishers, and other marketing systems; mapped heterogeneous fields into a common model; and exposed the result through dashboards, reports, visualizations, and analysis workflows. The important technical problem was not simply drawing charts. It was maintaining relationships between dimensions and measurements across sources so that spend, delivery, engagement, revenue, and campaign attributes could be compared without every enterprise building its own collection of connectors and transformation logic.

The product was aimed at enterprises, agencies, and publishers with large, distributed marketing operations. Salesforce said at the time of acquisition that Datorama served more than 3,000 global agencies and brands and helped customers automate reporting and optimize campaigns. Current Salesforce documentation describes the successor product, Marketing Cloud Intelligence, as a system for connecting, harmonizing, visualizing, and acting on marketing data, including API connectors, custom field mapping, data fusion, granular data ingestion, KPI reporting, predictive analysis, and media-plan transparency. This provides current evidence that the core capability remains commercially supported, although product naming, packaging, and architecture now sit inside Salesforce rather than an independent Datorama roadmap.

The competitive position was strongest where marketing data was too fragmented for a standard BI deployment but too operationally important for spreadsheets and manual agency reporting. Its differentiation came from prebuilt source integrations, an opinionated marketing data model, domain-specific harmonization, and workflows for attribution, budget pacing, and cross-channel performance. Substitutes include Adobe, Tableau, Looker, specialist marketing ETL providers, and internal cloud data warehouses. Those alternatives can be more flexible or broader, while Datorama's advantage was faster time to a usable marketing view and less bespoke data engineering for a defined domain.

Commercial traction is evidenced by Salesforce's acquisition and its contemporaneous customer and product claims, but those claims should not be read as current independent-company metrics. Salesforce completed the acquisition on August 20, 2018; Salesforce now identifies Datorama as the legacy name for Marketing Cloud Intelligence, and its documentation continues to reference the former name. The standalone employee count, revenue, and current customer concentration are not reliably disclosed. The historical Israeli development base is relevant to the company’s origin, but the asset should be evaluated as part of Salesforce’s mature enterprise portfolio, not as a live venture-backed startup.

There is credible but limited dual-use relevance. The underlying pattern—multi-source ingestion, schema harmonization, entity and hierarchy management, access-controlled analytics, and decision-oriented visualization—can support intelligence fusion, operational reporting, logistics analysis, and security monitoring. That is a transferable architecture pattern, not evidence that Datorama was built for defense, handled classified data, or held government contracts. Salesforce documentation also states that Marketing Cloud Intelligence does not currently support connections to Government Cloud, which reinforces the need for caution. Its strategic value is therefore as a commercial reference architecture and incumbent capability, not as a deployable national-security product or an independent investment target."""
