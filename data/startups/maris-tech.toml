investment_rationale = """Maris-Tech is strategically relevant but should not be treated as a conventional private-startup priority signal. Its public-company status, established product catalog, and reporting obligations make it more useful in a supplier, capability, or public-market diligence set than in a venture-sourcing funnel. The technology addresses a real constraint in distributed sensing: extracting and transmitting useful video when platform power, bandwidth, and latency are limited.

The positive case rests on product breadth across ruggedized systems, appliances, and OEM modules, plus credible adjacency to defense, homeland security, unmanned platforms, and commercial remote operations. The negative case is that this is a demanding hardware-and-integration business exposed to long qualification cycles, component and supply-chain issues, uneven program timing, and competition from better-capitalized incumbents. Public disclosures should be reviewed for revenue concentration, cash needs, dilution, gross margin, customer conversion, and the proportion of defense-related demand before drawing stronger conclusions. This record therefore preserves strategic relevance while keeping the legacy investible flag false."""
strategic_value = """Maris-Tech has high strategic value as a potential enabling supplier for allied edge-intelligence and remote-platform ecosystems. Its products target a practical gap between raw camera payloads and full mission software: compact systems that can capture, compress, route, and analyze video close to the point of collection. That can improve responsiveness and reduce dependence on continuous high-bandwidth links in ISR, perimeter monitoring, tactical mobility, maritime observation, and autonomous systems.

The value is highest when a platform builder needs a modular subsystem with low-SWaP characteristics and does not want to develop the complete video pipeline internally. The company is not, based on the available evidence, a complete defense prime, autonomy provider, or assured source of mission outcomes. Strategic diligence should test interoperability, cyber and export-control posture, field reliability, software-update practice, component longevity, and evidence of repeat production."""
