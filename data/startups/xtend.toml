dual_use_description = "XTEND's core capabilities have substantive defense and civilian applicability, although defense is the dominant market. Human-supervised autonomy, remote multi-robot control, indoor mapping, counter-UAS, and resilient operation can support military and homeland-security missions as well as critical-site monitoring, hazardous industrial inspection, emergency response, and public-safety operations. The civilian opportunity is credible but should not be overstated until commercial customer mix, recurring software revenue, and non-defense deployments are disclosed."
