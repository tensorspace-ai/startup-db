name = "Hoopo"
description = "Hoopo (Hoopo Systems Ltd) is an Israeli industrial IoT company that builds decade-lifetime, self-powered trackers and a fleet-intelligence platform for unpowered assets — dry shipping containers, chassis, trailers, airport ground support equipment, and waste roll-offs — that have no onboard electrical supply and therefore fall outside conventional telematics. Its hoopoSense Solar, Titan, and standard trackers combine power-optimized geolocation with built-in door-opening and tamper detection, and are deployed by shipping line ZIM, DHL, Japan Airlines, Nippon Express, and container lessors DCLI and FlexiVan."
detailed_description = """
**Product and the concrete problem it solves.** Roughly 26 million dry shipping containers move through global trade, alongside millions of chassis, trailers, airport dollies, tow bars, and waste roll-offs — and almost none of them have a power source. That single fact is why the telematics revolution that transformed trucks, ships, and aircraft largely skipped the assets those vehicles actually carry. Conventional trackers assume either a vehicle power bus or a battery that someone will replace every year or two; neither assumption survives contact with a steel box that spends twelve to fifteen years crossing oceans, sitting in yards, and passing through operators who will never open a maintenance ticket for it. The operational consequence is a visibility hole: fleet owners cannot say where an idle chassis is, whether a container is loaded or empty, when it entered or left a terminal, or whether its doors were opened in transit. Hoopo's proposition is narrow and concrete — make the tracker outlive the asset, install it once, and never touch it again. Its hoopoSense Solar is specified for **12+ years of zero-maintenance operation**, hoopoSense Titan for up to 10 years, and the baseline hoopoSense for up to 8, with an optional stealth installation for theft-sensitive deployments.

**Core technology and how it actually works.** Hoopo's engineering problem is a power budget, not a positioning breakthrough, and the company's history shows how its answer evolved. Its earliest public identity (2018–2019 coverage described it as a **"GPS-free geolocation"** company) rested on **low-power wide-area network (LPWAN) infrastructure** — LoRa-based tracking devices, a dual-mode LoRa/cellular variant, a miniature mobile access point, and software-defined outdoor gateways — combining **edge-embedded algorithms with LPWA connectivity** to derive location while minimizing radio and compute draw. The current commercial platform is GNSS-enabled rather than GNSS-free, which is an honest evolution: the differentiation now lives in energy harvesting, duty-cycling, and sensing rather than in avoiding satellites. hoopoSense Solar uses a **solar panel the company describes as military-graded**, specified to harvest usefully in shadow and sub-optimal light — the practical requirement for a device mounted on a container stacked six high in a yard. Around that sits the sensing layer that makes the data operationally useful: **built-in door-opening detection claimed at 99% accuracy** with no external door sensor to install or fail, container mount detection, shock and tamper alerts, temperature monitoring, and location breadcrumb history. The Solar unit is certified to **ATEX Zone 1**, the European standard for equipment in potentially explosive atmospheres, which is what permits deployment on LNG-fueled vessels — a specific, verifiable certification rather than a marketing claim. On top of the hardware sits a fleet-intelligence platform that fuses tracker telemetry with bill-of-lading data and port geofencing to produce gate events, dwell analysis, utilization, and ETA updates.

**Market, customers, and go-to-market.** Hoopo sells into four defined verticals — maritime containers, chassis and trailers, airport ground support equipment, and waste hauling — with a consistent economic pitch: the company advertises **up to 20% fleet efficiency gain, up to 15% more billable days, and up to 10% operational cost reduction**. That is an asset-utilization argument aimed at capital-intensive fleet owners, which is a credible wedge because the buyer already knows the size of the hole. The customer roster published by the company is the strongest evidence in the record and is unusually blue-chip for a company of this size: **ZIM Integrated Shipping Services, DHL, Japan Airlines, Nippon Express, Konoike Transport, DCLI, FlexiVan, Marguisa, SPARX Logistics, Allied Transportation Logistics, CTrans, and Pascon**. Go-to-market is anchored on shipping lines and lessors who can standardize across tens of thousands of units, supplemented by standards and consortium participation — the company lists engagement with **ANSI, ISO, SMDG, the Smart Container Alliance, and ALICE**, which matters in an industry where data interoperability between carriers, terminals, and shippers determines whether tracker output is actionable. Operations span the **USA, Europe, and Japan**, and the company now lists a **North America general manager**, indicating a deliberate US commercial build-out.

**Traction, funding, and third-party validation.** Hoopo's capital history is modest and staged: **$1.5M pre-seed in January 2018** (TAU Ventures, Zohar Gilon, Ben Marcus and others); **$3.5M seed in June 2019** (Chartered Group, TAU Ventures, Global IoT Technology Ventures); and a **$10M Series A announced August 11, 2022**, co-led by **ZIM Integrated Shipping Services and theDOCK Innovation Hub**, with returning investors Hico Ventures and TAU Ventures. **ZIM alone put in $5.5M**, making the largest customer also the largest strategic investor — a double-edged signal discussed below. CTech reported total capital of **$17M** at the Series A; some commercial databases list roughly $20M, and no Series B is publicly disclosed. The most substantive validation is not the money but the deployment: in **November 2024 ZIM announced a global smart-container rollout using hoopoSense Solar**, with ZIM's CEO framing it as transforming container visibility — a production commitment from a publicly listed carrier rather than a pilot. Third-party recognition includes **2026 Industrial IoT Product of the Year** for hoopoSense Solar, **IoT Asset Tracking Award 2025**, **IoT Business Impact Award 2025**, and a **2024 Top Supply Chain Projects** award. Revenue, ARR, unit volumes, headcount, and valuation are all undisclosed.

**Founders and team background.** Hoopo was founded in **2016** by **Ittay Hayut, Ilan Lozovsky, Daniel Avitzour, Erez Aviv, and Menachem Tipris**. Notably for a company approaching its tenth year, four of the five remain in operating roles: **Hayut as CEO, Aviv as COO, Lozovsky as CTO, and Tipris as SVP Engineering** — founder retention at that depth is a genuine, if underweighted, diligence signal in hardware businesses where institutional knowledge of a power budget and an RF stack is difficult to re-hire. Around the founding core the company has assembled a commercial bench: **Jeanne Flavian (CBO), Michal Rahimi Bar Nathan (CFO), Danny Nissim (SVP R&D), Tal Leemor (SVP Marketing & Partnerships), Marianna Levtov (SVP Strategic Alliances), Al Tama (SVP & GM North America), and Gil Lehmann (SVP Operations)**. Lehmann's arrival from a global logistics leadership role at ZIM is the most legible hire — domain operator rather than generic executive. No prior founder exits, patent grants, or headcount figures are publicly disclosed, which are meaningful gaps.

**Competitive dynamics.** This is a contested category with well-capitalized entrants. (1) **Nexxiot** (Switzerland) and **Traxens** (France, CMA CGM-backed) attack the same smart-container problem with carrier and rail alignment, and Traxens in particular has shipping-line backing structurally similar to Hoopo's ZIM relationship. (2) **ORBCOMM** is the incumbent scale player in container and trailer telematics with an installed base and satellite backhaul that Hoopo must displace or coexist with. (3) **Globe Tracker** competes strongly in reefer and container telematics. (4) **Samsara** and similar fleet-telematics platforms dominate *powered* assets and can extend downward into trailers, bringing far larger platform budgets. (5) **Tive** and Israeli peer **Sensos** attack adjacent shipment-level visibility with disposable or short-life trackers — a different economic model aimed at cargo rather than the asset carrying it. Hoopo's defensible edges are specific rather than sweeping: a 12-year zero-maintenance service life that changes the total-cost-of-ownership arithmetic for asset owners; door detection integrated into the tracker body rather than as a separate sensor with its own failure and installation cost; ATEX Zone 1 certification opening LNG-vessel deployment; and a production rollout with a listed global carrier. What it does not have is a scale advantage, a proprietary positioning technology moat, or disclosed patent protection.

**Defense, security, and resilience dual-use relevance.** The dual-use case here is **adjacency by customer segment, not a defense capability**, and should be read that way. The honest positive case: militaries and allied logistics organizations are among the world's largest operators of exactly the asset classes Hoopo addresses — ISO containers, flatracks, unpowered trailers, and ground support equipment — and in-transit visibility for such assets is a long-standing, formally recognized defense logistics requirement. A tracker that installs once, needs no maintenance for a decade, harvests its own power, and reports unauthorized door openings maps directly onto military container-security and asset-accountability needs without any technical modification. Port and terminal visibility is likewise a critical-infrastructure resilience problem, and Hoopo's early **GPS-free geolocation** heritage is architecturally interesting in a region where GNSS jamming and spoofing are routine, though the current commercial product is GNSS-enabled. The calibration that should dominate: **no defense customer, military program, government contract, security agency deployment, or defense evaluation appears anywhere in the public record.** All disclosed customers are commercial carriers, lessors, and logistics providers. There is no evidence of MIL-STD qualification, export-control posture, or hardened variants. This is a commercially focused logistics-IoT company whose product would transfer cleanly into defense logistics if a customer pursued it — a real adjacency, and nothing more than that today.

**Growth stage, trajectory, and key diligence risks.** Hoopo reads as **mid-stage**: founded 2016, roughly $17–20M raised, a 2022 Series A, named blue-chip customers, a production global rollout with a listed carrier, industry awards, a formal certification, and a US commercial organization — materially past product-market discovery, but well short of scale, with no Series B disclosed nearly four years after the Series A. Principal diligence risks, roughly in order: (1) **Customer concentration entangled with the cap table** — ZIM is simultaneously the flagship customer, the largest single investor at $5.5M, and the source of a senior operating hire; that is excellent validation and a genuine dependency, and no revenue breakdown exists to size it. (2) **Funding gap** — the interval since the 2022 Series A, absent a disclosed follow-on, invites questions about capital efficiency, revenue self-sufficiency, or difficulty raising in a hardware category. (3) **Longevity claims are unfalsifiable today** — a 12-year service life on a product line in market for a fraction of that period cannot yet be validated by field data, and warranty exposure on decade-lifetime hardware is a real balance-sheet question. (4) **Commoditization** — trackers are hardware in a category with Chinese and incumbent low-cost supply; durable margin depends on the software platform and integrations, which are less differentiated than the device. (5) **Competitive capital asymmetry** — Nexxiot, Traxens, ORBCOMM, and platform players like Samsara can outspend a company of this size. (6) **Disclosure opacity** — no revenue, ARR, unit volume, headcount, valuation, or patent position is public, and all performance metrics (99% door-detection accuracy, 20% efficiency gain) are company-stated without third-party benchmarking. (7) **Jurisdictional drift** — the company is Israeli-founded and Tel Aviv-headquartered per public records, but its own about page now lists a **Phoenix, Arizona** address, so the location of R&D versus commercial operations is not cleanly resolvable from public sources. Evidence that would move the assessment: a disclosed Series B, published deployment volumes, a second carrier at ZIM's scale, granted patents, or any first defense-logistics engagement.
"""
