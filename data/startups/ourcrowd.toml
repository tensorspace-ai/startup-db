name = "OurCrowd"
description = "Jerusalem-headquartered private-market investment platform that gives accredited investors and institutions access to curated startups, venture funds, and other alternative assets. OurCrowd combines sourcing, diligence, syndication, fund administration, and portfolio support; it is a financial-market intermediary rather than a proprietary defense-technology developer."
detailed_description = """
OurCrowd operates a global venture and alternatives investment platform founded in Jerusalem in 2013. Its public offering spans individually selected startups, managed and rule-based venture funds, late-stage private companies, and other private-market alternatives. The platform is oriented toward accredited investors and institutional participants, while portfolio companies can receive introductions, recruiting assistance, industry mentors, and connections to multinational partners. OurCrowd therefore combines elements of a venture investor, syndication platform, fund manager, and investor-relations operation rather than selling a single software product.

The core operating capability is a repeatable private-market workflow: source companies through an international network, screen and diligence them, secure allocations alongside institutional or venture co-investors, structure the opportunity for eligible participants, and provide ongoing reporting after the transaction. OurCrowd says its investment team reviews roughly 150–200 companies per month and selects only a small subset for opportunities on the platform. It also states that it invests its own capital alongside its investor community. These claims are company-reported, but they describe a meaningful process advantage if the organization can maintain diligence quality and access through changing venture cycles.

The customer problem is access and intermediation. Family offices, high-net-worth individuals, corporations, and institutions may want exposure to private technology markets without recreating a global sourcing network, investment committee, legal workflow, and portfolio-monitoring function. OurCrowd lowers that operational barrier, but it does not remove the fundamental risks of private investing: securities are illiquid, valuations are difficult to compare, outcomes are highly dispersed, and eligibility and disclosure rules vary by jurisdiction. An October 2025 company one-pager reports $2.6 billion in committed funds, 500 portfolio companies, 68 funds, 73 exits, and seven incubators; these are useful scale signals but remain company-reported and should be reconciled against audited, regulatory, and fund-level materials before being used for hard underwriting. The figures also describe different measures of activity, so they should not be treated as equivalent to realized investor returns.

Competition is broad rather than limited to one direct peer. AngelList, Republic, Wefunder, and SeedInvest compete for online access and syndication; EquityZen and Forge address secondary private-market transactions; traditional venture firms, private banks, fund-of-funds managers, and direct institutional relationships are important substitutes. OurCrowd’s differentiation is its Israeli innovation network, recognizable global brand, curated deal presentation, ability to offer both direct opportunities and funds, and claimed practice of investing alongside members. The defensibility of that position depends on continued proprietary or preferential access, disciplined selection, investor trust, regulatory execution, and portfolio outcomes. A polished interface alone is unlikely to be a durable moat in a crowded private-market infrastructure category.

For national-security and dual-use analysis, the relevant asset is the network rather than the platform technology. The October 2025 one-pager describes exposure across AI, enterprise software, cybersecurity, mobility, energy, and other categories; some portfolio companies may have security applications, but portfolio composition is not proof of defense revenue or government adoption. OurCrowd’s public communications also highlight portfolio activity in space and security-adjacent areas, which creates ecosystem and dealflow relevance for strategic readers. It does not establish that OurCrowd itself develops, deploys, certifies, or operates military systems, nor that every security-adjacent portfolio company has defense traction. The company should consequently be treated as an access and intelligence node with indirect dual-use relevance, not as a defense startup or a substitute for technical, export-control, customer, and program-level diligence on individual portfolio companies.
"""
