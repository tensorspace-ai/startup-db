name = "NanoLock Security / OTOPIQ"
description = "OTOPIQ Security is the current operating identity built on NanoLock Security's device-level, zero-trust OT protection technology. Its platform helps industrial and critical-infrastructure operators discover, control, monitor, and recover the controllers and other devices that run physical operations."
detailed_description = """OTOPIQ Security launched in 2025 around NanoLock Security's existing device-level OT security technology. The platform is positioned around four functions—Discover, Protect, Detect, and Recover—and is designed to secure PLCs, industrial controllers, and other OT assets across connected, remote, and air-gapped environments. Its core proposition is prevention at the device and operational layer: authenticated and authorized changes, secured device credentials, visibility into user and device actions, detection of abnormal behavior or configuration changes, and restoration of a trusted state. This complements network monitoring, SIEM, SOC, and remote-access controls rather than making those controls unnecessary.

The customer problem is concrete. Industrial sites often contain mixed generations and vendors, legacy controllers that cannot accept conventional agents, remote assets, and third-party maintenance workflows. A malicious or accidental change to PLC logic, firmware, credentials, or configuration can affect uptime, safety, product quality, and regulatory exposure. OTOPIQ's vendor-agnostic and low-disruption positioning is therefore relevant to manufacturing, energy, water, and other operators that cannot readily replace or re-engineer installed equipment. The commercial opportunity is supported by the broader requirement to reduce operational risk, but adoption still depends on proving safe deployment, protocol coverage, measurable reduction in downtime or investigation effort, and compatibility with existing engineering procedures.

The competitive field includes OT asset visibility and network-detection platforms such as Claroty, Nozomi Networks, and Dragos; broader cyber-physical exposure-management platforms such as Armis; and industrial security products from large vendors such as Siemens, Microsoft, and Fortinet. OTOPIQ's potential distinction is a protection-first control plane for the device state itself, especially where assets are legacy, intermittently connected, or air-gapped. That distinction is credible as a product thesis, but it is not automatically a durable moat: incumbents can add enforcement, privileged-access, configuration-management, or recovery features, while integrators and device manufacturers can remain powerful routes to market.

Public evidence indicates meaningful commercialization history under the NanoLock name, including OT Defender general availability in North America, international expansion activity, a 2021 Series B, a 2025 strategic investment by Grupo Bimbo Ventures, and a 2025 OTOPIQ launch backed by Awz Ventures. Those signals support an active venture-backed company, but they do not establish current recurring revenue, customer concentration, retention, deployment scale, or independent validation of performance. The current OTOPIQ identity and small public team also make the transition, ownership structure, product continuity, and go-to-market execution important diligence topics.

The technology has credible dual-use relevance because the same integrity and access-control problem exists in civilian critical infrastructure, defense-support facilities, and other mission-critical OT. Protecting controllers from unauthorized changes can reduce cyber and insider risk in systems that affect power, water, communications, logistics, or production. The record should not be read as evidence of military deployment or government contracts: the strategic case is based on capability fit and Israeli cyber expertise, while actual defense traction remains unverified in public sources."""
