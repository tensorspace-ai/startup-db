use_cases = ["Potential civil cargo delivery to sites without runway access", "Potential industrial infrastructure inspection and aerial scanning", "Potential surveying and remote-area assessment", "Potential emergency supply or disaster-area access", "Potential security observation or remote resupply, subject to payload, qualification, and authorization"]
