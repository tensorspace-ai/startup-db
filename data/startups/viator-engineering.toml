dual_use = true
dual_use_description = "A VTOL UAV intended for cargo and far-field use has plausible civilian applications in delivery, remote inspection, surveying, and emergency access. Similar runway-independent aircraft can support security observation, border monitoring, or remote resupply if equipped and qualified for those missions. Viator's patent and product description establish an aircraft engineering effort, but no source reviewed identifies a defense customer, military contract, security deployment, ISR payload, or defense certification. The dual-use assessment is therefore about technical applicability, not demonstrated defense revenue or deployment."
