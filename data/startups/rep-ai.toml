name = "Rep AI"
description = "Israeli-founded B2B commerce software that combines behavioral shopper detection, conversational product guidance, and ecommerce support automation."
detailed_description = """Rep AI is the current ecommerce software company operating under the Rep AI brand, associated with the Israeli private company REP.AI LTD. (Israeli company number 516107901) and the earlier Voicefront name. Its product is aimed at online retailers: a merchant connects a product catalog, store policies, and commerce systems; Rep then uses behavioral signals and a language-model interface to offer help during a shopping session, answer product questions, compare items, recommend products, and support actions such as order tracking, cancellations, returns, and exchanges. The current product also advertises an AI helpdesk, email and social messaging, WhatsApp, and conversation analytics. The live site advertises separate sales, support, and combined concierge plans beginning at US$99, US$49, and US$118 per month respectively, a 14-day trial, and a 5x ROI guarantee. These are company marketing and pricing statements, not evidence of realized customer economics.

The product thesis is that a conventional chat widget waits for a question, while a behavioral layer can notice hesitation, repeat browsing, comparison activity, or likely exit behavior and start a contextual interaction. Rep describes its Rescue Algorithm as evaluating more than 500 behavioral data points. That technical description is the company's own claim; public sources do not expose model architecture, datasets, controlled performance tests, or comparative error rates. A June 2026 support article describes importing the most recent Shopify order context, including variant and refund status, to personalize a returning customer's interaction. This illustrates a useful product direction: combine storefront activity with permitted commerce context, then route a customer from product guidance to post-sale resolution.

The public company story spans an earlier voice-commerce product called Voicefront and a later behavioral ecommerce concierge. A 2020 interview described Alexa and Google Assistant shopping; the current website describes web-based behavioral selling, commerce actions, and support. The founders named by the current company site are CEO Yoav Oz and CTO Shauli Mizrahi. Osage describes Oz's earlier SpotAd operating role and Mizrahi's prior VP of R&D work at Browsi. The current offer is B2B software sold to merchants, with entry-level list prices and a wider platform/enterprise motion. There is evidence of a live product and financing, but public revenue, retention, customer concentration, gross margin, and enterprise contract values remain unavailable."""
