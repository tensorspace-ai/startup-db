name = "Kaltura"
description = "Kaltura, Inc. is a Nasdaq-listed enterprise video and rich-media software provider. It combines video creation, management, delivery, learning and event workflows with a growing set of AI-generated and conversational experiences."
detailed_description = """
Kaltura, Inc. is a Delaware-incorporated software company founded in 2006 and headquartered in New York. Its largest operating hub and primary research-and-development center is in Bnei Brak, Israel. The company sells software subscriptions and platform services to enterprises, educational institutions, media companies and telecommunications operators. Its enterprise video and rich-media platform manages content from creation and ingestion through encoding, metadata, access control, captioning, search, delivery, analytics and reuse. Customers can deploy video portals, learning-management extensions, virtual classrooms, lecture capture, live events and webinars, internal communications libraries, and cloud television applications. Kaltura's product scope is broader than meeting recording or public video hosting: it includes organizational governance and integrations as well as media and telecom delivery workflows.

The commercial model is built largely on recurring SaaS and PaaS subscriptions, with professional services and some term-license revenue. Kaltura reports through Enterprise, Education and Technology (EE&T) and Media and Telecom (M&T) segments. EE&T represented 74% of 2025 revenue and grew 4% that year, while M&T represented 26% and declined 7%. The company says large enterprise and institutional customers make up the substantial majority of subscription revenue, and often deploy multiple products across departments. At December 31, 2025, it reported more than 800 customers, including 30 U.S. Fortune 100 companies and over 40% of U.S. R1 universities; over 60% of customers used at least three Kaltura products. These are company-reported reach and adoption figures, not independent market-share measurements. The same filing reports that the ten largest customers generated 31.5% of 2025 revenue and Vodafone alone accounted for 10.1%, an exposure that merits renewal and concentration diligence.

The financial profile is mature but low growth. Revenue for 2025 was $180.9 million, up 1% from $178.7 million in 2024, including $171.9 million of subscription revenue. In the second quarter of 2026, revenue was $46.894 million, 5% above the prior-year quarter; EE&T grew 11% while M&T declined 10%. ARR at June 30, 2026 was $184.570 million, up 8% year over year, and management attributes part of the increase to the PathFactory acquisition. The quarter still produced a GAAP net loss of $5.544 million, and net dollar retention was 96%. The combination of recurring revenue, broad installed use, limited overall growth and an ongoing GAAP loss makes renewal quality and sales efficiency more important than headline customer counts.

Kaltura is repositioning its platform around agentic digital experiences. It describes three connected layers: content creation, content management and intelligence, and interactive conversational experiences. Product examples include automated captions, transcripts, translation, AI-assisted search and summaries, generated video, and photorealistic conversational avatars. In 2025 the company acquired eSelf.ai, whose live avatars add low-latency speech, multilingual interaction and screen-aware experiences. It completed the acquisition of PathFactory in April 2026 for $22 million cash, adding content-intent signals, content journey orchestration, personalization and analytics. In June 2026 it paid $638,000 for substantially all assets and certain liabilities of BlueRush, which it said would strengthen personalized video and digital engagement. These acquisitions broaden the architecture and sales story, but require integration, product consolidation and proof of customer value. Kaltura's Q2 release reported a record fourteen deals including AI offerings, nine involving Agentic Avatars and eight with new logos. That is an encouraging company-reported booking indicator; the release did not disclose contract value, recurring revenue recognized from AI, production usage, or renewal outcomes for those offers.

The competitive position depends on use case. Kaltura's 2025 Form 10-K names Microsoft and AWS among cloud and productivity platform competitors; Brightcove and Vimeo in enterprise video and media; Synthesia in AI video creation; Microsoft, Zoom and ON24 in events and webinars; and Comcast, Synamedia and MediaKind in cloud TV. Panopto is a close substitute in higher-education lecture capture and governed knowledge libraries. Kaltura's advantage is the ability to connect video portals, LMS and CMS integrations, live events, internal learning, conversational agents and television delivery on a single modular platform with APIs and enterprise controls. That breadth may reduce vendor sprawl for organizations with several video workflows. It can also increase implementation complexity and make product packaging less clear. Microsoft, Zoom and other suites can bundle adequate recording or event functions; specialists can offer simpler onboarding or stronger depth in one task; and avatar generation, transcription, translation and retrieval are rapidly contestable capabilities.

The company has a long-tenured founder-led CEO and a management group with relevant product, finance and commercial experience. Ron Yekutiel has led the company since its inception and previously founded businesses in video surveillance and GPS navigation. Co-founder Shay David remains a Kaltura director and has held operating roles; co-founders Michal Tsur and Eran Etam are historical rather than current executives in the latest filings reviewed. The 2025 filing identifies Eynav Azaria as Chief Product, Engineering and Marketing Officer and Natan Israeli as Chief Customer and Commercial Officer; it identifies Claire Rotshten as EVP of Finance and Liron Sharon as EVP of FP&A. As of the August 2026 quarterly filing, Sharon was Interim Principal Financial Officer and Rotshten Interim Principal Accounting Officer. Kaltura had 494 employees across 20 countries at year-end 2025. The Israel engineering and operating center is strategically relevant to talent and Israeli ecosystem exposure, while the New York headquarters and Nasdaq listing define its legal and capital-market identity.

Technically, Kaltura's accumulated value is more likely to reside in product integration, content workflows, metadata, permissioning, APIs, customer-specific configurations and operational experience than in a large patent estate. The company reported eleven issued U.S. patents and eighteen non-U.S. patents at year-end 2025, alongside copyright, trade-secret, trademark and contract protections. Its annual report also describes security, privacy, accessibility and compliance requirements as important product design factors, with regional and dedicated deployment options. Those statements establish product intent; they do not establish certification for a particular government network, air-gapped operation, classified-data environment or defense procurement regime. Buyers should validate tenant isolation, data location, subprocessors, retention and deletion, model-training controls, identity integration, audit export and incident response against their own standards.

Kaltura's near-term strategic test is whether the acquisitions and AI product layer can generate durable recurring revenue without distracting from core renewals. The company has reported a 96% net dollar retention rate for Q2 2026, elevated M&T churn during 2025, and one customer at 10.1% of 2025 revenue. The acquisition activity adds product and go-to-market execution risk, while the company's public disclosures do not yet separate revenue, gross margin, retention or pipeline conversion for agentic products. The public record therefore supports viewing Kaltura as a substantial, actively evolving enterprise software vendor and a useful strategic reference for governed video and digital engagement. It does not support treating its AI traction as proven scale or treating its government references as evidence of defense-specific deployment.
"""
