investment_rationale = "Sequent merits a positive legacy priority signal because it is applying serious cryptography to a high-consequence institutional problem with evidence of real deployment. 1) Technical differentiation: end-to-end verifiability, distributed trustees, mixnets, and open-source implementation address the trust gap that makes ordinary online forms unsuitable for sensitive elections. 2) Commercial evidence: official and customer case studies describe elections for Podemos and a German election-services provider, while public reporting places the platform above 300 elections and millions of voters. 3) Strategic relevance: democratic and election infrastructure is a resilience layer, especially for municipalities, overseas voters, and institutions operating under disruption. 4) Team fit: the founders and advisers combine cybersecurity, applied cryptography, formal verification, and election operations. Counterweights are material: public deployment and funding figures conflict, procurement cycles are long, the company remains small, and endpoint, coercion, availability, and regulatory risks cannot be solved by server-side cryptography alone. This is an internal diligence-priority flag, not an investment recommendation."
strategic_value = "Sequent's strategic value is concentrated in trusted democratic infrastructure. 1) It addresses election integrity through publicly checkable evidence rather than relying solely on vendor assurances, which is relevant to cyber resilience and information-environment defense. 2) Its open-source approach and cryptographic protocol work can support allied institutions that need auditable technology and wish to reduce dependence on opaque foreign systems. 3) Remote and hybrid voting can preserve participation for overseas citizens, dispersed workforces, municipalities, universities, and communities affected by disruption. 4) The platform's accumulated operational experience across multiple jurisdictions may become a valuable integration and election-management asset, even though the underlying primitives are publicly known. The strategic case is bounded: no public source reviewed here demonstrates military or classified deployment, and national-election suitability depends on jurisdiction-specific law, certification, threat modeling, and independent audits."
