name = "Sequent Tech"
description = "Sequent Tech is an Israeli-founded election-technology company building open-source, end-to-end verifiable online voting infrastructure for governments, municipalities, political organizations, universities, and other institutions. Its cryptographic platform is designed to preserve ballot secrecy while giving voters and auditors independently checkable evidence that ballots were cast, recorded, and counted correctly."
detailed_description = """**Product and the concrete problem.** Sequent Tech addresses a difficult infrastructure problem at the intersection of democratic legitimacy, cybersecurity, accessibility, and operational cost: how to let people vote remotely without asking the public to trust an opaque server, a private tallying process, or a vendor's uncheckable claim that the result is correct. Conventional paper and in-person elections have visible procedures but can be expensive, slow, inaccessible to overseas or mobility-constrained voters, and difficult to operate across many jurisdictions or ballot designs. Ordinary online forms improve convenience but create a severe trust gap because a voter cannot easily verify that an encrypted ballot was included in the tally or that the published result corresponds to the ballots actually cast. Sequent's platform is positioned as a complete digital-election system for voters, election managers, and auditors. It supports election setup, voter authentication and ballot delivery, encrypted vote casting, distributed election administration, tallying, publication of evidence, and post-election verification. The target customers are governments, municipalities, political parties, universities, professional associations, and other public or private organizations that need a remote or hybrid election with a defensible audit trail."

**Core technology and how it works.** Sequent's technical proposition is end-to-end verifiability: the system aims to maintain voter confidentiality while producing evidence that the election's critical steps were performed correctly. The company's technical materials describe an open-source architecture built around established election cryptography rather than a proprietary black box. Votes can be encrypted on the voter's device, then passed through a cryptographic mixnet that shuffles and anonymizes ballots before tallying; distributed trustees participate in key creation, shuffling, and decryption so that no single operator needs to hold the entire secret. Sequent's research writing discusses ElGamal-style encryption, threshold distributed key generation, verifiable shuffles, zero-knowledge proofs, and browser-executed Rust/WebAssembly components for reducing duplicated cryptographic code between client and server. The practical result is a chain of checks: a voter can receive evidence that a ballot was recorded, auditors can inspect the published bulletin-board evidence and tally proofs, and the election authority can operate the workflow without learning individual ballot choices. These mechanisms do not make internet voting risk-free. Endpoint compromise, coercion, denial of service, identity fraud, weak operational procedures, and implementation defects remain material risks, which is why public code, independent review, protocol audits, recovery procedures, and transparent incident handling are central diligence requirements."

**Market, customers, and go-to-market.** Sequent sells a specialized B2B and B2G platform into organizations for which election integrity and administration cost justify a more complex cryptographic system. The company has published case studies describing online elections for Spain's Podemos political party and a German election-services provider, EPI, which integrated Sequent with its uniWAHL election-management software to offer online and hybrid voting to clients. The case studies show a deployment model that combines a hosted or dedicated environment, customer-specific election configuration, trustee administration, customer-success support, and integration with existing election-management workflows. The company has targeted North American municipalities, unions, universities, and public bodies, while its public materials also describe activity in Europe and global elections. CTech reported in 2026 that pricing was based on a per-voter model of approximately $1.20 to $2.50 and that the growth plan focused on the United States and Canada with European partner expansion. That is a coherent route to market because Sequent can sell infrastructure to organizations that already own voter relationships and regulatory responsibilities, but procurement is slow and election customers are risk-averse. A successful deployment can be sticky, while a single security incident can damage the category and the vendor simultaneously."

**Traction, funding, and validation.** Sequent has progressed beyond a laboratory demonstration. Its official company page says the platform has been implemented in more than 180 elections and counted 2.7 million votes; later CTech coverage reports more than 300 elections and more than 4.5 million voters, while a company announcement about 2026 Canadian municipal deployments gives still higher figures. The differing snapshots should be reconciled directly, but all point to real operating history rather than a slide-deck-only product. Public case material describes more than six electoral processes for Podemos, including a process serving more than 500,000 members, and CTech reported that Sequent powered the Philippines national overseas voting process in which more than 1.23 million citizens participated. Startup Nation Finder records a $1.35 million total across two pre-seed rounds, while CTech's 2026 startup profile reports $3.1 million total raised and a 15-person team; the discrepancy is another diligence item rather than a reason to discard the company. The investor and ecosystem record includes Fusion VC, GoAhead Ventures, RUNI Ventures, Kli Capital, Storytime Capital, and individual technology investors. Additional validation comes from the open-source codebase, public cryptographic protocol documents, technical writing, a customer integration case study, and a 2026 appointment of Gal Haselkorn as chief revenue officer."

**Founders and team background.** The founding team combines election technology, software engineering, cybersecurity, and applied cryptography. Sequent's official about page identifies Shai Bargil as co-founder and CEO, Eduardo Robles as co-founder and CTO, and David Ruescas as co-founder and head of research. CTech describes Bargil as an Israeli entrepreneur with engineering and cybersecurity experience, Robles as an engineer with cryptographic-system and open-source-architecture expertise, and Ruescas as a physics graduate who leads protocol design and formal verification. The advisory board listed by the company includes Dr. Joseph Kiniry, a principal scientist at Galois and leader in verifiable elections, Prof. Douglas Wikström of KTH, a cryptographic-protocol researcher, and Guy Barnhart-Magen, a cyber-security executive and former Intel security researcher. This is a credible technical provenance for a security-sensitive voting product, particularly because the hard problem is not just building a web interface but integrating cryptographic correctness, usability, election operations, and public accountability. The team is still small relative to the geographic and regulatory ambition. Public sources do not establish the full engineering organization, staff retention, security-clearance posture, or the proportion of research, implementation, customer support, and sales personnel, so those should be tested before treating the advisory depth as equivalent to production capacity."

**Competitive dynamics.** Sequent competes with several different categories rather than one direct peer set. Election-management and voting-system incumbents such as Smartmatic and Scytl compete on institutional relationships, election administration, and deployment scale. Online-election providers such as ElectionBuddy and Simply Voting offer convenience and broad organizational reach, but buyers may view their transparency and cryptographic-verifiability models differently. Open-source or academic systems such as Helios provide a reference architecture for verifiable online voting and can be adopted or extended by technically capable customers. Paper-based voting, mail ballots, and internally built systems remain powerful substitutes because they are familiar to regulators and voters even when they are costly or operationally cumbersome. Sequent's potential edge is the combination of open source, end-to-end verifiability, distributed trustees, hybrid-election support, protocol research, and an operating history across political, municipal, and organizational elections. That edge is not automatically a moat: cryptographic primitives are documented, public scrutiny exposes implementation weaknesses, and a buyer can assemble a system from open components or choose an incumbent with stronger procurement credentials. Defensibility must therefore come from audited implementation quality, operational playbooks, integrations, customer references, compliance evidence, and the accumulated expertise required to run elections safely at scale."

**Security, resilience, and dual-use relevance.** Sequent's core technology has a credible dual-use character, although its security relevance is democratic and institutional rather than military hardware. Commercial customers use the platform to run organizational elections, party contests, university ballots, and association votes; governments and municipalities can use the same primitives for public participation or legally recognized digital elections where regulations permit. The strategic application is election resilience: end-to-end evidence can make manipulation harder to conceal, open-source code can widen the pool of reviewers, and remote access can preserve participation when geography, disability, public-health conditions, conflict, or infrastructure disruption make physical polling difficult. A secure overseas-voting deployment can also help a state maintain links with citizens outside its territory, while hybrid support can provide fallback between paper and digital channels. The honest limitation is important: public sources establish deployments and technical positioning, not Israeli military customers, classified programs, or a guarantee that online voting is suitable for every national election. The highest-value diligence question is whether Sequent's cryptographic guarantees survive the full socio-technical system—identity issuance, voter devices, trustee operations, denial-of-service resilience, coercion mitigation, accessibility, incident response, and independent certification."

**Growth stage, trajectory, and diligence risks.** Sequent is best classified as early-stage but commercially validated. It was founded in 2021, remains a small private company, has disclosed only low-single-digit-million-dollar funding, and is still expanding distribution in North America and Europe. At the same time, the reported election deployments, multi-million voter exposure, named customer cases, public technical documentation, and 2026 commercial hiring indicate a product with meaningful field experience. The trajectory depends on converting project-based election deployments into repeatable annual recurring revenue, partner-led distribution, and trusted procurement status. Key diligence points are: 1) reconcile the conflicting public counts for elections, voters, and cumulative funding; 2) obtain independent security audits and penetration-test findings; 3) assess resistance to endpoint compromise, coercion, denial of service, and insider abuse; 4) verify the legal status and customer renewal rates of the largest elections; 5) understand gross margin, support burden, and per-voter economics; and 6) test whether open-source transparency accelerates trust or creates an integration and liability burden. Sequent's strategic upside is meaningful if it becomes trusted election infrastructure, but its category is politically sensitive, highly regulated, and unforgiving of operational error."""
