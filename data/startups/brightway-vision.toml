name = "BrightWay Vision"
description = "Bright Way Vision is an Israeli electro-optics company commercializing VISDOM, a CMOS-based near-infrared gated-imaging camera system for clearer vehicle perception in darkness, glare, fog, rain, and snow. Its GatedVision technology originated in defense imaging and is now positioned primarily for ADAS, autonomous vehicles, trucks, rail, and other special vehicles."
detailed_description = """Bright Way Vision develops GatedVision, an active gated-imaging architecture that combines eye-safe near-infrared illumination pulses with synchronized CMOS camera exposures. Rather than integrating all reflected light indiscriminately, the system captures selected range slices and suppresses backscatter from fog, rain, snow, mist, dust, and glare. The result is a high-contrast monochrome image intended to complement the vehicle's conventional RGB camera, not replace the entire perception stack. The company's VISDOM product packages a gated CMOS sensor, optics, pulsed NIR illuminator, and software/database components into configurations for ADAS, autonomous vehicles, trucks, trains, and special vehicles. The official product material claims configurations reaching roughly 200–300 metres, but those figures should be treated as product claims requiring independent test evidence for each operating condition and configuration.

The company was founded in 2011 as a spin-off of Elbit Systems and is headquartered in Israel; public company material identifies Haifa-area operations while third-party profiles list a Haifa address and an 11–50 employee range. Bright Way Vision's own company page states approximately 30 employees. The company says it has a portfolio of 26 patent families and that VISDOM is automotive-qualified, road-proven, in serial production, and ready for mass production. Its public market focus is automotive and transportation: L1+/L2+ driver assistance, L2+ and higher autonomous platforms, autonomous trucks, robotaxis, buses, and light rail. The company also says leading OEM and Tier-1 partners in Europe, the United States, and China have evaluated the system through proof-of-concept and adverse-weather testing. These are meaningful commercialization signals, but public sources do not establish a named production vehicle program, recurring revenue, unit volume, or current customer economics.

Bright Way Vision completed a reported $25 million Series B in 2019 led by Koito Manufacturing and Magenta Venture Partners, with Elbit Systems identified among the strategic investors. Koito's involvement is strategically relevant because lighting and optical-system integration can help an automotive sensor supplier move toward qualification and manufacturing. The long gap since that financing round creates an important diligence question: whether serial-production claims have translated into sustained design wins, production revenue, and sufficient capital for automotive support. The company competes with improving HDR cameras, thermal and SWIR imagers, imaging radar, lidar, sensor fusion, and AI-based low-light enhancement, as well as larger electro-optics suppliers. Gated imaging can be attractive where a clear image and object contrast are more useful than a sparse point cloud, but the added illuminator, optical alignment, eye-safety requirements, thermal management, cleaning, cost, and integration burden must be justified by measurable safety or uptime benefits.

The defense and national-security relevance is credible but should be described precisely. GatedVision originated from military-grade vision technology, and the same ability to obtain useful imagery in darkness and degraded visibility could support driver vision, perimeter monitoring, border security, unmanned ground systems, and other situational-awareness payloads. However, the current public product and partner messaging is overwhelmingly automotive and transportation oriented; this record should not infer active military contracts, deployment on armored platforms, or defense-prime partnerships without direct evidence. The dual-use thesis therefore rests on transferable sensing physics, Israeli defense heritage, and potential integration into security or military platforms, rather than documented current defense revenue. Key diligence should cover independent performance against thermal and SWIR alternatives, eye-safe laser classification, export-control exposure, supply-chain resilience, ownership and IP rights, production yield, warranty liability, and whether OEM qualification cycles can support a durable business at the company's present scale."""
