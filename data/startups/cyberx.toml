name = 'CyberX'
description = "CyberX was an Israeli-founded industrial IoT and OT cybersecurity company acquired by Microsoft in 2020. Its agentless network monitoring and asset discovery capabilities were acquired to extend Microsoft's IoT security offering; the product is now represented in Microsoft Defender for IoT."
detailed_description = """CyberX was founded in 2013 by Omer Schneider and Nir Giller, veterans of Israel's elite cyber security unit. It built network-based security monitoring for industrial IoT, operational technology (OT), and industrial control system (ICS) networks. Microsoft's 2020 acquisition announcement described the product's capabilities as discovering existing connected assets, mapping devices across factories and buildings, and surfacing asset profile and vulnerability information. This is a passive visibility and risk-management use case for networks where installing agents or interrupting operations can be impractical. Microsoft said the acquisition would complement Azure IoT security and help customers secure legacy devices and industrial environments.

Microsoft officially announced the acquisition on June 22, 2020, but did not disclose financial terms. Globes reported an estimate of $165 million, while Calcalist reported $170 million plus a separate employee-related amount. These are press estimates, not disclosed transaction consideration, so no numeric deal price is treated as fact. Investor CEZ Group's INVEN CAPITAL said Microsoft bought all other investors' shares in a 100% buyout agreement and that a special bonus was associated with its investment; its release gives no price. The founders were expected to join Microsoft and CyberX personnel would continue supporting and enhancing the platform. CyberX ceased to be an independent startup. Microsoft's current Defender for IoT page is the appropriate operating product reference; public evidence supports product continuity, not a separately reporting CyberX legal entity.

The disclosed equity history includes a $2 million June 2014 seed round led by Glilot Capital Partners, with Swarth Group, GlenRock, and angel Gigi Levy-Weiss; a $9 million round in August 2016 led by Flint Capital; an $18 million Series B in February 2018 led by Norwest Venture Partners; and an additional $18 million strategic round reported in March 2019. The 2018 announcement said cumulative funding was $30 million and described add-on Series A investments; 2019 reporting and investor sources place lifetime funding near $48 million. Reporting often labels the 2019 transaction simply as a round or equity financing, so it is represented as a separate late-stage equity event rather than assigned an unsupported series label. Historical round reports vary in the exact total due to treatment of early accelerator support and add-ons. No current cap table or individual ownership percentages are public.

The commercial evidence is concrete but dated. CyberX said in 2016 it had dozens of enterprise users. In 2018 it said its product was used by Global 2000 organizations in energy, utilities, chemicals, oil and gas, manufacturing, and other critical infrastructure sectors. In 2020, INVEN CAPITAL reported CyberX increased annual orders and won new customers, including several Global 2000 companies. These are company or investor statements; they do not identify named end customers, contract values, recurring revenue, retention, or deployment scale. The company reported tripled bookings for 2019 in a release carried by industry outlets, but no audited revenue or ARR was disclosed. Its platform and workforce joined Microsoft's IoT security organization, allowing distribution through Microsoft's enterprise ecosystem, though public sources do not isolate CyberX-derived sales from broader Defender for IoT results.

Technically, CyberX's differentiation was protocol-aware network analysis and industrial asset discovery without requiring endpoint agents. Its historical materials describe behavioral anomaly detection, industrial protocol support, risk and vulnerability assessment, network mapping, and threat intelligence. Such capabilities can benefit manufacturing, energy, water, chemicals, transportation, and other commercial operators. The same monitoring capability can protect infrastructure supporting public services and defense facilities, which establishes plausible dual-use relevance. The evidence reviewed does not establish a CyberX military contract, named defense customer, classified deployment, certification, or weapons-system deployment. Defense applicability should therefore be understood as a use-case assessment, not a claim of procurement or operational deployment.

The competitive landscape includes independent OT security vendors such as Claroty, Dragos, and Nozomi Networks, alongside broader asset and exposure management products from vendors including Armis and Tenable. The historic CyberX advantage was focused industrial visibility, passive deployment options, and specialized protocol knowledge. Its post-acquisition strengths are Microsoft's distribution, integration with cloud and security operations products, and ability to bundle OT visibility into a larger security platform. Independent specialists may retain deeper OT-specific workflows, customer trust, or vendor-neutral positioning. The acquisition removes standalone-company investibility and makes product roadmap, support, and differentiation dependent on Microsoft's priorities. Public evidence reviewed confirms the acquired technology's intended integration, but does not establish which original modules or patents remain in the current SKU.

Strategic diligence should establish how much of today's Defender for IoT functionality derives from CyberX, how Microsoft measures installed OT assets and paid deployments, and whether the product supports customer-required air-gapped configurations today. A further diligence point is intellectual property: no assignee-verified patent portfolio was identified in the sources reviewed, so neither a patent moat nor absence of patents can be concluded. Ownership terms, acquisition consideration, current product-specific revenue, named customer references, and current team composition remain undisclosed. The old employee estimate of 100–200 is not a current standalone headcount and should not be carried forward as current fact."""
