name = "BOND RF"
description = "BOND RF is an Israeli startup building a distributed, continuously operating radio-frequency monitoring network that helps drone, autonomy, defense, and infrastructure operators see GNSS jamming, spoofing, and changing RF conditions before a signal failure becomes an operational failure. Its current product combines a compact receive-only sensor with mapping software, while the company’s longer-term plan is to make spectrum conditions queryable across whole operating areas."
detailed_description = """**Product and operational problem.** BOND RF addresses the gap between the wireless signals that fielded systems depend on and the operator’s ability to know whether those signals remain trustworthy. Drone crews can check weather, batteries, and route plans before flight, yet may have no timely picture of whether GNSS is being jammed or spoofed along that route, or whether command links are becoming unreliable. A typical spectrum analyzer supplies a skilled engineer with a local reading at one location and moment; after the measurement ends, operators may again be blind. BOND’s first software product maps where GPS is functioning, jammed, or spoofed and how conditions change, so operators can inspect conditions before and during a mission. The immediate purpose is earlier warning and informed operating decisions, not a claim that the product defeats a jammer, guarantees navigation, or autonomously reconfigures aircraft. In a September 2026 CTech interview, the founders said a deployment detected interference before it was visible on a drone, allowing an operator to react before the aircraft was placed at risk; that is a company-reported example, not a published independent performance trial.

**Core technology and how it works.** The company describes two product layers. The current W1 sensor is a compact receive-only unit that listens across 30 MHz to 8 GHz; its published dimensions are 20 × 15 × 6 cm, its weight is 1.2 kg, and it draws about 6 W over a combined power-and-data cable, with wireless backhaul where cabling is impractical. The sensor does not transmit, which avoids adding an RF source of its own to the monitored environment. BOND says units can be clamped to existing poles, rooftops, and masts, supporting persistent monitoring without building a dedicated tower at every site. Its HIVE software combines observations from multiple sensors, classifies signals, maps likely interference sources, and presents the result as a live area view with alerts and an API. Multiple sensors hearing a signal at the same time can provide spatial context unavailable from a single point measurement; the company says historical observations can also be reviewed after an incident. The sensor network is intended to expand the current GNSS-focused software into broader RF intelligence. Public materials do not disclose its RF front-end design, signal-classification model, source-location error distributions, detection probability, false-alarm rates, or independent validation protocol, so technical performance claims should be tested in representative environments.

**Market, customers, and route to market.** BOND’s natural initial buyers are drone operators, autonomy developers, and defense organizations whose aircraft depend on reliable navigation and command links, with adjacent demand among aviation and airspace managers, telecom operators, critical-infrastructure owners, smart-city teams, and spectrum regulators. The purchasing case is strongest where an outage has an immediate cost: a drone mission abort, loss of positioning, or time-consuming field investigation. Rather than asking each customer to buy an expensive analyzer and staff it with an RF specialist, BOND proposes subscription software and a scalable sensor network that turns ongoing measurements into a map, alerts, and machine-readable data. The company’s site lists Israel Aerospace Industries, D-Fend Solutions, Kronomy, Robotican, Propeller Drones, Aerotor Unmanned Systems, ThirdEye, Kronos Group, Kela Technologies, Cando, and United Hatzalah as customer or trust logos; the site does not specify the commercial scope for each logo. A September 2026 CTech founder interview separately reported more than ten paying customers and named several of these organizations. The founders cited an approximately $30 billion broader spectrum-technology market estimate, but that is their framing rather than a validated serviceable-market calculation. Expansion from drone and defense use into telecom, cities, and infrastructure will require proof that the same low-cost, spatially distributed approach meets each buyer’s coverage, uptime, security, and procurement requirements.

**Traction, financing, and third-party signals.** CTech reported BOND was founded in 2026, had two employees at the time of the profile, and received $200,000 in pre-seed investment from Israel Aerospace Industries and Deel Ventures; it also reported the company won The Pitch by Deel. This is modest financing for a hardware-plus-network business and should not be conflated with a conventional institutional seed round. The same CTech interview says the company has working software and hardware, limited sensor units deployed in the field, more than ten paying customers, and two early drone-company pilots that helped shape the GNSS mapping product. Those are unusually concrete early operating signals, though they remain largely founder-reported and do not establish revenue scale, customer retention, contract duration, or independent technical acceptance. BOND’s public technology page includes an illustrative HIVE interface with a located jammer and reported confidence and location figures; these are product-interface examples, not audited benchmark results. The official website’s named references and the breadth of early adopters are useful channel and problem-validation clues, but the record contains no disclosed annual recurring revenue, backlog, gross margins, follow-on financing, patents, or formal certification. The company says it plans to expand engineering and sensor deployment and ultimately map major cities in Israel and abroad; those plans remain forward-looking.

**Founders and team.** BOND’s current official About page identifies Jonathan Gurvits as CEO and co-founder and Tomer Cohen as COO and co-founder. The September 2026 CTech profile likewise names Gurvits and Cohen as the two co-founders and says the company had two employees at the time of publication. CTech describes Gurvits as a former IDF electronic-warfare specialist who trained more than 100 spectrum controllers, and Cohen as a former UAV operator and commander who experienced signal disruption in field operations. The founders told CTech that they had worked together on businesses before BOND and left other jobs to pursue the problem. An older retained description named Oren Yokev as CTO and attributed substantial RF, embedded-systems, and technology leadership experience to him, but neither the current official leadership page nor the September profile lists him. His present role and the source of the earlier account are not established by the sources reviewed here, so that biography should not be treated as a verified current leadership fact. The publicly identified pair combines electronic-warfare knowledge with UAV operating experience, a relevant foundation for product discovery and customer conversations. The team remains small, and CTech reports plans to recruit a VP R&D; those plans do not establish a completed hire. Scaling RF hardware, software, deployments, and customer support simultaneously will test organizational depth.

**Competitive dynamics and edge.** BOND competes across adjacent categories rather than against one identical product. Rohde & Schwarz and Aaronia sell sophisticated spectrum monitoring and analysis systems; these can offer breadth and measurement depth but often involve specialist tools and point deployments. SkySafe provides drone detection and airspace intelligence, with a focus on detecting and analyzing drone activity rather than mapping ambient spectrum reliability for all wireless assets. D-Fend Solutions, acquired by Motorola Solutions in August 2026, uses RF cyber-detection and takeover to identify and mitigate rogue drones; that is a counter-UAS response system, not the same persistent spectrum-monitoring network. GNSS interference-monitoring and aviation services also overlap at the data layer. BOND’s proposed edge is economic and spatial: many smaller fixed sensors, already-present infrastructure, continuous observation, correlation across locations, and a dispatcher-readable map or API rather than a single expensive instrument read by an RF specialist. If cost and installation simplicity permit much denser coverage, the network could reveal where interference begins and how it moves, support retrospective analysis, and feed operational systems. That advantage is not yet proven at country or city scale. Competitors have established products, RF expertise, sales channels, and installed base, while BOND must demonstrate sensor calibration consistency, multi-vendor interoperability, coverage economics, and reliable classification in cluttered and adversarial environments.

**Defense, cyber-resilience, and dual-use relevance.** BOND’s core capability has substantive dual-use relevance because it observes and characterizes the radio environment used by both military and civilian systems. For defense, situational awareness of GNSS disruption and command-link conditions can help unmanned aircraft teams plan routes, preserve mission safety, distinguish local interference from broader outages, and investigate failed or degraded operations. It may also complement electronic-warfare planning and protection of distributed forces, although no public evidence establishes that BOND itself detects every military waveform or is fielded by a named military customer. For civilian resilience, similar monitoring can support drone fleets, emergency-response teams, telecom networks, airports, power infrastructure, and public authorities responsible for interference investigations. BOND’s official site names defense, drones and autonomy, telecom, critical infrastructure, smart cities, and regulators as intended sectors; CTech reports defense and drone customers, but the breadth of civilian paid deployments is not independently itemized. The technology is receive-only as described, which is operationally attractive in sensitive RF environments, but spectrum data itself can reveal sensitive operations and requires secure access controls, retention policy, and safeguards against exposing customer activity. Dual-use is therefore grounded in the product’s actual monitoring function, while its contribution to military resilience, deployed breadth, and security posture still require customer-level verification.

**Stage, trajectory, and diligence risks.** BOND is best classified as early: it began in 2026, has only a reported $200,000 pre-seed investment, a small team, early paid users, and hardware already deployed in limited numbers. Having paying customers and pilots means it is beyond a concept-only company, but the central scaling step—building enough sensor density to provide a useful, dependable map—is still ahead. The trajectory depends on converting a narrow GNSS monitoring wedge into a durable RF data layer, earning repeat deployments, and financing hardware production and field support without losing the simplicity that differentiates it. The key diligence questions are: (1) measure detection recall, spoofing-versus-jamming classification, geolocation error, latency, false alerts, and availability across terrain, weather, altitude, and RF clutter; (2) establish which customers pay, how much, for what coverage, and whether deployments renew or expand; (3) inspect W1 calibration, installation, maintenance, cybersecurity, and sensor replacement economics at dense-network scale; (4) test how the company handles encryption, data ownership, operational security, and customer separation when maps may expose sensitive activity; (5) assess whether its hardware and software can integrate with existing spectrum tools, command platforms, and aircraft without creating new operational dependencies; and (6) verify corporate structure, intellectual-property ownership, export-control obligations, and the source and terms of the IAI and Deel financing. Major risks include long defense procurement cycles, dependence on a small number of early adopters, capital requirements for network density, competition from established sensing vendors, and the possibility that interference is intermittent or geographically difficult enough to undermine sensor utilization. BOND is a strategically relevant early company with credible initial evidence, not yet a proven global spectrum utility.
