name = "YAMIM"
description = "YAMIM is a Haifa, Israel aquaculture startup developing an on-site, AI-optimized live-feed and aquafeed production platform. The system is designed to let fish farms convert local biological resources into protein-rich feed, reducing dependence on external processed feed while improving feed economics and water outcomes."
detailed_description = """
**Product and problem.** YAMIM is addressing a structural vulnerability in aquaculture: farms often buy processed feed from external suppliers, making feed one of the largest controllable costs and leaving operators exposed to price, logistics, and availability shocks. The company’s public materials describe an independent end-to-end aquafeed platform that produces feed on the farm and blends locally generated live feed with conventional pellets. YAMIM says its target is the large population of commercial aquafarms that currently devote a substantial share of production economics to purchased feed. The problem is not simply the price of pellets. Intensive feeding can also leave nitrogenous residues in water, increase treatment requirements, and make farms dependent on a concentrated global supply chain. YAMIM’s proposition is therefore a combined cost, environmental, and resilience intervention: produce more of the biological input locally, tune it to the stock and water conditions, and retain the option to use existing pellet supply rather than forcing an abrupt replacement.

**Core technology and operating model.** The company describes a stand-alone live-feed production system that cultivates marine microorganisms already present in aquaculture environments, then uses an AI layer to optimize the feed recipe and operating conditions. Its official site says the platform converts local biomass and resources into protein-rich feed, balances local live feed with pellets, and continuously adjusts nutrition, fish-welfare indicators, and water-quality management. The Blue Economy center provides a similar description: a self-manufactured marine-microorganism feed system paired with AI optimization and a software-as-a-service application. In practical terms, the architecture appears to combine a biological production module, sensing and data collection, a recipe or dosing optimizer, and a farm dashboard. The public record does not disclose the microorganism strains, reactor geometry, sensor bill of materials, model architecture, or control-loop autonomy, so those details require technical diligence. The important technical thesis is that the same farm can become a data-generating production unit rather than a passive purchaser of feed.

**Market, customers, and go-to-market.** YAMIM is selling to fish farmers and aquaculture operators that need lower feed costs, predictable input availability, and better control of water conditions. The company’s website frames aquaculture as a large and growing food sector and presents a recurring monthly SaaS model around the on-site production system. That model could support a hardware-plus-software deployment in which YAMIM supplies or supervises the production equipment, charges for optimization and monitoring, and expands across additional ponds, tanks, or cages as performance is proven. The initial customer profile is likely a farm with enough feed volume and operational discipline to justify a new process, but not enough scale to build a dedicated feed mill. The public sources do not identify named paying farms, geographies of commercial deployment, revenue, renewal, or distribution partners. A credible sales motion will therefore depend on replicated trials that demonstrate feed-conversion gains and stable water quality under different species, climates, and production systems.

**Traction, funding, and external validation.** Public evidence places YAMIM in an early research and customer-development phase. LinkedIn lists the company as founded in 2022, privately held, and in the 2–10 employee range, while IVC identifies its earlier name as Blue Fields, a Haifa company established in 2022 with a small team. Startup Nation Finder describes a 2025 founding date and customer-development stage, which is a useful reminder that the legal entity, rebrand, or product launch timeline is not fully consistent across databases. The Israeli National Center of Blue Economy and Innovation includes YAMIM in its portfolio and presents the system as an AI-powered aquafeed platform. The company’s own website claims approximately 30% production-cost reduction, but that is a company-reported target or outcome rather than an independently audited result. No priced equity round, grant amount, patent number, certification, or customer contract value is disclosed in the reviewed sources. The strongest present validation is ecosystem support, a live product site, a named founder, and a coherent technical description; commercial proof remains to be established.

**Founders and team.** The public-facing team is small. LinkedIn identifies Zivan Shavit as the visible employee and the Blue Economy center names Shavit as founder with architecture and project-management experience, including interdisciplinary project execution. The same profile names Asaf Golan as a co-founder and describes him as an AI and computer engineer with experience in imaging systems, image processing, algorithms, and computing. This pairing is directionally relevant: aquafeed production requires field deployment and process execution as well as sensing, optimization, and software. The public material does not provide a full employment history, a named aquaculture scientist, a detailed advisory board, or the current number of full-time staff, so team depth is a key diligence question. YAMIM will need biological, aquaculture, mechanical, and regulatory capability in addition to AI engineering if it is to move from a promising pilot into repeatable farm installations.

**Competitive dynamics.** YAMIM competes with entrenched feed suppliers and with technology companies that improve aquaculture economics without manufacturing feed. BioMar, Skretting/Nutreco, and Cargill Aqua Nutrition have scale, formulation expertise, distribution, and farmer relationships that make them formidable substitutes even if they do not offer YAMIM’s on-site production model. Israeli companies such as GoSmart provide farm monitoring and feeding optimization, while ViAqua Technologies addresses aquaculture productivity through biological treatment rather than feed production; both are adjacent alternatives for a farmer allocating a limited technology budget. YAMIM’s claimed edge is the combination of local biological feed production, AI recipe optimization, and a recurring data layer. That edge will matter only if the system can match pellet consistency, remain reliable across species and seasons, and show a total-cost advantage after installation, labor, maintenance, and biosecurity controls are included.

**Defense, security, and resilience relevance.** YAMIM has no public evidence of a defense contract or military deployment, so its dual-use case is resilience adjacency rather than a fielded defense capability. Aquaculture is part of food security, and local feed production can reduce exposure to maritime logistics disruption, commodity-price spikes, export controls, or regional shortages. A distributed on-site system could be useful for coastal communities, island economies, emergency food programs, or strategic aquaculture sites that need to keep operating when imported feed is delayed. The same characteristics that matter for resilient food production—local inputs, lower external dependency, sensor-based control, and an ability to run with limited connectivity—could support civil-defense planning and continuity of operations. The defense relevance should be tested through resilience exercises and supply-chain analysis, not assumed from the AI label. The strongest strategic argument is that YAMIM could make a protein-production node more self-sufficient while generating operational data about water and feed conditions.

**Stage, trajectory, and diligence risks.** YAMIM is best classified as early stage. Its public profile suggests a small team, early product development, and ecosystem participation rather than scaled commercial deployment. The next milestones should be a controlled pilot with an independently measured baseline, repeatable feed-conversion and survival results, proof that the live-feed process does not introduce pathogens or destabilize water chemistry, and a hardware and service cost model that works for farms of different sizes. Key risks include biological variability, contamination and biosecurity, farmer adoption friction, uncertain regulatory treatment of on-site feed production, model performance with limited training data, installation and maintenance burden, and competition from feed incumbents that can bundle analytics with existing contracts. The 30% cost-reduction claim, the founding-date discrepancy, and the absence of disclosed financing or paid customer references all warrant verification. If those questions are answered with field data, YAMIM could become a strategically useful food-security platform; until then, it is a technically interesting early company with meaningful but unproven commercial scale.
"""
