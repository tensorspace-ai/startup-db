name = "ARTSYS360"
description = "ARTSYS360 is a private Israeli radar startup associated with compact 3D, 360-degree micro-radar products for detecting and tracking people, vehicles, drones, and traffic. Its public record supports a credible dual-use sensing thesis, but current operating scale, deployments, and website availability remain unverified."
detailed_description = """ARTSYS360 Ltd. is a Holon, Israel radar developer founded in 2013. Its core proposition is a compact, software-led 3D radar platform intended to provide fixed 360-degree coverage for drone, vehicle, and human tracking, with adjacent traffic-management and automotive applications. The 2021 public-company prospectus describes the RS400 and RS800 fixed radars, Cluster360 software, and a product-development history that included an earlier radio-frequency drone detection product later discontinued because it could not be upgraded to handle newer drone communications. These are company disclosures reproduced in a securities filing, not independent performance tests.

The filing is valuable because it adds operating evidence absent from short startup profiles. Audited results reported revenue of NIS 219,000 in 2018 and NIS 48,000 in 2019, followed by no revenue in 2020 or the first half of 2021. The 2018 sales included an RF-signature product and radar prototypes; the 2019 revenue included an RS400 prototype sold to US partner ECSI for a BIRD-supported development project. The company attributed the subsequent pause to cancelled purchases, frozen projects, and delayed public budgets during COVID-19. Its 2020 net loss was NIS 5.43 million and first-half 2021 net loss was NIS 1.063 million. A separate company news post says an RS400 was installed at the Tel Aviv fairground to protect against drones and people, but no contract value, customer payment, or continuing deployment was reported. A 2021 prospectus listed pilots and distributor discussions, while explicitly warning that several named prospective sales were not binding orders. This distinction matters: installation, pilot, bid participation, reseller discussion, and paid recurring deployment are different levels of traction.

The technology case is a compact stationary radar with wide azimuth coverage, paired with software for target detection and tracking. The prospectus compared the RS400 and RS800 with Fortem, SpotterRF, Robin Radar, RADA, and Blighter products on range, coverage, weight, refresh rate, and frequency. It presented ARTSYS360’s low weight and claimed low price and simple operation as advantages, but these comparisons were company-prepared and do not substitute for third-party tests. Radar performance depends on clutter rejection, false alarms, target cross-section, elevation, weather, multipath, installation geometry, and track continuity. A buyer would need controlled trials against its current sensor stack and measured performance at the intended site. Integrations with electro-optical, infrared, acoustic, and passive-RF sensors may be essential, and detection alone does not provide identification or mitigation.

The commercial opportunity remains dual-use. Critical infrastructure, airports, industrial sites, event venues, and public agencies may need continuous detection around fixed perimeters. Traffic and air-mobility monitoring, as well as automotive sensing, offer civilian applications but have distinct requirements, certification burdens, and sales cycles. The 2018 BIRD Foundation announcement confirms an approved US-Israel project with ECSI to develop a 3D-360 multi-sensor counter-UAV system. The company also reported a Polish subsidiary’s NCBR-backed research project in 2021. The reported Polish budget was $7.75 million, including a $5.25 million grant; that project budget must not be confused with equity funding, and the public record reviewed here does not establish how much was ultimately disbursed or whether development finished. Its dual-use potential is real, but current defense customers, exports, and operational deployments are not publicly confirmed.

Capital history is materially clearer from the 2021 filing than from commercial databases. It reports early equity agreements in 2014 and 2015, a $1.4275 million preferred-share round from November 2016 to June 2017, a separate $878,427 B1 preferred round in December 2017, a $300,000 B2 round in March 2019, and $953,000 in SAFE financing between July 2020 and April 2021. The SAFE instruments had a conversion discount linked to a planned public offering. These amounts do not establish total lifetime external financing, because grants, loans, repayments, and any earlier financing are not reconciled in one published company total. A separate Kaman Capital transaction proposed an exchange of ARTSYS360 shares for a controlling public-company stake, but the Israeli securities regulator did not allow the transaction to complete on the required timetable. Thus the merger did not make ARTSYS360 a listed company and should not be treated as an acquisition or a financing round.

The same filing disclosed historical ownership and governance: Meir Zorea, Amir Berlad, Anat Ben-Ari, and Erez Ben-Ari were described as the controlling founders in 2021, with the Technion represented through TRDF and TIOF. It reported Meir Zorea as CEO and chair, Amir Berlad in operations, and Erez Ben-Ari in development. These roles and holdings are dated snapshots, not evidence of the current team or cap table. Patent evidence supports real technical development: US patents cover a multimodal radar system and aerial traffic monitoring radar. The company also held an exclusive license to a Technion direction-finding antenna patent under terms described in its prospectus. A European application in the same field is shown as withdrawn, so patent-family status and maintenance should be checked jurisdiction by jurisdiction.

Competition is broad. Dedicated counter-UAS sensor vendors and system integrators compete for security deployments; the prospectus itself benchmarked Fortem, SpotterRF, Robin Radar, RADA, and Blighter. Israeli suppliers such as D-Fend Solutions, Sentrycs, Rafael, and IAI compete for adjacent counter-UAS budgets through different detection or integrated-system approaches. Automotive radar suppliers compete for mobility programs where automotive-grade reliability, cost, and qualification matter. ARTSYS360’s prospective edge is a light, fixed, wide-coverage sensor with relatively straightforward integration, rather than a demonstrated system-level advantage. The main diligence needs are fresh operating and corporate registry confirmation, current management, status of the Polish subsidiary and grant, audited accounts after 2021, current ownership and patent rights, named paying customers, independent detection trials, production and support capacity, radio-frequency approvals, export compliance, and evidence that the product remains commercially supported. The official web domain is identifiable, but current public company communications and operating status could not be verified in this review."""
