name = "Agora"
description = "Agora (Agora Real Estate Technologies Ltd.) is an Israeli-founded proptech and fintech SaaS company providing real-estate investment management software and related operational services to property funds, sponsors, and their investors."
detailed_description = "Agora builds an end-to-end system for real-estate investment managers and sponsors that must operate many property vehicles, raise capital, keep investor records, calculate allocations, and deliver financial and tax reporting. Founded in Tel Aviv in 2019, the company’s product replaces fragmented spreadsheets, email, and point solutions with a web platform for fundraising, investor relations, asset and fund management, documents, reporting, automation, and payment workflows. Company materials also describe bookkeeping and tax support, and the 2024 Series B announcement said proceeds would support payments, tax, IRA investment, and liquidity capabilities. The value proposition is operational software for general partners and owners/operators; Agora is not itself a real-estate fund or property owner based on the evidence reviewed.\n\nIts workflow depth is its main technical proposition. On the sponsor side, the platform supports investor onboarding, fundraising, investor communications, document management, reporting, and back-office calculations. On the investor side, the portal presents holdings, documents, project updates, and performance information. Calcalist describes calculations that allocate proceeds using ownership interests, contractual provisions, tax treatment, and other parameters. Globes reports that the company additionally offers payment and foreign-exchange services, while Agora’s own material documents expansion into tax and bookkeeping. These capabilities address a complex, recurring vertical workflow where errors and delays affect both fund operations and limited-partner confidence. Public sources do not establish the precise software architecture, algorithmic novelty, security certifications, regulatory licenses, or independent comparative performance, so the technology thesis is vertical product execution and workflow integration rather than a verified scientific breakthrough.\n\nThe business appears to combine annual SaaS subscriptions priced according to assets under management and fund complexity with transaction fees for some payment services. In 2025, Globes reported management’s description of annual subscriptions starting around $9,000 and rising to $500,000, and cited market estimates—not audited company disclosures—of $15–20 million ARR with growth above 100%. That estimate should be treated as third-party market reporting, not confirmed financials. The company has not publicly disclosed audited financial statements, margins, burn, runway, or a current valuation. Its fundraising is much more clearly documented: a $9 million seed round in 2021, a $20 million Series A in August 2022 led by Insight Partners, and a $34 million Series B in May 2024 led by Qumra Capital with Insight Partners and Aleph participating. TechCrunch reports total funding of $63 million after the B round. The earlier Series A article and contemporary Calcalist coverage characterize the seed as Aleph-led; there is no evidence in reviewed material of a subsequent priced round or disclosed post-money valuation.\n\nCommercial traction is meaningful but relies largely on company assertions and press reporting. At the 2022 Series A, Calcalist reported 54 employees, more than 14,000 investors using client portals, $40 billion AUM on the platform, and named Israeli customers including Electra Real Estate, Altshuler Shaham, Migdal Capital Markets, and Gaia Real Estate. Company history says that by 2024 the platform supported 70,000 investors and $150 billion AUM; its 2025 account claims more than 1,000 customers, 150,000 investors, and $300 billion AUM. Globes in 2025 separately reported close to 1,000 customers and around 70,000 investors, underscoring that metrics vary by source, date, and possibly what is counted. AUM processed through software is not Agora-owned assets, revenue, or proof of customer investment returns. Customer and scale claims are therefore promising adoption evidence, but diligence should request definitions, cohort retention, expansion, payment volume, churn, and customer concentration. TechCrunch’s report that revenue tripled annually since launch is attributed to the CEO and lacks published base values.\n\nAgora operates in a competitive category that includes Juniper Square, AppFolio Investment Manager, InvestNext, Groundbreaker, RealPage IMS, and broader private-market administration platforms. Juniper Square and AppFolio have established scale and adjacent software ecosystems. Agora’s differentiation is its exclusive real-estate focus, integrated fundraising-to-investor-servicing workflows, tax and payments adjacency, and high-touch customer support. This specialization may create switching costs as customer investor records, fund documents, calculations, and reporting processes become embedded. It also concentrates exposure to real-estate capital formation, transaction activity, interest rates, regulatory change, and customer willingness to consolidate operations. Competition can respond through feature expansion, bundled pricing, or broader fund-administration services; Agora must prove the integration works reliably across different partnership agreements and jurisdictional tax rules.\n\nThe founders are Bar Mor (CEO), Lior Dolinski (CPO), and Noam Kahan (CTO), described by multiple sources as former Unit 8200 colleagues. Mor’s family background in real estate is cited as sector context, while the team’s combination of property familiarity and software execution is a plausible advantage in a traditionally manual market. The company has expanded beyond Israel, with New York operations and reported Australian expansion in 2025. It also acquired Clearshift’s real-estate division in June 2024 to strengthen cross-border payments; deal consideration and completion mechanics were not disclosed in the announcement. Qumra lists Insight Partners, Aleph, and Riverpark Ventures among additional investors, but public sources do not disclose ownership percentages, cap table, board rights beyond a named Qumra board representative, or investor control.\n\nAgora is a civilian financial operations platform with no evidenced defense customer, government contract, classified workload, or security product. Its automation could be used by real-estate organizations that own strategically important property, but that is ordinary commercial applicability and does not establish defense relevance. The record should classify it as an Israeli startup with low direct dual-use value. Principal investment diligence concerns are recurring-revenue quality, implementation burden, payment and tax compliance across countries, data protection for sensitive investor and financial information, operational resilience, acquisition integration, and competitive defensibility. The business merits continued commercial monitoring because the disclosed rounds, customer adoption, and product breadth indicate real scale; however, the available evidence does not justify treating company-reported AUM or estimated ARR as independently verified financial performance."
