name = "Colugo"
description = "Colugo Systems Ltd. is an Israeli aircraft developer that designs and manufactures electric vertical take-off and landing (eVTOL) unmanned aircraft under its ARC family, using a proprietary adaptive-wing configuration for vertical hovering and wing-borne forward flight."
detailed_description = """Colugo Systems Ltd. develops and manufactures electric VTOL unmanned aircraft. Its ARC line combines vertical take-off, landing and hover with fixed-wing forward flight. The company's own materials describe a proprietary Adaptive Wing Technology (AWT), also called Loose Wing, in which movable wings are intended to reduce lift demand on vertical rotors in forward flight and windy hover. This is a physical aircraft and propulsion/aerodynamic design business, not the autonomy-software vendor described by the stale baseline. Products listed by the company include ARC 53, ARC 500 and ARC 1000; published specifications are company claims and should be validated under independently observed payload, weather, endurance and communications conditions.

The business model is B2B/B2G aircraft design, manufacture and sale, with potential support/service revenue. The company presents use cases spanning defense and security, emergency response, infrastructure inspection, agriculture, cargo and urban air mobility. Its product focus offers an attractive operational trade-off for missions that need runway-independent launch, hover for observation or work, and more efficient wing-borne cruise than a conventional multicopter. The commercial case depends on proving that the movable-wing mechanism delivers its claimed wind tolerance and endurance without unacceptable mechanical complexity, maintenance burden or control risk. Customer-specific payloads, command links, flight permissions and integration requirements can also make apparently repeatable aircraft sales engineering-intensive.

Public reporting provides materially better evidence than the baseline: CTech reported in June 2025 that Colugo had built and deployed aircraft with the Israel Defense Forces and other security agencies, and that it had relied primarily on product sales before taking outside capital. Polyrizon's March 2026 press release names the IDF, national first responder organizations and commercial companies as customers, but that release accompanied a proposed investment/secondary purchase and is an interested-party claim. Neither source discloses contract values, recurring revenue, quantities, renewal rates or the share of sales from defense. These references therefore support evidence of use and sales, but not a quantified traction assessment or assumptions about large-scale production.

Funding history includes a June 2025 first external financing reported as $8.5 million, led by Ayalon Insurance and Finance, at a reported $65 million pre-money valuation. CTech says this was the company's first outside capital after bootstrapping through product sales; Startup Nation Finder lists an earlier 2018 non-equity EU Horizon 2020 item, which should be treated separately from equity. In March 2026, Nasdaq-hosted issuer news reported that Polyrizon signed a non-binding MOU with two Colugo shareholders to acquire approximately 20% fully diluted for up to $6 million in cash or Polyrizon shares. This is a proposed secondary transaction, not a closed funding round or completed ownership change. No public evidence located here establishes completion, definitive terms, a final purchase price or the identity/holdings of the selling shareholders. Private cap-table details remain undisclosed.

Identity sources disagree on founding year: CTech reports 2018, while Polyrizon's release says established in 2016; the company's site does not resolve this. The company is registered as Colugo Systems Ltd. in Israel, with public directory evidence listing Israeli company number 515502425 and Yavne as its main address. Official company material identifies Amit Regev as founder and CTO and Merav (also rendered Meirav) Kirshner as CEO; CTech describes Kirshner as a retired IDF brigadier general and former head of its Personnel Directorate, and Regev as a former drone squadron pilot. Board members shown on the company site include Gideon Schefer and Natan Barak; their current status and backgrounds need confirmation. This is a small privately held company; employee range 11–50 comes from Startup Nation Finder and is not a current verified headcount.

The technical moat is potentially rooted in aircraft configuration, flight-control know-how, patents and operational learning rather than a general-purpose autonomy stack. Public patent records show Colugo Systems Ltd. as assignee on applications covering asymmetric multirotors, folded-wing multirotors and VTOL flight-mode transition. A patent family and issued application do not by themselves establish freedom to operate, enforceability, commercial significance, or that every product feature is protected. Diligence should map granted versus pending jurisdictions, inventor assignments, maintenance status, claim scope, third-party components and the extent of design-around risk. Public material also describes autonomous operation, but no independent certification, regulator approval or safety case was found; this should not be represented as certified autonomy or passenger-aircraft readiness.

Competition includes fixed-wing VTOL ISR aircraft such as Quantum-Systems and AeroVironment/Puma, commercial mapping systems from Wingtra and Parrot/ senseFly, and VTOL or multirotor security platforms such as XTEND and other Israeli manufacturers. These are adjacent peers rather than exact product matches: Colugo's stated distinction is its wind-capable hovering and movable-wing combination. Large aerospace firms and low-cost multicopter suppliers are substitutes depending on mission, payload, endurance, procurement and support needs. Buyers can also use conventional fixed-wing UAVs with launch/recovery systems or helicopters for demanding payloads. The competitive edge remains a company-stated engineering proposition until supported by controlled comparative flight data, customer references and lifecycle-cost evidence.

Commercial scaling risks include airworthiness and operating approvals across jurisdictions, export controls, defense procurement concentration, long sales cycles, manufacturing quality, component availability, field maintenance, cyber and communications resilience, and the cost of supporting multiple payloads and customer configurations. The ambition to develop a passenger aircraft introduces a separate and much more capital-intensive certification and safety challenge; it should not be conflated with the maturity of the uncrewed ARC products. Defense and civil security applications are evidenced in company and media materials, but public sources do not establish weaponization, autonomous target selection, or a specific offensive capability. The dual-use case is credible because aircraft can support surveillance, emergency response, inspection and logistics, while defense applicability is supported by reported security-force deployments. Prior diligence should focus on independently verified flight performance, repeat sales and gross margins, revenue concentration, current production capacity, approvals, IP status, customer references and whether the proposed Polyrizon transaction advanced beyond its non-binding MOU."""
