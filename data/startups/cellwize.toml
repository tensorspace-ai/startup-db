name = "Cellwize"
description = "Cellwize built CHIME, a cloud-native platform that automated and orchestrated multi-vendor radio access networks for mobile operators. Qualcomm acquired the business in June 2022 and carried the technology into Edgewise; Qualcomm's current product page brands its RAN automation suite as Dragonwing. Cellwize is therefore an acquired technology lineage, not an independent startup. Historical customer and deployment claims are meaningful, but they do not reveal current Cellwize-only revenue, staffing or customer contracts."
detailed_description = """Cellwize was an Israeli telecom-software company focused on the operational software layer around mobile radio access networks. Its CHIME platform connected operator workflows with radio network elements from multiple suppliers. The company's material described automated network deployment, configuration, performance monitoring, fault analysis and optimization across 2G, 3G, 4G and emerging 5G systems. The product's core value proposition was to reduce vendor-specific operating silos: operators could apply common automation to mixed equipment and network generations instead of running every change through a separate toolset. Qualcomm later presented this software capability as Edgewise and now lists a Dragonwing RAN Automation Suite, preserving the RAN automation lineage inside Qualcomm's wider infrastructure portfolio.

The underlying task is operationally consequential. Radio networks contain many cells, frequencies, software versions, vendor interfaces and local traffic patterns. Planning a site, tuning radio parameters, repairing a configuration issue or rolling out a network-wide change can require specialized engineering and careful validation. CHIME was positioned to collect network data, apply policies and AI or machine-learning recommendations, expose APIs for applications, and automate selected actions. Those functions can improve consistency and deployment speed, but carrier networks impose strict change control: operators need to understand how recommendations are generated, test them against real network states, set safe execution bounds and retain rollback paths. Public product claims do not independently quantify fault reduction, labor savings or return on investment.

The commercial buyer was generally a mobile network operator, with system integrators, equipment vendors, cloud providers and chipset ecosystems acting as implementation or distribution partners. Company and customer-facing releases named Telefónica, Axiata, Bell and Telkomsel in specific commercial contexts. Telkomsel's 2021 announcement described a selection and planned implementation with local partner Immobi, which should not be converted into proof of completion or a disclosed contract. Cellwize also announced an Intel integration arrangement; the reported suggestion that it could be worth millions was an executive's estimate to a newspaper, not an audited contract value. At acquisition, Calcalist relayed company claims of activity across 16 countries, about 3 million cell sites and more than 800 million subscribers. Qualcomm later reported over 30 public operator deployments for Edgewise. These indicators support commercial reach, yet neither establishes contract size, recurring revenue, renewal rates, active current deployments or independently measured performance.

The business showed a useful strategic progression. The 2015 financing release described a $14.5 million equity Series A alongside a distinct $10 million credit facility. DTCP was identified as an investor from 2018, Sonae IM announced an undisclosed equity investment in 2019, and Cellwize raised a $32 million Series B in 2020 led by Intel Capital and Qualcomm Ventures. The investor mix brought telecom, semiconductor and operator relationships as well as capital. The private cap table, round allocations and exact terms were not disclosed. Public reports disagree on lifetime fundraising totals, so this record does not present a synthetic aggregate.

Qualcomm's acquisition in June 2022 is a strong strategic validation signal: the buyer explicitly linked Cellwize's multi-vendor automation to its private and public 5G, Open RAN and infrastructure strategy. Qualcomm's product page now presents the RAN suite as part of Qualcomm Technologies, rather than an independent Cellwize offering. This changes the diligence object. The relevant questions are product continuity, operator adoption and integration inside Qualcomm; the available public record does not identify Cellwize-specific employees, revenue or customer contracts after the acquisition. The $350 million purchase price is a Calcalist report, not disclosed Qualcomm consideration.

Competition is real and has intensified around service management and orchestration. Nokia's MantaRay SMO and Ericsson's EIAP both market multi-vendor RAN automation, AI-enabled optimization and open application ecosystems; Amdocs combines SMO and RIC capabilities in a vendor-neutral Open RAN offering. Cellwize's historical edge was its effort to abstract mixed-generation and multi-vendor networks while remaining usable across traditional, virtualized and open architectures. Qualcomm can combine this software with RAN platforms and channel relationships, but it also competes against integrated incumbent suites and operator-built tools. No independent evidence found here ranks Cellwize's share or establishes a lasting cost or performance advantage."""
