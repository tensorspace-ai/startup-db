gaps = ["identity: the named Pte. Ltd. parent and Israeli Ltd. applicant are visible in company and patent sources, but a current registry extract was not verified; incorporation country and post-acquisition legal-entity status are therefore omitted.", "funding: no issuer-reconciled lifetime total was found. CEO-attributed/Calcalist reports say $56 million while other press reports say $56.5 million; undisclosed investment amounts and debt treatment prevent a reliable numeric aggregate. No public valuation terms were found.", "investors: named historical investors are known, but the full cap table, investor allocations, participation by each existing shareholder in the 2020 Series B, and post-acquisition seller proceeds are unavailable.", "team: founders and acquisition-era CEO are identified, but current Qualcomm team assignments, retained Cellwize staff, and post-acquisition headcount are not publicly established.", "financials: no Cellwize-only revenue, ARR, profitability, burn, runway, audited accounts or contract values were found. Only historical employee counts and company-reported reach metrics are available; Qualcomm does not publish a Cellwize segment.", "traction: named customer selections and historical reach claims are documented, but paid status, implementation completion, contract duration, renewals, current active customers and present-day deployments are not independently disclosed.", "intellectual_property: the EPO application confirms at least one published filing, but a full patent schedule, grant status by family, current assignments, licensing terms and any comprehensive post-acquisition IP transfer record were not established.", "competition: current overlapping product offers are documented, but Cellwize's historical market share, operator win/loss record, independent performance comparisons and current competitive position are unknown.", "ownership: acquisition completion and a media-reported price are documented, but Qualcomm's consideration, deal structure, complete shareholder roll-forward and exact ownership percentages are not disclosed.", "dual_use: no military, defense, intelligence or public-safety customer, procurement, security certification or mission-specific deployment was identified; any resilience benefit remains a capability-based possibility."]
conflicts = ["Lifetime funding is unresolved: Ofir Zemer told Crunchbase News that Cellwize had raised $56 million by November 2020 and Calcalist reported about $56 million in 2022, while TechCrunch reported $56.5 million in 2020. The disclosures do not reconcile debt and undisclosed investments, so no aggregate amount is placed in reported_total_raised.", "A stale Startup Nation Finder profile shows a $28 million 2020 Series B, a $24.5 million 2015 Series A and a $300 million exit. Cellwize's original 2020 release and CTech report $32 million for Series B; the 2015 issuer release separates $14.5 million equity from a $10 million credit facility; contemporaneous Calcalist reporting gives approximately $350 million for the acquisition. The primary release figures are retained, with the directory discrepancy recorded here.", "Qualcomm confirms that it acquired Cellwize but does not disclose consideration. Calcalist reports approximately $350 million; this figure is retained only as a media-reported deal amount, not an official Qualcomm disclosure or an inferred valuation."]
diligence_questions = ["Which CHIME capabilities, customer contracts and engineering teams were carried into the current Dragonwing RAN Automation Suite, and what portions remain supported for existing operators?", "How many operators currently use the product in production, what proportion are paid deployments, and what are renewal, expansion and service-level outcomes after Qualcomm integration?", "What were the amounts and instruments of the 2018 DTCP and 2019 Sonae investments, and did existing investors participate in the 2020 Series B?", "What current patents and software rights are assigned to Qualcomm entities, and what security, change-control and rollback controls are validated for automated network actions?", "Does the current suite have any documented public-safety or defense customer, mission-specific deployment or security accreditation, beyond general private-network applicability?"]
