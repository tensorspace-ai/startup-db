sources = [
  { id = "qualcomm_acquisition", url = "https://www.qualcomm.com/news/releases/2022/06/qualcomm-acquires-cellwize-to-accelerate-5g-adoption-and-spur", title = "Qualcomm Acquires Cellwize to Accelerate 5G Adoption and Spur Network Infrastructure Innovation at the Edge", publisher = "Qualcomm", kind = "company", accessed_at = "2026-10-22T01:25:40Z", published_on = "2022-06-13", claims = ["Qualcomm Technologies announced that it had acquired Cellwize Wireless Technologies Pte. Ltd. on June 13, 2022; the release does not state consideration.", "The acquired platform was a cloud-native, multi-vendor RAN automation and management solution for public and private 5G, traditional RAN, virtualized RAN and Open RAN.", "Qualcomm said former Cellwize CEO Ofir Zemer joined Qualcomm as vice president of product management.", "Deutsche Telekom said it had been invested in Cellwize through DTCP since 2018."] },
