  { id = "techcrunch_2020", url = "https://techcrunch.com/2020/11/09/cellwize-raises-32m-to-help-carriers-and-their-partners-adopt-and-run-5g-services/", title = "Cellwize raises $32M to help carriers and their partners adopt and run 5G services", publisher = "TechCrunch", kind = "media", accessed_at = "2026-10-22T01:25:40Z", published_on = "2020-11-09", claims = ["TechCrunch reported that Cellwize was not disclosing valuation and had raised $56.5 million to date; the piece does not reconcile this total with the $56 million figure attributed to the CEO by Crunchbase News.", "The article reported that Cellwize said it served about 40 carriers across 16 countries, 3 million cell sites and 800 million subscribers, and described Israel as the base with Dallas and Singapore operations."] },
  { id = "timesofisrael_intel_2021", url = "https://www.timesofisrael.com/israels-cellwize-to-supply-intel-with-software-that-launches-5g-networks/", title = "Israel’s Cellwize to supply Intel with software that launches 5G networks", publisher = "The Times of Israel", kind = "media", accessed_at = "2026-10-22T01:25:40Z", published_on = "2021-06-21", claims = ["Cellwize and Intel entered an agreement for Cellwize technology to be integrated with Intel chipsets for cellular providers.", "Ofir Zemer told the newspaper that the agreement could be worth potentially millions of dollars; the value was not disclosed as a booked or realized amount.", "The report quotes Zemer describing Cellwize as vendor-agnostic and naming customers including Dell, Verizon, Telefónica and Deutsche Telekom."] },
  { id = "telkomsel_2021", url = "https://www.prnewswire.com/news-releases/automated-network-optimization-from-cellwize-is-to-be-deployed-by-indonesias-telkomsel-to-enhance-network-performance--customer-experience-301221058.html", title = "Automated Network Optimization from Cellwize is to be Deployed by Indonesia's Telkomsel to Enhance Network Performance & Customer Experience", publisher = "PR Newswire / Cellwize", kind = "company", accessed_at = "2026-10-22T01:25:40Z", published_on = "2021-02-03", claims = ["Cellwize announced that Telkomsel selected CHIME for RAN optimization and said the solution would be implemented with local partner Immobi.", "The release includes a Telkomsel executive statement about the intended collaboration; it does not provide deployment completion, contract value or paid-status evidence."] },
  { id = "epo_patent_2021", url = "https://data.epo.org/publication-server/rest/v1.0/publication-dates/20210303/patents/EP3787323NWA1/document.pdf", title = "Method and system of managing radio connectivity of a vehicle - European Patent Application EP 3 787 323 A1", publisher = "European Patent Office", kind = "filing", accessed_at = "2026-10-22T01:25:40Z", published_on = "2021-03-03", claims = ["The EPO publication identifies Cellwize Wireless Technologies Ltd. in Ramat Gan, Israel as applicant and identifies Daniel Dribinski and Sasi Geva among the inventors.", "The application concerns managing vehicle telematics radio connectivity to cellular networks; it is a published patent application, not evidence that all claims were granted or that the complete patent portfolio is known."] },
  { id = "snc_finder_legacy", url = "https://finder.startupnationcentral.org/company_page/cellwize?section=team", title = "Cellwize - Startup Nation Finder", publisher = "Startup Nation Finder", kind = "directory", accessed_at = "2026-10-22T01:25:40Z", published_on = "2023-09-06", claims = ["The legacy profile marks Cellwize acquired/inactive and shows a $28 million 2020 B round, a $24.5 million 2015 A round and a $300 million June 2022 exit.", "The profile's financing and exit figures conflict with the issuer's $32 million Series B and its separate $14.5 million Series A plus $10 million credit-facility release, and with later Calcalist reporting of approximately $350 million for the acquisition.", "The profile lists historical team members including Ofir Zemer, Sasi Geva and Gal Shenhav; it is a stale directory record, not a current company source."] },
