  { id = "calcalist_he_2022", url = "https://www.calcalist.co.il/calcalistech/article/rjl4bivy9", title = "Qualcomm acquires Cellwize for $350 million", publisher = "Calcalist", kind = "media", accessed_at = "2026-10-22T01:25:40Z", published_on = "2022-06-13", claims = ["Calcalist's Hebrew report stated an approximately $350 million price for Qualcomm's purchase of the Israeli company Cellwize.", "It reported the 2012 founding by Daniel Dribinski and Sasi Geva, 160 global staff and 80 in Israel.", "It reported approximately $56 million raised and named operator customers; Qualcomm's official release does not state the purchase consideration."] },
