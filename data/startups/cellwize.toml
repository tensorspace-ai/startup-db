  { id = "series_a_2015", url = "https://www.prnewswire.com/news-releases/cellwize-secures-245-m-in-funding-led-by-carmel-ventures-559971211.html", title = "Cellwize Secures $24.5 M in Funding led by Carmel Ventures", publisher = "PR Newswire / Cellwize", kind = "company", accessed_at = "2026-10-22T01:25:40Z", published_on = "2015-12-02", claims = ["Cellwize said it raised a $14.5 million Series A led by Carmel Ventures and Vintage Investment Partners.", "The same release separately says Viola Credit (formerly Plenus) granted a $10 million credit facility; the headline's $24.5 million is not the equity round amount.", "Cellwize said its optimization solutions were implemented at mobile operators serving over 300 million subscribers at the time."] },
  { id = "series_b_2020", url = "https://www.prnewswire.com/news-releases/cellwize-secures-32m-series-b-financing-led-by-intel-capital-and-qualcomm-ventures-301168636.html", title = "Cellwize Secures $32M Series B Financing Led by Intel Capital and Qualcomm Ventures", publisher = "PR Newswire / Cellwize", kind = "company", accessed_at = "2026-10-22T01:25:40Z", published_on = "2020-11-09", claims = ["Cellwize announced a $32 million Series B in its parent Cellwize Wireless Technologies Pte. Ltd.", "Intel Capital and Qualcomm Ventures led the financing; Verizon Ventures and Samsung Next participated.", "Cellwize named Viola Ventures, DTCP, GreenApple Tech, Vintage Investment Partners and Sonae IM as existing shareholders, without saying that each participated in this financing.", "Cellwize described CHIME as a cloud-native, AI-driven, multi-vendor RAN automation and orchestration platform."] },
  { id = "sonae_2019", url = "https://www.globenewswire.com/fr/news-release/2019/05/07/1817990/0/en/Sonae-IM-closes-investment-in-Cellwize-leading-provider-in-network-automation-and-orchestration-for-telecom.html", title = "Sonae IM closes investment in Cellwize, leading provider in network automation and orchestration for telecom", publisher = "GlobeNewswire / Cellwize and Sonae IM", kind = "company", accessed_at = "2026-10-22T01:25:40Z", published_on = "2019-05-07", claims = ["Sonae IM said it concluded an equity investment in Cellwize; no amount was disclosed.", "The announcement names Telefónica, Axiata and Bell Canada as clients, without publishing revenue, contract values or deployment status for each.", "It identifies Sonae IM, DTCP, Viola Ventures, Green Apple Tech and Vintage Investment Partners in the investor context."] },
