name = "Inland Ocean"
description = "Inland Ocean, formerly Everblue Labs, is an Israeli-founded aquaculture technology startup building zero-waste, land-based fish farms with proprietary water treatment, off-flavor elimination, modular farm design, and remote operational monitoring. Its current work is aimed at producing premium fish closer to consumers while reducing water use, wastewater exposure, and dependence on geographically concentrated marine farming and imports."

detailed_description = """
**Product and the concrete problem it solves.** Inland Ocean is solving a very specific bottleneck in land-based aquaculture: fish farms can be placed near consumers and insulated from storms, marine disease, coastal constraints, and long logistics chains, but recirculating aquaculture systems (RAS) are difficult to operate profitably. Water chemistry must stay stable at high stocking densities; ammonia and other waste products must be treated continuously; farms consume energy for pumping, filtration, oxygenation, and temperature control; and compounds such as geosmin and 2-methylisoborneol can give otherwise healthy fish an earthy or muddy taste. Conventional depuration moves fish into clean water before harvest, which adds water consumption, time, labor, biomass loss, and operational complexity. Inland Ocean’s proposed answer is a partner-operated, zero-waste farming system that combines water treatment with fish production rather than selling a generic tank or a consulting project. The company says its system has used roughly 40 liters of water per kilogram of fish, compared with the much larger water burden of open systems, and its commercial proposition is to let an experienced farmer grow more fish on the same permit and in locations where conventional marine farming is impractical.

**Core technology and how it actually works.** The system is a closed-loop RAS rather than a simple water-reuse claim. Fish tanks feed a treatment train that removes suspended and dissolved waste, supports biological conversion of fish-generated ammonia, and returns treated water to the growing environment. Recent technical reporting describes biofilters in which bacterial communities convert ammonia first to nitrate and then to nitrogen gas, while a separate treatment addresses the taste compounds that often force pre-harvest purging. Inland Ocean’s public technical materials describe a proprietary filtration system, a patented off-flavor-eliminating treatment, and modular farm units that are standardized and stackable. The company’s research lineage also includes work on hydrophobic carriers and biological degradation of geosmin and MIB: the technical concept is to concentrate the hydrophobic compounds onto a material with affinity for them and then enable biological communities to break them down inside the process. A published patent application in this area describes advanced oxidation and reactor-based removal of geosmin and MIB from aquaculture water, while the company’s current positioning emphasizes a patented bioreactor that continuously removes off-flavor compounds without traditional purging. InlandOS adds cameras, sensors, local controls, and remote monitoring so the operator can inspect performance and support maintenance without assembling a separate software stack. The public record does not establish exact removal rates, energy intensity, survival rates, or production cost at industrial scale, so those remain central technical diligence questions.

**Market, customers, and go-to-market.** Inland Ocean is pursuing a B2B partnership model aimed at accomplished fish-farm owner-operators rather than a conventional equipment sale. The partner supplies the biological production operation and market access; Inland says it handles the technology and treats the water, sharing risk and reducing the customer’s need to build specialist RAS capability. This matters because aquaculture economics are local: permits, electricity prices, feed, species, water chemistry, labor, and distribution determine whether a farm succeeds. A standardized and stackable farm design is intended to reduce custom engineering, while local partners provide husbandry expertise and a route to restaurants, retailers, and food distributors. The company identifies Atlantic salmon, sea bass, sea bream, barramundi, striped bass, redfish, and rainbow trout as relevant production possibilities across its validation work. Its official site names Dagon Aquaculture as a partner and quotes Dagon’s CEO saying the system can grow more fish on the same permit without taking on large financial risk. Inland Ocean has also described a franchise-like expansion model, with centralized technical governance and local production partners. Its U.S. footprint is commercially relevant: the company lists Austin as headquarters and has reported land and permits for a Texas flagship site. The go-to-market challenge is equally concrete: fish buyers care about sensory quality and reliable volume, while farm owners care about capex, operating margin, biosecurity, and uptime. Inland must prove that its water and taste advantages survive this full economic test.

**Traction, funding, and third-party validation.** Inland Ocean has more evidence than a laboratory-only climate concept, but its public traction should be separated into validated activity and forward-looking plans. The company says its systems had grown more than 30 metric tons of fish across validation sites through 2024, covering both marine and freshwater species. Yissum, the Hebrew University technology-transfer organization, reported that Inland Ocean had launched a larger facility with Israel’s largest fish farm, begun industrial-scale Atlantic salmon farming, secured land and permits for a Texas site, and prepared for a $15 million Series A. Yissum also reported that the company had raised $4 million at the time of its 2025 newsletter. Startup Nation Finder and IVC records identify an undisclosed seed or extended-seed financing event involving ATOORO Fund, while the fund’s own materials place food security and novel farming systems within its deep-technology focus. More recent trade reporting describes a Ma’agan Michael pilot holding approximately 8,000 Atlantic salmon and reports that an individual fish reached five kilograms after a 21-month cycle; the same report says cooked tasting was favorable but raw sensory quality still needed improvement. Those details are useful because they expose the actual stage of the business: a meaningful biological and operational pilot, not proof of a profitable commercial farm. There is third-party support for the existence of the company, the founders, its partner relationship, and its patent-linked technical direction, but no audited revenue, contracted production volume, verified Series A close, or independently validated cost-per-kilogram figure is public.

**Founders and team background.** The founding team combines aquaculture science, farming experience, and operating or business-development capability. Dr. Snir Azaria is identified by the company as CEO and co-founder, a third-generation farmer and marine biologist with a PhD focused on wastewater treatment in land-based aquaculture systems. The company attributes to him experience in designing and maintaining biological treatment units and expertise in off-flavor mitigation, which maps directly to the system’s principal technical wedge. Prof. Jaap van Rijn is identified as chief scientist and co-founder. He developed the underlying research direction through a career in eco-friendly fish-farming techniques, has authored more than 100 publications according to the company, previously led the Hebrew University’s Department of Animal Sciences, directed the Interuniversity Institute for Marine Sciences in Eilat, and served as editor-in-chief of Aquacultural Engineering. Nimrod Gliksman is identified as COO and co-founder. The company describes him as an entrepreneur with more than a decade in startups and real estate, a former CEO of Gliks, co-founder of the AI legal-tech startup Modus-p, and a former intelligence officer in Israel’s Prime Minister’s Office. IVC also lists Hagai Mayer as VP of Engineering. This is a credible science-to-commercialization configuration, particularly for a water-treatment-heavy product. The diligence gap is organizational rather than biographical: public headcount is small and inconsistent across ecosystem sources, and the record does not disclose the full engineering, farm-operations, regulatory, or U.S. commercialization bench needed to build several industrial sites.

**Competitive dynamics.** Inland Ocean competes in two overlapping markets: land-based aquaculture operators that produce fish themselves, and technology providers that sell RAS components or operating systems to farms. Atlantic Sapphire is the most visible large-scale land-based salmon comparator, with a vertically integrated RAS model and significant experience demonstrating both the promise and the difficulty of industrial salmon farming. The Kingfish Company provides another land-based RAS benchmark through yellowtail production, while Pure Salmon represents a global multi-site land-based salmon development approach. In Israel, Spring Salmon is a relevant local comparison because it is also developing a land-based salmon operation, although the two companies’ disclosed systems, sites, and commercial models differ. Inland Ocean’s commercial wedge is not simply “fish on land”; it is the combination of near-total water recycling, off-flavor treatment, modular deployment, and an operator partnership structure intended to lower adoption risk. Its technical differentiation will matter only if it produces consistently acceptable fish with lower water use and competitive energy, feed, labor, and maintenance economics. The main competitive threat may be an incumbent fish farm that already has husbandry expertise and can assemble RAS equipment from multiple vendors, not only another startup. Inland’s claimed advantage could also be copied or neutralized by better-funded operators if the patents do not protect the complete process and if sensor and biological-control know-how is difficult to keep proprietary.

**Defense, security, and resilience dual-use relevance.** Inland Ocean is relevant to Claw & Talon through food and water resilience rather than through a demonstrated defense product. Israel imports much of its salmon, and the company’s thesis is to produce protein near demand centers without relying on suitable coastlines, long-distance cold-chain transport, or routine wastewater discharge. That creates a credible strategic pathway for countries and critical communities that need local protein production while facing drought, coastal constraints, disrupted shipping, climate volatility, or restrictions on industrial effluent. The same closed-loop operating principles can support resilient food production in remote communities, emergency logistics hubs, island or desert environments, and facilities where water withdrawal and discharge are tightly constrained. RAS also creates a security-relevant requirement for monitoring, remote maintenance, backup power, cyber-secure controls, biosecurity, and continuity plans, although Inland does not publicly claim defense procurement, military deployment, or classified work. The technology should therefore not be described as a battlefield capability. Its dual-use status is strongest at the infrastructure layer: a commercial farming platform that could help sustain food availability and water efficiency during shocks. Strategic diligence should test whether the system can operate safely with intermittent grid power, locally available feed and replacement parts, degraded connectivity, and limited specialist labor. It should also examine whether remote access, farm telemetry, and biological process controls are secured to the standard expected by critical-infrastructure operators.

**Growth stage, trajectory, and key diligence risks.** Inland Ocean is classified as early because it has a substantial research base, a multi-species validation record, a named operating partner, and an active salmon pilot, but it has not publicly demonstrated repeatable industrial economics. The next phase is a difficult transition from proving that fish can survive and taste acceptable in a closed system to proving that partner farms can produce at scale with predictable margins. The company’s modular design and partnership model could allow faster geographic expansion than owning every farm, especially in water-stressed regions and U.S. markets, but it also makes quality control and operational accountability harder. The critical diligence points are: (1) biological performance, including survival, growth, feed-conversion ratio, disease control, and the consistency of off-flavor removal; (2) energy economics, particularly the cost of keeping salmon at the required temperature and maintaining circulation and oxygenation; (3) capex, construction schedule, and maintenance burden for standardized modules; (4) commercial proof, including partner economics, offtake commitments, repeat orders, and the status of the reported Texas project; (5) regulatory and food-safety approvals across Israel and the United States; (6) cyber and operational resilience of InlandOS, sensors, cameras, and remote support; and (7) financing runway, because multi-site farm deployment is capital-intensive even when partners share the load. If Inland converts the Ma’agan Michael work into profitable, repeatable sites, it could become a strategically important platform for localized protein production. Until then, its strongest evidence is a credible science base and a meaningful pilot, not a proven global aquaculture scale-up.
"""

