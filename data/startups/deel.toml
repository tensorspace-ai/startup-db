  "High fixed and operational costs of maintaining owned entities, local experts, and country coverage",
  "Competition from Rippling, Papaya Global, Remote, Oyster, ADP, Workday, and local providers",
  "Customer concentration, pricing pressure, and execution risk while expanding into a broad HR suite",
  "Unresolved litigation and reputational risk arising from the public dispute with Rippling"
]

