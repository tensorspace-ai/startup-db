name = "Perimeter 81"
description = "Perimeter 81 built a cloud-native secure access and SASE platform for distributed workforces, combining zero-trust access, private networking, and security controls. Check Point completed its acquisition in September 2023; the technology is now presented through Check Point SASE and related Quantum SASE offerings rather than as an independent startup."
detailed_description = """
Perimeter 81 was a Tel Aviv cybersecurity company founded in 2018 by Amit Bareket and Sagi Gidali. Its core product replaced parts of the legacy VPN and appliance model with a cloud-managed service for connecting employees, contractors, offices, and applications. The platform combined zero-trust network access (ZTNA), software-defined perimeter controls, private backbone connectivity, network segmentation, secure web access, and centralized policy administration. The value proposition was operational as much as technical: deploy secure connectivity without hardware, apply access policies by identity and context, and give administrators a single console for a distributed environment.

The customer problem is durable. Organizations have moved applications and users across SaaS, public cloud, branch offices, and home networks, while older perimeter-based architectures often grant broader network access than a user needs. SASE and SSE products address that mismatch by bringing identity, traffic inspection, segmentation, and policy enforcement closer to users and applications. Perimeter 81 focused on making that transition accessible to mid-market and distributed organizations, including customers using managed-service providers and channel partners. Check Point said at the acquisition close that the business served more than 3,000 customers and had more than 200 employees; the former company site also reported approximately 250 team members and $165 million in funding, but those figures should be treated as historical rather than current standalone-company metrics.

Competition is intense and increasingly favors vendors able to bundle networking, identity, endpoint, cloud, and threat-prevention functions. Relevant alternatives include Zscaler Private Access, Cloudflare Access, Palo Alto Networks Prisma Access, Cisco Secure Access, Netskope Private Access, Twingate, and incumbent VPN or firewall platforms. Perimeter 81's plausible edge was ease of deployment, a unified cloud console, a private global backbone, and a relatively simple migration path from VPNs. Those are useful execution advantages, but not obviously durable technical moats: larger platforms can reproduce the principal controls, bundle them into wider contracts, and use existing security telemetry and sales channels.

Commercial traction is evidenced by the reported customer and employee base, prior funding history, and Check Point's decision to acquire 100% of the company for total consideration of $503.1 million, as disclosed in Check Point's 2023 annual filing. The acquisition also changes how traction should be interpreted. Check Point completed the transaction in September 2023, launched an integrated Quantum SASE offering shortly afterward, and continues to host Check Point SASE materials that retain Perimeter 81 product references. This makes the asset commercially validated and strategically useful, but no longer an independent venture with a separately observable revenue, headcount, fundraising, or product-roadmap profile.

The defense and national-security relevance is credible but indirect. Secure access, least-privilege segmentation, contractor connectivity, and policy-controlled access to cloud or on-premise systems are relevant to defense contractors, critical infrastructure operators, and government-adjacent organizations. The platform is enabling cybersecurity infrastructure, not a defense-native mission system, and the public evidence does not establish classified deployments, government contracts, or defense-specific accreditation. The main diligence question is therefore integration and assurance: whether Check Point's product provides the required identity, logging, data-residency, availability, and administrative controls for high-consequence environments without creating unacceptable vendor concentration or migration risk.
"""
