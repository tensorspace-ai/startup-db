name = "Sightec Ltd."
description = "Sightec develops software-first visual autonomy and real-time situational awareness for drones. Its NavSight product is designed to provide GNSS-free navigation and mission continuity across existing UAV platforms, including in jamming, spoofing, and other denied environments."
detailed_description = """Sightec is an Israeli drone-autonomy company whose main proposition is to make existing unmanned aircraft understand their visual environment and continue operating when satellite navigation is unavailable or unreliable. The company markets NavSight as an add-on visual-navigation system rather than a complete airframe, and describes deployment options ranging from software that runs on a customer's camera and processor to configurations using Sightec's own camera, processor, sensor module, or ground unit. This modular approach targets OEMs, integrators, and operators that need to upgrade mixed fleets without replacing the aircraft. The core technical stack combines computer vision, machine-learning inference, visual positioning, flight-controller integration, and real-time perception from onboard imagery.

The capability is important because GNSS denial is no longer a theoretical edge case for autonomous flight. Jamming, spoofing, urban canyons, poor visibility, and infrastructure or emergency environments can all degrade the assumptions behind conventional navigation. Sightec says its system supports visual navigation from takeoff through landing, day and night, and can provide detection, classification, tracking, 3D mapping, and change detection in addition to positioning. These are company and public-program claims rather than independently verified performance results, so diligence should request flight-test data, environmental envelopes, failure modes, latency and compute requirements, and evidence that the system degrades safely when imagery is insufficient. If validated, the product can reduce dependence on external navigation signals while preserving the value of an installed airframe and flight controller.

The commercial customer set is potentially broad but operationally demanding. Sightec identifies governments, drone OEMs, system integrators, and service providers across aerospace and defense, homeland security, security, delivery, inspection, and emergency response. The Israel Innovation Authority describes target markets including drone inspection and delivery, UAVs, urban air mobility, security integrators, and first responders, while an EIC Accelerator project list identifies beyond-visual-line-of-sight navigation for logistics drones in urban environments. The company currently states that more than 4,000 NavSight installations support GPS-denied operations worldwide. That is a meaningful traction signal, but the database should not treat installations as equivalent to recurring software revenue, active fleet coverage, paid customers, or gross margin. The most important commercial questions are deployment-to-contract conversion, renewal or upgrade economics, integration time per platform, customer concentration, and how much support is required after installation.

Sightec operates in a crowded autonomy stack. It faces direct competition from visual-positioning and navigation specialists, substitutes from inertial, radio, terrain-relative, and multi-sensor navigation vendors, and bundled alternatives from drone manufacturers, autopilot platforms, and defense primes. Relevant comparators include Eyeways Systems, Exyn Technologies, Skydio, Auterion, and Sensing Technologies; these companies are not identical substitutes, and some compete only for portions of the autonomy budget. Sightec's plausible edge is the combination of hardware-agnostic retrofit packaging, low-disruption integration, and a focus on mission continuity in GNSS-denied conditions. That edge must be tested against algorithmic performance, intellectual property, flight-data scale, integration know-how, and customer switching costs rather than inferred from positioning language alone.

For a dual-use and national-security thesis, Sightec is a credible fit because the underlying capability is useful in both civilian and defense operations without requiring a forced military narrative. Commercial inspection, delivery, emergency response, and urban-air-mobility missions can encounter navigation loss, while tactical reconnaissance, security patrol, and other government missions deliberately plan for contested spectrum and unreliable GNSS. Public evidence also includes Israeli Innovation Authority support, EIC Accelerator selection, and reported seed or convertible financing, but detailed current revenue, ownership, contract, and certification information is not readily public. The company appears to have moved beyond laboratory experimentation toward initial revenues and field deployment, yet it remains a private, relatively small business whose scaling, repeatability, and resilience to larger bundled competitors require verification."""
