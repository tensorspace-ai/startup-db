investment_rationale = "TENGable is a high-interest strategic diligence signal because it combines a specific deep-tech mechanism, a clinically grounded founding team, and public-sector validation tied to war-related rehabilitation. (1) The technical thesis is differentiated: a miniature TENG-based pressure interface may provide a lower-power route to localized sensory restoration than camera-mediated or brain-implant approaches. (2) Team-market fit is credible through Tel Aviv University biomedical engineering, Sheba hand microsurgery, and a healthcare-experienced CEO. (3) The Israel Innovation Authority and Ministry of Health pilot is more meaningful than a pitch-deck claim because it places the device in a real clinical-rehabilitation pathway. (4) The negative evidence matters: funding amount, regulatory status, first-in-human outcomes, patents, revenue, and customer economics are not publicly established. The legacy investible flag represents internal strategic priority and diligence interest, not an investment recommendation."
strategic_value = "TENGable could strengthen medical and national resilience by improving functional recovery after severe peripheral-nerve injuries, including injuries sustained by soldiers and first responders. A successful implant would address a neglected layer of rehabilitation: restoring protective sensation so a repaired limb can be used more safely and effectively, rather than treating movement alone. Its Israeli university-to-hospital pathway also contributes to sovereign capability in neurotechnology, microsurgery, and advanced biointerfaces. Strategic value remains conditional on clinical outcomes, long-term implant safety, manufacturing quality, regulatory approval, and proof that the device improves patient function enough to justify surgery and follow-up."
