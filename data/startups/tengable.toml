name = "TENGable"
description = "TENGable is an Israeli medical-device startup developing Re-Sense, an implantable neurotechnology platform intended to restore tactile and temperature sensation after peripheral-nerve injury. Its core approach combines a biohybrid neural interface with triboelectric sensing and is being advanced toward clinical rehabilitation, including a Sheba Medical Center pilot for war-injured soldiers."
detailed_description = """**Product and the problem it solves.** TENGable is addressing a narrow but consequential failure in reconstructive medicine: surgery can reconnect a damaged finger, hand, or peripheral nerve and restore movement, yet patients may remain unable to feel pressure, contact, heat, or potentially damaging force in the affected area. That sensory gap limits dexterity, work, rehabilitation, and personal safety; a person can injure a numb finger or cannot reliably judge grip and contact during ordinary tasks. The company’s current product narrative centers on Re-Sense, a small personalized implant intended to create an artificial sensory pathway between a pressure-sensing element in the injured area and a healthy nerve. The public materials describe restoration of both touch and temperature sensation as the target, while the earlier Israeli Innovation Authority account explains the initial clinical concept as a sensor placed under the skin that converts pressure into an electrical signal delivered to a healthy nerve. This is a specific medical-device proposition rather than a generic wearable or wellness product, and the intended value is functional sensation that can support safer, more independent use of an injured limb.

**Core technology and how it works.** The enabling idea is the triboelectric nanogenerator, or TENG: two dissimilar material layers generate an electrical potential when mechanical pressure causes them to contact and separate or move relative to one another. In the company’s earlier disclosed design, the voltage scales with applied pressure, allowing the sensor to encode something about the force of a touch without a conventional powered pressure transducer at the sensing site. That signal can be routed to a healthy sensory nerve so that the nervous system receives a patterned stimulus corresponding to contact. TENGable’s current technology page describes Re-Sense as a fully implantable, personalized device containing a pressure sensor, microprocessor, battery, and stimulation electrodes, while its public company story still emphasizes the self-powered, biocompatible TENG principle. The safest interpretation is that TENG is the distinctive sensing and energy-conversion foundation, while the product architecture has evolved toward a controlled implant-and-external-component system. The difficult engineering is not merely generating a voltage: it includes biocompatible packaging, long-term mechanical durability, stable signal calibration, safe stimulation amplitudes, surgical placement, tissue response, and consistent mapping between physical contact and a sensation the patient can learn to interpret.

**Market, customers, and go-to-market.** TENGable’s first market is specialist rehabilitation and reconstructive care for traumatic peripheral-nerve injuries, especially hand and limb cases where the patient has recovered or can recover motion but lacks useful sensation. The practical buyers and gatekeepers are hand surgeons, microsurgery departments, rehabilitation hospitals, clinical researchers, and eventually payers and national health systems; the end user is the patient, but implantation and follow-up require a coordinated clinical pathway. The company’s route to market is therefore appropriately clinical rather than consumer-first. It has used an Israeli technology-incubator framework, university and hospital relationships, regulatory support, and a government-backed hospital pilot to progress the device toward human studies. A successful commercial model would likely combine surgeon training, an implant procedure, patient-specific programming, follow-up assessment, and a replaceable or wearable control component, creating service and evidence requirements that are more demanding than selling a standalone sensor. Longer-term opportunities include sensory restoration for other peripheral-nerve injuries, selected chronic conditions, and man-machine interfaces, but those are expansion hypotheses rather than validated indications.

**Traction, funding, and third-party validation.** Public evidence places TENGable in an early clinical-development stage, but it is more substantive than an idea-only record. Startup Nation Finder identifies the company as founded in December 2022 by Ben Maoz, operating with a 1–10-person team, graduating from the G.O. accelerator in 2023, and developing a self-powered, biocompatible TENG implant. The Israel Innovation Authority reports that the technology originated in Tel Aviv University research, received Authority investment, and was being moved from laboratory work toward a product. In December 2025, the Authority, Ministry of Health, and Class Actions Foundation selected TENGable for a national physical-rehabilitation pilot at Sheba Medical Center to restore lost limb sensation with an internal implant and external component; the program explicitly addresses rehabilitation demand created by war-related injuries. The company also states that it has secured major funding, but no reliable public source reviewed here discloses a round amount, valuation, named institutional syndicate, revenue, or regulatory clearance. The public record supports technical and ecosystem validation, an important clinical pilot, and movement toward first-in-human studies; it does not yet establish efficacy, commercial adoption, or approval.

**Founders and team background.** The founding group combines the two disciplines most central to this product. Prof. Ben M. Maoz is identified by TENGable and the Innovation Authority as CTO and co-founder, a Tel Aviv University biomedical-engineering and Sagol School of Neuroscience researcher whose laboratory work underpins the biohybrid device. Dr. Amir Arami is CMO and co-founder and is publicly described as head of hand surgery and microsurgery at Sheba Medical Center; the original Authority account says the clinical problem emerged from his experience restoring injured fingers without restoring their sensation. CEO Shai Feinsod is described by the company as a healthcare executive with more than 25 years in U.S. and Israeli startups, providing company-building and commercialization experience rather than only academic invention. The public team page also names R&D, clinical-affairs, engineering, finance, and product contributors, including Maximiliano Sisti, Yechiam Sapir, Arkady Glukhovsky, and Netta Deutschman. This team is unusually well matched to the problem at the concept-to-clinic interface, but the public record does not establish the full manufacturing, quality-system, regulatory, reimbursement, or large-scale clinical-operations bench needed for a global implant company.

**Competitive dynamics and defensibility.** TENGable competes against several different approaches rather than one identical device. Conventional nerve repair, grafting, tendon and reconstructive surgery, occupational therapy, and sensory-substitution training remain the default alternatives because they are familiar and already reimbursed, even when they cannot restore normal sensation. Integrum (osseointegrated prosthetic interfaces and implant-connected prosthetics), Coapt (myoelectric prosthetic control), Phantom Neuro (wireless peripheral-nerve interfaces for prosthetic control), Ripple Neuro (implantable neural recording and stimulation interfaces), and Blackrock Neurotech (implantable brain-computer interfaces) represent adjacent technology pathways that could address control or feedback needs with different surgical and regulatory tradeoffs. TENGable’s potential edge is a small, localized, mechanically responsive interface that can harvest or encode touch at the site of injury and stimulate an existing healthy nerve, potentially avoiding the external cameras, complex brain surgery, or large prosthetic-electronics stack used by other approaches. The edge is not proven. Defensibility will depend on durable biocompatible packaging, reproducible sensation quality, low revision rates, patient-specific calibration, clinical outcomes, patent scope, and a surgeon-friendly procedure that improves function enough to justify its cost and risk.

**Defense, security, and resilience relevance.** TENGable has credible strategic dual-use relevance at the medical-resilience layer. The December 2025 national pilot was selected specifically for rehabilitation of people injured in the Iron Swords war and includes soldiers and reservists in its stated target population; this is direct public evidence that the technology is being evaluated against a security-related injury burden, not merely a hypothetical military market. Restoring sensation after blast, crush, laceration, or other peripheral-nerve injury could improve a service member’s ability to handle tools, operate equipment, protect a repaired limb from unnoticed damage, and return to work or duty, although no source reviewed here establishes a military procurement, battlefield deployment, or defense contract. Civilian trauma, industrial injury, diabetic or other disease-related sensory loss, and rehabilitation-center care supply the commercial base. The underlying low-power sensing and nerve-interface concepts also have longer-horizon relevance to prosthetics, robotic control, and human-machine interfaces, but those possibilities should remain explicitly separated from the current clinical indication. TENGable is best classified as resilience-enabling neurotechnology with defense adjacency, not as a weapons or operational-defense platform.

**Growth stage, trajectory, and key diligence risks.** TENGable is early: it was incorporated in 2022, remains small, describes its device as progressing toward first-in-human studies, and has not publicly disclosed regulatory clearance, a priced financing history, recurring revenue, or a commercial installed base. The trajectory is constructive because a university-originated invention has become a named company, attracted a healthcare-experienced CEO, passed through an accelerator, developed a defined product architecture, and entered a government-supported clinical-pilot pathway at Sheba. The main diligence questions are concrete: (1) whether the implant produces clinically meaningful, learnable sensation rather than only measurable nerve stimulation; (2) the durability, infection, migration, fibrosis, battery, and revision profile of the implant; (3) the size and inclusion criteria of the Sheba pilot and whether outcomes are independently assessed; (4) regulatory classification, quality-management maturity, patent ownership, freedom to operate, and the path to human trials; (5) manufacturing yield and sterilization economics for a miniature implant; (6) reimbursement, surgeon training, and long-term follow-up costs; and (7) financing runway for a capital-intensive clinical program. If those gates are cleared, TENGable could become a differentiated Israeli neuroprosthetic and rehabilitation company with meaningful civilian and defense-resilience value. Until then, its promise is evidence-backed but clinical, regulatory, and commercial execution remain unproven."""
