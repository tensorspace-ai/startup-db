use_cases = ["Live video transformation, visual effects, and virtual try-on", "Interactive gaming, streaming, commerce, and advertising experiences", "Developer APIs for real-time generative media", "Autonomous-vehicle training and long-tail scenario testing", "Robotics policy training in controllable synthetic environments", "Drone, maritime, and off-road autonomy simulation", "Mission rehearsal and operator training where rare or dangerous events are costly to stage", "AI inference cost and latency optimization for enterprise workloads"]
