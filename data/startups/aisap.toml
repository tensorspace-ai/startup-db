name = "AISAP"
description = "AISAP is an Israeli medical deep-tech startup building an AI operating system for point-of-care ultrasound. Its FDA-cleared cardiac software guides acquisition, interprets ultrasound at the bedside, and produces structured reports so clinicians can make faster decisions when specialist imaging capacity is limited."
detailed_description = """
**Product and the concrete problem.** AISAP targets a practical bottleneck in medical imaging: ultrasound equipment is increasingly portable, but a scan is only useful when someone can acquire a diagnostic view and interpret it. Emergency departments, internal-medicine wards, primary-care clinics, nursing facilities, and rural or underserved sites often lack immediate access to an expert sonographer or cardiologist. AISAP's Point-of-Care Assisted Diagnosis (POCAD) approach combines acquisition guidance with AI interpretation so a clinician can perform a focused exam and receive actionable measurements at the bedside. The company's first commercial package, AISAP CARDIO, focuses on cardiac ultrasound and is FDA cleared. Its broader POCUS-OS platform connects an ultrasound device to image storage, AI results, reporting, and the electronic medical record. The concrete operational goal is to shorten the time from scan to decision, reduce avoidable patient transfers, and identify structural heart disease earlier without requiring every operator to be an echocardiography specialist. AISAP is not selling a new ultrasound probe; it is building a software layer that can work with devices already deployed in a health system, which lets hospitals adopt the workflow without replacing their imaging fleet.

**Core technology and how it actually works.** AISAP describes a pipeline with several distinct technical steps. During acquisition, the software gives guidance intended to help a non-expert obtain usable cardiac views and provides quality feedback. The captured study is then processed by deep-learning models that measure cardiac structures and function and return an urgency score or diagnostic suggestion in language a clinician can understand. A dedicated PACS can anonymize DICOM files and store them on premises or in the cloud, after which the system generates a structured report for user approval and sends the finalized report to an EMR. The company says its models were trained on more than 300,000 studies comprising over 24 million video clips, and that clinical and algorithm work has involved Mayo Clinic, Mass General Brigham, Inova, Jefferson, Sheba, Poriya, Ichilov, and Stanford partners. The FDA 510(k) record identifies the AISAP CARDIO V1.0 device, while the company states that the platform has FDA-cleared diagnostic algorithms. Those facts establish a regulated product and a substantial development dataset, but they do not by themselves establish performance across every probe, population, or pathology. Public sources do not disclose model architecture, subgroup sensitivity, calibration methodology, or the exact boundaries of autonomous versus clinician-reviewed output, so independent validation remains a key diligence requirement.

**Market, customers, and go-to-market.** AISAP sells into health systems and clinicians that need more diagnostic capacity at the point of care. Its commercial workflow can be adopted by emergency physicians, internists, cardiologists, primary-care providers, skilled-nursing organizations, and home-care teams. The company reports that the platform works with any point-of-care ultrasound device, PACS, and EMR, which supports a software-first enterprise sale and reduces dependence on a single hardware manufacturer. The first wedge is cardiac POCUS, where earlier detection of reduced ejection fraction, valvular disease, or right-heart strain can change triage and referral decisions. The expansion path is broader ultrasound and additional care settings once the company has earned trust with a regulated cardiac workflow. AISAP's public references include Sheba Medical Center, Inova Health System, and U.S. physician practices such as Amavita Heart and Vascular Health and Soffer Health Institute; its website also lists clinical research relationships with Mayo Clinic, Mass General, Jefferson, and Stanford. The company has announced a U.S. presence in New York and Boston and an Israeli R&D base. Its global health thesis is visible in announced work in underserved Florida communities and an Africa launch, but customer counts, annual recurring revenue, contract sizes, and renewal data are not public.

**Traction, funding, and third-party validation.** AISAP announced a $13 million Seed round in May 2024 led by Harel Insurance Investments and Shoni Top Ventures. The financing followed earlier support associated with the same health-focused investors and funded product development and commercialization. In 2024, the company reported that its algorithms had been trained on the large multi-site dataset described above and that a Sheba study of 660 patients who had not received a full ultrasound found at least one previously unknown moderate condition in 29% of cases; the announcement said that study was still under review, so the statistic should not be treated as a definitive clinical-outcomes result. More durable validation arrived through regulation: AISAP CARDIO received U.S. FDA clearance, and the FDA's public 510(k) summary identifies the Ramat Gan, Israel manufacturer and device name. The company also reports use across health systems, hospitals, and clinics worldwide, with customer testimonials describing faster reporting, improved throughput, and earlier recognition of structural heart disease. Those testimonials are useful commercial evidence but are company-selected and not equivalent to a randomized trial. AISAP's listing in Israel Innovation Authority materials records the company as established in 2022, with approximately 40 employees and initial revenues, while LinkedIn likewise describes a team of roughly that scale. The combination of clearance, clinical partners, and initial revenues is stronger than a preclinical medtech profile, though reimbursement, utilization, and independent post-market evidence remain open.

**Founders and team background.** AISAP was founded by a deliberately cross-disciplinary group. Adiel Am-Shalom managed R&D and cyber teams in the Israel Defense Forces' elite 8200 intelligence unit and founded IDL. Ehud Raanani is associated with the Leviev Cardiovascular and Thoracic Center at Sheba Medical Center. Robert Klempfner is identified as a director of the Israeli Center for Cardiovascular Research and serves as a clinical leader at AISAP. Ehud Schwammenthal is an echocardiography specialist and the founder of Ventor Technologies and Magenta Medical. The founding composition pairs software, cybersecurity, cardiology, and medical-device commercialization rather than relying on an algorithm team alone. AISAP's current public leadership page lists Eran Taus as CEO, with algorithm, product, business, clinical education, and customer-success roles around the founders. That breadth matters because the hard part of clinical AI is not only model accuracy; it is workflow integration, regulatory evidence, clinician trust, and support across heterogeneous devices. The team still faces medtech execution risks. Public sources do not give a complete headcount by function, the current ownership structure, or the proportion of revenue from each geography. The 8200 connection is relevant to engineering discipline and secure systems, but it should not be treated as evidence of defense procurement or military medical deployment.

**Competitive dynamics.** AISAP competes in a market split between ultrasound hardware manufacturers, AI-guidance specialists, and hospital imaging workflows. Butterfly Network, Clarius, and EchoNous combine portable probes with software and compete for the same bedside workflow, while GE HealthCare, Philips, and Siemens Healthineers bring installed-base trust, service organizations, and cardiology relationships. Caption Health, now part of GE HealthCare, demonstrated the value of AI-guided cardiac ultrasound and represents an incumbent route for embedding similar assistance into a large imaging portfolio. Israeli peer UltraSight focuses heavily on AI guidance for acquiring cardiac views, while AISAP's public positioning extends from guidance into interpretation, PACS, structured reporting, and EMR integration. That end-to-end workflow could reduce friction for hospitals that want one accountable vendor, but it also creates more regulatory and integration surface area. AISAP's potential edge is a device-agnostic operating layer and a large training set linked to clinical partners, not an exclusive hardware channel. The company must prove that its models generalize across probes and operators, that reports fit clinician workflows, and that time savings translate into reimbursable or outcome-relevant value. Larger imaging vendors can bundle acquisition guidance and interpretation, and hospital buyers may prefer a single incumbent contract even when a specialist product is technically stronger.

**Defense, security, and resilience dual-use relevance.** AISAP's core product is civilian clinical software, yet its technical profile has a credible resilience and austere-medicine transfer path. Portable ultrasound is already used for trauma assessment, lung and cardiac evaluation, and triage in ambulances, field hospitals, ships, and disaster-response settings. A regulated AI layer that guides acquisition and provides immediate measurements could help medics or generalist clinicians operate with less access to specialist interpretation, reducing dependence on evacuation or remote consultation during mass-casualty events. On-premises deployment and anonymized DICOM handling are also relevant to organizations that cannot send sensitive medical data to an external cloud. The founders' Israeli defense and emergency-care networks make this adjacency plausible, and the company's focus on shortening time to diagnosis aligns with military medicine and civil-defense resilience. The calibration is essential: AISAP has not disclosed an IDF contract, defense trial, battlefield validation, ruggedized hardware, operation in communications-denied settings, or a government medical-device authorization. Its FDA clearance is a civilian regulatory milestone, not military qualification. The dual-use case is therefore based on a transferable point-of-care sensing and decision-support capability, with strategic value that depends on future validation in austere, high-volume, and secure environments.

**Growth stage, trajectory, and key diligence risks.** AISAP fits the mid stage more than the earliest category because it was established in 2022, has a reported team of about 40, raised a $13 million Seed round, received FDA clearance for AISAP CARDIO, and reports initial revenues and use across health systems. It is still a growth-stage medtech rather than a mature platform: public sources do not disclose revenue scale, utilization per site, gross margins, payer coverage, or renewal rates, and the broader POCUS-OS vision still requires integrations and clinical adoption. The trajectory is to expand from cardiac screening and acute-care workflows into more providers, geographies, and ultrasound applications while preserving regulatory and clinical credibility. Key diligence risks are: (1) **clinical generalization**, because performance may vary by device, operator skill, patient population, and pathology; (2) **regulatory expansion**, since each new algorithm or indication can require additional evidence; (3) **workflow adoption**, because clinicians may resist generated reports or still require specialist confirmation; (4) **reimbursement and economics**, because faster diagnosis does not automatically create a paid service line; (5) **incumbent competition**, including bundled AI from GE, Philips, and cloud-imaging providers; (6) **data governance**, particularly when DICOM studies cross borders or enter cloud systems; and (7) **dual-use execution**, because austere-medicine deployment would require ruggedization, cybersecurity, offline workflows, and field validation absent from current disclosures. AISAP is strategically attractive as a regulated Israeli AI-sensing company with an observable route from commercial healthcare into resilience, but its strongest evidence today is clinical and regulatory rather than defense-specific.
"""
