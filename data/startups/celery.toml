name = "Celery"
description = "Celery is a Tel Aviv fintech startup that provides an AI-assisted audit layer for payroll, revenue, and expense controls. Its platform analyzes uploaded or connected financial data to surface errors, leakage, policy exceptions, and other issues before they become costly losses."
detailed_description = """Celery addresses a specific finance-operations problem: payroll and revenue controls are often performed manually across spreadsheets, disconnected systems, and recurring review processes. Its product combines automated data ingestion, rule-based checks, anomaly detection, and workflow-oriented review so finance teams can investigate exceptions rather than recheck every record. The public product is organized around Payroll Guard and Profit Shield, with the company positioning the platform as a low-integration audit layer that can connect to or accept uploaded data and begin producing findings quickly.

The initial customer wedge is labor-intensive businesses, particularly healthcare providers with large workforces and complex overtime, PTO, bonus, and billing processes. Celery's site says it reviews approximately $30 million in payroll each week and presents case studies and testimonials from healthcare operators; CTech reported in 2025 that the technology was used by dozens of U.S. healthcare providers and had processed more than $550 million in payroll data. These are meaningful commercialization signals, but they are primarily company- or media-reported claims and should be validated through reference calls, retention data, cohort economics, and independent confirmation of savings. The company's low-integration approach may shorten deployment for mid-sized operators, while also creating questions about data normalization, repeatability across payroll systems, and the durability of its detection models.

The competitive set spans payroll and workforce-management suites, financial controls and spend-management products, audit and compliance software, and internal analytics built on a customer's existing ERP or payroll data. Celery can win where a customer has fragmented operational data and a clear cost of manual review, but the product must show a superior signal-to-noise ratio and measurable prevention of overpayments or revenue leakage. Incumbents can add anomaly detection, while horizontal analytics and robotic-process-automation tools can reproduce parts of the workflow. Defensibility is therefore more likely to come from proprietary operating data, domain-specific controls, integrations, customer workflow adoption, and verified savings than from a generic AI label.

Celery has credible early-stage commercial momentum: the company describes a 2024 paid pilot that saved a U.S. care business $151,000 in overtime costs, and CTech reported a $6.25 million seed round in May 2025, bringing reported total funding to $9 million. The official site also identifies co-founders Yuval Brot, Noam Slomianko, and Hillel Shalev and lists a Tel Aviv hiring presence. For national-security analysis, the direct case is limited. Financial-control automation could help defense contractors or other regulated organizations manage labor and project-cost leakage, but the core product is not a defense technology, cyber-defense capability, or mission system. Any defense relevance would require evidence of customers, compliance workflows, handling requirements, or deployment in defense supply chains; it should not be inferred from Israeli origin or a technical founder's background."""
