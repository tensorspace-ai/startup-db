name = "Venice"
description = "Venice is an Israeli cybersecurity startup building a modern privileged access management platform for human, machine, and AI-agent identities. Its core proposition is zero-standing-privilege access: discover permissions across hybrid environments, grant narrowly scoped access when work requires it, and remove it when the task ends."
detailed_description = """Venice addresses a specific weakness in legacy privileged access management (PAM): enterprise access is frequently granted through long-lived permissions, shared accounts, vaults, tickets, and manual approval chains that are difficult to operate across cloud, SaaS, on-premises, and increasingly automated environments. The company presents a unified, agentless control plane that discovers identities and entitlements, evaluates a request using identity, task, device, environment, and risk context, and applies policy-driven just-in-time access. Its product pages also describe session accountability, audit trails, shared-account support, and a migration path from existing vault-based PAM rather than requiring an immediate rip-and-replace.

The product is aimed at large enterprises whose access estates are fragmented across infrastructure, applications, cloud providers, contractors, and non-human identities. Venice says it serves human and machine identities and has added a runtime identity gateway for AI agents: an agent call is evaluated against the declared task, tied back to an owner, and governed as a temporary privilege rather than as an unaccountable standing credential. This positioning is commercially timely because the number of automated workflows and agents is increasing while security teams still need controls that work with legacy systems. The company claims customer deployments in large enterprises and illustrates outcomes such as materially reducing standing privileges, but those customer references and performance claims remain primarily company-reported and should be validated during diligence.

Venice emerged publicly in February 2026 after operating under the name Valkyrie. Its founders are Rotem Lurie, chief executive, and Or Vaknin, chief technology officer; public reporting describes their backgrounds in product and cybersecurity roles and the company’s offices in Tel Aviv and New York. Venice announced $33 million of total funding, including an $8 million seed round and a $25 million Series A led by IVP with participation from Index Ventures, Vine Ventures, Holly Ventures, and security-industry angels. Index Ventures reported that the company had displaced legacy competitors in a number of Fortune 500 enterprises, but the public record does not provide enough detail to independently assess recurring revenue, retention, deployment count, or the durability of those wins.

The competitive problem is credible but difficult. CyberArk and BeyondTrust have established PAM relationships, installed bases, and compliance workflows; Delinea and StrongDM also compete for privileged, just-in-time, or infrastructure access use cases. Venice’s potential edge is a lighter, agentless operating model that unifies access requests, contextual authorization, session accountability, and migration from static privilege across hybrid infrastructure. The company must prove that this is a durable control-plane advantage rather than a more usable front end over incumbent capabilities, and that it can integrate deeply enough with customer directories, clouds, endpoints, ticketing systems, vaults, and infrastructure without creating a new operational dependency.

Venice has credible dual-use relevance because the same identity and privilege failures affect commercial enterprises, defense contractors, critical infrastructure, and government IT: stolen credentials and excessive permissions can enable lateral movement, persistence, data loss, or disruption. Just-in-time, least-privilege access is relevant to sensitive engineering, operational, and administrative environments. There is no public evidence in the reviewed sources of a military deployment or government contract, so defense relevance should be treated as an adjacency and diligence hypothesis, not as established traction. The strategic case is strongest for allied defense supply chains and regulated operators that need to modernize privileged access while retaining hybrid and legacy systems."""
