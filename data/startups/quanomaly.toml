name = "Quanomaly"
description = "Quanomaly is an Israeli early-stage deep-tech company developing quantum-magnetometry sensors for detecting and classifying weak magnetic anomalies beneath land and water. Its intended commercial applications include mineral exploration and maritime resource intelligence, while the same compact sensing capability has credible security and defense relevance for subsea awareness and unexploded-ordnance or infrastructure detection."
detailed_description = """
**Product and the problem it solves.** Quanomaly is developing a sensing product for a difficult class of geophysical and maritime decisions: finding objects, deposits, or structures that generate very weak magnetic signatures below the ground, seabed, or water column. Its public materials position the company around quantum magnetometry and describe a sensor that can turn subtle magnetic anomalies into actionable intelligence for resource exploration and maritime operations. The commercial problem is that conventional magnetic surveys can require slow, expensive, or physically large instruments, while mineral explorers and marine operators need to cover larger areas with fewer false starts and better early evidence. Quanomaly's public LinkedIn positioning specifically connects the technology to copper, lithium, and nickel exploration, arguing that more precise targeting could reduce unnecessary drilling, excavation, and environmental disturbance. The product thesis is therefore not simply a more sensitive laboratory magnetometer; it is a compact sensing layer intended to improve the go/no-go decision about where to survey, what to investigate, and whether a resource or submerged object warrants a larger program. No customer deployment, contract, revenue figure, or completed commercial product shipment is publicly disclosed, so the value proposition remains a technically credible early-stage thesis rather than established market performance.

**Core technology and how it works.** Quantum magnetometry uses quantum states as the reference for measuring magnetic fields, allowing a sensor to resolve changes that can be difficult to distinguish with conventional fluxgate or cesium-vapor instruments. Quanomaly's IVC and Blue Economy profiles say its design uses advanced quantum methods to improve signal-to-noise ratio and detect minute magnetic signatures at greater depths and distances than traditional sensors. A founder post gives a company-reported target sensitivity in the pico-tesla range and says the system is intended to be small enough for aircraft, drones, surface vessels, and autonomous underwater vehicles. In a practical survey, the instrument would measure the local magnetic field while a platform moves through a search area; location, orientation, platform motion, and background-field variation would then have to be corrected before algorithms can separate an object or geological body from noise. A useful three-dimensional result would require repeated measurements, calibrated positioning, geophysical inversion, and confidence estimates, not just a single high-sensitivity reading. Public sources do not identify the quantum modality, optical or microwave readout, shielding, gradiometer architecture, sampling rate, calibration process, map-reconstruction software, or independent sensitivity test. Those missing engineering details are central diligence questions because laboratory sensitivity does not automatically translate into useful detection range on a moving platform in magnetically noisy coastal, industrial, or seabed environments.

**Market, customers, and go-to-market.** Quanomaly has articulated a B2B route into two adjacent markets. The first is mineral and raw-material exploration, where mining companies, geological survey organizations, and exploration contractors could use high-sensitivity magnetic mapping to rank targets before drilling or seabed sampling. The company's LinkedIn profile frames the product around “surgical” exploration intelligence for the metals needed in batteries, turbines, and power grids; that message addresses both exploration economics and the environmental pressure to disturb less ground. The second market is maritime and subsea sensing. The public Blue Economy material describes integration with AUVs and aerial platforms, while Israeli media identifies applications in maritime infrastructure, resource exploration, and security. A realistic initial go-to-market path would be paid feasibility surveys or sensor integration with an existing AUV, drone, aircraft, or marine geophysics provider, followed by repeatable equipment sales or a data-and-analysis service. This is an inference from the stated platform integrations, not a disclosed pricing model. The company will have to choose whether it is primarily a sensor OEM, a survey-services provider, or a vertically integrated intelligence business. Each option carries different manufacturing, support, data ownership, and procurement requirements. The public record names no paying customer or production partner, so market access and repeatability remain unproven.

**Traction, funding, and third-party validation.** Quanomaly is unusually new but has several independent signals beyond a directory-only mention. CheckID records QUANOMALY LTD as an active Israeli private company, incorporated on February 10, 2026, with a Haifa address and company number 517297453. IVC lists Quanomoly Ltd in Haifa, identifies a B2B quantum-technology and sensor business, names Idan Levy as CEO and founder and Nadav Kaminer as co-founder, and describes the quantum-magnetometry thesis. The Israeli National Center of Blue Economy has profiled and welcomed the company, and a later ecosystem post says Quanomaly completed full water trials and was moving from R&D into development of its first system. Those trial and performance statements are ecosystem-reported and do not include a test protocol, range, false-alarm rate, or raw results. Israel Hayom reported that HiCenter Ventures had invested in Quanomaly alongside other blue-economy companies, while Kaminer's public founder announcement described the company as pre-seed, invited Friends & Family participation, and claimed a TRL-5 technology after proof-of-concept trials. The amount, closing date, lead-investor terms, grant status, customer identities, and revenue are not publicly confirmed. The evidence supports an active company with ecosystem and financing interest, but not a conclusion that its sensor has reached production or passed independent operational evaluation.

**Founders and team background.** The public founding group combines electronics and deep-tech entrepreneurship with maritime and defense experience. IVC and the company announcement identify Idan Levy as CEO and founder and Nadav Kaminer as co-founder. Kaminer's public post says the venture was established with Ariel University and with Brigadier General (res.) Dani Maoz and Lieutenant Colonel (ret.) Hanan Marom, whom he describes as a world expert in the underwater domain, alongside Levy, an electronics engineer and serial deep-tech entrepreneur. The Blue Economy profile describes the broader team as multidisciplinary across quantum physics, signal processing, and Blue Tech. That combination maps well to the product's actual execution problem: quantum sensing must be converted into a rugged, position-aware geophysical instrument, then into an interpretable survey result that a mining or maritime customer can use. The Ariel University connection is also technically relevant; the university's research record includes work on chip-scale nanophotonic atomic quantum magnetic sensors, although that publication does not establish that Quanomaly owns, licenses, or commercializes that exact research. Levy's parallel role as a founder of Skana Robotics is a diligence item rather than evidence of corporate overlap: Skana is a separately described autonomous-vessel company, while Quanomaly is separately incorporated and centered on quantum magnetometry. Public sources do not provide Quanomaly's employee count beyond a 2–10 LinkedIn range, a complete technical roster, patent assignments, or the exact division of university and company intellectual property.

**Competitive dynamics.** Quanomaly competes with several technology classes, and the relevant comparison depends on whether the buyer wants a sensor, a survey, or a decision service. Marine Magnetics and Geometrics represent established commercial magnetometer suppliers whose fluxgate or cesium-vapor instruments are familiar to geophysical survey operators. QuSpin develops compact atomic magnetometers and related quantum-sensing hardware, providing a benchmark for miniaturized high-sensitivity instruments. SBQuantum is developing quantum diamond magnetometers for geophysical and navigation applications, making it a particularly relevant emerging comparison. Infleqtion develops quantum sensors based on cold-atom platforms for navigation and other high-performance measurement tasks, while Q-CTRL develops quantum-sensing and navigation software and hardware partnerships. Large marine survey and engineering providers can also substitute for a new sensor by bundling conventional instruments, vessels, data processing, and interpretation. Quanomaly's prospective edge is the combination of pico-tesla-scale sensitivity, compact deployment, and a product narrative that links detection to three-dimensional resource or object classification. That edge is not yet demonstrated against incumbent systems. A durable moat would require independently measured field performance, repeatable manufacturability, proprietary calibration or inversion software, a strong dataset, and customer integration that competitors cannot easily reproduce. High sensitivity alone is not sufficient if platform motion, magnetic interference, or interpretation uncertainty erases the advantage in the field.

**Defense, security, and resilience relevance.** Quanomaly's core capability credibly serves both commercial and security contexts, which supports a true dual-use classification while requiring careful calibration. Mineral exploration is a civilian market, but the same ability to detect weak magnetic anomalies from aircraft, drones, AUVs, or surface vessels could support subsea situational awareness, maritime-domain monitoring, inspection of critical seabed infrastructure, detection of ferrous objects, and the search for unexploded ordnance. The Blue Economy ecosystem has explicitly described security and strategic applications, and Kaminer's announcement says the company has defense applications that cannot be expanded publicly. These statements establish intended relevance, not a verified military program. For Israel and allied states, compact distributed sensing could be strategically useful around ports, naval approaches, offshore energy assets, undersea cables, and contested or communications-constrained maritime areas. It could also reduce the cost and platform burden of persistent surveys, but magnetic data is not self-interpreting: bathymetry, geology, platform navigation, clutter, and classification models determine whether an anomaly becomes an actionable contact. There is no public evidence of a defense contract, classified deployment, Ministry of Defense award, military certification, or operational kill chain. The strongest current assessment is therefore strategic sensing adjacency with a credible path to defense and resilience deployment, not a fielded defense capability.

**Growth stage, trajectory, and key diligence risks.** Quanomaly is early-stage. The legal entity was incorporated in 2026, IVC classifies it as a young B2B quantum-sensing company, and the founder describes a pre-seed financing process. The ecosystem account of completed water trials and movement toward a first system suggests progress from laboratory proof toward product development, but the absence of independently published test results keeps the technical readiness claim provisional. A disciplined trajectory would be: first, reproduce sensitivity and detection results in a controlled independent test; second, demonstrate a calibrated system on a moving surface or underwater platform; third, run a blinded survey against known targets or geological structures; and fourth, convert one mining or maritime partner into a paid repeat deployment. The key risks are: (1) quantum-sensor sensitivity may degrade in rugged, moving, thermally variable field conditions; (2) magnetic interference from platforms, motors, power electronics, and nearby infrastructure may reduce usable signal-to-noise; (3) converting anomalies into reliable three-dimensional classifications may be harder than detecting them; (4) the company may face long qualification cycles and capital needs for marine hardware, field teams, and manufacturing; (5) the commercial choice between sensor sales, survey services, and data licensing may remain unfocused; (6) IP ownership and freedom to operate around university-originated research require verification; and (7) the parallel commitments of a very small founding team create execution and key-person risk. Milestones that would materially improve the assessment are an independent field benchmark, a named paid customer, a disclosed financing close, a patent family with clear ownership, and evidence that the first system works on an autonomous platform outside controlled demonstration conditions.
"""
