name = 'Cyclops Security'
description = "Cyclops Security Ltd. was an Israeli cybersecurity startup that built a generative-AI security search and CAASM platform. Check Point acquired 100% of the company in February 2026; its asset discovery and exposure context capabilities now appear in Check Point's CAASM offering."
detailed_description = """Cyclops Security Ltd. was an Israeli cybersecurity software startup founded in 2021 and headquartered in Tel Aviv-Yafo. Its product evolved from a generative-AI-powered contextual search interface for security teams into an asset visibility and cyber asset attack surface management (CAASM) capability. The company addressed a practical enterprise problem: organizations accumulate findings and asset records across cloud, on-premises infrastructure, endpoint, identity, SaaS, vulnerability, and security operations tools, but fragmented records make it difficult to answer basic questions about what is exposed, which controls cover it, and what deserves attention first.

At its July 2023 emergence from stealth, Cyclops announced $6.4 million in Seed funding and described a generally available search product built around a security-data mesh. The company said practitioners could ask questions about organizational security posture in natural language and receive contextual answers without requiring specialist SIEM or forensic expertise. Its stated objective was to connect data from existing tools, correlate relevant context, and help security teams validate risk and prioritize vulnerabilities. It claimed an 80% efficiency improvement in the funding announcement, but that release did not provide an evaluation design, sample, baseline, or independent validation. The performance statement should therefore be treated as company marketing, not demonstrated outcome evidence.

The July 2023 announcement named Merlin Ventures, Magnolia Capital (a subsidiary of Insight Partners), Tal Ventures, and toDay Ventures as round leads, with CrowdStrike Falcon Fund and individual cybersecurity executives also participating. Startup Nation Finder separately records an undisclosed Seed in September 2022. The public evidence reviewed does not establish whether that earlier entry was a distinct financing, an initial close, or a data error; the 2023 company statement is explicit about $6.4 million but does not clarify whether it is incremental or cumulative. Accordingly, $6.4 million is retained as company-reported funding, and no amount is assigned to the 2022 entry. No valuation, terms, cap table, or investor allocation was found.

Company-era leadership included CEO Eran Zilberman, CTO Elay Gueta, and CPO Biran Franco. CTech reports Zilberman's past commercial leadership roles at RSA and We Ankor; Gueta's public-sector and IDF research experience and roles at Cynet and Cellebrite; and Franco's product experience at Axonius, Microsoft Defender for Endpoint, and SentinelOne. These backgrounds suggest a blend of go-to-market, security research, and enterprise product-building experience, but public bios are not a substitute for evidence about execution quality, retention, or the team after acquisition. Startup Nation Finder lists 34 employees, but does not date that exact count; it should not be treated as a current headcount.

The company said in 2023 that it had customers in fintech, insurance, technology, and manufacturing. It did not name those organizations or publish customer counts, contract values, recurring revenue, retention, or production deployment details. The customer-sector statement is therefore useful evidence of claimed commercial activity, not proof of scale or repeatability. The publicly available record contains no company-specific revenue, ARR, gross margin, cash, burn, or runway metrics. Its claimed customer traction and product availability cannot by themselves establish product-market fit.

Check Point Software Technologies acquired 100% of Cyclops Security Ltd. in February 2026. Check Point's SEC filing identifies Cyclops as a privately held Israeli CAASM company and records approximately $53.7 million of total consideration. Calcalist reported approximately $75 million for Cyclops at the time of the transaction. These figures conflict; they may reflect a press estimate versus accounting consideration or distinct measures, but no reconciliation was located. The filed amount is the more authoritative measure for disclosed consideration. No shareholder-level proceeds or private cap table are public. Check Point's acquisition announcement describes Cyclops as providing continuously updated visibility across cloud, on-premises, IoT, and SaaS, including asset relationships, ownership, and exposure context. The original cyclops.security domain now redirects to Check Point's CAASM product page. That page describes a broader current product experience, including 150 prebuilt connectors, agentless asset discovery, control-coverage gaps, contextual identity mapping, and graph-based investigation. Because it is a post-acquisition product page, it does not establish that every listed current feature was built solely by Cyclops.

Cyclops competed in a crowded overlap between CAASM, cyber asset inventory, exposure management, security data platforms, and vulnerability prioritization. Axonius and Armis address asset intelligence and cross-tool discovery; Wiz addresses cloud security posture and attack-path context; Tenable, Qualys, and Rapid7 have established vulnerability-management platforms; and Seemplicity focuses on exposure operations and remediation workflows. Cyclops' disclosed positioning centered on contextual querying across fragmented security data and translating that data into risk-oriented investigation. Its potential advantage was less about owning a scanner and more about connecting existing tools into a usable security view. That proposition depends on integration breadth and maintenance, data freshness, entity matching, permission handling, explainable answers, and the ability to reduce analyst effort without introducing silent data errors. No independent benchmark or published head-to-head test was located.

Strategically, the acquisition placed the asset visibility capability inside a major cybersecurity platform with an established enterprise channel. Check Point positioned the deal as strengthening Exposure Management and continuous threat exposure management. This is consistent with wider platform consolidation, where buyers seek to connect asset discovery, vulnerability context, control coverage, and response workflows. The transaction validates strategic interest in the category, but it does not reveal Cyclops' standalone economics, integration quality, customer retention, or acquisition return. The integration's commercial value will depend on whether customers can connect diverse systems with low deployment friction, trust the resulting inventory, and use the context to make better operational decisions.

The product has general cybersecurity applicability to organizations that need asset visibility and exposure prioritization. While such capabilities could also be relevant to public-sector or defense software environments, research found no Cyclops-specific defense contract, military customer, government deployment, certification, or public-sector case study. A defense thesis would therefore be speculative. Intellectual-property searches did not find a patent confidently attributable to Cyclops Security Ltd.; this does not establish that no patents or other protected know-how exist. The key remaining diligence needs are the funding history's scope, the acquisition price discrepancy, customer names and retention, measurable product efficacy, technical data-quality controls, ownership allocation, post-acquisition team continuity, and the precise contribution of Cyclops technology to Check Point's current CAASM suite."""
