name = '6Scan'
description = "6Scan is an Israeli-origin website security provider whose site currently markets malware and ransomware scanning, malware cleanup, vulnerability detection, and automated website remediation. Its present operating status and current customer activity are not independently confirmed."
detailed_description = """6Scan Ltd. is an Israeli-origin website security company launched in 2011 by Nitzan Miron and Yaron Tal. The company says its headquarters and development team are in Tel Aviv, with a business team in San Francisco. It developed website security services intended to scan for malware and vulnerabilities and to repair or quarantine threats automatically. Historic product names include 6Scan Patrol and 6Scan Bodyguard. The current website markets malware and ransomware scanning, malware removal, vulnerability checks, and automatic repair. That establishes what the site offers visitors; it does not establish that the legal company remains operational, that the current service is staffed, or that those products remain actively maintained.

The initial customer problem was concrete: small website owners and businesses often lacked the security staff and budget to inspect websites, CMS installations, and hosting accounts for malware or exploitable software flaws. Contemporary company and press material describes a combination of scheduled scanning, server-side checks, blacklist monitoring, malware cleanup, and automated remediation. The automation promise could simplify security work for non-specialist operators, particularly when it can patch vulnerable code or quarantine malicious files without waiting for an administrator. However, automatic changes to a live site also carry operational risk: an incorrect patch or quarantine can break a site, and a scanner that misses an infection can create false confidence. Evidence about current detection coverage, supported CMS versions, remediation rollback, false positives, service availability, and independent efficacy was not found.

Historical commercialization leaned on direct subscriptions and hosting-provider distribution. In 2011 the company told Globes that it had contracts with hosting providers that would market its products and that revenue would use a profit-sharing model. A later research report recorded several hosting partners and said the company claimed more than 250,000 sites used its free scanner at that time. These are historical reports, not evidence that those partners, users, or contracts persist. The current website displays counters for users, websites protected, pages scanned, and threats blocked, but gives no measurement date or methodology. They should be treated as company assertions rather than audited customer, revenue, or deployment figures. No current financial statements, recurring revenue, customer renewals, retention, or customer references independently confirming ongoing service were located.

The financing record shows early backing from VentureGeeks and YL Ventures, a later YL Ventures follow-on, and a 2014 financing reported as a Series A or first funding round with Gregor Freund and private investors. Public sources conflict or use estimates for the amounts. There is no company-announced cumulative funding total, verified valuation, or disclosed current cap table in the material reviewed. Startup Nation Finder's archived profile reports that the company was non-active as of October 2014, while 6Scan's website currently serves marketing and product pages. This discrepancy makes current operating status a central diligence item. Neither website availability nor an old directory status settles whether the company, product, customer contracts, or intellectual property are active today.

The technology has ordinary commercial relevance to website resilience. In principle, automated web scanning and malware response can also help suppliers and organizations that support essential services, but there is no evidence that 6Scan sells to defense agencies, holds government contracts, carries security certifications, or has a defense-specific offering. Any security or defense-adjacent relevance should therefore be understood as a possible use of the general capability, not demonstrated defense traction. No patent number or independently verified patent assignment was identified despite historic company and media claims describing the technology as patented or patent-pending.

The investment and strategic case is conditional. The historical record indicates a real product effort, early venture backing, and a defined SMB website-security problem. The present website offers service descriptions and displays company-reported activity counters. Those are reasons to investigate, not proof of current product-market fit or a functioning growth company. Key open questions include legal status, the present operator and owners, active customer count and retention, current revenue and support capacity, product maintenance and hosting integrations, independently tested security outcomes, and ownership of any code or patent rights. Until those facts are confirmed, 6Scan should be assessed as a historically funded company with a current public web presence and unresolved operating status rather than as a verified active mature vendor."""
