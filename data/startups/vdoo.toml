name = "VDOO"
description = "VDOO was an Israeli product-security company focused on deep analysis of firmware, binaries, and embedded software. JFrog completed its acquisition of Vdoo Connected Trust in July 2021 and incorporated the technology and team into JFrog's software supply-chain security platform."
detailed_description = """VDOO built product-security technology for software that is difficult to inspect with conventional application-security tooling: firmware images, compiled C and C++ components, embedded operating systems, device packages, and other software artifacts shipped to connected products. Its platform combined automated binary analysis with software-composition analysis, vulnerability research, applicability assessment, and remediation guidance. The important technical proposition was not merely finding a CVE in a package, but determining whether a vulnerable component was present in a particular binary, how it was used, and what practical mitigation was available when source code or a normal package manifest was incomplete. JFrog described the technology as supporting static analysis, fuzzing, symbolic execution, binary similarity, zero-day research, and analysis of both source and compiled software, although the exact post-acquisition product boundary should be verified against current JFrog documentation rather than assumed from historical VDOO marketing.

The original customer problem was shared by device manufacturers, software suppliers, telecom and industrial operators, and security teams responsible for heterogeneous fleets with long support lifecycles. Embedded products often contain third-party libraries, copied code, vendor-specific configurations, and closed-source components that make conventional SCA noisy or blind. VDOO's approach was valuable where a manufacturer needed to assess a released image, where an operator had a firmware artifact but not a complete bill of materials, or where a security team needed to prioritize a vulnerability based on actual reachability and exploitability. These are commercially relevant needs in IoT, industrial control, automotive, medical devices, networking equipment, consumer electronics, and other cyber-physical systems, but the record should not infer specific customers, certifications, or recurring revenue without current primary evidence.

The company is no longer an independent venture-backed startup. JFrog announced the proposed acquisition in June 2021 and announced completion on July 19, 2021, with a transaction value described as approximately $300 million before later closing adjustments. JFrog stated that VDOO's team and technology would extend JFrog Xray and the broader JFrog Platform from conventional software artifacts toward edge, IoT, and devices. Subsequent JFrog material described binary-level contextual analysis, embedded-security expertise, and product-security capabilities as fruits of the acquisition. This provides a credible commercialization signal for the technology: it was purchased by a public software company and used to expand a broader DevSecOps product. It does not, however, prove that the former standalone VDOO SaaS remains available, that all original features survived integration, or that VDOO should still be evaluated as a current investable company.

Competitive pressure came from specialized embedded-security vendors, broader software-supply-chain and application-security platforms, device and OT security companies, and internal product-security teams. VDOO's strongest historical differentiation was depth on binaries and embedded environments, particularly the ability to identify components and assess vulnerability applicability when source-level visibility was limited. Its central strategic value was therefore an enabling capability inside a larger software-delivery platform rather than a permanent standalone category monopoly. The acquisition also creates integration and attribution questions: buyers evaluating the capability today should assess JFrog's current roadmap, licensing, deployment model, coverage of architectures and file formats, research output, and the extent to which device-runtime protection remains part of the offering.

The dual-use case is substantive but defensive. Firmware and binary analysis can help manufacturers and critical-infrastructure operators find weaknesses before deployment, and can help defense organizations evaluate the software supply chain of communications, sensing, logistics, and other embedded systems. The same capability can expose sensitive proprietary code and operational details, so deployment, data handling, export controls, and customer permissions matter. VDOO is strategically relevant to cyber resilience and supply-chain assurance, but because it is an acquired asset, the appropriate diligence question is how JFrog preserves and operationalizes that capability, not whether VDOO can independently raise capital or execute a startup growth plan."""
