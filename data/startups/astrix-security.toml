name = "Astrix Security"
description = "Astrix Security developed a platform for discovering, governing, and protecting non-human identities and AI-agent access, including API keys, service accounts, OAuth applications, secrets, and MCP servers. Cisco completed its acquisition on June 29, 2026; Astrix states that it is now part of Cisco and ended standalone sales of new licenses effective June 30, 2026."
detailed_description = """
Astrix Security addressed the identity layer created by software rather than people. Its platform correlated API keys, service accounts, OAuth grants, secrets, IAM roles, SSH keys, webhooks, and other machine-to-machine credentials across SaaS, cloud, on-premises, databases, vaults, CI/CD systems, and AI platforms. The product's central value proposition was continuous discovery with ownership and business context: security teams could see what an application or agent could reach, which permissions and tokens enabled that access, who created it, and whether the path was stale, excessive, anomalous, or hidden from normal identity-governance review. Astrix later framed this as a Discover-Secure-Deploy model for AI agents, MCP servers, and other non-human identities.

The technology matters because automation has outgrown traditional human-centric IAM processes. A service account or OAuth integration can remain active after its owner changes jobs, inherit broad permissions, or become a transitive path into sensitive systems. AI agents intensify the problem: an agent can combine a model, tools, credentials, and delegated authority, creating an access subject whose behavior and scope may change faster than a periodic access review. Astrix's identity graph, risk prioritization, remediation workflows, short-lived credentials, just-in-time access, and policy-at-provisioning approach are relevant controls for reducing privilege, improving accountability, and limiting blast radius. The company also described agentic threat detection and response for compromised credentials or out-of-scope actions, although the depth and operational performance of those capabilities require buyer-side validation.

The commercial market sits between identity governance, privileged access management, secrets management, SaaS security, cloud security, and emerging AI-agent security. Astrix's purpose-built focus gave it a clear problem narrative, but it also exposed the company to well-capitalized substitutes. CyberArk and Akeyless can control or broker secrets and privileged access; SailPoint and Microsoft Entra can extend governance and identity context; Wiz and other cloud-security platforms can identify cloud entitlement risk; and SSPM or integration-security products can cover subsets of SaaS connections. Astrix therefore needed to demonstrate that its cross-environment inventory, entitlement graph, connector coverage, and safe remediation were materially more useful than the combination of tools customers already owned. Public company material cited Fortune 1,000 adoption and named enterprise customer examples, but those statements are company-reported and should not be treated as independently verified revenue, retention, or deployment-scale evidence.

The company raised a reported $45 million Series B in 2024 and was founded in 2021. Cisco announced its intent to acquire Astrix on May 4, 2026 and later stated that the acquisition completed on June 29, 2026. Cisco plans to integrate Astrix capabilities into Cisco Identity Intelligence and extend them through Secure Access, Duo, and Splunk-related security workflows. That gives the technology a stronger distribution and telemetry context than Astrix had as a standalone vendor, while changing the diligence question from venture-scale independence to integration quality, customer continuity, product roadmap ownership, and team retention. The public record confirms the acquisition, but not the purchase price or the full commercial terms.

The dual-use case is credible but indirect. Defense, intelligence, critical-infrastructure, and defense-industrial environments depend on automated workflows, APIs, privileged service accounts, partner integrations, and increasingly AI-assisted systems. Discovery and least-privilege controls for those identities can reduce credential abuse, lateral movement, and supply-chain exposure. However, no public evidence reviewed here establishes a specific defense contract, deployment, accreditation, or classified-environment operation by Astrix. Its strategic relevance should therefore be based on the transferability of the technology and Cisco's enterprise security distribution, with deployment in restricted or disconnected environments treated as an open diligence question rather than an established capability.
"""
