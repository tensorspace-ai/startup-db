name = "Spacecom"
description = "Space-Communication Ltd. is an Israeli public satellite-communications operator that owns and operates the AMOS fleet, selling GEO capacity and managed connectivity to broadcasters, telecom and internet providers, enterprise networks, maritime users, and government organizations across Europe, Africa, the Middle East, and Asia."
detailed_description = """Spacecom is a mature infrastructure company, not a venture-stage startup. Founded in 1993 to commercialize Israel's AMOS communications-satellite program, the company operates the AMOS fleet and packages orbital capacity into broadcast, broadband, backhaul, managed VSAT, maritime, and government connectivity services. Its product is therefore an integrated service outcome rather than a standalone satellite component: customers buy coverage, bandwidth, gateway and teleport access, network operations, and service continuity. The company is listed on the Tel Aviv Stock Exchange as SCC, and its public materials describe an in-house operating team supported by teleports, content providers, hardware vendors, and other service partners.

The technical asset is a GEO communications architecture with multi-band payloads, regional and steerable beams, and ground-segment integration. Spacecom's official fleet pages identify AMOS-3 and AMOS-7 at 4 degrees West, AMOS-17 at 17 degrees East, and AMOS-4 at 65 degrees East, with Ku-, Ka-, and C-band capabilities across different satellites and beams. AMOS-17 is a fully digital high-throughput satellite with regional and spot-beam characteristics that can support higher-throughput services, while the company's managed-services material references VSAT platforms, SCPC, redundant internet connectivity, hub operations, and proactive monitoring. This is operationally important technology, but the defensible differentiation is fleet utilization, coverage design, service engineering, and customer integration rather than proprietary spacecraft science.

The customer and market context is mixed. Video distribution and contribution remain important for DTH operators, broadcasters, and media networks, while broadband backhaul, remote-site access, maritime connectivity, and government networks broaden the addressable demand. GEO still offers deterministic wide-area coverage, efficient multicast, and continuity for customers that cannot rely on terrestrial fiber or cellular networks. At the same time, LEO constellations are resetting expectations around latency, terminal mobility, and broadband pricing. Spacecom's announced multi-orbit work and Israeli regulatory approval to provide services using an Eutelsat LEO system indicate an attempt to respond to that architectural shift, but they should be treated as strategic direction rather than proof of a scaled LEO business.

Commercial diligence should focus on recurring capacity utilization, contract duration, customer concentration, cash generation, debt, satellite replacement timing, launch and insurance exposure, and the economics of moving customers from legacy video capacity toward data and managed services. Recent company press material reports approximately USD 22 million of net profit and approximately USD 76 million of operating cash flow for 2025, plus a 16 percent increase in AMOS-17 revenue; these are company-reported signals that warrant reconciliation to audited filings rather than being treated as a complete performance picture. The official site also highlights a 2026 GovNet announcement and satellite-IoT positioning, but public descriptions do not establish the scale, backlog, security classification, or customer concentration of those initiatives.

Spacecom has credible dual-use relevance because resilient satellite communications can support government continuity, emergency restoration, border and expeditionary connectivity, and public-sector networks in areas where terrestrial infrastructure is damaged, unavailable, or politically constrained. Its government-network offering and AMOS coverage make that adjacency substantive, while the underlying commercial services remain the primary business. There is no basis here to assert undisclosed defense contracts or military tasking. Strategically, Spacecom is best used in Claw & Talon as a public-company incumbent and ecosystem reference: it can illuminate regional satcom demand, capacity economics, GEO-to-LEO substitution, and potential distribution channels for adjacent terminal, ground-software, cybersecurity, and network-orchestration companies."""
