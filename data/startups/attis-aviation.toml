name = "Attis Aviation"
description = "Israeli unmanned-aviation company developing the ROC, a mid-sized VTOL UAS intended to combine runway-independent operations, long endurance, and substantial payload capacity. It also provides UAS development, flight testing, pilot training, certification, and operational services for civilian and security customers."
detailed_description = """Attis Aviation is a privately held Israeli UAS company founded in 2021 and headquartered in Caesarea. Its main product is the ROC, a mid-sized vertical-takeoff-and-landing unmanned aircraft designed to operate without a prepared runway. The company and recent trade coverage describe a 150 kg maximum takeoff weight, payload capacity of up to 40 kg, and more than 20 hours of endurance; those figures should be treated as manufacturer-reported specifications until supported by a formal datasheet, flight-test report, or customer acceptance record. The reported propulsion concept combines electric motors with a jet-fuel engine, positioning the aircraft between small tactical multirotors and larger fixed-wing or MALE systems.

Attis sells more than an airframe. Its official site describes a one-stop offering spanning UAS development, flight testing, pilot training, certification support, and operation, and says it is a certified air operator under the Israeli Civil Aviation Authority. That services layer can help customers navigate regulated airspace and operational integration, but it also makes the business partly dependent on engineering and managed-service revenue rather than repeatable vehicle production alone. The company lists a management team covering finance, operations, technology, and flight operations, while LinkedIn currently places the organization in the 2–10 employee range.

The commercial opportunity is clearest where runway independence and persistent coverage matter: border and perimeter monitoring, wildfire and disaster reconnaissance, critical-infrastructure inspection, environmental observation, agricultural monitoring, and selected cargo or logistics missions. The ROC’s claimed payload and endurance could support electro-optical/infrared, mapping, communications-relay, or other mission payloads, although public sources do not establish a standardized payload catalog, production rate, or recurring customer base. Attis has publicly discussed participation in Israel’s National Drone Initiative, a firefighting pilot goal, first customer deliveries as a 2026 objective, and European expansion; these are meaningful commercialization signals, but they are plans or company statements rather than confirmed contract revenue.

Strategically, the platform has credible dual-use relevance because the same runway-independent, long-endurance UAS architecture can support civilian emergency response and security missions as well as defense ISR and border surveillance. The defense case is strongest for non-kinetic sensing, patrol, communications relay, and logistics support; there is no public basis here to claim weapon integration or operational military deployment. Competition includes established Israeli aerospace suppliers, specialized VTOL UAS firms, autonomous-in-a-box providers, and lower-cost commercial drone ecosystems. Attis may differentiate through civil-airspace certification expertise, an integrated service model, and a 150 kg class platform, but it must still prove repeatable flight reliability, certification scope, manufacturability, unit economics, and customer willingness to buy against larger incumbents."""
