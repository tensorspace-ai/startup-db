name = "Marine Edge"
description = "Marine Edge is an Israeli maritime deep-tech startup developing a regenerative hybrid propulsion system that smooths wave-induced engine-load fluctuations, recovers otherwise wasted energy, and returns it during peak load. Its Engine Load Management System (ELMS) combines real-time torque sensing, predictive control software, an electric motor-generator, and supercapacitor storage to target lower fuel consumption, emissions, and operating cost in commercial vessels."
detailed_description = """
**Product and the concrete problem it solves.** Marine Edge addresses a mechanical-efficiency problem that is easy to miss in a shore-based engine room: a ship's propeller does not experience a steady load when it moves through ocean waves. Wave action and changing water resistance create repeated low-load and high-load periods at the propeller shaft. The engine must respond to those oscillations, often spending time away from its most efficient operating point, while the vessel still needs reliable propulsion and the crew cannot simply optimize for an average load. Marine Edge says these fluctuations can raise fuel use by up to 25% compared with calm-water operation, a company-stated figure that requires independent vessel-level validation but gives the commercial problem a concrete scale. The company's answer is the Engine Load Management System, or ELMS, a regenerative mild-hybrid package intended to flatten the load profile presented to the main engine. In practical terms, the system aims to turn a hidden hydrodynamic penalty into something a power-management controller can measure and manage. That matters to shipowners because fuel is both a dominant operating expense and a strategic exposure, while emissions rules increasingly force efficiency improvements before a vessel can transition to a different fuel. The product is designed as an integration layer for existing maritime propulsion architectures rather than as a new vessel or a complete replacement engine, which could make retrofit and shipyard partnerships more plausible, although the public record does not yet establish scaled commercial retrofits.

**Core technology and how it actually works.** The public technical description is unusually specific for an early-stage company. Marine Edge's laboratory testbed includes a diesel engine, a load-generating dynamometer that can replay recordings from seaborne vessels, an electric motor-generator, two torque meters, a supercapacitor reservoir, fuel-flow meters, AC/DC and DC/DC inverters, and a control center running the intervention software. In the proposed operating loop, torque and load sensors observe the shaft's changing demand; software analyzes the signal and predicts or identifies the next portion of the load cycle; the motor-generator absorbs energy during a relatively low-demand interval and the power electronics route that energy into the supercapacitor; then the stored energy is released through the motor-generator when the propeller reaches a high-demand interval. The objective is not to propel the ship indefinitely from a battery. It is to reduce the amplitude and frequency of the load swings seen by the diesel engine, allowing that engine to operate closer to an efficient envelope while the storage system handles short, repeated transients. This use of supercapacitors is technically coherent with a maritime duty cycle that can require many rapid charge-discharge events and high power density rather than long-duration energy storage. The algorithms are vessel-specific in the sense that the controller must understand the engine, shaft, propeller, and recorded load pattern; the company also describes real-time maritime analytics and predictive systems as part of its broader software stack. Independent sea-trial data, efficiency curves, storage degradation data, and failure-mode testing are not publicly available, so the architecture is better evidenced than the claimed performance.

**Market, customers, and go-to-market.** Marine Edge's initial market is B2B maritime transport. The Israel Innovation Authority identifies shipping companies, shipbuilders, shipyards, powerplant manufacturers, and shaft-generator manufacturers as target customer groups, a useful indication that the company may pursue several channels: direct vessel-owner sales, integration through an engine or generator OEM, and installation during newbuild or repair-yard periods. The largest direct economic pool is merchant shipping, where even a modest percentage reduction in fuel use can compound across long routes and large fleets. The same product logic can extend to offshore support vessels, ferries, tugs, and workboats, but those applications are not publicly confirmed as deployments. Marine Edge's second commercial layer is the data generated by the system. A controller that already measures torque, fuel flow, energy recovery, and intervention behavior can support predictive maintenance and fleet benchmarking, provided the company can convert vessel telemetry into a service customers will pay for. The route to market is nevertheless slow and operationally demanding: maritime equipment must fit into class, flag-state, shipyard, warranty, and maintenance processes; owners need evidence from a vessel similar to their own; and installation windows are infrequent. The public material supports a target-market thesis and an engineering collaboration posture, not a mature sales funnel. No named commercial customer, paid fleet deployment, revenue figure, backlog, class approval, or signed OEM distribution agreement was found in the reviewed sources.

**Traction, funding, and third-party validation.** Marine Edge was established in 2021 and is listed by the Israel Innovation Authority as an R&D-stage company with six employees. The same profile records applied-research support through MAFAT-related programs in 2025 and 2026, which is a meaningful public-sector validation of the technical research pathway but not proof of a fielded defense system. Startup Nation Finder reports five funding rounds and an IIA grant, while its public company page identifies historical ecosystem investors including Good Company VC and NextLeap; it does not expose a complete financing table or reliable round amounts. Crunchbase likewise presents the company as an active private seed-stage business and lists PowerEdge as a product, but its financing fields are not sufficiently transparent to support a precise total. Marine Edge was selected for Israel's official technology delegation to COP29, where the company presented its regenerative approach for cargo ships. That selection is a credible third-party signal that the technology was considered relevant to climate and maritime innovation, and the official description explains the low-load energy capture and high-load energy return cycle. The company's own laboratory is the strongest evidence of execution: it has assembled an instrumented propulsion rig capable of replaying recorded vessel loads instead of relying only on computer models. The evidence still stops short of independent validation. No public source reviewed supplies certified fuel savings, a named sea trial, a customer acceptance test, a class-society approval, a complete patent list, audited revenue, or a disclosed valuation.

**Founders and team background.** Public ecosystem and media profiles identify a founding group combining maritime operations, aerospace engineering, and software. Nevo Dotan is identified as CEO and co-founder and is described as a former Israeli Navy captain, bringing direct familiarity with vessel operations and the constraints of propulsion reliability. Amichay Gross is described as a co-founder with aerospace and Technion experience, while Mark Moran is associated with UC Berkeley and software engineering. That combination is relevant to the company's problem because the system sits between physical machinery and data-driven control: the team needs to understand a ship's propulsion plant, model high-frequency dynamics, and make a control intervention that an owner and a chief engineer will trust. The team's decision to build a full testbed with a dynamometer and real power electronics also indicates an appreciation that simulation alone is insufficient for a safety-critical rotating system. At the same time, the current team is very small by the standards of marine equipment commercialization. The IIA profile reports six employees, and Startup Nation Finder uses a 1-10 employee range. Public sources do not provide a complete organization chart, named naval architects, certification specialists, sales team, or manufacturing partner. The founders' backgrounds are a strategic asset for early research and customer discovery, but the next stage will require repeatable installation, class engagement, field service, supply-chain management, and international maritime sales capabilities that are not yet visible publicly.

**Competitive dynamics.** Marine Edge competes against several different categories rather than one identical product. Corvus Energy supplies marine batteries and hybrid power systems, giving shipowners an established route to electrification and peak-shaving, although a battery-centric architecture is optimized for a different energy-duration profile. ABB sells marine electrification, drives, automation, and energy-management systems, with global shipyard and installed-base advantages. Wärtsilä and MAN Energy Solutions compete as large marine-engine and integrated-powertrain suppliers that can incorporate their own efficiency, hybridization, and optimization packages into newbuild programs. Voith competes through marine propulsion and hybrid drivetrain systems, particularly where its propulsion hardware is already part of the vessel design. Kongsberg Maritime competes in digital vessel optimization and control, with a broad automation portfolio and customer relationships. Conventional engine tuning, propeller optimization, shaft generators, and operational route or speed management remain the incumbent alternatives because they are familiar, serviceable, and easier to procure than a new electromechanical subsystem. Marine Edge's claimed edge is narrower: it focuses on the cyclical shaft-load disturbance itself and combines predictive software with high-cycle regenerative hardware. That integration could produce value without requiring a full battery retrofit. It is not yet a proven moat. Large marine suppliers can replicate control features, and the system will have to demonstrate that fuel savings, reliability, maintenance burden, and payback survive real sea states and different vessel classes.

**Defense, security, and resilience dual-use relevance.** Marine Edge qualifies as dual-use because its core technology is a physical power-management and control system for maritime propulsion, with clear commercial and security-resilience applications, rather than because a public source confirms a military product. Naval auxiliary ships, patrol support vessels, sealift, offshore logistics, and emergency-response craft all face the same fuel-efficiency and propulsion-availability problem as commercial ships. A system that reduces fuel consumption can extend operational endurance, reduce the frequency of vulnerable refueling movements, and make a finite fleet or generator supply stretch further during a crisis. A system that monitors shaft torque, fuel flow, and abnormal load patterns could also support predictive maintenance for vessels operating far from a dock, though Marine Edge has not publicly claimed a defense maintenance product. The IIA record's MAFAT applied-research support is a relevant signal of Israeli defense-innovation interest, but it should not be inflated into a contract or fielded capability. No reviewed source confirms a navy customer, defense prime integration, military trial, classified program, ruggedized variant, MIL-STD qualification, or export-control posture. The strongest strategic case is therefore maritime resilience: lowering the energy intensity of cargo and support fleets, improving autonomy from fuel logistics, and adding measurement to a critical propulsion subsystem. The key uncertainty is whether the civilian design can meet defense requirements for shock, redundancy, cyber-hardening, degraded communications, maintainability, and assured operation under damage. Those requirements could materially change both hardware and certification costs.

**Growth stage, trajectory, and key diligence risks.** Marine Edge is best classified as early. It has existed since 2021, has a small reported team, has received public research support, has built a serious laboratory demonstrator, and has earned ecosystem visibility through COP29, but public evidence does not yet show repeatable commercial deployment or revenue scale. Its plausible trajectory is from laboratory validation to a monitored pilot on one or more vessel classes, followed by shipyard or OEM integration if the measured payback is compelling. The most important diligence sequence is: 1. independently reproduce the claimed fuel and emissions improvement under representative wave-load recordings; 2. prove that the supercapacitor, motor-generator, inverters, and control logic remain reliable under marine vibration, heat, salt, and fault conditions; 3. establish class, flag-state, warranty, and cyber requirements; 4. disclose a reference vessel and installation economics; and 5. show that the system can be manufactured and serviced without turning every retrofit into bespoke engineering. Risks include the gap between a controlled dynamometer result and an ocean deployment, slow maritime procurement cycles, integration liability with incumbent engine and generator warranties, supercapacitor and power-electronics lifecycle cost, scarce installation windows, and competition from vertically integrated marine suppliers. There is also disclosure risk: public databases disagree or omit financing details, and no independent source verifies the headline performance. A successful pilot would materially raise the assessment; absent that evidence, the company remains a technically credible, strategically relevant Israeli R&D startup whose commercial and defense value is promising but not yet field-proven.
"""
