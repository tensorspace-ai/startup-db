name = "Scanovate"
description = "Scanovate develops B-Trust, an enterprise identity and compliance platform for regulated organizations. It combines workflow automation, individual and corporate onboarding, KYC/KYB checks, screening, identity lifecycle management, monitoring, and audit evidence rather than offering only a standalone verification API."
detailed_description = """Scanovate is an Israeli RegTech company whose B-Trust platform is designed to digitize compliance controls and identity management across a financial-services business value chain. The official product description spans product and marketing approvals, customer onboarding, ongoing business relationships, payments, claims, and post-contract activity. Its central proposition is a configurable workflow layer that connects internal reviewers, rules, dashboards, reporting, and external data providers. That is a meaningful problem in regulated institutions because identity, AML, fraud, and ownership decisions are often distributed across teams and point products, leaving manual handoffs and weak evidence trails.

The technical bundle is broader than simple document verification. B-Trust describes individual onboarding with document capture/OCR, identity verification and facial-recognition integrations, customer-risk classification, and customer-due-diligence checks. For corporate onboarding it describes obtaining corporate structures and beneficial-owner information, then applying risk classification, adverse-media, sanctions, PEP, ICIJ, and OFAC 50% rule checks. The platform also describes configurable rulesets, API-first connections to third-party data and systems of record, continuous re-checking, event-triggered workflows, and an audit trail for regulatory reporting and incident response. These are credible product capabilities based on the company’s own public materials, although the underlying data quality, model performance, and automation rate require customer-level diligence.

The clearest market is banks, asset managers, lenders, insurers, and digital-wallet providers that must onboard customers and legal entities while maintaining compliance after account opening. Scanovate’s site presents the product as suitable for both individual and corporate compliance, which broadens the addressable workflow but also increases implementation complexity. Its displayed enterprise customer references provide a commercialization signal, yet public materials do not establish current contract values, recurring revenue, retention, geographic mix, or deployment scale. A diligence process should therefore test whether B-Trust is a repeatable software product or remains services-intensive in each jurisdiction, and should examine integration time, false-positive reduction, review throughput, and dependence on particular data suppliers.

The competitive set includes identity-proofing specialists, AML and adverse-media data vendors, KYB/entity platforms, fraud providers, and large financial-crime technology suites. Scanovate’s potential edge is lifecycle breadth and a single workflow/control plane: institutions may reduce integration and audit fragmentation by coordinating onboarding, ownership checks, screening, monitoring, and post-contract actions in one environment. The trade-off is that broad coverage can create product sprawl, regulatory maintenance burden, and harder proof of superiority against focused vendors. The technology has genuine dual-use adjacency: identity assurance, entity-risk analysis, sanctions screening, and auditable case workflows are relevant to procurement integrity, sensitive-access onboarding, and public-sector screening. There is no reliable public evidence here of material defense contracts or government-program penetration, so national-security relevance should be treated as capability-led optionality, not demonstrated defense traction."""
