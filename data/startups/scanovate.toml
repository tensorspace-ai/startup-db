name = "Scanovate"
description = "Scanovate develops B-Trust, an enterprise identity and compliance platform covering individual and corporate onboarding, KYC/KYB, screening, ongoing monitoring, and audit workflows. Prytek announced an acquisition of Scanovate's business and two subsidiaries in September 2026; Scanovate continues operating as Prytek's customer-lifecycle-management business."
detailed_description = """Scanovate is an Israeli identity and RegTech business based in Ramat Gan. Its current offering, B-Trust, is a client lifecycle and identity management platform for regulated financial institutions and other enterprises. Company materials describe workflows that begin with product and marketing approvals, extend through individual and corporate onboarding, and continue into business relationships, payments, claims, and post-contract monitoring. Scanovate dates its fintech company to 2014. An Israel Innovation Authority interview with CEO Amir Fishman says the business began image-processing work earlier and shifted into fintech in 2014; a 2015 company press release uses 2012 as its founding year. I use 2014 for the current identity and compliance business while retaining the older roots as a date discrepancy.

B-Trust is broader than a document capture API. The company describes document OCR and authenticity checks, facial verification and liveness integrations, risk classification, customer due diligence, beneficial-owner and corporate-structure checks, sanctions, PEP and adverse-media screening, and rules for complex ownership such as the US OFAC 50% rule. It also offers configurable workflows, third-party data and system integrations, event-triggered refreshes, dashboards, and audit trails. Current Scanovate materials present the platform as an orchestration layer across compliance teams and external providers. An AWS Marketplace listing for Scanovate IDV separately advertises SaaS, private-cloud and on-premise deployments, document verification, OCR, biometric face matching, liveness, and optional voice-statement checks. Those are vendor-described functions; public evidence does not disclose independent error rates, model performance by document or population, or the share of each workflow completed without human review.

Commercial evidence spans a long operating history, but its strength varies. A 2015 Scanovate release says its imaging technology was used in Bank Leumi's mobile bill-payment service. In 2019 Geektime reported the company worked with large Israeli banks and credit-card companies and quoted a company claim of more than 85 million users or customers; the wording does not define unique, active, or paying users. In September 2026 CTech reported more than 250 customers, including about 120 financial institutions, across North America, South America, Western Europe, and Israel. This is the clearest recent scale signal, though contract values, customer concentration, renewal rates, and product-by-product attribution are not public. The AWS listing advertises a 12-month, 50,000-session package at $25,000 for one IDV offering. That is a marketplace price, not a realized booking or company revenue metric.

Two additional signals need careful treatment. In 2023 the Israeli Ministry for Social Equality published an intention to contract Scanovate as a sole supplier for biometric identity checks in a digital senior-citizen credential process. The public notice estimated a NIS 150,000 contract for up to one year; its attached opinion says that, at that time, Scanovate had met the ministry's stated cyber requirements while other candidates were still being assessed. This is evidence of a civilian public-sector procurement process and project-specific security review, not a defense contract, a general certification, or proof that the full estimated value was paid. In 2024 the Israeli trade mission to Peru said Scanovate/ADO Technologies won an ASBANC identity-verification tender and described an initial estimate of $20 million per year. ASBANC's own 2023 annual report lists ADO Technologies among partners in its security and digital-transformation suite, but it does not corroborate that contract value or a Scanovate revenue stream. The $20 million figure therefore remains an unverified announcement claim. A separate 2024 Anonybit release says ADO Technologies, described there as a Scanovate company, delivered an identity-verification service backed by Anonybit infrastructure to an unnamed Latin American banking group serving 14 million retail customers. That supports a real partner deployment while also showing a third-party biometric dependency.

Prytek announced in September 2026 that it was acquiring Scanovate's business and the Cellosign and ADO Technologies businesses. CTech reported an approximately $50 million first phase with potential shareholder value of up to $100 million; Prytek's counsel APM described a transaction worth more than $50 million with potential to reach $100 million. The contingent value, precise consideration, closing mechanics, and legal allocation between assets and entities are not disclosed consistently, so no exact deal amount or company valuation is recorded. Prytek says Scanovate will lead its customer lifecycle management segment and continue product development with group companies. Fishman told CTech that selling to large banks and entering new markets had been difficult and expensive for a company of Scanovate's size. The acquisition can address distribution and institutional access, but introduces execution risk around customer consent, product integration, data boundaries, and whether the business retains operating independence. Publicly reported customer counts should not be treated as recurring revenue or proof of post-acquisition cross-selling.

Competition is layered. Fenergo is a close enterprise client-lifecycle and compliance alternative with policy and workflow coverage across more than 120 jurisdictions. Jumio and Entrust Identity Verification (formerly Onfido) overlap in document, biometric, liveness, and fraud checks, with broad identity assurance portfolios. Sumsub combines user verification, biometrics, screening, AML monitoring, and business verification. Trulioo emphasizes global data-backed person and business verification through APIs and hosted onboarding. Scanovate's plausible distinction is the combination of identity capture, configurable process orchestration, entity and beneficial-owner review, and continued monitoring in one environment, with deployment options that include isolated or on-premise environments. This may appeal to banks that want to coordinate local rules and legacy integrations. The weakness is that each layer also has established specialists and large suites; a broad feature list does not establish better matching accuracy, data coverage, regulator acceptance, or lower total cost. Scanovate itself describes a marketplace and third-party integrations, and the ADO deployment cited above relies on an external biometric backend, so supplier economics and attribution of differentiated technology need examination.

The founder group combines product, image-processing, biometric, and financial-services experience. Scanovate's current leadership page lists Amir Fishman as CEO, Irad Gilboa as CTO, Roi Fishman as CPO, and Alon Ofir as a biometric subject-matter expert, plus COO Amir Laufer and product director Inbal Zarski. CTech describes Roi Fishman as a CTO in its acquisition coverage, while the company page calls him CPO; his exact post-transaction remit should be confirmed. Ofir's biography cites a face-surveillance patent, but the public US application record names Rafael as assignee and Alon Ofir as inventor, not Scanovate, so it is not evidence of company-owned IP. The public record reviewed here does not establish a Scanovate-assigned patent portfolio, current employee count, or audited financial performance. The team has credible domain depth, while the founder's comments about the difficulty of bank sales underline the importance of Prytek's distribution channel and the need to verify implementation cost and post-sale support capacity.

The security and dual-use case is concrete but bounded. Commercially, the platform supports remote onboarding, identity lifecycle management, KYC/KYB, sanctions controls, fraud screening, and regulated customer workflows. On the public-sector side, the Israeli ministry procurement notice documents a proposed citizen-credential verification use and a project-specific cyber review. Identity proofing, liveness and auditable case management also have plausible security applications for controlled access, vendor due diligence, or high-assurance workforce onboarding. The sources reviewed do not demonstrate defense customers, military systems, classified deployments, or defense-specific productization. The company should therefore be assessed on its commercial and civilian-government evidence, with security-market adjacency treated as a possible extension rather than defense traction.

The most important diligence is to reconcile the 2018 A-round entry, Geektime's approximate $2 million cumulative funding report, and CTech's later description of Scanovate as bootstrapped; none supplies a reconciled financing ledger. Confirm the Prytek transaction's closing and legal structure, consideration and contingent terms, and whether Scanovate remains a separately contracting entity. Request ARR and recognized revenue by product and geography, gross margins, retention, customer concentration, implementation hours, data-provider costs, and the proportion of paid customers among the reported 250. Verify the ASBANC agreement directly with the association and determine whether the trade mission's $20 million annual estimate was a contract ceiling, network throughput, or expected transaction volume. Finally, test ID document coverage, false-accept and false-reject rates, liveness and injection-attack resistance, model performance across demographic groups, retention and residency controls, supplier rights, and ownership of code and biometric models."""
