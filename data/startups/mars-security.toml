name = "Mars Security"
description = "Mars Security is an Israeli cybersecurity startup building an API-connected threat-hunting and detection-engineering platform that continuously turns external threat intelligence into validated hunts and production-ready detections tailored to a customer's live environment. Its no-ingestion approach is designed to help security teams close the gap between learning about an attack and detecting it in their own logs, cloud, and endpoint systems."
detailed_description = """
**Product and the concrete problem it solves.** Mars Security addresses a specific operational failure in enterprise cyber defense: organizations receive more threat intelligence than their detection teams can convert into useful coverage. Reports, indicators, and campaign write-ups describe how an adversary is operating, but the work of translating those findings into queries, hunts, rules, tests, and production detections remains manual. Mars says this lag can last weeks, allowing an attacker to move through an environment before the security team has encoded the relevant behavior. The company's product is positioned as a continuously operating threat-hunting and detection-engineering layer. It connects to the security stack that a customer already runs, searches across log sources, cloud systems, and endpoints, and aligns the security program to threats targeting that organization rather than to a generic list of last quarter's incidents. This is a narrower and more concrete proposition than a general AI SOC copilot: the output is coverage that can be executed and tested in the customer's environment.

**Core technology and how it works.** Mars describes a software architecture that avoids copying all customer telemetry into a new data lake. Its website says the platform queries the customer's existing data in place, preserves organizational context across assets, users, and activity, and lets teams build, test, and ship detections against live data without maintaining ingestion pipelines. The company's public launch material describes a pipeline in which global threat intelligence is continuously converted into targeted hunts, validated against the environment, and expressed as production-ready detections. That implies several hard engineering components: connectors and permission controls for heterogeneous SIEM, EDR, cloud, and endpoint systems; translation from unstructured intelligence into executable hypotheses; environment-specific query generation; validation that a hunt is meaningful rather than merely syntactically valid; and safe publishing into production tooling. Mars also operates a Microsoft Teams app, according to its privacy policy, giving analysts a collaboration surface around the platform. The company has not published its model architecture, benchmark methodology, supported integration list in a formal specification, or independent false-positive and detection-rate results, so the technical description should be read as a product claim rather than a verified performance result.

**Market, customers, and go-to-market.** The initial buyer is an enterprise security organization with a detection-engineering or threat-hunting function, usually operating a SIEM, endpoint tools, cloud telemetry, and a security operations center. Mars can enter without asking the buyer to replace those systems: its stated motion is API connection, immediate querying, and faster conversion of existing intelligence into coverage. That creates a plausible land motion through a chief information security officer, SOC leader, detection engineer, or incident-response team that already feels the cost of manual rule writing. The product can be relevant to financial services, healthcare, technology, energy, manufacturing, and government suppliers because each sector must detect campaigns in a particular environment and maintain evidence that security controls work. The public record does not name paying customers, contract values, annual recurring revenue, retention, or deployment counts. The company's public website offers a demo rather than a self-serve product, and its careers and LinkedIn materials indicate a B2B enterprise motion. A likely expansion path is from threat-intelligence automation into broader detection coverage, incident investigation, purple-team validation, and continuous control monitoring, but those adjacent products should not be treated as shipped capabilities until Mars discloses them.

**Traction, funding, and third-party validation.** Mars incorporated in Israel on July 31, 2025, according to an Israeli corporate-information record, and emerged from stealth in June 2026 after operating quietly for less than a year. Founderland reports an $8.5 million seed round closed in October 2025 and names TLV Partners, Jibe Ventures, Bullet Ventures, CCL – Cyber Club London, and XPS Ventures among the backers; that amount is not announced on Mars's own site, so it remains a media and investor-database report rather than a company filing. TLV Partners' public launch post independently confirms the investor group and describes the product's central conversion of threat intelligence into hunts and production detections without moving logs. Mars's own blog supplies a concrete product narrative, saying the platform can turn a small number of monthly hunts into a larger continuous program and reduce the time from intelligence to detection. Forbes Israel's profile of CEO Shahaf Galili and the founders provides independent reporting on the company's launch, team, and seed financing. There is no public SOC benchmark, named customer reference, government contract, patent portfolio, or audited commercial metric in the reviewed sources. The evidence supports a credible, well-connected early product team, not a conclusion that Mars has already achieved repeatable enterprise scale.

**Founders and team background.** The founding group is Shahaf Galili, chief executive; Ran Lerer, chief technology officer; and Matan Caspi, chief architect. Mars and its investors describe more than 50 years of combined offensive-cyber and incident-response experience, while Forbes reports that Galili spent 22 years leading offensive cyber units in the Israel Defense Forces. The founders' positioning is unusually relevant to the product thesis: they say they previously built or studied attack operations and now use that experience to help defenders hunt the campaigns they once modeled from the attacker side. That background can improve the realism of threat hypotheses and the prioritization of behaviors that matter operationally. It does not prove that the team has solved enterprise software distribution, data-access governance, model evaluation, or long-cycle procurement. Public sources do not provide a complete headcount, detailed employment histories for every engineer, named scientific advisors, or a full list of prior company exits. The visible team signal is therefore strong for offensive tradecraft and Israeli cyber operating experience, but incomplete for assessing product scale-up, customer success, and international sales execution.

**Competitive dynamics.** Mars sits between several established approaches. SIEM and XDR vendors such as Microsoft Sentinel, Google SecOps, CrowdStrike Falcon, and Palo Alto Networks Cortex XSIAM increasingly add AI-assisted investigation and detection content, and they benefit from installed telemetry and large distribution channels. Threat-intelligence platforms such as Anomali and ThreatConnect help collect, enrich, and distribute intelligence, while detection-engineering specialists such as CardinalOps focus on measuring and improving detection coverage. Managed detection providers and internal purple teams remain the incumbent human alternative: expensive, but able to interpret ambiguous intelligence and tune rules to local context. Mars's claimed edge is the control point between intelligence and executable coverage. It does not ask the buyer to centralize logs or replace the stack; it promises to query the live environment, test a hunt, and deliver a production detection faster. That can lower adoption friction and create a proprietary history of which intelligence produced useful coverage. The moat is not yet proven. APIs, language models, and detection content are available to competitors, and incumbents can bundle similar workflows into products already paid for. Mars must demonstrate superior validation quality, breadth of connectors, explainability, and time-to-value to make the position durable.

**Defense, security, and resilience dual-use relevance.** Mars's dual-use case is direct at the cyber-resilience layer because the same detection-engineering problem affects commercial enterprises, defense-industrial suppliers, critical infrastructure, and government networks. A defense or emergency-response SOC receives adversary reporting, malware intelligence, and campaign indicators, but still needs to determine whether those behaviors are present in its own identity, endpoint, cloud, and network telemetry. A platform that shortens that translation loop can improve warning time, reduce analyst bottlenecks, and keep defensive controls aligned with fast-changing campaigns. The no-ingestion design may also be useful in sensitive environments where moving raw logs into a startup-controlled cloud is unacceptable, provided Mars can support disconnected operation, sovereign hosting, strong authorization, and auditable query execution. The strategic relevance is therefore credible and grounded in the product's core workflow, rather than in a claim that Mars builds weapons. Public sources show no Ministry of Defense contract, military deployment, government accreditation, or classified-network integration. Its current evidence supports a commercial cyber-defense company with a clear path into allied resilience markets, not a fielded national-security capability.

**Growth stage, trajectory, and key diligence risks.** Mars is classified as early: it was incorporated in 2025, emerged from stealth in 2026, has a reported seed round, and has not disclosed revenue, customer count, or production scale. The positive trajectory is that the company has a sharply defined workflow, a product that can sit alongside existing security investments, a founding team with deep offensive experience, and backing from Israeli cyber-focused investors. The central diligence questions are: (1) whether generated hunts are accurate and explainable across noisy customer environments; (2) whether connectors can safely query many vendor APIs without excessive latency, permissions, or cost; (3) whether validation catches false positives and false negatives before detections reach production; (4) whether customers will pay for a continuous coverage service when SIEM and XDR vendors bundle adjacent features; (5) whether a small team can support enterprise onboarding and incident-sensitive workflows; (6) whether the business can protect customer telemetry, prompts, and detection content from becoming a new attack surface; and (7) whether the reported financing and early deployment claims withstand reference checks. Milestones that would improve confidence include named design partners, independent coverage benchmarks, measured reductions in detection-engineering cycle time, public integration documentation, recurring-revenue disclosure, and a government or defense-industrial evaluation with appropriate data-sovereignty controls.
"""
