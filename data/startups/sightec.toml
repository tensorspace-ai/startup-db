competitive_edge = "Sightic's strongest defensible asset is the combination of impairment-specific real-world data, collection expertise, and models designed for fast camera-based screening across mobile and in-cabin contexts. The capability can complement Smart Eye's established driver-monitoring platform and customer relationships, while avoiding dedicated roadside consumables or vehicle sensors in some deployments. A police agreement and Volvo-related workplace activity provide useful commercialization evidence. The edge remains conditional: competitors can add impairment classifiers to existing DMS, conventional toxicology tests remain legally important, and the value of the dataset depends on representative sampling, independently reproducible performance, calibration, and acceptance by regulators and courts."
