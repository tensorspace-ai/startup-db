investment_rationale = "Sightic showed credible technical and commercialization signals, including an impairment-specific dataset, EIC support, workplace activity, and a disclosed police contract. Those signals are now primarily relevant to Smart Eye's corporate strategy because Smart Eye acquired all shares in February 2026 for SEK 60.5 million in newly issued shares, with a possible earn-out. As an acquired asset it is not an independent startup priority or a current standalone investment opportunity in this database. Diligence should focus on integration value, contract economics, model performance, legal admissibility, data governance, and whether Smart Eye can convert Sightic's domain-specific capability into repeatable automotive and government revenue."
strategic_value = "Sightic has moderate strategic value as a specialized human-behavior AI asset. Its impairment dataset and algorithms broaden Smart Eye's driver-monitoring stack from distraction, drowsiness, and alcohol toward drug impairment, while the police deployment provides a high-stakes reference market. The technology may support safer transport, critical-workplace operations, and public-sector screening, but it does not materially add defense sensing, cyber resilience, or intelligence capability. Its main strategic value is the combination of scarce domain data, operational validation, and an entry point into regulated safety markets."
