name = "Sightic Analytics AB"
description = "Sightic Analytics develops camera-based AI that detects alcohol and drug impairment from eye, facial, and behavioral signals in seconds. The Gothenburg company became part of Smart Eye in 2026, extending Smart Eye's human-insight and driver-monitoring portfolio into drug impairment, workplace safety, mobility, retail, and law-enforcement screening."
detailed_description = """Sightic built a non-invasive impairment-screening platform around computer vision and machine learning applied to eye movement, pupil response, head motion, facial cues, and related behavioral signals. Its EyeScan Pro product is a mobile application or SDK intended to help law-enforcement personnel perform a rapid roadside indication of drug impairment, while EyeScan Solo and related offerings target alcohol screening in shared micro-mobility and other operational settings. The company says the analysis can return a result in roughly six to fifteen seconds using an ordinary camera, without biological sampling, consumables, or dedicated sensing hardware. Its privacy materials and product pages describe real-time or on-device processing, but deployment diligence should still verify the exact data flows, model version, and retention controls for each customer integration.

The technical asset is principally the combination of an impairment-specific dataset, collection methodology, and inference software rather than a single novel sensor. Sightic says it has more than 14,000 real-world recordings of impaired individuals and describes the dataset as spanning alcohol, cannabis, other substances, environments, lighting conditions, and user states. The company also reports research activity involving RISE, Karolinska Institutet, Volvo Group, and Swedish ethics approval. These are meaningful validation and data-collection signals, but they are not a substitute for independent accuracy studies, subgroup performance analysis, or evidence that a screening indication is sufficiently reliable for legal or employment decisions.

Commercially, Sightic has pursued several markets with different buying processes: police and border-control screening, safety-critical workplaces such as construction and energy, shared e-scooter and bicycle unlock flows, and age-restricted retail. Public company material describes Volvo Cars workplace use and a 2026 multi-year agreement with a European police authority, announced by Smart Eye at an estimated SEK 40 million over four years. The latter is the clearest current commercialization signal, although the customer is unnamed and the contract's implementation, recurring revenue, and performance obligations require verification. Sightic also received EUR 2.5 million from the European Innovation Council, according to Smart Eye's acquisition announcement; this is grant support, not evidence of venture financing or profitability.

Smart Eye agreed to acquire all shares in Sightic for SEK 60.5 million in newly issued Smart Eye shares, with a possible earn-out of up to SEK 50 million, and Smart Eye's Q1 2026 materials state that completion occurred on 24 February 2026. Sightic therefore should no longer be treated as an independent venture-backed investment target. The acquisition is strategically coherent: Smart Eye contributes production-grade driver monitoring and a large automotive customer base, while Sightic contributes drug- and alcohol-impairment models, data, and law-enforcement/workplace domain knowledge. The combined stack may cover distraction, drowsiness, alcohol, and drugs, but automotive design wins, regulatory acceptance, and production timing remain separate diligence questions.

The defense and national-security case is limited. Law-enforcement screening is a genuine high-stakes public-safety application, and rapid impairment assessment could be relevant to border, customs, emergency-response, or safety-critical government personnel. However, the core product is designed to identify human impairment, not to provide military sensing, cyber capability, intelligence collection, or battlefield decision support. The strongest strategic relevance is therefore in public safety, mobility resilience, and responsible deployment of biometric or behavioral AI, while dual-use claims should remain modest and subject to evidence of government use beyond civilian policing."""
