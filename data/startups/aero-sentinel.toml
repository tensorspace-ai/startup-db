name = 'Aero Sentinel'
description = "Aero Sentinel is the tactical UAV brand and drone business operated by Israeli AeroSol, developing and manufacturing compact ISR quadcopters, payloads, and ground-control systems for defense, police, security, and public-safety users."
detailed_description = """
Aero Sentinel is the tactical-drone business associated with Israeli manufacturer AeroSol (Aero Sol Aeronautical Solutions). The company’s public materials present the Sentinel G1, G2, and G3 quadcopter systems, payload options, and a Sentinel ground-control system. Products are designed for intelligence, surveillance, and reconnaissance and related security missions. Company product material and third-party reporting describe endurance in the 80–90 minute range for some configurations; actual performance depends on model, payload, and mission profile. The website and recent company materials describe a product and operating business, not merely a concept-stage venture.

Identity and history need careful treatment. A 2018 Israeli Ministry of Defense directory described Aero-Sentinel Ltd. as an Israeli UAV manufacturer established in 2012. AeroSol-branded material and the company’s founder describe the broader composite-manufacturing business as established in 2005, with a drone division branded Aero Sentinel beginning in 2013. The company site currently calls Aero Sentinel “by Aerosol Ltd.” and “an AeroSol company”; Globes describes Veloryx acquiring a 70% stake in April 2026. These sources use several related corporate and brand names, and public records also contain an Aero-Sentinel Ltd. entity described as merged. This record therefore treats Aero Sentinel as the operating drone business/brand and records the disclosed controlling transaction without assuming that the brand, historical legal entity, and current operating subsidiary are identical legal persons.

The product family has a credible disclosed specification baseline, but claims should be interpreted narrowly. A 2024 G3 brochure gives 90 minutes’ endurance, five-kilometer range, 11-kilogram takeoff weight, and up to three-kilogram payload. A 2026 Globes report says manual assembly limited current peak production to 30 units monthly and that new injection-molding equipment could raise capacity to 100–150 monthly; its 1,000-unit annual ambition by 2029 is a target, not achieved production. The same report describes a planned vision-based geopositioning product and a camera sourced from NextVision. Do not generalize these capabilities to every model or treat planned features as deployed capabilities. The older profile’s 40x optical zoom, comprehensive GPS-denied operation, hot-swappable modules, EW hardening, and broad cross-platform compatibility were not substantiated in the reviewed sources and are omitted as established facts.

Commercial evidence is stronger than the stale pre-seed profile suggested. Globes reported in August 2026 that Aero Sentinel systems were used by Israeli special IDF units and Israel Police, that half of sales were abroad, and named the Netherlands, Morocco, and Japan as export markets. It also reported distributor relationships in Poland, Romania, Italy, and Greece. These are media-reported company facts, not independently audited customer disclosures; no customer names, order quantities, or contract values were provided in that article. The Jerusalem Post separately reported two recent orders: 12 drones for a U.S. dual-use company at $500,000 and five drones for an Israeli defense company at NIS 1 million. It also reported a Kazakhstan distribution partnership with Germany’s 2LNK. A partnership is not itself a completed sale. The same article quoted annual revenue of NIS 15–20 million and five Aero Sentinel employees, while distinguishing 25 staff at broader AeroSol. TechTime later reported approximately NIS 15.1 million Aero-Sentinel revenue in 2025. These are published reports, not filed accounts; the revenue range and specific estimate may use different dates or definitions.

Ownership changed materially in 2026. Globes reported that U.S. company Veloryx acquired 70% of Aero Sentinel in April for NIS 35 million. This is an acquisition/control transaction, not evidence of a venture financing round, and the available material does not establish whether the consideration went to the company, existing owners, or both. TechTime described Veloryx as completing the acquisition of a 70% controlling stake in May. The difference in reported month is retained as a date ambiguity: Globes places the event in April while TechTime says completion occurred in May. The remaining 30% holders and detailed cap table are undisclosed in the reviewed sources. No separate public seed or venture round was verified.

The founder and CEO is Israel Vaserlauf (also rendered Wasserlauf in some directory records). Company materials identify Ofir Avram as CMO; a UVID profile describes him as a retired IDF lieutenant colonel and former commander of the Gaza Reconnaissance Battalion, Unit 414. Company pages list a small engineering/operations team, but public biographies and dated headcount detail are limited. The 2025 sponsored TheMarker profile reports the broader AeroSol had 25 employees; the 2026 Jerusalem Post article quotes five Aero Sentinel employees. These figures describe different scopes and dates and should not be conflated.

The commercial proposition is a focused small-UAS offering where endurance, low acoustic signature, payload integration, and local production can matter to tactical users. Its disclosed installed use and export footprint are positive signals, but the competitive field is formidable: DJI and Autel in low-cost quadcopters, Parrot and Skydio in secure/public-sector small UAS, and larger Israeli defense vendors in military ISR. Globes’ unit-price comparisons and supply-chain discussion are reported estimates and company positioning, not audited cost advantages. The claimed sub-five-percent Chinese component share and planned production expansion need bills-of-material, supplier, yield, and customer acceptance diligence. The NextVision relationship is described as reciprocal by Globes, but is not evidence of exclusivity or ownership.

Technical claims support dual-use applicability, with direct reported use spanning military/police ISR and potential civil security and public-safety missions. That does not establish broad commercial adoption, regulatory approvals in every export market, or a validated GPS-denied capability today. The facility damage from an Iranian missile and subsequent relocation, reported by company leadership and Globes, adds operational resilience and insurance questions even as production recovery appears underway. Investment assessment should focus on customer concentration, contract recurrence and gross margins, export permissions, production quality at scale, intellectual-property ownership, component provenance, and the exact legal structure following the Veloryx transaction. The historical startup-stage label and prior high scores are not retained as current evidence-based conclusions; no investment recommendation is implied.
"""
