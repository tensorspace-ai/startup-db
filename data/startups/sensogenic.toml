name = "SensoGenic"
description = "SensoGenic was an Israeli food-safety startup developing a handheld biosensor for detecting allergen proteins in food samples. Public evidence supports a validated proof of concept and beta-stage activity, but the company’s current operating status and commercialization are unverified."
detailed_description = """
SensoGenic developed a portable food-allergen detector for consumers and food-service settings. Public descriptions point to a handheld reader used with disposable sample media, with results delivered through a smartphone-connected workflow. The underlying approach was intended to detect allergen-causing proteins in a food sample rather than infer risk only from packaging or ingredient declarations. The company’s patent filing describes an analyte-sensing system assigned to Sensogenic Ltd., while the EU project record describes the goal as a consumer solution for detecting food allergens, initially including milk and egg. The available evidence supports a biosensing proof of concept, not a clinically validated diagnostic device.

The problem is commercially meaningful but technically demanding. People managing severe food allergies must combine labels, staff conversations, kitchen controls, and avoidance; laboratory testing is too slow or expensive for many point-of-consumption decisions. A compact test could be useful in restaurants, schools, travel, catering, and shared kitchens if it delivers reliable results at clinically relevant concentrations. The difficult engineering and validation issues include extracting proteins from heterogeneous foods, handling oils and sauces, controlling cross-reactivity, detecting contamination that is unevenly distributed in a dish, and communicating a negative result without creating unsafe confidence. Disposable consumable cost, shelf life, sample preparation, and reader calibration would also determine whether the concept can work outside demonstrations.

The public commercialization record is limited. SensoGenic participated in the European Commission’s Horizon 2020 SME Instrument project 867865, which ran from March through August 2019, received a EUR 50,000 EU contribution, and reported successful proof-of-concept validation plus market research and discussions with food and beverage manufacturers and allergy specialists. Israeli media reported beta testing in 2019 and a target of a working product by 2022. Those are useful historical traction signals, but they do not establish a completed launch, regulatory clearance, recurring revenue, customer adoption, or continuing operations. Startup Nation Central lists the company as founded in 2018, with two employees and a beta product stage; these directory fields are useful corroboration of the historical profile but are not evidence of current activity.

Competition includes professional ELISA and lateral-flow allergen kits, accredited laboratory testing, and consumer-oriented devices such as Allergy Amulet and Nima/6SensorLabs. SensoGenic’s proposed differentiation was a simpler multi-allergen, handheld workflow combining disposable capture media, electronic readout, and mobile reporting. That could have reduced friction for consumers, but the record does not contain independent analytical-performance studies, field failure rates, regulatory positioning, or evidence that the proposed advantage survived manufacturing and usability testing. The company therefore remains best analyzed as an early biosensing attempt rather than as a demonstrated commercial competitor.

The defense and national-security connection is weak and indirect. Portable protein screening could be relevant to military or emergency food-service quality assurance, deployed kitchens, humanitarian operations, and supply-chain inspection. However, the documented mission is consumer food-allergy management; there is no reliable public evidence of defense customers, government procurement, CBRN detection, biosecurity work, or a security-focused product roadmap. For Claw & Talon, SensoGenic is consequently a historical Israeli portable-biosensing reference and a diligence example, not a current dual-use priority. The central open question is whether any company, intellectual property, team, or product activity remains active after the project’s close and the disappearance of the former company website.
"""
