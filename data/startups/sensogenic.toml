name = "SensoGenic"
description = "SensoGenic (Sensogenic Ltd.) was an Israeli startup incorporated in 2018 to develop a handheld, cellulose-based food-allergen biosensor. Its 2019 EU project reported proof-of-concept validation, and contemporaneous coverage described an R&D prototype and planned beta testing. Startup Nation Finder records that operations ceased in June 2022; an Israeli company-data mirror records voluntary liquidation completed on November 24, 2022. No commercial launch, revenue, or post-dissolution IP owner has been verified."
detailed_description = """
SensoGenic Ltd. was an Israeli food-safety and biosensing startup founded in 2018. Its intended user was a person with food allergies who wanted an additional check on a meal outside the home. The proposed system paired an electronic handheld base unit with a disposable test pad: a small food sample went onto the pad, cellulose captured target proteins, antibody chemistry helped distinguish an allergen, and the reader relayed a result to a smartphone. A patent family describes cellulose-based sensing surfaces and carbohydrate-binding analytes; a 2019 interview with CEO Alon Yasovsky described cellulose capture followed by antibody recognition. Those sources document a design and company claims, not independent performance validation.

The target panel changed across public descriptions. The Horizon 2020 project framed its feasibility work around simultaneous milk and egg detection, while the 2019 media interview said the near-term development focus was eggs and peanuts, with a wider panel as a future possibility. SensoGenic reported that its proof of concept had been validated using company research and experiments, and the EU project record says the team discussed the market with food manufacturers and allergy specialists. Those are company-reported technical and discovery milestones. The record contains no peer-reviewed SensoGenic performance study, independent sensitivity or specificity data, reproducibility results across prepared-food matrices, user study, or product certification.

The commercial problem was real, but the product would have had to solve a difficult sampling problem before a negative result could safely influence a meal decision. Allergen contamination can be unevenly distributed; a small sample may miss a contaminated bite. Fat, sauces, heat, fermentation, pH, and other ingredients can alter protein extraction or antibody binding. A multi-allergen reader also needs calibrated thresholds for each target, controls for cross-reactivity, and a clear way to communicate uncertainty. Consumable stability, shelf life, manufacturing quality, reader calibration, and replacement-pad availability would determine whether a convenient demonstration could become a dependable consumer product. Contemporary reporting attributed a 10 ppm detection claim to Yasovsky, but no independent validation of that figure for SensoGenic was found.

The 2019 commercialization statements were plans, not evidence of a launch. The Spoon reported that the company was still in R&D and building a first prototype for beta users; it quoted a target of mass production in 2022 and proposed prices of about $199 for the reader and $0.95 per disposable pad. The same article compared the concept with Nima, whose contemporaneous product had a narrower analyte scope and more expensive capsules. No later product release, retail listing, paying customer, recurring consumable sale, production partner, regulatory filing, or completed commercial deployment was located. Startup Nation Finder labels the company non-active from June 2022, and IVC's portfolio calls it ceased to operate. A CheckID company-data mirror records accelerated voluntary dissolution beginning in August 2022 and completed on November 24, 2022. The official domain no longer resolves in a basic URL check, and no successor operator was identified.

SensoGenic's historical funding record contains a 2018 seed event and a separate 2019 Horizon 2020 SME Instrument grant. The seed amount is unresolved: IVC's eHealth Ventures portfolio ledger lists a $715,000 total deal and an eHealth contribution of NIS 375,000, while a 2019 media report says $720,000 came from eHealth Ventures and the Israel Innovation Authority. Startup Nation Finder rounds the seed to $720,000 and lists eHealth Ventures alone. The differences may partly reflect rounding and disclosure coverage, but no company or investor financing announcement with a definitive amount and instrument split was found. CORDIS directly records a EUR 50,000 EU contribution for the 2019 project; that grant is not equity and is kept apart from the seed. No company-announced lifetime total, valuation, revenue, profitability, burn, or runway was found.

The technical founding group combined product engineering and materials expertise. The 2019 reporting identifies Alon Yasovsky as founder and CEO. Finder identifies Prof. Oded Shoseyov as co-founder and an advisory-board/business-strategy participant; a public-company filing lists him as a scientific founder of Sensogenic Ltd., and the Hebrew University describes his work in plant sciences, protein engineering, and nanobiotechnology, including cellulose nanocrystal films. This is relevant scientific context, but it does not establish that the company had a complete operating team, manufacturing capability, clinical or food-testing validation expertise, or a commercial organization. No current employees remain verifiable after wind-down.

Current competitive references show why the proposed consumer workflow alone was not enough to establish an edge. Allergy Amulet currently presents a consumer food-allergen sensor with a mobile readout and approximately one-minute results, alongside a separate food-testing business for manufacturers. NIMA is an adjacent handheld and single-use-capsule workflow, but its current product information says it tests gluten only, so it is not a like-for-like multi-allergen rival. Food manufacturers can also use established laboratory assays and rapid screening kits. SensoGenic's proposed differentiation was a low-cost pad, portable reader, app, and ambition to cover several allergens in one consumer workflow. There is no public head-to-head comparison, verified performance advantage, production cost, consumables margin, or evidence that its pricing plan was achieved. Celiac Canada's 2026 review of a different portable food test emphasizes that a small sample cannot guarantee the condition of an entire meal; that is a relevant validation caution, not evidence about SensoGenic's own device.

The patent record is mixed and does not establish who controls the technology now. Google Patents lists an Israeli patent application in the family as active, a related US patent as expired for fee-related reasons, a European application as withdrawn, a PCT family member as ceased, and a later US continuation as abandoned after failure to respond to an office action. Google warns that its legal-status fields are not legal conclusions. The company-data mirror's dissolution record makes it especially important to identify any liquidator, assignment, continuing license, or surviving right before assigning value to this IP. No acquisition or successor-company transfer was found.

SensoGenic has only a weak, indirect security adjacency. Portable allergen checks might help protect the health of people with known food allergies in deployed or emergency food-service settings, and public defense guidance confirms that food safety is relevant to military operations. That does not make this a demonstrated defense capability: its documented target was consumer food-allergy management, not deliberate food tampering, pathogens, chemical threats, or CBRN detection. No defense customer, government contract, security program, or defense-specific product was found. The company is best treated as a wound-down Israeli biosensing project with historical technical and grant activity, rather than as an operating startup or a defense priority.
"""
