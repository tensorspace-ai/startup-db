name = "Oxeye Security"
description = "Oxeye Security was an Israeli cloud-native application security company whose technology connected code-level findings with runtime context to identify and prioritize exploitable application risks. GitLab acquired Oxeye on 20 March 2024, so this record now represents an acquired security technology and team rather than an independently investible startup."
detailed_description = """Oxeye built cloud-native application security testing and risk-management technology for software teams operating across the software development lifecycle. Its product went beyond a conventional list of SAST, software-composition, and dynamic-testing findings by correlating application-layer vulnerabilities with execution and deployment context. The practical objective was to show which findings were reachable or exploitable, and therefore deserved engineering attention, instead of treating every scanner result as equally urgent. GitLab described the acquired capability as tracing risk from code to cloud through data collection and analysis, with an emphasis on reducing false positives and producing actionable remediation information.

The customer problem was credible and commercially important. Modern applications combine first-party code, open-source dependencies, containers, microservices, and rapidly changing cloud environments; security teams can discover more findings than developers can investigate. Oxeye's approach targeted AppSec alert fatigue and the operational gap between a vulnerability's theoretical presence in source code and its exposure in a running application. The likely buyers were enterprise security and development organizations seeking better prioritization, faster remediation, and less manual triage inside DevSecOps pipelines. Public reporting indicates Oxeye raised a $5.3 million seed round in 2021; the available evidence does not support the prior record's Series A claim.

Competition came from broad platform vendors and specialized application-security tools. Static-analysis, dependency-scanning, DAST, IAST, runtime application protection, and cloud-security products can each address part of the workflow, while larger vendors increasingly combine these functions. Oxeye's strongest differentiation was therefore not simply that it scanned code, but that it used contextual reachability and exploitability signals to improve prioritization. That distinction could be valuable if accuracy held across languages, frameworks, build systems, and production-like environments, but it also created integration and proof-of-ROI requirements. Oxeye's public vulnerability research, including reports credited to its researchers in GitLab's advisory database, is a useful technical credibility signal but not a substitute for independently verified customer retention or deployment scale.

GitLab announced the acquisition on 20 March 2024 and said it would use Oxeye to accelerate its SAST roadmap and augment software-composition analysis and compliance capabilities. GitLab subsequently stated that Advanced SAST was powered by technology acquired from Oxeye and used a proprietary engine to identify exploitable vulnerabilities in first-party code. This is stronger commercialization evidence than an unverified standalone growth claim, but it also changes the diligence question: the relevant outcome is now adoption and performance inside GitLab rather than Oxeye's standalone revenue, headcount, or fundraising trajectory. Financial terms were not disclosed in GitLab's announcement; GitLab's SEC filing records the acquisition and consideration, but does not establish a standalone valuation suitable for this database.

The defense and national-security case is technically plausible but evidence-limited. Reachability-aware application security can help secure mission software, government services, and critical-infrastructure systems, where prioritizing exploitable weaknesses matters. However, public sources reviewed here do not establish defense contracts, military deployments, security clearances, or government-specific certifications for Oxeye. Its dual-use value should therefore be assessed as an adjacency of the underlying technology, not as proof of defense traction. Since GitLab owns the technology, strategic relevance is best understood as evidence that a major DevSecOps platform considered the capability important to its security roadmap, not as a current standalone investment opportunity."""
