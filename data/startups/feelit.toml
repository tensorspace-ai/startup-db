name = "Feelit"
description = "Feelit Technologies is an Israeli industrial technology startup combining printed nanomaterial sticker sensors, wireless edge connectivity, and AI analytics to monitor critical equipment and support predictive maintenance. Its non-intrusive system is aimed at manufacturers and process operators that need earlier warning of degradation without shutting down or rebuilding installed assets."
detailed_description = """Feelit develops an end-to-end asset-intelligence platform built around a proprietary ink-based sensing layer. Its printed nanotechnology sticker sensors attach to the outside of equipment and are intended to detect high-resolution changes in physical conditions such as displacement, deformation, pressure patterns, wall thinning, elasticity loss, valve state, and bolt or clamp loading. A wireless edge device transports readings into Feelit's analytics software, where anomaly detection and predictive models turn changes in an asset signature into alerts and maintenance context. The product proposition is therefore more specific than generic connectivity: add sensing to existing industrial equipment, collect data continuously, and identify developing problems before they become an outage, leak, or safety event.

The commercial buyer is typically an industrial manufacturer, process plant, energy operator, or equipment OEM responsible for uptime, maintenance cost, safety, and environmental performance. Feelit's public materials emphasize zero-downtime installation, external mounting, rapid deployment, and use across equipment such as pipes, flanges, valves, and steam traps. Those attributes address a real adoption barrier in brownfield industry: replacing or instrumenting legacy equipment can require shutdowns, engineering work, and expensive integration. The strongest economic cases are likely assets where a small failure causes lost production, wasted steam or energy, hazardous conditions, or an expensive emergency intervention. A September 2025 company announcement reported deployments at Henkel, Nestlé, Continental, Bazan Group, and ICL; those statements are useful traction signals, but the database should not treat them as proof of fleet-wide expansion or independently verified recurring revenue.

Feelit operates in a crowded industrial reliability market that includes sensor vendors, machine-health platforms, automation incumbents, enterprise asset-management suites, and specialist predictive-maintenance companies. Its differentiation depends on the complete combination of sensing physics, installation simplicity, analytics quality, and a workflow that maintenance teams trust. Printed sensors may provide access to physical signals that are not available from a plant's existing control system, while the sticker form factor could lower retrofit friction. Conversely, the company must prove that sensors remain stable under heat, chemicals, vibration, moisture, and mechanical wear; that models generalize across asset classes; and that alerts produce enough lead time and precision to justify operational action. The September 2025 $8.3M Series A led by Alea Capital Partners, with Henkel Ventures and Takwin participating, and the stated expansion focus in Europe, the Middle East, and the United States indicate commercial scale-up rather than an unvalidated laboratory project.

The national-security case is credible but indirect. Industrial plants, utilities, fuel and chemical infrastructure, ports, logistics facilities, and maintenance depots all depend on pumps, pipes, valves, compressors, and other assets whose failure can interrupt essential services. Earlier warning can support resilience, maintenance readiness, and safer operations, including in defense-adjacent supply chains. There is no public evidence here of a defense contract, military deployment, or weapons application, so Feelit should be evaluated as an industrial-resilience and critical-infrastructure technology with possible dual-use transferability. Key diligence questions are sensor qualification in harsh environments, independently measured false-alert and missed-failure rates, deployment and service economics, customer retention and expansion, data ownership, integration requirements, and whether international growth can scale without turning installations into bespoke engineering work."""
