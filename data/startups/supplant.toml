name = "SupPlant"
description = "SupPlant is an Israeli precision-agriculture company that turns plant, soil, weather, and farm-management data into crop-specific irrigation guidance. Its portfolio combines sensor-based monitoring, autonomous irrigation workflows, and a sensor-less software product for growers and agribusinesses facing water and climate constraints."
detailed_description = """
SupPlant builds irrigation intelligence around the plant rather than treating the field as a uniform area. Its sensor-based SNS product collects measurements from fruit, trunk, leaf, and soil locations; the company says its algorithms combine those signals with agronomic expertise to produce crop-specific recommendations about when and how much to irrigate. The public product surface also includes SNSpro for autonomous irrigation and Plant;) for sensor-less use. SupPlant describes a database of more than 2,200 seasons covering different crops, soils, and weather conditions, with models conditioned on phenological stage, climate zone, variety, soil type, and irrigation method. These claims are company-reported and should be validated through customer references and controlled field results, but they describe a coherent data-and-decision-support architecture rather than a generic farm dashboard.

The customer problem is operational and measurable: growers need to maintain yield and quality while water allocations, energy prices, labor availability, and weather become less predictable. SupPlant sells to farmers and agri-businesses that can use recommendations in irrigation operations, and its sensor-less path potentially reduces the capital and installation burden of putting hardware on every block. The value proposition is strongest for permanent crops and other high-value production where crop stress, fruit quality, and water timing have meaningful economic consequences. Public materials and coverage identify crops such as grapes, dates, and citrus, while the company’s current site emphasizes a broader crop and soil model library. A claimed footprint or water-saving percentage should not be treated as independently verified without site-level baselines, control plots, and retention data.

Commercially, SupPlant appears to be a scaled private startup rather than an early experiment. It was founded in 2012, is listed by LinkedIn at 51–200 employees, and has been associated with Series C financing in investor portfolio material. Axios reported a $27 million financing round in 2022 and described a cumulative private-funding total of $46 million at that time; the database should treat those figures as dated public reporting, not a current valuation or balance-sheet fact. Recent public LinkedIn activity also points to a Plant;) product used for farmer-facing engagement in Mexico, which is a signal of ongoing commercial activity but not proof of broad recurring revenue. The key diligence work is to obtain cohort retention, gross margin by sensor versus software deployment, irrigation-water savings measured against a credible baseline, and the share of recommendations that lead to automated control rather than advisory use.

Competition is broad and comes from both focused agronomy vendors and substitutes embedded in farm operations. CropX, Phytech, Arable, and SeeTree address overlapping combinations of sensing, crop monitoring, and decision support, while irrigation-equipment suppliers, satellite analytics, local agronomists, and farm-management platforms can solve parts of the same problem. SupPlant’s plausible differentiation is the combination of plant-level measurements, a long-running agronomic data asset, recommendations that translate into irrigation commands, and a sensor-less option that can extend the model beyond fully instrumented farms. That advantage is not automatically durable: data quality, integration with irrigation controllers, model portability across regions, and proof of economic benefit will determine whether the company remains a system of record or becomes one feature in a larger platform.

The defense and national-security relevance is indirect but credible. SupPlant does not present itself as a defense contractor, and there is no evidence in the reviewed sources of military contracts or military deployments. Its core capabilities can nevertheless support resilience in water-constrained agriculture: distributed sensing, decision support under uncertainty, and resource-efficient operation of food-production infrastructure. Those capabilities are relevant to food-security planning, continuity of agricultural production during drought or heat events, and civil resilience in regions where water is strategically constrained. This is a resilience-oriented dual-use case, not a claim that the product has been adapted for battlefield use. Strategic assessment should therefore focus on civilian critical-infrastructure relevance and on whether the company can demonstrate reliable performance outside the agronomic conditions represented in its training data.
"""
