dual_use_description = "The core capability has credible, though not publicly demonstrated, dual-use potential. A small passive sensor that rapidly screens water without reagents could support humanitarian response, remote-site logistics, civil-defense triage, and military force-health protection. The app and map layer could help prioritize follow-up sampling around damaged or disrupted infrastructure. Public evidence does not establish a defense customer, government contract, secure deployment, or validated detection performance in operational military environments, so the defense case is an adjacency and diligence hypothesis rather than demonstrated traction."

