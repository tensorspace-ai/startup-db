name = "DisperseBio"
description = "DisperseBio is an Israeli biotechnology and industrial-water startup developing biomimetic synthetic peptides that prevent and disperse biofilms without relying on toxic antimicrobial chemistry. Its initial applications span desalination, cooling systems, maritime equipment, aquaculture, and other wet industrial surfaces where biofouling increases energy use, maintenance, corrosion, and downtime."

detailed_description = """
**Product and the concrete problem it solves.** DisperseBio targets biofilm and biofouling, a recurring failure mode in wet infrastructure. Microorganisms first attach to a pipe, membrane, hull, cooling surface, or other substrate and then secrete a protective extracellular matrix. Once that biofilm is established, larger organisms and deposits can accumulate, water flow becomes less efficient, heat-transfer and membrane performance degrade, and operators must clean, replace, or chemically treat the affected equipment. The commercial cost is not only the cleaning event: fouling can increase pumping pressure, propulsion fuel consumption, corrosion, membrane replacement, production losses, and unplanned downtime. Conventional responses include chlorine and other biocides, physical cleaning, ultrasonic systems, and antifouling coatings. Those approaches can be effective in particular settings, but they can also be toxic, repetitive, damaging to coatings or membranes, or constrained by discharge and environmental rules. DisperseBio's proposition is to intervene in the microbial life cycle before the protective community becomes difficult to remove, while also offering a treatment for existing biofilm. The intended product is a low-dose biological active that can enter established industrial workflows rather than requiring a new plant or a new vessel-maintenance regime.

**Core technology and how it works.** The company's technology is inspired by a defense mechanism observed in marine organisms, especially the sea anemone Actinia equina. DisperseBio describes a natural Eqt2 II protein and an engineered, stable Eqt2Z synthetic peptide that replicate the relevant signaling function without using a toxic antimicrobial kill mechanism. The mechanism is important: rather than selecting for resistant organisms by trying to kill microbes directly, the peptide is intended to trigger the natural dispersal phase of the microbial life cycle and weaken the biofilm structure that lets cells remain attached. Public patent documents assigned to DisperseBio describe isolated peptides and compositions for preventing cell adhesion, dispersing or detaching biofilms, and treating microbial communities; one of the cited US patents identifies Amir Zlotkin as inventor and DisperseBio Ltd. as assignee. The commercial platform can be delivered through water dosing or as an additive to a coating or treatment formulation, according to the company. The public record does not disclose the full manufacturing process, formulation shelf life in each application, exact active concentrations, or the complete environmental-fate profile. Those are central technical diligence questions because a peptide that performs in a controlled assay still has to remain stable, economical, and selective in saline, warm, turbulent, chemically variable industrial systems.

**Market, customers, and go-to-market.** DisperseBio is pursuing a B2B market where the buyer already has a budget for chemicals, cleaning, replacement parts, energy, or vessel maintenance. Its clearest beachheads are seawater reverse-osmosis desalination membranes, industrial and power-plant cooling systems, ship hulls and ballast-water-related equipment, offshore oil and gas infrastructure, and aquaculture installations. The company also describes potential use in pipelines, onboard desalination, and agricultural irrigation. This breadth is strategically attractive but commercially demanding: each segment has different dosing practices, certification requirements, maintenance intervals, procurement channels, and proof-of-performance standards. The company presents a low-friction adoption model based on water dosing or a paint/coating additive, with no infrastructure changes. Its website says two pilots are planned in Singapore and Israel, two laboratories are testing the technology with a global partner, and a two-phase navy test has started; these are company-stated development signals rather than disclosed contracts or completed deployments. The likely go-to-market path is through water-treatment providers, coating formulators, ship managers, desalination operators, utilities, and industrial distributors. Partnerships matter because a small peptide company is unlikely to sell, dose, monitor, and support every application directly. The key commercial question is whether DisperseBio can turn a compelling active ingredient into repeatable, regulated, channel-friendly products with recurring consumption.

**Traction, funding, and third-party validation.** DisperseBio was founded in 2021 and has a public Israeli company profile, a named scientific founder, a current official website, and ecosystem support from SOSV and Blue Economy Israel. Startup Nation Finder reports approximately $1 million raised across two rounds: a 2024 pre-seed round associated with SOSV and IndieBio and a March 2026 seed round involving Twynam Funds Management and SOSV. The amount is modest relative to industrial-water commercialization, but it is consistent with a company still validating formulations and pilots rather than building a global sales organization. The official website reports a 90% reduction in biofilm on desalination membranes over a 20-day trial, 90% lower electricity use related to biofilm management, 78% cost savings versus traditional chlorine treatment, and a potential annual fuel-saving figure for large-vessel applications. These performance figures are presented by the company and are not independent audits; the public pages do not provide full protocols, untreated controls, sample sizes, statistical treatment, or third-party replication. The strongest external validation is therefore triangulated rather than conclusive: SOSV identifies the peptide mechanism and its industrial scale proposition; Blue Economy Israel places the company in a maritime and water-technology portfolio; LinkedIn shows continuing public activity and a 2026 Biomimicry Institute accelerator selection; and US patent records confirm an IP history around the underlying peptide and biofilm-dispersion concepts. A serious diligence process should request raw pilot data, repeatability across organisms and water chemistries, and customer references.

**Founders and team background.** The technical founder is Dr. Amir Zlotkin, a microbiologist whose public biography says he led Infectious Disease Research at Sheba Medical Center and later served as chief scientific officer at Hutchinson Water, applying clinical and microbiological expertise to water-treatment problems. The company and ecosystem sources describe the technology as the product of roughly 15 years of research and five patent families. Current DisperseBio materials list Ori Choshen as CEO, Dr. Zlotkin as founder and CTO, and Sarit Arazi as CFO. Choshen is presented as a serial entrepreneur and investor with prior senior business-development roles at SanDisk, M-Systems, and Orange, as well as leadership at VLX Ventures, which is relevant to commercialization and partnerships in regulated deep-tech markets. Arazi is described as having more than 20 years of financial and operational experience across startups and global companies. Public profiles do not disclose a large engineering, manufacturing, regulatory, or field-service organization; Startup Nation Finder places the company in the 1-10 employee range, while LinkedIn lists only a small visible team. There is a minor leadership-history discrepancy worth recording rather than smoothing over: older ecosystem material identifies Bruno Grandsard as a co-founder and co-CEO, while the current official website presents Choshen as CEO. That may reflect a normal leadership transition, but the legal founder record, current employment status, and division of responsibilities should be confirmed in diligence. The team combines unusual scientific provenance with commercialization experience, but must still prove industrial scale-up capability.

**Competitive dynamics and edge.** DisperseBio competes with several different solution classes rather than one identical product. Ecolab and Nalco Water can provide large-scale chemical treatment, monitoring, and service contracts; Veolia Water Technologies can bundle process engineering, desalination, and water-treatment equipment; Jotun and Hempel sell antifouling coating systems for marine customers; Fleet Cleaner and other service providers use in-water cleaning to remove accumulated hull growth; and ultrasonic, filtration, chlorine, and other biocide suppliers compete on specific plant or vessel workflows. DisperseBio's claimed edge is the combination of mechanism and deployment: a nature-inspired peptide that promotes microbial dispersal rather than killing, potentially reducing resistance and toxicity while working through simple dosing or coating-admixture routes. The low-dose claims, if reproducible, could also improve shipping, storage, and treatment economics. Five patent families reported by ecosystem sources and granted US patents assigned to the company provide an IP foundation, but the value depends on claim scope, freedom to operate, peptide stability, and the ability to manufacture consistently at industrial cost. The moat is not established merely by having a peptide: incumbents have customer access, regulatory teams, service networks, and installed treatment programs, while other biomimetic and non-toxic antifouling approaches can compete for the same sustainability budget. DisperseBio must demonstrate that its product improves total cost of ownership without shifting the problem into residual toxicity, incomplete control, or frequent re-dosing.

**Defense, security, and resilience dual-use relevance.** DisperseBio's dual-use case is credible but should be understood as maritime and critical-infrastructure resilience, not as a combat system. Commercial desalination plants, coastal power stations, shipyards, ports, offshore platforms, aquaculture farms, and logistics vessels all depend on clean water flows and reliable wet surfaces. The same biofilm-control chemistry can plausibly support naval auxiliaries, government vessels, military-port infrastructure, and remote facilities where cleaning access, spare parts, freshwater, or chemical resupply is constrained. Lower fouling-related drag can improve the availability and fuel efficiency of logistics fleets; reduced membrane degradation can support water production; and less diver or drydock work can reduce exposure during maintenance. The official website's statement that a two-phase navy test has started is a meaningful signal of defense adjacency, but no named navy, procurement award, operational deployment, certification, or test result is publicly identified. The core technology is therefore genuinely cross-sector: it addresses a commercial industrial problem and has a short transfer path to security-relevant maritime and water systems. The limits are equally important. It has no public evidence of operation under wartime conditions, cyber-secured dosing controls, military environmental qualification, naval coating approval, or field performance in extreme salinity and temperature conditions. Strategic value should be scored as enabling resilience and supply-chain protection, with direct defense capability still unproven.

**Growth stage, trajectory, and diligence risks.** DisperseBio is early: it has a defined mechanism, granted patent history, a small disclosed team, seed financing, ecosystem participation, laboratory and pilot activity, and an initial path toward desalination and maritime customers, but no public evidence of scaled recurring revenue or broad commercial deployment. The trajectory is attractive if the company can convert its biological insight into standardized products with independently measured performance, regulatory acceptance, and a channel strategy that makes adoption easy for plant and vessel operators. The key diligence risks are: (1) biological performance risk, because biofilm species, salinity, temperature, flow, and surface material vary widely; (2) formulation and manufacturing risk, because peptide stability, synthesis cost, storage, and dosing precision determine real-world economics; (3) regulatory and environmental risk, especially for marine discharge, ballast-water interfaces, aquaculture, and any claim of non-toxicity; (4) customer-concentration and pilot-conversion risk, because public evidence is still partner- and ecosystem-led; (5) incumbent-response risk, as water-treatment and coatings suppliers can bundle competing solutions; (6) IP risk around the boundary between older Hutchison-linked work, current assignments, and later commercial formulations; and (7) financing risk, because industrial validation and certification require more capital than a software seed company. The most informative next milestones are independent membrane and hull trials, named paying customers, reproducible total-cost-of-ownership data, a completed and identified naval or government test, regulatory approvals, and evidence that the company can manufacture and distribute the peptide at scale.
"""
