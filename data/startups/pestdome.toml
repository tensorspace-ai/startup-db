name = "Pestdome"
description = "Pestdome is an Israeli agritech startup developing a chemical-free, multi-modal system that attracts, captures, and monitors flying pests for farms, greenhouses, homes, and public-health environments. Its strategic relevance is primarily food-security and resilience: the company is trying to reduce reliance on pesticide treatments while making pest pressure more visible and actionable."
detailed_description = """**Product and problem.** Pestdome is building a physical pest-attraction and capture system for situations in which growers or municipalities need to detect and reduce flying insects without adding chemical residue, noise, or a large operational burden. The company describes the device as an ecological “Iron Dome for flying pests,” but the useful diligence interpretation is narrower and more concrete: it is a continuous, enclosed monitoring-and-capture unit intended to complement integrated pest management. The target problem is costly and operationally persistent. Greenhouse operators must identify pest pressure early enough to protect crops, yet pheromone traps, sticky cards, visual scouting, and broad pesticide applications can be labor-intensive, species-specific, hard to scale, or undesirable around food. Pestdome’s public materials identify mosquitoes, flies, gnats, sand flies, thrips, and other flying pests as targets, with a company-stated coverage area of up to 500 square meters per unit. The system is therefore relevant to protected agriculture, nurseries, residential areas, and vector-monitoring programs, but the company has not publicly demonstrated that one device controls every pest category or replaces an agronomist’s IPM program.

**Core technology and operating model.** Pestdome says its attraction stack combines eight cues rather than relying on one lamp or pheromone: a botanical formulation containing natural fatty acids, a mammal-skin-like texture, insect-specific wavelength, natural carbon dioxide, controlled heat around 37.2°C, continuous movement, a color attractant, and dynamic visual stimulation. The site describes carbon-dioxide delivery of approximately 5–50 ml per hour, 12-volt and 18-watt operation, and solar compatibility. In the intended workflow, insects are drawn toward the enclosure, captured in a closed system, and used to generate a more continuous picture of local pest pressure. The company also describes a library covering more than 68 pest types and more than 100,000 subspecies; that is a company claim rather than an independently audited benchmark, and it should be treated as a product-development signal. The design has an important practical distinction from open chemical dispersal: the attractants are contained in a low-power device and the captured insects do not need to be exposed to a crop or public space. Diligence should still establish attractant replacement intervals, trap capacity, species-classification accuracy, false-positive rates, and whether “monitoring” is manual, automated, or connected to a software dashboard in each product version.

**Market, customers, and go-to-market.** The clearest initial customers are greenhouse and high-value-crop operators where a small reduction in pest damage or pesticide use can justify hardware and servicing costs. Pestdome’s public case material references tomato greenhouse work, edible-flower and hydroponic environments, a nursery or herb-growing setting, and pilots for sand flies near Ofakim and Kibbutz Urim. Those examples give the company several beachheads: crop protection, nursery monitoring, municipal vector surveillance, and residential or rural nuisance control. A plausible commercial motion is direct deployment with growers and municipalities, supported by agronomists, pest-control operators, and distributors that already sell IPM equipment; the public record does not establish a signed channel partnership, recurring revenue, or a named paying customer. The company’s website presents a waiting-list or contact-led posture rather than a mature catalog with published pricing. That suggests a pilot-to-product transition, where installation simplicity, consumables, cleaning, seasonal performance, and the quality of the resulting decisions will matter as much as the attraction mechanism itself. The strongest early wedge is likely protected agriculture, because growers can compare pest counts, crop loss, spray frequency, and labor hours within a controlled area.

**Traction, funding, and third-party validation.** Public records provide credible but early-stage validation. The Israel Innovation Authority profile identifies Pestdome Ltd as an Israeli agritech company founded in 2025, with five employees, R&D-stage status, Moshe Lev as founder and CEO, and support through the authority’s Tnufa Ideation/Startup Fund program in 2026. A government-facing company record identifies the legal entity as active and records incorporation on 20 April 2025. Pestdome’s own studies page names trials involving edible flowers, a positive-pressure hydroponic greenhouse, desert termite nuptial flight, Culex research, and sand-fly work at Kibbutz Urim. SeaNovation’s AquaBoost accelerator publicly presents Pestdome in a cohort focused on food security, agriculture, climate resilience, and deep technology. Together these sources support the existence of a live company, an R&D program, and field-oriented experimentation. They do not establish the amount of grant support, a venture financing round, revenue, regulatory approvals, independent efficacy testing, or a commercial deployment at scale. No priced financing, major customer contract, patent number, or certification should be inferred from the public profile alone.

**Founders and team.** Moshe Lev is publicly identified as Pestdome’s founder and CEO, which is a useful anchor for identity and accountability but not a complete team assessment. The five-employee figure reported by the Innovation Authority is consistent with an early hardware startup, yet the public sources reviewed do not provide a full list of engineering, entomology, product, manufacturing, or commercial personnel. The company’s challenge is multidisciplinary: it needs insect behavior and taxonomy expertise to validate species-specific attraction, electronics and mechanical engineering to deliver reliable low-power field hardware, data or workflow design to turn catches into decisions, and agronomic relationships to establish economic value. The SeaNovation context is positive ecosystem evidence, especially because it places the company among food-security and climate-resilience ventures, but accelerator participation is not a substitute for customer references. A serious diligence process should test founder ownership of the IP, access to independent entomological advisors, pilot conversion discipline, and whether the team can move from bespoke trials to repeatable manufacturing and support.

**Competitive dynamics.** Pestdome competes against several different substitutes rather than one direct peer. Chemical crop-protection programs from ADAMA, Syngenta, and other incumbents offer predictable broad-spectrum intervention but create residue, resistance, application, and environmental trade-offs. Biological-control suppliers such as BioBee, Koppert, and Biobest address the same IPM budget through beneficial insects, pollination, and biological products rather than an attraction-and-capture device. Pheromone traps, sticky cards, light traps, electric zappers, and manual scouting remain inexpensive and familiar alternatives for monitoring. Pestdome’s proposed edge is the combination of multiple biological and physical cues in one enclosed, low-power unit, which could broaden the range of detectable pests and reduce routine scouting effort. That edge will only be durable if the company proves better signal quality and cost per monitored area than simpler traps, while maintaining safe operation around pollinators and beneficial insects. Its IP position is described publicly as Israeli patented technology, but the public materials reviewed do not provide a patent number, claim scope, jurisdictional family, or freedom-to-operate analysis; those are material open questions.

**Defense, security, and resilience relevance.** Pestdome is not publicly presented as a defense contractor and there is no evidence of a military customer, defense contract, or fielded security product. Its dual-use case is instead grounded in food security, public-health resilience, and austere-site operations. Chemical-free monitoring can be valuable in food-production areas where residues, water contamination, or supply-chain disruptions make repeated pesticide applications less attractive. The same low-power, solar-compatible form factor could be relevant to remote farms, temporary humanitarian sites, border communities, emergency camps, or military logistics areas that need to monitor nuisance or vector insects without relying on a stable grid or frequent specialist visits. Sand-fly and Culex studies make the public-health adjacency more credible than a generic “defense” label, but they do not prove disease surveillance or pathogen detection: the device attracts and captures insects, while epidemiological interpretation would require separate sampling, identification, and health-agency protocols. The strategic value is therefore a resilience option at the intersection of agricultural continuity, vector awareness, and low-infrastructure deployment, not a claim of operational military capability.

**Growth stage and diligence risks.** Pestdome is best classified as early: it has an active 2025 legal entity, a small team, public-sector innovation support, accelerator visibility, and multiple named study settings, but its public footprint still reads like an R&D and pilot program. The next milestones should be independently measured efficacy by pest species, repeatable installation and maintenance, paid greenhouse conversions, a transparent unit economics model, manufacturing quality, and evidence that growers change spraying or scouting behavior because of the data. The principal risks are technical specificity across climates and species; unintended capture of pollinators or beneficial insects; degradation of attractants and sensors; maintenance and consumable costs; confusion between capture volume and actionable crop risk; seasonal or weather-dependent performance; regulatory treatment of pest-control claims; and the difficulty of selling hardware into farms with tight margins. A second risk is strategic overreach: public-health and defense-adjacent applications may require validation, procurement, and compliance processes that are materially slower than greenhouse pilots. On current evidence, Pestdome merits monitoring as an Israeli food-security and ecological-control company with credible early signals, while commercial scale, defensible IP, and independent field performance remain unproven."""
