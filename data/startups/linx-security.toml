name = "Linx Security"
description = "Linx Security is a New York-based identity security and governance startup building an AI-native platform for mapping, monitoring, governing, and remediating access risk across human, non-human, and agentic identities."
detailed_description = """Linx Security builds an identity security and governance platform around an identity graph that connects people, accounts, entitlements, applications, infrastructure, machines, and AI agents. Its public product materials describe agentless data ingestion from applications, directories, and other systems; graph-based modeling of identity relationships; risk analysis across identities and access; lifecycle automation; and policy-controlled remediation. The company has also launched Autopilot, an autonomous identity-security agent that is intended to continuously monitor changes, evaluate risk in context, remediate high-confidence issues, and escalate ambiguous or high-impact actions to a human. That architecture addresses a specific weakness in legacy identity governance: periodic reviews and ticket queues can leave privilege drift in place long after it appears.

The immediate commercial buyer is likely a combination of identity and access management, security, and IT operations teams at organizations with complex SaaS, cloud, directory, and application estates. Linx positions the platform as a way to unify security, governance, and access management rather than forcing those teams to reconcile separate views of the same identity lifecycle. The scope includes joiner-mover-leaver workflows, access reviews, excessive or dormant privileges, just-in-time access, and governance of service accounts, API keys, bots, and AI agents. Its website emphasizes rapid deployment and day-one value, while the product pages emphasize continuous monitoring and auditable action. These are useful commercial differentiators if they translate into shorter implementations and measurable reductions in manual identity work.

There are credible public traction signals, but they remain mostly company-reported and should be diligenced rather than treated as independently verified operating metrics. Linx announced a $50 million Series B led by Insight Partners on March 31, 2026, with continued participation from Cyberstarts and Index Ventures, and said total funding reached $83 million. The same announcement described a 100-person company, multimillion-dollar contracts with banks, healthcare companies, and Fortune 500 firms, and governance of millions of identities. The company also reports an emerging product cycle around its AI assistant, MCP server, and Autopilot agent. Those signals suggest enterprise demand and meaningful capital support, but the database does not have public evidence for ARR, retention, gross margin, deployment counts, or the proportion of revenue attributable to autonomous features.

Competition is substantial. SailPoint and Saviynt bring established identity governance suites; Microsoft Entra ID Governance and One Identity benefit from broader platform relationships; and Veza, ConductorOne, Silverfort, and other identity-security specialists compete for visibility, posture management, and least-privilege budgets. Linx’s proposed edge is workflow integration: an identity graph and AI agents that can move from discovery and contextual risk analysis to governed action. The core question is whether this produces safer and faster outcomes than incumbent governance workflows, or whether larger vendors can bundle comparable capabilities before Linx achieves durable distribution. Integrations, policy modeling, permissions accuracy, and customer trust will matter more than the AI label alone.

The defense and national-security adjacency is substantive but indirect. Identity compromise is a recurring route into enterprises, suppliers, cloud estates, and critical infrastructure, so continuous privilege analysis and rapid, auditable containment can support cyber resilience in defense-adjacent environments. The same product could help reduce blast radius for contractors, administrators, service identities, and automated workloads in sensitive networks. There is no public evidence in the reviewed sources of defense contracts, classified deployment, or a government-specific product, so the dual-use case should be understood as security infrastructure relevance rather than claimed defense adoption. Strategically, Linx is worth tracking as a control-plane candidate in the expanding identity-security market, with diligence centered on autonomy safety, integration depth, reference customers, and repeatable enterprise economics."""
