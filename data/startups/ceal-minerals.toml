name = "Ceal Minerals"
description = "Ceal Minerals is a Haifa-based Israeli deep-tech startup developing an electrochemical system that treats seawater used by coastal power plants, captures dissolved atmospheric CO2, and converts calcium and carbon into industrial-grade calcium carbonate while producing softer water that is less prone to scale. Its value proposition combines cooling-system efficiency, carbon removal, marine-pollution reduction, and a potential mineral-revenue stream in one shoreline-installed process."
detailed_description = """
**Product and the concrete problem it solves.** Ceal Minerals targets a costly infrastructure problem hidden inside seawater-cooled thermal power plants: calcium carbonate scale, mussels, barnacles, and other biofouling gradually obstruct intake and cooling pipes, reduce flow, increase pumping effort, and force operators into recurring maintenance. The conventional response is typically chemical dosing or other local treatments that suppress organisms temporarily, do not necessarily remove existing deposits, and can create regulated discharge into the marine environment. Ceal's proposed system is installed at the point where seawater enters the facility. It removes calcium and magnesium from the intake stream before those minerals form deposits in the plant, while also extracting dissolved atmospheric carbon dioxide and producing calcium carbonate as a potentially saleable material. The treated output is softer water for cooling, while the solid output can be reused in the plant, sold into industrial applications, or retained for mineral storage. The company is therefore trying to convert one facility's maintenance liability into a combined operating-cost, environmental, and materials opportunity rather than selling a standalone carbon-credit project.

**Core technology and how it works.** The public technical description centers on an electrochemical mineralization process developed from research at Professor Charlotte Vogt's Technion laboratory. Seawater flows through a modular electrochemical cell containing cathode layers, a selective membrane, and an anode. A controlled electrical current changes the local chemical conditions and concentrates the relevant ions so dissolved calcium and carbon form calcium carbonate outside the plant's vulnerable pipes, in a controlled collection stage. Ceal's own process diagram describes a sequence of seawater input, an electrochemical cell, a CO2-rich alkaline-pH stream, a mineralization system, calcium- and magnesium-depleted water, and mineral output. The design is intended to use the power plant's existing seawater pumping flow and to sit alongside, rather than rebuild, the core cooling process. The company's site lists patent applications for a nanostructured electrode design, an electrochemical carbon-dioxide-capture and water-treatment process, and water-treatment systems and uses; an Ocean Exchange profile also states that Ceal has an exclusive global Technion license and additional process-flow know-how. These are promising IP and integration signals, not proof that the claimed capture cost, mineral purity, energy consumption, fouling prevention, or long-term electrode life have been independently reproduced at industrial scale.

**Market, customers, and go-to-market.** Ceal's first target is the global population of seawater-cooled thermal power plants. Its public materials estimate approximately 1,100 such plants and describe a broader path into desalination facilities, chemical plants, industrial manufacturers, and other installations that use seawater for production or cooling. The entry point is operationally sensible: a plant operator already pays for pumping, chemical treatment, cleaning, corrosion management, and environmental compliance, so Ceal can frame the purchase around reduced operating expense and avoided disruption before asking the customer to value carbon removal. The company's stated business model combines equipment sales with a share of revenue from the calcium carbonate produced. That model could reduce reliance on carbon-credit prices if the mineral has reliable specifications and buyers, but it also makes the startup responsible for process performance, offtake logistics, permitting, and the economics of handling a large water stream. Public materials indicate activity at the National Institute of Oceanography in Haifa and a roadmap toward an Israel Electric Corporation deployment, with future adaptation to desalination and industrial sites. There are no public names of additional paying customers, signed offtake contracts, production volumes, or recurring revenue, so the commercial thesis remains pilot-led.

**Traction, funding, and third-party validation.** Ceal was founded in April 2024 after support through Israel's Blue Economy program, according to Israel Innovation Authority coverage. That same account says the first pilot system began operating on real seawater in December 2024 and that a larger outdoor industrial prototype measuring approximately two by three meters was under test. The Authority's company profile identifies Ceal Minerals as an Israeli energy deep-tech company, records seven employees, and lists support through its pre-seed and seed tracks. Startup Nation Finder reports a $1.2 million funding total, including an October 2025 investment from Israel Electric Corporation, while the Authority's public article says Ceal completed a pre-seed round with two U.S.-based funds and continued Authority support. SOSV describes the Israeli Electric Corporation as Ceal's first customer and references a pilot at Orot Rabin, Israel's largest power station. The timing and status of that utility engagement are not perfectly consistent across public sources: the Authority article describes an IEC pilot as a coming deployment in its roadmap, while SOSV presents the relationship as a first-customer pilot. The defensible conclusion is strategic utility validation and active pilot development, not a confirmed full-scale commercial installation. No audited revenue, independent test report, complete funding history, or commercial-scale carbon-removal result is public.

**Founders and team background.** The founding story combines industrial commercialization experience with academic electrochemistry. Mati Shani is identified as CEO and co-founder; the Israel Innovation Authority describes him as a high-tech veteran with approximately 25 years of experience who developed the business model and industrial application around the laboratory work. Dr. Shany Hershkovitz is identified as CTO and co-founder, while Professor Dr. Charlotte Vogt is identified in the company's materials and ecosystem coverage as the lead scientist and the Technion researcher whose laboratory produced the scientific foundation. Ceal's official team page also lists Or Mayraz in engineering, Anat Greemland as chief business officer, and Asaf Licht as product manager. The combination is appropriate for an early climate-industrial company because the problem spans electrochemistry, water-process engineering, plant integration, mineral quality, and enterprise sales. It is not yet evidence of a scaled industrial-delivery organization: the public team is small, detailed biographies are limited, and the company will eventually need expertise in power-station procurement, environmental permits, electrode manufacturing, automation, quality assurance, and long-duration maintenance. The Technion license and Innovation Authority involvement are useful institutional signals, but they do not remove the execution gap between a working cell and a bankable plant system.

**Competitive dynamics.** Ceal competes against a bundle of incumbent treatments and adjacent carbon-removal approaches rather than one identical product. Chemical water-treatment providers such as Ecolab's Nalco Water business and Veolia Water Technologies can offer established anti-scale, anti-fouling, filtration, and industrial-water programs with global service organizations. Desalination and water-process integrators such as IDE Technologies can compete for the same utility engineering attention and may have stronger plant relationships, even when their core products are not carbon-mineralization systems. Carbon-removal companies such as Captura, Equatic, and Heirloom pursue electrochemical or mineral-based CO2 removal, but their process configurations and customer economics differ from Ceal's co-location with seawater intake and cooling infrastructure. The company’s plausible edge is the combination: it aims to soften intake water, reduce hazardous chemical use, capture carbon, and create a mineral product without requiring a separate inland direct-air-capture plant or a new water-supply network. That bundling is commercially attractive if all four outputs work together, but it also multiplies the diligence burden. A competitor needs to beat Ceal on only one decisive dimension, such as lower delivered cost, easier permitting, better anti-fouling reliability, higher-purity PCC, or a more bankable carbon-removal measurement methodology.

**Defense, security, and resilience dual-use relevance.** Ceal's core technology has credible strategic relevance through critical infrastructure rather than through a disclosed defense program. Coastal power stations, desalination plants, industrial water systems, and fuel or chemical facilities are essential services whose reliability can be degraded by fouling, water scarcity, chemical supply disruption, environmental restrictions, or prolonged maintenance. A modular system that reduces dependence on hazardous treatment chemicals and preserves cooling performance could strengthen continuity at civilian utilities and, by extension, at military bases, ports, shipyards, and defense-industrial sites that operate their own water and power infrastructure. The same electrochemical process and mineralization control could potentially support resilient water treatment in remote or resource-constrained facilities, although no defense customer, military trial, classified deployment, or security certification is public. This is a genuine dual-use resilience case because the plant interface, process control, and water-quality objective can serve both commercial and strategically important infrastructure. The calibration matters: Ceal is not a defense technology company in the available evidence, and the strategic value depends on proving safe operation, cyber-secure control, environmental compliance, and performance through disruptions rather than extrapolating from a prototype.

**Growth stage, trajectory, and key diligence risks.** Ceal is best classified as early. It has moved beyond an idea through seawater testing, a larger prototype, institutional grants, an IEC strategic investment, and a stated path toward an IEC pilot, but it remains far from demonstrated serial production or global utility adoption. The trajectory is attractive if the company can move from proof of concept to a standardized module with independently measured calcium removal, fouling reduction, carbon accounting, mineral purity, power consumption, uptime, and maintenance intervals. The central risks are: (1) scale-up risk, because electrochemical behavior, membranes, electrode life, and solids handling can change materially at plant flow rates; (2) integration risk, because utilities will not compromise cooling reliability for an unproven add-on; (3) economics risk, because the mineral-revenue case depends on consistent precipitated calcium carbonate quality, local buyers, and logistics; (4) regulatory and measurement risk, especially around discharge, marine impact, drinking-water adjacency, and verification of permanent carbon storage; (5) financing risk, because a small pre-seed company must fund industrial hardware and long utility sales cycles; (6) customer-concentration risk if IEC remains the principal reference; and (7) IP and competition risk as water incumbents and carbon-removal specialists improve adjacent processes. The most informative next milestones are a completed IEC field pilot, an independent mass-and-energy balance, verified full-system uptime, a signed mineral offtake relationship, and a second pilot outside Israel.
"""
