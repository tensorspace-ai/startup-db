strategic_value = "QEDIT can be strategically valuable as an independent source of cryptographic protocol design, security assurance, and formal verification for systems handling money, identity, software integrity, or sensitive data. Its work sits at an important trust boundary: organizations can obtain stronger evidence about correctness while disclosing less information. The value is highest where failure is costly and internal cryptography expertise is scarce. Its strategic importance is moderated by the lack of public evidence for a large product platform, dedicated defense sales motion, or durable recurring revenue base."
