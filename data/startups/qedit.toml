name = "QEDIT"
description = "QEDIT is an Israeli applied-cryptography firm that designs, audits, and formally verifies zero-knowledge, privacy-preserving, and blockchain protocols. Its current public work spans production cryptography for digital assets, confidential transfers, Zcash, Solana, institutional networks, and high-assurance verification."
detailed_description = """QEDIT develops and applies advanced cryptography for systems in which correctness, confidentiality, and verifiability must hold at the same time. Its current website describes three commercial service lines: security audits for ZK circuits, proof systems, and cryptographic protocols; protocol design from specification through production implementation; and formal verification using machine-checked proofs in Lean. The technical scope includes zero-knowledge proofs, confidential transactions, secure multi-party computation, fully homomorphic encryption, privacy-preserving data collaboration, and efficient cryptographic software in Rust. This is a specialist engineering and research business, not simply a generic blockchain consultancy or a consumer privacy application.

The immediate customer context is infrastructure that moves valuable assets or processes sensitive information. QEDIT publicly identifies work for or around Zcash Shielded Assets, Zcash Sapling, Solana Token-2022 confidential transfers, Ethereum and other public chains, and bespoke permissioned networks. The Bank of Israel selected QEDIT for its 2024 digital-shekel challenge, where privacy design was one of the relevant technical problems. These engagements point to buyers such as protocol foundations, blockchain infrastructure teams, financial institutions, central-bank innovation programs, and enterprises that need independent assurance before deploying cryptographic systems. The commercial model appears engagement-led and technically intensive, so repeat audit work, reusable protocol components, and long-term ecosystem relationships matter more than broad user growth.

QEDIT has credible technical differentiation, but its competitive position requires careful interpretation. It co-founded the ZKProof standardization effort and designed zkInterface, an interoperability format intended to let circuits written in one framework be proved by another. Its public research also emphasizes moving academic results into audited production systems, which is a meaningful bridge between cryptography research and deployment. Relevant substitutes include specialist audit firms, protocol teams that build internal cryptography capability, and larger ZK companies that increasingly offer their own tooling and assurance. QEDIT can win when an independent, research-led team is trusted with difficult protocol work, but that advantage is relationship- and reputation-dependent and may be difficult to scale like a conventional software product.

The public record contains concrete traction signals without establishing revenue scale or broad product-market fit. QEDIT lists work connected to Zcash, Solana, the Bank of Israel, DARPA, Galois, and other ecosystem partners, and an external 2025 audit report covers its OrchardZSA protocol work for Zcash. QEDIT also says it received $2 million of a $12.6 million DARPA SIEVE-related contract while working with Galois and academic partners. These are material evidence of access to sophisticated technical environments, but they should not be treated as proof of recurring commercial revenue, a current financing round, or successful defense deployment. The public website does not disclose current revenue, backlog, valuation, or customer concentration.

The defense and national-security relevance is credible at the technology layer. Zero-knowledge proofs can support selective disclosure, verifiable claims, and proof of software properties without exposing sensitive inputs; formal verification can increase assurance for cryptographic components and mission-critical software; and privacy-preserving computation can enable controlled collaboration across organizations with different trust boundaries. DARPA SIEVE work is a particularly concrete government-research adjacency. Still, QEDIT publicly presents itself primarily as an applied-cryptography firm serving digital-asset and institutional systems, not as a defense contractor with a dedicated defense product, classified customer base, or disclosed procurement pipeline. The dual-use case is therefore substantive but should be scored below the level of a defense-native company."""
