name = "Mara"
description = "Mara is a San Francisco defense-technology startup developing Spike, a portable counter-small-UAS system that pairs persistent threat sensing with small autonomous kinetic interceptors. Its stated design target is low, fast, multi-directional and radio-silent FPV drone attacks that conventional jamming or narrow-field defenses can miss."
detailed_description = """**Product and operational problem.** Mara is building Spike, an integrated counter-small-uncrewed-aircraft system for the growing mismatch between inexpensive FPV attack drones and the costly assets or people they can threaten. Its product is aimed particularly at low-flying, fast, multi-directional attacks, including coordinated groups, fiber-optic-controlled aircraft and autonomous drones that may not expose a radio link for electronic-warfare systems to exploit. The company presents Spike as a modular defense that can be carried by a small team, mounted on a vehicle or vessel, or arranged as a fixed perimeter. This is a concrete operational gap: a defended squad, convoy, base, port or power facility needs rapid detection and a way to address several attack vectors without relying on a single gun or jammer pointed in one direction. Mara is focused on that short-range, close-in threat rather than claiming to replace wider-area air defense. Product availability, deployments, and advertised performance remain at an early validation stage, so the operational case is compelling but must be tested under representative conditions.

**System architecture and how it works.** Spike combines two modules, Spotter and Seeker. Spotter is the detection, identification and tracking element: Mara describes passive sensor fusion using visual and acoustic inputs, with optional low-emission W-band radar, providing day/night and all-weather operation. The company says it can track radio-silent threats such as fiber-optic or autonomous FPV drones while keeping its own emissions low. Seeker is a compact, tube-launched kinetic interceptor that receives a live target track from Spotter and then uses onboard sensing and autonomy to acquire and close on the target. The intended loop is detect, fix, and finish: Spotter establishes tracks, the system cues one or more interceptors, and Seeker performs a physical intercept. Mara says human supervision can set rules of engagement and abort a launch, while parts of the engagement can be automated. The published design figures include a 250-gram interceptor, up to 48 interceptors per Spike installation, and a reload time under one minute per launchpad. These are company-published specifications, not independently demonstrated performance benchmarks; detection range, probability of kill, false-alarm rate, weather limits, unit cost, and tested simultaneous engagement capacity are not publicly quantified.

**Customers, market and go-to-market.** Mara sells into military and government organizations facing small-drone threats, while also identifying civilian infrastructure operators as potential users. The company’s own deployment ladder starts with a portable configuration for a dismounted squad, extends to vehicle-mounted protection for convoys, and scales to fixed-site or multi-kilometer perimeter coverage for bases, front lines, ports, sporting events and power plants. That modularity could support several procurement channels, but each requires different integration, safety, certification and support work. Military sales depend on trials, operational evaluation, budget cycles, export approvals and compatibility with command-and-control systems; critical-infrastructure sales add site-specific risk assessments and civil aviation constraints. Mara has announced a South Korean port pilot and testing relationships with U.S. defense organizations, and describes early engagement with partner militaries. Those signals suggest the company is pursuing field trials and institutional buyers rather than a consumer market. It has not disclosed contracted revenue, unit deliveries, recurring service revenue, named commercial customers, or a production rate. A viable business therefore depends on converting evaluations into procurement and proving lifecycle economics beyond the acquisition price of the interceptor.

**Traction, financing and external validation.** Mara announced a $7 million financing round on August 26, 2026, led by Khosla Ventures and including a16z Speedrun, Night Capital, Palmdrive, Protagonist, Freedom Fund, Indicator Fund and angel investors. The round is described as pre-seed and intended to move Spike from field testing toward broader deployment. Mara reports that Seeker intercepts were cued through U.S. Army software at a Texas exercise, that Spotter operated on an armored vehicle in a European Army exercise while feeding data into Army command software, and that a U.S. special-operations exercise demonstrated an end-to-end engagement. It also says Ukrainian forces operated Spotter roughly 40 kilometers from the front line in July and that a South Korean port pilot is underway. The company reports cooperative research and testing agreements with three U.S. defense organizations and selection for NATO’s DIANA innovation accelerator. Forbes independently reported the round, founder identities and testing relationships, while The Register covered the product and financing; the underlying trial detail largely traces to Mara’s announcement. These are meaningful validation signals, but they should not be read as evidence of a production contract, formal program of record, combat-proven interceptor, or independently audited efficacy.

**Founders and team.** Mara was founded in October 2024 by chief executive Daniel Kofman and chief technology officer Sriram Raghu, who say they have worked together since meeting in high school in 2013. The founders’ company biographies describe a long-running focus on hardware and autonomy: Kofman says he built tactical FPV prototypes for a U.S. Department of Homeland Security program while in college, and the team says it previously co-founded Optivolt, which shipped smart solar panels to Anduril, the U.S. Air Force and Ukraine. Raghu’s company biography describes prior work across smart solar products and kernel cybersecurity, and says he delivered products to Anduril, the U.S. Air Force, NOAA and the Ukrainian army. These are relevant founder-reported histories because Spike spans sensing, embedded autonomy, electromechanical design, manufacturing and defense customer integration. They do not, by themselves, establish the size or depth of the current engineering, safety, manufacturing or government-sales organization; no reliable public employee count or detailed leadership roster was confirmed. Diligence should distinguish founders’ prior product delivery experience from evidence that Mara itself has qualified a safety-critical kinetic system for repeatable production and deployment.

**Competitive dynamics and differentiation.** Mara competes in a crowded counter-UAS landscape where established defense primes and newer autonomy companies offer radar, electro-optical detection, electronic attack, guns, directed energy, command software or interceptor drones. Relevant alternatives include Anduril’s Lattice-integrated counter-UAS systems, Fortem Technologies’ radar-guided DroneHunter net-capture interceptor, Epirus’ high-power microwave Leonidas, RTX’s Coyote interceptor family, and DroneShield’s electronic-warfare detection and defeat products. These systems do not all address the same target set or use the same engagement method, but they compete for counter-drone budgets and protected-site integrations. Mara’s proposed distinction is the combination of passive or low-emission sensing, hemispherical coverage and a compact, attritable kinetic interceptor designed for multiple directions and radio-silent FPV threats. The system could be attractive where jamming is ineffective, undesirable or politically constrained and where the target is too small or numerous for expensive missiles. Yet the edge remains a product thesis until comparative trials quantify detection performance, intercept success, false alarms, safe operation around friendly aircraft and people, throughput, and cost per successful engagement. Larger incumbents have procurement access, tested systems and support networks that a pre-seed company must overcome.

**Defense, security and resilience relevance.** Mara’s core product is directly defense-oriented, with a credible dual-use extension to protecting civilian infrastructure from malicious small drones. The same low-altitude sensing and close-in response problem can arise around ports, power plants, logistics depots, public events, airports or emergency-response sites, although deployments in civilian airspace require strict deconfliction, legal authority and safety controls. For armed forces, passive sensing and operation against radio-silent threats matter where adversaries adapt to jamming or use fiber-optic links, while a distributed magazine of small interceptors may change the economics of defending dispersed vehicles and positions. The company’s reported work with U.S. Army exercises, Ukrainian users, a South Korean port and NATO DIANA gives the strategic thesis concrete, if still preliminary, reference points. It is a U.S. company and should be treated in this database as an allied strategic reference, not as an Israeli startup or evidence of Israeli defense adoption. The resilience case is based on the potential to reduce vulnerability of critical sites and mobile logistics to low-cost aerial attack. Public information does not establish operational deployment at scale, a government award, export authorization, or certified civilian use.

**Stage, trajectory and diligence priorities.** With an October 2024 founding date and a $7 million pre-seed round announced in August 2026, Mara is an early-stage hardware company progressing from prototypes and field evaluations toward planned ground deployments by late 2026 and vehicle-mounted or man-portable rollouts alongside production scale-up in 2027, according to its own timetable. The opportunity is strategically important because low-cost FPV attacks pressure defenders to find a sustainable cost exchange and to protect forces and infrastructure without depending on radio-frequency disruption alone. The same profile carries substantial execution and governance risk: kinetic autonomous interception raises rules-of-engagement, accountability, safety and escalation questions; sensor performance can degrade in clutter, weather and adversarial conditions; and reliable manufacture, inventory, maintenance and software updates are difficult in field environments. Buyers may require extensive integration and proof before procurement, while established competitors can bundle sensors, effectors and command software. The company has not publicly disclosed revenue, production yield, customer contract values, audited test data, interceptor cost, intellectual-property or patent details, or a verified employee count. Key diligence should seek controlled trial results across threat types and environments, independent assessment of human oversight and fail-safe behavior, manufacturing economics, customer conversion evidence, export-control posture, and a clear roadmap for civilian-site authorization."""
