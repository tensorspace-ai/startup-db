name = "Sixdof Space"
description = "Jerusalem-based startup developing high-speed optical tracking systems that deliver full six-degree-of-freedom pose data for autonomous drones, robots, vehicles, and smart devices. Its Falcon and Cheetah products use optical sensors and infrared beacons to provide GPS-independent, low-latency positioning in indoor and outdoor environments."
detailed_description = """Sixdof Space develops a hardware-and-software positioning stack built around an optical tracker, infrared beacons, and real-time pose algorithms. The company sells two product configurations: Falcon, in which a moving sensor tracks fixed beacons, and Cheetah, in which stationary sensors track moving beacons. The official product documentation describes full six-degree-of-freedom position and orientation, centimeter-level accuracy at approximately 8–12 meters, heading detection up to 100 meters, and full-pose updates every 2.5 milliseconds. The system is designed to operate from total darkness to full sunlight and does not depend on GPS, making it a positioning aid rather than a conventional camera-based visual-odometry system.

The immediate customer problem is precise relative positioning for machines that must land, dock, coordinate, or move safely without accumulating dead-reckoning drift. Sixdof identifies autonomous drone landing, robotic-arm tracking, multi-robot coordination, motion capture, and tracking of smart devices such as VR headsets as use cases. The company also publishes an SDK and integration materials for Windows and Linux, with ROS2 and Android versions described as beta or available in its product and download materials. That software compatibility and the low computational requirement—its site says no DSP or GPU is required—could reduce integration friction, although public information does not establish production volumes, recurring revenue, or the number of deployed systems.

Commercially, Sixdof sits between general-purpose robotics localization, motion-capture systems, and specialized autonomy sensors. Its value proposition is strongest where GPS is unavailable, visual features are unreliable, drift is unacceptable, or a customer needs a high-rate relative pose signal in a constrained workspace. Infrared beacon infrastructure creates a deployment requirement and can limit range, line-of-sight geometry, and scalability across large outdoor areas; in exchange, it can provide a controlled reference frame with predictable performance. The company’s public materials indicate a productized offering with software downloads, mechanical files, a development kit, and a shop, while its public LinkedIn profile lists an 11–50 employee range and Jerusalem headquarters. These are useful commercialization signals, but they do not by themselves prove repeatable enterprise sales or qualification for safety-critical programs.

The defense and security case is credible but narrower than a claim that Sixdof provides space navigation or satellite autonomy. GPS-independent precision landing, relative positioning, formation control, and autonomous recovery can support unmanned aerial systems, ground robotics, logistics, and contested or indoor environments. The company’s March 2026 news page says it was engaged as a subcontractor for a Lockheed Martin U.S. Air Force contract concerning a next-generation air-refueling system; that announcement is a meaningful strategic signal, but the public record does not provide enough detail to assess contract value, production status, or the exact Sixdof workshare. The technology is therefore dual-use because the same optical pose measurement can serve industrial robotics and defense autonomy, not because orbital applications have been publicly demonstrated.

Sixdof was founded in 2017, is privately held, and public profiles describe seed financing while leaving the current capitalization and revenue picture unclear. The principal diligence questions are field reliability under dust, vibration, weather, occlusion, and beacon loss; performance against competing vision, lidar, UWB, radar, and inertial systems; installation and calibration burden; intellectual-property defensibility; and evidence that pilots convert into repeatable product sales. A strategic reader should also establish whether the Lockheed/AFRL work leads to a durable defense channel and whether the company can support certification, supply-chain, and export-control requirements without losing its commercial agility."""
