name = "OneLayer"
description = "OneLayer provides OneLayer Bridge, a software platform for asset visibility, device identity, zero-trust segmentation, and operational management across private LTE and 5G networks. It targets enterprises running connected OT and IoT environments where conventional IT security tools do not reliably interpret cellular identity, signaling, or network handovers."
detailed_description = """OneLayer's core product, OneLayer Bridge, sits between a private cellular packet core and the enterprise IT/OT security stack. It discovers cellular-connected endpoints, including devices behind cellular routers, enriches them with contextual information, and gives security and network teams a common inventory for policy and operations. The company's device-centric OneID approach is intended to keep identity and policy attached to an asset as its IP address changes, its SIM changes, or it moves between private cellular, public cellular, and Wi-Fi connectivity. Its stated controls include agentless visibility, ML-based device fingerprinting, persistent tracking, geofencing, device onboarding, and cellular network segmentation.

The customer problem is specific and credible: private LTE/5G networks are increasingly used for utility operations, factories, mining, airports, ports, and other sites where coverage, mobility, and reliability matter, but these deployments can remain operational silos for enterprise security teams. OneLayer's integration with cellular packet-core technologies and enterprise tools is designed to translate cellular events into asset, access, and security workflows that IT and OT teams already understand. The product is therefore complementary to, rather than a replacement for, firewalls, SIEM, EDR, OT monitoring, CMDB, and cellular infrastructure. Its likely buyers include utilities, industrial operators, telecom or network teams, and security groups responsible for critical connected assets.

Public traction signals are stronger than the prior record suggested but should still be separated from independently verified financial performance. OneLayer publicly announced an oversubscribed $28 million Series A on October 16, 2025, led by Maor Investments with McRock Capital and Chevron Technology Ventures participating alongside existing investors Viola Ventures, Grove Ventures, and Koch Disruptive Technologies; the company said this brought total funding above $43 million. OneLayer also announced a formal Sentry partner program in April 2026 with private-wireless and security integrators, and a July 2026 company release reported that Gartner named it a Sample Vendor in the 5G Network Security category of the 2026 Hype Cycle for Private Networks for Industry. These signals indicate channel-building and category recognition, not independently verified revenue or product-market dominance. The company has publicly described an Evergy multi-year selection and Southern Linc deployment activity, while its site lists integrations across Nokia, Ericsson, cellular-core vendors, router makers, security vendors, and enterprise-management platforms. Customer concentration, retention, margins, and revenue quality still require direct diligence.

The competitive field includes broad OT-security platforms such as Claroty, Nozomi Networks, Forescout, and Dragos; network-security platforms from Fortinet, Palo Alto Networks, and Cisco; and native management and security capabilities from private-wireless infrastructure vendors. OneLayer's differentiation is its narrow focus on cellular-connected assets, persistent device identity through handovers and SIM/IP changes, and controls close to the private cellular core. That focus can be valuable where generic tools have a visibility gap, but it also creates platform risk if large security or telecom vendors add equivalent functionality. For defense and national-security purposes, the applicability is real but indirect: the same controls could secure private cellular networks at bases, logistics hubs, energy assets, ports, and other mission-critical sites. Public evidence reviewed here does not establish a defense contract or military deployment, so the defense thesis should be treated as adjacency to resilient critical-infrastructure communications rather than proven defense revenue."""
