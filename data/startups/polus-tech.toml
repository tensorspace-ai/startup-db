name = "Polus Tech"
description = "Polus Tech is a Swiss-founded strategic technology company with strong Israeli ecosystem ties, developing low-SWaP radio-frequency and cellular-signal localization systems for search and rescue, emergency communications, private networks, and security missions. Its current public positioning spans autonomous RF sensing on drones, GPS-denied 3D localization, and the conversion of detected emitters into actionable guidance."
detailed_description = """**Product and the concrete problem.** Polus Tech addresses a difficult gap between a person or device emitting a radio signal and an operator being able to locate, communicate with, or assist that person in a difficult environment. Conventional search-and-rescue teams may have to rely on visual search, cell-tower records, ground-based direction finding, or slow deployment of specialized teams; those approaches can fail when people are under rubble, surrounded by floodwater, beyond normal road access, or inside a disrupted communications area. The company's public material describes a portfolio that includes RF sensors, emergency communication, secured private cellular networks, and a NEO family for search and rescue. The strategic proposition is not merely another drone camera: Polus is trying to make a lightweight sensor and mission layer that can locate devices emitting inside an area, maintain communications for responders, and provide an operator with an actionable position or route. The defense relevance is similarly concrete but should remain calibrated. A sensor able to identify and locate phone or other cellular emitters from an airborne platform could support intelligence, rescue, perimeter awareness, and incident response, but public sources do not establish a fielded military contract or a complete targeting system.

**Core technology and how it works.** Polus's current website describes a platform- and use-case-agnostic single sensor for high-precision three-dimensional localization, with what it calls radar-class area custody from a lightweight sensor. The company emphasizes a combination of cellular protocol knowledge, an RF signal chain, calibration, and machine learning, and says the system can operate in GPS-denied conditions and scale across attritable platforms. Its offerings page adds advanced AI autonomy, specialized RF hardware, and coordination between primary and secondary drones for the NEO portfolio. Public reporting provides a more specific operational picture: a drone-mounted sensor is intended to detect radio signals transmitted by mobile phones, estimate a target's location in real time, and work with a smart mission manager that can communicate with other systems on the same aircraft. The company has not publicly disclosed enough engineering detail to independently assess antenna architecture, bands, sensitivity, geolocation error, multipath rejection, privacy controls, or how it distinguishes devices in dense cellular environments. The technical diligence question is therefore whether Polus's integrated RF, calibration, autonomy, and mission-software stack produces reliable coordinates under terrain, interference, altitude, and adversarial conditions, rather than whether the individual building blocks are theoretically plausible.

**Market, customers, and go-to-market.** Polus has a broader commercial entry point than a defense-only sensor vendor. Its official offerings describe emergency communications for first responders, emergency SMS broadcasting, secured private cellular networks for mining, factories, and agriculture, and RF sensing for search and rescue. These applications create several customer groups: civil-protection agencies, emergency-service organizations, industrial operators with difficult radio environments, infrastructure owners, drone and helicopter operators, and defense or homeland-security agencies. The likely go-to-market is systems-led. A customer may buy a complete operational package, integrate the RF engine into an existing aircraft or drone payload, or use the company's communications capability as a deployable private network. Polus explicitly presents both a full-chain product and an engine-only integration model, which could help it work with platform manufacturers and mission-system integrators. The commercial challenge is that each deployment may require spectrum permissions, airworthiness or platform qualification, local telecommunications approvals, data-protection review, and field support. Public sources do not disclose recurring revenue, named commercial customers, pricing, backlog, or the share of sales from rescue, industrial, communications, and defense applications, so the addressable market should be treated as strategically broad but commercially unproven.

**Traction, funding, and third-party validation.** Polus's strongest public validation is operational rather than financial. Globes reported that versions of its systems were used to locate survivors during floods in Jakarta, Indonesia, European floods, and Tropical Cyclone Alfred in Australia, including a cellular-signal sensor mounted on a helicopter. The same report said the company was developing a drone-mounted sensor for security and military use and had discussions with Israel's Ministry of Defense's Directorate of Defense Research and Development; that report describes discussions, not a contract or deployment. Polus's own website now states that the company has a decade of delivery experience, an established client base, and scalable manufacturing capabilities, but those statements are vendor-reported and the site does not identify the customers or quantify shipments. The company is privately held and has not publicly disclosed a funding total or named financing round in the sources reviewed. Globes reported that Israel Aerospace Industries' Elta Systems unit made an early investment and that Shavit Capital later backed the company; this is a meaningful Israeli industrial and financial ecosystem signal, though the size, terms, and continuing ownership are not public. Taken together, the evidence supports a real operating company with rescue and RF product history, not a claim of scaled defense procurement.

**Founders and team background.** Polus was founded in 2016 by Niv Carmi in or near Zug, Switzerland. Public reporting identifies Carmi as a graduate of a classified Israeli intelligence unit and as one of the founders of NSO, although the public record does not establish the full current executive team, engineering headcount, or the precise division of responsibilities among the company's international locations. The company's origin story is important to diligence because it explains the blend of cellular communications, intelligence, and humanitarian use cases: Carmi is described as having started Polus to apply communications expertise to finding people trapped in rubble or disaster zones, then expanded toward airborne sensing and security after the October 7 attack. Elta's early investment and board representation, as reported by Globes, also suggest access to Israeli defense-electronics expertise and industrial networks. At the same time, the team signal should not be overinterpreted. A founder's intelligence and cyber background is not proof of RF performance, compliance, or customer delivery, and public sources do not provide an independently verified employee count, patent portfolio, manufacturing footprint, or current board composition. The key team diligence items are retained technical leadership, field-operations depth, spectrum and privacy compliance, and the ability to industrialize a specialized sensor across multiple jurisdictions.

**Competitive dynamics.** Polus competes in a fragmented stack rather than against one direct substitute. Search-and-rescue buyers can use satellite imagery, cellular-carrier assistance, ground-based direction finding, thermal or optical payloads, and established emergency-communications providers. Defense customers can compare Polus with passive RF and signals-intelligence vendors, airborne electronic-support systems, counter-UAS sensor companies, and large primes that bundle sensors with command-and-control. Globes specifically named CRFS and GAO Tek as other radio-sensor companies and described Israeli alternatives including R2 and RunEL in adjacent RF or cellular-positioning contexts. Polus's claimed edge is the combination of a single lightweight sensor, airborne deployment, cellular-signal localization, autonomous or coordinated drone operations, a mission manager, and a route from signal detection to operational effect. That combination could reduce the number of fixed nodes and make the system useful where a convoy, mast, or dense ground network is impractical. The same integration can also be a weakness: a buyer may prefer a proven specialist sensor, a carrier-controlled location service, or a prime contractor with certification and sustainment capacity. Polus must demonstrate lower size, weight, power, and deployment burden without sacrificing accuracy, legal defensibility, or operator trust.

**Defense, security, and resilience relevance.** Polus has credible dual-use relevance because its core capabilities serve humanitarian rescue, commercial communications, industrial connectivity, and security missions. On the civilian side, locating a phone signal from a helicopter or drone can help responders find survivors after floods, earthquakes, or infrastructure collapse; deployable cellular networks can reconnect responders or industrial teams when fixed infrastructure is unavailable; and private networks can support mining, agriculture, and factories in remote or contested environments. On the defense and security side, the same RF localization and mission-management stack could support wide-area reconnaissance, search for missing personnel, border and perimeter awareness, hostage or disaster response, and intelligence collection against emitting devices. This is a capability adjacency with real operational value, not evidence that Polus conducts offensive cyber operations or has fielded a weapons system. The privacy and governance boundary is material: passive or active cellular localization can affect civilians, and customers will need clear legal authority, minimization procedures, auditability, data retention controls, and export compliance. For Claw & Talon's thesis, Polus is especially relevant as an allied-technology reference showing how Israeli signals-intelligence know-how, European incorporation, humanitarian missions, and defense demand can converge in one RF platform.

**Growth stage, trajectory, and diligence risks.** Polus is best classified as an early or unknown-stage strategic technology company with a longer operating history than its public visibility suggests. It was founded in 2016 and presents itself as having a decade of delivery experience, yet it remains relatively opaque about financing, headcount, revenue, production volume, customer concentration, and current legal structure. The company appears to be moving from rescue and emergency communications toward a broader platform model in which an RF engine can be installed on drones, paired with autonomous mission management, and sold into allied security and defense markets. That trajectory could create meaningful strategic value if the company proves its sensor works across terrain and spectrum conditions, converts Israeli and international interest into funded programs, and scales manufacturing without losing calibration quality. The central risks are technical validation, spectrum and privacy regulation, export controls, customer procurement cycles, dependence on a small number of industrial relationships, and the possibility that larger defense primes or RF specialists reproduce the most valuable functions. Additional diligence should request independent geolocation-error data, sensitivity by band and altitude, false-positive and false-negative rates, legal-use documentation, patent ownership, manufacturing yield, rescue-customer references, financing runway, and the exact scope of Elta's historical investment. The opportunity is strategically distinctive, but public evidence supports a watchlist record rather than a conclusion that Polus has achieved defense-market scale.
"""
