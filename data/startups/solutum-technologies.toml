name = "Solutum Technologies"
description = "Solutum Technologies is an Israeli advanced-materials startup developing patented flexible-packaging films and barrier layers that can be recyclable, industrially compostable, or biodegrade in soil and water without leaving microplastics. Its drop-in material is designed for existing extrusion and converting lines, targeting food, pharmaceutical, electronics, and other packaging supply chains."
detailed_description = """
**Product and the concrete problem it solves.** Solutum Technologies addresses a specific failure in flexible packaging: conventional multilayer films deliver the oxygen, oil, heat-sealing, and mechanical performance that food and industrial products need, but they are difficult to recycle and can persist as plastic pollution. The company is developing a family of films, coatings, and composite materials that provide a managed end of life while preserving the performance and manufacturing economics expected by packaging converters. Its product material can be formulated for different mechanical properties, produced transparent or tinted, printed, heat sealed, and used as a mono film, a barrier layer, a paper coating, or a soluble film for applications such as laundry bags and soap sachets. Solutum's value proposition is therefore operational as well as environmental: manufacturers can test a replacement on existing extrusion, coating, and converting equipment rather than building an entirely new plant. The company describes a controlled dissolution or biodegradation profile ranging from minutes to months depending on the formulation and use case, which is more useful to a packaging engineer than an undifferentiated claim that a product is simply biodegradable.

**Core technology and how it works.** The Israel Innovation Authority describes Solutum's core as a proprietary composite made from readily available polymers, copolymers, and non-polymeric materials. Rather than relying on one universal resin, the team tunes the composition for the target package, then runs an in-house proof of concept and a commercial-scale trial. Public technical material emphasizes high tensile strength, elongation, tear and puncture resistance, gas-barrier performance, an absolute oil barrier, heat sealing, antistatic properties, and the ability to reduce film thickness through down-gauging. Solutum's older water-soluble formulation uses a predetermined dissolution process at ambient water conditions; its current materials also target recycling, industrial composting, and complete biodegradation in soil and water. The company presents these as a portfolio of end-of-life pathways rather than a promise that every package disappears in every environment. A 2025 WIPO publication names Solutum Technologies Ltd. as the Israeli applicant for a shrinkable polymer film application, while the Innovation Authority records WIPO publications for composite compositions and PVOH-containing water-soluble films. The public record does not establish granted claims, independent lifecycle results, or a complete freedom-to-operate opinion, so patent scope and environmental performance remain diligence items.

**Market, customers, and go-to-market.** Solutum sells material technology into the flexible-packaging value chain rather than attempting to become a consumer brand. Its target customers are packaging converters and brand owners in food and beverage, pharmaceuticals, electronics, and other applications that need barriers and shelf life. The go-to-market sequence is concrete: customize the material for a customer's specification, run a quick pilot on existing equipment, iterate in-house, and then integrate the supply chain at commercial scale. The approach reduces capital expenditure and process risk for a converter because it does not require a replacement factory. Publicly named ecosystem evidence includes Chang Chun Group, a Taiwanese chemical manufacturer that tested Solutum's key barrier products, and the MULTIVAC Group, which tested the products on its packaging machines. An earlier collaboration reference identifies Indian Oil Corporation's research and development organization as signing a statement of intent to collaborate on commercializing biodegradable plastic material in India. Those references show industrial validation and international channel potential, but they do not prove recurring revenue, a production-volume contract, or broad customer adoption.

**Traction, funding, and third-party validation.** Solutum won the 2019 Coller Startup Competition at Tel Aviv University, receiving a $100,000 prize after demonstrating a water-degradable plastic alternative that could be made on existing lines. Israel's Innovation Authority identifies the company as established in 2017, with 27 employees, initial revenues, and support through several research, applied-research-consortium, and transition-to-manufacturing programs in 2022-2024. On August 14, 2025, Solutum announced an equity financing led by Chang Chun Group and joined by the AgriFoodTech Venture Alliance, with additional support from Aston Ventures, Olympic Investments, JAL Ventures, and Novaro. The announcement says the funds will support commercialization and production scale-up, but it does not disclose the amount or ownership terms. The same release reports extensive due diligence by Chang Chun and machine testing by MULTIVAC. Solutum's website lists certifications and partner work, while the Innovation Authority provides the most useful independent description of its material properties and target markets. This is meaningful progress beyond a laboratory concept, but the public evidence still stops short of audited sales, unit economics, independent biodegradation trials, or a disclosed manufacturing footprint.

**Founders and team background.** Sharon Barak is publicly identified as Solutum's founder and president, and earlier company and export materials identify her as CTO and founder. Her public biography describes a chemical-engineering path into cleantech entrepreneurship and frames the company around reducing plastic waste through materials chemistry. The company website identifies Moran Spier as head of engineering and shows an engineering team working through specification, pilot, and scale-up stages. Guy Sagie is listed as CEO in the Innovation Authority record, while LinkedIn lists a 27-person company and names additional commercial and technical personnel. These sources support a hands-on materials and commercialization team, but they do not provide complete résumés, an authoritative executive roster, or evidence of prior exits. The founding story is nevertheless relevant to execution: flexible films fail when they cannot run on customer equipment, and Solutum's public process repeatedly emphasizes machine compatibility, barrier testing, and formulation iteration. The main team diligence questions are whether the company has enough polymer-processing and quality-assurance depth for high-throughput production and whether it can manage regulatory documentation across food-contact and pharmaceutical packaging markets.

**Competitive dynamics.** Solutum competes with several different approaches rather than one direct peer. TIPA develops compostable flexible packaging and has strong brand visibility; Notpla uses seaweed and other natural materials for coatings and formats; and Ecopol supplies water-soluble and biodegradable films. Conventional polyethylene, polypropylene, EVOH, and multilayer laminates remain the incumbent substitute because their performance, qualification history, and global supply are well established. Amcor, Mondelēz and other large packaging ecosystems can also fund internal material substitution or qualify multiple suppliers, which raises the bar for a small startup. Solutum's claimed edge is a combination of controlled end-of-life options, barrier and mechanical performance, and a drop-in path through existing machinery. The 50%-down-gauging claim in the Innovation Authority description, if reproduced at customer scale, could improve both material economics and environmental impact. That edge is not yet proven as a durable moat: competing compostable films, chemical recycling, paper-barrier systems, and incumbent resin suppliers can all target the same regulations and brand commitments. Independent comparative testing, customer retention, and cost per packed unit will determine whether Solutum wins on total package performance rather than sustainability messaging alone.

**Defense, security, and resilience dual-use relevance.** Solutum's dual-use case is a resilience application of materials technology, not a defense product claim. Food, medical, electronics, and hygiene packaging are enabling layers in emergency response, military logistics, and critical infrastructure supply chains; a material that can be manufactured on existing equipment and sourced from common polymers could reduce dependence on specialized imported films during a disruption. Water-soluble or biodegradable formats could also simplify waste handling around field kitchens, temporary clinics, remote worksites, and disaster-response operations where collection and reverse logistics are costly. Barrier performance and shelf-life preservation are relevant to stored rations, medicines, diagnostic consumables, and sensitive electronic components, although Solutum has not publicly announced military customers, government contracts, or qualification for those applications. Israel's materials and manufacturing base, the company's Innovation Authority programs, and its collaboration with an energy-sector laboratory in India create a plausible allied-industrial pathway. The score should remain moderate because the public record contains no defense testing, ruggedized packaging specification, hazardous-material certification, or procurement approval. Strategic relevance comes from supply-chain resilience and dual-use packaging infrastructure rather than fielded security capability.

**Growth stage, trajectory, and key diligence risks.** Solutum is best classified as early-to-mid commercialization: it was founded in 2017, has reported initial revenues and 27 employees, has completed multiple development programs, and announced a 2025 scale-up financing, yet it has not disclosed revenue, production capacity, valuation, or a large named customer base. The likely trajectory is a materials company moving from formulation and pilot validation toward repeatable commercial supply. Key diligence points are (1) whether the 2025 financing translated into certified production lots and repeat purchase orders; (2) the independent evidence for biodegradation, compostability, recyclability, food contact, and microplastic claims in the exact environments customers use; (3) cost and availability of feedstocks as petrochemical and bio-based inputs fluctuate; (4) patent breadth, granted status, and freedom to operate around PVOH, shrinkable polymers, and multilayer barrier structures; (5) regulatory approvals across Europe, Israel, India, and the United States; (6) quality consistency when formulations are scaled from laboratory batches to high-speed converting lines; and (7) the risk that brand owners delay adoption because incumbent films are cheaper, familiar, and already qualified. Milestones that would strengthen the thesis are disclosed annual revenue, a commercial production partner, independent lifecycle assessments, named food or pharmaceutical customers, and evidence that the same material platform wins on both cost and end-of-life performance.
"""
