name = "OPSYS Tech"
description = "OPSYS Tech develops pure solid-state scanning LiDAR built from addressable VCSEL transmit arrays and CMOS SPAD receiver arrays. Its ALTOS product family targets automotive, intelligent transportation, robotics, unmanned systems, and security applications with high-resolution 3D sensing and increasingly embedded detection functions."
detailed_description = """OPSYS Tech is an Israeli sensing company founded in 2016 that builds semiconductor-based, pure solid-state scanning LiDAR. Its core architecture combines fully addressable vertical-cavity surface-emitting laser (VCSEL) arrays with a single-chip addressable CMOS single-photon avalanche diode (SPAD) receiver array. Electronic selection of transmitter and receiver elements removes mechanical scanning components, while the company's multi-wavelength approach is intended to let multiple base sensors operate together without optical interference. OPSYS describes a LiDAR Control Unit that merges multiple sensors into one 4D point cloud containing spatial, intensity, and ambient infrared information. The company markets the architecture as flexible in field of view and resolution rather than as one fixed automotive module.

The current commercial offering is broader than an automotive sensor alone. The ALTOS family includes a general 3D LiDAR, PoE and compact variants, and application-specific products such as ALTOS-TRACK for object detection and tracking, ALTOS-WAY for wrong-way driving detection, ALTOS-OVIS for over-height detection, and ALTOS-IDIS for intrusion detection. These products indicate a move up the stack from component supply toward packaged sensing and edge analytics. The official site cites 30 FPS output after averaging, selectable resolution down to 0.1 degrees, Class 1 eye safety, NEMA TS2 certification for traffic equipment, and a wafer-scale semiconductor process; these are company-reported product claims that should be checked against current datasheets and customer acceptance evidence during diligence.

The near-term market case is strongest where reliable 24/7 depth sensing, low maintenance, and local event detection matter more than a fully autonomous driving win. Traffic agencies and infrastructure operators can use the products for vehicle and pedestrian tracking, ramp metering, over-height and wrong-way alerts, and roadway monitoring. Security and industrial buyers can apply 3D perimeter protection, data-center access or tailgating detection, workforce safety, and other zones where a camera-only system struggles with lighting, privacy, or precise range. Robotics, unmanned aerial systems, agriculture, and autonomous equipment are credible adjacent markets, but the record does not establish production scale, named defense customers, or a completed high-volume automotive program.

OPSYS competes in a crowded LiDAR market against Ouster, Luminar, Innoviz, Aeva, Cepton, Hesai, and lower-cost camera/radar or mechanical-LiDAR substitutes. Its potential edge is the combination of no moving optical parts, addressable VCSEL/SPAD integration, modular multi-sensor coverage, and application-specific software at the sensor edge. That combination may simplify installation and reduce maintenance in infrastructure deployments, but it is not by itself proof of superior range, interference immunity, reliability, yield, or unit economics. The principal commercialization question is whether OPSYS can convert differentiated architecture and evaluation activity into repeatable deployments while maintaining semiconductor yield, supply continuity, software quality, and customer support.

Dual-use relevance is credible but should be stated precisely. The same 3D sensing, tracking, perimeter monitoring, and compact low-power packaging used in traffic and commercial security can support unmanned-vehicle navigation, base or facility intrusion detection, logistics-yard monitoring, and force-protection systems. The public evidence reviewed here supports a defense-adjacent capability, not confirmed military procurement or battlefield performance. Strategic interest therefore rests on allied access to an Israeli sensor supplier and on the possibility of integration into security and autonomous platforms, subject to export-control, environmental qualification, cyber-security, and customer-validation diligence."""
