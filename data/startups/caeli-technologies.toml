name = "Caeli Technologies"
description = "Israeli life-support equipment company developing closed-circuit and hybrid rebreathers for military, CBRN, subterranean, maritime, rescue, and other hazardous-air operations. Its CRUSOE HP combines a closed-circuit oxygen loop with powered air-purifying respirator operation, with the company reporting up to 12 hours of use and U.S. Special Operations leadership publicly announcing CRUSOE fielding in 2025."
detailed_description = """
**Product and the problem it solves.** Caeli Technologies builds wearable respiratory life-support equipment for work where ambient air is unsafe, scarce, or operationally unsuitable. The need is concrete: conventional open-circuit breathing apparatus consumes a finite compressed-air supply quickly, while closed-circuit rebreathers extend endurance by scrubbing carbon dioxide and replenishing oxygen but carry their own duration, heat, maintenance, and workload trade-offs. Those constraints matter in tunnel clearance, underground rescue, contaminated-site response, ship boarding, and high-risk entry because a team may need to remain in a hazardous area longer than a conventional cylinder permits, while a resupply break can interrupt the mission and expose personnel. Caeli's range includes the CRUSOE HP hybrid terrestrial rebreather, CRUSOE Pro and CRUSOE 240 closed-circuit terrestrial units, and CompactOxy for combat-diving use. The lead CRUSOE HP is designed to switch between a closed-circuit breathing apparatus and powered air-purifying respirator (PAPR) mode. The company specifies four hours in closed-circuit mode plus eight hours in PAPR mode, for a stated maximum of 12 hours; that figure is a company product specification, not an independently published endurance test result.

**Core technology and how it works.** In a closed-circuit mode, the operator breathes through a loop that recirculates exhaled gas, removes carbon dioxide with replaceable scrubber canisters, and adds oxygen to replace what the body consumes. Reuse conserves oxygen compared with discharging every exhalation, but it requires control of gas composition, heat from the scrubber reaction, breathing resistance, and safe component servicing. Caeli describes an air-cooled scrubber and forced-convection cooling, with modular canisters and quick-release assemblies intended to simplify replenishment. In PAPR mode, battery-powered blowers draw ambient air through protective filters and maintain positive pressure in the breathing circuit. The hybrid system uses a selector valve and control logic to move between the modes so that the team can conserve oxygen while filtered ambient air is usable, then return to the self-contained loop where the atmosphere is unsafe. Caeli also describes sensor-guided blowers for assisted inhalation and exhalation, a display for oxygen and scrubber status, mask defogging, and replaceable oxygen and scrubber modules. These capabilities are engineering-sensitive: filtration performance, oxygen dosing, thermal management, battery endurance, human factors, and safe transition behavior all need validation in the specific conditions for which a unit is approved.

**Market, customers, and route to market.** The addressable customer set is specialized rather than mass-market: military special-operations and combat-engineering units, CBRN and hazardous-material teams, fire and rescue services, law enforcement, and industrial responders who must enter confined, contaminated, oxygen-depleted, or submerged environments. Caeli's products are sold as physical equipment, likely through government procurement and specialist defense or safety channels; the company has not publicly described a repeatable channel strategy, contract sizes, or commercial service revenues. It names multi-phase tactical entry, tunnel reconnaissance and clearance, CBRN response, decontamination, disaster search and rescue, and combat diving as use contexts. This product family gives it the option to address both terrestrial and maritime operators using related rebreather know-how, but each deployment environment requires distinct qualification, training, and consumable logistics. The company lists a Rehovot address and an Israeli telephone contact. Startup Nation Finder identifies the Israeli market focus and a business-to-government/business-to-business orientation, although its company profile was last updated in 2024 and should not be treated as a current commercial disclosure.

**Traction, financing, and external validation.** Caeli says it was founded in 2021 in response to a U.S. Department of Defense need for a 12-hour rebreather. The strongest public deployment signal is a post by the U.S. Office of the Assistant Secretary of War for Special Operations and Low-Intensity Conflict stating that the SOF Enterprise was fielding the Combined Respirator Unit for Subterranean Operational Environments in October 2025. This verifies a publicly announced fielding plan; it does not disclose order value, unit quantities, contract structure, or whether all intended fielding was completed. Caeli also says CompactOxy was originally fielded by Israeli Navy special operations divers, and its company media discusses U.S. special-operations CBRN evaluation activity; those details are company-reported. Its industrial collaborator Laser Modeling Israel describes work with Caeli on the CRUSOE respirator, which is relevant evidence of local product engineering and manufacturing support. On intellectual property, a public Israeli patent record identifies Caeli Tech Ltd. and inventors Nir Bloch, Arie Kalo, and Izhak Rabinovitz on a closed-circuit rebreather heat-exchanger application; the family includes international filings and an Israeli B1 publication in 2026. Caeli separately states that five patent-pending innovations support the broader hybrid architecture. Public funding databases do not report a financing round or amount, so the company's capitalization, revenue, backlog, and cash runway remain unknown. No public certification record was located; Caeli's technology page says it is pursuing NIOSH and NFPA certifications for relevant models, so those should not be treated as achieved.

**Founders and team.** Caeli's public materials show an unusually mission-adjacent leadership group for a specialized safety-equipment company. Startup Nation Finder lists Uzi Barzilay as a founder and gives the founding year as 2021. The company's current team page identifies Daniel Stapleton as CEO, describing 30 years in security and aviation, previous security and international-affairs leadership at El Al, and prior command in an IDF special-forces unit. It identifies Arie Kalo as President and CTO, with experience in medical devices and security products, prior founding of Laser Modeling, co-founding of perimeter-sensor company Sabrafence Technologies, and former special-forces service. Chief Science Officer Nir Bloch is described as a former Israel Navy SEAL and mechanical engineer with more than 30 years developing rebreathing systems for the IDF. The company lists Uzi Barzilay as COO and SVP, with a former role leading countermeasures at Israel's Shin Bet, and Amit Afrik as Chief Customer Officer, with a Flotilla 13 team-lead background and underwater-systems development experience. The patent record independently corroborates technical participation by Bloch and Kalo. This experience maps closely to operator workflows and rebreather engineering, but public material does not establish current headcount, manufacturing scale, independent clinical or occupational-safety leadership, or the depth of its certification and quality-assurance staff.

**Competitive dynamics and potential edge.** Caeli competes in a mature, safety-critical market rather than a greenfield software category. Dräger and MSA Safety sell established self-contained breathing apparatus, PAPR, and hazardous-environment equipment; Avon Protection supplies military respiratory protection and CBRN products; Interspiro serves professional fire, rescue, and military users with breathing systems; and Ocean Technology Systems is an established specialist in military diving communications and life-support equipment. These companies have installed bases, service networks, qualification experience, and procurement familiarity that a smaller Israeli manufacturer must overcome. Caeli's proposed edge is a single operator-worn system that combines the low-gas-consumption advantage of closed-circuit operation with a filtered-air mode that can extend time on task, plus hot-swappable consumables, assisted breathing, cooling, and a product family spanning underground and underwater work. If its mode transitions and endurance claims hold under realistic workloads, the design could lower resupply frequency and simplify the equipment carried by specialist teams. A patent family around rebreather heat exchange and a team with operational and engineering backgrounds add evidence of focused product development. These are plausible advantages, not proof of a durable moat: the performance must be compared against incumbent systems at equivalent protection levels, and larger suppliers can adapt existing platforms or bundle support and training.

**Defense, security, and resilience relevance.** Dual-use is direct in the technology and the customer base. The core equipment is designed for both military missions and civilian emergency or industrial response, where the shared requirement is sustained breathing in air that is contaminated, oxygen-poor, hot, smoky, or unavailable. Military use spans subterranean reconnaissance, tunnel clearance, combat diving, and CBRN response; civilian transfer paths include firefighter entry into smoke-filled structures, urban search and rescue after collapse, hazardous-material response, confined-space maintenance, and rescue operations around damaged infrastructure. This is a life-safety technology with a credible resilience contribution: it can extend the safe operating window for a small team during a disaster or infrastructure incident and reduce the need to withdraw for short-duration air cylinders. The U.S. SOF office's fielding announcement provides concrete defense relevance rather than a speculative military adjacency. The record still does not establish certification for civilian fire-service use, adoption by named commercial industrial customers, the scale of deployed systems, or performance across all advertised environments. Export approvals, controlled technical data, consumable supply, cybersecurity of electronic monitoring, and after-sales service in allied markets are material strategic diligence topics.

**Stage, trajectory, and diligence risks.** Caeli fits a mid-stage operating profile better than a concept-stage startup because it has a named multi-product range, a public patent record, a reported Israeli Navy use case, and a publicly announced U.S. SOF fielding plan. That operating evidence is unusual for a small specialist company, but it is not a substitute for disclosed sales, production volume, certification, or independent test data. Its trajectory depends on converting specialist evaluations into funded orders, proving the 12-hour hybrid claim under high exertion and realistic contaminant loads, and building support and training capacity without eroding reliability. The main diligence risks are (1) life-critical hardware failure could cause severe injury and reputational damage; (2) published operating-time and protection claims are primarily company-stated and depend on workload, filter, ambient conditions, mode choice, and maintenance; (3) no public revenue, financing, backlog, or customer-concentration data makes commercial scale hard to assess; (4) NIOSH/NFPA certification is described as in progress rather than completed; (5) established suppliers can bundle certified equipment, consumables, service, and training; (6) government and special-operations procurement is slow, export-controlled, and potentially dependent on confidential programs; and (7) scaling specialized manufacturing, quality systems, field service, and replacement consumables may require substantially more capital than the public record shows. The next diligence milestones are independently witnessed endurance and safety results, certification status, disclosed production and repeat-order data, fielding confirmation with quantities where releasable, and evidence that non-defense responders can procure and maintain the systems.
"""
