name = "SolarGik"
description = "Israeli solar-infrastructure startup developing modular single-axis trackers, agrivoltaic structures, and the SOMA Pro software stack for monitoring, control, forecasting, and optimization of photovoltaic sites."
detailed_description = """
SolarGik designs and manufactures modular single-axis photovoltaic trackers and combines them with in-house control software. Its central hardware proposition is a short tracker table carrying roughly 6-24 modules, allowing more granular row geometry than conventional large tracker tables. The company says this enables layouts on irregular parcels and north-south slopes up to 30%, with less grading, steel, and cut-and-fill work than standard designs. Its portfolio is now presented around VersaTrack for ground-mount applications and AgriTrack for elevated agrivoltaic deployments, with structures that can reach about five meters. SolarGik also describes two-landscape configurations, a compact drive unit, local tracker controllers, and designs intended to reduce rear-side shading for bifacial modules. These are primarily company-reported engineering claims; independent site-level yield, civil-cost, and reliability data remain important diligence items.

The software layer is SOMA Pro, an on-premise site-control and SCADA platform that consolidates tracker, inverter, meter, camera, weather, storage, grid, and market data. SolarGik describes monitoring, alerts, manual overrides, automated controls, weather protection, forecasting, granular comparison of actual versus modeled performance, and failure or cleaning workflows. Its Agri-PV control concept uses crop, shading, and weather inputs to balance sunlight distribution against electricity production. In 2025 the company publicized SOMA Pro as an AI-enabled platform and introduced Sunnie as an AI assistant for solar-site operations. The commercial question is whether these features deliver repeatable yield, availability, or O&M improvements across heterogeneous fleets, rather than merely adding another interface to a tracker sale.

The initial customer and market context is utility-scale, distributed-generation, and agrivoltaic development. SolarGik is competing in a capital-intensive procurement environment where developers and asset owners compare levelized cost of energy, installation time, warranty support, bankability, service coverage, and long-term availability. Conventional trackers from Array Technologies, Nextracker, TrinaTracker, Arctech, and other established suppliers benefit from scale and financing credibility. SolarGik's more focused opportunity is difficult terrain, constrained land, and dual-use sites where a shorter and lighter tracker may reduce civil works or enable layouts that standard products cannot economically serve. Public evidence includes a SolarEdge collaboration on an agrivoltaic solution and a 2025 company announcement about 85 MW of new Italian projects, but the announcement is not independent proof of commissioned capacity, revenue, or project performance.

Commercialization appears to have progressed beyond a laboratory concept: the company identifies multiple products, publishes technical datasheets and case-study material, lists an international operating footprint, and has maintained a visible 2025-2026 product and media cadence. SolarGik reports a SolarEdge agrivoltaic solution, Italian deployment announcements totaling 85 MW, and company-page references to projects or clients; those signals do not independently establish commissioned capacity, revenue, or project-level performance. Its own site says it was founded in April 2021, has over 100 employees, and operates Israeli R&D and EPC functions alongside teams in the United States, Italy, India, and Brazil; LinkedIn supplies the less precise 51-200 range. Funding, ownership, backlog conversion, gross margins, installed operating capacity, warranty reserves, and customer concentration remain unconfirmed. Those unknowns matter because tracker businesses carry manufacturing, field-service, working-capital, warranty, and project-delay exposure even when the software is differentiated.

For national-security analysis, SolarGik is best treated as an energy-resilience adjacency rather than a defense supplier. A reliable tracker and plant-control layer could be useful at remote industrial facilities, islanded or weak-grid microgrids, emergency-power sites, and other critical infrastructure where maximizing renewable generation and maintaining local visibility have operational value. SOMA Pro's on-premise control positioning is more relevant to resilience than a cloud-only monitoring product, but public materials do not establish military deployments, defense procurement, cyber-secure operation in contested environments, or continued operation through communications or grid disruption. The dual-use case is therefore credible at the infrastructure layer but limited in demonstrated defense specificity. Diligence should focus on controller cybersecurity, offline and local-control behavior, interoperability with microgrid and storage controls, supply-chain resilience, software update practices, and the company's ability to support high-consequence sites with appropriate service and warranty obligations.
"""
