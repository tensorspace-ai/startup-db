name = "Lingacom"
description = "Lingacom is an Israeli deep-tech company that develops passive cosmic-ray muon imaging systems for cargo and vehicle inspection, underground surveying, mineral exploration, and civil-engineering applications. Its core proposition is to use naturally occurring muons to reveal dense or shielded materials and subsurface mass distribution without emitting radiation."
detailed_description = """Lingacom develops and fabricates muon-based detection systems, detectors, and imaging software. Its approach measures either the scattering of cosmic-ray muons through a cargo volume or the absorption of muons passing through ground. For security inspection, the company describes a combined workflow in which an X-ray system identifies dense regions and a secondary muon system reconstructs three-dimensional scattering density, helping distinguish a potentially threatening high-Z object from ordinary dense cargo. The public technical description identifies flat detector arrangements, sealed gaseous-amplification detectors, spectrometer elements, and proprietary reconstruction algorithms as important parts of the system. For underground work, borehole detectors measure directional muon flux to estimate integrated ground density and locate anomalies such as cavities, buried infrastructure, or geological boundaries.

The commercial market is specialized but concrete. Lingacom presents solutions for seaports, airports, border crossings, sensitive sites, civil construction, mining, mineral exploration, and geological surveying. Its IMPRINT product is described as a passive vehicle-scanning system intended to reduce the risk of unauthorized removal of nuclear or radioactive material from sensitive sites. The company also presents a combined radiographic and muon inspection concept for containers and vehicles, civil-engineering foundation or soil-density imaging, and mineral-mapping services using borehole sensors. These are distinct buying contexts: security customers care about detection probability, false alarms, throughput, integration, and evidentiary workflows, while mining and civil customers care about survey time, depth, resolution, deployment logistics, and the cost of drilling or excavation avoided.

The technology has a credible dual-use profile because the same sensing physics addresses both commercial subsurface imaging and security problems that are difficult for conventional systems. Muons are passive and highly penetrating, so they can complement radiation portal monitors and high-energy X-ray systems when shielding or dense cargo creates ambiguity. Lingacom’s peer-reviewed technical publication documents cargo-imaging simulations, joint X-ray/muon reconstruction, and borehole-ground-survey cases; it also describes a proprietary algorithm and detector designs intended for the relatively low natural muon flux encountered outside accelerator environments. This is meaningful technical evidence, but it is not by itself proof of production-scale accuracy, field throughput, or government deployment. The defense relevance is therefore strongest as a specialized detection and infrastructure-assessment capability, not as a general-purpose battlefield sensor.

Public commercialization signals include the company’s own product and request-for-quote pages, a reported European Horizon 2020 award for a CBRNE container-inspection project, and earlier reporting of a Horizon 2020 SME Instrument award for vehicle scanning. The site also publishes a customer testimonial from a civil-engineering firm concerning borehole coverage, although the customer is not named and the result is not independently quantified. A 2025 Israeli report described a secondary share purchase by Shviro Global Technologies; because the report says the transaction bought existing shares without diluting the company, it should not be treated as evidence of a new operating funding round or as proof of revenue scale. LinkedIn lists a small 2–10-person organization, consistent with a technically focused private company but also indicative of limited execution bandwidth.

Lingacom competes against established X-ray and radiation-monitoring vendors in security, geophysical and drilling-based survey methods in civil and mining markets, and other muography companies in emerging subsurface-imaging applications. Its edge is not that muons replace every incumbent modality: the more credible positioning is complementary inspection of dense or shielded volumes and passive measurement where active radiation, excavation, or conventional access is undesirable. The principal diligence questions are field data, detection and false-alarm performance, scan duration, total system cost, detector lifetime, manufacturing repeatability, software validation, reference customers, and the conversion of research or grant activity into repeatable paid deployments. The company’s long operating history and specialized IP are positives, but public evidence remains too limited to assume broad commercial scale."""
