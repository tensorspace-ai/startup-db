name = "Gong"
description = "Gong is a privately held B2B Revenue AI software company. Its platform captures customer conversations and connected CRM activity, then turns those signals into deal intelligence, seller coaching, forecasting, engagement, and governed AI workflows."
detailed_description = """Gong has expanded from conversation intelligence into a broader Revenue AI operating platform for sales, customer success, revenue operations, and enablement teams. The software captures calls, meetings, emails, and other customer-facing activity, transcribes and indexes conversations, and links those interactions to accounts, opportunities, and CRM records. Gong describes its Revenue Graph as the context layer that connects interactions and commercial outcomes; Engage, Forecast, Enable, Gong Assistant, and custom agents expose that information in seller and manager workflows. The June 2026 Revenue Harness announcement adds a governed execution layer for agents, including permission controls and human oversight. Gong's public product pages list integrations with Salesforce, Zoom, Microsoft Teams, Slack, Okta, and more than 300 integrations through its partner ecosystem.

This design addresses a persistent operating gap: CRM records are often incomplete and entered after the fact, while frontline conversations contain objections, intent, stakeholder changes, product feedback, next steps, and evidence about why deals move or stall. Gong's value depends on collecting that evidence across channels, linking it to the right business entities, and converting it into a repeatable action such as coaching, a forecast change, a follow-up, or an escalation. That is a deeper workflow proposition than meeting transcription alone. It also makes deployment more demanding: recordings, CRM mappings, permission models, retention settings, and change management all affect whether the resulting intelligence is trustworthy and adopted.

Scale is material, although most operating metrics are company or executive statements rather than audited results. Gong's May 2026 release says ARR exceeded $500 million, quarterly year-over-year growth was above 55%, the company served more than 5,000 businesses, and half of its customers used multiple products. The release also says half of the Fortune 10 were customers and cites customer-reported outcomes for Anthropic, Uber for Business, Canva, and Paycor. Those are useful demand and cross-sell signals, not independent measurements of retention, gross margin, or causal return. Globes reported around 1,700 employees in May 2026, including roughly 500 in Israel. Gong remains private, and its public information does not disclose accounting revenue, profitability, cash, burn, or runway.

The product's defensibility is strongest in accumulated interaction context and workflow penetration. A mature customer's call, email, CRM, and outcome history can support company-specific topic discovery, coaching patterns, and pipeline alerts that are difficult to recreate from generic prompts alone. Gong has also acquired ONDiGO, Vayo, and RightBound to add adjacent sales intelligence, cross-platform data analysis, and account/contact data capabilities. The company documents at least one issued U.S. patent on unsupervised topic detection and conversation segmentation, plus a later U.S. patent on extracting ordered conversation structure. Those patents support specific technical claims; they do not establish that all product value is protected or that competitors cannot achieve similar outcomes with other methods.

Competition now spans standalone revenue workflow suites and products bundled into CRM and collaboration platforms. Clari and Salesloft completed a merger in December 2025 and now operate under Salesloft's brand, combining forecasting, conversation intelligence, sales execution, and AI agents. Salesforce offers Einstein Conversation Insights and Revenue Intelligence inside Sales Cloud, while Zoom sells Revenue Accelerator across meetings, phone, conversation analytics, coaching, and pipeline workflows. Outreach also positions an agentic platform across engagement, retention, coaching, and revenue intelligence. Gong's cross-channel interaction graph and mature installed base may help it win platform consolidation, but suite vendors can bundle adjacent features and already own important workflow surfaces. Buyers will compare accuracy, adoption, integrations, governance, price, and measurable forecast or productivity impact rather than the AI label alone.

The company has substantial Israeli roots in its corporate structure and operating footprint while identifying San Francisco as its commercial headquarters. Gong's privacy policy names Gong.io Ltd. as the parent headquartered in Israel and Gong.io Inc. as its U.S. subsidiary. Its current About page lists a Tel Aviv office at the ICON Tower in Ramat Gan, and Israeli reporting describes a large local engineering and product organization. This is a significant Israeli enterprise software scale-up, but that fact should not be confused with a defense product. Public evidence reviewed here does not establish defense contracts, intelligence work, mission-system integration, or security operations deployments."""
