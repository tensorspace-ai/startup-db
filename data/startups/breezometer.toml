name = 'BreezoMeter'
description = "BreezoMeter was a Haifa-founded environmental intelligence startup whose air-quality, pollen and wildfire data products served consumer and enterprise use cases. Google acquired the company in 2022; Google later launched environmental APIs using similar multi-source data and machine-learning methods."
detailed_description = """BreezoMeter was an Israeli environmental intelligence company founded in 2014 and based in Haifa. It built services that reported location-specific air quality, pollen, pollutants, and wildfire information. The 2018 company announcement described location-based, real-time air-quality data delivered through business APIs and identified partnerships across smart-home, medical, automotive, and lifestyle sectors. Its approach combined data from monitoring networks and other environmental sources with computation to provide local estimates where fixed monitoring stations were sparse. Public material supports the existence of these products and business relationships; it does not establish independent performance against every alternative or prove uniform accuracy at street level in all regions.

The team emerged from a Technion startup competition. In 2018 the company identified Ran Korber as CEO, Ziv Lautman as CMO, and Emil Fisher as CTO, all Technion graduates. A later interview with co-founder Revital Hendler describes her role as a founder and chairwoman in the early period, followed by her departure in 2015. Historical reports include her among BreezoMeter's co-founders, even though many contemporary profiles focused on Korber, Fisher, and Lautman. These sources provide a useful founding and leadership chronology but do not establish who currently works on the products within Google. Current staff counts and independent operations are unknown.

BreezoMeter raised multiple disclosed rounds. Its September 2018 Series B announcement reported $7.75 million and a $12.5 million cumulative investment total at that point. Historical Startup Nation Central records list earlier Seed and Series A rounds and a later non-equity Horizon 2020 award. The June 2021 Series C was reported at $30 million, led by Fortissimo Capital, with Entrée Capital and other prior investors participating. In September 2022 CTech reported that BreezoMeter had been acquired by Google and stated a $45 million company-attributed cumulative funding total. That figure conflicts with other databases reporting $42.5 million; the available public record does not reconcile the difference. Google's purchase consideration was not disclosed. Calcalist/CTech estimated $200–250 million, while Globes later reported $225 million. These are press estimates and are not treated as verified transaction terms.

The commercial case was built around making environmental information usable by services that did not operate their own monitoring networks. In 2021 L'Oréal announced a multi-year research and technology partnership with BreezoMeter to explore environmental exposure and skin. In 2022 CTech reported that companies including AstraZeneca, Bosch, Dyson, Verizon Media, and L'Oréal used its APIs or data in consumer-facing experiences. These named relationships indicate distribution and product integration, but the sources do not disclose contract values, recurring revenue, customer concentration, or whether each relationship was a paid production deployment. They should not be converted into financial traction claims.

Google's public product announcements provide evidence of adjacent post-acquisition activity. In August 2023 Google announced Air Quality and Pollen APIs within Google Maps Platform. Google described an air-quality process drawing on government stations, meteorological data, sensors, satellites, and traffic information, with machine learning used to estimate pollutants; the announcement described coverage of more than 100 countries. Google did not identify BreezoMeter as the API's sole or direct source, nor publish a detailed acquisition integration account. It is therefore reasonable to say that Google expanded environmental products after acquiring BreezoMeter, but a precise lineage from specific BreezoMeter algorithms, datasets, employees, or patents remains unverified.

The platform's technical and commercial strengths were data integration, modeling, broad geographic coverage, and an API delivery model. A distributed modeling service can complement point sensors by estimating conditions between stations. This can help health, mobility, and consumer applications surface environmental context without installing their own equipment. The key diligence issue is measurement validity: accuracy can vary with source density, pollutant type, geography, time horizon, and local atmospheric conditions. A map display or estimate is not itself a regulatory measurement or a substitute for a reference-grade instrument. Publicly available sources reviewed here do not provide sufficiently detailed independent error metrics to quantify performance across customer-critical regions.

The competitive field includes government monitoring networks, sensor operators such as PurpleAir, consumer air-quality services such as IQAir/AirVisual, weather providers, and mapping-platform products. These alternatives differ in sensor ownership, geographic resolution, measurement versus modeled estimates, update frequency, and distribution. Google is now both the acquirer and operator of an adjacent mapping/API offer, which makes the historic standalone competitive comparison less useful for current buyers. Public evidence does not establish BreezoMeter's market share, current product packaging, or independent service availability after acquisition.

There is no supported defense thesis in the reviewed record. Environmental awareness could be relevant to emergency management, public health, and operational planning in a broad sense, but the sources reviewed document civilian consumer and enterprise applications. They do not document military customers, chemical or biological agent detection, CBRN plume forecasting, defense contracts, security certifications, or operational validation. Air-quality estimation should not be presented as detection of hazardous agents: estimating common pollutants from environmental data and identifying a specific chemical or biological threat are different capabilities. Any potential security application would require a separate evidence base, technical validation, and customer diligence.

As an investment case, BreezoMeter is a retrospective example of a data-intensive Israeli startup reaching a strategic technology acquisition. It is not an investible independent company today on the available evidence. The most material open questions concern the post-acquisition product and team footprint, current API lineage and availability, the quality and licensing of underlying data, the revenue and customer base before acquisition, intellectual-property ownership, and the true transaction economics. Its acquisition demonstrates strategic interest in environmental information, while the public record does not justify conclusions about purchase price, current financial performance, or defense applicability."""
