strategic_value = "Caja adds a software-first goods-to-person capability to Fives' wider intralogistics offering. Its value lies in combining flexible robots and dense storage with conveyors, packaging, shuttles, integration, and global deployment resources. For strategic readers, the important questions are whether Caja's WCS remains differentiated inside Fives, how reliably it scales across brownfield sites, and whether the combined portfolio can reduce customer infrastructure changes and total cost of ownership. The same control and material-flow capabilities could support resilient commercial, medical, or defense logistics, but no public defense program is established."

