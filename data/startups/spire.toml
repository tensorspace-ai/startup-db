dual_use_description = "Spire's core technology directly supports dual-use national security missions. Real-time AIS harvesting enables maritime domain awareness and vessel tracking without dependence on GPS or cooperative vessel reporting; non-cooperative ADS-B collection from high-altitude orbits provides aviation surveillance over regions lacking ground radar; RF signal detection and geolocalization support signals intelligence (SIGINT) and communications intelligence (COMINT) operations. These capabilities have clear, substantive applicability to naval operations, air defense, counter-terrorism, and intelligence collection. The company serves or markets services to sovereign intelligence agencies and military customers, with publicly acknowledged government contracts accounting for a material fraction of revenue. The dual-use pathway is direct: commercial real-time data infrastructure can directly support allied defense missions without requiring modification or special authorization."
