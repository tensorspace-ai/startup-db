stage_rationale = "Spire is a mature, publicly traded company (NYSE: SPIR) with an operational multi-satellite constellation, recurring revenue from diverse commercial and government customers, and established supply chain and operations. The company is past technology risk (constellation is proven in orbit), moving through commercialization and profitability optimization phases. Revenue is recurring but subject to government budget cycles and commercial pricing pressure. The company is investing heavily in constellation replenishment, RF payload upgrades, and geographic expansion. Key remaining risks are operational (launch delays, constellation maintenance costs) and commercial (government budget uncertainty, competitive pricing pressure) rather than technical or market viability."
