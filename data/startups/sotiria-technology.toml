name = "SOTIRIA Technology"
description = "SOTIRIA Technology is a Greece-based deep-tech company developing underwater sensing hardware and AI software for maritime security and subsea infrastructure protection. Its portfolio combines magnetic and passive acoustic sensors with a data-fusion and intelligence layer, and it has demonstrated deployed configurations with the Portuguese Navy under NATO DIANA support."
detailed_description = """
**Product and the concrete problem it solves.** SOTIRIA Technology works on the persistent monitoring gap below the waterline. Ports, naval facilities, offshore energy assets, undersea communications cables, and maritime chokepoints are difficult to monitor continuously: optical sensors have little reach in dark or turbid water, active sonar can disclose the sensor's presence, and conventional patrols or diver inspections are episodic and costly. SOTIRIA's stated approach is to combine passive sensing modalities and software into deployable underwater intelligence nodes that detect, visualize, classify, and help operators assess anomalous activity. Its Nereid product is described as an underwater intelligence, surveillance, and reconnaissance system for maritime borders, national-security assets, and straits. The underlying proposition is a distributed sensor and analytics layer that can extend awareness around subsea assets and give naval, government, and infrastructure operators a more continuous picture than periodic inspection alone. Public sources support the product category and use intent; they do not establish detection range, probability of detection, false-alarm rate, or continuous unattended service life.

**Core technology and how it works.** The company lists four connected components: Type S, a fluxgate magnetic sensor; Type A, a passive hydrophone; Dioptre, an AI-powered software platform; and Nereid, the integrated underwater ISR system. The NATO DIANA cohort profile describes SOTIRIA's Encephalon proposal as a passive, autonomous, redeployable surveillance system that fuses acoustic, magnetic, and above-surface sensor inputs to augment incursion detection. This indicates a system architecture built around complementary measurements rather than a single sonar channel. Magnetic sensing can expose the passage of ferromagnetic objects, while passive acoustics can contribute signatures of underwater activity; the precise signal-processing, calibration, sensor specifications, AI models, and classification workflow remain undisclosed. During the 2024 REPMUS exercise, the company reported testing a 100-meter cabled node combining its 3D magnetometer, hydrophone, and software, plus a cable-free autonomous node with a Type S sensor deployed at more than 130 meters. That is concrete evidence of integration and at-sea experimentation, though the demonstration does not independently establish operational detection performance.

**Portfolio and deployment concept.** SOTIRIA's product descriptions suggest a layered deployment model. Type S and Type A provide sensing inputs; Dioptre is presented as the software backbone for ingesting and analyzing those inputs; and Nereid packages sensing and software into a deployable protection or ISR system. Its public material emphasizes multi-technology data ingestion, visualization, classification, and decision support, and describes Nereid as scalable across national maritime borders, protected assets, and straits. The REPMUS demonstration provides two distinct deployment patterns: a fixed cabled node with an underwater connection to shore or a host platform, and a cableless autonomous node suited to locations where cabling is impractical. The NATO snapshot calls Encephalon passive, autonomous, and redeployable, while the company has also reported installing Nereid at a partner location for continuous activity monitoring and data collection. It does not disclose battery endurance, communications protocols, acoustic or magnetic coverage footprints, maintenance intervals, sensor-placement density, or how systems are recovered and recharged; these are central practical questions for any persistent network.

**Market, customers, and go-to-market.** The addressable buyers are defense ministries and navies, coast guards, port operators, offshore energy owners, and managers of subsea infrastructure. Procurement is institutionally concentrated: a small number of naval and infrastructure organizations control high-value programs, but qualification and purchasing cycles can be long and country-specific. Managing Director Angelos Tsereklas told Euronews that those contracting cycles are a challenge for early-stage defense companies, a candid signal about time-to-revenue risk. SOTIRIA's route to market appears to pair direct engagement with allied end users and participation in multinational defense programs. It has demonstrated with the Portuguese Navy at REPMUS, is named as a partner in the European Defence Fund's SEACURE consortium, and lists allied navies and civil infrastructure operators as target users. The company's website describes industrial and governmental partners, but public sources do not name recurring paying customers or disclose contract values. A likely commercial path is initial trials and integration projects followed by platform or site-level procurement; repeatability depends on integrating with existing command systems, approved underwater vehicles, and national security procedures.

**Traction, funding, and third-party validation.** The strongest outside validation is programmatic rather than revenue-based. NATO DIANA selected SOTIRIA for its 2024 cohort under sensing and surveillance; NATO's official cohort list verifies the selection, while the DIANA technical snapshot reports a Technology Readiness Level of 5 and identifies Encephalon as its proposal. Dealroom records a €100,000 DIANA grant in November 2023, but no public equity round or larger funding total was confirmed in the sources reviewed. The European Commission lists SOTIRIA's Greek legal entity in the 45-month SEACURE project, a funded consortium intended to develop and demonstrate an integrated unmanned system for anti-submarine and seabed warfare and protection of critical maritime infrastructure. Company material says Nereid was installed at a partner site for ongoing monitoring, and its REPMUS24 write-up gives specific deployed configurations and depth. The company has also reported a U.S. Army xTech Phase I prize for a magnetometer design and a U.S. Navy competition shortlist; these are self-reported in a company update and should be verified independently before treating them as procurement traction. The public record contains no disclosed revenue, order backlog, private valuation, patent portfolio, or independently published system test results.

**Founders and team.** The NATO DIANA technical snapshot names co-founder and managing director Angelos Tsereklas Zafeirakis, electronics engineer Georgia Stamou, materials engineer Panagiotis Priftis, AI and data-processing engineer Leda Tzannetou, and retired senior Hellenic Armed Forces officer Ioannis Anastasakis. It characterizes the team as combining embedded software, sensor materials, and AI/data processing, a useful mix for turning raw subsea measurements into an operationally interpretable alert. Euronews and eKathimerini identify Tsereklas as the company's managing director and describe his experience navigating national defense procurement and allied programs. The company reports Greek headquarters and membership in the Hellenic Aerospace Security and Defense Industries Group. An industry association profile gives a seven-person headcount and lists ISO 9001:2015, NATO DIANA, the European Defence Fund, and Portuguese Navy REPMUS sponsorship; that directory figure is a dated snapshot rather than verified current headcount. Public sources do not provide a complete current leadership roster, detailed prior operating records for each founder, or the ownership and licensing arrangements for any university-derived intellectual property.

**Competitive dynamics and potential edge.** SOTIRIA operates in a market with formidable defense primes and specialist subsea vendors. Kongsberg Discovery and Saab bring established sonar, underwater vehicle, and naval integration capabilities; Teledyne Marine supplies a broad set of subsea sensors and vehicles; DSIT Solutions develops underwater security and sonar systems; and WSense offers underwater communications and monitoring networks. SOTIRIA's stated distinction is a passive, multi-modal sensing stack that combines magnetic, acoustic, and above-surface data with an AI software layer, alongside compact cabled and autonomous deployment concepts. If the integration works reliably, this could offer a flexible sensor node for installations where active sonar is undesirable or where existing infrastructure needs another detection layer. Its involvement in SEACURE places the company within a consortium led by Thales and involving major European naval and subsea companies, which can provide requirements access and integration opportunities. But partnership is not proof of a sole-source position or product adoption. The edge remains contingent on measurable performance, a repeatable installation and sustainment model, and evidence that the software reduces false alarms and operator workload relative to established sonar and security suites.

**Strategic relevance, stage, and diligence risks.** SOTIRIA is a Greek company and is included here as an allied strategic reference, not as an Israeli startup. Its core sensing technology has direct defense and civilian-infrastructure relevance: naval and border surveillance share the need to detect underwater activity with ports, offshore wind and energy facilities, and cable or pipeline operators seeking to monitor intrusion or change. The dual-use case is therefore inherent to the sensing and monitoring platform, though public commercialization evidence is stronger on defense programs than on named civil customers. The company is early-stage: it was founded in 2021, has a DIANA-reported TRL 5 proposal, has conducted at-sea demonstrations, and has no publicly disclosed equity round, recurring revenue, or production-scale deployment. Key diligence priorities are (1) independent detection and classification performance across cluttered littoral environments; (2) false-positive rates and robustness to biological noise, weather, currents, and seabed variation; (3) node endurance, recovery, maintenance, and secure communications; (4) software interoperability and cyber accreditation; (5) repeat business and procurement conversion from demonstrations and consortium work; (6) supply-chain and export-control exposure for sensors and defense software; and (7) cash runway and ownership of intellectual property. These unknowns cap the score despite unusually relevant allied programs and credible field demonstrations.
"""
