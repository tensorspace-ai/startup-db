dual_use_description = "Agentic access management is a core dual-use infrastructure. Commercial enterprises adopt AI agents rapidly; defense organizations and high-assurance operators (signals intelligence, military IT, critical infrastructure security) must do the same while maintaining absolute control over which identities can access mission systems. Credential compromise and unauthorized agent deployment are top breach vectors in cloud-native operations; NHI governance is foundational to defensibility. Allied cyber defense initiatives explicitly require identity governance layers to reduce exfiltration and lateral-movement pathways. Oasis's platform capabilities—multi-cloud identity discovery, privilege analysis, automated policy enforcement, anomaly detection on credential use, and rapid remediation—directly serve both offensive and defensive security operations. The ability to detect and isolate a rogue agent or service credential before it causes damage is equally valuable to a defense contractor, a government IT operation, and a commercial SaaS provider."
