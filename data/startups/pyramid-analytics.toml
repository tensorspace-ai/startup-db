dual_use_description = "Governed analytics and decision intelligence platforms are inherently dual-use: enterprise analytics infrastructure for commercial decision-making and national security analytics for intelligence, military planning, and policy analysis. Pyramid's platform capabilities—semantic governance, analytics automation, audit trails, and policy enforcement—are particularly relevant to defense and intelligence contexts where analytic provenance and operational security compliance are non-negotiable. Military intelligence, strategic planning, and defense logistics all depend on reliable, traceable analytics infrastructure. While Pyramid does not appear to have secured defense contracts or military customers as of the current record, the platform's core strengths in governed analytics and decision workflow orchestration are directly applicable to defense environments. The dual-use relevance is not speculative—it is functional. However, the company does not market to defense customers and defense traction is not evident in public sources, limiting current dual-use materiality."
