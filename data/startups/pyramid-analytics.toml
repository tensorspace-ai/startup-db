stage_rationale = 'Pyramid Analytics is in the mid-stage of company and market maturity. Founded in 2009, the company has 15+ years of product iteration, established enterprise customer base, and global go-to-market operations. It is past early-stage technology risk and product-market fit validation. However, it is not mature or exit-ready in the sense of a late-stage growth company approaching IPO or acquisition. The company operates in a mature, competitive market (enterprise analytics) without clear structural advantages or network effects that would signal accelerating growth or margin expansion. Growth-stage funding supports scaling of sales and geographic expansion, not technology breakthroughs. This is a "steady-state" private company—profitable or cash-flow-positive operations with measured growth, stable customer base, and incremental product improvement. For dual-use and defense-adjacent analytics, Pyramid is mid-stage because it has proven the technology and market category but has not yet penetrated defense or national security segments where the strategic value would be highest.'
