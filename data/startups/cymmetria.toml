name = "Cymmetria"

description = "Cymmetria was an Israeli-founded enterprise cyber-deception vendor whose MazeRunner and ActiveSOC products used decoy systems, credentials, and breadcrumbs to expose attacker movement. Stage Fund announced its acquisition in September 2019; Israeli operations were shut down later that year, and the present ownership and support status of the products remain unverified."

detailed_description = """Cymmetria Security’s historical operating company, Cymmetria Inc., built enterprise cyber-deception products around a simple proposition: an alert from an asset that should not receive legitimate traffic can be a stronger signal than a statistical anomaly buried in a queue. Founded in 2014, the company developed MazeRunner and ActiveSOC and described deception-as-a-service for tailored deployments. Public product descriptions refer to realistic virtual machines and decoy servers, seeded credentials and data, communication breadcrumbs, attacker-interaction telemetry, forensic analysis, and response actions integrated with a customer’s existing security stack. These are historical product claims, not evidence that a supported product is available today.

The technical thesis was to give defenders a controlled environment that shapes what an intruder sees after compromise. A believable decoy can draw lateral movement away from real systems and reveal the operator’s tools and intent when touched. That produces a potentially high-confidence event, but only if asset emulation remains convincing, decoy traffic is separated from production, planted credentials cannot grant real access, and responders can interpret the collected activity. The engineering burden therefore extends beyond creating a honeypot: a deployable system needs orchestration across heterogeneous networks, context-specific decoy content, forensic capture, safe integrations, and ongoing maintenance as the protected estate changes. A patent application on detecting use of injected deception traffic and a PCT application on supply-chain cyber-deception show areas the inventors pursued, but both public records display inactive legal statuses and do not establish surviving or enforceable rights.

The original commercial buyer was an enterprise security operations or incident-response team seeking earlier evidence of post-compromise movement, insider misuse, or reconnaissance. In a 2016 Forbes Israel interview, co-founder Dean Sysman described a California financial-services company as the first paying customer and said customers were in Europe and the United States; the customers were not named. The article also reported that a government agency used the service, again without naming the agency or disclosing contract terms. Treat these as company-attributed historical traction, not independently verified contracts, deployment counts, renewals, or proof of a military deployment. Forbes reported roughly 25 employees in 2016, mostly in Israel. In September 2019 Stage Fund said it would invest in the business, retain Tel Aviv R&D, and base sales and marketing in Denver. By December, Calcalist reported that Stage Fund had shut down the local operation and ordered the dismissal of Israeli staff; employees then petitioned for liquidation over alleged unpaid wages. The filing is not evidence of the outcome of that petition or the legal status of the US company.

The historical competitive field included specialist deception providers and larger security platforms that could bundle identity, endpoint, network, and response capabilities. Current products from Acalvio and CounterCraft overlap in realistic decoys, attacker engagement, and intelligence from interactions. Acalvio now presents a broader platform spanning identity, cloud, IT, and OT; CounterCraft emphasizes digital-twin environments and threat-intelligence enrichment, and the US Defense Innovation Unit records a 2021 prototype followed by a production Other Transaction agreement for CounterCraft. SentinelOne completed its acquisition of Attivo Networks in 2022 and offers network deception through Hologram as part of its XDR portfolio. Proofpoint completed its acquisition of Illusive in 2022, adding identity-threat capabilities. These product pages establish current competitive positioning, not a like-for-like feature benchmark. Cymmetria’s historical distinction was its combination of automated decoy orchestration, breadcrumbs, forensic context, and response workflow; no current product demonstration or customer comparison was found to show that it still has a differentiated position.

The founding team combined security operations, product, and engineering experience. Gadi Evron led the company as CEO; Dean Sysman was reported as CTO; and Ran Harel as VP Product in 2015. Later Israeli coverage describes Imri Goldberg and Irene Abezgauz as founders, while Forbes Israel says they joined the original founders, so their founding attribution is not uniform across sources. Stage Fund’s 2019 release named Daniel Frydenlund as chairman and said Dekel Braunstein would continue to provide technology leadership. None of these announcements verifies a continuing team after the local shutdown. The transaction’s exact consideration was not published by Stage Fund; a contemporaneous Calcalist source, citing an anonymous person, characterized the deal value only as “a few tens of millions of dollars.” No price is entered. The same coverage quoted a PitchBook-derived $11 million cumulative-funding figure, while other profile databases show different aggregates. No company-announced lifetime total was located, and the Series A amount itself has a $9 million versus $9.16 million discrepancy between contemporaneous reporting and a later database profile.

Cymmetria therefore remains relevant as a historical Israeli cyber-deception capability and acquisition case, not as a verified active startup. The technology has commercial security utility and could be relevant to government or defense network protection because the same decoys can expose lateral movement in sensitive environments. Public evidence supports one unnamed government-service claim from 2016, but does not establish a defense contract, government procurement notice, certification, classified deployment, or surviving product. Any renewed diligence should first resolve legal entity status, ownership of code and patent families, product availability, integration maintenance, employee and customer continuity, and the court outcome of the Israeli employees’ petition. Until those questions are answered, current investability and deployable strategic value should be treated as low-confidence."""

