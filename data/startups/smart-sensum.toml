name = "Smart Sensum"
description = "Smart Sensum is an Israeli deep-tech company building compact millimeter-wave radar and programmable metamaterial/metasurface antennas that replace conventional RF electronics with engineered electromagnetic structures, enabling smaller, lower-power, beam-steering sensing and communication for drones, robotics, mobility, and defense."
detailed_description = """
**Product and the concrete problem it solves.** Smart Sensum is an Israeli deep-tech company that attacks a stubborn, physical bottleneck in modern electronics: the antenna and the radio front-end. As autonomous drones, robots, vehicles, and connected sensors proliferate, each platform needs radar and wireless links that are simultaneously small, low-power, and electronically steerable — yet conventional radio-frequency (RF) hardware forces a hard trade-off between aperture size, beam agility, and power consumption. Bulky phased-array radars and multi-element antenna modules with discrete phase shifters are expensive, power-hungry, and heavy, while cheap fixed antennas cannot steer a beam or reject interference. Smart Sensum's answer is to "replace traditional RF electronics with engineered electromagnetic structures" — metamaterials and metasurfaces — so that the sensing and beam-forming intelligence is baked into the aperture itself. The company describes itself as "a deep-tech company developing advanced wireless technologies driven by electromagnetics, metamaterials and metasurface design," and pitches compact millimeter-wave (mmWave) radar systems and programmable antennas that "enhance sensing accuracy while reducing size, complexity and power consumption." For an integrator building a small UAV, an industrial robot, or a vehicle, the promise is radar and connectivity with the agility of a phased array but a fraction of the size, cost, and power budget.

**Core technology and how it actually works.** The technical core is the metasurface — described by the company as "electrically thin implementations of metamaterials, where the electromagnetic response is controlled using a single layer or a small number of stacked layers." Instead of building a beam-steering array out of many active transmit/receive channels each with its own phase shifter and power amplifier, a metasurface is a patterned, sub-wavelength structure whose reflection, transmission, and phase profile can be engineered — and, in the programmable variant, dynamically reconfigured — to shape and steer an electromagnetic beam. Smart Sensum's disclosed portfolio spans (1) compact mmWave radar systems at 60 GHz and 79 GHz, the bands used for short-range automotive and industrial sensing; (2) beam-steering antenna arrays that redirect energy without conventional bulky RF beamforming chains; (3) programmable metasurfaces and "smart surfaces"; and (4) smart wireless communication modules (Wi-Fi, BLE) with adaptive antennas, plus passive antennas and radomes. The underlying discipline is heavy electromagnetic simulation and antenna co-design — full-wave modeling of scattering, metamaterial unit cells, and aperture behavior — coupled to hardware, signal processing, and AI. This is a materials-and-physics moat rather than a pure-software one: the value lives in the ability to design manufacturable metasurface structures that hit a target radiation pattern at millimeter-wave frequencies, an area with a small pool of genuinely expert practitioners.

**Market, customers, and go-to-market.** Smart Sensum names a broad application set: automotive and mobility, drones and UAVs, robotics, industrial IoT and sensing, telecommunications, and defense. The commercial pull is real — automotive 60/79 GHz radar, robot perception, and industrial presence sensing are large and growing markets, and the "Next G"/5G-and-beyond world is actively exploring reconfigurable intelligent surfaces (RIS) and smart antennas to extend coverage and beam energy around obstacles. The company presented at CES 2026 in Las Vegas, where it was highlighted among Israeli companies to watch and categorized across Drones, IoT/Sensors, Next G, Startups, and Vehicle Tech & Advanced Mobility — a debut posture consistent with a component/IP supplier seeking design-ins and partners rather than a finished-product vendor. Go-to-market for a metamaterial-antenna company typically runs through reference designs, evaluation modules, and licensing or co-development deals with OEMs and tier-one integrators; the exact channel, pricing, and any signed customers are not disclosed publicly and should be verified directly. The realistic near-term wedge is compact, low-SWaP radar and adaptive-antenna modules for drones, robots, and mobility, with the smart-surface/RIS telecom work as a longer horizon.

**Traction, funding, and third-party validation.** Public financial detail is thin, and this should be stated plainly: Smart Sensum's funding rounds, amounts, investors, revenue, and headcount are not disclosed in the sources reviewed, and any specific figure should be treated as unconfirmed. What is verifiable is the company's existence and positioning as a real Israeli deep-tech entity — it maintains a substantive technical website, is listed on IVC-Online (a primary Israeli tech-ecosystem database) and LinkedIn, and appeared as a registered CES 2026 exhibitor with independent trade-press coverage describing its metamaterial radar and antenna focus. The strongest external validation is therefore the founder's credentials and the coherence of the technical story rather than a marquee funding round or named marquee customer. For a diligence read, that places Smart Sensum firmly in the early, technology-validation phase: credible physics and a credentialed founder, but limited third-party market proof so far.

**Founders and team background.** The company is led by founder and CEO **Vladimir Vulfin**, an electromagnetics and antenna specialist with, by the company's account, over 16-18 years in RF and antenna research and engineering and 50-60+ authored or co-authored journal and conference papers. He holds an M.Sc. in Electrical and Computer Engineering with an electromagnetics specialization from Ben-Gurion University and pursued Ph.D. studies under Prof. Reuven Shavit, a well-known Israeli antenna and metamaterials academic. Vulfin's prior roles include electromagnetic engineer at Ansys (the leading simulation-software company) and years as a microwave and antenna engineer at a state-owned company, alongside 15+ years lecturing and supervising 120+ engineering capstone projects. Importantly, since 2015 he has run **Electromagnetics Infinity (EM Infinity)**, a separate firm specializing in electromagnetic simulation, antenna design, and measurement services and an Ansys certified channel partner — which gives Smart Sensum an unusually deep in-house EM-design and measurement backbone for its size. The documented team beyond the founder is described only generically (experts in electromagnetics, antennas, RF, metamaterials, plus hardware, software, algorithms, signal processing, AI, and mechanics); named co-founders, senior hires, and headcount are not public, which is a key-person concentration risk to weigh.

**Competitive dynamics.** Smart Sensum sits in a globally contested field where metamaterial-antenna companies have a mixed track record. (1) In automotive/analog beamforming radar it overlaps with **Metawave** (US metamaterial radar). (2) In electronically-scanned metamaterial radar for defense and counter-UAS, **Echodyne** is the most credentialed peer. (3) In smart-antenna/RIS for telecom it competes with **Pivotal Commware** (holographic beamforming) and **Greenerwave** (reconfigurable metasurfaces). (4) In flat-panel metamaterial SATCOM apertures, **Kymeta** is the reference name. (5) In defense radar and electronic-warfare apertures it faces incumbent primes such as **Elbit Systems** and **Israel Aerospace Industries**, plus the broad silicon-beamforming AESA approach (Anokiwave/Qorvo-class beamformer ICs). Smart Sensum's plausible edges are: (i) a genuine, physics-deep design-and-measurement capability rooted in the founder's EM-simulation firm; (ii) a low-SWaP, low-cost angle aimed at drones/robots/mobility where full AESAs are overkill; and (iii) Israeli defense-adjacency and a domestic customer base for sensing and EW. The countervailing reality is that metamaterial antennas have repeatedly proven hard to commercialize at scale, and better-capitalized peers with fielded products set a high bar.

**Defense, security, and resilience dual-use relevance.** The dual-use case is credible but should be framed as adjacency backed by directly transferable technology rather than a fielded military capability. Low-SWaP mmWave radar and beam-steering antennas map cleanly onto several defense needs: compact radar and RF sensing on small drones and ground robots; short-range surveillance and counter-UAS detection; and, most strategically, adaptive and reconfigurable antenna apertures relevant to electronic warfare, resilient tactical communications, and beam-steered SATCOM in contested or jammed environments. Programmable metasurfaces/RIS are an active area of military interest precisely because they can shape, redirect, and null RF energy — useful for interference rejection, low-probability-of-intercept links, and resilient connectivity. The honest calibration: Smart Sensum names defense among its markets and its core technology is genuinely dual-use, but there is no public evidence of fielded defense products, contracts, or qualifications, so its strategic weight today is potential rather than proven, and would rise sharply with a defense design-in or a named prime partner.

**Growth stage, trajectory, and key diligence risks.** Smart Sensum reads as an **early-stage** deep-tech component/IP company: credible core technology, a highly credentialed founder with an established EM-engineering firm behind him, a CES 2026 debut, but little public evidence of funding, customers, or production scale. The trajectory to watch runs from demonstrable modules and reference designs toward paying design-ins with drone, robotics, mobility, or defense integrators. The principal diligence risks are, in order: (1) **commercialization risk** — metamaterial antennas are notoriously hard to move from lab performance to manufacturable, yield-stable products; (2) **capital and scale opacity** — no disclosed funding, revenue, or headcount, limiting independent verification; (3) **key-person concentration** — the public story centers almost entirely on the founder, and the depth of the broader team is unverified; (4) **competitive intensity** from better-funded global peers with fielded products and from incumbent AESA/silicon-beamforming approaches; and (5) **dual-use maturity** — defense relevance is real in principle but undemonstrated in fielded systems. Progression would be evidenced by a disclosed funding round, named OEM or defense customers, published radar/antenna performance benchmarks, and volume-manufacturing partnerships.
