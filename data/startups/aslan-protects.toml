name = "Aslan Protects"
description = "Aslan Protects is a Washington, D.C.-based national-security startup building human-supervised AI agents that can operate inside online spaces used by criminal and foreign adversary networks, extending investigators' reach across forums, messaging channels, and other digital terrain. Its September 2026 public launch followed a $20.8 million Seed announcement and described early investigative work involving cross-border smuggling, cyber-fraud, and technology-transfer networks."
detailed_description = """
**Product and the concrete problem it solves.** Aslan Protects is trying to address a capacity mismatch in digital investigations: adversaries can create accounts, move between platforms, coordinate across borders, and replace disrupted channels faster than human investigators can build a presence in each relevant space. The company's public launch describes software agents that enter online environments where criminal and foreign-intelligence actors communicate, gather digital evidence, and return findings to government operators. This differs from a conventional search or summarization assistant. The intended task is persistent investigative participation and relationship-building in difficult-to-reach online networks, with the agent extending a human investigator's coverage rather than simply helping draft a report. Aslan's website groups its target problem areas around cross-border smuggling, strategic technology transfer, transnational illicit finance, foreign intelligence targeting, defense and intelligence, and homeland security. The company says its agents have mapped a live smuggling network from Mexican staging corridors into U.S. transport routes, uncovered a sanctions-evading cyber-fraud marketplace, and surfaced technology-transfer and recruitment pathways connected to state-linked Chinese entities. Those are company-described outcomes, not independently audited case studies, and the public record does not reveal the underlying evidence, operational procedures, or whether any result led to a prosecution or disruption.

**Core technology and how it actually works.** Axios reports that Aslan provides a harness for models intelligence and law-enforcement agencies already use, enabling agents to collect digital evidence from underground criminal forums, Telegram channels, and other online spaces. That suggests the product's differentiation is not a claim to have trained a new foundation model; it is the orchestration and mission layer that turns general-purpose model capability into an investigative workflow. In practice, an agent must operate within an authorized digital environment, absorb surrounding conversation, retain context across interactions, identify leads and relationships, and package relevant observations for a human investigator. These requirements create unusually demanding engineering constraints: identity and persona consistency, multilingual and platform-specific interaction, resistance to prompt manipulation by targets, data provenance, access control, audit trails, evidence retention, and controls over any action that could affect a real investigation. Public sources do not specify the underlying models, training data, evaluation protocol, deployment architecture, or technical guardrails. The company and its CEO describe work as human-supervised, while Axios reports that agency evaluations have so far been short and have raised questions about guardrails and data collection and storage. Buyers will need to evaluate those safeguards directly; the public description is not enough to conclude that autonomous interaction is reliably bounded or that collected material meets evidentiary standards.

**Market, customers, and go-to-market.** The addressable buyer set is specialized and procurement-heavy: federal law enforcement, intelligence organizations, homeland-security bodies, and defense or national-security teams investigating transnational networks. Aslan has publicly said it is focused on the U.S. market. Axios reports that the FBI, Homeland Security Investigations, and other agencies have run short evaluations or worked with the company on investigations, and that customers used the system in several investigations. The sources do not name contracting agencies for each case, disclose contract values, distinguish pilots from paid deployments, or establish a recurring revenue base. The likely sales model combines software deployment with forward-deployed technical staff: Aslan says it planned to use new financing to add engineers who work alongside agencies on specific missions, and its careers page describes embedding with operators and translating deployment lessons into reusable platform capability. That approach can accelerate learning and fit complex agency workflows, but it is labor-intensive and exposes the company to bespoke integration risk. The initial market is narrow by design, and adoption depends on authorities, legal review, security accreditation, data-handling policy, and sustained trust as much as on model performance.

**Traction, funding, and third-party validation.** Aslan first appeared publicly in 2025 with a roughly $2.4–$2.5 million pre-seed round led by 2048 Ventures alongside BoxGroup and other early backers. On September 1, 2026, CEO Chase Reid announced a $20.8 million Seed round led by Khosla Ventures and XYZ Venture Capital, with BoxGroup, 2048 Ventures, Liquid 2 Ventures, and others participating. The two disclosures indicate roughly $23 million in announced financing across the company's early life, although public reporting does not provide a complete cap table or clarify whether the headline Seed amount includes any prior capital. Axios reported a 10-person team at launch and Reid's expectation that headcount would nearly double by the end of October; that is a forward-looking hiring plan rather than a verified current count. The company's primary external evidence is its investor backing and reported agency evaluations and investigations. The website presents selected investigative examples and anonymous testimonials from federal and investigative partners, but offers no named customer endorsement, public performance benchmark, contract award, revenue figure, independent technical audit, or published patent portfolio. The validation is meaningful for a young government-focused company, yet still early and difficult for outside observers to reproduce.

**Founders and team background.** Aslan was co-founded by CEO Chase Reid and CTO Ansel Tessier, collaborators since high school who left jobs at Bain Capital and JPMorgan, respectively, to start the company, according to seed investor 2048 Ventures. The firm's May 2025 investment note framed the initial mission around proactive intelligence for public safety, including preventing mass-casualty events. By its September 2026 launch, the company's positioning had shifted toward national security investigations and digital operations against transnational and foreign adversary networks. That evolution may reflect a sharper government customer discovery process, but it also makes it important to establish how the original public-safety product and any data or model development relate to the present mission. Public sources identify the founders and a small technical team but do not establish a deep bench of former investigators, intelligence officers, legal experts, or safety researchers. The careers page is hiring AI engineers, forward-deployed engineers, operations staff, and government go-to-market leaders, confirming that team formation and field deployment capability remain active priorities. The founders' demonstrated ability to recruit venture backing and make an early product pivot is a positive execution signal; experience delivering secure, durable systems inside sensitive government environments remains a diligence question.

**Competitive dynamics and possible edge.** Aslan sits between established intelligence platforms and a new generation of agentic investigative tools. Palantir provides data integration, analytics, and operational workflows to government customers; Recorded Future and Babel Street organize threat and open-source intelligence; Sayari maps corporate and illicit trade networks; and specialist tools such as ShadowDragon support online investigations and link analysis. These products can be complements or substitutes depending on whether an agency needs a common operating picture, curated threat data, entity resolution, or direct digital engagement. Aslan's claimed distinction is to move from observing and correlating content toward persistent, agent-mediated presence inside the digital environments being investigated. If that capability is reliable and governed, it could let a small team monitor more channels and trace relationships that passive collection misses. The same positioning creates formidable substitutes: agencies can combine commercial intelligence feeds with in-house investigators, specialist vendors, or general-purpose AI tools, and established contractors have procurement access, integration capacity, and institutional trust. Aslan has not published comparative evaluations showing that its agents find more useful leads, work more safely, or lower investigative cost than these alternatives. The prospective edge is therefore a product thesis and early-use signal, not yet a demonstrated moat.

**Strategic relevance and dual-use assessment.** Aslan is directly relevant to allied national security, law enforcement, cybercrime investigation, border security, and protection of sensitive technology and defense-industry personnel. Its reported investigative scenarios concern smuggling, illicit finance, foreign intelligence targeting, and technology-transfer pathways, all of which map to strategic competition and homeland-security priorities. However, this record classifies the company as a non-Israeli strategic reference: its reported headquarters and initial customer focus are in Washington, D.C. and the United States, and the research found no substantiated Israeli founding, operating, or customer connection. It is therefore an allied-technology reference rather than an Israeli ecosystem company. The schema's dual-use flag is set to false because the disclosed core product is designed for national-security and law-enforcement investigations; public evidence does not establish a separate commercial or civil-resilience product serving ordinary businesses. The technology could be adapted to commercial fraud or trust-and-safety investigations, but that is a plausible adjacent market, not a current public deployment claim. Strategic value is real even without a dual-use label: the platform targets the human-scale limit on digital investigations and could extend operator coverage if its access, oversight, and evidence controls withstand agency scrutiny.

**Stage, trajectory, and key diligence risks.** Aslan is early-stage: founded in 2025, first publicly described with a pre-seed round, and still building out its team and government delivery function after a 2026 Seed financing. The reported investigations and agency evaluations put it beyond a concept-only company, but the public record supports neither broad deployment nor repeatable commercial scale. Its next stage depends on converting short evaluations into approved, funded, repeatable deployments and demonstrating that human-supervised agents consistently produce useful, attributable leads without creating unacceptable operational, legal, or security risks. The core diligence questions are: (1) what agency authorities and approval chains govern each interaction; (2) how the product prevents an agent from targeting people or groups outside the authorized scope; (3) how operators review, correct, and stop an agent; (4) how it protects credentials and resists adversarial prompt injection or manipulation; (5) how data is minimized, stored, retained, and preserved with chain of custody; (6) how accuracy and investigative value are evaluated against human-led baselines; and (7) how services-heavy deployments become a repeatable, secure product. Axios specifically reported that agencies were examining guardrails and collection/storage questions during short evaluations, so these are active adoption gates, not hypothetical concerns. The product's potential strategic impact is high, but so is the cost of a failure involving unauthorized contact, false attribution, compromised source identity, or mishandled evidence."""
