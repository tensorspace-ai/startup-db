name = "Irregular"
description = "Irregular is a Tel Aviv-based frontier AI security lab that evaluates advanced models for offensive cyber capability, emergent misuse, and resilience to attack. It combines proprietary evaluation infrastructure, realistic cyber environments, and research benchmarks to give model developers evidence for safer deployment."
detailed_description = """
Irregular develops security-evaluation infrastructure for frontier AI rather than a conventional endpoint, cloud, or runtime-security product. Its platform connects to models and agent scaffolding and runs repeatable assessments across cyber capability, adversarial behavior, and security controls. Its public evaluation work spans bounded Atomic Tasks, scenario-level CyScenarioBench, and FrontierCyber, an open-ended benchmark in which models work toward verifiable objectives on real, off-the-shelf systems such as software, databases, mobile devices, and routers. FrontierCyber fixes the environment and objective while leaving the exploit path open, which is intended to measure generalization beyond memorized or planted vulnerabilities. SOLVE provides a difficulty and capability-scoring framework for vulnerability discovery and exploit-development tasks.

The likely buyers are frontier-model developers, AI labs, and organizations deploying high-autonomy agents into sensitive environments. Irregular's archive documents evaluation work with OpenAI and Anthropic, and its own platform description says the system is used by multiple leading frontier labs; these are strong public traction signals, but they are not an independently audited customer list or proof of recurring software revenue. The buyer problem is becoming more concrete as models gain tool use and can discover vulnerabilities, chain actions, or cross boundaries between systems. Results can inform release gates, model cards, safeguard design, threat models, and security monitoring. Diligence should still distinguish repeatable platform revenue from bespoke evaluations and sponsored research.

Its competitive position comes from combining offensive-cyber expertise with model evaluation, environment instrumentation, scenario design, and calibrated scoring. Relevant substitutes include internal safety and security teams at major model labs, academic and open benchmarks, cyber-range vendors, and AI-security companies focused on runtime controls or AI posture management. The research record is a meaningful traction signal: Irregular has published evaluations of Claude, GPT, and other frontier models, and its 2026 archive adds repeated benchmark comparisons and real-system FrontierCyber work. The moat is not guaranteed. Benchmark contamination, changing model interfaces, limited reproducibility, and the ability of well-funded labs to build internal suites could reduce differentiation, while publishing results can help competitors copy methodology.

The national-security relevance is credible but should be stated precisely. Measuring whether an AI system can discover vulnerabilities, execute attack chains, evade defenses, or cross isolation boundaries is directly relevant to cyber defense, critical infrastructure, and procurement of high-consequence AI systems. The same methods could help government or defense organizations assess autonomous cyber tools, but the public record reviewed here does not establish defense contracts, classified work, or operational military use. The September 2025 $80 million financing reported by TechCrunch and a current LinkedIn company size of 11–50 employees indicate substantial backing and an operating team, not proof of product-market fit or durable margins. Key diligence questions are benchmark validity, independent reproducibility, customer retention, revenue composition, responsible disclosure, access controls, and whether offensive findings can be shared without increasing misuse risk.
"""
