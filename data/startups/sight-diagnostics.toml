name = "Sight Diagnostics"

description = "Sight Diagnostics developed compact blood-analysis systems that use automated sample preparation, optical imaging and computer vision to produce rapid hematology results from small blood samples. Its later strategy broadened toward AI analysis of live immune-cell behavior, but public reporting indicates that the company suspended operations and was effectively closed in 2026."

detailed_description = """
Sight Diagnostics was an Israeli medical-device and diagnostics company founded in 2011. Its flagship Sight OLO system was designed to perform a complete blood count from a small venous or finger-prick sample, using proprietary sample preparation and high-resolution imaging rather than the workflow of a conventional centralized hematology laboratory. The platform digitized blood cells into large image datasets and used embedded machine-learning models to classify and count cell populations. This was a credible deep-tech proposition: the company reported an FDA-cleared OLO product and a CE-marked system, while third-party coverage described a compact analyzer that could return CBC results in minutes and operate with less laboratory infrastructure than traditional systems.

The commercial problem was meaningful but difficult. Hospitals, emergency departments, outpatient clinics and smaller laboratories value short turnaround times, simple collection and decentralized testing, particularly when a laboratory is distant or overloaded. The product could also reduce dependence on manual microscopy and make routine hematology more accessible in settings with limited laboratory capacity. Sight raised a reported $71 million Series D in 2020, bringing reported cumulative financing to approximately $124 million at that point, and earlier coverage described deployments and regulatory progress. Those milestones demonstrate substantial technical and commercialization effort, but they do not establish durable revenue, broad reimbursement, or a sustainable installed base.

Sight later attempted a major strategic pivot from a relatively mature CBC use case toward an immune-intelligence platform. The company described a multidisciplinary fluorescent microscopy platform, proprietary live-cell data and AI-derived immune signatures intended to address infectious disease, oncology and autoimmune conditions. Its official website and company profile describe a reusable hardware-and-test-kit platform that measures functional immune-cell behavior, and a reported collaboration with Shaare Zedek Medical Center supported access to clinical data and a dedicated R&D laboratory. These are relevant technical and clinical-development signals, but the newer claims remained dependent on prospective validation, regulatory clearance and adoption in specific indications; they should not be treated as established clinical performance.

The current operating status is the decisive diligence issue. Calcalist reported in April 2026 that the board dismissed approximately 20 remaining employees after earlier layoffs and described the company as at risk of closure. A subsequent public post by a former employee stated that Sight had officially closed, had declined from roughly 300 people to 20 during its pivot, and had not brought its newer emergency-department product to market. The official website remains online, so the domain is still the canonical public reference, but the available evidence supports classifying the operating company as defunct or wound down rather than as an active Series D startup. The underlying patents, regulatory work, datasets, hardware designs and clinical relationships may still have strategic or acquisition value, but any such value would require separate confirmation of asset ownership, maintenance, transferability and continuing support obligations.

For defense and national-security readers, the technology has a genuine but bounded dual-use rationale. A compact blood analyzer or live-cell diagnostic platform could support expeditionary medicine, forward triage, remote clinics, outbreak response and casualty-care logistics where laboratory turnaround is constrained. The value would be medical readiness and reduced dependence on rear-echelon infrastructure, not offensive capability. However, no reliable public evidence establishes defense procurement, military deployment or validation in combat conditions. The company’s closure also means that technical promise cannot be equated with an available product, service organization or investible operating platform.
"""

