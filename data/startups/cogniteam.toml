priority_rationale = "Cogniteam merits a high-priority research position because its platform and LiDAR applications align closely with robotics operations, critical-infrastructure protection, and counter-UAS sensing, and recent partner disclosures provide stronger traction evidence than a generic dual-use thesis. The high risk level is appropriate because financial scale, customer evidence, validated field performance, cybersecurity assurance, and repeatable deployment economics remain insufficiently public."
