name = "Alterya"
description = "Alterya is an Israeli AI-powered fraud-prevention product acquired by Chainalysis in January 2025. It connects scam intelligence from the web and communications channels to crypto wallets, digital-wallet identifiers, and bank accounts so exchanges, payment platforms, and banks can intervene before an authorized payment reaches a scammer."
detailed_description = """
Alterya emerged from stealth as an Israeli fraud-prevention startup focused on a specific but increasingly important problem: modern scam operators use social engineering, synthetic identities, and fast-moving payment infrastructure to move money before conventional controls can react. The company’s product was designed to identify scammers at the infrastructure layer rather than only flagging transactions after damage is done. Public materials describe an AI-powered system that links fraud signals across crypto, digital wallets, and traditional bank accounts, then uses those connections to stop authorized push-payment fraud before funds leave a customer’s account.

The company’s public traction was unusually strong for a young Israeli security startup. In the period before acquisition, Alterya said it monitored more than $8 billion in monthly transactions and protected more than 100 million end users. CTech and the Jerusalem Post both reported that the company had 28 employees at the time of the acquisition and that it had raised a $9.8 million seed round led by Battery Ventures, with participation from NFX, Nyca, and Y Combinator. That combination of seed-stage capital, a narrow technical focus, and rapid customer adoption suggests a company that found product-market fit in a painful category where banks, exchanges, and payment platforms need prevention more than forensic cleanup.

The strategic relevance comes from the shape of the problem Alterya tackles. Authorized-push-payment fraud, crypto scams, mule-account behavior, and pig-butchering style schemes are not just consumer finance nuisances; they are also national-resilience and law-enforcement problems because they cut across regulated financial rails, digital identity, and cross-border criminal infrastructure. Alterya’s approach is therefore dual-use in a broad sense: the same detection primitives can help commercial fintech platforms protect users, while also giving investigators and public-sector teams a cleaner view of scam networks, recipient accounts, and evolving fraud patterns. That makes the technology relevant to both commercial trust and safety and to public-safety or financial-crime workflows.

Chainalysis’ January 2025 acquisition changed the company’s posture but not the technical importance of the asset. Chainalysis said the product would expand its prevention, compliance, and remediation stack, while contemporary reporting described the team as continuing as a product line and Tel Aviv development center. The current canonical product page is hosted by Chainalysis rather than Alterya, confirming that this is now an acquired capability embedded in a larger blockchain analytics platform, not an independent venture. A February 2026 Chainalysis announcement adds a useful commercialization signal: OKX adopted Chainalysis Alterya to prevent transfers to known scam destinations, and Chainalysis said the product then monitored more than $23 billion in monthly transactions, helped protect hundreds of millions of users, and had supported prevention of more than $300 million in losses over the prior twelve months. Those are company-reported figures and require normal customer-reference and methodology diligence, but they indicate materially broader deployment than the 2025 acquisition snapshot.

The competitive landscape is crowded, but Alterya’s niche is distinct. Traditional fraud vendors such as Feedzai, BioCatch, Sardine, Sift, and LexisNexis Risk Solutions commonly emphasize behavioral, device, identity, or transaction risk; blockchain intelligence vendors such as TRM Labs and Elliptic are stronger substitutes for tracing and compliance investigation. Alterya sits upstream by detecting scam infrastructure across web, social, and chat channels, linking it to financial identifiers, and scoring recipient-side risk before an authorized transfer is sent. Its defensibility therefore depends less on a proprietary model claim than on the breadth, freshness, and legality of its cross-rail data, the quality of operational evidence presented to reviewers, and the effectiveness of its integrations and feedback loops. Chainalysis distribution and blockchain data may strengthen that position, but integration can also create roadmap and product-identity tradeoffs.

The strategic relevance is credible but should be stated precisely. This is not defense hardware or a battlefield system; its strongest dual-use adjacency is public safety and financial-crime intelligence. The same detection and graph-linking capabilities can help financial institutions, exchanges, and payment processors protect customers, and can support government agencies or investigators generating leads around pig-butchering, mule networks, and emerging authorized-fraud campaigns. The principal diligence questions are model precision and recall across jurisdictions, false-positive and customer-friction rates, privacy and data-governance controls, evidence retention, scammer adaptation, and whether Chainalysis can preserve rapid product iteration while selling into highly regulated enterprises.

The competitive landscape is crowded, but Alterya’s niche is distinct. Traditional fraud vendors often lean on behavioral scoring, device intelligence, or end-user reports, while crypto analytics vendors often focus on tracing illicit funds after movement begins. Alterya sits upstream of that line by focusing on scam infrastructure, recipient risk, and cross-rail identifiers before money moves. That position is strategically attractive because it can reduce false positives on legitimate transfers while increasing early intervention on scam activity. The main diligence questions are whether that detection edge remains durable as scammers adapt, whether data partnerships remain broad enough across rails and jurisdictions, and how well the Alterya product line can preserve identity and product clarity now that it is inside Chainalysis rather than operating as a standalone startup.
"""
