key_technologies = ["Source-built open source artifact factory", "Wolfi minimal Linux distribution and APK packaging", "Minimal hardened container, VM, library, and OS-package images", "SBOMs, Sigstore signatures, and SLSA provenance attestations", "Automated vulnerability remediation and continuous rebuild pipelines", "FIPS-validated cryptography and OS-level STIG hardening", "Secure CI/CD actions and agent-skill distribution"]
use_cases = ["Replacing vulnerable or oversized community base images in Kubernetes and cloud workloads", "Providing verified language libraries and packages that reduce malware and dependency-supply-chain exposure", "Generating signed SBOM and provenance evidence for enterprise software releases", "Maintaining golden images and standardized runtime foundations across large engineering organizations", "Supporting FedRAMP, CMMC, DoD, and intelligence-community DevSecOps workflows with FIPS and STIG-oriented artifacts", "Reducing patch and vulnerability-management toil for edge, industrial, and mission software deployments", "Giving AI-assisted development pipelines a more controlled source for packages, actions, and agent skills"]
