name = "Onyxia"
description = "Onyxia Cyber provides an operational cyber-resilience and cybersecurity-management platform that unifies security telemetry, control coverage, stack economics, exposure prioritization, and executive reporting for CISOs and security teams."

detailed_description = """
Onyxia Cyber is a privately held cybersecurity software company founded in October 2021 by Sivan Tehila and co-founders identified in public company profiles. Its product is a management and decision-support layer above an enterprise's existing security tools, rather than another endpoint, network, or identity control. The platform connects data from security and IT systems, normalizes it into a cross-domain view, and helps a security leader move from a list of assets and alerts to an operating picture of coverage, gaps, priorities, and business impact. The company's current positioning calls this an Operational Cyber Resilience Engine and emphasizes the bridge between day-to-day operations, organizational context, and measurable outcomes.

The product's most concrete capabilities are a Security Stack Map, exposure and control-gap analysis, benchmarking, compliance-oriented program measurement, budget and return-on-investment views, and automated or AI-assisted reporting. Onyxia says it integrates with more than 40 security products spanning endpoint and vulnerability management, identity, cloud security, application security, email, SIEM, security awareness, network controls, device management, attack-surface management, and IT service management. This breadth is strategically useful because CISOs commonly inherit a fragmented stack whose individual tools cannot explain whether the overall program is reducing risk. It is also a technical dependency: the quality of the platform's conclusions depends on connector coverage, data freshness, normalization, permissions, and the validity of the assumptions used to compare unlike controls.

The target market is enterprise security organizations and, according to earlier public coverage, managed security service providers. The buyer problem is credible: security leaders must allocate limited staff and license budgets, demonstrate compliance, explain program performance to boards, and decide whether a new control closes a meaningful gap or merely duplicates an existing capability. Onyxia's public materials claim SOC 2 Type II and ISO 27001 certification, AICPA auditing, AWS Marketplace availability, alignment with NIST CSF and MITRE ATT&CK, and a 30-day time-to-value message. These are useful commercialization signals, but they are not substitutes for diligence on paying-customer retention, deployment depth, quantified exposure reduction, gross margin, and the proportion of product value that is repeatable rather than services-assisted. Public reporting confirms a $5 million seed round led by World Trade Ventures with Silvertech Ventures and angels in September 2022; a later undisclosed round is reported in third-party company data, but a Series A is not adequately substantiated by the sources reviewed.

Competition is broad and comes from several directions. Security-rating and cyber-risk vendors such as Bitsight, SecurityScorecard, and Safe Security compete for executive risk measurement; exposure-management and attack-path vendors such as XM Cyber compete for prioritization; and asset-inventory or security-operations platforms such as Axonius compete for normalized visibility and stack context. Large security vendors can also add overlapping dashboards and reporting to existing suites. Onyxia's potential edge is the combination of stack rationalization, program governance, exposure prioritization, and board communication in one workflow. That edge will hold only if the company can prove that its models improve decisions beyond spreadsheets, native vendor consoles, and consulting-led assessments.

The national-security relevance is defensive and operational. A military, government, or critical-infrastructure operator also needs to understand heterogeneous asset coverage, identity and endpoint hygiene, control gaps, compliance posture, and the effect of remediation choices across a constrained cyber workforce. Onyxia does not appear to sell offensive access, exploit tooling, or intelligence collection; its dual-use case is therefore a force-multiplication and governance application for sensitive networks. The evidence supports credible adjacency, not proof of defense deployment. Security accreditation, data-residency options, disconnected or restricted-network operation, classified-environment handling, procurement eligibility, and references from government or defense customers would be important diligence questions before assigning a stronger defense thesis.
"""

