name = "Kryora"
description = "Kryora is an Israeli startup developing software that analyzes existing building-management, SCADA, and cooling-system data to identify and validate data-center cooling-efficiency improvements. It presents explainable recommendations first, with more autonomous control described as a later, operator-approved path."
detailed_description = """
**Product and the concrete problem it solves.** Kryora focuses on a physical constraint beneath the AI infrastructure boom: keeping compute facilities within thermal limits while avoiding excessive energy use from conservative cooling settings. Data centers already produce streams of temperatures, equipment states, electrical readings, setpoints, and alarms through building-management systems (BMS), SCADA, chillers, pumps, and room-level cooling equipment. Those signals are often viewed separately, while operators must ensure uptime across a coupled plant where a change to chiller staging, pump speed, airflow, or a temperature setpoint can affect several downstream zones. Static control rules and safety buffers can leave equipment overcooled or running inefficiently, but operators cannot reduce those margins casually because thermal excursions can interrupt workloads or damage equipment. Kryora's stated offer is an intelligence layer over these existing systems: use facility data to expose inefficiencies, estimate where an operator can safely improve performance, and provide a way to measure the result without first buying replacement cooling hardware. The company frames the outcome as lower cooling energy, more reliable operation, and better use of already-installed infrastructure. That is a specific operational proposition, though public material does not identify a customer site or describe its cooling architecture.

**Core technology and how it works.** Kryora describes a workflow that starts with historical data exports rather than a live controls connection. An initial Opportunity Scan scopes the engineering question, checks the timestamps and completeness of available facility data, models how the cooling system behaves across loads and operating modes, isolates possible inefficiencies, and returns ranked findings with assumptions and a validation plan. Its platform materials list inputs such as chiller load and status, pump speed and pressure, supply and return temperatures, room and rack temperatures, weather, humidity, IT load, and operating schedules. The company says it models site-specific relationships instead of applying a generic rule set, and uses the result to identify patterns such as poor chiller sequencing at partial load, excessive flow, low temperature differential, conflicting setpoints, and missed free-cooling opportunities. It links each proposed action to source signals, operating constraints, modeled impact, and steps for a controlled before-and-after comparison. Kryora has not publicly disclosed its model architecture, training data, control algorithms, engineering integrations by vendor, or third-party benchmark methodology. The defensible technical work therefore appears to be in reliable facility-data normalization, site-specific thermal modeling, engineering constraints, and turning analysis into an auditable operational decision; claims about proprietary machine-learning breakthroughs would go beyond the available evidence.

**Market, buyers, and go-to-market.** The initial market is data-center operators managing high-density compute, where cooling capacity, power use, and thermal risk have become operational and financial constraints. The same approach could fit enterprise server rooms and other sites with substantial cooling loads, although Kryora's public product pages emphasize data centers and its ecosystem profile also names hospitals and industrial facilities as potential environments. The likely buyer group includes facility engineering, data-center operations, energy management, and sustainability teams, with approval from operators responsible for reliability. Kryora's published entry motion is a free scan using historical BMS or SCADA exports; it does not require a new sensor, hardware retrofit, live control connection, or automated operational change. That lowers the cost and safety barrier to assessing a site, while producing a technical report that can support a limited, operator-run validation. The company describes a staged path from scan, to controlled validation, to ongoing decision support, with closed-loop optimization only as an optional future step once a site is ready. This is a sensible procurement path for critical facilities because it lets engineering teams test assumptions before granting software write access. Commercial questions remain open: public sources do not identify named design partners, signed contracts, pricing, sales-cycle duration, or whether the initial scan converts to recurring software revenue.

**Traction, financing, and third-party validation.** The strongest public company-specific traction signal is its own report of 34% energy savings at an unnamed live operating location using existing infrastructure. The homepage and Opportunity Scan page label this as an achieved live result and say outcomes vary by facility, cooling architecture, and operating conditions; they do not name the operator, baseline window, measurement boundary, independent verifier, or whether the figure applies to cooling-plant energy or total facility energy. LinkedIn and the PLANETech Marketsquare profile separately describe a potential reduction of up to 30%, so the 34% and 30% figures should not be treated as directly comparable without clarification. PLANETech lists Israel as country, 2025 as founding year, pre-seed/angel as funding stage, and MVP-to-pilot as product stage. LinkedIn lists the company as privately held and places it in the 2–10 employee band. No amount or named investor is publicly disclosed in the sources reviewed. The company site says it is speaking with data-center operators and energy professionals and offers a free scan, but this is evidence of an active discovery motion rather than proof of recurring commercial adoption. The local company-registration listing reports a legal entity named KRYORA LTD incorporated in September 2026; because this is later than PLANETech's stated company founding year, the record treats 2025 as the ecosystem-reported founding year and does not conflate it with the registration date.

**Founders and team background.** The public materials reviewed do not name Kryora's founders or identify a CEO, CTO, or other individual leaders, so individual biographies and prior exits cannot responsibly be added. Its About page describes the team's experience as spanning cooling engineering, machine-intelligence development, data-center operations, and delivery of technical projects in complex environments. It also says the company is being built with input from data-center operators and energy professionals, without naming those contributors or formal design partners. LinkedIn's 2–10 employee range is a useful but broad size indicator, not a verified headcount. For this product, the team needs more than general AI skills: it must understand hydronic and air-side cooling behavior, sensor quality, plant control sequences, facilities commissioning, model validation, and operational change management. A small team can focus on high-value analysis and partner with controls integrators, but customers will expect dependable support across different BMS vendors and around-the-clock critical operations. Diligence should establish who owns the relevant engineering expertise, whether that expertise is internal or contracted, and how the company will staff customer-specific integration as pilots scale.

**Competitive dynamics.** Kryora competes with several alternatives, not only direct AI software vendors. Phaidra applies AI control to industrial and data-center facilities; BrainBox AI optimizes HVAC operations through building data and automation; Schneider Electric's EcoStruxure and Siemens' building-management portfolios provide established monitoring, analytics, and controls; Johnson Controls' OpenBlue brings connected-building and optimization offerings; and in-house facilities teams can make manual changes or commission systems integrators to tune existing sequences. Hardware vendors can also address the same energy bill by replacing chillers, deploying liquid cooling, or redesigning heat rejection. Kryora's proposed distinction is its low-friction analysis-first workflow: begin with historical data, explain the system-level opportunity, leave operational authority with the site team, and provide a measurable validation plan before proposing continuous or autonomous control. That could be attractive to operators who want to improve existing assets without a retrofit or black-box controller. It is not yet a demonstrated moat. The company has not publicly shown comparative benchmarks, repeatable savings across facility types, patent filings, vendor integrations at scale, or customer references. Incumbents have deeper controls access and service networks, while specialist competitors can offer more mature automation. Kryora will need evidence that its model generalizes enough to deliver material site-specific savings and that its audit trail and integration process reduce engineering labor rather than simply add another dashboard.

**Strategic and dual-use relevance.** Efficient cooling is a strategic infrastructure issue because data centers support cloud services, AI workloads, communications, and many enterprise and public-sector systems. Software that reduces avoidable cooling consumption while respecting thermal limits could help operators extract more useful compute from existing electrical and mechanical capacity, lower peak demand, reduce water or power pressure where applicable, and improve facility continuity during constrained supply conditions. The same cooling analytics could serve commercial cloud facilities, hospital computing, industrial control sites, and government or defense-related data centers. That supports a credible dual-use classification at the level of critical-infrastructure operations: the core software addresses a commercial facilities problem that also exists in mission-sensitive settings. The evidence does not show that Kryora has defense customers, security certifications, classified deployments, or a product designed specifically for military systems. Its strategic value is therefore an enabling adjacency rather than a fielded defense capability. Any use in higher-assurance environments would require scrutiny of deployment boundaries, data residency, control-system cybersecurity, offline behavior, and the safeguards around recommendations or future automated writes.

**Stage, trajectory, and diligence risks.** Kryora is best classified as early stage: its ecosystem profile reports MVP-to-pilot product maturity and pre-seed/angel financing, while public company sources show an initial historical-data scan and an unnamed live-site savings claim rather than a named portfolio of production customers. The likely next milestones are repeatable validation across distinct cooling architectures, named references, measurable conversion from scans to paid deployments, integrations with common BMS platforms, and evidence that savings persist through seasonal and workload changes. The most material risks are evidence quality (no public customer name or independent 34% measurement), technical generalization (facility behavior differs), operational safety (bad advice or control actions could threaten uptime), cybersecurity (BMS and SCADA data and write paths are sensitive), integration cost (facility data can be incomplete and vendor-specific), and early-company execution (founder identities, financing amount, and team depth are not public). There is also a market-positioning risk: if Kryora remains an analysis service, revenue may scale with engineering labor; if it automates control, it must clear a higher bar for safety, liability, and certification. The opportunity is attractive enough to monitor because the product targets an observable infrastructure cost and offers a low-risk pilot sequence, but the company remains at a proof-building stage and its headline savings claim needs customer-level corroboration before it should materially raise confidence in commercial readiness.
"""
