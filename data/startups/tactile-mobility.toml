name = "Tactile Mobility"
description = "Haifa-based automotive software company that uses existing vehicle sensors, signal processing, and machine learning to estimate vehicle-road dynamics and create actionable tactile data for OEMs, fleets, road authorities, insurers, and connected vehicles."
detailed_description = """
Tactile Mobility develops an embedded and cloud software stack intended to give vehicles a computational sense of road and tire conditions. Its in-vehicle module ingests signals that are already available in many electronic control systems, including wheel speeds, wheel angle, engine and pedal data, braking inputs, and other chassis information. Signal processing and proprietary algorithms transform those inputs into virtual-sensor outputs such as grip estimation, vehicle weight, tire health, road roughness, and vehicle-road dynamics. The company presents VehicleDNA as a model of the individual vehicle and SurfaceDNA as a map-oriented model of road attributes and hazards. The architecture is attractive where an OEM or fleet operator wants additional perception without adding a new camera, radar, or dedicated road-survey hardware layer, although production validation across vehicle platforms remains a central diligence question.

The commercial proposition spans several buyers with different budgets and buying cycles. OEMs and Tier-1 suppliers can use tactile outputs to complement visual ADAS and autonomous-driving systems, improve warning or control decisions, and create maintenance or after-market services. Tire manufacturers and fleet managers can use inferred wear, grip, and loading information for safety and preventive maintenance. Road authorities and municipalities can turn participating vehicles into mobile probes that identify potholes, cracks, ice, and changing surface conditions, while insurers may use vehicle, driver, and road data in risk and value-added products. The company’s own materials report coverage in more than 70 cities, tens of millions of kilometers of processed road data, and roughly 120,000 recent safety events; these are company-reported operating indicators rather than independently audited traction metrics.

There is meaningful commercialization evidence, but it should be dated and qualified. Tactile Mobility announced a $27 million Series C in October 2021, led by Delek Motors with participation from Goodyear Ventures and Porsche Ventures, bringing its announced total funding to $47 million. A company press release also described work with BMW, and company materials document a City of Detroit pavement-rating use case and a Nexteer collaboration that received a CES 2023 Innovation Award. These signals indicate technical and ecosystem validation, not proof of broad production deployment, recurring revenue, or current growth. The market remains competitive with OEM in-house development, Tier-1 chassis and tire analytics, specialized road-condition mapping, and fleet telematics providers. Tactile Mobility’s differentiation is the combination of software-only integration, vehicle-specific modeling, and crowdsourced road intelligence; its defensibility depends on calibration quality, longitudinal data, integration access, and customer willingness to share data.

The defense and national-security case is plausible but unproven in the public record reviewed here. Vehicle-road friction, terrain classification, load estimation, tire health, and hazard mapping could improve military fleet maintenance, convoy route selection, autonomous ground-vehicle mobility, and logistics planning in degraded or off-road environments. The same capabilities could be relevant to emergency-response and critical-infrastructure fleets. However, public company materials reviewed for this record focus on automotive, municipal, insurance, tire, and fleet markets; they do not establish a defense contract, military deployment, GPS-denied performance, buried-object detection, or IED detection. The appropriate strategic conclusion is adjacency worth validating through customer, export-control, security, and field-performance diligence—not demonstrated defense traction.
"""
