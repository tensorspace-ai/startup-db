name = "Unibeam"
description = "Unibeam provides SIM-native identity authentication that binds a physical SIM, eSIM, or iSIM to a mobile device and exposes the resulting verification through enterprise APIs. Its primary value proposition is phishing- and SIM-swap-resistant authentication for financial, enterprise, telecom, healthcare, and connected-device workflows without a separate app or hardware token."
detailed_description = """Unibeam's product is a SIM Identity and Authentication (SIA) layer embedded in the subscriber's SIM or eSIM secure element. According to the company's technical documentation, the component generates SIM and device identifiers, signs authentication requests, and returns results to the Unibeam service and the enterprise. The platform supports silent authentication, in which the SIM responds without user interaction, and touch authentication, in which a native approval request is delivered to the device. Its REST API supports synchronous and asynchronous callback integration, identifier-based validation, device-change checks through a lastImeiChange signal, and an active-call check. This is a concrete integration surface rather than a general claim of hardware security: an enterprise can enroll a binding, compare later responses, or use a recent device change as a step-up-authentication trigger.

The commercial problem is the weakness of software-mediated identity signals. SMS one-time passwords can be intercepted or redirected after a SIM swap, while passwords, push approvals, and web sessions remain exposed to phishing and social engineering. Unibeam's proposed control is to verify that the expected SIM/eSIM and device are still associated, then optionally require a SIM-level approval. The product pages position this for login, transaction confirmation, anti-SIM-swap controls, anti-social-engineering checks, branded calls, employee access, and IoT authentication. It also claims not to store personally identifiable information and to use company-specific identifiers; those privacy and isolation properties require technical, contractual, and security-review validation before being treated as established controls.

The customer and distribution model is enterprise and carrier dependent. Banks, healthcare providers, digital services, contact centers, and IoT operators are plausible buyers because they already manage account takeover, transaction fraud, or device-integrity risk. Mobile operators remain important because applet provisioning and the SIM signaling path are part of the product architecture, although the June 2026 Hirsch announcement presents SecureSIM as a route to enterprise deployment and says the offering is designed to reduce regional and carrier limitations. The company site publishes API documentation and a product workflow, and its company page identifies founder and CEO Ran Ben David, CTO Steve Harkins, CPO Carlos DaSilva, and advisors with telecom-sector backgrounds. The same site names NFX and AnD Ventures as investors. These are meaningful commercialization signals, but public evidence still does not establish recurring revenue, deployment scale, carrier coverage, or independently audited efficacy.

Competitive dynamics are mixed. Unibeam has a differentiated trust anchor and a low-friction user experience, but it competes against FIDO2/passkeys, device-bound credentials, mobile-network identity APIs, adaptive fraud platforms, authenticator apps, and conventional enterprise IAM suites. Its advantage is strongest where a cellular device and SIM are already present and the buyer wants to avoid issuing tokens or installing software. Its weakness is that cellular connectivity, SIM/eSIM provisioning, device replacement, roaming, dual-SIM behavior, and carrier or handset variation can become operational constraints. Authentication decisions also need recovery paths for lost phones, legitimate device changes, weak signal, and users without compatible service.

The dual-use case is credible but presently indirect. The same hardware-bound verification can support contractor or employee access, critical-infrastructure operator authentication, secure transaction approval, and IoT identity in defense-adjacent environments. The Hirsch channel is relevant because Hirsch sells security and access-control products into high-assurance environments, but neither the company site nor the public announcement establishes a defense deployment or government contract. Unibeam should therefore be viewed as a commercial identity-security startup with security and national-resilience adjacency, not as a proven defense supplier."""
