stage_rationale = """The company was incorporated in January 2025, announced a $5 million initial seed closing in October 2026 and describes PercStoma as investigational and not cleared by a regulator. MedCity News reported on October 19, 2026 that the company was conducting a preclinical study and planning clinical cases for early 2027; the official funding release says the capital will support development and the first phase of U.S. clinical studies. No public device-specific human trial results, regulatory clearance, routine commercial sales or deployments were found. The product stage is therefore early R&D/preclinical, regardless of the seed label."""
competitors = ["Conventional surgical ostomy and existing interventional decompression workflows", "SafeHeal Colovac (adjacent alternative for selected temporary diverting ostomies after colorectal resection)", "Cook Medical Chait percutaneous cecostomy catheter (adjacent bowel-access device)", "Coloplast and ConvaTec ostomy-care products (complementary pouch and skin-care incumbents)"]
competitive_edge = """PercStoma's proposed distinction is the creation of a new ostomy through one percutaneous, fluoroscopy-guided access point, with a fixation device and stent intended to bridge bowel and skin. If that construct can remain sealed and patent while avoiding laparotomy and general anesthesia, it could serve some patients for whom surgical diversion is not an acceptable option. The reversible design goal may also matter where the underlying obstruction is temporary. These are product hypotheses and company targets, not established advantages.

The closest procedural analogue located is Cook Medical's Chait catheter, a percutaneously placed cecostomy catheter intended to instill fluid for antegrade evacuation and aid fecal-incontinence management. It demonstrates an established percutaneous bowel-access workflow, but its intended use is not creating a stoma to divert bowel contents externally or relieving malignant obstruction. SafeHeal's Colovac is a more relevant substitute in a narrower cohort: after low anterior colorectal resection, it is intended to protect an anastomosis and may let some patients avoid a temporary diverting ostomy. It does not create a new ostomy for an inoperable obstruction patient. Coloplast and ConvaTec supply pouches, barriers and related care products used after ostomy creation; these are complementary ecosystem incumbents rather than direct device competitors.

The strongest incumbent is the current standard of care and the clinician's existing decision pathway, not necessarily a single competing startup. Interventional decompression using existing devices is also an alternative in selected cases. Phantom GI will need comparative evidence on patient selection, technical success, leakage, peritonitis, infection, stent migration or obstruction, time to oral intake, reversal, quality of life and total episode cost. The market distinction will matter only if physicians can perform the procedure reliably, hospitals can support it with existing imaging and teams, and regulators accept an appropriate evidence package."""
