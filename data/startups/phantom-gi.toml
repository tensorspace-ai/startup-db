investible = false
investment_rationale = """The investible case is a focused clinical problem rather than a validated product: conventional ostomy creation can be too invasive for patients with malignant bowel obstruction, frailty or high anesthetic risk, and Phantom GI proposes a single-access local-anesthetic procedure. A device that produces a stable, leak-resistant conduit and avoids major surgery could create a valuable option for a subset whose current care is limited. It may also fit existing interventional-radiology and colorectal workflows if the required imaging, specialist time, training and post-procedure care are manageable.

The company has a $5 million seed initial closing from Pitango, RAD Biomed and RUNI Ventures and reports earlier Innovation Authority support. The public evidence remains preclinical: no product-specific human safety or efficacy results, regulatory clearance, paid customer, signed clinical deployment, revenue, reimbursement decision, valuation, runway or verified total funding was located. The 2023 procedure that inspired the concept used off-the-shelf devices and does not establish PercStoma performance. The company's 20-minute procedure, two-minute reversal and three-day discharge figures are targets or assertions, not independently demonstrated outcomes. This is therefore an early technical and clinical diligence case, not a recommendation or a signal that the risks are resolved. A financing decision would depend on independent preclinical results, a credible U.S. regulatory plan, protocol and site readiness, prototype maturity, IP scope, and clarity on the size and terms of prior public and private support."""
strategic_value = """If the device works as intended, it could add a less invasive option to the treatment pathway for patients who are currently poor candidates for major abdominal surgery. That would address a specific gap in colorectal and interventional care, with possible benefits in anesthesia exposure, recovery burden and access to diversion. The company is Israeli-incorporated and headquartered in Tel Aviv, while its seed announcement points toward U.S. clinical studies, making U.S. clinical and regulatory execution strategically important.

The strategic value is conditional on solving a high-consequence clinical problem safely. The public record does not establish that the device has treated a patient, that any listed supporter is a clinical site, or that the company has hospital purchasing commitments. If successful, the design may complement existing ostomy-care products and image-guided practice; incumbents in pouching and bowel access could also shape clinician expectations and distribution. Israel Innovation Authority support and experienced health-technology investors are relevant ecosystem signals, but neither proves technical validation or future adoption. There is no substantiated defense or security relevance."""
