name = "Phantom GI"
description = "Tel Aviv medical-device startup developing PercStoma, an investigational percutaneous system intended to create an ostomy through a single image-guided access point."
detailed_description = """Phantom GI Ltd is a privately held Israeli medical-device startup incorporated in Tel Aviv in January 2025. Its product, PercStoma, is designed to create a colostomy or ileostomy through one abdominal-wall access point under local anesthesia and fluoroscopic guidance. The company describes a fixation device that draws the bowel toward the abdominal wall and a proprietary stent that forms a conduit to a standard ostomy bag. The initial target is patients with bowel obstruction judged too high-risk for conventional surgery; the company’s longer-term ambition is to extend the approach across more ostomy indications.

PercStoma remains investigational and has not been cleared by a regulatory authority. The company reports that it is conducting preclinical work and plans early U.S. clinical cases in 2027; the seed announcement says funding will support development and the first phase of U.S. clinical studies. The often-repeated origin story is one 2023 case in which co-founder Eran Shlomovitz used commercially available interventional devices and X-ray guidance to decompress a patient’s bowel. That account is not evidence that the PercStoma product itself has been tested clinically. The company’s proposed procedure time, reversibility and discharge time are design targets or company assertions without published device-specific outcome data located in this review.

The public team information identifies CEO Ido Sadan, surgeon and radiologist Eran Shlomovitz as chief medical officer, and physician and startup-experienced Eliahu Bekhor as chief scientific officer. The official site also names Lee L. Swanstrom as a key-opinion-leader advisor. It lists Pitango, RAD Biomed and RUNI Ventures as investors and the Israel Innovation Authority and University Health Network as supporters. These descriptions do not establish that a hospital is a paying customer, clinical study site or commercial partner. A 2025 government award entry and older directory data point to earlier public support and pre-seed activity, but amounts and the relationship among those entries are unclear. The only disclosed priced amount located is the October 2026 $5 million initial seed closing. No company-announced lifetime total, valuation, revenue, operating results, cash balance or runway was found.

This is an early-stage procedural-device opportunity with a defined clinical problem and a product hypothesis that could reduce the intervention burden for some very ill patients. It also carries substantial proof, regulatory, adoption and financing risk. The crucial evidence still to come is whether the device can reliably appose bowel to the abdominal wall, maintain a safe and patent conduit, avoid leakage and infection, and be removed or reversed without unacceptable harm. Clinical outcomes, an identified regulatory plan, a reimbursable care pathway, manufacturing readiness and transparent financing terms will be needed before the company’s market claims can be treated as demonstrated commercial potential."""
