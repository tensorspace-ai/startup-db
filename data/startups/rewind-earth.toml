name = "Rewind Earth"
description = "Rewind Earth is an Israeli carbon-removal startup that tracks and stores sustainably sourced residual biomass in oxygen-poor underground and marine environments. Its current portfolio includes deep-mine storage projects and a Mediterranean seabed research pilot, with carbon accounting and third-party verification central to its commercialization model."
detailed_description = """
**Product and the problem it solves.** Rewind Earth is building a biomass carbon-removal business around an underused resource and a difficult accountability problem. Crop and forestry residues contain carbon removed from the atmosphere during plant growth, but conventional decomposition or burning returns much of that carbon to the air. Rewind sources eligible residual biomass, transports it to oxygen-poor geological storage, and documents the chain so that the resulting net removal can be measured and sold as a carbon-removal credit. Its public materials describe a portfolio rather than one fixed facility design: Deep Mine Storage (DMS) places biomass into suitable voids in disused mines, where surrounding geology and low-oxygen conditions limit decomposition; Sediment Carbon Storage (SCS) places biomass beneath marine sediments. The approach has evolved from the company's early Black Sea concept toward mine storage, while an Israeli Mediterranean pilot remains an active research project. That evolution matters for diligence: Rewind's commercial credit issuance to date comes from a Georgian mine project, while its 20-ton Mediterranean trial is explicitly described by the company as ongoing research, not as an equivalent commercial deployment.

**Core technology and how it works.** DMS uses closed mine voids as storage sites for sustainably sourced plant material. In the company's description, the biomass is mixed with water and mud and injected into a mine cavity, then sealed beneath thick sediments. The intended mechanism is to separate the biomass from atmospheric oxygen and slow decomposition over long periods, avoiding the energy-intensive conversion steps used by some biomass-removal pathways. SCS is a related but distinct method: the company's Haifa project places biomass beneath seabed sediment, where anoxic conditions are expected to slow decay. Rewind's technology is therefore partly physical logistics and site engineering, partly biogeochemical storage design, and partly measurement software. The public sources do not provide complete engineering drawings, site acceptance criteria, or independently published permanence results for every project. The record supports describing the underlying principle and selected deployments, but not treating all geological or seabed sites as interchangeable or assuming the same durability at every location.

**Measurement, reporting, and verification.** Rewind's MRV platform is a core part of the product because a buyer needs evidence of net atmospheric removal, not just proof that biomass was moved. Company materials describe documenting each eligible biomass batch, tracking shipments with unique identifiers, weighing loads on certified weighbridges, sampling for moisture and carbon content, screening contaminants, and accounting for transport and equipment emissions. At the storage site, its described process records placement and monitors gases including methane and carbon dioxide; isotope measurements, airflow, temperature, and humidity are also named as monitoring variables. These controls address several credit-integrity questions: whether feedstock would otherwise have decomposed or been used productively, whether the amount of stored carbon is accurately measured, whether supply-chain emissions erase the removal, and whether carbon later leaks back out. The independent Isometric registry provides a concrete validation milestone: it lists 108.92 certificates issued to Rewind on 1 May 2026 for a 2025 reporting period under its Subsurface Biomass Carbon Removal and Storage protocol, with Normec Verifavia as verifier. That issuance establishes verified activity for a defined project and vintage; it does not by itself demonstrate long-term permanence across all sites or prove the economics of scaling the method.

**Market, customers, and route to market.** Rewind's direct commercial buyers are organizations seeking durable carbon-removal credits, including companies with net-zero commitments, carbon-removal marketplaces, and potentially buyers procuring credits through specialized registries. It also needs a separate operating ecosystem: forestry and agricultural residue suppliers, mine owners and operators, waste and logistics providers, environmental authorities, research partners, and local project stakeholders. In 2023, the company announced Supercritical, a London-based carbon-removal marketplace, as its first customer; public reporting does not disclose the contract volume, pricing, delivery schedule, or whether that early agreement remains active. The company's current project pages show DMS Georgia and projects in Romania and the Mediterranean, signaling a site-development and partnership-led expansion model. A mine site may offer an existing void and a reclamation rationale, but each location still requires qualification, feedstock contracting, environmental review, operating permissions, engineering, and monitoring arrangements. Selling credits through a registry can improve buyer confidence, yet the business remains exposed to voluntary carbon-market demand, buyer procurement standards, and competition from other removal pathways.

**Traction, funding, and third-party validation.** Rewind was founded in Israel in 2022 and disclosed a $5 million seed round in November 2023. The funding announcement also reported $250,000 in Frontier research and development grants and $1 million from the Israeli Government Innovation Fund, and named Yes VC, Propeller, Mensch VC, Leap Forward Ventures, and Zora among its funding sources. The Israel Innovation Authority's company profile identifies the legal entity as C Sink Ltd, lists Tel Aviv, a 2022 founding year, ten employees, and an R&D stage; those headcount and stage figures are registry-profile data and may not reflect current staffing. The company was included in XPRIZE Carbon Removal's 2024 Top 100 team cohort, an external recognition rather than proof of commercial performance. More materially, Isometric's public registry records the 108.92-certificate issuance for the Georgia DMS project and names the independent verifier. Rewind separately says it has deployed a 20-ton Mediterranean pilot, which it classifies as ongoing research. No audited revenue, current employee count, total capital raised after 2023, or disclosed credit-sale economics were found in the sources reviewed. The strongest current traction signal is therefore initial verified issuance alongside continued pilot and project development, not mature repeat sales.

**Founders and team.** Public sources identify Ram Amar as CEO and co-founder and describe a founding group that includes Noa Olenik, Kobi Kaminitz, and Eitan Brettler. The 2024 XPRIZE team-book profile characterizes the team as combining company-building, space-engineering, marine and ground operations, sustainability, and scientific expertise; the Israel Innovation Authority identifies Amar as CEO and co-founder, while Rewind's current site describes a broader team of scientists, engineers, entrepreneurs, and climate specialists. The company's technical model depends on capabilities beyond software: marine and geological site assessment, biomass sourcing, supply-chain operations, carbon measurement, ecology, and engagement with local authorities. That range is important because a monitoring dashboard cannot compensate for poor site selection or an unsustainable feedstock stream. At the same time, public sources reviewed provide limited detail on current full-time leadership roles, scientific-advisory commitments, or the division of responsibility between employees and external experts. The founding team's breadth is a positive fit signal, while the evidence base for execution capacity at multi-site industrial scale remains incomplete.

**Competitive dynamics and potential edge.** Rewind competes with other durable carbon-removal methods for the same customers, project capital, eligible biomass, and trusted-credit budgets. Vaulted Deep (biomass storage in subsurface geological sites) is the closest method-level comparison; Graphyte (densified biomass stored in engineered burial sites) offers another biomass-storage pathway; Charm Industrial (converts biomass into bio-oil for geologic storage) competes for carbon-removal purchases; and Exterra Carbon Solutions (converts organic waste into stable biocarbon) competes for feedstocks and buyers. Enhanced-rock-weathering and biochar providers are additional substitutes even though their processes differ. Rewind's proposed advantages are use of residual biomass, limited processing-energy requirements, reuse of existing mine voids, and an end-to-end monitoring trail that follows material from supplier to storage. The Isometric issuance gives that position a stronger evidence basis than a concept-only pitch. The open question is whether site-specific low-cost storage can be repeated across jurisdictions with consistent measurement, environmental safeguards, and durable buyer demand. No patent numbers or claim scope were confirmed in the public sources reviewed, so defensibility should be assessed through operational know-how, site access, verified methodology, and partner relationships rather than assumed patent exclusivity.

**Strategic relevance, stage, and diligence risks.** Rewind is relevant to climate resilience and industrial transition because durable carbon removal, mine reclamation, and responsible use of agricultural and forestry residues can support long-horizon environmental and resource-management objectives. The company does not publicly identify a defense customer or a fielded security application, so its relevance is climate and infrastructure adjacency rather than a direct dual-use capability; this record therefore sets dual_use to false. The startup remains early stage despite a first verified issuance: one registry transaction and a research pilot do not establish repeatable project economics, mature operating processes, or multi-decade storage performance. Principal diligence questions are whether feedstock is genuinely additional and sustainable; whether lifecycle emissions remain low after transport and injection; whether methane generation, leakage, or other ecological effects are adequately measured; whether each site has necessary governmental and community approvals; whether verified credits can be sold at prices that cover sourcing, transport, site preparation, monitoring, insurance, and liability; and whether the project model is acceptable across differing national rules and carbon standards. Rewind's 2023 submission to the UNFCCC itself stated that it was working toward a governmental permit and carbon-removal accreditation, which makes regulatory readiness a real milestone to verify rather than an assumed capability. The 2026 Isometric issuance is meaningful validation, but future priority should depend on additional issuances, transparent monitoring results, safe site expansion, and evidence that project margins survive full lifecycle accounting.
"""
