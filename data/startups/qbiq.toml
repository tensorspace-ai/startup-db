name = "qbiq"
description = "qbiq is an Israeli AI software company that automates early-stage architectural planning for commercial real estate and facilities workflows. Its platform turns space requirements into test-fit layouts, visualizations, quantity estimates, and CAD/Revit-oriented deliverables for brokers, landlords, tenants, architects, and contractors."
detailed_description = """
qbiq addresses the slowest and most repetitive part of many architecture and commercial-real-estate transactions: determining whether a space can support a proposed program and communicating the answer to decision-makers. Users provide requirements such as seat counts, room types, furniture, adjacency rules, and finish preferences. The platform then generates alternative 2D layouts, 3D visualizations and tours, architectural programs, efficiency metrics, quantity estimates, and CAD/Revit-oriented outputs. This is a more constrained problem than generic image generation: circulation, geometry, occupancy, furniture, and program relationships have to remain coherent enough for a preliminary plan to be useful.

The initial customer wedge is commercial real estate, including brokers, landlords, tenant representatives, workplace teams, architecture firms, general contractors, and coworking operators. qbiq's help center describes both one-off independent projects and a property-marketing workflow for owners managing multiple spaces. The commercial value is straightforward: a broker or landlord can show a credible future fit during a leasing process, while an architect or contractor can spend less time producing preliminary alternatives that may never be built. The company's public materials say users can receive several alternatives and a 3D tour within 24 hours, while its technology page emphasizes customization to customer planning guidelines, adjacency rules, and furniture standards.

There are meaningful commercialization signals, although most operating metrics are company-reported and should not be treated as independently audited. qbiq announced a $16M Series A led by Insight Partners in January 2025, with participation from JLL Spark, 10D, Ocean Azul, Random Forest, and M-Fund. The announcement said customers had generated more than 400 million square feet of layouts and visualizations and that the customer base had grown more than tenfold since launch. The company now describes more than 600 million square feet delivered to clients, and its public case studies reference organizations including JLL, Brookfield Properties, Skanska, IWG, Colliers, and Cushman & Wakefield. These references indicate a serious enterprise workflow and distribution opportunity, but diligence still needs retention, revenue concentration, gross margin, conversion from visualization to paid design work, and evidence that generated outputs survive professional review.

Competition exists at several layers. Autodesk Forma represents an incumbent design-platform alternative; TestFit competes directly in rapid feasibility and test-fit generation; Hypar and Finch offer computational or generative design workflows; and established CAD/BIM suites, internal architecture teams, and specialist consultancies remain substitutes. qbiq's differentiation is workflow packaging: it combines constraint-aware layout generation, property and program data, stakeholder-ready visualization, and downstream design artifacts in a single service. Its database of planning scenarios and human architectural validation may improve reliability, but the durability of that advantage depends on proprietary data rights, measurable output quality, integrations, and customer workflow lock-in rather than on the use of AI alone.

The national-security and dual-use case is plausible but not proven. Constraint-aware facility planning could support public infrastructure, emergency accommodation, logistics, healthcare, training, or mission-support sites where teams need rapid scenario comparison and BIM-compatible handoff. However, qbiq's public positioning is overwhelmingly commercial and office-oriented; there is no verified public evidence here of defense customers, classified deployment, government accreditation, or defense-specific procurement. The strategic thesis should therefore be treated as adjacency: a potentially useful planning capability for resilient infrastructure and facilities, with substantial additional diligence required before assigning defense-specific value.
"""
