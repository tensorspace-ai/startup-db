dual_use_description = 'Lab-grown diamond enables critical defense applications: (1) high-energy laser weapon windows operating at multi-megawatt power levels and extreme thermal stresses; (2) quantum magnetic sensors using NV centers for submarine detection, underground facility mapping, and precision navigation without GPS; (3) thermal substrates for radar, EW, and RF electronics requiring cooling at multi-hundred-watt power densities; (4) semiconductor substrates for high-frequency, high-power RF and microwave devices in secure communications and EW platforms. Dual-use classification is warranted because the same core technology, CVD-grown large single crystals with minimal defects, directly addresses both commercial (gem, industrial tools) and military-critical demands. The military applications are not incidental—they drive premium pricing, classification requirements, and export controls that make this distinct from standard industrial diamond.'
