name = "Reblaze"
description = "Reblaze Technologies was an Israeli cybersecurity company whose cloud-native Web Application and API Protection (WAAP) platform combined next-generation WAF, API security, DDoS mitigation, bot management, account-takeover prevention, and behavioral threat detection. Link11 acquired the company in 2024 and integrated its capabilities into Link11's broader security platform."
detailed_description = """Reblaze Technologies built a managed, cloud-native application-security platform for internet-facing sites, web applications, and APIs. Its documented product scope included a next-generation web application firewall, autoscaling DDoS protection, bot management, account-takeover prevention, real-time traffic monitoring and control, SIEM/SOC integration, and behavioral and machine-learning-based threat detection. The platform was designed to run natively with AWS, Azure, and Google Cloud and to support private cloud, public cloud, hybrid, on-premises, container, service-mesh, and serverless architectures. That breadth mattered because application owners increasingly need one control plane for legitimate traffic, automated abuse, and application-layer attacks rather than separate point products for each vector.

The commercial problem was concrete: APIs and web applications expose valuable functions to credential-stuffing campaigns, scraping, payment fraud, inventory abuse, vulnerability scanning, injection attempts, and denial-of-service attacks. Reblaze's product materials emphasized rate limiting, access-control policies, API-specific protections, bot detection, traffic visibility, and managed operations. Public material also identifies enterprise and Fortune 500 usage, but does not provide a current customer list or independently verifiable revenue, retention, or deployment metrics. The available evidence therefore supports product-market traction and a credible enterprise selling motion, not a precise assessment of scale or financial performance.

Reblaze competed in a crowded market against integrated edge-security providers such as Cloudflare, Akamai, and Imperva, as well as focused API-security and bot-management vendors including Salt Security, Wallarm, Radware, and HUMAN. Its differentiation was the combination of managed service delivery, cloud-native and multi-cloud deployment, adaptive behavioral analysis, and coverage across WAF, API, bot, DDoS, and account-takeover use cases. Those capabilities can reduce deployment friction, but the same convergence also exposes the company to bundling pressure from larger platforms with greater network scale, brand recognition, telemetry, and channel reach.

Link11 announced the acquisition on January 30, 2024, stating that Reblaze became part of the Link11 Group and that its SaaS platform would strengthen Link11's web application and API protection portfolio. In April 2025, Link11 said it had fully integrated Reblaze and DOSarrest under a single brand and described a unified WAAP platform combining DDoS protection, machine-learning-based adaptive security, API protection, bot detection, and WAF. The transaction price was not disclosed. This is a meaningful commercialization and strategic-fit signal, but it also means Reblaze should now be analyzed as an acquired technology and product lineage rather than as an independent startup with separately investible equity.

The dual-use case is credible at the defensive-infrastructure level. Government portals, public services, regulated financial systems, and mission-support applications face the same availability, API abuse, credential, and automated-traffic problems as commercial platforms. Reblaze's controls could contribute to resilience for such systems, but public sources do not establish military customers, classified deployments, or government contracts. Its strategic relevance is consequently strongest as an example of Israeli application-security technology folded into a European security-cloud provider, with diligence focused on product continuity, data sovereignty, operational control, and the security of the integrated service."""
