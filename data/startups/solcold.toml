website = "https://www.solcold.co/"
sector = "Climate technology; advanced materials; passive cooling"
founded = "2016"
headquarters = "Rehovot, Israel"
employees = "27 in an undated Israel Innovation Authority profile; LinkedIn range 11–50"
funding_stage = "Series B activity reported; early commercial deployment; amounts and terms mostly undisclosed"
entity_type = "startup"
dual_use = true
dual_use_description = "The core product is a commercial passive thermal-management coating for buildings, industrial assets, food and beverage facilities, and vehicles. Publicly documented adjacent security relevance includes an Israel Prison Service bus pilot and an Israel Ministry of Defense MAFAT-supported applied-research project, while the company has also described military applications in press coverage. These facts support a limited dual-use pathway through reduced heat load, cooling demand, and thermal exposure. They do not prove a defense contract, fielded military system, classified use, or validated operational advantage; defense adoption and specifications remain unverified."
key_technologies = ["Solar-reflective and infrared-emissive multilayer coatings", "Passive radiative cooling", "Anti-Stokes fluorescence / optical heat transfer", "Thermal-control films and coatings for building and industrial surfaces"]
use_cases = ["Roof and building-envelope cooling", "Industrial and beverage-site cooling", "Cold-chain and agricultural storage", "Vehicle and transport thermal management", "Potential energy-demand reduction in hot climates"]
investible = false
