name = "SolCold"
description = "Israeli climate technology company developing passive radiative-cooling coatings and films for roofs, industrial sites, transport, and cold-chain settings."
detailed_description = "SolCold Ltd. is a privately held Israeli materials and climate-technology startup founded in 2016. It develops multilayer coatings that reflect solar radiation and emit heat through an optical window in the atmosphere, with the goal of lowering surface and enclosed-space temperatures without electrical power. The current commercial portfolio includes Glacier 110, Polar 90, and Glacier X coatings or films, with custom B2B quotations. The company says its products have been applied at industrial, beverage, utility, and transport sites, but public evidence does not establish recurring revenue, paid deployment scale, or independently measured customer savings."
