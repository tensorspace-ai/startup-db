dual_use_description = "Dual-use potential is limited and secondary. Legato's core technology—embedded no-code creation, agentic workflow guidance, and self-service platform extensibility—has obvious civilian commercial value for SaaS vendors and enterprises seeking to reduce customization costs and enable partner ecosystems. Defense-adjacent applications would require Legato to be adopted by defense contractors for their own internal or customer-facing platforms, or to be used in mission-critical orchestration contexts. Such applications are plausible but not the primary market driver; they are contingent on adoption by defense-relevant organizations and integration into defense-critical workflows. The platform itself does not inherently process classified information or serve defense-exclusive purposes. Calibrating dual_use=true is justified by secondary strategic value for defense operational support systems, but this should not overstate the platform's core defense relevance."
