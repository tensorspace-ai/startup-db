name = "Torq"
description = "Torq sells an enterprise AI SOC and security hyperautomation platform combining workflow execution, case management, alert triage, and AI agents across customers' existing security tools."
detailed_description = """Torq is an enterprise cybersecurity software company whose product has evolved from no-code security workflow automation into a broader AI SOC platform. Its current stack combines Hyperautomation integrations and deterministic playbooks with alert triage, case management, Socrates orchestration, configurable AI agents, and the Agentic Builder. The product aims to carry a security event from intake and enrichment through investigation, evidence capture, human escalation, and bounded response. Its commercial proposition is to coordinate tools that a customer already owns, reduce repeated analyst work, and standardize response across a large and changing security environment.

Torq's commercial wedge is workflow execution across a heterogeneous stack rather than replacement of every detection source. Public product material describes integrations with security, identity, cloud, communications, and ticketing systems. Deepwatch says it standardized on Torq across its global security infrastructure and uses the platform in its MDR service. Check Point's CISO describes Torq investigating, triaging, and remediating many internal alerts without human intervention when policy conditions are met, while routing high-risk or complex cases for review. These are meaningful customer adoption signals, but the case studies are published by Torq and do not disclose contract values, seat counts, renewal rates, or independently audited before-and-after results.

The product is moving from predictable workflow automation toward agentic work. Torq documentation describes agents operating through approved tools and case context, visible action logs, review and override controls, and configurable underlying models. Its 2026 Agentic Builder adds natural-language planning, workflow and agent generation, testing, and correction. The Revrod acquisition added multi-agent retrieval-augmented generation capabilities; the May 2026 Jit acquisition brought a context-graph capability intended to connect identities, assets, business context, and operating procedures to investigations. This architecture could improve relevance and reduce manual context assembly, but its value depends on context freshness, permission boundaries, evaluation quality, behavior under adversarial inputs, and safe handling of containment actions.

Torq reports strong scale signals. It announced 300% revenue growth and 500% customer growth in 2023, 300% revenue growth and 200% employee growth in 2024, and its current About page lists 430+ employees worldwide. Company releases list customer additions and deployments including Blackstone, Carvana, Deepwatch, Nubank, Riskified, Rivian, Check Point, LEGO, Marriott, PepsiCo, Procter & Gamble, Siemens, Uber, Valvoline, Virgin Atlantic, and Wiz. Torq also advertises 100 million daily security automations. These remain company-reported figures. The company set a $100 million ARR target for 2026 in its 2024 Series C announcement; no actual ARR or absolute revenue figure was located in reviewed public sources, so the target must not be treated as achieved revenue.

Torq is Israeli-incorporated, with an Israeli corporate address in Tel Aviv, an Americas headquarters in Denver, and an EMEA headquarters in London. Its co-founders Ofer Smadari, Leonid Belkind, and Eldad Livni previously built Luminate Security, acquired by Symantec. The company page lists Smadari as CEO, Belkind as CTO, Livni as CINO, and a leadership group across revenue, marketing, customer success, people, finance, security, and engineering. The founders' previous operating history and Torq's financing and team scale are strengths; independent background information for the wider executive team is thinner in public materials.

Torq's commercial differentiation may come from integrating workflow execution, customer-specific context, case history, and approved response logic into a control plane with meaningful switching costs. This is a thesis to test. The market is crowded, and large security vendors can bundle AI and automation into existing SIEM or XDR contracts. Public product descriptions from Tines, Swimlane, Microsoft, Google, Palo Alto Networks, and D3 show overlap in automation, investigation, agentic response, or case management. Torq should be compared on deployment time, workflow coverage, analyst time saved, response quality, integration upkeep, and renewal economics rather than feature lists or vendor-reported automation counts.

The dual-use case is specific to defensive cyber operations. Alert triage, evidence collection, case coordination, and policy-constrained containment can support enterprise SOCs and could also support government, critical-infrastructure, and defense cyber defense teams. In September 2026, Merlin named Torq as a technology partner in its federal SOC modernization architecture and said it was supporting Torq's FedRAMP path. That is a partner-led route to market and compliance effort, not evidence of an agency award, FedRAMP authorization, or production federal deployment. Public evidence supports defensive security operations, not offensive cyber capability or battlefield sensing.

The 2026 Series D provides growth capital at a reported $1.2 billion valuation. Torq separately reports $332 million in total funding, while six individually announced rounds found in this review sum to $330 million; its 2024 Series C release also reported $192 million cumulative funding while then-itemized rounds sum to $190 million. These company totals are preserved as reported and the unexplained difference is not assigned to an invented event. Core diligence questions are current ARR and recurring-revenue quality, retention and customer concentration, gross margins and services mix, cash use, agent error and escalation rates, federal compliance progress, and integration and retention outcomes from Revrod and Jit."""
