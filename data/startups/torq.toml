name = "Torq"
description = "Agentic AI SOC and security hyperautomation platform that helps enterprise and managed security teams triage, investigate, and remediate security events across their existing tool stacks."
detailed_description = """
Torq builds an agentic AI security operations platform centered on hyperautomation, case management, and workflow execution. HyperSOC groups alerts into cases, enriches them with context, prioritizes them, and supports investigation through Socrates, while the underlying Hyperautomation layer connects security, identity, IT, and business systems. The product combines deterministic playbooks with AI agents for runbook creation, investigation, remediation, and case management. That architecture matters because it gives customers a controlled path from natural-language intent to repeatable actions rather than asking an LLM to operate without the surrounding workflow, evidence, and approval context.

The market problem is persistent: SOC teams face high alert volumes, fragmented telemetry, staffing constraints, and pressure to reduce mean time to respond. Torq sells into enterprise security teams and MSSPs that already own many detection and response tools but need an orchestration layer across them. Its use cases include phishing response, identity and access actions, threat-intelligence enrichment, alert investigation, fraud workflows, and operational ticket automation. The commercial value proposition is therefore less about replacing every security control than about making the existing stack produce a faster, more consistently governed response.

Commercially, Torq has moved well beyond an early niche tool. The company reported 300% revenue growth and 200% employee growth in 2024, opened a London EMEA headquarters, and lists enterprise and MSSP customer stories involving organizations such as Check Point, RSM, Valvoline, Kenvue, and Deepwatch. In January 2026 it announced a $140 million Series D led by Merlin Ventures at a reported $1.2 billion valuation, bringing total funding to $332 million; those figures are company-reported and should be confirmed in diligence. Torq's own company page now reports 400+ employees, while its customer page reports large automation volumes and response improvements. These signals indicate substantial adoption and financing, but they do not substitute for checking recurring revenue quality, retention, gross margins, deployment concentration, and the proportion of outcomes attributable to customer-specific services.

From a defense and national-security perspective, the overlap is substantive but bounded. Automated triage, evidence collection, case orchestration, and policy-constrained containment can support government SOCs, critical-infrastructure defenders, cyber defense units, and MSSP operations serving those customers. The technology does not itself provide offensive capability, battlefield sensing, or mission hardware; its relevance is in defensive cyber operations and the resilience of security teams. Torq's 2026 announcement explicitly identifies expansion into the U.S. federal market, but public materials reviewed here do not establish government contracts, certifications, or production deployment in defense organizations. Those deployment, compliance, data-residency, auditability, human-approval, and fail-safe questions are central to validating the dual-use thesis."""
