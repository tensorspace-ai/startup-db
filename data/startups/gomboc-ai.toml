competitive_edge = "Gomboc's claimed edge is remediation-first execution rather than discovery-first alerting. It seeks to convert policy failures and cloud findings into contextual, deterministic, merge-ready code changes, with ORL retaining reusable remediation logic so repeated scenarios do not require repeated open-ended generation. This can be more compatible with Git review, CI validation, and audit requirements than tickets or generic recommendations. The edge is not yet proven to be durable: CNAPP vendors, IaC security tools, cloud providers, and coding-agent platforms all have distribution and could add automated remediation. The decisive evidence would be independently measured fix correctness, low rollback or regression rates, broad policy coverage, fast integration, and customer willingness to make Gomboc part of the production control loop."
