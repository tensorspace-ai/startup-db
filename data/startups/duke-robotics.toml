name = "Duke Robotics"
description = "Israeli-rooted public robotics company developing stabilized drone systems for defense, homeland security, and critical-infrastructure maintenance. Its portfolio combines the Elbit-marketed Bird of Prey remote weapon system with the civilian IC Drone and newer AEROTRACE infrastructure-intelligence platform."
detailed_description = """Duke Robotics develops robotic stabilization and drone-based systems around a common capability: controlled, real-time operation of aerial platforms in demanding environments. The defense product is Bird of Prey, formerly marketed by Duke as TIKAD and now developed and sold by Elbit Systems Land under a collaboration agreement. It combines an unmanned aerial platform with a stabilized remote weapon station intended for stand-off and non-line-of-sight engagement. The technical value is in the stabilization, aiming, control, telemetry, and integration work needed to make a small airborne system useful without placing an operator at the point of danger. Public filings describe a U.S. patent covering key stabilization technology, but the public record does not establish the full scope of the intellectual-property moat or the system's performance across different airframes, weapons, and operating conditions.

The company also has a civilian operating thesis. Its Insulator Cleaning Drone (IC Drone/ICDS) is designed to clean and monitor high-voltage electric-utility insulators, reducing the need for conventional access methods around energized infrastructure. Duke disclosed a pilot and subsequent service agreement with Israel Electric Corporation, including an extension in 2025, and has pursued European commercialization through a Greek subsidiary that received SORA-based operational authorization for IC Drone operations in January 2026. AEROTRACE, launched in 2026, is presented by the company as an AI-assisted aerial-intelligence platform for high-resolution infrastructure data capture and analysis. These activities give the business a more credible commercial adjacency than a weapons-only narrative, although the scale and durability of civilian revenue remain diligence questions.

Duke's route to market is unusually dependent on partnerships and procurement access. Elbit leads marketing, sales, production, and further development of Bird of Prey under the collaboration structure; Duke is entitled to royalties and, under a 2025 supplement, a mid-single-digit commission on qualifying marketing activity. The company announced initial royalty expectations in 2025 and a new Elbit order in June 2026, but public disclosures do not provide enough information to infer a durable production run-rate, backlog, customer concentration, or unit economics. The company is not a conventional venture-backed Series A business: it is a Nevada-incorporated public issuer quoted on OTCQB, and its 2026 annual filing says it employs three executive officers plus one additional employee while using contractors and consultants.

Strategically, Duke sits at the intersection of counter-personnel-risk robotics, drone-enabled defense, and resilience of electric infrastructure. Stabilized remote systems can have legitimate homeland-security and emergency-response relevance, but the weapons application is subject to export controls, procurement scrutiny, safety obligations, and reputational risk. The IC Drone and AEROTRACE capabilities are more clearly dual-use, serving utility maintenance and potentially inspection of other difficult-to-access assets. Competitive pressure comes from major defense primes, specialized unmanned-system suppliers, remote weapon-station vendors, and infrastructure-drone operators with greater capital and manufacturing capacity. The central diligence question is whether Duke can convert technically differentiated demonstrations and partner-led opportunities into repeatable, adequately financed revenue while retaining enough control over technology and economics."""
