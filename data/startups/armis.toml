name = "Armis"
description = "Armis is a cyber exposure management and asset intelligence company whose Armis Centrix platform discovers, classifies, monitors, and helps protect managed and unmanaged IT, OT, IoT, IoMT, cloud, and cyber-physical assets. ServiceNow completed its acquisition of Armis on April 20, 2026, so the record now describes an acquired strategic capability rather than an independent startup."
detailed_description = """Armis Centrix is built around an agentless asset-intelligence approach for environments in which endpoint agents or active scanning are incomplete, impractical, or operationally risky. The platform passively analyzes network traffic and integrates with existing infrastructure to identify devices, enrich them with manufacturer, model, operating-system, software, firmware, vulnerability, and behavioral context, and maintain a continuously updated view of the attack surface. Its coverage spans conventional enterprise IT as well as unmanaged IoT, industrial control and operational technology, medical devices, cloud assets, cellular IoT, and other cyber-physical systems. Armis also describes smart active querying, behavioral baselining, exposure prioritization, threat detection, segmentation support, and workflow integrations as parts of the Centrix product family.

The commercial problem is persistent and concrete: asset inventories and configuration databases are often incomplete, while security and operations teams still need to understand which connected devices are exposed, communicating abnormally, or unsafe to patch. Armis sells into large enterprises and regulated or operationally sensitive sectors such as healthcare, manufacturing, energy, utilities, public sector, and financial services. The product can be delivered through cloud, hybrid, and on-premises models, including an on-premises option intended for air-gapped or highly restricted OT environments. Armis announced FedRAMP Moderate authorization for its federal edition in 2023, which is a meaningful public-sector readiness signal, although authorization is not evidence that every defense or classified deployment requirement is met.

Competition is substantial. Forescout overlaps in broad device visibility and network access control; Claroty and Nozomi Networks are strong OT and industrial-security alternatives; Microsoft Defender for IoT and Palo Alto Networks offer bundled capabilities inside larger security platforms; and specialist medical-device, exposure-management, vulnerability-management, and network-monitoring tools can substitute for parts of the platform. Armis differentiates through breadth across IT, OT, IoT, IoMT, cloud, and physical assets, a large asset-intelligence knowledge base, passive deployment, and the ability to connect discovery with risk scoring and remediation workflows. Those advantages must be tested against classification accuracy, protocol coverage, telemetry quality, deployment friction, and the customer’s willingness to consolidate security tooling.

The acquisition is the clearest commercialization signal now available. ServiceNow announced the transaction at approximately $7.75 billion and said Armis had exceeded $340 million in annual recurring revenue, grown ARR more than 50% year over year, and had approximately 950 employees before closing. Those figures are transaction-era company disclosures rather than a current standalone operating forecast, and Armis is no longer independently investible after the completed acquisition. Strategically, the combination gives ServiceNow real-time asset context across physical and operational layers that can feed security, risk, IT service, and governance workflows. That makes Armis relevant to defense bases, government facilities, hospitals, utilities, ports, factories, and other mission-critical environments, but the database should not infer classified use, military contracts, or cleared deployments without direct evidence. The strongest diligence questions are whether the combined product preserves Armis’s technical depth and deployment flexibility, how much of the value comes from ServiceNow distribution, and whether organizations can act on findings in segmented, intermittent-connectivity, or safety-critical networks."""
