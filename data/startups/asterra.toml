competitive_edge = "ASTERRA applies L-band polarimetric SAR imagery and proprietary processing to identify soil-moisture signatures associated with underground leakage, then routes likely locations to utility teams through Recover and EO Discover. This can screen broad areas where acoustic coverage is incomplete and prioritize ground investigation; it complements rather than replaces repair crews and confirmatory inspection. MasterPlan targets pipe deficiency planning, while EarthWorks applies soil-moisture mapping to dams, roads and rail. Its potential edge is broad-area remote sensing paired with workflow and historical field validation. The evidence reviewed does not justify claims that ASTERRA is the only provider globally or that satellite sensing uniformly outperforms acoustic methods. Rezatec overlaps in satellite-enabled utility risk analytics but describes a more multi-source predictive risk approach."
