priority_rationale = "Low priority. Novu is a well-executed developer-infrastructure company addressing a real market, but strategic fit for Claw & Talon is weak: notification orchestration is not a core defense capability, current customer base is entirely commercial, and dual-use potential would require deliberate product redirection (regulated-sector compliance, classified data handling, air-gapped deployment) that is not on the roadmap. Unless the company explicitly pivots toward defense/regulated infrastructure, or is acquired by a defense prime, it falls outside the fund's thesis. Commercial-stage SaaS can be strong returns, but belongs in a different fund mandate."
