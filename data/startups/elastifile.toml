name = "Elastifile"
description = "Elastifile developed a software-defined, scale-out file system for enterprise workloads across on-premises, hybrid-cloud, and public-cloud infrastructure. Google announced and completed its acquisition in 2019 and integrated the technology into Google Cloud Filestore, so this record represents an acquired infrastructure asset rather than an active independent startup."
detailed_description = """
Elastifile built the Elastifile Cloud File System (ECFS), a distributed software-only file-storage platform intended to give enterprise applications shared file semantics without tying capacity and performance to a proprietary storage appliance. Its documented capabilities included scale-out file services, a cross-cloud data fabric, intelligent tiering between file and object storage, snapshots, and support for cloud or commodity infrastructure. The practical value was not simply more storage: applications could keep familiar file interfaces while gaining elastic capacity, parallel throughput, and a path to burst compute into public cloud. This addressed a persistent gap between highly scalable object storage and the NFS-compatible file systems required by existing enterprise software.

The customer and market context was credible and specific. File-dependent workloads such as SAP, electronic-design automation, media rendering, scientific computing, analytics, machine learning, and Kubernetes stateful applications often cannot be refactored quickly to object APIs. Google’s 2019 product announcement described Elastifile Cloud File Service as a managed GCP offering with on-demand petabyte capacity, multi-zone availability, snapshots, asynchronous replication, and tiering between file and object storage. Google also cited use by customers including Appsbroker, eSilicon, and Forbes. These public signals show a product that had entered real enterprise and cloud workflows, while avoiding an unsupported claim about current independent revenue or customer retention.

Google announced the acquisition in July 2019 and Google Cloud later described it as completed in August 2019. Google’s subsequent Filestore High Scale announcement credited the integrated Elastifile capability with enabling shared file systems that could scale to hundreds of thousands of IOPS, tens of gigabytes per second of throughput, and hundreds of terabytes. Google’s current Filestore documentation describes a managed NFS service for Compute Engine, GKE, Cloud VMware Engine, on-premises machines, and Cloud Run, with zonal, regional, and enterprise tiers. The acquisition is the strongest commercialization and technical-validation signal in the record, but it also changes the diligence question: Elastifile no longer has a standalone product roadmap, management team, or investable equity story. Current diligence belongs on Filestore’s documented protocols, service tiers, pricing, regions, security controls, and migration path, not on presumed standalone Elastifile operations.

The dual-use case is real but indirect. A scalable shared file layer can support intelligence data processing, geospatial and imagery workflows, sensor-data fusion, simulation, scientific computing, and AI training wherever those workloads require high-throughput shared access. Current Filestore documentation confirms NFSv3 and NFSv4.1 support, including LDAP/Kerberos authentication and in-transit encryption options for NFSv4.1, but that is not evidence of defense accreditation or mission deployment. Nothing in the public evidence establishes a defense contract, military deployment, security certification, or purpose-built mission feature. For a national-security buyer, the material questions would therefore be cloud region and residency, tenant isolation, encryption and key control, auditability, resilience under degraded connectivity, export and supply-chain constraints, and whether an air-gapped or sovereign deployment is possible. Elastifile is best retained as a strategically relevant storage technology example, not as evidence of an active defense company.
"""
