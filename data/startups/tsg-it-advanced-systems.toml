strategic_value = "TSG is strategically relevant as an Israeli source of mission-critical operational software in a category that underpins defense readiness and civil resilience. Its potential value lies in integrating heterogeneous data and communications into usable command workflows, shortening the path from detection to coordinated action, and connecting military, emergency, municipal, and infrastructure operators. Its long history and reported deployments may provide valuable domain knowledge and access to operational requirements. At the same time, strategic assessment should distinguish proprietary product capability from systems integration, customer-specific engineering, and acquired businesses. Ownership, listing, export-control exposure, dependence on Israeli government programs, and the degree of interoperability with allied architectures are important diligence questions."
