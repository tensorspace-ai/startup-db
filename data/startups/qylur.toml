dual_use_description = "Autonomous screening systems have credible dual-use applicability. Civilian applications span airport security, transit hubs, and event venue entry control—all high-volume throughput-critical environments. Defense applications include military base access control, secure facility visitor screening, and classified research site entry points. The dual-use profile is material: the core technology (threat detection, workflow automation, sensor fusion) is equally valuable to both markets. Regulatory hurdles differ (ECAC/TSA for civilian, military procurement for defense), but technical feasibility and strategic value are present in both domains. Risk of diversion to unauthorized security use exists but is inherent to physical-security screening technology generally."
