priority_rationale = "Qylur merits sustained priority due to credible dual-use positioning (both civilian airport/venue and military/defense facility applicability), technological differentiation (autonomous AI-driven screening with multi-sensor fusion), strategic alignment with security-infrastructure modernization trends, and operational gating factors that require close monitoring. Key decision points: (1) Proof of deployed reference customer with documented throughput improvement and consistent threat detection; (2) Evidence of pipeline in either civilian or defense channel; (3) Technical validation of detection performance parity or superiority vs. human operators across multiple threat scenarios; (4) Clarity on regulatory pathway (ECAC, TSA, or military certification). Series A stage suggests company has cleared early technical risk, but near-term success depends on first-generation deployment outcomes and commercial pipeline development. Israeli security-tech companies with legitimate dual-use profile and technical credibility merit deeper engagement as both venture and strategic actors."
