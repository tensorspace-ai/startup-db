key_technologies = ["Modular software-defined radio architecture", "CreoNet signal-processing and networking stack", "Mobile ad-hoc networking with self-forming mesh", "Adaptive and intelligent waveforms", "Machine-learning-assisted spectrum sensing and management", "MIMO and low-SWaP tactical datalinks", "Interference avoidance and secure communications"]
