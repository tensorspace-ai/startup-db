name = "Creomagic"
description = "Creomagic Ltd. develops the CreoNet software-defined radio platform and MANET radios for airborne, personal, land and maritime communications. It announced a greater-than-USD-10-million order for thousands of airborne datalinks to an unnamed UAS maker, and markets the same network technology for industrial, law-enforcement, broadcast and other mission-critical operations."
detailed_description = """Creomagic Ltd. is a Rehovot communications hardware and software company whose core proposition is a shared radio and networking stack, CreoNet, adapted across multiple mobile platforms. Company materials describe CreoNet as a modular software-defined radio system combining waveforms, signal processing, machine-learning functions and mobile ad-hoc networking. The current product family spans airborne datalinks, personal radios, land and maritime networking equipment, antenna systems and the CreoEdge-Dome tactical hub. This portfolio gives the company a plausible role in integrating a dismounted team, a vehicle or command post, and unmanned aircraft on one network. The practical value depends on waveform and interface portability, customer integration effort, spectrum access and qualification for each platform.

The company sells into a difficult engineering environment: voice and video links must continue across moving nodes when line-of-sight, spectrum access, GNSS, power and network topology change. Creomagic advertises adaptive waveforms, self-forming mesh, MIMO, frequency hopping and spectrum sensing. Its product pages list up to 40 Mbps for some airborne links and up to 80 Mbps for personal or hub equipment, and state AES-256 security on listed products. These are vendor specifications, not independent comparative test results. The company also describes its systems as combat-tested and refers to ISO 9001:2015 and MIL-STD-810/461 compliance; public certificates, configuration-specific reports and test conditions were not located. A PCT publication index now lists a Creomagic-owned application concerning below-noise-floor communication with a coded constellation, but the WIPO file, inventors, claims, priority date and national-phase status were not retrievable in this pass. The application supports evidence of current IP activity, not proof of a granted or commercially blocking patent.

The most concrete public commercial signal is Creomagic's December 2023 statement that it had won its first single order above USD 10 million, covering thousands of CreoAir datalink units and ground stations for an unnamed international UAS manufacturer. The statement is a company press release carried by sUAS News. It does not disclose the customer, delivery schedule, contract terms, amount recognized as revenue, cash received or remaining backlog. In May 2025 Creomagic and RT LTA Systems announced SkyCnet, an integration of RT's aerostat surveillance system with Creomagic communications. That is evidence of a named product partnership and a route into border-security and other deployments; it is not evidence of a paid deployment or production contract. Creomagic also announced CreoAir Pro and added CreoEdge-Dome to its product family. These releases show sustained productization, but do not establish recurring sales or market share.

The apparent business model is a mix of radio and antenna sales, embedded software, OEM adaptation, systems integration and lifecycle support for defense, security and industrial customers. The company targets defense and government buyers as well as OEMs that need secure air-to-ground or multi-domain communications. Its website also markets industrial operations, law enforcement, broadcasting and maritime applications. The network problem is commercially relevant in remote sites, tunnels, offshore operations and emergency response where fixed infrastructure is weak or absent. Public material reviewed here does not identify a named civilian customer, paid non-defense deployment, renewal rate or channel partner beyond the announced RT LTA integration. Civil-market expansion is therefore a technically credible use of the same stack, but remains a market claim rather than demonstrated revenue diversification.

Competition is substantial and comes from vendors with mature tactical radio ecosystems. Silvus promotes its StreamCaster radios and proprietary MN-MIMO waveform for defense, government and public-safety networks. Persistent Systems sells Wave Relay MANET products across military, first-responder, government and commercial markets. TrellisWare offers TSM waveforms and Barrage Relay networking for large resilient networks. Creomagic's possible distinction is its CreoNet software layer deployed across airborne, personal and land or maritime form factors, together with an OEM-oriented compact radio portfolio. Competitors also make strong claims about scalability and electronic-warfare resilience, and their public product pages do not create an apples-to-apples benchmark. Creomagic has not published comparative field data on throughput under jamming, network size, latency, availability, power draw, interoperability or total installed cost that would substantiate an edge over these alternatives.

The founders are Alexander Shapochnik, identified as co-founder and CEO, and Alex Feldman, identified as co-founder and CTO. Public profiles associate Shapochnik with prior engineering leadership at Aeronautics and Rafael and describe Feldman as an experienced CTO, but detailed biographies and a current organization chart are limited. Creomagic's company profile shows an 11–50 employee band, and current recruiting pages list firmware, board-design, systems and RF engineering as well as sales and HR roles. The hiring signals are consistent with a small company building product and commercial capacity; they do not provide a verified headcount or prove that it can meet a large production ramp.

Financing and ownership records need careful separation. Startup Nation Finder reports a December 2018 non-equity item of USD 1.3 million and an August 2020 undisclosed round associated with ELTA Systems. IVC instead displays a December 2020 seed entry and a 2018 R&D grant with masked values, while CB Insights assigns a December 2020 unattributed VC entry to Caveret. IVC also lists Creomagic in Caveret's current portfolio, but that does not tie Caveret to a specific financing round. A current registry-linked CheckID page names ELTA Systems, both founders and Titan Investments among Creomagic shareholders, but gives no percentages. This establishes named relationships in that directory; it does not settle which entity participated in the 2020 financing or on what terms. No company-announced lifetime total, valuation, audited revenue, ARR, profitability, burn or runway was found. SignalHire publishes a USD 10–50 million estimated annual-revenue band without a disclosed method or accounting period; it is retained only as a third-party estimate and is not treated as company-reported performance.

For diligence, the central questions are whether the announced UAS order has been delivered and converted into recognized revenue, whether OEM programs repeat, and whether gross margins remain attractive after custom integration and support. A buyer should request controlled test reports for the relevant radio configurations, independent results under mobility and interference, and evidence for security, export and environmental certifications. It should also verify the official company extract and shareholder percentages, reconcile the 2018 and 2020 financing records, review the PCT file and IP assignments, and understand production capacity and critical component dependencies. Until those facts are available, Creomagic is best described as a productized, strategically relevant communications startup with a meaningful but incompletely verified contract signal and material financial, technical-validation and customer-concentration uncertainty."""
