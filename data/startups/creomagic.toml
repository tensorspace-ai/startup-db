name = "Creomagic"
description = "Creomagic develops CreoNet, a software-defined radio and intelligent MANET communications platform for resilient voice, video, and data links across airborne, ground, maritime, and personal systems. Its target environments include spectrum-congested, infrastructure-denied, and mobile defense, public-safety, and industrial operations."
detailed_description = """
Creomagic is an Israeli communications technology startup built around CreoNet, a modular software-defined radio and networking stack. Company materials describe a combination of signal processing, machine-learning integration, adaptive waveforms, mobile ad-hoc networking, and secure communications in one platform. The product family is presented as an operating layer that can be adapted across radios and mission systems, rather than as a single fixed radio design. Public product material describes up to 80 Mbps on some land or maritime configurations, lower-size-and-weight airborne datalinks, MIMO, frequency-hopping and low-probability-of-intercept/low-probability-of-detection features, but these are vendor-reported specifications that require independent test evidence.

The commercial offering appears to span three connected segments: CreoAir airborne datalinks for UAVs and other aerial platforms; CreoEdge or related land and maritime radios for vehicles, robotics, and command nodes; and CreoHub personal MANET equipment for dismounted or public-safety teams. This creates a credible systems opportunity because a buyer can need interoperability between a handheld team network, a vehicle gateway, and an unmanned platform. The same architecture also gives Creomagic a path to OEM integration, although the practical value depends on APIs, waveform portability, spectrum approvals, environmental qualification, cryptographic handling, and the amount of engineering required for each deployment.

The market is attractive but crowded. Creomagic competes with specialized tactical-network vendors such as Silvus Technologies, Persistent Systems, TrellisWare, Domo Tactical Communications, and Rajant, as well as larger defense primes and customer-built radio stacks. Its apparent differentiation is the attempt to combine SDR hardware, adaptive waveform behavior, mesh routing, and spectrum intelligence into a compact, reusable platform. The company has maintained a visible product and exhibition presence, and Israel’s Ministry of Defense has listed it in national defense-industry pavilions. A 2023 trade report also described the CreoAir-HP as intended for manned-unmanned teaming and reported company claims of significant orders from aircraft and UAS manufacturers; those claims are useful traction signals but should not be treated as verified customer revenue without contracts, shipment data, or references.

The defense and national-security relevance is direct. Reliable communications are an enabling layer for distributed forces, unmanned systems, mobile command posts, maritime units, and emergency responders operating where fixed infrastructure is unavailable or actively disrupted. Adaptive networking and interference avoidance can improve continuity of operations, but they do not eliminate the physics, detection, jamming, cyber, interoperability, and export-control risks inherent in tactical radio. Dual-use potential is credible in public safety, disaster response, remote industrial operations, broadcasting, and critical infrastructure, yet the strongest near-term fit appears to be defense and homeland-security procurement. Diligence should therefore focus on measured performance under controlled jamming and mobility tests, security architecture, certification status, production repeatability, customer concentration, gross margins between hardware and software, and whether the company can turn integration work into a repeatable platform business.
"""
