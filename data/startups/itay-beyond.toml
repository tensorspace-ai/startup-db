name = "Itay&Beyond"
description = "Itay&Beyond is an Israeli neurotechnology and biotechnology startup building patient-derived brain-on-a-chip models for neurological and psychiatric drug discovery. Its platform combines human brain organoids, electrophysiological readouts, and AI analysis to help pharmaceutical and research partners evaluate disease biology and drug response before expensive clinical development."
detailed_description = """
**Product and the concrete problem.** Itay&Beyond is developing a human-relevant preclinical platform for neurological and psychiatric drug discovery, where animal models and simplified cell cultures often fail to predict how a treatment will behave in people. The company grows three-dimensional brain organoids from patient-derived cells and places that living tissue on an electronic chip so that researchers can measure functional neuronal activity rather than relying only on morphology or molecular markers. The commercial problem is expensive translational failure: a pharmaceutical company can spend years advancing a compound before learning that the biological model did not capture the relevant human disease mechanism. Itay&Beyond's stated initial focus includes autism spectrum disorder and epilepsy, with a platform intended to extend to other neurodevelopmental and neurodegenerative indications. Its value proposition is decision support for compound screening, disease stratification, and preclinical prioritization, not a diagnostic device or a replacement for clinical trials. The company is trying to make patient-specific biology observable early enough that researchers can stop weak programs sooner, select better candidates, and design more informative studies.

**Core technology and how it works.** The platform starts with a non-invasive patient sample, including urine-derived cells described in the company's public materials, which are reprogrammed and differentiated into miniature brain tissues. These organoids contain multiple neural cell types and produce electrical activity that can be measured on a chip. Itay&Beyond describes a closed loop in which electrodes stimulate or record the organoid, functional readouts capture spontaneous and evoked network behavior, and AI software analyzes neuronal signatures and compares disease-derived tissue with neurotypical controls. The system also uses three-dimensional imaging and morphological analysis to identify structural differences. Its public demonstrations include organoids derived from people with autism, electrophysiological comparisons, testing of an FDA-approved compound for repurposing, and a game-like environment in which neural tissue responds to computer signals. The important technical distinction is the combination of living, patient-derived tissue with functional measurement: a visually similar organoid can still have different network dynamics, while a functional response can provide a more direct signal for drug efficacy hypotheses. The public record does not disclose the complete chip architecture, electrode density, model-training dataset, assay reproducibility statistics, or proprietary algorithms, so the platform should be understood as a promising integrated research system rather than a fully characterized industrial standard.

**Market, customers, and go-to-market.** The primary customers are pharmaceutical and biotechnology companies, academic medical centers, contract research organizations, and translational research groups that need better models for central-nervous-system programs. A B2B service or partnership model is the most visible route: partners can provide compounds or patient cohorts, while Itay&Beyond supplies organoid generation, functional assays, analytics, and a report that informs go/no-go decisions. The company has also described a path from compound screening to biomarker discovery, disease-mechanism work, trial-design support, and eventual co-development or out-licensing of therapeutic assets. Public reporting says the startup has worked with Hadassah University Medical Center and Schneider Children's Medical Center and has had small-pharma collaborations in Israel and Europe, but the sources do not disclose customer names, contract values, recurring revenue, sample throughput, or renewal rates. That makes the near-term market more credible as specialized research services and joint development than as a standardized product sold off the shelf. Scaling will require repeatable reprogramming, quality-controlled organoid batches, inter-laboratory reproducibility, secure handling of sensitive patient data, and a workflow that is faster and cheaper than each customer's existing disease-modeling program.

**Traction, funding, and third-party validation.** Itay&Beyond was founded in 2021 and has been visible through scientific, media, and ecosystem channels rather than through a large disclosed venture round. Israel21c described a roughly six-person team and approximately $3 million in modest funding in 2024, while Caplight lists a pre-seed round associated with Living Hope VC and reports approximately $1.91 million; the different figures are not reconciled in public filings and should not be treated as a confirmed total. Living Hope's own portfolio page says it became the first institutional investor in 2025. The strongest recent validation is a 2026 Translational Psychiatry paper whose authors include Itay&Beyond researchers and Hadassah investigators. In that study, organoids derived from urine samples of eleven people with autism spectrum disorder, including several monogenic subtypes, showed distinct baseline and stimulated neuronal activity patterns compared with neurotypical controls. That result supports the platform's ability to expose biological heterogeneity; it does not establish clinical efficacy, diagnostic accuracy, or a drug that has reached human trials. The public record also does not confirm regulatory approval, a large commercial contract, revenue, or a completed clinical endpoint.

**Founders and team.** The company was established by Shmulik Bezalel, Boaz Goldman, and Dr. Nisim Perets. The official company account says Bezalel's experience as the father of a child with autism helped motivate the search for better treatment models, while Goldman contributes entrepreneurial and investment experience and Perets serves as co-founder and chief executive. Perets is presented as a neuroscientist with research and drug-development expertise, and the company identifies Nir Waiskopf as a research and development leader in the 2026 publication. The advisory group listed by the company includes figures with backgrounds in global pharmaceutical innovation, Lonza Israel, Takeda Israel, Pfizer investment, foreign affairs, and pediatric neurology at Hadassah. This mix is relevant because Itay&Beyond must bridge stem-cell biology, electrophysiology, AI, disease modeling, pharmaceutical partnering, and regulated research operations. The team is still small by the standards of a platform intended for global pharma, and public sources do not provide a complete headcount, quality-system leadership, commercial organization, or manufacturing plan. Founder motivation and scientific credentials are useful starting signals, but execution will depend on reproducibility, data governance, and the ability to convert a research result into a service that customers can validate and procure.

**Competitive dynamics.** Itay&Beyond competes with several layers of alternatives. Emulate and MIMETAS sell organ-on-chip systems that recreate human tissue environments, while Ncardia, StemoniX, and AxoSim provide induced-pluripotent-stem-cell or three-dimensional neural models for screening and disease research. Cortical Labs demonstrates another approach to electrically interfacing living neural cultures with computers, although its emphasis is biological computing rather than pharmaceutical decision support. Large pharmaceutical companies and academic centers also maintain internal organoid, iPSC, electrophysiology, animal, and 2D-cell capabilities. Itay&Beyond's proposed edge is the vertical integration of patient-derived brain tissue, electronic functional readouts, visual characterization, and AI interpretation in a workflow focused on CNS programs. Its 2026 publication provides an evidence point for disease-subpopulation stratification, but it does not prove that the platform predicts clinical response better than competing assays. Defensibility could come from curated patient-derived lines, longitudinal functional datasets, assay protocols, and pharma workflow integration; those assets will take time to accumulate and are not yet publicly quantified.

**Defense, security, and resilience relevance.** Itay&Beyond's core product is a civilian biomedical research platform, so its defense connection is indirect and does not justify a dual-use classification on current evidence. The strongest strategic relevance is health resilience: faster, more human-relevant development of treatments for neurological and psychiatric disorders could improve national capacity to respond to trauma, neurodevelopmental conditions, neurodegeneration, and medicine shortages. Patient-derived models could also support research for service members, first responders, and populations exposed to stress or brain injury, but no military customer, defense contract, battlefield program, or security-specific assay is publicly disclosed. The company contributes to Israeli sovereignty in advanced stem-cell biology, electrophysiology, and AI-enabled translational research, and the platform could reduce dependence on imported preclinical services if it becomes reliable. Those are meaningful deep-tech and resilience signals, yet the technology does not itself provide cyber, autonomy, sensing, or weapons capability. Any future defense relevance would require a defined medical research program, privacy and biosecurity controls, and evidence that the assays answer operational questions rather than only academic ones.

**Growth stage and diligence risks.** Itay&Beyond is best classified as early: it has an identifiable 2021 company, a Jerusalem base, a public platform, an institutional-investor signal, scientific collaborators, and peer-reviewed research, but it remains pre-seed or early commercial rather than a scaled life-sciences vendor. The next milestones should include independently reproducible assay performance, larger and better-controlled patient cohorts, blinded drug-response studies, validated turnaround time and cost, repeat orders from pharmaceutical partners, and a clear quality and data-governance system. The main risks are substantial. (1) Organoid maturity, batch variation, and missing cell types may limit disease fidelity. (2) Electrophysiological signatures can be statistically real without predicting therapeutic benefit in people. (3) Reprogramming and patient-consent workflows can be slow, expensive, and privacy-sensitive. (4) Pharma buyers may require comparison against established animal and clinical datasets before changing decisions. (5) The platform may become a services business with limited throughput rather than a scalable product. (6) Regulatory and ethical expectations for human-derived tissue and AI-supported drug decisions may increase. (7) A small team must cover neuroscience, stem-cell manufacturing, hardware, software, partnerships, and capital raising. The scientific signal is strong enough to monitor, while the evidence gaps keep the company in an early, high-risk diligence category.
"""
