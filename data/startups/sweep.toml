name = "Sweep"
description = "Sweep is a private enterprise-software company building an agentic metadata layer for understanding, governing, and changing interconnected business systems. Its platform currently emphasizes Salesforce, Snowflake, ServiceNow, HubSpot, and Data 360 environments."
detailed_description = """Sweep provides a control and context layer for enterprise systems whose configuration is spread across objects, permissions, automations, schemas, integrations, and business rules. Its product continuously ingests system metadata, maps dependencies, and presents that structure to business and technical teams. AI-assisted documentation, impact analysis, alerts, deduplication, routing, and change workflows are intended to make system behavior legible before an administrator or agent changes it. Sweep says its connectors index metadata rather than customer business records in at least some workflows, an important distinction that still requires customer-specific security diligence.

The initial commercial wedge is revenue operations and Salesforce administration, but the product has broadened toward cross-platform enterprise architecture. Official product material describes connections to Salesforce, Snowflake, ServiceNow, HubSpot, and Data 360, while recent company announcements describe a cross-platform agent and multi-org intelligence. The buyers are likely business-systems, RevOps, data-platform, and IT operations teams that already spend heavily on consultants and manual administration. The value proposition is measurable time savings and lower change risk, but the record should treat customer testimonials and claimed efficiency improvements as company-reported evidence rather than independently verified performance.

Sweep announced a $22.5 million Series B led by Insight Partners with continued participation from Bessemer Venture Partners in 2025. Its public materials also show an expanding product surface, customer-facing case studies, and hiring across multiple locations. These are useful commercialization signals, but public evidence does not establish recurring revenue, retention, customer concentration, profitability, or the durability of the claimed moat. The principal competitive question is whether Sweep can become a system-of-record for metadata and governed change, rather than remaining an implementation aid that is vulnerable to platform-native features, integration suites, consultancies, or generalized AI agents.

The company was founded in 2021 and has Israeli roots and a Tel Aviv team presence, while current public company information identifies New York as its primary headquarters and lists additional distributed locations. That geographic mix can support enterprise sales and Israeli engineering recruitment, but it also creates operational and regulatory complexity. Sweep is not inherently a defense product: its core workflows address commercial business systems. A credible defense or national-security adjacency exists only when the same metadata lineage, dependency analysis, permission visibility, and auditable change controls are deployed in defense-industry, logistics, critical-infrastructure, or other high-assurance enterprise environments. No public evidence reviewed here demonstrates a defense customer, government contract, or security certification, so the dual-use case should remain conditional."""
