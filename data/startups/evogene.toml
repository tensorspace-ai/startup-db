name = "Evogene Ltd."

description = "Public Israeli computational chemistry and biology company developing AI-driven small-molecule discovery tools for pharmaceutical and agricultural products, with a focused 2026 strategy centered on its ChemPass AI platform."

detailed_description = """
Evogene is a Rehovot-based public company whose current strategy is centered on ChemPass AI™, a proprietary generative-AI and computational-chemistry engine for designing and optimizing small molecules. The platform is described by the company as being trained on roughly 38 billion molecular structures and as optimizing several product-relevant properties at once, including potency, selectivity, stability, toxicity, ADME, scaffold design, and synthesizability. Its workflow combines literature and data preparation, target modeling, virtual hit screening, analog generation, and prioritization for experimental testing. This is a credible and important problem: discovery programs often fail because activity, selectivity, developability, safety, and manufacturing constraints are optimized sequentially rather than together. Evogene's claims about precision and acceleration are company-reported technology claims, not evidence that a candidate has reached clinical or commercial validation.

The commercial model is a mixture of collaborative research, licensing, co-development, and internally advanced product programs. The principal markets are pharmaceutical discovery and agricultural chemicals, where customers can use computational design to reduce the number of compounds synthesized and tested before selecting leads. Evogene has expanded its collaboration with Google Cloud to integrate AI agents through Vertex AI, and in July 2026 announced a scientific collaboration with South Korea's ELEO to design and prioritize oral PCSK9-pathway inhibitors. These announcements show active business-development and platform-integration work, but they remain early discovery or collaboration signals rather than proof of regulatory approval, recurring software revenue, or a marketed drug. The company reported approximately $3.9 million of 2025 revenue, down from approximately $5.6 million in 2024, so diligence should separate strategic activity from durable commercial traction.

Evogene's operating structure has changed materially. AgPlenus, its agricultural-chemicals subsidiary, was integrated into core operations and resized around the ChemPass platform. The majority of Lavie Bio's activity was acquired by ICL in 2025 and Lavie Bio discontinued operations at the end of the first quarter of 2026. Biomica's operations were scaled down and its lead oncology candidate was licensed to Lishan Pharmaceuticals; Casterra is focused on castor-seed activities in Brazil after reducing operations elsewhere. This streamlining may improve capital discipline and concentrate scarce R&D resources, but it also reduces portfolio breadth and makes the value of ChemPass AI and a small number of pipelines more consequential. The competitive field includes large incumbent agrochemical and pharmaceutical companies, specialized AI-drug-discovery firms, and synthetic-biology platforms with substantially greater capital or larger experimental datasets.

The strongest strategic case is as a computational discovery capability that can help allied food, agricultural, and pharmaceutical ecosystems explore chemical space more efficiently. Crop-protection discovery and resilient agricultural inputs can contribute to food-security planning, while faster small-molecule design may support health and supply-chain resilience. The same general design capabilities could be relevant to security-sensitive chemical or biological research, but Evogene's public materials identify civilian pharmaceutical and agricultural objectives rather than defense contracts or military deployment. Any national-security engagement would therefore require separate diligence on allowed targets, model access, screening and synthesis controls, export compliance, biosafety, cybersecurity, and partner governance. The immediate questions are whether ChemPass-generated candidates reproduce in independent assays, how many programs have reached meaningful preclinical milestones, what current collaborations pay for, and whether the sharply reduced workforce and financing needs can support execution.
"""

