name = "Exodigo"
description = "Exodigo provides AI-powered subsurface intelligence by combining multi-sensor field data, geophysics, and 3D visualization to reveal buried utilities, foundations, and geotechnical conditions before construction. Its primary customers are infrastructure owners, engineering firms, contractors, utilities, and public agencies managing high-consequence projects."
detailed_description = """
Exodigo is a subsurface-intelligence company focused on non-intrusive underground mapping. Its workflow combines field-deployed sensing, geophysical signal processing, AI-assisted interpretation, engineering review, and 3D visualization to produce a more complete model of buried utilities, foundations, voids, and other below-grade conditions. The product is therefore more than a single locating instrument: it is a data-to-decision workflow intended to help teams use underground information during planning, design, procurement, utility coordination, and construction.

The customer problem is economically concrete. Incomplete utility records and uncertain ground conditions can cause strikes, change orders, redesign, delays, safety incidents, and avoidable excavation. Exodigo's site currently reports more than 100 global customers, 86.1 million square feet scanned and mapped, $75 billion in de-risked infrastructure investment, and 50 government agencies across the United States, Europe, and Israel; these are company-reported operating signals rather than independently audited metrics. Its disclosed customer and market mix spans infrastructure owners, utilities, transportation operators, engineering firms, contractors, and public agencies, giving the company multiple routes into large capital-project budgets.

Commercially, the strongest wedge is preconstruction and early design, where a relatively modest investigation can prevent a costly downstream mistake. The July 2025 Series B announcement says Exodigo raised $96 million and had raised $214 million in total since launch; the current homepage subsequently rounds its funding language to more than $200 million. The financing and customer claims indicate meaningful scale-up, but they do not by themselves establish recurring software revenue, project-level gross margins, or customer retention. Exodigo also describes an engineering-services capability, which may help adoption and quality control while creating a diligence question about how much revenue and delivery effort remains services-led.

The competitive field includes traditional utility locators, subsurface-utility-engineering firms, geophysical survey specialists, and large engineering or measurement-software vendors. Exodigo's potential edge is the integration of heterogeneous sensing, AI interpretation, human geophysics expertise, and a project-facing 3D output. That edge will only be durable if accuracy, coverage, turnaround time, and explainability remain strong across soil types, urban clutter, asset densities, and countries; otherwise customers can revert to established survey and engineering providers.

Dual-use relevance is credible but should be described as adjacency, not as demonstrated defense business. Subsurface mapping can support critical-infrastructure resilience, secure-site engineering, route and mobility planning, tunnel or foundation assessment, and emergency response, while the same core capability serves civilian infrastructure. No public evidence in the reviewed sources establishes defense contracts, classified work, or military deployment. The strategic case therefore depends on technical transferability and procurement access, not an assumed defense customer base.

For the Claw & Talon thesis, Exodigo sits in a useful overlap between infrastructure software, geospatial intelligence, and resilience. It has credible commercial traction and a technically meaningful national-security adjacency, but diligence should prioritize independently measured detection performance, repeatability, data rights, project economics, customer concentration, regulatory and safety obligations, and the balance between scalable platform revenue and field services. The company is strategically relevant as a private mid-stage startup; the evidence supports monitoring and structured diligence rather than treating company-reported scale metrics as proof of a mature moat.
"""
