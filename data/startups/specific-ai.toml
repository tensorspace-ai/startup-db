investment_rationale = "Specific AI merits a positive legacy priority signal because it targets a concrete AI-production bottleneck rather than another general-purpose assistant. (1) The product thesis is differentiated: automate the repeated distillation and validation work required to create many narrow models, allowing enterprises to trade unnecessary generality for speed, cost control, and predictable behavior. (2) The strategic architecture is attractive: self-hosted deployment and CPU-capable inference reduce data-exfiltration exposure, network dependence, and GPU scarcity, which matter in both regulated commercial environments and sovereign or mission-sensitive systems. (3) Current evidence includes an official product, an AWS Marketplace deployment artifact, an F4 Seed classification, Angular Ventures backing, and public ecosystem participation. (4) The score is capped because the company is very young, has 1–10 publicly reported employees, has not disclosed funding amount, revenue, named customers, retention, certifications, or defense traction, and publishes company-reported performance examples rather than independent benchmarks. Priority diligence should focus on paid model counts, quality parity under real customer workloads, deployment security, model-license governance, gross margins, and resistance to hyperscaler bundling. This flag is an internal diligence signal, not an investment recommendation."
