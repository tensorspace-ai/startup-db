name = "BetterSeeds"
description = "BetterSeeds Ltd is an Israeli agricultural biotechnology company developing a CRISPR crop-improvement platform that combines compact gene editors, EDGE plant-virus delivery, and trait modules for seed companies."
detailed_description = """BetterSeeds Ltd, founded in 2017 and formerly known as CanBreed Ltd., is an Israeli agricultural biotechnology company serving seed businesses with genome-editing tools and crop trait development. The Israel Innovation Authority lists BetterSeeds in agritech, names Ido Margalit and Tal Sherman as co-founders, and records a stage of initial revenues. The company's current public materials describe a business-to-business platform combining compact CRISPR editors, an engineered plant-virus delivery approach called EDGE, and trait modules. Its stated commercial proposition is to provide seed companies with access to a bundled editing system and services rather than require every customer to build editing and delivery capability in-house. This is a company-described proposition; public evidence reviewed here does not disclose customer names, paid program counts, license economics, or product sales.

The technical thesis addresses a genuine bottleneck in plant gene editing: editing targets are crop-specific, and delivery and regeneration can be difficult or expensive in crops without mature tissue-culture methods. BetterSeeds says its compact editors are designed to work with its engineered virus delivery and to support non-transgenic edits without introducing foreign genes. A published international application assigned to BetterSeeds concerns gene-edited cowpea architecture by manipulating SELF PRUNING genes VuSP1 and/or VuSP2. That record shows a filed and published patent application, not a granted patent or proof of freedom to operate. A separate US cucumber-plant-habit application was listed as abandoned after failure to respond to an office action. Those examples demonstrate both a developing portfolio and the need to assess jurisdiction-by-jurisdiction prosecution, claim scope, licensing rights, and the broader CRISPR patent landscape.

The company's public product focus has evolved from CanBreed's initial cannabis-seed work into food and specialty crops, including cowpea, tomatoes, peanuts and cacao. Current company pages also present subsidiaries and crop programs, but the reviewed pages provide product positioning rather than independent evidence of commercial deployment. The company's claimed benefits include drought and heat resilience, disease or pest response, reduced allergens, plant architecture suited to mechanized harvest, and other breeding outcomes. Each trait needs crop-specific validation in replicated field conditions across environments. A molecular edit or regulatory determination alone does not establish agronomic advantage, seed multiplication readiness, farmer demand, or repeat purchases.

A material regulatory milestone is the USDA Animal and Plant Health Inspection Service's 2024 regulatory status review response for BetterSeeds' cowpea. APHIS found that the reviewed plant was unlikely to pose an increased plant-pest risk compared with other cultivated plants and was therefore not subject to regulation under 7 CFR part 340 from that plant-pest perspective. The underlying APHIS table describes altered architecture and flowering time, including determinate growth habit and early flowering. This is a meaningful US regulatory milestone, but it should not be described as broad USDA product approval, food-safety approval, seed registration, or proof that PeaMAX is commercially available. The supporting public reporting that calls PeaMAX commercially approved appears to overstate the narrower APHIS determination.

The funding record is also more qualified than older summaries suggest. A November 2021 announcement says BetterSeeds closed a $2 million investment led by A-Labs through its 12.64 Fund as part of a $7 million round. OurCrowd later said that JITO Angel Network had invested through its platform and that the $7 million round was still open in September 2022. These sources support a reported $7 million financing round and a disclosed $2 million A-Labs tranche, but do not establish the amount ultimately closed, final close date, complete investor list, or company-wide lifetime total. Smart Agro's 2021 disclosure says it had invested a cumulative $2 million in BetterSeeds in November 2020 and March 2021; this is a separate earlier investment relationship and the article does not divide that reported aggregate across the two dates. No round valuation or current cap table was found. BetterSeeds' government profile lists several R&D and knowledge-commercialization support awards in 2023–2025 without amounts, and these should be tracked separately from equity when award-level documentation becomes available.

The official BetterSeeds team page identifies Ido Margalit as CEO and co-founder, Dr. Tal Sherman as CTO and co-founder, Dr. Shira Corem as VP R&D, Ilanit Madari in finance and HR, Rami Dar as director, and Dr. Helmut Schramm as chairman. The page describes backgrounds including Syngenta, plant research, seed-company leadership, and Bayer CropScience. These profiles are company assertions and provide relevant domain experience, though independently verifiable employment histories and the operating roles of directors should be diligenced. The Israel Innovation Authority's public listing separately confirms Margalit, Sherman and Madari in management.

Competitive alternatives include in-house crop-editing programs at Bayer, Corteva and Syngenta, as well as focused developers such as Pairwise, Cibus, Tropic Biosciences and Phytoform. Large incumbents have seed distribution, breeding pipelines, regulatory teams and capital that a platform vendor may not match. Focused developers may compete for the same crop programs, licenses, talent and investor capital. BetterSeeds' possible edge is the combination of delivery, editing tools and trait development across crops, alongside an Israeli plant-science base and a regulatory-reviewed cowpea line. The edge is not yet established by published comparative data on editing efficiency, cost, time-to-market, partner repeat usage, field performance, licensing revenue or market share.

Commercially, the B2B model could scale through service fees, access fees, royalties or co-development, but the reviewed sources do not quantify revenue, profitability, cash runway, customer concentration or contract backlog. A government listing marks the company at initial revenues, without a dated amount. An older 2021 report described 25 employees and laboratory and trial-farm facilities; that historical staffing figure should not be presented as current headcount. Claims elsewhere of $334,000 revenue in 2024 and $1.4 million in 2025 were not verified in primary or reliable public filings and are excluded here. Similarly, no independently confirmed commercialization or paying customer evidence was located for the cowpea regulatory milestone.

Strategic relevance is strongest through civilian food-system resilience: improved crop adaptation, breeding capacity and more diverse seed portfolios can matter to agricultural continuity. No specific military, intelligence, weapons, or security customer or application was identified, so a defense dual-use thesis is not established. Key diligence should establish exact financing closes and grant amounts; audited revenue and margins; named customers and contract economics; replicated multi-location field data; seed multiplication, registration and route-to-market arrangements; freedom to operate and the status of patent families; regulatory treatment in target countries; and runway required to carry perennial or multi-season crop programs to market. Until those data are available, BetterSeeds is a technically differentiated but execution- and evidence-dependent early commercial-stage company."""
