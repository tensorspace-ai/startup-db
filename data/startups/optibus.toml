name = "Optibus"
description = "Optibus is a cloud-native software platform for public-transportation planning and operations, combining advanced optimization algorithms, machine learning, and workflow tools for agencies, operators, and shuttle providers. Its products cover network planning, scheduling, rostering, real-time control, passenger information, electric-fleet planning, and driver-facing operations."
detailed_description = """
Optibus is an Israeli-founded transportation-software company established in 2014 by Amos Haggiag and Eitan Yanovsky. Its core product addresses a difficult operations-research problem: building and continuously adjusting public-transport networks, timetables, vehicle blocks, driver duties, and rosters while satisfying interacting constraints such as service frequency, fleet availability, depot capacity, charging windows, labor agreements, driver preferences, and passenger demand. The company presents the platform as a unified, cloud-native operating system for public transportation rather than a single scheduling application. Current product materials describe planning, scheduling, rostering, operations, real-time control and monitoring, passenger information, a driver app, and the Optibus Agent, an AI workflow layer intended to help planners prepare and evaluate changes while retaining human review.

The customer base is principally public agencies, departments of transportation, private bus operators, and providers of airport, university, corporate, and event shuttles. Optibus says its platform is used in thousands of cities across more than 35 countries and reports that 7,000 cities are powered by the platform; the older Series D announcement described more than 1,000 cities in 2022, so the current figure should be treated as a company-reported coverage metric rather than independently audited revenue or customer count. The commercial value proposition is operational: reduce manual planning effort, compare network scenarios quickly, allocate vehicles and crews more effectively, react to daily disruption, communicate with drivers and passengers, and support the transition to electric buses. The company also reports that its tools have supported substantial emissions reduction, but the magnitude and attribution of those impact claims require customer-level diligence.

Optibus competes in a procurement-heavy market against established suites including GIRO HASTUS, Trapeze, IVU Traffic Technologies, PTV Group, and specialist or adjacent tools such as Remix and TransLoc. Its plausible advantages are a modern cloud delivery model, an integrated workflow across planning and operations, optimization-oriented product design, and experience handling the domain-specific constraints of mass transit. Those advantages do not eliminate switching, integration, data-migration, cybersecurity, or change-management barriers. Incumbents have deep installed bases and long customer relationships, while agencies may buy separate systems for scheduling, CAD/AVL, fare, passenger information, asset management, and payroll. Optibus therefore needs to prove implementation reliability, interoperability, measurable customer outcomes, and retention rather than relying on broad “AI” positioning.

The company announced a $100 million Series D in May 2022, bringing reported total funding to $260 million and a reported valuation of $1.3 billion. Its current site continues to identify major institutional investors and describes a global seven-office footprint; LinkedIn lists the company as privately held, founded in 2014, headquartered in New York, and in the 201–500 employee band, with a substantial Tel Aviv office. These are meaningful commercialization and organizational-scale signals, but public sources do not establish current revenue, profitability, net retention, backlog, or whether the company has raised a later round. Optibus is best treated as a late private growth company, not as a proven profitable or public-market business.

For defense and national-security analysis, the connection is indirect. Transit scheduling, fleet allocation, disruption management, and constrained logistics are technically adjacent to emergency mobility and civil-resilience planning, and the platform’s operational data and security controls could matter to critical public infrastructure. However, Optibus markets to civilian transportation organizations, and its optimization models are tailored to public-transit service, labor, passenger, and depot constraints. There is no reliable public evidence in the reviewed sources of defense customers, military deployments, or a defense product line. The record should therefore recognize limited resilience adjacency without forcing a military-use thesis.
"""
