name = "Eikolos"
description = "Eikolos is an Israeli deep-tech startup developing camera-based optical communication (OCC), in which cameras receive and decode data transmitted through visible or infrared light. Its commercial and HLS/defense applications aim to connect physical objects, people, and machines with low-power, line-of-sight identification and data delivery."
detailed_description = """
**Product and the concrete problem it solves.** Eikolos is building a communications layer for situations in which a camera already needs to observe an object and could also receive data from it. The company’s problem statement is that visual observation and digital communication are usually separate functions: a camera sees a light, sign, vehicle, person, machine, or marker, while an independent wireless system supplies identity or telemetry through a different channel. That separation can add hardware, latency, coordination overhead, and ambiguity when many nearby objects must be distinguished. Eikolos’ camera-based optical communication approach makes the image sensor part of the receiver. A light source transmits a programmable pattern, and a camera in its field of view detects that pattern and decodes it into data. The company describes products including compact transmitters with programmable identification codes and hemisphere coverage, a portable receiver able to observe multiple transmitters, and a receiver IP core that can turn an existing camera into an identification-friend-or-foe-style receiver. The result is not a general replacement for cellular, Wi-Fi, or tactical radio. It is a spatially bounded communication and identification channel that ties data to the exact object the camera is already looking at.

**Core technology and how it actually works.** Optical Camera Communication, or OCC, encodes information in controlled changes in light intensity or other light patterns that a camera can capture. Eikolos explains that the transmitter may use visible light, infrared light, or another camera-detectable optical source, while the receiver uses either a commercial off-the-shelf camera adapted with proprietary software or a purpose-built OCC CMOS sensor. The software identifies the pixels receiving the optical signal, separates that signal from the visual scene, and decodes the light pattern back into digital data. The company says its dedicated sensor can capture image and spatial data at the same time, with medium-to-high bandwidth, low power consumption, and pixel-level support even while the camera or target is moving. This combined perception-and-communication function is the important engineering proposition: a camera can retain its image while also receiving a digital identity or command associated with a particular light source. Because the channel is line-of-sight, it is naturally localized and can support multiple visible transmitters within one field of view. The public material does not establish a complete performance envelope for range, throughput under motion, sunlight tolerance, weather, occlusion, security, or false decoding. Those parameters are central diligence questions, particularly for defense and outdoor deployments.

**Market, customers, and go-to-market.** Eikolos presents two market tracks. In civil settings, OCC could support spatial data communication between phones, cameras, vehicles, machines, appliances, displays, and other objects that can see one another. The company’s earlier one-pager described possible Industry 4.0, automotive, retail, mobile-device, and augmented-reality applications, including communication among many moving users and nearby objects. The current website gives greater emphasis to an HLS and defense division, where an easily deployable optical channel could deliver critical information inside an operational zone. The most plausible initial route is business-to-business and business-to-government co-development with system integrators, camera manufacturers, electro-optics suppliers, and public-safety or defense users, rather than a direct mass-market device launch. Eikolos can offer an IP core to an existing camera supplier, a receiver and transmitter pair to an integrator, or a reference design for a customer that needs object-level identification. The India-Israel DRISHTI program provides a visible ecosystem route: a public program post describes Eikolos developing OCC for commercial and defense applications with support from T-Hub and Israel’s Directorate of Defense Research and Development. No named paying customer, production contract, recurring revenue, or completed defense procurement is publicly disclosed.

**Traction, funding, and third-party validation.** Public evidence places Eikolos in early technology development rather than scaled commercialization. Startup Nation Central’s public profile identifies the company as founded in May 2023 by Ofir Nichtern and Omer Cohen, headquartered in Atlit, operating with a 1-10 employee range, and in a pre-funding stage with undisclosed financing. The company’s own website confirms the 2023 establishment date, its Atlit address, the OCC focus, the civil and HLS/defense market split, the transmitter and receiver product concepts, and the two named current leaders. An Israeli government delegation page lists Eikolos among companies presenting optical communication solutions and describes the practical architecture: lightweight transmitters broadcast digital data through optical light sources, while a camera receiver uses an IP layer to locate the relevant pixels and decode the data. A company one-pager distributed through the Israel Economic and Trade Mission describes an early-stage demonstrator, simultaneous multi-peer communication, low latency, and potential mobile, industrial, automotive, and retail markets. The public record also includes an Israeli corporate-registration listing for EIKOLOS LTD, company number 516803574, incorporated in May 2023 and shown as an active Israeli private company. These sources establish identity, technical direction, and ecosystem participation. They do not establish independent test results, patent grants, investment amount, production volume, or commercial adoption, so the record should not treat the concept claims as validated field performance.

**Founders and team background.** The current official team page names Ofir Nichtern as CEO and Omer Cohen as CTO/COO, describing both as experienced electro-optics professionals. Startup Nation Central independently lists the same two people as co-founders and places the company in its aerospace, defense, and homeland-security taxonomy. Eikolos’ early one-pager presents the team as electro-optics and image-sensor specialists and includes Elad Ilan as VP R&D, with prior experience associated with SCD, Sony, Rafael, Israel’s defense R&D directorate, Thales, and Opgal; the current status of that broader team and the exact employer-to-person mapping should be verified directly. The team profile is strategically relevant because OCC sits at the intersection of image sensors, embedded software, optical design, communications protocols, and system integration. It is also a concentration risk: the public company profile suggests a very small organization, and the available disclosures do not show a large commercial, manufacturing, regulatory, or program-management bench. A credible next phase would require expanding from a proof-of-concept team into specialists who can qualify sensors, characterize optical links across environmental conditions, secure embedded firmware, manage component supply, and support customer integration without turning every deployment into bespoke engineering.

**Competitive dynamics.** Eikolos competes against both optical-communications specialists and established alternative channels. **1.** pureLiFi and Oledcomm develop LiFi or visible-light communications systems that transmit data through light, although their primary architectures generally use dedicated photodetectors or communications infrastructure rather than a camera that simultaneously performs scene perception. **2.** Signify and other lighting-network vendors can bundle visible-light communication into installed lighting systems, creating distribution and standards advantages in indoor environments. **3.** Elbit Systems and Rafael are incumbent Israeli electro-optics and defense-system integrators with the customer relationships, qualification processes, and platform access needed to absorb an optical identification function into a larger system. **4.** Wi-Fi, Bluetooth, UWB, RFID, and conventional IFF or tactical-radio equipment are entrenched substitutes wherever radio operation, tags, or dedicated antennas are acceptable. Eikolos’ potential edge is the co-location of visual recognition and optical data decoding: the system can associate an identifier with a visible object, avoid adding a separate receiver in some designs, and use spatial selectivity to reduce confusion among nearby transmitters. That is a design advantage, not yet a proven moat. Standards adoption, sunlight and weather performance, cybersecurity, camera compatibility, and the ability to meet customer cost and reliability targets will determine whether OCC becomes a product category or remains an interesting component technology.

**Defense, security, and resilience dual-use relevance.** Eikolos qualifies as dual-use because the same core mechanism is presented for civil human-machine interaction and for HLS/defense delivery of critical information within an operational zone. In a security setting, a camera-based receiver could potentially associate a digital identity with a vehicle, person, robot, beacon, or other visible object while preserving the camera’s normal imaging function. It could support local identification at checkpoints, machine-readable marking in crowded spaces, short-range coordination among robots or vehicles, or an optical friend-or-foe-style layer where a customer prefers a spatially constrained channel. Optical communication can also complement RF systems in places with spectrum congestion or where a customer wants information to be delivered only within a visible link, although the public record does not demonstrate anti-jamming, low-probability-of-intercept, encryption, covert operation, or battlefield deployment. The relevant resilience benefit is architectural diversity: a camera already used for perception can gain a second data path that does not depend on the same RF infrastructure as a radio or cellular link. The limitations are equally important. Line-of-sight, fog, dust, smoke, glare, occlusion, adversarial light sources, camera saturation, and deliberate spoofing can all affect reliability. Eikolos has publicly described defense intent and ecosystem support, but no fielded military system, government contract, security certification, or operational evaluation is confirmed.

**Growth stage, trajectory, and key diligence risks.** Eikolos is classified as **early** because the public record shows a 2023-founded, 1-10-person, pre-funding company with a technology demonstrator and ecosystem activity, but not repeatable commercial deployments or disclosed financing. The trajectory is attractive if the company can turn its receiver IP and reference hardware into an integration-friendly module for cameras, autonomous platforms, industrial equipment, and HLS systems. The principal diligence questions are: **1.** measured link budget, data rate, range, latency, and multi-transmitter accuracy under motion and outdoor illumination; **2.** performance in fog, smoke, dust, rain, vibration, and partial occlusion; **3.** whether the receiver can be integrated into common image sensors without unacceptable compute, thermal, or power cost; **4.** patent ownership, freedom to operate, protocol security, anti-spoofing, and any standards strategy; **5.** the status of the DRISHTI, T-Hub, and DDR&D/MAFAT activities and whether they produced a funded prototype or customer evaluation; **6.** manufacturing readiness, component availability, and the division between licensing and hardware revenue; and **7.** the team’s ability to support regulated defense and safety-critical deployments. Eikolos is therefore a strategically interesting Israeli deep-tech entry with credible dual-use adjacency and a differentiated technical thesis, but its priority should rise only after independent performance evidence, customer conversion, and financing or grant disclosure become available.
"""
