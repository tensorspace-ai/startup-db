name = "Avenas Nano"
description = "Avenas Nano is an Israeli nanomaterials startup, publicly branded Avenas, developing a passive nanoparticle material that reduces surface heat without power, moving parts, or opaque bulk. Its commercial thesis is to license the ingredient into existing films, paints, polymers, glass, vehicle materials, data-center thermal interfaces, and protective products, with a credible but early defense and resilience adjacency."
detailed_description = """
**Product and the concrete problem it solves.** Avenas Nano is addressing a deceptively basic infrastructure problem: buildings, vehicles, electronics, batteries, logistics containers, and outdoor equipment absorb heat, and the conventional response is to spend more electricity moving that heat away. The company says cooling already consumes roughly 10% of global electricity and that demand is increasing; whether the exact global figure applies uniformly is less important than the operational problem it identifies. Air conditioning, fans, refrigeration, and active thermal systems add power draw, maintenance, failure modes, and peak-load stress. Avenas' answer is Avenas Nano, a single nanoparticle that the company says can trap heat while remaining clear. The official site reports an approximately 10°C cooler surface in a laboratory comparison, with a thin, transparent formulation that consumes no energy. The target is not a new appliance. Avenas explicitly describes the material as an ingredient that manufacturers can mix into products they already make, including coatings, films, paints, dyes, polymers, and potentially thermal-interface materials. That positioning matters because adoption could occur through existing manufacturing and distribution channels rather than requiring customers to replace HVAC, vehicle, or equipment architectures.

**Core technology and how it actually works.** The most technically specific public description comes from an earlier Avenas investor and accelerator deck, where the material was called HYPERION, an acronym for a protective energy-reduction insulation nanocoating. That deck says thin inorganic nanostructures absorb electromagnetic radiation in the 7.5–14 micrometre infrared band and reports an approximately 10°C reduction in the temperature of a heated object. The current website presents the result more simply as a nanoparticle that traps heat and can remain clear, but does not disclose the particle composition, synthesis route, dispersion chemistry, coating stack, durability testing, or complete optical and thermal measurement protocol. The responsible interpretation is therefore a radiation-interaction materials platform with a promising lab result, not a fully characterized product. The company says the particles can be incorporated into transparent or opaque films and into existing products rather than sold only as a standalone coating. Its earlier deck also described polymer-layer experiments, spray and glass-mix-in variants, and possible data-center thermal-interface-material integration. The technical diligence questions are unusually concrete: spectral selectivity, solar-load behavior, emissivity and absorptance trade-offs, visible-light transmission, haze, particle dispersion, adhesion, weathering, abrasion, UV stability, fire performance, toxicity, recyclability, and whether the reported temperature delta survives scale-up and real outdoor boundary conditions.

**Market, customers, and go-to-market.** Avenas is pursuing a B2B and licensing-led route. The official site says it will license the cooling nanomaterial to manufacturers that already produce and sell paints, coatings, films, glass, textiles, and related products, allowing those partners to preserve their lines and add a performance ingredient. The older deck identifies North American commercial-building windows as an initial market and names 3M, Eastman Chemical Company, and American Standard Window Film as the type of strategic licensee it would approach; these are target-partner examples, not disclosed customers or partnerships. A second route in the deck is automotive film and vehicle materials, followed by data-center equipment and thermal-interface materials. The current sector list expands the possible application map to buildings, automotive and mobility, electronics and telecom, batteries, logistics, cold chain, agriculture and food storage, solar, marine, rail, aviation, defense, industrial manufacturing, urban infrastructure, and technical textiles. This breadth is strategically attractive but commercially dangerous: each segment has different qualification, warranty, regulatory, and channel requirements. A focused beachhead in window films or a thermal-interface formulation would provide a clearer proof point than attempting all 17 sectors at once.

**Traction, funding, and third-party validation.** Avenas has more public validation than a purely anonymous materials concept, but the evidence remains early. The Israel Innovation Authority lists Avenas Nano LTD as a cleantech company developing nanoparticle coatings for passive heat reduction, records five employees and an R&D stage, and names Vladimir Vinokur and Lena Yadgarov as CEO/co-founder and CTO/co-founder. That is an institutional ecosystem record, not proof of commercial deployment. Startup Nation Finder reports Avenas Nano as founded in January 2026, with 1–10 employees and $2 million across one pre-seed round from Earth & Beyond Ventures; the official company-registration trail identifies the Israeli legal entity as incorporated on January 27, 2026. Dealroom reported in December 2025 that Avenas won the inaugural Rhodium Ventures startup competition and received an investment commitment of up to NIS 6.5 million from Earth & Beyond Ventures, subject to due diligence. The company also publicly announced an Israel Innovation Authority grant through its LinkedIn presence. These records establish funding interest, government support, and active company formation, but they do not establish the amount of closed equity capital, revenue, production volume, paid customers, or a completed licensing agreement. The earlier deck said proof-of-concept experiments were underway, two patent applications had been submitted, and discussions with Israel Ministry of Defense DDR&D were in progress; those are historical company-plan statements and need present-day verification rather than being treated as completed milestones.

**Founders and team background.** Avenas is built around a scientist-commercializer pairing. Prof. Lena Yadgarov is identified by the company as a co-founder and nanomaterials pioneer whose work focuses on tailoring light-matter interactions for practical applications. The earlier deck lists her as a PhD scientist with an academic background deeply immersed in nanomaterials. Dr. Vladimir Vinokur is identified as co-founder and CEO; the company describes him as translating laboratory science into industry and the deck presents him as a PhD and MRSB with a molecular-biology background. Roy Matalon is listed on the current official site as a third co-founder responsible for the partner and licensing engine, adding the commercial operating role required by an ingredient-platform business. LinkedIn shows a very small organization, with a public 2–10 employee range and named employees including Vinokur, Yadgarov, and Ilana Simon; the Innovation Authority record lists five employees. This combination is credible for an R&D company at the lab-to-market transition, especially because the founding thesis requires materials science and industrial formulation rather than only software execution. It is also thin for simultaneous work across coatings, window films, automotive systems, data-center materials, and defense products. The team must build process engineering, quality, regulatory, manufacturing, and channel capabilities without losing control of the core IP.

**Competitive dynamics.** Avenas competes against several different classes of substitute rather than one direct peer. In window films and solar-control products, 3M's Prestige series, Eastman and LLumar films, Saint-Gobain and Solar Gard products, Huper Optik ceramic films, and SunTek offer established formulations, installed channels, and measured performance. In buildings, reflective roofs, low-emissivity glass, aerogel insulation, phase-change materials, and conventional HVAC are alternative ways to reduce heat load. In electronics and data centers, conventional thermal-interface materials, heat spreaders, liquid cooling, immersion cooling, and facility-level chilled-water systems compete for the same energy-efficiency budget. In defense, passive thermal camouflage and signature-management specialists such as Spectralx and Saab Barracuda address a different but adjacent requirement: reducing detectability rather than simply improving comfort or energy efficiency. Avenas' plausible edge is the combination of nanoscale formulation, optical transparency, passive operation, and an ingredient model that could fit incumbent manufacturers' lines. Its proposed approximately 10°C result, if independently reproducible at useful visible transmission and acceptable cost, could be meaningful. The edge is not yet a moat. Established suppliers have qualification data, warranties, manufacturing scale, and customer trust, while novel nanomaterials face dispersion, consistency, health-and-safety, and long-term-degradation questions.

**Defense, security, and resilience dual-use relevance.** Avenas' dual-use case is credible but should be scored as early component-level adjacency, not as an existing defense capability. The company’s own sector list includes Defense & Security under heat and signature management, and the Israel Innovation Authority lists military among the targeted sectors. A passive material that reduces surface temperature without power could help manage the thermal load of shelters, vehicles, batteries, electronics, communications equipment, logistics containers, and remote infrastructure. In a security context, thermal management can also reduce the heat signature presented to infrared sensors, although the public record does not establish that Avenas has achieved multispectral camouflage, military-grade signature reduction, or a fielded product. The strategic resilience angle is stronger and more general: lowering cooling demand can extend battery and equipment endurance, reduce dependence on grid power and active cooling, improve operation in hot environments, and relieve peak loads at data centers, hospitals, command facilities, and other critical sites. The older deck's references to Israeli Military Industries and negotiations with DDR&D show that the founders have considered a defense route, but they are not evidence of a contract, trial, or procurement. The honest assessment is that Avenas could become an enabling thermal and signature-management supplier if performance, durability, safety, and exportability are proven; today it remains a promising Israeli materials platform with defense relevance still to be demonstrated.

**Growth stage, trajectory, and key diligence risks.** Avenas is classified as early: the company is publicly associated with a 2025 founding, its Israeli legal entity was registered in January 2026, the Innovation Authority places it at R&D stage, and its public materials still emphasize laboratory results, partner conversations, and licensing plans. Its trajectory is legible. First, it must reproduce the thermal result under independent, standardized conditions and lock a formulation that remains transparent, stable, safe, and manufacturable. Next, it needs a narrow pilot with a film, coatings, automotive, data-center, or industrial-material partner, followed by qualification and a paid licensing or supply agreement. The central risks are: (1) **measurement risk**, because a lab temperature comparison may not translate into net energy savings in full systems; (2) **scale-up risk**, because nanoparticle synthesis, dispersion, coating uniformity, and quality control can change the result; (3) **durability and regulatory risk**, particularly for transparent films, vehicles, food storage, buildings, and protective equipment; (4) **commercial focus risk**, because a 17-sector application map can dilute a five-person team; (5) **incumbent channel risk**, since licensees will demand reliability, economics, and warranty support before changing mature products; (6) **IP risk**, because the public record refers to patent applications but does not provide publication numbers, ownership, claims, or freedom-to-operate analysis; and (7) **defense-adjacency risk**, because discussions with defense institutions may not become a fielded program. Milestones that would justify a higher assessment are an independently measured product result, a named manufacturing or licensing partner, disclosed patent filings, outdoor or accelerated-aging data, and a paid deployment in a critical-infrastructure or defense-adjacent environment.
"""
