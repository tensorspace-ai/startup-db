name = "AU10TIX"
description = "AU10TIX is an Israeli-founded identity intelligence and fraud-prevention company that provides automated identity, document, biometric, business, and compliance verification through cloud software and APIs. Its products serve regulated digital onboarding and trust workflows, with roots in airport and border-control identity systems."
detailed_description = """AU10TIX provides an enterprise identity-verification and fraud-prevention platform for organizations that need to establish whether a person or business is genuine before granting access, opening an account, authorizing a transaction, or continuing a regulated relationship. Its current portfolio includes an Identity Verification Suite, document and NFC verification, face comparison and passive liveness, deepfake and injection detection, address and age verification, AML and sanctions screening, business verification with ultimate-beneficial-owner checks, reusable digital identity, and Serial Fraud Monitor. The system is delivered through APIs, SDKs, web flows, and a management console rather than as a point solution for one narrow industry.

The commercial problem is persistent: banks, payment companies, marketplaces, gaming operators, crypto platforms, telecom providers, travel businesses, and workforce platforms must onboard legitimate users quickly while screening identity theft, document forgery, synthetic identities, account abuse, and compliance risk. AU10TIX says its technology supports more than 5,000 document types across 190-plus countries and reports automated verification in seconds; those are company claims and should be validated against customer-specific conversion, false-positive, manual-review, and fraud-loss data during diligence. Public customer stories identify brands including Payoneer, Fiverr, 888 Holdings, PayU, FXCM, Coinbase, and Saxo Bank, which is useful traction evidence but does not establish contract size, retention, or current revenue concentration.

AU10TIX competes in a crowded identity-verification market against Jumio, Entrust/Onfido, Veriff, Persona, Trulioo, Sumsub, Socure, and larger compliance or cloud platforms. Its plausible advantages are accumulated document intelligence, global coverage, integration experience, high-volume operating history, and network or traffic-level signals intended to identify coordinated repeat fraud rather than evaluating each submission in isolation. Its own materials also emphasize native intellectual property, Azure-hosted SaaS, ISO 27001 and ISO 27701 certification, and built-in compliance workflows. These signals support enterprise readiness, but they do not by themselves prove a durable moat: verification accuracy, latency, approval rates, explainability, privacy controls, regional coverage, and total cost of ownership are all measurable by customers and increasingly available from competitors.

The company has operated since 2002 and is not an early-stage independent venture. LinkedIn currently describes a privately held organization in the 51-200 employee band, while public corporate materials identify AU10TIX as a subsidiary of ICTS International. The record therefore treats it as a corporate-controlled asset rather than assuming an unverified Series B status. AU10TIX has the profile of an established growth software business with substantial operating history and commercial deployment, but public sources do not provide enough current information to assess recurring revenue, profitability, ownership economics, renewal rates, or the precise status of any historical preferred-share financing.

Dual-use relevance is credible but bounded. AU10TIX states that its roots include identity intelligence for airports and border control, and identity assurance, biometric matching, document authentication, and fraud-network analytics can support government access control, travel-document screening, critical-infrastructure enrollment, law-enforcement identity workflows, and financial-crime investigations. That adjacency is stronger than a generic cybersecurity analogy because the core capabilities are directly relevant to trusted-person and trusted-document decisions. At the same time, the public product and customer positioning is overwhelmingly commercial and compliance-led. No public evidence reviewed here establishes a current defense contract, classified deployment, or operational use by a security agency; such claims should not be inferred from the company’s origins."""
