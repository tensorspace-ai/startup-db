name = "Donisi Health"
description = "Donisi Health, formerly associated with ContinUse Biometrics, developed Gili Pro BioSensor, a contact-free optical device and software system for spot measurement of heart rate and respiratory rate. The company achieved FDA De Novo classification for the device, but current public evidence points to an inactive or wound-down operating position rather than a clearly active growth-stage startup."
detailed_description = """Donisi Health was an Israeli medical-device company founded in 2015 and publicly associated with the earlier ContinUse Biometrics name. Its core product, the Gili Pro BioSensor, used an optical module to capture motion-vibration signals from an illuminated surface and infer physiological information without electrodes, patches, or a wearable. The FDA De Novo decision for DEN200038 is specific and important: it classified a Class II hardware-and-software device for optical camera-based spot measurement of heart rate and respiratory rate, for adult patients in hospital, outpatient, medical-care, or clinical-research settings under professional supervision. That is a meaningful regulatory and engineering milestone, but it should not be expanded into a claim that every advertised cardiopulmonary parameter or home-monitoring outcome was FDA-cleared.

The technology mattered because it targeted a real source of friction in remote and repeated measurement. A seated patient could be measured without attaching sensors, which could improve setup time, comfort, adherence, and infection-control logistics in selected workflows. Company and ecosystem materials also described a broader platform involving a tabletop device, cloud services, a mobile application, and dashboards, with research and commercial messaging around chronic heart failure and pulmonary-congestion monitoring. Those broader claims are relevant product context, not proof of current deployment, reimbursement, clinical utility at scale, or a durable moat. The defensible technical questions are calibration against clinical reference devices, performance across lighting and clothing conditions, motion tolerance, demographic robustness, false-alert rates, cybersecurity, and the repeatability of the complete hardware-software workflow rather than an isolated laboratory result.

Historically, Donisi attracted substantial ecosystem attention. Public startup databases describe a 2016 seed round, a 2018 Series B associated with ContinUse Biometrics, later convertible-debt activity, strategic and venture participation, and recognition in Israeli medical-innovation competitions. Public materials also referenced patents, clinical validation work, a BIRD-supported development relationship involving Dell, and FDA progress. These signals establish that the company reached a serious development and regulatory stage; they do not establish current revenue, active customers, manufacturing scale, an operating team, or a successful transition from pilot projects to repeatable sales. Public headcount estimates are inconsistent, and the company website no longer passed a current DNS/HTTP check during this review.

Competitive pressure was structurally high. Donisi’s non-contact approach competed with conventional clinical monitors, adhesive and wearable remote-patient-monitoring devices, radar and camera-based vital-sign systems, and better-capitalized digital-health platforms that already owned provider relationships and data workflows. A successful commercialization path would have required not only measurement accuracy but also clinical workflow integration, regulatory maintenance, procurement approvals, data protection, support infrastructure, and a clear economic case for avoiding visits or readmissions. The available public record does not show enough current evidence to determine whether those hurdles were overcome.

The dual-use case is technically plausible but should remain bounded. Contact-free heart and respiratory-rate sensing could support operator or driver safety, emergency triage, austere-care monitoring, and continuity-of-operations workflows where attaching sensors is slow or impractical. However, the public sources reviewed describe healthcare and safety applications, not defense contracts, classified work, military validation, or deployment with security agencies. The strategic value is therefore historical and capability-based: Donisi is a useful Israeli example of optical biosensing moving through medical-device regulation, while its present investibility and operational availability are impaired by the unresolved corporate and website status. Any renewed diligence would need to confirm legal status, asset ownership, IP control, product availability, regulatory maintenance, customer contracts, and whether a successor entity is commercializing the technology."""
