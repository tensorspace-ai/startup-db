name = "Opora"
description = "Opora Technologies was an Israeli cybersecurity company whose product evolved from external, pre-compromise adversary intelligence toward cyber supply-chain risk analysis. It raised a $2 million seed in 2019 and a $7 million JVP-led seed in 2020; CTech later reported around $10 million raised in total. In June 2023, the company said early pilots had not matured into a commercial product, and its Israeli company record is now listed as voluntarily liquidated."
detailed_description = """Opora Technologies was an Israeli-founded cybersecurity startup associated with former Shin Bet director Yuval Diskin. It emerged from Diskin Advanced Technologies (DAT), initially operating in stealth and later presenting the OPORA Adversary Threat Protection platform. The public chronology is not clean: CTech reported an Opora incorporation in 2016, JVP and Globes said it was formed in 2018, and a 2023 company statement described it as established in 2020. A company-record mirror associates the legal name OPORA TECHNOLOGIES LTD with a 2012 registration date, which may reflect an earlier DAT vehicle; that linkage has not been established from a certified registry extract. This record therefore treats 2018 as the reported startup formation date while preserving the legal-date disagreement.

The early product thesis was to observe cyber adversaries outside a customer’s network, identify preparation behavior and attack infrastructure, estimate whether an organization was being targeted, and push preventive actions into existing security controls. JVP’s investor announcement described a continuously updated view of adversary infrastructure and containment workflows, with an ambition to warn days before an attack campaign. These are company and investor descriptions, not independently measured detection lead times. The product did not rely only on the classic perimeter or endpoint telemetry model: its proposed value was to connect external signals about actor behavior, infrastructure, targets, and readiness to a customer-specific response. That architecture could make an existing SOC more anticipatory, but only if the underlying observations were timely, attributable, legally usable, and sufficiently precise to trigger action.

Evidence suggests the product was later presented more broadly as cyber risk quantification across the business ecosystem and supply chain. A TASE-hosted executive CV describes Opora from 2022 onward as assessing operational risk from cyber threats to suppliers using automated cognitive analysis, expert input, business-impact estimates, and prioritized recommendations. A product-design case study describes a management interface that attempted to explain risk scores across an organization, subsidiaries, suppliers, geography, and industry, then connect the score to potential financial, reputation, or productivity losses and a remediation plan. The case study is evidence of a designed user experience, not proof that the feature set shipped or that its scoring was independently validated. The apparent shift broadened the addressable workflow from adversary monitoring to enterprise and third-party cyber-risk prioritization, but also placed the company closer to established security-rating, attack-surface, and third-party-risk platforms.

The customer record remains ambiguous. JVP’s 2020 release said the company was validating technology with organizations in Germany, the United Kingdom, and the United States in banking, utilities, manufacturing, and pharmaceuticals; it also said an initial MVP had reached market and that a Securonix sales and delivery channel had been initiated. A TASE-hosted executive CV later listed customers in energy, healthcare, food, and communications but did not name organizations, contract values, or whether these were paying production accounts. In June 2023, Opora told CTech and Globes that it had run first customer pilots but had not matured the technology into a commercial product. These statements can coexist if “customers” referred to pilots, but the public material does not resolve the commercial status. No named production deployment, renewal, annual recurring revenue, or independently confirmed customer outcome was found.

The shutdown evidence is more decisive than an inactive website alone. In June 2023, CTech reported that most employees had been laid off, the company was sharply reducing activity, and it was considering offers to buy the technology. The company’s own statement said the pilots had not become a commercial product. CTech reported a peak workforce above 20. A third-party Israeli company-record mirror now labels OPORA TECHNOLOGIES LTD voluntarily liquidated and displays accelerated dissolution/elimination events in 2025; because the mirror disclaims the accuracy of aggregated records and translations, formal status should be verified against an official extract if any asset transaction is pursued. The historical opora.io domain currently redirects to a GoDaddy sale page, so it is not a functioning official company site.

Competitive substitutes span several layers rather than one exact peer group. Recorded Future combines external and internal telemetry in a broad threat-intelligence graph; Censys maps internet-facing hosts, domains, certificates, and services; SecurityScorecard combines security ratings, third- and fourth-party monitoring, and threat-informed supplier workflows. Opora’s proposed distinction was an earlier, adversary-centered warning signal joined to business-ecosystem impact, rather than only a rating of observed exposure or a broad intelligence feed. The distinction could be compelling when it identifies a target-specific attack before ordinary indicators appear. It would be weak if its data mostly restated commodity threat feeds, public exposure scans, or vendor ratings without better attribution, lead time, or response outcomes. Large incumbents also bring broader data, integration ecosystems, procurement credibility, and continuing investment that a small company would have had to overcome.

The technical diligence problem is unusually demanding. “Pre-compromise” is an outcome buyers cannot easily observe in the counterfactual: a blocked attack does not prove that an alert was early or accurate. A surviving implementation would need to show source provenance and licensing, actor-to-infrastructure resolution, target relevance, confidence calibration, false-positive rates, alert lead-time distributions, and a defensible method for translating technical indicators into business loss. Adversaries rotate infrastructure, use compromised third parties, and deliberately generate noisy indicators. If the product’s later cognitive scoring depended on opaque or stale supplier graphs, executives could receive persuasive but misleading rankings. An integration that blocks traffic or changes controls also requires reversible actions, audit trails, and clear customer authorization; alert-only value would face a different willingness-to-pay threshold.

The founding group combined relevant security experience with enterprise software experience: Diskin led the Israeli Security Agency for six years; Noam Jolles and Tsafrir Kats were described as former senior ISA figures; Chris Bell was described by JVP as a Securonix co-founder and CEO. A TASE-hosted CV also records Ronen Lago as Opora CEO and board member from 2022, with prior senior technology/security roles at Lockheed Martin and Daimler. These credentials support domain access and enterprise context, but they do not substitute for repeatable product-market fit. The 2023 commercialization outcome is the strongest observed evidence about execution, and the public record does not establish which technical assets, customer relationships, or personnel survived.

Commercially, the original enterprise problem was real: security teams need earlier warning and must prioritize finite response capacity across suppliers and business dependencies. The main failure risk was converting a technically ambitious intelligence concept into a product with reproducible precision, a clear buyer, a short proof cycle, and measurable return on investment. Named customers, revenue, margins, burn, runway, and conversion rates are unavailable. The company’s announced Securonix channel is a distribution signal, not proof of a signed reseller contract or revenue. The 2023 statement that pilots failed to mature is direct evidence that interest did not become a durable product during the reported period.

Dual-use relevance is credible at the capability level. Earlier warning about cyber targeting could support commercial enterprises, public agencies, defense suppliers, and critical infrastructure, while supplier-risk analysis could help protect connected government and industrial ecosystems. The founders’ security-service experience adds contextual expertise, but there is no verified evidence of military or intelligence deployment, government contracts, classified use, or defensive operational outcomes. No defense thesis should be inferred from founder backgrounds or from the fact that the product used intelligence language.

For strategic or asset-level review, the priority is to establish whether any buyer completed a technology purchase and who now controls the code, models, source data, trademarks, customer information, and contractual rights. CTech reported only that offers were being considered in June 2023; no completed acquisition or IP transfer was identified. Any surviving asset would need an independent review of data rights, privacy and collection permissions, reproducibility, model validity, customer obligations, and the ability to rebuild integrations. As a standalone company, Opora is a wound-down entity with no substantiated going-concern case. Its record is useful for evaluating preemptive cyber defense and commercialization, while any residual value is conditional on verifiable assets and transferable rights."""
