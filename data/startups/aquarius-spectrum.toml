dual_use_description = """AQS’s core product monitors water distribution networks for leaks, bursts, and abnormal pipe conditions, which has clear civilian value in reducing water loss and sustaining municipal supply. The same early-warning capability can support resilience at sensitive facilities and critical water infrastructure, where a burst or prolonged leak can interrupt service. AQS’s own timeline says it won a tender to monitor leaks on Israeli Army bases in 2018, but public material does not disclose the contract scope, value, duration, or current status. The product remains a commercial utility-monitoring system; no public evidence establishes classified deployments, defense-grade cybersecurity, anti-tamper design, or military operational integration. Its security relevance is therefore a conditional infrastructure-protection application rather than a weapons or defense-prime thesis."""

key_technologies = ["Fixed acoustic accelerometers and correlating sensors", "Hydrophone sensing for large transmission mains and plastic pipes", "Multi-spectral cross-correlation and synchronized acoustic sampling", "Cloud-based AQS-SYS analytics, GIS, alerts, and leak classification", "Mobile iQ100B acoustic survey hardware and phone/tablet application", "CAT-M and NB-IoT connectivity for fixed sensors", "Human review and utility support for interpreting alerts and planning repairs"]

