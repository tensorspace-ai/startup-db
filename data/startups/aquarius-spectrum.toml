name = "Aquarius Spectrum"

description = "Aquarius Spectrum, now marketed as AQS by Aliaxis, develops acoustic sensing hardware and software for detecting, locating, and prioritizing leaks in municipal water networks. It is an acquired operating asset rather than an independent venture-backed startup, with a credible but conditional critical-infrastructure resilience adjacency."

detailed_description = """
Aquarius Spectrum builds an integrated leak-management stack for water utilities. Its fixed AQS-Edge and AQS-Sense products use correlating acoustic sensors and hydrophones installed on or near pipes; the iQ100B is a wireless mobile survey instrument for field teams. The AQS-SYS platform receives synchronized recordings, applies multi-spectral correlation and filtering, represents results in GIS, and supports alerts, heat maps, acoustic playback, and work-management workflows. The company says its system can estimate leak intensity, classify events, and locate leaks with substantially tighter accuracy than simple noise loggers. Those claims are technically plausible for acoustic correlation, but performance remains dependent on pipe material, sensor spacing, background noise, installation quality, and the utility's operating procedures.

The core customer is a municipal or private water-network operator trying to reduce non-revenue water, energy and treatment waste, emergency repairs, and premature pipe replacement. The offering supports both continuous monitoring and targeted mobile surveys, which is commercially useful because utilities often need to combine scarce specialist labor with increasingly instrumented networks. Public company material identifies deployments or case studies involving Netanya, Jerusalem's Hagihon, SUEZ, American Water, A2A Ciclo Idrico, and other international operators; the database should treat these as disclosed examples rather than evidence of a complete customer list. A 2023 A2A case study reported 180 sensors covering 50 km in Brescia and a reduction in reported water losses from 32% to 28%, while Aliaxis reported 38% overall business growth for AQS in 2023. These are company or parent-reported outcomes and warrant customer-side validation before being used in an underwriting model.

Aquarius Spectrum was established in 2009 at the Kinrot incubator and was acquired by Aliaxis in August 2022. The acquisition placed it in Aliaxis Next and provides industrial distribution, channel access, and manufacturing relationships that a small standalone vendor would lack. The company subsequently introduced the iQ100B, refreshed its identity as AQS, announced an ISO/IEC 27001:2022 certification in 2025, and continues to publish product and market material. Its competitive set includes acoustic specialists such as Gutermann and HWM, network analytics providers such as TaKaDu and VODA.ai, and broader metering, AMI, and water-management platforms from Xylem, SUEZ, and other incumbents. AQS's differentiation is the combination of acoustic correlation, fixed and mobile modalities, pipe-agnostic positioning claims, and field-service support; its constraint is that utilities may prefer a single incumbent platform or a lower-cost survey workflow.

The strategic case is strongest in water security and infrastructure resilience, not weapons technology. Continuous acoustic observability can shorten detection time for bursts, unauthorized taps, accidental damage, or service disruption at a sensitive facility, and the company's history of monitoring Israeli Army bases is a relevant disclosed signal. However, the commercial product is designed for civilian water utilities, and no evidence here establishes military-grade deployment, classified use, anti-tamper assurance, or a defense contract. A serious security deployment would require threat-modelled communications, identity and access controls, resilient local operation, incident integration, data governance, and independently tested cyber and physical protections. The acquisition, modest disclosed pre-acquisition revenue, uncertain current headcount, municipal procurement cycles, and reliance on parent-company strategy make this a strategic-technology reference and diligence subject rather than an investible startup priority.
"""

