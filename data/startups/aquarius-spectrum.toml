name = "Aquarius Spectrum"

description = "Aquarius Spectrum, now operating as AQS by Aliaxis, supplies fixed and mobile acoustic leak detection, pipe-condition monitoring, cloud analytics, and analyst support to water utilities. A2A’s continuing Brescia deployment provides customer-side evidence of operational use; Aliaxis ownership and limited standalone disclosure make this an acquired infrastructure-technology asset rather than an independent startup opportunity."

detailed_description = """Aquarius Spectrum Ltd. is an Israeli water-technology company marketed as AQS by Aliaxis. Its business is a combined equipment, software, and service offer for municipal and privately operated drinking-water networks. AQS sells fixed sensors and hydrophones, mobile survey devices, the AQS-SYS cloud platform, and ongoing analysis and operational support. It serves utilities that need to identify hidden leaks, reduce non-revenue water, prioritize pipe repairs, and monitor large transmission mains without excavating the network to install each sensor.

The fixed system samples acoustic vibration at night, sends recordings to the cloud, and correlates synchronized samples across sensors. The product pages describe 16-to-20-second daily recordings, multi-spectral filtering, leak classification and intensity estimates, and map-based location output. Accelerometers and hydrophones are selected according to pipe material, diameter, and installation point. AQS-Sense and AQS-Edge cover fixed monitoring; AQS-Ultra is the newer fixed family; iQ100B adds a mobile survey instrument that records and reviews acoustic samples through a phone or tablet app. The system’s value is the operational loop around the sensor: data capture, automated correlation, analyst review, map and alert presentation, and repair prioritization. Company materials quote location accuracy from about one metre to three metres depending on the page and product context, so the practical accuracy claim needs to be tested by pipe type, sensor spacing, background noise, and field protocol rather than treated as a single guaranteed specification.

Commercial evidence spans more than one type of deployment. A2A Ciclo Idrico’s 2020 release confirms that it moved the Aquarius project from a pilot to wider use in Brescia, initially installing 170 sensors over 50 km. Its March 2026 update reports 1,265 Aquarius sensors monitoring more than 320 km and 226 detected leaks repaired. A2A attributes the city’s broader 2017-to-2025 water-loss reduction and 5.4 million cubic metres saved to a combined programme of districting and sensors, not to AQS alone. AQS and Aliaxis also published a project estimate of 1.4 million cubic metres and about €560,000 saved annually for the Brescia deployment; that estimate uses assumptions about leak size and leak duration and is not an audited AQS revenue or independently isolated causal effect. Aliaxis reported 38% growth in AQS’s overall business during 2023 and expansion into cities in New York, New Jersey, and Pennsylvania, but disclosed neither the revenue base nor the metric definition.

The company’s chronology records early Netanya and Hagihon deployments, SUEZ orders, an American Water contract, a 2021 PUB Singapore tender, and a 2018 tender to monitor leaks on Israeli Army bases. Those entries are company-reported unless a customer source is cited; the Army-base reference establishes a stated leak-monitoring procurement signal but says nothing about contract value, term, current status, or military-grade performance. In 2024, AQS announced a nationwide US distribution and service agreement with Ferguson Waterworks, and a separate collaboration with VODA.ai to combine acoustic leak findings with pipe-condition analytics. Distribution agreements and partnerships improve reach but do not by themselves prove recurring sales, production volumes, or customer economics. The company announced iQ100B in 2023, AQS-Ultra in Italy in 2025, and ISO/IEC 27001:2022 certification in February 2025; the certification announcement does not disclose the scope statement or independent audit record.

Aliaxis acquired Aquarius Spectrum in August 2022 and placed it in Aliaxis Next. Aliaxis disclosed annual revenue below €5 million at acquisition and said purchase terms would not be disclosed. Its industrial portfolio, channel access, and the Ferguson relationship can help a specialist vendor reach utility buyers and support installations across markets. The operating asset appears active through its current product catalogue, July 2026 CEO appointment, current Yakum contact details, and ongoing customer references. It is not an independent financing candidate, and Aliaxis does not publish current standalone revenue, margins, customer concentration, renewals, or headcount.

The competitive field includes direct acoustic vendors and broader digital-water platforms. Gutermann’s permanent network monitoring and correlating loggers, HWM’s PermaNet acoustic telemetry and leak-location products, and Sensus/Xylem’s acoustic monitoring integrated with its FlexNet network all address overlapping utility budgets. TaKaDu analyzes SCADA, meter, and sensor data across the network and can complement acoustic equipment while competing for analytics and operations workflows. VODA.ai’s pipe-condition risk platform is described by AQS as a complementary partner. AQS’s strongest differentiation is the packaged combination of fixed and mobile sensors, large-main hydrophones, correlation analytics, human review, and water-utility service. It must still prove that its total installed and service cost, detection rate, false-alert rate, and repair conversion beat alternatives in each utility’s network conditions.

The technical and strategic case is credible but evidence is uneven. Multi-sensor acoustic correlation is a concrete sensing method, and patent records include claims on spectral correlation, synchronization, burst monitoring, and pipe-condition classification. AQS reports 21 patents, with 12 granted and nine applications pending, while public records identify several US grants; a complete family-by-family status and post-acquisition rights map is not available here. Its use of a cloud platform, cellular connectivity, and human review creates operational value but also makes network availability, account security, data governance, and field support part of the deployment risk. The company’s water-security relevance comes from earlier leak discovery and faster response in systems that communities and critical facilities depend on. That is a meaningful resilience application, but public evidence does not establish classified use, defense-grade hardening, or a defense contract. Utility procurement is fragmented and slow, acoustic results vary with network conditions, and the business depends on hardware deployment and service capacity as well as software. Current diligence should focus on contract-level economics, independent detection benchmarks, current Aliaxis investment priorities, and the legal status and ownership of the patent portfolio."""

