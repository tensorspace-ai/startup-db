investible = false

investment_rationale = """The technology has a clear operational problem, a specific sensing stack, and a useful combination of fixed monitoring, mobile surveys, analytics, and analyst support. A2A’s customer-side disclosures confirm a continuing deployment at meaningful scale, while Aliaxis reported 38% business growth for AQS in 2023 and Ferguson offers a broad US distribution channel. The commercial case remains difficult to underwrite because standalone revenue, margins, contract values, renewal rates, customer concentration, and deployment costs are not disclosed. Aliaxis acquired the company in 2022, so any investment exposure is through its parent rather than a new independent startup round. Treat it as an acquired asset to diligence for strategic partnerships or capability sourcing, not as a direct startup investment."""

strategic_value = """AQS can strengthen water-system resilience by moving leak discovery earlier, prioritizing scarce field crews, and reducing the time hidden failures go unrepaired. The sensor-plus-analyst model may be particularly useful for utilities with long networks, limited acoustic expertise, or large transmission pipes that are difficult to survey manually. Aliaxis ownership and Ferguson’s distribution agreement create a plausible route to broader service and channel coverage. For critical-site deployment, strategic value depends on independently measured alert quality, resilient local operation, clear data ownership, cyber controls, and integration with the utility’s repair and incident processes. The public record supports water preservation and infrastructure monitoring; it does not support claims of hardened or classified capability."""


