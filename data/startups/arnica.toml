]
investible = false
investment_rationale = """
Arnica is a credible private enterprise-security startup with a relevant product problem, visible commercial packaging, and a timely position around governing AI-assisted software development. It is not marked as a priority signal for this database because the available evidence does not establish a differentiated moat, current financing beyond the reported 2022 seed round, durable customer economics, or a defense-specific route to market. Its broad feature surface also places it in direct competition with well-funded AppSec suites and platform vendors that can bundle similar controls.

The most important diligence questions are whether Arnica's pipelineless deployment produces materially higher code coverage than CI-centered alternatives, whether its contextual prioritization reduces false-positive workload, and whether automated fixes are safe enough for production use. A buyer or strategic reviewer should also test retention, expansion, scanner accuracy by language and framework, AI inference costs, data handling for proprietary source code, and the proportion of revenue attributable to repeatable product workflows rather than services. This classification is a strategic diligence assessment, not an investment recommendation.
"""
strategic_value = """
Arnica's strategic value is as a control point for software production. As engineering organizations adopt AI coding assistants, a platform that can inventory where AI is used, apply secure coding rules at generation time, scan resulting changes, and route fixes to developers could help security teams preserve governance without blocking delivery. Its coverage of dependencies, secrets, IaC, containers, and reporting also maps to software-supply-chain assurance requirements that matter across regulated industries.

For national-security users, that value is enabling rather than mission-specific. Arnica could reduce exposure in contractor and critical-infrastructure development environments, subject to deployment, data-residency, procurement, and accreditation requirements. There is not enough public evidence to assign strategic value based on government adoption or privileged cyber capabilities, so its relevance should remain moderate and conditional on customer and deployment diligence.
"""
