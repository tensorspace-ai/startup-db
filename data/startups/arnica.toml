name = "Arnica"
description = "Arnica is an application security platform that continuously scans source changes and software supply chains, prioritizes risk, and applies developer-facing governance and remediation workflows to both human- and AI-generated code."
detailed_description = """
Arnica sells an application security posture management and developer-workflow platform for organizations that need visibility across source repositories, dependencies, infrastructure-as-code, secrets, licenses, SBOMs, and container images. Its current product positioning adds an AI-development governance layer: the Agentic Rules Enforcer injects centrally managed security requirements into tools such as GitHub Copilot, Cursor, and Claude Code, while AI SAST is intended to reason about code meaning and intent in addition to deterministic pattern checks. The platform also supports real-time branch and push scanning, pull-request controls, risk ownership, and automated or AI-assisted fixes.

The practical customer problem is not simply finding vulnerabilities; it is converting a large, noisy backlog into fixes that developers will actually make. Arnica emphasizes a pipelineless model, integrations with GitHub, GitLab, Bitbucket, and Azure DevOps, and delivery through pull requests, Slack, Microsoft Teams, Jira, and Azure DevOps Boards. Its product pages describe prioritization using organizational context alongside CVSS, EPSS, and KEV signals, source-to-image mapping for containers, dependency reachability, secret validation and mitigation, and reporting for compliance or customer reviews. A free visibility tier and paid workflow and governance capabilities indicate a land-and-expand commercial motion, although public pricing and product claims are not substitutes for independent efficacy or retention evidence.

The market is attractive but intensely contested. Arnica overlaps with SAST and SCA vendors such as Checkmarx, Veracode, Snyk, Semgrep, and Mend, with ASPM and developer-security platforms such as Legit Security, Apiiro, and ArmorCode, and with native controls from GitHub Advanced Security and cloud providers. The product therefore has to win on more than scanner breadth. Its proposed advantage is the combination of continuous coverage without a CI/CD-only deployment model, contextual triage, developer-native notifications, automated mitigation, and controls for AI-generated code. These features can reduce the organizational cost of AppSec if they produce fewer false positives and faster remediation, but they are also exposed to rapid feature replication by larger vendors.

There are credible commercial maturity signals, but they remain largely company-reported. Arnica says it is trusted by more than 100 companies and publishes current operating counters for code pushes scanned, risks found, and developer hours saved. It maintains a free product path, paid business and enterprise plans, a public documentation site, an open careers page, and security materials describing SOC 2 Type 2 compliance and an ISO 27001-aligned program. Its About page says it has been named a representative vendor in several Gartner 2025 hype-cycle materials, which is useful visibility but not a customer-validation or market-share metric. LinkedIn lists 11–50 employees and a private-company profile; a 2022 Atlanta Business Chronicle report publicly described a $7 million seed round. Current revenue, retention, customer concentration, gross margin, and total funding are not established by the available sources.

The national-security case is indirect. Defense contractors, government software teams, and critical-infrastructure operators face the same software-supply-chain, secret-management, dependency, and AI-code governance problems as commercial enterprises, so Arnica could improve baseline software assurance in those environments. Its on-premises option and audit-oriented controls may be relevant during diligence. However, there is no verified evidence here of defense contracts, government deployment, classified-environment accreditation, sovereign hosting, or mission-specific cyber capability. Arnica should therefore be treated as a commercial AppSec infrastructure company with modest dual-use adjacency, not as a defense technology provider.
"""
