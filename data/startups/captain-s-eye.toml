name = "Captain's Eye"
description = "Captain's Eye is an Israeli maritime-AI startup that turns existing vessel and infrastructure cameras into a real-time safety, security, and operational-risk detection layer. Its software is designed to alert crews and remote fleet managers to smoke, leaks, unsafe behavior, unauthorized access, equipment failures, and other events before they become costly incidents."
detailed_description = "**Product and the concrete problem it solves.** Captain's Eye addresses a specific operational gap in shipping and maritime infrastructure: vessels, terminals, and industrial sites already generate enormous volumes of camera footage, but crews and remote managers cannot watch hundreds of feeds continuously or reliably recognize every precursor to an accident. The company sells a software platform that monitors those existing cameras and surfaces actionable events rather than asking an operator to review video after damage has occurred. Its public product materials describe detection of smoke, leaks, fire, unauthorized personnel, personal-protective-equipment violations, unsafe crew behavior, security violations, and equipment failures. This is a prevention and continuity proposition. A missed leak can become pollution, cargo damage, or an engine-room emergency; an unsafe maneuver can become an injury; an unobserved intrusion can become theft or sabotage; and a delayed response to a machinery problem can take a vessel or port asset out of service. Captain's Eye's intended outcome is earlier intervention, with onboard crews and off-board fleet managers receiving a prioritized alert, associated evidence, and a way to coordinate action. The product is therefore more than generic video surveillance and less than autonomous control of a ship: it is an AI-assisted risk-management and operational-awareness layer.\n\n**Core technology and how it works.** The technical architecture described by the company combines custom neural networks and commercial AI models fine-tuned for maritime environments. Live feeds are processed onboard, with only the necessary information transmitted to the cloud, a design that reduces bandwidth demand and supports remote monitoring over constrained ship-to-shore links. The platform can use a customer's existing CCTV estate and, in the company's broader product description, can incorporate radar and thermal sensors rather than requiring a completely new sensor installation. Captain's Eye says its software continuously analyzes video, detects events in real time, creates alerts, supports remote management, stores documentation, and harvests data for later analysis. The workflow includes customizable alert rules so that the right information reaches the right person, digital inspections with automated reports, policy-execution tools for assigning and documenting safety drills, and predictive analytics based on historical data and environmental conditions. The engineering value is in assembling these pieces into a maritime workflow: low-latency inference close to the camera or vessel, bandwidth-aware event transmission, a fleet-level dashboard, and a feedback loop in which site-specific conditions can be tuned. The public record does not disclose model architectures, training-set size, precision and recall by event class, inference hardware, cybersecurity controls, or formal safety-case methodology. Those omissions matter because glare, spray, darkness, vibration, occlusion, camera placement, and unusual ship layouts can all change the reliability of visual detection.\n\n**Market, customers, and go-to-market.** Captain's Eye began in maritime operations and now also markets an onshore offering for industrial plants and critical infrastructure. The company's own materials identify merchant vessels, yachts, cruise ships, maritime industrial plants, ports, petrochemical facilities, and gas platforms as relevant environments. The likely buyer is a fleet owner, ship manager, terminal operator, offshore operator, or industrial safety organization that already owns cameras and wants to improve the value of that installed infrastructure without a large hardware retrofit. Captain's Eye's proposition is particularly suited to a partner-led enterprise sale: prove the system on one vessel or at one port, tune alerts against real operating conditions, then expand across a fleet or facility group. Public reporting confirms a strategic partnership with XT Shipping and a pilot at Ashdod Port. The company's current site includes a testimonial from an executive at EPS saying Captain's Eye is integrated across almost the entire fleet, but it does not identify the fleet size or publish a contract value, so that should remain a company-reported reference rather than an independently verified customer metric. The Ashdod Port relationship is strategically useful because the port has an innovation program that tests technologies in live operational conditions and connects selected companies to international port networks. International expansion is plausible, but ports and shipping companies have conservative procurement cycles, complex connectivity constraints, and high requirements for evidence that alerts reduce incidents without adding operator burden.\n\n**Traction, funding, and third-party validation.** Captain’s Eye has two publicly documented strategic financing events. CTech reported a $4 million strategic investment from SixAI in June 2022. In September 2025, Captain’s Eye announced completion of a Series A with strategic investors Eastern Pacific Shipping (EPS), MOL PLUS (Mitsui O.S.K. Lines group), and The Caravel Group; Splash247 independently reported that the round terms were not disclosed. The company has not published a lifetime funding total, so the 2022 amount should not be treated as total capital raised. The 2025 investor group represents commercial shipping relationships as well as financing: the company says those groups own or manage more than 1,700 vessels, but does not disclose their ownership percentages or board arrangements. Captain’s Eye’s October 2025 release marked a 100th system installation across EPS’s fleet. In May 2026, Digital Ship reported Pacific Basin selected the platform for deployment across more than 100 Handysize and Supramax vessels; that report establishes a rollout decision, not independently audited completion, contract value, or recognized revenue. Earlier evidence includes a reported XT Shipping partnership and Ashdod Port pilot, while Ashdod Port’s 2024 CSR report continued to describe the product as an AI system for real-time detection of safety incidents and environmental threats. The official site reports more than 5,000 cameras monitored around the clock, more than 100,000 events detected, a 40% improvement in response time, and a 15% increase in operational efficiency. These figures remain company-published and lack a disclosed methodology, baseline, time window, and independent audit. Current revenue, customer count, retention, valuation, precise Series A proceeds, patent portfolio, and formal certification remain unconfirmed in the public sources reviewed. The record therefore supports a stronger commercial adoption signal than the earlier pilot-only account, while keeping the scale and performance claims qualified.\n\n**Founders and team background.** The founders' backgrounds fit the problem unusually well. Uri Ben Dor is described by the company as a former missile-ship captain and former head of business operations in the Israeli Navy, giving him first-hand familiarity with shipboard procedures, watchkeeping, crew coordination, and the consequences of delayed decisions in high-stakes environments. Doron Oizerovich is described as a veteran with more than 23 years of research-and-development experience who developed operational systems in the defense sector and later focused on AI-vision technologies that are in use today. Their pairing joins domain understanding with the technical experience required to translate a visual model into an operating product. Rotem Battat, the company's VP of Business Development, is described as having 14 years of startup experience, including work from inception through successful exits, and a background in algorithms and systems engineering. The founding story is not just a marketing detail: maritime safety products fail when they generate alerts that do not map to crew procedures, while computer-vision products fail when they do not account for how a camera moves, what a watch officer can see, or which events are actionable. A former naval operator can help specify those workflows, and a long-tenured defense R&D leader can help with complex systems engineering. The public sources do not establish current headcount beyond Startup Nation Finder's 11-50 employee band and a historical profile reporting approximately 33 employees, so the present organizational depth, field-support capacity, and engineering distribution remain diligence questions.\n\n**Competitive dynamics.** Captain's Eye competes across overlapping categories rather than against one identical product. SEA.AI applies computer vision and sensor fusion to maritime perception and collision avoidance; Orca AI provides autonomous-navigation and situational-awareness systems for commercial shipping; Windward sells maritime intelligence and vessel-risk analytics built around large-scale data and behavioral analysis; ShipIn offers fleet visibility and video-oriented maritime operations tooling; and established industrial-video providers such as Axis Communications and Motorola Solutions' Avigilon can supply cameras, analytics, and security integrations to ports and facilities. Port and vessel operators can also rely on traditional watch teams, periodic inspections, radar, AIS, engine alarms, and bespoke systems integration as substitutes. Captain's Eye's plausible edge is the combination of retrofit deployment, maritime-specific event models, onboard processing, low-bandwidth operation, remote fleet management, and a workflow that spans safety, security, inspections, and operational continuity. The company's own product page emphasizes that no new equipment is required and that data is processed onboard before necessary information is sent to the cloud. That can lower deployment friction relative to a full sensor replacement. The edge is not automatically a durable moat: larger competitors may have more labeled data, more integrations, stronger procurement channels, and better support economics. Durability will depend on measured alert quality, fleet-level learning, customer-specific tuning, evidence of reduced incidents and downtime, and switching costs created by historical event data and embedded procedures.\n\n**Defense, security, and resilience dual-use relevance.** Captain's Eye qualifies as a credible dual-use company because the same core platform serves commercial maritime safety and security as well as protection of strategically important maritime and industrial infrastructure. In civilian operations it can identify fire, leaks, unsafe work, pollution, equipment failures, and unauthorized access; in security-sensitive operations those same capabilities can support port perimeter awareness, restricted-area monitoring, vessel security, offshore energy protection, and early triage of incidents around naval or coast-guard support infrastructure. The system's ability to process data onboard and transmit only necessary information is relevant to vessels and remote sites with constrained or intermittent communications. The Israeli Naval Forces and IDF background of the founders, the Ashdod Port pilot, and the company's stated onshore focus make the security translation more credible than a generic consumer computer-vision claim. The calibration is important: no source reviewed here proves a defense contract, military fielding, classified deployment, weapon-system integration, or certification for a defense program. The strongest defensible claim is that Captain's Eye is a maritime resilience and critical-infrastructure platform with a real path into security missions. Diligence for that path should cover cyber hardening of cameras and edge devices, tamper resistance, data residency, human authorization, degraded-network behavior, audit logs, false-negative consequences, privacy and labor requirements, and interoperability with port, coast-guard, naval, or emergency-management command systems.\n\n**Growth stage, trajectory, and key diligence risks.** Captain's Eye is classified as mid-stage commercialization rather than mature scale-up. It has operated since 2020, raised a meaningful strategic round, participated in pilots and technology programs with Ashdod Port, established a shipping partnership, and now presents an active product with thousands of cameras and a large event history. It is not mature because public disclosures do not establish recurring revenue, fleet-wide customer counts, retention, international scale, or independently measured safety outcomes, and because the current funding history visible in reliable sources is several years old. The growth trajectory is attractive if the company can convert vessel deployments into standardized fleet rollouts and extend the same event-detection layer into ports, offshore energy, petrochemical sites, and other critical infrastructure. The key diligence points are: (1) independent precision, recall, latency, and false-alarm rates by event class and operating condition; (2) evidence that the reported response-time and efficiency improvements are causal and repeatable; (3) current cash position, revenue mix, customer concentration, and support costs; (4) cybersecurity and resilience of onboard inference, cloud services, and camera integrations; (5) the product's behavior during connectivity loss, sensor failure, and adversarial or abnormal conditions; (6) regulatory, privacy, maritime-insurance, and liability exposure; and (7) the ability of a relatively small team to sell and support a geographically distributed fleet. The opportunity is strategically relevant and operationally grounded, but its durable value depends on proving that early warning improves real-world outcomes without creating alert fatigue or a new critical failure surface.\n"
