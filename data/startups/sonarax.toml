name = "Sonarax"
description = "Sonarax is an Israeli deep-tech company building ultrasonic data-over-sound and indoor positioning software for device-to-device communication, proximity verification, and GPS-independent location services."
detailed_description = """Sonarax builds ultrasonic data-over-sound and indoor positioning software that uses speakers and microphones as a bidirectional communication channel. The core technology leverages inaudible acoustic waves (typically 18–24 kHz ultrasonic frequencies) to encode ranging data, proximity tokens, and short-range payloads. The system works on commodity devices—smartphones, tablets, laptops, IoT endpoints, and embedded platforms—without requiring additional RF infrastructure, dedicated beacons, or hardware modifications. This approach allows deployment of indoor location services and device-to-device communication in environments where GPS is unavailable, radio spectrum is congested or regulated, or installation of new infrastructure is prohibitively expensive or complex.

The commercial appeal rests on low-friction, retrofit-friendly deployment. If the software can run natively on standard phones and devices already in use, customers can add indoor location, presence detection, proximity-based access control, and short-range authentication without purchasing beacons, anchors, or new wireless infrastructure. That value proposition resonates with retail (wayfinding, in-store analytics), hospitality (guest wayfinding, asset tracking), logistics (warehouse zone detection, loading-dock coordination), healthcare (patient and equipment location in GPS-denied buildings), and industrial sites (worker proximity alerts, crane-zone safety). The modality also appeals to scenarios where frequent re-commissioning, portability, or dynamic deployment is required—temporary events, emergency response staging, or field operations where permanent infrastructure investment is unwarranted.

Sonarax competes in a well-populated category of indoor-positioning alternatives: Bluetooth Low Energy (BLE) beacons remain the market incumbent, Wi-Fi RTT leverages existing Wi-Fi infrastructure, Ultra-Wideband (UWB) offers better ranging accuracy at cost and power expense, and visual inertial odometry (VIO) systems use cameras and gyroscopes. Unlike raw-bandwidth technologies, acoustic links are inherently bounded by range (typically 1–10 meters in open space, less in multipath-heavy environments), latency (hundreds of milliseconds per ranging cycle), and robustness to ambient noise. Sonarax's competitive differentiation therefore centers not on replacing wideband RF systems but on exploiting acoustic modality's unique niche: ubiquity of speakers and microphones, cross-platform compatibility even on legacy devices, and the ability to create a short-range local channel when RF is undesirable, constrained, or absent.

The dual-use relevance is credible but operationally narrow. In defense and security contexts, acoustic proximity verification, offline secure pairing, and RF-silent (radar-quiet) local communication are meaningful in GPS-denied, heavily shielded, or jammed environments—particularly underground facilities, inside Faraday cages, naval vessels, and forward operating bases. Personnel identification, equipment verification, and localized command-and-control signaling could leverage silent acoustic encoding. However, real operational validation remains critical: acoustic range and bandwidth limits, environmental noise sensitivity (machinery, weather), speaker/microphone hardware diversity across military platforms, and security requirements (reversibility, eavesdropping resistance, spoofing resilience) must all be addressed before the technology qualifies for sensitive applications. Sonarax therefore functions most credibly as a specialized enabling layer—a GPS-silent positioning and proximity system for niche defense and emergency scenarios—rather than as a broad defense infrastructure replacement."""
