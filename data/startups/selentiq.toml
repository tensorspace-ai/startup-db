name = "Selentiq"
description = "Selentiq is an Israeli pre-seed deep-tech startup developing a hardware-agnostic navigation engine that uses sensor fusion, active magnetic mapping, and local edge processing to maintain positioning when satellite navigation is jammed, spoofed, or unavailable. Its first stated market is maritime navigation, with planned applicability to autonomous aerial, ground, underwater, and port-security platforms."
detailed_description = """
**Product and the concrete problem it solves.** Selentiq is tackling a specific failure mode in modern mobility: ships, drones, autonomous vehicles, and other platforms can lose trustworthy positioning when GNSS signals are blocked, spoofed, degraded by the operating environment, or deliberately manipulated. The company is beginning with maritime use, where a vessel may be navigating far from shore while relying on a weak external signal for location, route following, collision avoidance, and autonomous operation. A false position can be more dangerous than a visible outage because the operator or control system may continue to trust an incorrect map. Selentiq's proposed answer is a navigation brain that can continue to locate a platform without receiving an artificial external signal. The commercial need is not simply a better consumer GPS replacement. It is continuity of position and motion awareness for merchant ships, yachts, autonomous surface and underwater vehicles, port-security systems, drones, ground vehicles, and handheld or industrial systems operating in environments where satellite navigation cannot be treated as authoritative. The company's website uses the May 2025 MSC Antonia grounding as an illustration of the operational and economic stakes of maritime positioning disruption; that incident is a company-selected example rather than independent proof of Selentiq performance. The underlying problem itself is well established: a navigation-dependent asset needs an independent source of location and a way to detect when its satellite-derived position should not be trusted.

**Core technology and how it actually works.** Selentiq describes a software-first, hardware-agnostic architecture built around sensor fusion, an active magnetic-mapping algorithm, and local edge computation. The core concept is to use the Earth's magnetic field and local magnetic anomalies as environmental information, rather than depending solely on signals broadcast by satellites or terrestrial beacons. During operation, the system is intended to measure magnetic information, compare it with a growing map, and combine that evidence with other onboard sensors to estimate position and motion. The company says active magnetic mapping continuously records and refines a crowdsourced magnetic map along a vessel's travelled path, allowing each voyage to add information for later navigation. Selentiq also presents a quantum-classical hybrid roadmap that combines conventional sensors with proprietary quantum sensors; the current public record does not establish the exact quantum sensor modality, fabrication status, calibration method, or independent test results. The practical engineering challenge is substantial. A vessel, drone, or vehicle creates its own electromagnetic disturbances through motors, generators, wiring, payloads, and changing power states, while the Earth's magnetic field varies with geography, geology, heading, nearby infrastructure, weather-related operating conditions, and measurement noise. A usable system therefore needs careful calibration, compensation for self-generated interference, map matching, sensor synchronization, bounded drift, and failure detection when the map is weak or ambiguous. Selentiq claims zero-drift and sub-meter accuracy, but these should be treated as company targets or claims until supported by repeatable, independently measured trials across representative platforms and environments.

**Market, customers, and go-to-market.** The initial wedge is maritime, a sensible choice because merchant vessels, yachts, naval platforms, autonomous underwater vehicles, and port operations all have high consequences for navigation errors and can face GNSS interference near contested or congested areas. Selentiq's stated product strategy is plug-and-play: the software should integrate with existing platforms without custom hardware modifications, which could reduce the time and cost of testing an alternative navigation layer. The broader market it names includes aerial drones, ground vehicles, ships, handheld devices, and autonomous systems, but the company is currently more specific about maritime design partners than about other verticals. Its public roadmap describes a 2026 proof-of-concept and R&D phase, a pre-seed fundraising target of $2 million to reach a commercial classical product and quantum-sensing proof of concept in 12-14 months, design partnerships with maritime companies in late 2026, and a commercial deployment target in 2027. Its LinkedIn activity says it is seeking pilot partners in maritime and investors for the upcoming round. No paying customer, signed pilot, production deployment, or recurring revenue is publicly identified in the reviewed sources. The likely go-to-market is therefore a systems-led B2B motion: validate on a vessel or autonomous platform with a design partner, demonstrate performance against GNSS and inertial baselines, then license the navigation engine to platform OEMs, ship operators, autonomy integrators, and defense or port-security contractors. That path can produce a strategic beachhead, but it also brings long qualification cycles and a need to prove that integration effort is lower than the cost of retaining vulnerable or inaccurate navigation infrastructure.

**Traction, funding, and third-party validation.** Selentiq is publicly verifiable as a very young company, not as a mature operating business. IVC lists Selentiq Technologies Ltd. as a Tel Aviv high-tech company established in 2026, with a seed-stage classification, five employees, defense-tech and quantum-technology tags, and Ohad Rabinovitz and Emily Guy as CEO and CTO co-founders. LinkedIn separately lists a Tel Aviv headquarters, a 2-10 employee range, a 2026 founding date, and a privately held status. These records are useful identity and ecosystem evidence, but they are not audited headcount or financing disclosures. The company says it progressed through Starburst's InnoVet accelerator, whose partner ecosystem includes Israel Aerospace Industries, Israel Natural Gas Lines, the Israel Innovation Authority, and the Israeli Ministry of Defense. Selentiq's public LinkedIn account reports that its first live test was presented at an InnoVet Demo Day and describes the result as validation of a resilient GPS-independent navigation brain; this is a company-reported demonstration, with no public test range, dataset, error distribution, duration, platform details, or independent observer report. The company also appeared in the published NexTech Warsaw 2026 agenda, where its CEO was listed for a defense and dual-use technology presentation, and the conference's public partner page described Selentiq's magnetic-anomaly mapping approach. Those appearances provide early ecosystem and visibility signals. IVC records non-equity accelerator assistance in February 2026, while Selentiq's own roadmap says it is fundraising for a $2 million pre-seed; no closed equity round or named institutional investor is confirmed by the sources reviewed. The right conclusion is early validation and ecosystem access, not product-market fit.

**Founders and team background.** The founders have a direct but still developing fit with the problem. Ohad Rabinovitz is identified by the company as CEO and co-founder. Selentiq's biography describes his operational experience as a combat commander in the IDF's elite Refaim unit, including leadership of complex projects under pressure and hands-on operation and troubleshooting of tactical drone systems. The same biography says he founded RRTD, a UAV training academy, after military service. That background can help with field testing, operator interviews, platform integration, and understanding how autonomy fails in real conditions rather than in a clean laboratory. Emily Guy is identified as CTO and co-founder. The company describes her work as centered on tools for hardware validation and engineering workflows, with specialization in embedded systems, electronics, and practical engineering problem solving. Her public LinkedIn profile identifies her as an electrical-engineering student at Tel Aviv University with an artificial-intelligence focus. Together, the pair cover operational unmanned-systems context and early embedded/electronics execution, which is relevant to a product that must bridge algorithms and physical platforms. The limitation is equally important: the public record does not yet show a larger navigation-science team, a senior quantum-sensing researcher, a maritime systems veteran, a certification lead, or a commercial executive with a history of selling navigation components. IVC's five-person figure and LinkedIn's two named employees indicate a small team, though the difference may reflect incomplete public profiles. Technical diligence should verify who owns the magnetic-navigation research, who has shipped production-grade sensor fusion, and whether the team can support simultaneous maritime, aerial, and quantum-sensing programs.

**Competitive dynamics.** Selentiq competes against several approaches rather than one direct product category. Conventional GNSS receivers remain the default because they are inexpensive, standardized, and globally interoperable, while inertial-navigation suppliers such as Honeywell, Safran, Exail, and SBG Systems offer increasingly capable INS, fiber-optic, ring-laser, and MEMS-based systems that bridge short outages through dead reckoning. Advanced Navigation combines inertial, AI, and alternative sensing in products aimed at robotics, marine, and aerospace customers, making it a relevant commercial comparison. Israeli companies such as InfiniDome address GNSS jamming and spoofing resilience by protecting or augmenting the satellite-navigation link rather than replacing it with magnetic mapping. Terrain-referenced, vision-based, radar-based, celestial, radio, and geophysical-navigation approaches can also serve as substitutes depending on platform and mission. Selentiq's possible edge is the combination of real-time magnetic-map creation, local processing, and hardware agnosticism: if it can build a useful map while moving and deploy on existing platforms, it may avoid the installation burden of new beacons or a large specialized inertial unit. The same architectural choice creates vulnerabilities. Magnetic anomalies may not provide enough spatial uniqueness over open water; a shared map needs coverage, quality control, and protection against bad or adversarial data; self-interference may be difficult to model across different platforms; and established inertial vendors have qualification records, distribution, and customer trust. Selentiq must demonstrate not just a successful prototype but lower total system cost, useful accuracy over time, graceful degradation, and clear superiority in the specific GNSS-denied conditions its buyers care about.

**Defense, security, and resilience dual-use relevance.** Selentiq's dual-use case is substantive because the same core navigation technology is intended for commercial maritime operations and defense or security platforms. A merchant ship needs independent positioning to avoid route disruption and safety incidents; a naval vessel, autonomous underwater vehicle, drone, or ground robot needs independent positioning to maintain mission continuity when an adversary jams or spoofs GNSS. Port-security systems and critical maritime infrastructure can use the same capability to track autonomous platforms and preserve situational awareness around sensitive facilities. Local computation and no reliance on external signals could reduce exposure to interception, remote tampering, and denial, although Selentiq's public claims of inherent immunity should be verified against sensor spoofing, electromagnetic interference, cyber compromise of software updates, and attacks on the magnetic map itself. The resilience value extends beyond defense: emergency-response vessels, offshore energy operators, search-and-rescue teams, remote logistics, and disaster-response robots may need navigation when terrestrial communications or satellite services are unavailable. The defense relevance is therefore more than founder adjacency or a generic AI label, and the company is explicitly presenting itself through defense and dual-use programs. At the same time, the public evidence does not establish an Israeli Ministry of Defense contract, a naval deployment, a military customer, export authorization, classification, or a qualified defense-grade product. Selentiq should be treated as an early dual-use navigation prospect with strategic potential, not as fielded defense capability. The strategic question is whether the system can transition from an attractive alternative-PNT thesis into a trusted component that allied operators can certify, maintain, and integrate into safety- or mission-critical autonomy.

**Growth stage, trajectory, and key diligence risks.** Selentiq is classified as early because it was founded in 2026, is reported at only a handful of employees, is in a proof-of-concept and R&D phase, and is still seeking pre-seed capital, pilot partners, and customer validation. The trajectory is clear enough to monitor: complete a classical magnetic-navigation prototype, validate the first live tests with quantified and repeatable data, secure a maritime design partner, prove the magnetic-map workflow on real platforms, and then determine whether quantum sensing materially improves accuracy, drift, coverage, or interference tolerance. The principal risks are technical and evidence-related. First, the claimed sub-meter, zero-drift performance may not survive open-water ambiguity, magnetic self-interference, temperature and vibration changes, or long periods without a sufficiently distinctive map. Second, the quantum-sensing roadmap could add cost, packaging complexity, calibration burden, and schedule risk before the classical product is commercially useful. Third, a crowdsourced map creates data-ownership, integrity, update, and adversarial-poisoning questions, especially for defense users. Fourth, hardware-agnostic integration is attractive in principle but can become a services-heavy burden across ships, drones, ground vehicles, and AUVs. Fifth, navigation products face safety, classification, liability, cybersecurity, spectrum-adjacent, and export-control requirements that are difficult for a very small team. Finally, the company has no publicly disclosed closed financing round, customer contract, recurring revenue, independent benchmark, patent grant, or production milestone. Selentiq's upside is a compact independent-PNT layer for allied autonomy and maritime resilience; the bear case is a technically compelling but map-limited POC that cannot deliver consistent accuracy or affordably pass platform qualification. The current evidence supports close strategic monitoring and disciplined technical diligence, not a conclusion that commercialization or defense adoption is assured.
"""
