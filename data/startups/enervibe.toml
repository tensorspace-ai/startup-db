name = "Enervibe"
description = "Enervibe is an Israeli deep-tech company developing kinetic energy harvesters and battery-less sensing systems that turn vibration, rotation, and motion into power for connected products. Its lead commercial direction is self-powered tire intelligence for fleets, with the same platform being adapted to industrial IoT, condition monitoring, and smart wearables."
detailed_description = """
**Product and the concrete problem it solves.** Enervibe targets a deceptively basic constraint in connected hardware: sensors are often valuable only when they can measure continuously, but batteries add mass, maintenance visits, disposal obligations, and an eventual dead-sensor failure mode. That constraint is especially severe inside a rotating truck tire, where the electronics experience vibration, rotation, shocks, temperature swings, and no practical service access. Enervibe's Enertire direction places a self-powered sensing module in that environment so fleet operators can receive richer tire data without relying on a replaceable battery. The company says its platform can support pressure, temperature, weight, mileage, tire identity, load-change, and journey-efficiency data, with predictive alerts for flat tires, overheating, uneven loads, and related operating risks. The value proposition is operational rather than merely ecological: earlier warning can reduce roadside failures, downtime, avoidable tire replacement, accident exposure, and fuel waste. Beyond tires, the same architecture is aimed at industrial equipment whose vibration is already available but whose sensors are costly to wire or repeatedly service, as well as footwear and other wearables where small form factor and charging friction constrain adoption.

**Core technology and how it actually works.** Enervibe's distinctive claim is not simply that it harvests vibration, but that it combines the harvester, power-management electronics, sensor, wireless link, and data layer as one application-specific system. The company describes an Adjustable Kinetic Energy Harvester that self-tunes to a machine's changing real-world vibration. That matters because a fixed-frequency harvester can lose output when the operating frequency shifts; Enervibe's LinkedIn profile claims that fixed designs can lose up to 85% of output after a 10% frequency shift, while its adjustable design follows the machine's vibration. Its published electromagnetic module is reported at 6-14 grams, 5-20 mW, 200 g shock resistance, and an operating range of -40 to 125 degrees Celsius. The product architecture conditions and stores harvested power, runs ultra-low-power sensing, and transmits data over Bluetooth Low Energy; the tire platform can connect to fleet systems through an in-vehicle RS232 path or a cloud API. A European patent application assigned to Enervibe provides unusually concrete technical evidence: it describes a coil, an off-center magnet, and a fixed push-back magnet whose repulsive force converts body vibration or linear motion into relative rotation and alternating voltage. The patent does not prove production readiness, but it confirms that the company has pursued a specific mechanical-electromagnetic design rather than a generic energy-harvesting label.

**Market, customers, and go-to-market.** The initial beachhead is commercial vehicle tires, where tire manufacturers, telematics providers, fleet managers, and logistics operators already pay for safety and utilization data but cannot easily service sensors embedded in moving wheels. Enervibe's product page describes two integration paths: tire makers can adopt the harvester or a complete self-powered sensor, while telematics providers can consume the data through an API or in-vehicle interface and white-label the service. This is a sensible channel strategy because Enervibe does not need to replace a fleet-management platform if it can supply a better data layer into an existing one. The company also identifies industrial IoT and condition-based maintenance as adjacent markets, where vibration is a useful signal and battery replacement can interrupt production. Smart footwear and wearable devices are further opportunities, but they appear less mature publicly than the tire program. Israel's Innovation Authority profile lists automotive, vehicle fleets, tire manufacturers, and military among targeted customers. Enervibe's public materials do not name a paying tire OEM, fleet, defense organization, revenue figure, or production-volume contract, so the commercial thesis should be treated as a channel and deployment hypothesis supported by product integration evidence, not as proof of scaled adoption.

**Traction, funding, and third-party validation.** Enervibe was founded in Israel in 2018 according to its current website, LinkedIn profile, and CTech's funding report; an Israeli corporate profile lists the legal company as incorporated in June 2018, while an Innovation Authority record uses 2016 as its established-year field, likely reflecting an earlier formation or program milestone. CTech reported that Enervibe announced a $3.4 million first financing in April 2022 from Mobilitech Capital, Capital Nature, CBG, ProSeed Fund, and private investors, with an option that could have raised the round to $5 million. The Innovation Authority profile currently labels the company at Initial Revenues stage, reports 11 employees, and records a technology grant or R&D-program history. Enervibe's own site now claims 12 patents and tire-grade platform validation, while LinkedIn states that the full harvester, power management, sensing, wireless, and cloud stack was tested inside a rotating truck tire at -40 to 120 degrees Celsius and shocks up to 2,500 g. These are company claims, but they are supported by a separate European patent application naming Enervibe as applicant and Michael Haronian as inventor. Additional technical validation comes from the EU EnABLES project, which describes Enervibe's variable-tuning vibration harvester and planned ASIC feedback loop, and records access to CEA-Liten and imec facilities. The public record therefore shows serious R&D and early commercialization signals, but not enough disclosed customer or financial data to call the company mature.

**Founders and team background.** CTech identifies entrepreneurs Dr. Dan Haronian and Michael Haronian as the founders, and the European patent names Michael Haronian as inventor on a core electromagnetic harvester application. The Innovation Authority profile lists Dan Haronian as CTO and co-founder and Offer Shachar as CEO, while the 2022 funding coverage identified Moshe Avlagon as CEO at that time. This change in publicly listed leadership should be verified in diligence rather than silently normalized. Startup Nation Finder describes Dan Haronian as an applied-physics and MEMS entrepreneur who previously co-founded GalayOr, a MEMS company sold to MEMSCAP in 2003, and as a lecturer at the Lev Academic Center and Tel Aviv University. The EU EnABLES project also identifies him as the technical contact for the company's vibration-energy-harvesting work. That background fits the physics-heavy problem unusually well: the key challenge is not attaching a small generator to a machine, but maintaining useful conversion efficiency across variable frequencies, high shock, temperature variation, and severe size and power budgets. The team appears compact, with public headcount signals ranging from 11 in the Innovation Authority profile to LinkedIn's 11-50 band and 15 visible employees. Professor Daniel J. Inman, a prominent vibration-energy-harvesting researcher, was announced by Enervibe's LinkedIn account as a scientific adviser in 2026, adding credible external expertise, although the scope and formal terms of that relationship are not public.

**Competitive dynamics.** Enervibe competes against several different approaches rather than one direct rival. (1) Conventional battery-powered TPMS and industrial wireless sensors are the incumbent alternative: they are familiar and often cheaper at initial deployment, but require battery replacement or conservative sampling schedules. (2) EnOcean and other ambient-energy wireless sensor vendors demonstrate that maintenance-free sensing can be commercialized, but their strongest historical applications are building controls and low-power switching rather than high-shock rotating tires. (3) Wiliot's battery-free IoT Pixels use harvested ambient radio energy and compete for the broader maintenance-free sensor budget, while Enervibe's differentiator is extracting power from mechanical motion already present in the asset. (4) Perpetua Power and related vibration-harvesting suppliers compete on component-level energy conversion, whereas Enervibe emphasizes an integrated harvester-to-cloud product and application-specific tuning. (5) Piezoelectric, electrostatic MEMS, and fixed-resonance electromagnetic harvesters remain credible incumbent technical approaches for particular vibration profiles. Enervibe's claimed edge is the combination of self-tuning behavior, a tire-tested mechanical package, and integration with fleet telemetry, but the moat is not yet demonstrated through public comparative trials, granted-patent breadth, unit economics, or named OEM design wins. The most important competitive question is whether Enervibe's system-level integration creates enough lifecycle value to overcome the qualification burden of embedding new electronics in tires and industrial equipment.

**Defense, security, and resilience dual-use relevance.** Enervibe merits dual-use status because its core technology can serve both commercial sensing and defense or resilience contexts without requiring a fundamentally different physical principle. Israel's Innovation Authority explicitly lists military among its targeted customer groups, while Enervibe's current public materials describe a platform for locations where battery replacement, charging, and physical access limit the usefulness of connected sensing. In defense, that transfer path could include self-powered monitoring in vehicle tires, trailers, unmanned ground systems, rotating machinery, generators, pumps, and other assets that operate far from maintenance depots or under hazardous conditions. A sensor that continues to harvest from vibration can reduce battery logistics, limit maintenance exposure, and provide condition data for predictive maintenance; the same property is relevant to emergency fleets, border infrastructure, ports, rail systems, and remote water or energy equipment. Enertire's load-change and geo-tagged event concepts also have a resilience and security angle for detecting cargo loss, tampering, abnormal loading, or unauthorized dumping in commercial fleets. The calibration is important: no public source reviewed here confirms a fielded military contract, defense qualification, classified deployment, or operational use by an armed force. The company is therefore strategically relevant as a battery-independent sensing enabler with credible military adjacency, not as a demonstrated defense supplier.

**Growth stage, trajectory, and key diligence risks.** Enervibe fits the mid stage: it has operated since 2018, raised disclosed institutional financing, reports initial revenues in an Innovation Authority profile, claims tire-grade validation and 12 patents, and presents an integration-ready product surface, but it remains a small private company without public evidence of scaled revenue or large customer deployments. Its trajectory depends on converting a technically compelling demonstration into repeatable design wins with tire makers, telematics firms, fleets, and industrial OEMs. The main diligence points are: (1) **performance risk** — harvested power and signal quality must remain useful across changing speed, load, temperature, tire construction, and vibration spectra; (2) **qualification risk** — tire and industrial customers have long safety and reliability cycles, and an electronics failure can carry liability beyond the sensor's cost; (3) **commercial concentration** — a narrow automotive beachhead can create dependence on a small number of OEM or channel decisions; (4) **economics risk** — the complete module must beat the lifecycle cost of inexpensive batteries and incumbent TPMS, including installation, data service, and integration; (5) **disclosure risk** — the public record does not provide named customers, current revenue, detailed patent families, production volumes, or the exact current executive structure; (6) **funding risk** — the disclosed $3.4 million round is meaningful for R&D but modest for multi-year automotive qualification and manufacturing scale; and (7) **technical competition** — piezoelectric, MEMS, RF-harvesting, and battery technologies can improve faster than expected. The upside is strategic infrastructure depth: if Enervibe proves durable, self-powered sensing at fleet scale, it could become an enabling layer for safer logistics and lower-maintenance allied asset monitoring."""
