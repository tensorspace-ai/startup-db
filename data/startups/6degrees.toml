stage_rationale = """The company was founded in 2017 and has progressed from a grant-backed prototype to a public MyMove purchase listing, reported initial revenues in an undated Israel Innovation Authority profile, and a hospital VR collaboration. Yet the public record does not establish a scaled installed base, sustained paid deployments, reimbursement, dated revenue or completed clinical outcomes. Historically reported pre-seed financing and later grants indicate early external support, but newer fundraising terms, cap table and operating metrics remain undisclosed. The controller and rehabilitation system also appear to have distinct commercialization pathways. Early stage is the best fit; present financing stage is not confirmed by a current company announcement."""
