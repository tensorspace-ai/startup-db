name = "6Degrees"
description = "Israeli assistive-health startup whose MyMove wearable maps a user's available limb movements to wireless controls for phones, computers and rehabilitation software."
detailed_description = """6Degrees Ltd. is a Tel Aviv assistive-technology startup founded in 2017 by industrial designer Miri Berger and electrical engineer Aryeh Katz. Its MyMove wearable is intended for people whose limited hand or finger control makes ordinary touchscreens, keyboards and mice difficult to use. Company materials describe a motion-learning controller that adapts to an individual’s available movements, filters unwanted motion and sends commands over Bluetooth. Users can assign movements from an arm, shoulder, foot or other usable body part to actions such as cursor movement, clicking, swiping or selecting. The intended value is practical access to everyday digital services, communication and work rather than a new general-purpose consumer wearable.

The product line has two related but different jobs. MyMove is presented on the current company store as a wearable controller priced at $990, with a 30-day money-back guarantee and optional installment payments. MyMove+ or MyMove VR is described in company and partner materials as a rehabilitation system that combines wearable motion input, virtual-reality games and movement feedback for people with limb loss and phantom-limb pain. The VR system’s clinical and commercial maturity should not be assumed to match the MyMove controller’s public retail listing. The European Commission’s CRESCENT project record says the startup completed a feasibility study, built an early MyMove prototype and secured Sheba Medical Center as an early test site. Sheba later announced work with 6Degrees on VR rehabilitation. These sources establish product development and pilots, but not broad hospital deployment, reimbursement or repeat purchasing.

The company presents adaptive motion classification, personalization and compatibility with ordinary smart devices as its technical differentiators. This design can serve people with residual movement who may not be well served by finger-operated interfaces. It also places the product among established assistive-access substitutes, including head-controlled mice, eye-gaze systems and adaptive switches. The product must therefore show that its motion input is reliable, comfortable, learnable and easier to fit than alternatives for each relevant impairment. A European patent grant covers remote-controlled physical activity monitoring; the public patent record identifies 6Degrees Ltd. as assignee and the founders as inventors, while warning that its legal-status labels are not legal conclusions. The extent of the patent family and its coverage of the current commercial product require verification.

Commercial evidence remains early. The live store provides a price and a purchase path, and Israel Innovation Authority materials label the company at an initial-revenue stage, but the latter profile does not date its headcount or quantify sales. Google for Startups reported that the founders had secured Australian distributor deals, but those reports do not establish sell-through or material recurring revenue. In 2024, The Times of Israel reported that the founders donated two systems and had received requests from hospitals for 120; requests and donations are useful demand signals, not purchase orders. A separate company campaign set a $150,000 fundraising goal to distribute systems to patients, but no verified amount raised or fulfillment total was found. The appropriate diligence focus is paid units, active users, return rates, distributor economics, clinical outcomes and current regulatory status."""
