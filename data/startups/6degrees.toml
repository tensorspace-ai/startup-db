investment_rationale = """This is a diligence-stage opportunity rather than a demonstrated scale case. Positive evidence includes a functioning product listed for sale, a named hospital collaboration, a government profile that reports initial revenues, a European grant-backed prototype history, and a 2025 European patent grant. The founders combine personal familiarity with disability and rehabilitation with relevant industrial-design and electrical-engineering backgrounds. The verified 2021 investment from Unknown Group and the contemporaneous report of other pre-seed participants show that the company attracted outside backing, while later public support includes grant programs and a Google AI Startups Fund selection.

The investible question is whether the controller solves a frequent, high-cost access problem better than the many hardware and software alternatives already available. The $990 public device price establishes an offer, not willingness to pay or gross margin. Hospital requests, donated systems, distributor agreements and a VR pilot are not equivalent to recurring sales. There is no dated revenue, unit shipment, cohort retention, reimbursement, unit economics or audited financial disclosure in the reviewed sources. Clinical efficacy statements about phantom-limb pain need study-level verification, and the 2024 press report said national Health Ministry approval was still pending at that time. Until current regulatory documents, completed outcomes and paid sales are documented, the appropriate legacy priority is a monitored watchlist rather than an investment recommendation."""
strategic_value = """6Degrees sits at the intersection of accessibility hardware, digital health and rehabilitation. The product addresses a persistent gap between a person’s motor ability and the input methods assumed by mainstream devices. A controller that can learn a usable residual movement could complement eye tracking, head mice, switches and voice interfaces, while a VR rehabilitation product could make repetitive exercises more engaging and produce data for therapists. If the product becomes reliable across impairment profiles and operating systems, it could be sold through assistive-technology distributors, rehabilitation clinics, hospitals and direct-to-consumer channels. The company’s current retail page, its stated reseller approach, its reported Australian distributor arrangements and the Sheba relationship point to several possible routes to market, but none provides public evidence of channel scale or revenue quality.

For Israel, the company is a locally registered digital-health venture with a documented European grant project, Israel Innovation Authority support and clinical relationships at Sheba. These are concrete ecosystem connections, not proof of a strategic national capability or a defense asset. A stronger strategic case would depend on validated clinical benefit, accessible deployment outside specialist centers, export-ready regulatory documentation and a durable distribution network. The main strategic risk is that the company is trying to commercialize two adjacent products with different buyers, evidence standards and service requirements: a daily-use access controller and a therapeutic VR system. Focus, integration and support costs should be evaluated separately for each product."""
