competitive_edge = """The product’s potential distinction is the input method: it attempts to turn a user’s individually available limb movement into standard Bluetooth device commands. For people who can move a shoulder, foot or residual limb but cannot reliably touch a screen, a personalized movement vocabulary may offer an alternative to head movement, eye gaze, voice control or a single switch. The official site describes an adaptive classifier that learns the user’s movement and filters motion, while Google’s founder interview gives a more detailed company account of rapid calibration and the use of different body parts. Those are product claims, not comparative clinical or usability results.

The closest substitutes solve adjacent needs in different ways. GlassOuse sells head-controlled mice and switches, including devices priced below MyMove; Tobii Dynavox offers eye-gaze access that may require a compatible tracker or dedicated device; Microsoft sells modular switches, mice and hubs that can be assembled around a user’s capability. These suppliers have established products and broader catalogs, so 6Degrees must demonstrate an advantage in setup time, accuracy, fatigue, portability, user independence, compatibility and total cost for specific patient groups. The VR rehabilitation product adds a separate possible edge through active limb movement, game design and movement feedback, but its clinical value must be tested independently from everyday computer access. One European patent grant is a useful asset signal, yet one grant does not establish a broad moat. Product differentiation will depend on validated algorithms, fit data across users, therapist workflow, regulatory clearance, manufacturing quality and a repeatable distribution channel."""
