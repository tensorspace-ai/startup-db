name = "Able Intelligence"
description = "Able Intelligence is a Beer Sheva startup building an on-premise physical-AI manufacturing brain that connects factory data, operator expertise, and AI agents to improve real-time decisions on brownfield production lines. Its initial wedge is preserving skilled-operator knowledge and turning it into context-aware guidance and progressively autonomous workflows for industrial customers."
detailed_description = """
**Product and the concrete problem it solves.** Able Intelligence is addressing a specific manufacturing failure mode: plants have accumulated machines, sensors, SCADA and MES data, but the most consequential process knowledge still lives in the judgment of a small number of experienced operators. When those operators retire or leave, factories lose the tacit logic behind changeovers, adjustments, quality decisions, and recovery from abnormal conditions. Able describes its product as an AI factory brain rather than another dashboard. The platform is intended to connect shop-floor data, the actions taken by operators, and the resulting production outcomes so that the plant can preserve practical expertise, guide less-experienced staff, and eventually automate decisions where confidence is sufficient. The company’s official positioning separates it from a narrow predictive-maintenance tool: it wants to orchestrate data, operators, and agents into real-time decisions and actions, including process optimization, knowledge retention, decision support, and reduced waste. This is a meaningful problem in older plants where machinery remains productive but the labor market cannot reliably replace veteran technicians.

**Core technology and how it actually works.** Public descriptions indicate a full-stack, plant-specific system rather than a cloud-only analytics layer. Able says it connects to machines, sensors, and sometimes cameras, observes what experienced operators adjust, and relates those adjustments to process output. Its founder describes the initial workflow as a co-pilot that guides junior operators using patterns learned from senior operators; higher-confidence actions can later be automated while humans remain in the loop. The company’s current website adds concrete integration points — PLC and SCADA connectivity, MES and ERP integration, an edge-device deployment, line-specific model calibration, and a continuous learning loop. A recent company update says a server was installed directly on a customer’s factory floor and that the system runs 100% on-premise, with production data remaining inside the facility. That architecture matters because manufacturing data can contain trade secrets, process recipes, and safety-sensitive operational detail. It also avoids assuming reliable internet connectivity or permission to export operational data to a third-party cloud. The technical moat is not yet publicly demonstrated through independent benchmarks; at this stage it is the combination of heterogeneous industrial integration, human-behavior data capture, process context, and a path from recommendations to controlled action.

**Market, customers, and go-to-market.** Able is targeting B2B manufacturers with existing equipment and a shortage of skilled operators, rather than requiring a new fully automated greenfield factory. Startup Nation Finder identifies food-related production and energy, utilities, and waste management as initial industry categories. The founder’s public interview says the company is starting with older production lines, where automation alone does not remove the dependence on human expertise, and uses small pilots so customers can measure revenue or performance improvements before committing to a wider rollout. The official website presents a 90-day deployment sequence: install and connect the edge device, integrate PLC/SCADA and enterprise systems, calibrate agents to the line, onboard operators, and reach live production with a handover to the plant team. It also advertises a 4x target ROI and 24/7 autonomous agents; these are company marketing targets, not independently verified outcomes. A dedicated forward-deployment engineer working alongside the customer could accelerate adoption, but it also creates a services burden. The likely expansion motion is from one production line to more lines, plants, and process families after the system has captured enough local context to show measurable improvements in overall equipment effectiveness, setup time, downtime, material waste, or operator ramp time.

**Traction, funding, and third-party validation.** Able was founded in January 2026 and Startup Nation Finder reports a $250,000 pre-seed round from Secret Chord Ventures in May 2026. The same profile lists a three-person company, a 1–10 employee range, an alpha product stage, and Beer Sheva headquarters; LinkedIn describes the company as privately held and currently in stealth with a 2–10 employee range. Public proof of commercial activity is early but not purely conceptual. Able has stated that it completed a small-scale pilot in Israel with a solid return on investment and is seeking additional U.S. pilot partners. The company has also publicly shown a new on-premise factory installation, although it has not named the customer, disclosed contract terms, published before-and-after KPI measurements, or identified the plant’s industry. Able separately open-sourced CapAble-Core, an internal multi-agent engineering system built around Google’s Agent Development Kit, with role-based agents for architecture, implementation, QA, mutation testing, isolated execution, and parallel work. That release demonstrates engineering ambition and a preference for local or portable execution, but it is not evidence that the manufacturing product has achieved production-scale reliability. The current evidence supports an active, funded early startup with pilot and installation signals; it does not yet support claims of recurring revenue, repeatable deployment economics, or independently audited manufacturing gains.

**Founders and team background.** The founding team combines industrial-AI, semiconductor, data-platform, and machine-learning experience. CEO and co-founder Iftah Levy’s official biography says he spent 15 years in industrial AI leadership, served as General Manager and VP Product at Augury, scaled to an exit as VP Data at Seebo, led semiconductor technology initiatives at Applied Materials, and earned a summa cum laude BSc in information technology from Ben-Gurion University. A public founder interview adds useful context: Levy started in advanced semiconductor manufacturing, later moved toward traditional manufacturing and process optimization, and became focused on the expertise crisis on the factory floor. CTO and co-founder Kiril Smilansky is described by the company as having more than a decade in AI and data science, including work at Google, SimilarWeb, and Prosus/Naspers, and as a former co-founder of Texperience Food Tech AI. The team’s size is a strength and a risk. The founders appear unusually close to the manufacturing problem and the data infrastructure needed to attack it, but an early team of roughly three to ten people must still cover industrial integration, safety, product, sales, field deployment, and model reliability. The company’s public materials do not establish the depth of its controls-engineering, OT-security, or regulated-industry bench.

**Competitive dynamics.** Able competes with several overlapping approaches rather than one direct category incumbent. Augury combines machine-health sensing and industrial AI, making it a particularly relevant comparison because Levy previously worked there; Augury’s center of gravity is equipment health and predictive maintenance, while Able is claiming a broader process-context and operator-knowledge layer. Siemens Industrial Edge and Industrial Copilot bring deep PLC, automation, and installed-base relationships, giving Siemens a formidable distribution and integration advantage even if its product is less startup-like. Litmus Automation provides industrial edge connectivity and contextualization that can serve as an enabling layer or substitute. SymphonyAI Industrial offers AI applications for manufacturing, asset performance, and operations. Tulip competes for the frontline-operations and worker-guidance budget with a low-code, connected-worker approach. C3 AI and other industrial analytics vendors can also attack plant optimization from a model-and-data platform position. Able’s potential edge is not a novel model architecture disclosed in public materials; it is the combination of brownfield deployment, a local data boundary, explicit capture of operator intuition, and a workflow that promises actions rather than alerts. That edge will only become durable if Able proves that its plant-specific context compounds across lines, shortens deployments, improves KPIs without unsafe automation, and remains valuable after the first implementation team leaves.

**Defense, security, and resilience dual-use relevance.** Able’s dual-use case is credible but presently an adjacency, not a fielded defense capability. Commercially, a local AI layer that helps food, energy, utilities, and industrial plants retain expertise and operate through labor shortages supports continuity of essential production. The same pattern applies to defense-industrial manufacturing, ammunition and component production, semiconductor fabs, water-treatment plants, and distributed energy facilities where process know-how, uptime, and data sovereignty can be operationally decisive. On-premise execution also reduces the need to export sensitive manufacturing telemetry to an external cloud, although the public record does not establish Able’s OT-security controls, threat model, certification posture, or ability to operate safely in a segmented or degraded network. A defense customer could use the technology to train less-experienced operators, preserve the judgment of scarce specialists, detect process drift, and support resilient production across brownfield facilities; none of those defense deployments is publicly disclosed. This record therefore scores Able as dual-use because the core technology is a general industrial decision and control layer with a direct resilience path, while explicitly avoiding the stronger claim that the company has military contracts, classified work, or autonomous weapons relevance.

**Growth stage, trajectory, and key diligence risks.** Able is early: it was founded in 2026, has disclosed only a $250,000 pre-seed, remains described as stealth or alpha-stage, and has not published revenue, customer names, retention, deployment count, safety results, or independently verified ROI. The upside trajectory is that an on-premise context layer becomes the system of record for operator knowledge in factories that cannot replace experienced staff, then expands from guidance into bounded autonomous actions and multi-site production intelligence. The main diligence questions are concrete. First, can Able integrate reliably with old PLC, SCADA, MES, ERP, and camera systems without turning every installation into bespoke consulting? Second, does learning from operator behavior distinguish expert causal judgment from unsafe workarounds, temporary exceptions, or correlated but non-causal actions? Third, can the company demonstrate measurable improvements in OEE, changeover time, scrap, safety, or training speed under production conditions rather than in a pilot narrative? Fourth, can local inference meet latency, maintenance, patching, and model-update requirements without creating a new OT attack surface? Fifth, can a very small team support forward deployment while productizing enough of the work to achieve venture-scale economics? Finally, industrial sales cycles, customer confidentiality, and safety approvals may slow reference creation. Able is a strategically aligned early entry with unusually relevant founders, but its priority should rise only after named deployments, reproducible KPI evidence, security documentation, and repeatable expansion beyond a single plant.
"""
