name = "guaRdF"
description = "guaRdF develops GuardSense, a passive RF-intelligence platform that detects, classifies, geolocates, and tracks connected devices, then correlates those signals with video and license-plate-recognition systems for public safety, critical-infrastructure, and perimeter-security operations."
detailed_description = """
guaRdF's GuardSense offering combines proprietary, low-power RF sensors with analytics intended to turn ambient wireless activity into operational security intelligence. The company says its system can sense RF signatures from connected devices, classify device types, infer relationships such as a phone associated with a vehicle system, estimate geolocation, learn normal scene behavior, and generate anomaly alerts. Its published workflow also includes optional identifier anonymization and integrations with video-management and license-plate-recognition systems. The product is therefore positioned as a sensor-fusion layer around existing security infrastructure, not as a replacement for cameras, LPR, or command software. The claimed sensor form factors include fixed pole or cabinet installations, portable or vehicle deployments, and a drone payload, although the public material does not establish performance across each configuration.

The customer problem is credible: cameras lose coverage through line-of-sight limits, weather, crowding, occlusion, and deliberate deception, while RF emissions from phones, vehicles, wearables, trackers, and other connected equipment can persist outside the camera frame. A useful RF layer could cue cameras, identify devices that recur near incidents, detect unusual device presence, and help security teams prioritize investigation. Target contexts named by the company include safe-city and crime investigation, border and checkpoint security, ports, utilities, data centers, and other critical sites. The commercial value depends on actionable precision rather than the ability to collect signals: operators need reliable localization, low alert fatigue, understandable workflows, and integrations that fit existing video and security-operations systems.

Public commercialization evidence is early but not empty. The company website presents a productized GuardSense platform and requests confidential briefings rather than publishing pricing, customer references, or validated accuracy metrics. guaRdF's LinkedIn presence describes participation in Milipol Paris 2025, DefenseTech Week TLV, and Singapore's Hatch ecosystem; a founder-posted update reports a GuardSense deployment at Ashdod Port. These are useful business-development and deployment signals, but they are company or profile claims and do not by themselves prove recurring revenue, procurement scale, or independently measured outcomes. Public startup-directory data identifies the company as founded in July 2024, based in Rehovot, and operating with a very small team; it also lists funding as undisclosed or pre-funding. The record should therefore treat the business as an early technical venture with initial field activity, not as a scaled seed-stage vendor with established market traction.

The competitive set spans several categories. RF-specialist and spectrum-monitoring vendors can offer stronger mature hardware, signal processing, or geolocation in particular bands; defense intelligence companies may have deeper collection and analytics capabilities; and video, LPR, and video-management incumbents can bundle adjacent detection into existing procurement relationships. guaRdF's potential differentiation is the combination of mass connected-device sensing, privacy-oriented anonymization, scene learning, geolocation, and RF-to-video correlation in a deployable security workflow. That advantage will be difficult to defend unless the company demonstrates repeatable accuracy in dense and changing RF environments, useful interoperability, and a cost and installation model that beats buying separate sensors or relying on established surveillance platforms.

For defense and national security, the dual-use case is substantive but bounded. Passive RF awareness can support perimeter protection, port and border security, checkpoint monitoring, counter-jamming awareness, and cueing of other sensors without requiring direct visual contact. It may be valuable in low visibility or crowded environments, but RF data is not automatically equivalent to identity, intent, or precise location. Spectrum congestion, encryption, device randomness, non-emitting targets, spoofing, legal constraints, and privacy obligations can all reduce operational confidence. Strategic diligence should focus on independently tested detection and geolocation performance, lawful collection and retention controls, deployment references, integration depth, unit economics, and whether public-sector buyers will convert demonstrations into funded programs.
"""
