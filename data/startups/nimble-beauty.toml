name = "Nimble Beauty"
description = "Nailomatic Ltd. builds Nimble, an at-home robotic manicure device that scans, paints, and dries natural nails, sold with single-use polish capsules."
detailed_description = """Nimble Beauty is the consumer brand of Nailomatic Ltd., a privately held Israeli-founded beauty technology startup established in 2016. It sells an at-home countertop device designed to scan nail shape, guide a small robotic arm and brush, apply polish from capsules, and dry each layer with directed airflow. The company describes a combination of computer vision, AI, robotics, capsule dispensing, and control software. Its current retail model pairs a durable device with branded consumable polish capsules; the site currently lists capsules across multiple colors for $10 per set. The official support page says device orders ship to the United States only, with a one-year hardware warranty and a 30-day refund period.

The legal identity is Nailomatic Ltd. (Israeli registration number 515522183 in the Israel Innovation Authority profile), while the public-facing site terms name Nimble Beauty Inc. and its affiliates. The public sources reviewed do not map the relationship between those entities or disclose their cap table. IVC lists a Brooklyn address as the primary address and a Tel Aviv branch, with 11 employees in Israel in its undated profile. The Israel Innovation Authority lists the company under its Israeli technology companies portfolio and identifies its business as consumer electronics and personal aesthetics. The official store and product pages are live as of the research date. Target Global's portfolio page labels its Nimble Beauty investment "Exited" but gives no buyer, date, or transaction type; this does not establish that the company or its assets were acquired.

The catalog search for Nimble Beauty returned an existing record named Nimble on nimbleway.com. Square Peg's investor portfolio describes that Nimble as an AI web-data business founded in 2021 by Uriel Knorovich and Menachem Salinas. The business, founders, and domain differ from Nailomatic/Nimble Beauty. A separate lookup for Nailomatic returned no exact candidate identity. The generic word Nimble is intentionally not used as a standalone alias in this record because it is ambiguous and would collide with the distinct NimbleWay identity."""
