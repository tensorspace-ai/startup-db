name = "SolarWine"
description = "SolarWine is an Israeli agrivoltaics startup developing elevated, vineyard-compatible photovoltaic canopies and software that coordinates panel position with crop conditions. The system is designed to generate electricity and provide shade or weather protection while preserving access for vineyard machinery, including mechanical grape harvesters."
detailed_description = """**Product and the problem it solves.** SolarWine addresses the land-use conflict between food production and renewable-energy generation, with an unusually specific first market: vineyards whose rows must remain accessible to tractors, sprayers, pruning equipment, and mechanical harvesters. Conventional solar arrays can displace crops or obstruct the machinery that makes commercial viticulture efficient. SolarWine’s proposed canopy elevates photovoltaic panels above the vines and is shaped and controlled to preserve passage for vineyard operations. That makes its offer more than electricity from agricultural land: the company says the structure can also moderate heat, provide protection from some weather extremes, support crop management, and create a second revenue stream for growers. These are commercially meaningful outcomes in an arid and warming region, but the magnitude of crop, water, and revenue effects is not quantified in the public sources reviewed. The core customer problem is therefore joint optimization: produce grapes to specification while adding solar generation without turning the vineyard into an inaccessible power site.

**Core technology and how it works.** The system combines elevated photovoltaic structures, a canopy intended to move or orient panels, and a software layer that uses data and machine-learning methods to coordinate energy generation with agricultural requirements. Co-founder and CTO Eli Safra told ISRAEL21c that machine learning is used to control panels to balance and optimize solar energy; the official site describes an AI-driven platform for real-time analytics and crop-management decisions. The mechanical design is important because a vineyard canopy must clear equipment and accommodate seasonal work, rather than simply maximize panel density. SolarWine’s patent publication, EP4580391A1, names SolarVine Ltd. and inventor Dan Goldblat and describes a vineyard-panel system and control method intended to permit mechanized treatments such as harvesting, pruning, spraying, trimming, and canopy management. The patent record is a published application and does not by itself establish granted, enforceable, or commercially defensible rights. Public materials do not specify panel tracking axes, actuator design, sensor suite, control cadence, forecast models, electrical topology, storage integration, or measured conversion efficiency, so those remain technical diligence questions.

**Market, customers, and route to market.** SolarWine initially targets vineyard owners and wineries, with adjacent buyers among agricultural landowners, agribusinesses, solar developers, and renewable-energy operators. The product has to satisfy two stakeholder groups whose incentives do not always align: growers care about grape quality, vineyard access, and crop risk, while energy developers care about yield per hectare, grid connection, equipment uptime, and predictable project economics. The company’s route to market therefore depends on site-level partnerships and agronomic proof, not just hardware sales. Its first public implementation was at co-founder Dan Goldblat’s Yerucham vineyard, which provides a practical setting for iterative product work and a potential reference site while also creating an important related-party diligence question: performance at a founder’s own farm may not predict adoption by independent customers. SolarWine’s website says the design has been developed to preserve mechanical harvesting, and the company now describes expansion into jojoba plantations. That extension could widen the addressable market, but the public evidence does not yet show a repeatable deployment model, signed customer pipeline, power-purchase agreements, installation economics, or contracted revenue.

**Traction, financing, and outside validation.** The clearest operational signal is a pilot installation at Kerem Yerucham. ISRAEL21c reported in 2025 that the initial panel installation covered approximately half a dunam, or 500 square meters, and that SolarWine planned to extend it; the company’s current site lists installation in 2023, a first harvest test in 2024, and a second-generation tracker and another harvest in 2025. SolarWine describes its system as validated across multiple harvest cycles, but the accessible company material does not provide a named independent evaluator, control-plot design, energy yield, crop-quality series, water-use measurements, or audited project returns. The Israel Innovation Authority lists SolarVine Ltd. in its portfolio and describes photovoltaic solutions integrated with vineyards; its public profile records company support and identifies Dan Goldblat and Eli Safra as co-founders. Startup Nation Finder has reported roughly $320,000 of historical capital and a 1–10 employee band, while the IVC profile records additional grant activity without a public amount. These modest early-stage signals should not be conflated with a priced institutional venture round or proof of commercial scale. No customer revenue, production volumes, or signed utility-scale project value is publicly verified here.

**Founders and team.** SolarWine was founded by Dan Goldblat and Eli Safra, according to the company’s ecosystem profiles and reporting. Goldblat owns or operates the Yerucham winery and brings direct exposure to the grower’s operating constraints that the product is intended to solve; that founder-market link can improve feedback speed, though it makes independent replication especially important. Safra is presented as co-founder and CTO, a data scientist with a PhD and AI teaching experience. The patent publication attributes the named vineyard-panel invention to Goldblat, providing a concrete link between the founding team and the company’s technical work. The company website also lists agronomy, product, software, analytics, and business-development roles, suggesting an effort to combine viticulture with engineering and energy commercialization. Public biographies do not yet establish the size of the full-time engineering team, experience delivering bankable PV projects, grid interconnection expertise, or regulatory and construction capacity in export markets. A critical diligence step is to verify employment status, ownership of patent rights and software, field-service capability, and the balance between outside expertise and founder-led experimentation.

**Competitive dynamics.** SolarWine competes for agrivoltaic sites and investment against several distinct approaches. SolarGik supplies tracker hardware and site-control software, including products designed for agrivoltaic layouts; agRE.tech is building an autonomous robotics and orchestration system for agrivoltaic farms; Insolight develops dynamic agrivoltaic modules and crop-management systems; and Sun’Agri deploys dynamic agrivoltaic shading structures. Conventional ground-mounted PV, rooftop installations, shade nets, hail covers, and leaving the land dedicated to agriculture are also substitutes. SolarWine’s claimed differentiation is its vineyard-specific canopy geometry and operating concept, especially the aim to retain access for mechanical grape harvesting while using panel orientation to manage light and energy. That focus may make the design more useful to vineyards than a generic solar tracker, but it narrows the initial customer pool and exposes the company to crop-specific proof requirements. The competitive edge is not yet established by public head-to-head data on cost per hectare, grape quality, energy output, maintenance, storm resilience, or lifecycle economics. A customer may prefer a modular tracker supplier with a stronger balance sheet unless SolarWine demonstrates a clear combined agricultural and energy return.

**Strategic and dual-use relevance.** SolarWine’s relevance to security is through civilian resilience rather than a defense product. Its technology seeks to combine food production with distributed renewable generation on the same land, potentially adding shade and weather management in vineyards exposed to heat and water stress. In regions that depend on imported energy or face drought, heat waves, grid disruption, or agricultural labor shortages, systems that preserve cultivation while diversifying farm income can support food and energy continuity. The underlying canopy and control concepts may also inform protected agriculture or remote agricultural sites, but no military user, government security deployment, defense contract, or emergency-response installation is publicly documented. This record therefore treats dual-use as a strategic-resilience adjacency: the commercial vineyard system has credible relevance to food and energy security, while any direct defense application would be speculative. The platform should be judged on whether it can maintain crop access and production while adding useful power and reducing climate exposure, rather than on generalized claims about national security.

**Stage, trajectory, and diligence risks.** SolarWine is best classified as early stage. It has an operating vineyard pilot, a published patent application, government ecosystem support, and company-reported trials across harvest seasons, but its public record does not establish repeat commercial installations, independent agronomic results, material revenue, or project-finance acceptance. Its growth path could begin with paid pilots and standard vineyard configurations, then expand through solar developers, vineyard-equipment distributors, and energy partners if the combined economics work. The largest technical and commercial risks are whether panels protect crops without lowering grape quality; whether mechanized harvesting and maintenance pass safely beneath the structure; whether actuators and structures survive wind, dust, hail, corrosion, and repeated field service; whether crop analytics improve decisions beyond existing agronomy systems; and whether electricity sales, land permissions, grid connections, and project ownership can be arranged economically. Further diligence should request independent multi-season field data, control-site methodology, installation and maintenance costs, patent prosecution and freedom-to-operate status, customer references beyond the founder’s vineyard, and evidence of financing and permits for the next deployments. Until those milestones are available, SolarWine is a promising specialized pilot-stage agrivoltaics company rather than a scaled infrastructure supplier."""
