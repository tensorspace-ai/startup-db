name = "Ophir Optronics"
description = "Ophir Optronics is an Israeli photonics operating business and MKS brand supplying precision infrared optics, laser power and energy measurement, beam analysis, and OEM laser optics. Its products serve industrial, semiconductor, additive-manufacturing, research, life-science, commercial, and defense-adjacent applications."
detailed_description = """
Ophir Optronics develops and manufactures the measurement and optical hardware used to characterize, deliver, and control laser and infrared systems. Its portfolio includes power and energy sensors and meters, beam profilers and propagation analyzers, beam-position and spot-size tools, thermal-imaging lenses and optical elements for SWIR, MWIR, and LWIR bands, and OEM or replacement optics for high-power CO2 and 1-micron fiber lasers. This is a metrology-and-components business: its products help engineers establish whether a laser is producing the intended power, energy, shape, position, and stability, while its optics determine how infrared or industrial laser energy is collected, focused, or delivered.

The customer context is broad but technically demanding. Industrial manufacturers and additive-manufacturing users need repeatable beam measurements to protect yield and process quality; semiconductor and electronics organizations need calibrated instruments integrated into laboratory or production workflows; and laser OEMs may embed sensors or buy optical assemblies rather than purchase a complete end system. Current Ophir materials describe sensors spanning femtowatts to hundreds of kilowatts and picojoules to hundreds of joules, alongside high-power products such as Helios, BeamWatch, and BeamPeek. The breadth of wavelength, power, and form-factor requirements creates application-engineering and calibration demands that make technical support, traceability, software integration, and long-term product continuity important buying criteria.

Ophir was founded in Jerusalem in 1976 and is no longer an independent venture-backed startup. Newport acquired Ophir Optronics in 2011, and MKS Instruments acquired Newport in 2016; current official materials present Ophir as an MKS brand within Photonics Solutions. MKS/Ophir materials identify Jerusalem as the international headquarters and describe a global distribution and calibration footprint; an official product catalog states that Ophir employs more than 570 engineers, technicians, and skilled workers. These facts support treating the record as an acquired operating asset with established commercialization, manufacturing, and service capabilities, not as a seed or growth-stage financing opportunity. Public disclosures do not provide a clean standalone Ophir revenue, backlog, or margin view, so claims about growth, customer concentration, and segment economics require direct diligence.

Competitive pressure comes from established photonics and metrology suppliers including Coherent, Thorlabs, Edmund Optics, Jenoptik, Excelitas, and Laser Components, as well as customer-developed or lower-cost substitutes. Ophir's defensibility is strongest where a product is qualified into an OEM design, where calibration performance and wavelength or power coverage are difficult to match, or where a customer values an integrated combination of sensor, software, service, and optical expertise. Its current product range also benefits from accumulated data, application know-how, and a global calibration network, although those advantages are not necessarily exclusive. The position is weaker in standardized optics and instruments where specifications are comparable and purchasing can be competed primarily on price. The mature profile can bring installed-base stickiness and recurring calibration or replacement demand, but it also exposes the business to industrial capital-spending cycles and portfolio-prioritization decisions inside MKS.

The defense and national-security relevance is credible but should be described as enabling infrastructure rather than evidence that Ophir is a weapons prime or confirmed supplier to a particular program. Infrared lenses and assemblies can support thermal imaging, surveillance, and security payloads, while laser measurement, beam profiling, alignment, and calibration can support development and test of laser sources, directed-energy research, range instrumentation, and electro-optical subsystems. Ophir's own materials explicitly identify defense, homeland security, and surveillance applications, and some IR products carry export-license requirements; those statements establish adjacency, not a specific military sale. The same products are marketed for commercial and research applications, so a defense thesis should be validated at the product, end-customer, export-control, and program level. Strategically, Ophir matters because reliable optical metrology and IR components can constrain the performance, test throughput, and maintainability of higher-level sensing and laser systems even when Ophir is not visible in the final platform.
"""
