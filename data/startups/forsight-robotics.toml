competitive_edge = "ForSight's plausible edge is vertical integration around ophthalmology rather than adapting a general-purpose surgical arm: JASPER is described as combining micron-level precision, 14 degrees of freedom, 3D image guidance, defined safety boundaries, ergonomic surgeon positioning, and actionable procedural data. The first-in-human report and specialist advisory network strengthen the proof-of-execution narrative. The edge is not yet durable: it must be demonstrated through controlled clinical outcomes, regulatory clearance, instrument reliability, IP freedom to operate, hospital workflow integration, and a support model that can compete with familiar manual systems."

