dual_use_description = "Stardust is dual-use in a resilience and national-security sense, not because it has a disclosed defense weapon or military customer. Its core platform combines engineered materials, atmospheric sensing, high-altitude dispersion, climate modeling, and monitoring, all of which could become strategic infrastructure if governments investigate climate intervention as a response to heat, drought, food insecurity, water stress, energy demand, and instability. Climate stress already affects military readiness, critical infrastructure, logistics, migration, and allied continuity, so a credible decision-support or intervention capability would have security relevance. The countercase is material: the company has no publicly confirmed defense product, fielded military system, defense contract, or operational climate result. Any deployment could create cross-border effects and geopolitical coercion, making international consent, attribution, verification, and public legitimacy as important as the underlying physics. Dual-use=true records credible resilience relevance while the scores and risk level reflect that the capability is unproven and governance-constrained."
