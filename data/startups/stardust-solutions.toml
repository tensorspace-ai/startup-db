name = "Stardust Solutions"
description = "Stardust Solutions is a US-incorporated, Israel-based climate deep-tech startup developing Sunlight Reflection Technology (SRT), a proposed stratospheric aerosol injection system that uses engineered particles, atmospheric modeling, dispersion, and monitoring to reflect a small fraction of sunlight and temporarily reduce global heating. It is a high-consequence resilience technology with major scientific, geopolitical, and governance uncertainty and no disclosed commercial deployment."
detailed_description = """
**Product and the concrete problem it solves.** Stardust Solutions is pursuing a technology intended to address an extreme version of climate risk: a world in which greenhouse-gas emissions, heat waves, crop failures, water stress, migration, and resource conflict are advancing faster than mitigation and adaptation can contain them. Its proposed product is Sunlight Reflection Technology (SRT), a full-stack solar-radiation-modification system rather than a conventional carbon-removal plant. The company describes SRT as the controlled introduction of engineered particles into the upper atmosphere, where the particles would reflect a small fraction of incoming sunlight and temporarily lower global temperatures. The problem is concrete for national planners even if the proposed remedy is controversial. Extreme heat reduces labor productivity, increases cooling demand, threatens agriculture and water systems, and can destabilize fragile regions. A temporary temperature intervention could, in theory, buy time for decarbonization and adaptation while reducing peak climate stress. It would not remove carbon dioxide, stop ocean acidification, or substitute for emissions cuts. The company has framed its work as research and technology development, not as a currently fielded climate service. No customer, government deployment authorization, or operational climate contract is publicly disclosed.

**Core technology and how it actually works.** SRT follows the physical logic of large volcanic eruptions, which can place reflective aerosols in the stratosphere and produce measurable temporary cooling. Stardust says its approach uses engineered solid particles designed to be safe, controllable, and reversible, while avoiding some concerns associated with sulfur-based aerosols, including ozone chemistry and acid deposition. The exact commercial particle composition was not public for much of the company's development, and the current public record still does not provide a complete independent technical validation of the proposed formulation. In 2026, the company and academic collaborators published or listed research on engineered amorphous-silica particles with minimized heterogeneous uptake behavior, efficient dispersal of submicron solid particles, composite submicron particles, industrial-scale particle manufacturing, two-dimensional atmospheric modeling, and multi-state coordination. Those workstreams show what the system must solve: particle chemistry and atmospheric lifetime, narrow size distributions, deagglomeration and high-altitude dispersion, radiative forcing, geographic transport, measurement, and the ability to adjust or stop an intervention. The company is therefore developing a materials-and-atmosphere platform that would require particle manufacturing, aircraft or another dispersal mechanism, remote sensing, weather and climate models, and an auditable operating layer. The public papers are meaningful evidence of a serious research program, but they are not evidence that a complete system has achieved safe outdoor performance.

**Market, customers, and go-to-market.** Stardust is addressing a market that does not yet have a normal commercial buying process. Its stated eventual customers are national governments or international bodies that could decide whether to commission research, authorize a tightly controlled test, purchase monitoring and decision-support services, or eventually procure a climate intervention. The company has said it wants to engage policymakers and affected communities, including in the Global South, rather than treat deployment as a private unilateral decision. The initial go-to-market is consequently policy-led and evidence-led: assemble a credible technical stack, publish research, recruit scientific and governance advisers, create safety and controllability requirements, and build relationships with governments that face severe climate exposure. There are plausible adjacent buyers for pieces of the platform, such as atmospheric monitoring, high-altitude aerosol measurement, climate modeling, and scenario analysis, but Stardust has not disclosed product revenue or named paying customers. The commercial opportunity is theoretically enormous because a global climate intervention would serve every region, yet that same planetary scope makes procurement, liability, insurance, public consent, international law, and state coordination central parts of the product. The company cannot validate demand through ordinary enterprise pilots without first resolving whether the activity is permitted and legitimate.

**Traction, funding, and third-party validation.** Stardust has achieved unusually strong financial traction for a technology that remains pre-deployment. Public reporting describes an earlier approximately $15 million private round and a $60 million round disclosed in October 2025 led by Lowercarbon Capital, for approximately $75 million in reported funding across two rounds. The company's large private capital base made it one of the best-funded private SRM efforts, which is itself a strategic signal: investors are treating climate intervention as a possible resilience option rather than leaving the field entirely to universities and governments. Third-party validation is mixed and should be separated into categories. The company has published research with collaborators and lists work involving Columbia University, Hebrew University, Tel Aviv University, IMT Nord Europe, UC San Diego, Technion, and SUNY. It also commissioned a governance report by Janos Pasztor, a former United Nations climate-policy official, and has published guiding principles and a safety framework. These are real external relationships and public artifacts. They do not amount to independent confirmation that Stardust's particles are environmentally safe, that its models predict regional effects reliably, or that the economics of atmospheric deployment work. As of the latest public reporting, Stardust had not conducted outdoor SRM testing, and no government customer or field outcome had been disclosed.

**Founders and team background.** Public reporting identifies Yanai Yedvab and Amyad Spector as the founders of Stardust Solutions. Both are described as former Israeli government nuclear scientists, a background that is unusually relevant to a company working at the intersection of high-consequence physics, materials, national security, and state decision-making. Yedvab serves as chief executive, while Spector is identified in public research as a scientific and product leader. Eli Waxman, an astrophysicist and professor at the Weizmann Institute of Science, appears in the public record as a lead scientist and co-author on Stardust-associated work; he should not automatically be treated as a founder. A public profile in 2025 described a team of roughly 25 physicists, chemists, and engineers, while the current headcount is not disclosed. The company says its wider team spans atmospheric physics, chemistry, materials science, aerospace engineering, and environmental policy. That multidisciplinary composition is appropriate to the problem, because no single laboratory specialty can resolve particle toxicity, atmospheric transport, aircraft operations, measurement, economics, and governance. The same background creates diligence questions. Nuclear and defense-science experience can support disciplined safety engineering and government engagement, but it does not by itself establish expertise in stratospheric chemistry, monsoon dynamics, global public governance, or the democratic legitimacy required for planetary-scale intervention.

**Competitive dynamics.** Stardust competes with alternative climate-intervention approaches as well as with companies developing entirely different answers to climate risk. Make Sunsets is the most direct private comparator, using sulfur-dioxide balloons and selling disputed cooling credits with a much less capitalized and less institutionally developed approach. Academic programs such as Harvard's Solar Geoengineering Research Program and Scopex represent the research alternative, with universities and public funders emphasizing measurement, open science, and governance over commercialization. World View and similar high-altitude platform providers are potential enabling competitors for balloon or stratospheric delivery infrastructure, although no partnership or procurement by Stardust is confirmed. Climeworks and 1PointFive represent a different climate-tech path through direct-air capture and carbon removal, which is slower and more expensive but avoids intentionally altering planetary radiative forcing. SilverLining and other research organizations compete for the scientific and philanthropic attention that determines the field's evidence base, even though they are not commercial substitutes. Stardust's claimed edge is an integrated system around engineered solid particles, intended controllability, rapid reversibility relative to greenhouse-gas accumulation, and a full-stack combination of chemistry, dispersion, monitoring, and policy. Its weakness is that each part remains difficult and the central advantage is not yet independently demonstrated. If a regulator or government rejects SAI, the technical edge may have no addressable market; if the technology is validated, larger aerospace, chemical, defense, or government contractors could replicate the infrastructure.

**Defense, security, and resilience dual-use relevance.** Stardust's strategic relevance is strongest as a climate-security and resilience technology, not as a defense weapon. Climate-driven heat, drought, crop failure, water scarcity, displacement, and resource competition can degrade military readiness, critical infrastructure, and social stability. A credible, governed capability to model or temporarily reduce regional climate stress could therefore matter to national resilience, food security, water security, energy demand, disaster planning, and allied continuity of operations. The same technical stack also has security implications: atmospheric monitoring, high-altitude dispersion, remote sensing, geospatial modeling, and cross-border coordination are capabilities that governments may treat as strategic infrastructure. This is why the company belongs in a dual-use database, but the assessment must remain conservative. Stardust does not publicly present a fielded military product, offensive capability, or defense customer. Any state that could alter radiative forcing would create geopolitical leverage and potentially affect agriculture, water availability, military logistics, and civilian populations far beyond its borders. That makes governance, attribution, verification, and international consent part of the security problem. The European Parliament has explicitly recognized potential environmental, public-health, and geopolitical risks and the absence of a clear international governance structure. Stardust's resilience upside is real as a scenario option; it is not proof that unilateral or commercial deployment would be safe or strategically beneficial.

**Growth stage, trajectory, and key diligence risks.** Stardust is best classified as early-stage despite its substantial funding because it remains in research and development, has no disclosed operational deployment, no named paying customer, no public commercial unit economics, and no independently validated climate outcome. Its trajectory depends on turning promising materials and modeling work into a reproducible, internationally reviewable system and then persuading governments that the intervention is safer than the climate risks it is intended to offset. The diligence agenda is unusually demanding. (1) Scientific risk: particle chemistry, atmospheric lifetime, toxicity, ozone interactions, precipitation effects, and regional climate responses require independent testing and open data. (2) Governance risk: self-authored principles cannot substitute for national authorization, international coordination, affected-community consent, and enforceable oversight. (3) Deployment risk: manufacturing submicron particles consistently and dispersing them at altitude over a large area are major engineering and logistics problems. (4) Market risk: the potential buyer is a government or international body with slow procurement, high political exposure, and no accepted regulatory pathway. (5) Incentive risk: a private company that earns money from continued intervention could face pressure to normalize or prolong deployment, even if its stated mission is responsible research. (6) Reputation and litigation risk: public opposition, cross-border claims, environmental harm, and accusations of geoengineering without consent could halt the program. (7) Transparency risk: the early secrecy around the particle design and the reported absence of preregistered studies have already drawn criticism. The next credible milestones are independent replication, publication of raw methods and unfavorable results, a lawful and transparent test framework, evidence of broad international engagement, and a clear separation between research, deployment authority, and commercial incentives.
"""
