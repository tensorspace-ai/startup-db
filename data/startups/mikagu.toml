name = "MikaGu"
description = "MikaGu (Mikagu Ltd.) develops Air Sense, an acoustic-sensing and edge-AI retrofit for predictive maintenance of energy and other critical assets. Its 2026 investor deck also claims a first sale involving an ELTA classified system, a defense-facing use that remains company-reported and unverified by the customer."
detailed_description = """
MikaGu Ltd. is an Israeli early-stage company incorporated in 2025. The Israel Innovation Authority profile identifies company number 517141172, lists five employees (without a measurement date), and describes its work as fault detection, prognostics, and lifetime estimation for turbines, generators, pumps, and transformers. The company's present product description is substantially clearer than the older Claw & Talon record: MikaGu is marketing Air Sense, an acoustic predictive-maintenance retrofit for energy infrastructure, rather than a general mission-intelligence platform. The official site and its 2026 investor deck present acoustic analysis and on-device inference as the product's core; PLANETech's company profile also describes applications in energy and defense.

Air Sense is described by MikaGu as a complete hardware-and-software installation. Microphone arrays capture sound from rotating machinery and electrical equipment; a dedicated edge computer processes it locally and returns anomaly alerts, fault diagnosis, and remaining-useful-life estimates. The company says its models can learn from healthy operating data without fault examples, adapt to individual assets, and work without cloud connectivity. Its investor deck identifies commercial off-the-shelf hardware, acoustic signatures, edge inference, and actionable insights as the system layers. Those are company descriptions, not an independently documented design review: the company has not published architecture details, supported hardware, sampling specifications, model-evaluation methods, cybersecurity artifacts, or comparative benchmark data. The live website's performance table currently shows zero-percent placeholders for several asset categories, so it does not provide usable published accuracy figures despite broad qualitative claims about early detection and false alarms.

The commercial problem is concrete. Power plants, utilities, data centers, and other operators must maintain high-value pumps, motors, fans, transformers, and similar assets; a missed fault can mean downtime, emergency maintenance, and lost output. MikaGu's proposed retrofit could add an acoustic channel where vibration, temperature, or visual inspection has blind spots, while on-device processing addresses facilities that prohibit cloud transfer. The company website says Air Sense is monitoring equipment at Dorad and Dalia power stations and describes active engagements. Its investor deck places fuel-pump and servo proof-of-concepts in its milestones and labels a 2026 milestone "First Sales," listing an ELTA classified system, Dorad, Dalia/Dalya, and Electra. These are important traction claims, but they appear in MikaGu's own marketing and investor material; no named customer release, contract notice, order value, deployment scope, or independent operational result was located. The deck's account list and timelines should therefore be treated as leads for reference checks, not as independently confirmed recurring revenue or production-scale use.

The stated model is enterprise B2B: a per-asset monitoring subscription, installation and hardware setup, and non-recurring engineering when adapting to new asset types. The deck frames power-plant owners and operators as its initial customer profile and a land-and-expand path from limited pilots to plant-wide and fleet-wide monitoring. It also shows a five-year serviceable-obtainable-market estimate of $50 million across 100 power plants and revenue projections from $1 million in Year 1 to $45 million in Year 5. These are company forecasts, not achieved sales or validated market sizing; the deck does not state the calendar years represented, the assumptions behind plant counts and adoption, or the evidence supporting its proposed per-asset pricing. Long sales cycles, plant cybersecurity reviews, integration with maintenance workflows, safety procedures, and the need to prove value on each asset class are likely commercial constraints. Neither current revenue nor actual customer concentration is public.

Funding evidence consists of an Israel Innovation Authority Ideation (Tnufa) award recorded for 2025. MikaGu's investor deck describes a $70,000 non-dilutive grant; Startupim reports $60,000 for the same program, while the Authority's award profile confirms the award but publishes no amount. These cannot be reconciled from available evidence, so the grant amount is left unresolved. IVC also records an R&D grant dated June 1, 2025, while the company's deck's extracted milestone sequence appears to place its grant later in 2025; the award year is clear, but its exact date needs confirmation. The deck separately states a $5 million seed fundraising ask. That is a target, not closed financing. No priced or convertible private equity round, named private investor, valuation, company-announced lifetime funding total, revenue, profit, burn, or runway was verified.

The two named founders have unusually relevant experience if the investor-deck biographies are accurate. The deck identifies Tal Kfir as founder and CEO, with a PhD in AI and prior deputy-squadron-command experience, and Omer Tiger as founder and CTO, with experience leading Israeli Air Force maintenance-systems development, Mamram service, and a computer-science degree. IVC also lists both as co-founders, and the Authority identifies Kfir as its company contact. This combination could help MikaGu translate acoustic machine-learning work into maintenance workflows and restricted operating environments. The biographies are self-presented in the company deck rather than independently corroborated, and public sources do not reveal the full team, current functional coverage, founder time commitment, or the company's ability to support multiple installations.

Technically, the strongest possible distinction is the combination of acoustic sensing, retrofit installation, healthy-data anomaly learning, and fully local inference. If MikaGu can show repeatable early warning across multiple machine types without excessive false alerts, this may fit facilities where cloud-connected products are rejected. The use of commercial off-the-shelf hardware could lower deployment cost and speed pilots, but it also means hardware alone is not a moat. Defensibility would need to come from validated signal-processing and models, asset-specific calibration, a growing proprietary dataset, repeatable installation methods, secure lifecycle management, workflow integrations, and customer evidence. None of those advantages has yet been benchmarked publicly. Augury is a close commercial comparator: it markets continuous industrial machine-health monitoring across many equipment classes, combines AI diagnostics with reliability experts, and describes broad customer deployment and workflow support. Siemens Senseye is a larger enterprise alternative using machine-learning analytics over machine data, with cloud and integration capabilities. MikaGu's claimed air-gapped acoustic retrofit is narrower and may fit strict data-isolation requirements, but mature competitors have scale, customer references, domain data, integration capacity, and support operations that a five-person startup may lack.

Dual-use relevance is credible but should be narrowly stated. The primary disclosed market is commercial energy maintenance: avoiding faults in power-generation, transmission, and related critical infrastructure has a direct operational and economic use. Security relevance follows from offline acoustic monitoring of pumps, generators, motors, and other equipment in restricted facilities; maintaining base power and equipment readiness can matter to defense operators without implying autonomous targeting or battlefield decision-making. MikaGu and PLANETech explicitly describe energy-and-defense applications, and MikaGu's deck calls an ELTA classified-system engagement a first sale. That is a company claim, not external confirmation of a defense contract, production deployment, or system capability. No evidence was found of weapons integration, classified certification, government procurement, or a particular military mission. The relevant security diligence is whether the product's signal handling, update process, hardware chain, and outputs are safe and auditable inside customer-controlled environments.

At present MikaGu is best classified as an early startup with a named Israeli legal entity, an identifiable product, a government grant, founders, and company-reported pilots and first sales. Evidence is materially stronger than the earlier unverified-record assessment, but still too thin for a high-conviction investment or procurement view. The most decision-useful next evidence would be the Tnufa award letter and grant currency, signed customer references clarifying paid versus proof-of-concept deployments, independently measured detection and false-alarm results, revenue and subscription retention, the exact seed-round status, and documentation of data rights, IP ownership, cybersecurity, and offline update controls. The full private cap table and any patent filings also remain unknown.
"""
