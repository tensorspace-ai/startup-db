strategic_value = "Scanary could improve the resilience of crowded public spaces by making screening less dependent on queues, fixed gates, and intrusive manual searches. For Israel and allied security ecosystems, a successful system could contribute to protection of transport hubs, stadiums, border facilities, military sites, and other locations where open pedestrian flow and rapid threat localization matter. Its strategic value is limited by the need to prove performance against concealed non-metallic threats, maintain acceptable false-alarm rates, satisfy privacy and electromagnetic-safety requirements, and integrate with existing command-and-control systems. No public evidence reviewed here confirms military adoption or government procurement, so the strategic assessment should remain capability-based rather than deployment-based."
