name = "Scanary"
description = "Scanary is an Israeli security-technology startup developing checkpoint-free screening that combines electromagnetic imaging, AI threat classification, and augmented-reality alerts to identify concealed weapons and other hazards in moving crowds. Its initial market is civilian and homeland-security screening at airports, transit hubs, stadiums, and other high-throughput venues, with credible but not yet proven defense and force-protection adjacency."
detailed_description = """
Scanary develops a standoff screening platform intended to detect concealed weapons and other threats without requiring each person to stop at a gate, empty pockets, or pass through a conventional checkpoint. The company describes a system built from spatially deployed electromagnetic or radar sensors, three-dimensional imaging, machine-learning classification, and an operator alert layer that can use augmented reality to show the location of a suspected threat. Its public materials also describe integration with CCTV, access-control, and video-management infrastructure. Scanary says its approach can identify both metallic and non-metallic objects, but detection performance, nuisance-alarm rates, environmental limits, and certification remain diligence questions rather than established facts.

The customer problem is concrete: airports, stadiums, transportation hubs, retail centers, border crossings, and open-air events need to screen large flows of people while reducing queues and preserving a usable visitor experience. Scanary's website claims checkpoint-free, parallel screening of up to 25,000 people per hour and coverage of environments up to 200 square meters; those are company-stated product claims that should be validated through controlled testing and customer references. The value proposition is therefore operational as much as technical: if sensitivity and specificity are adequate, venues could move security staff toward exception handling instead of manually processing every visitor. Privacy positioning is also part of the offer, since the company says it does not rely on facial recognition or biometric tracking.

Public reporting in 2025 described Scanary as founded in 2024 by Israeli defense and high-tech veterans, including CEO and co-founder Ronen Yashvitz and CTO Dr. Gideon Levita, and reported a demonstration involving concealed objects at approximately 10 meters. A public company profile lists a team of roughly nine people, while the company site presents a broader leadership and engineering group. Reporting also said pilot programs were planned in Israel and subsequently in the United States. In December 2025, Jeffs' Brands said its KeepZone subsidiary had obtained distribution rights, including an Israeli stadium channel and broader regional rights; this is a commercial signal, not proof of recurring revenue, deployed systems, or end-customer acceptance. Funding, patent scope, regulatory status, deployment count, and conversion of pilots into paid contracts should be independently confirmed.

Competition is substantial. Scanary must differentiate against walk-through metal detectors, X-ray and other established checkpoint technologies, as well as newer people-screening systems such as Evolv Technology, Liberty Defense's HEXWAVE, Thruvision, and Rohde & Schwarz QPS. These alternatives bring installed bases, certification experience, procurement relationships, or different trade-offs in range, throughput, privacy, and detection coverage. Scanary's potential edge is the combination of multi-person standoff sensing, non-metallic threat classification, and a low-friction operating model, but that edge will only be durable if it survives adversarial testing and demonstrates lower total cost or better venue throughput.

The dual-use case is credible but should be framed as adjacent to the company's initial homeland-security market rather than as evidence of military deployment. The same sensing, classification, and alerting stack could support force protection at bases and checkpoints, protection of ports and critical infrastructure, high-risk law-enforcement operations, and screening around military or diplomatic facilities. Defense relevance is strongest where personnel must monitor open perimeters and dense pedestrian flows; it is weaker for battlefield ISR because Scanary's disclosed product is optimized for identifying objects carried by people, not for broad-area reconnaissance. Strategic relevance therefore depends on validated performance, exportability, privacy and safety compliance, integration with existing security systems, and credible procurement traction among government and infrastructure operators.
"""
