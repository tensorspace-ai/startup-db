name = "Avalor"
description = "Avalor was an Israeli-founded security data-fabric startup acquired by Zscaler in 2024. Its data normalization and vulnerability prioritization technology is integrated into Zscaler's Unified Vulnerability Management (UVM) offering."
detailed_description = """Avalor Technologies Ltd. was founded in Israel in 2022 by Raanan Raz and Kfir Tishbi to address the fragmentation created by enterprise security teams using many scanners, identity systems, cloud services, asset inventories, and ticketing platforms. Rather than position itself as another scanner, Avalor built a security-specific data fabric: connectors ingest heterogeneous security and business records; normalization, deduplication, and relationship mapping make the records usable together; and applications then turn that shared context into risk rankings, reporting, and remediation workflows. Its first application was Unified Vulnerability Management (UVM). This design targets a real operational bottleneck: teams can have large finding inventories but still lack a reliable way to connect a finding to an affected asset, its business importance, mitigating controls, responsible owner, and open remediation task.

The current Zscaler UVM product page describes the surviving commercial offer as built on Data Fabric for Security. It says the system correlates vulnerability and exploitability feeds with identity, asset, user-behavior, control, business-process, and organizational data, using more than 150 prebuilt connectors. Administrators can customize risk factors and weights, add data sources, create reports, and automate remediation through ticket assignment, two-way ticket reconciliation, and exception management. Zscaler also presents AnySource and AnyTarget connectors and a continuous threat exposure management (CTEM) accelerator. These are vendor descriptions; the public sources reviewed do not independently measure connector coverage, normalization accuracy, or the effort required to maintain integrations as upstream APIs and schemas change.

The practical value proposition is to reduce alert overload and move from vulnerability discovery to an owned, contextualized remediation action. That can matter where multiple scanners report duplicate issues or where the same vulnerability has different operational significance depending on asset criticality, identity context, business role, exploitability, and compensating controls. It may also improve reporting consistency across security, IT, and business teams. The product’s architecture creates an integration burden as well as an advantage: an incorrect entity match, stale feed, or incomplete relationship can mis-rank risk, obscure an exposed asset, or send a ticket to the wrong owner. Diligence should test data freshness, deduplication quality, explainability of risk scores, ingestion failure handling, connector maintenance, and the rate at which recommendations result in verified fixes.

Acquisition changed the distribution and data context. Zscaler acquired all outstanding equity of Avalor Technologies Ltd. in March 2024 and states in its FY2026 filing that Avalor's technology has been integrated into its cloud platform. The acquisition announcement described Zscaler telemetry being combined with Avalor's third-party sources. Zscaler's current product materials continue to market UVM under the Zscaler brand. This gives the product access to an established security platform, sales channel, and proprietary telemetry, but the public material does not establish how much of the UVM code, team, or roadmap remains distinct, whether all historical connectors remain maintained, or how much customer value depends on Zscaler-only data. Avalor should therefore be evaluated as an acquired capability inside a public platform, not as a presently independent venture-backed vendor.

There is evidence of commercial use, but it is not a standalone financial series. In its September 2024 Q4 earnings call, Zscaler said UVM acquired through Avalor was seeing strong traction. It also attributed nearly three percentage points of Q4 new and upsell business growth and two points for fiscal 2024 to its broader AI-Analytics group, which included UVM; those figures are not UVM-only revenue or contract value. The current UVM page presents customer stories and testimonials from Cushman & Wakefield, AdventHealth, and LifeLabs. These support the existence of product-level customer references, but do not disclose deal dates, prices, usage levels, renewals, or which parts of the deployment came specifically from Avalor technology. Before acquisition, TechCrunch reported 35 employees in April 2023 and said the CEO declined to disclose revenue or customer count. Ynet reported roughly 80 employees in March 2024. A Globes estimate placed end-2023 ARR near $3 million, but no company report or filing reviewed corroborates it.

The competitive set spans both specialist vulnerability products and broader exposure-management suites. Tenable One combines visibility across IT, cloud, identity, OT, and other assets with risk analytics and third-party connectors. Qualys VMDR couples vulnerability detection and threat intelligence with risk ranking, patching, and remediation. ServiceNow Vulnerability Response imports third-party findings, reconciles them with its configuration-management data, and routes remediation work. Avalor's historical distinction was the security-oriented normalization layer and cross-source context across multiple vendors, not exclusive ownership of vulnerability scanning. That advantage could be less compelling when customers already have an exposure platform, a mature service-management workflow, or the engineering capacity to unify data themselves. Zscaler distribution and first-party telemetry strengthen the integrated offer, while increasing the importance of proving portability, interoperability, and incremental outcomes for customers whose security estate is not centered on Zscaler.

The founding team brought enterprise data-platform experience into cyber security. TechCrunch described Tishbi as having led engineering at Datorama, after work at Citi and Playtika; Israeli reporting describes Raz as a former Datorama engineering leader and names both as Avalor co-founders, with Raz CEO and Tishbi CTO. That background maps directly to the data integration and analytics problem the company selected. It does not by itself establish deep vulnerability research or government cyber-operations experience. Their current roles, the retained engineering team, and ownership of the post-acquisition roadmap are not established by the reviewed public sources. Avalor's patent record includes granted claims around vulnerability-ticket grouping and multi-tenant language-model training, plus later data-fabric and exposure-management applications; patent listing metadata is not a substitute for a complete verified portfolio or legal opinion on present ownership.

Strategically, the asset adds a contextual exposure-management layer to Zscaler's broader cloud security platform. It is relevant to commercial organizations seeking to triage and remediate cyber risk across fragmented tools, and the same defensive workflow has plausible use in public-sector and defense security operations. Public evidence reviewed does not identify an Avalor-derived UVM contract with a government or defense customer, a classified or disconnected deployment, or a sovereign-hosting authorization. Zscaler's broader federal business cannot be attributed to Avalor UVM without product-specific evidence. The strongest current conclusion is that Avalor supplied a technically relevant capability that Zscaler continues to commercialize, while independent adoption, financial contribution, and defense suitability remain diligence questions."""
