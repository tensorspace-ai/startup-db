  "Acquisition completion date: Zscaler's March 14, 2024 press release says the acquisition closed March 13, while its FY2024 Form 10-K records completion on March 8. The filing date is used for completed_on and the press-release date remains noted.",
  "ARR: Globes estimated approximately USD 3 million ARR at end-2023; the CEO declined to disclose revenue to TechCrunch in April 2023 and no company or filing metric corroborates the later estimate. It is stored only as estimated.",
