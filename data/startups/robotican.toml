dual_use_description = "Robotican's core capabilities have substantive dual-use potential because the same autonomous navigation, perception, simulation, and unmanned-platform engineering can support defense, public safety, industrial inspection, emergency response, and research. The defense case is stronger than the civilian case: Rooster's confined-space and communications-relay concept, Goshawk's counter-UAS mission, and SPHERA's offline training value are particularly relevant to security and military users. Civilian adoption is plausible for search and rescue, hazardous-site assessment, and infrastructure inspection, but publicly available evidence does not establish a large commercial civilian customer base. Dual-use is therefore credible and strategically meaningful, while the current mix appears defense-led rather than evenly balanced."
