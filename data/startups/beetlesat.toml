key_technologies = ["Deployable high-gain reflector and expandable antenna mechanisms", "Ka-band LEO satellite communications payloads", "Small- and nanosatellite RF communications integration", "High-throughput non-terrestrial-network link design", "Antenna deployment, pointing, and on-orbit communications validation", "Constellation payload and ground-segment interoperability"]
