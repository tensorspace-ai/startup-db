name = "LayerX Security"
description = "LayerX Security develops an agentless browser and AI-interaction security platform that gives enterprises visibility and real-time control over prompts, uploads, SaaS activity, browser extensions, identities, and web sessions. Akamai announced a definitive agreement to acquire the company in May 2026, with closing expected in the third quarter of 2026."
detailed_description = """LayerX Security's core product is delivered as an enterprise browser extension rather than as a proprietary browser or a network-only inspection service. The company analyzes user-side web sessions and interactions across supported browsers, applications, devices, and identities, then applies context-aware controls to activities such as entering prompts, uploading files, copying data, opening links, and using browser extensions. Its public product positioning spans AI usage control, shadow-AI and shadow-SaaS discovery, data-loss prevention for GenAI and web applications, browser-extension governance, identity governance, and protection from web-borne attacks. The architectural claim that matters is last-mile visibility: controls operate close to the interaction where data and identity are combined, potentially covering activity that a DNS, proxy, or endpoint product cannot interpret cleanly without changing network architecture or user workflow.

The immediate customer problem is the rapid movement of sensitive work into browser-mediated SaaS and generative-AI tools. Security teams need to know which AI services employees and agents use, what information is pasted or uploaded, whether personal and corporate identities are mixed, and whether extensions can access credentials or enterprise data. LayerX's browser-native approach is designed to preserve the user's existing browser while adding policy enforcement and telemetry. That creates a plausible deployment advantage for organizations with heterogeneous fleets, unmanaged devices, contractors, or strong productivity constraints, but it also makes the extension's permissions, browser compatibility, privacy model, and resistance to bypass central diligence questions. Public materials and a KnowBe4 case study provide evidence of commercial positioning and customer use, but the database does not independently verify customer count, retention, conversion rates, or the effectiveness of the company's headline security claims.

LayerX competes in a crowded and converging market. Secure enterprise browsers such as Island and Palo Alto Networks' Talon, browser-security specialists such as Menlo Security and Seraphic Security, and SSE or broader security platforms such as Netskope can address overlapping parts of the problem. AI-security and DLP vendors can also compete for the same budget even when their enforcement point differs. LayerX's differentiation is the combination of browser-native interaction telemetry, real-time policy actions, support for ordinary browsers, and an expanding AI/agent control narrative. The company announced an $11 million extension to its $26 million Series A in April 2025, bringing reported total funding to $45 million. Akamai's May 2026 announcement further signals strategic value: it cited an expected year-end 2026 LayerX ARR of approximately $10 million and a purchase price of approximately $205 million, subject to customary closing conditions.

The national-security and defense relevance is protective and indirect but credible. The same controls can reduce data leakage, credential exposure, malicious-extension risk, and unauthorized access in defense-industrial, government-adjacent, critical-infrastructure, and other sensitive cloud workflows. They may complement zero-trust programs by adding interaction context to identity and access decisions, especially where personnel use commercial browsers and SaaS rather than isolated mission systems. There is no verified evidence here of a defense contract, classified deployment, or specialized military capability, so the dual-use case should not be overstated. The main forward-looking question is integration: if the Akamai transaction closes, LayerX's browser signals could become part of a larger zero-trust and edge-security portfolio; if timing or integration differs, the standalone business must still prove durable efficacy, low friction, and defensible economics."""
