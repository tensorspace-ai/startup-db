name = "Sightful"
description = "Sightful is an Israeli spatial-computing startup building Spacetop, software that turns compatible Windows laptops and AR glasses into a private, portable multi-monitor workspace. Its 2026 product is sold as a commercial productivity bundle and is aimed at mobile professionals and enterprise teams that need more screen area and visual privacy away from a desk."
detailed_description = """
Sightful, originally founded as Multinarity in 2020 and renamed in 2022, is focused on making augmented reality useful as a daily productivity layer rather than a broad metaverse or entertainment platform. Its current product, Spacetop for Windows, pairs lightweight XREAL One Pro AR glasses with software running on compatible Windows 11 laptops so users can arrange ordinary Windows applications across a large virtual workspace. The company previously introduced a dedicated screenless AR laptop form factor, but its 2025 launch repositioned Spacetop toward software plus third-party hardware compatibility. Sightful's release notes show active product iteration through July 2026, including onboarding, display scaling, content anchoring, sleep/wake recovery, and broader laptop compatibility.

The product matters because it addresses a concrete pain point in mobile work: professionals who rely on multiple monitors at a desk lose screen space, posture, and visual privacy when traveling, working in shared offices, or operating from constrained spaces. Spacetop's value proposition is therefore narrower and more practical than many AR platforms: create a roughly 100-inch-class private workspace without replacing the user's PC workflows. The current product page lists support for common Windows and web applications, a 57-degree diagonal field of view, 1920x1080 pixels per eye, and prescription-lens ranges; those specifications make the offer more tangible while also exposing the ergonomics and readability constraints that diligence should test. Sightful markets privacy, eye-level ergonomics, and work-from-anywhere productivity, but its own marketing claims should not be treated as independently measured outcomes.

Commercially, Sightful sits between consumer AR-glasses ecosystems, enterprise mixed-reality platforms, and conventional portable monitors. The software-first pivot increases potential scalability and reduces the burden of manufacturing a full computer, but it also makes the company dependent on glasses partners, PC silicon roadmaps, Windows integration, and enterprise IT acceptance. The current site presents an $899 purchase option, while its pricing page describes a $699 hardware cost plus a $27-per-license monthly software charge; the difference may reflect packaging or page timing and should be reconciled in diligence. Public launch materials cite international distribution with Deutsche Telekom and product or channel work involving SHI International, Intel, and XREAL. These are commercialization signals, not proof of shipment volume, retention, or large recurring revenue.

The defense and national-security relevance is credible but should be treated as an adjacency, not a proven defense business. A private AR workspace could help military, intelligence, law-enforcement, diplomatic, emergency-management, or contractor personnel review sensitive but unclassified material in aircraft, vehicles, operations centers, hotels, or shared workspaces where shoulder-surfing risk is real. It could also support portable mission planning, data review, and multi-application command workflows. However, there is no public evidence that Sightful is certified for classified information, ruggedized deployments, secure endpoint management, or government procurement. Visual privacy is not the same as information assurance: a government buyer would still need to assess telemetry, local storage, update controls, supply chain, endpoint policy enforcement, and the security of the connected laptop and glasses. Any defense thesis therefore depends on future hardening, accreditation, and integration with secure compute environments.
"""
