name = "Candiru"
description = "Candiru is the public identity of a secretive Israeli commercial spyware operation historically registered as Saito Tech Ltd. Reporting says its assets and staff moved to a new Israeli entity, Integrity Labs Ltd., but the legal completion and present ownership remain unclear."
detailed_description = """
Candiru is the best-known name for an Israeli commercial spyware vendor founded in 2014 by Eran Shorer and Yaakov Weizmann. Israeli company records and independent research trace its corporate registrations from Candiru Ltd. through DF Associates, Grindavik Solutions, Taveta and Saito Tech Ltd. The Saito Tech legal entity, company number 515126605, is still listed as active in a January 2026 directory snapshot, with a Tel Aviv address and a 2023 last annual report. That legal status does not establish that it still employs the operating team or owns the technology. Research published in 2025 identified a separate company, Integrity Labs Ltd. (number 517081089), formed in December 2024. CTech reported that U.S.-based Integrity Partners bought Candiru’s assets and transferred its employees in stages; Citizen Lab’s October 2026 report describes Candiru as operating under the Integrity Labs identity, while also saying the transaction’s current status is unclear. The record therefore keeps Saito Tech as the historical legal entity and treats Integrity Labs as a reported successor, not a verified legal name change. No current official product site or public corporate contact is verified.

The historical business model was selling intrusive cyber-infiltration systems to government agencies, packaged with exploits, implants, operator tools, infrastructure and support. Microsoft described this class of vendor as selling “hacking-as-a-service” packages, with governments choosing targets and conducting operations. Candiru’s leaked proposals described Windows, iOS and Android access, account and message collection, and licensing by the number of devices that could be monitored concurrently. Citizen Lab reported a proposal with a 10-device concurrency limit and paid options to expand the target count and approved territories. These are descriptions of historical marketing materials, not a current product catalogue or evidence that every option was delivered. “DevilsTongue” is Microsoft’s malware-tracking name, “Sherlock” is a vector named in a leaked proposal, and “Cyrus” is the system name in a 2020 proposal; none should be presented as a verified current product brand.

Technical reporting supports a meaningful capability record. In 2021 Microsoft and Citizen Lab analyzed Candiru-attributed Windows spyware and two Windows privilege-escalation vulnerabilities that Microsoft patched. Citizen Lab described persistent, modular malware and found infrastructure associated with operations in several regions. In its October 2026 investigation, Citizen Lab linked, with high confidence, a series of 2024–2025 attacks on at least 45 devices at Al Jazeera to Candiru spyware delivered through advertisements purchased by Israeli ad company Discover-Tech. The report documents a new delivery route using ordinary ad rendering, with no user click required. It attributes the ad platform and ad purchases to Discover-Tech and the spyware to Candiru; this does not identify the government end user, prove who paid Candiru, or show that Candiru owned Discover-Tech’s platform. The report is evidence that Candiru-linked tooling remained in use during the transition period, not proof of the legal entity responsible for every operation after the asset transfer.

There is some historical customer and commercial evidence, but little current commercial disclosure. A former-employee lawsuit, as summarized by Recorded Future, was the basis for reports of government clients beginning in 2016, revenue estimates of about USD 10 million in 2016 and USD 20–30 million by 2018, and growth from 12 employees in 2015 to 70 by 2018. These are litigation-derived historical estimates, not audited accounts or current operating metrics. Amnesty International separately assessed with high confidence that a Candiru/Saito Tech system was supplied to Indonesian authorities around 2020, with the Indonesian National Police the likely end user through Singaporean broker Heha. Three trade-record shipments in 2020–2021 carried a combined declared value of USD 33,169,153.27. That is a declared shipment value for a system Amnesty associated with Candiru, not verified Candiru revenue or a confirmed direct contract amount. Recorded Future later identified spyware infrastructure active into 2025. No current customer list, contract value, renewal, revenue, ARR, profitability, burn or runway has been disclosed in the sources reviewed.

The capital history must be separated from acquisitions. Historical research names Isaac Zack, founders Eran Shorer and Yaakov Weizmann, Universal Motors Israel, ESOP Management and Trust Services, and Optas Industry among shareholders or board-linked parties. Recorded Future also reports funding from Founders Group, but no public round announcement, amount, instrument, or dated round record was found. A UMI public filing states that on December 5, 2019 it agreed to buy 10 percent of a private Israeli cyber technology company for USD 9 million, with completion on December 9; Haaretz and Recorded Future identify the target as Candiru and the seller as Eli Wartman. This was a purchase of existing shares, not cash raised by Candiru. The approximately USD 90 million value reported around that transaction is an estimated implied equity value, not a disclosed financing-round valuation. In 2025, CTech reported up to USD 30 million for an asset and employee transfer, of which a USD 10 million first phase was said to be complete, with another phase dependent on export-license transfer. That transaction consideration is not company fundraising. No current cap table, beneficial ownership percentages, or confirmed parent company is public.

The founding team and some historical executives are identifiable, but present operating leadership is not. Citizen Lab named Shorer and Weitzman as founders, Zack as a major early shareholder and board chair, Eitan Achlow as CEO in 2019 corporate records, and Tomer Israeli as finance director. A January 2026 Saito Tech directory snapshot lists Zack, Shorer and Weizmann as directors. Recorded Future says corporate records identify Naftali Yoran as director of the separate Integrity Labs entity. These records do not prove who currently manages the spyware operation or whether the people and systems moved together. The only public headcount series located is historical; current employee count, retention, engineering capacity and succession are unknown.

Candiru competed in a narrow sovereign surveillance market where research quality, access reliability, platform coverage, operational support, and procurement relationships matter more than broad software adoption. Direct public peers include NSO Group, Paragon Solutions and the Intellexa/Cytrox ecosystem. Candiru’s historical differentiation was its Windows/browser exploitation and its reported extension to phones, cloud accounts and ad-mediated targeting. NSO’s Pegasus, Intellexa’s Predator and other vendors overlap in government buyers and intrusive access, but public evidence does not support a reliable head-to-head comparison of efficacy, price, market share, or delivery success. Cellebrite is an adjacent device-investigation supplier rather than a like-for-like spyware competitor. The commercial category can command large contracts, but it is exposed to extreme customer concentration, exploit disclosure, patching, endpoint defenses, infrastructure attribution, export restrictions and loss of government procurement access. The 2021 U.S. Entity List action is a material operating and counterparty constraint for Candiru’s historical entities.

The capability has national-security and law-enforcement applicability in principle: a government may seek access to a device for an authorized foreign-intelligence, counterintelligence or serious-crime investigation when other collection is unavailable. That is a potential use case, not evidence that Candiru’s current customers or deployments were lawful. The same access can expose private messages, credentials, files and communications of journalists, activists, dissidents and political figures. Citizen Lab and Microsoft documented civil-society targeting, Amnesty traced an opaque likely supply chain to Indonesian authorities, and the latest Citizen Lab report documented a zero-click attack route against journalists. Public evidence does not establish effective end-use monitoring, human-rights review, incident response, judicial oversight, export approvals for the successor, or a remedy process for affected people.

For commercial or strategic assessment, the key underwriting issue is not merely whether the historical tools were technically capable. It is whether the acquired operation has a clearly identified legal owner, valid export licenses, disclosed beneficial ownership, an accountable leadership team, verifiable customers and enforceable controls. Until that chain is documented, the legacy operation has research and security significance but cannot be evaluated like a transparent software startup. The known technical capability is offset by unresolved asset ownership, sanctions and licensing exposure, opaque customer relationships, uncertain current financials, and exceptionally high human-rights and reputational risk.
"""
