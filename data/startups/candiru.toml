investment_rationale = "Candiru has credible strategic fit for a narrowly defined sovereign-cyber thesis because reported capabilities address enduring demand for targeted access and intelligence collection. The signal is not a conventional investment recommendation: public evidence is too limited to underwrite valuation, current operations, or customer quality, while legal, sanctions, human-rights, platform-disruption, and reputational risks are unusually high. Any diligence case would require verified ownership, financials, export approvals, customer controls, and evidence of lawful use."
