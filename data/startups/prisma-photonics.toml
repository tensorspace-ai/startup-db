name = "Prisma Photonics"
description = "Prisma Photonics turns existing optical fiber into a distributed, long-range sensing network for monitoring power grids, pipelines, rail, subsea assets, communications infrastructure, and protected perimeters. Its Hyper-Scan platform combines optical interrogation, signal processing, and machine-learning event classification to produce location-aware operational alerts."
detailed_description = """
Prisma Photonics develops Hyper-Scan Fiber-Sensing, a distributed acoustic and infrastructure-monitoring platform built around existing single-mode optical fiber. An optical interrogator sends pulses through the fiber and analyzes minute reflected-light changes along its length, allowing the fiber to act as a continuous sensor rather than requiring a dense array of discrete devices. The company describes measurements of acoustic signatures and related strain, temperature, and pressure effects, with event localization at meter-scale resolution in some configurations. Its software layer uses signal-processing, mathematical, and machine-learning methods to classify events and suppress nuisance alarms. The practical value is not simply more raw data; it is the conversion of long corridors into an operational map of disturbances that can feed a command interface, SCADA environment, or digital-twin workflow.

The commercial target is infrastructure where inspection is difficult, failure is expensive, and fiber is already present or can be economically made available. Prisma markets separate solution families for transmission power lines, oil and gas pipelines, perimeter and compound security, rail, subsea cables and pipelines, smart roads, and communications networks. Public company material describes applications including physical disturbance, digging, intrusion, vehicle or pedestrian movement, icing, wildfire-related conditions, and faults on grid infrastructure. The pay-as-you-grow positioning and the ability to cover hundreds of kilometers per interrogator are important adoption arguments: an operator may expand coverage without installing and maintaining thousands of powered field sensors. However, deployment still depends on fiber routes, access rights, installation engineering, network connectivity, and integration into the customer’s existing operating procedures.

Commercialization evidence is stronger than a prototype-only profile but should remain evidence-calibrated. Prisma announced a roughly $20 million Series C in 2023 and a $30 million 2025 growth round led by Protego Ventures, which the company said brought total capital raised to $80 million. Its materials also identify deployments across thousands of kilometers and 15 Tier-1 transmission system operators in the United States and Europe; these are company-reported claims that warrant customer-reference and revenue diligence. The company has publicly described work with Great River Energy and selection for EPRI’s GET SET initiative, while its resource archive includes earlier agreements involving Israel Electric Corporation and Israel Natural Gas Lines. Those signals indicate movement into utility and critical-infrastructure workflows, but they do not by themselves establish recurring revenue, gross-margin quality, renewal rates, or broad deployment repeatability.

Competition comes from distributed acoustic sensing specialists such as AP Sensing, Luna Innovations/OptaSense, Silixa, Fotech, Bandweaver, and larger industrial-security or grid-monitoring integrators. Customers can also choose point sensors, fiber Bragg grating systems, video or radar surveillance, patrols, and conventional SCADA analytics. Prisma’s claimed differentiation is the combination of long-range coverage over ordinary pre-deployed fiber, high sensitivity, automatic calibration, classification rather than threshold-only detection, and a software workflow intended to make alerts actionable. The central diligence question is whether those advantages persist across heterogeneous fiber, weather, traffic, construction, and electromagnetic-noise conditions, and whether the company can deliver repeatable deployments without turning every installation into a bespoke services project.

The national-security relevance is credible but adjacent. The same sensing architecture can monitor borders, fences, military or energy compounds, communications links, rail corridors, pipelines, and other strategic linear assets for digging, tampering, intrusion, or suspicious activity. It can improve resilience against outages, sabotage, theft, and severe weather, and it may provide useful physical-layer awareness around communications networks. The public evidence reviewed here supports dual-use potential and strategic infrastructure relevance, not a claim of defense procurement or battlefield deployment. Further diligence should test cybersecurity and data-governance controls, export and supply-chain exposure, classification performance by event type, false-alarm rates in live environments, dependence on customer fiber quality, deployment economics, and concentration in utility or public-sector buyers.
"""
