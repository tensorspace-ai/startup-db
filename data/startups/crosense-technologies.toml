name = "Crosense Technologies"
description = "Crosense Technologies is an Israeli deep-tech startup developing passive, electronically steered antenna systems for real-time detection and tracking of drones and other low-altitude objects around critical infrastructure. Its stated value proposition is persistent, all-weather coverage with AI-assisted classification and tracking in environments where conventional radar or visual monitoring can leave gaps."
detailed_description = """Crosense is building a counter-uncrewed-aircraft and low-altitude airspace awareness product around electronically steered antenna technology rather than a conventional camera-only surveillance stack. Public descriptions identify a passive, real-time system intended to detect and track unauthorized drones and other near-ground aerial objects. The passive design is strategically important: it can reduce the electromagnetic signature associated with active emitters and may simplify continuous monitoring where operators need coverage without constantly transmitting. The company also describes AI-powered detection, classification, sub-meter tracking, and post-event analysis, although those performance claims remain company-reported and require independent field validation.

The initial customer problem is concrete. Airports, military bases, power stations, oil refineries, water facilities, telecommunications sites, and other sensitive locations need to detect small, low-flying objects early enough to support investigation, airspace management, or a countermeasure decision. The product is therefore closer to a sensing and situational-awareness layer than to a complete counter-UAS effectors system. That distinction matters commercially: Crosense may complement existing radar, radio-frequency, electro-optical, command-and-control, or mitigation products, but buyers will still judge it on track continuity, nuisance-alert rates, integration effort, and the quality of the operator workflow.

The company has a meaningful early commercialization signal in Gilat Satellite Networks' February 2025 Form 6-K announcement of an investment of up to $3.5 million in Crosense as part of a round co-led by Frontier Capital. Gilat framed the transaction as part of its expansion into homeland security and defense and highlighted potential access to its global sales and marketing channels. This is stronger evidence than an unverified funding database entry, but it is not proof of recurring revenue, production deployments, government procurement, or customer acceptance. Public disclosures remain limited, and the company has not made a canonical corporate website or detailed product documentation readily verifiable.

Competitive pressure is substantial. Counter-UAS specialists such as DroneShield, Dedrone, Sentrycs, and D-Fend Solutions offer established detection, identification, mitigation, or command-and-control alternatives, while radar and sensor companies can bundle hardware with long-standing defense and infrastructure relationships. Crosense's prospective differentiation is a combination of passive electronically steered sensing, dense-urban and difficult-terrain coverage, and a potentially lower-cost way to scale perimeter or site coverage. That advantage is only durable if test data confirms detection and tracking performance against small, slow, maneuvering, autonomous, and radio-silent targets, and if the system integrates cleanly with existing security operations centers.

The defense and national-security relevance is credible because low-altitude drone incursions affect force protection, airport safety, border and coastal surveillance, critical infrastructure resilience, and protection of public events. The same core sensing can support civilian sites, industrial safety, and near-ground avian hazard awareness, giving the company a plausible dual-use path. The main diligence questions are whether the antenna architecture delivers its claimed accuracy across cluttered environments, how models are trained and updated, what spectrum and export constraints apply, how much installation and calibration are required, and whether Gilat's strategic relationship produces repeatable customer access. Until those questions are answered with independent test results and deployment references, Crosense should be treated as a promising early-stage sensing platform rather than a proven scaled defense vendor."""
