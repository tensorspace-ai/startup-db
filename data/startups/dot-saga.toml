name = "DOT SAGA"
description = "Israeli public-safety startup building an off-grid communications and situational-awareness system that combines wearable tags, private mesh networking, and an operator command center for venues and field teams. Its core value is maintaining local alerts, coordination, and location visibility when cellular, Wi-Fi, or other conventional connectivity is unavailable."
detailed_description = """
DOT SAGA is developing a venue-owned communications and safety layer for places where public networks are unreliable, congested, or unavailable. Public descriptions identify rugged, screen-free smart tags or wristbands, local radio/mesh connectivity, a companion application, and an AI-enabled command center. A user can request help or share location through the wearable, while staff receive a common operational view and coordinate without relying on cellular service or consumer emergency systems. The product is best understood as a managed private network for safety operations rather than a general-purpose messaging app.

Its initial commercial wedge is public and personal safety in ski resorts, theme parks, camps, stadiums, live events, hospitality sites, and other large or remote venues. A venue can distribute tags, connect them to local workflows, and give staff visibility into alerts, teams, and incidents. Public material also describes offline staff communication, SOS functions, and command software. The buyer is the venue or site operator; end users are visitors, workers, families, or responders. December 2025 reporting said prototype testing was complete and a pilot was launching at Bulgaria’s Bansko ski resort. Company posts and a 2026 business-development profile describe other deployments and commercial activity. These are useful commercialization signals, but they do not establish recurring revenue, retention, production scale, or customer economics.

The technology competes with off-grid peer communications such as goTenna and Beartooth, Garmin inReach and other satellite messengers, professional radio and command software, and venue combinations of radios, CCTV, access control, smartphones, and manual procedures. DOT SAGA’s proposed differentiation is the combination of a closed local network, low-friction wearable access, location-aware alerts, and venue-specific workflow software. That bundle could help where users cannot be expected to carry radios or phones, but the company must prove radio performance, battery life, interference tolerance, privacy, installation economics, and reliable operation at high density. Claims about concurrent-user capacity remain company/test statements until independently validated in production environments.

Defense and national-security relevance is credible but its extent is still uncertain. A resilient local network, wearable distress signaling, location awareness, and a site command view can support search and rescue, emergency response, base or training-area safety, critical-infrastructure security, and coordination in degraded communications environments. A Michigan Israel Business Accelerator profile reports a paid Israeli Ministry of Defense proof-of-concept called Project Luna for RF and seismic sensors. That is a material defense signal, but no public Ministry confirmation, contract value, scope, acceptance result, or operational deployment detail was located. The strategic thesis is dual-use communications and sensing infrastructure rather than a proven battlefield product. DOT SAGA is an independent 2024 startup in Tel Aviv, with a small team and public support from the Israel Innovation Authority. Limited disclosure on revenue, margins, network performance, and repeat customers keeps execution and commercialization risk high.

The same MIBA profile reports a signed revenue-share pilot with an unnamed US ski-resort network, NIS 1.5 million in IIA grant support, a closed pre-seed, and an expected Seed announcement. The grant figure is not reconciled to the Authority’s award records; no private investors or Seed terms are identified. DOT SAGA’s company page describes first customer deliveries and a second IIA investment. The newly reported contracts and funding are single-source or company-attributed updates that warrant diligence follow-up, without treating pilots as scaled production or attributed government work as independently verified procurement.
"""
