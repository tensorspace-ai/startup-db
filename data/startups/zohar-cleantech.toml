name = "Zohar CleanTech"
description = "Zohar CleanTech develops ZoharX, a modular on-site system that treats unsorted municipal and industrial waste through an oxygen-free thermal process, producing usable energy and a reduced inert residue. The Israeli company targets municipalities, commercial and industrial facilities, and sensitive or defense sites that need to reduce landfill logistics and improve local operational resilience."
detailed_description = """
**Product and the concrete problem it solves.** Zohar CleanTech is addressing a physical infrastructure problem that is easy to underestimate: mixed waste is usually collected, hauled through dense urban or industrial areas, sorted imperfectly, and sent to centralized treatment or landfill. That chain creates recurring transport costs, truck traffic, emissions, land requirements, contractor dependence, and a vulnerability for remote or sensitive sites that cannot assume uninterrupted access to disposal services. ZoharX is the company’s answer: a modular, container-like facility intended to sit where waste is generated and convert unsorted waste into energy rather than treating waste logistics as an unavoidable external service. The company’s current website frames the system for three sectors — municipal, commercial, and defense — while its public Innovation Authority profile identifies clean energy as the initial market. The proposition is deliberately operational rather than purely environmental: reduce the volume leaving the site, avoid pre-sorting and long-distance hauling, create an energy stream, and leave a smaller, inert material stream. Zohar’s own marketing claims approximately 90% conversion to usable energy and approximately 10% inert material; those are company-reported figures that require independent mass-balance, emissions, and residue testing before they should be treated as engineering fact.

**Core technology and how it actually works.** Public technical descriptions identify ZoharX as an oxygen-free thermal process, while Doral Environmental Infrastructure describes a high-temperature reactor in which unsorted municipal solid waste is converted into synthetic gas, or syngas, for renewable-energy generation. In practical terms, the proposed flow is a feed system for mixed carbon-containing waste, a controlled thermochemical reactor that operates without ordinary combustion, gas handling and conditioning, and an energy-conversion stage. The inorganic fraction is reported to become an inert slag or stable residual material rather than a large landfill-bound stream. The important engineering choice is the attempt to accept mixed waste without a separate sorting line: this may simplify the site footprint and labor model, but it transfers complexity into feed variability, reactor control, gas cleanup, emissions management, ash or slag characterization, and uptime. Zohar’s official material emphasizes continuous, closed-loop, autonomous operation, modular deployment, a compact footprint, and compliance in sensitive environments. The company also states that its architecture is protected by Israeli patents and worldwide patent applications, but it does not publish patent numbers, claims, grant status, process temperatures, throughput, energy balance, emissions data, or an independent technical report. The public record therefore supports a specific technology concept and protection posture, not yet a fully independently validated commercial process.

**Market, customers, and go-to-market.** Zohar’s likely buyers are organizations for which waste removal is expensive, disruptive, or strategically inconvenient: municipalities and local councils, industrial plants, factories, hospitals, commercial centers, real-estate operators, rural communities, and facilities that operate away from robust utility or contractor networks. Doral’s public description explicitly lists municipalities, local councils, rural communities, green-city neighborhoods, factories, hospitals, and commercial centers as potential users. The company’s defense-sector page adds autonomous waste treatment for sensitive sites requiring control, safety, and resilience, creating a natural route into bases and other controlled facilities. The sales motion appears to be project-led rather than a lightweight software subscription: a site assessment, waste-profile analysis, permitting and environmental review, tailored implementation, equipment delivery, commissioning, and ongoing service. That model can produce large customer value if it avoids trucking and tipping fees, but it also creates long procurement cycles and site-specific engineering. Walla reported in 2023 that Zohar had completed several pilots with international companies operating factories and had entered a pre-sales phase, while the current site invites pilot applications and asks prospects to describe their environment and waste profile. No public source identifies a paying customer by name, contracted capacity, current installed base, recurring service revenue, or repeat-order rate, so the commercial funnel remains promising but not quantified.

**Traction, funding, and third-party validation.** The company has more validation than a purely conceptual climate-tech record, but the signals are uneven. The Israel Innovation Authority identifies Zohar CleanTech Ltd. as established in 2017, classifies it in energy and environmental technology, and describes ZoharX as a patented all-in-one waste facility for on-site treatment of household waste. The same government profile records an R&D-stage company and a supplementary-funding program, while an Israeli Ministry of Energy report describes a joint development project for a micro waste-to-energy system using gasification, off-grid operation, and reduced transport. Public funding totals are not fully consistent: Startup Nation Finder reports $1.85 million across three rounds, including a 2021 seed round associated with Doral Energy-Tech Ventures and earlier non-dilutive support; Walla reported approximately $4.5 million in cumulative funding in 2023. Those figures may reflect different inclusion rules or later updates, so the record should not present either as audited total capital. Doral’s own site confirms that its environmental-infrastructure business invested in Zohar and describes the syngas pathway. External recognition is also visible in Zohar’s official listing of the Arena Innovation Challenge 2023, INNOTAL Security Innovation Program 2024, and Local Government Innovation Award 2025. These are useful ecosystem and validation signals, not substitutes for an independently witnessed, continuously operating commercial installation.

**Founders and team background.** Zohar’s team has an unusually direct fit to the mechanical and national-resilience aspects of the problem, although public biographies leave the current organizational depth unclear. The founding group publicly associated with the company includes Dr. Chanan Gabay, Isaac (Tsachi) Shohat, and Uzi Segal; Startup Nation Finder additionally identifies Yaacov Tsemach as a co-founder and chairman in its historical profile. The current official site names Agay Yehezkel as chairman and CEO, Gabay as co-founder and VP Operations, Shohat as co-founder and VP R&D, Segal as co-founder and CTO, and Udi Lahav as CBDO. Gabay is described as an applied-mechanics Ph.D. with more than four decades in materials science and mechanical engineering, including leadership of materials laboratories in the Israeli Air Force, Motorola business development, and EU-funded research programs. Shohat is described as a mechanical engineer with more than 30 years of R&D leadership and experience developing advanced mechanical systems for national-level defense programs; Segal is described as a mechanical engineer with more than 35 years in R&D and technology leadership, including large marine platforms and national programs. Yehezkel is a senior economist and former Major General (res.) who led rehabilitation work for the Gaza Envelope as deputy director of the Tekuma Administration. This mix supports engineering, government, and resilience access, but the public record does not establish a large process-engineering bench, current headcount beyond a small government profile, or prior commercial waste-plant scale-up by the whole team.

**Competitive dynamics.** Zohar competes against several different approaches rather than one identical machine. **Enerkem** develops large-scale waste-to-methanol facilities that convert non-recyclable waste into chemical products, bringing stronger industrial scale and process experience but generally relying on centralized infrastructure. **Fulcrum BioEnergy** pursues commercial-scale conversion of municipal solid waste into sustainable aviation fuel, competing for feedstock, capital, and waste-conversion credibility. **Vanguard Renewables** uses anaerobic digestion for organics and renewable natural gas, which is a different feedstock and process but a familiar alternative for energy recovery. **Covanta** and other large waste-to-energy operators compete through centralized combustion plants, permitting expertise, and municipal contracts. **Doral’s own biogas projects** and local anaerobic-digestion operators compete for the same energy-and-waste budgets even when they do not process the same mixed stream. Finally, the incumbent substitute is still collection, sorting, transfer stations, landfill, and conventional recycling. Zohar’s claimed edge is the combination of modular footprint, mixed-waste intake, on-site treatment, and local energy output. That combination could be valuable for dense sites or remote facilities, but it must clear the hardest comparison: verified throughput and emissions performance at a total cost that beats established logistics and treatment systems after maintenance, permitting, feed variability, and residue handling are included.

**Defense, security, and resilience dual-use relevance.** Zohar’s dual-use case is unusually concrete for a climate and waste company because the Israeli innovation ecosystem records a defense-specific pilot. An INNOTAL challenge page states that a pilot began with Zohar CleanTech to develop machines for treating waste at IDF bases. The stated military need was to reduce contractors handling domestic waste in the field while assessing local energy generation; the desired solution had to process mixed waste without transport, operate in mobile or disconnected conditions, install and run simply, create manageable residue, and avoid pre-sorting. That requirement maps directly onto ZoharX’s public claims rather than requiring a speculative weapons application. At bases, border communities, emergency camps, remote logistics nodes, and disaster-recovery sites, localized waste treatment can reduce truck movements, contractor exposure, fuel demand, and dependence on vulnerable disposal routes. Energy production from waste may also support microgrid resilience, although the public record does not establish the electrical output, storage integration, or operational status of the IDF pilot. The defense relevance should still be bounded: Zohar is not a weapons developer, and no public source confirms a production military contract, classified program, certification, or fielded deployment. The strongest strategic reading is resilient sustainment infrastructure for controlled or disconnected sites, supported by a documented pilot and team backgrounds in defense engineering and national recovery.

**Growth stage, trajectory, and key diligence risks.** Zohar is classified as early because it was founded in 2017 but remains publicly described as R&D or pre-sales, with a small employee profile, pilot evidence, and no disclosed recurring revenue or installed fleet. The trajectory is attractive if the company can convert a compact demonstration into repeatable site deployments: first prove continuous operation on heterogeneous local waste, then establish permitting and emissions templates, standardize manufacturing and service, and use municipal, industrial, and defense references to expand internationally. The main diligence risks are specific. (1) Thermochemical scale-up: reactor availability, feed preparation, syngas cleanup, corrosion, thermal cycling, and uptime may be materially harder than a demonstration suggests. (2) Environmental compliance: “clean” and “zero-incineration” positioning must be tested with independent measurements of particulates, acid gases, dioxins, metals, odors, and residual materials. (3) Economics: claimed transport and landfill savings may be offset by capex, maintenance, staffing, insurance, permitting, and energy-conversion inefficiency. (4) Feedstock variability: unsorted waste composition changes by site and season, which can destabilize process control and output. (5) Commercial concentration: the company appears dependent on a small number of pilots, strategic partners, and grants, with no public evidence of repeat purchases. (6) Defense procurement: the IDF pilot is a strong signal but not proof of qualification or scale. (7) Capital and talent: a small team must cover process chemistry, mechanical systems, controls, emissions, safety, construction, and project finance. Priority diligence should focus on independently witnessed uptime and mass balance, permit status, pilot-to-paid conversion, the exact patent family, customer references, and the post-pilot status of the IDF program.
"""
