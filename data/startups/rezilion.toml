name = "Rezilion"
description = "Rezilion developed runtime-aware software supply-chain security technology that mapped software components to vulnerabilities, filtered findings by execution context, and automated remediation workflows across cloud, on-premises, container, and IoT environments. Its software assets were acquired by Rezolve AI in May 2024, so this record represents an acquired technology asset rather than an active independent startup."
detailed_description = """Rezilion was founded in 2018 and built a DevSecOps platform around a Dynamic Software Bill of Materials (SBOM). Its product combined software-component discovery with runtime analysis: rather than treating every vulnerable package version reported by a scanner as equally urgent, it attempted to determine whether the relevant component was present, loaded, and exposed in an operating environment. Public product material described coverage across development and production, cloud and on-premises infrastructure, hosts, containers, applications, and IoT devices. It also described aggregation of scanner results, grouping vulnerabilities into fewer component-level remediation actions, and exporting SBOM or vulnerability-exchange data.

The underlying customer problem is substantial. Security teams routinely face more CVEs than engineering teams can patch, and static package inventories do not show whether vulnerable code is actually executed. A runtime-aware layer can reduce investigation effort, improve prioritization, and connect security findings to tickets or CI/CD remediation. AWS Marketplace materials described SaaS delivery, AWS integrations including EC2 and EKS, and a product claim of filtering out as much as 85% of identified vulnerabilities; that is a vendor or marketplace claim, not independently verified performance. The marketplace listing and 2022 product announcements are useful evidence that the product was commercialized, but they do not establish current availability, recurring revenue, retention, or post-acquisition support.

The technology competed with several overlapping categories rather than a single direct substitute. Tenable, Qualys, Rapid7, Snyk, JFrog, Aqua Security, Wiz, and Vulcan Cyber could address portions of vulnerability management, software composition analysis, cloud security, or remediation orchestration. Rezilion's strongest differentiation was the attempt to turn runtime evidence into fewer, more actionable remediation decisions, especially in heterogeneous estates where static scanner output creates operational overload. Durability depended on broad deployment coverage, low agent or permission friction, accurate reachability analysis, integrations with incumbent scanners and ticketing systems, and proof that customers saved measurable engineering time. Consolidation by larger security platforms remained a structural competitive threat.

The strategic outcome is now clearer than the former startup record suggested. Rezolve AI disclosed that it completed an asset acquisition of Rezilion Inc. and Rezilion Ltd. on May 23, 2024 for approximately $7.3 million in cash, primarily acquiring software intellectual property. That supports treating Rezilion as an acquired asset and prevents current startup metrics from being presented as active-company facts. The acquired capability still has national-security relevance: defense contractors, government operators, critical-infrastructure owners, and connected-device programs all face software inventories and patch queues that are difficult to manage. However, public evidence does not demonstrate classified, disconnected, or government deployments, and the old corporate website now redirects to an unrelated destination. Diligence should focus on whether Rezolve retained, integrated, commercialized, or retired the technology; the state of the code and customer contracts; vulnerability-validation accuracy; offline deployment; data handling; and any continuing support obligations."""
