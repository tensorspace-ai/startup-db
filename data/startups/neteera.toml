name = "Neteera"
description = "Neteera develops contactless, radar-based patient monitoring that measures heart rate, respiratory rate, movement, sleep, and related activity without wearables, cameras, or direct skin contact. Its FDA-cleared platform is commercialized primarily for hospitals, post-acute care, skilled nursing, and senior living environments."
detailed_description = """Neteera Technologies develops an ambient patient-monitoring system built around high-frequency radar sensing and algorithms that interpret tiny skin and body movements. A sensor mounted near a bed measures cardio-respiratory micro-motion through clothing and bedding, then sends data to Neteera's HealthGate software for dashboards, trends, and alerts. The publicly documented FDA-cleared indication is narrower than the company's broader marketing: the 130H/131H Vital Sign Monitoring Sensor is cleared for adult heart-rate and respiratory-rate measurement in healthcare facilities and home monitoring, and is not intended to acutely treat potentially life-threatening situations. The product also exposes activity-oriented signals such as motion, position change, exit detection, and sleep-related metrics, with the exact clinical use and regulatory status varying by feature and market.

The commercial problem is persistent observation in settings where wired monitors and wearables are disruptive, labor-intensive, or poorly tolerated. Neteera targets hospitals, skilled nursing facilities, senior living, post-acute care, medical groups, payers, and home-care programs that want earlier visibility into deterioration and fewer unnecessary transfers. The company says its system is deployed in more than 36,000 devices globally and reports customer-statement-based outcome metrics, including an average five-day warning before hospitalization; those figures are useful traction signals but should be treated as vendor-reported rather than independently established clinical evidence. The product is delivered as a managed hardware, cloud, integration, and support workflow, including EHR connectivity and centralized monitoring.

Neteera has progressed beyond a prototype: FDA 510(k) clearance was granted in 2022, CE MDR certification is advertised by the company, and the company announced a $13 million Series B in 2023 followed by a $6.7 million extension led by Aescuvest with Foxconn participation. Its 2026 announcement of a GlobalMed and Smart Meter partnership gives it a route into the U.S. federal healthcare market, but this is a healthcare channel partnership rather than evidence of a defense contract. The business still faces the difficult execution layer common to clinical hardware: installation, workflow redesign, EHR integration, clinical validation by indication, reimbursement, procurement, and proving that alerts improve outcomes without creating new alarm burden.

The strategic and dual-use relevance is real but bounded. Radar-based, privacy-preserving measurement can be valuable for casualty monitoring in austere or contaminated environments, remote observation of patients who cannot wear sensors, and selected security or occupational-safety scenarios where physiological state is relevant. However, public materials reviewed for this record establish healthcare commercialization, not military deployment, border screening, or validated stress, deception, intoxication, or identity detection. Any defense thesis therefore depends on adaptation, additional testing, export and privacy review, and a separate procurement pathway. Neteera is strategically interesting as an allied contactless-sensing capability with an existing regulated product, while the primary investment case remains healthcare execution rather than an assumed defense market."""
