name = "Bold Security"
description = "Bold Security is an Israeli-founded cybersecurity startup that develops endpoint data protection software using on-device AI to monitor data interactions and prevent risky actions in real time."
detailed_description = """Bold Security Ltd. (marketed as Bold) is a privately held cybersecurity startup founded in 2024. Its official site describes an endpoint data protection product that runs AI on devices to understand data, user actions, applications, and destinations, then coaches, redirects, or blocks risky activity before data leaves the endpoint. The company positions the product around endpoint data loss prevention and protection of business data used with AI tools. The product is offered to enterprise buyers; the reviewed public material does not disclose pricing, subscription revenue, gross margin, or contract sizes. Bold's own site and AWS Marketplace listing describe the product and its capabilities, which should be treated as vendor claims rather than independent efficacy testing.

Bold's public company announcement says it emerged from stealth on March 12, 2026 and had raised $40 million from Bessemer Venture Partners, Picture Capital, and Red Dot Capital Partners. Calcalist reports the funding history as a $12 million Seed in 2024 and a $28 million Series A in March 2026, with a reported cumulative total of $40 million. This makes the round split attributable to reporting; the company announcement itself states the combined figure without round-by-round amounts. Picture Capital's announcement identifies Red Dot Capital Partners and Bessemer Venture Partners as Series A co-leads and describes Picture's participation as a significant follow-on. Calcalist says the Seed also involved Cerca and angels Assaf Rappaport and Roy Reznik. Public information does not reveal security terms, valuation, dilution, or the private cap table. No subsequent financing was found in the sources checked through October 4, 2026.

The company lists Nati Hazut as co-founder and CEO, Hadar Krasner as co-founder and CPO, and Omri Mallis as co-founder and CTO. Calcalist reports that Hazut and Mallis previously built SAM Seamless Network and that Hazut founded Polyrize, later acquired by Varonis; it also reports Krasner joined Polyrize as product executive. Varonis confirms the acquisition of Polyrize in 2020, but the $39.4 million acquisition-price figure in the legacy analysis is not supported by the sources used here and is omitted. Bessemer's portfolio lists its Bold partnership as beginning in 2024. Bold's official announcement describes deployments with Shutterfly, Spencer Stuart, and Tekion. These named deployments are useful evidence of commercial use, but public materials do not establish paid status, contract values, deployment scope, duration, renewal, or referenceability. Calcalist reported 24 employees in March 2026 and an expectation of doubling headcount by year-end; the latter is a forecast, not a verified current count.

The main technical proposition is to analyze data movement and user intent at the endpoint, where documents are opened, copied, uploaded, or submitted to AI services. If its models can classify business data reliably and enforce policy with acceptable resource use, local inspection could reduce dependence on cloud ingestion and intervene at a useful point in the workflow. That architecture may also support organizations with data residency constraints. It does not by itself prove that all analysis stays local in every configuration, that the software works offline, or that endpoint visibility is complete. The company should be asked for architecture diagrams, supported operating systems and applications, model update and rollback controls, CPU and memory overhead, tamper-resistance design, and independent security testing.

Bold's commercial opportunity sits across endpoint DLP, insider-risk management, and controls for employee use of generative AI. Its direct competitive set includes Microsoft Purview/Defender, CrowdStrike Falcon, SentinelOne, and Palo Alto Networks Cortex, alongside specialist data security and insider-risk vendors. Broad suites have distribution, telemetry, and procurement advantages; specialists may have deeper controls for particular channels. Bold's potential edge is contextual local analysis across user, data, and application behavior, but the company has not publicly supplied comparative benchmark data. Its reported reduction of alert volume by up to 90% is a company claim relayed by Globes, not an independently measured result. Customer testimonials on the company site, including an asserted reduction in AI incidents at a 3,000-endpoint deployment, likewise need reference checks and a clear definition of incident, baseline, and observation window.

Important diligence risks are execution and proof of repeatability. Public sources give customer examples and financing but no ARR, retention, win rates, churn, customer concentration, gross margin, burn, runway, or profitability. Buyers may resist deploying another privileged endpoint agent, particularly if incumbents can bundle comparable controls. Local models face drift, evasion, and adversarial manipulation risks; context classification errors can either interrupt legitimate work or miss sensitive data. Endpoint agents also create operational questions around updates, compatibility, privacy notices, audit logs, and incident response. The founding team's previous experience is encouraging, but current hiring, engineering depth, and ability to scale enterprise support are not independently documented beyond a dated headcount report.

Bold has technical dual-use potential because endpoint data controls and policy enforcement can matter in government and defense settings. However, the available evidence supports a commercial enterprise use case only. No public defense contract, classified deployment, government customer, or relevant certification was found. Do not value a defense channel until deployment authorization, air-gapped behavior, offline management, tamper resistance, auditability, and government procurement evidence are established. Patent databases were searched by company and product name at a high level; no company-specific patent or published application was identified in the sources reviewed. This is a search result gap, not proof that no intellectual property exists."""
