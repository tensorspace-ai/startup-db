name = "Kodem"
description = "Kodem is an Israeli application-security startup that connects code, dependency, container, and in-workload runtime evidence to identify exploitable risk, prioritize remediation, and verify that fixes change the security outcome. Its Runtime Intelligence platform also discovers and attributes AI agents, models, tools, and data connections inside running applications."
detailed_description = """
Kodem sells an application-security platform built around Runtime Intelligence rather than scanner output alone. The company says its core evidence source is memory analysis of running processes, correlated with execution, operating-system, code, and dependency evidence. The platform is organized around runtime-aware SAST and SCA, secret detection, exposure discovery, a runtime bill of materials, and AI-assisted triage. Its practical proposition is to distinguish a vulnerable component or code path that merely exists from one that is loaded, reachable, executing, and relevant in a running application. The public technology material also identifies two US patents for the runtime-intelligence foundation. Kai Red, Kai Blue, and Kai Defend frame investigation, remediation, and protection as a connected workflow, but the published product claims should be tested feature by feature in diligence.

The company is addressing a real enterprise pain point: security teams accumulate more findings than developers can review, while application architecture and software supply chains change continuously. Kodem’s workflow is intended to cut noise, rank issues by reachable or exploitable risk, and connect the answer to existing engineering and security processes. Its self-healing-application positioning adds three coordinated functions: validate real risk, propose a source or runtime response, and verify that the risky path is gone. The company describes dynamic fixes as targeted, human-readable, reviewed, reversible mitigations for software that cannot immediately be patched. Its agent-aware material says discovery and action attribution ship today, while per-agent enforcement is still the direction of development; that distinction is important when assessing current capability rather than roadmap ambition.

Kodem competes with established SAST and SCA vendors such as Checkmarx, Veracode, Snyk, Mend, GitHub Advanced Security, and Semgrep, as well as runtime and cloud-security platforms such as Wiz and Contrast Security. Its potential edge is the closed loop from code and dependency context to runtime evidence and post-remediation verification, with a newer extension into agent-aware application security. That edge is only durable if memory analysis and sensors have low operational overhead, reachability and exploit validation materially outperform static heuristics, and integrations fit existing CI/CD, ticketing, cloud, and workload environments. The company website reports 51 employees and $40M+ raised to date; LinkedIn reports a broader 51-200 employee band and Tel Aviv headquarters. The site presents customer logos and case studies, including Rapyd, but public references do not establish retention, deployment scale, revenue quality, or independent benchmark leadership.

Kodem has credible defensive dual-use relevance. The same runtime evidence and remediation controls can help protect commercial SaaS, financial systems, regulated workloads, and sensitive government or defense software, especially where teams need to determine which vulnerable dependencies actually execute in production. The company says it supports Linux and Windows, can run with an in-host sensor or sensorless analysis, and can operate in restricted or air-gapped environments; those characteristics improve potential high-assurance fit but are not proof of deployment in such environments. Its agent-aware visibility is relevant to mission systems that combine models, tools, credentials, and delegated actions. This is defensive cyber applicability, not evidence of defense contracts or classified deployment. The strategic case therefore depends on secure deployment architecture, data isolation, operator controls, performance, and proof that runtime analysis can be trusted in high-consequence systems.
"""
