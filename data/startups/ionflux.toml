name = "IonFlux"
description = "IonFlux develops Hy-Gen, an on-site hydrogen generator that uses water and encapsulated aluminum-based fuel to produce low-pressure hydrogen where power is needed. Its early target markets include off-grid power, battery charging, microgrids, mobility, and military field applications."
detailed_description = """**Product and problem.** IonFlux is addressing a logistics constraint in hydrogen fuel-cell use: hydrogen is commonly produced centrally and moved to users in pressurized vessels, which adds storage, transport, safety, permitting, and distribution burdens. The company’s Hy-Gen system instead aims to generate hydrogen at the point of use from a solid, transportable aluminum-based fuel and water. The resulting gas is fed directly to a fuel cell, which can provide electrical power without requiring the user to handle a high-pressure hydrogen tank. IonFlux presents this as an option for sites where grid connection is absent or unreliable, equipment must be portable, or moving conventional fuel is expensive. Its current public materials identify off-grid power, chargers, uninterruptible power supplies, microgrids, mobility, and military applications as target use cases. This positions the company in distributed power and hydrogen logistics, rather than in hydrogen production at utility scale. The central proposition is that a cartridge-based supply chain could make fuel-cell power practical in smaller or harder-to-serve locations; that proposition remains dependent on field performance, delivered energy cost, and a dependable cartridge return and replenishment model.

**How the technology works.** IonFlux describes a two-part system: proprietary aluminum fuel, called ALF in technical coverage, and a generator branded Hy-Gen or HyGen. Its fuel is reported as specially treated aluminum particles in sealed pods. When the pod is activated and the material contacts water inside the generator, a chemical reaction releases hydrogen. The hydrogen can then flow directly to a compatible fuel cell, which converts it to electricity; after reaction, the aluminum becomes alumina, which the company and reporting describe as recyclable into new aluminum products. Techtime attributes the technical foundation to research by Technion professor Alon Gany, who demonstrated that lithium-hydride treatment can weaken aluminum’s naturally protective oxide layer and enable its reaction with water. IonFlux’s commercial system packages that chemical insight into a solid fuel format and a controlled generator, so users do not need to make or store high-pressure hydrogen on site. The company states that its patents on the system and fuel are pending. Public sources do not disclose patent application numbers, independent performance data, the full chemistry, the cartridge’s end-of-life process, or measured net lifecycle emissions; those are material technical diligence items, not facts that should be inferred from the company’s “green” positioning.

**Market and go-to-market.** The near-term opportunity is not every hydrogen market at once. IonFlux is pursuing distributed applications where energy access and fuel logistics matter: remote infrastructure, field equipment, backup power, small mobility, and charging. The official product page lists a 300-watt system as the current product and gives higher outputs of 1–5 kW and 15 kW or more as future roadmap milestones. Techtime reports an initial demonstration using a small radio-controlled vehicle, while the official and ecosystem profiles describe charging and off-grid applications. Those are early product signals, not evidence of broad commercial deployment. The route to scale appears to combine generator sales or integration with recurring fuel pods, plus partnerships with fuel-cell integrators, equipment manufacturers, and customers who need local power. Omer Hiram has also described a potential circular supply pathway in which manufacturers use aluminum scrap from their own operations as an input, but public evidence does not yet establish a qualified feedstock specification or commercial supply agreement. The business must show that pod cost, processing, fuel-cell compatibility, service, and recycling economics beat the combination of batteries, solar-plus-storage, diesel generation, or delivered hydrogen for each target segment.

**Traction, financing, and validation.** The Israel Innovation Authority’s clean-hydrogen review names IonFlux among Israeli companies using chemical reactions to produce hydrogen, specifically describing a reaction between water and aluminum-based fuels. IVC’s company profile lists an establishment year of 2024, an R&D-stage business, a seed round dated October 2024, and an R&D grant entry in 2026; the public profile does not disclose round or grant amounts. The company’s own site calls the patents pending and identifies a 300-watt system as its current output. In July 2026, Techtime reported that the startup had received an initial product order from Israel’s Directorate of Defense Research and Development (MAFAT) for a field battery-charging system, and that it had raised seed funding through Haifa’s Road-2 incubator and obtained additional funding through the Creation-Space program. That reported order is a stronger validation signal than a stated market interest, but its size, delivery status, acceptance criteria, and follow-on potential have not been publicly detailed. The available evidence supports calling IonFlux an early, funded hardware venture with a government defense customer signal and prototypes; it does not support claims of scaled production, repeat orders, material revenue, certified deployment, or proven unit economics.

**Founders and team.** IonFlux’s public company profile and contemporaneous technical coverage identify Professor Ofer Zohar and Omer Hiram as founders. Techtime describes Zohar’s academic background in neuroscience at Johns Hopkins and Hiram as a chemical engineer with hydrogen-industry experience; IonFlux’s own site characterizes Zohar as a biophysics and cell-biology professor and entrepreneur, and Hiram as a chemical engineer and veteran hydrogen-industry executive. The combination is relevant to a company that must bridge reaction chemistry, generator engineering, and practical energy markets. IVC’s listing also names David Band as a co-founder, although the current official company page and Techtime’s founding account foreground Zohar and Hiram; the precise founding roles should therefore be verified directly in diligence. Public company materials identify a very small team, and LinkedIn reports a 2–10 employee band. Early hardware firms can benefit from a focused technical team, but IonFlux will need to add capabilities in process engineering, fuel-pod manufacturing, safety and quality systems, fuel-cell integration, and commercial channel development before supporting multiple customer environments.

**Competitive dynamics and edge.** IonFlux’s differentiator is the proposed packaging of transportable solid aluminum fuel with on-demand hydrogen generation, which shifts part of the hydrogen logistics problem from moving compressed gas to moving and managing a solid feedstock. That is a potentially useful system-level distinction, but it does not remove the need to compare total delivered energy cost, generator efficiency, reaction byproducts, water availability, output stability, and replenishment operations. Hydrogen alternatives include GenCell’s ammonia-based fuel-cell power systems and H2Pro’s water-electrolysis approach; modular electrolyzer suppliers such as Enapter also compete for decentralized hydrogen production. For power users, fuel-cell suppliers such as PowerCell and established diesel-generator, battery, and solar-plus-storage vendors address adjacent jobs with more mature supply chains. IonFlux may fit where those alternatives carry a heavier logistics, footprint, or resilience penalty, but it must prove that advantage in measured customer deployments. A reported MAFAT field-charging order indicates that the concept has attracted a defense user, while the product’s small-power starting point and pending patents leave the company well behind incumbents in manufacturing capacity, certification history, and installed base. The defensible edge, if achieved, would rest on fuel formulation, cartridge safety and usability, generator controls, recycling partnerships, and dependable cost per delivered kilowatt-hour—not simply on the fact that hydrogen is produced on demand.

**Defense, security, and resilience relevance.** IonFlux’s core product has credible dual-use relevance because the same portable energy architecture can serve commercial backup and off-grid power as well as military field charging. The company explicitly lists military use among its target markets, IVC includes military users in its target-market profile, and Techtime reports an initial MAFAT order for a field battery-charging system. These sources support a defense-customer signal; they do not establish broad operational deployment or combat-proven performance. In a field setting, a compact generator and solid fuel pods could reduce dependence on fuel convoys, grid connections, or pressurized hydrogen cylinders for charging radios, batteries, small vehicles, sensors, or other electrical loads. Civilian analogues include emergency response, disaster recovery, isolated communications sites, remote industrial assets, and temporary power at locations where diesel storage or frequent refueling is difficult. The potential resilience value depends on practical attributes that remain unreported publicly, including generator mass, noise and thermal signature, start-up time, output quality, operating temperature range, water requirements, cartridge shelf life, and the burden of handling spent alumina. Accordingly, the dual-use assessment is positive but bounded: the underlying distributed-power capability spans civilian and defense contexts, while most field performance claims remain at prototype or early-order stage.

**Stage, trajectory, and diligence risks.** IonFlux is best classified as early stage. Its 2024 establishment, disclosed seed financing, R&D grant, small team, 300-watt current system, future higher-power roadmap, and reported initial defense order place it beyond a research concept but short of demonstrated commercial scale. The next milestones should be treated as technical and industrial proof points: independent testing of hydrogen output and electrical efficiency; repeatable performance across temperature and load profiles; safety analysis for fuel pods, activation, hydrogen handling, and byproducts; validation of cost per kilowatt-hour against realistic alternatives; a credible closed-loop recycling pathway; and delivery with documented acceptance criteria to at least one repeat customer. Major risks include uncertain system efficiency and lifecycle emissions, scale-up from hundreds of watts to kilowatt outputs, dependency on specialized fuel processing and reliable feedstock, cartridge manufacturing and reverse logistics, fuel-cell integration and certification, and long enterprise or government procurement cycles. The defense order is strategically meaningful, but a single disclosed order cannot establish durable demand. Pending patents provide an IP signal but not confirmed freedom to operate or enforceable claims. The most important trajectory question is whether IonFlux can industrialize both sides of its offer—the generator and the consumable fuel supply—at a cost and safety profile that makes point-of-use hydrogen more convenient than batteries or established generators for a narrowly defined customer segment."""
