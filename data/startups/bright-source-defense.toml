key_technologies = ["OASES energy management and optimization software", "AI-assisted renewable generation and price forecasting", "Physics-based modeling for solar and storage asset behavior", "SCADA edge-controller integration for field assets", "Digital-twin planning and sizing workflows", "Battery energy storage dispatch and multi-market bidding optimization", "Vendor-agnostic DER and microgrid orchestration"]
