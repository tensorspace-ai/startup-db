name = "Faye"
description = "Israeli-founded travel insurtech combining U.S. travel coverage, real-time trip support, digital claims and wallet reimbursements in a mobile and partner-distributed platform."
detailed_description = """Faye is the consumer-facing travel-protection brand of Zenner Inc., a Delaware corporation. The company’s customer product is an app for U.S. travelers that combines single-trip insurance with trip alerts, assistance, claims intake and reimbursements. Coverage described on Faye’s current site includes trip cancellation and interruption, emergency medical care, baggage and delay protection, with optional benefits for pets, rental cars, adventure sports and cancel-for-any-reason coverage. The app also provides 24/7 human assistance, telemedicine access, eSIM connectivity and trip-document storage. Approved reimbursements can be sent to Faye Wallet. These are product and company claims; limits, exclusions and availability vary by policy and state.

The commercial structure matters. Zenner Insurance Services LLC is a licensed producer and claims administrator, while U.S. carriers underwrite the insurance risk. Faye’s legal disclosures say it receives compensation from an underwriter as a percentage of plan cost and may share in underwriting profits. Travel retailers can also receive commissions. Madrona, Faye’s Series C lead, describes delegated underwriting authority that lets Faye help design products, price and select risk, and administer claims. That operational control can support product iteration, but it does not make Faye the insurer carrying the policy risk. Its product combines an in-house app and partner-facing portal/API with regulated carrier, assistance and claims relationships; the current division between internal systems and vendors is not fully public.

Faye began as a trip-disruption detection and assistance concept under the Zenner name, then shifted toward travel insurance during the COVID-era collapse in travel. Public sources disagree on the founding year: 2019 appears in Israeli and U.S. reporting, F2 says the founders approached it in early 2020, a 2024 CTech profile lists 2021, and a 2026 company release uses 2022, the insurance product launch year. The record uses 2019 as the earliest reported origin and treats 2022 as the launch of the current insurance product. The U.S. headquarters moved to Henrico County, Virginia, in 2026. Faye also has a large Tel Aviv operation; the company’s terms name Zenner AI Ltd as an affiliate, and a registry-data service lists that Israeli private company as active.

The route to market now spans direct-to-consumer sales, travel advisors, agencies and embedded distribution. Faye launched an advisor portal and API, and Travel Weekly reported that Ski.com became its first online travel agency partner in 2025, with coverage purchasable at checkout. A later company update announced availability in Guesty’s marketplace, although no contract value or partner contribution was disclosed. Faye historically selected Israeli vendor Five Sigma’s claims-management platform in 2022; later investor material describes internal policy and claims infrastructure. The public record does not establish whether that vendor relationship continues.

Scale is meaningful but the public figures are not audited. Faye’s CEO told CTech that the company generated more than $100 million in revenue in 2025. Travel Weekly described $100 million in annual sales, while the company said in August 2026 that cumulative funding had reached $100 million. Madrona said Faye had served hundreds of thousands of customers, most of whom actively used its app. CTech reported 179 employees in August 2026, split between 91 in Tel Aviv and 88 in the United States. These statements show a company beyond product validation, but they do not reveal policy count, repeat purchase, loss ratios, revenue recognition, margins or the share of sales distributed through partners."""
logo = "https://mma.prnewswire.com/media/1813537/Faye_Logo.jpg"
website = "https://www.withfaye.com/"
