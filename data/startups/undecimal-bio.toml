name = "Undecimal Bio"
description = "Israeli-founded biotech developing an AI-guided combinatorial chemistry platform and siRNA conjugates aimed at delivery to tissues beyond the liver."
detailed_description = "Undecimal Bio is an independent Israeli biotech company spun out of Eleven Therapeutics in 2025. Its DELiveri platform combines large combinatorial libraries of small-molecule conjugates, functional screens for productive intracellular siRNA delivery, and machine-learning models trained on those screens. The company says its data set spans more than 15 million compounds, over 500 million data points, and more than ten tissue types. Its initial disclosed therapeutic focus is renovascular disease, while it also describes platform collaborations with large pharmaceutical companies without naming partners or disclosing whether the work is paid. The company has operations in Tel Aviv and Cambridge, UK. It announced an $18 million seed round in October 2026."
logo = "Unknown"
website = "https://undecimalbio.com/"
sector = "Biotechnology; RNA therapeutics; AI-enabled drug discovery"
founded = "2025"
headquarters = "Tel Aviv, Israel, and Cambridge, United Kingdom; Israeli registered address in Ramat Gan. A single global headquarters is not explicitly designated in the sources."
employees = "11-person UK team reported at launch; total company headcount not disclosed."
funding_stage = "Seed"
entity_type = "startup"
dual_use = false
dual_use_description = "The disclosed product is an siRNA delivery and drug-discovery platform for biomedical research and therapeutic development. Searches of company materials and public reporting did not identify defense, intelligence, military, or security customers or applications. The technology is not assigned a defense use based on generic AI or chemistry capabilities."
key_technologies = ["Combinatorial small-molecule conjugate libraries", "siRNA delivery chemistry", "Functional intracellular delivery screening", "Transformer and agentic machine-learning models", "High-throughput molecular barcoding and sequencing"]
use_cases = ["Discovery of extrahepatic siRNA delivery conjugates", "Pharma and biotech research collaborations", "Development of proprietary renovascular therapeutic programs"]
investible = false
investment_rationale = "Undecimal addresses a consequential bottleneck in RNA interference: clinically useful delivery remains concentrated in a narrow set of tissues, while many disease targets sit outside the liver. Its proposed advantage is a tightly coupled experimental and computational discovery loop rather than a single fixed ligand. The company says DELiveri scores functional intracellular delivery across a large chemical search space and feeds those results into models that prioritize subsequent designs. The October 2026 $18 million seed financing, led by specialist life-science investor 4BIO Capital and deep-tech investor IQ Capital, gives the team initial runway to develop the platform and its first renovascular programs. The reported Cambridge laboratory team of 11 and the separately maintained Tel Aviv presence provide a plausible cross-border research base. These are early-stage merits, not proof of therapeutic value: the available evidence is dominated by company and investor statements, has no independent in-vivo data set, and supplies no named current customer, paid collaboration terms, clinical candidate, or dated financial performance. The record therefore treats the opportunity as scientifically interesting but highly uncertain, rather than as an investment recommendation."
strategic_value = "If DELiveri can reliably identify conjugates that deliver intact siRNA into disease-relevant cells, it could widen the range of RNAi targets and tissues accessible to drug developers. A useful platform might support both internal programs and co-development or research partnerships, diversifying value beyond a single molecule. The initial renovascular focus could provide a focused test of kidney and vascular delivery, where the platform's screening outputs would need to translate into meaningful tissue exposure and target knockdown. For an Israeli technology ecosystem, the company also represents a cross-border biotech build: an Israeli-incorporated company with Israeli cofounders and a UK laboratory team. Strategic value depends on whether its screen predicts in-vivo pharmacology, whether the transferred patent and associated data or know-how are sufficient to operate independently after Eleven Therapeutics' wind-down, and whether pharma partners accept the platform's results. No public evidence reviewed establishes a defense or security application."
