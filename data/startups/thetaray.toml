dual_use_description = "ThetaRay's financial crime detection technology has substantive dual-use relevance. Commercial mandate: regulatory compliance, fraud prevention, operational efficiency for banks, fintechs, and payment systems. Defense and security mandate: detection of terrorist financing networks, identification of financial flows supporting hostile state actors, sanctions evasion patterns, proliferation financing, and money laundering linked to illicit weapons procurement or trafficking. Governments and intelligence agencies require capabilities to identify clandestine financial networks, detect anomalies in cross-border flows indicative of state-sponsored or non-state malicious activity, and attribute financial behavior to threat actors. ThetaRay's agentic AI, pattern recognition, and network analysis capabilities directly enable both regulatory enforcement and counter-terrorism finance operations. Israeli government interest in financial crime (particularly terrorism financing) and the company's demonstrable relevance to national security finance functions support dual-use classification. However, ThetaRay is a commercial compliance vendor, not a defense contractor; it does not market capabilities explicitly to military or intelligence agencies, and no public evidence shows direct government weapons system integration. Dual-use classification reflects technology applicability and geopolitical relevance, not confirmed defense contracts."
