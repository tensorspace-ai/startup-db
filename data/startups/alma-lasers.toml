name = "Alma Lasers"
description = "Alma Lasers is an Israeli medical-device company whose Alma brand develops and sells laser, light, radiofrequency, plasma, ultrasound, and shockwave systems for medical aesthetics, dermatology, beauty, and selected surgical indications. It is a mature operating subsidiary of Sisram Medical, the Hong Kong-listed medical-aesthetics group majority-owned by Fosun Pharma. Eyal Ben David became Alma CEO in December 2025; Sisram’s 2025 revenue was US$365.3 million, but it does not disclose Alma standalone revenue."
detailed_description = """Alma Lasers develops and commercializes energy-based medical devices rather than a single therapeutic product. Its official portfolio spans laser and light sources, radiofrequency, plasma, ultrasound, imaging and analysis, and focused low-intensity extracorporeal shockwave technology. Examples include Alma Hybrid for configurable ablative and non-ablative resurfacing, Soprano platforms using diode lasers and Alma's SHR delivery approach for hair removal, PrimeX for radiofrequency and ultrasound body treatments, Harmony multi-application platforms, and Alma Duo for sexual-wellness shockwave treatment. The economic offering is therefore a combination of consoles, handpieces, energy-control systems, treatment protocols, training, clinical support, and service.

The commercial model targets physicians, dermatology practices, aesthetic clinics, surgical practices, and beauty operators that want multiple indications from a manageable equipment base. Skin rejuvenation, resurfacing, pigmentation and vascular lesion treatment, acne and scar treatment, hair removal, body contouring, skin tightening, and selected sexual-health or surgical procedures give a platform and its distributor network several routes to clinic adoption. Alma's current website reports more than 25 years of history, more than 50 patents, 12 direct channels, more than 100 distributors, more than 230 publications, and eight academies. These are company-reported figures, not independently audited traction metrics, but they are consistent with a substantial commercial, education, and clinical-support infrastructure.

Alma competes with Candela, Cynosure, Lumenis, Cutera, Fotona, BTL, and lower-cost regional suppliers, while clinics can also substitute single-indication devices or non-device treatments. Defensibility is consequently mixed. Multi-modality platforms, clinical evidence, regulatory clearances, practitioner familiarity, cooling and treatment-control features, installed-base service, and channel reach can support adoption and cross-selling. They do not remove price pressure, procedure commoditization, operator-dependence, or the requirement to support indication-specific safety and efficacy claims. Recent platform launches, awards, and education events are commercialization signals, but they are not evidence of independently verified market share, margins, or recurring revenue.

Ownership materially changes the diligence frame. Sisram's official materials describe Alma Lasers Ltd. as a wholly owned subsidiary, say Sisram was established after Fosun Pharma's acquisition of Alma, and report a group presence in more than 110 countries and regions. Alma is therefore best analyzed as a scaled corporate operating asset with ongoing R&D, manufacturing, sales, and distribution responsibilities, not as a venture-backed independent startup. The relevant questions are product-level growth, geographic and channel economics, regulatory and post-market performance, service quality, manufacturing concentration, and how much value Alma contributes within Sisram's broader ecosystem. Public materials establish the ownership and operating relationship, but do not provide a clean standalone Alma valuation or full standalone financial view.

Defense and national-security relevance is limited and indirect. Compact energy delivery, tissue-heating control, imaging, and clinical workflows could be studied for military medicine, rehabilitation, expeditionary dermatology, or field clinics, but those are hypothetical applications requiring different procurement, durability, training, and evidence standards. The public evidence reviewed does not establish defense contracts, military deployments, battlefield-care validation, or a security-focused roadmap. Alma should remain a commercial medical-aesthetics reference with weak dual-use adjacency, not a defense technology opportunity."""
