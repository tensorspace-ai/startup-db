strategic_value = "Strategic value lies in a scaled Israeli-origin energy-based-device platform with broad modality coverage, practitioner education, regulatory know-how, manufacturing capability, and a global direct-and-distributor network. Alma can serve as a benchmark for commercialization, clinical evidence, and clinic workflow integration. Its value to a dual-use thesis is constrained because the public business is overwhelmingly oriented toward elective aesthetics and outpatient medicine, while control already sits within the Sisram/Fosun corporate structure."
