name = "Mate Security"
description = "Israeli cybersecurity startup building an AI-native security operations platform that uses a Security Context Graph and agentic workflows to investigate, prioritize, respond to, and hunt threats with organizational context."
detailed_description = """Mate Security develops an AI-native platform for security operations centers (SOCs). Its central product thesis is that AI agents fail when they receive only human-oriented tables, logs, tickets, and documents without the operational context that experienced analysts carry in memory. Mate's Security Context Graph is intended to connect those sources into a living representation of organizational knowledge, including relationships among users, assets, policies, prior decisions, ownership, and investigative evidence. Agents can then retrieve context, correlate signals across tools, explain verdicts, and, subject to customer controls, take actions such as closing routine cases or escalating complex incidents. The company also describes a Reason Mining Engine and a broader continuous detection/continuous response architecture, but independent technical validation of these proprietary components is not publicly available.

The customer problem is concrete: enterprise SOCs face expanding alert volumes, fragmented security stacks, analyst shortages, and expensive SIEM and data operations. Mate integrates with existing SIEM, EDR, email-security, ticketing, and other security data sources rather than requiring a wholesale replacement of the stack. Its public positioning emphasizes learning an organization's tools, policies, homegrown systems, and prior investigations in hours, reducing repetitive evidence gathering and helping senior analyst knowledge persist. The company claims investigations that once took 45 minutes can take 45 seconds, and its newsroom cites pilots in financial services and critical-infrastructure organizations with reductions in mean time to respond and false positives; these are company-reported claims that require customer references, baseline definitions, and reproducible evaluation before being treated as proven performance.

Commercial evidence is stronger than the previous record indicated. Mate emerged from stealth in November 2025 with a reported $15.5M seed round from Team8 and Insight Partners, was selected for the 2026 CrowdStrike/AWS/NVIDIA cybersecurity accelerator, and announced a $35M Series A led by Canaan Partners in July 2026 with participation from Insight Partners, Team8, and Microsoft's M12. The company says more Fortune 500 organizations are deploying the platform and that growth increased by more than 500% since the third quarter of 2025, but detailed revenue, retention, deployment counts, and independently verified customer outcomes remain undisclosed. Its public materials identify founders Asaf Wiener, Oren Saban, and Guy Pergal, with backgrounds spanning Wiz, Microsoft, Axonius, and Apex; that is a credible domain and product pedigree, not proof of durable execution.

Competition includes incumbent SIEM/SOAR and XDR vendors with distribution, telemetry, and automation advantages, as well as AI-native SOC companies competing on autonomous investigation, response, and threat hunting. Mate's proposed edge is the context layer and institutional-memory model rather than a generic chat interface or a collection of static playbooks. The strategic question is whether that graph produces materially better accuracy, explainability, adaptation, and time-to-value across heterogeneous customer environments, or whether larger platforms can reproduce the capability using their existing data and control planes. Defense and national-security relevance is credible but indirect: military, intelligence, government, and critical-infrastructure SOCs also need high-tempo investigation, analyst augmentation, and resilient knowledge transfer. Public evidence supports a defensive cyber dual-use case, not a claim of defense procurement or operational military deployment."""
