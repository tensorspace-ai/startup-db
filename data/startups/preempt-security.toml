name = "Preempt Security"
description = "Preempt Security was an identity-security company founded in 2014 that combined identity, behavior, and risk analytics with Zero Trust and conditional-access controls. CrowdStrike acquired the company in 2020, so this record describes an acquired asset and its continuing strategic relevance rather than an independent startup opportunity."
detailed_description = """Preempt built software for detecting and preventing identity-based attacks across enterprise environments. Its platform connected identity and directory data with authentication and network activity, then used behavioral and risk analytics to identify compromised accounts, unusual privilege use, suspicious service-account activity, and lateral-movement patterns. Its deployment model could range from sensorless analysis of Active Directory and other enterprise sources to passive or active sensors. The active model could enforce adaptive authentication, block risky access, or apply other conditional-access policies in real time. This made the product more than an alerting layer: it was intended to turn identity context into an access-control decision.

The commercial problem was especially acute in hybrid enterprises that still relied on Active Directory while adding cloud applications, remote access, and distributed workforces. Identity stores contain the privileges attackers need after initial compromise, but traditional endpoint, network, and identity systems often expose different pieces of the attack chain. Preempt positioned itself around that gap, selling to organizations that needed identity threat detection, insider-threat controls, privileged-account visibility, and a path toward Zero Trust without replacing every existing directory or endpoint system. Public company materials described enterprise deployments, but the available evidence does not justify treating reported customer or workforce counts as independently audited traction.

Preempt raised an $8 million Series A in 2016 and a $17.5 million Series B in 2018, according to contemporaneous financing announcements. CrowdStrike announced an approximately $96 million acquisition in September 2020 and later disclosed that it acquired 100% of Preempt Security on September 30, 2020. The transaction validated the strategic value of identity-aware access controls to a large endpoint-security platform, but it also ended Preempt's independent commercialization and makes current standalone revenue, employee count, product roadmap, and customer retention difficult to assess. CrowdStrike subsequently described Preempt's capabilities as part of its identity-protection and Zero Trust portfolio.

The defense and national-security case is credible but should be stated narrowly. Military, government, and critical-infrastructure networks face credential theft, privilege abuse, and lateral movement, and the underlying control problem is materially similar to that of large commercial networks. Preempt's identity analytics and conditional access could therefore support defensive cyber operations, especially in environments with legacy directory infrastructure. There is no reliable evidence in the reviewed sources of a specific military deployment, government contract, or classified use, so the record treats defense relevance as technology adjacency rather than proven defense traction. The principal diligence question is not whether the problem matters, but how much of the original capability remains differentiated inside CrowdStrike's broader platform and how well it operates across modern cloud identity, machine identity, and non-human access patterns."""
