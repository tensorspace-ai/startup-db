name = 'Cyabra'
description = "Cyabra, Inc. is a publicly traded Israeli-founded narrative-intelligence and digital-threat software company. Its SaaS and on-premises products analyze online accounts, narratives, and coordinated activity to help government and commercial users assess manipulation and reputation threats."
detailed_description = """Cyabra Strategy Ltd. is the Israeli operating company beneath Cyabra, Inc., a Nasdaq-listed public company (CYAB) since the completion of its business combination on March 27, 2026. Its Israeli roots are confirmed by its Tel Aviv origin and operating presence; SEC filings identify Cyabra Strategy Ltd. as an Israeli company. The company was founded in 2017 according to its executive biographies and some contemporary coverage, although an older financing announcement and company profile refer to 2018. This report preserves the existing 2018 display field while flagging the date discrepancy for the public profile to resolve.

Cyabra sells narrative-intelligence software and related services. Company product pages describe monitoring and analysis of coordinated inauthentic behavior, fake profiles, narratives, sentiment, deepfakes and other online threats. Its stated capability is to combine account behavior and network relationships with language and narrative analysis, presenting results as evidence and alerts for corporate communications, security and intelligence teams. Its offerings include SaaS access and on-premises services; the precise scope of analyst-led managed services should be confirmed in diligence rather than presumed from broad marketing descriptions. Official case material describes a State Department analysis that scanned more than 30,000 profiles across Twitter, Instagram and Facebook and classified 33% as fake in a specific China-related conversation. This is a company-authored case study, not independent validation of general detection accuracy.

The strongest current traction evidence is now regulatory disclosure rather than the older private-company narrative. Cyabra reported 2025 revenue of $5.707 million, up 37% from $4.155 million in 2024, and first-half 2026 revenue of $3.268 million, up 26% year over year. It reported ARR of approximately $8.1 million at June 30, 2026 versus $6.3 million a year earlier. New customers contributed about $0.9 million of first-half 2026 revenue; management also reported some customer non-renewals. The same filing reports a first-half 2026 net loss of $14.209 million, operating cash use of $4.995 million, and cash and equivalents of $0.8 million at June 30. These figures indicate measurable recurring commercial activity but also substantial financing dependence and losses; ARR is a point-in-time company measure and should not be equated with recognized revenue or contracted backlog.

Historical financing includes a $1 million seed round led by TAU Ventures in 2018, a $5.6 million Series A announced in October 2021, OurCrowd SAFEs of about $1.5 million in May 2022, and further SAFEs/convertible notes documented in SEC filings. The company’s April 2025 investor presentation claimed $19 million raised in total, but the exact scope and reconciliation with the later SEC-recorded instruments are not fully transparent. A 2024 convertible note agreement initially provided $3.4 million with capacity for an additional $2.6 million; the commitment ceiling is not evidence that the full ceiling funded. Do not treat the SPAC transaction’s enterprise valuation, trust balance, PIPE commitments, or post-listing securities issuance as venture funding without tracing actual cash proceeds. The public listing changes the appropriate entity classification and adds periodic reporting, but does not remove execution, dilution, liquidity or going-concern risks.

Cyabra’s market spans corporate reputation monitoring and government/public-sector analysis of influence operations. Commercial buyers may use the service to investigate coordinated attacks, manipulated discussion, impersonation, or emerging brand narratives. Public-sector and security users may use similar network and narrative tools for situational awareness and election-related analysis. These are dual-use capabilities, but product capability alone does not establish a particular defense contract, government deployment, or efficacy against adversaries. The company’s older announcement named the U.S. State Department and advertising agency TBWA among clients and partners; this does not establish current contract status, contract value, or whether each relationship was a paid production deployment. The State Department case study supports historical use in a defined analytical exercise, not a broad claim of present procurement.

The competitive landscape includes Graphika, Blackbird.AI and Alethea in narrative and influence-threat analysis, plus social-listening vendors and broader threat-intelligence or open-source intelligence platforms. Cyabra’s publicly described differentiation is the attempt to connect account authenticity, coordinated networks and the narratives those networks amplify, with outputs designed for operational users. That is a credible product position, but independent comparative benchmarks, validated false-positive rates, platform coverage, data rights and repeatable procurement outcomes were not identified in the reviewed public sources. Its published patent application, US20200259862A1, names Cyabra Strategy Ltd. as applicant and concerns near-real-time detection of attacks and influence in social networks. The application is evidence of a disclosed technical filing, not proof that all marketed methods are patented or that the application remains enforceable as a granted patent.

The founding executive team includes CEO Dan Brahmy, CTO Ido Shraga and CPO Yossef Daar. Public filings describe Brahmy’s prior strategy-consulting work at Deloitte Digital, Daar’s business-intelligence research and Israeli military-intelligence experience, and Shraga’s prior CTO and Israeli defense engineering work. The company added public-market directors and executives around its listing; older references to Mike Pompeo as an adviser or board member must be checked against the current governance roster before being represented as current. Company materials named Emmanuel Heymann as CRO, and its current executive page reports David Low as CMO since June 2026. The public company’s transition creates reporting obligations and access to listed-company capital markets, while low reported cash, recurring operating losses, customer churn and potential equity dilution are material risks. Key diligence should focus on ARR conversion and renewal cohorts, customer concentration and contract quality, the post-SPAC fully diluted cap table and financing runway, detection performance under independent testing, and controls that prevent legitimate speech or protected activity from being mislabeled as coordinated manipulation."""
