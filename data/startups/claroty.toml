key_technologies = ["Passive OT and CPS asset discovery with deep packet inspection", "Safe native queries and project-file analysis for PLC, RTU, medical-device, and control-system inventory", "CPS asset profiling, device context, and protocol coverage across 450+ OT and automation protocols", "Exposure and vulnerability management for operational environments", "OT/CPS network threat detection and segmentation integrations", "Zero Trust secure remote access for employees and third-party vendors", "CPS-native AI context and agentic security workflows through the Claire initiative"]
use_cases = ["Industrial plant and manufacturing-line asset inventory and exposure reduction", "Hospital and medical-device security with clinical-operations context", "Utility, water, energy, and transportation critical-infrastructure monitoring", "Building-management and commercial-facility CPS protection", "Controlled remote access for equipment vendors and maintenance contractors", "Public-sector and federal OT visibility, hardening, and SOC integration", "Defense-supplier and military-facility segmentation and threat detection", "Incident prioritization and compliance evidence across distributed CPS estates"]
