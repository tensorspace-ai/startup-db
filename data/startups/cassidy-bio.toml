name = "Cassidy Bio"
description = "Cassidy Bio Ltd. is an Israeli genome-editing company developing an AI and experimental-data platform to design and prioritize gene-editing therapies, including guide and editor selection across genomic variants."
detailed_description = """Cassidy Bio Ltd. is an Israeli private biotechnology company founded in 2024. The company describes its product as an intelligence layer for therapeutic genome editing: a computational platform intended to rank guide RNAs, editing enzymes and contexts, and predict efficacy, safety, repair outcomes and genomic-variant effects. Its stated approach combines proprietary wet-lab datasets generated under therapeutic conditions, high-throughput assays and next-generation sequencing validation with a genomic foundation model. The company says the model is tuned on 70,000 genetically diverse human genomes. These are company descriptions; the public material reviewed does not provide independent benchmark data, model cards, peer-reviewed validation of Cassidy's own platform, or clinical results attributable to the company.

Cassidy's commercial proposition is to support pharmaceutical and biotechnology drug developers by reducing experimental search and prioritization cycles in gene-editing programs. The official site says candidate exploration that can take years may be shortened to days, and describes use cases spanning patient-fit guides across variant backgrounds, matching editing systems to cell types, and planning multiplex edits with predicted repair outcomes. Those timeline and performance statements should be treated as marketing claims pending evidence from prospective blinded experiments and partner programs. The site invites partners and links to a prediction-tool demo, but the sources reviewed do not document named paying customers, signed commercial contracts, production deployment, licensing revenue or therapeutic candidates entering clinical trials under Cassidy's sponsorship.

The company is headquartered in Israel and appears in Israel Innovation Authority records as Cassidy Bio LTD, registration number 516961513, established 2024, at R&D stage. That profile reports 25 employees and lists Rom Kshuk as CEO/co-founder and Yaniv Shmueli as CTO/co-founder. The official company site currently lists Kshuk as CEO, Ayal Hendel as CSO, Yael Yoffe Mizrahi as Head of Biology, Ilona Kifer as Head of Bioinformatics and Noam Barkai as Head of AI and Engineering. It identifies Doron Lipson, Daniel O'Connell, Saar I. Gill and Vic Myer as advisors or scientific advisers. These pages establish publicly presented roles, not employment dates or complete company staffing. Cassidy's presence on the June 2025 NIST Genome Editing Consortium workshop agenda, where co-founder and CTO Yaniv Shmueli was scheduled to speak on DNA foundation models for guide-RNA design, is an external technical visibility milestone; it is not evidence of NIST endorsement or a commercial relationship.

In November 2025, business coverage reported an $8 million seed financing led by Ahren Innovation Capital with Lool Ventures and 10D VC participating. This is the only publicly identified equity round found in the reviewed sources. Company lifetime funding is reported by coverage as $8 million, but no company-published total or detailed financing terms were located. The reviewed evidence does not disclose valuation, instrument terms, closing date beyond the reported November 2025 announcement period, ownership percentages, or a current cap table. Prior claims that AstraZeneca and Merck invested directly through AION Labs were not corroborated by the specific funding announcement and should not be repeated as investors in this round. An Israel Innovation Authority profile lists the company in the 2024 Technological Innovation Labs winner program and “Additional Funding 0”; this is a program record and does not establish that the company received zero grants across all programs.

The scientific opportunity is credible at the problem level: therapeutic genome editing requires choosing an editor and guide for a particular sequence, cell type and delivery setting while measuring editing efficiency, repair outcomes and unintended edits. Genomic variation can change guide binding and performance across patients. A data-plus-experiment feedback loop could help teams prioritize experiments and select candidates. But a foundation-model label alone does not demonstrate advantage. Diligence should examine data provenance and consent, ancestry and disease-context representation, leakage between training and test sets, external validation across editing modalities and cell types, reproducibility, calibrated uncertainty, and whether model rankings outperform transparent conventional baselines. Demonstrations should separate computational predictions from wet-lab confirmation and clinically relevant outcomes.

Cassidy competes and collaborates in a broad ecosystem rather than a neatly bounded software category. CRISPR design tools and assay providers such as Synthego, IDT and Benchling workflows can support guide selection and experimental execution; specialist genome-editing companies such as E9 Genomics publicly discuss DNA foundation models and off-target interpretation; academic and open tools offer sequence-level guide scoring. Therapeutic developers including Intellia, Editas and CRISPR Therapeutics are potential internal-build alternatives and potential users of external tools, not necessarily direct software competitors. Broader AI drug-discovery companies are less directly comparable because many focus on molecular targets or small molecules rather than editing design. Cassidy's potential differentiation is an integrated loop between proprietary therapeutic-condition experiments and variant-aware predictions. Whether its data are exclusive, sufficiently diverse, legally usable and predictive beyond public datasets is not established in the sources reviewed.

The team combines computational and experimental backgrounds. Kshuk's company biography states that he scaled Future Meat Technologies, which raised $400 million and grew beyond 100 employees; this is a biography claim about a prior company, not Cassidy traction. Hendel's research background includes CRISPR work and his public scholarly record identifies him as Cassidy's founder and chief scientific officer. Shmueli's NIST agenda appearance supports his public CTO/co-founder association. The company also presents experienced gene-editing and genomics advisers. Team credentials may help with scientific execution and partnerships, but the public record does not show complete biographies for every functional lead, hiring trend, retention, or governance structure.

Commercial risks include long validation cycles, expensive wet-lab programs, uncertain willingness of drug developers to rely on external prediction, and the possibility that customers treat the platform as a project-specific service rather than a repeatable software product. Scientific risks include distribution shift across editors, assays, cell types and patient populations; sparse labels for rare variants; off-target events that are difficult to measure; and overconfidence from data leakage or correlated assays. Data rights, privacy, consent and cross-border data governance are material because the company references large human-genome datasets. Regulatory status of a design platform differs from that of a therapeutic product, but any future company-sponsored therapy would face the full development and clinical evidence burden. The sources reviewed disclose no patents, patent applications, regulatory clearances, revenue, profitability or runway. No specific defense program, government customer or security application was found. Genome-editing design methods are dual-use in a general technical sense, yet Cassidy publicly positions its work around therapeutic medicines; evidence does not support assigning it a substantive defense thesis."""
