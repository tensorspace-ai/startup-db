investment_rationale = "Empathy has a credible enterprise software and services proposition in a real but specialized category, with a reported $47 million Series B and distribution across employers, insurers, and financial institutions. It is not an internal priority signal for a dual-use/deep-tech thesis: the product's value is in care delivery, workflow design, and institutional distribution rather than a defensible defense-relevant technical substrate. The main diligence case is commercial scalability, service economics, privacy, AI governance, and customer retention, not strategic defense exposure."
strategic_value = "Strategic value to defense-focused readers is limited. Empathy may illustrate how high-trust institutions can deliver sensitive, event-driven support through a software-plus-human operating model, and its workflow components could be adapted to survivor or military-family assistance. There is no public evidence that the company supplies defense, intelligence, cyber, autonomy, space, or critical-infrastructure capabilities, so it should not be treated as strategically relevant to national security beyond a speculative public-service adjacency."
