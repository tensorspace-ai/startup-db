name = "Solid"
description = "Solid is an Israeli-founded enterprise AI infrastructure company that creates and maintains business-aware semantic models from an organization's existing data, queries, documentation, and tools. Its context layer is designed to make analytics, data agents, and AI workflows more accurate, explainable, and consistent."
detailed_description = """Solid builds a context and semantic-engineering layer for enterprises that want to use internal data with AI but cannot reliably communicate what their metrics, tables, joins, and business rules mean. Its platform automatically discovers and documents data assets, analyzes metadata and prior SQL usage, and generates business-aware semantic models that can be consumed by BI tools, data teams, conversational interfaces, and AI agents. The product is not primarily a generic chatbot or a raw-data warehouse: its stated value is creating a continuously maintained representation of business meaning so downstream systems can ground answers and actions in approved logic. The company says it can operate on metadata and related context rather than copying underlying data, which is an important architectural and security consideration for sensitive enterprise environments.

The immediate customer problem is the gap between expensive enterprise data estates and production AI. Large organizations often have fragmented warehouses, dashboards, SQL repositories, documentation, and tribal knowledge; definitions drift as the business changes, while analysts become a bottleneck for every new question. Solid targets data leaders, data engineers, analysts, and business users in organizations with substantial existing data infrastructure. Its public materials name integrations or compatibility with platforms such as Snowflake, Databricks, BigQuery, Looker, Power BI, ChatGPT, and Gemini. The commercial proposition is therefore additive: improve the reliability and time-to-value of an existing stack without requiring a warehouse migration or a new business intelligence system.

Solid emerged publicly in February 2026 with a reported $20 million seed round led by Team8 with SignalFire participating. Calcalist reported that the company was in the sales phase, employed 20 people in Kfar Saba and five in the United States, and planned to expand U.S. sales and Israeli research and development. Solid's own site identifies Yoni Leitersdorf as CEO and co-founder and Tal Segalov as CTO and co-founder, and describes additional product, engineering, and research leadership. These are meaningful formation and financing signals, but they are not proof of repeatable revenue, retention, or broad production deployment. Customer references, conversion from pilots, security-review outcomes, and the durability of claimed accuracy or productivity improvements remain important diligence items.

The competitive field includes data catalogs, semantic-layer products, metrics stores, analytics-governance platforms, and AI-native data assistants. Atlan, Collibra, Alation, dbt, Cube, and Metaplane represent overlapping capabilities or substitutes, while Snowflake, Databricks, Microsoft, and other platform vendors can absorb adjacent functionality. Solid's potential edge is the combination of automated semantic-model generation, evidence from actual analyst queries and usage patterns, testing, and continuous maintenance across the customer's existing stack. That edge will only be durable if the resulting models are measurably more accurate and easier to maintain than a catalog, dbt project, metrics layer, or internally built retrieval-and-SQL system.

The defense and national-security case is credible but indirect. A trusted semantic layer could improve intelligence, logistics, readiness, procurement, cyber, and mission-support analytics where inconsistent definitions or hallucinated queries can lead to bad decisions. Private-VPC or self-hosted deployment and metadata-focused processing could help with sovereignty and data-minimization requirements. However, public evidence reviewed here does not establish defense customers, classified deployment, government contracts, or defense-specific controls. Solid should therefore be treated as dual-use enterprise infrastructure with potential allied-security relevance, not as an established defense technology vendor."""
