key_technologies = ["GNSS/RTK geospatial localization", "Autonomous outdoor robot navigation", "CAD and blueprint-to-coordinate mission planning", "Precision spray-paint and physical marking mechanisms", "Terrain-aware perception and obstacle avoidance", "Machine-control and construction workflow integration"]
