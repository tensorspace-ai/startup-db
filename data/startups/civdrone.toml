name = "Civ Robotics"
description = "Civ Robotics, formerly Civdrone, develops autonomous construction-layout robots and navigation software that transfer digital survey coordinates into precise physical markings for solar, civil infrastructure, roads, and other large outdoor projects. Its current product line has broadened from an RTK-equipped staking drone into ground robots such as CivDot+ and workflow products such as CivNav."
detailed_description = """Civ Robotics began as Civdrone, an Israeli startup founded in 2018 to automate the slow, repetitive process of construction staking. The original system mounted a staking mechanism on an enterprise drone, used RTK positioning to fly to blueprint coordinates, and drove coded markers into the ground. The company has since repositioned the core capability as a broader construction-robotics platform. Its current public product line includes CivDot and CivDot+ autonomous layout robots, CivDot Mini, CivNav, and CivMove; the public website emphasizes all-terrain ground layout, machine-control workflows, and solar and infrastructure deployment rather than a drone-only product.\n\nThe commercial problem is concrete: survey crews and construction laborers must repeatedly transfer points from CAD or surveying files onto large, uneven sites, including solar farms, earthworks, roads, airports, parking lots, and utility projects. Civ Robotics combines geospatial data handling, autonomous navigation, GNSS/RTK localization, perception, and a physical marking mechanism. The company says CivDot+ can mark to approximately 8 mm and CivDot to approximately 30 mm under stated conditions, while one operator can mark materially more points per day than a conventional survey crew. These are company-reported performance and productivity claims, so diligence should test accuracy, uptime, rework rates, and economics across soil, slopes, dust, weather, and different point densities.\n\nThe company has moved beyond a purely prospective prototype profile. Public evidence includes live-site trials with Shikun & Binui, earlier European Commission Horizon 2020 support, a 2022 seed investment associated with Trimble, a reported $7.5 million Series A announced in 2025, and current customer references on the company site from Qcells, Bechtel, and other construction participants. The company also states that more than 10 million coordinates have been marked across five continents. Those signals support a mid-stage startup classification, but they do not establish audited revenue, unit economics, retention, or the proportion of deployments that are paid recurring business. The current LinkedIn profile lists 11-50 employees and San Francisco headquarters, with an ongoing Tel Aviv presence.\n\nCompetition comes from established survey-tool vendors such as Trimble, Topcon, and Hexagon/Leica; construction-robotics companies such as Dusty Robotics and Built Robotics; and manual survey crews using total stations, GNSS rovers, or conventional drones. Civ Robotics' differentiation is the combination of blueprint-driven autonomy, outdoor mobility, precision geospatial navigation, and direct physical marking or machine-control output. Its advantage will be durable only if the system is easier to deploy, cheaper per completed point, and more reliable in difficult field conditions than incumbent workflows.\n\nThe defense and national-security case is adjacent rather than demonstrated. Autonomous geospatial layout and physical marking could support military engineering, airfield or base construction, logistics-site preparation, route and obstacle marking, and rapid disaster-response infrastructure. The same capability could reduce personnel exposure in hazardous areas, but current public evidence is commercial and construction-focused; there is no verified defense contract or military deployment in the sources reviewed. Defense relevance therefore depends on ruggedization, cybersecurity, denied- or degraded-GNSS operation, secure command links, export compliance, and proof that the platform can operate safely around personnel and equipment in austere environments."""
