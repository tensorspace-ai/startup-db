name = "Pagaya"
description = "Pagaya Technologies Ltd. (NASDAQ: PGY) is an Israeli-incorporated, New York-headquartered financial technology company. It embeds machine-learning credit decisioning into lender workflows and connects eligible consumer and real-estate assets with institutional funding through funds, securitizations, and forward-flow arrangements."
detailed_description = """Pagaya Technologies Ltd. is a public financial-technology company incorporated in Israel in 2016 and listed on Nasdaq as PGY since June 2022. Its principal executive office is in New York; it retains a large Tel Aviv operation. The company builds an API-connected network for banks, fintech lenders, auto finance companies, and other financial-service providers. Its software evaluates loan applications and supplies underwriting and asset-selection recommendations in partner workflows. Depending on the program, eligible originated assets can be bought by funds Pagaya manages or advises, securitization vehicles it sponsors or administers, or third-party vehicles under forward-flow arrangements. The lender generally originates and services the loan; Pagaya earns technology, integration, capital-markets execution, and contract fees and may retain risk through investments in loans, securities, and risk-retention positions. The model therefore combines software with capital orchestration, and does not mean Pagaya takes no credit or financing risk.

The disclosed product footprint covers unsecured personal loans, auto loans, point-of-sale receivables, credit cards, and residential real estate. Darwin Homes, acquired in 2023, added a technology-enabled single-family-rental operating platform; Theorem Technology, acquired in 2024, added an institutional consumer-credit asset manager. Pagaya's 2025 filing describes network AI fees as integration and capital-markets execution fees, alongside contract fees, and identifies securitizations and forward-flow agreements among the funding channels. A prospective partner should distinguish an API integration or announced partnership from a live, paying program: public announcements often describe access and intended expansion, but rarely disclose partner-level funded balances, fees, losses, or conversion rates.

Pagaya reports substantial scale, while its volume measures need careful interpretation. The company said its network had processed more than $3.6 trillion of loan applications through year-end 2025 and its June 2026 investor presentation updated that company-reported figure to more than $4 trillion. Applications evaluated are not originations, approved loans, or revenue. SEC filings report 2025 network volume of about $10.5 billion and fee revenue of $1.261 billion, with $81.4 million of GAAP net income attributable to Pagaya. For the second quarter of 2026, filings report $365.6 million in fee revenue and $45.3 million in GAAP net income attributable to Pagaya. These figures show an established, operating platform and a material improvement in profitability; they do not by themselves establish loss-adjusted returns, durability through a full credit cycle, or how much growth is attributable to any one partner.

The technology advantage is best understood as a system rather than a single model: lender integrations, application and repayment data, underwriting and asset-selection tools, investor relationships, and the operating machinery for financing vehicles and securitizations. Pagaya says its models undergo testing, validation, and governance; its 2025 filing also says models do not self-correct or learn continuously and that changes require human intervention and approval. That is relevant both to model governance and to claims of a self-improving network. A large application history can support better segmentation only if data rights remain available, input quality holds, outcomes are measured consistently, and human-approved model updates perform better on out-of-sample vintages. One patent was pending at year-end 2025, while the filing describes trade secrets, data, partner relationships, trademarks, and licensed technology as important assets. The public record does not show that a broad patent portfolio independently protects the core underwriting approach.

Pagaya competes with AI lending marketplaces such as Upstart, underwriting-software vendors such as Zest AI and Scienaptic AI, lender-built models, credit bureau scores, and conventional bank decision systems. Its differentiation is the integration of credit decisioning with access to institutional capital and structured-finance execution across multiple asset classes. That can make a lender integration more valuable than a stand-alone score or software license, but it adds funding-market, asset-performance, servicing, and execution dependencies. In 2025, the five largest ABS investors supplied about 46% of Pagaya's ABS funding. Investors can withdraw or reprice capital when borrower performance weakens or the cost of funds rises, even if the models and lender integrations remain in place.

The founders bring complementary experience: CEO Gal Krubiner worked on structured credit products at UBS; Avital Pardo helped design the AI credit system and previously worked on algorithms at Fundbox; and Yahav Yulzari brings real-estate development and partner-relationship experience. All three remain senior executives, and the company reports that Class B shares carry ten votes each. A June 2026 proxy shows each founder with substantial beneficial ownership and 40.1% to 43.3% of total voting power individually, including options and other securities as described in the filing. President Sanjiv Das brings senior mortgage and financial-services experience. The founder-led team has shown it can raise capital, integrate partners, and operate a complex public company, while dual-class control and related-party structures remain governance diligence topics.

Israeli connection is direct and documented: Pagaya Technologies Ltd. is registered under Israeli law, its 2025 filing reports 276 of 518 employees in Israel, and Tel Aviv remains a company office. New York is the corporate headquarters. The company also identifies Israeli regional conditions and reserve duty as operational risks. Its public customer and product evidence is concentrated in commercial credit and residential finance. Machine learning, data processing, and governed decision systems can transfer in principle to other regulated settings, but no public evidence reviewed here establishes defense, intelligence, homeland-security, or critical-infrastructure products, contracts, or deployments. Pagaya should be treated as a commercial financial-infrastructure company, not assigned a defense use case based on general technical transferability."""
