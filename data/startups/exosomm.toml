name = "Exosomm"
description = "Exosomm is an Israeli food-biotechnology startup developing a shelf-stable milk-exosome ingredient recovered from cheese whey, intended for functional nutrition and medical-food applications. Its initial clinical focus is inflammatory bowel disease, while its current commercial positioning emphasizes supplying ingredient companies and food manufacturers with a standardized, bioactive powder."
detailed_description = """
**Product and problem addressed.** Exosomm is developing a whey-derived milk-exosome ingredient that aims to preserve biological activity normally lost when dairy is processed into conventional food ingredients. The company’s original product concept was a powdered medical-food formula for people with inflammatory bowel disease (IBD), including Crohn’s disease and ulcerative colitis, where nutritional interventions can complement care but existing options do not work for every patient. More recent company positioning, described by CEO Rachelle Neumann in DairyReporter in July 2026, is broader and more B2B: a standardized, formulation-ready enriched whey powder for functional-food, supplement, drink-mix, and other nutrition brands. The stated product goal is not to replace prescribed IBD drugs. It is to give food manufacturers a stable way to incorporate naturally occurring milk exosomes and their molecular cargo into products. The commercial problem is preservation and standardization: a potentially useful dairy component is difficult to retain through ordinary processing, and manufacturers need ingredients that can be produced safely, consistently, and at scale.

**Technology and how it works.** Exosomes are small extracellular vesicles enclosed by a lipid membrane; milk exosomes carry proteins, lipids, and microRNAs that participate in cell signaling. Exosomm says its proprietary, chemical-free isolation and preservation process recovers these vesicles from whey, a side stream generated during cheese making, and concentrates them into a powder. In the company’s technical account, the vesicles protect their cargo through the digestive tract and interact with intestinal epithelial cells, where the cargo may affect gut-barrier, immune, and inflammatory pathways. Earlier material describes adding the ingredient to food, while the current site emphasizes shelf stability exceeding one year, standardized performance, and readiness for formulation. Those are company-reported product characteristics; independent data on recovery yield, vesicle identity and purity, cargo consistency, bioactivity after manufacturing, dosage, and shelf life are not publicly available. Milk exosomes as a scientific subject have published preclinical literature, including work associated with the founders’ Hadassah research network, but that literature should not be conflated with validation of Exosomm’s manufacturing process or finished ingredient.

**Market, customers, and go-to-market.** Exosomm’s initial application was the medical-food segment for IBD, where the company and its incubator described a powdered nutritional formula and a potential route into products such as yogurt and drink mixes. The July 2026 trade-press account indicates a shift toward ingredient supply, joint ventures, or licensing with food manufacturers, particularly in the United States. This could reduce the need for Exosomm to build a consumer brand and give it access to existing manufacturing and distribution, but it places the burden on the company to prove technical reproducibility, food-safety compliance, formulation compatibility, and a compelling cost-per-serving to potential partners. The raw material pathway is attractive in principle: whey is already produced at dairy scale, and recovering value from it may improve the economics of a specialty ingredient while diverting a food-processing byproduct into a higher-value use. Public material names Tnuva as an early strategic/commercial partner and identifies Tnuva Ventures as an investor, but no current commercial supply contract, recurring sales, retail product, licensing agreement, or named U.S. manufacturer is publicly confirmed. The addressable market is therefore a plausible set of food and supplement categories, not yet demonstrated revenue.

**Traction, financing, and external validation.** Exosomm was established in 2021 and has received Israel Innovation Authority support, including an expedited-program award in 2023 and a Startup Fund award in 2025. Startup Nation Finder records a January 2025 seed round of $1.7 million associated with Tnuva Ventures, Siddhi Capital, AgFunder, Mor Research Applications, and SOSV; that same directory reports $4.52 million across six rounds when non-equity funding is included, so those totals should not be treated as a single audited financing figure. Siddhi Capital lists Exosomm in its food-tech portfolio. In 2025 the company was selected as one of ten FoodTech World Cup finalists from more than 100 applicants, a useful industry-screening signal rather than technical proof. A Phase 1B, open-label, uncontrolled study of whey protein milk-derived exosomes in ulcerative colitis is registered as NCT06755021, with Exosomm Ltd. as sponsor and Hadassah investigators; registry-derived public mirrors reported it as not yet recruiting, and no outcome results were located. The company's current web materials cite preclinical and clinical experience, but the publicly visible record does not establish completed trial results, efficacy, regulatory clearance, or large-scale commercial deployment.

**Founders and team.** Exosomm grew from research associated with the Pediatric Gastroenterology Center at Hadassah University Medical Center. The incubator profile names Prof. Shimon Reif, a pediatric gastroenterologist and author of more than 100 papers in pediatric liver and gastrointestinal disease, as a co-founder and medical advisor; Yaffa Elbaum-Shiff, a nutrition researcher with experience in pediatric nutrition and the food industry; and Regina Golan-Gerstl, a researcher whose work concerns milk-derived extracellular vesicles and microRNA cargo. The incubator profile also identifies Netta Granot, with two decades of food-industry R&D and innovation leadership, as CEO and co-founder. Public leadership records have since changed: the Israel Innovation Authority profile lists Rachelle Neumann as CEO, and DairyReporter interviewed Neumann as CEO and Efrat Davash Riesenfeld as CTO in 2026. This suggests a leadership transition or company evolution, but the precise current executive roster and employment status of the original founders are not consistently documented. The scientific, clinical, nutrition, and food-manufacturing mix is relevant to translation; diligence still needs to establish who currently owns process development, clinical execution, regulatory affairs, and commercial partnering.

**Competitive dynamics and differentiation.** Exosomm sits between medical nutrition, functional-food ingredients, and extracellular-vesicle biotechnology, so competition includes both established products and emerging ingredient platforms. Nutricia, part of Danone, and Nestlé Health Science offer established specialty and medical-nutrition products with regulatory, manufacturing, and distribution advantages. AbbVie, Takeda, and Johnson & Johnson compete indirectly for IBD treatment budgets through approved drugs and clinical evidence, not through identical food ingredients. Extracellular-vesicle developers such as Evox Therapeutics are more distant technical comparators focused on therapeutic delivery rather than food-grade nutrition. Exosomm’s proposed distinction is an upcycled dairy feedstock, a non-synthetic isolation approach, and a shelf-stable ingredient that partners can formulate into familiar foods, potentially combining a manufacturing input with a new bioactive functionality. This is not yet a proven moat. The company must show that its product retains reproducible biological activity after scale-up and routine food processing, that its quality specifications are meaningfully differentiated, that partner economics work, and that its process and formulation rights are defensible. Its patent posture is described in company and incubator materials as protected or patented, but a complete claim-by-claim ownership and freedom-to-operate review is not available from the reviewed public sources.

**Security, resilience, and dual-use relevance.** Exosomm’s core product is a civilian nutrition ingredient, not a defense system, and no military customer, defense contract, security deployment, or emergency-response use is disclosed. The strategic link is limited to food-system resilience and bioconvergence. A process that turns an existing dairy side stream into a shelf-stable, higher-value nutrition ingredient could contribute modestly to a more diversified domestic food-technology base and improve the value recovered from local food processing. In principle, medically oriented nutrition can matter during public-health disruptions or for people with chronic conditions, but the current record does not show that Exosomm’s powder is suitable for emergency rations, shelf-stable field feeding, or broad population nutrition. The product remains dairy-derived and therefore depends on milk supply, cold-chain or upstream processing conditions, allergen controls, and a functioning food-manufacturing network. The dual-use score should consequently remain low and the dual_use flag false: the evidence supports a food and health innovation with indirect resilience relevance, not a technology with a demonstrated defense/security application.

**Stage, trajectory, and diligence risks.** Exosomm is best classified as early stage: it has a research lineage, institutional and investor backing, an ingredient concept, and a registered human study, but public evidence does not establish approved claims, completed clinical outcomes, sustained revenue, repeat customers, or scaled commercial production. Its July 2026 move toward B2B ingredient supply and licensing may shorten the path to market if a manufacturer validates the ingredient, while it also increases reliance on external partners and leaves consumer demand untested. Key diligence questions are: (1) what the current trial status and results are, given the registry timeline has passed without public outcomes; (2) what food-use regulatory opinion supports commercialization, since DairyReporter says the company is still pursuing GRAS status and reports only a consultant opinion letter; (3) whether current process performance, shelf life, and bioactivity have been independently verified; (4) whether patents are granted, owned by the company, and sufficient to protect its extraction and formulation; (5) whether Tnuva remains a commercial partner and what rights or exclusivity apply; (6) whether the revised ingredient-platform strategy has signed buyers, offtake, or license economics; and (7) how a small team will finance clinical, regulatory, manufacturing, and sales milestones simultaneously. The opportunity is scientifically distinctive, but clinical, regulatory, manufacturing, and commercial proof remain the gates to meaningful scale.
"""
