name = "CorrActions"
description = "CorrActions is an Israeli deep-tech company developing NeuroMonitor, a software-only cognitive monitoring system that analyzes involuntary muscle micro-motions captured by existing vehicle and device sensors to detect fatigue, distraction, intoxication, cognitive load, and related impairment. Its primary market is automotive safety, with a credible but unfielded extension to aviation, remote operations, and other safety-critical human-machine systems."
detailed_description = """
**Product and the concrete problem it solves.** CorrActions addresses a practical failure mode in modern mobility: vehicles can measure speed, lane position, steering angle, gaze, and cabin conditions, but they still have limited visibility into whether the human in control is cognitively fit to operate. NeuroMonitor is presented as a software-only, real-time monitoring layer for drivers and passengers. The company says it can detect fatigue, distraction, intoxication or elevated blood alcohol content, cognitive load, motion sickness, anxiety, and other impairments, with additional drugs, medications, and stress states on its roadmap. The problem is consequential because an advanced driver-assistance system can be technically functional while a tired, distracted, or impaired operator fails to respond. CorrActions therefore aims to let a vehicle warn the driver, adjust assistance, or escalate an intervention before a cognitive impairment becomes a crash. Its product proposition also avoids the cost and privacy objections associated with adding a dedicated medical-grade brain sensor or camera to every cabin.

**Core technology and how it actually works.** NeuroMonitor does not claim to read a brainwave signal directly. Its public explanation is that unconscious, involuntary micro-motions in muscles reflect changes in brain activity, and that these tiny movement patterns can be extracted from sensors already present in a vehicle or digital device. Candidate inputs include steering-wheel motion, seat motion, in-cabin radar, infotainment interaction, smartphones, and other motion sensors. Machine-learning models analyze those streams for a person-specific cognitive signature and infer deviations associated with impairment. The architecture is deliberately software-only and processor agnostic, so the company says it can run on existing vehicle compute rather than requiring a new sensor suite. That creates an attractive integration path for OEMs and Tier 1 suppliers, but it also places the burden on model calibration, false-positive control, sensor heterogeneity, and proving that signals remain reliable across drivers, vehicle platforms, road surfaces, and weather. Public materials describe the product capabilities and regulatory work, but do not publish a reproducible accuracy table, model architecture, or independent clinical validation.

**Market, customers, and go-to-market.** CorrActions sells to automotive OEMs, Tier 1 suppliers, fleets, and mobility operators rather than directly to consumers. The immediate wedge is driver and passenger safety in passenger vehicles, commercial fleets, and connected mobility platforms. A software license that uses sensors already installed in a vehicle can fit the purchasing logic of an OEM better than a hardware retrofit: integration can happen at the vehicle-compute layer, while interventions can be designed jointly with safety engineers. The company’s participation in Euro NCAP and NHTSA committees indicates that regulatory and test-protocol alignment is part of the go-to-market strategy. Its public site highlights Volvo, Goodyear, and BlackBerry branding and lists demonstrations at In Cabin USA, but it does not disclose a production vehicle program, annual recurring revenue, contract values, or a named fleet deployment. The practical sales cycle is therefore likely to be long and qualification-heavy, with a high-value design win potentially more important than a large number of small pilots.

**Traction, funding, and third-party validation.** CorrActions was founded in February 2019 by Zvi Ginosar and Eldad Hochman, according to Startup Nation Central. The public funding record includes an OurCrowd seed investment, a $2.7 million 2021 seed round involving the Israel Innovation Authority, Operator Partners, VentureIsrael, Samurai Incubate Israel, and Labs/02, and a $7.25 million Series A announced in December 2023 with Volvo Group Venture Capital and BlackBerry as lead investors alongside Mobilitech Capital, Next Gear Ventures, NextLeap Ventures, Stone Ventures, OurCrowd, and Regah Ventures. Startup Nation Finder records a further $1 million SAFE in November 2025 from Next Gear Ventures and VentureIsrael, and reports total capital of about $10.95 million across four rounds. Volvo’s own April 2023 release says its Tech Fund tested the software before leading its round, which is stronger validation than a logo-only partnership. The evidence still stops short of proving scaled production: no OEM launch, safety rating, fleet volume, or independently audited performance is public.

**Founders and team background.** Ginosar is identified publicly as co-founder and chairman, Hochman as co-founder and chief science officer, and Vered Levy-Ron as CEO. The company’s technical narrative combines neuroscience, artificial intelligence, automotive engineering, and human-machine interaction rather than relying on a conventional camera-only driver-monitoring approach. Startup Nation Finder lists a team including VP R&D Ofer Kruzel, product leader Ohad Kleinman, and regulation and strategy director Gal Geffen-Frenkel. The Israel Innovation Authority describes CEO Vered Levy-Ron and a 2019 establishment date, while public ecosystem records place the headquarters in Jerusalem or Tel Aviv-Yafo and report an 11–50 employee range; this record uses Tel Aviv-Yafo as the best-supported current location and preserves the range rather than guessing an exact headcount. Diligence should confirm the current legal entity, team size, scientific publication record, patent ownership, and how much engineering is performed in Israel.

**Competitive dynamics.** CorrActions competes with camera-based driver-monitoring vendors such as Smart Eye, Seeing Machines, and Cipia, which use facial landmarks, gaze, eyelid closure, and head pose; with emotion and attention analytics suppliers such as Affectiva; and with incumbent automotive safety stacks from Bosch, Continental, and Aptiv that can bundle sensing, control software, and OEM integration. It also competes with the status quo of no cognitive monitoring or simple steering-behavior heuristics. Its claimed edge is a non-invasive software layer that can combine several existing motion sensors, monitor more than one symptom, work without a dedicated camera or wearable, and potentially preserve privacy by avoiding raw personal imagery. The counterargument is that camera systems benefit from a larger installed base, established regulatory testing, and visible behavioral signals, while micro-motion inference may be harder to explain, calibrate, and validate. The decisive comparison is not a single laboratory accuracy number but end-to-end reduction in dangerous interventions, latency, compute cost, privacy exposure, and false alarms across real fleets.

**Defense, security, and resilience dual-use relevance.** CorrActions is a genuine dual-use candidate, but the relevance is an adjacency rather than a claimed defense contract. Safety-critical operators in military vehicles, aircraft, maritime bridges, emergency response fleets, remote-piloted systems, and industrial control rooms face the same fatigue, distraction, intoxication, stress, and cognitive-overload problems as civilian drivers. A software layer that can infer degraded operator state from controls and existing platform sensors could support crew-rest decisions, adaptive automation, supervised autonomy, or a handover to another operator. The value is especially clear where adding wearables or intrusive cameras is undesirable and where a human remains responsible for a machine moving through a hazardous environment. Israel’s defense and aerospace ecosystem provides a plausible channel for such evaluations, and the company’s regulation and safety focus is relevant to certification. However, public sources disclose no military customer, aviation certification, classified program, MIL-STD qualification, or fielded defense system. Strategic scoring therefore rewards transferability and resilience value while penalizing the absence of demonstrated security adoption.

**Growth stage, trajectory, and key diligence risks.** CorrActions fits the mid stage: it has a released product, several institutional and strategic investors, committee participation, and a 2025 SAFE, yet it remains a small private company without public production revenue or a disclosed OEM launch. Its upside depends on converting Volvo and other design-partner validation into a repeatable integration product and on expanding from automotive into commercial vehicles, aviation, industrial safety, and human-autonomy teaming. Key diligence questions are: (1) What sensitivity and false-alarm rates hold across diverse drivers and sensor stacks? (2) Can the models distinguish fatigue, alcohol, medication, stress, and ordinary steering variation without collecting sensitive personal data? (3) Who owns the training data and resulting patents? (4) What approvals are required before an alert can influence an advanced driver-assistance function? (5) Does the $10.95 million public funding history provide enough runway for OEM qualification cycles? (6) Can a small team support safety cases, cybersecurity, privacy, and global regulatory requirements? (7) Will camera incumbents, OEM internal teams, or platform suppliers replicate the software approach? CorrActions is strategically interesting because it addresses the human bottleneck in autonomy, but the next proof point must be a named production deployment or independently measured fleet outcome.
"""
