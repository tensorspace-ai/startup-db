For strategic investors, the company remains interesting as a bellwether for camera-first autonomy and as a possible partner or benchmark in safety-critical mobility. For this database's purposes, though, the right classification is not presented as an investment recommendation: it is a large incumbent with meaningful technology, not a startup asset with venture-style upside.
