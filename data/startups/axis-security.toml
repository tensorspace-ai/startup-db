dual_use = true
dual_use_description = "Axis Security's core SSE and zero-trust access capabilities have substantive commercial and defensive-security applicability. The same controls for identity-aware private-application access, web and SaaS policy enforcement, session visibility, and reduced network exposure can support sensitive government, defense-adjacent, and critical-infrastructure environments, although public evidence here does not establish defense contracts or classified deployments."
key_technologies = ["Security Service Edge (SSE)", "Zero Trust Network Access (ZTNA)", "cloud-delivered private-application access", "Secure Web Gateway (SWG)", "Cloud Access Security Broker (CASB)", "Digital Experience Monitoring (DEM)", "application-centric policy enforcement and isolation"]
use_cases = ["Replace broad VPN access with application-specific access for distributed employees", "Secure contractor and partner access to private enterprise applications", "Apply identity-aware policy to cloud-hosted applications", "Inspect and govern employee access to internet and SaaS services", "Reduce lateral-movement exposure from remote-access connections", "Provide session visibility and experience telemetry for security operations", "Support auditable remote access for regulated and critical-infrastructure organizations"]
investible = false
