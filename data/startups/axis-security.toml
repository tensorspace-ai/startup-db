name = "Axis Security"
description = "Axis Security developed Atmos, a cloud-native Security Service Edge platform for zero-trust access to private applications, web traffic, and SaaS. HPE acquired the company in 2023 and now presents the technology as HPE Aruba Networking SSE, formerly Axis Security."
detailed_description = """Axis Security was a cloud security company founded in 2018, with its commercial headquarters reported in California and an important research and development operation in Tel Aviv. It built Atmos, also called Application Access Cloud in historical company materials, and the technology now forms HPE Aruba Networking Security Service Edge (SSE). HPE describes the current product as formerly Axis Security and continues to provide sales, support, documentation, and console access. Axis is therefore best represented today as an acquired technology and product operation inside HPE, rather than as an independent startup with its own financing, cap table, or standalone employee count.

The platform applied zero-trust access controls to private enterprise applications and later expanded toward broader SSE functions. HPE's acquisition announcement described cloud-native access to corporate and public-cloud resources and framed the acquisition as an addition to Aruba SD-WAN and network firewall capabilities. Current HPE material presents a unified SSE offer. HPE technical documentation still uses Axis-derived terminology for the client and identity-provider components. This establishes continuity in the product, but public documentation does not reveal what portion of the original software, engineering team, or intellectual property remains separately identifiable after integration.

The company's disclosed funding history consists of an initial $3 million seed investment attributed to Cyberstarts, a $14 million Series A led by Ten Eleven Ventures in March 2020, a $32 million Series B led by Canaan Partners in September 2020, and a $50 million Series C led by Spark Capital in March 2021. Axis said the Series B brought cumulative funding to $49 million and its Series C release said cumulative funding reached $100 million. Those company-reported totals are useful controlling figures; several commercial databases vary slightly in their reconstructed amounts or list a secondary-market event without an amount. The numeric event history here excludes that unquantified secondary listing. No valuation was announced in the round releases reviewed.

HPE reported that it completed the acquisition on March 15, 2023. Its FY2023 SEC filing states acquisition-date fair value consideration of $307 million, primarily cash paid for outstanding common stock. This accounting figure is distinct from press estimates at the time of roughly $400 million to $500 million, which may refer to a different measure of transaction value. The purchase price was not specified in the initial HPE announcement. The record therefore identifies the SEC amount as filed consideration and retains the higher press estimate as a conflict, without conflating the two. HPE's current public filings discuss Axis as part of its expanded SSE capability but do not provide Axis-specific revenue, profitability, customer retention, or headcount.

The strongest historical commercial signal in the reviewed sources is Axis's own 2021 claim that the platform was enabling secure remote access for hundreds of thousands of users and millions of connections during the pandemic. That is a company assertion and does not identify paying customers, contracted recurring revenue, or independently audited usage. HPE's continued product marketing, customer support and documentation establish that the product is commercially maintained, but not the scale of customer adoption. Diligence should seek present-day product attach rates, renewals, reference customers, deployment latency, service-level performance, and the roadmap for migration from legacy Axis deployments.

The competitive category is crowded: Zscaler, Netskope, Palo Alto Networks Prisma Access, Cisco Secure Access, Cloudflare Zero Trust, and Cato Networks all address overlapping ZTNA, secure web access, and SASE needs. Axis's historical angle was cloud-delivered, application-centric access with an agentless option and policy enforcement without directly exposing the network or modifying target applications. Those design choices could simplify selected deployments, but they do not alone establish a durable moat. Enterprise buyers also evaluate identity and device integrations, global point-of-presence coverage, latency, inspection throughput, policy migration, operational reliability, compliance controls, and bundle economics. HPE's distribution, networking base, SD-WAN portfolio, and GreenLake consumption model became a strategic route to market after acquisition; integration complexity and portfolio prioritization remain execution risks.

The available patent records include zero-trust endpoint and remote-server isolation publications naming Axis Cyber Security Ltd. as an assignee on at least one record. Patent publication is evidence of claimed inventions and prosecution activity, not proof of granted, enforceable, commercially central, or wholly owned IP. A full patent-family and assignment review would be needed to establish current title and coverage after the HPE transaction. Publicly named company leaders include co-founders Dor Knafo, CEO, and Gil Azrielant, CTO. Canaan congratulated them and Shuky Chen at acquisition; open public evidence located here does not provide a sufficiently current Axis-specific leadership roster or post-acquisition reporting lines.

For national security and defense-adjacent analysis, this is defensive access infrastructure: identity-aware access, least-privilege application connectivity, web and SaaS controls, and session visibility can be useful to government contractors and distributed critical-infrastructure operators. The same platform has a clear commercial enterprise use. The researched public evidence does not establish defense contracts, classified deployments, government certifications, or suitability for disconnected environments, so no such deployment claim is made. Given HPE ownership, the investible flag remains false as a standalone venture opportunity. The relevant diligence target is HPE's product strategy and evidence of present-day adoption, security assurance, and customer outcomes."""
