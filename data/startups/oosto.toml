name = "Oosto"
description = "Oosto, formerly AnyVision, developed real-time computer-vision software for person-of-interest alerting, face and body recognition, behavior detection, and touchless access control. It was acquired by Metropolis in January 2025, making the record an acquired security-AI asset rather than an independent startup."
detailed_description = """Oosto built a visual-intelligence platform that turns existing camera infrastructure into real-time security and safety alerts. Its documented capabilities include person-of-interest recognition, face and body detection, cross-camera re-identification, pose and action recognition, liveness detection, line crossing, time-series events, and pattern or anomaly analysis. Oosto Protect was positioned as an edge-to-cloud product, while the company also offered on-premises watchlist alerting, touchless access control, and an SDK. The product value proposition is operational rather than purely classificatory: reduce the number of video feeds that security teams must watch manually and surface events that require a human response.

The commercial market is enterprise physical security and video analytics, with applications in retail, casinos and gaming, corporate campuses, education, healthcare, assisted living, public venues, and transportation. Oosto says its software can work with existing cameras and leading video-management systems, and its partner page names providers and integrators including Genetec, Milestone Systems, Honeywell, Johnson Controls, Convergint, and Intellicene. Its own materials also cite deployments or customer references involving organizations such as Macy's, Ford, Okada Manila, and school and critical-infrastructure environments; these references establish marketed commercial traction but do not independently verify contract size, deployment depth, or customer economics. The company announced that its products were deployed in 42 countries and hundreds of enterprise organizations, with retention above 95%, in its acquisition announcement; those are company-reported figures that warrant diligence rather than assumptions about current performance.

The competitive position sits between specialist biometric-search vendors, video-management and camera incumbents, and broader physical-security platforms. Relevant substitutes include Motorola Solutions through BriefCam, Genetec and Milestone analytics ecosystems, Avigilon and other camera/VMS vendors, IronYun, and face-search providers such as Clearview AI. Oosto's claimed differentiation is real-time, in-the-wild recognition combined with body and behavior intelligence, deployment flexibility, edge optimization, and integrations into existing security operations. That can matter in noisy, low-light, crowded environments where latency and false-alert burden determine whether an operator trusts the system. The edge is not automatically durable: incumbent vendors can bundle analytics with cameras and VMS contracts, while biometric and behavior models remain sensitive to camera placement, lighting, occlusion, demographic performance, and local operating procedures.

Oosto's corporate history is central to evaluating the asset. AnyVision rebranded as Oosto in 2021 while broadening its positioning from watchlist and access-control applications toward safety, productivity, and customer experience. The company also publicly discussed ethics, privacy controls, and a research relationship with Carnegie Mellon University's CyLab Biometrics Research Center. In January 2025 Oosto announced that Metropolis had acquired it and that its team and employees would join Metropolis. Reputable reporting described the transaction as an all-stock deal valued at approximately $125 million, but the price and reported historical funding should be treated as transaction reporting rather than audited company financials. The acquisition means Oosto's technology may continue inside Metropolis, but public information does not establish that the Oosto brand, standalone product roadmap, or prior corporate structure remains unchanged.

The technology has credible dual-use characteristics because live video perception, biometric matching, re-identification, anomaly detection, and access-control automation can support both civilian facilities and security-sensitive sites. Plausible security applications include facility and perimeter monitoring, controlled-entry verification, incident reconstruction, and protection of transportation or critical-infrastructure environments. The record should not imply confirmed military contracts, border deployments, or intelligence use: the public evidence supports a security and public-safety adjacency, not a verified defense program. Strategic relevance is therefore strongest as an acquired Israeli-founded computer-vision capability with lessons about biometric governance, deployment controls, and integration into larger real-world AI platforms, not as an available venture investment."""
