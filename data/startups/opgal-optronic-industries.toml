investment_rationale = """
Opgal remains relevant to a dual-use technology map because its thermal and electro-optical capabilities span industrial emissions monitoring and documented defense/security applications. The current evidence supports an operating technology business with international distribution, differentiated hazardous-environment products, and a meaningful engineering base. It does not support an independent startup investment thesis: Gevasol acquired Opgal effective August 1, 2025, and public information does not disclose standalone revenue, margins, customer concentration, ownership terms, or post-acquisition capital requirements. The legacy investible flag is therefore set to false because the company is an acquired asset, not because the technology lacks value.

Strategic diligence should focus on the asset's role inside Gevasol, retention of key optical and algorithm talent, product roadmap, detector and optics supply, regulatory certifications, and the share of sales from recurring software or service. For a strategic buyer or allied capability assessment, Opgal may offer useful thermal/OGI know-how and channel access. For an external financial investor, the central questions are access, control, integration effects, and whether the parent would sell or partner around the business.
