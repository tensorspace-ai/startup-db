dual_use_description = "UAV Communications' core technology—secure, resilient command-control links for unmanned operations in contested spectrum—is substantively dual-use. Military and defense applications are primary: tactical drone C2, unmanned ISR platforms, swarm coordination, and security-critical operations in electronically contested environments. Commercial and civilian applications are genuine and growing: law-enforcement and emergency-response drone operations, critical infrastructure monitoring (power grids, pipelines, water systems), remote industrial inspection (offshore, mining, hazardous sites), and autonomous asset monitoring in remote areas. The underlying RF resilience, security, and latency-optimization technologies apply across both domains. However, military applications and defense procurement represent the primary market driver and revenue opportunity. Civilian uptake, while real, remains smaller and more fragmented."
