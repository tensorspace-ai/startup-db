name = "LightYX"
description = "LightYX develops BeamerOne, an electro-optical construction layout system that projects BIM/CAD plans at full scale onto floors, walls, and ceilings. Its mobile workflow combines laser-guided marking with site scanning, plan edits, as-built capture, and progress checks for contractors and trade crews."
detailed_description = """LightYX's core product is BeamerOne, a jobsite device and software workflow for moving digital construction information into physical work. The company says users upload the latest BIM or CAD plan to a mobile app, position the unit with reference points or reference elements, select a region, and project a real-scale layout onto the relevant surface. The system is presented as more than a line projector: it can scan site elements, account for surface elevation, let an operator modify the drawing on site, and save as-built information for later sharing with architects, VDC managers, superintendents, and other stakeholders. The public product material describes applications including wall lines, openings, penetrations, equipment pads, anchor points, duct routes, sleeves, hanger locations, and other trade layouts.

The customer problem is concrete and economically important. Traditional layout relies on survey or layout crews transferring points from drawings with tape measures, total stations, chalk lines, and manual interpretation. Errors or stale drawings at this stage can propagate into trade clashes, rework, schedule slippage, and material waste. LightYX's value proposition is therefore a faster field execution loop: make the coordinated design visible where work happens, allow crews to mark or install against it, then record deviations instead of leaving the office model disconnected from actual conditions. The product is particularly relevant to drywall, framing, mechanical, electrical, plumbing, fire-protection, ceiling, prefab, and renovation workflows. Company-reported testimonials and deployment metrics are useful commercial signals, but they remain vendor-supplied and should not be treated as independently audited productivity evidence.

There is stronger evidence of commercialization than the prior record reflected. LightYX's own site says the solution has been used in 40 U.S. states and four European countries and reports 22 million square feet of layout; an Israel Innovation Authority post in 2025 described dozens of U.S. contractors and subcontractors, hundreds of projects, and more than 25 million square feet. The discrepancy between those figures is normal for evolving marketing metrics, but it makes the direction of traction clearer than the exact total. PR Newswire reports an $11 million Series A announced in September 2025, with NOVA by Saint-Gobain identified as lead in public coverage alongside other investors. Diligence should still test recurring revenue, lease-versus-sale economics, gross margin after calibration and service, customer retention, deployment utilization, and whether claimed time savings survive independent job-cost measurement.

Competition spans both purpose-built construction robotics and entrenched measurement ecosystems. Dusty Robotics is a direct benchmark in robotic layout; HP SitePrint competes in automated construction marking; Trimble, Leica Geosystems, Topcon, Hilti, and conventional survey/layout contractors offer overlapping ways to transfer or verify digital plans in the field. LightYX's potential edge is the integrated design-to-site and site-to-design loop: projection, spatial registration, scanning, field edits, and as-built documentation in one operator workflow. That edge depends on accuracy on uneven or obstructed surfaces, intuitive setup, interoperability with customer files, and reliable hardware in harsh environments. It may be strategically useful for construction resilience and infrastructure delivery, but the core product is not a defense or security system. Its electro-optical sensing and spatial-registration capabilities have only indirect adjacency to military engineering, disaster-response, or secure-facility construction; no public evidence reviewed here establishes defense customers, classified use, or a mission-specific security product."""
