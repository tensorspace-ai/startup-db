name = "Prime Minute"
description = "Prime Minute is a Palo Alto public-resilience technology startup combining mission software with a GPS-guided aerial wildfire suppressant payload designed for early attack when wind, smoke, darkness, terrain, or crew safety constrain conventional drops. Founded in 2025, it emerged from stealth in September 2026 with a $15 million pre-seed round led by Eclipse and 8VC participating; its PGSU is undergoing Colorado state operational testing and remains pre-commercial."
detailed_description = """
**Product and the operational gap.** Prime Minute is building an integrated response service around the period between wildfire ignition and uncontrolled spread, when minutes can determine whether a fire stays a small incident or becomes a threat to homes, utilities, transport links, watersheds, and data centers. Conventional air tankers and helicopters deliver water or retardant in bulk, but their ability to make a useful drop depends on aircraft access, crew exposure, visibility, wind, smoke, terrain, and proximity to water or ground crews. Prime Minute’s initial product is its Precision Guided Suppression Unit (PGSU), an aircraft-dropped payload intended to place roughly 110 gallons of water at a selected ignition or hotspot while allowing the carrier aircraft to release from higher altitude and greater standoff. The operational goal is an initial suppression option in periods or places where low and slow manned aviation is unsafe, unavailable, or inaccurate. The company frames the product as a complement to responders: slowing or containing an emerging fire can give ground crews more time to arrive, support evacuation, and protect infrastructure. It is not a replacement for fire crews or a proven substitute for established suppression tactics.

**How the system works.** The PGSU combines a water-bearing body with GPS guidance and onboard flight controls. Colorado’s Center of Excellence for Advanced Technology Aerial Firefighting says the unit can be released from 12,000 feet above ground level, then steer toward a predetermined target using aerodynamic control surfaces that adjust its path for wind and weather. Prime Minute’s published dimensions list an approximately 1,000-pound loaded mass, a 400-liter/105.5-gallon capacity, a configurable suppression radius, and mission-defined dispersal patterns. Inc’s September 2026 reporting describes four wings and four motorized fins, continuous ADS-B position transmission, and tests in Colorado, Oregon, Israel, and Uganda. The PGSU is therefore a guided aerial payload rather than a free-flying reconnaissance drone. A second layer is the Prime Minute Mission Execution System: the company describes software that combines a real-time operational picture with wind and terrain conditions, generates an aerial drop plan, manages the authorization chain, and verifies the engagement. These capabilities are company-described; detailed independent performance data, accuracy distributions, and system architecture have not been published.

**Market, buyers, and route to deployment.** Initial buyers are likely to be public wildfire agencies and the public entities that procure aerial response, with a second potential buyer group comprising utilities, insurers, landowners, and operators of critical or high-value infrastructure exposed to wildfire. Prime Minute says it intends to sell suppression as a service rather than sell PGSU hardware outright, and says it can provide aircraft through partners or work with customer-owned aircraft. That approach could package payloads, mission planning, integration, and operational support into a procurement compatible with agencies that lack dedicated aircraft or specialist engineering teams. The Colorado Center of Excellence’s role is particularly material: the state organization reports it is conducting operational testing, evaluation, and validation of the product, and explains that the concept seeks release at high altitude followed by GPS-guided flight to a target. The Center cautions that its technology testing is research and does not amount to a commercial endorsement. No named paying agency, utility, insurance customer, service contract, production fleet, or recurring revenue is publicly disclosed, so market demand should be assessed as a serious operational need and a pilot pathway rather than demonstrated product-market fit.

**Traction, financing, and outside validation.** Prime Minute announced its emergence from stealth on September 24, 2026, alongside a $15 million pre-seed financing led by Eclipse with participation from 8VC. The company’s stated funding purpose is to develop and validate the integrated response system. Inc reports that the payload had been tested in Colorado, Oregon, Israel, and Uganda before the announcement and that the company expected a partner-integrated prescribed-burn test phase in fall 2026, followed by a controlled operational integration phase during the 2027 fire season. These are reported milestones and plans as of the announcement, not evidence of a deployed commercial service or suppression of an uncontrolled wildfire. The strongest external validation is Colorado’s published evaluation: it describes the ongoing operational testing and interviews the state Center’s aviation projects manager about the high-altitude release concept. That state testing provides relevant technical scrutiny, while the agency explicitly says testing is not endorsement. The round and investors are corroborated by the company’s release and coverage in Inc; valuation, cap-table detail, follow-on financing, revenue, gross margin, patent grants, and contracted customer count remain undisclosed.

**Founders and team.** Prime Minute combines public accounts of Israeli intelligence and defense leadership with U.S. military, software, robotics, and commercial experience. The company’s team page lists Ronen Korman as co-founder and CEO; it describes his prior leadership of ATLAS technology for operations and cyber at Israel’s ISA, command of IDF Intelligence Corps Unit 81, an Israel Defense Prize in 2012, and co-founding Datorios. The same page identifies Oved M. as co-founder and president, with former special-operations leadership at ISA and technology and operations work at Rafael Advanced Defense Systems; Itai Mendelsohn as co-founder and COO, previously CTO of Intuition Robotics and an R&D/product executive at Bright Machines and Nokia; and Gabe Sganga as co-founder and chief growth officer, previously at Forterra and Palantir and a U.S. Marine Corps artillery and cyberspace operations officer. Inc identifies Eclipse founder Lior Susan, a former Israeli special-forces soldier and Silicon Valley investor, as Prime Minute co-founder and executive chairman. It reports approximately 24 employees as of September 2026, most based in Israel. This is a potent operator-engineer network, though public bios do not establish that the team has yet run a commercial wildfire response service or that each relevant role is full-time.

**Competitive position.** The company is entering a mature response ecosystem with trusted incumbents, long procurement cycles, and specialized aircraft providers. Its direct competition includes existing interagency air-tanker and helicopter fleets, which already deliver water and retardant at scale but face operating constraints at low altitude, in high winds, or in poor visibility; Coulson Aviation and Erickson Incorporated are established aerial firefighting operators; and Bridger Aerospace provides aerial firefighting aircraft and related services. Pano AI and similar wildfire intelligence providers compete for agency attention and budgets around detection, mapping, and situational awareness, though they do not publicly offer the same guided suppressant payload. Prime Minute’s prospective edge is combining hardware, planning software, aircraft access, and operating doctrine rather than selling a sensor or aircraft alone. The higher-altitude release concept could reduce crew exposure and broaden the operational window if demonstrated safely, while guided placement may reduce losses from drift compared with conventional drops. The combination is not yet a proven moat: GPS resilience, target accuracy, payload survivability, suppressant performance, aircraft integration, debris recovery, regulator acceptance, and cost per successful suppression all require evidence at operational scale.

**Resilience and dual-use relevance.** Prime Minute is best classified as a public-resilience company with security relevance, not as a defense contractor. Wildfires threaten civilian life, electric transmission and distribution, roads, communications, water resources, military installations, and data centers; a response service that can operate in denied visibility and weather conditions could help protect those assets and reduce disruption to essential services. The company explicitly frames public resilience as part of national security, and its founding team brings experience from Israeli intelligence, special operations, Rafael, IDF Unit 81, U.S. Marine Corps operations, and defense-adjacent autonomy and software businesses. Those backgrounds may support mission planning, operational integration, and government procurement conversations. The direct product application described publicly remains wildfire response, however, and there is no disclosed military customer, government defense contract, weapons application, or fielded defense deployment. The Israeli connection is substantial but should be described accurately: Prime Minute is a U.S.-based startup headquartered in Palo Alto, and Inc reports most of its roughly 24 staff are based in Israel. It belongs in an allied resilience and dual-use ecosystem record rather than being mislabeled as an Israeli-headquartered startup.

**Stage, trajectory, and diligence.** Prime Minute is early-stage: founded in 2025, publicly launched in September 2026, pre-seed funded, and still validating a mission-critical hardware-software service. The most important near-term proof points are successful state-supervised tests with transparent safety and accuracy results; prescribed-burn integrations with named partners; aircraft operator and regulator approvals; predictable per-mission economics; and evidence the PGSU can suppress a fire at scale across different fuel, wind, and terrain conditions. Risks are significant. A GPS-guided payload operating above fires introduces life-safety, airworthiness, release authorization, communications, and liability requirements; failure can endanger crews, communities, and property. Its claims around performance in wind, smoke, darkness, and extreme fire behavior require independent measurement, not just a prototype demonstration. Aircraft compatibility and reliable reloading, maintenance, supply, and cleanup may constrain service capacity. Public-agency procurement is slow and seasonal, wildfire conditions are variable, and insurance and environmental approval may limit suppressant choices. The service model requires access to aircraft and trained operators at the time of an incident, when demand spikes across regions. Finally, the company’s broad ambition to address evacuation and other disasters stretches beyond its first product and is not yet backed by public product evidence. The central diligence question is whether the current operational testing can translate into a safe, certified, cost-effective response capability that agencies contract for before the next emergency.
"""
