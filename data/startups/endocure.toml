name = "EndoCure"
description = "EndoCure is a Haifa-founded medical-robotics startup developing Revealan, an investigational robotic ultrasound platform that converts off-the-shelf ultrasound systems into automated, operator-agnostic, high-resolution 3D imaging tools. Its first clinical focus is endometriosis, with expansion announced toward oncology, urology, and quantitative treatment monitoring."
detailed_description = """
**Product and the concrete problem it solves.** EndoCure is addressing a practical weakness in ultrasound rather than trying to replace ultrasound with another capital-intensive modality. Conventional ultrasound is comparatively affordable, portable, radiation-free, and already installed throughout hospitals and clinics, but image acquisition is highly dependent on the operator's skill, probe path, pressure, angle, and ability to reconstruct a difficult three-dimensional anatomy mentally. That variability is particularly consequential in endometriosis, where lesions may be small, deep, spatially distributed, and difficult to distinguish from surrounding anatomy. The company says Revealan is an add-on robotic arm that integrates with off-the-shelf ultrasound equipment, automatically acquires a standardized scan, and produces an operator-agnostic 3D data set. The intended result is a repeatable map that can support diagnosis, staging, treatment planning, and follow-up without requiring every site to have a highly specialized sonographer. EndoCure's public product pages list urinary-tract, women's-health, and cancer applications; the company has also emphasized that the platform could make repeated imaging more accessible in decentralized and under-resourced care.

**Core technology and how it actually works.** Revealan combines mechanical probe guidance, spatially registered ultrasound acquisition, volumetric reconstruction, and AI-assisted analysis. The robotic mechanism moves an ultrasound transducer relative to the patient's pelvis or abdomen while the system knows the probe's position and orientation at the time each frame is captured. A public patent application describes this coordinated acquisition architecture for generating a mapped set of pelvic or abdominal images. EndoCure's clinical materials further describe contrast-enhanced volumetric imaging, multiplanar reconstruction, computational contrast-enhanced subtraction, and 3D lesion segmentation. Those components turn a sequence of probe images into a standardized DICOM output that can be inspected across axial, sagittal, and coronal planes and measured quantitatively over time. The company describes the output as having ten times the image density of MRI on its website and government catalogue; a later company LinkedIn post reports a 32-times comparison for a particular DICOM example. These are company-reported performance claims, not an independent benchmark, and the underlying model architecture, training data, sensitivity, specificity, and exact acquisition protocol are not public. The important technical thesis is nevertheless clear: use robotic repeatability to make the input consistent enough for algorithmic measurement, then use software to extract a richer clinical signal from equipment that providers already own.

**Market, customers, and go-to-market.** EndoCure has an unusually legible beachhead. Endometriosis affects a large global patient population, diagnosis is often delayed, and the company can sell an add-on platform rather than asking a hospital to replace its ultrasound fleet. The official site names oncology, urology, and women's health as leading applications, while the company has more recently positioned standardized quantitative ultrasound as an imaging layer for pharmaceutical and biotechnology studies. The commercial path therefore has at least three routes: hospitals and imaging centers paying for a clinical device; ultrasound OEMs or distributors integrating or reselling the robotic attachment; and pharmaceutical or biotech sponsors using repeatable lesion measurements as a trial or real-world-evidence endpoint. The latter route is strategically interesting because frequent, radiation-free imaging could complement laboratory and molecular endpoints without the scheduling, cost, and radiation burden of repeated CT or PET. Public materials do not identify paying customers, commercial contracts, revenue, distributor agreements, or an FDA-cleared indication. EndoCure has listed a U.S. office in Natick, Massachusetts, alongside its Haifa office and has attended JPM Week and related healthcare showcases, suggesting an Israel-to-U.S. commercialization effort, but those visibility signals should not be confused with market adoption.

**Traction, funding, and third-party validation.** The strongest public validation is clinical and institutional rather than commercial. EndoCure reports completing an 11-patient safety and feasibility study at the Endometriosis Center of Sheba Medical Center in Tel Hashomer. The company's public account says Revealan generated standardized high-density 3D data, enabled objective volumetric lesion measurement, and visualized two lesions through a non-invasive transabdominal approach in the cited case rather than relying only on an invasive transvaginal examination. The Israel Innovation Authority lists EndoCure as an Israeli company established in 2023, with Seed-stage funding, additional funding, and R&D support. CTech reported in January 2026 that the company had raised $2.7 million to date, including a latest $700,000 investment, with Teuza, HiCenter Ventures, the Israel Innovation Authority, the IL Investors Forum, founders, and U.S. investors named in the report. The Innovation Authority's public profile lists 15 employees, while the CTech profile listed seven at an earlier point and LinkedIn displays a 2-10 company-size band, so headcount is best treated as a reported range. A public patent application covering an ultrasound system and method for selective diagnosis and treatment names EndoCure Ltd. and inventors Hadas Ziso and Moshe Shoham. This is meaningful early evidence, but there are no public pivotal-trial results, regulatory clearance, peer-reviewed clinical accuracy study, repeat purchasing data, or disclosed manufacturing scale.

**Founders and team background.** EndoCure's founding team is unusually well matched to the intersection of medical robotics, imaging, and commercialization. Dr. Hadas Ziso is co-founder and CEO; the company describes her as a second-time medical-device founder with 20 years of industry experience and degrees spanning biomedical engineering, medical robotics, and business. Technion's Mechanical Engineering Faculty confirms that she completed her academic training at the Technion and founded EndoCure in 2023 with her doctoral adviser. Prof. Moshe Shoham is co-founder and chief scientific officer. He is a Technion professor emeritus and a major figure in medical robotics who founded Mazor Robotics, later acquired by Medtronic in a transaction valued at more than $1.6 billion. EndoCure also identifies Dr. Eyal S. Ron as a board member and describes him as a serial entrepreneur involved in eight startups and more than 50 patents, while its public advisor roster includes radiology, ultrasound, clinical-affairs, women’s-health, and U.S. business-development specialists. That combination reduces the risk that the company is simply an academic prototype with no device-development leadership. The counterpoint is that the disclosed organization remains small, public team roles are not a substitute for a full regulatory and manufacturing bench, and the company has not publicly named a large-scale OEM, hospital, or pharmaceutical commercialization partner.

**Competitive dynamics.** EndoCure is competing against several different approaches to the same clinical bottleneck. Caption Health, now part of GE HealthCare, uses AI guidance to help operators acquire diagnostic cardiac and lung ultrasound views; UltraSight similarly focuses on AI-guided acquisition with portable systems; and Medo.ai applies machine learning to ultrasound interpretation and workflow. Sonivate represents the more direct robotic-ultrasound comparison through a robotic probe-handling approach. Butterfly Network, Clarius Mobile Health, and EchoNous compete from the portable-device side by improving access, imaging hardware, and workflow rather than adding a robot to installed systems. EndoCure's proposed edge is the combination of an add-on robotic mechanism, standardized scan trajectories, high-density volumetric output, and a pathway to quantitative longitudinal measurement. That is distinct from software that merely tells a novice where to place a probe or AI that classifies a conventional two-dimensional image. The edge is not yet defensible on public evidence: rivals can add robotic guidance, OEMs can bundle automation into future systems, and clinical buyers may prefer a fully integrated device over a mechanically complex retrofit. The diligence question is whether the robot creates reproducibility and diagnostic value that are clinically material enough to justify workflow change, reimbursement work, service obligations, and regulatory cost.

**Defense, security, and resilience relevance.** EndoCure should be included for medical resilience and robotics expertise, not represented as a defense company. The core product is aimed at civilian diagnosis and the public record discloses no military customer, defense contract, battlefield trial, or security certification, so `dual_use` is set to false. There is nevertheless a credible adjacency. Operator-agnostic imaging could be valuable in rural clinics, disaster-response facilities, mobile hospitals, humanitarian deployments, and other environments where scarce specialists cannot be physically present. A ruggedized derivative could potentially support triage or repeated soft-tissue assessment in austere medical settings, and the underlying stack of robot positioning, sensor registration, image reconstruction, and AI-assisted measurement has transfer value to other remote diagnostic or inspection tasks. Those are capability hypotheses, not current company offerings. The resilience case is stronger: an inexpensive, radiation-free add-on that uses existing ultrasound equipment could improve diagnostic capacity when MRI access is constrained, supply chains are disrupted, or care must be distributed across smaller sites. For Claw & Talon's thesis, the company is a useful watch entry at the intersection of Israeli medical robotics, sensing, and health-system resilience, while its strategic-security score should remain below that of fielded defense, cyber, or critical-infrastructure vendors.

**Growth stage, trajectory, and key diligence risks.** EndoCure is early-stage but has progressed beyond ideation into clinical R&D. It was founded in 2023, is described by the Israel Innovation Authority as Seed-stage and R&D-stage, has completed a small human safety and feasibility study, and still labels Revealan investigational and unavailable for sale in the United States. The likely next milestones are a larger and better-controlled clinical study, reproducibility testing across operators and ultrasound machines, a defined regulatory pathway, a manufacturing and service plan, and evidence that providers or trial sponsors will pay for the add-on. Key diligence points are: (1) clinical performance, especially sensitivity and false-negative behavior for small or deep lesions; (2) mechanical safety, patient comfort, scan time, and reliability across body types; (3) whether the claimed density advantage translates into better clinical decisions rather than larger files; (4) integration with DICOM, PACS, existing ultrasound consoles, contrast agents, and hospital cybersecurity requirements; (5) reimbursement and procurement economics; (6) patent scope and freedom to operate against robotic-ultrasound and AI-guidance competitors; and (7) the capital required to pass regulatory review and build a serviceable device business. The team and early institutional support merit monitoring, but the company remains pre-clearance, lightly capitalized relative to medical-device timelines, and commercially unproven. Its trajectory is promising if it can turn repeatable acquisition into a validated clinical endpoint, with substantial execution risk if that chain breaks at regulation, reimbursement, or workflow adoption.
"""
