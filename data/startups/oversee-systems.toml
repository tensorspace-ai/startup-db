name = "OVERSEE SYSTEMS"
description = "Israeli robotics and AI startup developing OROS HOME, a humanoid robot for supervised household assistance; only its printed head shell and separate AI test bench are publicly described as built."
detailed_description = "OVERSEE SYSTEMS LTD is an Israeli private company whose current OROS HOME project aims to help with a narrow set of physical household tasks, beginning with bringing, carrying and placing everyday objects. The public evidence describes an early prototype effort, not a working humanoid: the team says it has 3D-printed a three-part head shell, while sensors, electronics, body, limbs, hands, movement and task execution are not yet built. Separately, the company describes a Hebrew conversational model running on a Jetson Orin Nano test bench, without vision or motor control and not yet installed in the robot. Its proposed model is hardware plus continuing software and service; no price or revenue is published. The company says it previously built a distributed-compute platform and OSS token, now discontinued, but legacy same-domain pages still describe an open beta, a pre-seed raise and a live token. This product transition and its legal, technical and financial implications remain unresolved."
