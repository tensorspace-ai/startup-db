name = "Dream Security"
description = "Israeli cybersecurity startup building sovereign AI and national-scale cyber-defense systems for governments, critical infrastructure operators, and other organizations with sensitive or fragmented environments. Its platform combines asset discovery, threat hunting, cyber-language-model analysis, and on-premises or private-cloud deployment to help defenders understand and act on high-consequence cyber risk."
detailed_description = """
Dream Security is building a national-scale cyber-defense platform rather than a conventional alert dashboard. Its public technical material describes Dream Computing Services as an on-premises or private-cloud hub that can collect network, configuration, and operational data from protected organizations. A Discovery App maps assets and their exposure; an agent orchestrator aggregates the resulting telemetry; and a proprietary Cyber Language Model (CLM) classifies assets by role, exposure, and business impact. The system is intended to turn logs, configurations, commands, reports, and alerts into a continuously updated operational picture, then support threat hunting and response. Dream also describes an AI Factory architecture using local model adaptation, LoRA adapters, distributed GPU infrastructure, and NVIDIA NIM and NeMo components. These are credible architectural signals for sovereign deployments, although independent evidence of model quality, autonomy, and production outcomes is limited.

The target customer is unusually demanding: governments, national cyber authorities, large enterprises, and operators of old or physically complex infrastructure such as energy, water, ports, hospitals, and other critical services. These buyers care about data residency, air-gapped or private deployment, integration with existing control systems, and the ability to investigate across fragmented IT and operational environments. Dream's public materials and reporting describe customers or deployments in Israel, Austria, Europe, the Middle East, and Southeast Asia, while a 2025 Globes report said the company had fewer than ten customers but substantial reported backlog and annualized revenue claims. Those commercial indicators are encouraging but should be treated as company-reported or media-reported until supported by contracts, audited accounts, renewal data, and reference calls. A 2026 company announcement reported a $260M financing and a $3B valuation; the round label and detailed terms should be confirmed directly because secondary databases use inconsistent labels.

Competition comes from specialized OT and critical-infrastructure vendors such as Dragos, Claroty, and Nozomi Networks, as well as broad security platforms from Microsoft, Palo Alto Networks, and Splunk/Cisco. Dream's plausible edge is the combination of sovereign deployment, national-level data fusion, cyber-specific language models, and a product narrative aimed at government decision-making rather than only enterprise SOC efficiency. Its research team has also published vulnerability and campaign-analysis work, including findings related to SCADA software and diplomatic-targeting campaigns. That work can strengthen threat-intelligence credibility, but research visibility is not the same as repeatable product differentiation. Buyers will need to see measurable reductions in investigation time, false positives, incident dwell time, or service disruption, plus evidence that the platform performs reliably across heterogeneous legacy environments.

The dual-use case is substantive. The core capabilities—asset mapping, anomaly and attack-path analysis, vulnerability research, threat intelligence, and response coordination—protect civilian infrastructure while also applying to defense logistics, government networks, communications, healthcare, and other systems whose disruption has national-security consequences. Sovereign and on-premises operation is particularly relevant where classified or strategically sensitive data cannot leave national control. That does not establish military deployment, NATO adoption, or classified authorization: public evidence currently supports a strong defense-adjacent thesis, not a confirmed defense-contract thesis. Strategic diligence should therefore focus on deployment geography, data-segregation controls, export and regulatory exposure, independent security testing, model governance, and whether government customers renew at scale. The company has moved quickly from an early-stage startup to a large, highly valued private company; execution quality, valuation discipline, and customer concentration now matter as much as technical ambition.
"""
