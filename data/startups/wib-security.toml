name = "Wib"
description = "Wib was an Israeli API security company whose platform provided visibility, inventory, testing, and risk analysis across the API lifecycle. F5 acquired Wib in February 2024 and is incorporating its capabilities into F5 Distributed Cloud API Security."
detailed_description = """Wib built a holistic API security platform for discovering and governing APIs from development through production. Its core problem was the gap between the APIs an organization believes it owns and the endpoints, versions, schemas, authentication states, and data flows that actually exist across code repositories, public assets, cloud services, and runtime traffic. Public descriptions of the platform emphasize continuous API inventory, identification of rogue, zombie, and shadow APIs, API change management, vulnerability detection, API penetration testing, and analysis of business risk and impact. Those capabilities are more specific than a conventional web application firewall: they help a security team understand what an interface is, what it exposes, and whether it remains inside approved governance. F5's current product documentation attributes related capabilities to code-repository analysis, runtime inspection, external crawling, OpenAPI specification generation, sensitive-data discovery, authentication-risk scoring, and enforcement.

Wib sold into the enterprise API-security market, where software teams, application-security groups, and governance stakeholders must protect APIs spanning hybrid and multicloud environments. The commercial problem is durable because APIs expose business processes and sensitive data while changing faster than manual inventories and review processes can keep up. Wib reportedly raised $16 million in 2022, led by Koch Disruptive Technologies with participation from Kmehin Ventures, Venture Israel, Techstars, and existing investors. These funding and market signals support the conclusion that Wib reached meaningful commercial validation, but the public record does not establish a complete customer list, recurring-revenue scale, or independent operating results.

The competitive set included API-security specialists such as Salt Security, Traceable, Noname Security, and Pynt, as well as broader API-management, application-security, and cloud-security platforms. Wib's defensible positioning was the attempted combination of lifecycle visibility, inventory, posture analysis, testing, and remediation rather than a single runtime control. That positioning also created execution challenges: discovery quality depends on access to code and telemetry, risk scoring must avoid overwhelming security teams, and a platform must integrate with API gateways, CI/CD, identity systems, and developer workflows. The acquisition is therefore useful evidence of strategic value, but not proof that every original product claim or workflow remained differentiated after integration.

F5 announced the acquisition in February 2024 and stated that Wib capabilities would add vulnerability detection and observability to F5 Distributed Cloud Services. F5's published capability set includes API code analysis before production, API testing, compliance analysis, public-asset threat-surface assessment, and a fusion layer that correlates insights across sources. The former Wib CTO described the integration publicly, while the transaction value was not disclosed. Wib.com now redirects to F5's Distributed Cloud API Security product page, so this record should be treated as an acquired asset and historical company analysis rather than an active independent startup profile.

API discovery and lifecycle security have credible dual-use relevance. Defense, intelligence, critical-infrastructure, and public-sector systems increasingly depend on APIs connecting services, data stores, identity systems, and operational applications; unmanaged or weakly governed interfaces can create exploitable paths or unintended data exposure. Wib did not publicly establish a dedicated defense product, government deployment, or security authorization in the sources reviewed. The defense case is therefore capability-based and conditional: its technology could support hardening of sensitive application ecosystems, but actual mission adoption, deployment constraints, and assurance evidence require separate diligence."""
