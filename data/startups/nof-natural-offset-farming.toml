name = "NOF - Natural Offset Farming"
description = "NOF is an Israeli agritech startup developing portable post-harvest cooling and treatment systems that use liquid CO2 to help preserve fresh produce close to where it is harvested. Its off-grid design targets food loss in supply chains where conventional refrigeration is unavailable, costly, or slow to reach the farm."
detailed_description = """
**Product and the concrete problem it solves.** NOF - Natural Offset Farming addresses the hours immediately after harvest, when heat, respiration, water loss, and pathogen exposure can reduce the marketable life of fruit and vegetables before they reach a packhouse or refrigerated truck. The company is building compact, field-deployable equipment for pre-cooling and controlled post-harvest treatment at or near the farm. Its intended users include growers, cooperatives, exporters, produce distributors, and retailers handling perishable crops. This is a practical food-security problem: a crop can be successfully grown yet lose value and availability because cooling is absent at the point of harvest, particularly in hot regions and fragmented supply chains. NOF's proposition is to move an early preservation step upstream and make it available to farmers without requiring a conventional electrically driven refrigeration room at each field site. The company describes the model as cooling-as-a-service and aims to reduce spoilage, improve produce quality, and extend shelf life. These are product objectives and company claims; the public record does not yet provide crop-by-crop efficacy data or independently audited loss-reduction results.

**Core technology and how it works.** NOF uses liquid carbon dioxide as a cooling medium. Its published patent application describes an insulated agricultural refrigeration device that stores liquid CO2, releases it through a controllable mechanism, and uses the resulting phase transition in a heat exchanger to cool a target fluid or medium. The company's ecosystem materials describe cooling air, water, or surfaces; its current public positioning emphasizes a short, controlled post-harvest CO2 treatment, with modular equipment and crop-specific protocols. The patent text also discusses post-harvest configurations combining cooled, carbonated-water mist with air circulation, cooling, and dehumidification in a treatment box. The system is presented as compact and capable of operation without an external electrical supply for the cooling step, which may simplify use where grid power is weak. That does not make the full deployment infrastructure-free: liquid CO2 must be sourced, stored, transported, and handled safely, and a service operation may still need energy, labor, monitoring, and logistics. The patent is a published application assigned to NOF, not proof of granted, enforceable protection or of commercial performance. Any claim that treatment activates produce defenses, suppresses pathogens, or creates a material shelf-life extension still requires independent, crop-specific validation.

**Market, customers, and go-to-market.** The near-term market is post-harvest cooling for growers and produce supply chains that cannot justify or reliably access fixed cold rooms. The Israel Innovation Authority lists fresh-produce retailers, large farmers, agricultural businesses and cooperatives, and agricultural-input distributors as target customers. NOF's cooling-as-a-service approach could let a grower pay for treatment capacity when and where crops are harvested rather than purchase and maintain a complete refrigeration installation. Its use cases include berries and other delicate fruit, vegetables requiring prompt field pre-cooling, remote farms, smallholder aggregation points, and export chains where quality is lost before centralized packing. Smart Agro Fund, an investor, reports NOF activity with small farmers in India and commercial berry growers in Mexico, including work involving Bayer and the International Finance Corporation. TechEmerge's independent pilot listing specifies a collaboration with Mexican berry cooperative Aneberries across 20 fields, intended to reduce costs and improve berry quality and shelf life. Those are meaningful field and market-access signals, but the public sources do not disclose paid deployment volumes, repeat orders, treatment price, or verified customer-level savings. Scaling will depend on fitting the treatment protocol to each crop and integrating the equipment into harvesting schedules, packaging practices, and existing cold-chain handoffs.

**Traction, funding, and third-party validation.** NOF was established in 2022 and appears in the Israel Innovation Authority's company records as an Israeli agritech business at the R&D stage. The Authority lists ten employees and support through its R&D Fund in 2024. Startup Nation Finder reports approximately $1.02 million across three funding events, including a $300,000 pre-seed round in May 2024 associated with Smart Agro and Eretz Angels and a $321,000 non-equity award from the Innovation Authority in September 2024; these database totals and classifications should be treated as reported ecosystem data, not audited financial statements. Smart Agro's own portfolio page confirms its investment and describes NOF's cooling product, while TechEmerge records the Aneberries field pilot. A 2023 Israeli government trade-delegation profile also identifies NOF as an Israeli startup developing liquid-CO2 cooling equipment for post-harvest, precision-agriculture, and storage needs. The patent record provides technical evidence that NOF has filed intellectual property around agricultural cooling and treatment, with an international application published as WO2025083684A1 and an Israeli application listed in its history. No public source reviewed disclosed a completed patent grant, formal food-safety or refrigeration certification, audited revenue, or independently replicated performance benchmark. The evidence supports a real R&D-stage company with early financing and pilots, not yet a proven scaled supplier.

**Founders and team background.** Public company and ecosystem profiles identify Ishay Hadash as CEO and co-founder, Yoni Ben Zaken as co-founder and vice president of business development, and Yair Hadash in an operational-strategy role. The Innovation Authority confirms Ishay Hadash's CEO and co-founder role; Startup Nation Finder and investor materials list the broader founding group. Ben Zaken's public professional profile describes prior leadership in renewable energy and business development, which is relevant to building cross-border agricultural partnerships and a service model. The available record gives less detail on the team's refrigeration engineering, post-harvest biology, food safety, and manufacturing leadership, so technical depth should be verified rather than inferred from the product narrative. Headcount also varies by source and date: LinkedIn reports a 2-10 employee range, the Israel Innovation Authority lists ten, and older ecosystem data gives a wider 11-50 band. Headquarters reporting similarly varies between Shilat in company databases and Tel Aviv on LinkedIn. Shilat, Israel is used here as the more specific registered-company location, with the discrepancy retained as a diligence point. The company should provide an up-to-date organization chart, crop-science support, service staffing, and manufacturing capacity before its ability to scale internationally is assessed.

**Competitive dynamics and potential edge.** NOF competes with conventional electric precoolers and refrigerated packhouses, solar-powered cold rooms such as ColdHubs and Solar Freeze, modular cold-chain providers such as InspiraFarms, and lower-cost evaporative cooling approaches used by smallholder farmers. These alternatives can preserve produce through different combinations of refrigeration, insulation, solar power, and storage, and many have longer operating histories or established field networks. NOF's potential distinction is the combination of liquid-CO2 cooling, portability, operation without an on-site electrical compressor for the cooling step, and a treatment-oriented workflow intended to preserve produce at harvest rather than only store it later. If the system can deliver useful temperature reduction and consistent quality improvement with a manageable CO2 supply and service cost, it could serve locations where fixed cold rooms are too expensive or too remote. The competitive edge remains a hypothesis: a buyer will compare total cost per treated kilogram, crop-specific quality and shelf-life outcomes, throughput, ease of use, safety, and the availability of gas cylinders or bulk CO2. Conventional cooling may be more economical where grid power and cold storage already exist, while solar cold rooms may be better for continuous storage. NOF needs head-to-head field data and repeatable protocols to establish which situations favor its approach.

**Defense, security, and resilience relevance.** NOF's relevance to strategic resilience comes through food availability and agricultural continuity, not a disclosed military product. A portable treatment system that can slow produce deterioration close to the farm could reduce losses during heat events, transport delays, electricity outages, or disruptions to centralized cold storage. In that sense, its commercial agriculture use and resilience use draw on the same core equipment and process, supporting a calibrated dual-use classification. The likely strategic users are farmer cooperatives, food distributors, emergency agricultural programs, and operators maintaining supply into remote communities or essential facilities. Better preservation can also reduce the water, land, energy, and labor embedded in food that would otherwise spoil, though the company has not publicly quantified those savings. There is no public evidence of a defense contract, military deployment, government procurement for security operations, or certification for military logistics; none is assumed here. The strategic case is therefore food-system resilience and off-grid infrastructure, with security relevance as an adjacent use context rather than a fielded defense capability.

**Growth stage, trajectory, and key diligence risks.** NOF is best classified as early stage: the company has a defined device concept, a public patent application, early private and non-dilutive financing, and documented international field pilots, but it remains in R&D and has not disclosed repeatable commercial scale. The next proof points are clear: independently measured temperature profiles and shelf-life results across target crops; paid deployments with repeat usage; a transparent service cost per kilogram; reliable, safe CO2 logistics; and evidence that treatment complements rather than merely postpones the need for refrigerated transport and storage. Diligence should test whether CO2 use and transport erase the energy or cost benefit, whether treatment quality is consistent across crop varieties and ambient conditions, how gas is vented and monitored in field and enclosed settings, whether fruit flavor or appearance changes, and who bears equipment downtime or spoilage liability. The company should also document food-contact and worker-safety procedures, patent prosecution and ownership, the status of claimed grants and private rounds, manufacturing yield, and after-sales support in India and Mexico. Its trajectory could be valuable if it becomes a repeatable first-mile layer in produce cold chains, but scaling depends on agronomic evidence, logistics economics, and trusted local partners rather than the novelty of CO2 alone.
"""
