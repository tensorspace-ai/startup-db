name = "Waving"
description = "Waving develops a Wi-Fi and edge-AI sensing system that detects human presence and movement in areas obscured from cameras, using changes in wireless signals to add a privacy-preserving security layer around airports and other critical sites. Founded by Israeli entrepreneurs, the company has a documented Israeli ecosystem and engineering footprint while its official website identifies Waving B.V. in Amsterdam as the operating entity."
detailed_description = """
**Product and the operational problem.** Waving is building an additional physical-security sensing layer for places where a camera, guard, or conventional perimeter sensor cannot reliably see what is happening. Airports, ports, energy facilities, logistics yards, government buildings, and industrial sites all contain blind areas behind walls, around corners, inside vehicle entrances, and across large perimeters. Optical systems can be blocked by architecture, darkness, smoke, weather, or deliberate concealment; adding cameras everywhere can also create privacy and installation concerns. Waving's proposition is to use Wi-Fi radio waves already propagating through an environment to detect whether a person is present or moving, including when direct visual observation is unavailable. It markets a combined hardware-and-software system rather than a downloadable analytics product alone: sensing devices create a wireless coverage area, proprietary software interprets changes in the signal, and an operator-facing dashboard and controls can trigger or complement existing security systems. The target outcome is earlier awareness and a useful cue for a guard, camera, or control-room workflow. Public materials do not establish that the system identifies an individual's identity, intent, or precise location, and those should not be inferred from presence detection.

**How the technology works.** Waving describes a mesh of Wi-Fi transmissions whose propagation changes when people or other objects move through the covered space. Its software measures those disturbances and applies proprietary AI algorithms to classify human movement and presence; inference is described as running at the edge for real-time response. The company says the approach can sense through obstacles and in indoor or outdoor environments, and it offers mobile, battery-fed devices that can be meshed to extend coverage. Its published architecture includes both a stand-alone installation with hardware, software, dashboard, and controls, and integration into other security systems or control rooms, where a detection can cue a PTZ camera or human guard. Startup Nation Finder further describes a chip-based solution and associates the company with IEEE 802.11bf Wi-Fi sensing, AI, and edge computing. That directory profile is useful ecosystem corroboration, but the company has not published engineering specifications sufficient to establish whether every product configuration implements the standard or uses a particular channel-state-information pipeline. No public benchmark gives detection probability, localization accuracy, range, false-alarm rate, device density, or performance by building material. Claims such as operation through any obstacle, all-weather coverage, and "defense-grade" accuracy therefore remain vendor claims rather than independently established product specifications.

**Market, buyers, and route to market.** The initial market is physical security and safety, with airport and government use cases most visible in public materials. Likely buyers include airport security and operations teams, port and energy-site operators, government facility managers, security integrators, and organizations responsible for large or sensitive premises. The deployment model appears to be enterprise hardware plus software and integration: equipment is positioned across a site, detections reach Waving's dashboard or the customer's control room, and existing cameras, guards, or incident workflows can respond. That makes partnerships with security integrators and infrastructure operators important, since these buyers typically have incumbent video-management, access-control, and perimeter systems and prefer an added sensor to fit their existing operations. Waving has described the Dutch Ministry of Justice and Security and aviation organizations as pilot or testing contexts, and its founder said the €2.6 million round would support broader deployments at airports, government agencies, and critical infrastructure. A Startup in Residence Intergov interview reports three pilots with the Dutch ministry across differing indoor and outdoor environments; it does not name end customers, disclose contract values, or prove recurring commercial deployments. The most defensible go-to-market signal today is a public-sector co-development path and access to aviation-security stakeholders, not a demonstrated repeatable sales channel.

**Traction, capital, and third-party validation.** In March 2026, Waving announced a €2.6 million pre-seed financing round. The founder's public announcement and investor-related coverage name caesar., SI Ventures (formerly Smart Infrastructure Ventures), Lightfield Equity, I-Lab Angels, Living Hope, Angel Invest, HEARTFELT_, P3A, and additional supporters; exact allocation among the participants is not public. One company database labels the round Seed, while Waving's CEO and airport trade coverage describe it as pre-seed, so this record uses the company's pre-seed framing. The financing is a meaningful early validation signal, but no valuation, cumulative capital total, revenue, customer count, or commercial backlog is disclosed. Waving has also been selected for the Dutch Startup in Residence Intergov program, whose public challenge page identifies it as a winner, and a September 2026 program interview says the Ministry of Justice and Security conducted three pilots. Passenger Terminal Today reports trials at Amsterdam Airport Schiphol and work with the Dutch ministry, but the published evidence remains pilot-stage and does not establish procurement or operational adoption at scale. The Israel Innovation Authority's Edge AI listing includes Waving.ai and describes software installed on existing Wi-Fi routers, reporting five employees; Startup Nation Finder lists an October 2024 founding and a 1–10 employee range, but its profile is explicitly dated 2025 and is now a historical ecosystem record. No public patents, security certifications, independent test report, award, or production contract were confirmed in the sources reviewed.

**Founders and operating team.** Waving's official About page identifies Gal Cohen as co-founder and CEO and Asaf Haleva as co-founder and CTO. Cohen is described as having more than a decade in data and technology, prior data-engineering experience, and a computer-science degree from Vrije Universiteit Amsterdam. Haleva is described as having two decades in security technology and as a former vice president of research and development at Matrix; he holds a computer-science degree from the College of Management Academic Studies. This pairing is relevant to the product's combination of data interpretation and site-security integration, although the public record does not provide a detailed history of either founder's prior products, patents, or deployments. The official site also lists CRO Lucas Mosmuller, with prior strategy and finance experience, and CCO Manuel van Lijf, whose background is described in innovation and aviation. The Startup in Residence interview features van Lijf and Cohen discussing operational tests with the Dutch ministry, while public ecosystem information lists a broader early team. Headcount sources are not perfectly synchronized: the Israeli Innovation Authority listing reports five people, Startup Nation Finder reports 1–10, and the company does not publish a current count. The official website identifies Waving B.V. and Amsterdam, Netherlands, while Israeli ecosystem listings and company hiring material also associate the business with Tel Aviv; the legal parent, split of engineering work, and exact Israeli entity structure should be confirmed in diligence rather than simplified to an Israel-only domicile.

**Competitive dynamics and potential edge.** Waving competes for security budgets with video surveillance, thermal and infrared cameras, radar, lidar, fence-mounted intrusion sensors, and human patrols. More directly, Cognitive Systems and Origin Wireless have commercialized forms of Wi-Fi motion or presence sensing, while Xandar Kardian uses radar-based contactless sensing; Axis Communications and Senstar supply mature camera and perimeter-security systems with established integrator channels. Waving's proposed distinction is the combination of Wi-Fi-based detection for security settings, a meshable hardware footprint, edge inference, claims of sensing behind obstacles, and integration into control rooms and existing video systems. If accurate in real operational environments, it could close a specific visibility gap without collecting conventional video and could give an operator a cue before an intruder reaches an asset. The edge is not yet proven durable. Wi-Fi sensing is an active technical category, incumbents can add analytics or partner with sensing specialists, and the practical performance of radio sensing depends on site geometry, materials, interference, network conditions, placement, and calibration. Waving needs reproducible comparisons with camera, radar, and Wi-Fi alternatives, published alert-quality results, and evidence that a customer can install and operate it without repeated site-specific engineering.

**Defense, security, and resilience relevance.** The dual-use connection is credible because the core technology is physical sensing for protection of real facilities, not simply a consumer connectivity feature with a speculative defense story. Commercial airport, port, energy, and government-security applications overlap with force-protection and critical-infrastructure needs: detecting an unauthorized person near a restricted room, perimeter, vehicle entrance, or facility when visual lines of sight are poor can support guard response and sensor cueing. Wi-Fi-based sensing could be useful in indoor or cluttered locations where a camera is inappropriate or where environmental conditions complicate conventional surveillance. The public evidence, however, supports security and government pilots in the Netherlands, not an Israeli Ministry of Defense contract, military deployment, classified evaluation, or fielded battlefield capability. Nor does it show that Waving detects weapons, drones, intent, or named individuals. The company must demonstrate resilience against radio interference, deliberate evasion, adversarial spoofing, changing Wi-Fi networks, and site-specific propagation effects before buyers can rely on it as a safety or defense sensor. Privacy is a potential commercial advantage because the product is not based on identifiable images, but sensing people without cameras can still constitute sensitive monitoring; transparent notices, access control, data minimization, retention limits, and lawful-use boundaries remain necessary.

**Stage, trajectory, and diligence risks.** Waving is best classified as early stage: founded in 2024, financed at pre-seed scale, operating a small team, and using pilots to establish performance and product fit. The trajectory is to convert public-sector and aviation tests into a deployable product and then repeat installations through infrastructure customers and security integrators. A September 2026 Startup in Residence interview describes three ministry pilots and says the company's goal is a first production version within roughly a year; that is a stated ambition, not evidence of a committed release or order. The most material diligence items are: (1) obtain independent results for detection sensitivity, false alarms, classification, range, and coverage across construction types and weather; (2) determine exactly which Wi-Fi hardware, bands, protocol modes, and network configurations are required, and whether third-party router changes or dedicated devices are necessary; (3) establish install, calibration, maintenance, power, and total-cost economics across representative sites; (4) secure references and clarify whether the Schiphol and ministry activity is a technical pilot, a paid evaluation, or an operational purchase; (5) review privacy impact assessments, cybersecurity controls, data retention, and integration security; (6) confirm patent filings, ownership, freedom to operate, and the division of IP between Dutch and Israeli entities; and (7) test whether the small team can support hardware supply, field service, and enterprise integrations across multiple countries. These constraints make Waving strategically interesting and technically differentiated, but still a pilot-stage proposition rather than a validated scaled security vendor.
"""
