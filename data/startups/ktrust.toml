dual_use_description = "Kubernetes security is substantively dual-use. Commercial enterprises and government agencies alike depend on containerized Kubernetes environments for production workloads. A tool that continuously identifies and validates exploitable attack paths in Kubernetes clusters is strategically valuable for both commercial cloud resilience and defense-adjacent mission software. U.S. federal agencies (DoD, CISA, Treasury, etc.) have adopted Kubernetes and cloud-native architectures; tools that harden these environments reduce exploitable weaknesses in critical digital infrastructure. This is not theoretical adjacency—container security is core to federal cyber resilience mandates and allied force modernization. However, Kubernetes exposure management remains a generic infrastructure-security tool; it is not inherently weaponizable or dual-use in the sense of export-control sensitivity. The distinction matters: KTrust's core technology is defensible for commercial use and has clear strategic value for allied defense posture, without requiring special licensing or export review."
