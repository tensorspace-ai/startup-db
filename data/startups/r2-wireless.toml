name = "R2 Wireless"
description = "R2 Wireless is an Israeli deep-tech defense and security startup developing ODIN, a passive, software-defined RF sensing platform that detects, classifies, and geolocates wireless emitters across protocols and environments. Its stated applications span counter-UAS, electronic-warfare awareness, critical-infrastructure protection, and civilian perimeter security."
detailed_description = """R2 Wireless is a signal-processing and wireless-sensing company, not principally a tactical networking vendor. Its flagship ODIN platform is described by the company as a hardware-agnostic, software-defined and passive RF sensing system. The system uses a broad-band RF front end, proprietary signal processing, RF fingerprinting, edge artificial intelligence, machine learning, and estimation methods to identify emitting devices without requiring prior knowledge of their protocol or modulation. R2 also describes Angle of Arrival (AoA) for single-sensor bearing and distance estimation, Time Difference of Arrival (TDoA) for multi-sensor geolocation, and Joint Signal Classification techniques that combine signal and contextual information. These are technically demanding capabilities because accuracy must survive fading, multipath, synchronization errors, low signal strength, frequency hopping, and dense or changing RF environments.

The customer problem is spectrum visibility: radar, cameras, and conventional counter-UAS systems can miss small, low-flying, non-cooperative, or protocol-diverse threats, while passive RF sensing can add an electromagnetic layer to a wider security architecture. R2 markets ODIN for military units, combat vehicles, bases, maritime operations, aerial ISR, borders, airports, telecom networks, critical infrastructure, ports, utilities, prisons, major venues, and mobile VIP protection. The company emphasizes low size, weight, power, cost, and cooling; commercial-off-the-shelf hardware; off-grid operation with solar support; IP-66 and MIL-STD-related positioning; and open API integration with command-and-control platforms, other sensors, and kinetic or non-kinetic effectors. Those claims describe a potentially useful deployment model, but the database should distinguish company-stated specifications from independently measured performance.

Public traction signals are stronger than the former record suggested, although they remain early and do not establish scaled revenue. In October 2024, the Times of Israel reported that R2 had pilots with the Israeli military, trials with the UK military, and participation in an exercise involving NATO countries; the same report described a 14-person team and a portable tripod-mounted sensor. In May 2026, R2 announced on its own site that it had reached the U.S. Army xTech Adaptive Strike semifinals and would take ODIN to the National Training Center for a soldier exercise. Israel's Innovation Authority also lists R2 Wireless Ltd. as an Israeli company in signal processing, wireless communication, and machine learning. These are meaningful validation and access signals, but they are not the same as a production contract, recurring revenue, operational acceptance, or a disclosed accuracy benchmark.

The competitive field includes dedicated RF detection and electronic-warfare suppliers, counter-UAS companies, radar and electro-optical vendors, and integrated defense primes. R2's proposed advantage is breadth across protocols and frequencies, passive operation, a small deployable footprint, protocol-agnostic classification, and an integration layer for existing effectors. The commercial opportunity is credible because airports, ports, utilities, telecom operators, border agencies, prisons, and event operators face drone, unauthorized-device, interference, and RF-cyber risks. However, R2 must prove that its system produces actionable geolocation and low false-alarm rates in cluttered environments, including against silent, encrypted, autonomous, or deliberately emission-controlled threats. It must also show that deployment, calibration, data governance, and integration are materially easier or cheaper than buying a larger incumbent system.

The defense and national-security relevance is direct. Passive detection of drones, tactical radios, remote IED links, GPS spoofers or jammers, cellular devices, and other emitters can support counter-UAS, electronic-support measures, force protection, border surveillance, maritime security, and layered command-and-control. The dual-use case is substantive because the same sensing layer can protect civilian airspace and infrastructure, but the company is still an early-stage supplier operating in a qualification-heavy market. Diligence should prioritize independently reproducible detection and geolocation results, coverage and latency by band, performance against frequency-hopping and low-probability-of-intercept signals, privacy and export-control posture, unit economics, customer conversion from trials, and the durability of its U.S., Israeli, UK, and NATO access. R2 is strategically interesting, but its long-term value depends on turning technically ambitious claims and exercises into repeatable deployments."""
