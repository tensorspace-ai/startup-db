detailed_description = """
Moon Active is a Tel Aviv-headquartered mobile gaming company founded in 2011 that has built one of the most profitable and durable casual gaming franchises globally. Coin Master, released in January 2016, combines three proven casual game mechanics—slot machine gameplay, persistent village-building progression, and asynchronous social raiding—into a highly engaging loop that sustains player engagement and monetization over 9+ years of live operation. The game's design achieves exceptional virality through social features, allowing friends to raid villages and collaborative events that encourage retention and word-of-mouth acquisition.

Coin Master's commercial performance is extraordinary: the game generated approximately $100 million in gross revenue in 2018, $550 million in 2019, $1.25 billion in 2020, and has exceeded $6 billion in cumulative lifetime revenue as of August 2024. This scale places it among the top 5 highest-grossing mobile games of all time. The game's monetization model combines free-to-play mechanics with cosmetics, battle passes, time-accelerators, and randomized loot mechanics that drive consistent annual revenue reinvestment. Coin Master's user retention curves are notably strong for a casual title—evidenced by sustained revenue during mature market phases—suggesting deep engagement and repeat spending rather than reliance on declining new user acquisition.

Moon Active's corporate evolution demonstrates disciplined scaling. Founded in 2011 as a bootstrapped startup, the company achieved profitability without significant dilution. Insight Partners' 10% stake purchase in early 2020 valued the company at $1.25 billion (unicorn status). By November 2021, a $300 million secondary transaction valued Moon Active at approximately $5 billion, indicating that subsequent shareholder valuations significantly exceeded earlier investment rounds. The company operates with approximately 1,300 employees across Tel Aviv headquarters, London offices, and Kyiv development infrastructure. Strategic acquisitions including Melsoft Games (Family Island, My Cafe franchises) in December 2020 for $100+ million signal Moon Active's portfolio expansion strategy, though Coin Master remains the dominant revenue contributor.

Moon Active's live operations discipline is noteworthy. Nine years of sustained revenue growth in a single title reflects exceptional game balance, seasonal content cadence, event design, and player monetization optimization. This longevity contrasts with typical casual game lifecycles (2-5 years) and requires continuous A/B testing, data analytics, and design iteration. The company has built IP differentiation through character development (the Coin Master protagonist and supporting characters) and cross-media expansion including partnerships with streaming platforms and merchandise opportunities. Revenue sustainability at scale suggests sophisticated player acquisition economics, retention forecasting, and user lifetime value optimization."""
