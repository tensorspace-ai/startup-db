investment_rationale = "The public evidence supports strategic relevance and customer access more strongly than venture-scale economics. Positive signals are named Air Force, Rafael, Sderot Municipality, and military training projects; founder experience as naval officers; and a capability set applicable to defense, emergency services, medicine, and industrial operations. The main investment diligence issue is whether project delivery can be converted into a repeatable software platform with recurring maintenance and expansion revenue. No funding amount, revenue, contract value, backlog, margin, or audited training outcome is public, so the legacy priority flag remains false pending commercial and product-reuse evidence; this is not an investment recommendation."
strategic_value = "in3D could contribute to allied resilience by letting local authorities, military units, and critical-infrastructure operators rehearse high-consequence events in environments modeled on their actual facilities and cities. The reported Sderot project is strategically relevant because its design joins city-specific scenarios, emergency operations workflows, and immersive practice across responders. The Air Force hangar project shows a narrower operational-training application where physical exercises are disruptive or hazardous. Strategic value depends on current data, cross-agency adoption, secure handling of facility models, and evidence that skills learned in simulation transfer to field performance."
