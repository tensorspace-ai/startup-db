name = "Cognni"
description = "Cognni Ltd. is an active Israeli information-intelligence and data-security startup. Its current product governs enterprise use of Microsoft 365 Copilot, ChatGPT Enterprise and Claude Enterprise by mapping and classifying unstructured information and highlighting AI exposure, insider risk and compliance issues."
detailed_description = """
Cognni provides an information-intelligence layer for enterprise security and governance teams. Its platform is designed to map unstructured and regulated information, infer the meaning and business sensitivity of documents, email, chats, prompts, and related assets, and then turn that context into labels, policies, alerts, and investigation workflows. The company's current methodology is explicitly organized around agentless discovery, contextual classification, and enforcement. It positions this approach against regex- and keyword-heavy controls that can miss business-critical information when the relevant sensitivity is contextual rather than a simple identifier. Public product materials also describe behavioral mapping, anomaly detection, shadow-AI monitoring, timeline reconstruction, and blast-radius analysis. These are plausible capabilities for a data-security platform, but Cognni does not publicly provide enough independent benchmark detail to establish accuracy across languages, industries, repositories, or rapidly changing enterprise content.

The primary buyer context is enterprise information security, data governance, compliance, insider-risk, and Microsoft 365 administration. Cognni says it can operate across email, documents, chats, and AI prompts, with specific integration surfaces for Microsoft Purview, Gmail, and Google Drive. Its current website advertises deployment in under 15 minutes and claims that its contextual layer can increase Purview label coverage by up to 500%; those figures are company claims and should be validated under a defined customer test rather than treated as independently verified performance. A SoftwareOne case study identifies Cognni as a Microsoft co-sell partner and describes a Purview-related engagement for a manufacturer with 8,000 employees. Cognni's own case study describes automated labeling and policy support in that setting. Together these are useful ecosystem and commercialization signals, but they do not establish recurring revenue, retention, deployment scale, customer concentration, or repeatability across tenants.

Competition is structurally difficult because Microsoft and Google control much of the installed collaboration and security surface. Microsoft Purview, Varonis, BigID, Concentric AI, Nightfall AI, Proofpoint, Securiti, and other data-security-posture-management or insider-risk vendors address overlapping problems. Cognni's proposed edge is semantic understanding of information flow and business context, potentially reducing manual rule maintenance and improving coverage for sensitive content that does not match a fixed pattern. The important diligence question is whether this semantic lift is measurable and durable enough to justify another control plane alongside native DLP, sensitivity labels, permissions analytics, and AI-governance features. Buyers should request precision and recall by content class, false-positive rates, supported languages and repositories, latency and cost at scale, model-evaluation methodology, remediation depth, and evidence of expansion from an initial assessment into recurring production use.

Cognni has credible but bounded national-security relevance. The core product is defensive information assurance: discovering exposed material, applying governance before sensitive data reaches collaboration systems or AI assistants, identifying unusual information-sharing behavior, and reconstructing an incident's likely data path. These functions can matter to government, defense, intelligence-support, and critical-infrastructure organizations with large volumes of operationally sensitive unstructured information. The public record reviewed here does not establish defense customers, government contracts, classified-environment accreditation, or offensive cyber capability, so the dual-use case should not be overstated. Strategic applicability will depend on deployment architecture, data residency, identity and audit integrations, language coverage, procurement posture, and the ability to support restricted or disconnected environments. The company appears commercially active and productized, while still requiring material diligence on technical validation, current traction, financing history, and readiness for high-assurance deployments.
"""
