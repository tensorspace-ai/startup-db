name = "Skybox Security"
description = "Skybox Security developed enterprise security policy and continuous-exposure-management software that modeled network topology, firewall controls, vulnerabilities, and attack paths to prioritize reachable risk. It ceased operations on February 24, 2025, and selected business and technology assets were transferred to Tufin, so this record now describes a closed acquired asset with residual technical and strategic relevance."
detailed_description = """
Skybox Security’s core product was a security analytics and policy-management platform built around an attack-surface model. It ingested network topology, firewall and security-policy configurations, vulnerability data, threat intelligence, and asset context, then correlated those inputs into a graph of connectivity and exposure. The practical value was to distinguish a severe vulnerability that was not reachable from one that sat on a viable path to a high-value system. Related workflows included firewall-rule analysis, policy compliance, change-impact review, attack simulation, vulnerability prioritization, and remediation planning.

The product addressed a difficult enterprise operating environment: large organizations run heterogeneous firewalls, routers, cloud networks, remote-access systems, and sometimes operational-technology segments that cannot be changed casually. Security teams therefore need an inventory and risk model that spans security tools and infrastructure rather than another isolated scanner. Skybox’s commercial proposition was to give network-security, vulnerability-management, and governance teams a shared model for deciding which controls or exposures deserve attention first. Its 2023 company fact sheet reported approximately 300 employees and more than 500 licensed customers, useful historical traction signals but not evidence of a current operating business.

Competition came from several directions. Network security policy management vendors such as Tufin and FireMon competed for firewall governance, audit, and change control. Attack-path and exposure-management vendors such as XM Cyber, Tenable, and Rapid7 competed for contextualized vulnerability prioritization, while native firewall, cloud-security, and vulnerability suites increasingly bundled adjacent capabilities. Skybox’s differentiation was the breadth of its model and its ability to connect policy, topology, vulnerabilities, and attack simulation; the trade-off was a complex enterprise deployment that depended on accurate integrations and sustained vendor support.

The decisive commercialization fact is that Skybox closed operations effective February 24, 2025. Tufin’s official transition page says it created an ExpressPath program for former Skybox customers, and reporting by SecurityWeek and CTech describes the sale of Skybox’s business and technology assets to Tufin and the layoff of approximately 300 employees. Accordingly, current customer continuity, product roadmap, support, licensing, intellectual-property ownership, and migration status require diligence with Tufin rather than with an independent Skybox management team. The record should not imply that historical customers, revenue, or product availability continue unchanged.

The underlying capability has credible national-security relevance, but that relevance belongs primarily to the technology and acquired assets. Defense, intelligence, and critical-infrastructure operators also need to model segmented networks, identify reachable attack paths, validate policy changes, and prioritize remediation under constrained maintenance windows. Such use does not establish that Skybox had classified deployments or government contracts; no such claim is made here. The strongest strategic interpretation is that Skybox provides a useful reference architecture and possibly reusable product assets for exposure modeling, while the shutdown makes independent investment, execution, and support theses untenable without evidence from the asset buyer.
"""
