[[intelligence.comparables]]
source_ids = ["s_tufin_sec_filing", "s_fact_sheet", "s_tufin_expresspath"]
name = "Tufin"
rationale = "Tufin's SEC filing named Skybox as a direct competitor in security policy management. Tufin later offered Skybox customer migration and acquired selected Skybox assets, making it the most relevant continuity and replacement comparator."
differentiation = "Skybox historically combined a network model, vulnerability context, exposure analysis, and policy-change workflows. Tufin's current Network Security Policy Management offering and customer-transition program are the observable successor path; the exact product/IP overlap after the asset transaction is not public."

[[intelligence.comparables]]
source_ids = ["s_tufin_sec_filing", "s_firemon_migration"]
name = "FireMon"
rationale = "Tufin's SEC filing identified FireMon as a direct security-policy-management competitor. FireMon subsequently marketed migration and policy-control offerings to former Skybox customers."
differentiation = "FireMon describes continuous policy validation and operational control across firewall, cloud, and segmentation environments. Skybox's documented differentiator was its correlation of network paths, vulnerabilities, and policy context in an exposure model; a feature-by-feature current comparison remains a diligence item."

[[intelligence.comparables]]
source_ids = ["s_tufin_sec_filing", "s_ivc_profile", "s_fact_sheet"]
name = "AlgoSec"
rationale = "Tufin's filing names AlgoSec as a direct competitor, and IVC lists it among Skybox's competitors."
differentiation = "The available evidence places both in network security policy management. Skybox's company materials emphasize a combined topology, vulnerability, attack-path, and policy model; public evidence reviewed here does not establish a durable feature advantage over AlgoSec."

