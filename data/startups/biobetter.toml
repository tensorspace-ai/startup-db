name = "BioBetter"
description = "BioBetter is an Israeli molecular-farming startup that produces complex growth factors and other bioactive proteins in engineered tobacco plants, combining plant-based expression with proprietary purification and stabilization. The company began with a cultivated-meat cost problem and is currently commercializing plant-derived bioactives for cosmetics while retaining a path back to food and biomanufacturing markets."
detailed_description = """**Product and the concrete problem it solves.** BioBetter targets the expensive biological inputs that make cultivated meat and some advanced cell-based products difficult to scale. Growth factors such as insulin, transferrin, and FGF2 are used to stimulate cell growth and differentiation, yet they have traditionally been supplied through costly fermentation, animal-derived serum, or highly purified recombinant processes. The company’s original thesis was that cultivated-meat producers could not reach meaningful cost and volume targets while these inputs remained a dominant share of marginal production cost. BioBetter uses tobacco as a non-food crop and biological production host, with the aim of turning sunlight, water, carbon dioxide, and field infrastructure into a lower-cost supply of complex proteins. Its current public website shows a commercial pivot toward BioFera and ExoFera plant-based bioactives for cosmetic and aesthetic formulations, including EGF- and IGF1-related products, with white-label and co-development routes for partners. That pivot is not a retreat from the underlying platform: it is a change in beachhead from a capital-intensive food market to applications that use smaller quantities and can support premium pricing. The concrete customer problem is therefore broader than cultivated meat. BioBetter is trying to make difficult proteins more stable, manufacturable, and affordable for customers that need consistent biological activity without relying on animal inputs or an expensive, centralized bioreactor supply chain.

**Core technology and how it actually works.** The platform combines molecular farming, plant genetic engineering, downstream purification, and protein stabilization. BioBetter’s public descriptions say tobacco plants are modified to express target proteins, grown in controlled facilities or open fields, harvested, and processed through a proprietary purification method. The plant is treated as a self-sustaining bioreactor rather than as a food product, allowing the company to use a high-biomass host and existing agricultural practices while keeping the desired output in a recoverable biological stream. The company has identified insulin, transferrin, FGF2, and other growth factors as target molecules for cellular agriculture, and later materials describe human-compatible growth factors and plant-derived vesicle or exosome-inspired ingredients for cosmetics. The claimed technical advantage is not simply expression; it is the combination of expression yield, purification economics, and stability. In 2025 company materials described stabilizing complex molecules by linking them to cellulose particles so that they resist temperature and handling conditions that can degrade them. FoodBev reported that the pilot facility could process up to 100 kilograms of plant material per day, while BioBetter’s own historical target was to reach substantially larger daily growth-factor output. These are useful process signals but not independent product benchmarks. Diligence should separate protein expression from active yield, purity, batch consistency, downstream recovery, shelf life, biological potency, and regulatory-grade documentation for every intended application.

**Market, customers, and go-to-market.** BioBetter initially pursued business-to-business sales to cultivated-meat companies, media suppliers, and other cell-agriculture developers that needed growth factors in bulk. The model was to sell a qualified ingredient or co-develop a formulation, allowing the customer to keep its own cell line and production process while replacing a costly input. In the cultivated-meat market, this is an enabling-ingredient strategy: BioBetter does not need to own a consumer meat brand, but it does need its product to work inside many customers’ media recipes and production systems. The company publicly described collaborations with leading cell-based meat companies and a pool of commissions during its 2022 expansion announcement, although customer names, contract values, recurring revenue, and current status of those collaborations are not disclosed. After the cultivated-meat market weakened and the northern Israel war disrupted operations, management shifted the near-term commercial focus to cosmetics and medical aesthetics. The current website lists available BioFera ingredients, ready-to-use professional products, samples, white-label supply, and co-development of plant-based bioactives. This route has a faster feedback loop and a smaller quantity requirement than commodity-scale food ingredients, but it carries its own burden of cosmetic formulation, safety testing, substantiation, channel development, and customer qualification. The strongest go-to-market path appears to be a dual-track model: generate earlier revenue from premium bioactives while preserving the process and regulatory work needed for larger food, research, and biopharmaceutical opportunities.

**Traction, funding, and third-party validation.** BioBetter has a meaningful but uneven public validation record. Startup Nation Finder identifies the company as a private Israeli startup founded in 2015, with 11-50 employees, approximately $16.63 million raised across multiple rounds, and a September 2022 Series A of $10 million led by Jerusalem Venture Partners with Milk & Honey Ventures and the Israel Innovation Authority. Finder also records a 2023 non-equity grant from the Israel Innovation Authority and EIT Food Accelerator Network. The company’s 2022 financing announcement said the proceeds would support a larger pilot plant in the Tel Hai Industrial Park, additional growth-factor products, and workforce expansion. FoodBev’s 2023 visit corroborated the existence of a food-grade pilot facility in northern Israel, commercial-scale cultivation claims, and a stated capacity to process roughly 100 kilograms of plant material daily. In 2025, Haaretz Labels reported that the company had been forced to evacuate during the war, reduced its workforce, relocated temporarily to Yokneam, pivoted toward cosmetics, and later reopened in Tel Hai after residents were allowed to return. The present website demonstrates an active product and partner interface, including products marked available now and a request-a-sample flow. Still, public evidence does not establish audited revenue, repeat orders, current headcount, independently verified cost-per-gram, regulatory approvals for each product, or the conversion of the original food-tech commissions into durable commercial contracts. The record supports real technical and institutional progress, not a claim of proven scale.

**Founders and team background.** BioBetter was founded by Prof. Oded Shoseyov, Dana Yarden, and Avi Tzur, with Amit Yaari identified in ecosystem and company materials as CEO during the cultivated-meat scale-up period. Shoseyov is a Hebrew University researcher and entrepreneur associated with protein engineering, nanobiotechnology, and multiple commercialization efforts, including CollPlant, SavorEat, and Melodea. That background is relevant because BioBetter’s challenge is an integrated one: it needs plant biology, protein design, purification, formulation, manufacturing, and market translation rather than a single laboratory breakthrough. Yarden brings biotech business experience and has been a public spokesperson for the company’s food-security and business-reset thesis. Tzur is described as an industrialist and early backer who saw a positive industrial use for tobacco. Finder lists additional operating roles including VP Operations, VP R&D, and a chief research and development position, but public sources do not provide a complete current organization chart or confirm which executives remain in each role after the pivot. The company’s wartime experience also reveals a practical aspect of team resilience: public reporting says about one quarter of employees were called to reserve duty, most other employees evacuated, and the organization later rebuilt after a major workforce contraction. The positive team signal is scientific founder-market fit and persistence through a severe operating shock. The counter-signal is concentration risk: a small organization must manage sophisticated biology, quality systems, partner development, manufacturing, and two distinct commercial markets at once.

**Competitive dynamics.** BioBetter competes against several solution classes. Multus Biotechnology and other cultivated-media specialists sell recombinant growth factors or media components optimized for cell-agriculture workflows. Fermentation companies can produce similar proteins in microbial or mammalian systems with established bioprocess controls, while Thermo Fisher Scientific, Merck, Cytiva, and other life-science suppliers bring distribution, documentation, and quality infrastructure that a small startup cannot easily match. In food, companies can also reduce media cost through cell-line engineering, lower-factor recipes, serum-free formulation, or process changes that reduce the required concentration of growth factors. On the plant side, molecular-farming companies such as PlantForm and larger agricultural-biotechnology firms represent alternative expression and scale-up capabilities. BioBetter’s potential edge is the combination of a high-biomass tobacco host, a proprietary purification route, and stabilization of complex proteins, plus an asset base and know-how accumulated through pilot operation in northern Israel. The tobacco choice can avoid competition with food crops and may be compatible with field-scale production, but it introduces crop variability, seasonal planning, biosafety, containment, and downstream consistency questions. The cosmetics pivot creates a nearer-term wedge but also moves the company into a crowded bioactive-ingredient market where brand owners, contract manufacturers, and established suppliers control customer access. A durable moat would require protected process IP, reproducible potency data, qualified manufacturing, reference customers, and customer-specific formulations that are difficult to replace.

**Defense, security, and resilience dual-use relevance.** BioBetter’s core platform has credible dual-use relevance through food security and biomanufacturing resilience rather than through a disclosed weapons or military program. A domestic or allied capability to produce complex proteins from non-food plants can reduce exposure to concentrated animal-derived supply chains, imported growth factors, and single-region fermentation capacity. That matters for cultivated foods, research reagents, medical manufacturing, and potentially emergency biotechnology programs in which dependable access to biological inputs is strategically important. The company’s use of tobacco also creates a resilience narrative for northern Israel: idle or underused agricultural capacity can be redirected toward a higher-value industrial crop, while a distributed production model could complement centralized bioreactor facilities. The same process engineering could, in principle, support selected research or therapeutic proteins relevant to public-health preparedness, but no public source establishes defense procurement, classified work, military deployment, or authorization for pharmaceutical products. The company’s wartime relocation and later return are evidence of operational resilience under stress, not evidence that its technology is already resilient in a national-security sense. Accordingly, dual_use is set to true because the platform credibly serves civilian food and bioeconomy needs while addressing supply-chain and strategic-production resilience; the score is moderated because defense and public-health deployment remain potential applications. The key diligence questions are whether production can be distributed without compromising quality, whether engineered crops and facilities meet biosafety requirements, and whether customer data and biological materials can be protected across cross-border partnerships.

**Growth stage, trajectory, and key diligence risks.** BioBetter is classified as mid-stage in technical development but early in commercial reorientation. It has operated since 2015, raised a reported Series A and public grants, built a food-grade pilot facility, demonstrated plant cultivation and processing activity, and now presents products as available or open for sampling. That is more mature than a laboratory-only venture. At the same time, the 2025 pivot means the current revenue engine is not yet equivalent to the original cultivated-meat plan, and the public record does not show repeatable production economics or a completed scale-up to the previously stated multi-ton daily objective. The trajectory depends on turning BioFera and ExoFera into repeat B2B sales, proving cosmetic ingredient safety and performance, preserving the option to re-enter food and life-science markets, and financing manufacturing expansion without losing focus. The diligence list is concrete: (1) reconcile the 2015 versus 2017 founding dates and the current legal and management structure; (2) verify current headcount, runway, ownership, and the status of the reported $16.63 million financing; (3) obtain independent data on expression yield, purity, stability, potency, batch variance, and cost per gram; (4) test whether the cellulose-linked stabilization mechanism survives scale, storage, and customer formulation; (5) confirm the regulatory classification and safety dossiers for each cosmetic, food, research, or medical claim; (6) assess crop, facility, biosafety, and northern-Israel continuity risk; and (7) determine whether the company’s customer pipeline is a real commercialization base or primarily historical collaboration. BioBetter is strategically interesting because it couples molecular farming with supply-chain resilience, but its next value-creation step is commercial proof, not another broad platform claim."""
