name = "Nobio"
description = "Israeli materials science startup embedding contact-active antimicrobial particles in dental and other materials; its Infinix dental line has FDA clearances and a branded Ultradent distribution milestone."
detailed_description = """Nobio Ltd. is an Israeli materials science and dental technology company founded in 2015. It develops functionalized antimicrobial particles intended to be blended into bulk materials or anchored to surfaces. Nobio describes each particle as a solid core carrying covalently bound antimicrobial groups; the company says the particles act by contact and are designed not to dissolve or leach. Those performance and safety statements are company claims, not an independent finding in this dossier.

Its clearest commercial product is Infinix, a range of resin-based dental restorative materials. FDA records show 510(k) substantial-equivalence decisions for Infinix universal composite in 2019 and additional flowable and bulk-fill products in 2020. The FDA records establish regulatory clearance for the stated indications, not clinical superiority or product demand. A 2019 submission states that clinical studies intended to demonstrate improved clinical outcomes had not been conducted. The company site continues to present Infinix products, and FDA records name Ultradent as applicant for 2023 products sold under the Bioprotection by Nobio label. UDI records list these devices as in commercial distribution, which is meaningful channel evidence but does not reveal sales volumes, commercial terms, or Nobio revenue.

Nobio also markets its particle platform for medical devices, implants, food packaging, consumer products, and industrial surfaces. Its collaboration page describes partner co-development, and in 2020 Nobio and protective-equipment manufacturer Supergum announced a project to prototype and test masks with antiviral particles. Public evidence reviewed here confirms a collaboration objective and prototype testing plan, not a completed qualification, fielded protective equipment, or a defense contract. The Israeli Innovation Authority profile identifies the company as NOBIO LTD, gives Israeli registration number 515281285, and records Kadima, Israel as the operating location. The current product and company sites support an active operating classification."""
logo = "Unknown"
website = "https://www.nobio.com/"
sector = "Health technology; dental materials; antimicrobial materials science"
founded = "2015"
headquarters = "Kadima, Israel"
employees = "27 listed in an undated Israel Innovation Authority profile; current headcount is unconfirmed"
funding_stage = "2018 reported Series A or equity investment; later government grants; follow-on equity is not verified"
entity_type = "startup"
dual_use = true
dual_use_description = """Nobio has a concrete commercial use in dental materials: FDA records document clearance of its Infinix restorative composites, and a separate FDA record names Ultradent as the applicant for sealants marketed as Bioprotection by Nobio. The company also announced a 2020 collaboration with Supergum to prototype and test masks that combine Nobio particles with Supergum CBRN breathing-protection products. An antimicrobial textile or surface layer could be relevant to medical responders, emergency personnel, and protective-equipment supply chains because it may add contact-active pathogen control to a physical barrier. This makes the platform relevant to health security and potentially defense-adjacent procurement. Evidence stops at an announced prototype and test plan: no test results, qualification, military adoption, government purchase, or operational deployment was located. The record therefore treats defense/security relevance as a technical application and partnership signal, not defense revenue or a proven field capability."""
key_technologies = ["Covalently functionalized antimicrobial micro- and nanoparticles", "Contact-active antimicrobial additives embedded in resin and other materials", "Non-leaching surface and bulk-material bioprotection", "Dental restorative composite formulations"]
use_cases = ["Dental composite restorations and sealants", "Antimicrobial medical devices and implants", "Protective textiles and masks under prototype development", "Industrial surfaces, filters, packaging, and other partner materials"]
investible = false
investment_rationale = """Nobio presents a differentiated materials platform with a regulatory foothold in dental products rather than a concept-only research program. FDA records establish cleared products, and the 2023 Ultradent filing plus UDI commercial-distribution status show that the platform has reached products outside the original Infinix label. Its particle approach may let established manufacturers add antimicrobial functionality without redesigning an entire device, creating a potential licensing, additive-supply, or co-development business model. The Israeli Innovation Authority profile calls the company stage Initial Revenues, although it supplies no amount or date for that stage label.

The case is difficult to underwrite from public evidence. There is no verified revenue, repeat-order, gross-margin, customer-concentration, cash, or runway data; the 2018 round itself has conflicting published amounts, and later equity is not established. FDA clearance does not prove that the product reduces decay or improves patient outcomes in routine practice. Commercial execution depends on partner adoption, manufacturing consistency, regulatory work across product categories, and proof that long-lasting antimicrobial performance survives sterilization, wear, aging, and real-world use without material trade-offs. I have therefore left the legacy investible signal false and the priority low pending commercial, clinical, and ownership diligence. This is a research triage judgment, not an investment recommendation."""
strategic_value = """Nobio is strategically relevant to Israel's applied materials, dental-medical device, and technology-transfer base. The company links academic-origin research associated with Prof. Ervin Weiss to a platform that can be incorporated into products made by industrial partners. Its Israeli registration, Kadima location, reported Israel Innovation Authority support, patents assigned to Nobio, and joint patent ownership with Hadasit create a locally anchored capability spanning chemistry, formulation, regulatory affairs, clinical operations, and manufacturing scale-up.

The platform could matter beyond dentistry if its function and durability are independently demonstrated in medical devices, high-touch surfaces, filters, packaging, and protective textiles. The Supergum mask collaboration gives a specific example of potential health-security relevance alongside a CBRN equipment supplier. Its strategic value remains conditional: the publicly visible portfolio is strongest in dental products, partner programs are not the same as production orders, the mask project has no disclosed outcome, and the company has not published quantitative adoption or efficacy data sufficient to establish broad operational importance. The record assigns strategic value to the adaptable materials platform and Israeli industrial knowledge, while treating cross-sector scale as an unresolved opportunity."""
stage = "mid"
stage_rationale = """Nobio is best classified as mid-stage: it was founded in 2015, has FDA-cleared dental products, public partner activity, and products in commercial distribution through an established dental manufacturer. The IIA profile labels the company Initial Revenues, but its employee count and revenue-stage detail are undated and unquantified. It does not have the public financial and scale evidence expected of a mature company. Stage is based on product and regulatory milestones, not a claimed financing label or a valuation."""
competitors = ["Ivoclar Tetric EvoCeram", "Kuraray Noritake CLEARFIL SE Protect"]
competitive_edge = """Nobio's potential distinction is a particle additive that the company says can be permanently embedded in a host material while retaining contact-active antimicrobial function without relying on release of a soluble agent. This is a platform proposition: a materials partner might adapt it to an existing resin, coating, or device, with the partner retaining its manufacturing and distribution role. Patents assigned to Nobio and Hadasit, plus a newer Nobio-assigned coating patent, support the presence of a continuing technical program, though patent counts alone do not establish freedom to operate or commercial defensibility.

The closest visible dental alternatives show that antimicrobial positioning is not unique. Ivoclar markets Tetric EvoCeram as a conventional universal composite and was the predicate device in an FDA submission for Infinix. Kuraray Noritake's CLEARFIL SE Protect combines MDPB antibacterial monomer chemistry with fluoride release in an adhesive. These products address overlapping dental infection or caries concerns through different formulations and workflows; they are not evidence of a direct head-to-head performance comparison. Nobio's edge will depend on clinically meaningful outcomes, product handling and durability, price, practitioner adoption, compatibility with manufacturing processes, and the ability to secure repeat partner business. No independent head-to-head study, price comparison, or market-share evidence was located."""
risk_factors = ["Clinical risk: the FDA clearances reviewed establish substantial equivalence for specified indications; the 2019 submission states that clinical studies for improved clinical outcomes had not been conducted. No later independent evidence reviewed here resolves whether routine patient outcomes improve.", "Commercial risk: no verified revenue, repeat orders, sales volume, customer concentration, pricing, gross margin, or manufacturing utilization is public. Ultradent's FDA listing and UDI distribution status are not proof of payment terms or scale.", "Funding and liquidity risk: the reported 2018 investment is variously stated as USD 3.5 million and USD 3.6 million. Directory-listed 2015 and 2019 rounds lack primary confirmation and amounts; later runway and financing needs are unknown.", "Technical and regulatory risk: efficacy and material compatibility may vary by substrate, pathogen, formulation, aging, sterilization, and use environment. Each product family can require separate testing and regulatory work; cross-sector applications remain partner-dependent.", "IP and execution risk: the company reports licensed and jointly owned technology alongside patents assigned to Nobio. The commercial scope, royalties, remaining patent term, international status, freedom to operate, and ownership of improvements require diligence.", "Dual-use evidence risk: the 2020 CBRN mask collaboration was an announced prototype-and-test activity. No results, qualification, government contract, or field deployment were located, so it should not be counted as defense traction.", "Governance and people risk: the published management roster is dated January 2023 and no current organizational chart, founder role confirmation, cap table, or shareholder percentages were found."]
risk_level = "high"
signals = ["FDA 510(k) substantial-equivalence decisions for Infinix products in 2019 and 2020", "Ultradent FDA filing for Bioprotection by Nobio products in 2023", "UDI records list Ultradent Bioprotection by Nobio devices in commercial distribution", "Nobio and Supergum announced a CBRN mask prototype and testing collaboration in 2020", "Nobio-assigned US coating patent granted in October 2026", "Israel Innovation Authority profile records 2023 R&D program and fund activity"]
