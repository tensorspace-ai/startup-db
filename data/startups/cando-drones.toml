stage_rationale = "Cando is in the early stage of commercialization and scaling. While seed-funded, the company has achieved product-market fit for its core homeland-security use case, demonstrated through recurring deployments with Israeli security agencies and documented operational success in complex multi-mission scenarios. However, the company remains pre-Series-A in fund-raising, with growth limited by capital availability rather than technical or market validation. The path to Series-A is clear: expanding customer adoption across Israeli municipalities and security agencies, establishing export partnerships with allied nations, and scaling engineering to support increasingly complex mission profiles. The core platform is mature enough for commercial deployment but early enough in the product roadmap that significant feature expansion (e.g., autonomous swarm swarming behavior, enhanced sensor fusion, higher drone counts) is still in development. This positions Cando as an early-stage company with traction, making it an appropriate direct diligence target for venture funds focused on deep tech and defense innovation."
