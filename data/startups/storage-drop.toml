name = "Storage Drop"
description = "Storage Drop is an Israeli energy-technology company developing long-duration compressed-air storage, liquid-piston compression, and thermal cooling-storage systems for renewable power, industrial energy management, and resilient refrigeration. Its HyDrop, DropX, and CoolDrop technologies use water-based isothermal compression and underground or high-pressure storage to shift electricity and cooling across time without relying on lithium-ion batteries for every application."
detailed_description = """
**Product and the concrete problem it solves.** Storage Drop addresses the dispatchability and peak-cost problem created when renewable generation is available at one time but electricity or cooling is needed at another. Solar and wind projects can produce power when demand is low, while factories, cold chains, data centers, food processors, and industrial sites need reliable energy and temperature control through evenings, peaks, and grid interruptions. Storage Drop's product family is built around three related applications. **HyDrop** stores compressed air for later electricity generation alongside renewable facilities. **DropX** is the hydraulic, isothermal compressor that charges the storage system and is also positioned as an industrial compressed-air machine. **CoolDrop** stores high-pressure refrigerant or cooling energy for later air-conditioning and industrial refrigeration. This is a systems company, not a single battery substitute: it is attempting to use common hydraulic and thermodynamic building blocks across power storage, compressed-air supply, and thermal management. The practical customer problem is therefore both energy arbitrage and continuity. A renewable producer can shift output into higher-value hours; an industrial operator can reduce peak demand and compressed-air costs; a food or pharmaceutical facility can maintain cold conditions; and a site with weak grid service can use stored energy or cooling as a resilience buffer.

**Core technology and how it actually works.** The central technical choice is isothermal compression of air with water using liquid pistons. Conventional compressed-air energy storage is challenged by compressor cost, heat generated during compression, round-trip losses, and the infrastructure required to manage that heat. Storage Drop describes a process in which water acts as the moving piston and heat-management medium, keeping compression closer to constant temperature and reducing dependence on conventional mechanical compressors. In the HyDrop architecture, the system uses high-pressure vessels and underground piping to store compressed air; on discharge, the air is released through an energy-conversion train that can drive a Pelton turbine for power generation. DropX packages the same hydraulic principle as a higher-efficiency industrial compressor. CoolDrop applies the company's liquid-piston and pressure-storage approach to cooling, charging during lower-cost periods and releasing stored refrigerant or cooling capacity when buildings, factories, data centers, or mobile refrigeration systems need it. The company states a target round-trip efficiency of about 70% for HyDrop and a system life of more than 30 years, but these remain company-reported performance claims rather than independently audited commercial guarantees. The architecture's engineering appeal is long life, use of air, water, and natural refrigerants, modularity, and avoidance of battery degradation; the engineering burden is pressure-vessel safety, cycle efficiency, site construction, controls, turbine performance, and reliable operation across changing temperature and load conditions.

**Market, customers, and go-to-market.** Storage Drop is pursuing a multi-segment B2B market in which the buyer values lifetime cost, reliability, and thermal or electrical continuity more than a compact consumer device. HyDrop's initial customers are renewable-energy producers and energy developers that need to shift generation into peak periods or firm output. DropX can target factories and process plants that pay for compressed air, where maintenance, electricity consumption, and uptime are material operating costs. CoolDrop targets buildings, industrial refrigeration, food processing, data centers, and mobile refrigeration, where the ability to charge cooling at night and use it during daytime peaks may reduce both energy bills and grid stress. The company's public project record gives the go-to-market strategy more specificity than a concept-only cleantech profile. It reports demonstration systems at Ashdod Port and in Rehovot, a commercial agreement related to a compressed-air facility at Tnuva's Alon Tavor site, and projects described as 2.3 MNIS and 2.5 MEURO in progress. The company has also described a Toyota pilot for electric-vehicle fast charging and a Horizon Europe cooling project involving the Technion, CNRS, and the University of Rovira i Virgili. The current path appears to be project-led sales, industrial partnerships, grants, and site-specific demonstrations rather than standardized mass-market hardware. That can create valuable reference sites, but it also exposes Storage Drop to long engineering, permitting, financing, and commissioning cycles.

**Traction, funding, and third-party validation.** Storage Drop's evidence base is stronger than an early laboratory venture but should be read with public-company caution. The company says it was established in 2020, completed a merger with a public shell in July 2021, and currently employs about 30 workers and service providers. Its 2024 investor presentation describes public-company status, approximately $7 million raised, 13 patent applications filed in Europe, the United States, and Israel, and exclusive rights to commercialize a patented technology developed in a US Department of Energy laboratory. Its official projects page lists a 100 kWh HyDrop demonstration at Ashdod Port and a 45 kWh CoolDrop demonstration in Rehovot. Independent Globes coverage reported that the Ashdod prototype had been completed and was moving toward operation, while the company's public materials document the Tnuva relationship and international research collaboration. A Google Patents record identifies Storage Drop Ltd. as the original assignee of an Israeli application for storing and recovering energy using liquid and gas as pistons. These are meaningful validation signals: a physical prototype, industrial sites, patent activity, grant-supported research, and a public-market disclosure trail. They do not establish bankable commercial scale. Public sources reviewed do not provide audited revenue, backlog, system availability, independently verified round-trip efficiency, long-duration operating data, or a production deployment at megawatt-hour scale.

**Team and company background.** Public material does not clearly identify the original founders as a separate group, so the record should not invent a founding-team narrative. The current leadership and governance information is more concrete. Storage Drop's official company page lists Shay Cohen as CEO, Zvika Even in capital markets and finance, Yona Fogel as vice chairman, and Gad Eisenkot as chairman. Eisenkot's involvement is strategically notable because he is a former Israel Defense Forces chief of staff and a former minister, but his board role should not be confused with proof of defense procurement or technical authorship. The company also lists José Barak in business development and presents a technical and commercial ecosystem around the Technion, Ashdod Port, Doral, the Oak Ridge National Laboratory, CNRS, and other research or industrial partners. That network is relevant to a hardware-heavy energy venture because project execution depends on mechanical engineering, pressure systems, thermodynamics, controls, construction, utility interconnection, and industrial sales. The counterpoint is organizational depth. A disclosed workforce of roughly 30 workers and service providers is small for simultaneous development of power storage, industrial compressors, and cooling systems. Diligence should map the actual in-house engineering team, rights acquired from the US DOE laboratory, patent ownership and prosecution status, manufacturing partners, safety engineering responsibility, and the degree to which project delivery depends on outside contractors.

**Competitive dynamics.** Storage Drop competes with several distinct incumbent approaches rather than one direct rival. **Hydrostor** and **Corre Energy** represent compressed-air energy-storage approaches that use large-scale underground or subsurface systems and have greater visibility in long-duration project development. **Brenmiller Energy** is an Israeli thermal-storage company using modular solid-media heat storage, and **Rondo Energy** uses high-temperature thermal batteries; both compete for industrial decarbonization and renewable-load-shifting budgets even though their storage media differ. **Highview Power** competes with liquid-air energy storage for long-duration electricity applications. **Trane and CALMAC-style ice-storage systems** compete with CoolDrop in commercial and industrial cooling, while lithium-ion battery systems from Tesla, Fluence, Wärtsilä, and integrators remain the default substitute for many short-duration power projects. Conventional electric compressors, chilled-water tanks, diesel generators, and demand-response contracts are also real alternatives. Storage Drop's possible edge is the combination of water-based isothermal compression, long operating life, modular installation, and a shared platform serving electricity, compressed air, and cooling. That combination could improve project economics where a site needs more than one service. It is not yet a proven moat: competitors have stronger bankability, procurement references, manufacturing scale, and independently validated performance. The decisive tests are installed cost, round-trip efficiency, response time, safety, maintenance burden, degradation, and revenue per square meter or per unit of stored energy.

**Defense, security, and resilience relevance.** Storage Drop's dual-use case is in energy continuity and logistics resilience, not in a disclosed weapons or military product. Military bases, hospitals, ports, food plants, telecom facilities, border sites, and emergency shelters all need power and temperature control when grids are constrained, fuel deliveries are disrupted, or peak electricity prices make continuous operation expensive. A long-life compressed-air or cooling-storage system could complement solar generation, microgrids, batteries, and generators at facilities that need many cycles over decades. CoolDrop is particularly relevant to food-security and medical logistics because cold-chain failure can destroy vaccines, biological materials, and perishable food even when the electrical load itself is modest. HyDrop and DropX could support industrial sites that need to keep air systems or critical processes running during interruptions. The company's own 2026 investor updates refer to equipment installation at a defense manufacturing facility in northern Israel, but the public source does not establish that the facility is a customer, that the deployment is military, or that the system has completed acceptance testing; the claim should remain a diligence lead rather than be promoted to a contract assertion. No public defense procurement, military base deployment, classified integration, cyber certification, or operation under attack conditions was found. Dual-use is therefore credible at the infrastructure layer: the same commercial systems can support resilient civil and defense-adjacent sites, subject to ruggedization, islanding controls, physical security, and customer validation.

**Growth stage, trajectory, and key diligence risks.** Storage Drop is best classified as mid-stage in organizational and public-market status but early in repeatable commercial scale. It has existed since 2020, became publicly traded through a shell merger in 2021, built named demonstrations, disclosed industrial and research collaborations, and reports a workforce and patent portfolio. At the same time, the available evidence still centers on prototypes, pilot-scale systems, grants, and projects under development rather than a large operating fleet or recurring product revenue. The credible trajectory is to convert the Ashdod, Rehovot, Tnuva, Toyota, and European collaborations into standardized modules, publish independently measured operating data, secure a commercial-scale renewable-storage reference, and prove that CoolDrop can win against simpler thermal-storage and HVAC alternatives. Key risks are: (1) thermodynamic and scale-up risk if laboratory efficiency does not survive pressure-vessel, piping, turbine, and controls losses; (2) project-finance risk because long-duration storage buyers demand bankable warranties and performance histories; (3) construction and safety risk in high-pressure equipment and underground infrastructure; (4) commercialization risk from selling three related products before any one has achieved repeatable volume; (5) capital-markets and liquidity risk associated with a small public company; (6) partner and IP risk involving exclusive rights, grants, subcontractors, and patent applications; and (7) demand risk if lithium-ion prices, grid rules, or alternative thermal technologies improve faster than Storage Drop's economics. The next diligence milestones should be a verified megawatt-hour-scale installation, independently measured efficiency and availability, disclosed commercial revenue, safety certification, and evidence that customers are buying systems rather than only participating in funded pilots.
"""
