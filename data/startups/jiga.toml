name = "Jiga"
description = "Jiga is an AI-enabled custom manufacturing sourcing platform that connects engineering and procurement teams with qualified suppliers while keeping quoting, communication, quality records, and delivery status visible. Its commercial focus is custom mechanical parts for hardware companies, including aerospace, defense, robotics, and industrial technology teams."

detailed_description = """
Jiga addresses the operational bottleneck between a finished engineering drawing and a manufacturable part. Customers upload drawings, specifications, and requirements; Jiga's workflow extracts relevant information, routes the request to appropriate manufacturers, organizes quotes and communications, and acts as the supplier of record. The company emphasizes human-reviewed quotes and direct communication with the manufacturing shop rather than a fully opaque instant-quote marketplace. Its advertised processes include CNC milling and turning, sheet-metal cutting and bending, injection molding, additive manufacturing, castings, forgings, and finishing, supporting both prototypes and production work.

The product combines software with a managed supplier network, which is important to the business model and to the diligence case. The platform is intended to structure information that normally lives in PDFs, emails, spreadsheets, inspection reports, certificates of conformance, and status calls. Jiga says its network includes shops with AS9100 and ISO 9001 credentials and ITAR-registered capabilities, and that customers can maintain approved suppliers or build longer-term relationships rather than having every order silently auctioned to a different vendor. Those claims describe a potentially valuable workflow and control layer, but they should be validated customer by customer and contract by contract; a marketplace's quality depends on actual supplier performance, not only on the software interface.

Public evidence indicates meaningful commercialization rather than an early product concept. Jiga's November 2025 financing announcement reported a $12 million Series A led by Aleph, with Symbol and Y Combinator participating, and said the platform was processing thousands of RFQs per month for aerospace, defense, robotics, and other advanced-hardware organizations. The company also states that it was already profitable and that it serves hundreds of companies, while its official site identifies NASA, Tesla, and Rivian among the organizations it says it helps. These are company-reported claims, not independently audited operating metrics. LinkedIn currently lists Jiga as a privately held 51–200 employee manufacturer headquartered in San Francisco, with a Tel Aviv location; the record should therefore not present Tel Aviv as the sole headquarters.

Jiga competes with Xometry, Protolabs, Fictiv, Hubs, traditional contract manufacturers, and internal sourcing teams. Its proposed edge is not that it owns manufacturing capacity, but that it combines a managed service, supplier transparency, technical coordination, and workflow automation. That positioning can be attractive for organizations whose parts are too complex or too consequential for an automated quote alone, but it also creates execution costs and exposes Jiga to service-quality and margin pressure. Larger platforms have greater supplier breadth, brand recognition, and automation budgets; incumbent contract manufacturers have deeper relationships and process knowledge. Jiga must show that its data, supplier relationships, quality operations, and repeat-order behavior create durable advantages beyond a polished procurement front end.

The dual-use case is credible but indirect. The same sourcing, qualification, documentation, and production-tracking capabilities serve commercial robotics, medical devices, industrial equipment, AI infrastructure, aerospace, and defense hardware. Faster access to qualified machine shops can improve resilience for programs that require small batches, rapid iteration, traceability, or allied manufacturing capacity. It does not make Jiga a defense-system developer, and public evidence in this record does not establish government contracts, classified work, or delivery of mission-critical components. Strategic relevance therefore comes from enabling the physical supply chain around dual-use programs, especially when procurement delay or supplier opacity is the constraint. Key diligence questions are customer concentration, gross margin after human service costs, supplier rejection and defect rates, repeat-order retention, geographic and export-control coverage, IP and drawing security, and whether reported RFQ volume converts into durable production revenue.
"""

