name = "Qubicalz"
description = "Qubicalz is an Israeli quantum-chemistry startup developing an NMR-based quantum simulation service for molecular binding-energy problems, especially metal-containing proteins that are difficult to model accurately with conventional computational chemistry. Its proposed workflow combines active-space chemistry, variational quantum eigensolvers, direct reduced-density-matrix measurement, and machine-learning calibration; performance and accuracy figures on its website remain company-reported and are not independently benchmarked in the public evidence reviewed."
detailed_description = """
**Product and the problem it targets.** Qubicalz is building a quantum simulation service for a sharply defined class of molecular-chemistry problems: predicting how strongly candidate molecules bind to proteins whose active sites contain transition-metal ions such as iron, copper, manganese, or cobalt. The company's website focuses on metalloproteins and the binding energies used to rank drug candidates, including kinase, cytochrome, and metalloprotease programs. This is a real computational bottleneck: electron correlation around metal centers can make classical electronic-structure calculations costly and sensitive to modeling choices, while medicinal-chemistry teams need reliable relative affinity estimates early enough to decide which compounds to synthesize and test. Qubicalz proposes to sell a quantum-computing layer through a service to pharmaceutical, biotechnology, and materials-science organizations rather than market a general-purpose quantum computer. The commercial promise is a more accurate or less expensive answer on selected hard molecules, not an established replacement for ordinary molecular-dynamics, docking, or quantum-chemistry pipelines.

**Technology and how the proposed workflow works.** The company describes a hybrid workflow beginning with Hartree-Fock and complete-active-space configuration interaction methods to construct a compact Hamiltonian for the chemically relevant portion of a protein binding site. It says a proprietary expansion step characterizes the site's electron-correlation signature, after which a variational quantum eigensolver (VQE) is used with nuclear magnetic resonance quantum hardware. Rather than reconstructing a large wavefunction from many measurements, the proposed system measures one- and two-electron reduced density matrices (1-RDM and 2-RDM) and uses those observables in downstream predictions. A machine-learning calibration layer, branded Q-QSAR on the website, is described as translating the quantum observables and experimental data into predicted binding affinity measures such as pKi, IC50, and binding energy. These are technically specific design choices, but the public material does not disclose the NMR processor, qubit count, circuit depth, noise level, dataset composition, calibration protocol, or error bars. The exact quantum contribution and the degree to which conventional computation performs the decisive work therefore remain diligence questions.

**Market, customers, and route to market.** The initial buyer is likely to be a pharmaceutical or biotechnology computational-chemistry group working on a target where metal coordination materially affects binding, or a contract research organization that can incorporate specialized calculations into discovery programs. Materials scientists studying transition-metal catalysts and energy-storage chemistry are a second market the company names. A plausible entry path is a paid feasibility project on a customer's known compounds, followed by evaluation against experimentally measured affinities and integration into existing cheminformatics workflows; that path is an inference from the product and target-customer descriptions, not a disclosed pricing or sales model. The company says its service is intended for on-demand use and invites pharmaceutical, materials, and research organizations to discuss projects, but the public sources reviewed disclose no named customer, formal design partner, paid pilot, contract value, revenue, or production integration. It will need to show that the output fits medicinal chemists' decision cycles and can be reproduced across targets, not only that a selected molecule can be simulated in a laboratory setting.

**Traction, financing, and external validation.** Qubicalz appears publicly as one of five Israeli quantum startups selected for the first Leap launchpad cohort run by Qubit-IL and the Harel-GUTS Innovation Hub. Qubit-IL's own program material says the cohort worked on customer definition, quantum-advantage claims, IP strategy, and business planning; a later community newsletter reports the cohort completed the program. These are meaningful ecosystem-selection and company-formation signals, but they are not technical validation or customer adoption. Qubicalz's website claims a turnaround of hours rather than weeks, roughly tenfold lower cost, and accuracy near chemical accuracy for its target cases. Those headline metrics are vendor claims: no benchmark paper, blinded comparison, public dataset, reproducible demonstration, or independent customer evaluation was located in the sources reviewed. The company gives a PCT patent-application number on its site, but a published application, assigned ownership, or granted patent could not be independently confirmed here. No equity round, grant amount, valuation, or named institutional investor was publicly disclosed in the sources used for this record.

**Founders and team.** The public-facing founder is Dr. Yoav Kimchy, whom Qubit-IL identifies as the Qubicalz participant in its quantum-computing hardware-and-software cohort. The company's own biography describes him as a physicist and entrepreneur with a bachelor's degree in physics and mathematics, a master's in NMR, a PhD in signal processing, and prior work building and funding medical-technology ventures. His LinkedIn profile lists Qubicalz Quantum Simulations Ltd. and Technion, while older patent records list him as an inventor on medical-device inventions; these support technical and company-building experience, but they do not establish expertise in quantum algorithms for molecular simulation. The website also lists Tom Sax as General Counsel and VP of Business Development and describes his background in litigation, company leadership, contracts, and sales, without naming prior employers or deals. No public roster of quantum physicists, computational chemists, software engineers, or scientific advisers was identified, so the depth and division of technical responsibilities are unknown. For a product whose credibility depends on chemistry, quantum hardware, statistics, and software integration at once, that team disclosure gap matters.

**Competition and potential edge.** Qubicalz competes with established classical chemistry software and services that are faster, cheaper, and integrated into pharmaceutical discovery today, including Schrödinger's molecular-modeling suite and open or academic packages such as ORCA. In quantum chemistry, Qedma focuses on error characterization and mitigation across quantum processors, while Algorithmiq develops quantum algorithms and applications for life sciences; these overlap in quantum-enabled chemistry ambitions but do not publicly describe the same NMR-based binding-affinity service. IBM Quantum and other hardware providers can also offer chemistry-oriented hybrid execution through their own systems and partner ecosystem. Qubicalz's proposed differentiation is application-specific: it combines an NMR quantum-computing approach, active-site Hamiltonian construction, density-matrix measurement, and a medicinal-chemistry-facing affinity estimate in one service. If the full workflow produces reliable, experimentally predictive results at useful cost, that focused interface could be more valuable to drug researchers than a general quantum programming environment. At present, however, no public comparative results establish an accuracy advantage, robust scaling, customer switching cost, or defensible proprietary dataset. Classical methods, more conventional hybrid quantum algorithms, and internal pharma research teams remain strong substitutes.

**Strategic relevance and dual-use assessment.** The strategic case is primarily deep-tech and biomedical rather than direct defense technology. Better estimates for metal-binding compounds could, if validated, help shorten research cycles for medicines and catalysts, supporting health resilience and industrial chemistry; the company also points to materials and energy-storage catalyst design. Quantum-computing capability is a strategically watched field, and Israeli participation in an early quantum-company ecosystem has value for technical talent and sovereign know-how. Those broader ecosystem arguments do not establish that Qubicalz has a defense customer or a security product. No military, intelligence, government, or critical-infrastructure deployment, classified workload, export-control program, or defense partnership is publicly documented. Because the core product is a chemistry simulation service aimed at pharmaceutical and materials research, this record sets dual_use=false. Possible defense relevance through future materials or drug research is adjacency only and should not be treated as fielded dual-use capability.

**Stage, trajectory, and diligence priorities.** Qubicalz is best classified as early-stage and R&D-stage: its own product narrative is detailed, it has a live company website and contact path, and it participated in an Israeli quantum startup launchpad, but the public record does not show a commercial product deployment, customer reference, financing round, independent performance paper, or confirmed patent publication. The key milestone is a reproducible head-to-head study on a clearly defined set of metal-containing protein targets, reporting experimental reference values, baselines, uncertainty, compute cost, and the role played by quantum hardware. Further diligence should establish which NMR device and external hardware providers are involved; the size and provenance of training and calibration datasets; whether predictions generalize to unseen targets; how measurement noise and error mitigation affect outcomes; what the patent filing actually claims and who owns it; and whether a pharma or materials customer has paid to use the system. The central opportunity is meaningful if the method improves an economically important chemistry workflow, but the current evidence remains founder-led and precommercial. Major risks are a quantum advantage that does not survive classical baselines, accuracy claims based on narrow or undisclosed cases, long pharmaceutical validation and procurement cycles, competition from established modeling platforms, dependence on hardware or academic partners, and a thinly disclosed technical team.
"""
