dual_use = true
dual_use_description = "Camtek's semiconductor inspection and metrology technology exhibits strong dual-use relevance spanning commercial and defense/national-security domains. In civilian semiconductor manufacturing, optical defect detection and AI-powered image analysis are essential for yield optimization, cost reduction, and product reliability. In defense electronics, the identical core technologies are critical for ensuring that semiconductors meet military qualification standards, detecting latent defects that could cause field failures in radar, communications, guidance, and electronic warfare systems where reliability and security are non-negotiable. Semiconductor supply chain integrity is explicitly recognized by US and allied governments as a national security priority; inspection and metrology systems that maintain and certify military-grade chip quality directly support this strategic objective. Camtek's position in advanced packaging and compound semiconductor inspection strengthens this dual-use profile, as these technologies power RF, power, and optoelectronic components used in defense applications."
