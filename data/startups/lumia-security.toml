dual_use_description = "AI usage control and governance have substantive dual-use applications. Commercial enterprises require visibility and policy enforcement over employee and agent interactions with AI to prevent data leakage, insider threats, and compliance violations. Defense and intelligence organizations face parallel challenges: protecting classified workflows from accidental or malicious exposure to uncontrolled external AI systems, controlling autonomous AI agents operating in sensitive domains (cyber operations, intelligence analysis, weapons systems integration), and detecting adversarial manipulation of AI-powered decision support. Lumia's network-layer approach—independent of model architecture or AI vendor—applies equally to civil and defense deployments. The core risk profile is asymmetric: commercial enterprises face reputational and regulatory risk; defense and intelligence organizations face operational security and national security risk. Both segments require trustworthy, auditable policy enforcement and real-time detection of policy violations."
