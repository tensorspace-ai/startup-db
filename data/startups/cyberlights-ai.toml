name = 'Cyberlights AI'
description = "SENAI (formerly Cyberlights AI) is an Israeli-founded AI company building online video intelligence (OVINT) software for government and enterprise users. Its multimodal platform analyzes publicly available online video, audio, text, and location signals to produce real-time, geo-specific intelligence for security incidents, influence activity, and crisis monitoring."
detailed_description = """SENAI is the current brand of the Israeli-founded startup previously represented in this record as Cyberlights AI. Its Israeli private-company name is SENAI Intelligence Solutions Ltd; its company site now uses SENAI and senai.io. The company was founded in late 2024 and has described its category as Online Video Intelligence (OVINT): analysis of public online video as a primary source of time-sensitive security information. It positions the product for intelligence, law-enforcement, and government users first, with enterprise use cases emerging alongside that core market.

The product proposition is to collect and analyze large volumes of publicly available video and connect the clips to what is happening, where it is happening, and who may be involved. The company describes a multimodal stack that uses computer vision, audio analysis, language processing, and geospatial inference. Company statements say the platform maps events in real time and helps analysts retain relevant evidence before source videos disappear. An interview with the co-founder says the platform supports analyst judgment and does not itself take automated response actions. This distinction matters: the retained record's prior description of SOC orchestration and automated incident response was not supported by the available company evidence and described a different cybersecurity product category.

SENAI's public deployment evidence is meaningful but bounded. In its February 2026 funding announcement, the company said it had operated in live environments with government agencies in Europe, Asia, and the Middle East and disclosed a deal with an unnamed U.S. enterprise customer. A contemporaneous Calcalist report described a European authority using the system during violent unrest to map events and preserve publicly posted clips; the reporting attributed these deployment details to the company. The agencies and enterprise buyer were not named, and no contract values, renewal data, usage volumes, or independently audited performance results were published. These are deployment and customer signals, not a basis for estimating revenue or inferring broad government procurement.

The disclosed financing is a $6.2 million seed round announced on February 4, 2026, led by 10D Ventures, with FS Ventures, 1948 Ventures, and strategic investors including Jonathan Kolber. No valuation or financing instrument detail beyond the announced seed round was reported. The round is a strong capitalization milestone for a young company, but the public record does not establish runway, burn, revenue, profitability, or valuation. One older Startup Nation Finder profile for the Cyberlights name displays an undated/undisclosed May 2025 pre-seed entry, but that page also carries stale and internally inconsistent metadata. I could not independently corroborate a separate 2025 financing event, so it is not counted as another round; funding history remains partial pending company or investor clarification.

The team has relevant national-security and intelligence positioning. The company identifies David Allouche-Levinsky as co-founder and CEO, Liam Weberman as co-founder and product leader, and Thomas Pariente as co-founder and CTO. Its launch materials described the founders as former intelligence professionals; earlier accelerator material said the founding team formed after first-hand difficulty processing large volumes of video during reserve service. Michel Berdah joined as chief revenue officer and partner before the seed announcement. Public biographies are thin, and the depth, dates, and specific roles behind the claimed intelligence backgrounds need verification in diligence. A July 2026 corporate-information mirror lists the three founders as directors, but does not disclose their ownership percentages. A separate listing labels CyberLights Inc as an option holder/shareholder with inconsistent terminology. The private cap table and any relationship between that entity and SENAI therefore remain unresolved.

Commercially, SENAI sits at the intersection of open-source intelligence, public-safety situational awareness, narrative monitoring, and multimodal analytics. Its near-term buyers are likely to be government intelligence and law-enforcement teams with authority to collect and review open online content, followed by corporate security, crisis, and risk teams. Government sales can support high-value deployments and durable workflows, but often involve lengthy security reviews, procurement constraints, data governance requirements, and customer confidentiality. Enterprise adoption broadens the market but exposes the company to established intelligence platforms and larger real-time event providers.

The competition is not limited to conventional cybersecurity vendors. Dataminr publicly markets real-time multimodal event, threat, and risk intelligence across public sources; Fivecast markets large-scale OSINT analysis of text, images, and video; Graphika analyzes online narratives, communities, and influence networks; and Palantir offers broad intelligence and data-analysis platforms. SENAI's stated focus on video as a primary signal and its claimed real-time geospatial synthesis may provide a narrower workflow advantage for video-heavy investigations. Those claims need direct comparative testing. No public benchmark establishes coverage, geolocation accuracy, duplicate handling, language support, false-positive rates, resilience to manipulated video, or analyst time saved relative to these alternatives.

The defensibility case is still developing. Potential advantages include accumulated video-specific data and labeling, operational workflows shaped by government users, temporal and geospatial linkages across clips, and the ability to preserve context around fast-moving events. None of the research reviewed located a patent portfolio or public patent filing assigned to SENAI or the former Cyberlights name. The product may instead rely on software, data access, integration know-how, and trade secrets. Its dependence on public platform availability and platform terms creates technical and legal exposure; the company says it does not bypass technical protections, but those operational claims and retention practices warrant review. Synthetic-media detection is another area where the company says it combines visual, audio, metadata, and behavioral signals while acknowledging that perfect detection is not currently available.

Dual-use applicability is substantive: government and security customers use the platform for public-safety events, national-security awareness, and influence activity, while the company has disclosed at least one U.S. enterprise customer deal and described corporate crisis management and risk monitoring as enterprise applications. This is not cyber defense or autonomous response. The same public-video analysis could support lawful emergency response and enterprise risk work, but could also enable intrusive monitoring, political profiling, or repression. Customer screening, permitted-use controls, audit logs, human review, source restrictions, and jurisdictional safeguards are central diligence areas. The company's public statements describe public-content-only operation and human-led judgment; independent technical and contractual evidence is not public.

Investment view should therefore be treated as a legacy internal prioritization signal rather than a recommendation. The seed round and live deployments raise the profile relative to the earlier record, while the rebrand, customer confidentiality, lack of public financial metrics, unverified comparative performance, unsettled cap-table detail, and sensitive surveillance use cases keep execution and governance risk high. Diligence should establish which legal entity contracts with customers, reconcile the 2025 funding database entry, verify customer references and contract status, review data collection and platform compliance, and test representative multilingual video cases against established OSINT and event-intelligence tools."""
