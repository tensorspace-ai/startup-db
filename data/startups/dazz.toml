name = "Dazz"

# One-line summary
description = "Dazz built a unified security-remediation platform that correlated code, cloud, application, and infrastructure findings and routed prioritized fixes into engineering workflows; Wiz acquired the company in 2024."

# Multi-paragraph, evidence-calibrated description
detailed_description = """
Dazz built a remediation layer for cloud-native security rather than another standalone detection sensor. Its platform connected findings from code-scanning, cloud-security, vulnerability-management, and infrastructure tools, then correlated duplicates and related exposures so security teams could focus on root causes instead of alert volume. Wiz described the acquired technology as an industry-leading remediation engine with advanced mapping from cloud context to source-code fixes. That positioning is materially more specific than generic posture management: the product's value was in linking an observed risk to an owner, affected component, and practical remediation path.

The primary customer problem was operational. Enterprises can identify large numbers of vulnerabilities and misconfigurations but still struggle to decide which issue matters, who should fix it, and whether the fix actually closed the exposure. Dazz addressed that gap through prioritization, contextual mapping, developer-oriented guidance, workflow integrations, and remediation tracking. The commercial buyer set therefore sat across security operations, application-security, cloud-platform, and engineering leadership. Public company material described support for code, cloud, applications, and infrastructure, while a 2024 CrowdStrike partnership showed that the product could be embedded in a larger cloud-security ecosystem and used to provide actionable code-fix guidance.

Before acquisition, reported traction was substantial for a young enterprise-security vendor, though it is historical company-reported evidence rather than a current standalone metric. In July 2024 Dazz said revenue had grown roughly 400% year over year; contemporary reporting listed enterprise customers including BHG Financial, Healthfirst, TaxSlayer, Incomm Payments, Dexcom, iCapital, and Abnormal Security, and reported about 125 employees across the United States, Europe, and Israel. By November 2024, TechCrunch reported Dazz's own statement that it had around 100 organizations as customers, ARR in the tens of millions, and 500% growth. These figures differ in period, metric wording, and precision, so they should not be combined into a single growth series. They do establish enterprise adoption claims but do not disclose audited revenue, retention, contract size, gross margin, or post-acquisition Dazz-specific performance. Customer names and deployments should be treated as reported company relationships; public material does not establish that every named organization had a production-wide deployment.

The competitive field included full CNAPP suites such as Wiz and Palo Alto Networks Prisma Cloud, exposure-management and cloud-security vendors such as Orca Security and Tenable, and developer-security platforms such as Snyk. Dazz's edge was workflow depth and cross-source remediation context, not ownership of a unique cloud telemetry layer. That distinction matters: the product could improve the conversion of security findings into completed engineering work, but it remained exposed to platform vendors bundling similar capabilities, to customers preferring existing ticketing and CI/CD controls, and to the difficulty of proving that automated recommendations are safe across heterogeneous production estates. Public evidence supports real market traction and ecosystem interest, but does not establish a durable standalone category monopoly.

Wiz announced the acquisition on November 21, 2024. TechCrunch reported a cash-and-share transaction value of $450 million based on sources familiar with the deal; Wiz's announcement did not disclose financial terms. Greylock now classifies Dazz as acquired, and Wiz's August 2025 product announcement explicitly identifies Unified Vulnerability Management as derived from its Dazz acquisition. That confirms product integration, not preservation of a separately purchasable Dazz business. In March 2026, Wiz announced that it had officially become a Google company. Dazz's product capability therefore sits within the Wiz business now owned by Google; Dazz itself is not an independent current startup. The 2024 acquisition price is a reported transaction value, not a disclosed amount paid to any individual shareholder or an independently verified cash/stock allocation.

The national-security relevance is credible but bounded. Faster, auditable remediation can reduce exploitable exposure in defense contractors, government suppliers, and critical-infrastructure environments that operate complex cloud and software-delivery estates. The same capabilities support cyber resilience, configuration hardening, vulnerability prioritization, and evidence for control verification. There is no public evidence in the reviewed sources of a dedicated defense product, government contract, military deployment, or government certification, so the dual-use case should be treated as transferable cybersecurity infrastructure rather than defense-specific technology. Product evidence also shows an IP base: a Dazz-assigned patent application published in Canada describes contextual alert enrichment and remediation. One patent record does not prove broad freedom to operate, enforceability, or a durable moat, especially after acquisition and integration.

The strategic lesson is strongest as a case study in code-to-cloud exposure management and cybersecurity consolidation. The core diligence question is how much of Dazz's differentiated workflow survives inside Wiz Exposure Management, and whether that functionality measurably improves remediation time and exposure closure for customers. Further diligence would require product-level customer evidence, attribution of post-acquisition roadmap and usage, the complete patent family and assignments, and clarification of the transaction's final terms. The former standalone company disclosed a total of $110 million raised in its 2024 financing announcement; investor-reported early round labels differ, while the available press accounts support a $10 million seed and a $50 million Series A in 2021, followed by $50 million in 2024. A small secondary component was separately mentioned by Calcalist and is not treated as primary financing here.
"""

