name = "Enzymit"
description = "Enzymit is an Israeli synthetic biology startup developing AI-designed enzymes and cell-free manufacturing processes for high-value biomolecules. Its commercial proof point is pilot-scale, enzyme-only production of multi-kilogram hyaluronic acid with Dutch partner Cosun; commercial supply, revenue, and unit economics remain undisclosed."
detailed_description = """Enzymit Ltd. is a privately held synthetic-biology company founded in 2020 and currently based in Rehovot, Israel. It develops computational methods for designing enzymes and pairs them with laboratory screening, pathway engineering, and cell-free production processes. The company is aiming at a manufacturing platform rather than a single molecule: the same design and process capabilities are intended to produce biochemicals, food and nutrition ingredients, personal-care materials, and health-related biomolecules.

Its technical proposition is to replace some fermentation or conventional chemical routes with selected enzymes acting outside living production cells. Enzymit describes a design-build-test-learn workflow using computational protein design, deep learning, high-throughput DNA assembly, and experimental screening. That approach may make unusual reaction pathways, product profiles, or operating conditions accessible where natural enzymes or whole-cell organisms are poor fits. The company also describes enzyme immobilization, cascade design, enzyme production, reactor design, and downstream processing as parts of the platform. These are company-described capabilities; public material does not provide an independently audited end-to-end cost comparison against incumbent processes.

There is a meaningful scientific basis for the design work. A 2024 peer-reviewed PNAS paper by Enzymit-affiliated authors presented CoSaNN, a deep-learning-assisted approach for changing enzyme conformations, and SolvIT, a graph neural network for predicting protein solubility. In the reported research set, 54% of designed variants expressed in E. coli and more than 30% had higher thermal stability than their templates. These are research results on selected proteins, not production yield or economic evidence across the commercial platform. The company also publishes a web-based protein-stabilization tool and a public SolvIT repository, while describing core design methods as proprietary. No company-assigned patent family or licensing position was established in this review.

Hyaluronic acid (HA) is its clearest route to market. Enzymit reported that its cell-free process produced HA at a 200-liter pilot scale with multi-kilogram output in collaboration with Dutch cooperative Cosun in November 2025. The company says the enzyme-only process can set HA molecular size through process settings; this is potentially valuable because HA buyers specify molecular profiles for distinct cosmetic and medical uses. The demonstration was conducted with partner infrastructure and is a pilot, not evidence of routine commercial supply, regulatory clearance, repeatable customer orders, or revenue. In June 2025, NIZO separately announced that it had helped Enzymit scale production of enzymes needed for its manufacturing platform at a food-grade pilot facility. This reduces one technical uncertainty while leaving the economics and repeatability of finished-product production open.

Enzymit's financing record includes an undisclosed 2020 pre-seed reported by Startup Nation Finder, a 2022 seed round whose amount is inconsistent across public records, an Innovation Authority grant recorded without an official public amount, and a $10 million Series A announced in September 2024. The seed company release states $5 million, while the legacy Finder record gives $5.5 million; because the latter amount has no located primary announcement, this dossier preserves both observations and withholds a single numeric seed amount. No company-announced lifetime funding total, valuation, revenue, or runway was found. The Series A supported progression toward pilot operations, but the public evidence does not show how much capital remains or whether the company has since raised additional financing.

The product strategy appears to combine custom enzyme design and process development with eventual ingredient production or technology partnerships. Customer qualification will be demanding: a manufacturer must validate purity, batch consistency, cost, supply continuity, process integration, regulatory documentation, and freedom to operate. Cell-free reactions avoid some complexity of maintaining living cells, but they still require reliable enzyme supply, suitable substrates and cofactors, efficient separation, and stable performance across scale. The 200-liter HA pilot is an important step beyond laboratory proof, yet scale-up to contracted, repeatable industrial volumes and attractive costs is the decisive next test."""
