name = "SecuredTouch"
description = "SecuredTouch was an Israeli cybersecurity company that developed behavioral-biometrics, bot-detection, and adaptive fraud-prevention technology for digital customer journeys. Ping Identity acquired the company in June 2021, so it is now best treated as an acquired technology asset rather than an independent startup."
detailed_description = """SecuredTouch built a real-time fraud and identity-risk platform around behavioral biometrics and machine learning. Its software profiled how a person interacted with a mobile app or web property, including touch and typing dynamics, navigation and session behavior, device characteristics, and signals associated with automation or emulation. The objective was not merely to authenticate at login, but to evaluate risk throughout the customer journey and identify account takeover, bots, payment abuse, and other anomalous activity early enough to permit a proportionate response. This passive approach was intended to reduce dependence on passwords, SMS challenges, CAPTCHAs, and repeated step-up prompts that can increase abandonment and frustrate legitimate users.

The commercial buyer was typically a digital-service operator with meaningful fraud exposure and a need to preserve conversion: financial institutions, card issuers, e-commerce businesses, and other mobile or web services. Public descriptions and customer material point to use cases including account-takeover detection, payment and no-transaction fraud, bot mitigation, emulator detection, and abuse of refunds, referrals, coupons, or loyalty programs. A 2016 Elron filing described SecuredTouch as developing real-time identity verification for mobile apps based on user behavior, while later company material emphasized adaptive fraud detection across the broader customer journey. That progression is commercially important: behavioral signals can be valuable before a transaction, not only as a binary authentication control after a suspicious event.

The technology entered a crowded category alongside behavioral-biometrics specialists, device-intelligence providers, bot-management vendors, and fraud platforms. Its differentiation was the combination of mobile interaction signals, passive continuous verification, behavioral anomaly scoring, and detection of automated or emulated activity in one customer-facing workflow. Public references to deployments and integrations provide evidence of market validation, but the available record does not establish current standalone revenue, retention, scale, or a durable post-acquisition product brand. Ping Identity announced the acquisition in June 2021 and said SecuredTouch would be integrated with PingOne to extend identity products with fraud, bot, emulator, and account-takeover intelligence. A Ping SEC filing reported a total purchase price of approximately $39.7 million, net of cash and a working-capital adjustment; that is a historical transaction fact, not evidence of current independent operations.

The national-security relevance is credible but bounded. The same capabilities could support continuous risk assessment for privileged portals, remote access, insider-threat triage, contractor or partner access, and detection of scripted attacks against government services. Behavioral biometrics may add a useful signal when a credential is valid but the interaction pattern is inconsistent with the established user. However, the strongest product-market fit was commercial fraud prevention, where large volumes of natural behavior enable calibration. Defense environments may have smaller populations, more constrained interfaces, stronger privacy and legal requirements, and higher consequences for false positives. There is no reliable public evidence here of classified deployments, defense contracts, or defense-specific certifications. SecuredTouch therefore illustrates a commercially originated identity-security technology with meaningful defense adjacency, not a defense-native platform."""
