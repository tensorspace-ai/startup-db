name = "BioFishency"
description = """BioFishency Ltd. was an Israeli aquaculture equipment company founded in 2013. It sold modular biological filtration and electro-chemical water-treatment products for land-based fish farms and recirculating aquaculture systems. The company reported a $2.4 million financing in 2019 and historical sales and deployments, but public records now report that it ceased operations and entered court-supervised liquidation in January 2026."""
detailed_description = """BioFishency Ltd. was founded in Israel in 2013 to sell water-treatment equipment to land-based fish farms, pond operators, and recirculating aquaculture system (RAS) integrators. Its commercial premise was specific: make a compact water-treatment package usable by small and medium-sized farms that could not justify a large, custom-built recirculation facility, while also giving established farms a retrofit path to improve water quality and reduce water exchange. The business was B2B equipment and turnkey-project sales. Public evidence does not establish a recurring software, consumables, or service-revenue base.

The historical portfolio covered distinct process designs. The SPB Single Pass BioFilter combined mechanical solids removal with biological treatment, carbon-dioxide stripping, and oxygenation in a packaged unit; company and trade descriptions emphasized installation into existing infrastructure and relatively simple operation. BioFishency also marketed Mini-RAS turnkey systems, while Trendlines reported development of an e-Fish cold-water product line under a Technion licence. The later ELX platform used an electrochemical process: company descriptions say it oxidized ammonia, disinfected water, and targeted the earthy off-flavor compounds MIB and geosmin. These products should not be collapsed into one technology claim. The SPB's core offer was a compact mechanical-biological filter; ELX's proposition was electrochemical treatment, including ammonia conversion and off-flavor removal.

The customer economics were plausible but demanding. Better treatment can support higher stocking density, reduce make-up water and effluent, and protect harvest quality. Those benefits matter where water is scarce, discharge is regulated, farms are remote, or fish acquire undesirable flavors before sale. A 2019 trade article described indicative prices of $10,000–$20,000 for an SPB unit and Mini-RAS systems starting near $70,000, along with approximately 36 customers across several countries. The same article attributes those customer and price details to company representatives, so they are historical reported figures rather than audited sales evidence. The company announced over $1.3 million in 2018 sales, while Trendlines' 2018 annual report rounded that to approximately $1.3 million and stated its portfolio data were supplied by the company. Neither source provides later revenue, gross margin, cash conversion, repeat-purchase rates, or service income.

There is meaningful but bounded technical evidence. Trendlines reported systems or installations in India, Bangladesh, Indonesia, China, Congo, Nigeria, and Israel. Its 2020 account describes an RAS-180 commercial demonstration with EFAN at Pinghu Agricultural Park in China, where treated discharge was reused to irrigate aquaponic crops. Its 2024 annual report presents three Chinese case studies with claimed water-use, water-cost, or yield improvements; those are investor-published customer examples, not independently audited longitudinal trials. A related peer-reviewed Water Research paper by Technion and University of Maryland Baltimore County researchers describes an electrolysis concept and laboratory and pilot-plant work: in rainbow trout, MIB and geosmin in water were removed in about seven days and fish tissue fell below taste-and-odor thresholds within at most 11 days under the tested conditions. Its abstract does not identify BioFishency or ELX, so it supports a related treatment mechanism and pilot result rather than direct product validation. It does not establish full-scale reliability across farms, species, salinity, loading, water chemistry, by-products, fish health, energy cost, or commercial warranty performance.

Patent records add a defensibility signal without resolving asset value. A mechanical-biological filter family with a 2013 priority date names Jacob Levanon and Igal Magen as inventors and BioFishency Ltd. as assignee; public records show grants in the United States, Europe, China, and Israel, among other national filings. The granted claims describe a co-located mechanical filter and biological filter with a carbon-dioxide stripper and nitrification bed. Patent databases warn that their current legal-status fields are assumptions. The company's reported court liquidation makes title, licence rights, fees, encumbrances, and any trustee sale or transfer especially material; no post-liquidation chain of title was found.

BioFishency sat between component vendors and full RAS integrators. Its proposed edge was modular installation and an integrated process package at a lower entry price than a complete farm build, with ELX adding a product-quality argument around off-flavors. A 2024 review of electrochemical RAS treatment names BioFishency, Apria Systems, and Natural Shrimp as commercial vendors using ammonia electrooxidation at that time, while distinguishing the shrimp focus and commercial-scale facility claims of Natural Shrimp. AquaMaof and AKVA group are broader system-level alternatives: their public portfolios span complete land-based RAS projects and water-treatment auxiliaries. Operators can also buy standard filtration, biofilters, oxygenation, and disinfection separately or engineer systems in-house. No public matched test establishes a BioFishency advantage in lifecycle cost, uptime, energy, fish survival, maintenance burden, or water quality against these substitutes.

The founding team combined aquaculture and engineering experience. Trade coverage identifies Igal Magen as a former head of aquaculture at Israel's Ministry of Agriculture and Cobi Levanon as a marine biologist. Later company material identifies Michael Isakov as CEO and Magen as CTO; the undated IIA profile still lists Magen as CEO, so role timing matters. The 2023 appointment of RAS operator and investor Ohad Maiman as chairman added sector experience, but none of these historical credentials establishes a team or operating capacity after closure.

Public ecosystem and Israeli registry-directory records report that BioFishency ceased operating and entered court liquidation in January 2026. That status dominates the current assessment: the company is a historical Israeli water-and-food-production technology asset, not an active startup. Commercial aquaculture contributes to civilian food supply and water resilience, but the reviewed sources disclose no military customer, defense procurement, security mission, or deployment for contested logistics. Any residual strategic value depends on whether a successor, liquidator, or buyer can verify and lawfully control the patents, equipment, customer relationships, and service obligations."""
