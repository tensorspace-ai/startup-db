name = "Hear"
description = "Israeli enterprise software startup building AI conversation intelligence and monitoring for customer contact centers."
detailed_description = """Hear is the operating brand of Intune Communication Ltd, an Israeli B2B software company based in Tel Aviv. Founded in 2023 according to the company, it sells an AI-based platform for customer contact-center operations. The initial product proposition was to analyze recorded customer calls with machine learning and natural-language processing so supervisors could find repeated issues, customer intent and coaching needs that sampled call reviews miss. Current company materials describe a wider interaction-intelligence layer across voice, chat, email and tickets, with quality assurance, compliance checks, agent coaching, churn and sales signals, and operational actions.

The product is positioned to work alongside an organization’s current contact-center and CRM systems. Hear and investor materials describe analysis of conversations from multiple vendors and usage-based SaaS pricing, with modules for QA, compliance, sales intelligence, coaching and operations. A newer product page presents monitoring of customer-facing AI agents as an adjacent use: the company says it evaluates more than 60 behavior signals, including grounding failures, prompt injection, data leakage, policy adherence and task completion. These are product claims, not independently tested benchmarks. The public material does not explain the model architecture, evaluation corpus, error rates, latency guarantees or how much model behavior is proprietary.

The customer problem is concrete: contact centers generate a high volume of sensitive interactions, while manual quality review covers only a sample and legacy analytics often report after the event. Hear aims to turn those interactions into decisions for service leaders, compliance teams and sales managers. Company-published testimonials identify MedicalCor, Cellcom, Shift and Crocus; a Crocus and Primrose story claims full call coverage, a 94% reduction in QA time and eightfold coaching efficiency. Joule Ventures separately reports 25-plus customer logos, more than two million interactions processed, nine million voice minutes analyzed and 40,000-plus automated actions. These figures have not been independently audited, and a logo, reference or investor-reported metric does not by itself establish a paid production deployment.

The firm’s current status is active: its official site published product and research updates during 2026 and continues to offer the platform. Company terms name Intune Communication Ltd as the Israeli legal operator of Hear.ai. The founders are Noam Fine, CEO, and Yossi Marouani, CTO. Both have built communication and AI businesses together over roughly fifteen years; their previous ventures included Sensiya and Over.ai, which the company says were acquired by i.am+ and Vonage respectively. Those transactions belong to the founders’ prior companies, not to Hear."""
