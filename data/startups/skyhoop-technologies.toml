name = "SkyHoop Technologies"
description = "SkyHoop Technologies is an Israeli defense-software startup developing edge computer-vision software that turns existing optical cameras and mobile devices into real-time UAV detection nodes. Its stated value proposition is portable, offline-capable airspace awareness without proprietary sensing hardware."
detailed_description = """
SkyHoop is building a software-defined counter-UAS detection layer rather than a complete interceptor or dedicated sensor suite. The company says its AI can process video from smartphones, rugged tablets, body-worn cameras, vehicle-mounted optics, CCTV networks, and UAV payloads. The intended output is a live track with detection, classification, and operator-facing threat information. The official site advertises sub-100-millisecond detection and classification, 97%+ classification accuracy, bearing and altitude estimation, and continuous tracking; these are company-reported performance claims, not independently published test results.

The architecture is designed for constrained deployments. SkyHoop emphasizes local inference, low power consumption, no cloud dependency, and operation in offline, air-gapped, or denied-comms environments. That positioning matters because a camera retrofit can be operationally simpler than adding radar, RF sensors, or a proprietary electro-optical package to every protected site. The product is presented as an integration layer for existing command-and-control systems, with API connectivity and effector cueing as possible workflows. The defensible technical challenge is not merely detecting a drone in a clean demonstration; it is maintaining useful precision on low-power hardware across changing lenses, fields of view, weather, lighting, terrain, clutter, and adversarial flight behavior.

The immediate customer context is broad but procurement-intensive. Potential users include military bases, dismounted units, vehicle and convoy crews, border and perimeter teams, airports, ports, utilities, embassies, and other critical-infrastructure operators. Civilian applications provide a credible second market because the same visual detection function can support restricted-airspace monitoring and site security, although regulatory, privacy, and liability requirements differ by jurisdiction. A retrofit and OEM-partnership model could shorten pilots when a customer already owns cameras, but scaling still requires device support, installation and calibration processes, alert-management software, data security, and a clear answer to who acts on a detection.

Competitive pressure comes from dedicated multi-sensor and counter-UAS vendors as well as software substitutes. Dedrone by Axon, DroneShield, Sentrycs, Robin Radar Systems, and MyDefence cover parts of the detection, identification, tracking, or mitigation market, often with RF, radar, acoustic, or electro-optical components and broader system offerings. Generic video-analytics platforms can also compete for fixed-site budgets. SkyHoop's possible edge is a lower-cost, hardware-agnostic deployment footprint: if accuracy remains reliable on ordinary cameras and low-power devices, it may reach distributed users that cannot justify a dedicated sensor installation. That edge is not yet a demonstrated moat; model quality, labeled data, deployment tooling, and integration know-how will determine whether the approach is harder to replicate than its headline software suggests.

Public evidence supports an early-stage company with a focused product narrative, a Tel Aviv base, and active technical recruiting. LinkedIn lists the company as privately held, founded in 2025, and in the 2-10 employee range; another public profile gives a similar small-company and alpha-stage picture. A public company job listing describes the system as edge-based, low-power optical detection and refers to a recent military pilot, but the asserted zero-false-positive and zero-missed-detection result is self-reported and should be treated as a diligence lead rather than validated traction. No customer names, contract values, audited benchmark, certification, or disclosed financing amount is established here. The central diligence questions are therefore field-test design, performance by target size and range, false-alarm rates, generalization across sensors and environments, data rights, integration references, and evidence of repeatable procurement.

Strategically, SkyHoop is relevant to the dual-use thesis because its core capability is useful in both military force protection and civilian airspace or site security, while its edge/offline design addresses real operational constraints. It does not by itself provide neutralization, so the company should not be credited with an end-to-end counter-UAS capability. Its upside depends on becoming a trusted detection component inside larger defense, security, vehicle, or autonomy stacks. The opportunity is meaningful, but the evidence base remains early and the record should be revisited as independent evaluations, paid deployments, and customer or partner disclosures emerge.
"""
