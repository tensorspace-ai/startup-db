investible = false
investment_rationale = "DFSL is no longer an independent startup opportunity: BiomX acquired 60% of its voting equity in April 2026, while the founder retains 40%. The acquisition makes parent-level funding and governance relevant, but not equivalent to a standalone venture round. DFSL’s audited 2025 revenue was only $292,000, including a one-time $140,000 exclusive Metro Software distribution-right payment; it recorded a $119,000 net loss and derived all 2025 revenue from one customer. The auditor expressed substantial doubt about going concern, and DFSL reported $5,000 cash at December 31, 2025. A $100,000 related-party credit line was provided in Q1 2026. Strategically the sensor and intellectual property may be useful, but valuation, repeat demand, customer diversification, production economics, and post-acquisition execution require close diligence."
strategic_value = "DFSL supplies a physical detection layer that could complement BiomX and Zorronet’s analysis and command-and-control products. Its LADAR sensors provide local range and target tracks for perimeter, low-airspace and transport applications, potentially reducing dependence on camera-only monitoring. Reported deployments and longstanding product development give the asset operational history, while the audited record shows that commercialization remains small and concentrated. The strategic thesis therefore depends on verified customer retention, integration with other portfolio products, and a path to profitable repeat deployments."

