name = "PointGrab"
description = "PointGrab develops CogniPoint, a privacy-oriented occupancy sensing system that combines edge AI sensors with cloud management and APIs for real-time workplace, building, and space-utilization data. Its commercial value is the conversion of anonymous presence, movement, object, and traffic signals into inputs for facilities, energy, workplace, and sustainability operations."
detailed_description = """
PointGrab's core product is the CogniPoint family of ceiling-mounted sensors and the associated PointGrab Cloud Management System. The company describes the sensors as optical edge-AI devices with additional sensing modalities such as PIR, performing inference on the device and exporting occupancy metadata rather than images or video. The product can provide people counts, presence and movement within defined areas, traffic-line counts, object detection, and stitched coverage across multiple sensors. A software-agnostic REST API and management layer are intended to route this data into workplace-management, booking, building-management, analytics, and enterprise data systems. This is a meaningful technical proposition where customers need desk-, room-, or zone-level information but do not want conventional camera footage transmitted to a cloud service.

The primary market is commercial real estate and intelligent-building operations. Facility and workplace teams can use the data to understand actual space utilization, improve room and desk booking, tune HVAC and lighting schedules, plan cleaning, support employee experience, and document sustainability or ESG activity. The value proposition is strongest in large offices, campuses, healthcare and mixed-use properties where aggregate occupancy patterns can influence operating costs and portfolio decisions. PointGrab's current website identifies Planon and Metrikus among integrations, and its public case-study and partner material indicates a channel-led enterprise motion. The company claims more than 30,000 sensors shipped and more than 180 customers in a 2024 product sheet; an EMV Capital 2025 annual report gives different deployment and customer figures, so those metrics should be treated as company- or investor-reported rather than independently audited traction.

Competition is broad and includes low-cost PIR, thermal, radar, CO2, Wi-Fi/BLE, badge, and booking-system substitutes as well as specialist spatial-intelligence vendors and building-automation platforms. PointGrab's edge is not simply people counting: it is the combination of optical granularity, on-device processing, multi-modal sensing, flexible coverage, and a software-agnostic data layer. That combination can reduce the privacy and lock-in objections that affect camera and Wi-Fi approaches, while potentially reducing the number of devices needed relative to simple presence sensors. The trade-offs are higher hardware and installation complexity than basic sensors, the need for careful ceiling placement and calibration, and the risk that larger building-technology vendors bundle adequate occupancy features into broader contracts.

Commercial evidence is stronger than an early prototype story: PointGrab has operated since 2008, describes CogniPoint as a production product, publishes active product, integration, security, and support pages, and reports deployments with large enterprise organizations. However, public sources do not establish current revenue, gross margin, renewal rates, customer concentration, cash runway, or the precise terms and date of any Series B. The company appears to be a small, privately held operating startup rather than a public or acquired entity, but employee counts and reported deployment totals vary by source and require management confirmation in diligence.

The national-security case is credible but secondary. Anonymous occupancy and movement data can support base and facility energy management, logistics-space utilization, queue or flow monitoring, and non-biometric anomaly detection when integrated with access-control or alarm systems. It does not provide identity, facial recognition, or a complete security picture, and no public source reviewed here establishes defense procurement or military deployment. Defense adoption would therefore require evidence of offline operation, cyber and supply-chain controls, environmental and electromagnetic qualification, secure update processes, installation in austere sites, and a tested integration path. The near-term strategic relevance is best framed as dual-use building and critical-facility sensing, not as a defense-native platform.
"""
