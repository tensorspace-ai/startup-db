name = "Focal Medical Technology"
description = "Israeli medical-device startup developing APOLLO, a robotic, image-guided electroporation platform for focal prostate cancer treatment."
detailed_description = """Focal Medical Technology Ltd. is a privately held Israeli medical-device company founded in 2022 and based in Or Yehuda. Its APOLLO system is being developed for image-guided focal ablation of prostate cancer. The company describes a minimally invasive robotic workflow that combines MRI-fusion inputs, an ultrasound probe, a real-time grid for electrode placement, non-thermal electroporation, and immediate assessment of the treated area. Peregrine Ventures' portfolio description adds that APOLLO is intended to be operator-independent. These are product descriptions and company claims; the public evidence reviewed here does not establish clinical performance, clearance, or routine clinical use.

The technical concept joins lesion localization and treatment delivery in one procedure. A separate patent application describes electrical-impedance measurements across groups of electrodes to map tissue and guide ablation; a later PCT application describes image-guided positioning of transperineal stylets for electroporation. The filings provide evidence of an active design and patenting program, not evidence that the device has been clinically validated or that any application has been granted. The Israel Innovation Authority lists the company at the R&D stage and identifies hospitals and healthcare providers as target customers. No named hospital customer, paid deployment, or clinical partner was confirmed in the public sources reviewed.

The company is distinct from the North Carolina Focal Medical, Inc., formerly Advanced Chemotherapy Technologies, which Continuity Biosciences acquired in 2025. That U.S. company's platform delivered chemotherapy into tumors by iontophoresis and was built from University of North Carolina research. The Israeli company's legal name, registry number, Or Yehuda address, APOLLO product, founders, and investor are separately documented by its own website, the Israel Innovation Authority, and Peregrine Ventures. It is also distinct from EDAP TMS's Focal One product, a commercial HIFU system for prostate tissue ablation.

Focal's commercial model is not disclosed beyond B2B development for hospitals and providers. Hardware pricing, single-use components, service revenue, leasing, reimbursement plans, regulatory route, and procurement evidence remain unknown. The company has received Israeli public-sector support and private venture backing, but public trackers disagree on its lifetime funding and on the value of a reported 2026 follow-on. Its investor and government pages also retain older executive listings, while the current company page names co-founder Adrian Paz as CEO. Those differences are preserved below rather than treated as settled financing or personnel facts."""
