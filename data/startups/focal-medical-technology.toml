  "For the May 2026 follow-on, Startup Nation Finder reports USD 66.7K while CB Insights reports USD 60K. Both sourced observations are retained under seed-2026-may.amount_observations; the numeric amount field is omitted.",
  "The initial seed event is dated June 2022 by Startup Nation Finder and StartupIM, while IVC lists July 2022. The round date is recorded only as 2022 pending a first-party announcement.",
  "The 2024 seed extension is dated August by Startup Nation Finder and September by IVC. It is recorded at year precision until a first-party event date is located.",
  "Leadership is inconsistent across sources. The current company about page lists Adrian Paz as co-founder and CEO; IIA, IVC, Peregrine, and older company-page snapshots list Maoz Handelman as CEO and Paz as CMO. The record uses the current official site for the current title and preserves Maoz as a previously listed executive without assigning a transition date.",
  "Name and acquisition collision: the Continuity Biosciences 2025 acquisition was Focal Medical, Inc. of North Carolina, formerly Advanced Chemotherapy Technologies, with an iontophoresis chemotherapy platform. Buyer and independent North Carolina sources distinguish it from Israeli FOCAL MEDICAL TECHNOLOGY LTD and APOLLO; no acquisition of the Israeli company was verified."
]
diligence_questions = [
  "What is APOLLO's current development stage and evidence package: benchtop, animal, cadaver, first-in-human, or registered clinical work? Please provide protocols, endpoints, adverse events, and an independent comparison against existing focal therapies.",
  "Who currently serves as CEO, CTO, CMO, and board chair? What changed between the current website's Adrian Paz CEO listing and older IIA, IVC, and Peregrine listings naming Maoz Handelman CEO?",
  "What amount of the 2022 financing was private equity versus IIA support, and what are the exact dates, instruments, amounts, and investors for each 2024, 2025, and 2026 event? What is the current cash runway and fully diluted ownership table?",
  "What are the intended indications and regulatory routes in Israel, the United States, and Europe, including whether APOLLO requires a De Novo, 510(k), or other pathway and what clinical evidence regulators will expect?",
  "How does APOLLO register MRI lesions to ultrasound, control electrode depth and geometry, detect untreated tissue, and validate margins? What are targeting error, repeatability, procedure time, and safety results across operators?",
  "Which hospitals or urologists have evaluated APOLLO, under what agreements, and what are the expected capital-equipment, disposable, service, training, and reimbursement economics?",
  "What is the status and ownership of the US, PCT, Israeli, European, and other patent applications, and has counsel completed a freedom-to-operate review against HIFU, IRE, and image-guided electrode-array systems?"
]
