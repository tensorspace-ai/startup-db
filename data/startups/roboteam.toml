name = "Roboteam"
description = "Roboteam is an Israeli defense-robotics company that designs rugged unmanned ground vehicles, operator controllers, and Roboteam HUB command-and-control software for defense, security, public-safety, and hazardous-environment missions. It is now a wholly owned Ondas Autonomous Systems asset following Ondas's December 2025 acquisition."
detailed_description = """
Roboteam develops a family of tactical unmanned ground vehicles (UGVs), including the lightweight RT-20 (MTGR), throwable RT-2 (IRIS), RT-200 (TIGR), RT-1000 (PROBOT), and RT-2000 (ROOK), together with rugged operator-control equipment and fleet software. The product proposition is practical rather than consumer-oriented: give a small team remote eyes, mobility, manipulation, and payload capacity in places that are dangerous, confined, contaminated, or exposed to hostile fire. Product pages describe capabilities such as day/night video, encrypted communications, stair climbing, modular manipulators, autonomous navigation, and open or interoperable control.

The newer Roboteam HUB broadens the company from a collection of robots into a command-and-control layer for mixed fleets. Roboteam describes HUB as software that can connect ground and aerial robots, sensors, and third-party platforms through a common operational interface, with mission planning, automation, real-time monitoring, and AI-assisted analysis. That architecture is strategically important because users increasingly want to coordinate heterogeneous autonomous systems rather than buy another isolated vehicle. The technical diligence question is how much of the autonomy and interoperability is demonstrated in production deployments, versus represented as a product direction on the refreshed website.

The customer and market context is unusually demanding. Defense, law-enforcement, and public-safety buyers evaluate ruggedization, communications resilience, payload integration, training, maintenance, exportability, and lifecycle support alongside autonomy. Procurement is tender-driven and slow, and platform sales can be lumpy. Roboteam's official materials identify Petah Tikva, Israel, and its LinkedIn company profile lists 51–200 employees. Ondas reported that Roboteam platforms had been sold in more than 30 countries, that hundreds of UGVs had been sold over the company's history, and that the portfolio was used for EOD, ISR, route clearance, logistics, and urban operations. Those are meaningful commercialization signals, although they are company statements and should be checked against contracts, revenue concentration, backlog, and customer references.

Competitive pressure comes from established defense primes and specialist UGV vendors, including Milrem Robotics, Teledyne FLIR Defense, QinetiQ, Rheinmetall, and Ghost Robotics, as well as customer-built systems and substitute aerial or stationary sensors. Roboteam's likely edge is field-oriented integration: compact systems, a broad product family, operator workflows, and a deployed support footprint rather than a uniquely defensible algorithm. The acquisition gives Ondas a ground-robotics component that can be combined with aerial systems, counter-UAS, wireless connectivity, and other autonomy assets, but it also creates integration, governance, and portfolio-prioritization questions.

Roboteam has credible national-security relevance because UGVs can reduce personnel exposure during EOD, reconnaissance, route clearance, perimeter security, CBRN/HAZMAT response, and tactical resupply. The same capabilities have narrower but credible civilian applications in disaster response, industrial inspection, emergency access, and critical-infrastructure security. Since Ondas acquired 100% of Robo-Team Holdings Ltd. for approximately $81.7 million in December 2025, the record should be treated as an acquired operating capability rather than an independent startup financing opportunity. The key diligence priorities are post-acquisition retention, product-line economics, recurring support revenue, export controls, communications performance in contested environments, cybersecurity, and evidence that HUB delivers measurable multi-robot mission value.
"""
