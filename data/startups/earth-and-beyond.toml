name = "Earth & Beyond Ventures"
description = "Israeli early-stage venture capital fund, venture studio, and incubator investing in deep-tech and SpaceTech companies from venture creation through pre-seed and seed. Its thesis spans space, sensors, optics and photonics, quantum, advanced materials, semiconductors, energy, and related enabling technologies."
detailed_description = """Earth & Beyond Ventures is an investment and company-building platform, not a standalone geospatial-intelligence software vendor. Its official website describes an early-stage fund that invests in Israeli DeepTech from concept to creation, while also operating venture-studio and entrepreneur-in-residence activities. The published focus includes SpaceTech, optics and photonics, quantum technologies, RF technologies, materials and chemistry, computer science and processing, semiconductors, engineering and electronics, ClimateTech, and new energy. That breadth makes the fund relevant to a startup database tracking the Israeli dual-use ecosystem, but it also means the record should not attribute a single product, sensor, AI model, or defense capability to the fund itself.

The commercial model is a portfolio model: source technical founders and research-derived opportunities, provide early capital and operational support, and help move technically difficult ideas toward investable companies and commercial markets. The website says it works with startups as early as venture creation, pre-seed, and seed, and its public team includes general partners, a CTO, finance and portfolio-management personnel, venture partners, and associates. The Israel Innovation Authority lists Earth & Beyond Ventures, Limited Partnership in connection with a 2024 new technological incubator program. A 2023 Globes report described the fund as launching with commitments of $125 million and targeting Israeli deep-tech, aerospace, and satellite-engineering startups; that historical report is a useful scale signal, but the current record should not infer current assets under management, deployment pace, or portfolio performance from it.

The fund's market position is differentiated by specialization and hands-on formation rather than by proprietary production technology. It competes for founders and institutional capital with Israeli deep-tech investors and incubators such as OurCrowd, Grove Ventures, Chartered Group, Terra Venture Partners, and the Israel Innovation Authority's broader incubator network. In SpaceTech and frontier hardware it also faces specialist global investors and strategic programs. Its potential advantages are access to Israeli technical deal flow, an explicit willingness to engage before conventional venture milestones, and an operating model that combines financing with company creation and portfolio services. Those advantages remain hypotheses until supported by disclosed investments, follow-on outcomes, founder references, and evidence of repeatable commercialization.

The defense and national-security relevance is indirect but credible at the platform level. Space systems, RF and sensing, photonics, semiconductors, advanced materials, autonomy, and high-performance processing can underpin military communications, ISR, navigation, resilient infrastructure, and other security applications, while also serving civilian markets. The fund's public materials emphasize dual-purpose space and terrestrial applications and identify deep-tech domains with clear strategic overlap. That does not establish that every portfolio company is defense-related, that Earth & Beyond Ventures itself holds classified capabilities, or that any government customer has adopted a portfolio technology. The appropriate diligence question is therefore portfolio-specific: which companies have validated commercial products, authorized security applications, export-control exposure, and credible pathways to allied procurement?

Public evidence supports an active private fund with a visible website, LinkedIn presence, named team, public sector/incubator connection, and ongoing ecosystem activity. It does not fully establish current fund size, realized returns, portfolio concentration, ownership stakes, or the status of every historical portfolio listing. The record should be treated as a strategic ecosystem and investor reference, with medium risk driven by early-stage portfolio uncertainty, private-fund opacity, and the long commercialization cycles typical of frontier hardware and space technology."""
