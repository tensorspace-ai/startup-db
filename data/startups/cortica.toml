name = "Cortica"
description = "Cortica Technologies Ltd. is an Israeli private deep-tech company developing Autonomous AI for machine perception and building domain-focused businesses around it. Its stated technology thesis combines unsupervised learning, adaptive architectures, and efficient processing across visual, audio, radar, and time-series signals."
detailed_description = """Cortica is a platform-oriented AI company rather than a single-application software vendor. Founded in 2007, it describes its Autonomous AI as a brain-inspired approach to machine perception that uses generic representations, adaptive processing, and self-learning to reduce dependence on manually labelled data. The company says it has invested more than $250 million over 15 years and built a portfolio protected by more than 300 patents; those are company-reported figures and should be diligence-checked against the relevant patent entities and ownership structure. Cortica's public portfolio page names QualiSense for industrial quality inspection, Autobrains for automotive perception, Corsight for facial intelligence, SeeTrue for airport security screening, CORDiguide for image guidance in cardiovascular procedures, and Corsound for voice biometrics. This portfolio model is the central fact about the business: Cortica aims to turn a common perception technology base into separate products with industry-specific commercialization and partners.

The technical proposition is meaningful if it performs outside controlled training conditions. Cortica emphasizes representations that index and compress signals, scenario-focused resource allocation, adaptation in changing environments, and operation on relatively low-compute platforms. Its stated generic architecture spans vision, audio, radar, time series, and related sensor inputs, although public material does not provide enough independent benchmark data to establish superiority over modern supervised, self-supervised, or foundation-model approaches. The practical value proposition is lower labelling and redeployment cost when environments drift: an inspection line changes, a vehicle encounters new scenes, or a screening system must process high throughput. The main diligence question is whether the claimed transferability is a repeatable product advantage or primarily a research narrative that still requires substantial domain-specific data, integration, and customer tuning.

Cortica operates in several difficult markets with different buying cycles and proof standards. Industrial inspection can reward measurable reductions in false rejects, downtime, and manual review; automotive perception requires safety engineering, long validation cycles, and deep OEM or Tier 1 integration; airport screening and facial intelligence require interoperability, privacy controls, procurement credibility, and evidence under adverse conditions; medical image guidance adds clinical workflow and regulatory requirements. Cortica's site and public company profiles show a long operating history, a private-company Series D classification, and continued portfolio activity, but they do not disclose current revenue, retention, unit economics, or the share of value retained by the parent versus portfolio companies. The 51-200 employee range is consistent with LinkedIn's company profile, while the exact current headcount is not independently confirmed.

The dual-use case is credible because the underlying capabilities—perception in degraded conditions, anomaly or threat detection, biometrics, autonomous mobility, and edge-efficient inference—can support commercial safety as well as security, critical-infrastructure, and defense workflows. Cortica's public portfolio descriptions include security screening and facial intelligence, and Corsight describes government and law-enforcement applications; those facts demonstrate adjacency, not proof that Cortica itself holds military contracts or that every portfolio product is suitable for defense deployment. Strategic relevance therefore rests on technical transferability, Israeli AI talent and IP depth, and the possibility of adapting perception systems to sovereign or mission-specific environments. Diligence should separately test export controls, privacy and human-rights governance, robustness, auditability, cyber hardening, and the legal separation of portfolio-company assets. The strongest investment-case signal is a differentiated platform with multiple routes to commercialization; the strongest counter-signal is execution complexity across sectors where distribution, certification, and trust matter as much as model quality."""
