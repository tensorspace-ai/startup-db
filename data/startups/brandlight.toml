name = "Brandlight"
description = "Israeli-founded enterprise AI marketing software that measures and helps improve how brands appear in generative search and AI answer engines."
detailed_description = """Brandlight is an enterprise marketing technology company founded in Israel in 2024 and incorporated as BRANDLIGHT AI LTD. Its current public profile lists New York as headquarters, while its Israeli legal address and open applied-AI, data, product, and engineering roles establish a substantial Tel Aviv operating and R&D footprint. The company sells a business-to-business platform and strategic support to marketing teams that want to understand how ChatGPT, Gemini, Perplexity, Google AI Overviews, and other answer engines mention, rank, cite, and characterize their brands.

The public product description covers prompt and answer monitoring, mentions and citation analysis, sentiment and share-of-voice reporting, competitor comparisons, and attribution to outside publishers and content sources. Brandlight then recommends changes to owned content, technical discoverability, publisher relations, social activity, and partnership strategy. The company positions the offering as an operating program with AI strategists and customer support as well as software, serving organizations that manage multiple products, geographies, languages, and brands. Its product pages describe visibility, content optimization, source attribution, partnership intelligence, technical analysis, enterprise reporting, and impact tracking. In February 2026 the company announced that it was extending the platform toward AI advertising and agentic commerce; current company materials label these as new modules, but public sources do not establish how broadly they are deployed or whether they have separate customer revenue.

This is a monitoring and marketing-action product, not a foundation-model company. Its technical work appears to combine repeated prompts or answer observations, text and citation processing, entity and competitor mapping, scoring, and workflow recommendations. The company says its system processes very large volumes of AI-generated data, but those figures are company assertions and are not independently audited. A customer can use the service to see what an answer engine says about a product, which outside sources are associated with the answer, and which marketing or technical changes Brandlight recommends. The central unresolved product question is whether its measurements are repeatable across model versions, locations, prompts, and collection methods, and whether changes in a score translate to qualified traffic, sales, or brand lift.

The company emerged from stealth in April 2025 with a reported $5.75 million pre-seed and announced a $30 million Series A in February 2026. CTech reported a rounded cumulative $36 million after the Series A. A September 2026 CTech profile says the company serves more than 100 enterprise customers and has more than 50 employees; these are reported company metrics, not audited customer or revenue data. Publicly named brands include Kimberly-Clark, LG, The Hartford, and Estée Lauder, while a company research page gives a specific Kimberly-Clark result. Neither the coverage nor the partnership announcements disclose contract values, paid-versus-trial composition, renewal rates, customer concentration, or attributable revenue.

Brandlight operates in a quickly forming category where established search-software vendors, focused AI-visibility startups, agencies, and general-purpose analytics products can overlap. Its strongest stated distinction is its enterprise and service-led approach: combine measurement with content, technical, publisher, and partnership recommendations, and prepare for ads and commerce as AI platforms change. That positioning may suit a global CMO who needs help coordinating several functions. It is less clearly differentiated for buyers who only need inexpensive prompt tracking, or who require independently validated measurement and direct conversion attribution. No public patent portfolio, published revenue figure, valuation from a financing round, cap table, or defense use was found in this review."""
