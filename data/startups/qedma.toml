name = "Qedma"
description = "Qedma is an Israeli quantum-software startup that develops QESEM, a characterization, error-suppression, and error-mitigation layer for extracting more reliable results from noisy quantum processors. Its cross-platform and IBM Qiskit integrations position it as infrastructure for quantum algorithm developers rather than as a quantum-computer hardware vendor."
detailed_description = """Qedma develops software for a fundamental constraint of present-day quantum computing: physical and calibration noise makes useful circuits difficult to execute and makes measured results difficult to trust. Its main product, QESEM (Quantum Error Suppression and Error Mitigation), combines noisy-QPU characterization, noise-aware transpilation and gate optimization with suppression during execution and quasi-probabilistic or otherwise unbiased mitigation in post-processing. Qedma's documentation describes a workflow in which users provide circuits, observables, a target statistical accuracy, and a selected QPU; the service can estimate the required QPU time before execution. That is a concrete developer-facing product surface, not merely a research claim about error correction.

The commercial proposition is to improve the useful circuit volume and accuracy available from current machines without requiring customers to wait for large-scale fault-tolerant hardware. QESEM is available through Qedma's own SaaS and can be installed on premises, which is relevant to research organizations and regulated or sensitive environments that cannot send workloads to a public cloud. Qedma is also present in IBM's Qiskit Functions catalog, where IBM describes the function as using proprietary characterization protocols plus error suppression and mitigation. The company's site identifies IBM and Quantinuum among its ecosystem relationships and reports continuing work across multiple hardware platforms. These integrations provide stronger commercialization evidence than an isolated academic prototype, while still not establishing recurring revenue, customer concentration, or production-scale quantum advantage.

The market remains early and technically contested. Qedma competes with specialist error-mitigation and control vendors such as Q-CTRL, Riverlane, and Algorithmiq, while IBM and other hardware providers can internalize parts of the reliability stack. Open-source Qiskit tooling, hardware-specific compiler features, and in-house research teams are meaningful substitutes. Qedma's potential edge is a focused, hardware-agnostic reliability layer that can be consumed through an established quantum platform or deployed privately. Its 2025 Series A, reported at $26 million and involving Glilot Capital, TPY Capital, Korea Investment Partners, and IBM, is a meaningful financing and strategic-validation signal; it is not proof that the category has reached repeatable enterprise demand.

Strategically, the company has credible dual-use adjacency because better quantum-circuit reliability can support civilian chemistry, materials, optimization, and physics research as well as government or defense laboratories studying quantum algorithms. The on-premises option and the team's stated background in Israeli technology units may matter for sensitive R&D, but public sources do not establish defense customers, classified deployments, cryptanalytic capability, or a government contract. The appropriate thesis is therefore enabling infrastructure for a strategically important computing stack, not a demonstrated defense product. Key diligence questions are benchmark reproducibility across hardware generations, QPU-time and classical-compute overhead, the durability of unbiased estimates at larger circuit volumes, conversion of platform integrations into paid usage, and whether fault-tolerant hardware eventually reduces the addressable need for standalone mitigation software."""
