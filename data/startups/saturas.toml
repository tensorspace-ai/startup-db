name = "Saturas"
description = "Saturas is an Israeli precision-agriculture startup developing InTree and StemSense systems that embed miniature sensors in the trunks of trees, vines, and plants to measure stem water potential continuously. The resulting plant-level signal helps growers schedule irrigation more precisely, protect yield and quality, and reduce water, energy, and fertilizer waste."
detailed_description = """
**Product and the concrete problem it solves.** Saturas addresses a basic weakness in irrigation management: growers commonly infer plant water needs from soil moisture, weather, or visual inspection, even though the plant's own water status is the most direct signal of stress. The company's InTree and StemSense systems are designed to measure stem water potential, or SWP, inside the plant and turn that reading into an irrigation decision. SWP is widely used by agronomists as a sensitive indicator of crop water status, but the traditional pressure-chamber method is manual, labor-intensive, and difficult to use continuously across a commercial orchard or vineyard. Saturas' proposition is to replace occasional sampling with a small number of permanently installed sensors, remote telemetry, and decision support. The operational outcome is specific: irrigate at the right time and in the right quantity, avoid both yield-damaging stress and wasteful overwatering, and give farm managers a repeatable measurement for decisions that otherwise depend on walking blocks or interpreting indirect variables. The problem is strategically important in water-constrained agriculture because water, pumping energy, fertilizer runoff, and crop quality are tightly connected.

**Core technology and how it works.** The sensor is embedded into the trunk or stem and placed in direct contact with the plant's water-transport tissue, rather than sitting in soil or measuring an external proxy. The European Commission's CORDIS reporting describes a miniature SWP sensor, a communication system, and associated software that automatically collects the data and sends processed readings to a central automated irrigation-control system. The company has described the sensor as an online pressure-bomb analogue: it seeks the same plant-tissue signal as the established manual method while making the measurement continuous and remotely accessible. In the reported StemSense project, Saturas miniaturized the system for a wider range of plants, tested its embedding technique on peach and citrus trees, and found continuous measurements consistent with manual measurement tools. The commercial communications path has included low-power LoRa networking through Kerlink stations, enabling solar-powered field gateways and private IoT coverage. The technical stack therefore includes tissue-contact sensing, low-power field communications, data logging, signal processing, and a decision-support layer. The difficult engineering is not just sensor fabrication: installation must avoid harming the plant, readings must remain stable as trees grow, calibration must transfer across cultivars and climates, and the system must remain reliable despite weather, agricultural work, connectivity gaps, and maintenance constraints.

**Market, customers, and go-to-market.** Saturas sells into high-value permanent crops where the economics of water timing and fruit quality can justify specialized instrumentation. Publicly documented target contexts include citrus, apples, almonds, peaches, vineyards, and other tree and vine crops. The commercial buyer can be a large grower, an orchard or vineyard manager, an agronomist, an irrigation dealer, or an irrigation-equipment company seeking a plant-level decision layer. The go-to-market model has sensibly combined direct field trials with channel and strategic partners. Saturas completed trials with Netafim in Israel and NaanDanJain in Spain, and the 2018 financing announcement also identified Spanish winemaker Miguel Torres Winery and Israeli farm Ramat Magshimim among the participants or associated ecosystem. The 2020 Trendlines announcement said the company had expanded sales and operations through an active California subsidiary and into Europe, South America, and China. This footprint suggests that the product was intended to scale through agricultural partners and regional deployments rather than through a purely direct software motion. Adoption friction remains material: sensors need installation in living plants, the recommendation must fit existing irrigation controllers and agronomic routines, and growers need evidence that savings and crop outcomes exceed hardware, gateway, service, and support costs.

**Traction, funding, and third-party validation.** Saturas was founded in 2013 in the Trendlines Agrifood incubator. Trendlines described it as a revenue-stage company when its Agrifood Fund invested in May 2020 alongside Gefen Capital and Hubei Forbon Technology, and stated that the company was operating in the United States, Europe, South America, and China. Earlier reporting from CTech documented a $4 million investment round in 2018, with participation from Hubei Forbon, Miguel Torres Winery, and Ramat Magshimim. Kerlink reported in 2020 that Saturas had raised approximately $9 million including a €1.5 million European Commission Horizon 2020 grant. These amounts are historical public disclosures, not evidence of current cash, valuation, revenue, or a later financing round. External validation is stronger than a laboratory-only claim: the EU project record documents field trials in Israel, Spain, and California; a California Fresh Fruit Magazine case study reports sensors installed in citrus orchards in Spain, Israel, and China and describes correlations with irrigation changes and manual pressure-chamber measurements; and a later academic study identifies Saturas' sensor as one of the commercially available embedded SWP systems evaluated in California almond orchards. The public evidence supports real field use and technical relevance, while leaving current commercial scale and customer retention to diligence.

**Founders and team background.** The public record identifies Anat Halgoa Solomon as Saturas' co-founder and CEO, and the company's public LinkedIn profile identifies Natan Barak, Orly Farkash, Ori Avitan, and Carmit Mizrahi among its employees. LinkedIn places the headquarters in Migdal HaEmeq, Israel, reports a public employee range of 11-50, and lists a California location in Rancho Cordova. The company therefore appears to combine Israeli product development with a US operating presence close to major orchard markets. The public sources reviewed do not provide a complete founder biography, engineering headcount, patent schedule, or current organization chart, so those facts should not be inferred. What is visible is a team and company history long enough to move from incubator formation through sensor miniaturization, EU-supported development, international trials, a California subsidiary, and revenue-stage commercialization. The team challenge is equally clear: success depends on multidisciplinary execution across plant physiology, microsensors, low-power IoT, agronomy, manufacturing quality, and farm-channel sales. A small company can be technically differentiated while still struggling with installation capacity, agronomic support, and long enterprise procurement cycles.

**Competitive dynamics.** Saturas competes with several distinct approaches rather than one identical product. Phytech combines plant and hydraulic monitoring with irrigation recommendations and major irrigation-company integrations. SupPlant uses plant, soil, weather, and agronomic data, including sensor and sensor-less workflows, to guide irrigation. CropX focuses heavily on soil sensing and farm-level irrigation analytics, while FloraPulse offers continuous plant-water-status sensing through microtensiometer technology. METER Group and other instrumentation vendors provide soil and plant water-monitoring tools used by researchers and growers, and manual pressure chambers remain the established reference method for SWP measurement. Saturas' potential edge is that its sensor directly measures a plant-tissue variable, can use only one or two sensors per hectare according to the EU project description, and can feed remote, automated irrigation decisions without requiring frequent manual sampling. Its history of trials with Netafim, NaanDanJain, commercial farms, and research facilities is a useful channel and validation asset. The moat is not guaranteed: competitors may offer easier installation, richer whole-farm analytics, stronger distribution, or lower-cost proxy measurements that are sufficiently accurate for many growers.

**Defense, security, and resilience dual-use relevance.** Saturas is not a defense contractor, and the reviewed sources do not establish military customers, security contracts, or defense-specific certifications. Its dual-use relevance is instead rooted in water and food resilience, which are strategic infrastructure concerns. The core capability is a distributed sensing and decision layer for maintaining agricultural output while water becomes more scarce, expensive, or disrupted. The same operating pattern could support protected food-production sites, emergency agricultural planning, drought response, or remote farms where agronomists cannot visit frequently. More precise irrigation can preserve crop yield within fixed water allotments, reduce pumping energy, limit nutrient-rich runoff, and enable productive use of marginal or climate-stressed land. Those are credible resilience benefits, but they should not be inflated into a battlefield capability: Saturas does not publicly claim ruggedized defense deployment, contested-network operation, classified data handling, or autonomous control of critical water infrastructure. Strategic diligence should ask whether the system can function during connectivity interruptions, whether local irrigation policies fail safely, how data and device security are handled, and whether the supply chain for sensors and gateways can support deployments in regions where food security is the mission.

**Growth stage, trajectory, and key diligence risks.** Saturas is best classified as mid-stage: it is a 2013-founded private company with a named product, historical revenue-stage status, international field deployments, a US subsidiary, external grant support, and a public employee range of 11-50, but its current revenue, installed base, and financing status are not disclosed. The trajectory is attractive if the company converts a technically strong signal into a repeatable irrigation workflow that growers trust across crops and geographies. The most important diligence points are: (1) current paid deployment count, renewal and expansion rates, and revenue by geography; (2) installation time, sensor survival, replacement rates, and total cost per hectare; (3) independent measurement of water savings, yield, fruit size, sugar content, and pumping-energy reduction against control blocks; (4) accuracy and calibration across cultivars, rootstocks, soil types, and climate zones; (5) integration depth with irrigation controllers and channel partners; and (6) current patent ownership, manufacturing capacity, cybersecurity, and working-capital needs. Additional risks include a long agricultural sales cycle, grower resistance to embedding hardware in valuable trees, competition from proxy sensors and broad farm platforms, weather-driven seasonality, and the possibility that customers use the data diagnostically without buying automated-control services. Saturas is therefore a strategically relevant Israeli deep-tech record with credible field evidence and resilience value, but its investment and procurement case depends on refreshed commercial and technical data rather than historical funding headlines.
"""
