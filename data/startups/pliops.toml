name = "Pliops"
description = "Pliops develops hardware- and software-accelerated data infrastructure for NVMe storage, databases, and AI systems. Its XDP platform offloads key-value, compression, protection, and storage-management work, while LightningAI adds a disaggregated, persistent memory tier for LLM inference and other data-intensive workloads."
detailed_description = """
Pliops is an Israeli semiconductor and data-infrastructure company founded in 2017. Its core product family is the Extreme Data Processor (XDP), a PCIe accelerator that presents standard block and key-value interfaces while moving storage-management and data-path functions away from host CPUs. Public product material describes XDP capabilities including inline compression, SSD-aware data protection, rapid rebuilds, high-density NVMe management, and APIs or integrations for workloads such as MySQL, MongoDB, Cassandra, RocksDB, and analytics. The architectural proposition is to make commodity flash more usable by reducing software overhead, improving usable capacity, and preserving performance during protection and rebuild operations.

Pliops is now positioning the same acceleration foundation for AI infrastructure through LightningAI and related XDP-PRO products. The public architecture describes a scale-out networked storage tier with RDMA, NVMe media, a key-value interface, and a GPU-initiated path for moving LLM key-value cache out of scarce high-bandwidth memory. It also describes support for vLLM, vector search, retrieval-augmented generation, and persistent long-term LLM memory. These are credible responses to a current infrastructure constraint: model serving can be limited by memory capacity, data movement, and I/O rather than by arithmetic throughput alone. The commercial question is whether the added servers, cards, software integration, and operational complexity deliver a better total cost and latency profile than larger GPU footprints, local memory, or increasingly capable storage and caching software.

The target market spans enterprise data centers, cloud and managed-service providers, storage and server integrators, and operators of database, analytics, and AI platforms. Pliops reports a broad technology-partner ecosystem and publishes customer or partner material, including a Paperspace test of XDP-RAIDplus with Solidigm QLC NVMe SSDs. Those materials provide useful evidence that the products are engineered for deployable server environments, but many performance figures are vendor- or test-configuration claims and should not be generalized without workload-level benchmarking. Public evidence also does not establish revenue, customer concentration, renewal rates, gross margins, or the scale of production deployments. The 2022 Series D announcement documented $100 million in that round and more than $200 million raised in total; it is a meaningful financing signal, but not proof of current operating momentum.

Strategically, Pliops matters as enabling infrastructure rather than as a defense product. Faster, denser, and more resilient data paths can support secure analytics, cyber telemetry processing, sensor-data repositories, geospatial or imagery pipelines, and inference systems operating in constrained or sovereign facilities. That is a substantive dual-use adjacency because the underlying capabilities are general-purpose and relevant to high-throughput mission data, but no public evidence reviewed here demonstrates a defense contract, accreditation, or operational military deployment. Diligence should therefore test export-control and supply-chain exposure, secure deployment options, software support in restricted environments, reproducibility of AI benchmarks, and whether the company can sustain a hardware-enabled sales and support model against much larger platform vendors.
"""
