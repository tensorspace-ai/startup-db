name = "Filter Art"
description = "Filter Art is an Israeli water-technology company that designs and manufactures automatic self-cleaning fine screen filters for agricultural, municipal, and industrial water streams. Its systems physically remove suspended solids and selected biological threats from irrigation and reuse water, with published configurations beginning at 7-micron absolute filtration."
detailed_description = """**Product and problem.** Filter Art addresses a practical bottleneck between raw, reused, or recirculated water and the equipment or crops that depend on it: fine particulates, organic matter, and some larger biological contaminants can foul emitters, damage downstream equipment, spread crop pathogens, or force operators to replace disposable cartridges and interrupt a process for cleaning. The company develops self-cleaning screen filtration packages for greenhouse and soilless agriculture, open-field irrigation, drainage-water reuse, municipal water systems, and selected industrial processes. Its NEMATIC offering applies customized screens to irrigation water where growers seek to physically separate nematodes and other targeted threats before reuse or distribution. The device is a filtration stage, not a stand-alone potable-water purifier or universal pathogen-kill system; its brochure specifically pairs physical separation with disinfection for pathogen-control applications. That distinction matters when assessing water safety claims and integration requirements.

**How the technology works.** The core product is an automated screen filter: incoming water passes through a fine stainless-steel mesh with a large filtration area, while retained solids accumulate on the screen. A cleaning cycle flushes the screen surface so the unit can return to filtration without routine manual element replacement. Filter Art says its mechanism is patented and describes a 7-micron absolute screen capability, with alternative screen degrees available. Its product page lists MINIART, MIDIART, and MEGAART models, automatic cleaning, low-pressure operation, 316L stainless-steel screens, optional remote monitoring, and flow configurations that depend on water quality and model. The company publishes capacities from tens to hundreds of cubic metres per hour, with modular multi-unit configurations available for higher demand. A 2025 brochure gives model-specific flow, electrical, pressure, temperature, and flush-cycle figures, and states that cleaning consumes 0.1%–6% of water depending on application. These are vendor-published specifications, not independently audited guarantees; field performance will vary with solids loading, screen selection, and upstream process conditions.

**Markets, buyers, and route to market.** The company has a focused B2B hardware proposition. In agriculture, likely buyers and decision-makers include greenhouse operators, hydroponic and soilless growers, irrigation-system integrators, and agricultural water-treatment contractors. Filtration of drainage streams can support recirculation, while screening on irrigation lines can protect equipment and help limit the movement of selected organisms; crop protection still depends on the complete water-management and disinfection protocol. In industry, the company positions filters for process-water pretreatment, equipment protection, and reuse applications, including sectors where downtime or consumable-filter replacement is costly. Municipal and wastewater-reuse applications widen the addressable market but also bring more formal tendering, validation, and service requirements. Filter Art presents its systems as customized to the customer's water quality and process objective, suggesting a consultative equipment sale with engineering and installation rather than a simple standardized online product. Public materials do not disclose channel economics, typical contract size, recurring service revenue, or named end customers.

**Commercial evidence and external validation.** Filter Art's official pages show an active product catalogue, application-specific material, and a sales and technical team, while its Spanish-language site says more than 42 units have been installed in Africa and Latin America. That installed-unit figure is a company statement; the public page does not identify sites, dates, uptime, or customer references, so it should be treated as a lead for diligence rather than independently confirmed traction. The 2025 Israel Water Directory published by the Ohio-Israel Ag & CleanTech Initiative independently includes Filter Art among Israeli water suppliers and describes automatic self-cleaning screen filters for agricultural and municipal systems, irrigation networks, wastewater reuse, and industrial process water. Public company intelligence lists the business as founded in 2014, with 1–10 employees and undisclosed funding; no verifiable financing round or revenue figure was located. The record therefore supports an operating niche supplier with products and a claimed international installed base, but not a venture-scale growth trajectory or quantified market penetration.

**Founders, team, and intellectual property.** Filter Art's official About page identifies Amihai Kotler as founder and CTO and Moran Rosenberg as CEO, alongside roles spanning logistics and purchasing, sales and marketing, Latin American business development, process engineering, production, and product engineering. This published team composition is consistent with a small industrial company that must combine application engineering, manufacturing, and field sales. Public bios do not provide enough detail to assess prior company-building, filtration research, or scaled international service experience, so those backgrounds remain diligence questions. Patent records identify Filter Art Ltd as the original assignee of European patent EP3600599, titled “Water filter,” with a 2017 priority date and a grant publication in 2022; Google Patents reports its status as active, while cautioning that its legal-status data are not a legal conclusion. This is evidence of a granted patent family member, not proof that every commercial feature is protected, enforceable in every target market, or difficult to design around. The patent claims and freedom-to-operate position warrant specialist review.

**Competitive dynamics and potential edge.** Filter Art competes in a mature filtration market where customer choice weighs filtration degree, solids capacity, water loss during flushing, continuous-flow behavior, maintenance, installation fit, and lifecycle cost. Israeli suppliers such as Amiad and Yamit offer automatic or self-cleaning screen filtration; ODIS Filtering sells agricultural, municipal, and industrial filtration systems; international providers such as AZUD offer irrigation filtration; and cartridge, disc, media, and manual screen filters remain substitutes. Filter Art's public differentiation is its combination of fine 7-micron filtration, large screen area, automated cleaning, modular flow sizing, and application-specific NEMATIC screens. These features could be useful where a customer needs fine physical separation with low interruption and limited consumable waste. The commercial advantage is not established by a patent alone: comparative trials should measure capture efficiency by organism or particle size, head loss, flush-water consumption under real solids loads, maintenance intervals, energy use, and total cost against incumbent systems. Competitors with broader product lines, established distributor networks, and service coverage may be better positioned for large infrastructure procurement.

**Resilience and dual-use relevance.** Reliable water treatment underpins food production, municipal service, industrial continuity, and water reuse, making filtration equipment a relevant enabling technology for resilience planning. A robust filter can help maintain irrigation or protect downstream treatment assets when water quality fluctuates, and locally supported equipment can reduce dependence on disposable cartridges or frequent manual intervention. Those are civil critical-infrastructure benefits with plausible relevance to emergency agriculture, remote facilities, and continuity of water operations. The public evidence reviewed does not establish military customers, defense contracts, deployment in operational theaters, cyber-secure remote controls, or qualification for drinking-water pathogen removal. The dual-use case is therefore infrastructure adjacency: the same commercially deployed filtration function can contribute to water and food-system resilience in stressed settings, but no defense-specific capability or procurement should be inferred.

**Stage, trajectory, and diligence.** Founded in 2014 and presenting marketed product families, a multi-role team, an international distributor-facing web presence, and a claimed installed base, Filter Art is best treated as a mature small industrial startup or specialist supplier rather than a pre-product venture. Its next growth path could come from repeatable wins in greenhouse and irrigation systems, industrial pretreatment and reuse, and municipal applications, especially if it can document payback from reduced cartridge consumption, water loss, or maintenance visits. The limiting uncertainties are substantial: current headcount and revenue, funding and ownership, unit economics, customer concentration, audited installation count, referenceable operating sites, warranty and service footprint, product certifications, and performance under difficult raw-water conditions are not publicly established. Technical diligence should test screen integrity and capture performance against named organisms, verify flow and flush claims across solids loads, and inspect the interface with any required disinfection stage. Commercial diligence should establish who specifies and installs the unit, how long pilots convert, how much customization each sale needs, and whether the company can provide timely service outside Israel. These gaps counsel moderate scores despite the appealing water-security fit."""
