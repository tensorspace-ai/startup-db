strategic_value = "The strategic asset is an integrated Israeli-developed autonomous aerial operating capability combining the Optimus drone-in-a-box platform, docking and payload systems, mission software, and the Iron Drone Raider counter-UAS product. The product portfolio spans recurring commercial data capture and facility security through to government and defense use. Ondas' SEC filings document the acquisition of Iron Drone assets into Airobotics, system engineering for GNSS-denied environments, and an expanding order pipeline; the 2025 and 2026 purchase-order announcements provide current evidence of direct defense and border-security demand. Commercial buyers may value persistent monitoring and remote operations at industrial sites, while government and defense users may value rapid autonomous surveillance and interception. This mix can create strategic value, but the record does not disclose the classified or operational detail needed to independently assess mission performance, nor enough financial detail to assess sustainable returns."
