investment_rationale = """Arbell merits technical diligence because it has a coherent materials thesis, a patent family around quantum-dot superlattices, a new low-E transparent structure filing, a Northwestern research collaboration, and access to utility stakeholders through Free Electrons. Those are evidence of technical activity and market discovery, not proof of a fundable product. The main gating evidence is independently measured cell and module performance, durability, coating yield, costed manufacturing, and a first application with a signed pilot or buyer-backed specification. Funding history is partly reconstructed from databases; an Automobility pipeline article also described a Series A target that has not been confirmed as closed. The legacy investible flag should be read as an internal tracking signal, not a recommendation."""
strategic_value = """If validated, conformable solar could add generation to glass, curved structures, and surfaces that standard rigid modules cannot easily serve. The strategic upside is incremental distributed generation and lower installation constraints for selected buildings, mobility, and remote infrastructure. The value remains option-like until Arbell demonstrates durable output, repeatable manufacturing, and a route to procurement; space and defense adjacency is not yet a delivered capability."""
