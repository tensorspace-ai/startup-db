name = "Anan"
description = "Anan Data Centers (Anan / ענן פתרונות דאטה בע״מ) develops and operates high-density colocation facilities in Israel for cloud, AI, enterprise, and public-sector workloads. Its current site describes two facilities in Afula and Tzora, 101.5 MW of secured IT load, and a 2027 deployment timeline; company claims and customer commitments remain distinct from commissioned, operating capacity."

detailed_description = """Anan Data Centers, also branded Anan and registered in Hebrew as ענן פתרונות דאטה בע״מ according to a commercial company directory, is a privately held Israeli data center developer and colocation operator. Public materials describe a business focused on building powered, cooled, secure facilities and leasing capacity to cloud providers, enterprises, IT services businesses, and public-sector organizations. The model is capital intensive: the company must secure land, permits, grid capacity, financing, and long-term anchor tenants before a facility can generate recurring colocation revenue. Its current website identifies sites in Afula and Tzora and claims 101.5 MW of IT load secured, rack density above 250 kW, and a deployment timeline in 2027. Those figures are company statements about secured or planned capacity, not independently verified live capacity.

The Afula site has become the company’s clearest commercial proof point. Globes reported in April 2026 that US neocloud provider Crusoe initially leased about 40 MW in the facility then being built. In June, Globes reported that Crusoe expanded the agreement by another 40 MW, bringing the reported Anan commitment to 80 MW at Afula; a separate cloud customer was also discussed in later coverage, though its identity and commercial terms were not provided. The press has attached large numbers to the Crusoe project, including an estimate that the customer’s decade-long spending across GPUs, rent, and electricity could reach roughly $3 billion. That estimate combines several categories and is neither Anan revenue nor a disclosed contract value. The crucial operating question is when power, shell, cooling, and customer equipment will be commissioned and accepted. Until those steps occur, headline capacity and leasing announcements do not establish utilization, uptime, or cash generation.

Anan is also developing a Tzora facility near Beit Shemesh. Its website describes an underground project and publishes design claims including 32 MVA, N+N electrical redundancy, 2N water-cooled chillers, biometric access, and a planned PUE of 1.4. A 2024 Globes financing story reported an initial planned 16 MW IT phase within a 32 MW overall design, while the company’s current project page uses MVA terminology and describes a different floor-area figure. Capacity labels across these sources are not directly comparable: MVA is apparent power and MW IT is usable server load. The design claims should therefore be validated against the electrical one-line diagram, utility delivery agreement, cooling design, and independent commissioning results rather than compared as interchangeable headline figures.

The ownership and financing history shows substantial sponsor commitment as well as opacity. Reporting identifies founder-related vehicles PAI, associated with Omer Adam and his family; Europe-Israel, associated with Maor and Snir Malul; and Swiss Lian Group, associated with Nessim-Sariel Gaon. In 2025, Battery Global Advisors was reported to have bought a 20% stake at a NIS 1 billion company valuation. The available coverage does not clarify how much of that transaction funded Anan directly versus paid selling shareholders. In February 2026, Calcalist described a nonbinding Leumi Partners proposal of $75 million for 20% at a $300 million pre-money valuation. June Globes coverage then said an investment agreement had been signed and described the initial Leumi investment as $100 million for 20% at a $400 million valuation, while reporting that the company’s value had later risen to $1.6 billion following customer demand. These are media reports at different stages and on different valuation dates; the final amount, security, ownership impact, and closing documentation need confirmation. They should not be collapsed into one fully reconciled round or used to infer current founder percentages. Project borrowing is separate: reporting gives conflicting figures of NIS 410 million and NIS 420 million for a Mizrahi Tefahot loan, while also describing founder equity contributions whose scope and timing are not fully reconciled.

Anan’s founding group brings real estate development relationships and, through Gaon’s broader network, prior data center development exposure. The company’s current website presents an operating leadership team that includes Jonathan Steinberg as CEO and several finance, project, energy, and corporate development executives. The same page also labels Maor Malul as CEO in the founder section, so the current reporting structure is unclear. Steinberg’s biography describes experience managing data center, cloud, network, and managed IT businesses; public materials provide limited independently verifiable detail on the rest of the operating team. This matters because development execution requires dedicated leadership across utility coordination, procurement, construction, commissioning, service operations, and customer acceptance, not only real estate access or financing.

The competitive set includes local developer-operators such as Mega Data Centers and Shonfeld Engineering/SDS, established data center and colocation incumbents, and global providers such as Equinix and Digital Realty that can serve multinational customers through broader networks. Anan’s potential differentiation is its local land and power position, high-density and liquid-cooling design ambitions, protected underground Tzora facility, and customer-linked development path at Afula. A signed hyperscaler lease can improve financing credibility and reduce speculative capacity risk. These advantages remain conditional on delivery: contracted megawatts are valuable only if grid capacity is available on time, construction costs stay within plan, and the facility meets the tenant’s technical acceptance requirements. Broader incumbents can counter with operating track records, global interconnection, procurement scale, and established service-level processes.

The technical opportunity is in infrastructure engineering rather than a proprietary AI software stack. High-density GPU deployments raise the importance of power distribution, thermal management, liquid cooling, network pathways, redundancy, and rapid phased buildout. Anan’s public materials claim support for rack densities over 250 kW and up to fully liquid-cooled clusters. These claims should be assessed through reference designs, rack-level power budgets, heat rejection assumptions, supply-chain availability, and proof of commissioned systems. No Anan-assigned patent portfolio or independent proprietary technology was identified in the public search. The likely moat is therefore a combination of secured power, site delivery, permitting, customer contracts, capital access, and operating quality. These are meaningful but execution-sensitive advantages that can erode if projects are delayed or larger competitors secure the same scarce grid resources.

Commercial and financial diligence should focus on the quality of contracted demand and the path to service commencement. Public coverage suggests Crusoe’s commitment is a lease of space and associated infrastructure capacity, while broader customer spending estimates include customer-owned or third-party GPU purchases and utility costs. Investors should obtain the executed lease, capacity ramp schedule, pricing and escalation terms, power pass-through arrangements, termination rights, minimum commitments, security obligations, and cross-default provisions. They should also examine the second customer referenced in reporting, facility-level construction budgets, committed versus conditional grid megawatts, debt covenants, contingency reserves, and the relationship between project entities and the operating company. Anan has not published audited revenue, ARR, EBITDA, cash, burn, or runway data, so valuation reporting cannot be evaluated against disclosed operating financials.

The dual-use case is best framed as infrastructure resilience and secure data residency. Reliable high-density compute can support civilian cloud, AI training and inference, regulated workloads, public-sector processing, and potentially security-sensitive users. The company markets defense-grade security and underground construction, but the research found no named government or defense customer, procurement award, or independently verified security certification. Defense relevance is therefore plausible from the facility characteristics and local sovereignty positioning, not evidence of defense deployment. For commercial customers, the same claims require specific controls: physical access separation, cyber incident response, tenant isolation, backup and recovery, supply-chain assurance, and audited service levels.

Overall, Anan has advanced from a sponsor-backed development concept to a company with reported third-party investment, bank project debt, construction activity, and a large named cloud tenant. That is meaningful traction for a young infrastructure platform, but it does not yet settle whether planned capacity can be delivered on schedule and converted into durable operating cash flow. The most important near-term milestones are delivery and customer acceptance of the first Afula capacity, commissioning of Tzora, proof of power availability, and transparent final terms for outside capital. Strategic relevance is high because trusted local compute is increasingly important to cloud, enterprise, and public-sector resilience. Investment risk remains elevated by construction and energy constraints, the limited public financial record, concentration around a few large customers, and unresolved ownership and financing details. """

