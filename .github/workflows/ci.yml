name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.32'
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/check_public_tree.py
      - run: uv sync --locked
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build --out-dir python-dist
      - run: uv run startup-agent discover --dry-run > /tmp/discover.json
